<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A responsive swarm of lines chases an evenly spaced field of targets, orbiting, spiralling and wandering after them. Half the swarm draws sharp; the other half survives only as the glow it leaves behind."
    />
    <title>A Record of Pursuit · HyperGal</title>
    <style>
      :root { color-scheme: dark; --focus: oklch(0.85 0.16 95); }
      html, body {
        height: 100%; margin: 0; padding: 0;
        background: #000; color: #fff;
        overflow: hidden;
      }
      main { height: 100vh; height: 100dvh; }

      /* Every layer fills the window. The piece is sized to the viewport rather
         than letterboxed into a square, so the grid spans whatever shape the
         browser is. The ground colour is set on the container once the hash has
         picked a palette. */
      #canvas, #layer01, #layer02, #layer03, #layer04 {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
      }

      /* The working layers stay hidden — except layer04, which is shown behind
         the composite and blurred. That one CSS line is the whole glow: the
         composite canvas draws the first half of the swarm sharp, layer04
         carries the second half and survives only as light. */
      #layer01, #layer02, #layer03 { display: none; }
      /* The glow. 20px at full strength swamped the drawn lines; this keeps the
         halo without letting it take over the picture. */
      #layer04 { display: block; filter: blur(13px) opacity(0.7); }

      #canvas { cursor: pointer; touch-action: manipulation; }
      #canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -6px; }

      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>

    <script>
      // A Record of Pursuit — Eric Ishii Eckhardt, 2022, for HyperMedia Club.
      //
      // fxhash is gone. This replaces its boilerplate snippet with an equivalent
      // that keeps the same base58 hash format and sfc32 generator, so an
      // original "oo…" hash passed as ?hash= reproduces that exact iteration —
      // including the thirty-six hashes the piece maps to fixed palettes in its
      // own hashTable.
      (() => {
        'use strict';
        const ALPHABET = '123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';

        function sfc32(a, b, c, d) {
          return () => {
            a |= 0; b |= 0; c |= 0; d |= 0;
            var t = (a + b | 0) + d | 0;
            d = d + 1 | 0;
            a = b ^ b >>> 9;
            b = c + (c << 3) | 0;
            c = c << 21 | c >>> 11;
            c = c + t | 0;
            return (t >>> 0) / 4294967296;
          };
        }

        const newHash = () => 'oo' + Array(49).fill(0)
          .map(() => ALPHABET[(Math.random() * ALPHABET.length) | 0]).join('');

        function seedFrom(hash) {
          const b58dec = (s) => [...s].reduce(
            (p, c) => p * ALPHABET.length + ALPHABET.indexOf(c) | 0, 0
          );
          const parts = hash.slice(2).match(
            new RegExp('.{' + ((hash.length / 4) | 0) + '}', 'g')
          );
          if (!parts || parts.length < 4) return null;
          return sfc32(...parts.slice(0, 4).map(b58dec));
        }

        const search = new URLSearchParams(location.search);
        window.debugMode = search.has('debug');
        window.fxhash = search.get('hash') || newHash();
        window.fxrand = seedFrom(window.fxhash) || seedFrom((window.fxhash = newHash()));
        window.newHash = newHash;
        window.reseed = () => {
          window.fxhash = newHash();
          window.fxrand = seedFrom(window.fxhash);
        };

        // The platform's preview trigger has nothing to talk to any more.
        window.fxpreview = () => {};
        window.isFxpreview = false;
      })();
    </script>

    <script src="palette.js"></script>
    <script src="adapted.vector.js"></script>
    <script src="adapted.particles.js"></script>
    <script src="adapted.library.js"></script>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <p class="instructions" id="instructions">
      Lines chase their targets continuously, leaving a record of the pursuit.
      Click or tap for a new iteration, or press R.
    </p>

    <script>
      // Stands in for the webpack entry: builds the container and the five
      // canvases the sketch expects, then starts it.
      (() => {
        'use strict';

        const container = document.createElement('main');
        container.id = 'HMCmain';

        for (const id of ['layer01', 'layer02', 'layer03', 'layer04', 'canvas']) {
          const c = document.createElement('canvas');
          c.id = id;
          container.appendChild(c);
        }
        document.body.prepend(container);

        // Back the layers at the display's pixel density, capped so a very
        // dense screen does not ask for an unreasonable amount of canvas.
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        function sizeLayers() {
          const w = Math.max(320, Math.round(window.innerWidth * dpr));
          const h = Math.max(320, Math.round(window.innerHeight * dpr));
          for (const c of container.querySelectorAll('canvas')) {
            c.width = w;
            c.height = h;
          }
          return [w, h];
        }
        sizeLayers();

        const composite = document.getElementById('canvas');
        composite.setAttribute('tabindex', '0');
        composite.setAttribute('aria-describedby', 'instructions');

        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        let timer = init();
        layoutTargets(WIDTH, HEIGHT);
        initParticleSystem();

        // Resizing re-sizes every layer, which clears them, so the grid is laid
        // out again against the new shape and the swarm re-enters.
        let resizeTimer = 0;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            const [w, h] = sizeLayers();
            WIDTH = w;
            HEIGHT = h;
            maxW = w;
            maxH = h;
            layoutTargets(w, h);
            initParticleSystem();
            describe();
            if (reduced.matches) settle();
          }, 180);
        }, { passive: true });
        describe();

        // Reduced motion: run the pursuit forward without animating, then stop
        // on the record it has made by then.
        if (reduced.matches) settle();

        function settle() {
          clearInterval(timer);
          timer = 0;
          for (let i = 0; i < 900; i++) draw();
        }

        function describe() {
          composite.setAttribute(
            'aria-label',
            'A Record of Pursuit: ' + systemSize + ' ' + titleParts.lineColor +
            ' lines chase ' + targetOrder.length + ' targets across a grid with ' +
            gridCols + ' columns and ' + gridRows + ' rows on a ' +
            titleParts.background + ' field.'
          );
          window.$fxhashFeatures = {
            'Iteration Title': titleParts.title,
            'Grid': gridCols + 'x' + gridRows,
            'Targets': targetOrder.length,
            'Background Color': titleParts.background,
            'Line Colors': titleParts.lineColor,
            'Orbiting Lines': particleCount.type.orbit,
            'Spiraling Lines': particleCount.type.spiral,
            'Wandering Lines': particleCount.type.wander,
            'Hairline Lines': particleCount.thickness.hairline,
            'Thin Lines': particleCount.thickness.thin,
            'Medium Lines': particleCount.thickness.medium,
            'Thick Lines': particleCount.thickness.thick
          };
          if (window.debugMode) console.log(window.fxhash, window.$fxhashFeatures);
        }

        function newIteration() {
          // layer02 is never cleared during normal play — it is the accumulated
          // record that layer04 blurs into the glow. A new iteration should not
          // fly in over the last one's marks.
          if (typeof layer02 !== 'undefined') layer02.clearRect(0, 0, WIDTH, HEIGHT);
          if (typeof layer04 !== 'undefined') layer04.clearRect(0, 0, WIDTH, HEIGHT);

          window.reseed();
          particleCount = { type: { orbit: 0, wander: 0, spiral: 0 },
                            thickness: { hairline: 0, thin: 0, medium: 0, thick: 0 } };
          selectPalette();
          initParticleSystem();
          describe();
          if (reduced.matches) {
            for (let i = 0; i < 900; i++) draw();
          } else if (!timer) {
            timer = init();
          }
        }

        composite.addEventListener('click', newIteration);
        composite.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (key === 'r' || key === ' ' || key === 'enter') {
            event.preventDefault();
            newIteration();
          }
        });
      })();
    </script>
  </body>
</html>
