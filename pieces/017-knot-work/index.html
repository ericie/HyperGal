<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knot Work · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #e9ddc6;
        --ink: #302010;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--paper);
        cursor: crosshair;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -8px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Knot Work: an edge-to-edge field of continuous dark brown Celtic knot lines on aged paper, with long traced strands and alternating over-under crossings."
    ></canvas>

    <script>
      (() => {
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const params = new URLSearchParams(location.search);
        const TAU = Math.PI * 2;
        const EDGES = ['n', 'e', 's', 'w'];
        const OPPOSITE = { n: 's', e: 'w', s: 'n', w: 'e' };
        const COLORS = {
          paper: '#e9ddc6',
          paperHot: '#f8f0df',
          paperCool: '#d4c3a5',
          ink: '#302010',
          inkSoft: 'rgba(48, 32, 16, 0.28)',
          inkGhost: 'rgba(98, 54, 28, 0.14)',
          warmLine: 'rgba(153, 80, 44, 0.15)',
          fiber: 'rgba(71, 49, 28, 0.13)',
          paleFiber: 'rgba(255, 251, 238, 0.24)',
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = params.get('seed') || randomSeed();
        let scene = null;

        resize();
        addEventListener('resize', resize, { passive: true });
        canvas.addEventListener('pointerdown', reseed);
        canvas.addEventListener('keydown', onKeyDown);

        function randomSeed() {
          return Math.floor(Math.random() * 0xffffffff).toString(36);
        }

        function xmur3(str) {
          let h = 1779033703 ^ str.length;
          for (let i = 0; i < str.length; i += 1) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return function nextHash() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return function nextRandom() {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randomFor(label) {
          return mulberry32(xmur3(`${seed}:${label}`)());
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function rand(random, min, max) {
          return min + random() * (max - min);
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          compose();
        }

        function reseed() {
          seed = randomSeed();
          history.replaceState(null, '', `${location.pathname}?seed=${encodeURIComponent(seed)}`);
          compose();
        }

        function onKeyDown(event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          reseed();
        }

        function compose() {
          scene = makeScene();
          render();
        }

        function makeScene() {
          const random = randomFor(`${Math.round(width / 20)}x${Math.round(height / 20)}`);
          const minSide = Math.min(width, height);
          const cell = clamp(minSide * (width < 620 ? 0.29 : 0.145), 108, 142);
          const ribbon = clamp(cell * 0.22, 21, 29);
          const inner = Math.max(9, ribbon * 0.45);
          const margin = cell * 2.2;
          const left = -margin;
          const top = -margin;
          const cols = Math.ceil((width + margin * 2) / cell);
          const rows = Math.ceil((height + margin * 2) / cell);
          const salt = Math.floor(rand(random, 0, 900));
          const tiles = makeTiles(rows, cols, salt);
          const warp = makeWarp(random, cell);
          const traced = traceTiles(tiles, rows, cols, cell, left, top, salt);
          return { cell, ribbon, inner, warp, strands: traced.strands, crossings: traced.crossings };
        }

        function makeTiles(rows, cols, salt) {
          const tiles = [];
          for (let row = 0; row < rows; row += 1) {
            const line = [];
            for (let col = 0; col < cols; col += 1) {
              const n = noise(col, row, salt);
              let type = n < 0.34 ? 'cross' : n < 0.67 ? 'a' : 'b';
              if ((row * 3 + col * 5 + salt) % 13 === 0) type = 'cross';
              line.push(type);
            }
            tiles.push(line);
          }
          return tiles;
        }

        function traceTiles(tiles, rows, cols, cell, left, top, salt) {
          const visited = new Set();
          const strands = [];
          const crossings = [];

          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < cols; col += 1) {
              for (const edge of EDGES) {
                const start = halfKey(row, col, edge);
                if (visited.has(start)) continue;
                const path = traceFrom(row, col, edge, tiles, rows, cols, cell, left, top, visited);
                if (path.commands.length > 1) strands.push(path.commands);
              }

              if (tiles[row][col] === 'cross') {
                const horizontalOver = (row + col + salt) % 2 === 0;
                const h = connectorPath(row, col, 'w', 'e', tiles[row][col], cell, left, top, 0.28);
                const v = connectorPath(row, col, 'n', 's', tiles[row][col], cell, left, top, 0.28);
                crossings.push({
                  under: horizontalOver ? v : h,
                  over: horizontalOver ? h : v,
                });
              }
            }
          }

          return { strands, crossings };
        }

        function traceFrom(row, col, edge, tiles, rows, cols, cell, left, top, visited) {
          const commands = [];
          let current = { row, col, edge };
          let first = true;

          for (let guard = 0; guard < rows * cols * 4; guard += 1) {
            const id = halfKey(current.row, current.col, current.edge);
            if (visited.has(id)) break;
            visited.add(id);

            const type = tiles[current.row]?.[current.col];
            if (!type) break;
            const nextEdge = pairedEdge(type, current.edge);
            visited.add(halfKey(current.row, current.col, nextEdge));

            const segment = connectorPath(current.row, current.col, current.edge, nextEdge, type, cell, left, top, 1);
            if (first) {
              commands.push(segment[0]);
              first = false;
            }
            commands.push(segment[1]);

            const neighbor = neighborHalf(current.row, current.col, nextEdge, rows, cols);
            if (!neighbor) break;
            current = neighbor;
          }

          return { commands };
        }

        function pairedEdge(type, edge) {
          if (type === 'cross') {
            if (edge === 'w') return 'e';
            if (edge === 'e') return 'w';
            if (edge === 'n') return 's';
            return 'n';
          }
          if (type === 'a') {
            if (edge === 'w') return 'n';
            if (edge === 'n') return 'w';
            if (edge === 'e') return 's';
            return 'e';
          }
          if (edge === 'w') return 's';
          if (edge === 's') return 'w';
          if (edge === 'e') return 'n';
          return 'e';
        }

        function neighborHalf(row, col, edge, rows, cols) {
          if (edge === 'n') row -= 1;
          else if (edge === 'e') col += 1;
          else if (edge === 's') row += 1;
          else col -= 1;
          if (row < 0 || col < 0 || row >= rows || col >= cols) return null;
          return { row, col, edge: OPPOSITE[edge] };
        }

        function connectorPath(row, col, from, to, type, cell, left, top, span) {
          const x = left + col * cell;
          const y = top + row * cell;
          const p0 = edgePoint(x, y, cell, from, span, false);
          const p3 = edgePoint(x, y, cell, to, span, true);
          const c = { x: x + cell * 0.5, y: y + cell * 0.5 };
          let c1;
          let c2;

          if (type === 'cross') {
            const bow = cell * 0.035 * (from === 'n' || from === 's' ? 1 : -1);
            c1 = toward(p0, p3, 0.36, bow);
            c2 = toward(p3, p0, 0.36, -bow);
          } else {
            c1 = pullTowardCenter(p0, c, cell * 0.74);
            c2 = pullTowardCenter(p3, c, cell * 0.74);
          }

          return [
            { op: 'M', x: p0.x, y: p0.y },
            { op: 'C', c1x: c1.x, c1y: c1.y, c2x: c2.x, c2y: c2.y, x: p3.x, y: p3.y },
          ];
        }

        function edgePoint(x, y, cell, edge, span, end) {
          const inset = (1 - span) * cell * 0.5;
          if (edge === 'n') return { x: x + cell * 0.5, y: y + (end ? inset : 0) };
          if (edge === 'e') return { x: x + cell - (end ? inset : 0), y: y + cell * 0.5 };
          if (edge === 's') return { x: x + cell * 0.5, y: y + cell - (end ? inset : 0) };
          return { x: x + (end ? inset : 0), y: y + cell * 0.5 };
        }

        function pullTowardCenter(point, center, amount) {
          const dx = center.x - point.x;
          const dy = center.y - point.y;
          const len = Math.hypot(dx, dy) || 1;
          return { x: point.x + (dx / len) * amount, y: point.y + (dy / len) * amount };
        }

        function toward(a, b, t, bow) {
          const x = a.x + (b.x - a.x) * t;
          const y = a.y + (b.y - a.y) * t;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy) || 1;
          return { x: x + (-dy / len) * bow, y: y + (dx / len) * bow };
        }

        function makeWarp(random, cell) {
          return {
            amp: cell * rand(random, 0.04, 0.075),
            ax: rand(random, 0.006, 0.011),
            ay: rand(random, 0.006, 0.011),
            bx: rand(random, 0.003, 0.007),
            by: rand(random, 0.003, 0.007),
            p1: rand(random, 0, TAU),
            p2: rand(random, 0, TAU),
            p3: rand(random, 0, TAU),
          };
        }

        function halfKey(row, col, edge) {
          return `${row}:${col}:${edge}`;
        }

        function noise(col, row, salt) {
          let n = (col + 101) * 374761393 + (row + 197) * 668265263 + salt * 1442695041;
          n = Math.imul(n ^ (n >>> 13), 1274126177);
          return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
        }

        function render() {
          drawPaper();
          for (const path of scene.strands) strokeCommands(path, scene.ribbon + 6, COLORS.inkGhost, 2, 2.5);
          for (const path of scene.strands) strokeRibbon(path);
          for (const crossing of scene.crossings) drawCrossing(crossing);
          drawPaperWear();
        }

        function drawPaper() {
          const random = randomFor(`paper:${Math.round(width / 40)}:${Math.round(height / 40)}`);
          ctx.fillStyle = COLORS.paper;
          ctx.fillRect(0, 0, width, height);

          const wash = ctx.createLinearGradient(0, 0, width, height);
          wash.addColorStop(0, COLORS.paperHot);
          wash.addColorStop(0.56, 'rgba(233, 221, 198, 0)');
          wash.addColorStop(1, COLORS.paperCool);
          ctx.globalAlpha = 0.27;
          ctx.fillStyle = wash;
          ctx.fillRect(0, 0, width, height);
          ctx.globalAlpha = 1;

          const fibers = Math.ceil((width * height) / 2850);
          for (let i = 0; i < fibers; i += 1) {
            const x = rand(random, -20, width + 20);
            const y = rand(random, -20, height + 20);
            const len = rand(random, 5, 42);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rand(random, -0.22, 0.22));
            ctx.fillStyle = random() > 0.42 ? COLORS.fiber : COLORS.paleFiber;
            ctx.globalAlpha = rand(random, 0.14, 0.48);
            ctx.fillRect(-len * 0.5, -0.45, len, rand(random, 0.5, 1.25));
            ctx.restore();
          }
        }

        function strokeRibbon(commands) {
          strokeCommands(commands, scene.ribbon + 1.2, COLORS.inkSoft);
          strokeCommands(commands, scene.ribbon, COLORS.ink);
          strokeCommands(commands, scene.inner, COLORS.paper);
          strokeCommands(commands, Math.max(1.1, scene.inner * 0.13), COLORS.warmLine);
        }

        function drawCrossing(crossing) {
          strokeCommands(crossing.under, scene.ribbon + 1, COLORS.paper, 0, 0, 'butt');
          strokeRibbon(crossing.over);
        }

        function drawPaperWear() {
          const random = randomFor(`wear:${Math.round(width)}:${Math.round(height)}`);
          const flecks = Math.ceil((width * height) / 3600);
          ctx.save();
          for (let i = 0; i < flecks; i += 1) {
            const x = rand(random, 0, width);
            const y = rand(random, 0, height);
            const r = rand(random, 0.35, 2.4);
            ctx.beginPath();
            ctx.arc(x, y, r, 0, TAU);
            ctx.fillStyle = random() > 0.7 ? COLORS.paperHot : COLORS.paper;
            ctx.globalAlpha = rand(random, 0.13, 0.5);
            ctx.fill();
          }

          for (let i = 0; i < 10; i += 1) {
            ctx.beginPath();
            const y = rand(random, 0, height);
            ctx.moveTo(rand(random, -40, 20), y);
            ctx.bezierCurveTo(
              width * rand(random, 0.18, 0.35),
              y + rand(random, -20, 20),
              width * rand(random, 0.6, 0.84),
              y + rand(random, -28, 28),
              width + rand(random, -20, 40),
              y + rand(random, -20, 20)
            );
            ctx.strokeStyle = random() > 0.48 ? COLORS.fiber : COLORS.paleFiber;
            ctx.globalAlpha = rand(random, 0.07, 0.17);
            ctx.lineWidth = rand(random, 0.8, 2.2);
            ctx.stroke();
          }
          ctx.restore();
          ctx.globalAlpha = 1;
        }

        function strokeCommands(commands, lineWidth, style, offsetX = 0, offsetY = 0, cap = 'round') {
          if (commands.length === 0) return;
          ctx.save();
          ctx.translate(offsetX, offsetY);
          ctx.lineCap = cap;
          ctx.beginPath();
          for (const cmd of commands) {
            if (cmd.op === 'M') {
              const p = warpPoint(cmd.x, cmd.y);
              ctx.moveTo(p.x, p.y);
            } else if (cmd.op === 'C') {
              const c1 = warpPoint(cmd.c1x, cmd.c1y);
              const c2 = warpPoint(cmd.c2x, cmd.c2y);
              const p = warpPoint(cmd.x, cmd.y);
              ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p.x, p.y);
            }
          }
          ctx.lineWidth = lineWidth;
          ctx.strokeStyle = style;
          ctx.stroke();
          ctx.restore();
        }

        function warpPoint(x, y) {
          const w = scene.warp;
          return {
            x: x + Math.sin(y * w.ax + w.p1) * w.amp + Math.sin((x + y) * w.bx + w.p2) * w.amp * 0.34,
            y: y + Math.sin(x * w.ay + w.p2) * w.amp + Math.cos((x - y) * w.by + w.p3) * w.amp * 0.3,
          };
        }
      })();
    </script>
  </body>
</html>
