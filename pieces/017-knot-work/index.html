<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knot Work · Hypermedia Club</title>
    <link rel="stylesheet" href="controls.css" />
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="An interlaced knot with rounded loops, parallel cords, and woven crossings. Activate to generate a new knot; use the floating controls to edit the drawing."
    ></canvas>

    <details class="controls" id="controls" open>
      <summary aria-controls="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14M7 2v6M13 7v6M8 12v6"/></svg>Controls<svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></summary>
      <span class="drag-handle" title="Drag to move controls" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5 3v2m6-2v2M5 7v2m6-2v2M5 11v2m6-2v2"/></svg></span>
      <form id="settings">
        <fieldset><legend>Edge padding</legend><div class="padding-grid">
          <label>Top<span class="number"><input aria-label="Top padding" name="padTop" type="number" min="0" max="40" step="1" value="5" />%</span></label>
          <label>Right<span class="number"><input aria-label="Right padding" name="padRight" type="number" min="0" max="40" step="1" value="5" />%</span></label>
          <label>Bottom<span class="number"><input aria-label="Bottom padding" name="padBottom" type="number" min="0" max="40" step="1" value="5" />%</span></label>
          <label>Left<span class="number"><input aria-label="Left padding" name="padLeft" type="number" min="0" max="40" step="1" value="5" />%</span></label>
        </div></fieldset>
        <fieldset><legend>Drawing</legend>
          <div class="line-options" role="radiogroup" aria-label="Line count">
            <label><input name="lines" type="radio" value="1" /><span>Single</span></label>
            <label><input name="lines" type="radio" value="2" checked /><span>Double</span></label>
            <label><input name="lines" type="radio" value="3" /><span>Triple</span></label>
          </div>
          <label class="field" for="density">Density<output for="density" id="density-value">100%</output><input id="density" name="density" type="range" min="60" max="160" value="100" /></label>
          <label class="field" for="weight">Line weight<output for="weight" id="weight-value">52%</output><input id="weight" name="weight" type="range" min="20" max="70" value="52" /></label>
          <label class="field" for="gap">Crossing gap<output for="gap" id="gap-value">10%</output><input id="gap" name="gap" type="range" min="2" max="22" value="10" /></label>
          <label class="field" for="warp">Irregularity<output for="warp" id="warp-value">18%</output><input id="warp" name="warp" type="range" min="0" max="100" value="18" /></label>
        </fieldset>
        <fieldset><legend>Color</legend>
          <label class="color-row" data-color="color1">Line 1<input name="color1" type="color" value="#33260f" /></label>
          <label class="color-row" data-color="color2">Line 2<input name="color2" type="color" value="#33260f" /></label>
          <label class="color-row" data-color="color3">Line 3<input name="color3" type="color" value="#33260f" /></label>
          <label class="color-row" data-color="paper">Paper<input name="paper" type="color" value="#e9ddc6" /></label>
          <label class="check-row"><input name="gradient" type="checkbox" />Gradient along the cord</label>
          <div class="gradient-fields" hidden>
            <label class="color-row">Blend to<input name="gradientEnd" type="color" value="#b84a36" /></label>
            <label class="field" for="cycles">Color cycles<output for="cycles" id="cycles-value">1</output><input id="cycles" name="cycles" type="range" min="1" max="6" value="1" /></label>
          </div>
        </fieldset>
        <div class="actions"><button type="button" id="new-knot">New knot</button><button type="reset">Reset settings</button></div>
      </form>
    </details>

    <script src="knot.js"></script>
  </body>
</html>
