<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Silver arcs, curled tendrils and dotted fields gather across charcoal paper, leaving islands of negative space.">
  <title>Negative Fill · HyperGal</title>
  <style>
    :root { color-scheme: dark; background: #242526; color: #e7e7df; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
    canvas:focus-visible { outline: 2px solid #e7e7df; outline-offset: -6px; }
    .instructions { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    noscript { position: fixed; inset: 2rem; font: 1rem/1.5 Georgia, serif; }
    ::selection { background: #535454; color: #e7e7df; }
  </style>
</head>
<body>
  <canvas id="drawing" tabindex="0" role="button" aria-label="Negative Fill. Click or press Enter to draw again." aria-describedby="instructions"></canvas>
  <p class="instructions" id="instructions">Several drawing points trace silver fans, spirals, dotted fields and solid patches on charcoal paper, leaving irregular open pockets. Click, Enter or R starts a new drawing. Space pauses or resumes. F finishes the drawing. S saves a PNG.</p>
  <noscript>Negative Fill needs JavaScript to draw.</noscript>
  <script src="negative-fill.js"></script>
</body>
</html>
