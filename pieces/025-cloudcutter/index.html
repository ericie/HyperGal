<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudcutter · HyperGal</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      const TAU = Math.PI * 2;

      const LINE = 'rgba(244,255,250,';
      const FIELD_T = .4;          // field threshold: the visible cloud edge
      const VIS = Math.sqrt(1 - Math.sqrt(.4));  // visible radius / kernel radius
      const BITE_S = 2.6;          // how hard one shot subtracts from the field
      const BITE_R = 6.4;          // one round takes a small chunk, nothing more
      const BULLET_SPEED = 680;
      const BULLET_RANGE = 330;    // the guns only reach a little way ahead
      const MAX_BULLETS = 26;
      const FIRE_CD = .045;        // held down, not squeezed
      const SHIP_ACCEL = 300;
      const SHIP_TURN = 3.4;
      const AIR_DRAG = 1.6;        // open sky: cruises near 190
      const CLOUD_DRAG = 6.4;      // buried in a body: down to a crawl
      const SHIP_R = 8;
      const REAM_CD = .1;          // the hull widens what the guns opened
      const MAX_SCALE = 1.7;
      const MIN_KEEP_AREA = 900;   // below this a lone cloud has been shot away
      const MIN_COMP_AREA = 2600;  // below this a severed piece is only vapor
      const TRAIL_MAX = 64;
      const MAX_WISPS = 240;

      let W = 0, H = 0, dpr = 1;
      let last = 0, raf = 0, now = 0, serial = 0;
      let clouds, bullets, wisps, streaks;
      let ship, cam, score, cuts, bored, playerControl, spawnCd, cloudTarget;
      let liveR = 0, killR = 0;
      const keys = new Set();

      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

      const normAngle = (a) => {
        a = (a + Math.PI) % TAU;
        if (a < 0) a += TAU;
        return a - Math.PI;
      };


      function resize() {
        cancelAnimationFrame(raf);
        dpr = 1;
        W = innerWidth;
        H = innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        reset();
      }

      function reset() {
        clouds = [];
        bullets = [];
        wisps = [];
        serial = 0;
        score = 0;
        cuts = 0;
        bored = 0;
        now = 0;
        spawnCd = 0;
        playerControl = false;
        // The sky is unbounded. Weather is kept stocked inside a ring around
        // the camera and forgotten once it falls well outside one.
        // The ring scales with the viewport, so the quota below stocks the
        // same amount of visible sky on a phone as on a wall.
        const viewR = Math.hypot(W, H) * .5;
        liveR = viewR * 1.55;
        killR = viewR * 2.4;
        cloudTarget = clamp(Math.round(7.2 * Math.PI * liveR * liveR / (W * H)), 12, 40);
        ship = {
          x: 0, y: 0,
          vx: 150, vy: 0,
          a: 0,
          roll: 0,
          turn: 0,
          thrusting: false,
          fireCd: 0,
          reamCd: 0,
          wander: rand(0, 40),
          inside: false,
          insideFor: 0,
          load: 0,
          buried: 0,
          trail: [],
        };
        cam = { x: 0, y: 0 };
        streaks = makeStreaks();
        seedClouds();
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      }

      // Drawn in screen space and dragged by a fraction of the pan, so the
      // haze behind the weather reads as further off than the weather is.
      function makeStreaks() {
        const n = clamp(Math.round(W * H / 24000), 20, 80);
        return Array.from({ length: n }, () => ({
          x: rand(-40, W + 40),
          y: rand(-40, H + 40),
          len: rand(10, 52),
          v: rand(14, 70),
          depth: rand(.22, .55),
          a: rand(.04, .12),
        }));
      }

      function sizeScale() {
        return clamp(Math.min(W, H) / 900, .55, 1.3);
      }

      function seedClouds() {
        for (let i = 0; i < cloudTarget; i++) {
          const a = rand(0, TAU);
          const d = Math.sqrt(Math.random()) * liveR;
          const cloud = newCloud(cam.x + Math.cos(a) * d, cam.y + Math.sin(a) * d);
          if (Math.hypot(cloud.x - ship.x, cloud.y - ship.y) < cloud.radius + 200) continue;
          clouds.push(cloud);
          buildCloudGeometry(cloud);
        }
      }

      function newCloud(x, y) {
        return makeCloud(x, y, rand(105, 215) * sizeScale());
      }

      // ---------- cloud bodies ----------

      function makeCloud(x, y, size) {
        const cloud = {
          id: ++serial,
          x, y,
          size,
          vx: -rand(9, 30) * (120 / (80 + size)),
          scale: 1,
          growTo: 1,
          growRate: 0,
          budAt: Infinity,
          puffs: makePuffs(size),
          bites: [],
          contours: [],
          detail: [],
          bounds: { minx: -size, miny: -size, maxx: size, maxy: size },
          radius: size,
          phase: rand(0, TAU),
          bob: rand(0, TAU),
          healRate: rand(.018, .06),
          cutCd: 0,
          flash: 0,
          dirty: true,
          nextBuild: 0,
        };
        updateBounds(cloud);
        return cloud;
      }

      // A cumulus: a row of shoulders along a flattish base with taller lobes
      // stacked above the middle. Sized by the visible radius of each lobe and
      // spaced so neighbouring lobes always overlap, which is what welds the
      // union together and what gives the silhouette its scallops.
      function makePuffs(size) {
        const lobes = [];
        const base = size * .5;
        // Shoulders along a level underside — cumulus sit on a flat bottom.
        // Each is stepped along by less than the two radii it spans, so the
        // row is always one connected chain and never sheds a loose circle.
        const n = 4 + ((Math.random() * 3) | 0);
        const radii = [];
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? .5 : i / (n - 1);
          const taper = 1 - Math.abs(t - .5) * rand(.3, .62);
          radii.push(size * (.12 + rand(.18, .3) * taper));
        }
        let x = 0;
        for (let i = 0; i < n; i++) {
          lobes.push({ x, y: base - radii[i] + rand(-.03, .03) * size, vr: radii[i] });
          if (i < n - 1) x += (radii[i] + radii[i + 1]) * rand(.56, .76);
        }
        // Billows piled on a shoulder, and crowns piled on a billow. Each one
        // is hung off a lobe that already exists, so it cannot float free.
        const m = 3 + ((Math.random() * 3) | 0);
        const stack = (hostFrom, hostCount, lo, hi, spread) => {
          const host = lobes[hostFrom + ((Math.random() * hostCount) | 0)] || lobes[0];
          const vr = size * rand(lo, hi);
          const a = -Math.PI / 2 + rand(-spread, spread);
          const reach = (host.vr + vr) * rand(.5, .78);
          lobes.push({ x: host.x + Math.cos(a) * reach, y: host.y + Math.sin(a) * reach, vr });
        };
        for (let i = 0; i < m; i++) stack(0, n, .22, .36, .85);
        const c = (Math.random() * 3) | 0;
        for (let i = 0; i < c; i++) stack(n, m, .18, .3, .7);

        let cx = 0, cy = 0;
        for (const p of lobes) { cx += p.x; cy += p.y; }
        cx /= lobes.length;
        cy /= lobes.length;
        return lobes.map((p) => ({ x: p.x - cx, y: p.y - cy, vr: p.vr, r: p.vr / VIS }));
      }

      function updateBounds(cloud) {
        let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity, rad = 0;
        for (const p of cloud.puffs) {
          if (p.x - p.vr < minx) minx = p.x - p.vr;
          if (p.y - p.vr < miny) miny = p.y - p.vr;
          if (p.x + p.vr > maxx) maxx = p.x + p.vr;
          if (p.y + p.vr > maxy) maxy = p.y + p.vr;
          rad = Math.max(rad, Math.hypot(p.x, p.y) + p.vr);
        }
        cloud.bounds = { minx, miny, maxx, maxy };
        cloud.radius = rad;
      }

      // The body is the UNION of its lobes, not their sum: a sum smears the
      // lobes into one featureless blob and piles the density up in the middle,
      // where a union keeps every lobe's own curve and an even thickness to cut.
      function fieldLocal(cloud, lx, ly) {
        let v = 0;
        const puffs = cloud.puffs;
        for (let i = 0; i < puffs.length; i++) {
          const p = puffs[i];
          const dx = lx - p.x, dy = ly - p.y;
          const r2 = p.r * p.r, d2 = dx * dx + dy * dy;
          if (d2 < r2) {
            const t = 1 - d2 / r2;
            const k = t * t;
            if (k > v) v = k;
          }
        }
        const bites = cloud.bites;
        for (let i = 0; i < bites.length; i++) {
          const b = bites[i];
          let dx = lx - b.x, dy = ly - b.y;
          const ex = b.x2 - b.x, ey = b.y2 - b.y;
          const len2 = ex * ex + ey * ey;
          if (len2 > 0) {
            let t = (dx * ex + dy * ey) / len2;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            dx -= ex * t;
            dy -= ey * t;
          }
          const r2 = b.r * b.r, d2 = dx * dx + dy * dy;
          if (d2 < r2) {
            const t2 = 1 - d2 / r2;
            v -= b.s * t2 * t2;
          }
        }
        return v;
      }

      function fieldWorld(cloud, wx, wy) {
        return fieldLocal(cloud, (wx - cloud.x) / cloud.scale, (wy - cloud.y) / cloud.scale);
      }

      function cloudToWorld(cloud, p) {
        return { x: cloud.x + p.x * cloud.scale, y: cloud.y + p.y * cloud.scale };
      }

      function cloudAt(wx, wy) {
        for (const cloud of clouds) {
          const ext = cloud.radius * cloud.scale + 4;
          if (Math.abs(wx - cloud.x) > ext || Math.abs(wy - cloud.y) > ext) continue;
          if (fieldWorld(cloud, wx, wy) > FIELD_T) return cloud;
        }
        return null;
      }

      function densityAt(wx, wy) {
        let v = 0;
        for (const cloud of clouds) {
          const ext = cloud.radius * cloud.scale + 4;
          if (Math.abs(wx - cloud.x) > ext || Math.abs(wy - cloud.y) > ext) continue;
          v += Math.max(0, fieldWorld(cloud, wx, wy));
        }
        return v;
      }

      // ---------- marching squares ----------

      function extractContours(cloud) {
        const b = cloud.bounds;
        const pad = 6;
        const x0 = b.minx - pad, y0 = b.miny - pad;
        const w = (b.maxx - b.minx) + pad * 2;
        const h = (b.maxy - b.miny) + pad * 2;
        if (!(w > 0) || !(h > 0)) return [];
        const cell = Math.max(2.8, Math.max(w, h) / 50);
        const nx = Math.max(2, Math.ceil(w / cell));
        const ny = Math.max(2, Math.ceil(h / cell));
        const gw = nx + 1;
        const vals = new Float64Array(gw * (ny + 1));
        for (let j = 0; j <= ny; j++) {
          const py = y0 + j * cell;
          for (let i = 0; i <= nx; i++) vals[j * gw + i] = fieldLocal(cloud, x0 + i * cell, py);
        }

        const vOff = nx * (ny + 1);
        const next = new Map();
        const link = (from, to) => next.set(from, to);
        const hid = (i, j) => j * nx + i;
        const vid = (i, j) => vOff + j * gw + i;

        for (let j = 0; j < ny; j++) {
          for (let i = 0; i < nx; i++) {
            const tl = vals[j * gw + i];
            const tr = vals[j * gw + i + 1];
            const br = vals[(j + 1) * gw + i + 1];
            const bl = vals[(j + 1) * gw + i];
            let c = 0;
            if (tl >= FIELD_T) c |= 1;
            if (tr >= FIELD_T) c |= 2;
            if (br >= FIELD_T) c |= 4;
            if (bl >= FIELD_T) c |= 8;
            if (c === 0 || c === 15) continue;
            const T = hid(i, j), R = vid(i + 1, j), B = hid(i, j + 1), L = vid(i, j);
            switch (c) {
              case 1: link(L, T); break;
              case 2: link(T, R); break;
              case 3: link(L, R); break;
              case 4: link(R, B); break;
              case 5:
                if ((tl + tr + br + bl) / 4 >= FIELD_T) { link(R, T); link(L, B); }
                else { link(L, T); link(R, B); }
                break;
              case 6: link(T, B); break;
              case 7: link(L, B); break;
              case 8: link(B, L); break;
              case 9: link(B, T); break;
              case 10:
                if ((tl + tr + br + bl) / 4 >= FIELD_T) { link(T, L); link(B, R); }
                else { link(T, R); link(B, L); }
                break;
              case 11: link(B, R); break;
              case 12: link(R, L); break;
              case 13: link(R, T); break;
              case 14: link(T, L); break;
            }
          }
        }
        if (!next.size) return [];

        const edgePoint = (id) => {
          if (id < vOff) {
            const j = (id / nx) | 0, i = id - j * nx;
            const v0 = vals[j * gw + i], v1 = vals[j * gw + i + 1];
            const t = v1 === v0 ? .5 : clamp((FIELD_T - v0) / (v1 - v0), 0, 1);
            return { x: x0 + (i + t) * cell, y: y0 + j * cell };
          }
          const k = id - vOff;
          const j = (k / gw) | 0, i = k - j * gw;
          const v0 = vals[j * gw + i], v1 = vals[(j + 1) * gw + i];
          const t = v1 === v0 ? .5 : clamp((FIELD_T - v0) / (v1 - v0), 0, 1);
          return { x: x0 + i * cell, y: y0 + (j + t) * cell };
        };

        const seen = new Set();
        const loops = [];
        for (const start of next.keys()) {
          if (seen.has(start)) continue;
          const loop = [];
          let e = start;
          while (e !== undefined && !seen.has(e)) {
            seen.add(e);
            loop.push(edgePoint(e));
            e = next.get(e);
          }
          if (loop.length >= 6) loops.push(decimate(smoothLoop(loop, 1)));
        }
        return loops;
      }

      function smoothLoop(pts, passes) {
        const n = pts.length;
        for (let p = 0; p < passes; p++) {
          const out = new Array(n);
          for (let i = 0; i < n; i++) {
            const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
            out[i] = { x: b.x * .5 + (a.x + c.x) * .25, y: b.y * .5 + (a.y + c.y) * .25 };
          }
          pts = out;
        }
        return pts;
      }

      function decimate(pts) {
        if (pts.length <= 150) return pts;
        const step = Math.ceil(pts.length / 130);
        const out = [];
        for (let i = 0; i < pts.length; i += step) out.push(pts[i]);
        return out;
      }

      function polyArea(pts) {
        let a = 0;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
        }
        return a / 2;
      }

      function polyCentroid(pts) {
        let cx = 0, cy = 0;
        for (const p of pts) { cx += p.x; cy += p.y; }
        return { x: cx / pts.length, y: cy / pts.length };
      }

      function pointInPolygon(p, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const a = poly[i], b = poly[j];
          if ((a.y > p.y) !== (b.y > p.y) &&
              p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
        }
        return inside;
      }

      function nearestVertexDist(p, poly) {
        let best = Infinity;
        for (const q of poly) {
          const d = Math.hypot(q.x - p.x, q.y - p.y);
          if (d < best) best = d;
        }
        return best;
      }

      // ---------- geometry rebuild, severing, dissolving ----------

      function buildCloudGeometry(cloud) {
        const loops = extractContours(cloud);
        if (!loops.length) return { empty: true, solids: [] };

        const info = loops.map((pts) => ({ pts, area: Math.abs(polyArea(pts)), depth: 0 }));
        for (let i = 0; i < info.length; i++) {
          for (let j = 0; j < info.length; j++) {
            if (i !== j && pointInPolygon(info[i].pts[0], info[j].pts)) info[i].depth++;
          }
        }
        const solids = info.filter((l) => l.depth % 2 === 0).sort((a, b) => b.area - a.area);
        if (!solids.length) return { empty: true, solids: [] };

        let keep = solids, drop = [];
        if (solids.length === 1) {
          if (solids[0].area < MIN_KEEP_AREA) return { empty: true, solids: [] };
        } else {
          const total = solids.reduce((s, l) => s + l.area, 0);
          const floor = Math.max(MIN_COMP_AREA, total * .09);
          keep = solids.filter((l, i) => i === 0 || l.area >= floor);
          drop = solids.filter((l, i) => i !== 0 && l.area < floor);
        }

        cloud.contours = loops.map(dressLoop);
        cloud.detail = buildDetail(cloud).map(dressLoop);

        for (const d of drop) shedPiece(cloud, d);
        return { empty: false, solids: keep, pruned: drop.length > 0 };
      }

      function dressLoop(pts) {
        return pts.map((p) => {
          const len = Math.hypot(p.x, p.y) || 1;
          return { x: p.x, y: p.y, nx: p.x / len, ny: p.y / len, k: (p.x + p.y) * .045 };
        });
      }

      // Interior scallops: each lobe's own curve, kept only along the arc that
      // some other lobe has swallowed. That is exactly the fold where two puffs
      // meet, and it vanishes wherever the guns have opened the body up.
      function buildDetail(cloud) {
        const out = [];
        const steps = 30;
        for (const p of cloud.puffs) {
          let run = null;
          for (let k = 0; k <= steps; k++) {
            const a = k / steps * TAU;
            const x = p.x + Math.cos(a) * p.vr * .93;
            const y = p.y + Math.sin(a) * p.vr * .93;
            let v = 0;
            for (const q of cloud.puffs) {
              // Only the fatter lobe of a pair keeps its arc, otherwise every
              // overlap draws twice and the fold reads as a lens.
              if (q === p || q.vr < p.vr || (q.vr === p.vr && q.x <= p.x)) continue;
              const dx = x - q.x, dy = y - q.y;
              const r2 = q.r * q.r, d2 = dx * dx + dy * dy;
              if (d2 < r2) {
                const t = 1 - d2 / r2;
                if (t * t > v) v = t * t;
              }
            }
            for (const b of cloud.bites) {
              let dx = x - b.x, dy = y - b.y;
              const ex = b.x2 - b.x, ey = b.y2 - b.y;
              const len2 = ex * ex + ey * ey;
              if (len2 > 0) {
                let t = (dx * ex + dy * ey) / len2;
                t = t < 0 ? 0 : t > 1 ? 1 : t;
                dx -= ex * t;
                dy -= ey * t;
              }
              const r2 = b.r * b.r, d2 = dx * dx + dy * dy;
              if (d2 < r2) {
                const t2 = 1 - d2 / r2;
                v -= b.s * t2 * t2;
              }
            }
            if (v > FIELD_T * 1.2) {
              if (!run) run = [];
              run.push({ x, y });
            } else {
              if (run && run.length > 2) out.push(run);
              run = null;
            }
          }
          if (run && run.length > 2) out.push(run);
        }
        return out;
      }

      // A severed piece too small to survive: erased for good and released as vapor.
      function shedPiece(cloud, comp) {
        const c = polyCentroid(comp.pts);
        let r = 0;
        for (const p of comp.pts) r = Math.max(r, Math.hypot(p.x - c.x, p.y - c.y));
        cloud.bites.push({ x: c.x, y: c.y, x2: c.x, y2: c.y, len: 0, r: r * 1.12 + 2, s: 2.6, heal: 0 });
        const w = cloudToWorld(cloud, c);
        for (let i = 0; i < 6; i++) {
          puffWisp(w.x + rand(-r, r) * cloud.scale, w.y + rand(-r, r) * cloud.scale, r * .5 * cloud.scale, cloud.vx);
        }
        score += 25;
      }

      function splitCloud(cloud, comps) {
        const kids = [];
        for (const comp of comps) {
          const puffs = cloud.puffs.filter((p) => pointInPolygon(p, comp.pts));
          if (!puffs.length) continue;
          const c = polyCentroid(comp.pts);
          const kid = makeCloud(cloud.x + c.x * cloud.scale, cloud.y + c.y * cloud.scale, cloud.size);
          kid.puffs = puffs.map((p) => ({ x: p.x - c.x, y: p.y - c.y, vr: p.vr, r: p.r }));
          kid.bites = cloud.bites
            .filter((b) => pointInPolygon(b, comp.pts) || pointInPolygon({ x: b.x2, y: b.y2 }, comp.pts)
              || nearestVertexDist(b, comp.pts) < b.r * 1.15)
            .map((b) => ({
              x: b.x - c.x, y: b.y - c.y, x2: b.x2 - c.x, y2: b.y2 - c.y,
              len: b.len, r: b.r, s: b.s, heal: b.heal && cloud.healRate * 2.1,
            }));
          kid.scale = cloud.scale;
          kid.healRate = cloud.healRate;
          kid.vx = cloud.vx + rand(-4, 4);
          kid.growTo = Math.min(MAX_SCALE, cloud.scale * rand(1.25, 1.6));
          kid.growRate = rand(.05, .105);
          kid.budAt = now + rand(.6, 1.6);
          kid.cutCd = rand(5, 9);
          kid.flash = 1;
          const push = Math.hypot(c.x, c.y) || 1;
          kid.driftX = c.x / push * 14;
          kid.driftY = c.y / push * 18;
          updateBounds(kid);
          kids.push(kid);
        }
        if (kids.length < 2) return [];
        // The halves are shouldered apart once, here — after that they only
        // pan, like everything else in the sky.
        for (const kid of kids) {
          kid.x += kid.driftX;
          kid.y += kid.driftY;
          delete kid.driftX;
          delete kid.driftY;
        }
        const w = { x: cloud.x, y: cloud.y };
        for (let i = 0; i < 10; i++) {
          puffWisp(w.x + rand(-1, 1) * cloud.radius * cloud.scale,
                   w.y + rand(-1, 1) * cloud.radius * cloud.scale * .6,
                   rand(4, 11), cloud.vx);
        }
        cuts++;
        score += 300;
        return kids;
      }

      function dissipate(cloud) {
        const ext = cloud.radius * cloud.scale;
        for (let i = 0; i < 7; i++) {
          puffWisp(cloud.x + rand(-ext, ext), cloud.y + rand(-ext, ext) * .6, rand(5, 13), cloud.vx);
        }
      }

      // A bore is one channel, not a rosary of holes. A round landing just past
      // the end of a cut already made lengthens that cut instead of adding
      // another, which is both what the ship is physically doing and the only
      // way a whole tunnel fits in a list short enough to evaluate.
      function biteCloud(cloud, wx, wy, rWorld) {
        const s = cloud.scale;
        const lx = (wx - cloud.x) / s, ly = (wy - cloud.y) / s;
        const r = rWorld / s;
        const bites = cloud.bites;
        for (let i = bites.length - 1, n = 0; i >= 0 && n < 6; i--, n++) {
          const b = bites[i];
          if (b.len > 90 || Math.abs(b.r - r) > r * .35) continue;
          const d = Math.hypot(lx - b.x2, ly - b.y2);
          if (d > r * 1.4) continue;
          b.x2 = lx;
          b.y2 = ly;
          b.len += d;
          if (r > b.r) b.r = r;
          cloud.dirty = true;
          cloud.nextBuild = 0;
          return;
        }
        bites.push({ x: lx, y: ly, x2: lx, y2: ly, len: 0, r, s: BITE_S, heal: cloud.healRate });
        if (bites.length > 130) bites.shift();
        cloud.dirty = true;
        cloud.nextBuild = 0;
        // Rounds land many times a second; only some of them show as vapor,
        // or the cut disappears behind its own smoke.
        if (Math.random() < .3) puffWisp(wx + rand(-5, 5), wy + rand(-5, 5), rand(3.5, 7), cloud.vx);
      }

      // ---------- per-frame cloud upkeep ----------

      function updateClouds(dt) {
        for (let i = clouds.length - 1; i >= 0; i--) {
          const cloud = clouds[i];
          cloud.x += cloud.vx * dt;   // weather only ever pans, never rises
          if (cloud.cutCd > 0) cloud.cutCd -= dt;
          if (cloud.flash > 0) cloud.flash = Math.max(0, cloud.flash - dt * 1.6);

          let healing = false;
          for (let k = cloud.bites.length - 1; k >= 0; k--) {
            const b = cloud.bites[k];
            if (!b.heal) continue;
            healing = true;
            b.s -= b.heal * dt;
            b.r -= b.heal * dt * 1.7;
            if (b.s <= .12 || b.r <= 2.5) cloud.bites.splice(k, 1);
          }
          if (healing) cloud.dirty = true;

          if (cloud.scale < cloud.growTo) {
            cloud.scale = Math.min(cloud.growTo, cloud.scale + cloud.growRate * dt);
            if (now > cloud.budAt) {
              budCloud(cloud);
              cloud.budAt = now + rand(.9, 2.1);
            }
          }

          const ext = cloud.radius * cloud.scale;
          if (Math.hypot(cloud.x - cam.x, cloud.y - cam.y) > killR + ext) clouds.splice(i, 1);
        }

        spawnCd -= dt;
        if (spawnCd > 0) return;
        let live = 0;
        for (const cloud of clouds) {
          if (Math.hypot(cloud.x - cam.x, cloud.y - cam.y) < liveR) live++;
        }
        if (live >= cloudTarget) { spawnCd = .35; return; }
        spawnCloud();
        spawnCd = rand(.1, .3);
      }

      // New weather comes in just outside the live ring, leaning toward
      // wherever the ship is heading so the sky ahead is never thin.
      function spawnCloud() {
        const lead = Math.atan2(ship.vy, ship.vx);
        for (let tries = 0; tries < 14; tries++) {
          const a = tries < 9 ? lead + rand(-1.2, 1.2) : rand(0, TAU);
          const d = liveR * rand(.86, 1);
          const cloud = newCloud(cam.x + Math.cos(a) * d, cam.y + Math.sin(a) * d);
          let clear = true;
          for (const other of clouds) {
            const gap = (cloud.radius + other.radius * other.scale) * .62;
            if (Math.hypot(cloud.x - other.x, cloud.y - other.y) < gap) { clear = false; break; }
          }
          if (!clear) continue;
          clouds.push(cloud);
          buildCloudGeometry(cloud);
          return;
        }
      }




      function budCloud(cloud) {
        if (cloud.puffs.length >= 20 || cloud.radius > cloud.size * 1.9) return;
        const host = cloud.puffs[(Math.random() * cloud.puffs.length) | 0];
        const a = rand(0, TAU);
        const vr = host.vr * rand(.5, .78);
        cloud.puffs.push({
          x: host.x + Math.cos(a) * (host.vr + vr) * .72,
          y: host.y + Math.sin(a) * (host.vr + vr) * .72,
          vr,
          r: vr / VIS,
        });
        updateBounds(cloud);
        cloud.dirty = true;
        cloud.nextBuild = 0;
      }

      function processCloudGeometry() {
        let removed = null;
        let spawned = null;
        for (const cloud of clouds) {
          if (!cloud.dirty || now < cloud.nextBuild) continue;
          cloud.dirty = false;
          cloud.nextBuild = now + .06;
          const res = buildCloudGeometry(cloud);
          if (res.empty) {
            dissipate(cloud);
            (removed || (removed = new Set())).add(cloud);
            continue;
          }
          if (res.pruned) {
            cloud.dirty = true;
            cloud.nextBuild = 0;
            continue;
          }
          if (res.solids.length >= 2 && clouds.length < cloudTarget + 10) {
            const kids = splitCloud(cloud, res.solids);
            if (kids.length >= 2) {
              (removed || (removed = new Set())).add(cloud);
              (spawned || (spawned = [])).push(...kids);
            }
          }
        }
        if (removed) clouds = clouds.filter((c) => !removed.has(c));
        if (spawned) {
          for (const kid of spawned) {
            clouds.push(kid);
            buildCloudGeometry(kid);
            kid.dirty = true;
            kid.nextBuild = now + .12;
          }
        }
      }

      // ---------- ship ----------

      function frame(t) {
        raf = requestAnimationFrame(frame);
        const dt = Math.min(.05, (t - last) / 1000);
        last = t;
        now += dt;
        update(dt);
        draw();
      }

      function update(dt) {
        updateShip(dt);
        updateBullets(dt);
        collideBullets();
        const px = cam.x, py = cam.y;
        updateCamera(dt);
        updateClouds(dt);
        processCloudGeometry();
        updateWisps(dt);
        updateStreaks(dt, cam.x - px, cam.y - py);
      }

      function updateShip(dt) {
        ship.thrusting = false;
        ship.turn = 0;

        // What matters is not whether the ship is standing in cloud — down its
        // own bore it never is — but whether its bow is up against uncut body.
        const load = bowLoad();
        const surround = inTheCut();
        ship.load = load;
        trackBurial(surround, dt);
        if (playerControl) playerControls(dt);
        else pilot(dt, surround);
        ream(dt);

        // Open sky is cheap; a face of cloud is thick going. The ship makes
        // headway at whatever rate its guns have opened the way in front of it.
        const k = Math.max(0, 1 - (AIR_DRAG + CLOUD_DRAG * load) * dt);
        ship.vx *= k;
        ship.vy *= k;
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;

        ship.roll += (ship.turn - ship.roll) * Math.min(1, dt * 5);
        ship.trail.push({ x: ship.x, y: ship.y });
        if (ship.trail.length > TRAIL_MAX) ship.trail.shift();
        ship.fireCd -= dt;
      }

      // Cloud on most sides means the ship is inside a body, working its way
      // along a bore it opened — the only thing "inside a cloud" can mean for
      // a ship that clears its own path.
      function inTheCut() {
        let n = 0;
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * TAU + .4;
          if (cloudAt(ship.x + Math.cos(a) * 46, ship.y + Math.sin(a) * 46)) n++;
        }
        return n >= 3;
      }

      // How much uncut body the bow is pressed against, 0 to 1.
      function bowLoad() {
        const ca = Math.cos(ship.a), sa = Math.sin(ship.a);
        let n = 0;
        for (let d = 9; d <= 33; d += 8) {
          if (cloudAt(ship.x + ca * d, ship.y + sa * d)) n++;
        }
        return n / 4;
      }

      function trackBurial(surround, dt) {
        ship.buried = surround
          ? Math.min(1, ship.buried + dt * 3.2)
          : Math.max(0, ship.buried - dt * 2.6);
        if (surround) {
          ship.insideFor += dt;
          ship.inside = true;
          return;
        }
        if (!ship.inside) return;
        // Out the far side of something it had to bore through.
        if (ship.insideFor > .7) { bored++; score += 140; }
        ship.inside = false;
        ship.insideFor = 0;
      }

      // The guns open a pilot hole; the hull reams it out to its own width, so
      // the ship can never wedge itself in a bore too narrow to fly.
      function ream(dt) {
        ship.reamCd -= dt;
        if (ship.reamCd > 0) return;
        let cut = false;
        for (const cloud of clouds) {
          const ext = cloud.radius * cloud.scale;
          if (Math.abs(ship.x - cloud.x) > ext || Math.abs(ship.y - cloud.y) > ext) continue;
          if (fieldWorld(cloud, ship.x, ship.y) <= FIELD_T) continue;
          biteCloud(cloud, ship.x, ship.y, SHIP_R * 1.2);
          cut = true;
        }
        if (cut) ship.reamCd = REAM_CD;
      }

      // There is no target and no plan. The ship holds a slowly wandering
      // course, leans toward the thicker sky, and keeps the guns going whenever
      // anything is close enough ahead to open up — an icebreaker, not a hunter.
      function pilot(dt, cloud) {
        ship.wander += dt;
        const drift = Math.sin(ship.wander * .23) * .6 + Math.sin(ship.wander * .57 + 1.9) * .3;
        let want = ship.a + drift * dt * 1.7;
        if (!cloud) {
          let best = -Infinity;
          for (let i = -2; i <= 2; i++) {
            const a = ship.a + i * .3 + drift * .1;
            const s = skyAhead(a) - Math.abs(i) * .07;
            if (s > best) { best = s; want = a; }
          }
        }
        // A drill does not turn sharply while it is in the cut.
        turnToward(want, dt, cloud ? .08 : 1);
        thrust(dt);
        if (workAhead()) autoFire();
      }

      // How much weather lies along a heading, nearer counting for more.
      function skyAhead(a) {
        const ca = Math.cos(a), sa = Math.sin(a);
        let v = 0;
        for (let d = 180; d <= 900; d += 180) {
          v += densityAt(ship.x + ca * d, ship.y + sa * d) * (1 - d / 1200);
        }
        return v;
      }

      // Anything within reach of the guns worth spending rounds on.
      function workAhead() {
        const ca = Math.cos(ship.a), sa = Math.sin(ship.a);
        for (let d = 20; d <= BULLET_RANGE; d += 24) {
          if (cloudAt(ship.x + ca * d, ship.y + sa * d)) return true;
        }
        return false;
      }

      function playerControls(dt) {
        if (keys.has('ArrowLeft') || keys.has('KeyA')) { ship.a -= SHIP_TURN * dt; ship.turn = -1; }
        if (keys.has('ArrowRight') || keys.has('KeyD')) { ship.a += SHIP_TURN * dt; ship.turn = 1; }
        if (keys.has('ArrowUp') || keys.has('KeyW')) thrust(dt);
        if (keys.has('Space')) fire();
      }

      function thrust(dt) {
        ship.vx += Math.cos(ship.a) * SHIP_ACCEL * dt;
        ship.vy += Math.sin(ship.a) * SHIP_ACCEL * dt;
        ship.thrusting = true;
        if (Math.random() < 10 * dt) {
          puffWisp(ship.x - Math.cos(ship.a) * 12, ship.y - Math.sin(ship.a) * 12, rand(2.5, 5), 0);
        }
      }

      function turnToward(want, dt, rate = 1) {
        const err = normAngle(want - ship.a);
        const step = clamp(err * 2.4, -SHIP_TURN * rate, SHIP_TURN * rate) * dt;
        ship.a += Math.abs(step) > Math.abs(err) ? err : step;
        ship.turn = step < 0 ? -1 : step > 0 ? 1 : 0;
        return err;
      }

      function fire(angle = ship.a) {
        if (ship.fireCd > 0 || bullets.length >= MAX_BULLETS) return;
        ship.fireCd = FIRE_CD;
        const x = ship.x + Math.cos(angle) * 12;
        const y = ship.y + Math.sin(angle) * 12;
        bullets.push({
          x, y, px: x, py: y,
          vx: Math.cos(angle) * BULLET_SPEED + ship.vx,
          vy: Math.sin(angle) * BULLET_SPEED + ship.vy,
          gone: 0,
        });
      }

      // Sweep the muzzle a hair so the bore comes out wide enough to fly.
      function autoFire() {
        fire(ship.a + Math.sin(now * 11) * .08);
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.px = b.x;
          b.py = b.y;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.gone += Math.hypot(b.x - b.px, b.y - b.py);
          if (b.gone > BULLET_RANGE) bullets.splice(i, 1);
        }
      }

      // Weather crowds and overlaps, so a round bites every body it is standing
      // in, not just the first one found. Carving only the front cloud would
      // leave the one behind it whole and no bore would ever go clean through.
      function collideBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          let struck = false;
          for (let s = 1; s <= 3 && !struck; s++) {
            const t = s / 3;
            const x = b.px + (b.x - b.px) * t;
            const y = b.py + (b.y - b.py) * t;
            const r = BITE_R * rand(.85, 1.2);
            for (const cloud of clouds) {
              const ext = cloud.radius * cloud.scale + 8;
              if (Math.abs(x - cloud.x) > ext || Math.abs(y - cloud.y) > ext) continue;
              if (fieldWorld(cloud, x, y) <= FIELD_T) continue;
              biteCloud(cloud, x, y, r);
              struck = true;
            }
          }
          if (struck) {
            bullets.splice(i, 1);
            score += 3;
          }
        }
      }

      // ---------- camera ----------

      // Rides a little ahead of the ship so the sky about to be cut is already
      // on screen, on a leash short enough that the ship never leaves the frame.
      function updateCamera(dt) {
        const k = Math.min(1, dt * 2.4);
        cam.x += (ship.x + ship.vx * .5 - cam.x) * k;
        cam.y += (ship.y + ship.vy * .5 - cam.y) * k;
        const leash = Math.min(W, H) * .28;
        const dx = ship.x - cam.x, dy = ship.y - cam.y;
        const d = Math.hypot(dx, dy);
        if (d > leash) {
          cam.x += dx * (1 - leash / d);
          cam.y += dy * (1 - leash / d);
        }
      }



      // ---------- vapor ----------

      function puffWisp(x, y, r, drift) {
        if (wisps.length > MAX_WISPS) return;
        wisps.push({
          x, y,
          vx: (drift || 0) * .6 + rand(-14, 14),
          vy: rand(-14, 14),
          r: Math.max(4, r),
          age: 0,
          life: rand(.7, 1.6),
          seed: rand(0, TAU),
        });
      }

      function updateWisps(dt) {
        for (let i = wisps.length - 1; i >= 0; i--) {
          const w = wisps[i];
          w.age += dt;
          if (w.age >= w.life) { wisps.splice(i, 1); continue; }
          w.x += w.vx * dt;
          w.y += w.vy * dt;
          w.vx *= 1 - .9 * dt;
          w.vy *= 1 - .9 * dt;
        }
      }

      function updateStreaks(dt, camDx, camDy) {
        for (const s of streaks) {
          s.x -= s.v * dt + camDx * s.depth;
          s.y -= camDy * s.depth;
          if (s.x + s.len < -60) { s.x = W + 50; s.y = rand(-40, H + 40); }
          else if (s.x > W + 80) { s.x = -s.len - 50; s.y = rand(-40, H + 40); }
          if (s.y < -60) s.y = H + 50;
          else if (s.y > H + 60) s.y = -50;
        }
      }

      // ---------- draw ----------

      function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        drawStreaks();
        ctx.save();
        ctx.translate(W / 2 - cam.x, H / 2 - cam.y);
        drawTrail();
        for (const cloud of clouds) {
          const ext = cloud.radius * cloud.scale + 30;
          if (Math.abs(cloud.x - cam.x) > W / 2 + ext) continue;
          if (Math.abs(cloud.y - cam.y) > H / 2 + ext) continue;
          drawCloud(cloud);
        }
        drawWisps();
        drawBullets();
        drawShip();
        ctx.restore();
        drawHud();
      }

      function drawStreaks() {
        for (const s of streaks) {
          strokePath([{ x: s.x, y: s.y }, { x: s.x + s.len, y: s.y }], false, .8, s.a);
        }
      }

      function drawCloud(cloud) {
        const w1 = now * 1.15 + cloud.phase;
        const w2 = now * .63 - cloud.phase;
        const lift = cloud.flash * .18;
        for (const loop of cloud.contours) {
          const pts = loopPoints(cloud, loop, w1, w2);
          strokePath(pts, true, 3.4, .05 + lift * .3);
          strokePath(pts, true, 1.3, .76 + lift);
        }
        for (const arc of cloud.detail) {
          strokePath(loopPoints(cloud, arc, w1, w2), false, .95, .24 + lift * .5);
        }
      }

      function loopPoints(cloud, loop, w1, w2) {
        const s = cloud.scale;
        const out = new Array(loop.length);
        for (let i = 0; i < loop.length; i++) {
          const p = loop[i];
          const d = Math.sin(w1 + p.k) * 1.15 + Math.sin(w2 + p.k * 1.9) * .8;
          out[i] = { x: cloud.x + (p.x + p.nx * d) * s, y: cloud.y + (p.y + p.ny * d) * s };
        }
        return out;
      }

      function drawWisps() {
        for (const w of wisps) {
          const p = clamp(w.age / w.life, 0, 1);
          const a = (1 - p) * .46;
          const r = w.r * (1 + p * 1.5);
          const pts = [];
          for (let i = 0; i < 13; i++) {
            const ang = i / 13 * TAU;
            const rr = r * (1 + Math.sin(ang * 3 + w.seed) * .13);
            pts.push({ x: w.x + Math.cos(ang) * rr, y: w.y + Math.sin(ang) * rr });
          }
          strokePath(pts, true, .9, a);
        }
      }

      function drawTrail() {
        const n = ship.trail.length;
        for (let i = 1; i < n; i++) {
          strokePath([ship.trail[i - 1], ship.trail[i]], false, 1, (i / n) * .3);
        }
      }

      function drawBullets() {
        for (const b of bullets) {
          strokePath([{ x: b.x - b.vx * .022, y: b.y - b.vy * .022 }, b], false, 1.25, .94);
        }
      }

      function drawShip() {
        const rs = Math.cos(ship.roll * .95);
        const bank = ship.roll * 2.6;
        const cx = ship.x, cy = ship.y;
        const nose = pointFrom(cx, cy, ship.a, 13, 0);
        const left = pointFrom(cx, cy, ship.a, -8, -7.5 * rs);
        const notch = pointFrom(cx, cy, ship.a, -4.5, bank);
        const right = pointFrom(cx, cy, ship.a, -8, 7.5 * rs);
        strokePath([nose, left, notch, right], true, 1.25, ship.buried > .3 ? .66 : .95);
        if (ship.thrusting) {
          const f1 = pointFrom(cx, cy, ship.a, -7, -3.2 * rs);
          const f2 = pointFrom(cx, cy, ship.a, -15 - Math.sin(now * 64) * 4, bank * .4);
          const f3 = pointFrom(cx, cy, ship.a, -7, 3.2 * rs);
          strokePath([f1, f2, f3], false, .9, .6);
        }
      }

      function pointFrom(x, y, angle, forward, side) {
        const ca = Math.cos(angle), sa = Math.sin(angle);
        return { x: x + ca * forward - sa * side, y: y + sa * forward + ca * side };
      }

      function drawHud() {
        ctx.save();
        ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.textBaseline = 'top';
        ctx.fillStyle = `${LINE}.82)`;
        ctx.fillText(String(score).padStart(6, '0'), 18, 18);
        ctx.fillStyle = `${LINE}.55)`;
        ctx.fillText(`BORED ${String(bored).padStart(2, '0')}   CUT ${String(cuts).padStart(2, '0')}`, 18, 38);
        ctx.textAlign = 'right';
        ctx.fillStyle = `${LINE}.82)`;
        ctx.fillText(playerControl ? 'PILOT' : 'AUTO', W - 18, 18);
        if (ship.buried > .25) {
          ctx.textAlign = 'center';
          ctx.fillStyle = `${LINE}${(.45 * ship.buried).toFixed(3)})`;
          ctx.fillText('IN THE CUT', W / 2, H - 34);
        }
        ctx.restore();
      }

      function strokePath(points, close, width, alpha) {
        if (points.length < 2 || alpha <= .004) return;
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        if (close) ctx.closePath();
        ctx.lineWidth = width;
        ctx.strokeStyle = `${LINE}${alpha})`;
        ctx.stroke();
        ctx.restore();
      }

      // ---------- input ----------

      function beginPlayerControl() {
        playerControl = true;
      }

      addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (e.code === 'Enter') { reset(); return; }
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'KeyA', 'KeyD', 'KeyW', 'Space'].includes(e.code)) {
          beginPlayerControl();
        }
        keys.add(e.code);
      });
      addEventListener('keyup', (e) => keys.delete(e.code));
      addEventListener('click', () => {
        beginPlayerControl();
        fire();
      });
      addEventListener('resize', resize);

      resize();
    </script>
  </body>
</html>
