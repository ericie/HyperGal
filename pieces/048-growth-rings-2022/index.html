<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A catalogue of tree-ring cross-sections, grown from a seed, sliced into a grid, and overlaid with one of nine landscapes of voids, passages and joins."
    />
    <title>Growth Rings · HyperGal</title>
    <style>
      :root { color-scheme: light; --focus: oklch(0.55 0.16 250); }
      html, body {
        height: 100%; margin: 0; padding: 0;
        background: mintcream; color: #222;
        overflow: hidden;
      }

      /* The stage is drawn at the window's aspect ratio, so the canvases
         fill it edge to edge. `cover` only matters in the moment between a
         resize and the redraw that follows it. Two canvases are visible,
         stacked: the grid of ring slices, then the overlay drawn on top. */
      #hmcMain {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
      }
      #hmcComp, #hmcBackground, #hmcForeground {
        position: absolute;
        margin: auto;
        overflow: auto;
        width: 100%;
        height: 100%;
        object-fit: cover;
        top: 0; bottom: 0; left: 0; right: 0;
      }
      /* Working layers: the buffer, the composite the saver reads, and the
         ten library canvases the grid is cut from. */
      #hmcBuffer, #hmcForeground, #library { display: none; }

      #hmcComp { cursor: pointer; touch-action: manipulation; }
      #hmcComp:focus-visible { outline: 3px solid var(--focus); outline-offset: -6px; }

      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>

    <script>
      // Growth Rings — Eric Ishii Eckhardt, 2022, for Hypermedia Club.
      //
      // fxhash is gone. This replaces its boilerplate snippet with an equivalent
      // that keeps the same base58 hash format and sfc32 generator, so an
      // original "oo…" hash passed as ?hash= reproduces that exact iteration.
      (() => {
        'use strict';
        const ALPHABET = '123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';

        function sfc32(a, b, c, d) {
          return () => {
            a |= 0; b |= 0; c |= 0; d |= 0;
            var t = (a + b | 0) + d | 0;
            d = d + 1 | 0;
            a = b ^ b >>> 9;
            b = c + (c << 3) | 0;
            c = c << 21 | c >>> 11;
            c = c + t | 0;
            return (t >>> 0) / 4294967296;
          };
        }

        const newHash = () => 'oo' + Array(49).fill(0)
          .map(() => ALPHABET[(Math.random() * ALPHABET.length) | 0]).join('');

        function seedFrom(hash) {
          const b58dec = (s) => [...s].reduce(
            (p, c) => p * ALPHABET.length + ALPHABET.indexOf(c) | 0, 0
          );
          const parts = hash.slice(2).match(
            new RegExp('.{' + ((hash.length / 4) | 0) + '}', 'g')
          );
          if (!parts || parts.length < 4) return null;
          return sfc32(...parts.slice(0, 4).map(b58dec));
        }

        const search = new URLSearchParams(location.search);
        window.debugMode = search.has('debug');
        window.fxhash = search.get('hash') || newHash();
        window.fxrand = seedFrom(window.fxhash) || seedFrom((window.fxhash = newHash()));
        window.newHash = newHash;
        // Rewind to a given hash, or deal a new one.
        window.reseed = (hash = newHash()) => {
          window.fxhash = hash;
          window.fxrand = seedFrom(hash);
        };

        // The platform's preview trigger has nothing to talk to any more.
        window.fxpreview = () => {};
        window.isFxpreview = false;
      })();
    </script>

    <script src="hmc-bg.js"></script>
    <script src="hmc-vector.js"></script>
    <script src="hmc-colors.js"></script>
    <script src="hmc-app.js"></script>
    <script src="hmc-growth-circles.js"></script>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <p class="instructions" id="instructions">
      A still drawing: a grid of tree-ring slices under a landscape of voids
      and passages. Click or tap for a new iteration, or press R. Press S to
      save the picture.
    </p>
    <div id="library" class="hidden"></div>

    <script>
      // Stands in for the webpack entry: builds the container and the four
      // canvases the sketch expects, then draws once. There is no frame
      // loop — the piece is a still.
      //
      // The build shipped a fixed 1920×1920 stage. Here the stage takes the
      // window's aspect ratio instead, keeping the same number of pixels as
      // that square (a square window still gets exactly 1920×1920), so the
      // picture fills the window without letterboxing, cropping, or
      // stretching. The sketch reads the stage from the canvas size.
      (() => {
        'use strict';

        const AREA = 1920 * 1920;
        const stageFor = (vw, vh) => {
          const aspect = Math.max(0.2, Math.min(5, vw / vh));
          return { w: Math.round(Math.sqrt(AREA * aspect)), h: Math.round(Math.sqrt(AREA / aspect)) };
        };
        let stage = stageFor(innerWidth, innerHeight);

        const container = document.createElement('main');
        container.id = 'hmcMain';
        const canvases = [];
        for (const id of ['hmcBuffer', 'hmcBackground', 'hmcComp', 'hmcForeground']) {
          const c = document.createElement('canvas');
          c.id = id;
          container.appendChild(c);
          canvases.push(c);
        }
        document.body.prepend(container);

        const overlay = document.getElementById('hmcComp');
        overlay.setAttribute('tabindex', '0');
        overlay.setAttribute('aria-describedby', 'instructions');
        const library = document.getElementById('library');

        // init() does `bgGrid = new bgGrid`, so the first run replaces the
        // constructor with its instance and a second run would throw. Keep
        // the constructor here and put it back before each new iteration.
        const BgGrid = bgGrid;

        render();

        function describe() {
          const f = window.$fxhashFeatures;
          const p = window.systemParams;
          overlay.setAttribute(
            'aria-label',
            'Growth Rings: a ' + p.gridCols + ' by ' + p.gridRows +
            ' grid of ring slices in the ' + f.pallet + ' palette, with a ' +
            String(f.foreground).replace(/_/g, ' ') + ' overlay.'
          );
          if (window.debugMode) console.log(window.fxhash, stage.w + 'x' + stage.h, f);
        }

        // Draws the current hash onto a fresh stage. init() appends ten
        // library canvases and paints every layer without clearing first, so
        // start from an empty room: resizing a canvas also clears it.
        function render() {
          library.replaceChildren();
          for (const c of canvases) {
            c.width = stage.w;
            c.height = stage.h;
          }
          window.$fxhashFeatures = {};
          bgGrid = BgGrid;
          init(stage, container);
          describe();
        }

        function newIteration() {
          window.reseed();
          render();
        }

        // A window that changes shape gets the same hash drawn again at the
        // new shape. Small changes (a browser bar coming and going) are left
        // to `object-fit: cover`.
        let resizeTimer = 0;
        addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            const next = stageFor(innerWidth, innerHeight);
            if (Math.abs(next.w - stage.w) / stage.w < 0.01 && Math.abs(next.h - stage.h) / stage.h < 0.01) return;
            stage = next;
            window.reseed(window.fxhash);
            render();
          }, 200);
        });

        function savePicture() {
          // hmcForeground is the composite the shipped saver read: grid then
          // overlay, the same two layers the window shows stacked.
          const link = document.createElement('a');
          link.download = 'GrowthRings_' + window.fxhash + '.png';
          link.href = document.getElementById('hmcForeground').toDataURL('image/png');
          link.click();
        }

        overlay.addEventListener('click', newIteration);
        // Keys are taken at the document, as the shipped build's S-to-save was.
        document.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (key === 'r' || key === ' ' || key === 'enter') {
            event.preventDefault();
            newIteration();
          } else if (key === 's') {
            event.preventDefault();
            savePicture();
          }
        });
      })();
    </script>
  </body>
</html>
