<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8ebea" />
    <meta
      name="description"
      content="A conveyor feeds ten geometric letters into a small Rube Goldberg machine where impacts tip a teeter-totter, walkers topple dominoes, and spinners trade momentum."
    />
    <title>Hypermedia Title 01 · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --field: #e8ebea;
        --paper: #f4f5f2;
        --ink: #171918;
        --muted: #5d625f;
        --rule: #b8bdb9;
      }

      * { box-sizing: border-box; }

      html {
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: var(--field);
      }

      body {
        width: 100%;
        height: 100%;
        min-width: 300px;
        margin: 0;
        overflow: hidden;
        background: var(--field);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overscroll-behavior: none;
      }

      button { font: inherit; }

      .stage {
        --glyph-ground: var(--field);
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--field);
        cursor: pointer;
        touch-action: manipulation;
      }

      .stage[hidden],
      .catalog[hidden] { display: none; }

      .stage:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: -8px;
      }

      .letter-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        contain: strict;
        pointer-events: none;
      }

      .conveyor {
        position: absolute;
        top: 0;
        left: 0;
        height: 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        pointer-events: none;
        transform-origin: 0 0;
      }

      .conveyor-roller {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--field);
      }

      .conveyor-roller::after {
        position: absolute;
        top: 50%;
        left: 1px;
        width: 6px;
        height: 2px;
        margin-top: -1px;
        background: var(--ink);
        content: '';
      }

      .conveyor-roller--left { left: 1px; }
      .conveyor-roller--right { right: 1px; }
      .conveyor-roller { animation: conveyor-turn 900ms linear infinite; }

      @keyframes conveyor-turn {
        to { transform: rotate(360deg); }
      }

      .falling-letter {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: var(--body-size);
        height: var(--body-size);
        overflow: visible;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .rule {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .rule-line {
        fill: none;
        stroke: var(--ink);
        stroke-width: 6;
        stroke-linecap: square;
        stroke-linejoin: round;
      }

      .fulcrum {
        fill: var(--ink);
        stroke: none;
      }

      .spinner-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .spinner {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--ink);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .spinner::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--field);
        content: '';
        transform: translate(-50%, -50%);
      }

      .domino-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .domino {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        background: var(--ink);
        transform-origin: 50% 100%;
        will-change: transform;
      }

      body.debug-mode {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: auto;
      }

      .catalog {
        --glyph-ground: var(--paper);
        width: min(100%, 1280px);
        margin: 0 auto;
        padding:
          max(24px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(54px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .catalog-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--ink);
      }

      .title-group {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }

      h1,
      p { margin: 0; }

      h1 {
        font-size: clamp(1.5rem, 3vw, 2.75rem);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 0.95;
      }

      .count {
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .guide-toggle {
        flex: none;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .guide-toggle:hover,
      .guide-toggle[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }

      .guide-toggle:focus-visible {
        outline: 3px solid #4e66c4;
        outline-offset: 3px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border-left: 1px solid var(--rule);
      }

      .specimen {
        display: grid;
        min-width: 0;
        margin: 0;
        grid-template-rows: minmax(0, 1fr) auto;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        background: var(--paper);
      }

      .artboard {
        position: relative;
        display: grid;
        aspect-ratio: 1;
        min-height: 0;
        place-items: center;
        overflow: hidden;
      }

      .glyph {
        display: block;
        width: 78%;
        height: 78%;
        overflow: visible;
      }

      .glyph .construction {
        opacity: 0;
        transition: opacity 160ms ease-out;
        vector-effect: non-scaling-stroke;
      }

      body.show-guides .glyph .construction { opacity: 1; }

      .glyph .guide-box,
      .glyph .guide-line {
        fill: none;
        stroke: #171918;
        stroke-width: 0.65;
        stroke-dasharray: 2 2;
        opacity: 0.42;
      }

      .glyph .guide-dot {
        fill: #171918;
        opacity: 0.55;
      }

      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        min-height: 42px;
        padding: 10px 12px;
        border-top: 1px solid var(--rule);
      }

      .letter {
        font-size: 0.8125rem;
        font-weight: 800;
      }

      .recipe {
        overflow: hidden;
        color: var(--muted);
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }

      @media (max-width: 660px) {
        .catalog { padding-top: max(18px, env(safe-area-inset-top)); }

        .catalog-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 15px;
        }

        .guide-toggle { min-height: 34px; }
        .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .glyph { width: 82%; height: 82%; }
        .recipe { display: none; }
      }

      @media (max-width: 390px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glyph .construction { transition: none; }
        .conveyor-roller { animation: none; }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <main
      id="stage"
      class="stage"
      tabindex="0"
      aria-label="A conveyor feeds the geometric letters in HYPERMEDIA onto a center-pivoting teeter-totter. The letters land, sprout legs, walk into two banks of dominoes, and set nearby spinners turning before leaving the frame. Once the machine is empty, it starts again. Click, tap, or press Enter to restart it now."
    >
      <h1 class="sr-only">Hypermedia</h1>
      <div id="conveyor" class="conveyor" aria-hidden="true">
        <span class="conveyor-roller conveyor-roller--left"></span>
        <span class="conveyor-roller conveyor-roller--right"></span>
      </div>
      <div id="letter-field" class="letter-field" aria-hidden="true"></div>
      <div class="spinner-field" aria-hidden="true">
        <span class="spinner"></span>
        <span class="spinner"></span>
      </div>
      <div class="domino-field" aria-hidden="true">
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
        <span class="domino"></span>
      </div>
      <svg class="rule" aria-hidden="true">
        <path id="rule-path" class="rule-line" d="" />
        <path id="fulcrum-path" class="fulcrum" d="" />
      </svg>
    </main>

    <main id="catalog" class="catalog" hidden>
      <header class="catalog-header">
        <div class="title-group">
          <h1>Hypermedia Title 01</h1>
          <p class="count">A–Z / 26</p>
        </div>
        <button class="guide-toggle" type="button" aria-pressed="false">
          Show construction
        </button>
      </header>
      <section class="grid" aria-labelledby="grid-title">
        <h2 id="grid-title" class="sr-only">Geometric alphabet specimen grid</h2>
      </section>
    </main>

    <script>
      (() => {
        'use strict';

        const SVG_NS = 'http://www.w3.org/2000/svg';
        const DEBUG_MODE = new URLSearchParams(location.search).get('debug') === 'true';
        const stage = document.getElementById('stage');
        const catalog = document.getElementById('catalog');
        const conveyor = document.getElementById('conveyor');
        const letterField = document.getElementById('letter-field');
        const spinners = [...document.querySelectorAll('.spinner')];
        const dominoes = [...document.querySelectorAll('.domino')];
        const rulePath = document.getElementById('rule-path');
        const fulcrumPath = document.getElementById('fulcrum-path');
        const grid = document.querySelector('.grid');
        const toggle = document.querySelector('.guide-toggle');

        const C = {
          blue: '#7488c2',
          navy: '#24507b',
          coral: '#f05b43',
          blush: '#edaa9a',
          mint: '#86c99a',
          green: '#53ad55',
          yellow: '#f7df43',
          orange: '#f39a2f',
          taupe: '#aaa49f',
          brown: '#806b57',
          pink: '#e96ca5',
          magenta: '#d63b88',
          cyan: '#55bac5',
          cyanDark: '#3aa8b5',
          red: '#f04b50',
          teal: '#13817d',
          peach: '#e99b63',
          violet: '#6250a2',
          violetDark: '#4e3e8e',
          slate: '#32637d',
          olive: '#72a66d',
          ink: '#171918',
          paper: 'var(--glyph-ground, #f4f5f2)',
        };

        const recipes = {
          A: 'legs / bar', B: 'bar / half-circles', C: 'circle / wedge',
          D: 'bar / half-circle', E: 'block / notches', F: 'bars / overlap',
          G: 'circle / cut / bar', H: 'bars / bridge', I: 'bars / seam',
          J: 'stem / half-circle', K: 'bar / blunt arms', L: 'bars / foot',
          M: 'stems / folded center', N: 'stems / diagonal', O: 'circle',
          P: 'bar / half-circle', Q: 'circle / tail', R: 'bar / bowl / leg',
          S: 'half-circles / bridge', T: 'cap / stem', U: 'stems / bowl',
          V: 'inverted triangle', W: 'overlapping wedges', X: 'crossed wedges',
          Y: 'wedges / stem', Z: 'block / diagonal cut',
        };

        const el = (name, attrs = {}) => {
          const node = document.createElementNS(SVG_NS, name);
          for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
          return node;
        };

        const rect = (x, y, width, height, fill, extra = {}) =>
          el('rect', { x, y, width, height, fill, ...extra });
        const circle = (cx, cy, r, fill) => el('circle', { cx, cy, r, fill });
        const polygon = (points, fill, extra = {}) => el('polygon', { points, fill, ...extra });
        const path = (d, fill) => el('path', { d, fill });
        const halfCircle = (cx, cy, r, side, fill) => {
          const shapes = {
            bottom: `M${cx - r} ${cy} A${r} ${r} 0 0 0 ${cx + r} ${cy} H${cx - r} Z`,
            left: `M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r} V${cy - r} Z`,
            right: `M${cx} ${cy - r} A${r} ${r} 0 0 1 ${cx} ${cy + r} V${cy - r} Z`,
          };
          return path(shapes[side], fill);
        };

        const glyphBuilders = {
          A(svg) {
            svg.append(
              polygon('50,8 10,90 32,90 50,49', C.blue),
              polygon('50,8 90,90 68,90 50,49', C.navy),
              rect(27, 57, 46, 14, C.blue)
            );
          },
          B(svg) {
            svg.append(
              rect(12, 10, 34, 80, C.coral),
              path('M46 10 H53 A27 20 0 0 1 53 50 H46 Z', C.blush),
              path('M46 50 H55 A25 20 0 0 1 55 90 H46 Z', C.blush)
            );
          },
          C(svg) {
            svg.append(
              circle(50, 50, 40, C.mint),
              polygon('50,50 91,24 92,50 67,50', C.paper)
            );
          },
          D(svg) {
            svg.append(
              rect(12, 10, 35, 80, C.orange),
              path('M47 10 H52 A38 40 0 0 1 52 90 H47 Z', C.yellow)
            );
          },
          E(svg) {
            svg.append(
              rect(12, 10, 76, 80, C.taupe),
              rect(60, 28, 28, 14, C.paper),
              rect(60, 58, 28, 14, C.paper),
              rect(66, 13, 22, 15, C.brown, { opacity: '.22' })
            );
          },
          F(svg) {
            svg.append(
              rect(12, 10, 36, 80, C.pink),
              rect(12, 10, 72, 28, C.pink),
              rect(48, 30, 36, 26, C.coral)
            );
          },
          G(svg) {
            svg.append(
              circle(50, 50, 40, '#5599c5'),
              rect(50, 52, 40, 38, '#2376b6'),
              rect(50, 36, 42, 24, C.paper),
              rect(50, 52, 32, 14, '#2376b6')
            );
          },
          H(svg) {
            svg.append(
              rect(12, 10, 29, 80, '#74458a'),
              rect(59, 10, 29, 80, '#9b83a7'),
              rect(41, 41, 18, 18, '#825e93')
            );
          },
          I(svg) {
            svg.append(
              rect(20, 10, 60, 80, '#68bd67'),
              rect(45, 10, 10, 80, '#36a644')
            );
          },
          J(svg) {
            svg.append(
              rect(58, 10, 30, 55, '#ed8f46'),
              halfCircle(45, 63, 27, 'bottom', '#f6a33a')
            );
          },
          K(svg) {
            svg.append(
              rect(10, 10, 34, 80, '#f8e000'),
              polygon('38,50 66,10 88,10 56,52', '#f7bd39'),
              polygon('38,50 56,48 88,90 65,90', '#f5c94b')
            );
          },
          L(svg) {
            svg.append(
              rect(16, 10, 32, 80, '#aea399'),
              rect(16, 62, 70, 28, '#aa8d6e'),
              rect(48, 62, 38, 28, '#9a7c5e', { opacity: '.45' })
            );
          },
          M(svg) {
            svg.append(
              rect(10, 10, 24, 80, C.pink),
              rect(66, 10, 24, 80, '#ec68a3'),
              polygon('30,10 52,47 52,72 26,29', C.magenta),
              polygon('70,10 48,47 48,72 74,29', '#bb397e', { opacity: '.72' })
            );
          },
          N(svg) {
            svg.append(
              rect(12, 10, 26, 80, C.cyan),
              rect(62, 10, 26, 80, C.cyan),
              polygon('12,10 34,10 88,84 88,90 64,90 12,19', C.cyanDark, { opacity: '.72' })
            );
          },
          O(svg) {
            svg.append(circle(50, 50, 40, C.red));
          },
          P(svg) {
            svg.append(
              rect(12, 10, 34, 80, C.teal),
              path('M46 10 H54 A28 25 0 0 1 54 60 H46 Z', '#67c0b4')
            );
          },
          Q(svg) {
            svg.append(
              circle(48, 48, 38, C.peach),
              polygon('48,59 77,90 91,90 67,58', '#e96c49')
            );
          },
          R(svg) {
            svg.append(
              rect(12, 10, 33, 80, '#1b82bd'),
              path('M45 10 H53 A27 24 0 0 1 53 58 H45 Z', '#0b91cf'),
              polygon('45,52 64,52 88,90 64,90 45,61', '#126da4')
            );
          },
          S(svg) {
            svg.append(
              halfCircle(50, 31, 29, 'left', '#f4d934'),
              rect(42, 42, 16, 16, '#efc92b'),
              halfCircle(50, 69, 29, 'right', '#f4d934')
            );
          },
          T(svg) {
            svg.append(
              rect(10, 10, 80, 34, '#afa9a4'),
              rect(36, 38, 32, 52, '#887360'),
              rect(36, 38, 32, 12, '#9a856f')
            );
          },
          U(svg) {
            svg.append(
              circle(50, 52, 38, C.olive),
              rect(12, 10, 28, 44, C.olive),
              rect(60, 10, 28, 44, '#7bb276'),
              rect(40, 10, 20, 44, C.paper)
            );
          },
          V(svg) {
            svg.append(polygon('10,10 90,10 50,90', '#f26369'));
          },
          W(svg) {
            svg.append(
              polygon('8,10 66,10 42,90', '#bcaeb2'),
              polygon('34,10 92,10 58,90', '#a9969c', { opacity: '.82' }),
              polygon('34,10 66,10 50,63', '#927b84', { opacity: '.46' })
            );
          },
          X(svg) {
            svg.append(
              polygon('16,10 56,10 84,90 44,90', C.violet),
              polygon('44,10 84,10 56,90 16,90', C.violetDark, { opacity: '.75' })
            );
          },
          Y(svg) {
            svg.append(
              polygon('12,10 38,10 50,39 62,10 88,10 64,58 36,58', C.slate),
              rect(38, 50, 26, 40, C.slate),
              polygon('38,10 62,10 50,39', '#4a7f99')
            );
          },
          Z(svg) {
            svg.append(
              rect(12, 10, 76, 26, '#e961a0'),
              polygon('64,34 88,34 36,70 12,70', '#c62d79'),
              rect(12, 68, 76, 22, '#e65396')
            );
          },
        };

        function addConstruction(svg) {
          const group = el('g', { class: 'construction', 'aria-hidden': 'true' });
          group.append(
            el('rect', { class: 'guide-box', x: 10, y: 10, width: 80, height: 80 }),
            el('line', { class: 'guide-line', x1: 50, y1: 6, x2: 50, y2: 94 }),
            el('line', { class: 'guide-line', x1: 6, y1: 50, x2: 94, y2: 50 }),
            el('circle', { class: 'guide-dot', cx: 50, cy: 50, r: 1.25 })
          );
          svg.append(group);
        }

        function buildSpecimen(letter, index) {
          const figure = document.createElement('figure');
          const artboard = document.createElement('div');
          const svg = el('svg', {
            class: 'glyph',
            viewBox: '0 0 100 100',
            role: 'img',
            'aria-labelledby': `glyph-${letter}`,
          });
          const title = el('title', { id: `glyph-${letter}` });
          const caption = document.createElement('figcaption');
          const name = document.createElement('span');
          const recipe = document.createElement('span');

          figure.className = 'specimen';
          artboard.className = 'artboard';
          title.textContent = `Geometric letter ${letter}`;
          name.className = 'letter';
          name.textContent = `${String(index + 1).padStart(2, '0')} · ${letter}`;
          recipe.className = 'recipe';
          recipe.textContent = recipes[letter];

          svg.append(title);
          glyphBuilders[letter](svg);
          addConstruction(svg);
          artboard.append(svg);
          caption.append(name, recipe);
          figure.append(artboard, caption);
          return figure;
        }

        function setGuides(visible) {
          document.body.classList.toggle('show-guides', visible);
          toggle.setAttribute('aria-pressed', String(visible));
          toggle.textContent = visible ? 'Hide construction' : 'Show construction';
        }

        function showDebugCatalog() {
          document.body.classList.add('debug-mode');
          stage.hidden = true;
          catalog.hidden = false;

          for (const [index, letter] of [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].entries()) {
            grid.append(buildSpecimen(letter, index));
          }

          toggle.addEventListener('click', () => {
            setGuides(toggle.getAttribute('aria-pressed') !== 'true');
          });

          addEventListener('keydown', event => {
            if (event.key.toLowerCase() === 'd' && !event.metaKey && !event.ctrlKey && !event.altKey) {
              setGuides(toggle.getAttribute('aria-pressed') !== 'true');
            }
          });
        }

        // Samples a glyph's artwork on a grid to find how much ink it carries
        // and where that ink sits. Shapes paint in order, so the topmost one
        // under a sample decides it: a cut-out in the ground colour takes mass
        // away rather than adding it.
        function weighGlyph(letter, probe) {
          if (typeof DOMPoint !== 'function') return null;
          probe.replaceChildren();
          glyphBuilders[letter](probe);
          const shapes = [...probe.querySelectorAll('*')].filter(
            node => typeof node.isPointInFill === 'function'
          );
          if (!shapes.length) return null;

          const GRID = 26;
          const step = 100 / GRID;
          let hits = 0;
          let sumX = 0;
          let sumY = 0;
          for (let row = 0; row < GRID; row++) {
            for (let column = 0; column < GRID; column++) {
              const x = (column + 0.5) * step;
              const y = (row + 0.5) * step;
              const point = new DOMPoint(x, y);
              let paint = null;
              for (const shape of shapes) {
                try {
                  if (shape.isPointInFill(point)) paint = shape;
                } catch (error) {
                  return null;
                }
              }
              if (!paint || paint.getAttribute('fill') === C.paper) continue;
              hits += 1;
              sumX += x;
              sumY += y;
            }
          }
          if (!hits) return null;
          return { ink: hits / (GRID * GRID), x: sumX / hits, y: sumY / hits };
        }

        function weighGlyphs(letters) {
          const stats = {};
          const probe = el('svg', { viewBox: '0 0 100 100', width: '100', height: '100' });
          probe.style.cssText =
            'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none';
          document.body.append(probe);

          let total = 0;
          let counted = 0;
          for (const letter of new Set(letters)) {
            const weighed = weighGlyph(letter, probe);
            if (!weighed) continue;
            stats[letter] = weighed;
            total += weighed.ink;
            counted += 1;
          }
          probe.remove();

          const average = counted ? total / counted : 1;
          for (const letter of Object.keys(stats)) {
            const weighed = stats[letter];
            // Mass against the average letter, where the ink balances across the
            // body, and how high it rides — both as a share of the body size.
            weighed.mass = Math.max(0.6, Math.min(1.6, weighed.ink / average));
            weighed.balance = (weighed.x - 50) / 100;
            weighed.rise = (50 - weighed.y) / 100;
          }
          return stats;
        }

        function startPhysics() {
          const WORD = [...'HYPERMEDIA'];
          // Drop from the longest lever arms toward the fulcrum: left edge,
          // right edge, then the next pair inward.
          const dropRank = index =>
            index < WORD.length * 0.5
              ? index * 2
              : (WORD.length - 1 - index) * 2 + 1;
          // Odds that a walker reaching an end keeps going instead of turning.
          // A thinning line wanders off sooner: the fewer walkers are left, the
          // less often one turns back.
          const STEP_OFF_CHANCE = 0.08;
          // Give the word a short patrol before the moving slope starts
          // winning over the walkers' own direction.
          const PATROL_GRACE = 2600;
          const stepOffChance = walking =>
            STEP_OFF_CHANCE * (1 + (WORD.length - walking) * 0.9);
          const TEETER_MAX_ANGLE = (30 * Math.PI) / 180;
          // The plank is a balance, not a metronome. The walkers' combined
          // leverage about the fulcrum sets the angle it wants to hold, and it
          // swings toward that angle with the weight of a real beam: a letter
          // out at the tip moves it far more than one loitering by the pivot.
          const TEETER_LEVERAGE = 3.4;
          const TEETER_STIFFNESS = 6.5;
          const TEETER_DAMPING = 0.955;
          // A landing transfers some of the letter's momentum into the beam.
          // The cap keeps a hard hit lively without letting one glyph fling the
          // whole word off-screen before the spring can answer.
          const TEETER_IMPACT_TRANSFER = 0.04;
          const TEETER_IMPACT_MIN_SPEED = 42;
          const TEETER_MAX_VELOCITY = 0.9;
          const TEETER_MASS = 3.2;
          const SPINNER_MASS = 1.8;
          const SPINNER_DRAG = 0.997;
          const SPINNER_MAX_VELOCITY = 6;
          const BAR_COLLISION_RADIUS = 6;
          const DOMINOES_PER_BANK = 4;
          const MAX_FEED_AND_SETTLE_TIME = 14000;
          let teeterVelocity = 0;
          const LEG_ANCHORS = {
            A: [24, 76],
            D: [30, 61],
            E: [30, 70],
            H: [27, 73],
            I: [34, 66],
            M: [22, 78],
            P: [25, 38],
            R: [26, 72],
            Y: [44, 56],
          };
          const LEG_COLORS = {
            A: [C.blue, C.navy],
            D: [C.orange, C.yellow],
            E: [C.taupe, C.taupe],
            H: ['#74458a', '#9b83a7'],
            I: ['#68bd67', '#68bd67'],
            M: [C.pink, '#ec68a3'],
            P: [C.teal, C.teal],
            R: ['#1b82bd', '#126da4'],
            Y: [C.slate, C.slate],
          };
          const GLYPHS = weighGlyphs(WORD);
          const motion = matchMedia('(prefers-reduced-motion: reduce)');
          const world = {
            width: 0,
            height: 0,
            inset: 0,
            groundY: 0,
            ledge: 0,
            ledgeLeft: 0,
            ledgeRight: 0,
            ledgeCenter: 0,
            teeterAngle: 0,
            conveyor: null,
            spinners: [],
            dominos: [],
            size: 0,
          };
          let bodies = [];
          let animationFrame = 0;
          let resizeFrame = 0;
          let lastTime = 0;
          let settledFrames = 0;
          let phase = 'falling';
          let phaseStarted = 0;
          let fallStartedAt = 0;
          let emptyAt = 0;

          const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
          const toss = () => Math.random() - 0.5;

          document.body.classList.toggle('debug-mode', false);
          stage.hidden = false;
          catalog.hidden = true;

          function measureWorld() {
            world.width = stage.clientWidth || innerWidth;
            world.height = stage.clientHeight || innerHeight;
            world.inset = Math.max(14, world.width * 0.035);
            world.groundY = Math.round(world.height * (world.height < 520 ? 0.5 : 0.52));
            world.teeterAngle = 0;

            const span = world.width - world.inset * 2;
            world.ledge = Math.round(clamp(span * (world.width < 520 ? 0.86 : 0.72), 180, 900));
            world.ledgeLeft = Math.round((world.width - world.ledge) * 0.5);
            world.ledgeRight = world.ledgeLeft + world.ledge;
            world.ledgeCenter = world.width * 0.5;

            // Every letter has to land on the rule, so the word is sized to
            // stand on it with room to spare.
            world.size = clamp(
              Math.max(world.ledge / 11, Math.min(world.ledge / 6.4, 68)),
              46,
              112
            );
            if (world.height < 480) world.size = Math.min(world.size, 58);
            world.size = Math.min(world.size, world.ledge / (WORD.length * 1.25));

            const lowerHeight = Math.max(world.height - world.groundY, 1);
            world.conveyor = {
              left: world.inset + world.size * 0.2,
              right: world.ledgeCenter - world.ledge * 0.08,
              y: clamp(
                world.height * 0.16,
                world.size * 0.9,
                world.groundY - world.size * 1.8
              ),
              speed: clamp(world.width * 0.14, 72, 150),
            };
            conveyor.style.width = `${world.conveyor.right - world.conveyor.left}px`;
            conveyor.style.transform =
              `translate3d(${world.conveyor.left}px, ${world.conveyor.y}px, 0)`;

            const spinnerWidth = clamp(world.ledge * 0.24, 72, 190);
            world.spinners = spinners.map((node, index) => {
              const side = index ? 1 : -1;
              const angle = side * 0.2;
              const spinner = {
                node,
                x: world.ledgeCenter + side * world.ledge * 0.42,
                y: world.groundY + lowerHeight * 0.22,
                half: spinnerWidth * 0.5,
                angle,
                angularVelocity: 0,
                inertia: (SPINNER_MASS * spinnerWidth * spinnerWidth) / 12,
                cos: Math.cos(angle),
                sin: Math.sin(angle),
                touchingTeeter: false,
              };
              node.style.width = `${spinnerWidth}px`;
              renderSpinner(spinner);
              return spinner;
            });

            const dominoWidth = clamp(world.size * 0.14, 7, 11);
            const dominoHeight = clamp(world.size * 0.54, 24, 38);
            const dominoSpacing = dominoWidth * 1.9;
            world.dominos = dominoes.map((node, index) => {
              const bank = Math.floor(index / DOMINOES_PER_BANK);
              const order = index % DOMINOES_PER_BANK;
              const direction = bank ? 1 : -1;
              const innerDistance =
                world.ledge * 0.5 -
                world.size * 0.85 -
                dominoSpacing * (DOMINOES_PER_BANK - 1);
              node.style.width = `${dominoWidth}px`;
              node.style.height = `${dominoHeight}px`;
              return {
                node,
                bank,
                order,
                direction,
                localX: direction * (innerDistance + order * dominoSpacing),
                width: dominoWidth,
                height: dominoHeight,
                angle: 0,
                angularVelocity: 0,
                active: false,
                fallen: false,
                passedOn: false,
                transferred: false,
                baseX: 0,
                baseY: 0,
              };
            });
            renderDominos();
          }

          function renderDominos() {
            const cos = Math.cos(world.teeterAngle);
            const sin = Math.sin(world.teeterAngle);
            for (const domino of world.dominos) {
              domino.baseX = world.ledgeCenter + domino.localX * cos;
              domino.baseY = world.groundY + domino.localX * sin;
              domino.node.style.transform =
                `translate3d(${domino.baseX - domino.width * 0.5}px, ` +
                `${domino.baseY - domino.height}px, 0) ` +
                `rotate(${world.teeterAngle + domino.angle}rad)`;
            }
          }

          function tipDomino(domino, shove = 0) {
            if (!domino || domino.active || domino.fallen || motion.matches) return;
            domino.active = true;
            domino.angularVelocity =
              domino.direction * (1.35 + clamp(Math.abs(shove) / 180, 0, 1.25));
          }

          function updateDominos(step) {
            for (const domino of world.dominos) {
              if (!domino.active || domino.fallen) continue;
              const fall = Math.abs(domino.angle);
              domino.angularVelocity +=
                domino.direction * (3.2 + Math.sin(fall) * 8.5) * step;
              domino.angle += domino.angularVelocity * step;

              if (!domino.passedOn && Math.abs(domino.angle) > 0.48) {
                domino.passedOn = true;
                const next = world.dominos[
                  domino.bank * DOMINOES_PER_BANK + domino.order + 1
                ];
                if (domino.order < DOMINOES_PER_BANK - 1) {
                  tipDomino(next, domino.angularVelocity * domino.height);
                }
              }

              if (
                domino.order === DOMINOES_PER_BANK - 1 &&
                !domino.transferred &&
                Math.abs(domino.angle) > 0.82
              ) {
                domino.transferred = true;
                const spinner = world.spinners[domino.bank];
                spinner.angularVelocity = clamp(
                  spinner.angularVelocity + domino.direction * 4.2,
                  -SPINNER_MAX_VELOCITY,
                  SPINNER_MAX_VELOCITY
                );
              }

              if (Math.abs(domino.angle) >= Math.PI * 0.48) {
                domino.angle = domino.direction * Math.PI * 0.48;
                domino.angularVelocity = 0;
                domino.fallen = true;
              }
            }
            renderDominos();
          }

          function renderSpinner(spinner) {
            spinner.node.style.transform =
              `translate3d(${spinner.x - spinner.half}px, ${spinner.y - 1.5}px, 0) ` +
              `rotate(${spinner.angle}rad)`;
          }

          function updateSpinners(step) {
            for (const spinner of world.spinners) {
              if (motion.matches) spinner.angularVelocity = 0;
              else {
                spinner.angle = (spinner.angle + spinner.angularVelocity * step) % (Math.PI * 2);
                spinner.angularVelocity *= Math.pow(SPINNER_DRAG, step * 60);
              }
              spinner.cos = Math.cos(spinner.angle);
              spinner.sin = Math.sin(spinner.angle);
              renderSpinner(spinner);
            }
          }

          function endpointContact(spinner, spinnerEnd) {
            const spinnerAlong = spinnerEnd * spinner.half;
            const pointX = spinner.x + spinnerAlong * spinner.cos;
            const pointY = spinner.y + spinnerAlong * spinner.sin;
            const dx = pointX - world.ledgeCenter;
            const dy = pointY - world.groundY;
            const teeterAlong = clamp(
              dx * Math.cos(world.teeterAngle) + dy * Math.sin(world.teeterAngle),
              -world.ledge * 0.5,
              world.ledge * 0.5
            );
            const closestX = world.ledgeCenter + teeterAlong * Math.cos(world.teeterAngle);
            const closestY = world.groundY + teeterAlong * Math.sin(world.teeterAngle);
            return {
              distance: Math.hypot(pointX - closestX, pointY - closestY),
              dx: pointX - closestX,
              dy: pointY - closestY,
              spinnerAlong,
              teeterAlong,
            };
          }

          function teeterEndpointContact(spinner, teeterEnd) {
            const teeterAlong = teeterEnd * world.ledge * 0.5;
            const pointX = world.ledgeCenter + teeterAlong * Math.cos(world.teeterAngle);
            const pointY = world.groundY + teeterAlong * Math.sin(world.teeterAngle);
            const dx = pointX - spinner.x;
            const dy = pointY - spinner.y;
            const spinnerAlong = clamp(
              dx * spinner.cos + dy * spinner.sin,
              -spinner.half,
              spinner.half
            );
            const closestX = spinner.x + spinnerAlong * spinner.cos;
            const closestY = spinner.y + spinnerAlong * spinner.sin;
            return {
              distance: Math.hypot(pointX - closestX, pointY - closestY),
              // Keep every normal pointing from the teeter toward the spinner.
              dx: closestX - pointX,
              dy: closestY - pointY,
              spinnerAlong,
              teeterAlong,
            };
          }

          function resolveTeeterSpinnerCollisions() {
            if (motion.matches) return;

            const teeterCos = Math.cos(world.teeterAngle);
            const teeterSin = Math.sin(world.teeterAngle);
            const teeterInertia = (TEETER_MASS * world.ledge * world.ledge) / 12;

            for (const spinner of world.spinners) {
              const contacts = [
                endpointContact(spinner, -1),
                endpointContact(spinner, 1),
                teeterEndpointContact(spinner, -1),
                teeterEndpointContact(spinner, 1),
              ];
              const contact = contacts.reduce(
                (closest, candidate) =>
                  !closest || candidate.distance < closest.distance ? candidate : closest,
                null
              );

              if (!contact || contact.distance > BAR_COLLISION_RADIUS) {
                spinner.touchingTeeter = false;
                continue;
              }
              if (spinner.touchingTeeter) continue;

              let nx = contact.dx / Math.max(contact.distance, 0.001);
              let ny = contact.dy / Math.max(contact.distance, 0.001);
              if (contact.distance < 0.001) {
                nx = -teeterSin;
                ny = teeterCos;
                const towardSpinner =
                  (spinner.x - world.ledgeCenter) * nx +
                  (spinner.y - world.groundY) * ny;
                if (towardSpinner < 0) {
                  nx *= -1;
                  ny *= -1;
                }
              }

              const teeterVx = -teeterVelocity * contact.teeterAlong * teeterSin;
              const teeterVy = teeterVelocity * contact.teeterAlong * teeterCos;
              const spinnerVx =
                -spinner.angularVelocity * contact.spinnerAlong * spinner.sin;
              const spinnerVy =
                spinner.angularVelocity * contact.spinnerAlong * spinner.cos;
              const relativeNormal =
                (spinnerVx - teeterVx) * nx + (spinnerVy - teeterVy) * ny;
              if (relativeNormal >= -4) continue;
              spinner.touchingTeeter = true;

              const teeterArm =
                contact.teeterAlong * (teeterCos * ny - teeterSin * nx);
              const spinnerArm =
                contact.spinnerAlong * (spinner.cos * ny - spinner.sin * nx);
              const inverseAngularMass =
                (teeterArm * teeterArm) / teeterInertia +
                (spinnerArm * spinnerArm) / spinner.inertia;
              if (inverseAngularMass < 0.000001) continue;
              const impulse =
                (-1.16 * relativeNormal) / inverseAngularMass;

              teeterVelocity = clamp(
                teeterVelocity - (impulse * teeterArm) / teeterInertia,
                -TEETER_MAX_VELOCITY,
                TEETER_MAX_VELOCITY
              );
              spinner.angularVelocity = clamp(
                spinner.angularVelocity + (impulse * spinnerArm) / spinner.inertia,
                -SPINNER_MAX_VELOCITY,
                SPINNER_MAX_VELOCITY
              );
            }
          }

          function groundAt(x) {
            const horizontalHalf = Math.cos(world.teeterAngle) * world.ledge * 0.5;
            const offset = x - world.ledgeCenter;
            if (Math.abs(offset) > horizontalHalf) return Infinity;
            return world.groundY + offset * Math.tan(world.teeterAngle);
          }

          function applyTeeter(angle) {
            world.teeterAngle = angle;
            const half = world.ledge * 0.5;
            const dx = Math.cos(angle) * half;
            const dy = Math.sin(angle) * half;
            rulePath.setAttribute(
              'd',
              `M${(world.ledgeCenter - dx).toFixed(1)} ${(world.groundY - dy).toFixed(1)} ` +
              `L${(world.ledgeCenter + dx).toFixed(1)} ${(world.groundY + dy).toFixed(1)}`
            );

            const fulcrumWidth = clamp(world.size * 0.62, 28, 54);
            const fulcrumHeight = clamp(world.size * 0.48, 24, 44);
            const top = world.groundY + 4;
            fulcrumPath.setAttribute(
              'd',
              `M${world.ledgeCenter.toFixed(1)} ${top.toFixed(1)} ` +
              `L${(world.ledgeCenter + fulcrumWidth * 0.5).toFixed(1)} ${(top + fulcrumHeight).toFixed(1)} ` +
              `L${(world.ledgeCenter - fulcrumWidth * 0.5).toFixed(1)} ${(top + fulcrumHeight).toFixed(1)} Z`
            );
          }

          // Where the standing letters put their weight, as a share of the arm:
          // -1 is the whole word bearing down on the left tip, +1 on the right.
          // Each letter pulls with its own mass — how much ink its glyph is
          // drawn from — so a heavy E out at the tip outweighs a light A, and
          // the weight sits under the glyph's own balance point rather than the
          // middle of its box.
          function teeterBalance() {
            const half = world.ledge * 0.5;
            let load = 0;
            let carried = 0;
            for (const body of bodies) {
              if (body.gone || body.dropping || !body.active) continue;
              // An airborne letter has momentum, but no weight on the plank
              // until the instant it makes contact.
              if (phase === 'falling' && !body.grounded) continue;
              // A letter already past the end presses on nothing.
              if (!Number.isFinite(groundAt(body.x))) continue;
              const centre =
                body.x +
                (Math.cos(body.angle) * body.balance - Math.sin(body.angle) * body.rise) *
                  body.size;
              load += body.mass * clamp((centre - world.ledgeCenter) / half, -1, 1);
              carried += body.mass;
            }
            return carried ? load / carried : 0;
          }

          function applyTeeterImpact(body, normalSpeed) {
            if (motion.matches || normalSpeed < TEETER_IMPACT_MIN_SPEED) return;

            const half = world.ledge * 0.5;
            const centre =
              body.x +
              (Math.cos(body.angle) * body.balance - Math.sin(body.angle) * body.rise) *
                body.size;
            const arm = clamp((centre - world.ledgeCenter) / half, -1, 1);
            const momentum = (body.mass * normalSpeed) / Math.max(body.size, 1);
            teeterVelocity = clamp(
              teeterVelocity + arm * momentum * TEETER_IMPACT_TRANSFER,
              -TEETER_MAX_VELOCITY,
              TEETER_MAX_VELOCITY
            );
          }

          function updateTeeter(step) {
            if (motion.matches) {
              teeterVelocity = 0;
              applyTeeter(0);
              return;
            }
            const target =
              clamp(teeterBalance() * TEETER_LEVERAGE, -1, 1) * TEETER_MAX_ANGLE;
            teeterVelocity += (target - world.teeterAngle) * TEETER_STIFFNESS * step;
            teeterVelocity *= Math.pow(TEETER_DAMPING, step * 60);
            applyTeeter(clamp(
              world.teeterAngle + teeterVelocity * step,
              -TEETER_MAX_ANGLE,
              TEETER_MAX_ANGLE
            ));
          }

          function addWalkerLegs(svg, letter) {
            const group = el('g', { class: 'walker-legs', 'aria-hidden': 'true' });
            const anchors = LEG_ANCHORS[letter] || [34, 66];
            const colors = LEG_COLORS[letter] || [C.ink, C.ink];
            const makeLeg = (anchor, side, color) => {
              const legGroup = el('g', { class: `walker-leg walker-leg--${side}` });
              const limb = el('path', {
                d:
                  `M${anchor} 87 C${anchor - 4} 93 ${anchor + 4} 103 ${anchor} 109 ` +
                  `Q${anchor + (side === 'left' ? -3 : 3)} 111 ` +
                  `${anchor + (side === 'left' ? -9 : 9)} 109`,
                fill: 'none',
                stroke: color,
                'stroke-width': 6.5,
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round',
              });
              legGroup.append(limb);
              return { group: legGroup, limb, anchor, side };
            };
            const left = makeLeg(anchors[0], 'left', colors[0]);
            const right = makeLeg(anchors[1], 'right', colors[1]);
            group.style.opacity = '0';
            group.append(left.group, right.group);
            svg.append(group);
            return { group, left, right };
          }

          function makeFallingGlyph(letter, index) {
            const svg = el('svg', {
              class: 'falling-letter',
              viewBox: '0 0 100 100',
              'aria-hidden': 'true',
            });
            svg.style.setProperty('--body-size', `${world.size}px`);
            svg.style.visibility = 'hidden';
            svg.dataset.letter = letter;
            svg.dataset.index = String(index);
            const legs = addWalkerLegs(svg, letter);
            glyphBuilders[letter](svg);
            letterField.append(svg);
            return { node: svg, legs };
          }

          function dropAway(body) {
            body.gone = true;
            body.active = false;
            body.node.style.visibility = 'hidden';
          }

          function bodyExtent(body) {
            const turn = Math.abs(Math.cos(body.angle)) + Math.abs(Math.sin(body.angle));
            return body.size * 0.4 * turn;
          }

          function renderBody(body) {
            body.node.style.transform =
              `translate3d(${body.x - body.size * 0.5}px, ${body.y - body.size * 0.5}px, 0) ` +
              `rotate(${body.angle}rad)`;
          }

          function setLegGrowth(body, amount) {
            const growth = clamp(amount, 0, 1);
            body.legs.style.opacity = String(growth);
            body.legs.setAttribute(
              'transform',
              `translate(0 87) scale(1 ${growth}) translate(0 -87)`
            );
          }

          function setGait(body, gait) {
            const poseLeg = (leg, phaseOffset) => {
              const step = gait + phaseOffset;
              const lift = Math.max(0, Math.sin(step)) * 6.5;
              const swing = Math.sin(step) * 11 * body.runDirection;
              const sideBias = leg.side === 'left' ? -1 : 1;
              const bow = Math.cos(step) * 7 * body.runDirection + sideBias * 1.5;
              const ankleX = leg.anchor + swing;
              const ankleY = 109 - lift + Math.cos(step) * 0.8;
              const toeX = ankleX + body.runDirection * (8.5 + Math.cos(step) * 1.5);
              const upperControlX = leg.anchor + bow + swing * 0.08;
              const lowerControlX = ankleX + bow * 0.55 - swing * 0.12;
              const lowerControlY = 102 - lift * 0.32;
              const toeControlX = ankleX + body.runDirection * 3.5;
              const toeControlY = ankleY + 1.2;
              leg.limb.setAttribute(
                'd',
                `M${leg.anchor} 87 C${upperControlX} 93 ${lowerControlX} ${lowerControlY} ` +
                `${ankleX} ${ankleY} Q${toeControlX} ${toeControlY} ${toeX} ${ankleY}`
              );
            };

            poseLeg(body.leftLeg, 0);
            poseLeg(body.rightLeg, Math.PI);
          }

          function placeReducedMotionWord() {
            const spacing = world.ledge / WORD.length;
            const size = Math.min(world.size, spacing / 0.86);
            bodies.forEach((body, index) => {
              body.size = size;
              body.radius = body.size * 0.36;
              body.active = true;
              body.onConveyor = false;
              body.angle = 0;
              body.x = world.ledgeLeft + spacing * (index + 0.5);
              body.y = groundAt(body.x) - body.size * 0.62;
              body.node.style.setProperty('--body-size', `${body.size}px`);
              body.node.style.visibility = 'visible';
              body.node.style.willChange = 'auto';
              setLegGrowth(body, 1);
              setGait(body, index % 2 ? 0.18 : -0.18);
              renderBody(body);
            });
          }

          function resetWorld() {
            cancelAnimationFrame(animationFrame);
            animationFrame = 0;
            lastTime = 0;
            settledFrames = 0;
            phase = 'falling';
            phaseStarted = 0;
            letterField.replaceChildren();
            measureWorld();

            const start = performance.now() + 120;
            const feedInterval = Math.max(
              360,
              (world.size * 0.9 * 1000) / world.conveyor.speed
            );
            emptyAt = 0;
            teeterVelocity = 0;
            applyTeeter(0);
            fallStartedAt = start;
            bodies = WORD.map((letter, index) => {
              const size = world.size;
              const parts = makeFallingGlyph(letter, index);
              const weighed = GLYPHS[letter] || { mass: 1, balance: 0, rise: 0 };
              return {
                index,
                letter,
                node: parts.node,
                legs: parts.legs.group,
                leftLeg: parts.legs.left,
                rightLeg: parts.legs.right,
                size,
                radius: size * 0.36,
                mass: weighed.mass,
                balance: weighed.balance,
                rise: weighed.rise,
                // How well this one keeps its footing on this drop.
                grip: 0.42 + Math.random() * 0.58,
                x: world.conveyor.left - size * 0.55,
                y: world.conveyor.y - size * 0.4,
                vx: 0,
                vy: 0,
                angle: 0,
                angularVelocity: 0,
                bornAt: start + dropRank(index) * feedInterval,
                // Low restitution gives each landing a readable thud instead
                // of sending the glyph back into a long series of hops.
                bounce: 0.16 + (index % 4) * 0.01,
                runDirection: index % 2 ? 1 : -1,
                runSpeed: size * (0.55 + (index % 4) * 0.09),
                slideVx: 0,
                cadence: 7.4 + (index % 3) * 0.8,
                standX: 0,
                standY: 0,
                standAngle: 0,
                footY: 0,
                active: false,
                onConveyor: true,
                grounded: false,
                stepping: 0,
                dropping: false,
                droppedAt: 0,
                gone: false,
              };
            });

            if (motion.matches) {
              placeReducedMotionWord();
            } else {
              animationFrame = requestAnimationFrame(tick);
            }
          }

          function resolveBounds(body) {
            const extent = bodyExtent(body);
            const left = world.inset;
            const right = world.width - world.inset;

            if (body.x - extent < left) {
              body.x = left + extent;
              if (body.vx < 0) body.vx = -body.vx * 0.58;
              body.angularVelocity += body.vy / body.size * 0.025;
            } else if (body.x + extent > right) {
              body.x = right - extent;
              if (body.vx > 0) body.vx = -body.vx * 0.58;
              body.angularVelocity -= body.vy / body.size * 0.025;
            }

          }

          function resolveGround(body) {
            const extent = bodyExtent(body);
            const top = groundAt(body.x);
            if (!Number.isFinite(top)) return;
            if (body.y - top >= extent * 0.9 || body.y + extent <= top) return;

            const normalSpeed =
              body.vy * Math.cos(world.teeterAngle) -
              body.vx * Math.sin(world.teeterAngle);
            body.y = top - extent;
            body.grounded = true;
            applyTeeterImpact(body, normalSpeed);
            if (body.vy > 34) {
              body.vy = -body.vy * body.bounce * (1.25 - body.mass * 0.25);
              body.angularVelocity += (body.vx / body.size) * 0.035;
            } else if (body.vy > 0) {
              body.vy = 0;
            }
            body.vx *= 0.72 + body.grip * 0.2;
            body.angularVelocity *= 0.86 - body.grip * 0.1;
          }

          // A grounded letter balances on whatever is still under it: the ink
          // has to hang past the last supported point before it goes over.
          function tipOverEdge(body, step) {
            if (!body.grounded) return;
            const extent = bodyExtent(body);
            const here = groundAt(body.x);
            if (!Number.isFinite(here)) return;

            const carry = side => {
              let reach = 0;
              for (let out = 0.25; out <= 1.0001; out += 0.25) {
                const beyond = groundAt(body.x + side * extent * out);
                if (!Number.isFinite(beyond) || beyond - here > extent * 0.45) break;
                reach = extent * out;
              }
              return reach;
            };

            // Where the letter's own ink balances, swung round by its rotation.
            const lean =
              Math.cos(body.angle) * body.balance - Math.sin(body.angle) * body.rise;
            const centre = body.x + lean * body.size;
            const overRight = centre - (body.x + carry(1));
            const overLeft = body.x - carry(-1) - centre;
            if (overRight <= 0 && overLeft <= 0) return;

            const direction = overRight > overLeft ? 1 : -1;
            const hang = clamp(Math.max(overRight, overLeft) / (extent * 0.9), 0, 1.4);
            // Heavy, top-heavy letters go over sooner; grip holds them a little longer.
            const topple =
              (hang * body.mass * (1 + body.rise * 0.8)) / (0.55 + body.grip * 0.65);
            body.vx += direction * topple * body.size * 2.2 * step;
            body.angularVelocity += direction * topple * 6 * step;
          }

          function resolveSpinners(body) {
            if (body.droppedAt && performance.now() - body.droppedAt > 3000) return;
            const radius = bodyExtent(body);
            for (const spinner of world.spinners) {
              const along = clamp(
                (body.x - spinner.x) * spinner.cos +
                  (body.y - spinner.y) * spinner.sin,
                -spinner.half,
                spinner.half
              );
              const contactX = spinner.x + along * spinner.cos;
              const contactY = spinner.y + along * spinner.sin;
              const ox = body.x - contactX;
              const oy = body.y - contactY;
              const distance = Math.hypot(ox, oy) || 0.001;
              if (distance >= radius) continue;

              const nx = ox / distance;
              const ny = oy / distance;
              body.x += nx * (radius - distance);
              body.y += ny * (radius - distance);

              const surfaceVx = -spinner.angularVelocity * along * spinner.sin;
              const surfaceVy = spinner.angularVelocity * along * spinner.cos;
              const relativeX = body.vx - surfaceVx;
              const relativeY = body.vy - surfaceVy;
              const normalSpeed = relativeX * nx + relativeY * ny;
              if (normalSpeed >= 0) continue;

              const restitution = body.bounce + 0.14;
              const rotationalArm =
                along * (spinner.cos * ny - spinner.sin * nx);
              const impulse =
                (-(1 + restitution) * normalSpeed) /
                (1 / body.mass + (rotationalArm * rotationalArm) / spinner.inertia);
              body.vx += (impulse / body.mass) * nx;
              body.vy += (impulse / body.mass) * ny;
              spinner.angularVelocity = clamp(
                spinner.angularVelocity - (impulse * rotationalArm) / spinner.inertia,
                -SPINNER_MAX_VELOCITY,
                SPINNER_MAX_VELOCITY
              );

              const tx = -ny;
              const ty = nx;
              const tangentSpeed = relativeX * tx + relativeY * ty;
              body.vx -= tangentSpeed * 0.07 * tx;
              body.vy -= tangentSpeed * 0.07 * ty;
              body.angularVelocity += (tangentSpeed / body.size) * 0.3;
            }
          }

          function resolvePair(a, b) {
            if (a.onConveyor || b.onConveyor) return;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const minimum = a.radius + b.radius;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared >= minimum * minimum) return;

            const distance = Math.sqrt(distanceSquared) || 0.001;
            const nx = dx / distance;
            const ny = dy / distance;
            const overlap = minimum - distance + 0.04;
            const share = b.mass / (a.mass + b.mass);
            a.x -= nx * overlap * share;
            a.y -= ny * overlap * share;
            b.x += nx * overlap * (1 - share);
            b.y += ny * overlap * (1 - share);

            const relativeX = b.vx - a.vx;
            const relativeY = b.vy - a.vy;
            const normalSpeed = relativeX * nx + relativeY * ny;
            if (normalSpeed >= 0) return;

            const impulse = (-(1 + 0.28) * normalSpeed) / (1 / a.mass + 1 / b.mass);
            a.vx -= (impulse / a.mass) * nx;
            a.vy -= (impulse / a.mass) * ny;
            b.vx += (impulse / b.mass) * nx;
            b.vy += (impulse / b.mass) * ny;

            const tx = -ny;
            const ty = nx;
            const tangentSpeed = relativeX * tx + relativeY * ty;
            const grab = (a.grip + b.grip) * 0.5;
            const friction = clamp(
              -tangentSpeed * 0.12 * grab,
              -Math.abs(impulse) * 0.2,
              Math.abs(impulse) * 0.2
            );
            a.vx -= (friction / a.mass) * tx;
            a.vy -= (friction / a.mass) * ty;
            b.vx += (friction / b.mass) * tx;
            b.vy += (friction / b.mass) * ty;
            a.angularVelocity -= (friction / (a.size * a.mass)) * 0.14;
            b.angularVelocity += (friction / (b.size * b.mass)) * 0.14;
          }

          function simulate(step) {
            const gravity = clamp(world.height * 1.35, 760, 1400);
            updateSpinners(step);
            resolveTeeterSpinnerCollisions();

            for (const body of bodies) {
              if (!body.active) continue;
              body.grounded = false;

              if (body.onConveyor) {
                body.x += world.conveyor.speed * step;
                body.y = world.conveyor.y - bodyExtent(body);
                body.vx = world.conveyor.speed;
                body.vy = 0;
                body.angle *= Math.pow(0.7, step * 60);
                body.angularVelocity = 0;
                if (body.x < world.conveyor.right) continue;

                body.onConveyor = false;
                body.x = world.conveyor.right;
                body.vx = world.conveyor.speed * (0.42 + body.grip * 0.12);
                body.vy = world.size * 0.18;
                body.angularVelocity = toss() * 0.45;
              }

              body.vy = Math.min(body.vy + gravity * step, world.height * 1.25);
              body.x += body.vx * step;
              body.y += body.vy * step;
              body.angle += body.angularVelocity * step;
              body.vx *= 0.999;
              body.angularVelocity *= 0.998;
              resolveBounds(body);
              resolveGround(body);
              if (body.grounded) {
                // A letter lying on the plank slides by however little it grips.
                const slack = 1.5 - body.grip;
                body.vx += gravity * Math.sin(world.teeterAngle) * 0.32 * slack * step;
              }
              resolveSpinners(body);
              tipOverEdge(body, step);
            }

            for (let pass = 0; pass < 2; pass++) {
              for (let i = 0; i < bodies.length; i++) {
                if (!bodies[i].active) continue;
                for (let j = i + 1; j < bodies.length; j++) {
                  if (bodies[j].active) resolvePair(bodies[i], bodies[j]);
                }
              }
              for (const body of bodies) {
                if (!body.active) continue;
                resolveBounds(body);
                resolveGround(body);
              }
            }
          }

          function beginSprouting(now) {
            phase = 'sprouting';
            phaseStarted = now;
            bodies.forEach(body => {
              if (body.gone) return;
              const top = groundAt(body.x);
              if (!Number.isFinite(top) || top - body.y > body.size) {
                startDropping(body, body.x < world.ledgeLeft ? -1 : 1);
                return;
              }
              body.footY = top;
              body.active = true;
              body.node.style.visibility = 'visible';
              body.vx = 0;
              body.vy = 0;
              body.slideVx = 0;
              body.angularVelocity = 0;
              body.standX = body.x;
              body.standY = body.y;
              body.standAngle = body.angle;
              setLegGrowth(body, 0);
              setGait(body, 0);
            });
          }

          function updateSprouting(now) {
            const progress = clamp((now - phaseStarted) / 720, 0, 1);
            const eased = 1 - Math.pow(1 - progress, 4);

            bodies.forEach(body => {
              if (body.gone || body.dropping) return;
              const surface = groundAt(body.x);
              if (Number.isFinite(surface)) body.footY = surface;
              const standingY = body.footY - body.size * 0.62;
              body.angle = body.standAngle * (1 - eased);
              body.y = body.standY + (standingY - body.standY) * eased;
              setLegGrowth(body, eased);
              renderBody(body);
            });

            if (progress >= 1) {
              phase = 'running';
              phaseStarted = now;
            }
          }

          function startDropping(body, away) {
            const slideVelocity = body.slideVx || 0;
            body.dropping = true;
            body.droppedAt = performance.now();
            body.stepping = 0;
            body.vx = slideVelocity + away * body.runSpeed * 0.35;
            body.slideVx = 0;
            body.vy = 0;
            body.angularVelocity = away * 1.7;
          }

          function shovedOff(body) {
            const top = groundAt(body.x);
            if (Number.isFinite(top) && top - body.footY < body.size * 0.7) return;
            startDropping(body, body.x < world.ledgeLeft ? -1 : 1);
          }

          function bumpDominos(body) {
            const travel = body.runDirection * body.runSpeed + body.slideVx;
            if (Math.abs(travel) < 1) return;

            let closest = null;
            let closestDistance = Infinity;
            for (const domino of world.dominos) {
              if (domino.active || domino.fallen) continue;
              const toward = (domino.baseX - body.x) * travel;
              if (toward < 0) continue;
              const distance = Math.abs(domino.baseX - body.x);
              if (
                distance < body.radius + domino.width * 0.65 &&
                Math.abs(domino.baseY - body.footY) < body.size * 0.24 &&
                distance < closestDistance
              ) {
                closest = domino;
                closestDistance = distance;
              }
            }

            if (!closest) return;
            tipDomino(closest, travel * body.mass);
            const direction = Math.sign(travel);
            body.slideVx -= direction * body.runSpeed * 0.46;
            body.x -= direction * closest.width * 0.35;
          }

          function separateRunners() {
            for (let i = 0; i < bodies.length; i++) {
              for (let j = i + 1; j < bodies.length; j++) {
                const a = bodies[i];
                const b = bodies[j];
                if (a.gone || b.gone || a.dropping || b.dropping) continue;
                if (Math.abs(a.y - b.y) > a.size * 0.6) continue;
                const dx = b.x - a.x;
                const minimum = (a.radius + b.radius) * 0.94;
                if (Math.abs(dx) >= minimum) continue;

                const direction = dx === 0 ? (a.index < b.index ? 1 : -1) : Math.sign(dx);
                const overlap = minimum - Math.abs(dx);
                const share = b.mass / (a.mass + b.mass);
                a.x -= direction * overlap * share;
                b.x += direction * overlap * (1 - share);
                a.runDirection = -direction;
                b.runDirection = direction;
                shovedOff(a);
                shovedOff(b);
              }
            }
          }

          function updateRunners(step, now) {
            const gravity = clamp(world.height * 1.35, 760, 1400);
            let walking = 0;
            for (const body of bodies) if (!body.gone && !body.dropping) walking += 1;
            const stepOff = now - phaseStarted < PATROL_GRACE ? 0 : stepOffChance(walking);

            for (const body of bodies) {
              if (body.gone) continue;
              const gait = ((now - phaseStarted) / 1000) * body.cadence + body.index * 0.73;

              if (body.dropping) {
                body.vy = Math.min(body.vy + gravity * step, world.height * 1.25);
                body.x += body.vx * step;
                body.y += body.vy * step;
                body.angle += body.angularVelocity * step;
                body.grounded = false;
                resolveGround(body);
                resolveSpinners(body);
                setGait(body, gait);
                if (body.grounded && body.vy <= 0) {
                  // Caught by the stroke again: back on its feet.
                  body.dropping = false;
                  body.droppedAt = 0;
                  body.stepping = 0;
                  body.vx = 0;
                  body.vy = 0;
                  body.slideVx = 0;
                  body.angularVelocity = 0;
                  body.angle = 0;
                  body.footY = groundAt(body.x);
                } else if (body.y - bodyExtent(body) > world.height) {
                  dropAway(body);
                }
                continue;
              }

              const here = groundAt(body.x);
              if (!Number.isFinite(here)) {
                // Walked off the end of the stroke.
                body.y = body.footY - body.size * 0.62;
                startDropping(body, body.runDirection);
                continue;
              }

              const look = body.size * 0.55;
              const ahead = groundAt(body.x + body.runDirection * look);
              const rise = here - (Number.isFinite(ahead) ? ahead : here + body.size * 4);

              if (body.stepping && body.stepping !== body.runDirection) body.stepping = 0;
              if (!body.stepping) {
                if (rise < -body.size * 0.7) {
                  // The stroke falls away ahead: turn back, or walk off it.
                  if (Math.random() < stepOff) body.stepping = body.runDirection;
                  else body.runDirection = -body.runDirection;
                } else if (rise > body.size * 0.55) {
                  // Too steep to climb.
                  body.runDirection = -body.runDirection;
                }
              }

              // Grip is what a letter keeps of the slope: a sure-footed one
              // holds its line, a poor one is carried away down the plank.
              const slack = 1.5 - body.grip;
              body.slideVx += gravity * Math.sin(world.teeterAngle) * 0.5 * slack * step;
              body.slideVx *= Math.pow(0.955 + body.grip * 0.04, step * 60);
              body.slideVx = clamp(
                body.slideVx,
                -body.runSpeed * 2.4 * slack,
                body.runSpeed * 2.4 * slack
              );
              body.x += (body.runDirection * body.runSpeed + body.slideVx) * step;
              const surface = groundAt(body.x);
              if (!Number.isFinite(surface)) {
                startDropping(body, body.runDirection);
                continue;
              }
              body.footY = surface;

              // Keep the feet on the plank while the whole body follows its angle.
              const reach = body.size * 0.4;
              const behind = groundAt(body.x - reach);
              const front = groundAt(body.x + reach);
              const tilt =
                (Number.isFinite(behind) ? behind : surface) -
                (Number.isFinite(front) ? front : surface);
              if (Math.abs(tilt) > body.size * (0.85 + body.grip * 0.85)) {
                startDropping(body, tilt > 0 ? 1 : -1);
                continue;
              }
              body.y = body.footY - body.size * 0.62 - Math.abs(Math.sin(gait * 2)) * body.size * 0.022;
              body.angle = Math.sin(gait) * 0.035 * body.runDirection + world.teeterAngle * 0.78;
              bumpDominos(body);
              setLegGrowth(body, 1);
              setGait(body, gait);
            }

            separateRunners();
            for (const body of bodies) if (!body.gone) renderBody(body);
          }

          function tick(now) {
            if (!lastTime) lastTime = now;
            const elapsed = Math.min((now - lastTime) / 1000, 0.034);
            lastTime = now;
            const physicsSteps = 3;

            // Once the walkers are up, advance both rotating systems in small
            // steps so fast bar-to-bar contacts cannot slip between frames.
            if (phase !== 'falling') {
              for (let step = 0; step < physicsSteps; step++) {
                updateSpinners(elapsed / physicsSteps);
                updateTeeter(elapsed / physicsSteps);
                resolveTeeterSpinnerCollisions();
                updateDominos(elapsed / physicsSteps);
              }
            }

            if (phase === 'falling') {
              for (const body of bodies) {
                if (!body.active && !body.gone && now >= body.bornAt) {
                  body.active = true;
                  body.node.style.visibility = 'visible';
                }
              }

              // Resolve each letter contact before moving the beam so landing
              // momentum changes its angle within the same rendered frame.
              for (let step = 0; step < physicsSteps; step++) {
                simulate(elapsed / physicsSteps);
                updateTeeter(elapsed / physicsSteps);
                updateDominos(elapsed / physicsSteps);
              }

              let totalMotion = 0;
              let standing = 0;
              let pending = false;
              for (const body of bodies) {
                if (body.gone) continue;
                if (body.active) {
                  if (body.y - bodyExtent(body) > world.height) {
                    dropAway(body);
                    continue;
                  }
                  renderBody(body);
                  standing += 1;
                  totalMotion += Math.abs(body.vx) + Math.abs(body.vy) + Math.abs(body.angularVelocity * body.size);
                } else {
                  standing += 1;
                  pending = true;
                }
              }

              if (!pending && totalMotion < standing * 4.5) settledFrames += 1;
              else settledFrames = 0;

              if (
                standing &&
                !pending &&
                (settledFrames > 60 || now - fallStartedAt > MAX_FEED_AND_SETTLE_TIME)
              ) {
                beginSprouting(now);
              }
            } else if (phase === 'sprouting') {
              updateSprouting(now);
            } else {
              updateRunners(elapsed, now);
            }

            if (bodies.every(body => body.gone)) {
              if (!emptyAt) emptyAt = now;
              else if (now - emptyAt > 900) {
                resetWorld();
                return;
              }
            } else {
              emptyAt = 0;
            }

            animationFrame = requestAnimationFrame(tick);
          }

          function scheduleResize() {
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(resetWorld);
          }

          stage.addEventListener('pointerdown', resetWorld);
          stage.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              resetWorld();
            }
          });
          addEventListener('resize', scheduleResize);
          if (motion.addEventListener) motion.addEventListener('change', resetWorld);
          else motion.addListener(resetWorld);

          resetWorld();
        }

        if (DEBUG_MODE) showDebugCatalog();
        else startPhysics();
      })();
    </script>
  </body>
</html>
