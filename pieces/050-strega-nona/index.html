<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Olive-ink spirals and nested arcs grow across warm paper until they fill the screen.">
  <title>Strega Nona · HyperGal</title>
  <style>
    :root { color-scheme: light; background: #f5f2e9; color: #595d32; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
    canvas:focus-visible { outline: 2px solid #595d32; outline-offset: -6px; }
    .instructions { position: fixed; top: 0; left: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    noscript { position: fixed; inset: 2rem; font: 1rem/1.5 Georgia, serif; }
    ::selection { background: #d7d9b5; color: #454a25; }
  </style>
</head>
<body>
  <canvas id="drawing" tabindex="0" role="button" aria-label="Strega Nona. Click or press Enter to grow a new drawing." aria-describedby="instructions"></canvas>
  <p class="instructions" id="instructions">Olive spirals and nested curves spread across paper, filling the entire window. Click or press R or Enter to start again. Space pauses or resumes. S saves the drawing.</p>
  <noscript>Strega Nona needs JavaScript to grow its drawing.</noscript>
  <script src="strega-nona.js"></script>
</body>
</html>
