<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Chalk-white currents grow through a deep blue painted field, bending into an irregular edge-to-edge labyrinth." />
    <title>No Empty Places · HyperGal</title>
    <style>
      :root { color-scheme: dark; --ground: #2c4b70; --focus: #f3f1e9; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--ground);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; background: var(--ground);
        cursor: crosshair; touch-action: manipulation;
      }
      canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -7px; }
      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="painting" tabindex="0" role="img" aria-describedby="instructions"></canvas>
    <p class="instructions" id="instructions">
      Chalk-white currents grow into an organic labyrinth across a deep blue
      field. Click, tap, press Space, or press Enter for a new painting. Press R
      to replay the current seed.
    </p>

    <script>
      (() => {
        'use strict';

        const canvas = document.querySelector('#painting');
        const ctx = canvas.getContext('2d', { alpha: false });
        const query = new URLSearchParams(location.search);
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const BLUE = [44, 75, 112];
        const CHALK = [241, 240, 233];
        const TOTAL_STEPS = 1180;

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = query.get('seed') || randomSeed();
        let field = null;
        let frame = 0;
        let resizeTimer = 0;

        resize();
        addEventListener('resize', scheduleResize, { passive: true });
        canvas.addEventListener('pointerdown', newPainting);
        canvas.addEventListener('keydown', onKeyDown);
        reducedMotion.addEventListener('change', compose);

        function randomSeed() {
          const values = new Uint32Array(2);
          crypto.getRandomValues(values);
          return values[0].toString(36) + values[1].toString(36);
        }

        function xmur3(text) {
          let h = 1779033703 ^ text.length;
          for (let i = 0; i < text.length; i += 1) {
            h = Math.imul(h ^ text.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return () => {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return () => {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randomFor(label) {
          return mulberry32(xmur3(seed + ':' + label)());
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function smoothstep(low, high, value) {
          const t = clamp((value - low) / (high - low), 0, 1);
          return t * t * (3 - 2 * t);
        }

        function scheduleResize() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resize, 120);
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          compose();
        }

        function newPainting() {
          seed = randomSeed();
          const next = new URL(location.href);
          next.searchParams.set('seed', seed);
          history.replaceState(null, '', next);
          compose();
        }

        function onKeyDown(event) {
          const key = event.key.toLowerCase();
          if (key === 'r') {
            event.preventDefault();
            compose();
          } else if (key === ' ' || key === 'enter') {
            event.preventDefault();
            newPainting();
          }
        }

        function compose() {
          cancelAnimationFrame(frame);
          field = makeField();
          canvas.setAttribute(
            'aria-label',
            'No Empty Places, seed ' + seed +
            ': chalk-white organic currents across a deep blue field.'
          );
          if (reducedMotion.matches) {
            advance(TOTAL_STEPS);
            render();
          } else {
            advance(300);
            render();
            animateGrowth();
          }
        }

        function makeField() {
          const random = randomFor('field:' + Math.round(width) + 'x' + Math.round(height));
          const longSide = 390;
          const columns = width >= height
            ? longSide
            : Math.max(150, Math.round(longSide * width / height));
          const rows = height > width
            ? longSide
            : Math.max(150, Math.round(longSide * height / width));
          const size = columns * rows;
          const u = new Float32Array(size);
          const v = new Float32Array(size);
          const nextU = new Float32Array(size);
          const nextV = new Float32Array(size);
          u.fill(1);
          for (let i = 0; i < size; i += 1) v[i] = random() * 0.018;

          const seeds = Math.round(size / 900);
          for (let i = 0; i < seeds; i += 1) {
            const cx = Math.floor(random() * columns);
            const cy = Math.floor(random() * rows);
            const radius = 3 + Math.floor(random() * 4);
            for (let oy = -radius; oy <= radius; oy += 1) {
              for (let ox = -radius; ox <= radius; ox += 1) {
                if (ox * ox + oy * oy > radius * radius) continue;
                const x = (cx + ox + columns) % columns;
                const y = (cy + oy + rows) % rows;
                const index = y * columns + x;
                u[index] = 0.22 + random() * 0.08;
                v[index] = 0.72 + random() * 0.14;
              }
            }
          }

          const imageCanvas = document.createElement('canvas');
          imageCanvas.width = columns;
          imageCanvas.height = rows;
          const imageContext = imageCanvas.getContext('2d', { alpha: false });
          return {
            columns, rows, u, v, nextU, nextV, imageCanvas, imageContext,
            image: imageContext.createImageData(columns, rows),
            feed: 0.0296,
            kill: 0.0571,
            steps: 0,
          };
        }

        function advance(iterations) {
          const { columns, rows, feed, kill } = field;
          let u = field.u;
          let v = field.v;
          let nextU = field.nextU;
          let nextV = field.nextV;
          for (let iteration = 0; iteration < iterations; iteration += 1) {
            for (let y = 0; y < rows; y += 1) {
              const up = (y === 0 ? rows - 1 : y - 1) * columns;
              const down = (y === rows - 1 ? 0 : y + 1) * columns;
              const row = y * columns;
              for (let x = 0; x < columns; x += 1) {
                const left = x === 0 ? columns - 1 : x - 1;
                const right = x === columns - 1 ? 0 : x + 1;
                const index = row + x;
                const a = u[index];
                const b = v[index];
                const reaction = a * b * b;
                const lapU = u[row + left] + u[row + right] + u[up + x] + u[down + x] - a * 4;
                const lapV = v[row + left] + v[row + right] + v[up + x] + v[down + x] - b * 4;
                nextU[index] = clamp(a + 0.19 * lapU - reaction + feed * (1 - a), 0, 1);
                nextV[index] = clamp(b + 0.095 * lapV + reaction - (feed + kill) * b, 0, 1);
              }
            }
            [u, nextU] = [nextU, u];
            [v, nextV] = [nextV, v];
          }
          field.u = u;
          field.v = v;
          field.nextU = nextU;
          field.nextV = nextV;
          field.steps += iterations;
        }

        function render() {
          const data = field.image.data;
          const values = field.v;
          for (let i = 0; i < values.length; i += 1) {
            const white = smoothstep(0.205, 0.3, values[i]);
            const grain = ((i * 17 + (i / field.columns | 0) * 31) % 13 - 6) * 0.24;
            const offset = i * 4;
            data[offset] = clamp(BLUE[0] + (CHALK[0] - BLUE[0]) * white + grain, 0, 255);
            data[offset + 1] = clamp(BLUE[1] + (CHALK[1] - BLUE[1]) * white + grain, 0, 255);
            data[offset + 2] = clamp(BLUE[2] + (CHALK[2] - BLUE[2]) * white + grain, 0, 255);
            data[offset + 3] = 255;
          }
          field.imageContext.putImageData(field.image, 0, 0);
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(field.imageCanvas, 0, 0, width, height);
          ctx.restore();
        }

        function animateGrowth() {
          function tick() {
            const remaining = TOTAL_STEPS - field.steps;
            if (remaining <= 0) {
              frame = 0;
              return;
            }
            advance(Math.min(18, remaining));
            render();
            frame = requestAnimationFrame(tick);
          }
          frame = requestAnimationFrame(tick);
        }
      })();
    </script>
  </body>
</html>
