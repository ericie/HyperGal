<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A quilt that keeps re-piecing itself. A grid of half-square triangles, bars, and notched blocks is folded through mirror symmetry, then cells retire and return in slow waves so the pattern never settles."
    />
    <title>Patchwork Geometry · HyperGal</title>
    <style>
      :root { color-scheme: light dark; --focus: oklch(0.55 0.2 25); }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: bisque;
      }
      canvas {
        display: block;
        width: 100%; height: 100%;
        cursor: pointer;
        touch-action: manipulation;
      }
      canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -6px; }
      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>

    <script>
      // Patchwork Geometry — Eric Ishii Eckhardt, 2023, for HyperMedia Club.
      //
      // Packaged for fxhash as PatchworkGeom in February 2023. fxhash is gone;
      // this replaces its boilerplate snippet with an equivalent that keeps the
      // same base58 hash format and sfc32 generator, so an original "oo…" hash
      // passed as ?hash= still reproduces that exact quilt. The sketch itself
      // only ever asks for fxrand(), so nothing downstream had to change.
      (() => {
        'use strict';
        const ALPHABET = '123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';

        function sfc32(a, b, c, d) {
          return () => {
            a |= 0; b |= 0; c |= 0; d |= 0;
            var t = (a + b | 0) + d | 0;
            d = d + 1 | 0;
            a = b ^ b >>> 9;
            b = c + (c << 3) | 0;
            c = c << 21 | c >>> 11;
            c = c + t | 0;
            return (t >>> 0) / 4294967296;
          };
        }

        window.newHash = () => 'oo' + Array(49).fill(0)
          .map(() => ALPHABET[(Math.random() * ALPHABET.length) | 0]).join('');

        window.seedFrom = (hash) => {
          const b58dec = (s) => [...s].reduce(
            (p, c) => p * ALPHABET.length + ALPHABET.indexOf(c) | 0, 0
          );
          const trunc = hash.slice(2);
          const parts = trunc.match(new RegExp('.{' + ((trunc.length / 4) | 0) + '}', 'g'));
          if (!parts || parts.length < 4) return null;
          return sfc32(...parts.slice(0, 4).map(b58dec));
        };

        const search = new URLSearchParams(location.search);
        window.debugMode = search.has('debug');
        window.fxhash = search.get('hash') || newHash();
        window.fxrand = seedFrom(window.fxhash) || seedFrom((window.fxhash = newHash()));

        // Swap in a fresh hash without reloading the page.
        window.reseed = (hash) => {
          window.fxhash = hash || newHash();
          window.fxrand = seedFrom(window.fxhash) || seedFrom((window.fxhash = newHash()));
        };
      })();
    </script>

    <script src="runtime.js"></script>
    <script src="palette.js"></script>
    <script src="colors.js"></script>
    <script src="particles.js"></script>
    <script src="grid.js"></script>
    <script src="sketch.js"></script>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <p class="instructions" id="instructions">
      The quilt re-pieces itself continuously. Click or tap for a new pattern.
      Press P to pause, S to save a still.
    </p>
  </body>
</html>
