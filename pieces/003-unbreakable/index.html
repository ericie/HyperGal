<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unbreakable · HyperGal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #160f18; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: block; }
      .caption {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        color: #f9f7e5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .8rem;
        letter-spacing: .05em;
        pointer-events: none;
        z-index: 10;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      role="img"
      aria-label="Unbreakable: a reverse Breakout machine whose infallible paddle builds an even wall of Renaissance-colored bricks, one low column at a time."
    ></canvas>
    <div class="caption">unbreakable · 2026 · reverse breakout · click to rebuild</div>
    <script>
      // unbreakable — a Breakout run in reverse.
      //
      // One ball makes one brick per trip. The paddle sends it toward the
      // nearest low column, the exposed underside returns it, and the new brick
      // locks in only after the ball has cleared the cell. No alternate build
      // modes, side-face pinball, destructive recovery, or losing state.

      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });

      // ---- tunables -------------------------------------------------------
      const COL_W_IDEAL = 52;
      const BRICK_H = 24;
      const BALL_R = 7;
      const BALL_SPEED = 480;
      const MAX_VX_FRAC = 0.62;
      const PADDLE_H = 12;
      const PADDLE_PAD = 14;
      const PADDLE_SPEED = 900;
      const PADDLE_FOLLOW = 9;
      const FLOOR_MARGIN = 46;
      const SETPOINT_FRAC = 0.42;
      const SCROLL_FOLLOW = 4.5;
      const SCROLL_MAX_SPEED = 120;
      const COLLISION_EPS = 0.05;
      const PHYSICS_STEP = 1 / 120;
      const MAX_SUBSTEPS = 8;

      // Growth Rings' Renaissance palette: warm masonry on deep aubergine.
      const PALETTE = ['#781f02', '#ce9f69', '#cc241d', '#ffda79', '#f9f7e5'];
      const SCENE = {
        background: '#160f18',
        paper: '#f9f7e5',
        shade: 'rgba(22,15,24,0.32)',
        bevel: 'rgba(255,255,255,0.20)',
      };

      let W = 0;
      let H = 0;
      let dpr = 1;
      let numCols = 0;
      let colW = 0;
      let paddleY = 0;
      let setpointY = 0;

      let gridY = 0;
      let gridTargetY = 0;
      let front = [];
      let bricks = [];
      let brickMap = new Map();
      let pendingDeposit = null;
      let ball = null;
      let depositColorBag = [];
      let buildCursor = 0;
      let lastCeilingRow = null;

      let raf = 0;
      let lastT = 0;
      let accumulator = 0;
      let fpsWindowStart = 0;
      let fpsFrames = 0;
      let frameStats = { fps: 0, maxFrameMs: 0, lastSteps: 0 };
      let impactStats = { hits: 0, cells: 0, misses: 0, recoveries: 0 };

      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = (arr) => arr[(Math.random() * arr.length) | 0];
      const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
      const randInt = (lo, hi) => Math.floor(rand(lo, hi + 1));
      const colOf = (x) => clamp(Math.floor(x / colW), 0, numCols - 1);
      const frontY = (c) => gridY + front[c] * BRICK_H;
      const brickY = (brick) => gridY + brick.row * BRICK_H;
      const snapPx = (value) => Math.round(value * dpr) / dpr;
      const brickKey = (c, row) => `${c}:${row}`;

      function reflectInto(value, lo, hi) {
        const span = hi - lo;
        if (span <= 0) return lo;
        let t = (value - lo) % (2 * span);
        if (t < 0) t += 2 * span;
        return lo + (t <= span ? t : 2 * span - t);
      }

      function reset() {
        cancelAnimationFrame(raf);

        dpr = Math.min(2, window.devicePixelRatio || 1);
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = `${W}px`;
        canvas.style.height = `${H}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        numCols = Math.max(6, Math.round(W / COL_W_IDEAL));
        colW = W / numCols;
        paddleY = H - FLOOR_MARGIN;
        setpointY = H * SETPOINT_FRAC;
        gridY = Math.round(setpointY / BRICK_H) * BRICK_H;
        gridTargetY = gridY;

        front = new Array(numCols).fill(-Infinity);
        bricks = [];
        brickMap = new Map();
        pendingDeposit = null;
        lastCeilingRow = null;
        for (let c = 0; c < numCols; c++) {
          for (let row = -1; gridY + row * BRICK_H > -BRICK_H * 2; row--) {
            addBrick(c, row, nextOpeningColor());
          }
        }

        depositColorBag = [];
        buildCursor = randInt(0, numCols - 1);
        impactStats = { hits: 0, cells: 0, misses: 0, recoveries: 0 };
        frameStats = { fps: 0, maxFrameMs: 0, lastSteps: 0 };

        const startX = (buildCursor + 0.5) * colW;
        ball = {
          x: startX,
          y: paddleY - BALL_R,
          vx: 0,
          vy: -BALL_SPEED,
          color: nextDepositColor(),
          targetCol: buildCursor,
          phase: 'ascending',
          flash: 0,
          trail: [],
          paddle: {
            x: startX,
            targetX: startX,
            w: colW + PADDLE_PAD * 2,
          },
        };
        launchBall();

        lastT = performance.now();
        fpsWindowStart = lastT;
        fpsFrames = 0;
        accumulator = 0;
        raf = requestAnimationFrame(tick);
      }

      function nextOpeningColor(previous = '') {
        const options = PALETTE.filter((color) => color !== previous);
        return pick(options.length ? options : PALETTE);
      }

      function shuffle(colors) {
        const result = colors.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = randInt(0, i);
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function nextDepositColor() {
        if (!depositColorBag.length) depositColorBag = shuffle(PALETTE);
        return depositColorBag.shift();
      }

      function hasBrick(c, row) {
        return brickMap.has(brickKey(c, row));
      }

      function addBrick(c, row, color) {
        if (c < 0 || c >= numCols || hasBrick(c, row)) return false;
        const brick = { c, row, color };
        bricks.push(brick);
        brickMap.set(brickKey(c, row), brick);
        front[c] = Math.max(front[c], row + 1);
        return true;
      }

      function removeBrick(index) {
        const brick = bricks[index];
        brickMap.delete(brickKey(brick.c, brick.row));
        bricks.splice(index, 1);
      }

      function maintainBrickCeiling() {
        const ceilingRow = Math.floor(-gridY / BRICK_H);
        if (ceilingRow === lastCeilingRow) return;
        lastCeilingRow = ceilingRow;

        for (let c = 0; c < numCols; c++) {
          if (!hasBrick(c, ceilingRow)) addBrick(c, ceilingRow, nextOpeningColor());
        }

        for (let i = bricks.length - 1; i >= 0; i--) {
          const brick = bricks[i];
          if (brickY(brick) + BRICK_H < -BRICK_H && brick.row < front[brick.c] - 1) {
            removeBrick(i);
          }
        }
      }

      function chooseTargetColumn(fromX) {
        const shallowest = Math.min(...front);
        let best = -1;
        let bestDistance = Infinity;
        let bestOrder = Infinity;

        for (let c = 0; c < numCols; c++) {
          if (front[c] !== shallowest) continue;
          const distance = Math.abs((c + 0.5) * colW - fromX);
          const order = (c - buildCursor + numCols) % numCols;
          if (distance < bestDistance - 0.01 || (Math.abs(distance - bestDistance) <= 0.01 && order < bestOrder)) {
            best = c;
            bestDistance = distance;
            bestOrder = order;
          }
        }

        if (best < 0) best = colOf(fromX);
        buildCursor = (best + 1) % numCols;
        return best;
      }

      function launchBall() {
        ball.phase = 'ascending';
        ball.targetCol = chooseTargetColumn(ball.x);

        const desiredX = (ball.targetCol + 0.5) * colW;
        const vertical = Math.max(BRICK_H, (paddleY - BALL_R) - (frontY(ball.targetCol) + BALL_R));
        const dx = desiredX - ball.x;
        const maxVx = MAX_VX_FRAC * BALL_SPEED;
        ball.vx = clamp((dx * BALL_SPEED) / Math.hypot(vertical, dx), -maxVx, maxVx);
        ball.vy = -Math.sqrt(BALL_SPEED * BALL_SPEED - ball.vx * ball.vx);

        const paddleX = clamp(ball.x, ball.paddle.w / 2, W - ball.paddle.w / 2);
        ball.paddle.x = paddleX;
        ball.paddle.targetX = paddleX;
      }

      function reflectBallAtSideWalls() {
        const lo = BALL_R;
        const hi = W - BALL_R;
        while (ball.x < lo || ball.x > hi) {
          if (ball.x < lo) {
            ball.x = lo + (lo - ball.x);
            ball.vx = Math.abs(ball.vx);
          }
          if (ball.x > hi) {
            ball.x = hi - (ball.x - hi);
            ball.vx = -Math.abs(ball.vx);
          }
        }
      }

      function queueDeposit(c) {
        if (pendingDeposit || c < 0 || c >= numCols) return false;
        const shallowest = Math.min(...front);
        if (front[c] !== shallowest) {
          impactStats.misses++;
          return false;
        }

        pendingDeposit = {
          c,
          row: front[c],
          color: ball.color,
        };
        ball.color = nextDepositColor();
        return true;
      }

      function circleTouchesPendingDeposit() {
        if (!pendingDeposit) return false;
        const left = pendingDeposit.c * colW;
        const right = (pendingDeposit.c + 1) * colW;
        const top = gridY + pendingDeposit.row * BRICK_H;
        const bottom = top + BRICK_H;
        const nearX = clamp(ball.x, left, right);
        const nearY = clamp(ball.y, top, bottom);
        const dx = ball.x - nearX;
        const dy = ball.y - nearY;
        return dx * dx + dy * dy <= (BALL_R + COLLISION_EPS) ** 2;
      }

      function commitPendingDeposit() {
        if (!pendingDeposit || circleTouchesPendingDeposit()) return;
        const deposit = pendingDeposit;
        pendingDeposit = null;
        if (addBrick(deposit.c, deposit.row, deposit.color)) {
          gridTargetY -= BRICK_H / numCols;
          impactStats.cells++;
        }
      }

      function resolveWallImpact(previousX, previousY) {
        if (ball.phase !== 'ascending' || ball.vy >= 0) return false;

        const contactY = frontY(ball.targetCol) + BALL_R;
        if (previousY < contactY || ball.y > contactY) return false;

        const dy = ball.y - previousY;
        const time = Math.abs(dy) > 1e-9 ? clamp((contactY - previousY) / dy, 0, 1) : 0;
        ball.x = previousX + (ball.x - previousX) * time;
        ball.y = contactY + COLLISION_EPS;
        ball.vy = Math.abs(ball.vy);
        ball.phase = 'descending';
        ball.flash = 1;
        queueDeposit(ball.targetCol);
        impactStats.hits++;

        const travelTime = Math.max(0, (paddleY - BALL_R - ball.y) / ball.vy);
        const landingX = reflectInto(ball.x + ball.vx * travelTime, BALL_R, W - BALL_R);
        ball.paddle.targetX = clamp(landingX, ball.paddle.w / 2, W - ball.paddle.w / 2);
        return true;
      }

      function updatePaddle(dt) {
        const paddle = ball.paddle;
        const delta = paddle.targetX - paddle.x;
        const eased = delta * (1 - Math.exp(-PADDLE_FOLLOW * dt));
        const maxStep = PADDLE_SPEED * dt;
        paddle.x += clamp(eased, -maxStep, maxStep);
        paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
      }

      function recoverBall() {
        impactStats.recoveries++;
        pendingDeposit = null;
        ball.x = clamp(ball.paddle.x, BALL_R, W - BALL_R);
        ball.y = paddleY - BALL_R;
        ball.vx = 0;
        ball.vy = -BALL_SPEED;
        ball.trail.length = 0;
        launchBall();
      }

      function updatePhysics(dt) {
        const scrollDelta = (gridTargetY - gridY) * Math.min(1, dt * SCROLL_FOLLOW);
        gridY += clamp(scrollDelta, -SCROLL_MAX_SPEED * dt, SCROLL_MAX_SPEED * dt);
        maintainBrickCeiling();

        const previousX = ball.x;
        const previousY = ball.y;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        reflectBallAtSideWalls();

        resolveWallImpact(previousX, previousY);
        commitPendingDeposit();

        if (ball.phase === 'ascending' && ball.y < -BALL_R) {
          // A last-resort containment path; the swept front test should make
          // this unreachable, but it prevents a corrupted tab from losing the ball.
          ball.targetCol = colOf(ball.x);
          ball.y = frontY(ball.targetCol) + BALL_R + COLLISION_EPS;
          ball.vy = Math.abs(ball.vy || BALL_SPEED);
          ball.phase = 'descending';
          queueDeposit(ball.targetCol);
          impactStats.recoveries++;
        }

        if (ball.y + BALL_R >= paddleY && ball.vy > 0) {
          ball.y = paddleY - BALL_R;
          ball.x = clamp(ball.x, BALL_R, W - BALL_R);
          ball.paddle.x = clamp(ball.x, ball.paddle.w / 2, W - ball.paddle.w / 2);
          ball.paddle.targetX = ball.paddle.x;
          launchBall();
        }

        updatePaddle(dt);

        if (!Number.isFinite(ball.x + ball.y + ball.vx + ball.vy + gridY)) recoverBall();
        if (ball.flash > 0) ball.flash = Math.max(0, ball.flash - dt * 4);
      }

      function tick(now) {
        const frameMs = Math.max(0, now - lastT);
        lastT = now;
        accumulator += Math.min(0.1, frameMs / 1000);

        let steps = 0;
        while (accumulator >= PHYSICS_STEP && steps < MAX_SUBSTEPS) {
          updatePhysics(PHYSICS_STEP);
          accumulator -= PHYSICS_STEP;
          steps++;
        }
        if (steps === MAX_SUBSTEPS && accumulator >= PHYSICS_STEP) accumulator = 0;
        frameStats.lastSteps = steps;
        frameStats.maxFrameMs = Math.max(frameStats.maxFrameMs, frameMs);

        fpsFrames++;
        const fpsElapsed = now - fpsWindowStart;
        if (fpsElapsed >= 1000) {
          frameStats.fps = Math.round((fpsFrames * 1000) / fpsElapsed);
          fpsFrames = 0;
          fpsWindowStart = now;
          frameStats.maxFrameMs = frameMs;
        }

        ball.trail.push(ball.x, ball.y);
        if (ball.trail.length > 16) ball.trail.splice(0, ball.trail.length - 16);

        draw();
        drawDebug();
        raf = requestAnimationFrame(tick);
      }

      function drawBricks() {
        // Batch brick bodies by palette color to avoid hundreds of fill-state
        // changes per frame. Bevels and shadows are two additional batched fills.
        for (const color of PALETTE) {
          ctx.fillStyle = color;
          ctx.beginPath();
          for (const brick of bricks) {
            if (brick.color !== color) continue;
            const y = snapPx(brickY(brick));
            if (y > H || y + BRICK_H < 0) continue;
            const left = snapPx(brick.c * colW);
            const right = snapPx((brick.c + 1) * colW);
            ctx.rect(left + 1, y + 1, right - left - 2, BRICK_H - 2);
          }
          ctx.fill();
        }

        ctx.fillStyle = SCENE.bevel;
        ctx.beginPath();
        for (const brick of bricks) {
          const y = snapPx(brickY(brick));
          if (y > H || y + BRICK_H < 0) continue;
          const left = snapPx(brick.c * colW);
          const right = snapPx((brick.c + 1) * colW);
          ctx.rect(left + 1, y + 1, right - left - 2, 3);
        }
        ctx.fill();

        ctx.fillStyle = SCENE.shade;
        ctx.beginPath();
        for (const brick of bricks) {
          const y = snapPx(brickY(brick));
          if (y > H || y + BRICK_H < 0) continue;
          const left = snapPx(brick.c * colW);
          const right = snapPx((brick.c + 1) * colW);
          ctx.rect(left + 1, y + BRICK_H - 3, right - left - 2, 2);
        }
        ctx.fill();
      }

      function draw() {
        ctx.fillStyle = SCENE.background;
        ctx.fillRect(0, 0, W, H);
        drawBricks();

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        for (let i = 2; i < ball.trail.length; i += 2) {
          const alpha = (i / ball.trail.length) * 0.5;
          ctx.strokeStyle = hexA(ball.color, alpha);
          ctx.lineWidth = (i / ball.trail.length) * BALL_R * 1.6;
          ctx.beginPath();
          ctx.moveTo(ball.trail[i - 2], ball.trail[i - 1]);
          ctx.lineTo(ball.trail[i], ball.trail[i + 1]);
          ctx.stroke();
        }
        ctx.restore();

        const paddle = ball.paddle;
        capsule(paddle.x - paddle.w / 2, paddleY - PADDLE_H / 2, paddle.w, PADDLE_H, PADDLE_H / 2);
        ctx.save();
        ctx.shadowColor = ball.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = hexA(ball.color, 0.85);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = SCENE.paper;
        capsule(paddle.x - paddle.w / 2, paddleY - PADDLE_H / 2, paddle.w, 3, 1.5);
        ctx.fill();

        ctx.save();
        ctx.shadowColor = ball.color;
        ctx.shadowBlur = 14 + ball.flash * 16;
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = SCENE.paper;
        ctx.beginPath();
        ctx.arc(ball.x - BALL_R * 0.25, ball.y - BALL_R * 0.25, BALL_R * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      function capsule(x, y, w, h, r) {
        r = Math.min(r, h / 2, w / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function hexA(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
      }

      const DEBUG = location.search.includes('debug');
      function drawDebug() {
        if (!DEBUG) return;
        let lo = Infinity;
        let hi = -Infinity;
        for (let c = 0; c < numCols; c++) {
          lo = Math.min(lo, frontY(c));
          hi = Math.max(hi, frontY(c));
        }

        const diagnostics = {
          fps: frameStats.fps,
          maxFrameMs: Number(frameStats.maxFrameMs.toFixed(2)),
          physicsSteps: frameStats.lastSteps,
          ball: {
            x: Number(ball.x.toFixed(2)),
            y: Number(ball.y.toFixed(2)),
            vx: Number(ball.vx.toFixed(2)),
            vy: Number(ball.vy.toFixed(2)),
            phase: ball.phase,
            targetCol: ball.targetCol,
          },
          paddle: {
            x: Number(ball.paddle.x.toFixed(2)),
            targetX: Number(ball.paddle.targetX.toFixed(2)),
          },
          bricks: bricks.length,
          spread: Number((hi - lo).toFixed(2)),
          pending: pendingDeposit ? 1 : 0,
          ...impactStats,
        };
        window.__unbreakableDebug = diagnostics;
        canvas.dataset.debug = JSON.stringify(diagnostics);

        ctx.fillStyle = SCENE.paper;
        ctx.font = '13px ui-monospace, monospace';
        const lines = [
          `fps=${diagnostics.fps} maxFrame=${diagnostics.maxFrameMs}ms steps=${diagnostics.physicsSteps}`,
          `ball x=${diagnostics.ball.x} y=${diagnostics.ball.y} vx=${diagnostics.ball.vx} vy=${diagnostics.ball.vy} ${diagnostics.ball.phase}`,
          `paddle x=${diagnostics.paddle.x} target=${diagnostics.paddle.targetX} column=${diagnostics.ball.targetCol}`,
          `bricks=${diagnostics.bricks} spread=${diagnostics.spread} pending=${diagnostics.pending}`,
          `hits=${diagnostics.hits} cells=${diagnostics.cells} misses=${diagnostics.misses} recoveries=${diagnostics.recoveries}`,
        ];
        lines.forEach((line, i) => ctx.fillText(line, 12, 24 + i * 18));
      }

      addEventListener('resize', reset);
      addEventListener('click', reset);
      reset();
    </script>
  </body>
</html>
