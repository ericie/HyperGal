<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      html, body { margin: 0; height: 100%; background: #070a12; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');

      const COLORS = {
        bg: '#070a12',
        top: '#ff6b9d',
        bottom: '#7cf7c8',
        left: '#8fb7ff',
        right: '#ffb86b',
        attack: '#f8ff9a',
        super: '#fff1a8',
        superCore: '#ffffff',
      };

      const ATTACK_SPEED_MIN = 245;
      const ATTACK_SPEED_MAX = 320;
      const MAX_ATTACKS = 12;
      const AMMO_CAPACITY = 43;
      const DEFENDER_W = 42;
      const DEFENDER_H = 18;
      const LAND_CONTACT = 7;
      const MUZZLE_LENGTH = 25;
      const BOSS_BULLET_SPEED = 118;
      const BOSS_HIT_GROWTH = 1.6;
      const SIDES = ['top', 'right', 'bottom', 'left'];
      const OPPOSITE = { top: 'bottom', right: 'left', bottom: 'top', left: 'right' };
      const BASE_ANGLE = { top: Math.PI, right: -Math.PI / 2, bottom: 0, left: Math.PI / 2 };
      const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0, H = 0, dpr = 1;
      let now = 0;
      let lastT = 0;
      let raf = 0;
      let nextAttackAt = 0;
      let nextSide = 'bottom';
      let attackId = 1;
      let driftSeed = Math.random() * 1000;
      let screenShake = 0;
      let whiteFlash = 0;
      let lastBullet = null;
      let gameOver = null;

      const defenders = {
        top: makeDefender('top'),
        right: makeDefender('right'),
        bottom: makeDefender('bottom'),
        left: makeDefender('left'),
      };

      let attacks = [];
      let counters = [];
      let pendingAttacks = [];
      let focusShots = [];
      let sparks = [];
      let stars = [];

      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
      const ease = (v, target, amount) => v + (target - v) * amount;
      const nextShooterSide = (side) => SIDES[(SIDES.indexOf(side) + 1) % SIDES.length];

      function makeDefender(side) {
        return {
          side,
          axis: side === 'top' || side === 'bottom' ? 'x' : 'y',
          color: COLORS[side],
          x: 0,
          y: 0,
          baseX: 0,
          baseY: 0,
          coord: 0,
          goalCoord: 0,
          railMin: 0,
          railMax: 0,
          land: null,
          surfaceAngle: BASE_ANGLE[side],
          aimX: 0,
          aimY: 0,
          wobble: Math.random() * Math.PI * 2,
          muzzleGlow: 0,
          bossLaunchFlash: 0,
          ammo: AMMO_CAPACITY,
          alive: true,
          nextFocusShotAt: 0,
        };
      }

      function reset() {
        cancelAnimationFrame(raf);
        dpr = Math.min(2, window.devicePixelRatio || 1);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        configureDefenders();

        attacks = [];
        counters = [];
        pendingAttacks = [];
        focusShots = [];
        sparks = [];
        stars = makeStars();
        now = 0;
        lastT = performance.now();
        nextSide = SIDES[(Math.random() * SIDES.length) | 0];
        nextAttackAt = 0.45;
        driftSeed = Math.random() * 1000;
        screenShake = 0;
        whiteFlash = 0;
        lastBullet = null;
        gameOver = null;
        raf = requestAnimationFrame(tick);
      }

      function makeStars() {
        const count = clamp(Math.floor((W * H) / 9000), 44, 130);
        return Array.from({ length: count }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.3,
          a: Math.random() * 0.55 + 0.10,
          tw: Math.random() * Math.PI * 2,
        }));
      }

      function configureDefenders() {
        const insetX = clamp(W * 0.06, 44, 86);
        const insetY = clamp(H * 0.075, 46, 74);
        const railX = clamp(W * 0.16, 110, 240);
        const railY = clamp(H * 0.18, 96, 150);
        const specs = {
          top:    { baseX: W * 0.52, baseY: insetY,     coord: W * 0.52, min: railX, max: W - railX },
          right:  { baseX: W - insetX, baseY: H * 0.48, coord: H * 0.48, min: railY, max: H - railY },
          bottom: { baseX: W * 0.48, baseY: H - insetY, coord: W * 0.48, min: railX, max: W - railX },
          left:   { baseX: insetX,     baseY: H * 0.52, coord: H * 0.52, min: railY, max: H - railY },
        };
        for (const side of SIDES) {
          const def = defenders[side];
          const spec = specs[side];
          def.baseX = spec.baseX;
          def.baseY = spec.baseY;
          def.coord = spec.coord;
          def.goalCoord = spec.coord;
          def.railMin = spec.min;
          def.railMax = spec.max;
          def.land = makeLandGeometry(def);
          def.ammo = AMMO_CAPACITY;
          def.alive = true;
          def.muzzleGlow = 0;
          def.bossLaunchFlash = 0;
          def.nextFocusShotAt = 0;
          def.aimX = W / 2;
          def.aimY = H / 2;
          applyDefenderPosition(def);
        }
      }

      function makeLandGeometry(def) {
        const axisLength = def.axis === 'x' ? W : H;
        const midpoint = (def.railMin + def.railMax) / 2;
        const halfChord = (def.railMax - def.railMin) / 2 + DEFENDER_W / 2 + 14;
        const sag = clamp(axisLength * 0.05, 24, 58);
        const radius = (halfChord * halfChord + sag * sag) / (2 * sag);

        if (def.side === 'top') {
          return { centerX: midpoint, centerY: def.baseY - LAND_CONTACT - radius, radius };
        }
        if (def.side === 'bottom') {
          return { centerX: midpoint, centerY: def.baseY + LAND_CONTACT + radius, radius };
        }
        if (def.side === 'left') {
          return { centerX: def.baseX - LAND_CONTACT - radius, centerY: midpoint, radius };
        }
        return { centerX: def.baseX + LAND_CONTACT + radius, centerY: midpoint, radius };
      }

      function tick(t) {
        const dt = Math.max(0, Math.min(1 / 30, (t - lastT) / 1000));
        lastT = t;
        now += dt;

        if (gameOver) {
          updateGameOver(dt);
          draw();
          if (!gameOver.blank) raf = requestAnimationFrame(tick);
          return;
        }

        launchPendingAttacks();

        if (now >= nextAttackAt && attacks.length + pendingAttacks.length < MAX_ATTACKS) {
          const volley = launchVolley(nextSide);
          nextSide = nextShooterSide(nextSide);
          nextAttackAt = now + (
            volley.count === 0
              ? 0.14
              : volley.spasm ? rand(0.48, 0.72) : rand(0.72, 1.18)
          );
        }

        updateLastBullet(dt);
        if (!gameOver) {
          updateDefenders(dt);
          updateBullets(dt);
          if (lastBullet) updateFocusBattle(dt);
        }
        updateSparks(dt);
        screenShake = Math.max(0, screenShake - dt * 1.8);
        whiteFlash = Math.max(0, whiteFlash - dt * 2.35);
        draw();
        raf = requestAnimationFrame(tick);
      }

      function launchVolley(side) {
        const available = availableAmmo(side);
        if (!defenders[side].alive || available <= 0) return { count: 0, spasm: false };
        const mood = Math.random();
        const spasm = mood > 0.82;
        const requestedCount = spasm
          ? Math.floor(rand(5, 9))
          : mood > 0.56 ? 3 : mood > 0.3 ? 2 : 1;
        const count = Math.min(requestedCount, available);
        const aggression = spasm ? 1 : count === 1 ? rand(0.15, 0.65) : rand(0.62, 1);
        const cadence = spasm
          ? rand(0.045, 0.085)
          : aggression > 0.75 ? rand(0.1, 0.16) : rand(0.16, 0.25);
        const shooter = defenders[side];
        const targetSide = OPPOSITE[side];
        const targetPoint = pickTargetPoint(targetSide, aggression);
        const openingRange = (shooter.axis === 'x' ? W : H) * 0.045 * aggression;
        setDefenderGoal(shooter, targetPoint.x, targetPoint.y, rand(-openingRange, openingRange));
        for (let i = 0; i < count; i++) {
          pendingAttacks.push({
            side,
            fireAt: now + i * cadence,
            aggression,
            targetSide,
            targetPoint,
            shotIndex: i,
            shotCount: count,
          });
        }
        return { count, spasm };
      }

      function launchPendingAttacks() {
        for (let i = 0; i < pendingAttacks.length;) {
          const shot = pendingAttacks[i];
          if (shot.fireAt > now) {
            i++;
            continue;
          }
          if (attacks.length >= MAX_ATTACKS) {
            i++;
            continue;
          }
          launchAttack(shot);
          pendingAttacks.splice(i, 1);
        }
      }

      function launchAttack(shot) {
        const side = shot.side;
        const shooter = defenders[side];
        if (!useAmmunition(shooter)) return;
        const pathAngle = Math.atan2(shot.targetPoint.y - shooter.y, shot.targetPoint.x - shooter.x);
        const spread = (shot.shotIndex - (shot.shotCount - 1) / 2) * rand(30, 58);
        const px = -Math.sin(pathAngle);
        const py = Math.cos(pathAngle);
        const railSpan = shooter.axis === 'x' ? W : H;
        const lunge = rand(-1, 1) * railSpan * (0.025 + shot.aggression * 0.06);
        const target = constrainTargetToSide(
          shot.targetSide,
          shot.targetPoint.x + px * spread + rand(-18, 18),
          shot.targetPoint.y + py * spread + rand(-18, 18),
        );
        const muzzle = muzzlePoint(shooter, target.x, target.y, MUZZLE_LENGTH);
        const startX = muzzle.x;
        const startY = muzzle.y;
        const speed = rand(ATTACK_SPEED_MIN, ATTACK_SPEED_MAX + shot.aggression * 120);
        const travel = Math.hypot(target.x - startX, target.y - startY);
        const targetDelay = Math.max(0.64, travel / speed);
        const targetTime = now + targetDelay;
        const vx = (target.x - startX) / targetDelay;
        const vy = (target.y - startY) / targetDelay;
        const id = attackId++;

        setDefenderGoal(shooter, target.x, target.y, lunge * 0.35 + rand(-42, 42));
        shooter.aimX = target.x;
        shooter.aimY = target.y;
        shooter.muzzleGlow = 1;

        const attack = {
          id,
          owner: side,
          targetSide: shot.targetSide,
          x: startX,
          y: startY,
          px: startX,
          py: startY,
          vx,
          vy,
          startX,
          startY,
          targetX: target.x,
          targetY: target.y,
          targetTime,
          r: 4,
          color: COLORS.attack,
          aggression: shot.aggression,
          armed: true,
        };
        attacks.push(attack);

        planCounter(attack);
      }

      function planCounter(attack) {
        const side = pickInterceptor(attack);
        if (!side) return;
        const defender = defenders[side];
        const lateSave = Math.random() < 0.38;
        const interceptProgress = lateSave ? rand(0.80, 0.93) : rand(0.54, 0.76);
        const impactX = attack.startX + (attack.targetX - attack.startX) * interceptProgress;
        const impactY = attack.startY + (attack.targetY - attack.startY) * interceptProgress;
        const impactTime = now + (attack.targetTime - now) * interceptProgress;
        const timeToImpact = impactTime - now;
        const safetyWindow = lateSave ? rand(0.13, 0.23) : rand(0.34, 0.72);
        const reaction = lateSave
          ? Math.max(0.14, timeToImpact - safetyWindow)
          : clamp(rand(0.18, 0.46), 0.14, Math.max(0.14, timeToImpact - safetyWindow));
        const fireTime = now + reaction;
        const danceOffset = lateSave ? rand(-32, 32) : rand(-82, 82);
        setDefenderGoal(defender, impactX, impactY, danceOffset);
        defender.aimX = impactX;
        defender.aimY = impactY;

        counters.push({
          owner: side,
          targetId: attack.id,
          x: defender.x,
          y: defender.y,
          px: defender.x,
          py: defender.y,
          vx: 0,
          vy: 0,
          r: lateSave ? 4.1 : 3.4,
          color: defender.color,
          fireTime,
          impactTime,
          impactX,
          impactY,
          lateSave,
          startX: defender.x,
          startY: defender.y,
          fired: false,
          done: false,
        });
      }

      function pickInterceptor(attack) {
        const eligible = SIDES.filter((side) => (
          side !== attack.owner
          && defenders[side].alive
          && (!lastBullet || side !== lastBullet.targetSide)
          && availableAmmo(side) > 0
        ));
        if (eligible.length === 0) return null;
        const volunteers = eligible.filter(() => Math.random() < 0.62);
        const pool = volunteers.length > 0 ? volunteers : eligible;
        return pool[(Math.random() * pool.length) | 0];
      }

      function pickTargetPoint(targetSide, aggression) {
        const target = defenders[targetSide];
        const spread = (target.axis === 'x' ? W : H) * (0.025 + aggression * 0.05);
        const coord = clamp(target.coord + rand(-spread, spread), target.railMin, target.railMax);
        const point = pointOnLand(target, coord);
        return { x: point.x, y: point.y };
      }

      function constrainTargetToSide(side, x, y) {
        const target = defenders[side];
        const coord = target.axis === 'x'
          ? clamp(x, target.railMin, target.railMax)
          : clamp(y, target.railMin, target.railMax);
        const point = pointOnLand(target, coord);
        return { x: point.x, y: point.y };
      }

      function availableAmmo(side) {
        if (
          !defenders[side].alive
          || gameOver
          || (lastBullet && side === lastBullet.targetSide)
        ) return 0;
        const reservedAttacks = pendingAttacks.filter((b) => b.side === side).length;
        const reservedCounters = counters.filter((b) => b.owner === side && !b.fired && !b.done).length;
        return Math.max(0, defenders[side].ammo - reservedAttacks - reservedCounters);
      }

      function useAmmunition(defender) {
        if (!defender.alive || defender.ammo <= 0 || gameOver) return false;
        if (defender.ammo === 1) {
          if (!lastBullet) fireLastBullet(defender);
          return false;
        }
        defender.ammo -= 1;
        return true;
      }

      function fireLastBullet(defender) {
        defender.ammo = 0;
        defender.bossLaunchFlash = 1;
        const targetSide = OPPOSITE[defender.side];
        const opponent = defenders[targetSide];
        const targetX = opponent.x;
        const targetY = opponent.y;
        const muzzle = muzzlePoint(defender, targetX, targetY, MUZZLE_LENGTH + 8);
        const travel = Math.hypot(targetX - muzzle.x, targetY - muzzle.y);
        const travelDuration = travel / BOSS_BULLET_SPEED;
        lastBullet = {
          owner: defender.side,
          targetSide,
          x: muzzle.x,
          y: muzzle.y,
          px: muzzle.x,
          py: muzzle.y,
          startX: muzzle.x,
          startY: muzzle.y,
          targetX,
          targetY,
          vx: (targetX - muzzle.x) / travelDuration,
          vy: (targetY - muzzle.y) / travelDuration,
          radius: clamp(Math.min(W, H) * 0.035, 22, 30),
          hits: 0,
          age: 0,
          targetTime: now + travelDuration,
          hitFlash: 0,
          color: defender.color,
        };
        defender.aimX = targetX;
        defender.aimY = targetY;
        defender.muzzleGlow = 1;
        opponent.nextFocusShotAt = now + 0.05;
        opponent.aimX = muzzle.x;
        opponent.aimY = muzzle.y;
        pendingAttacks = pendingAttacks.filter((shot) => shot.side !== targetSide);
        counters = counters.filter((counter) => counter.owner !== targetSide || counter.fired);
        burst(muzzle.x, muzzle.y, defender.color, COLORS.superCore);
        whiteFlash = REDUCED_MOTION ? 0.04 : 0.1;
      }

      function setDefenderGoal(def, targetX, targetY, offset) {
        const coord = def.axis === 'x' ? targetX : targetY;
        def.goalCoord = clamp(coord + offset, def.railMin, def.railMax);
      }

      function muzzlePoint(def, targetX, targetY, length) {
        const angle = Math.atan2(targetY - def.y, targetX - def.x);
        return {
          x: def.x + Math.cos(angle) * length,
          y: def.y + Math.sin(angle) * length,
        };
      }

      function pointOnLand(def, coord) {
        const land = def.land;
        const boundedCoord = clamp(coord, def.railMin, def.railMax);
        let surfaceX;
        let surfaceY;

        if (def.axis === 'x') {
          const dx = boundedCoord - land.centerX;
          const arc = Math.sqrt(Math.max(0, land.radius * land.radius - dx * dx));
          surfaceX = boundedCoord;
          surfaceY = def.side === 'top' ? land.centerY + arc : land.centerY - arc;
        } else {
          const dy = boundedCoord - land.centerY;
          const arc = Math.sqrt(Math.max(0, land.radius * land.radius - dy * dy));
          surfaceX = def.side === 'left' ? land.centerX + arc : land.centerX - arc;
          surfaceY = boundedCoord;
        }

        const inwardX = (land.centerX - surfaceX) / land.radius;
        const inwardY = (land.centerY - surfaceY) / land.radius;
        return {
          x: surfaceX - inwardX * LAND_CONTACT,
          y: surfaceY - inwardY * LAND_CONTACT,
          angle: Math.atan2(-inwardX, inwardY),
        };
      }

      function applyDefenderPosition(def) {
        const point = pointOnLand(def, def.coord);
        def.x = point.x;
        def.y = point.y;
        def.surfaceAngle = point.angle;
      }

      function updateDefenders(dt) {
        for (const def of Object.values(defenders)) {
          if (!def.alive) continue;
          const facingBoss = lastBullet && def.side === lastBullet.targetSide;
          const escapingBoss = lastBullet && !facingBoss;
          if (facingBoss) {
            def.aimX = lastBullet.x;
            def.aimY = lastBullet.y;
            def.goalCoord = clamp(
              def.axis === 'x' ? lastBullet.x : lastBullet.y,
              def.railMin,
              def.railMax,
            );
          } else if (escapingBoss) {
            const bulletCoord = def.axis === 'x' ? lastBullet.x : lastBullet.y;
            const minDistance = Math.abs(bulletCoord - def.railMin);
            const maxDistance = Math.abs(bulletCoord - def.railMax);
            def.goalCoord = minDistance > maxDistance ? def.railMin : def.railMax;
          }
          const drift = lastBullet ? 0 : Math.sin(now * 1.4 + def.wobble + driftSeed) * 24;
          const shimmer = lastBullet ? 0 : Math.sin(now * 3.1 + def.wobble * 0.6) * 6;
          const target = clamp(def.goalCoord + drift + shimmer, def.railMin, def.railMax);
          const movementRate = facingBoss ? 8.5 : escapingBoss ? 7.2 : 4.2;
          def.coord = ease(def.coord, target, Math.min(1, dt * movementRate));
          applyDefenderPosition(def);
          def.muzzleGlow = Math.max(0, def.muzzleGlow - dt * 4.6);
          def.bossLaunchFlash = Math.max(0, def.bossLaunchFlash - dt * 2.5);
        }
      }

      function updateBullets(dt) {
        for (const b of attacks) {
          b.px = b.x;
          b.py = b.y;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        }

        for (const b of counters) {
          if (b.done) continue;
          if (!b.fired && now >= b.fireTime) fireCounter(b);
          if (!b.fired) continue;
          b.px = b.x;
          b.py = b.y;
          const span = Math.max(0.001, b.impactTime - b.fireTime);
          const p = clamp((now - b.fireTime) / span, 0, 1);
          b.x = b.startX + (b.impactX - b.startX) * p;
          b.y = b.startY + (b.impactY - b.startY) * p;
          if (now >= b.impactTime && resolveInterception(b)) break;
        }

        for (const attack of attacks) {
          if (attack.armed && now >= attack.targetTime) resolveSideImpact(attack);
        }

        attacks = attacks.filter((b) => b.armed && b.x > -80 && b.x < W + 80 && b.y > -80 && b.y < H + 80);
        counters = counters.filter((b) => !b.done && b.x > -90 && b.x < W + 90 && b.y > -90 && b.y < H + 90);
      }

      function fireCounter(counter) {
        const def = defenders[counter.owner];
        const attack = attacks.find((b) => b.id === counter.targetId && b.armed);
        if (!attack || attack.owner === counter.owner || !useAmmunition(def)) {
          counter.done = true;
          return;
        }
        const muzzle = muzzlePoint(def, counter.impactX, counter.impactY, MUZZLE_LENGTH);
        counter.x = muzzle.x;
        counter.y = muzzle.y;
        counter.px = counter.x;
        counter.py = counter.y;
        counter.startX = counter.x;
        counter.startY = counter.y;
        const dt = Math.max(0.18, counter.impactTime - now);
        counter.vx = (counter.impactX - counter.x) / dt;
        counter.vy = (counter.impactY - counter.y) / dt;
        counter.fired = true;
        def.aimX = counter.impactX;
        def.aimY = counter.impactY;
        def.muzzleGlow = 1;
      }

      function resolveInterception(counter) {
        const attack = attacks.find((b) => b.id === counter.targetId);
        counter.done = true;
        if (attack) {
          counter.x = counter.impactX;
          counter.y = counter.impactY;
          attack.x = counter.impactX;
          attack.y = counter.impactY;
          attack.armed = false;
          burst(counter.impactX, counter.impactY, defenders[counter.owner].color, attack.color);
          shakeDefenders(counter.impactX, counter.impactY);
        }
        return false;
      }

      function resolveSideImpact(attack) {
        attack.x = attack.targetX;
        attack.y = attack.targetY;
        attack.armed = false;
        burst(attack.targetX, attack.targetY, defenders[attack.targetSide].color, attack.color);
        shakeDefenders(attack.targetX, attack.targetY);
      }

      function clearBullets() {
        attacks = [];
        counters = [];
        pendingAttacks = [];
        focusShots = [];
      }

      function updateLastBullet(dt) {
        if (!lastBullet) return;
        const bullet = lastBullet;
        bullet.age += dt;
        bullet.hitFlash = Math.max(0, bullet.hitFlash - dt * 5.5);
        bullet.px = bullet.x;
        bullet.py = bullet.y;
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        if (
          now >= bullet.targetTime
          || Math.hypot(bullet.targetX - bullet.x, bullet.targetY - bullet.y) <= bullet.radius
        ) detonateBossBullet();
      }

      function updateFocusBattle(dt) {
        const target = lastBullet;
        if (!target) return;

        const defender = defenders[target.targetSide];
        if (defender.alive && now >= defender.nextFocusShotAt) {
          fireFocusShot(defender, target);
          defender.nextFocusShotAt = now + rand(0.1, 0.16);
        }

        for (const shot of focusShots) {
          if (shot.done) continue;
          shot.px = shot.x;
          shot.py = shot.y;
          const dx = target.x - shot.x;
          const dy = target.y - shot.y;
          const distance = Math.max(0.001, Math.hypot(dx, dy));
          const desiredVx = dx / distance * shot.speed;
          const desiredVy = dy / distance * shot.speed;
          shot.vx = ease(shot.vx, desiredVx, Math.min(1, dt * 8));
          shot.vy = ease(shot.vy, desiredVy, Math.min(1, dt * 8));
          shot.x += shot.vx * dt;
          shot.y += shot.vy * dt;
          if (Math.hypot(target.x - shot.x, target.y - shot.y) <= target.radius + shot.r) {
            hitLastBullet(shot);
            if (!lastBullet || gameOver) break;
          }
        }
        focusShots = focusShots.filter((shot) => !shot.done && (
          shot.x > -100 && shot.x < W + 100 && shot.y > -100 && shot.y < H + 100
        ));
      }

      function fireFocusShot(defender, target) {
        const muzzle = muzzlePoint(defender, target.x, target.y, MUZZLE_LENGTH);
        const dx = target.x - muzzle.x;
        const dy = target.y - muzzle.y;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const speed = rand(720, 860);
        focusShots.push({
          owner: defender.side,
          x: muzzle.x,
          y: muzzle.y,
          px: muzzle.x,
          py: muzzle.y,
          vx: dx / distance * speed,
          vy: dy / distance * speed,
          speed,
          r: 4.4,
          color: defender.color,
          done: false,
        });
        defender.aimX = target.x;
        defender.aimY = target.y;
        defender.muzzleGlow = 1;
      }

      function hitLastBullet(shot) {
        const target = lastBullet;
        if (!target) return;
        shot.done = true;
        target.hits += 1;
        target.radius += BOSS_HIT_GROWTH;
        target.hitFlash = 1;
        screenShake = Math.max(screenShake, 0.15);
        impactSparks(shot.x, shot.y, shot.color, target.color);
      }

      function detonateBossBullet() {
        if (!lastBullet || gameOver) return;
        const x = lastBullet.x;
        const y = lastBullet.y;
        const maxRadius = Math.max(
          Math.hypot(x, y),
          Math.hypot(W - x, y),
          Math.hypot(x, H - y),
          Math.hypot(W - x, H - y),
        ) + 80;
        lastBullet = null;
        clearBullets();
        sparks = [];
        stars = [];
        for (const defender of Object.values(defenders)) {
          defender.alive = false;
          defender.ammo = 0;
          defender.muzzleGlow = 0;
        }
        gameOver = {
          x,
          y,
          age: 0,
          radius: REDUCED_MOTION ? maxRadius : 0,
          maxRadius,
          expandDuration: REDUCED_MOTION ? 0.01 : 1.05,
          fadeDuration: REDUCED_MOTION ? 0.12 : 0.8,
          alpha: 1,
          pulse: 1,
          shake: 0,
          blank: false,
        };
        screenShake = REDUCED_MOTION ? 0 : 1;
        whiteFlash = 0;
      }

      function updateGameOver(dt) {
        const blast = gameOver;
        if (!blast || blast.blank) return;
        blast.age += dt;
        const progress = clamp(blast.age / blast.expandDuration, 0, 1);
        blast.radius = blast.maxRadius * (1 - Math.pow(1 - progress, 3));
        blast.pulse = REDUCED_MOTION ? 1 : 1 + Math.sin(blast.age * 20) * 0.055;
        blast.shake = REDUCED_MOTION
          ? 0
          : blast.alpha * (5 + (1 - progress) * 12) * (0.62 + Math.abs(Math.sin(blast.age * 27)) * 0.38);
        const fadeStart = blast.expandDuration + 0.16;
        if (blast.age > fadeStart) {
          blast.alpha = clamp(1 - (blast.age - fadeStart) / blast.fadeDuration, 0, 1);
          if (blast.alpha <= 0) {
            blast.blank = true;
            blast.shake = 0;
          }
        }
      }

      function impactSparks(x, y, colorA, colorB) {
        for (let i = 0; i < 12; i++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(70, 230);
          sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            age: 0,
            life: rand(0.28, 0.62),
            color: Math.random() < 0.5 ? colorA : colorB,
            size: rand(1.5, 4.5),
          });
        }
      }

      function shakeDefenders(x, y) {
        for (const def of Object.values(defenders)) {
          if (!def.alive) continue;
          const delta = def.axis === 'x' ? def.x - x : def.y - y;
          const dir = Math.sign(delta) || (Math.random() < 0.5 ? -1 : 1);
          def.goalCoord = clamp(def.goalCoord + dir * rand(16, 52), def.railMin, def.railMax);
        }
      }

      function burst(x, y, colorA, colorB) {
        const count = Math.floor(rand(24, 38));
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + rand(-0.12, 0.12);
          const speed = rand(55, 190);
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            age: 0,
            life: rand(0.55, 1.05),
            color: Math.random() < 0.5 ? colorA : colorB,
            size: rand(1.2, 3.4),
          });
        }
        sparks.push({
          x,
          y,
          vx: 0,
          vy: 0,
          age: 0,
          life: 0.42,
          color: '#ffffff',
          size: 24,
          ring: true,
        });
      }

      function updateSparks(dt) {
        for (const s of sparks) {
          s.age += dt;
          if (!s.ring) {
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            s.vx *= Math.pow(0.26, dt);
            s.vy = s.vy * Math.pow(0.32, dt) + 42 * dt;
          }
        }
        sparks = sparks.filter((s) => s.age < s.life);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        if (gameOver) {
          drawGameOver();
          return;
        }
        drawField();
        drawLand();
        ctx.save();
        if (screenShake > 0) {
          const p = screenShake * screenShake;
          ctx.translate(rand(-18, 18) * p, rand(-14, 14) * p);
          ctx.rotate(rand(-0.012, 0.012) * p);
        }
        for (const b of attacks) drawBullet(b, b.color, 8);
        for (const b of counters) if (b.fired) drawBullet(b, b.color, 6);
        for (const b of focusShots) drawBullet(b, b.color, 12);
        drawLastBullet();
        drawSparks();
        for (const side of SIDES) if (defenders[side].alive) drawDefender(defenders[side]);
        drawAmmunition();
        ctx.restore();
        if (whiteFlash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${Math.min(0.96, whiteFlash * 0.96)})`;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawLand() {
        for (const side of SIDES) {
          const def = defenders[side];
          const land = def.land;
          ctx.fillStyle = def.color;
          ctx.beginPath();
          ctx.arc(land.centerX, land.centerY, land.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawField() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, W, H);

        for (const star of stars) {
          const twinkle = 0.65 + Math.sin(now * 1.7 + star.tw) * 0.35;
          ctx.fillStyle = `rgba(200, 224, 255, ${star.a * twinkle})`;
          ctx.fillRect(star.x, star.y, star.r, star.r);
        }
      }

      function drawBullet(b, color, glow) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = color;
        ctx.lineWidth = b.r * 1.2;
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
        ctx.beginPath();
        ctx.moveTo(b.px, b.py);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSparks() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const s of sparks) {
          const p = clamp(s.age / s.life, 0, 1);
          const alpha = 1 - p;
          if (s.ring) {
            ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.75})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * (0.4 + p * 2.8), 0, Math.PI * 2);
            ctx.stroke();
            continue;
          }
          ctx.fillStyle = hexA(s.color, alpha);
          ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
        }
        ctx.restore();
      }

      function drawLastBullet() {
        if (!lastBullet) return;
        const bullet = lastBullet;
        const pulse = REDUCED_MOTION ? 1 : 1 + Math.sin(now * 7.2) * 0.1;
        const radius = bullet.radius * pulse * (1 + bullet.hitFlash * 0.12);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        ctx.strokeStyle = hexA(bullet.color, 0.62);
        ctx.lineWidth = Math.max(2, radius * 0.16);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bullet.px, bullet.py);
        ctx.lineTo(bullet.x, bullet.y);
        ctx.stroke();

        const aura = ctx.createRadialGradient(
          bullet.x, bullet.y, radius * 0.18,
          bullet.x, bullet.y, radius * 1.9,
        );
        aura.addColorStop(0, `rgba(255,255,255,${0.34 + bullet.hitFlash * 0.24})`);
        aura.addColorStop(0.36, hexA(bullet.color, 0.28));
        aura.addColorStop(1, hexA(bullet.color, 0));
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, radius * 1.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = bullet.color;
        ctx.shadowBlur = 32 + bullet.hitFlash * 18;
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = COLORS.superCore;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawGameOver() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, W, H);
        if (gameOver.blank) return;
        ctx.save();
        if (gameOver.shake > 0) {
          ctx.translate(
            rand(-gameOver.shake, gameOver.shake),
            rand(-gameOver.shake, gameOver.shake),
          );
          ctx.rotate(rand(-0.006, 0.006) * Math.min(1, gameOver.shake / 10));
        }
        ctx.globalCompositeOperation = 'lighter';
        const energyPulse = REDUCED_MOTION
          ? 1
          : 0.84 + Math.abs(Math.sin(gameOver.age * 20)) * 0.16;
        const radius = Math.max(1, gameOver.radius * gameOver.pulse);
        ctx.fillStyle = `rgba(255,255,255,${gameOver.alpha * energyPulse})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 30 + energyPulse * 28;
        ctx.beginPath();
        ctx.arc(gameOver.x, gameOver.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${gameOver.alpha * 0.86})`;
        ctx.lineWidth = 5 + energyPulse * 5;
        ctx.beginPath();
        ctx.arc(gameOver.x, gameOver.y, Math.max(1, radius - 8), 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,241,168,${gameOver.alpha * 0.48})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(gameOver.x, gameOver.y, radius * 1.025, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawDefender(def) {
        const x = def.x;
        const y = def.y;
        const angle = Math.atan2(def.aimY - y, def.aimX - x);
        const barrelLen = 20 + def.muzzleGlow * 4;
        const bossReady = def.ammo === 1 && !lastBullet && !gameOver;
        const readyPulse = bossReady
          ? REDUCED_MOTION ? 0.72 : 0.5 + Math.sin(now * 8.4 + def.wobble) * 0.5
          : 0;
        const flashBeat = bossReady
          ? REDUCED_MOTION ? 0.28 : Math.pow(0.5 + Math.sin(now * 17 + def.wobble) * 0.5, 5)
          : 0;
        const charge = Math.max(readyPulse, def.bossLaunchFlash);
        const bodyScale = REDUCED_MOTION
          ? 1
          : 1 + readyPulse * 0.1 + def.bossLaunchFlash * 0.16;

        if (charge > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.shadowColor = def.color;
          ctx.shadowBlur = 18 + charge * 28;
          ctx.fillStyle = hexA(def.color, 0.1 + charge * 0.2);
          ctx.beginPath();
          ctx.arc(x, y, 28 + charge * 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = hexA(def.color, 0.35 + charge * 0.4);
          ctx.lineWidth = 2 + charge * 2;
          ctx.beginPath();
          ctx.arc(x, y, 30 + charge * 12, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(bodyScale, bodyScale);
        ctx.rotate(def.surfaceAngle);

        ctx.shadowColor = def.color;
        ctx.shadowBlur = 12 + def.muzzleGlow * 10;
        ctx.fillStyle = def.color;
        ctx.fillRect(-DEFENDER_W / 2, 4, DEFENDER_W, 7);
        ctx.fillRect(-DEFENDER_W / 2 + 7, -3, DEFENDER_W - 14, 9);
        ctx.fillRect(-8, -10, 16, 11);

        if (charge > 0) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = clamp(flashBeat * 0.58 + def.bossLaunchFlash * 0.48, 0, 0.7);
          ctx.fillStyle = def.color;
          ctx.fillRect(-DEFENDER_W / 2, 4, DEFENDER_W, 7);
          ctx.fillRect(-DEFENDER_W / 2 + 7, -3, DEFENDER_W - 14, 9);
          ctx.fillRect(-8, -10, 16, 11);
        }
        ctx.restore();

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(bodyScale, bodyScale);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillStyle = def.color;
        ctx.fillRect(-3, -barrelLen, 6, barrelLen);
        ctx.fillRect(-5, -barrelLen - 2, 10, 4);
        ctx.restore();

        if (def.muzzleGlow > 0) {
          const mx = x + Math.cos(angle) * (barrelLen + 4);
          const my = y + Math.sin(angle) * (barrelLen + 4);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = hexA(def.color, def.muzzleGlow * 0.65);
          ctx.beginPath();
          ctx.arc(mx, my, 6 + def.muzzleGlow * 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

      }

      function drawAmmunition() {
        ctx.save();
        drawAmmoStock('top');
        drawAmmoStock('right');
        drawAmmoStock('bottom');
        drawAmmoStock('left');
        ctx.restore();
      }

      function drawAmmoStock(side) {
        const def = defenders[side];
        const horizontal = def.axis === 'x';
        const longEdge = horizontal ? W : H;
        const gap = 2;
        const longSize = clamp((longEdge - 76 - gap * (AMMO_CAPACITY - 1)) / AMMO_CAPACITY, 5, 9);
        const shortSize = 7;
        const bossExtra = 7;
        const stockLength = AMMO_CAPACITY * longSize + (AMMO_CAPACITY - 1) * gap + bossExtra;
        const bombPulse = REDUCED_MOTION ? 1 : 1 + Math.sin(now * 5.4) * 0.18;

        ctx.save();
        ctx.globalAlpha = def.alive ? 1 : 0.22;
        if (horizontal) {
          ctx.translate((W - stockLength) / 2, side === 'top' ? 10 : H - 17);
        } else {
          ctx.translate(side === 'left' ? 10 : W - 17, (H - stockLength) / 2);
        }

        for (let i = 0; i < AMMO_CAPACITY; i++) {
          const position = i * (longSize + gap) + (i > 0 ? bossExtra : 0);
          const x = horizontal ? position : 0;
          const y = horizontal ? 0 : position;
          const width = horizontal ? longSize : shortSize;
          const height = horizontal ? shortSize : longSize;
          const isBossRound = i === 0;
          const bossRadius = Math.max(5.5, Math.max(width, height) * 0.78);
          if (i < def.ammo) {
            if (isBossRound) {
              const pulse = def.ammo === 1 ? bombPulse : 1;
              const radius = bossRadius * pulse;
              const centerX = x + width / 2;
              const centerY = y + height / 2;
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              ctx.shadowColor = '#ffffff';
              ctx.shadowBlur = def.ammo === 1 ? 10 : 4;
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else {
              ctx.fillStyle = 'rgba(255,255,255,0.92)';
              ctx.fillRect(x, y, width, height);
            }
          } else {
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 1;
            if (isBossRound) {
              ctx.beginPath();
              ctx.arc(x + width / 2, y + height / 2, bossRadius, 0, Math.PI * 2);
              ctx.stroke();
            } else {
              ctx.strokeRect(x + 0.5, y + 0.5, Math.max(1, width - 1), Math.max(1, height - 1));
            }
          }
        }
        ctx.restore();
      }

      function hexA(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
      }

      addEventListener('resize', reset);
      addEventListener('click', reset);
      reset();
    </script>
  </body>
</html>
