<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Only Invaders · HyperGal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070a12; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      .caption {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: rgba(235, 244, 255, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .8rem;
        letter-spacing: .04em;
        text-align: left;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="caption">Only Invaders · 2026</div>
    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');

      const COLORS = {
        bg: '#070a12',
        grid: 'rgba(90, 126, 180, 0.10)',
        midline: 'rgba(235, 244, 255, 0.14)',
        top: '#ff6b9d',
        topSoft: 'rgba(255, 107, 157, 0.22)',
        bottom: '#7cf7c8',
        bottomSoft: 'rgba(124, 247, 200, 0.22)',
        left: '#8fb7ff',
        leftSoft: 'rgba(143, 183, 255, 0.22)',
        right: '#ffb86b',
        rightSoft: 'rgba(255, 184, 107, 0.22)',
        attack: '#f8ff9a',
        super: '#fff1a8',
        superCore: '#ffffff',
        text: 'rgba(235, 244, 255, 0.86)',
        dim: 'rgba(235, 244, 255, 0.40)',
      };

      const ATTACK_SPEED_MIN = 245;
      const ATTACK_SPEED_MAX = 320;
      const SUPER_CHANCE = 0.045;
      const MAX_ATTACKS = 7;
      const AMMO_CAPACITY = 30;
      const MUZZLE_GAP = 17;
      const DEFENDER_W = 58;
      const DEFENDER_H = 24;
      const SIDES = ['top', 'right', 'bottom', 'left'];
      const OPPOSITE = { top: 'bottom', right: 'left', bottom: 'top', left: 'right' };
      const BASE_ANGLE = { top: Math.PI, right: -Math.PI / 2, bottom: 0, left: Math.PI / 2 };
      const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0, H = 0, dpr = 1;
      let now = 0;
      let lastT = 0;
      let raf = 0;
      let nextAttackAt = 0;
      let nextSide = 'bottom';
      let attackId = 1;
      let driftSeed = Math.random() * 1000;
      let screenShake = 0;
      let whiteFlash = 0;
      let suicideNuke = null;

      const defenders = {
        top: makeDefender('top'),
        right: makeDefender('right'),
        bottom: makeDefender('bottom'),
        left: makeDefender('left'),
      };

      let attacks = [];
      let counters = [];
      let pendingAttacks = [];
      let sparks = [];
      let stars = [];

      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
      const ease = (v, target, amount) => v + (target - v) * amount;
      const nextShooterSide = (side) => SIDES[(SIDES.indexOf(side) + 1) % SIDES.length];

      function makeDefender(side) {
        return {
          side,
          axis: side === 'top' || side === 'bottom' ? 'x' : 'y',
          color: COLORS[side],
          softColor: COLORS[side + 'Soft'],
          x: 0,
          y: 0,
          baseX: 0,
          baseY: 0,
          coord: 0,
          goalCoord: 0,
          railMin: 0,
          railMax: 0,
          aimX: 0,
          aimY: 0,
          wobble: Math.random() * Math.PI * 2,
          muzzleGlow: 0,
          chargeStart: -1,
          chargeUntil: -1,
          ammo: AMMO_CAPACITY,
          alive: true,
        };
      }

      function reset() {
        cancelAnimationFrame(raf);
        dpr = Math.min(2, window.devicePixelRatio || 1);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        configureDefenders();

        attacks = [];
        counters = [];
        pendingAttacks = [];
        sparks = [];
        stars = makeStars();
        now = 0;
        lastT = performance.now();
        nextSide = SIDES[(Math.random() * SIDES.length) | 0];
        nextAttackAt = 0.45;
        driftSeed = Math.random() * 1000;
        screenShake = 0;
        whiteFlash = 0;
        suicideNuke = null;
        raf = requestAnimationFrame(tick);
      }

      function makeStars() {
        const count = clamp(Math.floor((W * H) / 9000), 44, 130);
        return Array.from({ length: count }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.3,
          a: Math.random() * 0.55 + 0.10,
          tw: Math.random() * Math.PI * 2,
        }));
      }

      function configureDefenders() {
        const padX = Math.max(58, W * 0.06);
        const padY = Math.max(58, H * 0.09);
        const specs = {
          top:    { baseX: W * 0.52, baseY: padY,     coord: W * 0.52, min: padX, max: W - padX },
          right:  { baseX: W - padX, baseY: H * 0.48, coord: H * 0.48, min: padY, max: H - padY },
          bottom: { baseX: W * 0.48, baseY: H - padY, coord: W * 0.48, min: padX, max: W - padX },
          left:   { baseX: padX,     baseY: H * 0.52, coord: H * 0.52, min: padY, max: H - padY },
        };
        for (const side of SIDES) {
          const def = defenders[side];
          const spec = specs[side];
          def.baseX = spec.baseX;
          def.baseY = spec.baseY;
          def.coord = spec.coord;
          def.goalCoord = spec.coord;
          def.railMin = spec.min;
          def.railMax = spec.max;
          def.ammo = AMMO_CAPACITY;
          def.alive = true;
          def.chargeStart = -1;
          def.chargeUntil = -1;
          def.muzzleGlow = 0;
          def.aimX = W / 2;
          def.aimY = H / 2;
          applyDefenderPosition(def, 0);
        }
      }

      function tick(t) {
        const dt = Math.max(0, Math.min(1 / 30, (t - lastT) / 1000));
        lastT = t;
        now += dt;

        if (!suicideNuke) launchPendingAttacks();

        if (!suicideNuke && now >= nextAttackAt && attacks.length + pendingAttacks.length < MAX_ATTACKS) {
          const volley = launchVolley(nextSide);
          nextSide = nextShooterSide(nextSide);
          nextAttackAt = now + (volley.count === 0 ? 0.18 : volley.super ? rand(2.4, 3.8) : rand(0.82, 1.46));
        }

        updateDefenders(dt);
        updateBullets(dt);
        updateSuicideNuke(dt);
        updateSparks(dt);
        screenShake = Math.max(0, screenShake - dt * 1.8);
        whiteFlash = Math.max(0, whiteFlash - dt * 2.35);
        draw();
        raf = requestAnimationFrame(tick);
      }

      function launchVolley(side) {
        const available = availableAmmo(side);
        if (!defenders[side].alive || available <= 0) return { count: 0, super: false };
        const superReady = !attacks.some((b) => b.super) && !pendingAttacks.some((b) => b.super);
        const superShot = superReady && Math.random() < SUPER_CHANCE;
        const mood = Math.random();
        const requestedCount = superShot ? 1 : mood > 0.76 ? 3 : mood > 0.48 ? 2 : 1;
        const count = Math.min(requestedCount, available);
        const aggression = superShot ? 1 : count === 1 ? rand(0.15, 0.65) : rand(0.62, 1);
        const cadence = superShot ? 0 : aggression > 0.75 ? rand(0.11, 0.18) : rand(0.18, 0.28);
        const chargeDelay = superShot ? rand(0.68, 0.92) : 0;
        const shooter = defenders[side];
        const targetSide = pickTargetSide(side);
        const targetPoint = pickTargetPoint(targetSide, aggression);
        setDefenderGoal(shooter, targetPoint.x, targetPoint.y, W * 0.08 * aggression);
        if (superShot) {
          shooter.aimX = targetPoint.x;
          shooter.aimY = targetPoint.y;
          shooter.chargeStart = now;
          shooter.chargeUntil = now + chargeDelay;
        }
        for (let i = 0; i < count; i++) {
          pendingAttacks.push({
            side,
            fireAt: now + chargeDelay + i * cadence,
            aggression,
            targetSide,
            targetPoint,
            shotIndex: i,
            shotCount: count,
            super: superShot,
          });
        }
        return { count, super: superShot };
      }

      function launchPendingAttacks() {
        for (let i = 0; i < pendingAttacks.length;) {
          const shot = pendingAttacks[i];
          if (shot.fireAt > now) {
            i++;
            continue;
          }
          if (attacks.length >= MAX_ATTACKS) {
            i++;
            continue;
          }
          launchAttack(shot);
          pendingAttacks.splice(i, 1);
        }
      }

      function launchAttack(shot) {
        const side = shot.side;
        const shooter = defenders[side];
        if (!useAmmunition(shooter)) return;
        const pathAngle = Math.atan2(shot.targetPoint.y - shooter.y, shot.targetPoint.x - shooter.x);
        const spread = (shot.shotIndex - (shot.shotCount - 1) / 2) * rand(30, 58);
        const px = -Math.sin(pathAngle);
        const py = Math.cos(pathAngle);
        const lunge = rand(-1, 1) * W * (0.04 + shot.aggression * 0.10);
        const target = constrainTargetToSide(
          shot.targetSide,
          shot.targetPoint.x + px * spread + rand(-18, 18),
          shot.targetPoint.y + py * spread + rand(-18, 18),
        );
        const muzzle = muzzlePoint(shooter, target.x, target.y, shot.super ? 42 : 34);
        const startX = muzzle.x;
        const startY = muzzle.y;
        const speed = shot.super
          ? rand(185, 245)
          : rand(ATTACK_SPEED_MIN, ATTACK_SPEED_MAX + shot.aggression * 120);
        const travel = Math.hypot(target.x - startX, target.y - startY);
        const targetDelay = Math.max(shot.super ? 1.08 : 0.64, travel / speed);
        const targetTime = now + targetDelay;
        const vx = (target.x - startX) / targetDelay;
        const vy = (target.y - startY) / targetDelay;
        const id = attackId++;

        setDefenderGoal(shooter, target.x, target.y, lunge * 0.35 + rand(-42, 42));
        shooter.aimX = target.x;
        shooter.aimY = target.y;
        shooter.muzzleGlow = 1;

        const attack = {
          id,
          owner: side,
          targetSide: shot.targetSide,
          x: startX,
          y: startY,
          px: startX,
          py: startY,
          vx,
          vy,
          startX,
          startY,
          targetX: target.x,
          targetY: target.y,
          targetTime,
          r: shot.super ? 11 : 4,
          color: shot.super ? COLORS.super : COLORS.attack,
          aggression: shot.aggression,
          super: shot.super,
          armed: true,
        };
        attacks.push(attack);

        planCounter(attack);
      }

      function planCounter(attack) {
        const side = attack.targetSide;
        const defender = defenders[side];
        // A cannon may only answer a projectile physically headed for its own
        // edge. Reserving the round here prevents late-game overspend.
        if (!defender.alive || availableAmmo(side) <= 0) return;
        const lateSave = attack.super ? true : Math.random() < 0.38;
        const interceptProgress = attack.super
          ? rand(0.82, 0.91)
          : lateSave ? rand(0.80, 0.93) : rand(0.54, 0.76);
        const impactX = attack.startX + (attack.targetX - attack.startX) * interceptProgress;
        const impactY = attack.startY + (attack.targetY - attack.startY) * interceptProgress;
        const impactTime = now + (attack.targetTime - now) * interceptProgress;
        const timeToImpact = impactTime - now;
        const safetyWindow = attack.super ? rand(0.16, 0.26) : lateSave ? rand(0.13, 0.23) : rand(0.34, 0.72);
        const reaction = lateSave
          ? Math.max(0.14, timeToImpact - safetyWindow)
          : clamp(rand(0.18, 0.46), 0.14, Math.max(0.14, timeToImpact - safetyWindow));
        const fireTime = now + reaction;
        const danceOffset = lateSave ? rand(-46, 46) : rand(-118, 118);
        setDefenderGoal(defender, impactX, impactY, danceOffset);
        defender.aimX = impactX;
        defender.aimY = impactY;

        counters.push({
          owner: side,
          targetId: attack.id,
          x: defender.x,
          y: defender.y,
          px: defender.x,
          py: defender.y,
          vx: 0,
          vy: 0,
          r: attack.super ? 5.7 : lateSave ? 4.1 : 3.4,
          color: defender.color,
          fireTime,
          impactTime,
          impactX,
          impactY,
          lateSave,
          targetSuper: attack.super,
          startX: defender.x,
          startY: defender.y,
          fired: false,
          done: false,
        });
      }

      function pickTargetSide(side) {
        if (Math.random() < 0.55) return OPPOSITE[side];
        const choices = SIDES.filter((s) => s !== side && s !== OPPOSITE[side]);
        return choices[(Math.random() * choices.length) | 0];
      }

      function pickTargetPoint(targetSide, aggression) {
        const target = defenders[targetSide];
        const spread = (target.axis === 'x' ? W : H) * (0.025 + aggression * 0.05);
        const coord = clamp(target.coord + rand(-spread, spread), target.railMin, target.railMax);
        return target.axis === 'x'
          ? { x: coord, y: target.baseY }
          : { x: target.baseX, y: coord };
      }

      function constrainTargetToSide(side, x, y) {
        const target = defenders[side];
        return target.axis === 'x'
          ? { x: clamp(x, target.railMin, target.railMax), y: target.baseY }
          : { x: target.baseX, y: clamp(y, target.railMin, target.railMax) };
      }

      function availableAmmo(side) {
        if (!defenders[side].alive || suicideNuke) return 0;
        const reservedAttacks = pendingAttacks.filter((b) => b.side === side).length;
        const reservedCounters = counters.filter((b) => b.owner === side && !b.fired && !b.done).length;
        return Math.max(0, defenders[side].ammo - reservedAttacks - reservedCounters);
      }

      function useAmmunition(defender) {
        if (!defender.alive || defender.ammo <= 0 || suicideNuke) return false;
        if (defender.ammo === 1) {
          triggerSuicideNuke(defender);
          return false;
        }
        defender.ammo -= 1;
        return true;
      }

      function triggerSuicideNuke(defender) {
        defender.ammo = 0;
        clearBullets();
        const maxRadius = Math.max(
          Math.hypot(defender.x, defender.y),
          Math.hypot(W - defender.x, defender.y),
          Math.hypot(defender.x, H - defender.y),
          Math.hypot(W - defender.x, H - defender.y),
        ) + 48;
        suicideNuke = {
          owner: defender.side,
          x: defender.x,
          y: defender.y,
          radius: REDUCED_MOTION ? maxRadius : 0,
          maxRadius,
          age: 0,
          expandDuration: REDUCED_MOTION ? 0 : 1.75,
          alpha: 1,
        };
        killDefender(defender, true);
        atomicBurst(defender.x, defender.y, defender.color, COLORS.super);
        whiteFlash = REDUCED_MOTION ? 0.22 : 0.48;
        if (REDUCED_MOTION) {
          screenShake = 0;
          for (const other of Object.values(defenders)) killDefender(other, false);
        }
      }

      function killDefender(defender, origin) {
        if (!defender.alive) return;
        defender.alive = false;
        defender.chargeStart = -1;
        defender.chargeUntil = -1;
        defender.muzzleGlow = 0;
        if (!origin) {
          burst(defender.x, defender.y, defender.color, COLORS.superCore);
          for (let i = 0; i < 18; i++) {
            sparks.push({
              x: defender.x,
              y: defender.y,
              vx: rand(-230, 230),
              vy: rand(-230, 230),
              age: 0,
              life: rand(0.65, 1.25),
              color: Math.random() < 0.7 ? defender.color : '#ffffff',
              size: rand(2.5, 6),
            });
          }
        }
      }

      function setDefenderGoal(def, targetX, targetY, offset) {
        const coord = def.axis === 'x' ? targetX : targetY;
        def.goalCoord = clamp(coord + offset, def.railMin, def.railMax);
      }

      function muzzlePoint(def, targetX, targetY, length) {
        const angle = Math.atan2(targetY - def.y, targetX - def.x);
        return {
          x: def.x + Math.cos(angle) * length,
          y: def.y + Math.sin(angle) * length,
        };
      }

      function applyDefenderPosition(def, wobble) {
        if (def.axis === 'x') {
          def.x = def.coord;
          def.y = def.baseY + wobble * (def.side === 'top' ? 1 : -1);
        } else {
          def.x = def.baseX + wobble * (def.side === 'left' ? 1 : -1);
          def.y = def.coord;
        }
      }

      function updateDefenders(dt) {
        for (const def of Object.values(defenders)) {
          if (!def.alive) continue;
          const drift = Math.sin(now * 1.4 + def.wobble + driftSeed) * 36;
          const shimmer = Math.sin(now * 3.1 + def.wobble * 0.6) * 9;
          const target = clamp(def.goalCoord + drift + shimmer, def.railMin, def.railMax);
          def.coord = ease(def.coord, target, Math.min(1, dt * 4.2));
          applyDefenderPosition(def, Math.sin(now * 2.2 + def.wobble) * 3);
          def.muzzleGlow = Math.max(0, def.muzzleGlow - dt * 4.6);
        }
      }

      function updateBullets(dt) {
        for (const b of attacks) {
          b.px = b.x;
          b.py = b.y;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        }

        for (const b of counters) {
          if (b.done) continue;
          if (!b.fired && now >= b.fireTime) fireCounter(b);
          if (suicideNuke) break;
          if (!b.fired) continue;
          b.px = b.x;
          b.py = b.y;
          const span = Math.max(0.001, b.impactTime - b.fireTime);
          const p = clamp((now - b.fireTime) / span, 0, 1);
          b.x = b.startX + (b.impactX - b.startX) * p;
          b.y = b.startY + (b.impactY - b.startY) * p;
          if (now >= b.impactTime && resolveInterception(b)) break;
        }

        for (const attack of attacks) {
          if (attack.armed && now >= attack.targetTime) resolveSideImpact(attack);
        }

        attacks = attacks.filter((b) => b.armed && b.x > -80 && b.x < W + 80 && b.y > -80 && b.y < H + 80);
        counters = counters.filter((b) => !b.done && b.x > -90 && b.x < W + 90 && b.y > -90 && b.y < H + 90);
      }

      function fireCounter(counter) {
        const def = defenders[counter.owner];
        const attack = attacks.find((b) => b.id === counter.targetId && b.armed);
        if (!attack || attack.targetSide !== counter.owner || !useAmmunition(def)) {
          counter.done = true;
          return;
        }
        const muzzle = muzzlePoint(def, counter.impactX, counter.impactY, counter.targetSuper ? 38 : 34);
        counter.x = muzzle.x;
        counter.y = muzzle.y;
        counter.px = counter.x;
        counter.py = counter.y;
        counter.startX = counter.x;
        counter.startY = counter.y;
        const dt = Math.max(0.18, counter.impactTime - now);
        counter.vx = (counter.impactX - counter.x) / dt;
        counter.vy = (counter.impactY - counter.y) / dt;
        counter.fired = true;
        def.aimX = counter.impactX;
        def.aimY = counter.impactY;
        def.muzzleGlow = 1;
      }

      function resolveInterception(counter) {
        const attack = attacks.find((b) => b.id === counter.targetId);
        counter.done = true;
        if (attack) {
          counter.x = counter.impactX;
          counter.y = counter.impactY;
          attack.x = counter.impactX;
          attack.y = counter.impactY;
          attack.armed = false;
          if (attack.super) {
            atomicBurst(counter.impactX, counter.impactY, defenders[counter.owner].color, attack.color);
            clearBullets();
            return true;
          } else {
            burst(counter.impactX, counter.impactY, defenders[counter.owner].color, attack.color);
          }
          shakeDefenders(counter.impactX, counter.impactY);
        }
        return false;
      }

      function resolveSideImpact(attack) {
        attack.x = attack.targetX;
        attack.y = attack.targetY;
        attack.armed = false;
        burst(attack.targetX, attack.targetY, defenders[attack.targetSide].color, attack.color);
        shakeDefenders(attack.targetX, attack.targetY);
      }

      function clearBullets() {
        attacks = [];
        counters = [];
        pendingAttacks = [];
      }

      function updateSuicideNuke(dt) {
        if (!suicideNuke) return;
        const nuke = suicideNuke;
        nuke.age += dt;
        if (!REDUCED_MOTION && nuke.radius < nuke.maxRadius) {
          const progress = clamp(nuke.age / nuke.expandDuration, 0, 1);
          nuke.radius = nuke.maxRadius * (1 - Math.pow(1 - progress, 2));
        }

        for (const defender of Object.values(defenders)) {
          if (!defender.alive) continue;
          const distance = Math.hypot(defender.x - nuke.x, defender.y - nuke.y);
          if (distance <= nuke.radius + DEFENDER_W * 0.45) killDefender(defender, false);
        }

        const fadeStart = nuke.expandDuration + 0.18;
        if (nuke.age > fadeStart) nuke.alpha = clamp(1 - (nuke.age - fadeStart) / 0.8, 0, 1);
      }

      function shakeDefenders(x, y) {
        for (const def of Object.values(defenders)) {
          if (!def.alive) continue;
          const delta = def.axis === 'x' ? def.x - x : def.y - y;
          const dir = Math.sign(delta) || (Math.random() < 0.5 ? -1 : 1);
          def.goalCoord = clamp(def.goalCoord + dir * rand(16, 52), def.railMin, def.railMax);
        }
      }

      function burst(x, y, colorA, colorB) {
        const count = Math.floor(rand(24, 38));
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + rand(-0.12, 0.12);
          const speed = rand(55, 190);
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            age: 0,
            life: rand(0.55, 1.05),
            color: Math.random() < 0.5 ? colorA : colorB,
            size: rand(1.2, 3.4),
          });
        }
        sparks.push({
          x,
          y,
          vx: 0,
          vy: 0,
          age: 0,
          life: 0.42,
          color: '#ffffff',
          size: 24,
          ring: true,
        });
      }

      function atomicBurst(x, y, colorA, colorB) {
        whiteFlash = 1;
        screenShake = 1;
        burst(x, y, colorA, colorB);
        const count = 90;
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + rand(-0.08, 0.08);
          const speed = rand(180, 560);
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            age: 0,
            life: rand(0.75, 1.55),
            color: Math.random() < 0.45 ? colorA : colorB,
            size: rand(2, 6.5),
          });
        }
        for (let i = 0; i < 4; i++) {
          sparks.push({
            x,
            y,
            vx: 0,
            vy: 0,
            age: -i * 0.08,
            life: 0.72 + i * 0.18,
            color: '#ffffff',
            size: 46 + i * 38,
            ring: true,
          });
        }
      }

      function updateSparks(dt) {
        for (const s of sparks) {
          s.age += dt;
          if (!s.ring) {
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            s.vx *= Math.pow(0.26, dt);
            s.vy = s.vy * Math.pow(0.32, dt) + 42 * dt;
          }
        }
        sparks = sparks.filter((s) => s.age < s.life);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (screenShake > 0) {
          const p = screenShake * screenShake;
          ctx.translate(rand(-18, 18) * p, rand(-14, 14) * p);
          ctx.rotate(rand(-0.012, 0.012) * p);
        }
        drawField();
        drawAimThreads();
        for (const b of attacks) drawBullet(b, b.color, b.super ? 24 : 8);
        for (const b of counters) if (b.fired) drawBullet(b, b.color, 6);
        drawSuicideNuke();
        drawSparks();
        for (const side of SIDES) if (defenders[side].alive) drawDefender(defenders[side]);
        drawAmmunition();
        ctx.restore();
        if (whiteFlash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${Math.min(0.96, whiteFlash * 0.96)})`;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawField() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, W, H);

        for (const star of stars) {
          const twinkle = 0.65 + Math.sin(now * 1.7 + star.tw) * 0.35;
          ctx.fillStyle = `rgba(200, 224, 255, ${star.a * twinkle})`;
          ctx.fillRect(star.x, star.y, star.r, star.r);
        }

        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1;
        const gap = Math.max(34, Math.min(58, W / 18));
        ctx.beginPath();
        for (let x = (now * 8) % gap; x < W; x += gap) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
        }
        for (let y = 0; y < H; y += gap) {
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
        }
        ctx.stroke();

        ctx.setLineDash([8, 12]);
        ctx.strokeStyle = COLORS.midline;
        ctx.beginPath();
        ctx.moveTo(0, H / 2);
        ctx.lineTo(W, H / 2);
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawAimThreads() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const c of counters) {
          if (c.fired || c.done) continue;
          const def = defenders[c.owner];
          const alpha = clamp((c.fireTime - now) / 0.55, 0.1, 0.55);
          ctx.strokeStyle = hexA(def.color, 0.34 * alpha);
          ctx.lineWidth = 1;
          ctx.beginPath();
          const muzzle = muzzlePoint(def, c.impactX, c.impactY, c.targetSuper ? 38 : 34);
          ctx.moveTo(muzzle.x, muzzle.y);
          ctx.lineTo(c.impactX, c.impactY);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBullet(b, color, glow) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = color;
        ctx.lineWidth = b.r * (b.super ? 1.55 : 1.2);
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
        ctx.beginPath();
        ctx.moveTo(b.px, b.py);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        if (b.super) {
          ctx.fillStyle = hexA(color, 0.18);
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 3.1, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.super) {
          ctx.fillStyle = COLORS.superCore;
          ctx.beginPath();
          ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.42, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawSparks() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const s of sparks) {
          const p = clamp(s.age / s.life, 0, 1);
          const alpha = 1 - p;
          if (s.ring) {
            ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.75})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * (0.4 + p * 2.8), 0, Math.PI * 2);
            ctx.stroke();
            continue;
          }
          ctx.fillStyle = hexA(s.color, alpha);
          ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
        }
        ctx.restore();
      }

      function drawSuicideNuke() {
        if (!suicideNuke || suicideNuke.alpha <= 0 || suicideNuke.radius < 1) return;
        const nuke = suicideNuke;
        const alpha = nuke.alpha;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(255,241,168,${alpha * 0.035})`;
        ctx.beginPath();
        ctx.arc(nuke.x, nuke.y, nuke.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 26;
        for (let i = 0; i < 3; i++) {
          const radius = Math.max(1, nuke.radius - i * 18);
          ctx.strokeStyle = i === 0
            ? `rgba(255,255,255,${alpha * 0.92})`
            : `rgba(255,241,168,${alpha * (0.46 - i * 0.12)})`;
          ctx.lineWidth = i === 0 ? 5 : 2;
          ctx.beginPath();
          ctx.arc(nuke.x, nuke.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDefender(def) {
        const x = def.x;
        const y = def.y;
        const angle = Math.atan2(def.aimY - y, def.aimX - x);
        const barrelLen = 28 + def.muzzleGlow * 6;
        const charging = def.chargeUntil > now;
        if (charging) {
          const p = clamp((now - def.chargeStart) / Math.max(0.001, def.chargeUntil - def.chargeStart), 0, 1);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = `rgba(255,241,168,${0.26 + p * 0.36})`;
          ctx.lineWidth = 2 + p * 3;
          ctx.beginPath();
          ctx.arc(x, y, 24 + Math.sin(now * 18) * 4 + p * 24, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,241,168,${0.10 + p * 0.22})`;
          ctx.beginPath();
          ctx.arc(x, y, 18 + p * 28, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(BASE_ANGLE[def.side]);

        ctx.save();
        ctx.shadowColor = def.color;
        ctx.shadowBlur = 18 + def.muzzleGlow * 14;
        ctx.fillStyle = def.softColor;
        ctx.fillRect(-DEFENDER_W / 2 - 10, -DEFENDER_H / 2 - 5, DEFENDER_W + 20, DEFENDER_H + 10);
        ctx.restore();

        ctx.fillStyle = def.color;
        ctx.fillRect(-DEFENDER_W / 2, 5, DEFENDER_W, 10);
        ctx.fillRect(-DEFENDER_W / 2 + 9, -4, DEFENDER_W - 18, 12);
        ctx.fillRect(-11, -13, 22, 14);

        ctx.fillStyle = 'rgba(255,255,255,0.76)';
        ctx.fillRect(-DEFENDER_W / 2 + 4, 7, DEFENDER_W - 8, 2);
        ctx.restore();

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillStyle = '#dfffee';
        ctx.fillRect(-4, -barrelLen, 8, barrelLen);
        ctx.fillStyle = def.color;
        ctx.fillRect(-7, -barrelLen - 3, 14, 5);
        ctx.restore();

        if (def.muzzleGlow > 0) {
          const mx = x + Math.cos(angle) * (barrelLen + 4);
          const my = y + Math.sin(angle) * (barrelLen + 4);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = hexA(def.color, def.muzzleGlow * 0.65);
          ctx.beginPath();
          ctx.arc(mx, my, 9 + def.muzzleGlow * 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.strokeStyle = def.softColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (def.axis === 'x') {
          const railY = def.baseY + (def.side === 'top' ? 32 : -32);
          ctx.moveTo(0, railY);
          ctx.lineTo(W, railY);
        } else {
          const railX = def.baseX + (def.side === 'left' ? 32 : -32);
          ctx.moveTo(railX, 0);
          ctx.lineTo(railX, H);
        }
        ctx.stroke();
      }

      function drawAmmunition() {
        ctx.save();
        drawAmmoStock('top');
        drawAmmoStock('right');
        drawAmmoStock('bottom');
        drawAmmoStock('left');
        ctx.restore();
      }

      function drawAmmoStock(side) {
        const def = defenders[side];
        const horizontal = def.axis === 'x';
        const longEdge = horizontal ? W : H;
        const gap = 2;
        const longSize = clamp((longEdge - 118 - gap * (AMMO_CAPACITY - 1)) / AMMO_CAPACITY, 3, 7);
        const shortSize = 5;
        const stockLength = AMMO_CAPACITY * longSize + (AMMO_CAPACITY - 1) * gap;
        const count = String(def.ammo).padStart(2, '0');
        const lastRoundPulse = REDUCED_MOTION ? 1 : 0.55 + Math.sin(now * 12) * 0.35;

        ctx.save();
        ctx.globalAlpha = def.alive ? 1 : 0.22;
        if (horizontal) {
          ctx.translate((W - stockLength) / 2, side === 'top' ? 10 : H - 15);
        } else {
          ctx.translate(side === 'left' ? 10 : W - 15, (H - stockLength) / 2);
        }

        for (let i = 0; i < AMMO_CAPACITY; i++) {
          const x = horizontal ? i * (longSize + gap) : 0;
          const y = horizontal ? 0 : i * (longSize + gap);
          const width = horizontal ? longSize : shortSize;
          const height = horizontal ? shortSize : longSize;
          if (i < def.ammo) {
            ctx.fillStyle = def.alive && def.ammo === 1
              ? hexA(def.color, lastRoundPulse)
              : def.color;
            ctx.fillRect(x, y, width, height);
          } else {
            ctx.strokeStyle = hexA(def.color, 0.18);
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 0.5, y + 0.5, Math.max(1, width - 1), Math.max(1, height - 1));
          }
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = def.alive ? 1 : 0.36;
        ctx.fillStyle = def.color;
        ctx.font = '700 12px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = def.alive ? `AMMO ${count}` : `DEAD ${count}`;
        if (side === 'top') {
          ctx.fillText(label, W / 2, 29);
        } else if (side === 'bottom') {
          ctx.fillText(label, W / 2, H - 29);
        } else {
          ctx.translate(side === 'left' ? 29 : W - 29, H / 2);
          ctx.rotate(side === 'left' ? -Math.PI / 2 : Math.PI / 2);
          ctx.fillText(label, 0, 0);
        }
        ctx.restore();
      }

      function hexA(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
      }

      addEventListener('resize', reset);
      addEventListener('click', reset);
      reset();
    </script>
  </body>
</html>
