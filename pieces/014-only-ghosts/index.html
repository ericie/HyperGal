<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Only Ghosts - HyperGal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      .caption {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        color: rgba(245, 247, 255, .62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: .8rem;
        letter-spacing: .04em;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
        white-space: nowrap;
      }
      .debug {
        position: fixed;
        left: .8rem;
        top: .7rem;
        margin: 0;
        color: rgba(245, 247, 255, .74);
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="caption">Only Ghosts - 2026 - click to reseed</div>
    <pre id="debug" class="debug" hidden></pre>
    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      const debugEl = document.getElementById('debug');
      const TAU = Math.PI * 2;

      const BASE_MAZE = [
        '#################',
        '#.....#...#.....#',
        '#.###.#.#.#.###.#',
        '#.#CC...#...CC#.#',
        '#.#CC.#####.CC#.#',
        '#.....#...#.....#',
        '#.###.#.#.#.###.#',
        '#.#CC...#...CC#.#',
        '#.#CC.#####.CC#.#',
        '#...............#',
        '#################',
      ];

      const ROWS = BASE_MAZE.length;
      const COLS = BASE_MAZE[0].length;
      for (const row of BASE_MAZE) {
        if (row.length !== COLS) throw new Error('Maze rows must be equal width.');
      }

      const COLORS = {
        bg: '#05040a',
        void: '#090813',
        wall: '#101a55',
        wallEdge: '#244dff',
        wallEdgeSoft: 'rgba(69, 103, 255, .28)',
        gate: 'rgba(255, 153, 218, .82)',
        changeFloor: '#23122f',
        changeFloorHot: '#371748',
        changeEdge: '#ff72d0',
        changeInk: '#ffd6f2',
        pellet: '#ffdf82',
        fruit: '#ff3b7d',
        fruitStem: '#4dff9f',
        pac: '#ffe94a',
        eye: '#f9fbff',
        pupil: '#263bff',
        text: 'rgba(245, 247, 255, .78)',
        alarm: '#ff84da',
      };

      const AGENT_SPECS = [
        { name: 'Pac', color: '#ffad35', start: [8, 9], dir: [-1, 0], pac: true },
        { name: 'Ghost', color: '#ff3155', start: [8, 1], dir: [1, 0] },
      ];

      const DIRS = [
        { name: 'right', x: 1, y: 0, angle: 0 },
        { name: 'down', x: 0, y: 1, angle: Math.PI / 2 },
        { name: 'left', x: -1, y: 0, angle: Math.PI },
        { name: 'up', x: 0, y: -1, angle: -Math.PI / 2 },
      ];

      const HOME = { x: 8.5, y: 1.5, c: 8, r: 1 };
      const params = new URLSearchParams(location.search);
      const DEBUG = params.has('debug');
      const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0, H = 0, dpr = 1, cell = 20, cellX = 20, cellY = 20, ox = 0, oy = 0;
      let now = 0, lastT = 0, raf = 0;
      let rng = Math.random;
      let seed = params.get('seed') || randomSeed();
      let warmSeconds = Math.max(0, Number(params.get('warm') || 0) || 0);
      let maze = BASE_MAZE;
      let openCells = [];
      let foodCells = [];
      let changingCells = [];
      let changingRooms = [];
      let agents = [];
      let pellets = new Map();
      let pelletCount = 0;
      let fruit = null;
      let nextFruitAt = 0;
      let particles = [];
      let boardClears = 0;
      let eatenPellets = 0;
      let transformations = 0;

      function randomSeed() {
        return Math.floor(Math.random() * 0xffffffff).toString(36);
      }

      function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function nextHash() {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }

      function mulberry32(a) {
        return function nextRandom() {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = (a, b) => a + rng() * (b - a);
      const randi = (a, b) => Math.floor(rand(a, b + 1));
      const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
      const lerp = (a, b, t) => a + (b - a) * t;
      const keyOf = (c, r) => r + ',' + c;
      const cellOf = (x, y) => ({ c: clamp(Math.floor(x), 0, COLS - 1), r: clamp(Math.floor(y), 0, ROWS - 1) });
      const cellCenterX = (c) => c + .5;
      const cellCenterY = (r) => r + .5;
      const px = (x) => ox + x * cellX;
      const py = (y) => oy + y * cellY;
      const wrapRow = (r) => r >= 0 && r < ROWS && isOpenCell(0, r) && isOpenCell(COLS - 1, r);

      function reset(nextSeed = seed) {
        cancelAnimationFrame(raf);
        seed = String(nextSeed || randomSeed());
        rng = mulberry32(xmur3(seed)());
        maze = generateMaze();
        rebuildCellCaches();
        now = 0;
        eatenPellets = 0;
        transformations = 0;
        boardClears = 0;
        particles = [];
        fruit = null;
        nextFruitAt = rand(7, 14);
        resizeCanvas();
        seedPellets();
        agents = AGENT_SPECS.map(makeAgent);
        lastT = performance.now();

        if (warmSeconds > 0) {
          const steps = Math.min(1800, Math.floor(warmSeconds * 30));
          for (let i = 0; i < steps; i++) update(1 / 30, true);
        }

        raf = requestAnimationFrame(tick);
      }

      function resizeCanvas() {
        dpr = Math.min(2, devicePixelRatio || 1);
        W = innerWidth;
        H = innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellX = W / COLS;
        cellY = H / ROWS;
        cell = Math.max(8, Math.min(cellX, cellY));
        ox = 0;
        oy = 0;
      }

      function generateMaze() {
        return BASE_MAZE.slice();
      }

      function carveMirrored(grid, c, r) {
        const mirror = COLS - 1 - c;
        let carved = carveCell(grid, c, r);
        if (mirror !== c) carved = carveCell(grid, mirror, r) || carved;
        return carved;
      }

      function carveCell(grid, c, r) {
        if (!canCarveCell(grid, c, r)) return false;
        grid[r][c] = rng() < .78 ? '.' : ' ';
        return true;
      }

      function canCarveCell(grid, c, r) {
        if (r <= 0 || r >= ROWS - 1 || c <= 0 || c >= COLS - 1) return false;
        if (Math.abs(r - HOME.r) <= 3 && Math.abs(c - HOME.c) <= 4) return false;
        if (grid[r][c] !== '#') return false;
        let openNeighbors = 0;
        let wallNeighbors = 0;
        for (const d of DIRS) {
          if (gridOpen(grid, c + d.x, r + d.y)) openNeighbors++;
          else wallNeighbors++;
        }
        if (openNeighbors === 0 || wallNeighbors === 0) return false;
        if (openNeighbors > 2 && rng() < .45) return false;
        return true;
      }

      function gridOpen(grid, c, r) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
        const ch = grid[r][c];
        if (ch === '#') return false;
        if (ch === ' ' && r !== HOME.r && (c < 5 || c > COLS - 6)) return false;
        return true;
      }

      function rebuildCellCaches() {
        openCells = [];
        foodCells = [];
        changingCells = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (isOpenCell(c, r)) openCells.push({ c, r });
            if (maze[r][c] === '.' || maze[r][c] === 'o') foodCells.push({ c, r });
            if (maze[r][c] === 'C') changingCells.push({ c, r });
          }
        }
        changingRooms = collectChangingRooms();
      }

      function collectChangingRooms() {
        const rooms = [];
        const seen = new Set();
        for (const start of changingCells) {
          if (seen.has(keyOf(start.c, start.r))) continue;
          const cells = [];
          const q = [start];
          seen.add(keyOf(start.c, start.r));
          for (let head = 0; head < q.length; head++) {
            const p = q[head];
            cells.push(p);
            for (const d of DIRS) {
              const c = p.c + d.x;
              const r = p.r + d.y;
              const key = keyOf(c, r);
              if (seen.has(key) || !isChangingCell(c, r)) continue;
              seen.add(key);
              q.push({ c, r });
            }
          }
          const minC = Math.min(...cells.map((p) => p.c));
          const maxC = Math.max(...cells.map((p) => p.c));
          const minR = Math.min(...cells.map((p) => p.r));
          const maxR = Math.max(...cells.map((p) => p.r));
          rooms.push({ cells, minC, maxC, minR, maxR });
        }
        return rooms;
      }

      function seedPellets() {
        pellets = new Map();
        pelletCount = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const ch = maze[r][c];
            if (ch !== '.') continue;
            const p = {
              c,
              r,
              pulse: rand(0, TAU),
              alive: true,
            };
            pellets.set(keyOf(c, r), p);
            pelletCount++;
          }
        }
      }

      function makeAgent(spec, id) {
        const [c, r] = spec.start;
        return {
          id,
          name: spec.name,
          color: spec.color,
          x: cellCenterX(c),
          y: cellCenterY(r),
          dir: dirFromVector(spec.dir[0], spec.dir[1]),
          nextDir: null,
          target: null,
          state: spec.pac ? 'pac' : 'ghost',
          originalState: spec.pac ? 'pac' : 'ghost',
          confidence: spec.pac ? .86 : rand(.22, .58),
          speedBias: rand(-.18, .18),
          huntUntil: 0,
          huntTargetId: null,
          threatId: null,
          transformAt: 0,
          alarmStartedAt: 0,
          exploredCells: new Set(),
          exploreTarget: null,
          lastDecisionCell: null,
          turnAt: 0,
          mouth: rand(0, TAU),
          wobble: rand(0, TAU),
          seenBy: null,
          seenFlash: 0,
          spawnFlash: rand(.3, 1.1),
          pelletEats: 0,
          lastTransform: -9,
          transformLockUntil: 0,
          morphStartedAt: 0,
          morphUntil: 0,
          morphFrom: null,
          morphPartnerId: null,
          returnToPacAt: 0,
          immunityUntil: 0,
        };
      }

      function tick(t) {
        const rawDt = (t - lastT) / 1000 || 0;
        const dt = Math.min(1 / 24, Math.max(0, rawDt));
        lastT = t;
        update(dt, false);
        draw();
        raf = requestAnimationFrame(tick);
      }

      function update(dt, silent) {
        now += dt;
        if (REDUCED) dt *= .72;

        if (pelletCount < 18) refillBoard();
        updateFruit(dt);
        updateConfidence(dt);
        applyVisibilityRules();
        for (const a of agents) updateAgent(a, dt);
        for (const a of agents) {
          if (isReturningToPac(a) && isChangingAt(a.x, a.y)) becomePacInChangingRoom(a);
        }
        for (const a of agents) eatAtCurrentCell(a);
        resolveCollisions();
        applyVisibilityRules();
        updateFX(dt);
        if (DEBUG && !silent) updateDebug();
      }

      function refillBoard() {
        boardClears++;
        spawnBurst(HOME.x, HOME.y, '#fff6aa', 42, .95);
        seedPellets();
        for (const a of agents) a.confidence = clamp(a.confidence + .08, 0, 1);
      }

      function updateFruit(dt) {
        fruit = null;
      }

      function updateConfidence(dt) {
        for (const a of agents) {
          a.seenFlash = Math.max(0, a.seenFlash - dt * 4);
          a.spawnFlash = Math.max(0, a.spawnFlash - dt * 1.6);
        }
      }

      function updateAgent(a, dt) {
        a.mouth += dt * 11;
        a.wobble += dt * (a.state === 'ghost' ? .45 : 3.4);
        if (a.state === 'ghost') markExplored(a);

        const speed = agentSpeed(a);
        const centerTolerance = Math.max(.035, speed * dt * .58);
        const currentCell = cellOf(a.x, a.y);
        const currentKey = keyOf(currentCell.c, currentCell.r);
        const reachedNewCenter = atCellCenter(a, centerTolerance) && a.lastDecisionCell !== currentKey;

        if (reachedNewCenter || !canContinue(a)) {
          snapToCenter(a);
          const snappedCell = cellOf(a.x, a.y);
          a.lastDecisionCell = keyOf(snappedCell.c, snappedCell.r);
          if (now >= a.turnAt || !canContinue(a)) {
            a.target = pickTarget(a);
            a.nextDir = a.target ? firstDirToward(a, a.target) : null;
            a.turnAt = now + decisionDelay(a);
          }
          const legal = legalDirsForAgent(a);
          if (a.nextDir && legal.some((d) => d.name === a.nextDir.name)) {
            a.dir = a.nextDir;
          } else if (!canContinue(a) || rng() < randomTurnChance(a)) {
            a.dir = pickBestLegalDir(a, legal);
          }
        }

        let nx = a.x + a.dir.x * speed * dt;
        let ny = a.y + a.dir.y * speed * dt;
        if (nx < -0.05 && wrapRow(Math.floor(a.y))) nx = COLS - .05;
        if (nx > COLS + .05 && wrapRow(Math.floor(a.y))) nx = .05;
        if (isOpenAtForAgent(a, nx, ny)) {
          a.x = nx;
          a.y = ny;
        } else {
          snapToCenter(a);
          a.turnAt = 0;
        }
      }

      function agentSpeed(a) {
        if (a.state === 'pac') {
          const fleeBoost = a.threatId !== null ? .65 : 0;
          return 3.1 + fleeBoost + a.speedBias * .6;
        }
        const huntBoost = isHunting(a) ? .3 : 0;
        return 1.9 + huntBoost + a.speedBias * .22;
      }

      function decisionDelay(a) {
        if (a.state === 'pac') return a.threatId !== null ? rand(.32, .56) : rand(.92, 1.42);
        if (isHunting(a)) return rand(.42, .72);
        return rand(.78, 1.28);
      }

      function randomTurnChance(a) {
        if (!canContinue(a)) return 1;
        if (a.state === 'pac') return 0;
        return isHunting(a) ? .01 : .003;
      }

      function isHunting(a) {
        return a.state === 'ghost' && huntTargetFor(a) !== null;
      }

      function setHuntTarget(ghost, pac) {
        if (ghost.huntTargetId !== pac.id) resetExploration(ghost);
        ghost.huntTargetId = pac.id;
        ghost.huntUntil = now + 9999;
      }

      function clearHuntTarget(ghost) {
        ghost.huntTargetId = null;
        ghost.huntUntil = 0;
      }

      function clearHuntsFor(target) {
        for (const a of agents) {
          if (a.huntTargetId === target.id) clearHuntTarget(a);
        }
      }

      function huntTargetFor(ghost) {
        if (ghost.huntTargetId === null) return null;
        const target = agents.find((a) => a.id === ghost.huntTargetId);
        if (!target || target.state !== 'pac') {
          clearHuntTarget(ghost);
          return null;
        }
        return target;
      }

      function markExplored(a) {
        const cell = cellOf(a.x, a.y);
        if (isOpenCell(cell.c, cell.r)) a.exploredCells.add(keyOf(cell.c, cell.r));
      }

      function resetExploration(a) {
        a.exploredCells = new Set();
        a.exploreTarget = null;
        if (a.state === 'ghost') markExplored(a);
      }

      function exploreTargetFor(a) {
        markExplored(a);
        if (a.exploreTarget && !a.exploredCells.has(keyOf(a.exploreTarget.c, a.exploreTarget.r))) return a.exploreTarget;
        const start = cellOf(a.x, a.y);
        const target = bfsNearest(start, (c, r) => isOpenCell(c, r) && !a.exploredCells.has(keyOf(c, r)), a);
        if (target) {
          a.exploreTarget = target;
          return target;
        }
        resetExploration(a);
        const allowedCells = openCells.filter((p) => canAgentEnterCell(a, p.c, p.r));
        return bfsNearest(start, (c, r) => isOpenCell(c, r) && !a.exploredCells.has(keyOf(c, r)), a)
          || allowedCells[randi(0, allowedCells.length - 1)];
      }

      function pickTarget(a) {
        if (now < a.transformLockUntil && a.morphPartnerId !== null) {
          const partner = agents.find((b) => b.id === a.morphPartnerId);
          if (partner) return fleeTargetFrom(partner, a);
        }

        if (a.state === 'pac') {
          const threat = threatFor(a);
          if (threat) return nearestChangingRoomTarget(a, threat);
          return nearestFoodTarget(a);
        }

        if (isReturningToPac(a)) return nearestChangingRoomTarget(a, null);

        const visiblePac = nearestAgent(a, (b) => b.state === 'pac' && canSee(a, b));
        if (visiblePac) {
          setHuntTarget(a, visiblePac);
          return cellOf(visiblePac.x, visiblePac.y);
        }

        const huntedPac = huntTargetFor(a);
        if (huntedPac) return cellOf(huntedPac.x, huntedPac.y);

        return exploreTargetFor(a);
      }

      function facingDir(a) {
        return a.dir;
      }

      function dirAwayFrom(a, threat) {
        const ac = Math.floor(a.x), ar = Math.floor(a.y);
        const tc = Math.floor(threat.x), tr = Math.floor(threat.y);
        if (ar === tr && ac !== tc) return dirFromVector(ac > tc ? 1 : -1, 0);
        if (ac === tc && ar !== tr) return dirFromVector(0, ar > tr ? 1 : -1);
        return oppositeDir(a.dir);
      }

      function canMoveDir(a, dir) {
        if (!dir) return false;
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        let nc = c + dir.x;
        const nr = r + dir.y;
        if (wrapRow(r)) {
          if (nc < 0) nc = COLS - 1;
          if (nc >= COLS) nc = 0;
        }
        return canAgentEnterCell(a, nc, nr);
      }

      function oppositeDir(dir) {
        if (!dir) return DIRS[0];
        return DIRS.find((d) => d.x === -dir.x && d.y === -dir.y) || DIRS[0];
      }

      function nearestFoodTarget(a) {
        const start = cellOf(a.x, a.y);
        const result = bfsNearest(start, (c, r) => {
          const p = pellets.get(keyOf(c, r));
          return !!(p && p.alive);
        }, a);
        if (result) return result;
        return foodCells[randi(0, foodCells.length - 1)];
      }

      function nearestChangingRoomTarget(pac, threat) {
        const start = cellOf(pac.x, pac.y);
        const threatCell = threat ? cellOf(threat.x, threat.y) : null;
        let best = null;
        let bestScore = Infinity;
        for (const room of changingRooms) {
          for (const p of room.cells) {
            const pacDistance = pathDistanceCells(start, p);
            const threatDistance = threatCell ? pathDistanceCells(threatCell, p) : Infinity;
            if (!Number.isFinite(pacDistance)) continue;
            const safety = Number.isFinite(threatDistance) ? Math.min(8, threatDistance) * .14 : 0;
            const score = pacDistance - safety + rng() * .025;
            if (score < bestScore) {
              bestScore = score;
              best = p;
            }
          }
        }
        return best || changingCells[0] || start;
      }

      function fleeTargetFrom(threat, seeker = null) {
        let best = null;
        let bestScore = -Infinity;
        const threatCell = cellOf(threat.x, threat.y);
        const seekerCell = seeker ? cellOf(seeker.x, seeker.y) : null;
        const awayDir = seeker ? dirAwayFrom(seeker, threat) : null;
        for (let i = 0; i < openCells.length; i++) {
          const p = openCells[i];
          if (seeker && !canAgentEnterCell(seeker, p.c, p.r)) continue;
          const threatDistance = pathDistanceCells(threatCell, p);
          if (!Number.isFinite(threatDistance)) continue;
          const seekerDistance = seekerCell ? pathDistanceCells(seekerCell, p) : 0;
          const first = seeker ? firstDirToward(seeker, p) : null;
          const firstStep = first && awayDir && first.x === awayDir.x && first.y === awayDir.y ? 12 : 0;
          const wrongWay = first && awayDir && first.x === -awayDir.x && first.y === -awayDir.y ? -18 : 0;
          const food = pellets.has(keyOf(p.c, p.r)) ? .8 : 0;
          const centerBias = -Math.abs(p.c - HOME.c) * .04 - Math.abs(p.r - HOME.r) * .02;
          const score = threatDistance - seekerDistance * .08 + firstStep + wrongWay + food + centerBias + rng() * .55;
          if (score > bestScore) {
            bestScore = score;
            best = p;
          }
        }
        return best || { c: HOME.c, r: HOME.r };
      }

      function nearestAgent(a, predicate) {
        let best = null;
        let bestD = Infinity;
        for (const b of agents) {
          if (a === b || !predicate(b)) continue;
          const d = gridDistance(a.x, a.y, b.x, b.y);
          if (d < bestD) {
            bestD = d;
            best = b;
          }
        }
        return best;
      }

      function gridDistance(ax, ay, bx, by) {
        let dx = Math.abs(ax - bx);
        if (Math.floor(ay) === Math.floor(by) && wrapRow(Math.floor(ay))) dx = Math.min(dx, COLS - dx);
        return Math.hypot(dx, ay - by);
      }

      function eatAtCurrentCell(a) {
        if (a.state !== 'pac') return;
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        const p = pellets.get(keyOf(c, r));
        if (p && p.alive) {
          p.alive = false;
          pelletCount--;
          eatenPellets++;
          a.pelletEats++;
          a.confidence = clamp(a.confidence + .045, 0, 1);
          if (rng() < .22) {
            spawnParticle(cellCenterX(c), cellCenterY(r), COLORS.pellet, .8, rand(.25, .42));
          }
        }

        if (fruit && Math.hypot(a.x - fruit.x, a.y - fruit.y) < .58) {
          a.confidence = 1;
          spawnBurst(fruit.x, fruit.y, COLORS.fruit, 36, .8);
          fruit = null;
          nextFruitAt = now + rand(19, 34);
        }
      }

      function resolveCollisions() {
        const pac = agents.find((a) => a.state === 'pac');
        const ghost = agents.find((a) => a.state === 'ghost');
        if (!pac || !ghost) return;
        if (now < pac.immunityUntil) return;
        if (gridDistance(pac.x, pac.y, ghost.x, ghost.y) <= 1.18) {
          if (pac.threatId === null) beginThreatResponse(pac, ghost);
          if (isChangingAt(pac.x, pac.y)) becomeGhostFromThreat(pac, ghost);
        }
      }

      function applyVisibilityRules() {
        const pac = agents.find((a) => a.state === 'pac');
        if (!pac) return;
        const ghost = agents.find((a) => a.state === 'ghost');
        if (!ghost) return;
        if (now < pac.immunityUntil) {
          clearHuntsFor(pac);
          return;
        }

        const threat = threatFor(pac);
        if (threat) {
          if (isChangingAt(pac.x, pac.y)) {
            becomeGhostFromThreat(pac, threat);
            return;
          }
          steerPacToChangingRoom(pac, threat);
          setHuntTarget(threat, pac);
          return;
        }

        if (canSee(pac, ghost)) {
          beginThreatResponse(pac, ghost);
          return;
        }

        if (canSee(ghost, pac)) {
          setHuntTarget(ghost, pac);
          ghost.target = cellOf(pac.x, pac.y);
          ghost.nextDir = firstDirToward(ghost, ghost.target);
          ghost.turnAt = Math.min(ghost.turnAt, now + .24);
          return;
        }

        const huntedPac = huntTargetFor(ghost);
        if (huntedPac) {
          ghost.target = cellOf(huntedPac.x, huntedPac.y);
          ghost.nextDir = firstDirToward(ghost, ghost.target);
          ghost.turnAt = Math.min(ghost.turnAt, now + .24);
        }
      }

      function threatFor(pac) {
        if (pac.threatId === null) return null;
        const threat = agents.find((a) => a.id === pac.threatId && a.state === 'ghost');
        if (threat) return threat;
        pac.threatId = null;
        pac.transformAt = 0;
        return null;
      }

      function beginThreatResponse(pac, ghost) {
        pac.threatId = ghost.id;
        pac.transformAt = 0;
        pac.alarmStartedAt = now;
        pac.seenBy = ghost.id;
        pac.seenFlash = .7;
        steerPacToChangingRoom(pac, ghost);
        setHuntTarget(ghost, pac);
        ghost.target = cellOf(pac.x, pac.y);
        ghost.nextDir = firstDirToward(ghost, ghost.target);
        ghost.turnAt = Math.min(ghost.turnAt, now + .24);
      }

      function steerPacToChangingRoom(pac, ghost) {
        pac.target = nearestChangingRoomTarget(pac, ghost);
        const routeDir = firstDirToward(pac, pac.target);
        const awayDir = dirAwayFrom(pac, ghost);
        pac.nextDir = routeDir || awayDir;
        if (canMoveDir(pac, pac.nextDir)) pac.dir = pac.nextDir;
        pac.turnAt = Math.min(pac.turnAt, now + .12);
      }

      function becomeGhostFromThreat(pac, ghost) {
        if (pac.state !== 'pac') return;
        const morphUntil = now + (REDUCED ? .01 : .72);

        transformations++;
        clearHuntsFor(pac);
        clearHuntTarget(pac);

        pac.state = 'ghost';
        pac.threatId = null;
        pac.transformAt = 0;
        pac.alarmStartedAt = 0;
        pac.confidence = .24;
        pac.morphFrom = 'pac';
        pac.morphStartedAt = now;
        pac.morphUntil = morphUntil;
        pac.morphPartnerId = ghost.id;
        pac.transformLockUntil = now + .95;
        pac.returnToPacAt = now + rand(5.5, 8.5);
        pac.immunityUntil = 0;
        pac.lastTransform = now;
        pac.seenBy = ghost.id;
        pac.seenFlash = .48;
        resetExploration(pac);
        pac.target = fleeTargetFrom(ghost, pac);
        pac.nextDir = firstDirToward(pac, pac.target) || pac.dir;
        pac.turnAt = pac.transformLockUntil;
      }

      function isReturningToPac(a) {
        return a.state === 'ghost'
          && a.originalState === 'pac'
          && a.returnToPacAt > 0
          && now >= a.returnToPacAt;
      }

      function becomePacInChangingRoom(a) {
        if (!isReturningToPac(a)) return;
        const morphUntil = now + (REDUCED ? .01 : .72);
        const otherGhost = agents.find((b) => b !== a && b.state === 'ghost');

        transformations++;
        a.state = 'pac';
        a.returnToPacAt = 0;
        a.threatId = null;
        a.alarmStartedAt = 0;
        a.confidence = .72;
        a.morphFrom = 'ghost';
        a.morphStartedAt = now;
        a.morphUntil = morphUntil;
        a.morphPartnerId = otherGhost ? otherGhost.id : null;
        a.transformLockUntil = now + 1.2;
        a.immunityUntil = a.transformLockUntil;
        a.lastTransform = now;
        a.seenBy = null;
        a.seenFlash = .4;
        clearHuntTarget(a);
        clearHuntsFor(a);
        resetExploration(a);
        a.target = nearestFoodTarget(a);
        a.nextDir = firstDirToward(a, a.target) || a.dir;
        a.turnAt = a.transformLockUntil;
      }

      function canSee(viewer, target) {
        if (!hasCorridorLine(viewer, target)) return false;
        if (viewer.state !== 'pac') return true;
        return targetIsAhead(viewer, target);
      }

      function hasCorridorLine(a, b) {
        const ac = Math.floor(a.x), ar = Math.floor(a.y);
        const bc = Math.floor(b.x), br = Math.floor(b.y);
        if (ar === br) {
          if (Math.abs(a.y - cellCenterY(ar)) > .22 || Math.abs(b.y - cellCenterY(br)) > .22) return false;
          return rowClear(ar, ac, bc);
        }
        if (ac === bc) {
          if (Math.abs(a.x - cellCenterX(ac)) > .22 || Math.abs(b.x - cellCenterX(bc)) > .22) return false;
          return colClear(ac, ar, br);
        }
        return false;
      }

      function targetIsAhead(viewer, target) {
        const dir = facingDir(viewer);
        const vc = Math.floor(viewer.x), vr = Math.floor(viewer.y);
        const tc = Math.floor(target.x), tr = Math.floor(target.y);
        if (dir.x !== 0) return vr === tr && (tc - vc) * dir.x > 0;
        return vc === tc && (tr - vr) * dir.y > 0;
      }

      function rowClear(r, a, b) {
        if (a === b) return true;
        const step = a < b ? 1 : -1;
        for (let c = a + step; c !== b; c += step) {
          if (!isOpenCell(c, r)) return false;
        }
        return true;
      }

      function colClear(c, a, b) {
        if (a === b) return true;
        const step = a < b ? 1 : -1;
        for (let r = a + step; r !== b; r += step) {
          if (!isOpenCell(c, r)) return false;
        }
        return true;
      }

      function updateFX(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= Math.pow(.08, dt);
          p.vy *= Math.pow(.08, dt);
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function spawnParticle(x, y, color, speed, life) {
        if (REDUCED && rng() < .65) return;
        const a = rand(0, TAU);
        particles.push({
          x,
          y,
          vx: Math.cos(a) * speed * rand(.2, 1.1),
          vy: Math.sin(a) * speed * rand(.2, 1.1),
          color,
          life,
          maxLife: life,
          size: rand(.04, .13),
        });
      }

      function spawnBurst(x, y, color, count, speed) {
        const n = REDUCED ? Math.ceil(count * .35) : count;
        for (let i = 0; i < n; i++) spawnParticle(x, y, color, speed * rand(.45, 1.25), rand(.32, .86));
      }

      function draw() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, W, H);
        drawBackdrop();
        drawMaze();
        drawPellets();
        drawFruit();
        drawAlarmLine();
        drawAgents();
        drawParticles();
        drawFrameText();
      }

      function drawBackdrop() {
        const cx = W / 2;
        const cy = H / 2;
        const g = ctx.createRadialGradient(cx, cy, Math.min(W, H) * .08, cx, cy, Math.max(W, H) * .62);
        g.addColorStop(0, '#101039');
        g.addColorStop(.62, '#070613');
        g.addColorStop(1, '#030207');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = .18;
        ctx.strokeStyle = '#243169';
        ctx.lineWidth = 1;
        const gap = Math.max(28, cell * 2);
        for (let x = (ox % gap) - gap; x < W + gap; x += gap) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = (oy % gap) - gap; y < H + gap; y += gap) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawMaze() {
        ctx.save();
        ctx.translate(ox, oy);
        ctx.fillStyle = COLORS.void;
        ctx.fillRect(0, 0, COLS * cellX, ROWS * cellY);
        drawChangingRooms();

        ctx.fillStyle = COLORS.wall;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (maze[r][c] !== '#') continue;
            ctx.fillRect(c * cellX, r * cellY, cellX, cellY);
          }
        }

        ctx.strokeStyle = COLORS.wallEdgeSoft;
        ctx.lineWidth = Math.max(1, cell * .075);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (maze[r][c] !== '#') continue;
            const x = c * cellX;
            const y = r * cellY;
            if (isOpenCell(c, r - 1)) line(x, y, x + cellX, y);
            if (isOpenCell(c, r + 1)) line(x, y + cellY, x + cellX, y + cellY);
            if (isOpenCell(c - 1, r)) line(x, y, x, y + cellY);
            if (isOpenCell(c + 1, r)) line(x + cellX, y, x + cellX, y + cellY);
          }
        }

        ctx.strokeStyle = COLORS.wallEdge;
        ctx.globalAlpha = .38;
        ctx.lineWidth = Math.max(1, cell * .035);
        const inset = Math.max(1, cell * .045);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (maze[r][c] !== '#') continue;
            const x = c * cellX;
            const y = r * cellY;
            if (isOpenCell(c, r - 1)) line(x + inset, y + inset, x + cellX - inset, y + inset);
            if (isOpenCell(c, r + 1)) line(x + inset, y + cellY - inset, x + cellX - inset, y + cellY - inset);
            if (isOpenCell(c - 1, r)) line(x + inset, y + inset, x + inset, y + cellY - inset);
            if (isOpenCell(c + 1, r)) line(x + cellX - inset, y + inset, x + cellX - inset, y + cellY - inset);
          }
        }
        ctx.globalAlpha = 1;

        ctx.strokeStyle = COLORS.gate;
        ctx.lineWidth = Math.max(2, cell * .14);
        ctx.beginPath();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (maze[r][c] === '-') {
              ctx.moveTo(c * cellX, (r + .5) * cellY);
              ctx.lineTo((c + 1) * cellX, (r + .5) * cellY);
            }
          }
        }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(.5, .5, COLS * cellX - 1, ROWS * cellY - 1);
        ctx.restore();
      }

      function drawChangingRooms() {
        const pulse = REDUCED ? .45 : .5 + .5 * Math.sin(now * 3.2);
        for (const room of changingRooms) {
          for (const p of room.cells) {
            const x = p.c * cellX;
            const y = p.r * cellY;
            ctx.fillStyle = (p.c + p.r) % 2 ? COLORS.changeFloor : COLORS.changeFloorHot;
            ctx.globalAlpha = .82 + pulse * .12;
            ctx.fillRect(x, y, cellX, cellY);

            ctx.strokeStyle = COLORS.changeEdge;
            ctx.globalAlpha = .48 + pulse * .34;
            ctx.lineWidth = Math.max(1, cell * .055);
            if (!isChangingCell(p.c, p.r - 1)) line(x, y, x + cellX, y);
            if (!isChangingCell(p.c, p.r + 1)) line(x, y + cellY, x + cellX, y + cellY);
            if (!isChangingCell(p.c - 1, p.r)) line(x, y, x, y + cellY);
            if (!isChangingCell(p.c + 1, p.r)) line(x + cellX, y, x + cellX, y + cellY);
          }

          const centerX = (room.minC + room.maxC + 1) * cellX * .5;
          const centerY = (room.minR + room.maxR + 1) * cellY * .5;
          ctx.globalAlpha = .62 + pulse * .25;
          ctx.fillStyle = COLORS.changeInk;
          ctx.font = `700 ${Math.max(7, Math.floor(cell * .23))}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('CHANGE', centerX, centerY);
        }
        ctx.globalAlpha = 1;
      }

      function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawPellets() {
        ctx.save();
        for (const p of pellets.values()) {
          if (!p.alive) continue;
          const x = px(cellCenterX(p.c));
          const y = py(cellCenterY(p.r));
          ctx.globalAlpha = .82;
          ctx.fillStyle = COLORS.pellet;
          ctx.fillRect(Math.round(x - cell * .055), Math.round(y - cell * .055), Math.max(2, Math.round(cell * .11)), Math.max(2, Math.round(cell * .11)));
        }
        ctx.restore();
      }

      function drawFruit() {
        if (!fruit) return;
        const x = px(fruit.x);
        const y = py(fruit.y);
        const pulse = .5 + .5 * Math.sin(fruit.pulse + now * 6);
        ctx.save();
        ctx.globalAlpha = .96;
        ctx.fillStyle = COLORS.fruit;
        ctx.beginPath();
        ctx.moveTo(x, y - cell * (.27 + pulse * .04));
        ctx.lineTo(x + cell * .25, y);
        ctx.lineTo(x, y + cell * .27);
        ctx.lineTo(x - cell * .25, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = COLORS.fruitStem;
        ctx.lineWidth = Math.max(1, cell * .055);
        ctx.beginPath();
        ctx.moveTo(x, y - cell * .22);
        ctx.quadraticCurveTo(x + cell * .18, y - cell * .42, x + cell * .34, y - cell * .3);
        ctx.stroke();
        ctx.restore();
      }

      function drawAlarmLine() {
        const pac = agents.find((a) => a.state === 'pac');
        const ghost = agents.find((a) => a.state === 'ghost');
        if (!pac || !ghost || pac.threatId !== ghost.id) return;
        const freshlySeen = now - pac.alarmStartedAt < .72;
        if (!freshlySeen && !hasCorridorLine(pac, ghost)) return;

        const pacEye = pacEyeGeometry(pac, px(pac.x), py(pac.y), cell * .72).pupil;
        const ghostY = py(ghost.y) + Math.sin(now * .72 + ghost.wobble) * cell * .075;
        const ghostEyes = ghostEyeGeometry(ghost, px(ghost.x), ghostY, cell * .68).pupils;
        const ghostEye = ghostEyes.reduce((best, eye) => {
          if (!best) return eye;
          return distanceSquared(pacEye, eye) < distanceSquared(pacEye, best) ? eye : best;
        }, null);
        if (!ghostEye) return;

        const dx = ghostEye.x - pacEye.x;
        const dy = ghostEye.y - pacEye.y;
        const length = Math.hypot(dx, dy);
        if (length < 1) return;
        const nx = -dy / length;
        const ny = dx / length;
        const waves = clamp(Math.round(length / Math.max(34, cell * 1.25)), 3, 11);
        const amplitude = Math.min(cell * .15, length * .055);
        const phase = REDUCED ? 0 : now * 12;
        const steps = Math.max(20, waves * 8);

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = COLORS.alarm;
        ctx.shadowBlur = Math.max(3, cell * .16);
        ctx.strokeStyle = COLORS.alarm;
        ctx.lineWidth = Math.max(1.5, cell * .065);
        ctx.globalAlpha = .9;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const envelope = Math.sin(Math.PI * t);
          const offset = Math.sin(t * waves * TAU - phase) * amplitude * envelope;
          const x = lerp(pacEye.x, ghostEye.x, t) + nx * offset;
          const y = lerp(pacEye.y, ghostEye.y, t) + ny * offset;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function distanceSquared(a, b) {
        return (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
      }

      function drawAgents() {
        for (const a of agents) {
          if (a.state === 'pac') drawPac(a);
          else drawGhost(a);
        }
      }

      function drawPac(a) {
        const x = px(a.x);
        const y = py(a.y);
        const r = cell * .72;
        const morphing = now < a.morphUntil && a.morphFrom === 'ghost';
        const progress = morphing ? morphProgress(a) : 1;

        ctx.save();
        if (morphing) {
          drawMorphEcho(a, x, y, r);
          const ghostExit = 1 - clamp(progress / .7, 0, 1);
          const emergence = .58 + progress * .42;
          const eyesAlpha = 1 - clamp(progress / .42, 0, 1);
          drawGhostBody(a, x, y, r * .94, ghostExit, emergence, 0, eyesAlpha);
        }

        const pacAlpha = morphing ? clamp((progress - .08) / .64, 0, 1) : 1;
        drawConfidenceHalo(a, x, y, r * 1.12, pacAlpha);
        if (a.seenFlash > 0) {
          ctx.globalAlpha = .18 + a.seenFlash * .22;
          ctx.fillStyle = a.color;
          ctx.beginPath();
          ctx.arc(x, y, r * (1.55 + .12 * Math.sin(now * 8)), 0, TAU);
          ctx.fill();
        }
        drawPacBody(a, x, y, r, pacAlpha, morphing ? 1 - progress : 0);
        ctx.restore();
      }

      function drawPacBody(a, x, y, r, alpha, collapse) {
        const angle = facingDir(a).angle;
        const mouth = (.18 + Math.abs(Math.sin(a.mouth)) * .23) * (1 - collapse * .78);

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1 + collapse * .16, 1 - collapse * .48);
        ctx.translate(-x, -y);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COLORS.pac;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.arc(x, y, r, angle + mouth, angle - mouth, false);
        ctx.closePath();
        ctx.fill();
        drawPacEye(a, x, y, r, alpha);
        ctx.restore();
      }

      function pacEyeGeometry(a, x, y, r) {
        const angle = facingDir(a).angle;
        const fx = Math.cos(angle);
        const fy = Math.sin(angle);
        const eye = {
          x: x + fx * r * .18,
          y: y - r * .34,
        };
        return {
          eye,
          pupil: { x: eye.x + fx * r * .07, y: eye.y + fy * r * .055 },
          angle: 0,
        };
      }

      function drawPacEye(a, x, y, r, alpha) {
        const geometry = pacEyeGeometry(a, x, y, r);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COLORS.eye;
        ctx.beginPath();
        ctx.ellipse(geometry.eye.x, geometry.eye.y, r * .17, r * .22, geometry.angle, 0, TAU);
        ctx.fill();
        ctx.fillStyle = COLORS.pupil;
        ctx.beginPath();
        ctx.arc(geometry.pupil.x, geometry.pupil.y, r * .082, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawGhost(a) {
        const x = px(a.x);
        const y = py(a.y);
        const r = cell * .68;
        const morphing = now < a.morphUntil && a.morphFrom === 'pac';
        const progress = morphing ? morphProgress(a) : 1;
        const emergence = 1 - Math.pow(1 - progress, 3);
        const bob = Math.sin(now * .72 + a.wobble) * cell * .075 * emergence;
        const sway = Math.sin(now * .58 + a.wobble * .8) * .035 * emergence;

        ctx.save();
        if (morphing) {
          drawMorphEcho(a, x, y, r);
          const pacExit = clamp(progress / .68, 0, 1);
          drawPacBody(a, x, y, r * 1.06, 1 - pacExit, pacExit);
        }

        const haloAlpha = morphing ? clamp(progress / .45, 0, 1) : 1;
        drawConfidenceHalo(a, x, y + bob, r * 1.13, haloAlpha);
        if (a.spawnFlash > 0) {
          ctx.globalAlpha = .15 + a.spawnFlash * .22;
          ctx.fillStyle = a.color;
          ctx.beginPath();
          ctx.arc(x, y + bob, r * 1.5, 0, TAU);
          ctx.fill();
        }

        const ghostAlpha = morphing ? clamp((progress - .06) / .68, 0, 1) : 1;
        const eyesAlpha = morphing ? clamp((progress - .24) / .42, 0, 1) : 1;
        drawGhostBody(a, x, y + bob, r, ghostAlpha, emergence, sway, eyesAlpha);
        ctx.restore();
      }

      function drawGhostBody(a, x, y, r, alpha, emergence, sway, eyesAlpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(sway);
        ctx.scale(.88 + emergence * .12, .58 + emergence * .42);
        ctx.translate(-x, -y);

        ctx.fillStyle = a.color;
        ctx.globalAlpha = alpha * .94;
        ctx.beginPath();
        ctx.arc(x, y - r * .05, r, Math.PI, 0, false);
        ctx.lineTo(x + r, y + r * .66);
        const foot = r / 3;
        for (let i = 0; i < 3; i++) {
          const fx = x + r - foot * (i * 2 + 1);
          ctx.quadraticCurveTo(fx, y + r * .34, fx - foot, y + r * .66);
        }
        ctx.lineTo(x - r, y - r * .05);
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = alpha * .22;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - r * .58, y + r * .05, r * 1.16, Math.max(1, cell * .05));

        drawAgentEyes(a, x, y - r * .16, r, eyesAlpha);
        ctx.restore();
      }

      function morphProgress(a) {
        if (a.morphUntil <= a.morphStartedAt || now >= a.morphUntil) return 1;
        return clamp((now - a.morphStartedAt) / (a.morphUntil - a.morphStartedAt), 0, 1);
      }

      function drawMorphEcho(a, x, y, r) {
        if (now >= a.morphUntil) return;
        const progress = morphProgress(a);
        ctx.save();
        ctx.globalAlpha = (1 - progress) * .72;
        ctx.strokeStyle = a.morphFrom === 'pac' ? COLORS.pac : a.color;
        ctx.lineWidth = Math.max(1, cell * .055);
        ctx.beginPath();
        ctx.arc(x, y, r * (.92 + progress * .78), 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      function drawAgentEyes(a, x, y, r, alpha = 1) {
        const geometry = ghostEyeGeometry(a, x, y, r);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COLORS.eye;
        ctx.beginPath();
        for (const eye of geometry.eyes) ctx.ellipse(eye.x, eye.y, r * .23, r * .30, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = COLORS.pupil;
        ctx.beginPath();
        for (const pupil of geometry.pupils) ctx.arc(pupil.x, pupil.y, r * .095, 0, TAU);
        ctx.fill();
      }

      function ghostEyeGeometry(a, x, y, r) {
        const look = facingDir(a).angle;
        const lx = Math.cos(look) * r * .12;
        const ly = Math.sin(look) * r * .12;
        const eyes = [
          { x: x - r * .33, y },
          { x: x + r * .33, y },
        ];
        return {
          eyes,
          pupils: eyes.map((eye) => ({ x: eye.x + lx, y: eye.y + ly })),
        };
      }

      function drawConfidenceHalo(a, x, y, r, alpha = 1) {
        const start = -Math.PI / 2;
        const end = start + TAU * a.confidence;
        ctx.save();
        ctx.globalAlpha = (.18 + a.confidence * .25) * alpha;
        ctx.strokeStyle = a.state === 'pac' ? COLORS.pac : a.color;
        ctx.lineWidth = Math.max(1, cell * .045);
        ctx.beginPath();
        ctx.arc(x, y, r, start, end);
        ctx.stroke();
        ctx.globalAlpha = .11 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        ctx.save();
        for (const p of particles) {
          const a = clamp(p.life / p.maxLife, 0, 1);
          ctx.globalAlpha = a;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(px(p.x), py(p.y), Math.max(1, cell * p.size * (1 + (1 - a))), 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFrameText() {
        if (cell < 13) return;
        ctx.save();
        ctx.fillStyle = COLORS.text;
        ctx.font = `${Math.max(10, Math.floor(cell * .45))}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        ctx.textBaseline = 'top';
        const pacs = agents.filter((a) => a.state === 'pac').length;
        const ghosts = agents.filter((a) => a.state === 'ghost').length;
        const label = `PAC ${pacs}  GHOST ${ghosts}  CHANGES ${transformations}`;
        ctx.globalAlpha = .42;
        ctx.fillText(label, ox, Math.max(8, oy - cell * .85));
        ctx.textAlign = 'right';
        ctx.fillText(`DOTS ${pelletCount}`, ox + COLS * cellX, Math.max(8, oy - cell * .85));
        ctx.restore();
      }

      function updateDebug() {
        debugEl.hidden = false;
        const lines = [
          `seed ${seed}`,
          `pellets ${pelletCount} eaten ${eatenPellets} clears ${boardClears}`,
          `transformations ${transformations}`,
          ...agents.map((a) => {
            const mode = now < a.transformLockUntil
              ? 'settle'
              : a.state === 'pac'
                ? (a.threatId !== null ? 'change' : 'seek')
                : (isReturningToPac(a) ? 'return' : isHunting(a) ? 'hunt' : 'explore');
            return `${a.name.padEnd(6)} ${a.state.padEnd(5)} ${mode.padEnd(7)} explored ${a.exploredCells.size} @ ${Math.floor(a.x)},${Math.floor(a.y)}`;
          }),
        ];
        debugEl.textContent = lines.join('\n');
      }

      function isOpenCell(c, r) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
        const ch = maze[r][c];
        if (ch === '#') return false;
        if (ch === ' ' && r !== HOME.r && (c < 5 || c > COLS - 6)) return false;
        return true;
      }

      function isChangingCell(c, r) {
        return r >= 0 && r < ROWS && c >= 0 && c < COLS && maze[r][c] === 'C';
      }

      function isChangingAt(x, y) {
        return isChangingCell(Math.floor(x), Math.floor(y));
      }

      function canAgentEnterCell(a, c, r) {
        if (!isOpenCell(c, r)) return false;
        if (!isChangingCell(c, r)) return true;
        if (a.state === 'pac') return a.threatId !== null;
        return isReturningToPac(a);
      }

      function isOpenAt(x, y) {
        const r = Math.floor(y);
        let c = Math.floor(x);
        if (wrapRow(r)) {
          if (c < 0) c = COLS - 1;
          if (c >= COLS) c = 0;
        }
        return isOpenCell(c, r);
      }

      function isOpenAtForAgent(a, x, y) {
        const r = Math.floor(y);
        let c = Math.floor(x);
        if (wrapRow(r)) {
          if (c < 0) c = COLS - 1;
          if (c >= COLS) c = 0;
        }
        return canAgentEnterCell(a, c, r);
      }

      function neighbors(c, r) {
        const out = [];
        for (const d of DIRS) {
          let nc = c + d.x;
          const nr = r + d.y;
          if (wrapRow(r)) {
            if (nc < 0) nc = COLS - 1;
            if (nc >= COLS) nc = 0;
          }
          if (isOpenCell(nc, nr)) out.push({ c: nc, r: nr, dir: d });
        }
        return out;
      }

      function neighborsForAgent(a, c, r) {
        const out = [];
        for (const d of DIRS) {
          let nc = c + d.x;
          const nr = r + d.y;
          if (wrapRow(r)) {
            if (nc < 0) nc = COLS - 1;
            if (nc >= COLS) nc = 0;
          }
          if (canAgentEnterCell(a, nc, nr)) out.push({ c: nc, r: nr, dir: d });
        }
        return out;
      }

      function bfsNearest(start, predicate, agent = null) {
        const q = [start];
        const seen = new Set([keyOf(start.c, start.r)]);
        for (let head = 0; head < q.length; head++) {
          const p = q[head];
          if (predicate(p.c, p.r)) return p;
          const next = agent ? neighborsForAgent(agent, p.c, p.r) : neighbors(p.c, p.r);
          for (const n of next) {
            const k = keyOf(n.c, n.r);
            if (seen.has(k)) continue;
            seen.add(k);
            q.push({ c: n.c, r: n.r });
          }
        }
        return null;
      }

      function pathDistanceCells(start, target) {
        if (start.c === target.c && start.r === target.r) return 0;
        const q = [{ c: start.c, r: start.r, d: 0 }];
        const seen = new Set([keyOf(start.c, start.r)]);
        for (let head = 0; head < q.length; head++) {
          const p = q[head];
          for (const n of neighbors(p.c, p.r)) {
            const k = keyOf(n.c, n.r);
            if (seen.has(k)) continue;
            if (n.c === target.c && n.r === target.r) return p.d + 1;
            seen.add(k);
            q.push({ c: n.c, r: n.r, d: p.d + 1 });
          }
        }
        return Infinity;
      }

      function firstDirToward(a, target) {
        const start = cellOf(a.x, a.y);
        if (!target || (start.c === target.c && start.r === target.r)) return null;
        const q = [];
        const seen = new Set([keyOf(start.c, start.r)]);
        for (const n of neighborsForAgent(a, start.c, start.r)) {
          const reverse = a.dir && n.dir.x === -a.dir.x && n.dir.y === -a.dir.y;
          const continuing = a.dir && n.dir.x === a.dir.x && n.dir.y === a.dir.y;
          const penalty = reverse && canContinue(a) ? 3.2 : continuing ? -.35 : .25;
          q.push({ c: n.c, r: n.r, first: n.dir, penalty });
          seen.add(keyOf(n.c, n.r));
        }
        q.sort((m, n) => m.penalty - n.penalty);
        for (let head = 0; head < q.length; head++) {
          const p = q[head];
          if (p.c === target.c && p.r === target.r) return p.first;
          for (const n of neighborsForAgent(a, p.c, p.r)) {
            const k = keyOf(n.c, n.r);
            if (seen.has(k)) continue;
            seen.add(k);
            q.push({ c: n.c, r: n.r, first: p.first, penalty: 0 });
          }
        }
        return null;
      }

      function legalDirsForAgent(a) {
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        return neighborsForAgent(a, c, r).map((n) => n.dir);
      }

      function pickBestLegalDir(a, legal) {
        if (!legal.length) return a.dir || DIRS[0];
        const target = a.target;
        if (!target) return legal[randi(0, legal.length - 1)];
        let best = legal[0];
        let bestScore = Infinity;
        for (const d of legal) {
          const reverse = a.dir && d.x === -a.dir.x && d.y === -a.dir.y;
          let nc = Math.floor(a.x) + d.x;
          const nr = Math.floor(a.y) + d.y;
          if (wrapRow(nr)) {
            if (nc < 0) nc = COLS - 1;
            if (nc >= COLS) nc = 0;
          }
          const continuing = a.dir && d.x === a.dir.x && d.y === a.dir.y;
          const reversePenalty = reverse ? (a.state === 'ghost' ? 4.4 : 3.5) : 0;
          const inertia = continuing && canContinue(a) ? -.45 : 0;
          const score = Math.abs(nc - target.c) + Math.abs(nr - target.r) + reversePenalty + inertia + rng() * .06;
          if (score < bestScore) {
            bestScore = score;
            best = d;
          }
        }
        return best;
      }

      function atCellCenter(a, tolerance = .035) {
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        return Math.abs(a.x - cellCenterX(c)) < tolerance && Math.abs(a.y - cellCenterY(r)) < tolerance;
      }

      function snapToCenter(a) {
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        a.x = cellCenterX(c);
        a.y = cellCenterY(r);
      }

      function canContinue(a) {
        if (!a.dir) return false;
        const c = Math.floor(a.x);
        const r = Math.floor(a.y);
        let nc = c + a.dir.x;
        const nr = r + a.dir.y;
        if (wrapRow(r)) {
          if (nc < 0) nc = COLS - 1;
          if (nc >= COLS) nc = 0;
        }
        return canAgentEnterCell(a, nc, nr);
      }

      function dirFromVector(x, y) {
        return DIRS.find((d) => d.x === x && d.y === y) || DIRS[0];
      }

      addEventListener('resize', () => {
        resizeCanvas();
      });

      addEventListener('click', () => {
        warmSeconds = 0;
        reset(randomSeed());
      });

      addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R' || e.key === ' ') {
          e.preventDefault();
          warmSeconds = 0;
          reset(randomSeed());
        }
      });

      reset(seed);
    </script>
  </body>
</html>
