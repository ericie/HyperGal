<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Only Ghosts - HyperGal</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020208; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="380ba6de-d087-4f44-a235-7dd4b9b174f9"></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      const TAU = Math.PI * 2;

      const MAZE = [
        '#################',
        '#.....#...#.....#',
        '#.###.#.#.#.###.#',
        '#.#.....#.....#.#',
        '#.#...#####...#.#',
        '#.....#...#.....#',
        '#.###.#.#.#.###.#',
        '#.#.....#.....#.#',
        '#.#...#####...#.#',
        '#...............#',
        '#################',
      ];

      const POWER_CELLS = [
        [1, 1], [8, 1], [15, 1],
        [3, 3], [13, 3],
        [1, 5], [15, 5],
        [3, 7], [13, 7],
        [1, 9], [8, 9], [15, 9],
      ];

      const DIRS = [
        { x: 1, y: 0, angle: 0 },
        { x: 0, y: 1, angle: Math.PI / 2 },
        { x: -1, y: 0, angle: Math.PI },
        { x: 0, y: -1, angle: -Math.PI / 2 },
      ];

      const ROWS = MAZE.length;
      const COLS = MAZE[0].length;
      const PAC_SPEED = 3.15;
      const keyOf = (c, r) => `${c},${r}`;
      const lerp = (a, b, t) => a + (b - a) * t;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let cellWidth = 1;
      let cellHeight = 1;
      let unit = 1;
      let lastTime = performance.now();
      let powerPellets = new Set();

      const pac = {
        c: 8,
        r: 5,
        x: 8.5,
        y: 5.5,
        next: null,
        step: 0,
        dir: DIRS[2],
        mouth: 0,
      };

      function resetPowerPellets() {
        powerPellets = new Set(POWER_CELLS.map(([c, r]) => keyOf(c, r)));
      }

      function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellWidth = width / COLS;
        cellHeight = height / ROWS;
        unit = Math.min(cellWidth, cellHeight);
      }

      function isOpen(c, r) {
        return r >= 0 && r < ROWS && c >= 0 && c < COLS && MAZE[r][c] !== '#';
      }

      function neighbors(c, r) {
        const result = [];
        for (const dir of DIRS) {
          const nc = c + dir.x;
          const nr = r + dir.y;
          if (isOpen(nc, nr)) result.push({ c: nc, r: nr, dir });
        }
        return result;
      }

      function pathToNearestPowerPellet(startC, startR) {
        const queue = [{ c: startC, r: startR, path: [] }];
        const seen = new Set([keyOf(startC, startR)]);

        for (let head = 0; head < queue.length; head++) {
          const current = queue[head];
          if (powerPellets.has(keyOf(current.c, current.r))) return current.path;

          for (const next of neighbors(current.c, current.r)) {
            const key = keyOf(next.c, next.r);
            if (seen.has(key)) continue;
            seen.add(key);
            queue.push({
              c: next.c,
              r: next.r,
              path: current.path.concat(next),
            });
          }
        }

        return [];
      }

      function consumePowerPellet() {
        if (!powerPellets.delete(keyOf(pac.c, pac.r))) return;
        if (powerPellets.size === 0) resetPowerPellets();
      }

      function chooseNextStep() {
        consumePowerPellet();
        const path = pathToNearestPowerPellet(pac.c, pac.r);
        if (path.length === 0) return;
        pac.next = path[0];
        pac.dir = pac.next.dir;
        pac.step = 0;
      }

      function update(dt) {
        pac.mouth += dt * 12;
        if (!pac.next) chooseNextStep();
        if (!pac.next) return;

        pac.step = Math.min(1, pac.step + dt * PAC_SPEED);
        pac.x = lerp(pac.c + 0.5, pac.next.c + 0.5, pac.step);
        pac.y = lerp(pac.r + 0.5, pac.next.r + 0.5, pac.step);

        if (pac.step < 1) return;
        pac.c = pac.next.c;
        pac.r = pac.next.r;
        pac.x = pac.c + 0.5;
        pac.y = pac.r + 0.5;
        pac.next = null;
        consumePowerPellet();
      }

      function drawMaze() {
        ctx.fillStyle = '#05050d';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#11194f';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (MAZE[r][c] !== '#') continue;
            ctx.fillRect(c * cellWidth, r * cellHeight, cellWidth, cellHeight);
          }
        }

        ctx.strokeStyle = '#365cff';
        ctx.lineWidth = Math.max(2, unit * 0.065);
        ctx.lineCap = 'square';
        ctx.beginPath();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (MAZE[r][c] !== '#') continue;
            const left = c * cellWidth;
            const top = r * cellHeight;
            const right = left + cellWidth;
            const bottom = top + cellHeight;
            if (isOpen(c, r - 1)) { ctx.moveTo(left, top); ctx.lineTo(right, top); }
            if (isOpen(c, r + 1)) { ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); }
            if (isOpen(c - 1, r)) { ctx.moveTo(left, top); ctx.lineTo(left, bottom); }
            if (isOpen(c + 1, r)) { ctx.moveTo(right, top); ctx.lineTo(right, bottom); }
          }
        }
        ctx.stroke();
      }

      function drawPowerPellets() {
        ctx.fillStyle = '#fff2bd';
        const radius = Math.max(3, unit * 0.13);
        for (const key of powerPellets) {
          const [c, r] = key.split(',').map(Number);
          ctx.beginPath();
          ctx.arc((c + 0.5) * cellWidth, (r + 0.5) * cellHeight, radius, 0, TAU);
          ctx.fill();
        }
      }

      function drawPac() {
        const x = pac.x * cellWidth;
        const y = pac.y * cellHeight;
        const radius = unit * 0.38;
        const mouth = 0.12 + Math.abs(Math.sin(pac.mouth)) * 0.32;

        ctx.fillStyle = '#ffe83d';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.arc(x, y, radius, pac.dir.angle + mouth, pac.dir.angle - mouth, false);
        ctx.closePath();
        ctx.fill();

        const eyeX = x + pac.dir.x * radius * 0.18;
        const eyeY = y - radius * 0.34;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, radius * 0.115, 0, TAU);
        ctx.fill();
      }

      function draw() {
        drawMaze();
        drawPowerPellets();
        drawPac();
      }

      function frame(time) {
        const dt = Math.min(1 / 20, Math.max(0, (time - lastTime) / 1000));
        lastTime = time;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      resetPowerPellets();
      resize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
