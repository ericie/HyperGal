<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="A little Logo turtle joins the dots of a handwritten Hypermedia Club.">
  <title>Hypermedia Title 03 — Connect the Dots</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 27H3Z' fill='none' stroke='%23b6fa82' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101411; color: #dce9d6; }
    body { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    main { width: 100%; height: 100svh; display: grid; place-items: center; }
    svg { width: 92vw; max-width: 1500px; height: auto; overflow: visible; }
    .ink { fill: none; stroke: #dce9d6; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #8eaa84; }
    #turtle { fill: #101411; stroke: #b6fa82; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    footer { position: fixed; bottom: 28px; left: 4vw; right: 4vw; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .caption { font-size: 10px; letter-spacing: .16em; color: #82917d; text-transform: uppercase; }
    .controls { display: flex; gap: 8px; }
    button { color: #a9b9a2; background: transparent; border: 1px solid #374434; border-radius: 4px; padding: 9px 12px; font: inherit; font-size: 11px; cursor: pointer; }
    button:hover { border-color: #b6fa82; color: #b6fa82; }
    button:focus-visible { outline: 2px solid #b6fa82; outline-offset: 4px; }
    @media (max-width: 500px) { footer { bottom: 20px; } .caption { font-size: 8px; max-width: 130px; line-height: 1.8; } }
  </style>
</head>
<body>
  <main aria-label="Hypermedia Club written in dotted cursive, traced from left to right by a turtle.">
    <svg viewBox="-20 -105 875 230" role="img" aria-labelledby="title desc">
      <title id="title">Hypermedia Club</title>
      <desc id="desc">A Logo-style turtle follows a single line of cursive handwriting, connecting the disconnected dots.</desc>
      <g id="dots"></g>
      <g id="lines" class="ink"></g>
      <g id="turtle" aria-hidden="true">
        <path d="M 10,0 L -7,-6 L -7,6 Z"/>
      </g>
    </svg>
  </main>
  <footer>
    <span class="caption">Hypermedia Club · Turtle graphics</span>
    <div class="controls"><button id="pause" aria-pressed="false">Pause</button><button id="replay">Replay ↺</button></div>
  </footer>
  <script src="drawing.js"></script>
</body>
</html>
