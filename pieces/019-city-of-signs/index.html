<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A precise black-and-white geometric city reconstructed from circles, rectangles, polygons, and filled arcs."
    />
    <title>City of Signs · HyperGal</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: min(94vmin, 1100px);
        height: min(94vmin, 1100px);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img
      src="./artwork.svg"
      alt="A compact black-and-white geometric city with seven joined towers, circular domes, flags, arches, rosettes, diamonds, an ornamental belt, and a colonnaded base."
    />
  </body>
</html>
