<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="An architectural ink city of white walls, deep black recesses, fine railings and working rooftops."
    />
    <title>City of Signs · HyperGal</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      body { overscroll-behavior: none; }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid #000;
        outline-offset: -8px;
      }

      #debug-catalog[hidden] { display: none; }

      html.debug-mode {
        min-height: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: scroll;
      }

      body.debug-mode {
        min-height: 100%;
        height: auto;
        overflow: visible;
        background: #dededb;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body.debug-mode #city { display: none; }

      .debug-catalog {
        min-height: 100vh;
        padding: clamp(18px, 3vw, 42px);
        background: #dededb;
      }

      .debug-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #111;
      }

      .debug-header h1,
      .debug-header p,
      .debug-specimen { margin: 0; }

      .debug-header h1 {
        font-size: clamp(1.25rem, 2.3vw, 2rem);
        letter-spacing: -0.025em;
        line-height: 1;
      }

      .debug-header p {
        color: #555;
        font-size: 0.875rem;
      }

      .catalog-links { display: flex; gap: 16px; margin-top: 10px; font-size: 0.875rem; }
      .catalog-links a { color: inherit; text-underline-offset: 3px; }
      .catalog-links a:focus-visible { outline: 2px solid #111; outline-offset: 4px; }

      .debug-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
        border-left: 1px solid #aaa;
      }

      .debug-specimen {
        display: grid;
        min-width: 0;
        grid-template-rows: minmax(250px, 1fr) auto;
        border-right: 1px solid #aaa;
        border-bottom: 1px solid #aaa;
      }

      .debug-specimen-canvas {
        position: static;
        inset: auto;
        width: 100%;
        height: clamp(250px, 27vw, 340px);
        cursor: default;
        touch-action: auto;
      }

      .debug-caption {
        display: grid;
        grid-template-columns: 2.5rem minmax(0, 1fr);
        gap: 10px;
        min-height: 66px;
        padding: 12px 14px;
        border-top: 1px solid #aaa;
      }

      .debug-number {
        color: #666;
        font-variant-numeric: tabular-nums;
      }

      .debug-name,
      .debug-group { display: block; }

      .debug-name {
        font-size: 0.9375rem;
        line-height: 1.2;
      }

      .debug-group {
        margin-top: 4px;
        color: #666;
        font-size: 0.75rem;
        line-height: 1.2;
      }

      @media (max-width: 520px) {
        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="city"
      tabindex="0"
      role="img"
      aria-label="An architectural ink drawing of Tokyo with sunlit white walls, deep black recesses, projecting balconies, fine steel railings, connected exterior stairs and working rooftops. Click, tap, or press Enter or Space to construct another arrangement."
    ></canvas>

    <main id="debug-catalog" class="debug-catalog" hidden>
      <header class="debug-header">
        <h1>City of Signs · block studies</h1>
        <div><p id="debug-count"></p><nav class="catalog-links" aria-label="Artwork views"><a href="./?seed=1907">View city</a><a href="./?debug=true">Active blocks</a><a href="./?debug=true&amp;all=true">Full archive</a></nav></div>
      </header>
      <div id="debug-grid" class="debug-grid"></div>
    </main>

    <script src="./city.js"></script>
  </body>
</html>
