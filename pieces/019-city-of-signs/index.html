<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A playful city of intricate modular buildings assembled from a disciplined kit of geometric shapes and patterns."
    />
    <title>City of Signs · HyperGal</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f1f3ef;
      }

      body { overscroll-behavior: none; }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid #27343a;
        outline-offset: -8px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="city"
      tabindex="0"
      role="img"
      aria-label="A playful geometric city. Every building is assembled from simple blocks, arches, circles, stairs, domes, tiles, and patterned facades in coral, blue, yellow, and deep blue-gray. Click, tap, or press Enter to build another city."
    ></canvas>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('city');
        const ctx = canvas.getContext('2d', { alpha: false });
        const TAU = Math.PI * 2;
        const palette = {
          paper: '#f1f3ef',
          ink: '#27343a',
          coral: '#e85c44',
          yellow: '#efc44f',
          blue: '#6381cd',
          pale: '#dce4dc'
        };
        const colors = [palette.coral, palette.yellow, palette.blue, palette.paper];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let seed = 1907;
        let buildings = [];
        let bridges = [];

        function randomFactory(value) {
          return () => {
            value |= 0;
            value = (value + 0x6d2b79f5) | 0;
            let result = Math.imul(value ^ (value >>> 15), 1 | value);
            result = (result + Math.imul(result ^ (result >>> 7), 61 | result)) ^ result;
            return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
          };
        }

        function clamp(value, low, high) {
          return Math.max(low, Math.min(high, value));
        }

        function choose(random, values) {
          return values[Math.floor(random() * values.length)];
        }

        function snap(value, unit) {
          return Math.round(value / unit) * unit;
        }

        function circle(x, y, radius, fill, stroke = null, lineWidth = 0) {
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TAU);
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function flower(x, y, radius, petal, center, stroke) {
          for (let i = 0; i < 5; i += 1) {
            const angle = -Math.PI * 0.5 + (i * TAU) / 5;
            circle(
              x + Math.cos(angle) * radius * 0.48,
              y + Math.sin(angle) * radius * 0.48,
              radius * 0.42,
              petal,
              palette.ink,
              stroke * 0.45
            );
          }
          circle(x, y, radius * 0.32, center, palette.ink, stroke * 0.42);
        }

        function rect(x, y, w, h, fill, stroke = null, lineWidth = 0) {
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(x, y, w, h);
          }
        }

        function polygon(points, fill, stroke = null, lineWidth = 0) {
          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function line(x1, y1, x2, y2, stroke, lineWidth) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }

        function arch(x, y, w, h, fill, stroke, lineWidth) {
          const radius = w * 0.5;
          ctx.beginPath();
          ctx.moveTo(x, y + radius);
          ctx.arc(x + radius, y + radius, radius, Math.PI, 0);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function scallopStrip(x, y, w, h, fill, background, count, stroke) {
          rect(x, y, w, h, background);
          const size = w / count;
          ctx.fillStyle = fill;
          for (let i = 0; i < count; i += 1) {
            ctx.beginPath();
            ctx.arc(x + size * (i + 0.5), y + h * 0.34, size * 0.48, 0, Math.PI);
            ctx.lineTo(x + size * (i + 1), y + h);
            ctx.lineTo(x + size * i, y + h);
            ctx.closePath();
            ctx.fill();
          }
          if (stroke) rect(x, y, w, h, null, palette.ink, stroke);
        }

        function drawPattern(panel, motif, a, b, stroke) {
          const { x, y, w, h } = panel;
          rect(x, y, w, h, b, palette.ink, stroke);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x + stroke * 0.5, y + stroke * 0.5, w - stroke, h - stroke);
          ctx.clip();

          if (motif === 'checker') {
            const unit = clamp(Math.min(w / 4, h / 6), 6, 18);
            for (let row = 0; y + row * unit < y + h; row += 1) {
              for (let col = 0; x + col * unit < x + w; col += 1) {
                if ((row + col) % 2 === 0) rect(x + col * unit, y + row * unit, unit, unit, a);
              }
            }
          } else if (motif === 'arches') {
            const columns = w < 48 ? 1 : 2;
            const gap = stroke * 1.5;
            const aw = (w - gap * (columns + 1)) / columns;
            const rows = Math.max(1, Math.floor(h / (aw * 1.35)));
            const ah = (h - gap * (rows + 1)) / rows;
            for (let row = 0; row < rows; row += 1) {
              for (let col = 0; col < columns; col += 1) {
                arch(x + gap + col * (aw + gap), y + gap + row * (ah + gap), aw, ah, a, null, 0);
              }
            }
          } else if (motif === 'dots') {
            const unit = clamp(w / 3.2, 10, 24);
            const radius = unit * 0.24;
            for (let row = 0; y + unit * (row + 0.6) < y + h; row += 1) {
              for (let col = 0; x + unit * (col + 0.55) < x + w; col += 1) {
                circle(x + unit * (col + 0.55) + (row % 2) * unit * 0.46, y + unit * (row + 0.65), radius, a);
              }
            }
          } else if (motif === 'lozenges') {
            const unit = clamp(w / 3.1, 11, 25);
            for (let row = 0; y + row * unit < y + h + unit; row += 1) {
              for (let col = 0; x + col * unit < x + w + unit; col += 1) {
                const cx = x + col * unit + (row % 2) * unit * 0.5;
                const cy = y + row * unit;
                polygon([[cx, cy - unit * 0.36], [cx + unit * 0.36, cy], [cx, cy + unit * 0.36], [cx - unit * 0.36, cy]], a);
              }
            }
          } else if (motif === 'steps') {
            const bands = Math.max(3, Math.round(h / 20));
            const band = h / bands;
            for (let row = 0; row < bands; row += 1) {
              const inset = (row % 3) * w * 0.13;
              rect(x + inset, y + row * band, w - inset * 2, band * 0.48, a);
            }
          } else if (motif === 'bricks') {
            const bw = clamp(w * 0.42, 14, 34);
            const bh = clamp(bw * 0.46, 8, 16);
            for (let row = -1; y + row * bh < y + h; row += 1) {
              const offset = row % 2 ? -bw * 0.5 : 0;
              for (let col = -1; x + col * bw < x + w; col += 1) {
                rect(x + col * bw + offset, y + row * bh, bw - stroke, bh - stroke, a);
              }
            }
          } else {
            const bands = Math.max(3, Math.round(w / 13));
            const band = w / bands;
            for (let col = 0; col < bands; col += 1) {
              if (col % 2 === 0) rect(x + col * band, y, band, h, a);
            }
          }
          ctx.restore();
        }

        function makeBuilding(random, index, x, cellWidth, base, previous) {
          const unit = clamp(cellWidth / 12, 4, 10);
          const w = snap(cellWidth * (0.82 + random() * 0.16), unit);
          const bx = snap(x + (cellWidth - w) * random(), unit * 0.5);
          const independentHeight = height * (0.47 + random() * 0.29);
          const h = previous
            ? clamp(previous.h * (0.72 + random() * 0.36) + (independentHeight - previous.h) * 0.58, height * 0.42, height * 0.79)
            : independentHeight;
          const top = snap(base - h, unit);
          const inheritedMotif = previous && random() < 0.58 ? previous.motif : null;
          const motif = inheritedMotif || choose(random, ['checker', 'arches', 'dots', 'lozenges', 'steps', 'bricks', 'stripes']);
          const colorIndex = previous ? (previous.colorIndex + 1 + Math.floor(random() * 2)) % 3 : Math.floor(random() * 3);
          const main = colors[colorIndex];
          const second = colors[(colorIndex + 1 + Math.floor(random() * 2)) % 3];
          const side = random() < 0.5 ? -1 : 1;
          let grammar = (index + Math.floor(random() * 4)) % 5;
          if (previous && grammar === previous.grammar) grammar = (grammar + 1) % 5;
          const split = clamp(0.38 + random() * 0.2, 0.38, 0.58);
          const lowerH = (base - top) * split;
          const upperScale = grammar === 1 ? 0.88 + random() * 0.18 : grammar === 3 ? 0.38 + random() * 0.18 : 0.52 + random() * 0.28;
          const upperW = snap(w * upperScale, unit);
          const upperX = grammar === 1
            ? bx + (side < 0 ? -unit * 0.7 : w - upperW + unit * 0.7)
            : side < 0 ? bx + unit * random() : bx + w - upperW - unit * random();
          const upperH = base - top - lowerH + unit * (1 + Math.floor(random() * 3));

          return {
            index,
            x: bx,
            y: top,
            w,
            h: base - top,
            base,
            unit,
            motif,
            secondaryMotif: choose(random, ['checker', 'arches', 'dots', 'lozenges', 'steps', 'bricks', 'stripes']),
            colorIndex,
            main,
            second,
            side,
            grammar,
            lowerH,
            upperX,
            upperW,
            upperH,
            roof: Math.floor(random() * 6),
            attachment: Math.floor(random() * 5),
            cutout: Math.floor(random() * 4),
            finial: Math.floor(random() * 4),
            randomValues: Array.from({ length: 12 }, () => random())
          };
        }

        function buildCity() {
          const random = randomFactory(seed);
          const count = width < 500 ? 4 : width < 800 ? 5 : clamp(Math.round(width / 180), 6, 9);
          const margin = width < 500 ? 5 : clamp(width * 0.018, 10, 30);
          const usable = width - margin * 2;
          const cell = usable / count;
          const base = height * 0.94;
          buildings = [];
          bridges = [];

          for (let i = 0; i < count; i += 1) {
            const building = makeBuilding(random, i, margin + i * cell, cell, base, buildings[i - 1]);
            buildings.push(building);
            if (i > 0 && random() < 0.48) {
              const left = buildings[i - 1];
              bridges.push({
                left,
                right: building,
                level: 0.28 + random() * 0.42,
                style: Math.floor(random() * 3),
                color: random() < 0.62 ? left.second : building.main
              });
            }
          }
        }

        function drawSky(random) {
          ctx.fillStyle = palette.paper;
          ctx.fillRect(0, 0, width, height);

          const sunR = clamp(Math.min(width, height) * 0.088, 34, 76);
          circle(width * 0.83, height * 0.13, sunR, palette.yellow, palette.ink, clamp(width * 0.0025, 2, 4));

          const clouds = width < 520 ? 2 : 4;
          for (let i = 0; i < clouds; i += 1) {
            const x = width * (0.05 + random() * 0.72);
            const y = height * (0.09 + random() * 0.2);
            const size = clamp(width * (0.025 + random() * 0.018), 13, 34);
            const fill = i % 2 ? palette.pale : palette.paper;
            circle(x, y, size * 0.55, fill, palette.ink, 2);
            circle(x + size * 0.62, y - size * 0.22, size * 0.78, fill, palette.ink, 2);
            circle(x + size * 1.35, y, size * 0.58, fill, palette.ink, 2);
            rect(x - size * 0.03, y, size * 1.42, size * 0.5, fill);
            line(x, y + size * 0.48, x + size * 1.35, y + size * 0.48, palette.ink, 2);
          }

          ctx.lineCap = 'round';
          for (let i = 0; i < (width < 520 ? 3 : 6); i += 1) {
            const x = width * (0.08 + random() * 0.8);
            const y = height * (0.16 + random() * 0.24);
            const s = 5 + random() * 7;
            line(x - s, y, x, y - s * 0.48, palette.ink, 2);
            line(x, y - s * 0.48, x + s, y, palette.ink, 2);
          }
          ctx.lineCap = 'butt';
        }

        function drawAttachment(building, stroke) {
          const { x, y, w, h, unit, side, attachment, main, second, randomValues } = building;
          const attachmentW = clamp(w * (0.23 + randomValues[0] * 0.14), unit * 2.5, w * 0.4);
          const ax = side < 0 ? x - attachmentW * 0.62 : x + w - attachmentW * 0.38;
          const ay = y + h * (0.37 + randomValues[1] * 0.24);
          const ah = building.base - ay;

          if (attachment === 0) {
            arch(ax, ay, attachmentW, ah, second, palette.ink, stroke);
            circle(ax + attachmentW * 0.5, ay + attachmentW * 0.5, attachmentW * 0.16, palette.paper, palette.ink, stroke * 0.72);
          } else if (attachment === 1) {
            rect(ax, ay + unit, attachmentW, ah - unit, second, palette.ink, stroke);
            polygon([[ax, ay + unit], [ax + attachmentW * 0.52, ay - unit * 1.5], [ax + attachmentW, ay + unit]], main, palette.ink, stroke);
          } else if (attachment === 2) {
            rect(ax, ay, attachmentW, ah, palette.paper, palette.ink, stroke);
            scallopStrip(ax, ay + unit, attachmentW, clamp(unit * 2.4, 14, 30), main, palette.paper, 3, stroke * 0.65);
          } else if (attachment === 3) {
            const drumR = attachmentW * 0.5;
            rect(ax, ay + drumR, attachmentW, ah - drumR, second, palette.ink, stroke);
            circle(ax + drumR, ay + drumR, drumR, second, palette.ink, stroke);
            for (let i = 0; i < 3; i += 1) {
              const angle = -Math.PI * 0.5 + (i * TAU) / 3;
              circle(ax + drumR + Math.cos(angle) * drumR * 0.38, ay + drumR + Math.sin(angle) * drumR * 0.38, drumR * 0.13, palette.paper);
            }
          } else {
            rect(ax, ay + unit * 1.5, attachmentW, ah - unit * 1.5, second, palette.ink, stroke);
            for (let step = 0; step < 3; step += 1) {
              rect(
                side < 0 ? ax + step * unit * 0.48 : ax,
                ay + step * unit * 0.5,
                attachmentW - step * unit * 0.48,
                unit * 0.55,
                main,
                palette.ink,
                stroke * 0.45
              );
            }
          }
        }

        function drawRoof(building, stroke) {
          const { upperX: x, y, upperW: w, unit, roof, main, second } = building;
          const topY = y + unit * 0.8;
          if (roof === 0) {
            polygon([[x, topY], [x + w * 0.35, y - unit * 2.8], [x + w, topY]], second, palette.ink, stroke);
            circle(x + w * 0.35, y - unit * 3.15, unit * 0.55, palette.coral, palette.ink, stroke * 0.55);
          } else if (roof === 1) {
            ctx.beginPath();
            ctx.moveTo(x, topY);
            ctx.arc(x + w * 0.5, topY, w * 0.5, Math.PI, 0);
            ctx.closePath();
            ctx.fillStyle = second;
            ctx.fill();
            ctx.strokeStyle = palette.ink;
            ctx.lineWidth = stroke;
            ctx.stroke();
            circle(x + w * 0.5, topY - w * 0.5, unit * 0.55, palette.yellow, palette.ink, stroke * 0.5);
          } else if (roof === 2) {
            const steps = 3;
            for (let i = 0; i < steps; i += 1) {
              const inset = i * w * 0.12;
              rect(x + inset, topY - i * unit * 1.25, w - inset * 2, unit * 1.25, i % 2 ? main : second, palette.ink, stroke * 0.55);
            }
          } else if (roof === 3) {
            polygon([[x, topY], [x + w * 0.18, y - unit * 2], [x + w * 0.82, y - unit * 2], [x + w, topY]], main, palette.ink, stroke);
            rect(x + w * 0.38, y - unit * 3.6, w * 0.24, unit * 1.6, second, palette.ink, stroke * 0.65);
          } else if (roof === 4) {
            rect(x, topY - unit * 1.2, w, unit * 1.2, second, palette.ink, stroke);
            const teeth = 4;
            for (let i = 0; i < teeth; i += 1) {
              rect(x + (i * w) / teeth, topY - unit * 2.15, w / teeth * 0.55, unit, main, palette.ink, stroke * 0.45);
            }
          } else {
            polygon([[x, topY], [x + w * 0.5, y - unit * 2.6], [x + w, topY], [x + w * 0.72, topY], [x + w * 0.5, y - unit * 0.8], [x + w * 0.28, topY]], second, palette.ink, stroke);
          }
        }

        function drawFinial(building, stroke) {
          const { upperX, upperW, y, unit, finial, main, second, side } = building;
          const x = upperX + upperW * (side < 0 ? 0.72 : 0.28);
          const top = y - unit * (finial === 3 ? 5.2 : 3.5);
          line(x, y - unit * 0.8, x, top, palette.ink, stroke * 0.65);
          if (finial === 0) {
            circle(x, top, unit * 0.62, palette.coral, palette.ink, stroke * 0.5);
          } else if (finial === 1) {
            polygon([[x, top - unit * 0.8], [x + unit * 0.75, top], [x, top + unit * 0.8], [x - unit * 0.75, top]], second, palette.ink, stroke * 0.48);
          } else if (finial === 2) {
            circle(x, top + unit * 0.55, unit * 0.5, main, palette.ink, stroke * 0.45);
            circle(x, top - unit * 0.4, unit * 0.34, palette.yellow, palette.ink, stroke * 0.4);
          } else {
            for (let i = 0; i < 3; i += 1) circle(x, top + i * unit * 0.95, unit * (0.32 + i * 0.08), i === 1 ? second : main, palette.ink, stroke * 0.38);
          }
        }

        function drawCutout(building, stroke) {
          const { x, w, base, unit, cutout, main, second, randomValues } = building;
          const doorW = clamp(w * (0.22 + randomValues[2] * 0.16), unit * 2, w * 0.42);
          const dx = x + unit + randomValues[3] * Math.max(unit, w - doorW - unit * 2);
          const doorH = clamp(unit * (3.8 + randomValues[4] * 3), 24, building.h * 0.23);

          if (cutout === 0) {
            arch(dx, base - doorH, doorW, doorH + stroke, palette.paper, palette.ink, stroke);
          } else if (cutout === 1) {
            rect(dx, base - doorH, doorW, doorH, palette.paper, palette.ink, stroke);
            rect(dx + doorW * 0.24, base - doorH * 0.76, doorW * 0.52, doorH * 0.76, second);
          } else if (cutout === 2) {
            const columns = 3;
            for (let i = 0; i < columns; i += 1) {
              arch(dx + (i * doorW) / columns, base - doorH, doorW / columns, doorH, i === 1 ? main : palette.paper, palette.ink, stroke * 0.5);
            }
          } else {
            polygon([[dx, base], [dx, base - doorH * 0.55], [dx + doorW * 0.5, base - doorH], [dx + doorW, base - doorH * 0.55], [dx + doorW, base]], palette.paper, palette.ink, stroke);
          }
        }

        function drawBuilding(building) {
          const { x, y, w, h, base, unit, motif, secondaryMotif, main, second, side, grammar, randomValues } = building;
          const stroke = clamp(width * 0.0026, 2.25, 4.5);
          const inset = unit * 0.78;

          if (grammar !== 2 && grammar !== 4) drawAttachment(building, stroke);

          if (grammar === 0) {
            const lowerY = base - building.lowerH;
            rect(x, lowerY, w, building.lowerH, main, palette.ink, stroke);
            drawPattern(
              { x: x + inset, y: lowerY + inset, w: w - inset * 2, h: Math.max(unit * 3, building.lowerH - inset * 2 - unit * 2.2) },
              motif,
              second,
              palette.paper,
              stroke * 0.68
            );

            const upperBottom = lowerY + unit * (1 + randomValues[5]);
            const upperY = upperBottom - building.upperH;
            rect(building.upperX, upperY, building.upperW, building.upperH, second, palette.ink, stroke);
            const panelW = Math.max(unit * 2.2, building.upperW - unit * 1.6);
            const panelH = Math.max(unit * 3, building.upperH * (0.34 + randomValues[6] * 0.2));
            drawPattern(
              { x: building.upperX + (building.upperW - panelW) * 0.5, y: upperY + unit * 2.1, w: panelW, h: panelH },
              secondaryMotif,
              main,
              palette.paper,
              stroke * 0.62
            );
            const balconyY = upperY + panelH + unit * (3 + randomValues[7]);
            line(building.upperX - unit * 0.5, balconyY, building.upperX + building.upperW + unit * 0.5, balconyY, palette.ink, stroke * 1.15);
            const beadCount = clamp(Math.floor(building.upperW / (unit * 1.6)), 2, 6);
            for (let i = 0; i < beadCount; i += 1) {
              const bx = building.upperX + ((i + 0.5) * building.upperW) / beadCount;
              circle(bx, balconyY + unit * 0.75, unit * 0.28, i % 2 ? palette.yellow : palette.coral, palette.ink, stroke * 0.4);
            }
            drawRoof({ ...building, y: upperY }, stroke);
            drawFinial({ ...building, y: upperY }, stroke);
            drawCutout(building, stroke);
          } else if (grammar === 1) {
            const tierHeights = [h * 0.38, h * 0.29, h * 0.23];
            const tierWidths = [w, w * 0.78, w * 0.53];
            const shifts = [0, side < 0 ? -unit * 0.45 : w - tierWidths[1] + unit * 0.45, side < 0 ? w * 0.08 : w - tierWidths[2] - w * 0.08];
            let currentY = base;
            for (let i = 0; i < 3; i += 1) {
              currentY -= tierHeights[i];
              const tx = x + shifts[i];
              const fill = i === 0 ? main : i === 1 ? second : colors[(building.colorIndex + 2) % 3];
              rect(tx, currentY, tierWidths[i], tierHeights[i] + stroke, fill, palette.ink, stroke);
              if (i === 0) {
                drawPattern({ x: tx + inset, y: currentY + inset, w: tierWidths[i] - inset * 2, h: tierHeights[i] - inset * 2 }, motif, second, palette.paper, stroke * 0.62);
              } else if (i === 1) {
                scallopStrip(tx + inset * 0.7, currentY + inset, tierWidths[i] - inset * 1.4, unit * 2.7, main, palette.paper, 4, stroke * 0.56);
                const slots = 3;
                for (let slot = 0; slot < slots; slot += 1) {
                  arch(tx + unit + (slot * (tierWidths[i] - unit * 2)) / slots, currentY + unit * 4.3, (tierWidths[i] - unit * 2.8) / slots, tierHeights[i] - unit * 5, palette.paper, palette.ink, stroke * 0.48);
                }
              } else {
                circle(tx + tierWidths[i] * 0.5, currentY + tierHeights[i] * 0.5, Math.min(tierWidths[i], tierHeights[i]) * 0.23, palette.paper, palette.ink, stroke * 0.7);
                circle(tx + tierWidths[i] * 0.5, currentY + tierHeights[i] * 0.5, unit * 0.5, main);
              }
            }
            const roofBuilding = { ...building, upperX: x + shifts[2], upperW: tierWidths[2], y: currentY };
            drawRoof(roofBuilding, stroke);
            drawFinial(roofBuilding, stroke);
            drawCutout(building, stroke);
          } else if (grammar === 2) {
            const plinthH = h * 0.25;
            rect(x, base - plinthH, w, plinthH, main, palette.ink, stroke);
            scallopStrip(x + inset, base - plinthH + inset, w - inset * 2, unit * 2.8, second, palette.paper, 5, stroke * 0.55);

            const gap = unit * 1.25;
            const leftW = w * (0.43 + randomValues[0] * 0.08);
            const rightW = w - leftW - gap;
            const leftH = h * (0.66 + randomValues[1] * 0.18);
            const rightH = h * (0.52 + randomValues[2] * 0.2);
            const lx = x;
            const rx = x + leftW + gap;
            const ly = base - plinthH - leftH;
            const ry = base - plinthH - rightH;
            rect(lx, ly, leftW, leftH, second, palette.ink, stroke);
            rect(rx, ry, rightW, rightH, colors[(building.colorIndex + 2) % 3], palette.ink, stroke);
            drawPattern({ x: lx + inset, y: ly + inset * 1.3, w: leftW - inset * 2, h: leftH * 0.48 }, motif, main, palette.paper, stroke * 0.58);
            drawPattern({ x: rx + inset * 0.7, y: ry + inset * 1.2, w: rightW - inset * 1.4, h: rightH * 0.57 }, secondaryMotif, second, palette.paper, stroke * 0.56);

            const bridgeY = Math.max(ly, ry) + Math.min(leftH, rightH) * 0.36;
            arch(lx + leftW * 0.58, bridgeY, rx + rightW * 0.42 - (lx + leftW * 0.58), unit * 4.2, palette.yellow, palette.ink, stroke);
            const leftRoof = { ...building, upperX: lx, upperW: leftW, y: ly, roof: (building.roof + 1) % 6 };
            const rightRoof = { ...building, upperX: rx, upperW: rightW, y: ry, roof: (building.roof + 4) % 6, finial: (building.finial + 2) % 4 };
            drawRoof(leftRoof, stroke);
            drawRoof(rightRoof, stroke);
            drawFinial(side < 0 ? leftRoof : rightRoof, stroke);
            drawCutout(building, stroke);
          } else if (grammar === 3) {
            const modules = 4;
            let moduleBottom = base;
            let previousX = x + w * 0.12;
            for (let i = 0; i < modules; i += 1) {
              const mh = h * (i === 0 ? 0.27 : 0.19 + randomValues[i] * 0.035);
              const mw = w * (i === 0 ? 0.82 : 0.56 + randomValues[i + 4] * 0.28);
              const drift = (i % 2 === 0 ? -1 : 1) * w * (0.06 + randomValues[i + 7] * 0.06);
              const mx = clamp(previousX + drift, x - unit * 0.6, x + w - mw + unit * 0.6);
              moduleBottom -= mh;
              const fill = colors[(building.colorIndex + i) % 3];
              rect(mx, moduleBottom, mw, mh + stroke, fill, palette.ink, stroke);
              if (i === 0 || i === 2) {
                drawPattern({ x: mx + inset * 0.72, y: moduleBottom + inset * 0.72, w: mw - inset * 1.44, h: mh - inset * 1.44 }, i === 0 ? motif : secondaryMotif, colors[(building.colorIndex + i + 1) % 3], palette.paper, stroke * 0.55);
              } else {
                const bloom = Math.min(mw, mh) * 0.2;
                flower(mx + mw * (i % 3 === 0 ? 0.68 : 0.34), moduleBottom + mh * 0.5, bloom, palette.paper, second, stroke);
                rect(mx + mw * 0.73, moduleBottom + mh * 0.28, unit * 0.8, unit * 0.8, palette.yellow, palette.ink, stroke * 0.42);
              }
              previousX = mx;
            }
            const topBuilding = { ...building, upperX: previousX, upperW: w * 0.58, y: moduleBottom };
            drawRoof(topBuilding, stroke);
            drawFinial(topBuilding, stroke);
            drawCutout(building, stroke);
          } else {
            const bodyTop = base - h * 0.64;
            rect(x, bodyTop, w, base - bodyTop, main, palette.ink, stroke);
            const passageW = w * (0.36 + randomValues[0] * 0.12);
            const passageX = x + (w - passageW) * (0.38 + randomValues[1] * 0.24);
            arch(passageX, base - h * 0.34, passageW, h * 0.34 + stroke, palette.paper, palette.ink, stroke);

            const leftPanelW = passageX - x - inset * 1.4;
            const rightPanelX = passageX + passageW + inset * 0.4;
            const rightPanelW = x + w - rightPanelX - inset;
            if (leftPanelW > unit * 2) drawPattern({ x: x + inset, y: bodyTop + inset, w: leftPanelW, h: h * 0.24 }, motif, second, palette.paper, stroke * 0.55);
            if (rightPanelW > unit * 2) drawPattern({ x: rightPanelX, y: bodyTop + h * 0.14, w: rightPanelW, h: h * 0.27 }, secondaryMotif, palette.yellow, palette.paper, stroke * 0.55);

            const pavilionW = w * (0.48 + randomValues[2] * 0.18);
            const pavilionX = side < 0 ? x + unit * 0.5 : x + w - pavilionW - unit * 0.5;
            const pavilionH = h * 0.29;
            const pavilionY = bodyTop - pavilionH + unit;
            rect(pavilionX, pavilionY, pavilionW, pavilionH, second, palette.ink, stroke);
            scallopStrip(pavilionX + inset * 0.7, pavilionY + inset, pavilionW - inset * 1.4, unit * 2.6, main, palette.paper, 4, stroke * 0.52);
            const roofBuilding = { ...building, upperX: pavilionX, upperW: pavilionW, y: pavilionY };
            drawRoof(roofBuilding, stroke);
            drawFinial(roofBuilding, stroke);

            const drumR = clamp(unit * 1.7, 10, 20);
            const drumX = side < 0 ? x + w - drumR * 0.45 : x + drumR * 0.45;
            const drumY = bodyTop + h * 0.19;
            flower(drumX, drumY, drumR * 0.82, palette.yellow, palette.coral, stroke);
          }

          if (building.index % 3 === 1) {
            const podR = clamp(unit * 1.25, 7, 14);
            const podX = side < 0 ? x + w - podR * 1.3 : x + podR * 1.3;
            const podY = base - h * 0.28;
            flower(podX, podY, podR * 0.8, palette.yellow, palette.blue, stroke);
          }
        }

        function drawBridge(bridge) {
          const { left, right, level, style, color } = bridge;
          const stroke = clamp(width * 0.0022, 2, 4);
          const x1 = left.x + left.w - left.unit * 0.5;
          const x2 = right.x + right.unit * 0.5;
          if (x2 <= x1) return;
          const y = Math.min(left.base - left.h * level, right.base - right.h * level);
          const h = clamp(Math.min(left.unit, right.unit) * 1.8, 10, 21);

          if (style === 0) {
            rect(x1, y, x2 - x1, h, color, palette.ink, stroke);
            const count = Math.max(2, Math.floor((x2 - x1) / (h * 0.8)));
            for (let i = 0; i < count; i += 1) {
              circle(x1 + ((i + 0.5) * (x2 - x1)) / count, y + h * 0.5, h * 0.18, palette.paper);
            }
          } else if (style === 1) {
            line(x1, y, x2, y, palette.ink, stroke);
            line(x1, y + h, x2, y + h, palette.ink, stroke);
            const count = Math.max(2, Math.floor((x2 - x1) / h));
            for (let i = 0; i <= count; i += 1) {
              const x = x1 + (i * (x2 - x1)) / count;
              line(x, y, x, y + h, i % 2 ? palette.coral : palette.blue, stroke * 1.35);
            }
          } else {
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.quadraticCurveTo((x1 + x2) * 0.5, y + h * 1.4, x2, y);
            ctx.strokeStyle = palette.ink;
            ctx.lineWidth = stroke;
            ctx.stroke();
            const count = 3;
            for (let i = 1; i <= count; i += 1) {
              const x = x1 + (i * (x2 - x1)) / (count + 1);
              const drop = h * (0.7 + (i % 2) * 0.55);
              line(x, y + h * 0.45, x, y + drop, palette.ink, stroke * 0.55);
              circle(x, y + drop + h * 0.25, h * 0.24, i % 2 ? palette.yellow : color, palette.ink, stroke * 0.4);
            }
          }
        }

        function draw() {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const random = randomFactory(seed + 808);
          drawSky(random);
          buildings.forEach(drawBuilding);
          bridges.forEach(drawBridge);
        }

        function resize() {
          width = innerWidth;
          height = innerHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          buildCity();
          draw();
        }

        function rebuild() {
          seed = Math.floor(Math.random() * 1000000) + 1;
          buildCity();
          draw();
        }

        canvas.addEventListener('click', rebuild);
        canvas.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            rebuild();
          }
        });
        addEventListener('resize', resize, { passive: true });

        resize();
      })();
    </script>
  </body>
</html>
