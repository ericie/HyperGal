<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A dense black-and-white architecture assembled from nested geometric modules on a shared structural grid."
    />
    <title>City of Signs · HyperGal</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      body { overscroll-behavior: none; }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid #000;
        outline-offset: -8px;
      }

      #debug-catalog[hidden] { display: none; }

      html.debug-mode {
        min-height: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: scroll;
      }

      body.debug-mode {
        min-height: 100%;
        height: auto;
        overflow: visible;
        background: #dededb;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body.debug-mode #city { display: none; }

      .debug-catalog {
        min-height: 100vh;
        padding: clamp(18px, 3vw, 42px);
        background: #dededb;
      }

      .debug-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #111;
      }

      .debug-header h1,
      .debug-header p,
      .debug-specimen { margin: 0; }

      .debug-header h1 {
        font-size: clamp(1.25rem, 2.3vw, 2rem);
        letter-spacing: -0.025em;
        line-height: 1;
      }

      .debug-header p {
        color: #555;
        font-size: 0.875rem;
      }

      .debug-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
        border-left: 1px solid #aaa;
      }

      .debug-specimen {
        display: grid;
        min-width: 0;
        grid-template-rows: minmax(250px, 1fr) auto;
        border-right: 1px solid #aaa;
        border-bottom: 1px solid #aaa;
      }

      .debug-specimen-canvas {
        position: static;
        inset: auto;
        width: 100%;
        height: clamp(250px, 27vw, 340px);
        cursor: default;
        touch-action: auto;
      }

      .debug-caption {
        display: grid;
        grid-template-columns: 2.5rem minmax(0, 1fr);
        gap: 10px;
        min-height: 66px;
        padding: 12px 14px;
        border-top: 1px solid #aaa;
      }

      .debug-number {
        color: #666;
        font-variant-numeric: tabular-nums;
      }

      .debug-name,
      .debug-group { display: block; }

      .debug-name {
        font-size: 0.9375rem;
        line-height: 1.2;
      }

      .debug-group {
        margin-top: 4px;
        color: #666;
        font-size: 0.75rem;
        line-height: 1.2;
      }

      @media (max-width: 520px) {
        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="city"
      tabindex="0"
      role="img"
      aria-label="A dense edge-to-edge black-and-white architectural field. Wide and narrow frontal towers share a structural grid and contain nested arches, circles, diamonds, flags, colonnades, and carved geometric ornament. Click, tap, or press Enter to construct another arrangement."
    ></canvas>

    <main id="debug-catalog" class="debug-catalog" hidden>
      <header class="debug-header">
        <h1>City of Signs shape index</h1>
        <p id="debug-count"></p>
      </header>
      <div id="debug-grid" class="debug-grid"></div>
    </main>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('city');
        let ctx = canvas.getContext('2d', { alpha: false });
        const DEBUG_MODE = new URLSearchParams(location.search).get('debug') === 'true';
        const TAU = Math.PI * 2;
        const BLACK = '#000';
        const WHITE = '#fff';

        let width = 0;
        let height = 0;
        let dpr = 1;
        let seed = 1907;
        let bays = [];
        let registers = [];
        let weights = { heavy: 5, medium: 3, fine: 1.5 };

        const DEBUG_SPECIMENS = [
          { key: 'rectangle', name: 'Rectangle and frame', group: 'Primitive' },
          { key: 'circle', name: 'Circle', group: 'Primitive' },
          { key: 'semicircle', name: 'Semicircle', group: 'Primitive' },
          { key: 'arch', name: 'Arch', group: 'Primitive' },
          { key: 'triangle', name: 'Triangle', group: 'Primitive' },
          { key: 'diamond', name: 'Diamond', group: 'Primitive' },
          { key: 'nested-diamond', name: 'Nested diamond', group: 'Nested motif' },
          { key: 'roundel-ring', name: 'Concentric roundel', group: 'Nested motif' },
          { key: 'roundel-diamond', name: 'Diamond roundel', group: 'Nested motif' },
          { key: 'roundel-flower', name: 'Four-lobed roundel', group: 'Nested motif' },
          { key: 'roundel-star', name: 'Eight-point roundel', group: 'Nested motif' },
          { key: 'nested-arch', name: 'Nested arch', group: 'Nested motif' },
          { key: 'diamond-band', name: 'Diamond register', group: 'Ornamental band' },
          { key: 'circle-band', name: 'Roundel register', group: 'Ornamental band' },
          { key: 'checker', name: 'Checker field', group: 'Surface pattern' },
          { key: 'dots', name: 'Offset dot field', group: 'Surface pattern' },
          { key: 'colonnade', name: 'Colonnade', group: 'Architectural module' },
          { key: 'stepped-gateway', name: 'Stepped gateway', group: 'Architectural module' },
          { key: 'module-roundel', name: 'Roundel chamber', group: 'Framed chamber' },
          { key: 'module-roundel-reverse', name: 'Roundel chamber, reversed', group: 'Framed chamber' },
          { key: 'module-arch', name: 'Arch chamber', group: 'Framed chamber' },
          { key: 'module-diamond', name: 'Diamond chamber', group: 'Framed chamber' },
          { key: 'module-checker', name: 'Checker chamber', group: 'Framed chamber' },
          { key: 'module-dots', name: 'Dot chamber', group: 'Framed chamber' },
          { key: 'module-gateway', name: 'Stepped-gateway chamber', group: 'Framed chamber' },
          { key: 'module-colonnade', name: 'Colonnade chamber', group: 'Framed chamber' },
          { key: 'module-split', name: 'Split register chamber', group: 'Framed chamber' },
          { key: 'module-marker-stack', name: 'Needle-bay marker stack', group: 'Framed chamber' },
          { key: 'cap-triangle', name: 'Triangular roof', group: 'Cap' },
          { key: 'cap-semicircle', name: 'Semicircular roof', group: 'Cap' },
          { key: 'cap-stepped', name: 'Stepped roof', group: 'Cap' },
          { key: 'cap-crenellated', name: 'Crenellated roof', group: 'Cap' },
          { key: 'cap-pavilion', name: 'Pavilion roof', group: 'Cap' },
          { key: 'finial-ball', name: 'Ball finial', group: 'Finial' },
          { key: 'finial-diamond', name: 'Diamond finial', group: 'Finial' },
          { key: 'finial-flag', name: 'Flag finial', group: 'Finial' },
          { key: 'bay-broad', name: 'Broad composite bay', group: 'Bay grammar' },
          { key: 'bay-needle', name: 'Needle composite bay', group: 'Bay grammar' },
          { key: 'bay-reversed', name: 'Reversed composite bay', group: 'Bay grammar' }
        ];

        function randomFactory(value) {
          return () => {
            value |= 0;
            value = (value + 0x6d2b79f5) | 0;
            let result = Math.imul(value ^ (value >>> 15), 1 | value);
            result = (result + Math.imul(result ^ (result >>> 7), 61 | result)) ^ result;
            return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
          };
        }

        function clamp(value, low, high) {
          return Math.max(low, Math.min(high, value));
        }

        function choose(random, values) {
          return values[Math.floor(random() * values.length)];
        }

        function rect(x, y, w, h, fill, stroke = null, lineWidth = 0) {
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(x, y, w, h);
          }
        }

        function circle(x, y, radius, fill, stroke = null, lineWidth = 0) {
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TAU);
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function line(x1, y1, x2, y2, stroke, lineWidth) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }

        function polygon(points, fill, stroke = null, lineWidth = 0) {
          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function archPath(x, y, w, h) {
          const radius = w * 0.5;
          ctx.beginPath();
          ctx.moveTo(x, y + radius);
          ctx.arc(x + radius, y + radius, radius, Math.PI, 0);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.closePath();
        }

        function arch(x, y, w, h, fill, stroke = null, lineWidth = 0) {
          archPath(x, y, w, h);
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke && lineWidth) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function diamond(x, y, w, h, fill, stroke = null, lineWidth = 0) {
          polygon([[x, y - h * 0.5], [x + w * 0.5, y], [x, y + h * 0.5], [x - w * 0.5, y]], fill, stroke, lineWidth);
        }

        function frame(x, y, w, h, color, lineWidth) {
          rect(x, y, w, h, null, color, lineWidth);
        }

        function opposite(color) {
          return color === BLACK ? WHITE : BLACK;
        }

        function drawNestedDiamond(x, y, size, ink, paper, depth = 3) {
          for (let i = 0; i < depth; i += 1) {
            const scale = 1 - i * 0.27;
            diamond(x, y, size * scale, size * scale, i % 2 === 0 ? ink : paper);
          }
        }

        function drawRoundel(x, y, radius, ink, paper, variant) {
          circle(x, y, radius, ink);
          circle(x, y, radius * 0.72, paper);

          if (variant % 4 === 0) {
            circle(x, y, radius * 0.42, ink);
            circle(x, y, radius * 0.16, paper);
          } else if (variant % 4 === 1) {
            drawNestedDiamond(x, y, radius * 1.03, ink, paper, 3);
          } else if (variant % 4 === 2) {
            for (let i = 0; i < 4; i += 1) {
              const angle = Math.PI * 0.25 + (i * TAU) / 4;
              circle(x + Math.cos(angle) * radius * 0.34, y + Math.sin(angle) * radius * 0.34, radius * 0.2, ink);
            }
            circle(x, y, radius * 0.13, paper);
          } else {
            polygon([
              [x, y - radius * 0.58],
              [x + radius * 0.2, y - radius * 0.2],
              [x + radius * 0.58, y],
              [x + radius * 0.2, y + radius * 0.2],
              [x, y + radius * 0.58],
              [x - radius * 0.2, y + radius * 0.2],
              [x - radius * 0.58, y],
              [x - radius * 0.2, y - radius * 0.2]
            ], ink);
            circle(x, y, radius * 0.13, paper);
          }
        }

        function drawArchNest(x, y, w, h, ink, paper, depth = 3) {
          for (let i = 0; i < depth; i += 1) {
            const inset = (i * Math.min(w, h)) / 7;
            arch(x + inset, y + inset, w - inset * 2, h - inset, i % 2 === 0 ? ink : paper);
          }
        }

        function drawDiamondBand(x, y, w, h, ink, paper, variant) {
          const count = clamp(Math.round(w / Math.max(h * 0.82, 12)), 2, 9);
          const cell = w / count;
          rect(x, y, w, h, paper);
          for (let i = 0; i < count; i += 1) {
            const cx = x + cell * (i + 0.5);
            const size = Math.min(cell * 0.72, h * 0.68);
            if ((i + variant) % 3 === 0) drawNestedDiamond(cx, y + h * 0.5, size, ink, paper, 2);
            else diamond(cx, y + h * 0.5, size, size, ink);
          }
        }

        function drawCircleBand(x, y, w, h, ink, paper, variant) {
          const count = clamp(Math.round(w / Math.max(h * 0.9, 13)), 2, 8);
          const cell = w / count;
          rect(x, y, w, h, paper);
          for (let i = 0; i < count; i += 1) {
            const radius = Math.min(cell * 0.34, h * 0.34);
            drawRoundel(x + cell * (i + 0.5), y + h * 0.5, radius, ink, paper, variant + i);
          }
        }

        function drawChecker(x, y, w, h, ink, paper) {
          const cell = clamp(Math.min(w / 5, h / 5), 5, 18);
          rect(x, y, w, h, paper);
          for (let row = 0; y + row * cell < y + h; row += 1) {
            for (let col = 0; x + col * cell < x + w; col += 1) {
              if ((row + col) % 2 === 0) rect(x + col * cell, y + row * cell, cell, cell, ink);
            }
          }
        }

        function drawDotField(x, y, w, h, ink, paper) {
          rect(x, y, w, h, paper);
          const cell = clamp(w / 4.3, 8, 21);
          const radius = cell * 0.21;
          for (let row = 0; y + cell * (row + 0.6) < y + h; row += 1) {
            for (let col = 0; x + cell * (col + 0.55) < x + w; col += 1) {
              circle(x + cell * (col + 0.55) + (row % 2) * cell * 0.47, y + cell * (row + 0.62), radius, ink);
            }
          }
        }

        function drawColonnade(x, y, w, h, ink, paper, count) {
          rect(x, y, w, h, ink);
          const gap = Math.max(weights.medium, w * 0.035);
          const archW = (w - gap * (count + 1)) / count;
          for (let i = 0; i < count; i += 1) {
            arch(x + gap + i * (archW + gap), y + gap, archW, h + weights.heavy, paper);
          }
        }

        function drawSteppedGateway(x, y, w, h, ink, paper) {
          rect(x, y, w, h, paper);
          polygon([
            [x + w * 0.1, y + h],
            [x + w * 0.1, y + h * 0.68],
            [x + w * 0.24, y + h * 0.68],
            [x + w * 0.24, y + h * 0.44],
            [x + w * 0.38, y + h * 0.44],
            [x + w * 0.38, y + h * 0.2],
            [x + w * 0.62, y + h * 0.2],
            [x + w * 0.62, y + h * 0.44],
            [x + w * 0.76, y + h * 0.44],
            [x + w * 0.76, y + h * 0.68],
            [x + w * 0.9, y + h * 0.68],
            [x + w * 0.9, y + h]
          ], ink);
          arch(x + w * 0.39, y + h * 0.58, w * 0.22, h * 0.42, paper);
        }

        function drawCoarseChecker(x, y, w, h, ink, paper) {
          const columns = 4;
          const rows = clamp(Math.round((h / w) * columns), 3, 6);
          const cellW = w / columns;
          const cellH = h / rows;
          rect(x, y, w, h, paper);
          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < columns; col += 1) {
              if ((row + col) % 2 === 0) rect(x + col * cellW, y + row * cellH, cellW, cellH, ink);
            }
          }
        }

        function drawSparseDots(x, y, w, h, ink, paper) {
          const columns = 3;
          const rows = clamp(Math.round((h / w) * columns), 3, 5);
          const cellW = w / columns;
          const cellH = h / rows;
          const radius = Math.min(cellW, cellH) * 0.17;
          rect(x, y, w, h, paper);
          for (let row = 0; row < rows; row += 1) {
            for (let col = 0; col < columns; col += 1) {
              circle(x + cellW * (col + 0.5), y + cellH * (row + 0.5), radius, ink);
            }
          }
        }

        function drawSplitRegister(x, y, w, h, ink, paper) {
          const split = h * 0.5;
          const topSize = Math.min(w, split) * 0.48;
          const bottomSize = Math.min(w, h - split) * 0.64;
          rect(x, y, w, h, paper);
          circle(x + w * 0.5, y + split * 0.5, topSize * 0.5, ink);
          line(x, y + split, x + w, y + split, ink, weights.medium);
          diamond(x + w * 0.5, y + split + (h - split) * 0.5, bottomSize, bottomSize, ink);
        }

        function drawModule(bay, top, bottom, index) {
          const x = bay.x;
          const y = top;
          const w = bay.w;
          const h = bottom - top;
          const fill = (bay.polarity + index) % 2 === 0 ? BLACK : WHITE;
          const ink = opposite(fill);
          const pad = clamp(Math.min(w, h) * 0.09, weights.medium * 1.25, 14);

          rect(x, y, w, h + weights.heavy * 0.5, fill, BLACK, weights.heavy);

          const inner = {
            x: x + pad,
            y: y + pad,
            w: Math.max(1, w - pad * 2),
            h: Math.max(1, h - pad * 2)
          };

          if (inner.w < 9 || inner.h < 9) return;
          const motif = bay.motifs[index % bay.motifs.length];
          const narrow = bay.forceNarrow || w < width * 0.065;
          const shallow = h < height * 0.13;

          if (shallow) {
            if (motif % 2 === 0) drawDiamondBand(inner.x, inner.y, inner.w, inner.h, ink, fill, bay.variant + index);
            else drawCircleBand(inner.x, inner.y, inner.w, inner.h, ink, fill, bay.variant + index);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
            return;
          }

          if (narrow) {
            const count = clamp(Math.round(inner.h / Math.max(inner.w * 1.45, 28)), 2, 4);
            const cellH = inner.h / count;
            for (let i = 0; i < count; i += 1) {
              const cy = inner.y + cellH * (i + 0.5);
              const size = Math.min(inner.w * 0.5, cellH * 0.5);
              if ((motif + i) % 2 === 0) circle(inner.x + inner.w * 0.5, cy, size * 0.5, ink);
              else diamond(inner.x + inner.w * 0.5, cy, size, size, ink);
            }
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
            return;
          }

          if (motif === 0) {
            const bandH = inner.h > inner.w * 1.28 ? clamp(inner.h * 0.15, 12, 30) : 0;
            const fieldH = inner.h - bandH;
            const radius = Math.min(inner.w, fieldH) * 0.34;
            drawRoundel(inner.x + inner.w * 0.5, inner.y + fieldH * 0.5, radius, ink, fill, bay.variant + index);
            if (bandH) {
              if ((bay.variant + index) % 2 === 0) drawDiamondBand(inner.x, inner.y + fieldH, inner.w, bandH, ink, fill, bay.variant);
              else drawCircleBand(inner.x, inner.y + fieldH, inner.w, bandH, ink, fill, bay.variant);
            }
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 1) {
            const aw = Math.min(inner.w * 0.58, inner.h * 0.64);
            drawArchNest(inner.x + (inner.w - aw) * 0.5, inner.y + inner.h * 0.1, aw, inner.h * 0.86, ink, fill, 4);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 2) {
            const bandH = inner.h > inner.w * 1.25 ? clamp(inner.h * 0.15, 12, 30) : 0;
            const fieldH = inner.h - bandH;
            drawNestedDiamond(inner.x + inner.w * 0.5, inner.y + fieldH * 0.5, Math.min(inner.w, fieldH) * 0.8, ink, fill, 4);
            if (bandH) drawDiamondBand(inner.x, inner.y + fieldH, inner.w, bandH, ink, fill, bay.variant + index);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 3) {
            drawCoarseChecker(inner.x, inner.y, inner.w, inner.h, ink, fill);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 4) {
            drawSparseDots(inner.x, inner.y, inner.w, inner.h, ink, fill);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 5) {
            drawSteppedGateway(inner.x, inner.y, inner.w, inner.h, ink, fill);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else if (motif === 6) {
            const columns = clamp(Math.floor(inner.w / Math.max(inner.h * 0.2, 22)), 2, 5);
            drawColonnade(inner.x, inner.y, inner.w, inner.h, ink, fill, columns);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          } else {
            drawSplitRegister(inner.x, inner.y, inner.w, inner.h, ink, fill);
            frame(inner.x, inner.y, inner.w, inner.h, ink, weights.medium);
          }
        }

        function drawTriangleCap(x, y, w, capH, fill, ink) {
          polygon([[x, y], [x + w * 0.5, y - capH], [x + w, y]], fill);
          line(x + weights.heavy * 0.5, y, x + w * 0.5, y - capH, BLACK, weights.heavy);
          line(x + w * 0.5, y - capH, x + w - weights.heavy * 0.5, y, BLACK, weights.heavy);
          polygon([
            [x + w * 0.27, y],
            [x + w * 0.5, y - capH * 0.58],
            [x + w * 0.73, y]
          ], ink);
        }

        function drawCap(bay) {
          const x = bay.x;
          const y = bay.top;
          const w = bay.w;
          const capH = clamp(w * 0.34, 13, height * 0.085);
          const fill = bay.polarity === 0 ? BLACK : WHITE;
          const ink = opposite(fill);

          if (bay.cap === 0) {
            drawTriangleCap(x, y, w, capH, fill, ink);
          } else if (bay.cap === 1) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.arc(x + w * 0.5, y, w * 0.5, Math.PI, 0);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = BLACK;
            ctx.lineWidth = weights.heavy;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.2, y);
            ctx.arc(x + w * 0.5, y, w * 0.3, Math.PI, 0);
            ctx.closePath();
            ctx.fillStyle = ink;
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.34, y);
            ctx.arc(x + w * 0.5, y, w * 0.16, Math.PI, 0);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
          } else if (bay.cap === 2) {
            const steps = 3;
            for (let i = 0; i < steps; i += 1) {
              const inset = i * w * 0.12;
              rect(x + inset, y - (i + 1) * capH / steps, w - inset * 2, capH / steps + weights.heavy, i % 2 === 0 ? fill : ink, BLACK, weights.heavy);
            }
          } else if (bay.cap === 3) {
            rect(x, y - capH * 0.42, w, capH * 0.42, fill, BLACK, weights.heavy);
            const teeth = clamp(Math.floor(w / Math.max(capH * 0.35, 12)), 2, 6);
            for (let i = 0; i < teeth; i += 1) {
              const tw = w / teeth;
              rect(x + i * tw, y - capH, tw * 0.56, capH * 0.58, fill, BLACK, weights.medium);
            }
          } else {
            polygon([[x, y], [x + w * 0.16, y - capH * 0.62], [x + w * 0.84, y - capH * 0.62], [x + w, y]], fill, BLACK, weights.heavy);
            rect(x + w * 0.37, y - capH * 1.18, w * 0.26, capH * 0.56, ink, BLACK, weights.medium);
            rect(x + w * 0.44, y - capH * 1.02, w * 0.12, capH * 0.38, fill);
          }

          if (bay.finial !== 0) {
            const fx = x + w * bay.finialX;
            let capTop = y - capH;
            if (bay.cap === 0) {
              capTop = y - capH * (1 - Math.abs(bay.finialX - 0.5) * 2);
            } else if (bay.cap === 1) {
              const radius = w * 0.5;
              const offset = w * (bay.finialX - 0.5);
              capTop = y - Math.sqrt(Math.max(0, radius * radius - offset * offset));
            } else if (bay.cap === 4) {
              capTop = bay.finialX >= 0.37 && bay.finialX <= 0.63
                ? y - capH * 1.18
                : y - capH * 0.62;
            }
            const pole = clamp(height * (0.045 + bay.variant * 0.002), 20, 56);
            line(fx, capTop, fx, capTop - pole, BLACK, weights.heavy);

            if (bay.finial === 1) {
              circle(fx, capTop - pole, clamp(w * 0.045, 3, 8), BLACK);
            } else if (bay.finial === 2) {
              diamond(fx, capTop - pole, clamp(w * 0.11, 7, 15), clamp(w * 0.15, 9, 19), BLACK);
            } else {
              const flagW = clamp(w * 0.38, 18, 48);
              const flagH = clamp(flagW * 0.42, 8, 20);
              polygon([[fx, capTop - pole], [fx + flagW, capTop - pole], [fx + flagW * 0.72, capTop - pole + flagH * 0.5], [fx + flagW, capTop - pole + flagH], [fx, capTop - pole + flagH]], BLACK);
            }
          }
        }

        function drawBay(bay) {
          const boundaries = [bay.top, ...registers.filter(value => value > bay.top + weights.heavy && value < height), height + weights.heavy];
          let moduleIndex = 0;
          let i = 0;

          while (i < boundaries.length - 1) {
            let span = 1;
            const available = boundaries.length - 1 - i;
            if (available > 1 && bay.w > width * 0.085 && (bay.variant + i) % 4 === 0) span = 2;
            const bottom = boundaries[Math.min(i + span, boundaries.length - 1)];
            drawModule(bay, boundaries[i], bottom, moduleIndex);
            moduleIndex += 1;
            i += span;
          }

          drawCap(bay);
        }

        function showDebugCatalog() {
          const catalog = document.getElementById('debug-catalog');
          const grid = document.getElementById('debug-grid');
          const count = document.getElementById('debug-count');
          const specimens = [];

          document.documentElement.classList.add('debug-mode');
          document.body.classList.add('debug-mode');
          catalog.hidden = false;
          count.textContent = `${DEBUG_SPECIMENS.length} specimens`;

          DEBUG_SPECIMENS.forEach((spec, index) => {
            const figure = document.createElement('figure');
            const specimenCanvas = document.createElement('canvas');
            const caption = document.createElement('figcaption');
            const number = document.createElement('span');
            const copy = document.createElement('span');
            const name = document.createElement('strong');
            const group = document.createElement('span');
            const labelId = `debug-shape-${index + 1}`;

            figure.className = 'debug-specimen';
            specimenCanvas.className = 'debug-specimen-canvas';
            specimenCanvas.setAttribute('aria-hidden', 'true');
            caption.className = 'debug-caption';
            caption.id = labelId;
            number.className = 'debug-number';
            number.textContent = String(index + 1).padStart(2, '0');
            name.className = 'debug-name';
            name.textContent = spec.name;
            group.className = 'debug-group';
            group.textContent = spec.group;
            copy.append(name, group);
            caption.append(number, copy);
            figure.setAttribute('aria-labelledby', labelId);
            figure.append(specimenCanvas, caption);
            grid.append(figure);
            specimens.push({ canvas: specimenCanvas, spec });
          });

          let renderFrame = 0;
          const scheduleRender = () => {
            cancelAnimationFrame(renderFrame);
            renderFrame = requestAnimationFrame(() => {
              specimens.forEach(renderDebugSpecimen);
            });
          };

          if ('ResizeObserver' in window) {
            const observer = new ResizeObserver(scheduleRender);
            observer.observe(grid);
          } else {
            addEventListener('resize', scheduleRender, { passive: true });
          }
          scheduleRender();
        }

        function debugBay(x, w, polarity, motifs, cap = 0, finial = 0, variant = 3) {
          return {
            index: 0,
            x,
            w,
            top: height * 0.2,
            polarity,
            cap,
            finial,
            finialX: 0.5,
            motifs,
            variant
          };
        }

        function renderDebugSpecimen(specimen) {
          const bounds = specimen.canvas.getBoundingClientRect();
          const cssWidth = Math.max(1, Math.round(bounds.width));
          const cssHeight = Math.max(1, Math.round(bounds.height));
          const pixelRatio = Math.min(2, devicePixelRatio || 1);
          const specimenCtx = specimen.canvas.getContext('2d', { alpha: false });
          const previous = { ctx, width, height, dpr, weights, registers };

          specimen.canvas.width = Math.round(cssWidth * pixelRatio);
          specimen.canvas.height = Math.round(cssHeight * pixelRatio);
          specimenCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          specimenCtx.fillStyle = WHITE;
          specimenCtx.fillRect(0, 0, cssWidth, cssHeight);
          specimenCtx.lineJoin = 'miter';
          specimenCtx.lineCap = 'butt';

          ctx = specimenCtx;
          width = cssWidth;
          height = cssHeight;
          dpr = pixelRatio;
          weights = {
            heavy: clamp(Math.min(width, height) / 75, 3, 5),
            medium: clamp(Math.min(width, height) / 135, 1.8, 3),
            fine: clamp(Math.min(width, height) / 250, 1, 1.8)
          };
          registers = [0.36, 0.57, 0.77].map(value => Math.round(height * value));

          const pad = clamp(Math.min(width, height) * 0.075, 15, 26);
          const x = pad;
          const y = pad;
          const w = width - pad * 2;
          const h = height - pad * 2;
          const cx = width * 0.5;
          const cy = height * 0.5;
          const size = Math.min(w, h) * 0.66;
          const key = specimen.spec.key;

          if (key === 'rectangle') {
            rect(cx - size * 0.5, cy - size * 0.36, size, size * 0.72, BLACK);
            frame(cx - size * 0.34, cy - size * 0.22, size * 0.68, size * 0.44, WHITE, weights.medium);
          } else if (key === 'circle') {
            circle(cx, cy, size * 0.42, BLACK);
          } else if (key === 'semicircle') {
            ctx.beginPath();
            ctx.moveTo(cx - size * 0.5, cy + size * 0.18);
            ctx.arc(cx, cy + size * 0.18, size * 0.5, Math.PI, 0);
            ctx.closePath();
            ctx.fillStyle = BLACK;
            ctx.fill();
          } else if (key === 'arch') {
            arch(cx - size * 0.34, cy - size * 0.48, size * 0.68, size * 0.96, BLACK);
          } else if (key === 'triangle') {
            polygon([[cx, cy - size * 0.48], [cx + size * 0.5, cy + size * 0.38], [cx - size * 0.5, cy + size * 0.38]], BLACK);
          } else if (key === 'diamond') {
            diamond(cx, cy, size, size, BLACK);
          } else if (key === 'nested-diamond') {
            drawNestedDiamond(cx, cy, size, BLACK, WHITE, 4);
          } else if (key.startsWith('roundel-')) {
            const variant = ['roundel-ring', 'roundel-diamond', 'roundel-flower', 'roundel-star'].indexOf(key);
            drawRoundel(cx, cy, size * 0.48, BLACK, WHITE, variant);
          } else if (key === 'nested-arch') {
            drawArchNest(cx - size * 0.38, cy - size * 0.5, size * 0.76, size, BLACK, WHITE, 4);
          } else if (key === 'diamond-band') {
            drawDiamondBand(x, cy - h * 0.14, w, h * 0.28, BLACK, WHITE, 2);
            frame(x, cy - h * 0.14, w, h * 0.28, BLACK, weights.medium);
          } else if (key === 'circle-band') {
            drawCircleBand(x, cy - h * 0.14, w, h * 0.28, BLACK, WHITE, 1);
            frame(x, cy - h * 0.14, w, h * 0.28, BLACK, weights.medium);
          } else if (key === 'checker') {
            drawChecker(x, y, w, h, BLACK, WHITE);
            frame(x, y, w, h, BLACK, weights.heavy);
          } else if (key === 'dots') {
            drawDotField(x, y, w, h, BLACK, WHITE);
            frame(x, y, w, h, BLACK, weights.heavy);
          } else if (key === 'colonnade') {
            drawColonnade(x, y, w, h, BLACK, WHITE, 4);
            frame(x, y, w, h, BLACK, weights.heavy);
          } else if (key === 'stepped-gateway') {
            drawSteppedGateway(x, y, w, h, BLACK, WHITE);
            frame(x, y, w, h, BLACK, weights.heavy);
          } else if (key.startsWith('module-')) {
            const motifByKey = {
              'module-roundel': 0,
              'module-roundel-reverse': 0,
              'module-arch': 1,
              'module-diamond': 2,
              'module-checker': 3,
              'module-dots': 4,
              'module-gateway': 5,
              'module-colonnade': 6,
              'module-split': 7,
              'module-marker-stack': 2
            };
            const narrow = key === 'module-marker-stack';
            const moduleW = narrow ? w * 0.34 : w;
            const moduleX = cx - moduleW * 0.5;
            const polarity = key === 'module-roundel-reverse' ? 1 : 0;
            const bay = debugBay(moduleX, moduleW, polarity, [motifByKey[key]], 0, 0, 5);
            bay.forceNarrow = key === 'module-marker-stack';
            drawModule(bay, y, height - pad, 0);
          } else if (key.startsWith('cap-') || key.startsWith('finial-')) {
            const capKeys = ['cap-triangle', 'cap-semicircle', 'cap-stepped', 'cap-crenellated', 'cap-pavilion'];
            const finialKeys = ['finial-ball', 'finial-diamond', 'finial-flag'];
            const cap = key.startsWith('cap-') ? capKeys.indexOf(key) : 0;
            const finial = key.startsWith('finial-') ? finialKeys.indexOf(key) + 1 : 0;
            const bayW = w * 0.64;
            const bayX = cx - bayW * 0.5;
            const bay = debugBay(bayX, bayW, 0, [0], cap, finial, 4);
            bay.top = height * 0.5;
            rect(bayX, bay.top, bayW, height - bay.top - pad, BLACK, BLACK, weights.heavy);
            drawCap(bay);
          } else if (key.startsWith('bay-')) {
            const needle = key === 'bay-needle';
            const bayW = needle ? w * 0.3 : w * 0.72;
            const bayX = cx - bayW * 0.5;
            const polarity = key === 'bay-reversed' ? 1 : 0;
            const bay = debugBay(bayX, bayW, polarity, needle ? [2, 0, 1, 2] : [5, 0, 7, 6], needle ? 3 : 1, needle ? 2 : 3, 7);
            bay.top = height * 0.37;
            drawBay(bay);
          }

          ctx = previous.ctx;
          width = previous.width;
          height = previous.height;
          dpr = previous.dpr;
          weights = previous.weights;
          registers = previous.registers;
        }

        function makeBays() {
          const random = randomFactory(seed);
          const target = width < 520 ? 6 : width < 900 ? 9 : clamp(Math.round(width / 105), 11, 16);
          const rawWidths = [];
          const widthChoices = width < 520 ? [5, 7, 9, 12] : [4, 6, 8, 11, 14];

          for (let i = 0; i < target; i += 1) {
            let value = choose(random, widthChoices);
            if (i > 0 && rawWidths[i - 1] <= 5) value = choose(random, [8, 11, 14]);
            if (i > 0 && rawWidths[i - 1] >= 11) value = choose(random, [4, 6, 8]);
            rawWidths.push(value);
          }

          const total = rawWidths.reduce((sum, value) => sum + value, 0);
          const motifPool = Array.from({ length: 8 }, (_, index) => index);
          bays = [];
          let x = 0;
          let previousMotifs = null;

          rawWidths.forEach((raw, index) => {
            const w = index === rawWidths.length - 1 ? width - x : (raw / total) * width;
            const topOnRegister = random() < 0.12;
            const top = topOnRegister
              ? registers[0]
              : clamp(height * (0.045 + random() * 0.12), weights.heavy * 1.5, height * 0.18);
            const motifs = [];

            for (let m = 0; m < 6; m += 1) {
              if (previousMotifs && random() < 0.54) motifs.push(previousMotifs[(m + index) % previousMotifs.length]);
              else motifs.push(choose(random, motifPool));
            }

            const bay = {
              index,
              x,
              w,
              top,
              polarity: index === 0 ? Math.floor(random() * 2) : 1 - bays[index - 1].polarity,
              cap: Math.floor(random() * 5),
              finial: random() < 0.16 ? 0 : 1 + Math.floor(random() * 3),
              finialX: random() < 0.72 ? 0.5 : random() < 0.5 ? 0.28 : 0.72,
              motifs,
              variant: Math.floor(random() * 17)
            };

            bays.push(bay);
            previousMotifs = motifs;
            x += w;
          });
        }

        function build() {
          weights = {
            heavy: clamp(Math.min(width, height) / 145, 3.25, 7.5),
            medium: clamp(Math.min(width, height) / 260, 1.8, 4.2),
            fine: clamp(Math.min(width, height) / 480, 1, 2.3)
          };
          registers = [0.265, 0.455, 0.64, 0.805].map(value => Math.round(height * value));
          makeBays();
        }

        function draw() {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = WHITE;
          ctx.fillRect(0, 0, width, height);
          ctx.lineJoin = 'miter';
          ctx.lineCap = 'butt';
          bays.forEach(drawBay);
        }

        function resize() {
          width = innerWidth;
          height = innerHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          build();
          draw();
        }

        function rebuild() {
          seed = Math.floor(Math.random() * 1000000) + 1;
          build();
          draw();
        }

        if (DEBUG_MODE) {
          showDebugCatalog();
        } else {
          canvas.addEventListener('click', rebuild);
          canvas.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              rebuild();
            }
          });
          addEventListener('resize', resize, { passive: true });
          resize();
        }
      })();
    </script>
  </body>
</html>
