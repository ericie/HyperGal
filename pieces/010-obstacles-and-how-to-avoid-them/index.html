          const slider = control.querySelector('.gestalt-strength');
          const output = control.querySelector('.gestalt-value');
          const setting = GESTALTS[name];

          toggle.checked = setting.enabled;
          slider.value = Math.round(setting.strength * 100);
          updateControl(control, toggle, slider, output, setting);

          toggle.addEventListener('change', () => {
            setting.enabled = toggle.checked;
            updateControl(control, toggle, slider, output, setting);
            scheduleCompose();
          });

          slider.addEventListener('input', () => {
            setting.strength = Number(slider.value) / 100;
            updateControl(control, toggle, slider, output, setting);
            scheduleCompose();
          });
        });
      }

      function updateControl(control, toggle, slider, output, setting) {
        const percentage = Math.round(setting.strength * 100);
        control.classList.toggle('is-off', !setting.enabled);
        control.style.setProperty('--strength', `${percentage}%`);
        slider.disabled = !setting.enabled;
        toggle.setAttribute('aria-label', `${control.querySelector('.gestalt-name').textContent} ${setting.enabled ? 'on' : 'off'}`);
        output.value = setting.enabled ? `${percentage}%` : 'off';
        output.textContent = output.value;
      }

      function scheduleCompose() {
        cancelAnimationFrame(compositionFrame);
        compositionFrame = requestAnimationFrame(() => {
          compositionFrame = 0;
          compose();
        });
      }

      function restartLineAnimation() {
        cancelAnimationFrame(lineAnimationFrame);
        lineAnimationFrame = 0;
        lastAnimationRender = 0;
        lineAnimationStartedAt = performance.now();

        if (prefersReducedMotion) {
          render(lineAnimationStartedAt);
          return;
        }

        render(lineAnimationStartedAt);
        lineAnimationFrame = requestAnimationFrame(animateLineField);
      }

      function animateLineField(time) {
        if (time - lastAnimationRender < 1000 / 45) {
          lineAnimationFrame = requestAnimationFrame(animateLineField);
          return;
        }
        lastAnimationRender = time;
        render(time);
        lineAnimationFrame = requestAnimationFrame(animateLineField);
      }

      function reseed() {
        seed = ((Date.now() * 1664525) ^ (Math.random() * 0xffffffff)) >>> 0;
        compose();
      }

      function bindCompositionPanel() {
        collapseButton.addEventListener('click', () => {
          const collapsed = compositionPanel.classList.toggle('is-collapsed');
          collapseButton.textContent = collapsed ? '+' : '-';
          collapseButton.setAttribute('aria-expanded', String(!collapsed));
          collapseButton.setAttribute(
            'aria-label',
            collapsed ? 'Expand composition controls' : 'Collapse composition controls'
          );
          collapseButton.title = collapsed ? 'Expand controls' : 'Collapse controls';
          requestAnimationFrame(keepPanelInView);
        });

        panelHeader.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || event.target.closest('button')) return;
          const bounds = compositionPanel.getBoundingClientRect();
          panelDrag = {
            pointerId: event.pointerId,
            offsetX: event.clientX - bounds.left,
            offsetY: event.clientY - bounds.top,
          };
          compositionPanel.style.left = `${bounds.left}px`;
          compositionPanel.style.top = `${bounds.top}px`;
          compositionPanel.classList.add('is-dragging');
          panelHeader.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        panelHeader.addEventListener('pointermove', (event) => {
          if (!panelDrag || event.pointerId !== panelDrag.pointerId) return;
          setPanelPosition(
            event.clientX - panelDrag.offsetX,
            event.clientY - panelDrag.offsetY
          );
        });

        panelHeader.addEventListener('pointerup', endPanelDrag);
        panelHeader.addEventListener('pointercancel', endPanelDrag);
      }

      function endPanelDrag(event) {
        if (!panelDrag || event.pointerId !== panelDrag.pointerId) return;
        if (panelHeader.hasPointerCapture(event.pointerId)) {
          panelHeader.releasePointerCapture(event.pointerId);
        }
        panelDrag = null;
        compositionPanel.classList.remove('is-dragging');
      }

      function setPanelPosition(x, y) {
        const margin = width < 520 ? 8 : 10;
        const maxX = Math.max(margin, width - compositionPanel.offsetWidth - margin);
        const maxY = Math.max(margin, height - compositionPanel.offsetHeight - margin);
        compositionPanel.style.left = `${clamp(x, margin, maxX)}px`;
        compositionPanel.style.top = `${clamp(y, margin, maxY)}px`;
      }

      function keepPanelInView() {
        const bounds = compositionPanel.getBoundingClientRect();
        setPanelPosition(bounds.left, bounds.top);
      }

      addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          resize();
          keepPanelInView();
        }, 120);
      });

      reseedButton.addEventListener('click', reseed);
      canvas.addEventListener('click', reseed);
      canvas.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          reseed();
        }
      });

      if (reducedMotionQuery) {
        const updateMotionPreference = (event) => {
          prefersReducedMotion = event.matches;
          restartLineAnimation();
        };
        if (typeof reducedMotionQuery.addEventListener === 'function') {
          reducedMotionQuery.addEventListener('change', updateMotionPreference);
        } else if (typeof reducedMotionQuery.addListener === 'function') {
          reducedMotionQuery.addListener(updateMotionPreference);
        }
      }

      bindCountControl();
      bindLineControl();
      bindLineAngleControl();
      bindGestaltControls();
      bindCompositionPanel();
      resize();
    </script>
  </body>
</html>
