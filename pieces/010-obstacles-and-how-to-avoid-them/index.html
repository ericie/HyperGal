<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obstacles and How to Avoid Them · HyperGal</title>
    <style>
      :root {
        --paper: #ffffe4;
        --ink: #001522;
        --prussian: #004b87;
        --tyrian: #a8002c;
        --wheat: #ffd77b;
        --burlywood: #deb887;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--paper);
        cursor: crosshair;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -8px;
      }

      .gestalt-panel {
        position: fixed;
        z-index: 10;
        top: 14px;
        left: 14px;
        width: min(278px, calc(100vw - 28px));
        padding: 8px 10px 10px;
        border: 2px solid var(--ink);
        border-radius: 5px;
        background: rgba(255, 255, 228, 0.96);
        box-shadow: 5px 5px 0 rgba(0, 75, 135, 0.82);
        color: var(--ink);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        line-height: 1;
        user-select: none;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 30px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(0, 21, 34, 0.3);
        cursor: grab;
        touch-action: none;
      }

      .panel-header h1 {
        margin: 0;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .panel-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      .reseed-button,
      .collapse-button {
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 3px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .collapse-button {
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
      }

      .reseed-button:hover,
      .collapse-button:hover {
        background: var(--prussian);
        color: var(--paper);
      }

      .reseed-button:focus-visible,
      .collapse-button:focus-visible,
      .gestalt-toggle:focus-visible,
      .gestalt-strength:focus-visible {
        outline: 2px solid var(--tyrian);
        outline-offset: 2px;
      }

      .gestalt-panel.is-dragging .panel-header {
        cursor: grabbing;
      }

      .gestalt-panel.is-collapsed {
        width: 175px;
        padding-bottom: 8px;
      }

      .gestalt-panel.is-collapsed .panel-header {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .gestalt-panel.is-collapsed .panel-controls {
        display: none;
      }

      .gestalt-control {
        --tone: var(--prussian);
        --strength: 72%;
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) 34px;
        align-items: center;
        column-gap: 7px;
        min-height: 35px;
        padding-top: 4px;
        color: var(--tone);
      }

      .gestalt-control[data-gestalt="scale"] {
        --tone: var(--tyrian);
      }

      .gestalt-control[data-gestalt="scaleVariety"] {
        --tone: #765523;
      }

      .gestalt-control[data-count] {
        --tone: var(--ink);
        min-height: 39px;
      }

      .gestalt-control[data-lines] {
        --tone: var(--prussian);
        min-height: 39px;
      }

      .gestalt-control[data-line-angle] {
        --tone: var(--prussian);
        min-height: 39px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(0, 21, 34, 0.3);
      }

      .gestalt-control[data-gestalt="proximity"] {
        --tone: #8f5d00;
      }

      .gestalt-control[data-gestalt="closure"] {
        --tone: #765523;
      }

      .gestalt-control[data-gestalt="offpage"] {
        --tone: var(--ink);
      }

      .gestalt-toggle {
        width: 15px;
        height: 15px;
        margin: 0;
        border-radius: 2px;
        accent-color: var(--tone);
        cursor: pointer;
      }

      .count-mark {
        color: var(--tyrian);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

      [data-lines] .count-mark,
      [data-line-angle] .count-mark {
        color: var(--prussian);
      }

      .gestalt-name {
        min-width: 0;
        overflow: hidden;
        color: var(--ink);
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .gestalt-value {
        color: var(--tone);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .gestalt-strength {
        grid-column: 2 / 4;
        width: 100%;
        height: 12px;
        margin: -2px 0 0;
        padding: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .gestalt-strength::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 0;
        background: linear-gradient(
          to right,
          var(--tone) 0 var(--strength),
          rgba(0, 21, 34, 0.18) var(--strength) 100%
        );
      }

      .gestalt-strength::-webkit-slider-thumb {
        width: 10px;
        height: 10px;
        margin-top: -3.5px;
        border: 2px solid var(--paper);
        border-radius: 50%;
        appearance: none;
        background: var(--tone);
        box-shadow: 0 0 0 1px var(--tone);
      }

      .gestalt-strength::-moz-range-track {
        height: 3px;
        border: 0;
        border-radius: 0;
        background: rgba(0, 21, 34, 0.18);
      }

      .gestalt-strength::-moz-range-progress {
        height: 3px;
        background: var(--tone);
      }

      .gestalt-strength::-moz-range-thumb {
        width: 8px;
        height: 8px;
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: var(--tone);
        box-shadow: 0 0 0 1px var(--tone);
      }

      .gestalt-control.is-off {
        opacity: 0.45;
      }

      .gestalt-control.is-off .gestalt-strength {
        cursor: default;
      }

      @media (max-width: 520px) {
        .gestalt-panel {
          top: 10px;
          left: 10px;
          width: min(234px, calc(100vw - 20px));
          padding: 6px 8px 8px;
          box-shadow: 4px 4px 0 rgba(0, 75, 135, 0.82);
        }

        .panel-header {
          min-height: 28px;
          padding-bottom: 4px;
        }

        .gestalt-control {
          min-height: 32px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Obstacles and How to Avoid Them: repeating drawing heads leave fluid, fading field lines around borderless Hokusai-toned walls, squares, and circles."
    ></canvas>

    <aside class="gestalt-panel" aria-label="Gestalt controls">
      <div class="panel-header">
        <h1>Composition</h1>
        <div class="panel-actions">
          <button
            class="collapse-button"
            id="collapse-panel"
            type="button"
            aria-controls="composition-controls"
            aria-expanded="true"
            aria-label="Collapse composition controls"
            title="Collapse controls"
          >-</button>
          <button class="reseed-button" id="reseed" type="button" aria-label="New composition" title="New composition">
            &#8635;
          </button>
        </div>
      </div>

      <div class="panel-controls" id="composition-controls">
        <div class="gestalt-control" data-count>
          <span class="count-mark" aria-hidden="true">#</span>
          <span class="gestalt-name">Count</span>
          <output class="gestalt-value">19</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="42" aria-label="Obstacle count" />
        </div>

        <div class="gestalt-control" data-lines>
          <span class="count-mark" aria-hidden="true">&#8801;</span>
          <span class="gestalt-name">Lines</span>
          <output class="gestalt-value">32</output>
          <input class="gestalt-strength" type="range" min="8" max="64" step="1" value="32" aria-label="Line count" />
        </div>

        <div class="gestalt-control" data-line-angle>
          <span class="count-mark" aria-hidden="true">&#8736;</span>
          <span class="gestalt-name">Angle</span>
          <output class="gestalt-value">90&deg;</output>
          <input class="gestalt-strength" type="range" min="0" max="360" step="1" value="90" aria-label="Line angle" />
        </div>

        <div class="gestalt-control" data-gestalt="scale">
          <input class="gestalt-toggle" type="checkbox" aria-label="Scale on" />
          <span class="gestalt-name">Scale</span>
          <output class="gestalt-value">38%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="38" aria-label="Scale strength" />
        </div>

        <div class="gestalt-control" data-gestalt="scaleVariety">
          <input class="gestalt-toggle" type="checkbox" aria-label="Scale variety on" />
          <span class="gestalt-name">Scale variety</span>
          <output class="gestalt-value">82%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="82" aria-label="Scale variety strength" />
        </div>

        <div class="gestalt-control" data-gestalt="implied">
          <input class="gestalt-toggle" type="checkbox" aria-label="Implied line on" />
          <span class="gestalt-name">Implied line</span>
          <output class="gestalt-value">74%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="74" aria-label="Implied line strength" />
        </div>

        <div class="gestalt-control" data-gestalt="proximity">
          <input class="gestalt-toggle" type="checkbox" aria-label="Proximity on" />
          <span class="gestalt-name">Proximity</span>
          <output class="gestalt-value">58%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="58" aria-label="Proximity strength" />
        </div>

        <div class="gestalt-control" data-gestalt="closure">
          <input class="gestalt-toggle" type="checkbox" aria-label="Closure on" />
          <span class="gestalt-name">Closure</span>
          <output class="gestalt-value">46%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="46" aria-label="Closure strength" />
        </div>

        <div class="gestalt-control" data-gestalt="offpage">
          <input class="gestalt-toggle" type="checkbox" aria-label="Off-page on" />
          <span class="gestalt-name">Off-page</span>
          <output class="gestalt-value">66%</output>
          <input class="gestalt-strength" type="range" min="0" max="100" value="66" aria-label="Off-page strength" />
        </div>
      </div>
    </aside>

    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });
      const compositionPanel = document.querySelector('.gestalt-panel');
      const panelHeader = compositionPanel.querySelector('.panel-header');
      const collapseButton = document.getElementById('collapse-panel');
      const reseedButton = document.getElementById('reseed');
      const reducedMotionQuery =
        typeof matchMedia === 'function'
          ? matchMedia('(prefers-reduced-motion: reduce)')
          : null;
      const TAU = Math.PI * 2;

      const COLORS = {
        paper: '#ffffe4',
        ink: '#001522',
        wheat: '#ffd77b',
        paleYellow: '#ffffb3',
        prussian: '#004b87',
        tyrian: '#a8002c',
        burlywood: '#deb887',
      };

      const WALL_COLORS = [
        COLORS.prussian,
        COLORS.wheat,
        COLORS.tyrian,
        COLORS.burlywood,
        COLORS.paleYellow,
        COLORS.prussian,
        COLORS.ink,
        COLORS.wheat,
      ];
      const LINE_COLORS = [
        'rgba(0, 21, 34, 0.5)',
        'rgba(0, 75, 135, 0.4)',
        'rgba(168, 0, 44, 0.34)',
        'rgba(0, 21, 34, 0.44)',
        'rgba(222, 184, 135, 0.48)',
        'rgba(0, 75, 135, 0.33)',
        'rgba(168, 0, 44, 0.3)',
        'rgba(255, 215, 123, 0.52)',
        'rgba(0, 21, 34, 0.47)',
        'rgba(222, 184, 135, 0.4)',
      ];
      const GESTALTS = {
        scale: { enabled: true, strength: 0.38 },
        scaleVariety: { enabled: true, strength: 0.82 },
        implied: { enabled: true, strength: 0.74 },
        proximity: { enabled: true, strength: 0.58 },
        closure: { enabled: true, strength: 0.46 },
        offpage: { enabled: true, strength: 0.66 },
      };
      const COUNT_SETTING = { strength: 0.42 };
      const LINE_SETTING = { count: 32, angle: 90 };

      let width = 1;
      let height = 1;
      let dpr = 1;
      let seed = seedFromLocation();
      let random = mulberry32(seed);
      let obstacles = [];
      let lines = [];
      let lineTemplates = [];
      let resizeTimer = 0;
      let compositionFrame = 0;
      let lineAnimationFrame = 0;
      let lineAnimationStartedAt = 0;
      let lastAnimationRender = 0;
      let prefersReducedMotion = reducedMotionQuery ? reducedMotionQuery.matches : false;
      let panelDrag = null;

      function seedFromLocation() {
        const params = new URLSearchParams(location.search);
        const fromQuery = Number.parseInt(params.get('seed') || '', 36);
        if (Number.isFinite(fromQuery)) return fromQuery >>> 0;
        return ((Date.now() * 2654435761) ^ (Math.random() * 0xffffffff)) >>> 0;
      }

      function mulberry32(a) {
        return function rand() {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function rand(min, max) {
        return min + random() * (max - min);
      }

      function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }

      function pick(items) {
        return items[Math.floor(random() * items.length)];
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function mix(from, to, amount) {
        return from + (to - from) * clamp(amount, 0, 1);
      }

      function gestaltStrength(name) {
        return GESTALTS[name].enabled ? GESTALTS[name].strength : 0;
      }

      function smootherStep(value) {
        const t = clamp(value, 0, 1);
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      function rectPerimeterPoint(rect, u) {
        const w = rect.a * 2;
        const h = rect.b * 2;
        let t = ((u % rect.perimeter) + rect.perimeter) % rect.perimeter;
        if (t < w) return { x: rect.x - rect.a + t, y: rect.y - rect.b, angle: 0 };
        t -= w;
        if (t < h) return { x: rect.x + rect.a, y: rect.y - rect.b + t, angle: Math.PI / 2 };
        t -= h;
        if (t < w) return { x: rect.x + rect.a - t, y: rect.y + rect.b, angle: 0 };
        t -= w;
        return { x: rect.x - rect.a, y: rect.y + rect.b - t, angle: Math.PI / 2 };
      }

      function scaled(min, max, bias = 1.32) {
        return min + (max - min) * Math.pow(random(), bias);
      }

      function resize() {
        width = Math.max(1, innerWidth);
        height = Math.max(1, innerHeight);
        dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        compose();
      }

      function compose() {
        random = mulberry32((seed ^ Math.round(width * 17) ^ Math.round(height * 31)) >>> 0);
        obstacles = makeObstacles();
        composeLines();
        updateCountOutput();
        updateLineOutput();
        restartLineAnimation();
      }

      function lineFrame() {
        const theta = (LINE_SETTING.angle * Math.PI) / 180;
        const dx = Math.sin(theta);
        const dy = -Math.cos(theta);
        return {
          dx,
          dy,
          w: Math.abs(width * dx) + Math.abs(height * dy),
          h: Math.abs(width * dy) + Math.abs(height * dx),
          phi: Math.atan2(dy, dx),
        };
      }

      function composeLines() {
        const frame = lineFrame();
        const cx = width / 2;
        const cy = height / 2;
        const fcx = frame.w / 2;
        const fcy = frame.h / 2;
        const routing = obstacles.map((obstacle) => {
          const relX = obstacle.x - cx;
          const relY = obstacle.y - cy;
          const u = relX * frame.dx + relY * frame.dy + fcx;
          const v = relX * -frame.dy + relY * frame.dx + fcy;
          return {
            ...obstacle,
            x: u,
            y: v,
            baseX: u,
            baseY: v,
            rotation: obstacle.rotation - frame.phi,
          };
        });
        const toScreen = (point) => ({
          x: cx + (point.x - fcx) * frame.dx - (point.y - fcy) * frame.dy,
          y: cy + (point.x - fcx) * frame.dy + (point.y - fcy) * frame.dx,
        });
        const realWidth = width;
        const realHeight = height;
        width = frame.w;
        height = frame.h;
        try {
          lineTemplates = makeLineTemplates();
          assignRoutingGroups(routing, lineSpacing());
          lines = makeLines(routing, toScreen);
        } finally {
          width = realWidth;
          height = realHeight;
        }
      }

      function assignRoutingGroups(routing, lineGap) {
        const parent = routing.map((_, index) => index);
        const clearance = clamp(lineGap * 0.42, 5, 8);
        const widestLane = clamp(lineGap * 0.5 * 1.28, 5, 17);
        const mergeGap = clearance * 2 + widestLane * 1.5;

        const find = (index) => {
          let root = index;
          while (parent[root] !== root) root = parent[root];
          while (parent[index] !== index) {
            const next = parent[index];
            parent[index] = root;
            index = next;
          }
          return root;
        };
        const join = (a, b) => {
          const rootA = find(a);
          const rootB = find(b);
          if (rootA !== rootB) parent[rootB] = rootA;
        };

        for (let i = 0; i < routing.length; i++) {
          for (let j = i + 1; j < routing.length; j++) {
            const a = routing[i];
            const b = routing[j];
            const sameStack = a.stackId && a.stackId === b.stackId;
            const surfaceGap =
              segmentDistance(centerSegment(a), centerSegment(b)) -
              obstacleCollisionRadius(a) -
              obstacleCollisionRadius(b);
            if (sameStack || surfaceGap < mergeGap) join(i, j);
          }
        }

        const groups = new Map();
        for (let i = 0; i < routing.length; i++) {
          const root = find(i);
          const obstacle = routing[i];
          const bounds = wallHalfBounds(obstacle);
          const group = groups.get(root) || {
            minY: Infinity,
            maxY: -Infinity,
            ids: [],
          };
          group.minY = Math.min(group.minY, obstacle.y - bounds.y);
          group.maxY = Math.max(group.maxY, obstacle.y + bounds.y);
          group.ids.push(obstacle.id);
          groups.set(root, group);
        }

        for (let i = 0; i < routing.length; i++) {
          const group = groups.get(find(i));
          routing[i].routeGroupY = (group.minY + group.maxY) * 0.5;
          routing[i].routeGroupTop = group.minY;
          routing[i].routeGroupBottom = group.maxY;
          routing[i].routeGroupKey = hashText(group.ids.sort((a, b) => a - b).join(','));
        }
      }

      function makeObstacles() {
        const minSide = Math.min(width, height);
        const spec = makeCompositionSpec();
        const desired = spec.count;
        const lineGap = clamp(height / 44, 14, 22);
        const clearance = clamp(lineGap * 0.36 + minSide * 0.0015, 6, 11);
        const horizontalBoundary = horizontalSafeZone();
        const verticalBoundary = clamp(minSide * (width < 520 ? 0.045 : 0.035), 16, 44);
        const corridor = clamp(minSide * 0.032, 20, 42);
        const placed = [];
        const anchors = makeGestaltAnchors(spec).sort(
          (a, b) => anchorPriority(b) - anchorPriority(a)
        );

        for (let i = 0; i < anchors.length && placed.length < desired; i++) {
          const anchor = anchors[i];
          const fill = anchor.fill || WALL_COLORS[(i + randInt(0, WALL_COLORS.length - 1)) % WALL_COLORS.length];
          const obstacle = makeObstacle(spec.base, fill, placed.length, anchor.scale, anchor.shape);
          let candidate = null;

          for (let attempt = 0; attempt < 120; attempt++) {
            const jitter = attempt < 72 ? anchor.jitter : anchor.jitter * 1.65;
            const stackMembers =
              anchor.stackId && anchor.stackIndex > 0
                ? placed.filter((item) => item.stackId === anchor.stackId)
                : [];
            const stackParent =
              stackMembers.length > 0
                ? stackMembers[
                    (anchor.stackIndex - 1 + attempt) % stackMembers.length
                  ]
                : null;
            if (anchor.stackId && anchor.stackIndex > 0 && !stackParent) continue;
            const trial = {
              ...obstacle,
              x: anchor.x + rand(-jitter, jitter),
              y: anchor.y + rand(-jitter, jitter),
              rotation: anchor.angle + rand(-anchor.angleJitter, anchor.angleJitter),
              layoutMode: anchor.mode,
              guideX: anchor.guideX,
              guideY: anchor.guideY,
              guideAngle: anchor.guideAngle,
              stackId: anchor.stackId,
              stackIndex: anchor.stackIndex,
            };
            if (stackParent) {
              positionStackContact(trial, stackParent, anchor, attempt);
            }

            const bounds = wallHalfBounds(trial, clearance);
            if (anchor.edge) {
              if (!positionOffPage(trial, anchor, bounds)) continue;
            } else {
              const minX = horizontalBoundary + bounds.x;
              const maxX = width - horizontalBoundary - bounds.x;
              const minY = verticalBoundary + bounds.y;
              const maxY = height - verticalBoundary - bounds.y;
              if (maxX <= minX || maxY <= minY) continue;
              const clampedX = clamp(trial.x, minX, maxX);
              const clampedY = clamp(trial.y, minY, maxY);
              if (
                stackParent &&
                Math.hypot(clampedX - trial.x, clampedY - trial.y) > 0.5
              ) {
                continue;
              }
              trial.x = clampedX;
              trial.y = clampedY;
            }

            trial.baseX = trial.x;
            trial.baseY = trial.y;
            if (!overlapsPlaced(trial, placed, corridor)) {
              candidate = trial;
              break;
            }
          }

          if (candidate) placed.push(candidate);
        }

        return placed;
      }

      function horizontalSafeZone() {
        return width < 520
          ? clamp(width * 0.11, 30, 48)
          : clamp(width * 0.075, 56, 112);
      }

      function anchorPriority(anchor) {
        if (anchor.edge) return 4;
        if (anchor.mode === 'proximity') {
          return 3.72 + anchor.proximityStrength * 0.18 - anchor.stackIndex * 0.015;
        }
        if (anchor.mode === 'closure') return 3.2;
        if (anchor.mode === 'implied') return 3;
        if (anchor.shape === 'square') return 2.3;
        if (anchor.shape !== 'wall') return 2;
        return 0;
      }

      function makeCompositionSpec() {
        const minSide = Math.min(width, height);
        const capacity =
          width < 520
            ? Math.round(clamp((width * height) / 16000, 14, 26))
            : Math.round(clamp((width * height) / 30000, 28, 48));
        const count = Math.round(mix(6, capacity, smootherStep(COUNT_SETTING.strength)));
        const countScale = mix(1.14, 0.72, smootherStep(COUNT_SETTING.strength));
        const placementScale = GESTALTS.scale.enabled
          ? smootherStep(GESTALTS.scale.strength)
          : 0;
        const mainAngles =
          width < 520
            ? [-1.12, -0.94, 0.94, 1.12]
            : [-0.62, -0.46, 0.38, 0.56];
        const mainAngle = pick(mainAngles) + rand(-0.07, 0.07);
        const center = {
          x: width * rand(0.46, 0.62),
          y: height * rand(0.4, 0.62),
        };
        const guides = [
          {
            x: center.x,
            y: center.y,
            angle: mainAngle,
          },
          {
            x: width * rand(0.34, 0.7),
            y: height * rand(0.32, 0.72),
            angle: mainAngle + pick([0.82, 1.06, Math.PI / 2]),
          },
        ];
        const clusterSeed = rand(0, TAU);
        const clusters = [0, 1, 2].map((index) => {
          const theta = clusterSeed + index * (TAU / 3) + rand(-0.34, 0.34);
          return {
            x: center.x + Math.cos(theta) * width * rand(0.13, 0.25),
            y: center.y + Math.sin(theta) * height * rand(0.12, 0.23),
            angle: theta + Math.PI / 2 + rand(-0.28, 0.28),
          };
        });
        const closure = {
          x: width * rand(0.46, 0.67),
          y: height * rand(0.43, 0.64),
          rx: clamp(width * rand(0.18, 0.3), minSide * 0.28, width * 0.34),
          ry: clamp(height * rand(0.19, 0.31), minSide * 0.22, height * 0.36),
          start: rand(-Math.PI, Math.PI),
        };

        return {
          count,
          anchorCount: Math.ceil(count * mix(2, 3.2, placementScale)),
          base: clamp(minSide * (width < 520 ? 0.155 : 0.145) * countScale, 44, 138),
          guides,
          clusters,
          closure,
        };
      }

      function makeGestaltAnchors(spec) {
        const minSide = Math.min(width, height);
        const implied = gestaltStrength('implied');
        const proximity = gestaltStrength('proximity');
        const closure = gestaltStrength('closure');
        const offpage = gestaltStrength('offpage');
        const scaleVariety = gestaltStrength('scaleVariety');
        const overallScale = GESTALTS.scale.enabled
          ? mix(0.2, 3.6, Math.pow(GESTALTS.scale.strength, 1.65))
          : 1;
        const impliedForce = smootherStep(implied);
        const proximityForce = smootherStep(proximity);
        const contactStrength = smootherStep(
          clamp((proximity - 0.38) / 0.62, 0, 1)
        );
        const proximityCount =
          proximity > 0
            ? Math.round(
                clamp(
                  spec.count * mix(0.1, 0.52, proximityForce),
                  2,
                  Math.max(2, spec.count - 3)
                )
              )
            : 0;
        const proximityStackCount =
          contactStrength > 0
            ? Math.round(
                clamp(
                  mix(1, 3, proximityForce),
                  1,
                  Math.max(1, Math.floor(proximityCount / 2))
                )
              )
            : 0;
        const closureCoverage = mix(0.62, 0.86, closure);
        const closureSpacing =
          spec.base * 1.6 * clamp(Math.pow(overallScale, 0.72), 0.45, 1.6);
        let closureCount =
          closure > 0
            ? Math.round(clamp(spec.count * mix(0.2, 1, closure), 3, spec.count))
            : 0;
        let rect = null;
        if (closureCount > 0) {
          const aspect = clamp(spec.closure.ry / spec.closure.rx, 0.6, 1.6);
          const marginX = horizontalSafeZone() + spec.base * 0.8;
          const marginY = spec.base * 0.9;
          const wanted = (closureCount * closureSpacing) / closureCoverage;
          const a = clamp(
            wanted / (4 * (1 + aspect)),
            spec.base * 1.2,
            (width - marginX * 2) * 0.45
          );
          const b = clamp(a * aspect, spec.base * 1.2, (height - marginY * 2) * 0.42);
          const perimeter = 4 * (a + b);
          const fit = Math.floor((perimeter * closureCoverage) / (closureSpacing * 0.6));
          closureCount = clamp(closureCount, 3, Math.max(3, fit));
          rect = {
            a,
            b,
            x: clamp(spec.closure.x, marginX + a, width - marginX - a),
            y: clamp(spec.closure.y, marginY + b, height - marginY - b),
            perimeter,
          };
        }
        let scatterBudget =
          closureCount > 0
            ? Math.max(
                0,
                Math.round((spec.count - closureCount) * (1 - smootherStep(closure)))
              )
            : Infinity;
        const impliedCount =
          implied > 0
            ? Math.round(clamp(spec.count * mix(0.18, 0.7, impliedForce), 3, spec.count - 2))
            : 0;
        const offpageCount =
          offpage > 0 ? Math.round(clamp(spec.count * mix(0.06, 0.17, offpage), 1, 4)) : 0;
        const scalePattern = [0.1, 1.16, 0.25, 3.4, 0.5, 8.8, 1.7, 0.14, 6.2, 0.36, 2.6, 0.18];
        const proximityScalePattern = [0.42, 1.2, 0.72, 2.2, 0.32, 1.55, 0.58, 1.8, 0.9];
        const impliedScalePattern = [0.12, 0.3, 0.72, 0.16, 1.15, 0.4, 0.88, 0.14, 0.58, 0.22];
        const closureScalePattern = [0.74, 0.62, 0.8, 0.68, 0.88, 0.7];
        const impliedColors = [COLORS.prussian, COLORS.prussian, COLORS.ink, COLORS.prussian, COLORS.tyrian];
        const closureColors = [COLORS.tyrian, COLORS.prussian, COLORS.tyrian, COLORS.ink];
        const shapePattern = ['wall', 'circle', 'square', 'wall', 'circle', 'wall', 'square', 'circle'];
        const edgePattern = ['top', 'bottom'];
        const orientations = [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4];
        const anchors = [];

        for (let i = 0; i < spec.anchorCount; i++) {
          const scatter = {
            x: width * rand(0.06, 0.94),
            y: height * rand(0.07, 0.93),
          };
          let x = scatter.x;
          let y = scatter.y;
          let angle = pick(orientations);
          let angleJitter = 0.08;
          let jitter = minSide * 0.025;
          let mode = 'scatter';
          let modeIndex = i;
          let activeGuide = null;
          let stackId = null;
          let stackIndex = 0;
          let stackAngle = 0;

          if (i < proximityCount) {
            mode = 'proximity';
            modeIndex = i;
            const stackGroup =
              proximityStackCount > 0
                ? modeIndex % proximityStackCount
                : modeIndex % spec.clusters.length;
            const cluster = spec.clusters[stackGroup % spec.clusters.length];
            stackIndex =
              proximityStackCount > 0
                ? Math.floor(modeIndex / proximityStackCount)
                : 0;
            stackId =
              proximityStackCount > 0
                ? `proximity-${stackGroup}`
                : null;
            stackAngle = cluster.angle;
            const theta = rand(0, TAU);
            const radius =
              Math.sqrt(random()) *
              minSide *
              mix(0.3, 0.025, proximityForce);
            const targetX = cluster.x + Math.cos(theta) * radius * rand(0.8, 1.35);
            const targetY = cluster.y + Math.sin(theta) * radius * rand(0.72, 1.12);
            x = mix(x, targetX, proximityForce);
            y = mix(y, targetY, proximityForce);
            angle = mix(
              angle,
              cluster.angle + pick([0, Math.PI / 2, -Math.PI / 2]),
              proximityForce * 0.52
            );
            angleJitter = mix(0.18, 0.055, proximityForce);
            jitter = minSide * mix(0.06, 0.012, proximityForce);
          } else if (i < proximityCount + closureCount) {
            mode = 'closure';
            modeIndex = i - proximityCount;
            const gapLength = (1 - closureCoverage) * rect.perimeter;
            const edgeMids = [
              rect.a,
              rect.a * 2 + rect.b,
              rect.a * 3 + rect.b * 2,
              rect.a * 4 + rect.b * 3,
            ];
            const gapCenter =
              edgeMids[Math.floor(((spec.closure.start + Math.PI) / TAU) * 4) % 4];
            const covered = rect.perimeter - gapLength;
            const u =
              gapCenter +
              gapLength / 2 +
              ((i + 0.5) / closureCount) * covered +
              rand(-0.05, 0.05) * closureSpacing;
            const point = rectPerimeterPoint(rect, u);
            const attraction = smootherStep(closure);
            x = mix(x, point.x, attraction);
            y = mix(y, point.y, attraction);
            angle = mix(angle, point.angle, attraction);
            angleJitter = mix(0.16, 0.03, attraction);
            jitter = minSide * mix(0.055, 0.01, attraction);
          } else if (i < proximityCount + closureCount + impliedCount) {
            const localIndex = i - proximityCount - closureCount;
            const guide = spec.guides[0];
            const guideIndex = localIndex;
            const guideSlots = impliedCount;
            mode = 'implied';
            modeIndex = guideIndex;
            activeGuide = guide;

            let progress = (guideIndex + 0.5) / Math.max(1, guideSlots);
            const gapHalf = mix(0.045, 0.12, impliedForce);
            if (progress < 0.5) {
              progress = (progress / 0.5) * (0.5 - gapHalf);
            } else {
              progress = 0.5 + gapHalf + ((progress - 0.5) / 0.5) * (0.5 - gapHalf);
            }

            const usableWidth = width - horizontalSafeZone() * 2;
            const usableHeight = height - minSide * 0.18;
            const spanAcrossWidth = usableWidth / Math.max(0.08, Math.abs(Math.cos(guide.angle)));
            const spanAcrossHeight = usableHeight / Math.max(0.08, Math.abs(Math.sin(guide.angle)));
            const span = Math.min(spanAcrossWidth, spanAcrossHeight) * 0.94;
            const along = (progress - 0.5) * span;
            const attraction = 1 - Math.pow(1 - impliedForce, 1.7);
            const normal = rand(-1, 1) * minSide * mix(0.15, 0.004, attraction);
            const targetX =
              guide.x + Math.cos(guide.angle) * along - Math.sin(guide.angle) * normal;
            const targetY =
              guide.y + Math.sin(guide.angle) * along + Math.cos(guide.angle) * normal;
            x = mix(x, targetX, attraction);
            y = mix(y, targetY, attraction);
            const targetAngle = guide.angle;
            angle = mix(angle, targetAngle, attraction);
            angleJitter = mix(0.16, 0.012, attraction);
            jitter = minSide * mix(0.07, 0.007, attraction);
          }

          if (mode === 'scatter' && i < spec.anchorCount - offpageCount) {
            if (scatterBudget <= 0) continue;
            scatterBudget -= 1;
          }

          if (mode === 'scatter' && rect) {
            const u = (x - rect.x) / rect.a;
            const v = (y - rect.y) / rect.b;
            const d = Math.max(Math.abs(u), Math.abs(v));
            const clearing = mix(1.08, 1.45, smootherStep(closure));
            if (d < clearing) {
              const factor = (clearing + rand(0.05, 0.3)) / Math.max(d, 0.05);
              x = mix(x, rect.x + (x - rect.x) * factor, smootherStep(closure));
              y = mix(y, rect.y + (y - rect.y) * factor, smootherStep(closure));
            }
          }

          const selectedScale =
            mode === 'implied'
              ? impliedScalePattern[modeIndex % impliedScalePattern.length]
              : mode === 'closure'
                ? closureScalePattern[modeIndex % closureScalePattern.length]
                : mode === 'proximity'
                  ? proximityScalePattern[modeIndex % proximityScalePattern.length]
                : scalePattern[i % scalePattern.length];
          let scaleFactor = mix(1, selectedScale, scaleVariety) * overallScale;
          if (mode === 'implied') {
            scaleFactor *= mix(1, 0.58, impliedForce);
          }
          const offpageStart = spec.anchorCount - offpageCount;
          const isOffpage = i >= offpageStart;
          const offpageIndex = isOffpage ? i - offpageStart : -1;
          const edge = isOffpage ? edgePattern[offpageIndex % edgePattern.length] : null;
          if (edge) {
            angle = Math.PI / 2;
            angleJitter = 0.025;
          }
          if (offpageIndex === 0) {
            scaleFactor = Math.max(
              scaleFactor,
              mix(1, 8.8, scaleVariety) * overallScale
            );
          }
          const shape =
            edge || mode === 'implied'
              ? 'wall'
              : mode === 'closure'
                ? ['wall', 'square', 'wall', 'circle', 'wall', 'square'][modeIndex % 6]
                : shapePattern[i % shapePattern.length];
          anchors.push({
            x,
            y,
            angle,
            angleJitter,
            jitter,
            edge,
            edgeDepth: offpageIndex >= 0 ? mix(0.16, 0.64, offpage) : 0,
            scale: edge ? scaleFactor * mix(1.02, 1.32, offpage) : scaleFactor,
            shape,
            fill:
              mode === 'implied'
                ? impliedColors[modeIndex % impliedColors.length]
                : mode === 'closure'
                  ? closureColors[modeIndex % closureColors.length]
                  : WALL_COLORS[i % WALL_COLORS.length],
            mode,
            guideX: activeGuide ? activeGuide.x : null,
            guideY: activeGuide ? activeGuide.y : null,
            guideAngle: activeGuide ? activeGuide.angle : null,
            stackId,
            stackIndex,
            stackAngle,
            contactStrength,
            proximityStrength: proximityForce,
          });
        }

        return anchors;
      }

      function positionOffPage(trial, anchor, bounds) {
        if (anchor.edge === 'left' || anchor.edge === 'right') return false;

        const depth = anchor.edgeDepth * rand(0.72, 1.08);
        const safeX = horizontalSafeZone();
        const minX = safeX + bounds.x;
        const maxX = width - safeX - bounds.x;
        if (maxX <= minX) return false;

        trial.x = clamp(trial.x, minX, maxX);
        trial.y = anchor.edge === 'top' ? -bounds.y * depth : height + bounds.y * depth;
        return true;
      }

      function positionStackContact(trial, parent, anchor, attempt) {
        const directionPattern = [0, 0.58, -0.66, 1.02, -1.08, 0.28, -0.34];
        const direction =
          anchor.stackAngle +
          directionPattern[(anchor.stackIndex - 1) % directionPattern.length] +
          rand(-0.2, 0.2) +
          (attempt % 5) * 0.11;
        const parentReach = obstacleSupportRadius(parent, direction);
        const trialReach = obstacleSupportRadius(trial, direction + Math.PI);
        const contactDepth =
          Math.min(obstacleContactThickness(parent), obstacleContactThickness(trial)) *
          mix(0.08, 0.42, anchor.contactStrength) *
          rand(0.78, 1.18);
        const centerDistance = Math.max(
          0,
          parentReach + trialReach - contactDepth
        );
        trial.x = parent.x + Math.cos(direction) * centerDistance;
        trial.y = parent.y + Math.sin(direction) * centerDistance;
      }

      function obstacleSupportRadius(obstacle, direction) {
        if (obstacle.type === 'circle') return obstacle.radius;
        const local = direction - obstacle.rotation;
        return (
          Math.abs(Math.cos(local)) * obstacle.width * 0.5 +
          Math.abs(Math.sin(local)) * obstacle.height * 0.5
        );
      }

      function obstacleContactThickness(obstacle) {
        return obstacle.type === 'circle'
          ? obstacle.radius * 2
          : Math.min(obstacle.width, obstacle.height);
      }

      function overlapsPlaced(candidate, placed, corridor) {
        const a = centerSegment(candidate);
        for (const existing of placed) {
          if (
            candidate.stackId &&
            existing.stackId === candidate.stackId
          ) {
            continue;
          }
          const b = centerSegment(existing);
          const minDistance =
            obstacleCollisionRadius(candidate) + obstacleCollisionRadius(existing) + corridor;
          if (segmentDistance(a, b) < minDistance) return true;
        }
        return false;
      }

      function centerSegment(obstacle) {
        if (obstacle.type !== 'wall') {
          return {
            ax: obstacle.x,
            ay: obstacle.y,
            bx: obstacle.x,
            by: obstacle.y,
          };
        }

        const cos = Math.cos(obstacle.rotation);
        const sin = Math.sin(obstacle.rotation);
        const half = obstacle.width * 0.5;
        return {
          ax: obstacle.x - cos * half,
          ay: obstacle.y - sin * half,
          bx: obstacle.x + cos * half,
          by: obstacle.y + sin * half,
        };
      }

      function obstacleCollisionRadius(obstacle) {
        return obstacle.type === 'wall' ? obstacle.height * 0.5 : obstacle.collisionRadius;
      }

      function segmentDistance(a, b) {
        if (segmentsIntersect(a, b)) return 0;
        return Math.sqrt(
          Math.min(
            pointSegmentDistanceSq(a.ax, a.ay, b.ax, b.ay, b.bx, b.by),
            pointSegmentDistanceSq(a.bx, a.by, b.ax, b.ay, b.bx, b.by),
            pointSegmentDistanceSq(b.ax, b.ay, a.ax, a.ay, a.bx, a.by),
            pointSegmentDistanceSq(b.bx, b.by, a.ax, a.ay, a.bx, a.by)
          )
        );
      }

      function pointSegmentDistanceSq(px, py, ax, ay, bx, by) {
        const dx = bx - ax;
        const dy = by - ay;
        const lengthSq = dx * dx + dy * dy;
        if (lengthSq <= 0.0001) {
          const ex = px - ax;
          const ey = py - ay;
          return ex * ex + ey * ey;
        }
        const t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSq, 0, 1);
        const x = ax + dx * t;
        const y = ay + dy * t;
        const ex = px - x;
        const ey = py - y;
        return ex * ex + ey * ey;
      }

      function segmentsIntersect(a, b) {
        const d1 = direction(a.ax, a.ay, a.bx, a.by, b.ax, b.ay);
        const d2 = direction(a.ax, a.ay, a.bx, a.by, b.bx, b.by);
        const d3 = direction(b.ax, b.ay, b.bx, b.by, a.ax, a.ay);
        const d4 = direction(b.ax, b.ay, b.bx, b.by, a.bx, a.by);
        if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) {
          return true;
        }
        return (
          (Math.abs(d1) < 0.0001 && onSegment(a.ax, a.ay, a.bx, a.by, b.ax, b.ay)) ||
          (Math.abs(d2) < 0.0001 && onSegment(a.ax, a.ay, a.bx, a.by, b.bx, b.by)) ||
          (Math.abs(d3) < 0.0001 && onSegment(b.ax, b.ay, b.bx, b.by, a.ax, a.ay)) ||
          (Math.abs(d4) < 0.0001 && onSegment(b.ax, b.ay, b.bx, b.by, a.bx, a.by))
        );
      }

      function direction(ax, ay, bx, by, px, py) {
        return (px - ax) * (by - ay) - (py - ay) * (bx - ax);
      }

      function onSegment(ax, ay, bx, by, px, py) {
        return (
          px >= Math.min(ax, bx) - 0.0001 &&
          px <= Math.max(ax, bx) + 0.0001 &&
          py >= Math.min(ay, by) - 0.0001 &&
          py <= Math.max(ay, by) + 0.0001
        );
      }

      function makeObstacle(base, fill, id, scaleFactor = 1, shape = 'wall') {
        const scaleVariety = gestaltStrength('scaleVariety');
        const mildVariation = rand(0.86, 1.16);
        const expressiveVariation = scaled(0.72, 1.44, 0.92);
        const lengthVariation = mix(mildVariation, expressiveVariation, scaleVariety);
        if (shape === 'circle' || shape === 'square') {
          const shapeVariation = mix(
            rand(0.56, 0.82),
            rand(0.38, 1.08),
            scaleVariety
          );
          const size = clamp(
            base * Math.pow(scaleFactor, 0.72) * shapeVariation,
            width < 520 ? 16 : 22,
            Math.min(width, height) * 0.7
          );
          const radius = size * 0.5;
          return {
            id,
            type: shape,
            fill,
            width: size,
            height: size,
            radius,
            collisionRadius: shape === 'circle' ? radius : Math.SQRT2 * radius,
            bodyRadius: (shape === 'circle' ? radius : Math.SQRT2 * radius) + 2,
          };
        }

        const thicknessRatio = mix(
          rand(0.11, 0.17),
          rand(0.07, 0.26),
          scaleVariety
        );
        const thickness = clamp(
          base * Math.sqrt(scaleFactor) * thicknessRatio,
          width < 520 ? 5 : 6,
          width < 520 ? 72 : 120
        );
        const aspectPattern = [3.2, 7.5, 12, 4.5, 18, 6, 9.5, 3.8, 14, 5.5, 22, 8];
        const mildAspect = rand(3.2, 5.8);
        const expressiveAspect = aspectPattern[id % aspectPattern.length];
        const targetAspect = mix(
          mildAspect,
          expressiveAspect,
          mix(0.55, 0.92, scaleVariety)
        );
        const scaledLength = base * scaleFactor * lengthVariation;
        const length = clamp(
          Math.max(scaledLength, thickness * targetAspect),
          width < 520 ? 18 : 24,
          Math.max(width, height) * 1.25
        );
        return {
          id,
          type: 'wall',
          fill,
          width: length,
          height: thickness,
          collisionRadius: thickness * 0.5,
          bodyRadius: Math.hypot(length, thickness) * 0.5 + 2,
        };
      }

      function wallHalfBounds(obstacle, margin = 0) {
        const halfW = obstacle.width * 0.5 + margin;
        const halfH = obstacle.height * 0.5 + margin;
        const cos = Math.abs(Math.cos(obstacle.rotation));
        const sin = Math.abs(Math.sin(obstacle.rotation));
        return {
          x: halfW * cos + halfH * sin,
          y: halfW * sin + halfH * cos,
        };
      }

      function makeLines(routingObstacles, toScreen) {
        const lineGap = lineSpacing();
        const xStep = clamp(width / 360, 3, 4.2);
        const stroke = clamp(Math.min(width, height) / 760, 0.72, 1.55);
        const clearance = clamp(lineGap * 0.42, 5, 8);
        const approach = clamp(lineGap * 2.1, 32, 72);
        prepareObstacleCaches(routingObstacles, clearance, approach);
        const made = [];

        for (let i = 0; i < lineTemplates.length; i++) {
          const template = lineTemplates[i];
          template.routeSides = new Map();
          const baseY = template.baseY;
          const points = [];
          let displacement = 0;
          const activeObstacles = routingObstacles;

          for (let x = -8; x <= width + 8; x += xStep) {
            const naturalY =
              baseY +
              Math.sin(x * template.waveA + template.phaseA) * template.wobble +
              Math.sin(x * template.waveB + template.phaseB) * template.wobble * 0.38;
            let y = naturalY + displacement;
            let constrained = false;
            let hardConstrained = false;

            for (let o = 0; o < activeObstacles.length; o++) {
              const obstacle = activeObstacles[o];
              const exact = shapeIntervalAtX(obstacle, x, clearance);
              const soft = fluidIntervalAtX(obstacle, x, template);
              if (!soft) continue;

              const lane = lineLaneOffset(baseY, lineGap, template);
              const softLane =
                lane * mix(0.22, 0.5, (template.steering - 0.62) / 0.86);
              const side = sideForRoute(
                baseY,
                template,
                obstacle,
                soft,
                lineGap,
                softLane,
                y
              );
              const softTarget = side < 0 ? soft.top - softLane : soft.bottom + softLane;
              const insideSoft = y > soft.top && y < soft.bottom;

              if (insideSoft) {
                const depth = side < 0 ? (y - soft.top) / soft.height : (soft.bottom - y) / soft.height;
                const strength = clamp(
                  mix(0.055, 0.52, smootherStep(depth)) * template.steering,
                  0.035,
                  0.72
                );
                const correction = (softTarget - y) * strength;
                if (Math.abs(correction) > 0.01) constrained = true;
                y += correction;
              }

              if (exact) {
                const exactTarget = side < 0 ? exact.top - lane : exact.bottom + lane;
                if ((side < 0 && y > exactTarget) || (side > 0 && y < exactTarget)) {
                  y = exactTarget;
                  constrained = true;
                  hardConstrained = true;
                }
              }
            }

            if (hardConstrained) {
              displacement = y - naturalY;
            } else if (constrained) {
              displacement = mix(
                displacement,
                y - naturalY,
                template.deflectionMemory
              );
              y = naturalY + displacement;
            } else {
              displacement *= template.release;
              y = naturalY + displacement;
            }

            points.push({ x, y });
          }

          relaxAndConstrain(points, baseY, template, lineGap, activeObstacles);
          const curves = makeLineCurves(points, activeObstacles, clearance);
          for (const point of points) {
            const mapped = toScreen(point);
            point.x = mapped.x;
            point.y = mapped.y;
          }
          for (const curve of curves) {
            mapCurveToScreen(curve, toScreen);
          }
          const pathLength = curves.totalLength;
          const drawDuration =
            template.drawDuration * (pathLength / Math.max(1, width));
          const cycleDuration =
            drawDuration +
            template.holdDuration +
            template.fadeDuration +
            template.restDuration;
          made.push({
            baseY,
            index: i,
            points,
            curves,
            pathLength,
            stroke: stroke * template.weight,
            color: template.color,
            spriteColor: WALL_COLORS[i % WALL_COLORS.length],
            drawDuration,
            holdDuration: template.holdDuration,
            fadeDuration: template.fadeDuration,
            restDuration: template.restDuration,
            cycleDuration,
            cycleOffset: template.cyclePhase * cycleDuration,
          });
        }

        return made;
      }

      function makeLineTemplates() {
        const count = LINE_SETTING.count;
        const lineGap = lineSpacing();
        const overscan = clamp(height * 0.035, 18, 42);
        const span = height + overscan * 2;
        const gaps = Array.from({ length: count - 1 }, (_, index) => {
          const pattern = [0.42, 1.65, 0.7, 2.3, 0.5, 1.05, 2.9, 0.62, 1.35, 0.8, 1.9, 0.55];
          return pattern[index % pattern.length] * rand(0.8, 1.25);
        });
        const gapTotal = gaps.reduce((sum, gap) => sum + gap, 0);
        const flowPhaseA = rand(0, TAU);
        const flowPhaseB = rand(0, TAU);
        const flowWaveA = rand(0.0032, 0.0052);
        const flowWaveB = rand(0.0075, 0.011);
        const templates = [];
        let baseY = -overscan;

        for (let i = 0; i < count; i++) {
          const turnTightness = rand(0.62, 1.5);
          templates.push({
            index: i,
            baseY,
            phaseA: flowPhaseA + i * 0.085 + rand(-0.035, 0.035),
            phaseB: flowPhaseB - i * 0.13 + rand(-0.05, 0.05),
            waveA: flowWaveA * rand(0.94, 1.06),
            waveB: flowWaveB * rand(0.92, 1.08),
            wobble: lineGap * rand(0.06, 0.3),
            recognition: rand(0.62, 1.62),
            steering: rand(0.62, 1.48),
            turnTightness,
            deflectionMemory: rand(0.38, 0.76),
            release: mix(0.984, 0.9994, Math.pow(random(), 0.4)),
            laneScale: rand(0.78, 1.28),
            routeSalt: rand(-1000, 1000),
            relaxPasses: Math.round(mix(8, 4, (turnTightness - 0.62) / 0.88)),
            freeSoftenPasses: Math.round(
              mix(10, 4, (turnTightness - 0.62) / 0.88)
            ),
            weight: lineWeight(i),
            color: LINE_COLORS[i % LINE_COLORS.length],
            drawDuration: rand(5.8, 9.4),
            holdDuration: rand(0.35, 1.45),
            fadeDuration: rand(2.8, 6.2),
            restDuration: rand(0.45, 2.4),
            cyclePhase: random(),
          });
          if (i < gaps.length) baseY += (gaps[i] / gapTotal) * span;
        }

        return templates;
      }

      function lineSpacing() {
        const overscan = clamp(height * 0.035, 18, 42);
        return (height + overscan * 2) / Math.max(1, LINE_SETTING.count - 1);
      }

      function lineWeight(index) {
        const pattern = [0.72, 1.08, 0.84, 1.46, 0.76, 1.2, 0.92, 1.72, 0.8, 1.3, 1, 0.68];
        return pattern[index % pattern.length] * rand(0.92, 1.08);
      }

      function sideForLine(baseY, template, obstacle) {
        const routeY = Number.isFinite(obstacle.routeGroupY)
          ? obstacle.routeGroupY
          : obstacle.baseY || obstacle.y;
        const routeKey = Number.isFinite(obstacle.routeGroupKey)
          ? obstacle.routeGroupKey
          : obstacle.id;
        const dy = baseY - routeY;
        if (Math.abs(dy) > 3) return dy < 0 ? -1 : 1;
        const h = Math.sin(
          (seed + 1) * 12.9898 +
          template.index * 78.233 +
          template.routeSalt * 19.193 +
          routeKey * 37.719
        );
        return h < 0 ? -1 : 1;
      }

      function hashText(value) {
        let hash = 2166136261;
        for (let i = 0; i < value.length; i++) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function sideForRoute(
        baseY,
        template,
        obstacle,
        interval,
        lineGap,
        padding = 0,
        currentY = baseY
      ) {
        const minY = -lineGap * 2.2;
        const maxY = height + lineGap * 2.2;
        const top = interval.top - padding;
        const bottom = interval.bottom + padding;
        const routeTop = Number.isFinite(obstacle.routeGroupTop)
          ? obstacle.routeGroupTop - padding
          : top;
        const routeBottom = Number.isFinite(obstacle.routeGroupBottom)
          ? obstacle.routeGroupBottom + padding
          : bottom;
        const routeKey = Number.isFinite(obstacle.routeGroupKey)
          ? obstacle.routeGroupKey
          : obstacle.id;
        if (template.routeSides.has(routeKey)) {
          return template.routeSides.get(routeKey);
        }
        let side = sideForLine(currentY, template, obstacle);
        if (side < 0 && routeTop < minY && routeBottom <= maxY) side = 1;
        if (side > 0 && routeBottom > maxY && routeTop >= minY) side = -1;
        template.routeSides.set(routeKey, side);
        return side;
      }

      function lineLaneOffset(baseY, lineGap, template) {
        return clamp(lineGap * 0.5 * template.laneScale, 5, 17);
      }

      function relaxAndConstrain(points, baseY, template, lineGap, activeObstacles) {
        const scratch = points.map((p) => p.y);
        const clearance = clamp(lineGap * 0.42, 5, 8);
        for (let pass = 0; pass < template.relaxPasses; pass++) {
          for (let i = 3; i < points.length - 3; i++) {
            scratch[i] =
              points[i].y * 0.34 +
              (points[i - 1].y + points[i + 1].y) * 0.22 +
              (points[i - 2].y + points[i + 2].y) * 0.08 +
              (points[i - 3].y + points[i + 3].y) * 0.03;
          }
          for (let i = 3; i < points.length - 3; i++) points[i].y = scratch[i];
          constrain(points, baseY, template, lineGap, activeObstacles);
        }
        constrain(points, baseY, template, lineGap, activeObstacles);
        chamferConstraints(points, clearance, activeObstacles, template);
        softenFreeSegments(points, clearance, activeObstacles, template);
        secureLineSegments(
          points,
          baseY,
          template,
          lineGap,
          activeObstacles
        );
        constrain(points, baseY, template, lineGap, activeObstacles);
      }

      function chamferConstraints(points, clearance, activeObstacles, template) {
        if (points.length < 2) return;
        const maxStep =
          (points[1].x - points[0].x) *
          mix(1.3, 3.8, (template.turnTightness - 0.62) / 0.88);
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 1; i < points.length; i++) {
            easeToward(points, i, i - 1, maxStep, clearance, activeObstacles);
          }
          for (let i = points.length - 2; i >= 0; i--) {
            easeToward(points, i, i + 1, maxStep, clearance, activeObstacles);
          }
        }
      }

      function easeToward(points, i, from, maxStep, clearance, activeObstacles) {
        const delta = points[i].y - points[from].y;
        if (Math.abs(delta) <= maxStep) return;
        const eased = points[from].y + Math.sign(delta) * maxStep;
        if (pointIsClear(points[i].x, eased, clearance, activeObstacles)) {
          points[i].y = eased;
        }
      }

      function softenFreeSegments(points, clearance, activeObstacles, template) {
        const scratch = points.map((point) => point.y);
        for (let pass = 0; pass < template.freeSoftenPasses; pass++) {
          for (let i = 4; i < points.length - 4; i++) {
            const desired =
              points[i].y * 0.2 +
              (points[i - 1].y + points[i + 1].y) * 0.22 +
              (points[i - 2].y + points[i + 2].y) * 0.1 +
              (points[i - 3].y + points[i + 3].y) * 0.05 +
              (points[i - 4].y + points[i + 4].y) * 0.03;
            scratch[i] = pointIsClear(points[i].x, desired, clearance, activeObstacles)
              ? desired
              : points[i].y;
          }
          for (let i = 4; i < points.length - 4; i++) points[i].y = scratch[i];
        }
      }

      function pointIsClear(x, y, clearance, activeObstacles) {
        for (const obstacle of activeObstacles) {
          const interval = shapeIntervalAtX(obstacle, x, clearance);
          if (interval && y > interval.top && y < interval.bottom) return false;
        }
        return true;
      }

      function constrain(points, baseY, template, lineGap, activeObstacles) {
        const minY = -lineGap * 2.2;
        const maxY = height + lineGap * 2.2;
        const clearance = clamp(lineGap * 0.42, 5, 8);
        const lane = lineLaneOffset(baseY, lineGap, template);

        for (const p of points) {
          for (const obstacle of activeObstacles) {
            const interval = shapeIntervalAtX(obstacle, p.x, clearance);
            if (!interval) continue;
            const side = sideForRoute(
              baseY,
              template,
              obstacle,
              interval,
              lineGap,
              lane,
              p.y
            );
            const target = side < 0 ? interval.top - lane : interval.bottom + lane;
            if ((side < 0 && p.y > target) || (side > 0 && p.y < target)) p.y = target;
          }
          p.y = clamp(p.y, minY, maxY);
        }
      }

      function secureLineSegments(
        points,
        baseY,
        template,
        lineGap,
        activeObstacles
      ) {
        const clearance = clamp(lineGap * 0.42, 5, 8);
        const lane = lineLaneOffset(baseY, lineGap, template);
        const minY = -lineGap * 2.2;
        const maxY = height + lineGap * 2.2;

        for (let pass = 0; pass < 3; pass++) {
          for (let i = 0; i < points.length - 1; i++) {
            const from = points[i];
            const to = points[i + 1];

            for (let sample = 1; sample <= 3; sample++) {
              const t = sample / 4;
              const x = mix(from.x, to.x, t);
              const y = mix(from.y, to.y, t);

              for (const obstacle of activeObstacles) {
                const interval = shapeIntervalAtX(obstacle, x, clearance);
                if (!interval || y <= interval.top || y >= interval.bottom) {
                  continue;
                }
                const side = sideForRoute(
                  baseY,
                  template,
                  obstacle,
                  interval,
                  lineGap,
                  lane,
                  y
                );
                const target =
                  side < 0 ? interval.top - lane : interval.bottom + lane;
                if (side < 0) {
                  from.y = Math.min(from.y, target);
                  to.y = Math.min(to.y, target);
                } else {
                  from.y = Math.max(from.y, target);
                  to.y = Math.max(to.y, target);
                }
              }
            }

            from.y = clamp(from.y, minY, maxY);
            to.y = clamp(to.y, minY, maxY);
          }
        }
      }

      function shapeIntervalAtX(obstacle, x, margin) {
        if (obstacle.type === 'circle') {
          const radius = obstacle.radius + margin;
          const dx = x - obstacle.x;
          if (Math.abs(dx) > radius) return null;
          const span = Math.sqrt(radius * radius - dx * dx);
          return makeInterval(obstacle.y - span, obstacle.y + span);
        }

        const cached = cachedGeometry(obstacle, margin);
        if (cached && (x < cached.minX || x > cached.maxX)) return null;
        const vertices = cached ? cached.vertices : obstacleVertices(obstacle, margin);
        let minY = Infinity;
        let maxY = -Infinity;
        let hits = 0;

        for (let i = 0; i < vertices.length; i++) {
          const a = vertices[i];
          const b = vertices[(i + 1) % vertices.length];
          const minX = Math.min(a.x, b.x);
          const maxX = Math.max(a.x, b.x);
          if (x < minX || x > maxX) continue;

          const dx = b.x - a.x;
          if (Math.abs(dx) < 0.0001) {
            if (Math.abs(x - a.x) < 0.5) {
              minY = Math.min(minY, a.y, b.y);
              maxY = Math.max(maxY, a.y, b.y);
              hits += 2;
            }
            continue;
          }

          const t = (x - a.x) / dx;
          if (t >= 0 && t <= 1) {
            const y = a.y + (b.y - a.y) * t;
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
            hits++;
          }
        }

        if (hits < 2) return null;
        return makeInterval(minY, maxY);
      }

      function makeInterval(top, bottom) {
        return {
          top,
          bottom,
          center: (top + bottom) * 0.5,
          height: Math.max(1, bottom - top),
        };
      }

      function obstacleVertices(obstacle, margin) {
        let local;
        if (obstacle.type === 'triangle') {
          local = [
            { x: 0, y: -obstacle.height * 0.56 - margin },
            { x: obstacle.width * 0.55 + margin, y: obstacle.height * 0.46 + margin },
            { x: -obstacle.width * 0.55 - margin, y: obstacle.height * 0.46 + margin },
          ];
        } else {
          const halfW = obstacle.width * 0.5 + margin;
          const halfH = obstacle.height * 0.5 + margin;
          local = [
            { x: -halfW, y: -halfH },
            { x: halfW, y: -halfH },
            { x: halfW, y: halfH },
            { x: -halfW, y: halfH },
          ];
        }

        const cos = Math.cos(obstacle.rotation);
        const sin = Math.sin(obstacle.rotation);
        return local.map((point) => ({
          x: obstacle.x + point.x * cos - point.y * sin,
          y: obstacle.y + point.x * sin + point.y * cos,
        }));
      }

      function prepareObstacleCaches(list, clearance, approach) {
        const softMargin = clearance + approach;
        for (const obstacle of list) {
          const bounds = wallHalfBounds(obstacle, clearance);
          obstacle._exactMargin = clearance;
          obstacle._softMargin = softMargin;
          obstacle._fluidBoundsX = bounds.x;
          obstacle._fluidBoundsY = bounds.y;
          obstacle._fluidApproach = approach;
          obstacle._exactGeometry =
            obstacle.type === 'circle' ? null : makeGeometryCache(obstacleVertices(obstacle, clearance));
          obstacle._softGeometry =
            obstacle.type === 'circle' ? null : makeGeometryCache(obstacleVertices(obstacle, softMargin));
        }
      }

      function fluidIntervalAtX(obstacle, x, template) {
        const radiusX =
          obstacle._fluidBoundsX +
          obstacle._fluidApproach * 3.4 * template.recognition;
        const radiusY =
          obstacle._fluidBoundsY +
          obstacle._fluidApproach *
            mix(0.82, 1.62, (template.steering - 0.62) / 0.86);
        const normalizedX = (x - obstacle.x) / radiusX;
        if (Math.abs(normalizedX) >= 1) return null;
        const span = radiusY * Math.sqrt(1 - normalizedX * normalizedX);
        return makeInterval(obstacle.y - span, obstacle.y + span);
      }

      function cachedGeometry(obstacle, margin) {
        if (Math.abs(margin - obstacle._exactMargin) < 0.0001) return obstacle._exactGeometry;
        if (Math.abs(margin - obstacle._softMargin) < 0.0001) return obstacle._softGeometry;
        return null;
      }

      function makeGeometryCache(vertices) {
        let minX = Infinity;
        let maxX = -Infinity;
        for (const vertex of vertices) {
          minX = Math.min(minX, vertex.x);
          maxX = Math.max(maxX, vertex.x);
        }
        return { vertices, minX, maxX };
      }

      function render(time = lineAnimationStartedAt) {
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, width, height);
        drawLines(time);
        drawObstacles();
      }

      function drawLines(time) {
        const elapsed = Math.max(0, (time - lineAnimationStartedAt) / 1000);

        ctx.save();
        for (const line of lines) {
          let progress = 1;
          let alpha = 1;
          let isDrawing = false;

          if (!prefersReducedMotion) {
            const cycleTime =
              (elapsed + line.cycleOffset) % line.cycleDuration;
            const drawEnd = line.drawDuration;
            const holdEnd = drawEnd + line.holdDuration;
            const fadeEnd = holdEnd + line.fadeDuration;

            if (cycleTime < drawEnd) {
              progress = cycleTime / drawEnd;
              alpha = smootherStep(clamp(cycleTime / 0.24, 0, 1));
              isDrawing = true;
            } else if (cycleTime < holdEnd) {
              progress = 1;
            } else if (cycleTime < fadeEnd) {
              progress = 1;
              alpha =
                1 -
                smootherStep(
                  (cycleTime - holdEnd) / Math.max(0.001, line.fadeDuration)
                );
            } else {
              continue;
            }
          }

          if (progress <= 0 || alpha <= 0.001) continue;

          ctx.beginPath();
          ctx.globalAlpha = alpha;
          ctx.lineWidth = line.stroke;
          ctx.strokeStyle = line.color;
          const head = drawSmoothLine(line, progress);
          ctx.stroke();
          if (head && isDrawing) drawLineSprite(line, head);
        }
        ctx.restore();
      }

      function makeLineCurves(points, activeObstacles = null, clearance = 0) {
        const curves = [];
        let totalLength = 0;
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[Math.max(0, i - 1)];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[Math.min(points.length - 1, i + 2)];
          const curve = {
            startX: p1.x,
            startY: p1.y,
            control1X: p1.x + (p2.x - p0.x) / 6,
            control1Y: p1.y + (p2.y - p0.y) / 6,
            control2X: p2.x - (p3.x - p1.x) / 6,
            control2Y: p2.y - (p3.y - p1.y) / 6,
            endX: p2.x,
            endY: p2.y,
            startLength: totalLength,
            lengthLut: [{ t: 0, length: 0 }],
          };
          if (
            activeObstacles &&
            !curveIsClear(curve, activeObstacles, clearance)
          ) {
            repairCurve(curve, activeObstacles, clearance);
          }
          let curveLength = 0;
          let previousX = curve.startX;
          let previousY = curve.startY;

          for (let sample = 1; sample <= 16; sample++) {
            const t = sample / 16;
            const point = cubicPoint(curve, t);
            curveLength += Math.hypot(point.x - previousX, point.y - previousY);
            curve.lengthLut.push({ t, length: curveLength });
            previousX = point.x;
            previousY = point.y;
          }

          curve.length = curveLength;
          totalLength += curveLength;
          curve.endLength = totalLength;
          curves.push(curve);
        }
        curves.totalLength = totalLength;
        return curves;
      }

      function curveIsClear(curve, activeObstacles, clearance) {
        for (let sample = 1; sample < 12; sample++) {
          const point = cubicPoint(curve, sample / 12);
          if (!pointIsClear(point.x, point.y, clearance, activeObstacles)) {
            return false;
          }
        }
        return true;
      }

      function repairCurve(curve, activeObstacles, clearance) {
        curve.control1X = mix(curve.startX, curve.endX, 1 / 3);
        curve.control2X = mix(curve.startX, curve.endX, 2 / 3);

        for (let pass = 0; pass < 4; pass++) {
          let adjusted = false;
          for (let sample = 1; sample < 12; sample++) {
            const point = cubicPoint(curve, sample / 12);
            for (const obstacle of activeObstacles) {
              const interval = shapeIntervalAtX(obstacle, point.x, clearance);
              if (
                !interval ||
                point.y <= interval.top ||
                point.y >= interval.bottom
              ) {
                continue;
              }

              const routeAbove =
                (curve.startY + curve.endY) * 0.5 <= interval.center;
              const target = routeAbove
                ? interval.top - 2
                : interval.bottom + 2;
              if (routeAbove) {
                curve.control1Y = Math.min(curve.control1Y, target);
                curve.control2Y = Math.min(curve.control2Y, target);
              } else {
                curve.control1Y = Math.max(curve.control1Y, target);
                curve.control2Y = Math.max(curve.control2Y, target);
              }
              adjusted = true;
            }
          }
          if (!adjusted || curveIsClear(curve, activeObstacles, clearance)) break;
        }
      }

      function mapCurveToScreen(curve, toScreen) {
        const start = toScreen({ x: curve.startX, y: curve.startY });
        const control1 = toScreen({
          x: curve.control1X,
          y: curve.control1Y,
        });
        const control2 = toScreen({
          x: curve.control2X,
          y: curve.control2Y,
        });
        const end = toScreen({ x: curve.endX, y: curve.endY });
        curve.startX = start.x;
        curve.startY = start.y;
        curve.control1X = control1.x;
        curve.control1Y = control1.y;
        curve.control2X = control2.x;
        curve.control2Y = control2.y;
        curve.endX = end.x;
        curve.endY = end.y;
      }

      function cubicPoint(curve, t) {
        const inverse = 1 - t;
        const inverse2 = inverse * inverse;
        const t2 = t * t;
        return {
          x:
            inverse2 * inverse * curve.startX +
            3 * inverse2 * t * curve.control1X +
            3 * inverse * t2 * curve.control2X +
            t2 * t * curve.endX,
          y:
            inverse2 * inverse * curve.startY +
            3 * inverse2 * t * curve.control1Y +
            3 * inverse * t2 * curve.control2Y +
            t2 * t * curve.endY,
        };
      }

      function drawSmoothLine(line, progress) {
        const curves = line.curves;
        if (!curves.length) return null;

        const targetLength = clamp(progress, 0, 1) * line.pathLength;
        let completed = 0;
        while (
          completed < curves.length &&
          targetLength >= curves[completed].endLength
        ) {
          completed++;
        }
        ctx.moveTo(curves[0].startX, curves[0].startY);

        for (let i = 0; i < completed; i++) {
          const curve = curves[i];
          ctx.bezierCurveTo(
            curve.control1X,
            curve.control1Y,
            curve.control2X,
            curve.control2Y,
            curve.endX,
            curve.endY
          );
        }

        if (completed < curves.length) {
          const curve = curves[completed];
          const localLength = targetLength - curve.startLength;
          let sample = 1;
          while (
            sample < curve.lengthLut.length - 1 &&
            curve.lengthLut[sample].length < localLength
          ) {
            sample++;
          }
          const before = curve.lengthLut[sample - 1];
          const after = curve.lengthLut[sample];
          const sampleSpan = Math.max(0.0001, after.length - before.length);
          const partial = mix(
            before.t,
            after.t,
            clamp((localLength - before.length) / sampleSpan, 0, 1)
          );
          const aX = mix(curve.startX, curve.control1X, partial);
          const aY = mix(curve.startY, curve.control1Y, partial);
          const bX = mix(curve.control1X, curve.control2X, partial);
          const bY = mix(curve.control1Y, curve.control2Y, partial);
          const cX = mix(curve.control2X, curve.endX, partial);
          const cY = mix(curve.control2Y, curve.endY, partial);
          const dX = mix(aX, bX, partial);
          const dY = mix(aY, bY, partial);
          const eX = mix(bX, cX, partial);
          const eY = mix(bY, cY, partial);
          const endX = mix(dX, eX, partial);
          const endY = mix(dY, eY, partial);
          ctx.bezierCurveTo(aX, aY, dX, dY, endX, endY);
          return {
            x: endX,
            y: endY,
            angle: Math.atan2(endY - dY, endX - dX),
          };
        }

        const headCurve = curves[Math.max(0, completed - 1)];
        return {
          x: headCurve.endX,
          y: headCurve.endY,
          angle: Math.atan2(
            headCurve.endY - headCurve.control2Y,
            headCurve.endX - headCurve.control2X
          ),
        };
      }

      function drawLineSprite(line, head) {
        const radius = clamp(2.4 + line.stroke * 0.9, 3, 5.4);
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(head.angle);
        ctx.fillStyle = line.spriteColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.7, radius * 0.72, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawObstacles() {
        for (const obstacle of obstacles) {
          ctx.save();
          ctx.translate(obstacle.x, obstacle.y);
          ctx.rotate(obstacle.rotation);
          ctx.fillStyle = obstacle.fill;

          drawObstacleShape(obstacle);

          ctx.restore();
        }
      }

      function drawObstacleShape(obstacle) {
        if (obstacle.type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, obstacle.radius, 0, TAU);
          ctx.fill();
          return;
        }

        const x = -obstacle.width * 0.5;
        const y = -obstacle.height * 0.5;
        ctx.fillRect(x, y, obstacle.width, obstacle.height);
      }

      function bindCountControl() {
        const control = document.querySelector('[data-count]');
        const slider = control.querySelector('.gestalt-strength');
        slider.value = Math.round(COUNT_SETTING.strength * 100);
        control.style.setProperty('--strength', `${slider.value}%`);

        slider.addEventListener('input', () => {
          COUNT_SETTING.strength = Number(slider.value) / 100;
          control.style.setProperty('--strength', `${slider.value}%`);
          scheduleCompose();
        });
      }

      function updateCountOutput() {
        const control = document.querySelector('[data-count]');
        const slider = control.querySelector('.gestalt-strength');
        const output = control.querySelector('.gestalt-value');
        output.value = String(obstacles.length);
        output.textContent = output.value;
        slider.setAttribute('aria-valuetext', `${obstacles.length} obstacles`);
      }

      function bindLineControl() {
        const control = document.querySelector('[data-lines]');
        const slider = control.querySelector('.gestalt-strength');
        slider.value = LINE_SETTING.count;
        updateLineControl(control, slider);

        slider.addEventListener('input', () => {
          LINE_SETTING.count = Number(slider.value);
          updateLineControl(control, slider);
          scheduleCompose();
        });
      }

      function updateLineControl(control, slider) {
        const minimum = Number(slider.min);
        const maximum = Number(slider.max);
        const strength = ((LINE_SETTING.count - minimum) / (maximum - minimum)) * 100;
        control.style.setProperty('--strength', `${strength}%`);
        const output = control.querySelector('.gestalt-value');
        output.value = String(LINE_SETTING.count);
        output.textContent = output.value;
        slider.setAttribute('aria-valuetext', `${LINE_SETTING.count} lines`);
      }

      function updateLineOutput() {
        const control = document.querySelector('[data-lines]');
        updateLineControl(control, control.querySelector('.gestalt-strength'));
      }

      function bindLineAngleControl() {
        const control = document.querySelector('[data-line-angle]');
        const slider = control.querySelector('.gestalt-strength');
        slider.value = LINE_SETTING.angle;
        updateLineAngleControl(control, slider);

        slider.addEventListener('input', () => {
          LINE_SETTING.angle = Number(slider.value);
          updateLineAngleControl(control, slider);
          scheduleCompose();
        });
      }

      function updateLineAngleControl(control, slider) {
        control.style.setProperty('--strength', `${(LINE_SETTING.angle / 360) * 100}%`);
        const output = control.querySelector('.gestalt-value');
        output.value = `${LINE_SETTING.angle}°`;
        output.textContent = output.value;
        slider.setAttribute('aria-valuetext', `${LINE_SETTING.angle} degrees`);
      }

      function bindGestaltControls() {
        document.querySelectorAll('[data-gestalt]').forEach((control) => {
          const name = control.dataset.gestalt;
          const toggle = control.querySelector('.gestalt-toggle');
