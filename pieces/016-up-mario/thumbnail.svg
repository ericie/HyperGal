<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Up Mario thumbnail: a small round climber running along a cloud below a ladder">
  <defs>
    <clipPath id="head" clipPathUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="10"/>
    </clipPath>
    <g id="cloud-s">
      <rect x="-52" y="2" width="104" height="22" rx="11"/>
      <circle cx="-30" cy="4" r="16"/><circle cx="-2" cy="-1" r="21"/><circle cx="28" cy="4" r="16"/>
    </g>
    <g id="cloud-l">
      <rect x="-76" y="2" width="152" height="22" rx="11"/>
      <circle cx="-52" cy="4" r="17"/><circle cx="-19" cy="-3" r="23"/>
      <circle cx="16" cy="-3" r="23"/><circle cx="50" cy="4" r="17"/>
    </g>
  </defs>

  <rect width="300" height="300" fill="#C7DAF1"/>

  <!-- gutter cloud banks -->
  <g fill="#A6C3E6">
    <circle cx="6" cy="30" r="38"/><circle cx="-2" cy="114" r="42"/>
    <circle cx="4" cy="200" r="36"/><circle cx="-4" cy="272" r="40"/>
    <circle cx="294" cy="12" r="36"/><circle cx="302" cy="94" r="42"/>
    <circle cx="296" cy="176" r="38"/><circle cx="304" cy="256" r="40"/>
  </g>
  <g fill="#DEEAF8">
    <circle cx="0" cy="70" r="34"/><circle cx="8" cy="158" r="32"/>
    <circle cx="-2" cy="238" r="34"/>
    <circle cx="300" cy="52" r="34"/><circle cx="292" cy="134" r="32"/>
    <circle cx="302" cy="216" r="34"/>
  </g>

  <!-- shaft, scalloped along both edges -->
  <rect x="34" width="232" height="300" fill="#EFF5FD"/>
  <g fill="#EFF5FD">
    <circle cx="34" cy="8" r="19"/><circle cx="34" cy="54" r="19"/>
    <circle cx="34" cy="100" r="19"/><circle cx="34" cy="146" r="19"/>
    <circle cx="34" cy="192" r="19"/><circle cx="34" cy="238" r="19"/>
    <circle cx="266" cy="30" r="19"/><circle cx="266" cy="76" r="19"/>
    <circle cx="266" cy="122" r="19"/><circle cx="266" cy="168" r="19"/>
    <circle cx="266" cy="214" r="19"/>
  </g>

  <!-- haze, farthest layer -->
  <g fill="#E7F0FB">
    <use href="#cloud-s" x="104" y="58"/>
    <use href="#cloud-s" x="196" y="150"/>
    <use href="#cloud-s" x="86" y="216"/>
  </g>

  <!-- upper cloud -->
  <g>
    <g fill="#1D3D6D" opacity=".08"><use href="#cloud-s" x="202" y="82"/></g>
    <g fill="#FFFFFF"><use href="#cloud-s" x="199" y="72"/></g>
    <path d="M147 91h104v3a11 11 0 0 1-11 11h-82a11 11 0 0 1-11-11z" fill="#C7DAF1"/>
    <path d="M153 91a16 16 0 0 0 31 1zM181 91a21 21 0 0 0 32 0zM212 91a16 16 0 0 0 28 2z" fill="#C7DAF1"/>
  </g>

  <!-- ladder down from the upper cloud -->
  <g stroke="#A6C3E6" stroke-width="6" stroke-linecap="round">
    <path d="M203 100v78M221 100v78"/>
  </g>
  <g stroke="#7BA1D0" stroke-width="5" stroke-linecap="round">
    <path d="M205 116h14M205 136h14M205 156h14"/>
  </g>

  <!-- question box -->
  <g>
    <rect x="58" y="92" width="32" height="32" rx="10" fill="#1D3D6D" opacity=".1"/>
    <rect x="56" y="88" width="32" height="32" rx="10" fill="#2E5FA1"/>
    <rect x="61" y="93" width="22" height="6" rx="3" fill="#4B77B5"/>
    <text x="72" y="112" font-family="Geneva, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">?</text>
  </g>

  <!-- main cloud -->
  <g>
    <g fill="#1D3D6D" opacity=".08"><use href="#cloud-l" x="139" y="190"/></g>
    <g fill="#FFFFFF"><use href="#cloud-l" x="136" y="179"/></g>
    <path d="M60 198h152v3a11 11 0 0 1-11 11H71a11 11 0 0 1-11-11z" fill="#C7DAF1"/>
    <path d="M67 198a17 17 0 0 0 31 1zM100 198a23 23 0 0 0 32 0zM135 198a23 23 0 0 0 32 0zM170 198a17 17 0 0 0 29 2z" fill="#C7DAF1"/>
  </g>

  <!-- the climber, mid-stride -->
  <g transform="translate(112,179) scale(1.5)">
    <ellipse cx="0" cy="2" rx="14" ry="4" fill="#1D3D6D" opacity=".1"/>

    <!-- back arm and leg, one tone lighter -->
    <path d="M-3.5-18-9-9l-2.5 8" fill="none" stroke="#7BA1D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="-10.5" cy="-.5" rx="5" ry="3" fill="#7BA1D0"/>
    <path d="M-6-28l-7 4-4.5 6.5" fill="none" stroke="#7BA1D0" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-17.5" cy="-17.5" r="3.6" fill="#7BA1D0"/>

    <!-- torso -->
    <rect x="-9.5" y="-30" width="19" height="18" rx="8" fill="#2E5FA1"/>
    <rect x="-9.5" y="-24" width="19" height="12" rx="7" fill="#1D3D6D"/>
    <path d="M-4.5-29v7M4.5-29v7" stroke="#1D3D6D" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="0" cy="-20.5" r="2" fill="#7BA1D0"/>

    <!-- front arm and leg -->
    <path d="M3.5-18 8.5-11l1.5-8" fill="none" stroke="#4B77B5" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="11" cy="-8" rx="5.4" ry="3.2" fill="#1D3D6D"/>
    <path d="M6-28l7 4 2.5 6" fill="none" stroke="#4B77B5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15.5" cy="-18" r="3.8" fill="#4B77B5"/>

    <!-- head -->
    <g transform="translate(0,-38)">
      <circle cx="0" cy="0" r="10" fill="#fff"/>
      <g clip-path="url(#head)">
        <rect x="-12" y="-19" width="24" height="15" fill="#2E5FA1"/>
      </g>
      <rect x="-4.5" y="-5.6" width="16" height="4.8" rx="2.4" fill="#2E5FA1"/>
      <circle cx="0" cy="-10.5" r="2.8" fill="#7BA1D0"/>
      <ellipse cx="-.2" cy="2.6" rx="2.2" ry="2.9" fill="#1D3D6D"/>
      <ellipse cx="4.2" cy="2.6" rx="2.2" ry="2.9" fill="#1D3D6D"/>
      <circle cx=".6" cy="1.4" r=".9" fill="#fff"/>
      <circle cx="5" cy="1.4" r=".9" fill="#fff"/>
      <ellipse cx="-5.4" cy="6.4" rx="2.3" ry="1.5" fill="#DFA9AE"/>
      <ellipse cx="9.4" cy="6.4" rx="2.3" ry="1.5" fill="#DFA9AE"/>
      <path d="M-.1 6.4a2.2 2.2 0 0 0 4.4 0" fill="none" stroke="#1D3D6D" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#C7DAF1">
    <path d="M56 48c1 4.2 2 5.2 6 6-4 1-5 2-6 6-1-4-2-5-6-6 4-.8 5-1.8 6-6z"/>
    <path d="M246 146c.8 3.4 1.6 4.2 4.8 4.8-3.2.8-4 1.6-4.8 4.8-.8-3.2-1.6-4-4.8-4.8 3.2-.6 4-1.4 4.8-4.8z"/>
    <path d="M50 236c1 4.2 2 5.2 6 6-4 1-5 2-6 6-1-4-2-5-6-6 4-.8 5-1.8 6-6z"/>
    <path d="M158 40c.8 3.4 1.6 4.2 4.8 4.8-3.2.8-4 1.6-4.8 4.8-.8-3.2-1.6-4-4.8-4.8 3.2-.6 4-1.4 4.8-4.8z"/>
  </g>

  <!-- title plate -->
  <rect y="258" width="300" height="42" fill="#fff"/>
  <rect y="258" width="300" height="2" fill="#C7DAF1"/>
  <text x="16" y="283" font-family="Geneva, sans-serif" font-size="19" font-weight="900" fill="#2E5FA1">UP MARIO</text>
  <text x="284" y="283" font-family="Geneva, sans-serif" font-size="11" font-weight="700" fill="#7BA1D0" text-anchor="end">THE ENDLESS SKY</text>
</svg>
