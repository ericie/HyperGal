<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many Mario · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #a9e4ff;
        --ink: #49385f;
        --muted: #7d6a96;
        --hot: #f06f8f;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }

      body {
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", ui-rounded, system-ui, sans-serif;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--bg);
        cursor: pointer;
        image-rendering: auto;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid var(--hot);
        outline-offset: -9px;
      }

      .debug {
        position: fixed;
        left: 0.85rem;
        bottom: 0.75rem;
        margin: 0;
        padding: 5px 7px;
        color: #fff;
        background: #49385f;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
        z-index: 3;
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Many Mario: a flock of floppy navy bags climbs through a different anime-painted cloudscape on every run, dodging barrels and spinning saw blades."
    ></canvas>
    <pre id="debug" class="debug" hidden></pre>

    <script>
      (() => {
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const debugEl = document.getElementById('debug');
        const params = new URLSearchParams(location.search);
        const cloudPartSources = {
          tower: './assets/cloud-tower.png',
          bank: './assets/cloud-bank.png',
          wisps: './assets/cloud-wisps.png',
        };
        const cloudPartImages = {};
        for (const [name, src] of Object.entries(cloudPartSources)) {
          const image = new Image();
          image.decoding = 'async';
          image.src = src;
          cloudPartImages[name] = image;
        }
        const reduceQuery =
          typeof matchMedia === 'function'
            ? matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        const DEBUG = params.has('debug');
        const TAU = Math.PI * 2;
        const GRAVITY = -1480;
        const RUN_SPEED = 266;
        const AIR_SPEED = 320;
        const JUMP_SPEED = 680;
        const MAX_FALL_SPEED = 980;
        const HERO_W = 32;
        const HERO_H = 46;
        const LAUNCH_MARGIN = 20;
        const MIN_TARGET_GAP = 30;
        const MAX_TARGET_GAP = 156;
        const CLOUD_PULSE_SECONDS = 0.32;
        const LEADER_RUN_SPEED = 212;
        const LEADER_AIR_SPEED = 272;
        const BUDDY_JUMP_SPEED = 650;
        const BUDDY_RUN_SPEED = 162;
        const MARIO_VISIBLE_TARGET = 9;
        const MARIO_POOL_LIMIT = 14;
        const MARIO_RESEED_SECONDS = 1.35;
        const MARIO_ENTRY_COOLDOWN = 8;
        const MARIO_ENTRY_SEPARATION = 100;
        const MARIO_ENTRY_TIMEOUT = 4.8;
        const MARIO_CONTACT_DISTANCE = 26;
        const BARREL_RADIUS = 17;
        const SAW_RADIUS = 15;
        const SAW_INSET = 18;
        const HAZARD_NOTICE = 46;
        const HAZARD_HOP_GAP = 24;
        const HAZARD_HOP_SPEED = 420;
        const HEAD_BOUNCE_SPEED = 585;
        let sawChance = 0.26;
        const BARREL_WARNING_SECONDS = 0.85;
        const BARREL_LIMIT = 3;
        const SCENE_SCALE = 0.9;
        const RUNNER_EDGE_GRACE = 13;
        /* Shelves that run past the frame, so arriving runners have somewhere
           to walk in from instead of being flung in through the air. */
        const EDGE_SHELF_CHANCE = 0.5;
        const EDGE_SHELF_OVERHANG = 96;
        const CRUMBLE_TILE_SIZE = 21;
        const CRUMBLE_REGROW_SECONDS = 5.4;
        let platformTypeBag = [];

        /* A candy-shop palette: blue-sky paper, strawberry pink, lemon,
           mint and grape details. The clouds stay quiet and borderless so
           the runners' movement remains the focus. */
        const C = {
          white: '#FFFDFC',
          sky: '#A9E4FF',
          haze: '#DDF6FF',
          skyDeep: '#7FD2F5',
          mist: '#E9DFFF',
          pale: '#CBB9F0',
          mid: '#F3A6C1',
          deep: '#EF6F8F',
          ink: '#66507D',
          night: '#49385F',
          blush: '#F7A8BF',
          lemon: '#FFD96A',
          mint: '#8EDCC9',
          red: '#ED6670',
          denim: '#6D9FD2',
          skin: '#FFD2AD',
          cocoa: '#7D4C45',
        };

        const SHADOW = 'rgba(73, 56, 95, 0.13)';
        const SHADOW_SOFT = 'rgba(73, 56, 95, 0.07)';

        /* Dust tints, kept as names so the simulation calls read clearly. */
        const COLORS = {
          ink: C.ink,
          coin: C.mid,
          smoke: C.pale,
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let worldWidth = 420;
        let worldLeft = 0;
        let cameraY = 0;
        let cameraLeaderId = 0;
        let highestPlatformY = 0;
        let lastPlatform = null;
        let raf = 0;
        let lastFrameAt = 0;
        let simTime = 0;
        let prefersReducedMotion = reduceQuery.matches;
        let seed = params.get('seed') || randomSeed();
        let rng = Math.random;
        let hero = null;
        let platforms = [];
        let particles = [];
        let barrels = [];
        let barrelWarning = null;
        let nextBarrelAt = 6;
        let barrelCount = 0;
        let barrelRng = Math.random;
        let buddies = [];
        let cloudscapeLayout = [];
        let buddyCount = 0;
        let nextBuddySpawnAt = 0;
        let marioEntryCount = 0;
        let recentMarioEntries = [];
        let keys = {
          left: false,
          right: false,
          jump: false,
        };
        let pointer = {
          active: false,
          x: 0,
          startX: 0,
          startY: 0,
          downAt: 0,
          moved: false,
        };
        let manualUntil = 0;
        let jumpBufferedUntil = 0;
        let bestHeight = 0;
        let platformCount = 0;
        let trunkCount = 0;
        let targetPlatformId = null;

        debugEl.hidden = !DEBUG;
        resize();
        reset(seed);
        addEventListener('resize', resize, { passive: true });
        addEventListener('keydown', onKeyDown);
        addEventListener('keyup', onKeyUp);
        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointercancel', onPointerUp);
        if (typeof reduceQuery.addEventListener === 'function') {
          reduceQuery.addEventListener('change', (event) => {
            prefersReducedMotion = event.matches;
          });
        } else if (typeof reduceQuery.addListener === 'function') {
          reduceQuery.addListener((event) => {
            prefersReducedMotion = event.matches;
          });
        }

        function randomSeed() {
          return Math.floor(Math.random() * 0xffffffff).toString(36);
        }

        function xmur3(str) {
          let h = 1779033703 ^ str.length;
          for (let i = 0; i < str.length; i += 1) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return function nextHash() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return function nextRandom() {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function makeCloudscapeLayout() {
          const skyRng = mulberry32(xmur3(`${seed}:cloud-parts`)());
          const between = (min, max) => min + skyRng() * (max - min);
          const layout = [
            {
              kind: 'bank',
              x: between(0.42, 0.58),
              y: between(0.87, 0.96),
              width: between(1.02, 1.28),
              alpha: between(0.72, 0.9),
              flip: skyRng() > 0.5,
              parallax: between(0.42, 0.52),
            },
          ];

          const towerCount = skyRng() > 0.42 ? 2 : 1;
          for (let i = 0; i < towerCount; i += 1) {
            const rightSide = (i + (skyRng() > 0.5 ? 1 : 0)) % 2 === 0;
            layout.push({
              kind: 'tower',
              x: rightSide ? between(0.91, 1.04) : between(-0.04, 0.09),
              y: between(0.43, 0.7),
              width: between(0.3, 0.48),
              alpha: between(0.54, 0.76),
              flip: rightSide ? skyRng() > 0.24 : skyRng() > 0.76,
              parallax: between(0.24, 0.34),
            });
          }

          const wispCount = 2 + Math.floor(skyRng() * 3);
          for (let i = 0; i < wispCount; i += 1) {
            layout.push({
              kind: 'wisps',
              x: between(0.12, 0.88),
              y: between(0.08, 0.58),
              width: between(0.2, 0.42),
              alpha: between(0.28, 0.56),
              flip: skyRng() > 0.5,
              parallax: between(0.10, 0.16),
            });
          }
          return layout;
        }

        function reset(nextSeed = randomSeed()) {
          cancelAnimationFrame(raf);
          seed = String(nextSeed || randomSeed());
          rng = mulberry32(xmur3(seed)());
          simTime = 0;
          lastFrameAt = 0;
          cameraY = 0;
          cameraLeaderId = 0;
          bestHeight = 0;
          platformCount = 0;
          trunkCount = 0;
          platformTypeBag = [];
          buddyCount = 0;
          nextBuddySpawnAt = 0;
          marioEntryCount = 0;
          recentMarioEntries = [];
          targetPlatformId = null;
          platforms = [];
          particles = [];
          barrels = [];
          barrelWarning = null;
          nextBarrelAt = 6;
          barrelCount = 0;
          barrelRng = mulberry32(xmur3(`${seed}:barrels`)());
          buddies = [];
          cloudscapeLayout = makeCloudscapeLayout();
          lastPlatform = makePlatform(worldWidth * 0.5, 88, Math.min(230, worldWidth * 0.74), 'ink', false);
          platforms.push(lastPlatform);
          highestPlatformY = lastPlatform.y;
          while (highestPlatformY < height * 1.75) {
            if (!addPlatform()) break;
          }
          seedMarioBuddies();
          hero = makeHero(lastPlatform);
          pulseCloud(lastPlatform);
          const warmSeconds = Math.max(0, Number(params.get('warm') || 0) || 0);
          if (warmSeconds > 0) {
            const steps = Math.min(2400, Math.floor(warmSeconds * 60));
            for (let i = 0; i < steps; i += 1) update(1 / 60);
          }
          raf = requestAnimationFrame(tick);
        }

        function makeHero(platform) {
          const x = safeLandingX(platform, platformCenter(platform));
          return {
            id: 0,
            x,
            y: platform.y,
            previousY: platform.y,
            vx: 0,
            vy: 0,
            facing: 1,
            grounded: true,
            groundId: platform.id,
            lastGroundedAt: 0,
            landedAt: 0,
            groundedSince: 0,
            jumpCooldownUntil: 0,
            stumbleUntil: 0,
            blinkUntil: 0,
            autoTargetId: null,
            autoLaunchX: null,
            autoLandingX: null,
            routeAttemptTargetId: null,
            routeAttemptFromId: null,
            routeAttemptStartedAt: 0,
            noRouteSince: 0,
            stride: 0,
            nextBlinkAt: 1.8,
            blinkEndsAt: 0,
            blinkCount: 0,
          };
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          worldWidth = Math.round(clamp(width * 0.96, 300, 1600));
          worldLeft = Math.round((width - worldWidth) / 2);
        }

        function tick(now) {
          if (!lastFrameAt) lastFrameAt = now;
          const rawDt = clamp((now - lastFrameAt) / 1000, 0.001, 0.045);
          lastFrameAt = now;
          const dt = rawDt * (prefersReducedMotion ? 0.45 : 1);
          update(dt);
          render();
          raf = requestAnimationFrame(tick);
        }

        function update(dt) {
          simTime += dt;
          for (const runner of [hero, ...buddies]) runner.previousX = runner.x;
          extendWorld();
          updatePlatformStates();
          updateControls(dt);
          updateHero(dt);
          updateMarioBuddies(dt);
          resolveMarioShoves(dt);
          updateBarrels(dt);
          updateSaws();
          updateParticles(dt);
          updateCamera(dt);
          maintainMarioPopulation();
          trimWorld();
          updateHud();
        }

        function updateControls(dt) {
          if (hero.dead || hero.walkInDir) {
            jumpBufferedUntil = 0;
            return;
          }
          if (keys.jump && simTime > jumpBufferedUntil) jumpBufferedUntil = simTime + 0.12;
          if (manualActive()) {
            hero.groundRoute = null;
            targetPlatformId = null;
            return;
          }
          planAutopilot(dt);
        }

        function updateHero(dt) {
          if (hero.dead) { updateDefeatedMario(hero, dt); return; }
          if (hero.walkInDir) {
            if (hero.entryPending && hero.y >= marioEntryCeiling()) return;
            hero.previousY = hero.y;
            const platform = platformById(hero.platformId);
            if (platformIsSolid(platform)) advanceMarioWalkIn(hero, platform, dt);
            else { hero.walkInDir = 0; hero.entryFrom = null; releaseHeroFromPlatform(); }
            hero.groundId = hero.grounded ? hero.platformId : null;
            if (hero.entryPending && marioIsOnStage(hero)) hero.entryPending = false;
            return;
          }
          if (hero.entryPending && hero.y >= marioEntryCeiling()) return;
          if (hero.entryPending && marioIsOnStage(hero)) hero.entryPending = false;
          hero.previousY = hero.y;
          updateBlink();
          let desiredVx = 0;
          const manual = manualActive();

          if (manual) {
            desiredVx = manualDesiredVx();
          } else {
            desiredVx = hero.autoVx || 0;
          }

          const calmLeader = !manual && highestMario() === hero;
          const maxSpeed = calmLeader
            ? (hero.grounded ? LEADER_RUN_SPEED : LEADER_AIR_SPEED)
            : (hero.grounded ? RUN_SPEED : AIR_SPEED);
          desiredVx = clamp(desiredVx, -maxSpeed, maxSpeed);
          const accel = calmLeader ? (hero.grounded ? 11 : 6.2) : (hero.grounded ? 18 : 8);
          hero.vx += (desiredVx - hero.vx) * (1 - Math.exp(-accel * dt));
          hero.vx = clamp(hero.vx, -maxSpeed, maxSpeed);
          if (Math.abs(hero.vx) > 12) hero.facing = hero.vx > 0 ? 1 : -1;

          const canBufferedJump =
            jumpBufferedUntil > simTime &&
            simTime >= hero.jumpCooldownUntil &&
            (hero.grounded || simTime - hero.lastGroundedAt < 0.09);
          if (canBufferedJump) {
            jump();
            jumpBufferedUntil = 0;
          }

          hero.x += hero.vx * dt;
          hero.vy += GRAVITY * dt;
          hero.vy = Math.max(hero.vy, -MAX_FALL_SPEED);
          hero.y += hero.vy * dt;
          if (hero.grounded) hero.stride += Math.abs(hero.vx) * dt;
          keepHeroInShaft();
          if (!headBounce(hero)) collidePlatforms();
        }

        /* Eye blinks run on their own little clock so the face never feels
           frozen while he is standing still. Timed off a hash rather than the
           world rng, so blinking cannot desync a seeded run. */
        function updateBlink() {
          if (simTime >= hero.nextBlinkAt) {
            hero.blinkCount = (hero.blinkCount || 0) + 1;
            hero.blinkEndsAt = simTime + 0.11;
            hero.nextBlinkAt = simTime + 1.5 + hash01(hero.blinkCount * 7919) * 3.6;
          }
        }

        function planAutopilot() {
          hero.autoVx = 0;
          const leading = highestMario() === hero;
          const runSpeed = leading ? LEADER_RUN_SPEED : RUN_SPEED;

          if (!hero.grounded) {
            const target = activeAirTarget() || chooseAirLandingTarget();
            targetPlatformId = target ? target.id : null;
            if (!target) return;
            hero.autoTargetId = target.id;
            hero.noRouteSince = 0;
            hero.autoLandingX = safeLandingX(target, hero.autoLandingX ?? hero.x);
            hero.autoVx = landingVelocity(hero, airLandingPlan(hero, target)) + barrelSwerve(hero);
            return;
          }

          const current = platformById(hero.groundId);
          if (!current) {
            targetPlatformId = null;
            hero.autoVx = clamp((worldWidth * 0.5 - hero.x) * 2.8, -runSpeed, runSpeed);
            return;
          }

          const dodge = hazardPlan(current, hero.x);
          if (dodge) {
            targetPlatformId = null;
            if (dodge.hop && simTime >= hero.jumpCooldownUntil) {
              hopHero(current, dodge.away);
              return;
            }
            hero.autoVx = dodge.away * runSpeed;
            return;
          }

          if (simTime < hero.landedAt + marioLandingPause(hero, current)) {
            targetPlatformId = null;
            hero.autoVx = 0;
            return;
          }

          const route = committedMarioRoute(current, hero, JUMP_SPEED);
          targetPlatformId = route ? route.target.id : null;
          if (!route) {
            if (!hero.noRouteSince) hero.noRouteSince = simTime;
            hero.autoVx = clamp((platformCenter(current) - hero.x) * 2.8, -runSpeed, runSpeed);
            return;
          }
          hero.noRouteSince = 0;

          hero.autoTargetId = route.target.id;
          hero.autoLaunchX = route.launchX;
          hero.autoLandingX = route.landingX;

          const launchDx = route.launchX - hero.x;
          const landingDx = route.landingX - hero.x;
          const atLaunch = Math.abs(launchDx) < 7;
          hero.autoVx = atLaunch
            ? clamp(landingDx * (leading ? 2.8 : 3.6), -runSpeed, runSpeed)
            : clamp(launchDx * (leading ? 3.6 : 4.8), -runSpeed, runSpeed);

          if (atLaunch && simTime >= hero.jumpCooldownUntil && !barrelBlocksLaunch(hero, route.landingX)) {
            jump(route);
          }
        }

        function activeAirTarget() {
          const target = platformById(hero.autoTargetId);
          return target && airLandingPlan(hero, target) ? target : null;
        }

        function chooseAirLandingTarget(runner = hero) {
          let best = null;
          let bestScore = Infinity;
          for (const platform of platforms) {
            const plan = airLandingPlan(runner, platform);
            if (!plan) continue;
            const score = plan.time * 100 + Math.abs(plan.x - runner.x) * 0.2;
            if (score < bestScore) { best = platform; bestScore = score; }
          }
          return best;
        }

        // Descending intercept, including time left to accelerate and brake.
        function airLandingPlan(runner, platform) {
          if (!platformIsSolid(platform)) return null;
          const gap = platform.y - runner.y;
          const disc = runner.vy * runner.vy + 2 * GRAVITY * gap;
          if (disc < 0) return null;
          const time = (runner.vy + Math.sqrt(disc)) / -GRAVITY;
          if (time <= 0.015 || time > 1.6) return null;
          const bounds = landingBounds(platform);
          if (!bounds) return null;
          const drift = platformLeft(platform, simTime + time) - platformLeft(platform);
          const preferred = runner.id === 0 ? runner.autoLandingX : runner.landingX;
          const x = clamp(preferred ?? runner.x, bounds.left + drift, bounds.right + drift);
          if (Math.abs(x - runner.x) > LEADER_AIR_SPEED * time + 6) return null;
          return { x, time };
        }

        function landingVelocity(runner, plan) {
          if (!plan) return 0;
          // Keep the planned horizontal flight instead of easing to a stop short
          // of the ledge. Correct for the steering response time near touchdown.
          const time = Math.max(0.06, plan.time);
          const velocity = (plan.x - runner.x) / time;
          return clamp(velocity + (velocity - runner.vx) * Math.min(0.7, 0.08 / time),
            -LEADER_AIR_SPEED, LEADER_AIR_SPEED);
        }

        function routeToPlatform(current, target, jumpSpeed = BUDDY_JUMP_SPEED, runner = null) {
          if (!platformIsSolid(current) || !platformIsSolid(target)) return null;
          const gap = target.y - current.y;
          const maxGap = Math.min(MAX_TARGET_GAP, jumpSpeed * jumpSpeed / (-2 * GRAVITY) - 8);
          if (gap < (runner ? -110 : MIN_TARGET_GAP) || gap > maxGap) return null;

          const flightTime = jumpFlightTime(gap, jumpSpeed);
          if (!flightTime) return null;

          const footing = landingBounds(current);
          if (!footing) return null;
          const currentLeft = footing.left;
          const currentRight = footing.right;
          const targetBounds = landingBounds(target);
          if (!targetBounds) return null;
          const targetLeft = targetBounds.left;
          const targetRight = targetBounds.right;
          const currentMargin = Math.min(LAUNCH_MARGIN, (currentRight - currentLeft) * 0.28);
          let landingX = platformCenter(target);

          if (targetLeft > currentRight) {
            landingX = targetLeft;
          } else if (targetRight < currentLeft) {
            landingX = targetRight;
          } else {
            landingX = clamp(platformCenter(current), targetLeft, targetRight);
          }

          let launchX = landingX;
          if (landingX > currentRight - currentMargin) {
            launchX = currentRight - currentMargin;
          } else if (landingX < currentLeft + currentMargin) {
            launchX = currentLeft + currentMargin;
          } else {
            launchX = clamp(landingX, currentLeft + currentMargin, currentRight - currentMargin);
          }

          const maxDx = LEADER_AIR_SPEED * flightTime * 0.82;
          if (runner) {
            const left = Math.max(targetLeft, currentLeft - maxDx + 0.1);
            const right = Math.min(targetRight, currentRight + maxDx - 0.1);
            if (left > right) return null;
            const neighbors = [hero, ...buddies].filter(other => other && other !== runner &&
              (marioGroundId(other) === target.id || (other.grounded ? other.groundRoute?.target.id === target.id :
                other.targetId === target.id || other.autoTargetId === target.id)));
            let bestCost = Infinity;
            for (let i = 0; i <= 6; i++) {
              const x = lerp(left, right, i / 6);
              const takeoffX = clamp(runner.x, Math.max(currentLeft, x - maxDx), Math.min(currentRight, x + maxDx));
              if (routeHitsEarlierPlatform(current, target, takeoffX, x, flightTime, jumpSpeed)) continue;
              const travel = Math.abs(x - takeoffX);
              const crowdCost = neighbors.reduce((cost, other) => {
                const reservedX = other.grounded
                  ? (marioGroundId(other) === target.id ? other.x : other.groundRoute.landingX)
                  : (other.id === 0 ? other.autoLandingX : other.landingX);
                return cost + Math.max(0, 40 - Math.abs(x - (reservedX ?? other.x))) * 5;
              }, 0);
              const cost = travel * 0.24 + crowdCost +
                Math.abs(i / 6 - hash01(runner.id * 1877 + target.id * 31)) * 10;
              if (cost < bestCost) { bestCost = cost; landingX = x; }
            }
            if (!Number.isFinite(bestCost)) return null;
            launchX = clamp(landingX, currentLeft, currentRight);
          }
          let dx = Math.abs(landingX - launchX);
          if (dx > maxDx) return null;
          if (runner) {
            const launchLeft = Math.max(currentLeft, landingX - maxDx);
            const launchRight = Math.min(currentRight, landingX + maxDx);
            if (launchLeft > launchRight) return null;
            launchX = clamp(runner.x, launchLeft, launchRight);
            dx = Math.abs(landingX - launchX);
          }

          return { target, launchX, landingX, gap, dx, flightTime, score: 0 };
        }

        function routeHitsEarlierPlatform(current, target, launchX, landingX, flightTime, jumpSpeed) {
          // A lower target is useless if the descending arc catches the same
          // shelf again. Check every intervening surface before committing.
          return platforms.some(platform => {
            if (platform.id === target.id || platform.y <= target.y || !platformIsSolid(platform)) return false;
            const time = jumpFlightTime(platform.y - current.y, jumpSpeed);
            if (!time || time >= flightTime) return false;
            const x = lerp(launchX, landingX, time / flightTime);
            return platformHasFootingAt(platform, x, 8);
          });
        }

        function jumpFlightTime(gap, speed) {
          const gravity = -GRAVITY;
          const disc = speed * speed - 2 * gravity * gap;
          if (disc <= 0) return 0;
          return (speed + Math.sqrt(disc)) / gravity;
        }

        function landingMargin(platform) {
          return clamp(platform.w * (platform.moving ? 0.32 : 0.24), 20, 38);
        }

        function landingBounds(platform) {
          if (platform.type === 'crumble') return crumbleLandingBounds(platform);
          const platformEdge = platformLeft(platform);
          const heroInset = HERO_W * 0.5 + 4;
          let hardLeft = Math.max(heroInset, platformEdge + HERO_W * 0.42);
          let hardRight = Math.min(worldWidth - heroInset, platformEdge + platform.w - HERO_W * 0.42);
          if (platform.saw) {
            // Aim for whichever side of the blade has more room right now.
            // The blade keeps moving during the flight, which is exactly
            // where the near misses come from.
            const [cx] = sawCenter(platform);
            const guard = platform.saw.radius + HERO_W * 0.5;
            const roomLeft = (cx - guard) - hardLeft;
            const roomRight = hardRight - (cx + guard);
            if (roomRight >= roomLeft) { if (roomRight > 0) hardLeft = Math.max(hardLeft, cx + guard); }
            else if (roomLeft > 0) hardRight = Math.min(hardRight, cx - guard);
          }
          if (hardRight < hardLeft) return null;
          const margin = landingMargin(platform);
          const softLeft = Math.max(hardLeft, platformEdge + margin);
          const softRight = Math.min(hardRight, platformEdge + platform.w - margin);
          return softRight >= softLeft
            ? { left: softLeft, right: softRight }
            : { left: hardLeft, right: hardRight };
        }

        function crumbleLandingBounds(platform) {
          const platformEdge = platformLeft(platform);
          const heroInset = HERO_W * 0.5 + 4;
          const bricks = ensureCrumbleBricks(platform);
          const runs = [];
          let start = -1;
          for (let index = 0; index <= bricks.length; index += 1) {
            const intact = index < bricks.length && !bricks[index].broken;
            if (intact && start < 0) start = index;
            if ((!intact || index === bricks.length) && start >= 0) {
              const first = bricks[start];
              const last = bricks[index - 1];
              const rawLeft = platformEdge + first.x;
              const rawRight = platformEdge + last.x + last.w;
              const visibleLeft = Math.max(heroInset, rawLeft);
              const visibleRight = Math.min(worldWidth - heroInset, rawRight);
              if (visibleRight > visibleLeft) runs.push({ left: visibleLeft, right: visibleRight });
              start = -1;
            }
          }
          runs.sort((a, b) => (b.right - b.left) - (a.right - a.left));
          const run = runs[0];
          if (!run) return null;
          const inset = Math.min(12, (run.right - run.left) * 0.24);
          return run.right - run.left > inset * 2
            ? { left: run.left + inset, right: run.right - inset }
            : { left: (run.left + run.right) * 0.5, right: (run.left + run.right) * 0.5 };
        }

        function safeLandingX(platform, x) {
          const bounds = landingBounds(platform);
          return bounds ? clamp(x, bounds.left, bounds.right) : clamp(x, HERO_W * 0.5 + 4, worldWidth - HERO_W * 0.5 - 4);
        }

        function platformCenter(platform) {
          if (platform.type === 'crumble') {
            const bounds = crumbleLandingBounds(platform);
            if (bounds) return (bounds.left + bounds.right) * 0.5;
          }
          const left = Math.max(0, platformLeft(platform));
          const right = Math.min(worldWidth, platformLeft(platform) + platform.w);
          return (left + right) * 0.5;
        }

        function platformCenterBounds(platformWidth) {
          const minimumPlayableWidth = HERO_W + 8;
          return {
            min: Math.max(18 - worldLeft, minimumPlayableWidth - platformWidth * 0.5),
            max: Math.min(worldWidth + worldLeft - 18, worldWidth - minimumPlayableWidth + platformWidth * 0.5),
          };
        }

        function platformIsSolid(platform) {
          if (!platform || platform.collapsed) return false;
          if (platform.type === 'crumble') {
            ensureCrumbleBricks(platform);
            return platform.crumbleBricks.some((brick) => !brick.broken);
          }
          return true;
        }

        function ensureCrumbleBricks(platform) {
          if (platform.crumbleBricks) return platform.crumbleBricks;
          const count = Math.max(4, Math.round(platform.baseW / CRUMBLE_TILE_SIZE));
          const tileW = platform.baseW / count;
          platform.crumbleBricks = Array.from({ length: count }, (_, index) => ({
            index,
            x: index * tileW,
            w: tileW,
            hitAt: 0,
            breakAt: 0,
            broken: false,
            regrowAt: 0,
            regrownAt: 0,
          }));
          return platform.crumbleBricks;
        }

        function platformHasFootingAt(platform, actorX, halfWidth = 0) {
          if (!platformIsSolid(platform)) return false;
          const left = platformLeft(platform);
          if (platform.type !== 'crumble') {
            return actorX + halfWidth >= left && actorX - halfWidth <= left + platform.w;
          }
          return ensureCrumbleBricks(platform).some((brick) => {
            if (brick.broken) return false;
            const brickLeft = left + brick.x;
            return actorX + halfWidth >= brickLeft + 1 && actorX - halfWidth <= brickLeft + brick.w - 1;
          });
        }

        function updatePlatformStates() {
          for (const platform of platforms) {
            if (platform.restoreAt && simTime >= platform.restoreAt) restorePlatform(platform);
            if (!platform.collapsed && platform.collapseAt && simTime >= platform.collapseAt) collapsePlatform(platform);
            if (platform.type === 'crumble' && platform.crumbleBricks) {
              for (const brick of platform.crumbleBricks) {
                if (!brick.broken && brick.breakAt && simTime >= brick.breakAt) breakCrumbleBrick(platform, brick);
                else if (brick.broken && brick.regrowAt && simTime >= brick.regrowAt) regrowCrumbleBrick(platform, brick);
              }
            }
          }

          if (hero.grounded) {
            const platform = platformById(hero.groundId);
            if (!platformIsSolid(platform)) releaseHeroFromPlatform();
            else updatePlatformContact(platform, hero.x);
          }
          for (const buddy of buddies) {
            if (!buddy.grounded) continue;
            const platform = platformById(buddy.platformId);
            if (!platformIsSolid(platform)) dropMarioBuddy(buddy);
            else updatePlatformContact(platform, buddy.x);
          }
        }

        function updatePlatformContact(platform, actorX) {
          if (platform.type === 'crumble') triggerCrumble(platform, actorX);
        }

        function handlePlatformLanding(platform, actorX) {
          if (!platform) return;
          if (platform.type === 'cloud') breakCloudPlatform(platform);
          if (platform.type === 'crumble') triggerCrumble(platform, actorX);
        }

        function triggerCrumble(platform, actorX) {
          const left = platformLeft(platform);
          const brick = ensureCrumbleBricks(platform)
            .filter((candidate) => !candidate.broken && !candidate.breakAt)
            .sort((a, b) => {
              const aCenter = left + a.x + a.w * 0.5;
              const bCenter = left + b.x + b.w * 0.5;
              return Math.abs(actorX - aCenter) - Math.abs(actorX - bCenter);
            })
            .find((candidate) => actorX >= left + candidate.x - 2 && actorX <= left + candidate.x + candidate.w + 2);
          if (!brick) return;
          brick.hitAt = simTime;
          brick.breakAt = simTime + (prefersReducedMotion ? 0.6 : 0.45);
          platform.pulseUntil = simTime + 0.28;
        }

        function breakCrumbleBrick(platform, brick) {
          brick.broken = true;
          brick.breakAt = 0;
          /* Staggered per brick, so a course rebuilds itself raggedly rather
             than snapping back all at once. */
          brick.regrowAt = simTime + CRUMBLE_REGROW_SECONDS * (0.72 + hash01(platform.id * 421 + brick.index * 53) * 0.62);
          spawnBrickDebris(platform, brick);
          platform.pulseUntil = simTime + 0.2;
        }

        function regrowCrumbleBrick(platform, brick) {
          brick.broken = false;
          brick.regrowAt = 0;
          brick.regrownAt = simTime;
          brick.hitAt = 0;
          brick.breakAt = 0;
          spawnDust(platformLeft(platform) + brick.x + brick.w * 0.5, platform.y - 4, 4, '#EEA2A7');
        }

        function ensureCloudChunks(platform) {
          if (platform.cloudChunks) return platform.cloudChunks;
          const count = 5;
          platform.cloudChunks = Array.from({ length: count }, (_, index) => ({
            index,
            x: platform.baseW * clamp(0.08 + index * 0.21 + (hash01(platform.id * 173 + index * 29) - 0.5) * 0.045, 0.06, 0.94),
            w: platform.baseW * (0.28 + hash01(platform.id * 199 + index * 31) * 0.11),
            h: 31 + (1 - Math.abs(index - 2) / 2) * 13 + hash01(platform.id * 257 + index * 47) * 7,
            lift: -7 - (1 - Math.abs(index - 2) / 2) * 13 - hash01(platform.id * 313 + index * 59) * 5,
            broken: false,
          }));
          return platform.cloudChunks;
        }

        function breakCloudPlatform(platform) {
          if (platform.collapsed || platform.collapseAt || simTime < (platform.nextErosionAt || 0)) return;
          platform.nextErosionAt = simTime + 0.5;
          platform.restoreAt = simTime + 4.1;
          platform.shrinkLevel = Math.min(4, (platform.shrinkLevel || 0) + 1);
          const remaining = ensureCloudChunks(platform).filter((chunk) => !chunk.broken);
          const breaking = [];
          if (platform.shrinkLevel >= 4) {
            breaking.push(...remaining);
          } else if (remaining.length) {
            breaking.push(platform.shrinkLevel % 2 === 0 ? remaining[0] : remaining[remaining.length - 1]);
          }
          for (const chunk of breaking) {
            chunk.broken = true;
            spawnCloudChunkParticles(platform, chunk);
          }

          const survivors = platform.cloudChunks.filter((chunk) => !chunk.broken);
          if (survivors.length) {
            const left = Math.max(0, Math.min(...survivors.map((chunk) => chunk.x - chunk.w * 0.42)));
            const right = Math.min(platform.baseW, Math.max(...survivors.map((chunk) => chunk.x + chunk.w * 0.42)));
            platform.x = platform.baseX + left;
            platform.w = Math.max(12, right - left);
          }
          platform.pulseUntil = simTime + 0.34;

          if (hero.grounded && hero.groundId === platform.id) {
            hero.x = clamp(hero.x, platform.x + 8, platform.x + platform.w - 8);
          }
          for (const buddy of buddies) {
            if (!buddy.grounded || buddy.platformId !== platform.id) continue;
            buddy.localX = clamp(buddy.x - platform.x, 8, Math.max(8, platform.w - 8));
          }
          if (!survivors.length) platform.collapseAt = simTime + 0.12;
        }

        function spawnCloudChunkParticles(platform, chunk) {
          if (prefersReducedMotion) return;
          const centerX = platform.baseX + chunk.x;
          for (let i = 0; i < 9; i += 1) {
            particles.push({
              kind: 'cloud',
              x: centerX + rand(-chunk.w * 0.24, chunk.w * 0.24),
              y: platform.y + rand(-8, 7),
              vx: rand(-58, 58),
              vy: rand(28, 138),
              r: rand(2.8, 7.5),
              stretch: rand(0.65, 1.5),
              rotation: rand(-0.5, 0.5),
              spin: rand(-2.8, 2.8),
              age: 0,
              life: rand(0.55, 1.05),
              color: i % 3 === 0 ? '#DCCEF4' : C.white,
            });
          }
        }

        function collapsePlatform(platform) {
          if (platform.collapsed) return;
          platform.collapsed = true;
          platform.restoreAt = platform.type === 'cloud' ? simTime + 4.1 : 0;
          platform.collapseAt = 0;
          spawnDust(platform.x + platform.w * 0.5, platform.y, 20, C.white);
          releaseActorsFromPlatform(platform);
        }

        function restorePlatform(platform) {
          platform.x = platform.baseX;
          platform.w = platform.baseW;
          platform.collapsed = false;
          platform.restoreAt = 0;
          platform.collapseAt = 0;
          platform.shrinkLevel = 0;
          platform.nextErosionAt = 0;
          for (const buddy of buddies) {
            if (buddy.grounded && buddy.platformId === platform.id) buddy.localX = buddy.x - platform.x;
          }
          if (platform.cloudChunks) {
            for (const chunk of platform.cloudChunks) chunk.broken = false;
          }
          platform.pulseUntil = simTime + 0.34;
        }

        function releaseActorsFromPlatform(platform) {
          if (hero.grounded && hero.groundId === platform.id) releaseHeroFromPlatform();
          for (const buddy of buddies) {
            if (buddy.grounded && buddy.platformId === platform.id) dropMarioBuddy(buddy);
          }
        }

        function releaseHeroFromPlatform() {
          hero.grounded = false;
          hero.groundId = null;
          hero.vy = Math.min(hero.vy, -48);
          hero.autoTargetId = null;
          hero.autoLaunchX = null;
          hero.autoLandingX = null;
        }

        function spawnBrickDebris(platform, brick) {
          if (prefersReducedMotion) return;
          const pieces = 3;
          const left = platformLeft(platform) + brick.x;
          for (let i = 0; i < pieces; i += 1) {
            particles.push({
              kind: 'brick',
              x: left + ((i + 0.5) / pieces) * brick.w,
              y: platform.y - 7,
              vx: rand(-34, 34),
              vy: rand(-105, 26),
              w: rand(5, 9),
              h: rand(6, 10),
              rotation: rand(-0.3, 0.3),
              spin: rand(-4.5, 4.5),
              age: 0,
              life: rand(0.75, 1.2),
              color: i % 2 ? '#C96F78' : '#EEA2A7',
            });
          }
        }

        function manualDesiredVx() {
          let desired = 0;
          if (keys.left) desired -= RUN_SPEED;
          if (keys.right) desired += RUN_SPEED;
          if (pointer.active) {
            const worldX = inverseSceneScreenX(pointer.x);
            const dx = worldX - hero.x;
            if (Math.abs(dx) > 14) desired = clamp(dx * 3.8, -RUN_SPEED, RUN_SPEED);
          }
          return desired;
        }

        function manualActive() {
          return keys.left || keys.right || keys.jump || pointer.active || simTime < manualUntil;
        }

        function jump(route) {
          hero.vy = JUMP_SPEED;
          if (route) {
            hero.vx = (route.landingX - hero.x) / route.flightTime;
            hero.autoVx = hero.vx;
          }
          hero.groundRoute = null;
          const fromId = hero.groundId;
          hero.previousPlatformId = fromId;
          hero.grounded = false;
          hero.groundId = null;
          hero.autoTargetId = route ? route.target.id : null;
          hero.autoLaunchX = route ? route.launchX : null;
          hero.autoLandingX = route ? route.landingX : null;
          hero.routeAttemptTargetId = route ? route.target.id : null;
          hero.routeAttemptFromId = route ? fromId : null;
          hero.routeAttemptStartedAt = route ? simTime : 0;
          hero.jumpCooldownUntil = simTime + 0.11;
          spawnDust(hero.x, hero.y, 11, COLORS.smoke);
        }

        function keepHeroInShaft() {
          const half = HERO_W * 0.5;
          if (hero.x < half + 4) {
            hero.x = half + 4;
            hero.vx = Math.max(0, hero.vx) * 0.24;
          } else if (hero.x > worldWidth - half - 4) {
            hero.x = worldWidth - half - 4;
            hero.vx = Math.min(0, hero.vx) * 0.24;
          }
        }

        function collidePlatforms() {
          const wasGrounded = hero.grounded;
          const previousGroundId = hero.groundId;
          hero.grounded = false;
          let landed = null;
          if (hero.vy <= 0) {
            const half = HERO_W * 0.42;
            for (const platform of platforms) {
              if (!platformIsSolid(platform)) continue;
              const left = platformLeft(platform);
              const right = left + platform.w;
              if (hero.x + half < left || hero.x - half > right) continue;
              if (!platformHasFootingAt(platform, hero.x, half)) continue;
              if (hero.previousY >= platform.y && hero.y <= platform.y + 2) {
                if (!landed || platform.y > landed.y) landed = platform;
              }
            }
          }

          if (!landed) return;
          const isNewLanding = !wasGrounded || previousGroundId !== landed.id;
          hero.y = landed.y;
          hero.vy = 0;
          hero.grounded = true;
          hero.groundId = landed.id;
          hero.lastGroundedAt = simTime;
          if (isNewLanding) {
            markRouteAttemptResult(landed);
            pulseCloud(landed);
            handlePlatformLanding(landed, hero.x);
            hero.landedAt = simTime;
            hero.groundedSince = simTime;
            hero.vx = manualActive() ? hero.vx : 0;
            hero.groundRoute = null;
            hero.autoTargetId = null;
            hero.autoLaunchX = null;
            hero.autoLandingX = null;
          }
          if (!landed.visited) {
            landed.visited = true;
            landed.pulseUntil = simTime + 0.24;
            spawnDust(hero.x, hero.y, 8, COLORS.coin);
          }
        }

        function markRouteAttemptResult(landed) {
          if (!hero.routeAttemptTargetId) return;
          if (landed.id !== hero.routeAttemptTargetId && simTime - hero.routeAttemptStartedAt > 0.22) {
            const missed = platformById(hero.routeAttemptTargetId);
            if (missed) {
              missed.missCount = (missed.missCount || 0) + 1;
              missed.avoidUntil = simTime + clamp(2.5 + missed.missCount * 1.6, 3, 8);
            }
          }
          clearRouteAttempt();
        }

        function clearRouteAttempt() {
          hero.routeAttemptTargetId = null;
          hero.routeAttemptFromId = null;
          hero.routeAttemptStartedAt = 0;
        }

        function updateCamera(dt) {
          const leader = highestMario();
          if (!leader) { cameraLeaderId = null; return; }
          cameraLeaderId = leader.id;

          const target = leader.y - height * 0.48;
          const followSpeed = !leader.grounded && leader.vy < 0 ? 4.8 : 2.7;
          cameraY += (target - cameraY) * (1 - Math.exp(-followSpeed * dt));

          /* A falling leader can pull the camera downward. This lower-frame
             guard keeps that Mario visible even at terminal speed. */
          cameraY = Math.min(cameraY, leader.y - height * 0.28);

          const leaderHeight = Math.max(0, leader.y - 88);
          bestHeight = Math.max(bestHeight, leaderHeight);
        }

        function highestMario() {
          const runners = [hero, ...buddies].filter(runner => !runner.dead && !runner.entryPending);
          return runners.reduce((highest, runner) => !highest || runner.y > highest.y ? runner : highest, null);
        }

        function marioEntryCeiling() {
          const active = [hero, ...buddies].filter(runner => !runner.dead && !runner.entryPending &&
            (runner.grounded || runner.vy >= 0 || sceneScreenY(runner.y) <= height + HERO_H ||
              chooseAirLandingTarget(runner)));
          // Knocked-out runners no longer set the entrance ceiling. A living
          // runner is also out after falling below the frame without a recovery.
          return active.length ? Math.max(...active.map(runner => runner.y)) - HERO_H : Infinity;
        }

        function defeatMario(runner, barrel) {
          if (runner.dead || runner.entryPending) return;
          runner.dead = true;
          runner.deadAt = simTime;
          runner.grounded = false;
          runner.falling = true;
          runner.groundId = null;
          runner.platformId = null;
          runner.targetId = null;
          runner.autoTargetId = null;
          runner.autoLandingX = null;
          runner.groundRoute = null;
          runner.walkInDir = 0;
          runner.entryFrom = null;
          runner.spin = 0;
          runner.vx = Math.sign(barrel.vx || runner.x - barrel.x || 1) * 115;
          runner.vy = 190;
          if (runner === hero) { jumpBufferedUntil = 0; targetPlatformId = null; }
          spawnDust(runner.x, runner.y + 24, 12, C.lemon);
        }

        function updateDefeatedMario(runner, dt) {
          runner.previousY = runner.y;
          if (sceneScreenY(runner.y) > height + 220) return;
          runner.vy = Math.max(-MAX_FALL_SPEED, runner.vy + GRAVITY * dt);
          runner.x += runner.vx * dt;
          runner.y += runner.vy * dt;
          runner.spin += Math.sign(runner.vx || 1) * dt * (prefersReducedMotion ? 1.2 : 6);
        }

        function barrelHitsMario(barrel, runner) {
          if (runner.dead || runner.entryPending) return false;
          // Sweep the relative movement through the body, so a fast barrel
          // cannot skip a Mario between frames (including during a jump).
          const start = [barrel.previousX - (runner.previousX ?? runner.x), barrel.previousY - runner.previousY];
          const end = [barrel.x - runner.x, barrel.y - runner.y];
          const r = barrel.radius;
          const bounds = [[-HERO_W * 0.34 - r * 0.8, HERO_W * 0.34 + r * 0.8], [-r * 0.7, HERO_H + r * 0.7]];
          let enter = 0, exit = 1;
          for (let axis = 0; axis < 2; axis++) {
            const delta = end[axis] - start[axis];
            const [low, high] = bounds[axis];
            if (Math.abs(delta) < 0.0001) {
              if (start[axis] < low || start[axis] > high) return false;
            } else {
              const a = (low - start[axis]) / delta, b = (high - start[axis]) / delta;
              enter = Math.max(enter, Math.min(a, b));
              exit = Math.min(exit, Math.max(a, b));
              if (enter > exit) return false;
            }
          }
          return true;
        }

        function updateBarrels(dt) {
          if (barrelWarning && simTime >= barrelWarning.dropAt) {
            const x = barrelWarning.x;
            const y = inverseSceneScreenY(-BARREL_RADIUS * 2 - 8);
            barrels.push({ id: ++barrelCount, x, y, previousX: x, previousY: y,
              vx: barrelWarning.direction * (100 + barrelRng() * 45), vy: -100,
              radius: BARREL_RADIUS, rotation: 0, bornAt: simTime, platformId: null });
            barrelWarning = null;
            nextBarrelAt = simTime + 4 + barrelRng() * 2.2;
          }
          if (!barrelWarning && simTime >= nextBarrelAt && barrels.length < BARREL_LIMIT) {
            const targets = [hero, ...buddies].filter(runner => !runner.dead && !runner.entryPending && marioIsOnStage(runner));
            if (targets.length) {
              const target = targets[Math.floor(barrelRng() * targets.length)];
              const x = clamp(target.x + (barrelRng() - 0.5) * worldWidth * 0.35, 36, worldWidth - 36);
              barrelWarning = { x, direction: x < worldWidth * 0.5 ? 1 : -1, dropAt: simTime + BARREL_WARNING_SECONDS };
            }
          }
          for (const barrel of barrels) {
            barrel.previousX = barrel.x;
            barrel.previousY = barrel.y;
            barrel.x += barrel.vx * dt;
            const footing = platformById(barrel.platformId);
            if (footing && platformHasFootingAt(footing, barrel.x)) {
              barrel.y = footing.y + barrel.radius;
              barrel.vy = 0;
              updatePlatformContact(footing, barrel.x);
            } else {
              barrel.platformId = null;
              barrel.vy = Math.max(-620, barrel.vy + GRAVITY * 0.58 * dt);
              barrel.y += barrel.vy * dt;
              const landed = platforms.filter(platform => platformIsSolid(platform) &&
                platformHasFootingAt(platform, barrel.x) &&
                barrel.previousY - barrel.radius >= platform.y && barrel.y - barrel.radius <= platform.y)
                .sort((a, b) => b.y - a.y)[0];
              if (landed) {
                barrel.y = landed.y + barrel.radius;
                barrel.vy = 0;
                barrel.platformId = landed.id;
                handlePlatformLanding(landed, barrel.x);
                pulseCloud(landed);
              }
            }
            barrel.rotation += barrel.vx / barrel.radius * dt * (prefersReducedMotion ? 0.35 : 1);
            for (const runner of [hero, ...buddies]) {
              if (barrelHitsMario(barrel, runner)) defeatMario(runner, barrel);
            }
          }
          barrels = barrels.filter(barrel => simTime - barrel.bornAt < 18 &&
            sceneScreenY(barrel.y) < height + 100 && sceneScreenX(barrel.x) > -100 && sceneScreenX(barrel.x) < width + 100);
        }

        function updateParticles(dt) {
          for (const particle of particles) {
            particle.age += dt;
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy += GRAVITY * 0.18 * dt;
            if (particle.rotation !== undefined) particle.rotation += (particle.spin || 0) * dt;
          }
          particles = particles.filter((particle) => particle.age < particle.life);
        }

        function seedMarioBuddies() {
          const ordered = [...platforms]
            .sort((a, b) => a.y - b.y);
          const openingPlatforms = ordered
            .filter((platform) => platform.y > height * 0.32 && platform.y < height * 0.82)
            .filter((platform) => platformIsSolid(platform));
          const picks = openingPlatforms.length ? openingPlatforms : ordered.slice(0, 4);
          for (let i = 0; i < 8; i += 1) {
            addMarioBuddy(picks[i % picks.length], i, true);
          }
        }

        /* Keep a crowd in the composition without popping anyone into being.
           Every entrant begins beyond a real viewport edge, then crosses that
           edge under the same gravity and landing rules as the other runners. */
        function maintainMarioPopulation() {
          if (simTime < nextBuddySpawnAt) return;

          const visibleCount = [hero, ...buddies]
            .filter((runner) => !runner.dead && !runner.entryPending && marioIsOnStage(runner))
            .length;
          const inbound = [hero, ...buddies].filter(buddy => !buddy.dead && (buddy.entryPending ||
            (buddy.entryFrom && !marioIsOnStage(buddy))));
          const inboundCount = inbound.length;
          const reusableArrival = inbound.find(buddy => buddy.entryPending &&
            simTime - buddy.entryStartedAt >= MARIO_ENTRY_TIMEOUT);
          if (!reusableArrival && (visibleCount + inboundCount >= MARIO_VISIBLE_TARGET || inboundCount >= 2)) {
            nextBuddySpawnAt = simTime + 0.38;
            return;
          }

          nextBuddySpawnAt = simTime + MARIO_RESEED_SECONDS *
            (0.78 + hash01((marioEntryCount + 1) * 1877) * 0.44);
          const entry = chooseMarioWalkIn();
          if (!entry) {
            nextBuddySpawnAt = simTime + 0.3;
            return;
          }

          let buddy = reusableArrival || (hero.dead && !marioIsOnStage(hero, 150) ? hero : null) || buddies
            .filter((candidate) => !marioIsOnStage(candidate, 150))
            .filter((candidate) => !candidate.entryFrom || simTime - candidate.entryStartedAt >= MARIO_ENTRY_TIMEOUT)
            .sort((a, b) => a.y - b.y)[0];

          if (!buddy && buddies.length < MARIO_POOL_LIMIT) {
            buddy = makeMarioBuddy(buddyCount);
            buddies.push(buddy);
          }
          if (!buddy) return;

          startMarioWalkIn(buddy, entry.platform, entry.dir);
          marioEntryCount += 1;
        }

        /* Which way a runner would have to walk to come in off this shelf, or
           0 if the shelf does not leave the frame. */
        function marioWalkInSide(platform) {
          const left = platformLeft(platform);
          const right = left + platform.w;
          let dir = 0;
          if (sceneScreenX(left) < -30) dir = 1;
          else if (sceneScreenX(right) > width + 30) dir = -1;
          if (!dir) return 0;
          /* A shelf that only clips the frame edge cannot hide an entrant:
             the clamp in marioWalkInStart would pull it into view. Ask that
             function directly rather than guessing at an overhang. */
          const sx = sceneScreenX(marioWalkInStart(platform, dir));
          return (dir > 0 ? sx <= -30 : sx >= width + 30) ? dir : 0;
        }

        /* Where a runner stands at the start of its walk-in. Shared, so the
           eligibility test and the placement can never disagree. */
        function marioWalkInStart(platform, dir) {
          const left = platformLeft(platform);
          const right = left + platform.w;
          const offscreen = offscreenWorldX(dir > 0 ? -1 : 1) - dir * 62;
          return clamp(offscreen, left + 12, right - 12);
        }

        /* Runners only ever arrive on foot, along a shelf that runs off the
           frame. Nobody is launched in through the air. */
        function chooseMarioWalkIn() {
          const ceiling = marioEntryCeiling();
          recentMarioEntries = recentMarioEntries.filter(entry => simTime - entry.at < MARIO_ENTRY_COOLDOWN);
          const lastEntry = recentMarioEntries[recentMarioEntries.length - 1];
          const occupancy = new Map();
          for (const buddy of buddies) {
            if (!buddy.grounded || !buddy.platformId) continue;
            occupancy.set(buddy.platformId, (occupancy.get(buddy.platformId) || 0) + 1);
          }
          if (hero.grounded && hero.groundId) {
            occupancy.set(hero.groundId, (occupancy.get(hero.groundId) || 0) + 1);
          }
          const options = [];
          for (const platform of platforms) {
            if (!platformIsSolid(platform) || platform.moving || platform.y >= ceiling) continue;
            const sy = sceneScreenY(platform.y);
            if (sy < height * 0.1 || sy > height * 0.97) continue;
            const dir = marioWalkInSide(platform);
            if (!dir) continue;
            // Rest an entire entrance area, including neighboring ledges on
            // the same edge, so a new platform ID cannot create another queue.
            if (recentMarioEntries.some(entry => entry.platformId === platform.id ||
                (entry.dir === dir && Math.abs(entry.y - platform.y) < MARIO_ENTRY_SEPARATION))) continue;
            if (buddies.some(buddy => buddy.entryFrom && buddy.platformId === platform.id)) continue;
            const load = occupancy.get(platform.id) || 0;
            const score = load * 2 + (lastEntry?.dir === dir ? 3 : 0) +
              Math.abs(sy / height - 0.56) + hash01(platform.id * 2371 + marioEntryCount * 41) * 0.2;
            options.push({ platform, dir, score });
          }
          if (!options.length) return null;
          options.sort((a, b) => a.score - b.score);
          return options[0];
        }

        function startMarioWalkIn(buddy, platform, dir) {
          recentMarioEntries.push({ platformId: platform.id, y: platform.y, dir, at: simTime });
          const left = platformLeft(platform);
          /* Start well clear of the frame so nobody pops into the visible
             scene -- they have to walk the last stretch in. */
          const x = marioWalkInStart(platform, dir);
          buddy.dead = false;
          buddy.deadAt = 0;
          buddy.platformId = platform.id;
          if (buddy.id === 0) {
            buddy.groundId = platform.id;
            buddy.autoTargetId = null;
            buddy.autoLandingX = null;
            buddy.lastGroundedAt = simTime;
            buddy.stumbleUntil = 0;
          }
          buddy.localX = x - left;
          buddy.x = x;
          buddy.y = platform.y;
          buddy.previousY = platform.y;
          buddy.vx = dir * BUDDY_RUN_SPEED;
          buddy.vy = 0;
          buddy.spin = 0;
          buddy.grounded = true;
          buddy.falling = false;
          buddy.targetId = null;
          buddy.groundRoute = null;
          buddy.landingX = null;
          buddy.noRouteSince = 0;
          buddy.facing = dir;
          buddy.walkInDir = dir;
          buddy.entryPending = true;
          buddy.entryFrom = dir > 0 ? 'left' : 'right';
          buddy.entryStartedAt = simTime;
          buddy.previousPlatformId = null;
          buddy.landedAt = simTime;
        }

        function addMarioBuddy(platform, variant = buddyCount, allowOccupied = false) {
          if (!platform || (!allowOccupied && buddies.some((buddy) => buddy.platformId === platform.id))) return;
          const edge = Math.min(28, platform.w * 0.24);
          const platformEdge = platformLeft(platform);
          const desiredX = platformEdge + edge + hash01(platform.id * 719 + variant * 31) * Math.max(1, platform.w - edge * 2);
          const x = safeLandingX(platform, desiredX);
          const localX = x - platformEdge;
          const buddy = makeMarioBuddy(variant);
          Object.assign(buddy, {
            platformId: platform.id,
            localX,
            x,
            y: platform.y,
            vx: 0,
            vy: 0,
            spin: 0,
            grounded: true,
            falling: false,
            targetId: null,
            noRouteSince: 0,
            previousY: platform.y,
            facing: hash01(platform.id * 991) < 0.5 ? -1 : 1,
            landedAt: simTime,
            phase: hash01(platform.id * 883 + variant * 67) * TAU,
            pose: variant % 3,
          });
          buddies.push(buddy);
        }

        function makeMarioBuddy(variant = buddyCount) {
          const id = ++buddyCount;
          return {
            id,
            platformId: null,
            localX: 0,
            x: 0,
            y: inverseSceneScreenY(height + 100),
            vx: 0,
            vy: 0,
            spin: 0,
            grounded: false,
            falling: false,
            targetId: null,
            noRouteSince: 0,
            previousY: inverseSceneScreenY(height + 100),
            facing: 1,
            landedAt: simTime,
            phase: hash01(id * 883 + variant * 67) * TAU,
            pose: variant % 3,
            entryFrom: null,
            entryStartedAt: 0,
            walkInDir: 0,
          };
        }

        function updateMarioBuddies(dt) {
          // Update established runners first: entrances must respect the
          // leader's current height, including a fall during this frame.
          const ordered = [...buddies.filter(buddy => !buddy.entryPending),
            ...buddies.filter(buddy => buddy.entryPending)];
          for (const buddy of ordered) {
            if (buddy.dead) { updateDefeatedMario(buddy, dt); continue; }
            if (buddy.entryPending && buddy.y >= marioEntryCeiling()) {
              buddy.vx = 0;
              continue;
            }
            buddy.previousY = buddy.y;
            if (buddy.grounded) {
              const platform = platformById(buddy.platformId);
              if (!platform || !platformIsSolid(platform)) {
                dropMarioBuddy(buddy);
              } else {
                buddy.x = platformLeft(platform) + buddy.localX;
                buddy.y = platform.y;
                updateGroundedMarioBuddy(buddy, platform, dt);
              }
            } else {
              buddy.vy += GRAVITY * dt;
              buddy.vy = Math.max(buddy.vy, -MAX_FALL_SPEED);
              buddy.x += buddy.vx * dt;
              buddy.y += buddy.vy * dt;
              steerMarioBuddy(buddy, dt);
              if (buddy.falling) buddy.spin += buddy.vx * dt * 0.003;
              if (!headBounce(buddy)) collideMarioBuddy(buddy);
            }
            if (buddy.entryPending && marioIsOnStage(buddy)) buddy.entryPending = false;
          }
        }

        /* Grounded runners are solid. Face-to-face contact cancels their
           inward momentum; coming up behind a runner transfers momentum and
           can carry the front runner beyond the platform's footing. */
        function resolveMarioShoves(dt) {
          const runners = [hero, ...buddies];
          for (let i = 0; i < runners.length; i += 1) {
            for (let j = i + 1; j < runners.length; j += 1) {
              const first = runners[i];
              const second = runners[j];
              if (first.entryPending || second.entryPending || !first.grounded || !second.grounded) continue;
              const platformId = marioGroundId(first);
              if (!platformId || marioGroundId(second) !== platformId) continue;
              if (Math.abs(first.y - second.y) > 5) continue;

              const left = first.x <= second.x ? first : second;
              const right = left === first ? second : first;
              const distance = right.x - left.x;
              if (distance >= MARIO_CONTACT_DISTANCE) continue;
              const penetration = MARIO_CONTACT_DISTANCE - Math.max(0, distance);

              if (left.facing > 0 && right.facing < 0) {
                if (left.vx > 0) left.vx = 0;
                if (right.vx < 0) right.vx = 0;
                separateGroundedMarios(left, right, penetration);
                continue;
              }

              let pusher = null;
              let pushed = null;
              let direction = 0;
              if (left.facing > 0 && right.facing > 0 && left.vx > 18) {
                pusher = left;
                pushed = right;
                direction = 1;
              } else if (left.facing < 0 && right.facing < 0 && right.vx < -18) {
                pusher = right;
                pushed = left;
                direction = -1;
              }

              if (!pusher) {
                separateGroundedMarios(left, right, penetration);
                continue;
              }

              const pushSpeed = Math.max(96, Math.abs(pusher.vx));
              moveGroundedMario(pushed, pushed.x + direction * (penetration + pushSpeed * dt * 0.34));
              pushed.vx = direction * Math.max(Math.abs(pushed.vx) * 0.45, pushSpeed * 0.72);
              moveGroundedMario(pusher, pushed.x - direction * MARIO_CONTACT_DISTANCE);
              pusher.vx *= 0.82;

              const platform = platformById(platformId);
              if (platform && !marioHasFooting(pushed, platform)) {
                knockMarioOffPlatform(pushed, direction, pushSpeed);
              }
            }
          }
        }

        function marioGroundId(runner) {
          return runner.id === 0 ? runner.groundId : runner.platformId;
        }

        function moveGroundedMario(runner, x) {
          runner.x = x;
          if (runner.id !== 0) {
            const platform = platformById(runner.platformId);
            if (platform) runner.localX = x - platformLeft(platform);
          }
        }

        function separateGroundedMarios(left, right, penetration) {
          if (penetration <= 0) return;
          const platform = platformById(marioGroundId(left));
          const midpoint = (left.x + right.x) * 0.5;
          const halfContact = MARIO_CONTACT_DISTANCE * 0.5;
          const safeMidpoint = platform
            ? clamp(
                midpoint,
                platformLeft(platform) + halfContact,
                platformLeft(platform) + platform.w - halfContact
              )
            : midpoint;
          moveGroundedMario(left, safeMidpoint - halfContact);
          moveGroundedMario(right, safeMidpoint + halfContact);
        }

        function knockMarioOffPlatform(runner, direction, speed) {
          if (runner.id === 0) {
            releaseHeroFromPlatform();
            hero.vx = direction * Math.max(112, speed * 0.78);
            hero.vy = Math.min(hero.vy, -24);
            hero.stumbleUntil = simTime + 0.48;
          } else {
            dropMarioBuddy(runner, direction, Math.max(112, speed * 0.78));
          }
        }

        /* 1 at the bottom of the frame, 0 at the top. Runners bringing up the
           rear throw themselves upward; the ones out front can afford to pick
           their moment. */
        function marioAggression(runner) {
          /* The camera pins the leader near 47% of the frame, so that is the
             calm end; anyone trailing toward the bottom edge is the hot end. */
          return clamp((sceneScreenY(runner.y) - height * 0.46) / (height * 0.4), 0, 1);
        }

        function updateGroundedMarioBuddy(buddy, platform, dt) {
          if (buddy.walkInDir) {
            advanceMarioWalkIn(buddy, platform, dt);
            return;
          }
          const route = committedMarioRoute(platform, buddy);
          const launchDx = route ? route.launchX - buddy.x : 0;
          const dodge = hazardPlan(platform, buddy.x);
          if (dodge && dodge.hop && simTime >= (buddy.hopCooldownUntil || 0)) {
            hopMarioBuddy(buddy, platform, dodge.away);
            return;
          }
          const desired = dodge ? dodge.away * BUDDY_RUN_SPEED
            : clamp(launchDx * 7, -BUDDY_RUN_SPEED, BUDDY_RUN_SPEED);
          buddy.vx += (desired - buddy.vx) * (1 - Math.exp(-14 * dt));
          if (Math.abs(launchDx) > 7) buddy.facing = Math.sign(launchDx);
          const readyAt = buddy.landedAt + marioLandingPause(buddy, platform);
          if (route && Math.abs(launchDx) < 7 && simTime >= readyAt &&
            !barrelBlocksLaunch(buddy, route.landingX)) {
            launchMarioBuddy(buddy, platform, route);
            return;
          }
          buddy.vx = clamp(buddy.vx, -BUDDY_RUN_SPEED, BUDDY_RUN_SPEED);
          buddy.localX += buddy.vx * dt;
          buddy.x = platformLeft(platform) + buddy.localX;
          /* Pull up at the lip rather than strolling off it. Falling should be
             a failed jump, not idle drift. */
          const brink = marioFootingLimits(platform);
          if (brink && buddy.x < brink.left) {
            buddy.x = brink.left;
            buddy.localX = buddy.x - platformLeft(platform);
            buddy.vx = Math.abs(buddy.vx) * 0.35;
            buddy.facing = 1;
          } else if (brink && buddy.x > brink.right) {
            buddy.x = brink.right;
            buddy.localX = buddy.x - platformLeft(platform);
            buddy.vx = -Math.abs(buddy.vx) * 0.35;
            buddy.facing = -1;
          }
          if (!marioHasFooting(buddy, platform)) dropMarioBuddy(buddy, Math.sign(buddy.vx), Math.abs(buddy.vx));
        }

        function marioFootingLimits(platform) {
          const left = platformLeft(platform);
          const right = left + platform.w;
          if (right - left < HERO_W) return null;
          return { left: left + HERO_W * 0.34, right: right - HERO_W * 0.34 };
        }

        /* Walks in along the offscreen tail of a shelf, then hands over to the
           ordinary climbing brain once it is properly in frame. */
        function advanceMarioWalkIn(buddy, platform, dt) {
          const dir = buddy.walkInDir;
          buddy.vx = dir * BUDDY_RUN_SPEED;
          buddy.localX += buddy.vx * dt;
          buddy.x = platformLeft(platform) + buddy.localX;
          buddy.facing = dir;
          const screenX = sceneScreenX(buddy.x);
          const brink = marioFootingLimits(platform);
          const ranOut = brink && (dir > 0 ? buddy.x >= brink.right : buddy.x <= brink.left);
          const arrived = screenX > width * 0.13 && screenX < width * 0.87;
          if (arrived || ranOut || simTime - buddy.entryStartedAt > MARIO_ENTRY_TIMEOUT) {
            if (brink) {
              buddy.x = clamp(buddy.x, brink.left, brink.right);
              buddy.localX = buddy.x - platformLeft(platform);
            }
            buddy.walkInDir = 0;
            buddy.entryFrom = null;
            buddy.vx *= 0.3;
          }
        }

        function marioLandingPause(runner, platform) {
          if (platform.type === 'crumble') return 0.12;
          if (platform.type === 'cloud' && platform.shrinkLevel >= 3) return 0.2;
          const leader = highestMario();
          if (!leader) return 0.3;
          const rhythm = hash01(runner.id * 1301 + platform.id * 97);
          if (leader.y - runner.y > 125) return 0.32 + rhythm * 0.22;
          // The front group waits according to the gap behind it. Reassess
          // each frame so runners accelerate as they fall behind.
          const pack = [hero, ...buddies].filter(other => other !== runner &&
            !other.dead && marioIsOnStage(other) && !other.walkInDir).sort((a, b) => b.y - a.y);
          const gap = pack.length ? runner.y - pack[Math.min(2, pack.length - 1)].y : height;
          return lerp(0.85, pack.length < 5 ? 2.8 : 1.8, clamp(gap / 260, 0, 1)) + rhythm * 0.18;
        }

        function committedMarioRoute(current, runner, jumpSpeed = BUDDY_JUMP_SPEED) {
          const plan = runner.groundRoute;
          if (plan && plan.fromId === current.id && platformIsSolid(plan.target)) {
            const bounds = landingBounds(plan.target);
            const footing = landingBounds(current);
            if (bounds && footing && plan.landingX >= bounds.left && plan.landingX <= bounds.right &&
                plan.launchX >= footing.left && plan.launchX <= footing.right) {
              // A neighbor may block the run-up. Take the same jump from here
              // when it is reachable instead of pushing forever toward a mark.
              if (simTime - plan.chosenAt > 0.55 &&
                  Math.abs(plan.landingX - runner.x) < LEADER_AIR_SPEED * plan.flightTime * 0.8 &&
                  !routeHitsEarlierPlatform(current, plan.target, runner.x, plan.landingX, plan.flightTime, jumpSpeed)) {
                plan.launchX = clamp(runner.x, footing.left, footing.right);
              }
              return plan;
            }
          }
          const route = chooseMarioBuddyTarget(current, runner, jumpSpeed);
          runner.groundRoute = route ? { ...route, fromId: current.id, chosenAt: simTime } : null;
          return runner.groundRoute;
        }

        function chooseMarioBuddyTarget(current, buddy, jumpSpeed = BUDDY_JUMP_SPEED) {
          const drive = marioAggression(buddy);
          let best = null;
          let fallback = null;
          for (const platform of platforms) {
            if (platform.id === current.id || !platformIsSolid(platform)) continue;
            const route = routeToPlatform(current, platform, jumpSpeed, buddy);
            if (!route) continue;
            const bounds = landingBounds(platform);
            const room = bounds.right - bounds.left;
            const crowd = [hero, ...buddies].filter(other => other !== buddy &&
              (marioGroundId(other) === platform.id || (other.grounded ? other.groundRoute?.target.id === platform.id :
                other.targetId === platform.id || other.autoTargetId === platform.id))).length;
            // A branch is worthwhile when it has a next step. Stable per-runner
            // preferences spread the pack without changing their minds each frame.
            const onward = platforms.some(next => next.id !== platform.id && next.y > platform.y + MIN_TARGET_GAP &&
              next.y <= platform.y + 134 && routeToPlatform(platform, next, jumpSpeed));
            route.score = Math.abs(route.launchX - buddy.x) * 0.5 + route.dx * 0.12 -
              route.gap * (0.4 + drive * 0.35) - Math.min(90, room) * 0.12 +
              crowd * 24 + (onward ? 0 : 100) + (platform.saw ? 22 : 0) +
              (hash01(buddy.id * 2017 + platform.id * 101) - 0.5) * 24;
            if (route.gap >= MIN_TARGET_GAP) {
              if (!best || route.score < best.score) best = route;
            } else if (platform.id !== buddy.previousPlatformId && onward) {
              route.score += Math.abs(route.gap) + 80;
              if (!fallback || route.score < fallback.score) fallback = route;
            }
          }
          return best || fallback;
        }

        function launchMarioBuddy(buddy, current, route = chooseMarioBuddyTarget(current, buddy)) {
          if (!route || Math.abs(route.launchX - buddy.x) >= 7) return;
          buddy.noRouteSince = 0;
          buddy.groundRoute = null;
          buddy.previousPlatformId = current.id;
          buddy.landingX = safeLandingX(route.target, route.landingX);
          buddy.platformId = null;
          buddy.targetId = route.target.id;
          buddy.grounded = false;
          buddy.falling = false;
          buddy.vy = BUDDY_JUMP_SPEED;
          buddy.vx = (buddy.landingX - buddy.x) / route.flightTime;
          if (Math.abs(buddy.vx) > 8) buddy.facing = Math.sign(buddy.vx);
          spawnDust(buddy.x, buddy.y, 6, C.lemon);
        }

        function steerMarioBuddy(buddy, dt) {
          if (buddy.entryFrom) return;
          let target = platformById(buddy.targetId);
          let plan = target && airLandingPlan(buddy, target);
          if (!plan) {
            buddy.landingX = null;
            target = chooseAirLandingTarget(buddy);
            buddy.targetId = target ? target.id : null;
            plan = target && airLandingPlan(buddy, target);
            if (plan) buddy.landingX = safeLandingX(target, plan.x);
          }
          buddy.falling = !plan;
          const desired = (plan ? landingVelocity(buddy, plan) : 0) + barrelSwerve(buddy);
          buddy.vx += (desired - buddy.vx) * (1 - Math.exp(-12 * dt));
          if (Math.abs(buddy.vx) > 8) buddy.facing = Math.sign(buddy.vx);
        }

        /* A runner coming down on another's head takes the step. Only a
           falling runner can take one, and only from above, so a crowd
           sharing a ledge never sets it off. The bounce clears the rider's
           route so it re-plans from its new height -- which is the whole
           point: heads are a way onto a ledge that was out of reach. */
        function headBounce(runner) {
          if (runner.dead || runner.entryPending || runner.grounded || runner.vy > 0) return false;
          for (const other of [hero, ...buddies]) {
            if (other === runner || other.dead || other.entryPending || other.walkInDir) continue;
            if (Math.abs(other.x - runner.x) > HERO_W * 0.6) continue;
            const head = other.y + HERO_H * 0.82;
            if (runner.previousY < head || runner.y > head + 2) continue;
            runner.y = head;
            runner.vy = HEAD_BOUNCE_SPEED;
            runner.falling = false;
            runner.targetId = null;
            runner.landingX = null;
            runner.autoTargetId = null;
            runner.autoLandingX = null;
            runner.groundRoute = null;
            other.pressedUntil = simTime + 0.22;
            spawnDust(runner.x, head, 6, C.mint);
            return true;
          }
          return false;
        }

        function collideMarioBuddy(buddy) {
          if (buddy.vy > 0) return;
          const candidates = platforms
            .filter((platform) => platformIsSolid(platform))
            .filter((platform) => platformHasFootingAt(platform, buddy.x, 6))
            .filter((platform) => buddy.previousY >= platform.y && buddy.y <= platform.y + 2)
            .sort((a, b) => b.y - a.y);
          const landed = candidates[0];
          if (!landed) return;
          buddy.platformId = landed.id;
          buddy.groundRoute = null;
          buddy.targetId = null;
          buddy.landingX = null;
          buddy.localX = buddy.x - platformLeft(landed);
          buddy.y = landed.y;
          buddy.vx = 0;
          buddy.vy = 0;
          buddy.spin = 0;
          buddy.grounded = true;
          buddy.falling = false;
          buddy.noRouteSince = 0;
          buddy.entryFrom = null;
          buddy.entryStartedAt = 0;
          buddy.landedAt = simTime;
          pulseCloud(landed);
          handlePlatformLanding(landed, buddy.x);
          spawnDust(buddy.x, buddy.y, 5, C.mint);
        }

        function dropMarioBuddy(buddy, direction = 0, speed = 0) {
          if (buddy.falling) return;
          buddy.platformId = null;
          buddy.groundRoute = null;
          buddy.targetId = null;
          buddy.landingX = null;
          buddy.noRouteSince = 0;
          buddy.walkInDir = 0;
          buddy.entryFrom = null;
          buddy.grounded = false;
          buddy.falling = true;
          buddy.vx = direction
            ? direction * Math.max(96, speed)
            : (hash01(buddy.id * 613) - 0.5) * 72;
          buddy.vy = -38 - hash01(buddy.id * 977) * 38;
          buddy.spin = 0;
        }

        function marioHasFooting(body, platform) {
          if (!platformIsSolid(platform)) return false;
