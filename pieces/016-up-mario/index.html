<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many Mario · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #a9e4ff;
        --ink: #49385f;
        --muted: #7d6a96;
        --hot: #f06f8f;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }

      body {
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", ui-rounded, system-ui, sans-serif;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--bg);
        cursor: pointer;
        image-rendering: auto;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid var(--hot);
        outline-offset: -9px;
      }

      .debug {
        position: fixed;
        left: 0.85rem;
        bottom: 0.75rem;
        margin: 0;
        padding: 5px 7px;
        color: #fff;
        background: #49385f;
        border-radius: 6px;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
        z-index: 3;
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="380ba6de-d087-4f44-a235-7dd4b9b174f9"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Many Mario: a family of tiny chibi Marios climbs through a pastel sky on smiling rosy-cheeked clouds. Every Mario jumps toward higher clouds, and anyone still riding a crumbling cloud falls with the fluff."
    ></canvas>
    <pre id="debug" class="debug" hidden></pre>

    <script>
      (() => {
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const debugEl = document.getElementById('debug');
        const params = new URLSearchParams(location.search);
        const reduceQuery =
          typeof matchMedia === 'function'
            ? matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        const DEBUG = params.has('debug');
        const TAU = Math.PI * 2;
        const GRAVITY = -1580;
        const RUN_SPEED = 286;
        const AIR_SPEED = 246;
        const JUMP_SPEED = 735;
        const SPRING_SPEED = 870;
        const HERO_W = 28;
        const HERO_H = 44;
        const LAUNCH_MARGIN = 20;
        const MIN_TARGET_GAP = 30;
        const MAX_TARGET_GAP = 156;
        const STALL_SECONDS = 2.35;
        const NO_ROUTE_SECONDS = 1.05;
        const BOX_ATTEMPT_SECONDS = 1.75;
        const BOX_SIZE = 26;
        const BOX_BOTTOM_OFFSET = 60;
        const LINK_REACH = 14;
        const LINK_SPEEDS = {
          ladder: 112,
          stairs: 148,
        };
        const CLOUD_VANISH_SECONDS = 0.64;
        const CLOUD_CLEANSE_SECONDS = 0.32;
        const RAIN_STEP_SECONDS = 0.055;
        const BUDDY_JUMP_SPEED = 690;
        const BUDDY_AIR_SPEED = 225;

        /* A candy-shop palette: blue-sky paper, strawberry pink, lemon,
           mint and a soft grape outline. The cloud characters stay mostly
           white so their tiny faces remain the star. */
        const C = {
          white: '#FFFDFC',
          sky: '#A9E4FF',
          haze: '#DDF6FF',
          skyDeep: '#7FD2F5',
          mist: '#E9DFFF',
          pale: '#CBB9F0',
          mid: '#F3A6C1',
          deep: '#EF6F8F',
          ink: '#66507D',
          night: '#49385F',
          blush: '#F7A8BF',
          lemon: '#FFD96A',
          mint: '#8EDCC9',
          peach: '#FFB886',
          red: '#ED6670',
          denim: '#6D9FD2',
          skin: '#FFD2AD',
          cocoa: '#7D4C45',
        };

        const SHADOW = 'rgba(73, 56, 95, 0.13)';
        const SHADOW_SOFT = 'rgba(73, 56, 95, 0.07)';

        /* Dust tints, kept as names so the simulation calls read clearly. */
        const COLORS = {
          ink: C.ink,
          coin: C.mid,
          smoke: C.pale,
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let worldWidth = 420;
        let worldLeft = 0;
        let cameraY = 0;
        let highestCameraY = 0;
        let highestPlatformY = 0;
        let lastPlatform = null;
        let raf = 0;
        let lastFrameAt = 0;
        let simTime = 0;
        let prefersReducedMotion = reduceQuery.matches;
        let seed = params.get('seed') || randomSeed();
        let rng = Math.random;
        let hero = null;
        let platforms = [];
        let barrels = [];
        let boxes = [];
        let links = [];
        let particles = [];
        let buddies = [];
        let buddyCount = 0;
        let keys = {
          left: false,
          right: false,
          jump: false,
        };
        let pointer = {
          active: false,
          x: 0,
          startX: 0,
          startY: 0,
          downAt: 0,
          moved: false,
        };
        let manualUntil = 0;
        let jumpBufferedUntil = 0;
        let bestHeight = 0;
        let boxesHit = 0;
        let platformCount = 0;
        let barrelCount = 0;
        let boxCount = 0;
        let linkCount = 0;
        let targetPlatformId = null;
        let targetBoxId = null;
        let targetLinkId = null;
        let rescueCount = 0;
        let downTrips = 0;
        let ladderTrips = 0;
        let stairTrips = 0;
        let lastProgressAt = 0;
        let lastProgressHeight = 0;
        let skippedBoxes = 0;
        let recoveryCount = 0;

        debugEl.hidden = !DEBUG;
        resize();
        reset(seed);
        addEventListener('resize', resize, { passive: true });
        addEventListener('keydown', onKeyDown);
        addEventListener('keyup', onKeyUp);
        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointercancel', onPointerUp);
        if (typeof reduceQuery.addEventListener === 'function') {
          reduceQuery.addEventListener('change', (event) => {
            prefersReducedMotion = event.matches;
          });
        } else if (typeof reduceQuery.addListener === 'function') {
          reduceQuery.addListener((event) => {
            prefersReducedMotion = event.matches;
          });
        }

        function randomSeed() {
          return Math.floor(Math.random() * 0xffffffff).toString(36);
        }

        function xmur3(str) {
          let h = 1779033703 ^ str.length;
          for (let i = 0; i < str.length; i += 1) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return function nextHash() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return function nextRandom() {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function reset(nextSeed = randomSeed()) {
          cancelAnimationFrame(raf);
          seed = String(nextSeed || randomSeed());
          rng = mulberry32(xmur3(seed)());
          simTime = 0;
          lastFrameAt = 0;
          cameraY = 0;
          highestCameraY = 0;
          bestHeight = 0;
          boxesHit = 0;
          platformCount = 0;
          barrelCount = 0;
          boxCount = 0;
          linkCount = 0;
          buddyCount = 0;
          rescueCount = 0;
          downTrips = 0;
          ladderTrips = 0;
          stairTrips = 0;
          skippedBoxes = 0;
          recoveryCount = 0;
          targetPlatformId = null;
          targetBoxId = null;
          targetLinkId = null;
          platforms = [];
          barrels = [];
          boxes = [];
          links = [];
          particles = [];
          buddies = [];
          lastPlatform = makePlatform(worldWidth * 0.5, 88, Math.min(230, worldWidth * 0.74), 'brick', false);
          platforms.push(lastPlatform);
          addQuestionBoxesForPlatform(lastPlatform);
          highestPlatformY = lastPlatform.y;
          while (highestPlatformY < height * 1.75) addPlatform();
          seedMarioBuddies();
          hero = {
            x: lastPlatform.x + lastPlatform.w * 0.5,
            y: lastPlatform.y,
            previousY: lastPlatform.y,
            vx: 0,
            vy: 0,
            facing: 1,
            grounded: true,
            groundId: lastPlatform.id,
            lastGroundedAt: 0,
            landedAt: 0,
            groundedSince: 0,
            jumpCooldownUntil: 0,
            stumbleUntil: 0,
            blinkUntil: 0,
            rescuedUntil: 0,
            autoTargetId: null,
            autoLaunchX: null,
            autoLandingX: null,
            routeAttemptTargetId: null,
            routeAttemptFromId: null,
            routeAttemptStartedAt: 0,
            onLink: null,
            boxTargetId: null,
            boxAttemptId: null,
            boxAttemptStartedAt: 0,
            boxAttemptJumps: 0,
            revisitPlatformId: null,
            revisitCooldownUntil: 0,
            noRouteSince: 0,
            stride: 0,
            climbT: 0,
            nextBlinkAt: 1.8,
            blinkEndsAt: 0,
            blinkCount: 0,
          };
          activateCloud(lastPlatform);
          lastProgressAt = 0;
          lastProgressHeight = 0;
          const warmSeconds = Math.max(0, Number(params.get('warm') || 0) || 0);
          if (warmSeconds > 0) {
            const steps = Math.min(2400, Math.floor(warmSeconds * 60));
            for (let i = 0; i < steps; i += 1) update(1 / 60);
          }
          raf = requestAnimationFrame(tick);
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          worldWidth = Math.round(clamp(width * (width < 560 ? 0.96 : 0.86), 300, 920));
          worldLeft = Math.round((width - worldWidth) / 2);
        }

        function tick(now) {
          if (!lastFrameAt) lastFrameAt = now;
          const rawDt = clamp((now - lastFrameAt) / 1000, 0.001, 0.045);
          lastFrameAt = now;
          const dt = rawDt * (prefersReducedMotion ? 0.45 : 1);
          update(dt);
          render();
          raf = requestAnimationFrame(tick);
        }

        function update(dt) {
          simTime += dt;
          extendWorld();
          updateControls(dt);
          updateHero(dt);
          updateCloudRain();
          updateVanishingClouds();
          updateBarrels(dt);
          updateQuestionBoxes();
          updateMarioBuddies(dt);
          updateParticles(dt);
          updateCamera(dt);
          rescueIfNeeded();
          recoverIfStalled();
          trimWorld();
          updateHud();
        }

        function updateControls(dt) {
          if (keys.jump && simTime > jumpBufferedUntil) jumpBufferedUntil = simTime + 0.12;
          if (manualActive()) {
            targetPlatformId = null;
            return;
          }
          planAutopilot(dt);
        }

        function updateHero(dt) {
          hero.previousY = hero.y;
          updateBlink();
          if (hero.onLink) {
            hero.climbT += dt;
            updateLinkTravel(dt);
            return;
          }

          let desiredVx = 0;
          const manual = manualActive();

          if (manual) {
            desiredVx = manualDesiredVx();
          } else {
            desiredVx = hero.autoVx || 0;
          }

          const maxSpeed = hero.grounded ? RUN_SPEED : AIR_SPEED;
          desiredVx = clamp(desiredVx, -maxSpeed, maxSpeed);
          const accel = hero.grounded ? 18 : 8;
          hero.vx += (desiredVx - hero.vx) * (1 - Math.exp(-accel * dt));
          hero.vx = clamp(hero.vx, -maxSpeed, maxSpeed);
          if (Math.abs(hero.vx) > 12) hero.facing = hero.vx > 0 ? 1 : -1;

          const canBufferedJump =
            jumpBufferedUntil > simTime &&
            simTime >= hero.jumpCooldownUntil &&
            (hero.grounded || simTime - hero.lastGroundedAt < 0.09);
          if (canBufferedJump) {
            jump(false);
            jumpBufferedUntil = 0;
          }

          hero.x += hero.vx * dt;
          hero.vy += GRAVITY * dt;
          hero.y += hero.vy * dt;
          if (hero.grounded) hero.stride += Math.abs(hero.vx) * dt;
          keepHeroInShaft();
          collidePlatforms();
        }

        /* Eye blinks run on their own little clock so the face never feels
           frozen while he is standing still. Timed off a hash rather than the
           world rng, so blinking cannot desync a seeded run. */
        function updateBlink() {
          if (simTime >= hero.nextBlinkAt) {
            hero.blinkCount = (hero.blinkCount || 0) + 1;
            hero.blinkEndsAt = simTime + 0.11;
            hero.nextBlinkAt = simTime + 1.5 + hash01(hero.blinkCount * 7919) * 3.6;
          }
        }

        function planAutopilot() {
          hero.autoVx = 0;
          targetBoxId = null;
          targetLinkId = null;

          if (!hero.grounded) {
            const target = activeAirTarget() || chooseAirLandingTarget();
            targetPlatformId = target ? target.id : null;
            if (!target) return;
            hero.noRouteSince = 0;
            const landingX = safeLandingX(target, hero.autoLandingX ?? platformCenter(target));
            hero.autoLandingX = landingX;
            hero.autoVx = clamp((landingX - hero.x) * 4.2, -AIR_SPEED, AIR_SPEED);
            return;
          }

          const current = platformById(hero.groundId);
          if (!current) {
            targetPlatformId = null;
            hero.autoVx = clamp((worldWidth * 0.5 - hero.x) * 2.8, -RUN_SPEED, RUN_SPEED);
            return;
          }

          const localBox = chooseLocalQuestionBox(current);
          if (localBox) {
            planQuestionBox(current, localBox);
            return;
          }
          clearBoxAttempt();

          const downLink = chooseDownRevisitLink(current);
          if (downLink) {
            hero.noRouteSince = 0;
            followLinkPlan(current, downLink, -1);
            return;
          }

          const upLink = chooseUpLink(current);
          if (upLink) {
            hero.noRouteSince = 0;
            followLinkPlan(current, upLink, 1);
            return;
          }

          const route = chooseTargetRoute(current);
          targetPlatformId = route ? route.target.id : null;
          if (!route) {
            if (!hero.noRouteSince) hero.noRouteSince = simTime;
            hero.autoVx = clamp((platformCenter(current) - hero.x) * 2.8, -RUN_SPEED, RUN_SPEED);
            if (simTime - hero.noRouteSince > NO_ROUTE_SECONDS && simTime > (current.recoveryCooldownUntil || 0)) {
              if (addRecoveryPlatform(current)) {
                current.recoveryCooldownUntil = simTime + 2.4;
                hero.noRouteSince = simTime;
                lastProgressAt = simTime;
              }
            }
            return;
          }
          hero.noRouteSince = 0;

          hero.autoTargetId = route.target.id;
          hero.autoLaunchX = route.launchX;
          hero.autoLandingX = route.landingX;

          const launchDx = route.launchX - hero.x;
          const landingDx = route.landingX - hero.x;
          const atLaunch = Math.abs(launchDx) < Math.max(10, current.w * 0.07);
          hero.autoVx = atLaunch
            ? clamp(landingDx * 3.6, -RUN_SPEED, RUN_SPEED)
            : clamp(launchDx * 4.8, -RUN_SPEED, RUN_SPEED);

          if (atLaunch && simTime >= hero.jumpCooldownUntil) {
            jump(false, route);
          }
        }

        function planQuestionBox(current, box) {
          targetBoxId = box.id;
          hero.boxTargetId = box.id;
          hero.noRouteSince = 0;

          if (hero.boxAttemptId !== box.id) {
            hero.boxAttemptId = box.id;
            hero.boxAttemptStartedAt = simTime;
            hero.boxAttemptJumps = 0;
          }

          const attemptAge = simTime - hero.boxAttemptStartedAt;
          if (attemptAge > BOX_ATTEMPT_SECONDS || hero.boxAttemptJumps >= 3) {
            skipQuestionBox(current, box);
            return;
          }

          const left = platformLeft(current) + HERO_W * 0.65 + 6;
          const right = platformLeft(current) + current.w - HERO_W * 0.65 - 6;
          const targetX = clamp(box.x, left, right);
          const dx = targetX - hero.x;
          hero.autoVx = clamp(dx * 4.8, -RUN_SPEED, RUN_SPEED);
          if (Math.abs(dx) < 11 && simTime >= hero.jumpCooldownUntil) {
            hero.boxAttemptJumps += 1;
            jump(false);
          }
        }

        function skipQuestionBox(current, box) {
          box.skipUntil = simTime + 8;
          box.failedAt = simTime;
          skippedBoxes += 1;
          clearBoxAttempt();
          targetBoxId = null;
          current.boxSkips = (current.boxSkips || 0) + 1;
          if ((current.boxHits || 0) + current.boxSkips >= current.boxQuota) {
            current.boxQuota = current.boxHits || 0;
          }
        }

        function clearBoxAttempt() {
          hero.boxTargetId = null;
          hero.boxAttemptId = null;
          hero.boxAttemptStartedAt = 0;
          hero.boxAttemptJumps = 0;
        }

        function activeAirTarget() {
          const target = platformById(hero.autoTargetId);
          if (!target) return null;
          const missedBy = target.y - hero.y;
          if (missedBy > MAX_TARGET_GAP || hero.y < target.y - 52) return null;
          return target;
        }

        function chooseAirLandingTarget() {
          let best = null;
          for (const platform of platforms) {
            if (platform.vanishStartedAt != null) continue;
            if (platform.y > hero.y + 34 || platform.y < hero.y - 210) continue;
            const left = platformLeft(platform) + landingMargin(platform);
            const right = platformLeft(platform) + platform.w - landingMargin(platform);
            const xGap = hero.x < left ? left - hero.x : hero.x > right ? hero.x - right : 0;
            const timeBias = hero.vy > 0 && platform.y < hero.y - 30 ? 70 : 0;
            if (xGap > AIR_SPEED * 1.05) continue;
            const score = xGap * 1.8 + Math.abs(hero.y - platform.y) * 0.22 + timeBias - platform.y * 0.02;
            if (!best || score < best.score) best = { ...platform, score };
          }
          return best;
        }

        function chooseLocalQuestionBox(current) {
          const available = boxes
            .filter((box) => !box.hit && box.platformId === current.id && (!box.skipUntil || box.skipUntil < simTime))
            .sort((a, b) => Math.abs(a.x - hero.x) - Math.abs(b.x - hero.x));
          if (!available.length) {
            if (hero.revisitPlatformId === current.id) {
              hero.revisitPlatformId = null;
              hero.revisitCooldownUntil = simTime + rand(8, 14);
            }
            return null;
          }

          if (current.boxQuota == null) {
            const quotaRoll = rng();
            current.boxQuota = quotaRoll < 0.18 ? 0 : quotaRoll < 0.78 ? 1 : Math.min(2, available.length);
            current.boxHits = current.boxHits || 0;
          }
          if (hero.revisitPlatformId === current.id) current.boxQuota = Math.max(current.boxQuota, current.boxHits + 1);
          if ((current.boxHits || 0) >= current.boxQuota) return null;
          return available[0];
        }

        function chooseDownRevisitLink(current) {
          if (simTime < hero.revisitCooldownUntil || hero.revisitPlatformId) return null;
          if (!current.revisitChecked) {
            current.revisitChecked = true;
            current.revisitIntent = rng() < 0.46;
          }
          if (!current.revisitIntent) return null;

          const candidates = links
            .filter((link) => link.upperId === current.id)
            .filter((link) => {
              const lower = platformById(link.lowerId);
              if (!lower || lower.y <= cameraY - 120) return false;
              return platformHasUnhitBoxes(link.lowerId);
            })
            .sort((a, b) => linkDownScore(a) - linkDownScore(b));
          if (!candidates.length) return null;
          current.revisitIntent = false;
          hero.revisitPlatformId = candidates[0].lowerId;
          return candidates[0];
        }

        function chooseUpLink(current) {
          const candidates = links
            .filter((link) => link.lowerId === current.id)
            .filter((link) => platformById(link.upperId))
            .sort((a, b) => platformById(a.upperId).y - platformById(b.upperId).y);
          if (!candidates.length) return null;
          return candidates[0];
        }

        function followLinkPlan(current, link, dir) {
          targetLinkId = link.id;
          targetPlatformId = dir > 0 ? link.upperId : link.lowerId;
          const entryX = dir > 0 ? link.x1 : link.x2;
          const dx = entryX - hero.x;
          hero.autoVx = clamp(dx * 4.4, -RUN_SPEED, RUN_SPEED);
          if (Math.abs(dx) < LINK_REACH && simTime >= hero.jumpCooldownUntil) startLink(link, dir);
        }

        function startLink(link, dir) {
          hero.onLink = { linkId: link.id, dir, t: dir > 0 ? 0 : 1 };
          clearRouteAttempt();
          hero.grounded = false;
          hero.groundId = null;
          hero.vx = 0;
          hero.vy = 0;
          hero.x = dir > 0 ? link.x1 : link.x2;
          hero.y = dir > 0 ? link.y1 : link.y2;
          targetLinkId = link.id;
          if (dir < 0) downTrips += 1;
          if (link.kind === 'ladder') ladderTrips += 1;
          else if (link.kind === 'stairs') stairTrips += 1;
          spawnDust(hero.x, hero.y, 8, COLORS.smoke);
        }

        function updateLinkTravel(dt) {
          const link = linkById(hero.onLink.linkId);
          if (!link) {
            hero.onLink = null;
            return;
          }
          const span = Math.max(1, link.y2 - link.y1);
          const dir = hero.onLink.dir;
          const baseSpeed = LINK_SPEEDS[link.kind];
          hero.onLink.t = clamp(hero.onLink.t + (dir * baseSpeed * dt) / span, 0, 1);
          hero.previousY = hero.y;
          hero.x = lerp(link.x1, link.x2, hero.onLink.t);
          hero.y = lerp(link.y1, link.y2, hero.onLink.t);
          hero.facing = link.x2 >= link.x1 ? 1 : -1;

          if ((dir > 0 && hero.onLink.t >= 1) || (dir < 0 && hero.onLink.t <= 0)) {
            finishLink(link, dir);
          }
        }

        function finishLink(link, dir) {
          const platform = platformById(dir > 0 ? link.upperId : link.lowerId);
          hero.onLink = null;
          if (!platform) return;
          hero.x = dir > 0 ? link.x2 : link.x1;
          hero.y = platform.y;
          hero.previousY = hero.y;
          hero.vx = 0;
          hero.vy = 0;
          hero.grounded = true;
          hero.groundId = platform.id;
          hero.lastGroundedAt = simTime;
          hero.landedAt = simTime;
          hero.groundedSince = simTime;
          hero.autoTargetId = null;
          hero.autoLaunchX = null;
          hero.autoLandingX = null;
          clearRouteAttempt();
          platform.visited = true;
          platform.pulseUntil = simTime + 0.18;
          activateCloud(platform);
          if (dir > 0 && hero.revisitPlatformId === platform.id) hero.revisitPlatformId = null;
          spawnDust(hero.x, hero.y, 8, COLORS.smoke);
        }

        function linkDownScore(link) {
          const lower = platformById(link.lowerId);
          if (!lower) return Infinity;
          return Math.abs(link.x2 - hero.x) + (hero.y - lower.y) * 0.15;
        }

        function platformHasUnhitBoxes(platformId) {
          return boxes.some((box) => box.platformId === platformId && !box.hit);
        }

        function chooseTargetRoute(current, jumpSpeed = JUMP_SPEED) {
          let best = null;
          for (const platform of platforms) {
            if (platform.id === current.id) continue;
            if (platform.vanishStartedAt != null) continue;
            if (platform.avoidUntil && platform.avoidUntil > simTime) continue;
            const route = routeToPlatform(current, platform, jumpSpeed);
            if (!route) continue;
            const widthBonus = Math.min(44, platform.w * 0.24);
            const motionCost = platform.moving ? 28 : 0;
            route.score = route.gap * 2.4 + route.dx * 0.9 + motionCost - widthBonus + platform.id * 0.0001;
            if (!best || route.score < best.score) best = route;
          }
          return best;
        }

        function routeToPlatform(current, target, jumpSpeed = JUMP_SPEED) {
          const gap = target.y - current.y;
          const maxGap = jumpSpeed > JUMP_SPEED ? MAX_TARGET_GAP + 74 : MAX_TARGET_GAP;
          if (gap < MIN_TARGET_GAP || gap > maxGap) return null;
          if (target.w < HERO_W + 54) return null;

          const flightTime = jumpFlightTime(gap, jumpSpeed);
          if (!flightTime) return null;

          const currentLeft = platformLeft(current);
          const currentRight = currentLeft + current.w;
          const targetLeft = platformLeft(target);
          const targetRight = targetLeft + target.w;
          const currentMargin = Math.min(LAUNCH_MARGIN, current.w * 0.28);
          const targetMargin = landingMargin(target);
          let landingX = platformCenter(target);

          if (targetLeft > currentRight) {
            landingX = targetLeft + targetMargin;
          } else if (targetRight < currentLeft) {
            landingX = targetRight - targetMargin;
          } else {
            landingX = clamp(platformCenter(current), targetLeft + targetMargin, targetRight - targetMargin);
          }

          let launchX = landingX;
          if (landingX > currentRight - currentMargin) {
            launchX = currentRight - currentMargin;
          } else if (landingX < currentLeft + currentMargin) {
            launchX = currentLeft + currentMargin;
          } else {
            launchX = clamp(landingX, currentLeft + currentMargin, currentRight - currentMargin);
          }

          const dx = Math.abs(landingX - launchX);
          const maxDx = AIR_SPEED * flightTime * 0.88;
          if (dx > maxDx) return null;

          return { target, launchX, landingX, gap, dx, flightTime, score: 0 };
        }

        function jumpFlightTime(gap, speed) {
          const gravity = -GRAVITY;
          const disc = speed * speed - 2 * gravity * gap;
          if (disc <= 0) return 0;
          return (speed + Math.sqrt(disc)) / gravity;
        }

        function landingMargin(platform) {
          return clamp(platform.w * (platform.moving ? 0.32 : 0.24), 20, 38);
        }

        function safeLandingX(platform, x) {
          const left = platformLeft(platform) + landingMargin(platform);
          const right = platformLeft(platform) + platform.w - landingMargin(platform);
          return clamp(x, left, right);
        }

        function platformCenter(platform) {
          return platformLeft(platform) + platform.w * 0.5;
        }

        function manualDesiredVx() {
          let desired = 0;
          if (keys.left) desired -= RUN_SPEED;
          if (keys.right) desired += RUN_SPEED;
          if (pointer.active) {
            const worldX = pointer.x - worldLeft;
            const dx = worldX - hero.x;
            if (Math.abs(dx) > 14) desired = clamp(dx * 3.8, -RUN_SPEED, RUN_SPEED);
          }
          return desired;
        }

        function manualActive() {
          return keys.left || keys.right || keys.jump || pointer.active || simTime < manualUntil;
        }

        function jump(superJump, route) {
          hero.vy = superJump ? SPRING_SPEED : JUMP_SPEED;
          const fromId = hero.groundId;
          const isTraversalJump = Boolean(route && route.target.id !== fromId);
          const isManualJump = manualActive();
          if (fromId && (isTraversalJump || isManualJump)) startCloudVanish(fromId, true);
          hero.grounded = false;
          hero.groundId = null;
          hero.autoTargetId = route ? route.target.id : null;
          hero.autoLaunchX = route ? route.launchX : null;
          hero.autoLandingX = route ? route.landingX : null;
          hero.routeAttemptTargetId = route ? route.target.id : null;
          hero.routeAttemptFromId = route ? fromId : null;
          hero.routeAttemptStartedAt = route ? simTime : 0;
          hero.jumpCooldownUntil = simTime + 0.11;
          spawnDust(hero.x, hero.y, superJump ? 18 : 11, COLORS.smoke);
        }

        function keepHeroInShaft() {
          const half = HERO_W * 0.5;
          if (hero.x < half + 4) {
            hero.x = half + 4;
            hero.vx = Math.max(0, hero.vx) * 0.24;
          } else if (hero.x > worldWidth - half - 4) {
            hero.x = worldWidth - half - 4;
            hero.vx = Math.min(0, hero.vx) * 0.24;
          }
        }

        function collidePlatforms() {
          const wasGrounded = hero.grounded;
          const previousGroundId = hero.groundId;
          hero.grounded = false;
          let landed = null;
          if (hero.vy <= 0) {
            const half = HERO_W * 0.42;
            for (const platform of platforms) {
              if (platform.vanishStartedAt != null) continue;
              const left = platformLeft(platform);
              const right = left + platform.w;
              if (hero.x + half < left || hero.x - half > right) continue;
              if (hero.previousY >= platform.y && hero.y <= platform.y + 2) {
                landed = platform;
                break;
              }
            }
          }

          if (!landed) return;
          const isNewLanding = !wasGrounded || previousGroundId !== landed.id;
          hero.y = landed.y;
          hero.vy = 0;
          hero.grounded = true;
          hero.groundId = landed.id;
          hero.lastGroundedAt = simTime;
          if (isNewLanding) {
            markRouteAttemptResult(landed);
            activateCloud(landed);
            hero.landedAt = simTime;
            hero.groundedSince = simTime;
            hero.autoTargetId = null;
            hero.autoLaunchX = null;
            hero.autoLandingX = null;
          }
          if (!landed.visited) {
            landed.visited = true;
            landed.pulseUntil = simTime + 0.24;
            spawnDust(hero.x, hero.y, 8, COLORS.coin);
          }
          if (landed.spring && Math.abs(hero.x - (platformLeft(landed) + landed.w * 0.5)) < landed.w * 0.35) {
            jump(true, chooseTargetRoute(landed, SPRING_SPEED));
          }
        }

        function markRouteAttemptResult(landed) {
          if (!hero.routeAttemptTargetId) return;
          if (landed.id !== hero.routeAttemptTargetId && simTime - hero.routeAttemptStartedAt > 0.22) {
            const missed = platformById(hero.routeAttemptTargetId);
            if (missed) {
              missed.missCount = (missed.missCount || 0) + 1;
              missed.avoidUntil = simTime + clamp(2.5 + missed.missCount * 1.6, 3, 8);
            }
          }
          clearRouteAttempt();
        }

        function clearRouteAttempt() {
          hero.routeAttemptTargetId = null;
          hero.routeAttemptFromId = null;
          hero.routeAttemptStartedAt = 0;
        }

        function updateCamera(dt) {
          const target = hero.y - height * 0.48;
          highestCameraY = Math.max(highestCameraY, target);
          cameraY += (highestCameraY - cameraY) * (1 - Math.exp(-2.7 * dt));
          bestHeight = Math.max(bestHeight, Math.max(0, hero.y - 88));
          if (bestHeight > lastProgressHeight + 38) {
            lastProgressHeight = bestHeight;
            lastProgressAt = simTime;
          }
        }

        function rescueIfNeeded() {
          if (hero.y > cameraY - 210) return;
          const platform = platforms
            .filter((p) => p.vanishStartedAt == null)
            .filter((p) => p.y > cameraY + height * 0.18 && p.y < cameraY + height * 0.78)
            .sort((a, b) => a.y - b.y)[0];
          const landing = platform || [...platforms].reverse().find((p) => p.vanishStartedAt == null);
          if (!landing) return;
          const left = platformLeft(landing);
          hero.x = left + landing.w * 0.5;
          hero.y = landing.y + 4;
          hero.previousY = hero.y;
          hero.vx = 0;
          hero.vy = JUMP_SPEED * 0.72;
          hero.grounded = false;
          hero.groundId = null;
          clearRouteAttempt();
          hero.rescuedUntil = simTime + 0.6;
          rescueCount += 1;
          lastProgressAt = simTime;
          spawnDust(hero.x, hero.y, 24, COLORS.ink);
        }

        function recoverIfStalled() {
          if (manualActive()) return;
          if (simTime - lastProgressAt < STALL_SECONDS) return;
          if (!hero.grounded) {
            if (hero.onLink) return;
            const landing = chooseAirLandingTarget() || nearestLowerPlatform();
            if (!landing) return;
            hero.x = safeLandingX(landing, hero.x);
            hero.y = landing.y;
            hero.previousY = hero.y;
            hero.vx = 0;
            hero.vy = 0;
            hero.grounded = true;
            hero.groundId = landing.id;
            hero.lastGroundedAt = simTime;
            hero.landedAt = simTime;
            hero.groundedSince = simTime;
            activateCloud(landing);
            hero.autoTargetId = null;
            hero.autoLaunchX = null;
            hero.autoLandingX = null;
            clearRouteAttempt();
            lastProgressAt = simTime;
            addRecoveryPlatform(landing);
            spawnDust(hero.x, hero.y, 16, COLORS.ink);
            return;
          }
          const current = platformById(hero.groundId);
          if (!current) return;
          if (addRecoveryPlatform(current)) {
            current.recoveryCooldownUntil = simTime + 2.4;
            lastProgressAt = simTime;
          }
        }

        function nearestLowerPlatform() {
          let best = null;
          for (const platform of platforms) {
            if (platform.vanishStartedAt != null) continue;
            if (platform.y > hero.y + 28 || platform.y < cameraY - 120) continue;
            const x = safeLandingX(platform, hero.x);
            const score = Math.abs(x - hero.x) * 1.4 + Math.abs(hero.y - platform.y) * 0.3 - platform.y * 0.015;
            if (!best || score < best.score) best = { ...platform, score };
          }
          return best;
        }

        function updateBarrels(dt) {
          for (const barrel of barrels) {
            const platform = platformById(barrel.platformId);
            if (!platform) {
              barrel.dead = true;
              continue;
            }
            barrel.offset += barrel.dir * barrel.speed * dt;
            const min = barrel.radius + 5;
            const max = platform.w - barrel.radius - 5;
            if (barrel.offset < min) {
              barrel.offset = min;
              barrel.dir = 1;
            } else if (barrel.offset > max) {
              barrel.offset = max;
              barrel.dir = -1;
            }
            barrel.roll += (barrel.dir * barrel.speed * dt) / barrel.radius;
            const bx = platformLeft(platform) + barrel.offset;
            const by = platform.y + barrel.radius;
            const dx = hero.x - bx;
            const dy = hero.y - by;
            if (Math.abs(dx) < HERO_W * 0.58 + barrel.radius && Math.abs(dy) < HERO_H * 0.45 && simTime > barrel.bumpCooldownUntil) {
              const push = dx >= 0 ? 1 : -1;
              hero.vx += push * 190;
              hero.vy = Math.max(hero.vy, 250);
              hero.stumbleUntil = simTime + 0.36;
              hero.blinkUntil = simTime + 0.14;
              barrel.bumpCooldownUntil = simTime + 0.9;
              spawnDust(hero.x, hero.y - HERO_H * 0.35, 16, COLORS.ink);
            }
          }
          barrels = barrels.filter((barrel) => !barrel.dead);
        }

        function updateQuestionBoxes() {
          const headY = hero.y + HERO_H + 12;
          const previousHeadY = hero.previousY + HERO_H + 12;
          for (const box of boxes) {
            if (box.hit) continue;
            const withinX = Math.abs(hero.x - box.x) < BOX_SIZE * 0.62;
            const hitFromBelow = hero.vy > 0 && previousHeadY <= box.y && headY >= box.y;
            if (withinX && hitFromBelow) {
              hitQuestionBox(box);
              break;
            }
          }
        }

        function hitQuestionBox(box) {
          box.hit = true;
          box.hitAt = simTime;
          boxesHit += 1;
          hero.vy = Math.min(hero.vy, 96);
          hero.blinkUntil = simTime + 0.12;
          clearBoxAttempt();
          targetBoxId = null;
          const platform = platformById(box.platformId);
          if (platform) platform.boxHits = (platform.boxHits || 0) + 1;
          if (hero.revisitPlatformId === box.platformId && !platformHasUnhitBoxes(box.platformId)) {
            hero.revisitPlatformId = null;
            hero.revisitCooldownUntil = simTime + rand(8, 15);
          }
          spawnDust(box.x, box.y + BOX_SIZE * 0.5, 18, COLORS.ink);
        }

        function updateParticles(dt) {
          for (const particle of particles) {
            particle.age += dt;
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy += GRAVITY * (particle.kind === 'rain' ? 0.34 : 0.18) * dt;
          }
          particles = particles.filter((particle) => particle.age < particle.life);
        }

        function seedMarioBuddies() {
          const ordered = [...platforms]
            .filter((platform) => platform.vanishStartedAt == null)
            .sort((a, b) => a.y - b.y);
          const picks = [ordered[0], ordered[2], ordered[4], ordered[6]].filter(Boolean);
          for (let i = 0; i < picks.length; i += 1) addMarioBuddy(picks[i], i);
        }

        function addMarioBuddy(platform, variant = buddyCount) {
          if (!platform || buddies.some((buddy) => buddy.platformId === platform.id)) return;
          const edge = Math.min(28, platform.w * 0.24);
          const localX = edge + hash01(platform.id * 719 + variant * 31) * Math.max(1, platform.w - edge * 2);
          buddies.push({
            id: ++buddyCount,
            platformId: platform.id,
            localX,
            x: platformLeft(platform) + localX,
            y: platform.y,
            vx: 0,
            vy: 0,
            spin: 0,
            grounded: true,
            falling: false,
            targetId: null,
            previousY: platform.y,
            jumpAt: simTime + 0.45 + hash01(platform.id * 911 + variant * 43) * 1.2,
            facing: hash01(platform.id * 991) < 0.5 ? -1 : 1,
            landedAt: simTime,
            phase: hash01(platform.id * 883 + variant * 67) * TAU,
            pose: variant % 3,
          });
        }

        function updateMarioBuddies(dt) {
          for (const buddy of buddies) {
            buddy.previousY = buddy.y;
            if (buddy.grounded) {
              const platform = platformById(buddy.platformId);
              if (!platform || platform.vanishStartedAt != null) {
                dropMarioBuddy(buddy);
              } else {
                buddy.x = platformLeft(platform) + clamp(buddy.localX, 18, platform.w - 18);
                buddy.y = platform.y;
                if (simTime >= buddy.jumpAt) launchMarioBuddy(buddy, platform);
              }
            } else {
              buddy.vy += GRAVITY * dt;
              buddy.x += buddy.vx * dt;
              buddy.y += buddy.vy * dt;
              if (buddy.falling) buddy.spin += buddy.vx * dt * 0.003;
              else steerMarioBuddy(buddy, dt);
              collideMarioBuddy(buddy);
              if (buddy.y < cameraY - 220) respawnMarioBuddy(buddy);
            }
          }
        }

        function chooseMarioBuddyTarget(current, buddy) {
          const candidates = [];
          for (const platform of platforms) {
            if (platform.id === current.id || platform.vanishStartedAt != null) continue;
            const route = routeToPlatform(current, platform, BUDDY_JUMP_SPEED);
            if (!route) continue;
            if (route.gap < 58 || route.gap > 148) continue;
            const sideways = Math.abs(platformCenter(platform) - platformCenter(current));
            const occupied = buddies.filter((other) => other !== buddy && other.platformId === platform.id).length;
            route.score = Math.abs(route.gap - 102) * 0.55 - Math.min(180, sideways) * 0.7 + occupied * 34;
            candidates.push(route);
          }
          candidates.sort((a, b) => a.score - b.score);
          return candidates[0] || null;
        }

        function launchMarioBuddy(buddy, current) {
          const route = chooseMarioBuddyTarget(current, buddy);
          if (!route) {
            buddy.jumpAt = simTime + 0.55;
            return;
          }
          const landingX = safeLandingX(route.target, route.landingX);
          buddy.platformId = null;
          buddy.targetId = route.target.id;
          buddy.grounded = false;
          buddy.falling = false;
          buddy.vy = BUDDY_JUMP_SPEED;
          buddy.vx = clamp((landingX - buddy.x) / Math.max(0.4, route.flightTime), -BUDDY_AIR_SPEED, BUDDY_AIR_SPEED);
          buddy.facing = buddy.vx < 0 ? -1 : 1;
          spawnDust(buddy.x, buddy.y, 6, C.lemon);
        }

        function steerMarioBuddy(buddy, dt) {
          const target = platformById(buddy.targetId);
          if (!target || target.vanishStartedAt != null) {
            buddy.targetId = null;
            buddy.falling = true;
            return;
          }
          const landingX = safeLandingX(target, platformCenter(target));
          const desired = clamp((landingX - buddy.x) * 3.4, -BUDDY_AIR_SPEED, BUDDY_AIR_SPEED);
          buddy.vx += (desired - buddy.vx) * (1 - Math.exp(-4.2 * dt));
          if (Math.abs(buddy.vx) > 8) buddy.facing = buddy.vx < 0 ? -1 : 1;
        }

        function collideMarioBuddy(buddy) {
          if (buddy.falling || buddy.vy > 0) return;
          const candidates = platforms
            .filter((platform) => platform.vanishStartedAt == null)
            .filter((platform) => buddy.x > platformLeft(platform) + 10 && buddy.x < platformLeft(platform) + platform.w - 10)
            .filter((platform) => buddy.previousY >= platform.y && buddy.y <= platform.y + 2)
            .sort((a, b) => b.y - a.y);
          const landed = candidates[0];
          if (!landed) return;
          buddy.platformId = landed.id;
          buddy.targetId = null;
          buddy.localX = buddy.x - platformLeft(landed);
          buddy.y = landed.y;
          buddy.vx = 0;
          buddy.vy = 0;
          buddy.spin = 0;
          buddy.grounded = true;
          buddy.falling = false;
          buddy.landedAt = simTime;
          buddy.jumpAt = simTime + 0.35 + hash01(buddy.id * 1301 + landed.id * 17) * 0.7;
          activateCloud(landed);
          spawnDust(buddy.x, buddy.y, 5, C.mint);
        }

        function dropMarioBuddy(buddy) {
          if (buddy.falling) return;
          buddy.platformId = null;
          buddy.targetId = null;
          buddy.grounded = false;
          buddy.falling = true;
          buddy.vx = (hash01(buddy.id * 613) - 0.5) * 72;
          buddy.vy = -55 - hash01(buddy.id * 977) * 55;
          buddy.spin = 0;
        }

        function respawnMarioBuddy(buddy) {
          const candidates = platforms
            .filter((platform) => platform.vanishStartedAt == null)
            .filter((platform) => platform.y > cameraY + height * 0.35 && platform.y < cameraY + height * 0.9)
            .filter((platform) => !buddies.some((other) => other !== buddy && other.platformId === platform.id));
          const platform = candidates[Math.floor(hash01(buddy.id * 1597 + Math.floor(simTime)) * candidates.length)];
          if (!platform) return;
          buddy.platformId = platform.id;
          buddy.localX = clamp(platform.w * (0.28 + hash01(buddy.id * 2081) * 0.44), 20, platform.w - 20);
          buddy.x = platformLeft(platform) + buddy.localX;
          buddy.y = platform.y + 64;
          buddy.vx = 0;
          buddy.vy = 0;
          buddy.spin = 0;
          buddy.grounded = true;
          buddy.falling = false;
          buddy.targetId = null;
          buddy.landedAt = simTime;
          buddy.jumpAt = simTime + 0.45;
          spawnDust(buddy.x, buddy.y, 10, C.lemon);
        }

        function updateCloudRain() {
          if (!hero.grounded) return;
          const platform = platformById(hero.groundId);
          if (!platform || platform.cleansedAt == null || platform.vanishStartedAt != null) return;
          if (
            platform.nextRainAt == null ||
            simTime - platform.nextRainAt > RAIN_STEP_SECONDS * 3
          ) {
            platform.nextRainAt = simTime;
          }
          while (platform.nextRainAt <= simTime) {
            spawnCloudRain(platform);
            platform.nextRainAt += prefersReducedMotion ? RAIN_STEP_SECONDS * 2 : RAIN_STEP_SECONDS;
          }
        }

        function activateCloud(platform) {
          if (!platform || platform.cleansedAt != null) return;
          platform.cleansedAt = simTime;
          platform.pulseUntil = simTime + CLOUD_CLEANSE_SECONDS;
          platform.nextRainAt = simTime;
          platform.crumbleAt = simTime + 2.6 + hash01(platform.id * 1237) * 1.2;
          const burstCount = prefersReducedMotion ? 2 : 5;
          for (let i = 0; i < burstCount; i += 1) spawnCloudRain(platform);
        }

        function spawnCloudRain(platform) {
          const count = prefersReducedMotion ? 1 : 2;
          const left = platformLeft(platform);
          platform.rainCount = (platform.rainCount || 0) + 1;
          for (let i = 0; i < count; i += 1) {
            const n = platform.id * 1009 + platform.rainCount * 37 + i * 131;
            const edge = Math.min(18, platform.w * 0.18);
            particles.push({
              kind: 'rain',
              x: left + edge + hash01(n) * Math.max(1, platform.w - edge * 2),
              y: platform.y - 25 - hash01(n + 17) * 8,
              vx: (hash01(n + 29) - 0.5) * 18,
              vy: -180 - hash01(n + 43) * 105,
              r: 1.25 + hash01(n + 59) * 0.75,
              age: 0,
              life: 0.42 + hash01(n + 71) * 0.22,
              color: C.mid,
            });
          }
        }

        function startCloudVanish(platformId, leadMarioHasLaunched = false) {
          const platform = platformById(platformId);
          if (!platform || platform.vanishStartedAt != null) return;
          platform.vanishStartedAt = simTime;
          for (const buddy of buddies) {
            if (buddy.platformId === platformId) dropMarioBuddy(buddy);
          }
          if (!leadMarioHasLaunched && hero.grounded && hero.groundId === platformId) {
            hero.grounded = false;
            hero.groundId = null;
            hero.vy = -85;
            hero.stumbleUntil = simTime + 0.5;
            clearRouteAttempt();
          }
          spawnCloudExplosion(platform);
          boxes = boxes.filter((box) => box.platformId !== platformId);
          barrels = barrels.filter((barrel) => barrel.platformId !== platformId);
          links = links.filter((link) => link.lowerId !== platformId && link.upperId !== platformId);
        }

        function spawnCloudExplosion(platform) {
          const left = platformLeft(platform);
          const count = prefersReducedMotion ? 7 : clamp(Math.round(platform.w / 9), 12, 24);
          for (let i = 0; i < count; i += 1) {
            const n = platform.id * 1877 + i * 277;
            const speed = 38 + hash01(n + 23) * 82;
            particles.push({
              kind: 'cloudBurst',
              x: left + platform.w * (0.08 + hash01(n + 37) * 0.84),
              y: platform.y - 8 + (hash01(n + 41) - 0.5) * 30,
              vx: (hash01(n + 11) - 0.5) * speed,
              vy: -35 - hash01(n + 23) * 115,
              r: 5 + hash01(n + 53) * 9,
              age: 0,
              life: 0.42 + hash01(n + 67) * 0.34,
              color: i % 4 === 0 ? C.mist : C.white,
            });
          }
        }

        function updateVanishingClouds() {
          for (const platform of platforms) {
            if (platform.vanishStartedAt == null && platform.crumbleAt != null && simTime >= platform.crumbleAt) {
              startCloudVanish(platform.id, false);
            }
          }
          const expiredIds = new Set(
            platforms
              .filter(
                (platform) =>
                  platform.vanishStartedAt != null &&
                  simTime - platform.vanishStartedAt >= (prefersReducedMotion ? 0.01 : CLOUD_VANISH_SECONDS),
              )
              .map((platform) => platform.id),
          );
          if (!expiredIds.size) return;
          platforms = platforms.filter((platform) => !expiredIds.has(platform.id));
          links = links.filter((link) => !expiredIds.has(link.lowerId) && !expiredIds.has(link.upperId));
        }

        function extendWorld() {
          while (highestPlatformY < cameraY + height * 1.75) addPlatform();
        }

        function trimWorld() {
          const cutoff = cameraY - 240;
          platforms = platforms.filter((platform) => platform.y > cutoff || platform.id === hero.groundId);
          barrels = barrels.filter((barrel) => {
            const platform = platformById(barrel.platformId);
            return platform && platform.y > cutoff;
          });
          boxes = boxes.filter((box) => box.y > cutoff);
          links = links.filter((link) => link.y2 > cutoff && platformById(link.lowerId) && platformById(link.upperId));
          buddies = buddies.filter((buddy) => buddy.falling || buddy.y > cutoff - 220);
        }

        function addPlatform() {
          const previous = lastPlatform;
          const gap = rand(height < 620 ? 86 : 92, height < 620 ? 116 : 126);
          const y = previous.y + gap;
          const minW = clamp(worldWidth * 0.2, 82, 118);
          const maxW = clamp(worldWidth * 0.34, 132, 196);
          const w = rand(minW, maxW) * (rng() < 0.12 ? 1.14 : 1);
          const maxShift = clamp(gap * 0.9 + (previous.w + w) * 0.22, 128, Math.min(220, worldWidth * 0.46));
          const previousCenter = platformLeft(previous) + previous.w * 0.5;
          let center = previousCenter;
          let foundReachable = false;
          const preferredSide = platformCount % 2 === 0 ? 1 : -1;
          for (let attempt = 0; attempt < 28; attempt += 1) {
            const side = attempt < 18 ? preferredSide : rng() < 0.5 ? -1 : 1;
            const candidateCenter = clamp(previousCenter + side * rand(maxShift * 0.44, maxShift), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
            const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
            center = candidateCenter;
            if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
              foundReachable = true;
              break;
            }
          }
          if (!foundReachable) {
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const candidateCenter = clamp(previousCenter + rand(-72, 72), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
              if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
                center = candidateCenter;
                foundReachable = true;
                break;
              }
            }
            if (!foundReachable) center = clamp(previousCenter, w * 0.5 + 12, worldWidth - w * 0.5 - 12);
          }
          const type = rng() < 0.18 ? 'girder' : 'brick';
          const moving = y > 800 && w > 136 && rng() < 0.06;
          const platform = makePlatform(center, y, w, type, moving);
          platform.spring = false;
          platforms.push(platform);
          maybeAddLink(previous, platform);
          lastPlatform = platform;
          highestPlatformY = y;

          addQuestionBoxesForPlatform(platform);
          addBranchPlatforms(previous, platform);
          if (y > 520 && !platform.moving && rng() < 0.08) addBarrel(platform);
        }

        function addRecoveryPlatform(current) {
          const w = clamp(worldWidth * 0.34, 118, 184);
          let platform = null;
          for (const relaxed of [false, true]) {
            for (let attempt = 0; attempt < 28; attempt += 1) {
              const y = current.y + rand(98, 150);
              const center = clamp(platformCenter(current) + rand(-82, 82), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: center - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
              if (routeToPlatform(current, candidate) && canPlacePlatform(candidate, relaxed ? 'relaxed' : 'strict')) {
                platform = makePlatform(center, y, w, 'brick', false);
                break;
              }
            }
            if (platform) break;
          }
          if (!platform) {
            const y = current.y + 150;
            const center = clamp(platformCenter(current), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
            const candidate = { x: center - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
            if (routeToPlatform(current, candidate) && canPlacePlatform(candidate, 'relaxed')) {
              platform = makePlatform(center, y, w, 'brick', false);
            }
          }
          if (!platform) return false;
          platform.pulseUntil = simTime + 0.55;
          platforms.push(platform);
          platforms.sort((a, b) => a.y - b.y);
          recoveryCount += 1;
          if (platform.y > highestPlatformY) {
            lastPlatform = platform;
            highestPlatformY = platform.y;
          }
          maybeAddLink(current, platform, 'ladder');
          addQuestionBoxesForPlatform(platform, true);
          spawnDust(platformCenter(platform), platform.y, 18, COLORS.coin);
          return true;
        }

        function addBranchPlatforms(previous, trunk) {
          const roll = rng();
          const branchCount = roll < 0.54 ? 1 : 0;
          for (let i = 0; i < branchCount; i += 1) {
            const base = trunk;
            const baseCenter = platformCenter(base);
            const side = baseCenter < worldWidth * 0.5 ? 1 : -1;
            let chosen = null;
            for (let attempt = 0; attempt < 14; attempt += 1) {
              const gap = rand(78, 124);
              const y = base.y + gap;
              const w = rand(clamp(worldWidth * 0.18, 78, 112), clamp(worldWidth * 0.29, 118, 166));
              const center = clamp(baseCenter + side * rand(96, Math.min(198, worldWidth * 0.34)), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: center - w * 0.5, y, w, h: 16, moving: false, travel: 0 };
              if (routeToPlatform(base, candidate) && canPlacePlatform(candidate)) {
                chosen = { center, y, w };
                break;
              }
            }
            if (!chosen) continue;
            const platform = makePlatform(chosen.center, chosen.y, chosen.w, rng() < 0.5 ? 'brick' : 'girder', false);
            platform.branch = true;
            platforms.push(platform);
            maybeAddLink(base, platform);
            addQuestionBoxesForPlatform(platform);
            if (rng() < 0.07) addBarrel(platform);
          }
        }

        function maybeAddLink(lower, upper, forcedKind) {
          if (!lower || !upper || lower.moving || upper.moving) return;
          const gap = upper.y - lower.y;
          if (gap < 46 || gap > 236) return;
          const roll = rng();
          if (!forcedKind && roll > 0.2) return;
          const kind = forcedKind || (roll < 0.1 ? 'stairs' : 'ladder');
          const lowerLeft = platformLeft(lower);
          const lowerRight = lowerLeft + lower.w;
          const upperLeft = platformLeft(upper);
          const upperRight = upperLeft + upper.w;
          let x1 = clamp(platformCenter(upper), lowerLeft + 22, lowerRight - 22);
          let x2 = clamp(x1, upperLeft + 22, upperRight - 22);
          if (kind === 'stairs') {
            x1 = clamp(platformCenter(lower) + (platformCenter(upper) > platformCenter(lower) ? 30 : -30), lowerLeft + 24, lowerRight - 24);
            x2 = clamp(platformCenter(upper) + (x1 < platformCenter(upper) ? -30 : 30), upperLeft + 24, upperRight - 24);
          } else {
            const sharedLeft = Math.max(lowerLeft + 22, upperLeft + 22);
            const sharedRight = Math.min(lowerRight - 22, upperRight - 22);
            if (sharedLeft > sharedRight) return;
            const verticalX = clamp((platformCenter(lower) + platformCenter(upper)) * 0.5, sharedLeft, sharedRight);
            x1 = verticalX;
            x2 = verticalX;
          }
          const link = {
            id: ++linkCount,
            kind,
            lowerId: lower.id,
            upperId: upper.id,
            x1,
            x2,
            y1: lower.y,
            y2: upper.y,
          };
          if (!canPlaceLink(link)) {
            linkCount -= 1;
            return;
          }
          links.push(link);
        }

        function makePlatform(center, y, w, type, moving) {
          const travel = moving ? rand(18, Math.min(42, worldWidth * 0.08)) : 0;
          return {
            id: ++platformCount,
            x: center - w * 0.5,
            y,
            w,
            h: 38,
            type,
            moving,
            travel,
            phase: rand(0, TAU),
            speed: rand(0.55, 0.92),
            visited: false,
            pulseUntil: 0,
            spring: false,
            cleansedAt: null,
            vanishStartedAt: null,
            nextRainAt: null,
            rainCount: 0,
            crumbleAt: null,
          };
        }

        function addQuestionBoxesForPlatform(platform, force = false) {
          if (platform.moving && !force) return;
          if (!force && rng() > 0.62) return;
          const count = !force && platform.w > 142 && rng() < 0.16 ? 2 : 1;
          const left = platformLeft(platform) + platform.w * 0.3;
          const right = platformLeft(platform) + platform.w * 0.7;
          const slots = count === 1 ? [0.5] : [0.26, 0.74];
          for (let i = 0; i < count; i += 1) {
            const t = slots[i];
            const candidate = {
              id: ++boxCount,
              platformId: platform.id,
              x: lerp(left, right, t) + rand(-8, 8),
              y: platform.y + BOX_BOTTOM_OFFSET,
              size: BOX_SIZE,
              hit: false,
              hitAt: 0,
              phase: rand(0, TAU),
            };
            if (canPlaceQuestionBox(candidate, platform)) {
              boxes.push(candidate);
            } else {
              boxCount -= 1;
            }
          }
        }

        function addBarrel(platform) {
          barrels.push({
            id: ++barrelCount,
            platformId: platform.id,
            offset: rand(platform.w * 0.22, platform.w * 0.78),
            dir: rng() < 0.5 ? -1 : 1,
            speed: rand(42, 74),
            radius: rand(9, 12),
            roll: rand(0, TAU),
            bumpCooldownUntil: 0,
          });
        }

        function canPlacePlatform(candidate, mode = 'strict') {
          const rect = platformVisualRect(candidate, 8);
          const relaxed = mode === 'relaxed';
          if (rect.left < 8 || rect.right > worldWidth - 8) return false;
          for (const platform of platforms) {
            const other = platformVisualRect(platform, 0);
            const horizontalGap = Math.max(other.left - rect.right, rect.left - other.right, 0);
            const verticalGap = Math.abs(candidate.y - platform.y);
            if (verticalGap < (relaxed ? 42 : 74) && horizontalGap < (relaxed ? 18 : 30)) return false;
            if (rectsOverlap(rect, platformVisualRect(platform, 10))) return false;
          }
          for (const box of boxes) {
            if (box.hit && simTime - box.hitAt > 0.45) continue;
            if (rectsOverlap(rect, boxVisualRect(box, 7))) return false;
          }
          if (!relaxed) {
            for (const link of links) {
              if (rectsOverlap(rect, linkVisualRect(link, 4))) return false;
            }
          }
          return true;
        }

        function canPlaceQuestionBox(box, platform) {
          const left = platformLeft(platform) + 18;
          const right = platformLeft(platform) + platform.w - 18;
          if (box.x - box.size * 0.5 < left || box.x + box.size * 0.5 > right) return false;
          const rect = boxVisualRect(box, 5);
          if (rect.left < 10 || rect.right > worldWidth - 10) return false;
          for (const other of platforms) {
            if (other.id !== platform.id && rectsOverlap(rect, platformVisualRect(other, 7))) return false;
          }
          for (const other of boxes) {
            if (rectsOverlap(rect, boxVisualRect(other, 9))) return false;
          }
          for (const link of links) {
            if (rectsOverlap(rect, linkVisualRect(link, 5))) return false;
          }
          return true;
        }

        function canPlaceLink(link) {
          const rect = linkVisualRect(link, 3);
          for (const platform of platforms) {
            if (platform.id === link.lowerId || platform.id === link.upperId) continue;
            if (rectsOverlap(rect, platformVisualRect(platform, 4))) return false;
          }
          for (const box of boxes) {
            if (rectsOverlap(rect, boxVisualRect(box, 7))) return false;
          }
          return true;
        }

        function platformVisualRect(platform, pad = 0) {
          const travel = platform.travel || 0;
          const h = platform.h || 18;
          return {
            left: platform.x - travel - pad,
            right: platform.x + platform.w + travel + pad,
            bottom: platform.y - h - pad,
            top: platform.y + pad,
          };
        }

        function boxVisualRect(box, pad = 0) {
          const half = box.size * 0.5;
          return {
            left: box.x - half - pad,
            right: box.x + half + pad,
            bottom: box.y - pad,
            top: box.y + box.size + pad,
          };
        }

        function linkVisualRect(link, pad = 0) {
          const reach = (link.kind === 'stairs' ? 15 : 11) + pad;
          return {
            left: Math.min(link.x1, link.x2) - reach,
            right: Math.max(link.x1, link.x2) + reach,
            bottom: Math.min(link.y1, link.y2) - 6 - pad,
            top: Math.max(link.y1, link.y2) + 6 + pad,
          };
        }

        function rectsOverlap(a, b) {
          return a.left < b.right && a.right > b.left && a.bottom < b.top && a.top > b.bottom;
        }

        function platformById(id) {
          if (!id) return null;
          for (const platform of platforms) {
            if (platform.id === id) return platform;
          }
          return null;
        }

        function linkById(id) {
          if (!id) return null;
          for (const link of links) {
            if (link.id === id) return link;
          }
          return null;
        }

        function platformLeft(platform) {
          if (!platform.moving) return platform.x;
          const drift = Math.sin(simTime * platform.speed + platform.phase) * platform.travel;
          return clamp(platform.x + drift, 8, worldWidth - platform.w - 8);
        }

        function spawnDust(x, y, count, color) {
          if (prefersReducedMotion) return;
          for (let i = 0; i < count; i += 1) {
            particles.push({
              x: x + rand(-12, 12),
              y: y + rand(-6, 4),
              vx: rand(-72, 72),
              vy: rand(40, 150),
              r: rand(1.6, 4.8),
              age: 0,
              life: rand(0.28, 0.62),
              color,
            });
          }
        }

        function updateHud() {
          if (DEBUG) {
            debugEl.textContent = [
              `seed ${seed}`,
              `height ${Math.floor(bestHeight)}`,
              `platforms ${platforms.length}`,
              `links ${links.length}`,
              `barrels ${barrels.length}`,
              `marios ${buddies.length + 1}`,
              `falling ${buddies.filter((buddy) => buddy.falling).length + (!hero.grounded && hero.vy < 0 ? 1 : 0)}`,
              `boxes ${boxes.length}`,
              `hit ${boxesHit}`,
              `target ${targetPlatformId || '-'}`,
              `box ${targetBoxId || '-'}`,
              `link ${targetLinkId || '-'}`,
              `ground ${hero.grounded ? hero.groundId || '-' : '-'}`,
              `y ${Math.round(hero.y)}`,
              `vy ${Math.round(hero.vy)}`,
              `noRoute ${hero.noRouteSince ? (simTime - hero.noRouteSince).toFixed(1) : '-'}`,
              `down ${downTrips}`,
              `ladders ${ladderTrips}`,
              `stairs ${stairTrips}`,
              `rescues ${rescueCount}`,
              `recoveries ${recoveryCount}`,
              `skips ${skippedBoxes}`,
              `manual ${manualActive() ? 'yes' : 'no'}`,
            ].join('\n');
          }
        }

        /* ====================================================
           RENDER -- pastel kawaii sticker world
           White cloud characters and tiny red-capped figures stay readable
           against a saturated blue sky; grape outlines bind the candy
           palette together.
           ==================================================== */

        function render() {
          drawBackground();
          drawLinks();
          drawPlatforms();
          drawQuestionBoxes();
          drawBarrels();
          drawParticles();
          drawMarioBuddies();
          drawHero();
        }

        /* -- SHAPE HELPERS -- */

        /* Hand-rolled so the piece does not depend on ctx.roundRect. */
        function roundRectPath(x, y, w, h, r) {
          const rr = Math.max(0, Math.min(r, Math.min(w, h) * 0.5));
          ctx.moveTo(x + rr, y);
          ctx.lineTo(x + w - rr, y);
          ctx.arcTo(x + w, y, x + w, y + rr, rr);
          ctx.lineTo(x + w, y + h - rr);
          ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
          ctx.lineTo(x + rr, y + h);
          ctx.arcTo(x, y + h, x, y + h - rr, rr);
          ctx.lineTo(x, y + rr);
          ctx.arcTo(x, y, x + rr, y, rr);
          ctx.closePath();
        }

        function fillRound(x, y, w, h, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          roundRectPath(x, y, w, h, r);
          ctx.fill();
        }

        function fillCircle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }

        function fillOval(x, y, rx, ry, color) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(1, ry / rx);
          fillCircle(0, 0, rx, color);
          ctx.restore();
        }

        /* A limb: two rounded segments through a soft joint. */
        function limb(ax, ay, bx, by, bend, thickness, color) {
          const mx = (ax + bx) * 0.5;
          const my = (ay + by) * 0.5;
          const dx = bx - ax;
          const dy = by - ay;
          const len = Math.hypot(dx, dy) || 1;
          const jx = mx + (-dy / len) * bend;
          const jy = my + (dx / len) * bend;
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(jx, jy);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function capsule(ax, ay, bx, by, thickness, color) {
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function sparkle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.quadraticCurveTo(x + r * 0.18, y - r * 0.18, x + r, y);
          ctx.quadraticCurveTo(x + r * 0.18, y + r * 0.18, x, y + r);
          ctx.quadraticCurveTo(x - r * 0.18, y + r * 0.18, x - r, y);
          ctx.quadraticCurveTo(x - r * 0.18, y - r * 0.18, x, y - r);
          ctx.fill();
        }

        /* Stable per-index noise for scenery that must not consume the
           world rng (that stream belongs to the seeded level). */
        function hash01(n) {
          let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
          x ^= x >>> 13;
          x = Math.imul(x, 0xc2b2ae35);
          x ^= x >>> 16;
          return (x >>> 0) / 4294967296;
        }

        /* -- BACKGROUND -- */

        function drawBackground() {
          const playHeight = height - hudHeight();
          const sky = ctx.createLinearGradient(0, 0, 0, playHeight);
          sky.addColorStop(0, '#8EDBFA');
          sky.addColorStop(0.56, C.sky);
          sky.addColorStop(1, '#C9F0FF');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);

          /* A cropped candy rainbow is the visual anchor. It is deliberately
             oversized, like a sticker peeking in from the page edge. */
          ctx.save();
          ctx.globalAlpha = 0.48;
          ctx.lineCap = 'round';
          const rainbowX = width < 560 ? width + 62 : width + 80;
          const rainbowY = 116;
          const rainbowR = Math.min(210, width * 0.24 + 80);
          const rainbow = [C.deep, C.lemon, C.mint, C.pale];
          for (let i = 0; i < rainbow.length; i += 1) {
            ctx.strokeStyle = rainbow[i];
            ctx.lineWidth = 18;
            ctx.beginPath();
            ctx.arc(rainbowX, rainbowY, rainbowR - i * 21, Math.PI * 0.72, Math.PI * 1.36);
            ctx.stroke();
          }
          ctx.restore();

          const drift = cameraY * 0.28;
          const band = 118;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const n = i + 900;
            const x = width * (0.04 + hash01(n * 17) * 0.92);
            const y = playHeight - (i * band + hash01(n * 29) * band - drift);
            if (y < -30 || y > playHeight + 30) continue;
            const size = 2.5 + hash01(n * 43) * 4.5;
            const color = [C.white, C.lemon, C.mint, C.mid][Math.floor(hash01(n * 61) * 4)];
            ctx.save();
            ctx.globalAlpha = 0.56;
            if (i % 3 === 0) {
              fillCircle(x - size * 0.55, y, size * 0.72, color);
              fillCircle(x + size * 0.55, y, size * 0.72, color);
              fillCircle(x, y + size * 0.58, size * 0.72, color);
            } else {
              sparkle(x, y, size, color);
            }
            ctx.restore();
          }

          /* Distant milk-white cloudlets soften the empty parts of the sky
             without creating the old tunnel walls. */
          ctx.save();
          ctx.globalAlpha = 0.28;
          const cloudDrift = cameraY * 0.16;
          for (let i = -2; i < 7; i += 1) {
            const n = i + Math.floor(cloudDrift / 310) * 7;
            const x = hash01(n * 83 + 9) * width;
            const y = mod(i * 190 + hash01(n * 107) * 90 + cloudDrift, playHeight + 220) - 110;
            const w = 90 + hash01(n * 131) * 100;
            cloudPath(x, y, w, 0.72);
            ctx.fillStyle = C.white;
            ctx.fill();
          }
          ctx.restore();
        }

        /* Two parallax layers of soft shapes so the shaft has air in it. */
        function drawFarScenery(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(left, 0, right - left, playHeight);
          ctx.clip();

          const inner = right - left;

          /* Far clouds, slowest layer. */
          const drift = cameraY * 0.22;
          const band = 300;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const rx = hash01(i * 3 + 11);
            const ry = hash01(i * 5 + 29);
            const rs = hash01(i * 7 + 53);
            const cx = left + inner * (0.12 + rx * 0.76);
            const cy = height - hudHeight() - (i * band + ry * band - drift);
            if (cy < -140 || cy > playHeight + 140) continue;
            const w = inner * (0.3 + rs * 0.32);
            cloudPath(cx, cy, w, 0.8);
            ctx.fillStyle = C.haze;
            ctx.fill();
          }

          /* Sparkles, mid layer. */
          const drift2 = cameraY * 0.44;
          const sBand = 128;
          const sFirst = Math.floor((drift2 - height) / sBand);
          const sLast = Math.ceil((drift2 + height) / sBand);
          for (let i = sFirst; i <= sLast; i += 1) {
            const rx = hash01(i * 13 + 101);
            const ry = hash01(i * 17 + 211);
            const rr = hash01(i * 19 + 307);
            if (rr < 0.34) continue;
            const cx = left + inner * (0.06 + rx * 0.88);
            const cy = height - hudHeight() - (i * sBand + ry * sBand - drift2);
            if (cy < -20 || cy > playHeight + 20) continue;
            sparkle(cx, cy, 3 + rr * 3.5, C.mist);
          }

          ctx.restore();
        }

        /* Side walls read as a soft cloud bank rather than a printed margin. */
        function drawGutters(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, Math.max(0, left), playHeight);
          ctx.rect(right, 0, Math.max(0, width - right), playHeight);
          ctx.clip();

          const band = 64;
          const drift = cameraY * 0.6;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const y = height - hudHeight() - (i * band - drift);
            if (y < -100 || y > playHeight + 100) continue;
            const r = 30 + hash01(i * 23 + 5) * 22;
            /* Two tones, heavily overlapped, so it reads as a bank of cloud
               rather than a column of dots. */
            ctx.fillStyle = hash01(i * 41 + 17) > 0.5 ? C.skyDeep : C.pale;
            ctx.beginPath();
            ctx.arc(left - 24 - hash01(i * 29 + 3) * 30, y, r, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right + 24 + hash01(i * 37 + 13) * 30, y + band * 0.5, r, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        /* Bites of sky taken out of the gutter, so the shaft edge is soft. */
        function drawScallops(left, right, playHeight) {
          const scallop = 46;
          const offset = mod(cameraY * 0.5, scallop);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, width, playHeight);
          ctx.clip();
          ctx.fillStyle = C.sky;
          for (let y = -scallop + offset; y < playHeight + scallop; y += scallop) {
            ctx.beginPath();
            ctx.arc(left, y, scallop * 0.42, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right, y + scallop * 0.5, scallop * 0.42, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function hudHeight() {
          return 0;
        }

        /* -- CLOUD PLATFORMS -- */

        function drawPlatforms() {
          for (const platform of platforms) {
            const sy = screenY(platform.y);
            if (sy < -90 || sy > height + 90) continue;
            const sx = worldLeft + platformLeft(platform);
            const pulse = clamp(1 - (simTime - platform.pulseUntil + 0.24) / 0.24, 0, 1);
            drawCloudPlatform(platform, sx, sy, pulse);
            if (platform.spring) drawSpring(sx + platform.w * 0.5, sy - 2);
            if (platform.id === targetPlatformId && !manualActive()) drawTargetTick(sx + platform.w * 0.5, sy - 34);
          }
        }

        function drawCloudPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          const seed = platform.id | 0;
          const cleanse =
            platform.cleansedAt == null
              ? 0
              : clamp((simTime - platform.cleansedAt) / CLOUD_CLEANSE_SECONDS, 0, 1);
          const body = mixColor('#F6F0FF', C.white, cleanse);
          const underside = mixColor('#DACBF3', '#EEDFFF', cleanse);
          const vanish =
            platform.vanishStartedAt == null
              ? 0
              : clamp(
                  (simTime - platform.vanishStartedAt) /
                    (prefersReducedMotion ? 0.01 : CLOUD_VANISH_SECONDS),
                  0,
                  1,
                );

          ctx.save();
          if (pulse > 0 && vanish === 0) {
            ctx.translate(cx, sy + 8);
            ctx.scale(1 + pulse * 0.035, 1 - pulse * 0.055);
            ctx.translate(-cx, -(sy + 8));
          }
          if (vanish > 0) {
            const blast = Math.sin(vanish * Math.PI);
            ctx.globalAlpha = 1 - Math.pow(vanish, 0.62);
            ctx.translate(cx, sy + 10);
            ctx.rotate((hash01(seed * 97) - 0.5) * vanish * 0.16);
            ctx.scale(1 + blast * 0.24, 1 + blast * 0.15);
            ctx.translate(-cx, -(sy + 10));
          }

          cloudPath(cx + 4, sy + 9, w * 0.97, 0.94);
          ctx.fillStyle = 'rgba(92, 66, 124, 0.15)';
          ctx.fill();

          cloudPath(cx, sy, w, 1);
          ctx.save();
          ctx.clip();
          ctx.fillStyle = body;
          ctx.fillRect(cx - w, sy - 60, w * 3, 200);
          ctx.fillStyle = underside;
          ctx.fillRect(cx - w, sy + 17, w * 3, 120);
          ctx.globalAlpha = 0.5;
          fillOval(cx - w * 0.18, sy - 8, w * 0.23, 7, C.white);
          ctx.restore();

          cloudPath(cx, sy, w, 1);
          ctx.strokeStyle = C.ink;
          ctx.lineWidth = Math.max(2.4, Math.min(4, w / 45));
          ctx.lineJoin = 'round';
          ctx.stroke();

          drawKawaiiCloudFace(cx, sy + 3, seed, cleanse, vanish);
          ctx.restore();
        }

        /* One plump storybook silhouette: a big center dome, two shoulders,
