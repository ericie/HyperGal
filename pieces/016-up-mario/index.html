          if (platform.type === 'crumble') return platformHasFootingAt(platform, body.x, RUNNER_EDGE_GRACE * 0.45);
          const left = platformLeft(platform) - RUNNER_EDGE_GRACE;
          const right = platformLeft(platform) + platform.w + RUNNER_EDGE_GRACE;
          return body.x >= left && body.x <= right;
        }

        function pulseCloud(platform) {
          if (!platform) return;
          platform.pulseUntil = Math.max(platform.pulseUntil || 0, simTime + CLOUD_PULSE_SECONDS);
        }

        function extendWorld() {
          while (highestPlatformY < cameraY + height * 1.75) {
            if (!addPlatform()) break;
          }
        }

        function trimWorld() {
          const cutoff = cameraY - height * 3;
          const occupied = new Set([
            hero.groundId,
            ...buddies.filter((buddy) => buddy.grounded).map((buddy) => buddy.platformId),
          ]);
          platforms = platforms.filter(
            (platform) => platform.y > cutoff || occupied.has(platform.id)
          );
        }

        function addPlatform() {
          const previous = lastPlatform;
          const gap = rand(height < 620 ? 72 : 76, height < 620 ? 100 : 108);
          const y = previous.y + gap;
          const minW = clamp(worldWidth * 0.2, 82, 118);
          const maxW = clamp(worldWidth * 0.34, 144, 248);
          const w = rand(minW, maxW) * (rng() < 0.12 ? 1.14 : 1);
          const maxShift = clamp(gap * 1.12 + (previous.w + w) * 0.28, 156, Math.min(294, worldWidth * 0.62));
          const previousCenter = platformLeft(previous) + previous.w * 0.5;
          let center = previousCenter;
          let foundReachable = false;
          const preferredSide = Math.floor(trunkCount / 3) % 2 === 0 ? 1 : -1;
          const centerBounds = platformCenterBounds(w);
          for (let attempt = 0; attempt < 28; attempt += 1) {
            const side = attempt < 18 ? preferredSide : rng() < 0.5 ? -1 : 1;
            const candidateCenter = clamp(previousCenter + side * rand(maxShift * 0.7, maxShift), centerBounds.min, centerBounds.max);
            const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
            center = candidateCenter;
            if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
              foundReachable = true;
              break;
            }
          }
          if (!foundReachable) {
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const candidateCenter = clamp(previousCenter + rand(-118, 118), centerBounds.min, centerBounds.max);
              const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
              if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
                center = candidateCenter;
                foundReachable = true;
                break;
              }
            }
            if (!foundReachable) center = clamp(platformCenter(previous), centerBounds.min, centerBounds.max);
          }
          const type = nextPlatformType();
          const moving = type === 'ink' && y > 420 && w > 120 && rng() < 0.26;
          const platform = makePlatform(center, y, w, type, moving);
          if (type === 'ink' && !moving && y > 620 && w > 170 && rng() < sawChance) attachSaw(platform, rng);
          // Validate the final geometry, including motion added after planning.
          if (!canPlacePlatform(platform) && platform.moving) {
            platform.moving = false;
            platform.travel = 0;
          }
          if (!canPlacePlatform(platform)) {
            // Optional branches are generated ahead of the next main step.
            // Withdraw only unseen, unused branches that block that step.
            const occupied = new Set(simTime > 0 ? [hero?.groundId,
              ...buddies.map(buddy => buddy.platformId), hero?.autoTargetId,
              ...buddies.map(buddy => buddy.targetId)] : []);
            platforms = platforms.filter(other => !(other.branch && other.y > previous.y &&
              (simTime === 0 || sceneScreenY(other.y) < -90) && !occupied.has(other.id) &&
              platformsTooClose(platform, other)));
          }
          if (!canPlacePlatform(platform) || !routeToPlatform(previous, platform)) return false;
          if (rng() < EDGE_SHELF_CHANCE) extendPlatformOffscreen(platform);
          if (platform.type === 'crumble') ensureCrumbleBricks(platform);
          platforms.push(platform);
          lastPlatform = platform;
          highestPlatformY = y;
          trunkCount += 1;

          addBranchPlatforms(previous, platform);
          return true;
        }

        /* World x of a screen edge. Shelves are extended past this so they
           genuinely leave the frame rather than stopping at the column edge. */
        function offscreenWorldX(side) {
          const edge = side < 0 ? 0 : width;
          return (edge - width * 0.5) / SCENE_SCALE + width * 0.5 - worldLeft;
        }

        /* Runs a platform off the nearer side of the frame. Only ever grows it
           outward, so a route that already reached it still does. */
        function extendPlatformOffscreen(platform) {
          if (platform.moving) return false;
          const left = platformLeft(platform);
          const right = left + platform.w;
          const middle = (left + right) * 0.5;
          if (middle > worldWidth * 0.32 && middle < worldWidth * 0.68) return false;
          const side = middle < worldWidth * 0.5 ? -1 : 1;
          const target = offscreenWorldX(side) + side * EDGE_SHELF_OVERHANG;
          let x = platform.x;
          let w = platform.w;
          if (side < 0) {
            if (target >= left) return false;
            w += left - target;
            x = target;
          } else {
            if (target <= right) return false;
            w += target - right;
          }
          if (w > worldWidth * 1.15) return false;
          if (!canPlacePlatform({ ...platform, x, w }, 'relaxed')) return false;
          platform.x = x;
          platform.baseX = x;
          platform.w = w;
          platform.baseW = w;
          platform.crumbleBricks = null;
          platform.cloudChunks = null;
          platform.edgeShelf = side < 0 ? 'left' : 'right';
          return true;
        }

        function addBranchPlatforms(previous, trunk) {
          const roll = rng();
          const branchCount = roll < 0.32 ? 2 : roll < 0.86 ? 1 : 0;
          for (let i = 0; i < branchCount; i += 1) {
            const base = trunk;
            const baseCenter = platformCenter(base);
            // A second branch takes the opposite side, so a pair opens two
            // routes off one step instead of crowding the same flank.
            const side = (baseCenter < worldWidth * 0.5 ? -1 : 1) * (i === 0 ? 1 : -1);
            let chosen = null;
            for (let attempt = 0; attempt < 14; attempt += 1) {
              const gap = rand(78, 124);
              const y = base.y + gap;
              const w = rand(clamp(worldWidth * 0.18, 82, 126), clamp(worldWidth * 0.29, 132, 194));
              const bounds = platformCenterBounds(w);
              const center = clamp(baseCenter + side * rand(180, Math.min(380, worldWidth * 0.56)), bounds.min, bounds.max);
              const candidate = { x: center - w * 0.5, y, w, h: 16, moving: false, travel: 0 };
              if (routeToPlatform(base, candidate) && canPlacePlatform(candidate)) {
                chosen = { center, y, w };
                break;
              }
            }
            if (!chosen) continue;
            const platform = makePlatform(chosen.center, chosen.y, chosen.w, nextPlatformType(), false);
            if (!canPlacePlatform(platform)) continue;
            if (rng() < EDGE_SHELF_CHANCE) extendPlatformOffscreen(platform);
            if (platform.type === 'crumble') ensureCrumbleBricks(platform);
            platform.branch = true;
            platforms.push(platform);
          }
        }

        function makePlatform(center, y, w, type, moving) {
          const travel = moving ? rand(52, Math.min(124, worldWidth * 0.17)) : 0;
          return {
            id: ++platformCount,
            x: center - w * 0.5,
            y,
            w,
            baseX: center - w * 0.5,
            baseW: w,
            h: 38,
            type,
            saw: null,
            crumbleBricks: null,
            cloudChunks: null,
            shrinkLevel: 0,
            collapseAt: 0,
            restoreAt: 0,
            collapsed: false,
            moving,
            travel,
            phase: rand(0, TAU),
            speed: rand(0.34, 0.58),
            visited: false,
            pulseUntil: 0,
          };
        }

        /* A blade bolted to a ledge, sliding along a fixed span. Its
           position is a pure function of simTime, like the drifting
           platforms, so a seed always replays the same near miss. */
        function attachSaw(platform, rng) {
          // The blade crosses most of the ledge, so it sits in the path a
          // runner actually walks rather than guarding a corner nobody uses.
          const span = Math.min(platform.w - SAW_INSET * 2 - HERO_W, rand(76, 150));
          if (span < 60) return;
          platform.saw = {
            span,
            radius: SAW_RADIUS,
            phase: rand(0, TAU),
            speed: rand(0.5, 0.85),
            dir: rng() < 0.5 ? -1 : 1,
          };
        }

        /* The nearest thing bearing down on a runner standing here: the
           ledge's own blade, a barrel rolling along it, a barrel still falling
           toward it, or the warning marker for one about to drop. Anything
           moving away is ignored, which is what lets a runner fall in behind a
           hazard instead of fleeing something already past. */
        function nearestHazard(platform, runnerX) {
          if (!platform) return null;
          let nearest = null;
          const consider = (x, ahead, reach, canHop) => {
            const gap = runnerX - x;
            const side = Math.sign(gap) || 1;
            const distance = Math.abs(gap) - reach;
            if (distance > HAZARD_NOTICE) return;
            // Skip only what is genuinely moving away. Something sitting
            // still -- a stalled barrel, a blade at its turnaround, one
            // dropping straight down -- is still very much a problem.
            if ((ahead - x) * side < 0 && distance > 4) return;
            if (!nearest || distance < nearest.distance) nearest = { distance, away: side, canHop };
          };

          if (platform.saw) {
            const [cx] = sawCenter(platform);
            const [ahead] = sawCenter(platform, simTime + 0.3);
            consider(cx, ahead, platform.saw.radius + HERO_W * 0.3, true);
          }
          for (const barrel of barrels) {
            if (barrel.platformId === platform.id) {
              consider(barrel.x, barrel.x + barrel.vx * 0.3, barrel.radius + HERO_W * 0.3, true);
            } else if (!barrel.platformId && barrel.y > platform.y &&
              barrel.y - platform.y < 230 && Math.abs(barrel.x - runnerX) < 66) {
              // Still in the air: step out from under it rather than hop.
              consider(barrel.x, barrel.x + barrel.vx * 0.3, HERO_W * 0.3, false);
            }
          }
          // The amber arrow is a free half second of warning. Use it.
          if (barrelWarning && Math.abs(barrelWarning.x - runnerX) < 38) {
            consider(barrelWarning.x, barrelWarning.x, HERO_W * 0.3, false);
          }
          return nearest;
        }

        /* Back away while there is ledge to back onto; go over the top once
           there is not, or once the thing is too close to outrun. Reading it
           that finely is also what leaves room to read it wrong. */
        function hazardPlan(platform, runnerX) {
          const threat = nearestHazard(platform, runnerX);
          if (!threat) return null;
          const limits = marioFootingLimits(platform);
          if (!limits) return null;
          const room = threat.away > 0 ? limits.right - runnerX : runnerX - limits.left;
          const cornered = room < 30;
          if (threat.canHop && (threat.distance <= HAZARD_HOP_GAP || cornered)) {
            return { hop: true, away: threat.away };
          }
          // Nothing to hop and nowhere to back to: cut past it and hope.
          return { hop: false, away: cornered ? -threat.away : threat.away };
        }

        function sawFleeDirection(platform, runnerX) {
          if (!platform || !platform.saw) return 0;
          const plan = hazardPlan(platform, runnerX);
          return plan && !plan.hop ? plan.away : 0;
        }

        /* A hop in place. The runner keeps this platform as its target, so the
           ordinary air steering brings it back down where it took off from,
           and the hazard passes underneath. */
        function hopMarioBuddy(buddy, platform, away) {
          buddy.previousPlatformId = null;
          buddy.groundRoute = null;
          buddy.platformId = null;
          buddy.targetId = platform.id;
          buddy.grounded = false;
          buddy.falling = false;
          buddy.vy = HAZARD_HOP_SPEED;
          buddy.landingX = safeLandingX(platform, buddy.x + away * 14);
          buddy.vx = clamp((buddy.landingX - buddy.x) * 1.4, -BUDDY_RUN_SPEED, BUDDY_RUN_SPEED);
          buddy.hopCooldownUntil = simTime + 0.4;
          spawnDust(buddy.x, buddy.y, 5, C.lemon);
        }

        /* A runner about to leave the ground looks up first. Jumping into a
           falling barrel is far and away the commonest way to die here, so a
           jump waits rather than commits while one is over the run. */
        function barrelBlocksLaunch(runner, landingX) {
          const left = Math.min(runner.x, landingX) - 34;
          const right = Math.max(runner.x, landingX) + 34;
          for (const barrel of barrels) {
            if (barrel.x < left || barrel.x > right) continue;
            const rise = barrel.y - runner.y;
            if (rise > -30 && rise < 210) return true;
          }
          return false;
        }

        /* Mid-flight, lean away from a barrel sharing the air. It rarely saves
           a runner outright, but it turns direct hits into near misses. */
        function barrelSwerve(runner) {
          let push = 0;
          for (const barrel of barrels) {
            const dx = runner.x - barrel.x;
            const dy = runner.y + HERO_H * 0.5 - barrel.y;
            if (Math.abs(dx) > 78 || Math.abs(dy) > 70) continue;
            push += (Math.sign(dx) || 1) * (1 - Math.abs(dx) / 78) * 165;
          }
          return clamp(push, -200, 200);
        }

        function hopHero(platform, away) {
          hero.vy = HAZARD_HOP_SPEED;
          hero.vx = away * RUN_SPEED * 0.3;
          hero.autoVx = hero.vx;
          hero.groundRoute = null;
          hero.previousPlatformId = null;
          hero.grounded = false;
          hero.groundId = null;
          hero.autoTargetId = platform.id;
          hero.autoLaunchX = null;
          hero.autoLandingX = safeLandingX(platform, hero.x + away * 14);
          hero.routeAttemptTargetId = null;
          hero.routeAttemptFromId = null;
          hero.routeAttemptStartedAt = 0;
          hero.jumpCooldownUntil = simTime + 0.4;
          spawnDust(hero.x, hero.y, 9, COLORS.smoke);
        }

        function sawCenter(platform, atTime = simTime) {
          const saw = platform.saw;
          const slide = Math.sin(atTime * saw.speed + saw.phase) * saw.span * 0.5;
          return [platformLeft(platform, atTime) + platform.w * 0.5 + slide,
            platform.y + saw.radius * 0.82];
        }

        /* A slow blade does not need the swept test the barrels use; a circle
           against the body box is honest at this speed. */
        function sawHitsMario(platform, runner) {
          if (runner.dead || runner.entryPending) return false;
          const [cx, cy] = sawCenter(platform);
          const dx = Math.max(0, Math.abs(cx - runner.x) - HERO_W * 0.3);
          const dy = cy - clamp(cy, runner.y, runner.y + HERO_H);
          const r = platform.saw.radius;
          return dx * dx + dy * dy < r * r;
        }

        function updateSaws() {
          for (const platform of platforms) {
            if (!platform.saw || platform.collapsed) continue;
            if (screenY(platform.y) < -120 || screenY(platform.y) > height + 120) continue;
            const [cx] = sawCenter(platform);
            for (const runner of [hero, ...buddies]) {
              if (!sawHitsMario(platform, runner)) continue;
              defeatMario(runner, { x: cx, y: platform.y, vx: Math.sign(runner.x - cx) * 60 });
            }
          }
        }

        function nextPlatformType() {
          // Deal a shuffled mix throughout the climb. Small bags keep all three
          // materials nearby without creating a predictable alternating ladder.
          if (!platformTypeBag.length) {
            platformTypeBag = ['ink', 'ink', 'ink', 'ink', 'ink', 'ink', 'crumble', 'crumble', 'crumble', 'crumble'];
            for (let i = platformTypeBag.length - 1; i > 0; i--) {
              const j = Math.floor(rng() * (i + 1));
              [platformTypeBag[i], platformTypeBag[j]] = [platformTypeBag[j], platformTypeBag[i]];
            }
          }
          return platformTypeBag.pop();
        }

        function canPlacePlatform(candidate, mode = 'strict') {
          const rect = platformVisualRect(candidate, 8);
          const visibleWidth = Math.min(worldWidth, rect.right) - Math.max(0, rect.left);
          if (visibleWidth < HERO_W + 8) return false;
          return !platforms.some(platform => platformsTooClose(candidate, platform, mode));
        }

        function platformsTooClose(candidate, platform, mode = 'strict') {
          const rect = platformVisualRect(candidate, 8);
          const other = platformVisualRect(platform, 0);
          const relaxed = mode === 'relaxed';
          const horizontalGap = Math.max(other.left - rect.right, rect.left - other.right, 0);
          const verticalGap = Math.abs(candidate.y - platform.y);
          return (verticalGap < (relaxed ? 38 : 62) && horizontalGap < (relaxed ? 18 : 26)) ||
            rectsOverlap(rect, platformVisualRect(platform, 10));
        }

        function platformVisualRect(platform, pad = 0) {
          const travel = platform.travel || 0;
          const h = platform.h || 18;
          return {
            left: platform.x - travel - pad,
            right: platform.x + platform.w + travel + pad,
            bottom: platform.y - h - pad,
            top: platform.y + pad,
          };
        }

        function rectsOverlap(a, b) {
          return a.left < b.right && a.right > b.left && a.bottom < b.top && a.top > b.bottom;
        }

        function platformById(id) {
          if (!id) return null;
          for (const platform of platforms) {
            if (platform.id === id) return platform;
          }
          return null;
        }

        function platformLeft(platform, atTime = simTime) {
          if (!platform.moving) return platform.x;
          const drift = Math.sin(atTime * platform.speed + platform.phase) * platform.travel;
          const bounds = platformCenterBounds(platform.w);
          const center = clamp(platform.x + platform.w * 0.5 + drift, bounds.min, bounds.max);
          return center - platform.w * 0.5;
        }

        function spawnDust(x, y, count, color) {
          if (prefersReducedMotion) return;
          for (let i = 0; i < count; i += 1) {
            particles.push({
              x: x + rand(-12, 12),
              y: y + rand(-6, 4),
              vx: rand(-72, 72),
              vy: rand(40, 150),
              r: rand(1.6, 4.8),
              age: 0,
              life: rand(0.28, 0.62),
              color,
            });
          }
        }

        function updateHud() {
          if (DEBUG) {
            debugEl.textContent = [
              `seed ${seed}`,
              `height ${Math.floor(bestHeight)}`,
              `platforms ${platforms.length}`,
              `marios ${buddies.length + 1}`,
              `visible ${[hero, ...buddies].filter((runner) => marioIsOnStage(runner)).length}`,
              `entering ${buddies.filter((buddy) => buddy.entryFrom).length}`,
              `falling ${buddies.filter((buddy) => buddy.falling).length + (!hero.grounded && hero.vy < 0 ? 1 : 0)}`,
              `camera ${cameraLeaderId === 0 ? 'hero' : `mario ${cameraLeaderId}`}`,
              `target ${targetPlatformId || '-'}`,
              `ground ${hero.grounded ? hero.groundId || '-' : '-'}`,
              `y ${Math.round(hero.y)}`,
              `vy ${Math.round(hero.vy)}`,
              `noRoute ${hero.noRouteSince ? (simTime - hero.noRouteSince).toFixed(1) : '-'}`,
              `manual ${manualActive() ? 'yes' : 'no'}`,
            ].join('\n');
          }
        }

        /* ====================================================
           RENDER -- pastel kinetic toy world
           Quiet, borderless clouds keep the red-capped figures readable
           against the saturated blue sky.
           ==================================================== */

        function render() {
          drawBackground();
          ctx.save();
          ctx.translate(width * 0.5, height * 0.5);
          ctx.scale(SCENE_SCALE, SCENE_SCALE);
          ctx.translate(-width * 0.5, -height * 0.5);
          drawPlatforms();
          drawParticles();
          drawMarioBuddies();
          drawHero();
          drawBarrels();
          ctx.restore();
        }

        /* -- SHAPE HELPERS -- */

        /* Hand-rolled so the piece does not depend on ctx.roundRect. */
        function roundRectPath(x, y, w, h, r) {
          const rr = Math.max(0, Math.min(r, Math.min(w, h) * 0.5));
          ctx.moveTo(x + rr, y);
          ctx.lineTo(x + w - rr, y);
          ctx.arcTo(x + w, y, x + w, y + rr, rr);
          ctx.lineTo(x + w, y + h - rr);
          ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
          ctx.lineTo(x + rr, y + h);
          ctx.arcTo(x, y + h, x, y + h - rr, rr);
          ctx.lineTo(x, y + rr);
          ctx.arcTo(x, y, x + rr, y, rr);
          ctx.closePath();
        }

        function fillRound(x, y, w, h, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          roundRectPath(x, y, w, h, r);
          ctx.fill();
        }

        function fillCircle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }

        function fillOval(x, y, rx, ry, color) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(1, ry / rx);
          fillCircle(0, 0, rx, color);
          ctx.restore();
        }

        /* A limb: two rounded segments through a soft joint. */
        function limb(ax, ay, bx, by, bend, thickness, color) {
          const mx = (ax + bx) * 0.5;
          const my = (ay + by) * 0.5;
          const dx = bx - ax;
          const dy = by - ay;
          const len = Math.hypot(dx, dy) || 1;
          const jx = mx + (-dy / len) * bend;
          const jy = my + (dx / len) * bend;
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(jx, jy);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function capsule(ax, ay, bx, by, thickness, color) {
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function sparkle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.quadraticCurveTo(x + r * 0.18, y - r * 0.18, x + r, y);
          ctx.quadraticCurveTo(x + r * 0.18, y + r * 0.18, x, y + r);
          ctx.quadraticCurveTo(x - r * 0.18, y + r * 0.18, x - r, y);
          ctx.quadraticCurveTo(x - r * 0.18, y - r * 0.18, x, y - r);
          ctx.fill();
        }

        /* Stable per-index noise for scenery that must not consume the
           world rng (that stream belongs to the seeded level). */
        function hash01(n) {
          let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
          x ^= x >>> 13;
          x = Math.imul(x, 0xc2b2ae35);
          x ^= x >>> 16;
          return (x >>> 0) / 4294967296;
        }

        /* -- BACKGROUND -- */

        function drawBackground() {
          const playHeight = height - hudHeight();
          const sky = ctx.createLinearGradient(0, 0, 0, playHeight);
          sky.addColorStop(0, '#8EDBFA');
          sky.addColorStop(0.56, C.sky);
          sky.addColorStop(1, '#C9F0FF');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          drawCloudscape(playHeight);

          const drift = cameraY * 0.28;
          const band = 118;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const n = i + 900;
            const x = width * (0.04 + hash01(n * 17) * 0.92);
            const y = playHeight - (i * band + hash01(n * 29) * band - drift);
            if (y < -30 || y > playHeight + 30) continue;
            const size = 2.5 + hash01(n * 43) * 4.5;
            const color = [C.white, C.lemon, C.mint, C.mid][Math.floor(hash01(n * 61) * 4)];
            ctx.save();
            ctx.globalAlpha = 0.56;
            if (i % 3 === 0) {
              fillCircle(x - size * 0.55, y, size * 0.72, color);
              fillCircle(x + size * 0.55, y, size * 0.72, color);
              fillCircle(x, y + size * 0.58, size * 0.72, color);
            } else {
              sparkle(x, y, size, color);
            }
            ctx.restore();
          }

        }

        /* Each run assembles a fresh sky from transparent painted parts.
           The seed keeps a run reproducible while reseeding changes the
           cloud-bank balance, scale, reflection and parallax. */
        function drawCloudscape(playHeight) {
          for (const part of cloudscapeLayout) {
            const image = cloudPartImages[part.kind];
            if (!image || !image.complete || !image.naturalWidth) continue;
            const drawWidth = width * part.width;
            const drawHeight = drawWidth * (image.naturalHeight / image.naturalWidth);
            for (const y of cloudLayerPositions(part, playHeight, drawHeight)) {
              ctx.save();
              ctx.globalAlpha = part.alpha;
              ctx.translate(width * part.x, y);
              ctx.scale(part.flip ? -1 : 1, 1);
              ctx.drawImage(image, -drawWidth * 0.5, -drawHeight * 0.5, drawWidth, drawHeight);
              ctx.restore();
            }
          }
        }

        function cloudLayerPositions(part, playHeight, drawHeight, atCamera = cameraY) {
          // Scroll with altitude instead of rocking in place. Copies cross the
          // viewport edge continuously, so the sky lasts for an endless climb.
          const period = Math.max(playHeight * 1.35, drawHeight + playHeight * 0.3);
          const speed = part.parallax * (prefersReducedMotion ? 0.2 : 1);
          const y = mod(playHeight * part.y + atCamera * speed, period);
          return [y - period, y].filter(center =>
            center + drawHeight * 0.5 >= 0 && center - drawHeight * 0.5 <= playHeight);
        }

        /* Two parallax layers of soft shapes so the shaft has air in it. */
        function drawFarScenery(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(left, 0, right - left, playHeight);
          ctx.clip();

          const inner = right - left;

          /* Far clouds, slowest layer. */
          const drift = cameraY * 0.22;
          const band = 300;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const rx = hash01(i * 3 + 11);
            const ry = hash01(i * 5 + 29);
            const rs = hash01(i * 7 + 53);
            const cx = left + inner * (0.12 + rx * 0.76);
            const cy = height - hudHeight() - (i * band + ry * band - drift);
            if (cy < -140 || cy > playHeight + 140) continue;
            const w = inner * (0.3 + rs * 0.32);
            cloudPath(cx, cy, w, 0.8);
            ctx.fillStyle = C.haze;
            ctx.fill();
          }

          /* Sparkles, mid layer. */
          const drift2 = cameraY * 0.44;
          const sBand = 128;
          const sFirst = Math.floor((drift2 - height) / sBand);
          const sLast = Math.ceil((drift2 + height) / sBand);
          for (let i = sFirst; i <= sLast; i += 1) {
            const rx = hash01(i * 13 + 101);
            const ry = hash01(i * 17 + 211);
            const rr = hash01(i * 19 + 307);
            if (rr < 0.34) continue;
            const cx = left + inner * (0.06 + rx * 0.88);
            const cy = height - hudHeight() - (i * sBand + ry * sBand - drift2);
            if (cy < -20 || cy > playHeight + 20) continue;
            sparkle(cx, cy, 3 + rr * 3.5, C.mist);
          }

          ctx.restore();
        }

        /* Side walls read as a soft cloud bank rather than a printed margin. */
        function drawGutters(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, Math.max(0, left), playHeight);
          ctx.rect(right, 0, Math.max(0, width - right), playHeight);
          ctx.clip();

          const band = 64;
          const drift = cameraY * 0.6;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const y = height - hudHeight() - (i * band - drift);
            if (y < -100 || y > playHeight + 100) continue;
            const r = 30 + hash01(i * 23 + 5) * 22;
            /* Two tones, heavily overlapped, so it reads as a bank of cloud
               rather than a column of dots. */
            ctx.fillStyle = hash01(i * 41 + 17) > 0.5 ? C.skyDeep : C.pale;
            ctx.beginPath();
            ctx.arc(left - 24 - hash01(i * 29 + 3) * 30, y, r, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right + 24 + hash01(i * 37 + 13) * 30, y + band * 0.5, r, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        /* Bites of sky taken out of the gutter, so the shaft edge is soft. */
        function drawScallops(left, right, playHeight) {
          const scallop = 46;
          const offset = mod(cameraY * 0.5, scallop);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, width, playHeight);
          ctx.clip();
          ctx.fillStyle = C.sky;
          for (let y = -scallop + offset; y < playHeight + scallop; y += scallop) {
            ctx.beginPath();
            ctx.arc(left, y, scallop * 0.42, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right, y + scallop * 0.5, scallop * 0.42, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function hudHeight() {
          return 0;
        }

        /* -- PLATFORMS -- */

        function drawPlatforms() {
          for (const platform of platforms) {
            if (platform.collapsed) continue;
            const sy = screenY(platform.y);
            if (sy < -90 || sy > height + 90) continue;
            const sx = worldLeft + platformLeft(platform);
            const pulse = clamp(1 - (simTime - platform.pulseUntil + 0.24) / 0.24, 0, 1);
            if (platform.moving) drawMovingPlatform(platform, sx, sy, pulse);
            else if (platform.type === 'ink') drawSolidPlatform(platform, sx, sy, pulse);
            else if (platform.type === 'crumble') drawCrumblePlatform(platform, sx, sy, pulse);
            else if (platform.type === 'cloud') drawCloudPlatform(platform, sx, sy, pulse);
            if (platform.saw) drawSaw(platform);
          }
        }

        /* The blade is built from the world's own palette rather than a
           foreign steel grey, so it reads as part of the same picture. The
           hub is drawn unspun so the eye has something still to hold. */
        function drawSaw(platform) {
          const saw = platform.saw;
          const [worldX, worldY] = sawCenter(platform);
          const cx = worldLeft + worldX;
          const cy = screenY(worldY);
          const r = saw.radius;
          const teeth = 10;

          fillOval(cx, screenY(platform.y) + 7, r * 0.8, 2.6, SHADOW);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(simTime * (prefersReducedMotion ? 0.7 : 4.2) * saw.dir);
          ctx.beginPath();
          for (let i = 0; i < teeth; i += 1) {
            const outer = (i / teeth) * TAU;
            const inner = ((i + 0.5) / teeth) * TAU;
            ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
            ctx.lineTo(Math.cos(inner) * r * 0.72, Math.sin(inner) * r * 0.72);
          }
          ctx.closePath();
          ctx.fillStyle = '#CFDCEA';
          ctx.fill();
          ctx.strokeStyle = C.ink;
          ctx.lineWidth = 2;
          ctx.lineJoin = 'round';
          ctx.stroke();
          ctx.restore();

          fillCircle(cx, cy, r * 0.32, C.ink);
          fillCircle(cx, cy, r * 0.15, C.blush);
        }

        function applyPlatformPulse(cx, sy, pulse) {
          if (pulse <= 0) return;
          ctx.translate(cx, sy + 6);
          ctx.scale(1 + pulse * 0.04, 1 - pulse * 0.07);
          ctx.translate(-cx, -(sy + 6));
        }

        function drawCloudPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          const underside = '#EEDFFF';

          ctx.save();
          applyPlatformPulse(cx, sy, pulse);

          for (const chunk of ensureCloudChunks(platform)) {
            if (chunk.broken) continue;
            const chunkX = worldLeft + platform.baseX + chunk.x;
            const chunkY = sy + chunk.lift;
            cloudChunkPath(chunkX + 2, chunkY + 7, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = 'rgba(92, 66, 124, 0.13)';
            ctx.fill();
            cloudChunkPath(chunkX, chunkY + 3, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = underside;
            ctx.fill();
            cloudChunkPath(chunkX, chunkY, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = C.white;
            ctx.fill();
          }

          ctx.restore();
        }

        function cloudChunkPath(cx, cy, w, h, index) {
          const tilt = (hash01(index * 83 + 19) - 0.5) * h * 0.18;
          ctx.beginPath();
          ctx.moveTo(cx - w * 0.5, cy + h * 0.16);
          ctx.bezierCurveTo(cx - w * 0.58, cy - h * 0.12, cx - w * 0.34, cy - h * 0.38, cx - w * 0.2, cy - h * 0.26);
          ctx.bezierCurveTo(cx - w * 0.12, cy - h * 0.68 + tilt, cx + w * 0.22, cy - h * 0.72, cx + w * 0.28, cy - h * 0.28);
          ctx.bezierCurveTo(cx + w * 0.5, cy - h * 0.3, cx + w * 0.6, cy + h * 0.02, cx + w * 0.46, cy + h * 0.2);
          ctx.bezierCurveTo(cx + w * 0.28, cy + h * 0.38, cx - w * 0.28, cy + h * 0.36, cx - w * 0.5, cy + h * 0.16);
          ctx.closePath();
        }

        function drawSolidPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          ctx.save();
          applyPlatformPulse(sx + w * 0.5, sy, pulse);
          fillRound(sx, sy - 5, w, 15, 4, '#66507D');
          fillRound(sx + 4, sy - 3, w - 8, 8, 3, '#B7E8D9');
          ctx.restore();
        }

        /* A drifting ledge has to be told apart from a still one at a glance,
           so it gets its own material: pastel purple, corners rounded much
           harder than the mint ledges, and a triangle at each end pointing the
           way it travels. */
        function drawMovingPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          ctx.save();
          applyPlatformPulse(sx + w * 0.5, sy, pulse);
          fillRound(sx, sy - 5, w, 15, 7, C.ink);
          fillRound(sx + 4, sy - 3, w - 8, 8, 5, C.pale);

          const midY = sy + 1;
          ctx.fillStyle = C.ink;
          ctx.beginPath();
          ctx.moveTo(sx + 7, midY);
          ctx.lineTo(sx + 13.5, midY - 3.6);
          ctx.lineTo(sx + 13.5, midY + 3.6);
          ctx.closePath();
          ctx.moveTo(sx + w - 7, midY);
          ctx.lineTo(sx + w - 13.5, midY - 3.6);
          ctx.lineTo(sx + w - 13.5, midY + 3.6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        function drawCrumblePlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          ctx.save();
          applyPlatformPulse(cx, sy, pulse);
          for (const brick of ensureCrumbleBricks(platform)) {
            if (brick.broken) continue;
            const progress = brick.breakAt
              ? clamp((simTime - brick.hitAt) / Math.max(0.01, brick.breakAt - brick.hitAt), 0, 1)
              : 0;
            const shake = prefersReducedMotion ? 0 : Math.sin(simTime * 52 + brick.index * 2.3) * progress * 1.8;
            const left = sx + brick.x + 1 + shake;
            const top = sy - 10 + Math.abs(shake) * 0.35;
            const size = Math.max(5, brick.w - 2);
            /* Freshly regrown bricks drop back into the course. */
            const settle = brick.regrownAt ? clamp((simTime - brick.regrownAt) / 0.3, 0, 1) : 1;
            ctx.save();
            if (settle < 1) {
              ctx.globalAlpha = settle;
              ctx.translate(left + size * 0.5, top + 9.5);
              ctx.scale(0.55 + settle * 0.45, 0.4 + settle * 0.6);
              ctx.translate(-(left + size * 0.5), -(top + 9.5));
            }
            ctx.fillStyle = brick.index % 2 ? '#D97882' : '#EEA2A7';
            ctx.fillRect(left, top, size, 19);
            ctx.strokeStyle = '#6C4555';
            ctx.lineWidth = 1.4;
            ctx.strokeRect(left, top, size, 19);
            if (progress > 0.08) {
              ctx.beginPath();
              ctx.moveTo(left + size * 0.28, top + 1);
              ctx.lineTo(left + size * 0.58, top + 7);
              ctx.lineTo(left + size * 0.42, top + 12);
              ctx.lineTo(left + size * 0.68, top + 18);
              ctx.strokeStyle = '#6C4555';
              ctx.stroke();
            }
            ctx.restore();
          }
          ctx.restore();
        }

        /* One plump storybook silhouette: a big center dome, two shoulders,
           and a softly scalloped belly. Avoiding equal repeated bumps is
           what keeps it reading as a cloud instead of a caterpillar. */
        function cloudPath(cx, topY, w, scale) {
          const h = clamp(w * 0.29, 36, 56) * scale;
          const left = cx - w * 0.5;
          const right = cx + w * 0.5;
          ctx.beginPath();
          ctx.moveTo(left + w * 0.08, topY + h * 0.08);
          ctx.bezierCurveTo(left - w * 0.02, topY, left, topY - h * 0.30, left + w * 0.10, topY - h * 0.38);
          ctx.bezierCurveTo(left + w * 0.12, topY - h * 0.69, left + w * 0.29, topY - h * 0.76, left + w * 0.36, topY - h * 0.55);
          ctx.bezierCurveTo(left + w * 0.41, topY - h, left + w * 0.61, topY - h * 1.08, left + w * 0.67, topY - h * 0.62);
          ctx.bezierCurveTo(left + w * 0.79, topY - h * 0.78, left + w * 0.91, topY - h * 0.55, left + w * 0.91, topY - h * 0.30);
          ctx.bezierCurveTo(right + w * 0.03, topY - h * 0.28, right + w * 0.04, topY + h * 0.08, right - w * 0.04, topY + h * 0.18);
          ctx.bezierCurveTo(right - w * 0.06, topY + h * 0.43, right - w * 0.25, topY + h * 0.52, right - w * 0.34, topY + h * 0.37);
          ctx.bezierCurveTo(cx + w * 0.10, topY + h * 0.59, cx - w * 0.05, topY + h * 0.58, cx - w * 0.14, topY + h * 0.40);
          ctx.bezierCurveTo(left + w * 0.29, topY + h * 0.58, left + w * 0.15, topY + h * 0.48, left + w * 0.16, topY + h * 0.29);
          ctx.bezierCurveTo(left + w * 0.06, topY + h * 0.35, left - w * 0.01, topY + h * 0.22, left + w * 0.08, topY + h * 0.08);
          ctx.closePath();
        }

        /* -- PARTICLES -- */

        function drawParticles() {
          for (const particle of particles) {
            const age = particle.age / particle.life;
            const sx = worldLeft + particle.x;
            const sy = screenY(particle.y);
            ctx.globalAlpha = (1 - age) * 0.85;
            if (particle.kind === 'brick') {
              ctx.save();
              ctx.translate(sx, sy);
              ctx.rotate(particle.rotation || 0);
              ctx.fillStyle = particle.color;
              ctx.fillRect(-particle.w * 0.5, -particle.h * 0.5, particle.w, particle.h);
              ctx.restore();
            } else if (particle.kind === 'cloud') {
              ctx.save();
              ctx.translate(sx, sy);
              ctx.rotate(particle.rotation || 0);
              ctx.scale(particle.stretch || 1, 1);
              fillOval(0, 0, Math.max(1, particle.r * (1 - age * 0.45)), Math.max(1, particle.r * 0.62), particle.color);
              ctx.restore();
            } else {
              fillCircle(sx, sy, Math.max(1, particle.r * (1 - age * 0.5)), particle.color || C.pale);
            }
          }
          ctx.globalAlpha = 1;
        }

        /* ====================================================
           RUNNERS -- black-and-white action silhouettes
           The run-and-jump timing still comes from classic action sprites,
           while a pointed hood, two white eyes and tapered body carry the
           severe graphic language of the supplied silhouette reference.
           ==================================================== */

        const FOOT_Y = -1;
        const HIP_Y = -18;
        const SHOULDER_Y = -29;
        const HEAD_Y = -38;

        /* Only the eyes sit outside the figure's own color. */
        const SKIN = {
          eye: '#FFFDFC',
          pupil: '#141A2E',
        };

        /* Each bag is one flat color -- body, legs and feet alike -- and every
           runner draws its own navy off a stable hash of its id. The crowd
           reads as a family of shades rather than one repeated sprite, and a
           runner keeps its shade through a fall, a knockout and its return.
           Hashed rather than drawn from the world rng, so adding runners
           cannot shift a seeded course. */
        const NAVY_DEEP = [26, 35, 68];
        const NAVY_LIGHT = [78, 106, 168];
        let runnerTint = 'rgb(26, 35, 68)';

        /* Three bodies, hashed per runner like the tint. All three fill the
           same box so the physics footprint does not change with the shape;
           only the outline does. Each keeps soft, bowed edges -- floppy, not
           geometric. The arm anchors and eye positions move with the shape,
           since a triangle is narrow where a square is wide. */
        const RUNNER_SHAPES = ['square', 'circle', 'triangle'];
        const ARM_ANCHOR = { square: 15.5, circle: 15.0, triangle: 10.0 };
        const EYE_LAYOUT = {
          square: { xs: [1.0, 6.8], y: 1.0 },
          circle: { xs: [1.0, 6.6], y: 1.6 },
          triangle: { xs: [-0.8, 4.4], y: 5.2 },
        };
        let runnerShape = 'square';

        function marioShape(runner) {
          if (!runner.shape) {
            const pick = Math.floor(hash01((runner.id + 1) * 3389) * RUNNER_SHAPES.length);
            runner.shape = RUNNER_SHAPES[Math.min(pick, RUNNER_SHAPES.length - 1)];
          }
          return runner.shape;
        }

        function marioTint(runner) {
          if (!runner.tint) {
            const t = hash01((runner.id + 1) * 9173);
            const rgb = NAVY_DEEP.map((deep, i) => Math.round(deep + (NAVY_LIGHT[i] - deep) * t));
            runner.tint = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
          }
          return runner.tint;
        }

        /* A leg, kept stubby. Same color as the bag, so the whole figure is
           one silhouette and the legs read as the bottom of it. */
        function armorCapsule(ax, ay, bx, by, thickness, color = runnerTint) {
          capsule(ax, ay, bx, by, Math.max(3.2, thickness * 0.62), color);
        }

        /* A tiny arm: a stub anchored at the bag's side, angled so only its
           last few pixels clear the silhouette. Same color as everything
           else, so it reads as part of the bag rather than a limb stuck on. */
        function drawStubArm(x, y, angle, length) {
          capsule(x, y, x + Math.cos(angle) * length, y + Math.sin(angle) * length, 4.2, runnerTint);
        }

        /* Two toes and a heel. Any more detail than this fights the bag. */
        function armorBoot(x, y, direction = 1) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(direction, 1);
          ctx.strokeStyle = runnerTint;
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-1.2, -0.4); ctx.lineTo(5.6, 1.6);
          ctx.moveTo(-1.2, -0.4); ctx.lineTo(4.4, -1.2);
          ctx.moveTo(-1.2, -0.4); ctx.lineTo(-4.4, 1.6);
          ctx.stroke();
          ctx.restore();
        }

        function drawBarrels() {
          if (barrelWarning) {
            const x = worldLeft + barrelWarning.x;
            const y = screenY(inverseSceneScreenY(18));
            ctx.save();
            ctx.strokeStyle = C.cocoa;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            fillCircle(x, y + 3, 12, C.lemon);
            ctx.beginPath();
            ctx.moveTo(x - 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x + 5, y);
            ctx.stroke();
            ctx.restore();
          }
          for (const barrel of barrels) {
            const y = screenY(barrel.y);
            if (y < -60 || y > height + 80) continue;
            ctx.save();
            ctx.translate(worldLeft + barrel.x, y);
            ctx.rotate(barrel.rotation);
            fillRound(-17, -20, 34, 40, 10, '#714B43');
            fillRound(-14, -18, 28, 36, 8, '#D69961');
            ctx.strokeStyle = '#A96A45';
            ctx.lineWidth = 1.5;
            for (const x of [-7, 1, 8]) {
              ctx.beginPath(); ctx.moveTo(x, -16); ctx.lineTo(x, 16); ctx.stroke();
            }
            fillRound(-17, -12, 34, 5, 2, '#66507D');
            fillRound(-17, 7, 34, 5, 2, '#66507D');
            fillOval(0, -17, 10, 2, '#EBC18A');
            ctx.restore();
          }
        }

        function drawDefeatedMario(runner) {
          const y = screenY(runner.y);
          if (y < -90 || y > height + 120) return;
          ctx.save();
          ctx.translate(worldLeft + runner.x, y - 22);
          ctx.rotate(runner.spin);
          ctx.translate(0, 22);
          ctx.scale(runner.facing * 0.9, 0.9);
          runnerTint = marioTint(runner);
          runnerShape = marioShape(runner);
          drawBuddyRunner(runner, 0, 0, true);
          ctx.restore();
        }

        function drawMarioBuddies() {
          for (const buddy of buddies) {
            if (buddy.entryPending) continue;
            if (buddy.dead) { drawDefeatedMario(buddy); continue; }
            const sx = worldLeft + buddy.x;
            const sy = screenY(buddy.y);
            if (sy < -90 || sy > height + 120) continue;
            const panic = buddy.falling;
            const airborne = !buddy.grounded;
            const gait = buddy.grounded ? clamp(Math.abs(buddy.vx) / BUDDY_RUN_SPEED, 0, 1) : 0;
            const phase = simTime * (4.2 + gait * 4.4) + buddy.phase;

            if (buddy.grounded) fillOval(sx, sy + 2, 12, 3.2, SHADOW_SOFT);
            ctx.save();
            const bounce = buddy.grounded ? Math.abs(Math.sin(phase)) * gait : 0;
            const bob = -bounce * 2.6;
            ctx.translate(sx, sy + bob);
            ctx.rotate(
              panic
                ? buddy.spin
                : airborne
                  ? clamp(buddy.vx / LEADER_AIR_SPEED, -1, 1) * 0.09
                  : 0
            );
            const press = clamp(((buddy.pressedUntil || 0) - simTime) / 0.22, 0, 1);
            ctx.scale(buddy.facing * 0.9 * (1 + bounce * 0.08 + press * 0.2),
              0.9 * (1 - bounce * 0.09 - press * 0.24));
            runnerTint = marioTint(buddy);
            runnerShape = marioShape(buddy);
            drawBuddyRunner(buddy, phase, gait, panic);
            ctx.restore();
          }
        }

        function drawBuddyRunner(buddy, phase, gait, panic) {
          const rising = !buddy.grounded && buddy.vy > -80;
          let footBack;
          let footFront;

          if (panic) {
            footBack = [-10, -5];
            footFront = [10, -7];
          } else if (!buddy.grounded && rising) {
            /* Split knees carry the jump under a bag that holds its shape. */
            footBack = [-8, -9];
            footFront = [8, -5];
          } else if (!buddy.grounded) {
            footBack = [-10, -4];
            footFront = [7, -10];
          } else {
            const stride = 9 * gait;
            const liftA = Math.max(0, Math.sin(phase)) * 5.5 * gait;
            const liftB = Math.max(0, Math.sin(phase + Math.PI)) * 5.5 * gait;
            footBack = [-Math.cos(phase) * stride - 1, -1 - liftA];
            footFront = [-Math.cos(phase + Math.PI) * stride + 1, -1 - liftB];
          }

          /* Arms counter-swing on the ground, trail when airborne, and fly
             up in a panic. A slow idle sway keeps them alive when standing. */
          const armReach = ARM_ANCHOR[runnerShape] || ARM_ANCHOR.square;
          let armBack;
          let armFront;
          if (panic) {
            armBack = 3.55;
            armFront = -0.4;
          } else if (!buddy.grounded) {
            armBack = 2.85;
            armFront = 0.3;
          } else {
            const swing = Math.sin(phase) * 0.38 * gait + Math.sin(phase * 0.35) * 0.06 * (1 - gait);
            armBack = 2.62 + swing;
            armFront = 0.52 - swing;
          }

          armorCapsule(-5, -16, footBack[0], footBack[1] - 2, 6.2);
          armorBoot(footBack[0], footBack[1], 1);
          drawStubArm(-armReach, -30, armBack, 10);

          drawRunnerTorso(-1.2, gait * 1.8);

          armorCapsule(5, -16, footFront[0], footFront[1] - 2, 6.5);
          armorBoot(footFront[0], footFront[1], 1);
          drawStubArm(armReach, -30.5, armFront, 10);
          drawRunnerHead(2.2, -38, panic, false, buddy.dead, buddy.phase);
        }

        function drawHero() {
          if (hero.entryPending) return;
          if (hero.dead) { drawDefeatedMario(hero); return; }
          const sx = worldLeft + hero.x;
          const sy = screenY(hero.y);
          const hurt = hero.stumbleUntil > simTime;

          /* Contact shadow, tighter once he leaves the ground. */
          if (hero.grounded) fillOval(sx, sy + 2, 14, 4, SHADOW);
          else fillOval(sx, sy + 2, 9, 2.5, SHADOW_SOFT);

          ctx.save();

          /* Landing squash and takeoff stretch, pivoted on the feet. */
          const speed = hero.grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0;
          const stepBounce = hero.grounded ? Math.abs(Math.sin(hero.stride / 18)) * speed : 0;
          const idleBounce = hero.grounded ? (0.5 + Math.sin(simTime * 3.2) * 0.5) * (1 - speed) * 0.22 : 0;
          const bounce = stepBounce + idleBounce;
          ctx.translate(sx, sy - bounce * 2.8);
          const land = Math.max(0, Math.max(1 - (simTime - hero.landedAt) / 0.28,
            ((hero.pressedUntil || 0) - simTime) / 0.22));
          const air = hero.grounded ? 0 : clamp(hero.vy / JUMP_SPEED, -0.9, 1);
          ctx.scale(
            1 + 0.3 * land + bounce * 0.08 - Math.max(0, air) * 0.1,
            1 - 0.32 * land - bounce * 0.08 + Math.max(0, air) * 0.14
          );

          if (hurt) ctx.rotate(Math.sin(simTime * 40) * 0.08);

          ctx.scale(hero.facing, 1);
          runnerTint = marioTint(hero);
          runnerShape = marioShape(hero);
          drawHeroRun(air);

          ctx.restore();

        }

        /* Side view: run cycle on the ground, tuck rising, splay falling. */
        function drawHeroRun(air) {
          const grounded = hero.grounded;
          const gait = grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0;
          const phase = hero.stride / 18;
          const breathe = Math.sin(simTime * 2.3) * (grounded ? 1 - gait : 0);

          /* The faster he moves, the more the whole sprite pitches into the
             run. This is the reference sheet's low, aggressive dash line. */
          const bob = grounded ? -Math.abs(Math.sin(phase)) * 1.4 * gait + breathe * 0.7 : 0;
          const lean = grounded ? gait * 2.8 : air * 1.5;

          ctx.save();
          ctx.translate(0, bob);

          const hipX = lean * 0.5;
          const shoulderX = lean * 2;

          /* Long ground strides trade places in a flat loop. Airborne poses
             stop interpolating and snap to authored silhouettes, like sprites. */
          let footA;
          let footB;
          if (grounded) {
            const swing = 10 * gait;
            const lift = 6.2 * gait;
            footA = [-Math.cos(phase) * swing - 1, FOOT_Y - Math.max(0, Math.sin(phase)) * lift];
            footB = [-Math.cos(phase + Math.PI) * swing + 1, FOOT_Y - Math.max(0, Math.sin(phase + Math.PI)) * lift];
          } else if (air > 0.1) {
            footA = [-8, FOOT_Y - 8 - air * 2];
            footB = [8, FOOT_Y - 4 - air * 2];
          } else {
            const fall = clamp(-air, 0, 1);
            footA = [-10, FOOT_Y - 3 - fall];
            footB = [8, FOOT_Y - 9 + fall * 2];
          }

          /* Legs straddle the bag and the arms are stubs at its sides; the
             squash and stretch on the body still carries most of the weight. */
          const armReach = ARM_ANCHOR[runnerShape] || ARM_ANCHOR.square;
          let armBack;
          let armFront;
          if (!grounded) {
            const fall = clamp(-air, 0, 1);
            armBack = 2.85 + fall * 0.5;
            armFront = 0.3 - fall * 0.5;
          } else {
            const swing = Math.sin(phase) * 0.38 * gait + breathe * 0.06;
            armBack = 2.62 + swing;
            armFront = 0.52 - swing;
          }

          armorCapsule(hipX - 5, HIP_Y, footA[0], footA[1] - 2, 6.4);
          armorBoot(footA[0], footA[1], 1);
          drawStubArm(shoulderX - armReach, -30, armBack, 10);

          drawRunnerTorso(hipX, shoulderX);

          armorCapsule(hipX + 5, HIP_Y, footB[0], footB[1] - 2, 6.8);
          armorBoot(footB[0], footB[1], 1);
          drawStubArm(shoulderX + armReach, -30.5, armFront, 10);

          drawRunnerHeroHead(shoulderX, air, gait, false);
          ctx.restore();
        }

        function drawRunnerTorso(hipX, shoulderX) {
          ctx.save();
          ctx.translate((hipX + shoulderX) * 0.5, 0);
          ctx.rotate((shoulderX - hipX) * 0.018);

          ctx.fillStyle = runnerTint;
          ctx.beginPath();
          if (runnerShape === 'circle') {
            /* A floppy round: heavier below the middle, with the bottom
               sagging off center the way a bag of something soft would. */
            ctx.moveTo(-1.0, -46.0);
            ctx.bezierCurveTo(-11.5, -46.0, -19.2, -38.5, -19.2, -29.0);
            ctx.bezierCurveTo(-19.2, -19.4, -12.0, -11.8, -1.5, -11.8);
            ctx.bezierCurveTo(8.8, -11.8, 17.8, -19.6, 17.8, -29.5);
            ctx.bezierCurveTo(17.8, -39.2, 9.0, -46.0, -1.0, -46.0);
          } else if (runnerShape === 'triangle') {
            /* A floppy wedge: rounded apex, wide sagging base, both flanks
               bowed outward so it never reads as a hard triangle. */
            ctx.moveTo(-3.5, -39.8);
            ctx.quadraticCurveTo(-12.4, -29.0, -15.0, -17.6);
            ctx.quadraticCurveTo(-19.2, -13.4, -11.5, -12.8);
            ctx.quadraticCurveTo(-0.5, -9.0, 10.5, -12.8);
            ctx.quadraticCurveTo(18.2, -13.4, 14.0, -18.0);
            ctx.quadraticCurveTo(13.0, -29.0, 6.5, -39.4);
            ctx.quadraticCurveTo(2.0, -45.6, -3.5, -39.8);
          } else {
            /* An overstuffed square: four soft corners with every edge bowed
               outward, the way a full sack pushes against its own seams. The
               corners stop it reading as a blob; the bulges stop it reading
               as a box. */
            ctx.moveTo(-10.0, -44.6);
            ctx.quadraticCurveTo(0.0, -49.0, 9.0, -45.6);
            ctx.quadraticCurveTo(16.0, -45.5, 16.9, -38.5);
            ctx.quadraticCurveTo(21.5, -31.0, 17.7, -23.0);
            ctx.quadraticCurveTo(18.0, -16.0, 11.0, -15.4);
            ctx.quadraticCurveTo(-0.5, -11.3, -12.0, -14.8);
            ctx.quadraticCurveTo(-19.0, -15.0, -18.4, -22.0);
            ctx.quadraticCurveTo(-22.0, -30.0, -17.6, -37.5);
            ctx.quadraticCurveTo(-17.0, -44.0, -10.0, -44.6);
          }
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        function drawRunnerHeroHead(offsetX, air, gait, frontOn) {
          const nod = gait > 0 ? Math.sin(hero.stride / 11) * 0.7 : Math.sin(simTime * 2.3) * 0.5;
          drawRunnerHead(offsetX * 0.55, HEAD_Y + nod, hero.stumbleUntil > simTime, frontOn);
        }

        /* There is no head to draw -- only where the eyes sit on the bag. The
           signature is kept from the original figure: two whites with dark
           pupils, high and forward, carrying the whole expression. */
        function drawRunnerHead(x, y, hurt, frontOn, dead = false, blinkSeed = null) {
          ctx.save();
          ctx.translate(x, y);

          const layout = EYE_LAYOUT[runnerShape] || EYE_LAYOUT.square;
          const eyeY = layout.y;
          const eyeXs = frontOn ? [-3.4, 3.4] : layout.xs;
          const blinking = blinkSeed === null
            ? simTime < hero.blinkEndsAt
            : ((simTime * 0.31 + blinkSeed) % 3.4) < 0.13;
          if (dead) {
            ctx.strokeStyle = SKIN.eye;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            for (const eyeX of eyeXs) {
              ctx.beginPath();
              ctx.moveTo(eyeX - 1.5, eyeY - 1.6); ctx.lineTo(eyeX + 1.5, eyeY + 1.6);
              ctx.moveTo(eyeX + 1.5, eyeY - 1.6); ctx.lineTo(eyeX - 1.5, eyeY + 1.6);
              ctx.stroke();
            }
          } else if (blinking && !hurt) {
            for (const eyeX of eyeXs) fillOval(eyeX, eyeY, 2.1, 0.7, SKIN.eye);
          } else {
            for (const eyeX of eyeXs) {
              fillOval(eyeX, eyeY, 2.35, 2.95, SKIN.eye);
              ctx.save();
              ctx.translate(hurt ? eyeX - 0.3 : eyeX + 0.55, eyeY + (hurt ? 0.5 : 0.25));
              if (hurt) ctx.rotate(-0.42);
              fillOval(0, 0, 1.05, 1.55, SKIN.pupil);
              ctx.restore();
            }
          }

          ctx.restore();
        }

        function screenY(worldY) {
          return height - hudHeight() - (worldY - cameraY);
        }

        function sceneScreenX(worldX) {
          const rawX = worldLeft + worldX;
          return width * 0.5 + (rawX - width * 0.5) * SCENE_SCALE;
        }

        function sceneScreenY(worldY) {
          const rawY = screenY(worldY);
          return height * 0.5 + (rawY - height * 0.5) * SCENE_SCALE;
        }

        function inverseSceneScreenX(screenX) {
          const rawX = width * 0.5 + (screenX - width * 0.5) / SCENE_SCALE;
          return rawX - worldLeft;
        }

        function inverseSceneScreenY(screenPositionY) {
          const rawY = height * 0.5 + (screenPositionY - height * 0.5) / SCENE_SCALE;
          return cameraY + height - hudHeight() - rawY;
        }

        function marioIsOnStage(runner, margin = 0) {
          const sx = sceneScreenX(runner.x);
          const sy = sceneScreenY(runner.y);
          return sx > -26 - margin && sx < width + 26 + margin &&
            sy > -12 - margin && sy < height + 54 + margin;
        }

        /* -- INPUT (unchanged) -- */

        function onKeyDown(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = true;
            jumpBufferedUntil = simTime + 0.14;
            markManual();
            event.preventDefault();
          } else if (event.key === 'r' || event.key === 'R') {
            reset(randomSeed());
            event.preventDefault();
          }
        }

        function onKeyUp(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = false;
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = false;
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = false;
            event.preventDefault();
          }
        }

        function onPointerDown(event) {
          canvas.focus({ preventScroll: true });
          pointer.active = true;
          pointer.x = event.clientX;
          pointer.startX = event.clientX;
          pointer.startY = event.clientY;
          pointer.downAt = performance.now();
          pointer.moved = false;
          markManual();
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        }

        function onPointerMove(event) {
          if (!pointer.active) return;
          pointer.x = event.clientX;
          if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 8) pointer.moved = true;
          markManual();
          event.preventDefault();
        }

        function onPointerUp(event) {
          if (!pointer.active) return;
          const elapsed = performance.now() - pointer.downAt;
          const wasTap = elapsed < 180 && !pointer.moved;
          pointer.active = false;
          if (wasTap) reset(randomSeed());
          else manualUntil = simTime + 1.2;
          event.preventDefault();
        }

        function markManual() {
          manualUntil = simTime + 3.2;
        }

        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function rand(min, max) {
          return min + rng() * (max - min);
        }

        function mod(value, amount) {
          return ((value % amount) + amount) % amount;
        }

      })();
    </script>
  </body>
</html>
