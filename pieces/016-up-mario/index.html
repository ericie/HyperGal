          ctx.beginPath();
          ctx.ellipse(0, -35, 11, 11.5, 0, 0, TAU);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(5, -38, 3, 3);
          ctx.fillRect(1, -31, 9, 3);
          ctx.fillRect(8, -34, 5, 4);

          ctx.fillStyle = COLORS.ink;
          ctx.beginPath();
          ctx.moveTo(-13, -43);
          ctx.lineTo(8, -47);
          ctx.lineTo(13, -42);
          ctx.lineTo(17, -40);
          ctx.lineTo(-13, -40);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(-15, -41, 31, 3);
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(-6, -43, 10, 1);

          ctx.restore();
        }

        function drawForegroundMask() {
          const playHeight = height - (width <= 520 ? 64 : 58);
          const trim = Math.max(3, Math.min(8, worldLeft * 0.12));
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(worldLeft - trim, 0, trim, playHeight);
          ctx.fillRect(worldLeft + worldWidth, 0, trim, playHeight);
          ctx.fillRect(worldLeft - trim, 0, worldWidth + trim * 2, 3);
          ctx.fillStyle = COLORS.white;
          const offset = mod(cameraY * 0.31, 34);
          for (let y = -offset; y < playHeight; y += 34) {
            ctx.fillRect(Math.round(worldLeft - trim), Math.round(y), trim, 1);
            ctx.fillRect(Math.round(worldLeft + worldWidth), Math.round(y + 17), trim, 1);
          }
        }

        function screenY(worldY) {
          const hudHeight = width <= 520 ? 64 : 58;
          return height - hudHeight - (worldY - cameraY);
        }

        function onKeyDown(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = true;
            jumpBufferedUntil = simTime + 0.14;
            markManual();
            event.preventDefault();
          } else if (event.key === 'r' || event.key === 'R') {
            reset(randomSeed());
            event.preventDefault();
          }
        }

        function onKeyUp(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = false;
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = false;
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = false;
            event.preventDefault();
          }
        }

        function onPointerDown(event) {
          canvas.focus({ preventScroll: true });
          pointer.active = true;
          pointer.x = event.clientX;
          pointer.startX = event.clientX;
          pointer.startY = event.clientY;
          pointer.downAt = performance.now();
          pointer.moved = false;
          markManual();
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        }

        function onPointerMove(event) {
          if (!pointer.active) return;
          pointer.x = event.clientX;
          if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 8) pointer.moved = true;
          markManual();
          event.preventDefault();
        }

        function onPointerUp(event) {
          if (!pointer.active) return;
          const elapsed = performance.now() - pointer.downAt;
          const wasTap = elapsed < 180 && !pointer.moved;
          pointer.active = false;
          if (wasTap) reset(randomSeed());
          else manualUntil = simTime + 1.2;
          event.preventDefault();
        }

        function markManual() {
          manualUntil = simTime + 3.2;
        }

        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function rand(min, max) {
          return min + rng() * (max - min);
        }

        function mod(value, amount) {
          return ((value % amount) + amount) % amount;
        }

        function mixColor(a, b, t) {
          const ca = hexToRgb(a);
          const cb = hexToRgb(b);
          const r = Math.round(lerp(ca.r, cb.r, t));
          const g = Math.round(lerp(ca.g, cb.g, t));
          const bl = Math.round(lerp(ca.b, cb.b, t));
          return `rgb(${r}, ${g}, ${bl})`;
        }

        function hexToRgb(value) {
          const hex = value.replace('#', '');
          return {
            r: Number.parseInt(hex.slice(0, 2), 16),
            g: Number.parseInt(hex.slice(2, 4), 16),
            b: Number.parseInt(hex.slice(4, 6), 16),
          };
        }
      })();
    </script>
  </body>
</html>
