          ctx.translate(-width * 0.5, -height * 0.5);
          drawPlatforms();
          drawParticles();
          drawMarioBuddies();
          drawHero();
          ctx.restore();
        }

        /* -- SHAPE HELPERS -- */

        /* Hand-rolled so the piece does not depend on ctx.roundRect. */
        function roundRectPath(x, y, w, h, r) {
          const rr = Math.max(0, Math.min(r, Math.min(w, h) * 0.5));
          ctx.moveTo(x + rr, y);
          ctx.lineTo(x + w - rr, y);
          ctx.arcTo(x + w, y, x + w, y + rr, rr);
          ctx.lineTo(x + w, y + h - rr);
          ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
          ctx.lineTo(x + rr, y + h);
          ctx.arcTo(x, y + h, x, y + h - rr, rr);
          ctx.lineTo(x, y + rr);
          ctx.arcTo(x, y, x + rr, y, rr);
          ctx.closePath();
        }

        function fillRound(x, y, w, h, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          roundRectPath(x, y, w, h, r);
          ctx.fill();
        }

        function fillCircle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }

        function fillOval(x, y, rx, ry, color) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(1, ry / rx);
          fillCircle(0, 0, rx, color);
          ctx.restore();
        }

        /* A limb: two rounded segments through a soft joint. */
        function limb(ax, ay, bx, by, bend, thickness, color) {
          const mx = (ax + bx) * 0.5;
          const my = (ay + by) * 0.5;
          const dx = bx - ax;
          const dy = by - ay;
          const len = Math.hypot(dx, dy) || 1;
          const jx = mx + (-dy / len) * bend;
          const jy = my + (dx / len) * bend;
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(jx, jy);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function capsule(ax, ay, bx, by, thickness, color) {
          ctx.strokeStyle = color;
          ctx.lineWidth = thickness;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }

        function sparkle(x, y, r, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.quadraticCurveTo(x + r * 0.18, y - r * 0.18, x + r, y);
          ctx.quadraticCurveTo(x + r * 0.18, y + r * 0.18, x, y + r);
          ctx.quadraticCurveTo(x - r * 0.18, y + r * 0.18, x - r, y);
          ctx.quadraticCurveTo(x - r * 0.18, y - r * 0.18, x, y - r);
          ctx.fill();
        }

        /* Stable per-index noise for scenery that must not consume the
           world rng (that stream belongs to the seeded level). */
        function hash01(n) {
          let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
          x ^= x >>> 13;
          x = Math.imul(x, 0xc2b2ae35);
          x ^= x >>> 16;
          return (x >>> 0) / 4294967296;
        }

        /* -- BACKGROUND -- */

        function drawBackground() {
          const playHeight = height - hudHeight();
          const sky = ctx.createLinearGradient(0, 0, 0, playHeight);
          sky.addColorStop(0, '#8EDBFA');
          sky.addColorStop(0.56, C.sky);
          sky.addColorStop(1, '#C9F0FF');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          drawCloudscape(playHeight);

          const drift = cameraY * 0.28;
          const band = 118;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const n = i + 900;
            const x = width * (0.04 + hash01(n * 17) * 0.92);
            const y = playHeight - (i * band + hash01(n * 29) * band - drift);
            if (y < -30 || y > playHeight + 30) continue;
            const size = 2.5 + hash01(n * 43) * 4.5;
            const color = [C.white, C.lemon, C.mint, C.mid][Math.floor(hash01(n * 61) * 4)];
            ctx.save();
            ctx.globalAlpha = 0.56;
            if (i % 3 === 0) {
              fillCircle(x - size * 0.55, y, size * 0.72, color);
              fillCircle(x + size * 0.55, y, size * 0.72, color);
              fillCircle(x, y + size * 0.58, size * 0.72, color);
            } else {
              sparkle(x, y, size, color);
            }
            ctx.restore();
          }

        }

        /* Each run assembles a fresh sky from transparent painted parts.
           The seed keeps a run reproducible while reseeding changes the
           cloud-bank balance, scale, reflection and parallax. */
        function drawCloudscape(playHeight) {
          for (const part of cloudscapeLayout) {
            const image = cloudPartImages[part.kind];
            if (!image || !image.complete || !image.naturalWidth) continue;
            const drawWidth = width * part.width;
            const drawHeight = drawWidth * (image.naturalHeight / image.naturalWidth);
            const drift = Math.sin(cameraY * part.parallax * 0.002 + part.x * 7) * playHeight * 0.075;
            const x = width * part.x;
            const y = playHeight * part.y + drift;
            ctx.save();
            ctx.globalAlpha = part.alpha;
            ctx.translate(x, y);
            ctx.scale(part.flip ? -1 : 1, 1);
            ctx.drawImage(image, -drawWidth * 0.5, -drawHeight * 0.5, drawWidth, drawHeight);
            ctx.restore();
          }
        }

        /* Two parallax layers of soft shapes so the shaft has air in it. */
        function drawFarScenery(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(left, 0, right - left, playHeight);
          ctx.clip();

          const inner = right - left;

          /* Far clouds, slowest layer. */
          const drift = cameraY * 0.22;
          const band = 300;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const rx = hash01(i * 3 + 11);
            const ry = hash01(i * 5 + 29);
            const rs = hash01(i * 7 + 53);
            const cx = left + inner * (0.12 + rx * 0.76);
            const cy = height - hudHeight() - (i * band + ry * band - drift);
            if (cy < -140 || cy > playHeight + 140) continue;
            const w = inner * (0.3 + rs * 0.32);
            cloudPath(cx, cy, w, 0.8);
            ctx.fillStyle = C.haze;
            ctx.fill();
          }

          /* Sparkles, mid layer. */
          const drift2 = cameraY * 0.44;
          const sBand = 128;
          const sFirst = Math.floor((drift2 - height) / sBand);
          const sLast = Math.ceil((drift2 + height) / sBand);
          for (let i = sFirst; i <= sLast; i += 1) {
            const rx = hash01(i * 13 + 101);
            const ry = hash01(i * 17 + 211);
            const rr = hash01(i * 19 + 307);
            if (rr < 0.34) continue;
            const cx = left + inner * (0.06 + rx * 0.88);
            const cy = height - hudHeight() - (i * sBand + ry * sBand - drift2);
            if (cy < -20 || cy > playHeight + 20) continue;
            sparkle(cx, cy, 3 + rr * 3.5, C.mist);
          }

          ctx.restore();
        }

        /* Side walls read as a soft cloud bank rather than a printed margin. */
        function drawGutters(left, right, playHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, Math.max(0, left), playHeight);
          ctx.rect(right, 0, Math.max(0, width - right), playHeight);
          ctx.clip();

          const band = 64;
          const drift = cameraY * 0.6;
          const first = Math.floor((drift - height) / band);
          const last = Math.ceil((drift + height) / band);
          for (let i = first; i <= last; i += 1) {
            const y = height - hudHeight() - (i * band - drift);
            if (y < -100 || y > playHeight + 100) continue;
            const r = 30 + hash01(i * 23 + 5) * 22;
            /* Two tones, heavily overlapped, so it reads as a bank of cloud
               rather than a column of dots. */
            ctx.fillStyle = hash01(i * 41 + 17) > 0.5 ? C.skyDeep : C.pale;
            ctx.beginPath();
            ctx.arc(left - 24 - hash01(i * 29 + 3) * 30, y, r, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right + 24 + hash01(i * 37 + 13) * 30, y + band * 0.5, r, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        /* Bites of sky taken out of the gutter, so the shaft edge is soft. */
        function drawScallops(left, right, playHeight) {
          const scallop = 46;
          const offset = mod(cameraY * 0.5, scallop);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, width, playHeight);
          ctx.clip();
          ctx.fillStyle = C.sky;
          for (let y = -scallop + offset; y < playHeight + scallop; y += scallop) {
            ctx.beginPath();
            ctx.arc(left, y, scallop * 0.42, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(right, y + scallop * 0.5, scallop * 0.42, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function hudHeight() {
          return 0;
        }

        /* -- CLOUD PLATFORMS -- */

        function drawPlatforms() {
          for (const platform of platforms) {
            if (platform.collapsed) continue;
            const sy = screenY(platform.y);
            if (sy < -90 || sy > height + 90) continue;
            const sx = worldLeft + platformLeft(platform);
            const pulse = clamp(1 - (simTime - platform.pulseUntil + 0.24) / 0.24, 0, 1);
            if (platform.zone === 'ink') drawInkPlatform(platform, sx, sy, pulse);
            else if (platform.zone === 'crumble') drawCrumblePlatform(platform, sx, sy, pulse);
            else if (platform.zone === 'trap') drawTrapPlatform(platform, sx, sy, pulse);
            else drawCloudPlatform(platform, sx, sy, pulse);
          }
        }

        function applyPlatformPulse(cx, sy, pulse) {
          if (pulse <= 0) return;
          ctx.translate(cx, sy + 6);
          ctx.scale(1 + pulse * 0.04, 1 - pulse * 0.07);
          ctx.translate(-cx, -(sy + 6));
        }

        function drawInkPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          const wobble = Math.sin(platform.id * 9.7) * 2;
          ctx.save();
          applyPlatformPulse(cx, sy, pulse);
          ctx.strokeStyle = SKIN.outline;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(sx + 3, sy - 1);
          ctx.quadraticCurveTo(cx - w * 0.16, sy - 4 + wobble, cx, sy - 1);
          ctx.quadraticCurveTo(cx + w * 0.2, sy + 2 - wobble, sx + w - 3, sy - 1);
          ctx.stroke();
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.82;
          ctx.beginPath();
          ctx.moveTo(sx + 10, sy + 7);
          ctx.quadraticCurveTo(cx, sy + 10 - wobble, sx + w - 12, sy + 6);
          ctx.stroke();
          for (let x = sx + 18; x < sx + w - 10; x += 25) {
            ctx.beginPath();
            ctx.moveTo(x, sy + 2);
            ctx.lineTo(x + 4, sy + 9 + Math.sin(x) * 1.5);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawCrumblePlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          ctx.save();
          applyPlatformPulse(cx, sy, pulse);
          for (const brick of ensureCrumbleBricks(platform)) {
            if (brick.broken) continue;
            const progress = brick.breakAt
              ? clamp((simTime - brick.hitAt) / Math.max(0.01, brick.breakAt - brick.hitAt), 0, 1)
              : 0;
            const shake = prefersReducedMotion ? 0 : Math.sin(simTime * 52 + brick.index * 2.3) * progress * 1.8;
            const left = sx + brick.x + 1 + shake;
            const top = sy - 10 + Math.abs(shake) * 0.35;
            const size = Math.max(5, brick.w - 2);
            /* Freshly regrown bricks drop back into the course. */
            const settle = brick.regrownAt ? clamp((simTime - brick.regrownAt) / 0.3, 0, 1) : 1;
            ctx.save();
            if (settle < 1) {
              ctx.globalAlpha = settle;
              ctx.translate(left + size * 0.5, top + 9.5);
              ctx.scale(0.55 + settle * 0.45, 0.4 + settle * 0.6);
              ctx.translate(-(left + size * 0.5), -(top + 9.5));
            }
            ctx.fillStyle = brick.index % 2 ? '#D97882' : '#EEA2A7';
            ctx.fillRect(left, top, size, 19);
            ctx.strokeStyle = '#6C4555';
            ctx.lineWidth = 1.4;
            ctx.strokeRect(left, top, size, 19);
            if (progress > 0.08) {
              ctx.beginPath();
              ctx.moveTo(left + size * 0.28, top + 1);
              ctx.lineTo(left + size * 0.58, top + 7);
              ctx.lineTo(left + size * 0.42, top + 12);
              ctx.lineTo(left + size * 0.68, top + 18);
              ctx.strokeStyle = SKIN.outline;
              ctx.stroke();
            }
            ctx.restore();
          }
          ctx.restore();
        }

        function drawTrapPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          const isDoor = platform.trapRole === 'trapdoor';
          const isLever = platform.trapRole === 'lever';
          let open = 0;
          if (isDoor && platform.trapOpenUntil > 0) {
            if (platform.trapOpenUntil > simTime) open = clamp((simTime - platform.openedAt) / 0.22, 0, 1);
            else open = clamp(1 - (simTime - platform.trapOpenUntil) / 0.28, 0, 1);
          }

          ctx.save();
          applyPlatformPulse(cx, sy, pulse);
          if (isDoor) {
            const gap = 5;
            const panelW = w * 0.5 - gap;
            drawTrapPanel(sx, sy, panelW, open * Math.PI * 0.5, 1);
            drawTrapPanel(sx + w, sy, panelW, -open * Math.PI * 0.5, -1);
            fillCircle(sx + 4, sy, 5, '#66507D');
            fillCircle(sx + w - 4, sy, 5, '#66507D');
          } else {
            fillRound(sx, sy - 5, w, 15, 4, '#66507D');
            fillRound(sx + 4, sy - 3, w - 8, 8, 3, '#B7E8D9');
          }

          if (isLever) {
            const active = platform.activatedUntil > simTime;
            const angle = active ? -0.78 : 0.58;
            const baseY = sy - 7;
            fillOval(cx, baseY, 11, 4, '#66507D');
            ctx.strokeStyle = SKIN.outline;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, baseY - 1);
            ctx.lineTo(cx + Math.sin(angle) * 15, baseY - Math.cos(angle) * 15);
            ctx.stroke();
            fillCircle(cx + Math.sin(angle) * 15, baseY - Math.cos(angle) * 15, 5, active ? C.lemon : C.mid);
          }
          ctx.restore();
        }

        function drawTrapPanel(hingeX, hingeY, panelW, angle, direction) {
          ctx.save();
          ctx.translate(hingeX, hingeY);
          ctx.rotate(angle);
          const x = direction > 0 ? 0 : -panelW;
          fillRound(x, -5, panelW, 12, 3, '#66507D');
          fillRound(x + 3, -3, panelW - 6, 7, 2, '#D8C9F4');
          ctx.restore();
        }

        function drawCloudPlatform(platform, sx, sy, pulse) {
          const w = platform.w;
          const cx = sx + w * 0.5;
          const underside = '#EEDFFF';

          ctx.save();
          applyPlatformPulse(cx, sy, pulse);

          for (const chunk of ensureCloudChunks(platform)) {
            if (chunk.broken) continue;
            const chunkX = worldLeft + platform.baseX + chunk.x;
            const chunkY = sy + chunk.lift;
            cloudChunkPath(chunkX + 2, chunkY + 7, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = 'rgba(92, 66, 124, 0.13)';
            ctx.fill();
            cloudChunkPath(chunkX, chunkY + 3, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = underside;
            ctx.fill();
            cloudChunkPath(chunkX, chunkY, chunk.w, chunk.h, chunk.index);
            ctx.fillStyle = C.white;
            ctx.fill();
          }

          ctx.restore();
        }

        function cloudChunkPath(cx, cy, w, h, index) {
          const tilt = (hash01(index * 83 + 19) - 0.5) * h * 0.18;
          ctx.beginPath();
          ctx.moveTo(cx - w * 0.5, cy + h * 0.16);
          ctx.bezierCurveTo(cx - w * 0.58, cy - h * 0.12, cx - w * 0.34, cy - h * 0.38, cx - w * 0.2, cy - h * 0.26);
          ctx.bezierCurveTo(cx - w * 0.12, cy - h * 0.68 + tilt, cx + w * 0.22, cy - h * 0.72, cx + w * 0.28, cy - h * 0.28);
          ctx.bezierCurveTo(cx + w * 0.5, cy - h * 0.3, cx + w * 0.6, cy + h * 0.02, cx + w * 0.46, cy + h * 0.2);
          ctx.bezierCurveTo(cx + w * 0.28, cy + h * 0.38, cx - w * 0.28, cy + h * 0.36, cx - w * 0.5, cy + h * 0.16);
          ctx.closePath();
        }

        /* One plump storybook silhouette: a big center dome, two shoulders,
           and a softly scalloped belly. Avoiding equal repeated bumps is
           what keeps it reading as a cloud instead of a caterpillar. */
        function cloudPath(cx, topY, w, scale) {
          const h = clamp(w * 0.29, 36, 56) * scale;
          const left = cx - w * 0.5;
          const right = cx + w * 0.5;
          ctx.beginPath();
          ctx.moveTo(left + w * 0.08, topY + h * 0.08);
          ctx.bezierCurveTo(left - w * 0.02, topY, left, topY - h * 0.30, left + w * 0.10, topY - h * 0.38);
          ctx.bezierCurveTo(left + w * 0.12, topY - h * 0.69, left + w * 0.29, topY - h * 0.76, left + w * 0.36, topY - h * 0.55);
          ctx.bezierCurveTo(left + w * 0.41, topY - h, left + w * 0.61, topY - h * 1.08, left + w * 0.67, topY - h * 0.62);
          ctx.bezierCurveTo(left + w * 0.79, topY - h * 0.78, left + w * 0.91, topY - h * 0.55, left + w * 0.91, topY - h * 0.30);
          ctx.bezierCurveTo(right + w * 0.03, topY - h * 0.28, right + w * 0.04, topY + h * 0.08, right - w * 0.04, topY + h * 0.18);
          ctx.bezierCurveTo(right - w * 0.06, topY + h * 0.43, right - w * 0.25, topY + h * 0.52, right - w * 0.34, topY + h * 0.37);
          ctx.bezierCurveTo(cx + w * 0.10, topY + h * 0.59, cx - w * 0.05, topY + h * 0.58, cx - w * 0.14, topY + h * 0.40);
          ctx.bezierCurveTo(left + w * 0.29, topY + h * 0.58, left + w * 0.15, topY + h * 0.48, left + w * 0.16, topY + h * 0.29);
          ctx.bezierCurveTo(left + w * 0.06, topY + h * 0.35, left - w * 0.01, topY + h * 0.22, left + w * 0.08, topY + h * 0.08);
          ctx.closePath();
        }

        /* -- PARTICLES -- */

        function drawParticles() {
          for (const particle of particles) {
            const age = particle.age / particle.life;
            const sx = worldLeft + particle.x;
            const sy = screenY(particle.y);
            ctx.globalAlpha = (1 - age) * 0.85;
            if (particle.kind === 'brick') {
              ctx.save();
              ctx.translate(sx, sy);
              ctx.rotate(particle.rotation || 0);
              ctx.fillStyle = particle.color;
              ctx.fillRect(-particle.w * 0.5, -particle.h * 0.5, particle.w, particle.h);
              ctx.restore();
            } else if (particle.kind === 'cloud') {
              ctx.save();
              ctx.translate(sx, sy);
              ctx.rotate(particle.rotation || 0);
              ctx.scale(particle.stretch || 1, 1);
              fillOval(0, 0, Math.max(1, particle.r * (1 - age * 0.45)), Math.max(1, particle.r * 0.62), particle.color);
              ctx.restore();
            } else {
              fillCircle(sx, sy, Math.max(1, particle.r * (1 - age * 0.5)), particle.color || C.pale);
            }
          }
          ctx.globalAlpha = 1;
        }

        /* ====================================================
           RUNNERS -- black-and-white action silhouettes
           The run-and-jump timing still comes from classic action sprites,
           while a pointed hood, two white eyes and tapered body carry the
           severe graphic language of the supplied silhouette reference.
           ==================================================== */

        const FOOT_Y = -1;
        const HIP_Y = -18;
        const SHOULDER_Y = -29;
        const HEAD_Y = -38;

        /* Existing pose calls retain their depth-role names, but every body
           part now resolves to a single charcoal silhouette. */
        const SKIN = {
          outline: '#272D30',
          deepest: '#272D30',
          back: '#272D30',
          mid: '#272D30',
          bright: '#FFFDFC',
          face: '#FFFDFC',
          shirt: '#272D30',
          arm: '#272D30',
          leg: '#272D30',
          boot: '#272D30',
          cap: '#272D30',
        };

        function armorCapsule(ax, ay, bx, by, thickness) {
          capsule(ax, ay, bx, by, Math.max(2.8, thickness * 0.56), SKIN.outline);
        }

        /* A loose, handless arm. Both control points sag below the shoulder,
           so the limb trails the pose instead of reading as a rigid bar. */
        function drawFloppyArm(ax, ay, bx, by, thickness) {
          const dx = bx - ax;
          const dy = by - ay;
          const length = Math.hypot(dx, dy);
          const sag = 3.2 + length * 0.13;
          ctx.strokeStyle = SKIN.outline;
          ctx.lineWidth = Math.max(2.6, thickness * 0.54);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.bezierCurveTo(ax + dx * 0.28, ay + sag, ax + dx * 0.72, by + sag * 0.72, bx, by);
          ctx.stroke();
        }

        function armorBoot(x, y, direction = 1) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(direction, 1);
          ctx.fillStyle = SKIN.outline;
          ctx.beginPath();
          ctx.moveTo(-2.4, -5.5);
          ctx.lineTo(2.2, -5.2);
          ctx.quadraticCurveTo(2.8, -2.2, 6.8, 0.4);
          ctx.lineTo(-5.6, 2.2);
          ctx.lineTo(-0.4, -1.4);
          ctx.fill();
          ctx.restore();
        }

        function drawMarioBuddies() {
          for (const buddy of buddies) {
            const sx = worldLeft + buddy.x;
            const sy = screenY(buddy.y);
            if (sy < -90 || sy > height + 120) continue;
            const panic = buddy.falling;
            const airborne = !buddy.grounded;
            const gait = buddy.grounded ? clamp(Math.abs(buddy.vx) / BUDDY_RUN_SPEED, 0, 1) : 0;
            const phase = simTime * (4.2 + gait * 4.4) + buddy.phase;

            if (buddy.grounded) fillOval(sx, sy + 2, 12, 3.2, SHADOW_SOFT);
            ctx.save();
            const bounce = buddy.grounded ? Math.abs(Math.sin(phase)) * gait : 0;
            const bob = -bounce * 2.6;
            ctx.translate(sx, sy + bob);
            ctx.rotate(
              panic
                ? buddy.spin
                : airborne
                  ? clamp(buddy.vx / BUDDY_AIR_SPEED, -1, 1) * 0.09
                  : 0
            );
            ctx.scale(buddy.facing * 0.9 * (1 + bounce * 0.08), 0.9 * (1 - bounce * 0.09));
            drawBuddyRunner(buddy, phase, gait, panic);
            ctx.restore();
          }
        }

        function drawBuddyRunner(buddy, phase, gait, panic) {
          const rising = !buddy.grounded && buddy.vy > -80;
          let footBack;
          let footFront;
          let armBackEnd;
          let armFrontEnd;

          if (panic) {
            footBack = [-10, -5];
            footFront = [10, -7];
            armBackEnd = [-14, -18];
            armFrontEnd = [13, -20];
          } else if (!buddy.grounded && rising) {
            /* Split knees carry the jump while both soft arms lag beneath the
               shoulders, preserving the floppy silhouette in the air. */
            footBack = [-8, -9];
            footFront = [8, -5];
            armBackEnd = [-12, -17];
            armFrontEnd = [7, -15];
          } else if (!buddy.grounded) {
            footBack = [-10, -4];
            footFront = [7, -10];
            armBackEnd = [-14, -18];
            armFrontEnd = [12, -16];
          } else {
            const stride = 9 * gait;
            const liftA = Math.max(0, Math.sin(phase)) * 5.5 * gait;
            const liftB = Math.max(0, Math.sin(phase + Math.PI)) * 5.5 * gait;
            footBack = [-Math.cos(phase) * stride - 1, -1 - liftA];
            footFront = [-Math.cos(phase + Math.PI) * stride + 1, -1 - liftB];
            armBackEnd = [-8 - Math.cos(phase + Math.PI) * 7 * gait, -17 - liftB * 0.22];
            armFrontEnd = [8 - Math.cos(phase) * 7 * gait, -18 - liftA * 0.22];
          }

          armorCapsule(-5, -16, footBack[0], footBack[1] - 2, 6.2, SKIN.back);
          armorBoot(footBack[0], footBack[1], 1, true);
          drawFloppyArm(-9, -28, armBackEnd[0], armBackEnd[1], 4.8);

          drawRunnerTorso(-1.2, gait * 1.8);

          armorCapsule(5, -16, footFront[0], footFront[1] - 2, 6.5, SKIN.leg);
          armorBoot(footFront[0], footFront[1], 1, false);
          drawFloppyArm(9, -28, armFrontEnd[0], armFrontEnd[1], 5.1);
          drawRunnerHead(2.2, -38, panic, false);
        }

        function drawHero() {
          const sx = worldLeft + hero.x;
          const sy = screenY(hero.y);
          const hurt = hero.stumbleUntil > simTime;

          /* Contact shadow, tighter once he leaves the ground. */
          if (hero.grounded) fillOval(sx, sy + 2, 14, 4, SHADOW);
          else fillOval(sx, sy + 2, 9, 2.5, SHADOW_SOFT);

          ctx.save();

          /* Landing squash and takeoff stretch, pivoted on the feet. */
          const speed = hero.grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0;
          const stepBounce = hero.grounded ? Math.abs(Math.sin(hero.stride / 18)) * speed : 0;
          const idleBounce = hero.grounded ? (0.5 + Math.sin(simTime * 3.2) * 0.5) * (1 - speed) * 0.22 : 0;
          const bounce = stepBounce + idleBounce;
          ctx.translate(sx, sy - bounce * 2.8);
          const land = Math.max(0, 1 - (simTime - hero.landedAt) / 0.28);
          const air = hero.grounded ? 0 : clamp(hero.vy / JUMP_SPEED, -0.9, 1);
          ctx.scale(
            1 + 0.3 * land + bounce * 0.08 - Math.max(0, air) * 0.1,
            1 - 0.32 * land - bounce * 0.08 + Math.max(0, air) * 0.14
          );

          if (hurt) ctx.rotate(Math.sin(simTime * 40) * 0.08);

          ctx.scale(hero.facing, 1);
          drawHeroRun(air);

          ctx.restore();

        }

        /* Side view: run cycle on the ground, tuck rising, splay falling. */
        function drawHeroRun(air) {
          const grounded = hero.grounded;
          const gait = grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0;
          const phase = hero.stride / 18;
          const breathe = Math.sin(simTime * 2.3) * (grounded ? 1 - gait : 0);

          /* The faster he moves, the more the whole sprite pitches into the
             run. This is the reference sheet's low, aggressive dash line. */
          const bob = grounded ? -Math.abs(Math.sin(phase)) * 1.4 * gait + breathe * 0.7 : 0;
          const lean = grounded ? gait * 2.8 : air * 1.5;

          ctx.save();
          ctx.translate(0, bob);

          const hipX = lean * 0.5;
          const shoulderX = lean * 2;

          /* Long ground strides trade places in a flat loop. Airborne poses
             stop interpolating and snap to authored silhouettes, like sprites. */
          let footA;
          let footB;
          if (grounded) {
            const swing = 10 * gait;
            const lift = 6.2 * gait;
            footA = [-Math.cos(phase) * swing - 1, FOOT_Y - Math.max(0, Math.sin(phase)) * lift];
            footB = [-Math.cos(phase + Math.PI) * swing + 1, FOOT_Y - Math.max(0, Math.sin(phase + Math.PI)) * lift];
          } else if (air > 0.1) {
            footA = [-8, FOOT_Y - 8 - air * 2];
            footB = [8, FOOT_Y - 4 - air * 2];
          } else {
            const fall = clamp(-air, 0, 1);
            footA = [-10, FOOT_Y - 3 - fall];
            footB = [8, FOOT_Y - 9 + fall * 2];
          }

          /* Handless arms counter-swing loosely on the ground, then trail
             beneath the shoulders through both authored air poses. */
          let armEndA;
          let armEndB;
          if (grounded) {
            const swing = 8 * gait;
            const droop = SHOULDER_Y + 12 + breathe * 0.4;
            armEndA = [-8 - Math.cos(phase + Math.PI) * swing, droop - Math.max(0, Math.sin(phase + Math.PI)) * 2.2 * gait];
            armEndB = [9 - Math.cos(phase) * swing, droop - 1 - Math.max(0, Math.sin(phase)) * 2.2 * gait];
          } else if (air > 0.1) {
            armEndA = [-12, SHOULDER_Y + 12];
            armEndB = [7, SHOULDER_Y + 15];
          } else {
            const fall = clamp(-air, 0, 1);
            armEndA = [-14, SHOULDER_Y + 10 + fall * 3];
            armEndB = [13, SHOULDER_Y + 13 + fall * 2];
          }

          /* The sprite-sheet pose supplies the separation now; every limb is
             intentionally cut from the same flat silhouette. */
          armorCapsule(hipX - 5, HIP_Y, footA[0], footA[1] - 2, 6.4, SKIN.back);
          armorBoot(footA[0], footA[1], 1, true);
          drawFloppyArm(shoulderX - 9, SHOULDER_Y + 1, armEndA[0], armEndA[1], 4.8);

          drawRunnerTorso(hipX, shoulderX);

          armorCapsule(hipX + 5, HIP_Y, footB[0], footB[1] - 2, 6.8, SKIN.leg);
          armorBoot(footB[0], footB[1], 1, false);
          drawFloppyArm(shoulderX + 9, SHOULDER_Y + 1, armEndB[0], armEndB[1], 5.1);

          drawRunnerHeroHead(shoulderX, air, gait, false);
          ctx.restore();
        }

        function drawRunnerTorso(hipX, shoulderX) {
          ctx.save();
          ctx.translate((hipX + shoulderX) * 0.5, 0);
          ctx.rotate((shoulderX - hipX) * 0.018);

          /* A pinched neck opens into a broad, weighted belly. The low center
             of mass makes every squash and stretch read as soft and bouncy. */
          ctx.fillStyle = SKIN.outline;
          ctx.beginPath();
          ctx.moveTo(-6.2, SHOULDER_Y - 2);
          ctx.bezierCurveTo(-11.6, SHOULDER_Y, -15.5, -25, -14.2, -19);
          ctx.bezierCurveTo(-17, -12.2, -11.2, -7.4, 0, -7.4);
          ctx.bezierCurveTo(11.2, -7.4, 17, -12.2, 14.2, -19);
          ctx.bezierCurveTo(15.5, -25, 11.6, SHOULDER_Y, 6.2, SHOULDER_Y - 2);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        function drawRunnerHeroHead(offsetX, air, gait, frontOn) {
          const nod = gait > 0 ? Math.sin(hero.stride / 11) * 0.7 : Math.sin(simTime * 2.3) * 0.5;
          drawRunnerHead(offsetX * 0.55, HEAD_Y + nod, hero.stumbleUntil > simTime, frontOn);
        }

        function drawRunnerHead(x, y, hurt, frontOn) {
          ctx.save();
          ctx.translate(x, y);

          /* One continuous hood: a soft crown sweeps back into a long point,
             then pinches into the neck just beneath the eyes. */
          ctx.fillStyle = SKIN.outline;
          ctx.beginPath();
          ctx.moveTo(8.2, 5.2);
          ctx.bezierCurveTo(9.2, -2.8, 6.2, -9.4, -1.8, -11.2);
          ctx.bezierCurveTo(-8.4, -12.5, -13.1, -8.1, -15.2, -2.5);
          ctx.lineTo(frontOn ? -16.2 : -20.5, 7.4);
          ctx.lineTo(-3.4, 3.6);
          ctx.bezierCurveTo(-3.5, 8.1, 0.8, 10.5, 5.2, 8.7);
          ctx.bezierCurveTo(7.2, 7.9, 8, 6.7, 8.2, 5.2);
          ctx.closePath();
          ctx.fill();

          const eyeXs = frontOn ? [-2.6, 2.6] : [0.2, 5.2];
          const blinking = simTime < hero.blinkEndsAt;
          if (blinking && !hurt) {
            for (const eyeX of eyeXs) fillOval(eyeX, 0.2, 2.25, 0.8, SKIN.face);
          } else {
            for (const eyeX of eyeXs) {
              fillOval(eyeX, 0.2, 2.55, 3.25, SKIN.face);
              ctx.save();
              ctx.translate(hurt ? eyeX - 0.25 : eyeX + 0.65, hurt ? 0.8 : 0.45);
              if (hurt) ctx.rotate(-0.42);
              fillOval(0, 0, 1.05, 1.7, SKIN.outline);
              ctx.restore();
            }
          }

          ctx.restore();
        }

        function screenY(worldY) {
          return height - hudHeight() - (worldY - cameraY);
        }

        function sceneScreenX(worldX) {
          const rawX = worldLeft + worldX;
          return width * 0.5 + (rawX - width * 0.5) * SCENE_SCALE;
        }

        function sceneScreenY(worldY) {
          const rawY = screenY(worldY);
          return height * 0.5 + (rawY - height * 0.5) * SCENE_SCALE;
        }

        function inverseSceneScreenX(screenX) {
          const rawX = width * 0.5 + (screenX - width * 0.5) / SCENE_SCALE;
          return rawX - worldLeft;
        }

        function inverseSceneScreenY(screenPositionY) {
          const rawY = height * 0.5 + (screenPositionY - height * 0.5) / SCENE_SCALE;
          return cameraY + height - hudHeight() - rawY;
        }

        function marioIsOnStage(runner, margin = 0) {
          const sx = sceneScreenX(runner.x);
          const sy = sceneScreenY(runner.y);
          return sx > -26 - margin && sx < width + 26 + margin &&
            sy > -12 - margin && sy < height + 54 + margin;
        }

        /* -- INPUT (unchanged) -- */

        function onKeyDown(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = true;
            jumpBufferedUntil = simTime + 0.14;
            markManual();
            event.preventDefault();
          } else if (event.key === 'r' || event.key === 'R') {
            reset(randomSeed());
            event.preventDefault();
          }
        }

        function onKeyUp(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = false;
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = false;
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = false;
            event.preventDefault();
          }
        }

        function onPointerDown(event) {
          canvas.focus({ preventScroll: true });
          pointer.active = true;
          pointer.x = event.clientX;
          pointer.startX = event.clientX;
          pointer.startY = event.clientY;
          pointer.downAt = performance.now();
          pointer.moved = false;
          markManual();
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        }

        function onPointerMove(event) {
          if (!pointer.active) return;
          pointer.x = event.clientX;
          if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 8) pointer.moved = true;
          markManual();
          event.preventDefault();
        }

        function onPointerUp(event) {
          if (!pointer.active) return;
          const elapsed = performance.now() - pointer.downAt;
          const wasTap = elapsed < 180 && !pointer.moved;
          pointer.active = false;
          if (wasTap) reset(randomSeed());
          else manualUntil = simTime + 1.2;
          event.preventDefault();
        }

        function markManual() {
          manualUntil = simTime + 3.2;
        }

        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function rand(min, max) {
          return min + rng() * (max - min);
        }

        function mod(value, amount) {
          return ((value % amount) + amount) % amount;
        }

      })();
    </script>
  </body>
</html>
