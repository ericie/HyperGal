<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Up Mario · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --ink: #000000;
        --muted: #4a4a4a;
        --hot: #000000;
        --hud-height: 58px;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }

      body {
        font-family: Geneva, "Lucida Grande", ui-sans-serif, system-ui, sans-serif;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--bg);
        cursor: pointer;
        image-rendering: pixelated;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid var(--hot);
        outline-offset: -9px;
      }

      .hud {
        position: fixed;
        inset: auto 0 0;
        min-height: var(--hud-height);
        display: grid;
        grid-template-columns: minmax(132px, 0.9fr) minmax(0, 2.1fr);
        align-items: stretch;
        pointer-events: none;
        color: #000;
        background: #fff;
        border-top: 3px solid #000;
        font-size: 11px;
        line-height: 1.05;
        z-index: 2;
      }

      .hud__title {
        display: grid;
        align-content: center;
        padding: 5px clamp(10px, 2.4vw, 18px) 6px;
        border-right: 3px solid #000;
      }

      .hud__title strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(17px, 2.3vw, 25px);
        line-height: 0.9;
        font-weight: 900;
      }

      .hud__title span {
        margin-top: 4px;
        color: #222;
        font-size: 9px;
        font-weight: 700;
      }

      .hud__stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
      }

      .hud__stat {
        min-width: 0;
        height: 100%;
        display: grid;
        align-content: center;
        gap: 4px;
        padding: 4px clamp(8px, 2vw, 16px);
        border-right: 1px solid #000;
        font-size: 9px;
        font-weight: 800;
        overflow: hidden;
      }

      .hud__stat:last-child {
        border-right: 0;
      }

      .hud__stat b {
        display: block;
        overflow: hidden;
        font-size: clamp(12px, 1.8vw, 16px);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hud__meter {
        width: 100%;
        height: 5px;
        border: 1px solid #000;
      }

      .hud__meter::before {
        content: "";
        display: block;
        width: 68%;
        height: 100%;
        background: #000;
      }

      .hud span {
        font-variant-numeric: tabular-nums;
      }

      .hud [hidden] {
        display: none;
      }

      .debug {
        position: fixed;
        left: 0.85rem;
        bottom: calc(var(--hud-height) + 0.75rem);
        margin: 0;
        padding: 5px 7px;
        color: #fff;
        background: #000;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
        z-index: 3;
      }

      @media (max-width: 520px) {
        :root {
          --hud-height: 64px;
        }

        .hud {
          grid-template-columns: 124px minmax(0, 1fr);
        }

        .hud__title {
          padding-inline: 9px;
        }

        .hud__title strong {
          font-size: 16px;
        }

        .hud__stat {
          padding-inline: 6px;
          font-size: 8px;
        }

        .hud__stat b {
          font-size: 11px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Up Mario: a black-and-white castle platform hero climbs an endless masonry keep of stone ledges, iron ladders, stairs, poles, and question mark boxes."
    ></canvas>
    <div class="hud" aria-hidden="true">
      <div class="hud__title">
        <strong>UP MARIO</strong>
        <span>THE ENDLESS KEEP</span>
      </div>
      <div class="hud__stats">
        <span class="hud__stat">
          HEIGHT
          <b id="heightReadout">0000 M</b>
        </span>
        <span class="hud__stat">
          BOXES
          <b id="coinReadout">? 00</b>
        </span>
        <span class="hud__stat">
          GRIP
          <i class="hud__meter"></i>
          <b id="seedReadout" hidden>seed</b>
        </span>
      </div>
    </div>
    <pre id="debug" class="debug" hidden></pre>

    <script>
      (() => {
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const heightReadout = document.getElementById('heightReadout');
        const coinReadout = document.getElementById('coinReadout');
        const seedReadout = document.getElementById('seedReadout');
        const debugEl = document.getElementById('debug');
        const params = new URLSearchParams(location.search);
        const reduceQuery =
          typeof matchMedia === 'function'
            ? matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        const DEBUG = params.has('debug');
        const TAU = Math.PI * 2;
        const GRAVITY = -1580;
        const RUN_SPEED = 286;
        const AIR_SPEED = 246;
        const JUMP_SPEED = 735;
        const SPRING_SPEED = 870;
        const HERO_W = 28;
        const HERO_H = 44;
        const LAUNCH_MARGIN = 20;
        const MIN_TARGET_GAP = 30;
        const MAX_TARGET_GAP = 156;
        const STALL_SECONDS = 2.35;
        const NO_ROUTE_SECONDS = 1.05;
        const BOX_ATTEMPT_SECONDS = 1.75;
        const BOX_SIZE = 26;
        const BOX_BOTTOM_OFFSET = 60;
        const LINK_REACH = 14;
        const LINK_SPEEDS = {
          ladder: 112,
          stairs: 148,
          pole: 330,
        };
        const COLORS = {
          paper: '#ffffff',
          paperDim: '#d8d8d8',
          ink: '#000000',
          softInk: 'rgba(0, 0, 0, 0.55)',
          faint: 'rgba(0, 0, 0, 0.16)',
          lighter: 'rgba(0, 0, 0, 0.08)',
          white: '#ffffff',
          shadow: 'rgba(0, 0, 0, 0.34)',
          skyTop: '#ffffff',
          skyBottom: '#ffffff',
          shaft: '#ffffff',
          shaftEdge: '#000000',
          grid: 'rgba(0, 0, 0, 0.16)',
          brick: '#ffffff',
          brickDark: '#000000',
          brickLight: '#ffffff',
          girder: '#ffffff',
          girderDark: '#000000',
          girderLight: '#ffffff',
          rail: '#000000',
          railDark: '#000000',
          coin: '#000000',
          coinHot: '#ffffff',
          spring: '#ffffff',
          springDark: '#000000',
          barrel: '#ffffff',
          barrelDark: '#000000',
          barrelBand: '#000000',
          heroRed: '#ffffff',
          heroRedDark: '#000000',
          skin: '#ffffff',
          skinDark: '#000000',
          denim: '#ffffff',
          denimDark: '#000000',
          boot: '#000000',
          smoke: 'rgba(0, 0, 0, 0.5)',
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let worldWidth = 420;
        let worldLeft = 0;
        let cameraY = 0;
        let highestCameraY = 0;
        let highestPlatformY = 0;
        let lastPlatform = null;
        let raf = 0;
        let lastFrameAt = 0;
        let simTime = 0;
        let prefersReducedMotion = reduceQuery.matches;
        let seed = params.get('seed') || randomSeed();
        let rng = Math.random;
        let hero = null;
        let platforms = [];
        let barrels = [];
        let boxes = [];
        let links = [];
        let particles = [];
        let keys = {
          left: false,
          right: false,
          jump: false,
        };
        let pointer = {
          active: false,
          x: 0,
          startX: 0,
          startY: 0,
          downAt: 0,
          moved: false,
        };
        let manualUntil = 0;
        let jumpBufferedUntil = 0;
        let bestHeight = 0;
        let boxesHit = 0;
        let platformCount = 0;
        let barrelCount = 0;
        let boxCount = 0;
        let linkCount = 0;
        let targetPlatformId = null;
        let targetBoxId = null;
        let targetLinkId = null;
        let rescueCount = 0;
        let downTrips = 0;
        let ladderTrips = 0;
        let stairTrips = 0;
        let poleSlides = 0;
        let lastProgressAt = 0;
        let lastProgressHeight = 0;
        let skippedBoxes = 0;
        let recoveryCount = 0;

        debugEl.hidden = !DEBUG;
        resize();
        reset(seed);
        addEventListener('resize', resize, { passive: true });
        addEventListener('keydown', onKeyDown);
        addEventListener('keyup', onKeyUp);
        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointercancel', onPointerUp);
        if (typeof reduceQuery.addEventListener === 'function') {
          reduceQuery.addEventListener('change', (event) => {
            prefersReducedMotion = event.matches;
          });
        } else if (typeof reduceQuery.addListener === 'function') {
          reduceQuery.addListener((event) => {
            prefersReducedMotion = event.matches;
          });
        }

        function randomSeed() {
          return Math.floor(Math.random() * 0xffffffff).toString(36);
        }

        function xmur3(str) {
          let h = 1779033703 ^ str.length;
          for (let i = 0; i < str.length; i += 1) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return function nextHash() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return function nextRandom() {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function reset(nextSeed = randomSeed()) {
          cancelAnimationFrame(raf);
          seed = String(nextSeed || randomSeed());
          rng = mulberry32(xmur3(seed)());
          simTime = 0;
          lastFrameAt = 0;
          cameraY = 0;
          highestCameraY = 0;
          bestHeight = 0;
          boxesHit = 0;
          platformCount = 0;
          barrelCount = 0;
          boxCount = 0;
          linkCount = 0;
          rescueCount = 0;
          downTrips = 0;
          ladderTrips = 0;
          stairTrips = 0;
          poleSlides = 0;
          skippedBoxes = 0;
          recoveryCount = 0;
          targetPlatformId = null;
          targetBoxId = null;
          targetLinkId = null;
          platforms = [];
          barrels = [];
          boxes = [];
          links = [];
          particles = [];
          lastPlatform = makePlatform(worldWidth * 0.5, 88, Math.min(230, worldWidth * 0.74), 'brick', false);
          platforms.push(lastPlatform);
          addQuestionBoxesForPlatform(lastPlatform);
          highestPlatformY = lastPlatform.y;
          while (highestPlatformY < height * 1.75) addPlatform();
          hero = {
            x: lastPlatform.x + lastPlatform.w * 0.5,
            y: lastPlatform.y,
            previousY: lastPlatform.y,
            vx: 0,
            vy: 0,
            facing: 1,
            grounded: true,
            groundId: lastPlatform.id,
            lastGroundedAt: 0,
            landedAt: 0,
            groundedSince: 0,
            jumpCooldownUntil: 0,
            stumbleUntil: 0,
            blinkUntil: 0,
            rescuedUntil: 0,
            autoTargetId: null,
            autoLaunchX: null,
            autoLandingX: null,
            routeAttemptTargetId: null,
            routeAttemptFromId: null,
            routeAttemptStartedAt: 0,
            onLink: null,
            boxTargetId: null,
            boxAttemptId: null,
            boxAttemptStartedAt: 0,
            boxAttemptJumps: 0,
            revisitPlatformId: null,
            revisitCooldownUntil: 0,
            noRouteSince: 0,
          };
          lastProgressAt = 0;
          lastProgressHeight = 0;
          seedReadout.textContent = seed;
          const warmSeconds = Math.max(0, Number(params.get('warm') || 0) || 0);
          if (warmSeconds > 0) {
            const steps = Math.min(2400, Math.floor(warmSeconds * 60));
            for (let i = 0; i < steps; i += 1) update(1 / 60);
          }
          raf = requestAnimationFrame(tick);
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
          worldWidth = Math.round(clamp(width * (width < 560 ? 0.94 : 0.74), 300, 820));
          worldLeft = Math.round((width - worldWidth) / 2);
        }

        function tick(now) {
          if (!lastFrameAt) lastFrameAt = now;
          const rawDt = clamp((now - lastFrameAt) / 1000, 0.001, 0.045);
          lastFrameAt = now;
          const dt = rawDt * (prefersReducedMotion ? 0.45 : 1);
          update(dt);
          render();
          raf = requestAnimationFrame(tick);
        }

        function update(dt) {
          simTime += dt;
          extendWorld();
          updateControls(dt);
          updateHero(dt);
          updateBarrels(dt);
          updateQuestionBoxes();
          updateParticles(dt);
          updateCamera(dt);
          rescueIfNeeded();
          recoverIfStalled();
          trimWorld();
          updateHud();
        }

        function updateControls(dt) {
          if (keys.jump && simTime > jumpBufferedUntil) jumpBufferedUntil = simTime + 0.12;
          if (manualActive()) {
            targetPlatformId = null;
            return;
          }
          planAutopilot(dt);
        }

        function updateHero(dt) {
          hero.previousY = hero.y;
          if (hero.onLink) {
            updateLinkTravel(dt);
            return;
          }

          let desiredVx = 0;
          const manual = manualActive();

          if (manual) {
            desiredVx = manualDesiredVx();
          } else {
            desiredVx = hero.autoVx || 0;
          }

          const maxSpeed = hero.grounded ? RUN_SPEED : AIR_SPEED;
          desiredVx = clamp(desiredVx, -maxSpeed, maxSpeed);
          const accel = hero.grounded ? 18 : 8;
          hero.vx += (desiredVx - hero.vx) * (1 - Math.exp(-accel * dt));
          hero.vx = clamp(hero.vx, -maxSpeed, maxSpeed);
          if (Math.abs(hero.vx) > 12) hero.facing = hero.vx > 0 ? 1 : -1;

          const canBufferedJump =
            jumpBufferedUntil > simTime &&
            simTime >= hero.jumpCooldownUntil &&
            (hero.grounded || simTime - hero.lastGroundedAt < 0.09);
          if (canBufferedJump) {
            jump(false);
            jumpBufferedUntil = 0;
          }

          hero.x += hero.vx * dt;
          hero.vy += GRAVITY * dt;
          hero.y += hero.vy * dt;
          keepHeroInShaft();
          collidePlatforms();
        }

        function planAutopilot() {
          hero.autoVx = 0;
          targetBoxId = null;
          targetLinkId = null;

          if (!hero.grounded) {
            const target = activeAirTarget() || chooseAirLandingTarget();
            targetPlatformId = target ? target.id : null;
            if (!target) return;
            hero.noRouteSince = 0;
            const landingX = safeLandingX(target, hero.autoLandingX ?? platformCenter(target));
            hero.autoLandingX = landingX;
            hero.autoVx = clamp((landingX - hero.x) * 4.2, -AIR_SPEED, AIR_SPEED);
            return;
          }

          const current = platformById(hero.groundId);
          if (!current) {
            targetPlatformId = null;
            hero.autoVx = clamp((worldWidth * 0.5 - hero.x) * 2.8, -RUN_SPEED, RUN_SPEED);
            return;
          }

          const localBox = chooseLocalQuestionBox(current);
          if (localBox) {
            planQuestionBox(current, localBox);
            return;
          }
          clearBoxAttempt();

          const downLink = chooseDownRevisitLink(current);
          if (downLink) {
            hero.noRouteSince = 0;
            followLinkPlan(current, downLink, -1);
            return;
          }

          const upLink = chooseUpLink(current);
          if (upLink) {
            hero.noRouteSince = 0;
            followLinkPlan(current, upLink, 1);
            return;
          }

          const route = chooseTargetRoute(current);
          targetPlatformId = route ? route.target.id : null;
          if (!route) {
            if (!hero.noRouteSince) hero.noRouteSince = simTime;
            hero.autoVx = clamp((platformCenter(current) - hero.x) * 2.8, -RUN_SPEED, RUN_SPEED);
            if (simTime - hero.noRouteSince > NO_ROUTE_SECONDS && simTime > (current.recoveryCooldownUntil || 0)) {
              if (addRecoveryPlatform(current)) {
                current.recoveryCooldownUntil = simTime + 2.4;
                hero.noRouteSince = simTime;
                lastProgressAt = simTime;
              }
            }
            return;
          }
          hero.noRouteSince = 0;

          hero.autoTargetId = route.target.id;
          hero.autoLaunchX = route.launchX;
          hero.autoLandingX = route.landingX;

          const launchDx = route.launchX - hero.x;
          const landingDx = route.landingX - hero.x;
          const atLaunch = Math.abs(launchDx) < Math.max(10, current.w * 0.07);
          hero.autoVx = atLaunch
            ? clamp(landingDx * 3.6, -RUN_SPEED, RUN_SPEED)
            : clamp(launchDx * 4.8, -RUN_SPEED, RUN_SPEED);

          if (atLaunch && simTime >= hero.jumpCooldownUntil) {
            jump(false, route);
          }
        }

        function planQuestionBox(current, box) {
          targetBoxId = box.id;
          hero.boxTargetId = box.id;
          hero.noRouteSince = 0;

          if (hero.boxAttemptId !== box.id) {
            hero.boxAttemptId = box.id;
            hero.boxAttemptStartedAt = simTime;
            hero.boxAttemptJumps = 0;
          }

          const attemptAge = simTime - hero.boxAttemptStartedAt;
          if (attemptAge > BOX_ATTEMPT_SECONDS || hero.boxAttemptJumps >= 3) {
            skipQuestionBox(current, box);
            return;
          }

          const left = platformLeft(current) + HERO_W * 0.65 + 6;
          const right = platformLeft(current) + current.w - HERO_W * 0.65 - 6;
          const targetX = clamp(box.x, left, right);
          const dx = targetX - hero.x;
          hero.autoVx = clamp(dx * 4.8, -RUN_SPEED, RUN_SPEED);
          if (Math.abs(dx) < 11 && simTime >= hero.jumpCooldownUntil) {
            hero.boxAttemptJumps += 1;
            jump(false);
          }
        }

        function skipQuestionBox(current, box) {
          box.skipUntil = simTime + 8;
          box.failedAt = simTime;
          skippedBoxes += 1;
          clearBoxAttempt();
          targetBoxId = null;
          current.boxSkips = (current.boxSkips || 0) + 1;
          if ((current.boxHits || 0) + current.boxSkips >= current.boxQuota) {
            current.boxQuota = current.boxHits || 0;
          }
        }

        function clearBoxAttempt() {
          hero.boxTargetId = null;
          hero.boxAttemptId = null;
          hero.boxAttemptStartedAt = 0;
          hero.boxAttemptJumps = 0;
        }

        function activeAirTarget() {
          const target = platformById(hero.autoTargetId);
          if (!target) return null;
          const missedBy = target.y - hero.y;
          if (missedBy > MAX_TARGET_GAP || hero.y < target.y - 52) return null;
          return target;
        }

        function chooseAirLandingTarget() {
          let best = null;
          for (const platform of platforms) {
            if (platform.y > hero.y + 34 || platform.y < hero.y - 210) continue;
            const left = platformLeft(platform) + landingMargin(platform);
            const right = platformLeft(platform) + platform.w - landingMargin(platform);
            const xGap = hero.x < left ? left - hero.x : hero.x > right ? hero.x - right : 0;
            const timeBias = hero.vy > 0 && platform.y < hero.y - 30 ? 70 : 0;
            if (xGap > AIR_SPEED * 1.05) continue;
            const score = xGap * 1.8 + Math.abs(hero.y - platform.y) * 0.22 + timeBias - platform.y * 0.02;
            if (!best || score < best.score) best = { ...platform, score };
          }
          return best;
        }

        function chooseLocalQuestionBox(current) {
          const available = boxes
            .filter((box) => !box.hit && box.platformId === current.id && (!box.skipUntil || box.skipUntil < simTime))
            .sort((a, b) => Math.abs(a.x - hero.x) - Math.abs(b.x - hero.x));
          if (!available.length) {
            if (hero.revisitPlatformId === current.id) {
              hero.revisitPlatformId = null;
              hero.revisitCooldownUntil = simTime + rand(8, 14);
            }
            return null;
          }

          if (current.boxQuota == null) {
            const quotaRoll = rng();
            current.boxQuota = quotaRoll < 0.18 ? 0 : quotaRoll < 0.78 ? 1 : Math.min(2, available.length);
            current.boxHits = current.boxHits || 0;
          }
          if (hero.revisitPlatformId === current.id) current.boxQuota = Math.max(current.boxQuota, current.boxHits + 1);
          if ((current.boxHits || 0) >= current.boxQuota) return null;
          return available[0];
        }

        function chooseDownRevisitLink(current) {
          if (simTime < hero.revisitCooldownUntil || hero.revisitPlatformId) return null;
          if (!current.revisitChecked) {
            current.revisitChecked = true;
            current.revisitIntent = rng() < 0.46;
          }
          if (!current.revisitIntent) return null;

          const candidates = links
            .filter((link) => link.upperId === current.id)
            .filter((link) => {
              const lower = platformById(link.lowerId);
              if (!lower || lower.y <= cameraY - 120) return false;
              if (platformHasUnhitBoxes(link.lowerId)) return true;
              return link.kind === 'pole' && routeToPlatform(lower, current);
            })
            .sort((a, b) => linkDownScore(a) - linkDownScore(b));
          if (!candidates.length) return null;
          current.revisitIntent = false;
          hero.revisitPlatformId = candidates[0].lowerId;
          return candidates[0];
        }

        function chooseUpLink(current) {
          const candidates = links
            .filter((link) => link.lowerId === current.id && link.kind !== 'pole')
            .filter((link) => platformById(link.upperId))
            .sort((a, b) => platformById(a.upperId).y - platformById(b.upperId).y);
          if (!candidates.length) return null;
          return candidates[0];
        }

        function followLinkPlan(current, link, dir) {
          targetLinkId = link.id;
          targetPlatformId = dir > 0 ? link.upperId : link.lowerId;
          const entryX = dir > 0 ? link.x1 : link.x2;
          const dx = entryX - hero.x;
          hero.autoVx = clamp(dx * 4.4, -RUN_SPEED, RUN_SPEED);
          if (Math.abs(dx) < LINK_REACH && simTime >= hero.jumpCooldownUntil) startLink(link, dir);
        }

        function startLink(link, dir) {
          hero.onLink = { linkId: link.id, dir, t: dir > 0 ? 0 : 1 };
          clearRouteAttempt();
          hero.grounded = false;
          hero.groundId = null;
          hero.vx = 0;
          hero.vy = 0;
          hero.x = dir > 0 ? link.x1 : link.x2;
          hero.y = dir > 0 ? link.y1 : link.y2;
          targetLinkId = link.id;
          if (dir < 0) downTrips += 1;
          if (link.kind === 'ladder') ladderTrips += 1;
          else if (link.kind === 'stairs') stairTrips += 1;
          else if (link.kind === 'pole' && dir < 0) poleSlides += 1;
          spawnDust(hero.x, hero.y, 8, COLORS.smoke);
        }

        function updateLinkTravel(dt) {
          const link = linkById(hero.onLink.linkId);
          if (!link) {
            hero.onLink = null;
            return;
          }
          const span = Math.max(1, link.y2 - link.y1);
          const dir = hero.onLink.dir;
          const baseSpeed = link.kind === 'pole' && dir < 0 ? LINK_SPEEDS.pole : LINK_SPEEDS[link.kind];
          hero.onLink.t = clamp(hero.onLink.t + (dir * baseSpeed * dt) / span, 0, 1);
          hero.previousY = hero.y;
          hero.x = lerp(link.x1, link.x2, hero.onLink.t);
          hero.y = lerp(link.y1, link.y2, hero.onLink.t);
          hero.facing = link.x2 >= link.x1 ? 1 : -1;

          if ((dir > 0 && hero.onLink.t >= 1) || (dir < 0 && hero.onLink.t <= 0)) {
            finishLink(link, dir);
          }
        }

        function finishLink(link, dir) {
          const platform = platformById(dir > 0 ? link.upperId : link.lowerId);
          hero.onLink = null;
          if (!platform) return;
          hero.x = dir > 0 ? link.x2 : link.x1;
          hero.y = platform.y;
          hero.previousY = hero.y;
          hero.vx = 0;
          hero.vy = 0;
          hero.grounded = true;
          hero.groundId = platform.id;
          hero.lastGroundedAt = simTime;
          hero.landedAt = simTime;
          hero.groundedSince = simTime;
          hero.autoTargetId = null;
          hero.autoLaunchX = null;
          hero.autoLandingX = null;
          clearRouteAttempt();
          platform.visited = true;
          platform.pulseUntil = simTime + 0.18;
          if (dir > 0 && hero.revisitPlatformId === platform.id) hero.revisitPlatformId = null;
          spawnDust(hero.x, hero.y, 8, COLORS.smoke);
        }

        function linkDownScore(link) {
          const lower = platformById(link.lowerId);
          if (!lower) return Infinity;
          return (link.kind === 'pole' ? -32 : 0) + Math.abs(link.x2 - hero.x) + (hero.y - lower.y) * 0.15;
        }

        function platformHasUnhitBoxes(platformId) {
          return boxes.some((box) => box.platformId === platformId && !box.hit);
        }

        function chooseTargetRoute(current, jumpSpeed = JUMP_SPEED) {
          let best = null;
          for (const platform of platforms) {
            if (platform.id === current.id) continue;
            if (platform.avoidUntil && platform.avoidUntil > simTime) continue;
            const route = routeToPlatform(current, platform, jumpSpeed);
            if (!route) continue;
            const widthBonus = Math.min(44, platform.w * 0.24);
            const motionCost = platform.moving ? 28 : 0;
            route.score = route.gap * 2.4 + route.dx * 0.9 + motionCost - widthBonus + platform.id * 0.0001;
            if (!best || route.score < best.score) best = route;
          }
          return best;
        }

        function routeToPlatform(current, target, jumpSpeed = JUMP_SPEED) {
          const gap = target.y - current.y;
          const maxGap = jumpSpeed > JUMP_SPEED ? MAX_TARGET_GAP + 74 : MAX_TARGET_GAP;
          if (gap < MIN_TARGET_GAP || gap > maxGap) return null;
          if (target.w < HERO_W + 54) return null;

          const flightTime = jumpFlightTime(gap, jumpSpeed);
          if (!flightTime) return null;

          const currentLeft = platformLeft(current);
          const currentRight = currentLeft + current.w;
          const targetLeft = platformLeft(target);
          const targetRight = targetLeft + target.w;
          const currentMargin = Math.min(LAUNCH_MARGIN, current.w * 0.28);
          const targetMargin = landingMargin(target);
          let landingX = platformCenter(target);

          if (targetLeft > currentRight) {
            landingX = targetLeft + targetMargin;
          } else if (targetRight < currentLeft) {
            landingX = targetRight - targetMargin;
          } else {
            landingX = clamp(platformCenter(current), targetLeft + targetMargin, targetRight - targetMargin);
          }

          let launchX = landingX;
          if (landingX > currentRight - currentMargin) {
            launchX = currentRight - currentMargin;
          } else if (landingX < currentLeft + currentMargin) {
            launchX = currentLeft + currentMargin;
          } else {
            launchX = clamp(landingX, currentLeft + currentMargin, currentRight - currentMargin);
          }

          const dx = Math.abs(landingX - launchX);
          const maxDx = AIR_SPEED * flightTime * 0.88;
          if (dx > maxDx) return null;

          return { target, launchX, landingX, gap, dx, flightTime, score: 0 };
        }

        function jumpFlightTime(gap, speed) {
          const gravity = -GRAVITY;
          const disc = speed * speed - 2 * gravity * gap;
          if (disc <= 0) return 0;
          return (speed + Math.sqrt(disc)) / gravity;
        }

        function landingMargin(platform) {
          return clamp(platform.w * (platform.moving ? 0.32 : 0.24), 20, 38);
        }

        function safeLandingX(platform, x) {
          const left = platformLeft(platform) + landingMargin(platform);
          const right = platformLeft(platform) + platform.w - landingMargin(platform);
          return clamp(x, left, right);
        }

        function platformCenter(platform) {
          return platformLeft(platform) + platform.w * 0.5;
        }

        function manualDesiredVx() {
          let desired = 0;
          if (keys.left) desired -= RUN_SPEED;
          if (keys.right) desired += RUN_SPEED;
          if (pointer.active) {
            const worldX = pointer.x - worldLeft;
            const dx = worldX - hero.x;
            if (Math.abs(dx) > 14) desired = clamp(dx * 3.8, -RUN_SPEED, RUN_SPEED);
          }
          return desired;
        }

        function manualActive() {
          return keys.left || keys.right || keys.jump || pointer.active || simTime < manualUntil;
        }

        function jump(superJump, route) {
          hero.vy = superJump ? SPRING_SPEED : JUMP_SPEED;
          const fromId = hero.groundId;
          hero.grounded = false;
          hero.groundId = null;
          hero.autoTargetId = route ? route.target.id : null;
          hero.autoLaunchX = route ? route.launchX : null;
          hero.autoLandingX = route ? route.landingX : null;
          hero.routeAttemptTargetId = route ? route.target.id : null;
          hero.routeAttemptFromId = route ? fromId : null;
          hero.routeAttemptStartedAt = route ? simTime : 0;
          hero.jumpCooldownUntil = simTime + 0.11;
          spawnDust(hero.x, hero.y, superJump ? 18 : 11, COLORS.smoke);
        }

        function keepHeroInShaft() {
          const half = HERO_W * 0.5;
          if (hero.x < half + 4) {
            hero.x = half + 4;
            hero.vx = Math.max(0, hero.vx) * 0.24;
          } else if (hero.x > worldWidth - half - 4) {
            hero.x = worldWidth - half - 4;
            hero.vx = Math.min(0, hero.vx) * 0.24;
          }
        }

        function collidePlatforms() {
          const wasGrounded = hero.grounded;
          const previousGroundId = hero.groundId;
          hero.grounded = false;
          let landed = null;
          if (hero.vy <= 0) {
            const half = HERO_W * 0.42;
            for (const platform of platforms) {
              const left = platformLeft(platform);
              const right = left + platform.w;
              if (hero.x + half < left || hero.x - half > right) continue;
              if (hero.previousY >= platform.y && hero.y <= platform.y + 2) {
                landed = platform;
                break;
              }
            }
          }

          if (!landed) return;
          const isNewLanding = !wasGrounded || previousGroundId !== landed.id;
          hero.y = landed.y;
          hero.vy = 0;
          hero.grounded = true;
          hero.groundId = landed.id;
          hero.lastGroundedAt = simTime;
          if (isNewLanding) {
            markRouteAttemptResult(landed);
            hero.landedAt = simTime;
            hero.groundedSince = simTime;
            hero.autoTargetId = null;
            hero.autoLaunchX = null;
            hero.autoLandingX = null;
          }
          if (!landed.visited) {
            landed.visited = true;
            landed.pulseUntil = simTime + 0.24;
            spawnDust(hero.x, hero.y, 8, COLORS.coin);
          }
          if (landed.spring && Math.abs(hero.x - (platformLeft(landed) + landed.w * 0.5)) < landed.w * 0.35) {
            jump(true, chooseTargetRoute(landed, SPRING_SPEED));
          }
        }

        function markRouteAttemptResult(landed) {
          if (!hero.routeAttemptTargetId) return;
          if (landed.id !== hero.routeAttemptTargetId && simTime - hero.routeAttemptStartedAt > 0.22) {
            const missed = platformById(hero.routeAttemptTargetId);
            if (missed) {
              missed.missCount = (missed.missCount || 0) + 1;
              missed.avoidUntil = simTime + clamp(2.5 + missed.missCount * 1.6, 3, 8);
            }
          }
          clearRouteAttempt();
        }

        function clearRouteAttempt() {
          hero.routeAttemptTargetId = null;
          hero.routeAttemptFromId = null;
          hero.routeAttemptStartedAt = 0;
        }

        function updateCamera(dt) {
          const target = hero.y - height * 0.48;
          highestCameraY = Math.max(highestCameraY, target);
          cameraY += (highestCameraY - cameraY) * (1 - Math.exp(-2.7 * dt));
          bestHeight = Math.max(bestHeight, Math.max(0, hero.y - 88));
          if (bestHeight > lastProgressHeight + 38) {
            lastProgressHeight = bestHeight;
            lastProgressAt = simTime;
          }
        }

        function rescueIfNeeded() {
          if (hero.y > cameraY - 210) return;
          const platform = platforms
            .filter((p) => p.y > cameraY + height * 0.18 && p.y < cameraY + height * 0.78)
            .sort((a, b) => a.y - b.y)[0];
          const landing = platform || platforms[platforms.length - 1];
          const left = platformLeft(landing);
          hero.x = left + landing.w * 0.5;
          hero.y = landing.y + 4;
          hero.previousY = hero.y;
          hero.vx = 0;
          hero.vy = JUMP_SPEED * 0.72;
          hero.grounded = false;
          hero.groundId = null;
          clearRouteAttempt();
          hero.rescuedUntil = simTime + 0.6;
          rescueCount += 1;
          lastProgressAt = simTime;
          spawnDust(hero.x, hero.y, 24, COLORS.ink);
        }

        function recoverIfStalled() {
          if (manualActive()) return;
          if (simTime - lastProgressAt < STALL_SECONDS) return;
          if (!hero.grounded) {
            if (hero.onLink) return;
            const landing = chooseAirLandingTarget() || nearestLowerPlatform();
            if (!landing) return;
            hero.x = safeLandingX(landing, hero.x);
            hero.y = landing.y;
            hero.previousY = hero.y;
            hero.vx = 0;
            hero.vy = 0;
            hero.grounded = true;
            hero.groundId = landing.id;
            hero.lastGroundedAt = simTime;
            hero.landedAt = simTime;
            hero.groundedSince = simTime;
            hero.autoTargetId = null;
            hero.autoLaunchX = null;
            hero.autoLandingX = null;
            clearRouteAttempt();
            lastProgressAt = simTime;
            addRecoveryPlatform(landing);
            spawnDust(hero.x, hero.y, 16, COLORS.ink);
            return;
          }
          const current = platformById(hero.groundId);
          if (!current) return;
          if (addRecoveryPlatform(current)) {
            current.recoveryCooldownUntil = simTime + 2.4;
            lastProgressAt = simTime;
          }
        }

        function nearestLowerPlatform() {
          let best = null;
          for (const platform of platforms) {
            if (platform.y > hero.y + 28 || platform.y < cameraY - 120) continue;
            const x = safeLandingX(platform, hero.x);
            const score = Math.abs(x - hero.x) * 1.4 + Math.abs(hero.y - platform.y) * 0.3 - platform.y * 0.015;
            if (!best || score < best.score) best = { ...platform, score };
          }
          return best;
        }

        function updateBarrels(dt) {
          for (const barrel of barrels) {
            const platform = platformById(barrel.platformId);
            if (!platform) {
              barrel.dead = true;
              continue;
            }
            barrel.offset += barrel.dir * barrel.speed * dt;
            const min = barrel.radius + 5;
            const max = platform.w - barrel.radius - 5;
            if (barrel.offset < min) {
              barrel.offset = min;
              barrel.dir = 1;
            } else if (barrel.offset > max) {
              barrel.offset = max;
              barrel.dir = -1;
            }
            barrel.roll += (barrel.dir * barrel.speed * dt) / barrel.radius;
            const bx = platformLeft(platform) + barrel.offset;
            const by = platform.y + barrel.radius;
            const dx = hero.x - bx;
            const dy = hero.y - by;
            if (Math.abs(dx) < HERO_W * 0.58 + barrel.radius && Math.abs(dy) < HERO_H * 0.45 && simTime > barrel.bumpCooldownUntil) {
              const push = dx >= 0 ? 1 : -1;
              hero.vx += push * 190;
              hero.vy = Math.max(hero.vy, 250);
              hero.stumbleUntil = simTime + 0.36;
              hero.blinkUntil = simTime + 0.14;
              barrel.bumpCooldownUntil = simTime + 0.9;
              spawnDust(hero.x, hero.y - HERO_H * 0.35, 16, COLORS.ink);
            }
          }
          barrels = barrels.filter((barrel) => !barrel.dead);
        }

        function updateQuestionBoxes() {
          const headY = hero.y + HERO_H + 12;
          const previousHeadY = hero.previousY + HERO_H + 12;
          for (const box of boxes) {
            if (box.hit) continue;
            const withinX = Math.abs(hero.x - box.x) < BOX_SIZE * 0.62;
            const hitFromBelow = hero.vy > 0 && previousHeadY <= box.y && headY >= box.y;
            if (withinX && hitFromBelow) {
              hitQuestionBox(box);
              break;
            }
          }
        }

        function hitQuestionBox(box) {
          box.hit = true;
          box.hitAt = simTime;
          boxesHit += 1;
          hero.vy = Math.min(hero.vy, 96);
          hero.blinkUntil = simTime + 0.12;
          clearBoxAttempt();
          targetBoxId = null;
          const platform = platformById(box.platformId);
          if (platform) platform.boxHits = (platform.boxHits || 0) + 1;
          if (hero.revisitPlatformId === box.platformId && !platformHasUnhitBoxes(box.platformId)) {
            hero.revisitPlatformId = null;
            hero.revisitCooldownUntil = simTime + rand(8, 15);
          }
          spawnDust(box.x, box.y + BOX_SIZE * 0.5, 18, COLORS.ink);
        }

        function updateParticles(dt) {
          for (const particle of particles) {
            particle.age += dt;
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy += GRAVITY * 0.18 * dt;
          }
          particles = particles.filter((particle) => particle.age < particle.life);
        }

        function extendWorld() {
          while (highestPlatformY < cameraY + height * 1.75) addPlatform();
        }

        function trimWorld() {
          const cutoff = cameraY - 240;
          platforms = platforms.filter((platform) => platform.y > cutoff || platform.id === hero.groundId);
          barrels = barrels.filter((barrel) => {
            const platform = platformById(barrel.platformId);
            return platform && platform.y > cutoff;
          });
          boxes = boxes.filter((box) => box.y > cutoff);
          links = links.filter((link) => link.y2 > cutoff && platformById(link.lowerId) && platformById(link.upperId));
        }

        function addPlatform() {
          const previous = lastPlatform;
          const gap = rand(height < 620 ? 112 : 118, height < 620 ? 138 : 150);
          const y = previous.y + gap;
          const minW = clamp(worldWidth * 0.24, 92, 128);
          const maxW = clamp(worldWidth * 0.4, 148, 220);
          const w = rand(minW, maxW) * (rng() < 0.12 ? 1.14 : 1);
          const maxShift = clamp(gap * 0.92 + (previous.w + w) * 0.26, 112, Math.min(188, worldWidth * 0.36));
          const previousCenter = platformLeft(previous) + previous.w * 0.5;
          let center = previousCenter;
          let foundReachable = false;
          for (let attempt = 0; attempt < 28; attempt += 1) {
            const candidateCenter = clamp(previousCenter + rand(-maxShift, maxShift), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
            const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
            center = candidateCenter;
            if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
              foundReachable = true;
              break;
            }
          }
          if (!foundReachable) {
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const candidateCenter = clamp(previousCenter + rand(-72, 72), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: candidateCenter - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
              if (routeToPlatform(previous, candidate) && canPlacePlatform(candidate)) {
                center = candidateCenter;
                foundReachable = true;
                break;
              }
            }
            if (!foundReachable) center = clamp(previousCenter, w * 0.5 + 12, worldWidth - w * 0.5 - 12);
          }
          const type = rng() < 0.18 ? 'girder' : 'brick';
          const moving = y > 800 && w > 136 && rng() < 0.06;
          const platform = makePlatform(center, y, w, type, moving);
          platform.spring = false;
          platforms.push(platform);
          maybeAddLink(previous, platform);
          lastPlatform = platform;
          highestPlatformY = y;

          addQuestionBoxesForPlatform(platform);
          addBranchPlatforms(previous, platform);
          if (y > 520 && !platform.moving && rng() < 0.08) addBarrel(platform);
        }

        function addRecoveryPlatform(current) {
          const w = clamp(worldWidth * 0.34, 118, 184);
          let platform = null;
          for (const relaxed of [false, true]) {
            for (let attempt = 0; attempt < 28; attempt += 1) {
              const y = current.y + rand(98, 150);
              const center = clamp(platformCenter(current) + rand(-82, 82), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: center - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
              if (routeToPlatform(current, candidate) && canPlacePlatform(candidate, relaxed ? 'relaxed' : 'strict')) {
                platform = makePlatform(center, y, w, 'brick', false);
                break;
              }
            }
            if (platform) break;
          }
          if (!platform) {
            const y = current.y + 150;
            const center = clamp(platformCenter(current), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
            const candidate = { x: center - w * 0.5, y, w, h: 18, moving: false, travel: 0 };
            if (routeToPlatform(current, candidate) && canPlacePlatform(candidate, 'relaxed')) {
              platform = makePlatform(center, y, w, 'brick', false);
            }
          }
          if (!platform) return false;
          platform.pulseUntil = simTime + 0.55;
          platforms.push(platform);
          platforms.sort((a, b) => a.y - b.y);
          recoveryCount += 1;
          if (platform.y > highestPlatformY) {
            lastPlatform = platform;
            highestPlatformY = platform.y;
          }
          maybeAddLink(current, platform, 'ladder');
          addQuestionBoxesForPlatform(platform, true);
          spawnDust(platformCenter(platform), platform.y, 18, COLORS.coin);
          return true;
        }

        function addBranchPlatforms(previous, trunk) {
          const roll = rng();
          const branchCount = roll < 0.34 ? 1 : 0;
          for (let i = 0; i < branchCount; i += 1) {
            const base = trunk;
            const baseCenter = platformCenter(base);
            const side = baseCenter < worldWidth * 0.5 ? 1 : -1;
            let chosen = null;
            for (let attempt = 0; attempt < 14; attempt += 1) {
              const gap = rand(98, MAX_TARGET_GAP - 8);
              const y = base.y + gap;
              const w = rand(clamp(worldWidth * 0.18, 78, 112), clamp(worldWidth * 0.29, 118, 166));
              const center = clamp(baseCenter + side * rand(96, Math.min(198, worldWidth * 0.34)), w * 0.5 + 12, worldWidth - w * 0.5 - 12);
              const candidate = { x: center - w * 0.5, y, w, h: 16, moving: false, travel: 0 };
              if (routeToPlatform(base, candidate) && canPlacePlatform(candidate)) {
                chosen = { center, y, w };
                break;
              }
            }
            if (!chosen) continue;
            const platform = makePlatform(chosen.center, chosen.y, chosen.w, rng() < 0.5 ? 'brick' : 'girder', false);
            platform.branch = true;
            platforms.push(platform);
            maybeAddLink(base, platform);
            addQuestionBoxesForPlatform(platform);
            if (rng() < 0.07) addBarrel(platform);
          }
        }

        function maybeAddLink(lower, upper, forcedKind) {
          if (!lower || !upper || lower.moving || upper.moving) return;
          const gap = upper.y - lower.y;
          if (gap < 46 || gap > 236) return;
          const roll = rng();
          if (!forcedKind && roll > 0.42) return;
          const kind = forcedKind || (roll < 0.14 ? 'pole' : roll < 0.28 ? 'stairs' : 'ladder');
          if (kind === 'pole' && gap < 76) return;
          const lowerLeft = platformLeft(lower);
          const lowerRight = lowerLeft + lower.w;
          const upperLeft = platformLeft(upper);
          const upperRight = upperLeft + upper.w;
          let x1 = clamp(platformCenter(upper), lowerLeft + 22, lowerRight - 22);
          let x2 = clamp(x1, upperLeft + 22, upperRight - 22);
          if (kind === 'stairs') {
            x1 = clamp(platformCenter(lower) + (platformCenter(upper) > platformCenter(lower) ? 30 : -30), lowerLeft + 24, lowerRight - 24);
            x2 = clamp(platformCenter(upper) + (x1 < platformCenter(upper) ? -30 : 30), upperLeft + 24, upperRight - 24);
          } else if (kind === 'pole') {
            x2 = clamp(platformCenter(upper), upperLeft + 24, upperRight - 24);
            x1 = clamp(x2, lowerLeft + 24, lowerRight - 24);
          }
          const link = {
            id: ++linkCount,
            kind,
            lowerId: lower.id,
            upperId: upper.id,
            x1,
            x2,
            y1: lower.y,
            y2: upper.y,
          };
          if (!canPlaceLink(link)) {
            linkCount -= 1;
            return;
          }
          links.push(link);
        }

        function makePlatform(center, y, w, type, moving) {
          const travel = moving ? rand(18, Math.min(42, worldWidth * 0.08)) : 0;
          return {
            id: ++platformCount,
            x: center - w * 0.5,
            y,
            w,
            h: type === 'girder' ? 16 : 18,
            type,
            moving,
            travel,
            phase: rand(0, TAU),
            speed: rand(0.55, 0.92),
            visited: false,
            pulseUntil: 0,
            spring: false,
          };
        }

        function addQuestionBoxesForPlatform(platform, force = false) {
          if (platform.moving && !force) return;
          if (!force && rng() > 0.62) return;
          const count = !force && platform.w > 142 && rng() < 0.16 ? 2 : 1;
          const left = platformLeft(platform) + platform.w * 0.3;
          const right = platformLeft(platform) + platform.w * 0.7;
          const slots = count === 1 ? [0.5] : [0.26, 0.74];
          for (let i = 0; i < count; i += 1) {
            const t = slots[i];
            const candidate = {
              id: ++boxCount,
              platformId: platform.id,
              x: lerp(left, right, t) + rand(-8, 8),
              y: platform.y + BOX_BOTTOM_OFFSET,
              size: BOX_SIZE,
              hit: false,
              hitAt: 0,
              phase: rand(0, TAU),
            };
            if (canPlaceQuestionBox(candidate, platform)) {
              boxes.push(candidate);
            } else {
              boxCount -= 1;
            }
          }
        }

        function addBarrel(platform) {
          barrels.push({
            id: ++barrelCount,
            platformId: platform.id,
            offset: rand(platform.w * 0.22, platform.w * 0.78),
            dir: rng() < 0.5 ? -1 : 1,
            speed: rand(42, 74),
            radius: rand(9, 12),
            roll: rand(0, TAU),
            bumpCooldownUntil: 0,
          });
        }

        function canPlacePlatform(candidate, mode = 'strict') {
          const rect = platformVisualRect(candidate, 8);
          const relaxed = mode === 'relaxed';
          if (rect.left < 8 || rect.right > worldWidth - 8) return false;
          for (const platform of platforms) {
            const other = platformVisualRect(platform, 0);
            const horizontalGap = Math.max(other.left - rect.right, rect.left - other.right, 0);
            const verticalGap = Math.abs(candidate.y - platform.y);
            if (verticalGap < (relaxed ? 42 : 74) && horizontalGap < (relaxed ? 18 : 30)) return false;
            if (rectsOverlap(rect, platformVisualRect(platform, 10))) return false;
          }
          for (const box of boxes) {
            if (box.hit && simTime - box.hitAt > 0.45) continue;
            if (rectsOverlap(rect, boxVisualRect(box, 7))) return false;
          }
          if (!relaxed) {
            for (const link of links) {
              if (rectsOverlap(rect, linkVisualRect(link, 4))) return false;
            }
          }
          return true;
        }

        function canPlaceQuestionBox(box, platform) {
          const left = platformLeft(platform) + 18;
          const right = platformLeft(platform) + platform.w - 18;
          if (box.x - box.size * 0.5 < left || box.x + box.size * 0.5 > right) return false;
          const rect = boxVisualRect(box, 5);
          if (rect.left < 10 || rect.right > worldWidth - 10) return false;
          for (const other of platforms) {
            if (other.id !== platform.id && rectsOverlap(rect, platformVisualRect(other, 7))) return false;
          }
          for (const other of boxes) {
            if (rectsOverlap(rect, boxVisualRect(other, 9))) return false;
          }
          for (const link of links) {
            if (rectsOverlap(rect, linkVisualRect(link, 5))) return false;
          }
          return true;
        }

        function canPlaceLink(link) {
          const rect = linkVisualRect(link, 3);
          for (const platform of platforms) {
            if (platform.id === link.lowerId || platform.id === link.upperId) continue;
            if (rectsOverlap(rect, platformVisualRect(platform, 4))) return false;
          }
          for (const box of boxes) {
            if (rectsOverlap(rect, boxVisualRect(box, 7))) return false;
          }
          return true;
        }

        function platformVisualRect(platform, pad = 0) {
          const travel = platform.travel || 0;
          const h = platform.h || 18;
          return {
            left: platform.x - travel - pad,
            right: platform.x + platform.w + travel + pad,
            bottom: platform.y - h - pad,
            top: platform.y + pad,
          };
        }

        function boxVisualRect(box, pad = 0) {
          const half = box.size * 0.5;
          return {
            left: box.x - half - pad,
            right: box.x + half + pad,
            bottom: box.y - pad,
            top: box.y + box.size + pad,
          };
        }

        function linkVisualRect(link, pad = 0) {
          const reach = (link.kind === 'stairs' ? 15 : 11) + pad;
          return {
            left: Math.min(link.x1, link.x2) - reach,
            right: Math.max(link.x1, link.x2) + reach,
            bottom: Math.min(link.y1, link.y2) - 6 - pad,
            top: Math.max(link.y1, link.y2) + 6 + pad,
          };
        }

        function rectsOverlap(a, b) {
          return a.left < b.right && a.right > b.left && a.bottom < b.top && a.top > b.bottom;
        }

        function platformById(id) {
          if (!id) return null;
          for (const platform of platforms) {
            if (platform.id === id) return platform;
          }
          return null;
        }

        function linkById(id) {
          if (!id) return null;
          for (const link of links) {
            if (link.id === id) return link;
          }
          return null;
        }

        function platformLeft(platform) {
          if (!platform.moving) return platform.x;
          const drift = Math.sin(simTime * platform.speed + platform.phase) * platform.travel;
          return clamp(platform.x + drift, 8, worldWidth - platform.w - 8);
        }

        function spawnDust(x, y, count, color) {
          if (prefersReducedMotion) return;
          for (let i = 0; i < count; i += 1) {
            particles.push({
              x: x + rand(-12, 12),
              y: y + rand(-6, 4),
              vx: rand(-72, 72),
              vy: rand(40, 150),
              r: rand(1.6, 4.8),
              age: 0,
              life: rand(0.28, 0.62),
              color,
            });
          }
        }

        function updateHud() {
          heightReadout.textContent = `${String(Math.floor(bestHeight / 10)).padStart(4, '0')} M`;
          coinReadout.textContent = `? ${String(boxesHit).padStart(2, '0')}`;
          if (DEBUG) {
            debugEl.textContent = [
              `seed ${seed}`,
              `height ${Math.floor(bestHeight)}`,
              `platforms ${platforms.length}`,
              `links ${links.length}`,
              `barrels ${barrels.length}`,
              `boxes ${boxes.length}`,
              `hit ${boxesHit}`,
              `target ${targetPlatformId || '-'}`,
              `box ${targetBoxId || '-'}`,
              `link ${targetLinkId || '-'}`,
              `ground ${hero.grounded ? hero.groundId || '-' : '-'}`,
              `y ${Math.round(hero.y)}`,
              `vy ${Math.round(hero.vy)}`,
              `noRoute ${hero.noRouteSince ? (simTime - hero.noRouteSince).toFixed(1) : '-'}`,
              `down ${downTrips}`,
              `ladders ${ladderTrips}`,
              `stairs ${stairTrips}`,
              `poles ${poleSlides}`,
              `rescues ${rescueCount}`,
              `recoveries ${recoveryCount}`,
              `skips ${skippedBoxes}`,
              `manual ${manualActive() ? 'yes' : 'no'}`,
            ].join('\n');
          }
        }

        function render() {
          drawBackground();
          drawBackScaffold();
          drawLinks();
          drawPlatforms();
          drawQuestionBoxes();
          drawBarrels();
          drawParticles();
          drawHero();
          drawForegroundMask();
        }

        function drawBackground() {
          ctx.fillStyle = COLORS.paper;
          ctx.fillRect(0, 0, width, height);

          const playHeight = height - (width <= 520 ? 64 : 58);
          const shaftPad = Math.max(10, Math.min(24, width * 0.03));
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(worldLeft - shaftPad, 0, worldWidth + shaftPad * 2, playHeight);
          drawBrickField(
            worldLeft - shaftPad,
            -16,
            worldWidth + shaftPad * 2,
            playHeight + 32,
            cameraY * 0.18,
            0.19,
          );

          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(0, 0, Math.max(0, worldLeft - shaftPad), playHeight);
          ctx.fillRect(worldLeft + worldWidth + shaftPad, 0, width, playHeight);

          drawEdgeMasonry(worldLeft - shaftPad, playHeight, -1);
          drawEdgeMasonry(worldLeft + worldWidth + shaftPad, playHeight, 1);
        }

        function drawBackScaffold() {
          const playHeight = height - (width <= 520 ? 64 : 58);
          const spacing = 268;
          const scroll = mod(cameraY * 0.28, spacing);
          ctx.save();
          ctx.beginPath();
          ctx.rect(worldLeft + 3, 0, worldWidth - 6, playHeight);
          ctx.clip();
          for (let y = -scroll - 70; y < playHeight + spacing; y += spacing) {
            const roomIndex = Math.floor((cameraY * 0.28 + y) / spacing);
            if (mod(roomIndex, 2) === 1) {
              const chamberW = worldWidth * (worldWidth < 390 ? 0.48 : 0.42);
              const chamberX =
                worldLeft + (mod(roomIndex, 2) === 0 ? worldWidth * 0.08 : worldWidth - chamberW - worldWidth * 0.08);
              drawDarkChamber(chamberX, y + 13, chamberW, 143, roomIndex);
            }
            const archCount = worldWidth < 390 ? 2 : 3;
            const bay = worldWidth / archCount;
            for (let i = 0; i < archCount; i += 1) {
              const narrow = (roomIndex + i) % 3 === 0;
              const archW = Math.min(narrow ? 46 : 58, bay * 0.5);
              const archH = narrow ? 86 : 108;
              const cx = worldLeft + bay * (i + 0.5);
              drawCastleArch(cx, y + 36 + ((roomIndex + i) % 2) * 11, archW, archH, roomIndex + i);
            }
            ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
            for (let x = worldLeft + 4; x < worldLeft + worldWidth - 8; x += 32) {
              ctx.fillRect(Math.round(x), Math.round(y + 164), 22, 2);
            }
          }
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.38)';
          ctx.lineWidth = 1;
          for (let x = worldLeft + worldWidth * 0.25; x < worldLeft + worldWidth; x += worldWidth * 0.25) {
            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, -20);
            ctx.lineTo(Math.round(x) + 0.5, playHeight + 20);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawBrickField(x, y, w, h, scroll, alpha) {
          const courseH = 12;
          const brickW = 28;
          const offsetY = mod(scroll, courseH);
          ctx.save();
          ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
          ctx.lineWidth = 1;
          for (let rowY = y - offsetY, row = 0; rowY < y + h; rowY += courseH, row += 1) {
            ctx.beginPath();
            ctx.moveTo(x, Math.round(rowY) + 0.5);
            ctx.lineTo(x + w, Math.round(rowY) + 0.5);
            for (let jointX = x + (row % 2 ? brickW * 0.5 : brickW); jointX < x + w; jointX += brickW) {
              ctx.moveTo(Math.round(jointX) + 0.5, Math.round(rowY) + 0.5);
              ctx.lineTo(Math.round(jointX) + 0.5, Math.round(rowY + courseH) + 0.5);
            }
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawCastleArch(cx, top, w, h, index) {
          const radius = w * 0.5;
          const bottom = top + h;
          ctx.save();
          ctx.fillStyle = index % 4 === 0 ? 'rgba(0, 0, 0, 0.28)' : 'rgba(0, 0, 0, 0.18)';
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.48)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(cx - radius, bottom);
          ctx.lineTo(cx - radius, top + radius);
          ctx.arc(cx, top + radius, radius, Math.PI, 0);
          ctx.lineTo(cx + radius, bottom);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
          ctx.lineWidth = 1;
          const bars = index % 3 === 0 ? 2 : 3;
          for (let i = 1; i <= bars; i += 1) {
            const x = cx - radius + (w * i) / (bars + 1);
            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, top + radius * 0.76);
            ctx.lineTo(Math.round(x) + 0.5, bottom - 4);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(cx - radius + 4, top + radius + 11);
          ctx.lineTo(cx + radius - 4, top + radius + 11);
          ctx.stroke();
          ctx.restore();
        }

        function drawDarkChamber(x, top, w, h, index) {
          const radius = Math.min(34, w * 0.18);
          ctx.save();
          ctx.fillStyle = COLORS.ink;
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, top + h);
          ctx.lineTo(x, top + radius);
          ctx.quadraticCurveTo(x + w * 0.5, top - radius * 0.55, x + w, top + radius);
          ctx.lineTo(x + w, top + h);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = COLORS.white;
          ctx.globalAlpha = 0.48;
          for (let py = top + radius + 7, row = 0; py < top + h - 6; py += 8, row += 1) {
            for (let px = x + 7 + (row % 2) * 4; px < x + w - 5; px += 12) {
              if (mod(Math.round(px + py) + index, 3) !== 0) continue;
              ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
            }
          }
          ctx.globalAlpha = 1;
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + w * 0.25, top + 12);
          ctx.quadraticCurveTo(x + w * 0.57, top + h * 0.42, x + w * 0.7, top + h - 10);
          ctx.stroke();
          for (let i = 1; i < 7; i += 1) {
            const t = i / 7;
            const px = lerp(x + w * 0.25, x + w * 0.7, t);
            const py = lerp(top + 12, top + h - 10, t);
            ctx.strokeRect(Math.round(px) - 2, Math.round(py) - 2, 4, 5);
          }
          ctx.restore();
        }

        function drawEdgeMasonry(edgeX, playHeight, side) {
          const widthPx = Math.max(8, Math.min(17, worldLeft * 0.22));
          const x = side < 0 ? edgeX - widthPx : edgeX;
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(Math.round(x), 0, Math.ceil(widthPx), playHeight);
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 1;
          const offset = mod(cameraY * 0.24, 24);
          for (let y = -offset; y < playHeight + 24; y += 24) {
            ctx.beginPath();
            ctx.moveTo(x, Math.round(y) + 0.5);
            ctx.lineTo(x + widthPx, Math.round(y) + 0.5);
            ctx.stroke();
          }
        }

        function drawPlatforms() {
          for (const platform of platforms) {
            const sy = screenY(platform.y);
            if (sy < -70 || sy > height + 70) continue;
            const sx = worldLeft + platformLeft(platform);
            const pulse = Math.max(0, 1 - (simTime - platform.pulseUntil + 0.24) / 0.24);
            if (platform.type === 'girder') drawGirderPlatform(platform, sx, sy, pulse);
            else if (platform.type === 'open') drawOpenPlatform(platform, sx, sy, pulse);
            else drawBrickPlatform(platform, sx, sy, pulse);
            if (platform.spring) drawSpring(sx + platform.w * 0.5, sy - 2);
            if (platform.id === targetPlatformId && !manualActive()) drawTargetTick(sx + platform.w * 0.5, sy - 24);
          }
        }

        function drawBrickPlatform(platform, sx, sy, pulse) {
          const h = platform.h;
          drawPlatformShadow(sx, sy, platform.w);
          ctx.fillStyle = pulse > 0 ? COLORS.paperDim : COLORS.white;
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 1.5;
          ctx.fillRect(Math.round(sx), Math.round(sy), Math.round(platform.w), h + 3);
          ctx.strokeRect(Math.round(sx) + 0.5, Math.round(sy) + 0.5, Math.round(platform.w), h + 3);
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(Math.round(sx - 2), Math.round(sy - 3), Math.round(platform.w + 4), 5);
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(Math.round(sx + 3), Math.round(sy - 2), Math.max(0, Math.round(platform.w - 6)), 1);

          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(Math.round(sx), Math.round(sy + 10) + 0.5);
          ctx.lineTo(Math.round(sx + platform.w), Math.round(sy + 10) + 0.5);
          ctx.stroke();
          const brickW = 30;
          for (let x = sx + brickW; x < sx + platform.w - 3; x += brickW) {
            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, Math.round(sy + 2));
            ctx.lineTo(Math.round(x) + 0.5, Math.round(sy + 10));
            ctx.stroke();
          }
          for (let x = sx + brickW * 0.5; x < sx + platform.w - 3; x += brickW) {
            ctx.beginPath();
            ctx.moveTo(Math.round(x) + 0.5, Math.round(sy + 11));
            ctx.lineTo(Math.round(x) + 0.5, Math.round(sy + h + 3));
            ctx.stroke();
          }
          ctx.fillStyle = COLORS.ink;
          for (let x = sx + 7 + (platform.id % 4); x < sx + platform.w - 4; x += 19) {
            ctx.fillRect(Math.round(x), Math.round(sy + h - 1 + ((x / 19) % 2)), 2, 1);
          }
        }

        function drawGirderPlatform(platform, sx, sy, pulse) {
          const h = platform.h;
          drawPlatformShadow(sx, sy, platform.w);
          ctx.fillStyle = pulse > 0 ? COLORS.paperDim : COLORS.white;
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 1.5;
          ctx.fillRect(Math.round(sx), Math.round(sy), Math.round(platform.w), h);
          ctx.strokeRect(Math.round(sx) + 0.5, Math.round(sy) + 0.5, Math.round(platform.w), h);
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(Math.round(sx - 2), Math.round(sy - 3), Math.round(platform.w + 4), 5);
          ctx.fillRect(Math.round(sx), Math.round(sy + h - 3), Math.round(platform.w), 4);
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 1;
          for (let x = sx + 3; x < sx + platform.w - 21; x += 28) {
            ctx.beginPath();
            ctx.moveTo(Math.round(x), Math.round(sy + 3));
            ctx.lineTo(Math.round(x + 24), Math.round(sy + h - 4));
            ctx.moveTo(Math.round(x + 24), Math.round(sy + 3));
            ctx.lineTo(Math.round(x), Math.round(sy + h - 4));
            ctx.stroke();
          }
          ctx.fillStyle = COLORS.white;
          for (let x = sx + 8; x < sx + platform.w - 5; x += 24) {
            ctx.fillRect(Math.round(x), Math.round(sy - 2), 2, 1);
          }
        }

        function drawOpenPlatform(platform, sx, sy, pulse) {
          drawPlatformShadow(sx, sy, platform.w);
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(Math.round(sx), Math.round(sy) - 1.5);
          ctx.lineTo(Math.round(sx + platform.w), Math.round(sy) - 1.5);
          ctx.stroke();
          ctx.lineWidth = 1.1;
          for (let x = sx + 14; x < sx + platform.w; x += 28) {
            ctx.beginPath();
            ctx.moveTo(Math.round(x), Math.round(sy + 1));
            ctx.lineTo(Math.round(x - 9), Math.round(sy + platform.h + 4));
            ctx.lineTo(Math.round(x + 5), Math.round(sy + platform.h + 4));
            ctx.stroke();
          }
          if (pulse > 0) {
            ctx.fillStyle = COLORS.ink;
            ctx.globalAlpha = pulse * 0.22;
            ctx.fillRect(Math.round(sx), Math.round(sy - 5), Math.round(platform.w), 7);
            ctx.globalAlpha = 1;
          }
        }

        function drawPlatformShadow(sx, sy, w) {
          ctx.fillStyle = COLORS.ink;
          ctx.globalAlpha = 0.26;
          ctx.fillRect(Math.round(sx + 5), Math.round(sy + 8), Math.round(w), 12);
          ctx.globalAlpha = 1;
        }

        function drawSpring(cx, sy) {
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i <= 5; i += 1) {
            const x = cx + (i % 2 === 0 ? -10 : 10);
            const y = sy - 4 - i * 4;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.strokeRect(Math.round(cx - 14) + 0.5, Math.round(sy - 3) + 0.5, 28, 5);
          ctx.strokeRect(Math.round(cx - 12) + 0.5, Math.round(sy - 27) + 0.5, 24, 5);
        }

        function drawTargetTick(cx, sy) {
          const bob = Math.sin(simTime * 8) * 2;
          ctx.save();
          ctx.strokeStyle = COLORS.ink;
          ctx.fillStyle = COLORS.ink;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx, sy + bob);
          ctx.lineTo(cx - 8, sy - 10 + bob);
          ctx.lineTo(cx + 8, sy - 10 + bob);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(Math.round(cx) - 1, Math.round(sy - 7 + bob), 2, 3);
          ctx.restore();
        }

        function drawLinks() {
          for (const link of links) {
            const y1 = screenY(link.y1);
            const y2 = screenY(link.y2);
            if (Math.max(y1, y2) < -60 || Math.min(y1, y2) > height + 60) continue;
            const x1 = worldLeft + link.x1;
            const x2 = worldLeft + link.x2;
            if (link.kind === 'stairs') drawStairs(x1, y1, x2, y2, link.id === targetLinkId);
            else if (link.kind === 'pole') drawPole(x1, y1, x2, y2, link.id === targetLinkId);
            else drawLadder(x1, y1, x2, y2, link.id === targetLinkId);
          }
        }

        function drawLadder(x1, y1, x2, y2, active) {
          const x = Math.round((x1 + x2) * 0.5);
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = active ? 4.5 : 3;
          ctx.beginPath();
          ctx.moveTo(x - 9, y1);
          ctx.lineTo(x - 9, y2);
          ctx.moveTo(x + 9, y1);
          ctx.lineTo(x + 9, y2);
          ctx.stroke();
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - 9.5, y1);
          ctx.lineTo(x - 9.5, y2);
          ctx.moveTo(x + 8.5, y1);
          ctx.lineTo(x + 8.5, y2);
          ctx.stroke();
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = active ? 2 : 1.4;
          const top = Math.min(y1, y2);
          const bottom = Math.max(y1, y2);
          for (let y = top + 13; y < bottom - 8; y += 15) {
            ctx.beginPath();
            ctx.moveTo(x - 9, Math.round(y) + 0.5);
            ctx.lineTo(x + 9, Math.round(y) + 0.5);
            ctx.stroke();
          }
        }

        function drawStairs(x1, y1, x2, y2, active) {
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = active ? 3.5 : 2.2;
          const steps = Math.max(4, Math.floor(Math.abs(y2 - y1) / 15));
          const dx = (x2 - x1) / steps;
          const dy = (y2 - y1) / steps;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          for (let i = 1; i <= steps; i += 1) {
            const nextX = x1 + dx * i;
            const nextY = y1 + dy * i;
            ctx.lineTo(nextX, y1 + dy * (i - 1));
            ctx.lineTo(nextX, nextY);
          }
          ctx.stroke();
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(x1, y1 + 7);
          ctx.lineTo(x2, y2 + 7);
          ctx.stroke();
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x1, y1 - 14);
          ctx.lineTo(x2, y2 - 14);
          ctx.stroke();
          for (let i = 0; i <= steps; i += 2) {
            const x = x1 + dx * i;
            const y = y1 + dy * i;
            ctx.beginPath();
            ctx.moveTo(x, y - 14);
            ctx.lineTo(x, y + 5);
            ctx.stroke();
          }
        }

        function drawPole(x1, y1, x2, y2, active) {
          const x = Math.round((x1 + x2) * 0.5);
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = active ? 5 : 3.4;
          ctx.beginPath();
          ctx.moveTo(x, y1);
          ctx.lineTo(x, y2);
          ctx.stroke();
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - 0.5, y1 + 4);
          ctx.lineTo(x - 0.5, y2 - 4);
          ctx.stroke();
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y2 - 10, 7, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x, y2);
          ctx.quadraticCurveTo(x + 17, y2, x + 17, y2 + 14);
          ctx.stroke();
        }

        function drawQuestionBoxes() {
          for (const box of boxes) {
            const sy = screenY(box.y + box.size);
            if (sy < -44 || sy > height + 44) continue;
            const sx = worldLeft + box.x - box.size * 0.5;
            const lift = box.hit ? Math.max(0, 1 - (simTime - box.hitAt) / 0.18) * 8 : 0;
            ctx.save();
            ctx.translate(Math.round(sx) + 0.5, Math.round(sy - lift) + 0.5);
            ctx.fillStyle = box.hit ? COLORS.white : COLORS.ink;
            ctx.strokeStyle = COLORS.ink;
            ctx.lineWidth = box.id === targetBoxId ? 3 : 1.8;
            ctx.fillRect(0, 0, box.size, box.size);
            ctx.strokeRect(0, 0, box.size, box.size);
            ctx.lineWidth = 1;
            ctx.strokeStyle = box.hit ? COLORS.ink : COLORS.white;
            ctx.strokeRect(3, 3, box.size - 6, box.size - 6);
            ctx.beginPath();
            ctx.moveTo(1, 7);
            ctx.lineTo(5, 7);
            ctx.moveTo(box.size - 1, 7);
            ctx.lineTo(box.size - 5, 7);
            ctx.moveTo(1, box.size - 7);
            ctx.lineTo(5, box.size - 7);
            ctx.moveTo(box.size - 1, box.size - 7);
            ctx.lineTo(box.size - 5, box.size - 7);
            ctx.stroke();
            ctx.font = '900 18px Geneva, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = box.hit ? COLORS.ink : COLORS.white;
            ctx.fillText(box.hit ? '-' : '?', box.size * 0.5, box.size * 0.52);
            if (box.id === targetBoxId) {
              ctx.strokeStyle = COLORS.ink;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(2, box.size + 6);
              ctx.lineTo(box.size - 2, box.size + 6);
              ctx.stroke();
            } else if (box.failedAt && simTime - box.failedAt < 0.35) {
              ctx.strokeStyle = COLORS.softInk;
              ctx.beginPath();
              ctx.moveTo(6, box.size + 5);
              ctx.lineTo(box.size - 6, box.size + 5);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        function drawBarrels() {
          for (const barrel of barrels) {
            const platform = platformById(barrel.platformId);
            if (!platform) continue;
            const bx = worldLeft + platformLeft(platform) + barrel.offset;
            const by = screenY(platform.y + barrel.radius + 2);
            if (by < -42 || by > height + 42) continue;
            ctx.save();
            ctx.translate(Math.round(bx), Math.round(by));
            ctx.rotate(barrel.roll);
            ctx.fillStyle = COLORS.ink;
            ctx.strokeStyle = COLORS.ink;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.ellipse(0, 0, barrel.radius + 1, barrel.radius, 0, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = COLORS.white;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-barrel.radius + 1, -3);
            ctx.lineTo(barrel.radius - 1, 3);
            ctx.moveTo(-barrel.radius + 1, 4);
            ctx.lineTo(barrel.radius - 1, -4);
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawParticles() {
          for (const particle of particles) {
            const age = particle.age / particle.life;
            const alpha = 1 - age;
            const sx = worldLeft + particle.x;
            const sy = screenY(particle.y);
            ctx.globalAlpha = alpha * 0.72;
            ctx.fillStyle = particle.color;
            const size = Math.max(1, Math.round(particle.r * 0.55));
            ctx.fillRect(Math.round(sx), Math.round(sy), size, size);
          }
          ctx.globalAlpha = 1;
        }

        function drawHero() {
          const sx = worldLeft + hero.x;
          const sy = screenY(hero.y);
          const blink = hero.blinkUntil > simTime && Math.floor(simTime * 24) % 2 === 0;
          ctx.save();
          ctx.translate(Math.round(sx), Math.round(sy));
          ctx.scale(hero.facing, 1);
          ctx.lineCap = 'square';
          ctx.lineJoin = 'miter';

          ctx.fillStyle = COLORS.shadow;
          ctx.beginPath();
          ctx.ellipse(1, 4, 16, 3, 0, 0, TAU);
          ctx.fill();

          const climb = hero.onLink ? Math.sin(simTime * 9) * 4 : 0;
          const jumpPose = hero.grounded ? 0 : clamp(hero.vy / JUMP_SPEED, -0.65, 1);
          const run =
            Math.sin(simTime * 16) *
            (hero.grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0.25);
          ctx.strokeStyle = COLORS.ink;
          ctx.fillStyle = COLORS.ink;
          ctx.lineWidth = 4;

          const leftFoot = run * 4.5 - jumpPose * 3;
          const rightFoot = -run * 4.5 + jumpPose * 2;
          ctx.beginPath();
          ctx.moveTo(-6, -9);
          ctx.lineTo(-10 + leftFoot, 0);
          ctx.moveTo(6, -9);
          ctx.lineTo(12 + rightFoot, 0);
          ctx.stroke();
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-14 + leftFoot, 0);
          ctx.lineTo(-7 + leftFoot, 0);
          ctx.moveTo(8 + rightFoot, 0);
          ctx.lineTo(16 + rightFoot, 0);
          ctx.stroke();

          ctx.fillStyle = COLORS.ink;
          ctx.beginPath();
          ctx.moveTo(-12, -26);
          ctx.lineTo(11, -26);
          ctx.lineTo(9, -8);
          ctx.lineTo(-10, -8);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = COLORS.white;
          ctx.fillRect(-5, -24, 3, 12);
          ctx.fillRect(4, -24, 3, 12);
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(-3, -14, 8, 3);

          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-10, -23);
          ctx.lineTo(-18, -17 + (hero.onLink ? climb : jumpPose * -6));
          ctx.moveTo(10, -23);
          ctx.lineTo(18, -16 - (hero.onLink ? climb : jumpPose * -4));
          ctx.stroke();

          ctx.fillStyle = blink ? COLORS.ink : COLORS.white;
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 2;
