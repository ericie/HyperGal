           and a softly scalloped belly. Avoiding equal repeated bumps is
           what keeps it reading as a cloud instead of a caterpillar. */
        function cloudPath(cx, topY, w, scale) {
          const h = clamp(w * 0.29, 36, 56) * scale;
          const left = cx - w * 0.5;
          const right = cx + w * 0.5;
          ctx.beginPath();
          ctx.moveTo(left + w * 0.08, topY + h * 0.08);
          ctx.bezierCurveTo(left - w * 0.02, topY, left, topY - h * 0.30, left + w * 0.10, topY - h * 0.38);
          ctx.bezierCurveTo(left + w * 0.12, topY - h * 0.69, left + w * 0.29, topY - h * 0.76, left + w * 0.36, topY - h * 0.55);
          ctx.bezierCurveTo(left + w * 0.41, topY - h, left + w * 0.61, topY - h * 1.08, left + w * 0.67, topY - h * 0.62);
          ctx.bezierCurveTo(left + w * 0.79, topY - h * 0.78, left + w * 0.91, topY - h * 0.55, left + w * 0.91, topY - h * 0.30);
          ctx.bezierCurveTo(right + w * 0.03, topY - h * 0.28, right + w * 0.04, topY + h * 0.08, right - w * 0.04, topY + h * 0.18);
          ctx.bezierCurveTo(right - w * 0.06, topY + h * 0.43, right - w * 0.25, topY + h * 0.52, right - w * 0.34, topY + h * 0.37);
          ctx.bezierCurveTo(cx + w * 0.10, topY + h * 0.59, cx - w * 0.05, topY + h * 0.58, cx - w * 0.14, topY + h * 0.40);
          ctx.bezierCurveTo(left + w * 0.29, topY + h * 0.58, left + w * 0.15, topY + h * 0.48, left + w * 0.16, topY + h * 0.29);
          ctx.bezierCurveTo(left + w * 0.06, topY + h * 0.35, left - w * 0.01, topY + h * 0.22, left + w * 0.08, topY + h * 0.08);
          ctx.closePath();
        }

        function drawKawaiiCloudFace(cx, cy, seed, awake, vanish) {
          const gap = 13 + Math.min(4, awake * 3);
          const blink = mod(simTime + seed * 0.73, 4.6) < 0.12;
          ctx.save();
          ctx.globalAlpha *= 1 - vanish * 0.5;
          fillOval(cx - gap - 8, cy + 6, 5.5, 3.4, C.blush);
          fillOval(cx + gap + 8, cy + 6, 5.5, 3.4, C.blush);

          ctx.strokeStyle = C.night;
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          if (blink) {
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.arc(cx + side * gap, cy, 3.1, Math.PI * 0.08, Math.PI * 0.92);
              ctx.stroke();
            }
          } else {
            for (const side of [-1, 1]) {
              fillOval(cx + side * gap, cy, 4, 4.8, C.night);
              fillCircle(cx + side * gap + 1.2, cy - 1.5, 1.3, C.white);
            }
          }

          ctx.beginPath();
          if (vanish > 0.15) {
            ctx.arc(cx, cy + 10, 4.4, 0, TAU);
          } else {
            ctx.arc(cx, cy + 5, 6.4, Math.PI * 0.12, Math.PI * 0.88);
          }
          ctx.stroke();

          if (awake > 0.1 && vanish === 0) {
            const twinkle = 2.2 + Math.sin(simTime * 3 + seed) * 0.6;
            sparkle(cx + gap + 18, cy - 12, twinkle, C.lemon);
          }
          ctx.restore();
        }

        function drawSpring(cx, sy) {
          ctx.strokeStyle = C.mid;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          for (let i = 0; i <= 5; i += 1) {
            const x = cx + (i % 2 === 0 ? -8 : 8);
            const y = sy - 6 - i * 4;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          fillRound(cx - 15, sy - 8, 30, 7, 3.5, C.deep);
          fillRound(cx - 13, sy - 31, 26, 7, 3.5, C.deep);
        }

        function drawTargetTick(cx, sy) {
          const bob = Math.sin(simTime * 5) * 2.5;
          ctx.save();
          ctx.globalAlpha = 0.75;
          ctx.fillStyle = C.pale;
          ctx.beginPath();
          ctx.moveTo(cx, sy + 9 + bob);
          ctx.lineTo(cx - 7, sy + bob);
          ctx.lineTo(cx + 7, sy + bob);
          ctx.closePath();
          ctx.fill();
          fillRound(cx - 3, sy - 9 + bob, 6, 9, 3, C.pale);
          ctx.restore();
        }

        /* -- LINKS -- */

        function drawLinks() {
          for (const link of links) {
            const y1 = screenY(link.y1);
            const y2 = screenY(link.y2);
            if (Math.max(y1, y2) < -60 || Math.min(y1, y2) > height + 60) continue;
            const x1 = worldLeft + link.x1;
            const x2 = worldLeft + link.x2;
            const active = link.id === targetLinkId;
            if (link.kind === 'stairs') drawStairs(x1, y1, x2, y2, active);
            else drawLadder(x1, y1, x2, y2, active);
          }
        }

        function linkTones(active) {
          return active ? { rail: C.deep, step: C.lemon } : { rail: C.pale, step: C.mint };
        }

        function drawLadder(x1, y1, x2, y2, active) {
          const x = (x1 + x2) * 0.5;
          const tone = linkTones(active);
          const top = Math.min(y1, y2);
          const bottom = Math.max(y1, y2);
          capsule(x - 9, top + 6, x - 9, bottom - 2, 5.5, tone.rail);
          capsule(x + 9, top + 6, x + 9, bottom - 2, 5.5, tone.rail);
          for (let y = top + 18; y < bottom - 6; y += 17) {
            capsule(x - 7, y, x + 7, y, 4.5, tone.step);
          }
        }

        /* Treads fanned across a stringer. The link itself is often almost
           vertical, so the drawing takes a horizontal liberty -- otherwise a
           staircase is indistinguishable from a ladder. */
        function drawStairs(x1, y1, x2, y2, active) {
          const tone = linkTones(active);
          const top = Math.min(y1, y2);
          const bottom = Math.max(y1, y2);
          const steps = Math.max(3, Math.round((bottom - top) / 22));
          const dir = x2 >= x1 ? 1 : -1;
          const spread = 13;
          const fan = (t) => lerp(x1, x2, t) + dir * lerp(-spread, spread, t);

          capsule(fan(0) - dir * 9, y1 + 4, fan(1) + dir * 9, y2 - 4, 7, tone.rail);
          for (let i = 0; i <= steps; i += 1) {
            const t = i / steps;
            fillRound(fan(t) - 12, lerp(y1, y2, t) - 3.5, 24, 7, 3.5, tone.step);
          }
        }

        /* -- QUESTION BOXES -- */

        function drawQuestionBoxes() {
          for (const box of boxes) {
            const sy = screenY(box.y + box.size);
            if (sy < -48 || sy > height + 48) continue;
            const sx = worldLeft + box.x - box.size * 0.5;
            const age = simTime - box.hitAt;
            const lift = box.hit ? Math.max(0, 1 - age / 0.2) * 9 : Math.sin(simTime * 2.4 + box.x * 0.05) * 1.4;
            const s = box.size;
            const targeted = box.id === targetBoxId && !box.hit;

            ctx.save();
            ctx.translate(sx + s * 0.5, sy - lift + s * 0.5);
            if (targeted) ctx.scale(1 + Math.sin(simTime * 6) * 0.04, 1 + Math.sin(simTime * 6) * 0.04);
            ctx.translate(-s * 0.5, -s * 0.5);

            fillRound(1.5, 4, s, s, 8, SHADOW);

            if (box.hit) {
              fillRound(0, 0, s, s, 8, C.mint);
              /* Opened: a contented little face. */
              ctx.strokeStyle = C.white;
              ctx.lineWidth = 2.4;
              ctx.lineCap = 'round';
              for (const side of [-1, 1]) {
                ctx.beginPath();
                ctx.arc(s * 0.5 + side * 5.5, s * 0.46, 3.4, Math.PI * 1.1, Math.PI * 1.9);
                ctx.stroke();
              }
              ctx.beginPath();
              ctx.arc(s * 0.5, s * 0.6, 2.6, Math.PI * 0.15, Math.PI * 0.85);
              ctx.stroke();
            } else {
              fillRound(0, 0, s, s, 8, C.lemon);
              fillRound(4, 4, s - 8, 5, 2.5, '#FFF2A9');
              ctx.strokeStyle = C.ink;
              ctx.lineWidth = 2;
              ctx.beginPath();
              roundRectPath(0, 0, s, s, 8);
              ctx.stroke();
              ctx.fillStyle = C.deep;
              ctx.font = '900 17px "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('?', s * 0.5, s * 0.58);
            }

            ctx.restore();

            /* Burst of sparkles on the frame the box opens. */
            if (box.hit && age < 0.45) {
              const t = age / 0.45;
              ctx.save();
              ctx.globalAlpha = 1 - t;
              for (let i = 0; i < 5; i += 1) {
                const a = (i / 5) * TAU - 0.4;
                const d = 14 + t * 22;
                sparkle(sx + s * 0.5 + Math.cos(a) * d, sy - lift + s * 0.5 + Math.sin(a) * d, 4 * (1 - t) + 1.5, C.pale);
              }
              ctx.restore();
            }
          }
        }

        /* -- BARRELS -- little grumps that patrol a cloud -- */

        function drawBarrels() {
          for (const barrel of barrels) {
            const platform = platformById(barrel.platformId);
            if (!platform) continue;
            const bx = worldLeft + platformLeft(platform) + barrel.offset;
            const by = screenY(platform.y + barrel.radius + 2);
            if (by < -46 || by > height + 46) continue;
            const r = barrel.radius;
            const hop = Math.abs(Math.sin(barrel.roll * 1.4));
            const squash = 1 + hop * 0.08;

            ctx.save();
            ctx.translate(bx, by);
            fillOval(1, r * 0.95, r * 0.85, r * 0.28, SHADOW);
            ctx.scale(1 / squash, squash);
            ctx.rotate(Math.sin(barrel.roll) * 0.16);

            fillCircle(0, 0, r, C.peach);
            fillOval(0, r * 0.42, r * 0.72, r * 0.4, C.deep);

            const face = barrel.dir;
            fillOval(-r * 0.34 + face * 1.5, -r * 0.16, r * 0.19, r * 0.26, C.white);
            fillOval(r * 0.34 + face * 1.5, -r * 0.16, r * 0.19, r * 0.26, C.white);
            fillCircle(-r * 0.34 + face * 2.6, -r * 0.12, r * 0.1, C.night);
            fillCircle(r * 0.34 + face * 2.6, -r * 0.12, r * 0.1, C.night);

            ctx.strokeStyle = C.night;
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(face * 1.5, r * 0.44, r * 0.22, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();

            ctx.restore();
          }
        }

        /* -- PARTICLES -- */

        function drawParticles() {
          for (const particle of particles) {
            const age = particle.age / particle.life;
            const sx = worldLeft + particle.x;
            const sy = screenY(particle.y);
            ctx.globalAlpha = (1 - age) * 0.85;
            if (particle.kind === 'rain') {
              const length = 5 + Math.min(7, Math.abs(particle.vy) * 0.018);
              capsule(sx, sy - length * 0.5, sx, sy + length * 0.5, particle.r * 1.5, particle.color || C.mid);
            } else if (particle.kind === 'cloudBurst') {
              const puff = particle.r * (0.82 + age * 0.5);
              fillCircle(sx, sy, puff, particle.color || C.white);
              fillCircle(sx - puff * 0.6, sy + puff * 0.15, puff * 0.55, particle.color || C.white);
              fillCircle(sx + puff * 0.58, sy + puff * 0.12, puff * 0.62, particle.color || C.white);
            } else {
              fillCircle(sx, sy, Math.max(1, particle.r * (1 - age * 0.5)), particle.color || C.pale);
            }
          }
          ctx.globalAlpha = 1;
        }

        /* ====================================================
           HERO -- a small round climber who actually moves
           Built on a skeleton so arms and legs swing, reach, tuck and splay
           instead of holding one pose. Tones step down the ramp from back
           limb to boot, which is what keeps a flat figure readable.
           ==================================================== */

        const FOOT_Y = -1;
        const HIP_Y = -18;
        const SHOULDER_Y = -29;
        const HEAD_Y = -38;
        const HEAD_R = 10;

        /* Stepped back-to-front so no two touching shapes share a tone. */
        const SKIN = {
          back: '#C95D68',
          shirt: C.red,
          arm: C.red,
          bib: C.denim,
          leg: '#5687B9',
          boot: C.cocoa,
          cap: C.red,
        };

        function drawMarioBuddies() {
          for (const buddy of buddies) {
            const sx = worldLeft + buddy.x;
            const sy = screenY(buddy.y);
            if (sy < -90 || sy > height + 120) continue;
            const wave = Math.sin(simTime * 3.2 + buddy.phase);
            const panic = buddy.falling;
            const airborne = !buddy.grounded && !panic;

            if (buddy.grounded) fillOval(sx, sy + 2, 11, 3.2, SHADOW_SOFT);
            ctx.save();
            ctx.translate(sx, sy - (buddy.grounded ? Math.abs(wave) * 0.7 : 0));
            ctx.rotate(panic ? buddy.spin : airborne ? clamp(buddy.vx / BUDDY_AIR_SPEED, -1, 1) * 0.08 : 0);
            ctx.scale(0.88, 0.88);

            /* Short tucked limbs keep the silhouette toy-like and sweet. */
            const step = buddy.grounded ? wave * 1.1 : 0;
            const footLift = airborne ? -5 : panic ? -3 : 0;
            capsule(-4, -12, -5 - step, -1 + footLift, 6, C.denim);
            capsule(4, -12, 5 + step, -1 + footLift - (airborne ? 2 : 0), 6, C.denim);
            fillOval(-5.8 - step, footLift, 4.8, 2.8, C.cocoa);
            fillOval(5.8 + step, footLift - (airborne ? 2 : 0), 4.8, 2.8, C.cocoa);

            /* Round overalls body with sunny buttons. */
            fillRound(-9, -28, 18, 18, 8, C.red);
            fillRound(-8.5, -23, 17, 14, 7, C.denim);
            capsule(-5, -26, -4, -19, 2.5, C.denim);
            capsule(5, -26, 4, -19, 2.5, C.denim);
            fillCircle(-4.2, -20, 1.5, C.lemon);
            fillCircle(4.2, -20, 1.5, C.lemon);

            /* Compact reaching pose—hands stay near the cheeks, even in air. */
            const handY = airborne ? -34 : panic ? -32 : -27 - Math.max(0, wave) * 2;
            const handX = airborne ? 11 : 10.5;
            limb(-7, -25, -handX, handY + (airborne ? 2 : 0), -1, 5, C.red);
            limb(7, -25, handX, handY, 1, 5, C.red);
            fillCircle(-handX, handY + (airborne ? 2 : 0), 3.3, C.white);
            fillCircle(handX, handY, 3.3, C.white);

            /* Peach face, red cap, M badge and two-bean moustache. */
            fillCircle(0, -36, 10.5, C.skin);
            fillCircle(-9.2, -35, 2.7, C.skin);
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, -36, 10.5, 0, TAU);
            ctx.clip();
            ctx.fillStyle = C.red;
            ctx.fillRect(-13, -50, 26, 10);
            ctx.restore();
            fillRound(-10.5, -42, 21, 4.7, 2.4, C.red);
            fillCircle(0, -45, 3.1, C.white);
            ctx.fillStyle = C.red;
            ctx.font = '900 4.4px "Arial Rounded MT Bold", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('M', 0, -44.7);

            if (panic) {
              ctx.strokeStyle = C.night;
              ctx.lineWidth = 1.5;
              for (const side of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(side * 4.8 - 1.5, -35.5);
                ctx.lineTo(side * 4.8 + 1.5, -32.5);
                ctx.moveTo(side * 4.8 + 1.5, -35.5);
                ctx.lineTo(side * 4.8 - 1.5, -32.5);
                ctx.stroke();
              }
              fillOval(0, -27.6, 2.3, 3.1, C.night);
            } else {
              fillOval(-4.5, -34, 1.9, 2.7, C.night);
              fillOval(4.5, -34, 1.9, 2.7, C.night);
              fillCircle(-3.9, -34.8, 0.7, C.white);
              fillCircle(5.1, -34.8, 0.7, C.white);
            }
            fillOval(-3, -29.8, 3.3, 1.9, C.cocoa);
            fillOval(3, -29.8, 3.3, 1.9, C.cocoa);
            fillOval(-8, -30, 2.5, 1.4, C.blush);
            fillOval(8, -30, 2.5, 1.4, C.blush);

            ctx.restore();
          }
        }

        function drawHero() {
          const sx = worldLeft + hero.x;
          const sy = screenY(hero.y);
          const link = hero.onLink ? linkById(hero.onLink.linkId) : null;
          const hurt = hero.stumbleUntil > simTime;

          /* Contact shadow, tighter once he leaves the ground. */
          if (hero.grounded) fillOval(sx, sy + 2, 14, 4, SHADOW);
          else fillOval(sx, sy + 2, 9, 2.5, SHADOW_SOFT);

          ctx.save();
          ctx.translate(sx, sy);

          /* Landing squash and takeoff stretch, pivoted on the feet. */
          const land = Math.max(0, 1 - (simTime - hero.landedAt) / 0.2);
          const air = hero.grounded || link ? 0 : clamp(hero.vy / JUMP_SPEED, -0.9, 1);
          ctx.scale(1 + 0.18 * land - Math.max(0, air) * 0.05, 1 - 0.2 * land + Math.max(0, air) * 0.06);

          if (hurt) ctx.rotate(Math.sin(simTime * 40) * 0.08);

          if (link) drawHeroClimb();
          else {
            ctx.scale(hero.facing, 1);
            drawHeroRun(air);
          }

          ctx.restore();

          if (hero.rescuedUntil > simTime) drawRescueSparkles(sx, sy);
        }

        /* Side view: run cycle on the ground, tuck rising, splay falling. */
        function drawHeroRun(air) {
          const grounded = hero.grounded;
          const gait = grounded ? clamp(Math.abs(hero.vx) / RUN_SPEED, 0, 1) : 0;
          const phase = hero.stride / 22;
          const breathe = Math.sin(simTime * 2.3) * (grounded ? 1 - gait : 0);

          /* Bob up as each leg passes under the body. */
          const bob = grounded ? -Math.abs(Math.sin(phase)) * 2.6 * gait + breathe * 0.6 : 0;
          const lean = grounded ? clamp(hero.vx / RUN_SPEED, -1, 1) * hero.facing * 1.4 : air * 1.6;

          ctx.save();
          ctx.translate(0, bob);

          const hipX = lean * 0.5;
          const shoulderX = lean * 2;

          /* Foot targets: a flat half-loop on the ground, tucked in the air. */
          let footA;
          let footB;
          if (grounded) {
            const swing = 6 * gait;
            const lift = 4.5 * gait;
            footA = [Math.cos(phase) * swing + 1, FOOT_Y - Math.max(0, Math.sin(phase)) * lift];
            footB = [Math.cos(phase + Math.PI) * swing + 1, FOOT_Y - Math.max(0, Math.sin(phase + Math.PI)) * lift];
          } else if (air > 0.1) {
            footA = [-4, FOOT_Y - 4 - air * 3];
            footB = [5, FOOT_Y - 6 - air * 2];
          } else {
            const fall = clamp(-air, 0, 1);
            footA = [-5, FOOT_Y - 2 - fall * 2];
            footB = [5, FOOT_Y - 4 + fall];
          }

          /* Hands counter-swing against the legs. */
          let handA;
          let handB;
          if (grounded) {
            const swing = 3 * gait;
            const droop = SHOULDER_Y + 10 + breathe * 0.5;
            handA = [-10.5 - Math.cos(phase) * swing, droop - Math.abs(Math.sin(phase)) * 2 * gait];
            handB = [10.5 - Math.cos(phase + Math.PI) * swing, droop - Math.abs(Math.sin(phase + Math.PI)) * 2 * gait];
          } else if (air > 0.1) {
            handA = [-9.5, SHOULDER_Y - 2 - air * 4];
            handB = [10, SHOULDER_Y - 5 - air * 3];
          } else {
            const fall = clamp(-air, 0, 1);
            handA = [-10, SHOULDER_Y - 1 - fall * 2];
            handB = [10, SHOULDER_Y - 4 - fall * 2];
          }

          /* Back limbs a tone lighter, so the pose reads in depth. */
          limb(hipX - 3.5, HIP_Y, footA[0], footA[1], -3, 8, SKIN.back);
          fillOval(footA[0] + 1, footA[1] + 0.5, 5, 3, SKIN.back);
          limb(shoulderX - 6, SHOULDER_Y + 1, handA[0], handA[1], 1.5, 5.8, SKIN.back);
          fillCircle(handA[0], handA[1], 3.6, SKIN.back);

          drawTorso(hipX, shoulderX);

          limb(hipX + 3.5, HIP_Y, footB[0], footB[1], -3, 8.5, SKIN.leg);
          fillOval(footB[0] + 1.2, footB[1] + 0.5, 5.4, 3.2, SKIN.boot);
          limb(shoulderX + 6, SHOULDER_Y + 1, handB[0], handB[1], -1.5, 6, SKIN.arm);
          fillCircle(handB[0], handB[1], 3.8, SKIN.arm);

          drawHead(shoulderX, air, gait, false);
          ctx.restore();
        }

        /* Front view: hand over hand up a ladder or a stair. */
        function drawHeroClimb() {
          const c = hero.climbT * 7;
          const s = Math.sin(c);
          ctx.save();
          ctx.translate(0, -Math.abs(s) * 0.8);

          const handAY = SHOULDER_Y - 9 - s * 4;
          const handBY = SHOULDER_Y - 9 + s * 4;
          const footAY = FOOT_Y - Math.max(0, -s) * 4;
          const footBY = FOOT_Y - Math.max(0, s) * 4;

          limb(-4, HIP_Y, -5, footAY, 2, 8, SKIN.back);
          fillOval(-5, footAY + 0.5, 5, 3, SKIN.back);
          limb(4, HIP_Y, 5, footBY, -2, 8.5, SKIN.leg);
          fillOval(5, footBY + 0.5, 5.4, 3.2, SKIN.boot);

          drawTorso(0, 0);
          drawHead(0, 0, 0, true);

          limb(-6.5, SHOULDER_Y + 2, -11.5, handAY, -2, 6.2, SKIN.arm);
          fillCircle(-11.5, handAY, 3.7, SKIN.arm);
          limb(6.5, SHOULDER_Y + 2, 11.5, handBY, 2, 6.2, SKIN.arm);
          fillCircle(11.5, handBY, 3.7, SKIN.arm);

          ctx.restore();
        }

        function drawTorso(hipX, shoulderX) {
          const h = HIP_Y - SHOULDER_Y;
          ctx.save();
          ctx.translate(hipX, 0);
          ctx.rotate((shoulderX - hipX) * 0.012);

          /* Shirt, then dungarees over the lower two thirds. */
          fillRound(-9.5, SHOULDER_Y - 1, 19, h + 7, 8, SKIN.shirt);
          fillRound(-9.5, SHOULDER_Y + 5, 19, h + 1, 7, SKIN.bib);
          capsule(-4.5, SHOULDER_Y, -4.5, SHOULDER_Y + 7, 2.8, SKIN.bib);
          capsule(4.5, SHOULDER_Y, 4.5, SHOULDER_Y + 7, 2.8, SKIN.bib);
          fillCircle(0, SHOULDER_Y + 8.5, 2, C.lemon);

          ctx.restore();
        }

        function drawHead(offsetX, air, gait, frontOn) {
          const nod = gait > 0 ? Math.sin(hero.stride / 11) * 0.7 : Math.sin(simTime * 2.3) * 0.5;
          ctx.save();
          ctx.translate(offsetX * 0.55, HEAD_Y + nod);

          /* Face */
          fillCircle(0, 0, HEAD_R, C.skin);
          /* Far ear, one tone back so it sits behind the face. */
          if (!frontOn) fillCircle(-HEAD_R + 1, 1.5, 2.8, C.skin);

          /* Cap: clipped to the head so the silhouette stays clean, plus a
             brim that points the way he is going. */
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, HEAD_R, 0, TAU);
          ctx.clip();
          ctx.fillStyle = SKIN.cap;
          ctx.fillRect(-HEAD_R - 2, -HEAD_R - 8, HEAD_R * 2 + 4, HEAD_R + 4);
          ctx.restore();
          if (frontOn) fillRound(-10.5, -5.4, 21, 4.6, 2.3, SKIN.cap);
          else fillRound(-4.5, -5.6, 16, 4.8, 2.4, SKIN.cap);
          fillCircle(0, -HEAD_R - 0.5, 3.2, C.white);
          ctx.fillStyle = C.red;
          ctx.font = '900 4.5px "Arial Rounded MT Bold", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('M', 0, -HEAD_R - 0.2);

          drawFace(frontOn ? 0 : 2, air, frontOn);
          ctx.restore();
        }

        function drawFace(look, air, frontOn) {
          const blinking = simTime < hero.blinkEndsAt;
          const hurt = hero.stumbleUntil > simTime;
          const gap = frontOn ? 4.6 : 4.2;
          const eyeY = 2.6;

          if (hurt) {
            /* Dazed: two little crosses. */
            ctx.strokeStyle = C.night;
            ctx.lineWidth = 1.7;
            ctx.lineCap = 'round';
            for (const side of [-1, 1]) {
              const x = look + side * gap;
              ctx.beginPath();
              ctx.moveTo(x - 2.2, eyeY - 2.2);
              ctx.lineTo(x + 2.2, eyeY + 2.2);
              ctx.moveTo(x + 2.2, eyeY - 2.2);
              ctx.lineTo(x - 2.2, eyeY + 2.2);
              ctx.stroke();
            }
          } else if (blinking) {
            ctx.strokeStyle = C.night;
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.arc(look + side * gap, eyeY - 1, 2.4, Math.PI * 0.15, Math.PI * 0.85);
              ctx.stroke();
            }
          } else {
            for (const side of [-1, 1]) {
              const x = look + side * gap;
              fillOval(x, eyeY, 2.2, 2.9, C.night);
              fillCircle(x + 0.8, eyeY - 1.2, 0.9, C.white);
            }
          }

          /* Cheeks: the one warm note in the whole piece. */
          fillOval(look - gap - 3.2, eyeY + 3.8, 2.3, 1.5, C.blush);
          fillOval(look + gap + 3.2, eyeY + 3.8, 2.3, 1.5, C.blush);

          /* The button moustache and red cap make the tiny silhouette read as
             Mario even before the viewer notices the little M badge. */
          fillOval(look - 2.8, eyeY + 4.4, 3.2, 1.9, C.cocoa);
          fillOval(look + 2.8, eyeY + 4.4, 3.2, 1.9, C.cocoa);

          /* Mouth: an open O in the air, a small smile on the ground. */
          if (air > 0.25) {
            fillOval(look, eyeY + 7.1, 1.5, 1.9, C.night);
          } else {
            ctx.strokeStyle = C.night;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(look, eyeY + 6.2, 2.1, Math.PI * 0.12, Math.PI * 0.88);
            ctx.stroke();
          }
        }

        function drawRescueSparkles(sx, sy) {
          const t = clamp((hero.rescuedUntil - simTime) / 0.6, 0, 1);
          ctx.save();
          ctx.globalAlpha = t;
          for (let i = 0; i < 6; i += 1) {
            const a = (i / 6) * TAU + simTime * 2;
            const d = 22 + (1 - t) * 20;
            sparkle(sx + Math.cos(a) * d, sy - 22 + Math.sin(a) * d, 3 + t * 3, C.mid);
          }
          ctx.restore();
        }

        function screenY(worldY) {
          return height - hudHeight() - (worldY - cameraY);
        }

        /* -- INPUT (unchanged) -- */

        function onKeyDown(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = true;
            markManual();
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = true;
            jumpBufferedUntil = simTime + 0.14;
            markManual();
            event.preventDefault();
          } else if (event.key === 'r' || event.key === 'R') {
            reset(randomSeed());
            event.preventDefault();
          }
        }

        function onKeyUp(event) {
          if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
            keys.left = false;
            event.preventDefault();
          } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
            keys.right = false;
            event.preventDefault();
          } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || event.key === ' ') {
            keys.jump = false;
            event.preventDefault();
          }
        }

        function onPointerDown(event) {
          canvas.focus({ preventScroll: true });
          pointer.active = true;
          pointer.x = event.clientX;
          pointer.startX = event.clientX;
          pointer.startY = event.clientY;
          pointer.downAt = performance.now();
          pointer.moved = false;
          markManual();
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        }

        function onPointerMove(event) {
          if (!pointer.active) return;
          pointer.x = event.clientX;
          if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 8) pointer.moved = true;
          markManual();
          event.preventDefault();
        }

        function onPointerUp(event) {
          if (!pointer.active) return;
          const elapsed = performance.now() - pointer.downAt;
          const wasTap = elapsed < 180 && !pointer.moved;
          pointer.active = false;
          if (wasTap) reset(randomSeed());
          else manualUntil = simTime + 1.2;
          event.preventDefault();
        }

        function markManual() {
          manualUntil = simTime + 3.2;
        }

        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function rand(min, max) {
          return min + rng() * (max - min);
        }

        function mod(value, amount) {
          return ((value % amount) + amount) % amount;
        }

        function mixColor(a, b, t) {
          const ca = hexToRgb(a);
          const cb = hexToRgb(b);
          const r = Math.round(lerp(ca.r, cb.r, t));
          const g = Math.round(lerp(ca.g, cb.g, t));
          const bl = Math.round(lerp(ca.b, cb.b, t));
          return `rgb(${r}, ${g}, ${bl})`;
        }

        function hexToRgb(value) {
          const hex = value.replace('#', '');
          return {
            r: Number.parseInt(hex.slice(0, 2), 16),
            g: Number.parseInt(hex.slice(2, 4), 16),
            b: Number.parseInt(hex.slice(4, 6), 16),
          };
        }
      })();
    </script>
  </body>
</html>
