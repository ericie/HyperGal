<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Apical · Hypermedia Club</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eeeade;color:#354333;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}canvas{display:block;width:100%;height:100%}header{position:absolute;top:32px;left:36px;pointer-events:none}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;letter-spacing:-1px;margin:0 0 10px}header p{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:0;opacity:.7}footer{position:absolute;bottom:28px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:10px}#readout{letter-spacing:1px;font-variant-numeric:tabular-nums}nav{display:flex;gap:8px}button{font:inherit;color:inherit;background:#eeeadeb8;border:1px solid #35433340;border-radius:2px;padding:9px 12px;cursor:pointer}button:hover{background:#fff8}button:focus-visible{outline:2px solid #354333;outline-offset:3px}#error{position:absolute;inset:30%;line-height:1.7;text-align:center}#error[hidden]{display:none}@media(max-width:600px){header{top:24px;left:24px}footer{left:24px;right:24px;bottom:20px;align-items:flex-start;flex-direction:column}h1{font-size:30px}header p{font-size:9px}}
</style>
</head>
<body>
<canvas aria-label="A generative three-dimensional plant growing upward, followed by a slowly orbiting camera"></canvas>
<header><h1>Apical</h1><p>A study in becoming</p></header>
<footer><span id="readout"></span><nav aria-label="Sketch controls"><button id="pause">Pause</button><button id="restart">New seed</button><button id="save">Save image</button></nav></footer>
<p id="error" role="alert" hidden></p>
<script src="plant.js"></script>
</body>
</html>
