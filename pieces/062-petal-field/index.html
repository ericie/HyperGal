<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Petal Field · Hypermedia Club</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee5d4;color:#392c30;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}#field{position:absolute;inset:0;isolation:isolate}canvas{position:absolute;inset:0;width:100%;height:100%}header,footer{position:absolute;z-index:20}header{top:28px;left:32px;pointer-events:none;background:#eee5d4d9;padding:14px 18px}h1{font:normal 30px Georgia,serif;margin:0 0 7px;letter-spacing:-1px}header p{margin:0;font-size:9px;letter-spacing:2px;text-transform:uppercase}footer{bottom:24px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;gap:12px}#status{font-size:10px;background:#eee5d4e8;padding:10px}nav{display:flex;gap:6px}button{font:11px ui-monospace,monospace;background:#eee5d4ee;color:#392c30;border:1px solid #392c3050;padding:10px 12px;cursor:pointer}button:hover{background:#fff5e5}button:focus-visible{outline:2px solid #392c30;outline-offset:3px}@media(max-width:600px){header{left:16px;top:16px}footer{left:16px;right:16px;bottom:16px;flex-wrap:wrap}}
