<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Switch Stack · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #000;
        overflow-x: hidden;
      }

      body {
        overscroll-behavior-y: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: #fff;
        image-rendering: pixelated;
        touch-action: pan-y;
      }

      canvas:focus-visible {
        outline: 8px solid #000;
        outline-offset: -8px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Switch Stack: an edge-to-edge masonry of word labels and light-switch diagrams changes between ON and OFF as each box crosses a hot-pink line at the vertical midpoint."
    ></canvas>

    <script>
      (() => {
        const BLACK = '#000';
        const WHITE = '#fff';
        const HOT_PINK = '#ff1493';
        const CELL_COLS = 30;
        const CELL_ROWS = 18;
        const TRANSITION_FRAMES = 10;
        const FRAME_MS = 1000 / 60;
        const TILE_RATIOS = [
          0.72, 1.08, 0.86, 1.3, 0.64, 0.96, 1.18, 0.78,
          1.38, 0.88, 1.04, 0.7, 1.24, 0.82, 1.12, 0.68,
          0.94, 1.34, 0.76, 1.16, 0.84, 1.28, 0.66, 1,
          1.2, 0.74, 1.4, 0.9, 1.1, 0.62, 1.26, 0.8,
          1.02, 1.32, 0.7, 1.14, 0.86, 1.36, 0.76, 0.98,
          1.22, 0.68, 1.06, 0.82, 1.3, 0.72, 1.16, 0.9,
        ];
        const GLYPHS = {
          O: ['11111', '10001', '10001', '10001', '10001', '10001', '11111'],
          N: ['10001', '11001', '10101', '10011', '10001', '10001', '10001'],
          F: ['11111', '10000', '10000', '11110', '10000', '10000', '10000'],
        };

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const reduceQuery =
          typeof matchMedia === 'function'
            ? matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        let viewportW = 1;
        let viewportH = 1;
        let dpr = 1;
        let boxes = [];
        let needsRender = false;
        let prefersReducedMotion = reduceQuery.matches;

        const words = {
          ON: makeWord('ON'),
          OFF: makeWord('OFF'),
        };

        resize();
        addEventListener('resize', resize, { passive: true });
        addEventListener('scroll', requestRender, { passive: true });
        if (typeof reduceQuery.addEventListener === 'function') {
          reduceQuery.addEventListener('change', handleMotionPreference);
        } else if (typeof reduceQuery.addListener === 'function') {
          reduceQuery.addListener(handleMotionPreference);
        }

        function resize() {
          viewportW = Math.max(1, innerWidth);
          viewportH = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(viewportW * dpr);
          canvas.height = Math.round(viewportH * dpr);
          canvas.style.width = `${viewportW}px`;
          canvas.style.height = `${viewportH}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
          compose();
          requestRender();
        }

        function compose() {
          const columns = Math.max(2, Math.min(5, Math.ceil(viewportW / 320)));
          const columnHeights = Array(columns).fill(0);

          boxes = [];
          for (let id = 0; id < TILE_RATIOS.length; id += 1) {
            const column = shortestColumn(columnHeights);
            const x = Math.round((column * viewportW) / columns);
            const nextX = Math.round(((column + 1) * viewportW) / columns);
            const w = nextX - x;
            const h = Math.max(112, Math.round(w * TILE_RATIOS[id]));
            const y = columnHeights[column];

            boxes.push({
              id,
              x,
              y,
              w,
              h,
              kind: id % 2 === 0 ? 'switch' : 'word',
              order: makeDitherOrder(id),
              initialized: false,
              targetOff: false,
              progress: 0,
              fromProgress: 0,
              toProgress: 0,
              animationStart: 0,
              animating: false,
            });
            columnHeights[column] += h;
          }

          const contentH = Math.max(...columnHeights);
          document.body.style.height = `${Math.max(viewportH, contentH + Math.ceil(viewportH / 2))}px`;
        }

        function requestRender() {
          if (needsRender) return;
          needsRender = true;
          requestAnimationFrame(render);
        }

        function render(now = performance.now()) {
          needsRender = false;
          const scrollY = pageYOffset || document.documentElement.scrollTop || 0;
          const midpoint = Math.round(viewportH / 2);
          let isAnimating = false;

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = WHITE;
          ctx.fillRect(0, 0, viewportW, viewportH);

          for (const box of boxes) {
            const y = Math.round(box.y - scrollY);
            if (y > viewportH + 80 || y + box.h < -80) continue;
            const centerY = y + box.h / 2;
            const targetOff = centerY <= midpoint;

            updateBoxState(box, targetOff, now);
            isAnimating = box.animating || isAnimating;
            drawBox(box, y);
          }

          drawMidpoint(midpoint);
          if (isAnimating) requestRender();
        }

        function handleMotionPreference(event) {
          prefersReducedMotion = event.matches;
          if (prefersReducedMotion) {
            for (const box of boxes) {
              box.progress = box.targetOff ? 1 : 0;
              box.fromProgress = box.progress;
              box.toProgress = box.progress;
              box.animating = false;
            }
          }
          requestRender();
        }

        function updateBoxState(box, targetOff, now) {
          const targetProgress = targetOff ? 1 : 0;

          if (!box.initialized) {
            box.initialized = true;
            box.targetOff = targetOff;
            box.progress = targetProgress;
            box.fromProgress = targetProgress;
            box.toProgress = targetProgress;
            return;
          }

          if (targetOff !== box.targetOff) {
            box.targetOff = targetOff;
            box.fromProgress = box.progress;
            box.toProgress = targetProgress;
            box.animationStart = now;
            box.animating = !prefersReducedMotion;

            if (prefersReducedMotion) box.progress = targetProgress;
          }

          if (!box.animating) return;

          const frame = Math.min(
            TRANSITION_FRAMES,
            Math.floor((now - box.animationStart) / FRAME_MS) + 1,
          );
          const amount = frame / TRANSITION_FRAMES;
          box.progress = box.fromProgress + (box.toProgress - box.fromProgress) * amount;

          if (frame === TRANSITION_FRAMES) {
            box.progress = box.toProgress;
            box.animating = false;
          }
        }

        function drawBox(box, y) {
          const progress = box.progress;
          const border = Math.round(clamp(Math.min(box.w, box.h) * 0.035, 5, 12));
          const innerX = box.x + border;
          const innerY = y + border;
          const innerW = box.w - border * 2;
          const innerH = box.h - border * 2;

          ctx.fillStyle = BLACK;
          ctx.fillRect(box.x, y, box.w, box.h);

          if (box.kind === 'switch') {
            ctx.fillStyle = progress >= 0.52 ? WHITE : BLACK;
            ctx.fillRect(innerX, innerY, innerW, innerH);
          } else if (progress >= 1) {
            ctx.fillStyle = WHITE;
            ctx.fillRect(innerX, innerY, innerW, innerH);
          } else if (progress > 0) {
            const whiteCells = Math.floor(progress * box.order.length);
            const cellW = innerW / CELL_COLS;
            const cellH = innerH / CELL_ROWS;
            ctx.fillStyle = WHITE;

            for (let i = 0; i < whiteCells; i += 1) {
              const cell = box.order[i];
              const x1 = Math.floor(innerX + cell.x * cellW);
              const y1 = Math.floor(innerY + cell.y * cellH);
              const x2 = Math.ceil(innerX + (cell.x + 1) * cellW);
              const y2 = Math.ceil(innerY + (cell.y + 1) * cellH);
              ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
            }
          }

          drawBorder(box.x, y, box.w, box.h, border);
          const fieldIsWhite = progress >= 0.52;
          const inkColor = fieldIsWhite ? BLACK : WHITE;
          const fieldColor = fieldIsWhite ? WHITE : BLACK;

          if (box.kind === 'switch') {
            drawSwitchDiagram(box.x, y, box.w, box.h, progress, inkColor, fieldColor);
            return;
          }

          if (progress < 0.52) {
            drawWord(box.targetOff ? words.OFF : words.ON, box.x, y, box.w, box.h, WHITE, BLACK);
          } else {
            drawWord(box.targetOff ? words.OFF : words.ON, box.x, y, box.w, box.h, BLACK, WHITE);
          }
        }

        function drawSwitchDiagram(x, y, w, h, offAmount, color, fieldColor) {
          const plateH = Math.round(Math.min(h * 0.84, w * 1.05));
          const plateW = Math.round(Math.min(w * 0.66, plateH * 0.7));
          const plateX = Math.round(x + (w - plateW) / 2);
          const plateY = Math.round(y + (h - plateH) / 2);
          const unit = Math.max(2, Math.round(Math.min(plateW, plateH) * 0.035));
          const screwSize = Math.max(3, unit * 2);
          const centerX = Math.round(plateX + plateW / 2);
          const pivotY = Math.round(plateY + plateH / 2);

          ctx.fillStyle = fieldColor;
          ctx.fillRect(plateX, plateY, plateW, plateH);
          drawOutline(plateX, plateY, plateW, plateH, unit, color);

          drawScrew(centerX, plateY + unit * 3, screwSize, color, fieldColor);
          drawScrew(centerX, plateY + plateH - unit * 3, screwSize, color, fieldColor);

          const labelCell = Math.max(
            1,
            Math.min(
              Math.floor((plateW * 0.52) / words.OFF.cols),
              Math.floor((plateH * 0.15) / words.OFF.rows),
            ),
          );
          drawMiniWord(
            words.ON,
            centerX,
            plateY + Math.round(plateH * 0.19),
            labelCell,
            color,
          );
          drawMiniWord(
            words.OFF,
            centerX,
            plateY + Math.round(plateH * 0.81),
            labelCell,
            color,
          );

          const openingW = Math.max(unit * 6, Math.round(plateW * 0.34));
          const openingH = Math.max(unit * 9, Math.round(plateH * 0.36));
          const openingX = Math.round(centerX - openingW / 2);
          const openingY = Math.round(pivotY - openingH / 2);
          ctx.fillStyle = color;
          ctx.fillRect(openingX, openingY, openingW, openingH);
          ctx.fillStyle = fieldColor;
          ctx.fillRect(
            openingX + unit,
            openingY + unit,
            openingW - unit * 2,
            openingH - unit * 2,
          );

          const travelY = openingH * 0.28;
          const travelX = openingW * 0.16;
          const endX = centerX + lerp(travelX, -travelX, offAmount);
          const endY = pivotY + lerp(-travelY, travelY, offAmount);

          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = unit * 2;
          ctx.lineCap = 'square';
          ctx.beginPath();
          ctx.moveTo(centerX, pivotY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.restore();

          const capW = Math.max(unit * 4, Math.round(openingW * 0.56));
          const capH = Math.max(unit * 2, Math.round(openingH * 0.09));
          ctx.fillStyle = color;
          ctx.fillRect(
            Math.round(endX - capW / 2),
            Math.round(endY - capH / 2),
            capW,
            capH,
          );

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(centerX, pivotY, unit * 2.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = fieldColor;
          ctx.beginPath();
          ctx.arc(centerX, pivotY, unit * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawOutline(x, y, w, h, thickness, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, w, thickness);
          ctx.fillRect(x, y + h - thickness, w, thickness);
          ctx.fillRect(x, y, thickness, h);
          ctx.fillRect(x + w - thickness, y, thickness, h);
        }

        function drawScrew(centerX, centerY, size, color, fieldColor) {
          const x = Math.round(centerX - size / 2);
          const y = Math.round(centerY - size / 2);
          ctx.fillStyle = color;
          ctx.fillRect(x, y, size, size);
          ctx.fillStyle = fieldColor;
          ctx.fillRect(centerX - Math.max(1, Math.floor(size * 0.32)), centerY, Math.max(2, Math.floor(size * 0.64)), 1);
        }

        function drawMiniWord(word, centerX, centerY, cell, color) {
          const wordW = word.cols * cell;
          const wordH = word.rows * cell;
          const startX = Math.round(centerX - wordW / 2);
          const startY = Math.round(centerY - wordH / 2);

          ctx.fillStyle = color;
          for (const dot of word.dots) {
            ctx.fillRect(startX + dot.x * cell, startY + dot.y * cell, cell, cell);
          }
        }

        function drawBorder(x, y, w, h, thickness) {
          ctx.fillStyle = BLACK;
          ctx.fillRect(x, y, w, thickness);
          ctx.fillRect(x, y + h - thickness, w, thickness);
          ctx.fillRect(x, y, thickness, h);
          ctx.fillRect(x + w - thickness, y, thickness, h);
        }

        function drawWord(word, x, y, w, h, color, fieldColor) {
          const maxCellW = Math.floor((w * 0.72) / word.cols);
          const maxCellH = Math.floor((h * 0.42) / word.rows);
          const cell = Math.max(5, Math.min(maxCellW, maxCellH));
          const wordW = word.cols * cell;
          const wordH = word.rows * cell;
          const startX = Math.round(x + (w - wordW) / 2);
          const startY = Math.round(y + (h - wordH) / 2);
          const pad = Math.max(2, Math.round(cell * 0.24));

          ctx.fillStyle = fieldColor;
          ctx.fillRect(startX - pad, startY - pad, wordW + pad * 2, wordH + pad * 2);
          ctx.fillStyle = color;
          for (const dot of word.dots) {
            ctx.fillRect(startX + dot.x * cell, startY + dot.y * cell, cell, cell);
          }
        }

        function drawMidpoint(midpoint) {
          const h = Math.round(clamp(viewportH * 0.006, 4, 8));
          ctx.fillStyle = HOT_PINK;
          ctx.fillRect(0, midpoint - Math.floor(h / 2), viewportW, h);
        }

        function shortestColumn(heights) {
          let result = 0;
          for (let index = 1; index < heights.length; index += 1) {
            if (heights[index] < heights[result]) result = index;
          }
          return result;
        }

        function makeWord(text) {
          const chars = text.split('');
          const rows = 7;
          const cols = chars.length * 5 + Math.max(0, chars.length - 1);
          const dots = [];
          let offset = 0;

          for (const char of chars) {
            const glyph = GLYPHS[char];
            for (let y = 0; y < rows; y += 1) {
              for (let x = 0; x < 5; x += 1) {
                if (glyph[y][x] === '1') dots.push({ x: offset + x, y });
              }
            }
            offset += 6;
          }

          return { cols, rows, dots };
        }

        function makeDitherOrder(seed) {
          const cells = [];
          for (let y = 0; y < CELL_ROWS; y += 1) {
            for (let x = 0; x < CELL_COLS; x += 1) {
              const sweep = x / (CELL_COLS - 1) * 0.2 + y / (CELL_ROWS - 1) * 0.12;
              const checker = ((x + y + seed) % 2) * 0.06;
              cells.push({ x, y, rank: hash01(seed, x, y) * 0.74 + sweep + checker });
            }
          }
          cells.sort((a, b) => a.rank - b.rank);
          return cells;
        }

        function hash01(seed, x, y) {
          let n = Math.imul(seed + 1, 374761393) ^ Math.imul(x + 11, 668265263) ^ Math.imul(y + 17, 2246822519);
          n = Math.imul(n ^ (n >>> 13), 1274126177);
          return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
        }

        function lerp(start, end, amount) {
          return start + (end - start) * amount;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }
      })();
    </script>
  </body>
</html>
