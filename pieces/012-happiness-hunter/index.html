            drawSteppedBubble(-alertW / 2, -27, alertW, 58, 'rgba(3, 4, 7, 0.88)', hot, -burst.side);
            drawStackedChainText(copy, 0, -7, alertW - 8, hot);
            drawPixelText(`x${burst.chain}`, 0, 23, clamp(alertW * 0.16, 11, 17), '#fffbe2', 'center');
          } else if (burst.variant === 3) {
            const radius = clamp(placement.width * 0.38, 18, 44);
            drawPixelDiamond(0, 0, radius, 'rgba(3, 4, 7, 0.84)', hot);
            drawPixelText(`x${burst.chain}`, 0, 6, clamp(radius * 0.55, 13, 23), '#fffbe2', 'center');
            drawStackedChainText(copy, 0, radius + 18, placement.width, hot);
          } else {
            drawStackedChainText(copy, 0, -5, placement.width, hot);
            for (let i = -2; i <= 2; i += 1) {
              const spacing = Math.min(17, placement.width / 5);
              drawPixelBubble(i * spacing, 26 + Math.abs(i) * 3, 4 + (i === 0 ? 2 : 0), i % 2 ? cool : hot, COLORS.ink);
            }
          }
          ctx.restore();
        }

        function chainOverlayPlacement(burst) {
          const roadRight = roadLeft + roadWidth;
          const leftWidth = Math.max(0, roadLeft - 8);
          const rightWidth = Math.max(0, width - roadRight - 8);
          let side = burst.side;
          if (side < 0 && leftWidth < 28 && rightWidth > leftWidth) side = 1;
          if (side > 0 && rightWidth < 28 && leftWidth > rightWidth) side = -1;
          const gutterWidth = side < 0 ? leftWidth : rightWidth;
          return {
            side,
            width: Math.max(24, gutterWidth),
            x: side < 0 ? 4 + gutterWidth / 2 : roadRight + 4 + gutterWidth / 2,
          };
        }

        function drawStackedChainText(text, x, y, maxWidth, color) {
          const words = text.replace(/!+$/, '').split(' ');
          const longest = Math.max(...words.map((word) => word.length));
          const size = clamp(maxWidth / Math.max(3.2, longest * 0.62), 9, 19);
          const lineHeight = size + 3;
          const startY = y - ((words.length - 1) * lineHeight) / 2;
          words.forEach((word, index) => {
            drawPixelText(word, x, startY + index * lineHeight, size, color, 'center');
          });
        }

        function chainCopy(burst) {
          if (burst.milestone) {
            if (burst.chain === 5) return burst.amount > 0 ? 'FIVE PASSES!' : 'FIVE LOST!';
            const wins = ['OVERTAKE RUN!', 'FLYING LAP!', 'POLE PACE!'];
            const losses = ['LOSING GROUND!', 'OFF THE PACE!', 'BOXED IN!'];
            const milestones = burst.amount > 0 ? wins : losses;
            return milestones[Math.floor(burst.chain / 5) % milestones.length];
          }
          const positive = ['CLEAN PASS', 'TWO WIDE', 'HOT LAP', 'PASSING STREAK', 'FULL THROTTLE'];
          const negative = ['GOT PASSED', 'OFF PACE', 'LOST POSITION', 'BACK MARKER', 'FIND A GAP'];
          const options = burst.amount > 0 ? positive : negative;
          return options[burst.variant % options.length];
        }

        function drawSteppedBubble(x, y, w, h, fill, border, tailSide) {
          rect(x + 6, y, w - 12, h, border);
          rect(x, y + 6, w, h - 12, border);
          rect(x + 6, y + 5, w - 12, h - 10, fill);
          rect(x + 5, y + 7, w - 10, h - 14, fill);
          const tailX = tailSide < 0 ? x + 13 : x + w - 19;
          rect(tailX, y + h - 1, 12, 6, border);
          rect(tailX + (tailSide < 0 ? 0 : 6), y + h + 5, 6, 6, border);
        }

        function drawPixelBubble(x, y, radius, fill, border) {
          rect(x - radius, y - radius - 2, radius * 2, radius * 2 + 4, border);
          rect(x - radius - 2, y - radius, radius * 2 + 4, radius * 2, border);
          rect(x - radius + 2, y - radius, radius * 2 - 4, radius * 2, fill);
          rect(x - radius, y - radius + 2, radius * 2, radius * 2 - 4, fill);
        }

        function drawPixelDiamond(x, y, radius, fill, border) {
          const step = 6;
          for (let offset = -radius; offset <= radius; offset += step) {
            const half = radius - Math.abs(offset);
            rect(x - half - 3, y + offset, half * 2 + 6, step, border);
            if (half > 6) rect(x - half + 3, y + offset, half * 2 - 6, step, fill);
          }
        }

        function drawPixelBurst(x, y, radius, color, t) {
          const blink = prefersReducedMotion || Math.floor(t * 8) % 2 === 0;
          const ray = blink ? 18 : 11;
          rect(x - 3, y - radius, 6, ray, color);
          rect(x - 3, y + radius - ray, 6, ray, color);
          rect(x - radius, y - 3, ray, 6, color);
          rect(x + radius - ray, y - 3, ray, 6, color);
          rect(x - radius * 0.72, y - radius * 0.72, 10, 10, color);
          rect(x + radius * 0.62, y - radius * 0.72, 10, 10, color);
          rect(x - radius * 0.72, y + radius * 0.62, 10, 10, color);
          rect(x + radius * 0.62, y + radius * 0.62, 10, 10, color);
        }

        function formatScore(value) {
          const absolute = String(Math.abs(value)).padStart(3, '0');
          return value < 0 ? `-${absolute}` : absolute;
        }

        function formatDelta(value) {
          return value > 0 ? `+${value}` : String(value);
        }

        function drawMiniMeter(x, y) {
          const w = clamp(width * 0.18, 110, 190);
          rect(x, y, w, 5, 'rgba(255, 255, 255, 0.18)');
          rect(x, y, w * clamp(hero.speed / 38, 0, 1), 5, HERO_YELLOW);
          rect(x, y + 10, w, 5, 'rgba(255, 255, 255, 0.18)');
          const traffic = clamp(cars.filter((car) => Math.abs(car.s - hero.s) < 90).length / 18, 0, 1);
          rect(x, y + 10, w * traffic, 5, '#aeb6c1');
        }

        function drawCone(x, y) {
          rect(x - 5, y + 6, 10, 4, COLORS.ink);
          rect(x - 4, y - 4, 8, 10, COLORS.cone);
          rect(x - 3, y, 6, 2, '#fff6d5');
        }

        function drawPixelText(text, x, y, size, color, align) {
          ctx.font = `700 ${Math.round(size)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
          ctx.textAlign = align;
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillText(text, Math.round(x + 2), Math.round(y + 2));
          ctx.fillStyle = color;
          ctx.fillText(text, Math.round(x), Math.round(y));
        }

        function laneCenter(lane) {
          return roadLeft + (lane + 0.5) * laneWidth;
        }

        function exitRampGeometry(s) {
          const bounds = roadBoundsAt(s);
          const startY = worldToY(s);
          const half = clamp(laneWidth * 0.3, 18, 44);
          const shoulder = clamp(laneWidth * 0.09, 6, 14);
          const startX = bounds.right - half;
          const endX = width + Math.max(laneWidth * 0.58, 64);
          const endY = startY - clamp((endX - startX) * 0.58, 142, height * 0.46);
          const curveX = startX + (endX - startX) * 0.38;
          const curveY = startY + (endY - startY) * 0.38;
          return {
            startX,
            startY,
            roadRight: bounds.right,
            curveX,
            curveY,
            endX,
            endY,
            half,
            shoulder,
          };
        }

        function exitVehiclePosition(vehicle) {
          const ramp = exitRampGeometry(vehicle.exitTarget ?? vehicle.s);
          const amount = smoothstep(clamp(vehicle.exitProgress / 1.08, 0, 1));
          const split = 0.46;
          let x;
          let y;
          let tangentX;
          let tangentY;

          if (amount < split) {
            const t = amount / split;
            x = ramp.startX + (ramp.curveX - ramp.startX) * t;
            y = ramp.startY + (ramp.curveY - ramp.startY) * t;
            tangentX = ramp.curveX - ramp.startX;
            tangentY = ramp.curveY - ramp.startY;
          } else {
            const t = (amount - split) / (1 - split);
            x = ramp.curveX + (ramp.endX - ramp.curveX) * t;
            y = ramp.curveY + (ramp.endY - ramp.curveY) * t;
            tangentX = ramp.endX - ramp.curveX;
            tangentY = ramp.endY - ramp.curveY;
          }

          return {
            x: pixelSnap(x, 3),
            y: pixelSnap(y, 3),
            angle: Math.atan2(tangentY, tangentX) + Math.PI / 2,
          };
        }

        function vehicleBox(vehicle) {
          const size = vehicleDrawSize(vehicle);
          if (vehicle.exiting) {
            const position = exitVehiclePosition(vehicle);
            return {
              x: position.x,
              w: size.w,
              h: size.h,
            };
          }
          return {
            x: laneCenter(vehicle.drawLane ?? vehicle.lane),
            w: size.w,
            h: size.h,
          };
        }

        function vehicleDrawSize(vehicle) {
          if (vehicle.kind === 'semi') {
            return {
              w: clamp(laneWidth * 0.42, 20, 34),
              h: clamp(laneWidth * 0.95, 50, 78),
            };
          }
          if (vehicle.kind === 'bus') {
            return {
              w: clamp(laneWidth * 0.4, 19, 32),
              h: clamp(laneWidth * 0.84, 46, 70),
            };
          }
          return {
            w: vehicle.isHero ? clamp(laneWidth * 0.42, 20, 34) : clamp(laneWidth * 0.36, 17, 29),
            h: vehicle.isHero ? clamp(laneWidth * 0.72, 34, 56) : clamp(laneWidth * 0.62, 30, 48),
          };
        }

        function visualHalfLength(vehicle) {
          return (vehicleDrawSize(vehicle).h / Math.max(1, metersToPixels)) * 0.5;
        }

        function worldToY(s) {
          return heroScreenY - (s - cameraS) * metersToPixels;
        }

        function screenToWorldY(y) {
          return cameraS + (heroScreenY - y) / metersToPixels;
        }

        function pixelBounds(bounds, size) {
          const left = pixelSnap(bounds.left, size);
          const right = pixelSnap(bounds.right, size);
          return { left, right, width: Math.max(size, right - left) };
        }

        function pixelSnap(value, size) {
          return Math.round(value / size) * size;
        }

        function easeOutQuart(value) {
          return 1 - Math.pow(1 - clamp(value, 0, 1), 4);
        }

        function rect(x, y, w, h, fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function strokeRect(x, y, w, h, stroke, lineWidth) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function shade(hex, amount) {
          const value = Number.parseInt(hex.slice(1), 16);
          const r = clamp(((value >> 16) & 255) + amount * 255, 0, 255);
          const g = clamp(((value >> 8) & 255) + amount * 255, 0, 255);
          const b = clamp((value & 255) + amount * 255, 0, 255);
          return `rgb(${r | 0}, ${g | 0}, ${b | 0})`;
        }

        function mulberry32(a) {
          return function randValue() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function rand(min, max) {
          return min + random() * (max - min);
        }

        function randInt(min, max) {
          return Math.floor(rand(min, max + 1));
        }

        function pick(items) {
          return items[Math.floor(random() * items.length)];
        }

        function range(start, end) {
          const values = [];
          for (let i = start; i < end; i += 1) values.push(i);
          return values;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function mod(value, size) {
          return ((value % size) + size) % size;
        }

        function hash01(value) {
          const x = Math.sin(value) * 43758.5453123;
          return x - Math.floor(x);
        }

        addEventListener('pagehide', () => cancelAnimationFrame(raf), { once: true });
      })();
    </script>
  </body>
</html>
