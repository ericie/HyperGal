<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happiness Hunter · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070910;
        color: #f7f2d8;
        overflow: hidden;
      }

      body {
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: #070910;
        cursor: crosshair;
        image-rendering: pixelated;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid #ffd21f;
        outline-offset: -10px;
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Happiness Hunter: one yellow car and many gray cars slide between lanes on a narrow highway, passing alternating fields, avoiding obstacles, and scoring only when the yellow car passes traffic."
    ></canvas>

    <script>
      (() => {
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const reduceQuery =
          typeof matchMedia === 'function'
            ? matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        const TAU = Math.PI * 2;
        const LANES = 5;
        const ROAD_PATTERN = [5, 4, 2, 5, 3, 2, 4, 5];
        const ROAD_TRANSITION_METERS = 88;
        const HERO_YELLOW = '#ffd21f';
        const TRAFFIC_GRAYS = ['#545b65', '#656d78', '#777f8a', '#8a929d', '#9da4ae'];
        const FIELD_COLORS = ['#173b27', '#244d31', '#315b36', '#3d622f'];
        const COLORS = {
          sky: '#070910',
          asphalt: '#1a1f28',
          shoulder: '#34404d',
          lane: '#dce7f2',
          laneDim: 'rgba(220, 231, 242, 0.18)',
          ink: '#030407',
          hud: '#f8f4df',
          hudHot: '#fff6a8',
          amber: '#ffb000',
          amberOff: '#5a4208',
          blue: '#33d6ff',
          green: '#17c964',
          red: '#ff3b2f',
          cone: '#ff7a1a',
          barricade: '#f5f2df',
          grayCar: '#737b86',
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let roadLeft = 0;
        let roadWidth = 1;
        let laneWidth = 1;
        let metersToPixels = 5;
        let heroScreenY = 1;
        let cameraS = 0;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let hero = null;
        let cars = [];
        let obstacles = [];
        let exits = [];
        let roadSections = [];
        let score = 0;
        let nextCarId = 1;
        let nextObstacleS = 180;
        let nextExitS = 620;
        let nextRoadSectionS = 260;
        let roadPatternIndex = 0;
        let lastFrameAt = 0;
        let raf = 0;
        let prefersReducedMotion = reduceQuery.matches;
        let scoreRun = { sign: 0, count: 0, total: 0 };
        let scoreHistory = [];
        let scoreBursts = [];

        resize();
        reset();
        addEventListener('resize', resize, { passive: true });
        canvas.addEventListener('pointerdown', reseed, { passive: true });
        canvas.addEventListener('keydown', (event) => {
          if (event.key === 'r' || event.key === 'R') reseed();
        });
        if (typeof reduceQuery.addEventListener === 'function') {
          reduceQuery.addEventListener('change', (event) => {
            prefersReducedMotion = event.matches;
          });
        } else if (typeof reduceQuery.addListener === 'function') {
          reduceQuery.addListener((event) => {
            prefersReducedMotion = event.matches;
          });
        }
        raf = requestAnimationFrame(tick);

        function seedFromLocation() {
          const params = new URLSearchParams(location.search);
          const fromQuery = Number.parseInt(params.get('seed') || '', 36);
          if (Number.isFinite(fromQuery)) return fromQuery >>> 0;
          return ((Date.now() * 2654435761) ^ (Math.random() * 0xffffffff)) >>> 0;
        }

        function reseed() {
          seed = ((Date.now() * 1103515245) ^ (Math.random() * 0xffffffff)) >>> 0;
          reset();
        }

        function reset() {
          random = mulberry32(seed);
          nextCarId = 1;
          score = 0;
          scoreRun = { sign: 0, count: 0, total: 0 };
          scoreHistory = [];
          scoreBursts = [];
          hero = {
            id: 'hero',
            isHero: true,
            s: 0,
            lane: Math.floor(LANES / 2),
            drawLane: Math.floor(LANES / 2),
            speed: 27,
            desiredSpeed: 38,
            length: 5.2,
            width: 1.9,
            signal: 0,
            signalUntil: 0,
            huntingOpening: false,
            gapTargetSpeed: null,
            pathTargetLane: Math.floor(LANES / 2),
            surgeActive: false,
            surgeUntil: 0,
            nextSurgeAt: 0,
            stoppedForObstacle: false,
            mergeRequestLane: null,
            mergeRequestId: 0,
            mergeRequestSince: 0,
            mergeRequestUntil: 0,
            stuckSince: 0,
          };
          cameraS = hero.s;
          cars = [];
          obstacles = [];
          exits = [];
          roadSections = [];
          roadPatternIndex = 0;
          nextObstacleS = rand(150, 230);
          nextExitS = rand(520, 740);
          seedRoadSections();
          seedTraffic();
          scheduleRoadEvents();
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
          roadWidth = Math.round(clamp(width * (width < 640 ? 0.76 : 0.58), 250, 720));
          roadLeft = Math.round((width - roadWidth) / 2);
          laneWidth = roadWidth / LANES;
          metersToPixels = clamp(height / 138, 4.3, 7.4);
          heroScreenY = height * (width < 560 ? 0.78 : 0.74);
        }

        function tick(now) {
          if (!lastFrameAt) lastFrameAt = now;
          const dtRaw = Math.min(0.045, Math.max(0.001, (now - lastFrameAt) / 1000));
          lastFrameAt = now;
          const timeScale = prefersReducedMotion ? 0.32 : 1;
          update(dtRaw * timeScale, now / 1000);
          render(now / 1000);
          raf = requestAnimationFrame(tick);
        }

        function update(dt, t) {
          for (const car of cars) car.prevDelta = car.s - hero.s;
          scheduleRoadEvents();
          maintainTraffic();
          planHero(t);
          for (const car of cars) planTrafficCar(car, t);
          updateHeroSurge(t);
          updateSpeed(hero, dt);
          for (const car of cars) updateSpeed(car, dt);
          moveVehicle(hero, dt);
          for (const car of cars) moveVehicle(car, dt);
          animateLane(hero, dt);
          for (const car of cars) animateLane(car, dt);
          enforceObstacleStops();
          enforceRoadLaneStops();
          preventOverlaps();
          updateCamera(dt);
          resolveExits(t);
          updateScore(t);
          trimOldEvents();
        }

        function seedTraffic() {
          for (let lane = 0; lane < LANES; lane += 1) {
            let s = hero.s - 130 + rand(0, 28);
            while (s < hero.s + 360) {
              s += rand(48, 96);
              if (lane === hero.lane && Math.abs(s - hero.s) < 32) s += 38;
              if (spotIsFree(lane, s, 16, null)) cars.push(makeCar(lane, s));
            }
          }
        }

        function maintainTraffic() {
          cars = cars.filter((car) => {
            if (car.exiting) return car.exitProgress < 1.18;
            const delta = car.s - hero.s;
            return delta > -155 && delta < 470;
          });

          for (let lane = 0; lane < LANES; lane += 1) {
            let maxS = -Infinity;
            let minS = Infinity;
            for (const car of cars) {
              if (car.exiting) continue;
              if (car.lane !== lane) continue;
              maxS = Math.max(maxS, car.s);
              minS = Math.min(minS, car.s);
            }

            if (!Number.isFinite(maxS)) maxS = hero.s + rand(44, 90);
            while (maxS < hero.s + 430) {
              maxS += rand(54, 112);
              if (spotIsFree(lane, maxS, 18, null)) cars.push(makeCar(lane, maxS));
            }

            if (!Number.isFinite(minS) || minS > hero.s - 92) {
              const behind = hero.s - rand(98, 148);
              if (spotIsFree(lane, behind, 18, null)) cars.push(makeCar(lane, behind, true));
            }
          }
        }

        function makeCar(lane, s, fromBehind = false) {
          const kindRoll = random();
          const kind = kindRoll < 0.07 ? 'semi' : kindRoll < 0.16 ? 'bus' : 'car';
          const profile = random();
          let desiredSpeed;
          if (kind === 'semi') {
            desiredSpeed = profile < 0.72 ? rand(12, 26) : rand(26, 38);
          } else if (kind === 'bus') {
            desiredSpeed = profile < 0.65 ? rand(14, 30) : rand(30, 42);
          } else {
            desiredSpeed =
              profile < 0.18 ? rand(10, 22) : profile > 0.74 ? rand(40, 56) : rand(21, 41);
          }
          const ambitionBias = kind === 'car' ? 0 : kind === 'bus' ? -0.1 : -0.14;
          const ambition = clamp((desiredSpeed - 14) / 42 + rand(-0.2, 0.24) + ambitionBias, 0, 1);
          const aggressionBias = kind === 'bus' ? -0.12 : kind === 'semi' ? -0.04 : 0;
          const aggression = clamp(random() * 0.72 + ambition * 0.28 + rand(-0.18, 0.18) + aggressionBias, 0, 1);
          const length = kind === 'semi' ? rand(8.8, 11.6) : kind === 'bus' ? rand(7.1, 9.2) : rand(4.0, 5.5);
          const widthM = kind === 'car' ? rand(1.65, 2.0) : rand(2.05, 2.34);
          const accelBase =
            kind === 'semi' ? rand(1.1, 2.6) : kind === 'bus' ? rand(1.5, 3.4) : rand(2.9, 6.8);
          const brakeBase =
            kind === 'semi' ? rand(6.5, 9.6) : kind === 'bus' ? rand(7.2, 10.4) : rand(8.8, 13.8);
          const car = {
            id: nextCarId,
            kind,
            s,
            prevDelta: s - hero.s,
            lane,
            drawLane: lane,
            speed: clamp(desiredSpeed + (fromBehind ? rand(-6, 8) : rand(-13, 7)), 6, 56),
            desiredSpeed,
            ambition,
            aggression,
            accel: accelBase + ambition * (kind === 'car' ? 2.4 : 1.25),
            brake: brakeBase,
            mergeFrontScale: 1.28 - aggression * 0.5,
            mergeRearScale: 1.36 - aggression * 0.54,
            mergePadding: 13.5 - aggression * 6.2,
            length,
            width: widthM,
            color: pick(TRAFFIC_GRAYS),
            signal: 0,
            signalUntil: 0,
            mergeCooldown: rand(0.45, 2.7) + (1 - aggression) * 0.6,
            huntCooldown: rand(0.15, 2.1) + (1 - aggression) * 0.8,
            signalDiscipline: clamp(random() * 0.45 + (1 - aggression) * 0.62, 0, 1),
            exitSeed: random(),
            exitTarget: null,
            exiting: false,
            exitProgress: 0,
            stoppedForObstacle: false,
            scoreFlash: 0,
            heroRequestId: 0,
            yieldsToHero: false,
            yieldUntil: 0,
            escapeObstacleId: null,
            escapeTargetLane: null,
            escapeUrgency: 0,
          };
          nextCarId += 1;
          return car;
        }

        function seedRoadSections() {
          const first = { s0: hero.s - 720, s1: hero.s + 260, start: 0, count: LANES };
          roadSections.push(first);
          nextRoadSectionS = first.s1;
          roadPatternIndex = 1;
          ensureRoadSections();
        }

        function ensureRoadSections() {
          if (!roadSections.length) seedRoadSections();
          while (nextRoadSectionS < hero.s + 1500) {
            const count = ROAD_PATTERN[roadPatternIndex % ROAD_PATTERN.length];
            const prev = roadSections[roadSections.length - 1];
            const start = chooseRoadStart(prev, count);
            const length = rand(count <= 2 ? 430 : 520, count <= 2 ? 620 : 780);
            roadSections.push({
              s0: nextRoadSectionS,
              s1: nextRoadSectionS + length,
              start,
              count,
            });
            nextRoadSectionS += length;
            roadPatternIndex += 1;
          }
        }

        function chooseRoadStart(prev, count) {
          if (count >= LANES) return 0;
          const maxStart = LANES - count;
          const candidates = [];
          for (let start = 0; start <= maxStart; start += 1) {
            const end = start + count;
            const overlap = Math.min(end, prev.start + prev.count) - Math.max(start, prev.start);
            if (overlap > 0) candidates.push(start);
          }
          return pick(candidates.length ? candidates : range(0, maxStart + 1));
        }

        function scheduleRoadEvents() {
          ensureRoadSections();
          while (nextObstacleS < hero.s + 700) {
            obstacles.push(makeObstacle(nextObstacleS));
            nextObstacleS += rand(190, 340);
          }
          while (nextExitS < hero.s + 1020) {
            exits.push({ id: nextExitS, s: nextExitS, resolved: false, flash: 0 });
            nextExitS += rand(620, 900);
          }
        }

        function makeObstacle(s) {
          const type = pick(['construction', 'police', 'deer', 'cow', 'accident']);
          const laneRange = roadLaneRangeAt(s);
          const activeCount = laneRange.end - laneRange.start;
          let lanes = [];
          let length = 8;
          if (type === 'construction') {
            const count = Math.min(randInt(2, 3), Math.max(1, activeCount - 1));
            const start = randInt(laneRange.start, laneRange.end - count);
            lanes = range(start, start + count);
            length = rand(18, 32);
          } else if (type === 'accident') {
            const count = Math.min(random() < 0.38 ? 2 : 1, Math.max(1, activeCount - 1));
            const start = randInt(laneRange.start, laneRange.end - count);
            lanes = range(start, start + count);
            length = rand(11, 18);
          } else {
            lanes = [randInt(laneRange.start, laneRange.end - 1)];
            length = rand(6, 11);
          }
          return { id: s, s, type, lanes, length, phase: rand(0, TAU) };
        }

        function trimOldEvents() {
          obstacles = obstacles.filter((obstacle) => obstacle.s > hero.s - 135);
          exits = exits.filter((exit) => exit.s > hero.s - 185);
          roadSections = roadSections.filter((section) => section.s1 > hero.s - 420);
        }

        function planHero(t) {
          expireSignal(hero, t);
          hero.stoppedForObstacle = false;
          hero.huntingOpening = false;
          hero.gapTargetSpeed = null;
          hero.pathTargetLane = hero.lane;
          if (hero.speed < 2.2) {
            if (!hero.stuckSince) hero.stuckSince = t;
          } else if (hero.speed > 6) {
            hero.stuckSince = 0;
          }
          const obstacle = nearestObstacleAheadFor(hero, hero.lane, 150);
          let requestedLane = hero.lane;
          let forced = false;
          let shouldSignal = false;

          if (obstacle && obstacle.gap < Math.max(92, hero.speed * 3.2)) {
            requestedLane = bestEscapeLane(hero, obstacle);
            forced = true;
            shouldSignal = requestedLane !== hero.lane;
          } else {
            requestedLane = bestHeroPathLane();
            hero.pathTargetLane = requestedLane;
            const front = nearestVehicleAheadFor(hero, hero.lane, 125);
            hero.huntingOpening = requestedLane !== hero.lane || Boolean(front && front.gap < 95);
            shouldSignal = requestedLane !== hero.lane;
            if (requestedLane !== hero.lane) {
              hero.gapTargetSpeed = heroGapTargetSpeed(requestedLane);
            } else if (front && front.gap < 95) {
              hero.gapTargetSpeed = Math.min(45.5, Math.max(hero.desiredSpeed, front.vehicle.speed + 8));
            }
          }

          if (
            requestedLane === hero.lane &&
            hero.stuckSince > 0 &&
            t - hero.stuckSince > 1.15
          ) {
            const courtesyLane = bestCourtesyLane();
            if (courtesyLane !== hero.lane) {
              requestedLane = courtesyLane;
              shouldSignal = true;
              hero.huntingOpening = true;
              hero.gapTargetSpeed = heroGapTargetSpeed(requestedLane);
            }
          }

          if (
            hero.mergeRequestLane != null &&
            t < hero.mergeRequestUntil &&
            Math.abs(hero.mergeRequestLane - hero.lane) === 1 &&
            laneIsOpenAt(hero.mergeRequestLane, hero.s, hero.length + 7)
          ) {
            requestedLane = hero.mergeRequestLane;
            shouldSignal = true;
            hero.huntingOpening = true;
            hero.gapTargetSpeed = heroGapTargetSpeed(requestedLane);
          }

          if (requestedLane !== hero.lane && shouldSignal) {
            maintainHeroMergeRequest(requestedLane, t);
          } else if (hero.mergeRequestLane != null) {
            clearHeroMergeRequest();
          }

          const changed = requestLaneChange(hero, requestedLane, t, shouldSignal);
          if (changed) {
            clearHeroMergeRequest();
            if (!forced) hero.gapTargetSpeed = Math.max(hero.gapTargetSpeed ?? 0, 45);
          }
          if (forced && !changed && requestedLane !== hero.lane) hero.stoppedForObstacle = true;
          if (obstacle && obstacle.gap < 36 && requestedLane === hero.lane) hero.stoppedForObstacle = true;
        }

        function maintainHeroMergeRequest(lane, t) {
          const expired = t >= hero.mergeRequestUntil;
          if (hero.mergeRequestLane !== lane || expired) {
            hero.mergeRequestLane = lane;
            hero.mergeRequestId += 1;
            hero.mergeRequestSince = t;
            hero.mergeRequestUntil = t + 4.4;
          }
          hero.signal = Math.sign(lane - hero.lane);
          hero.signalUntil = Math.max(hero.signalUntil, t + 0.32);
        }

        function clearHeroMergeRequest() {
          hero.mergeRequestLane = null;
          hero.mergeRequestSince = 0;
          hero.mergeRequestUntil = 0;
        }

        function bestCourtesyLane() {
          const options = [hero.lane - 1, hero.lane + 1]
            .filter(laneExists)
            .filter((lane) => laneIsOpenAt(lane, hero.s, hero.length + 5))
            .filter((lane) => laneActiveAt(lane, hero.s + 42))
            .filter((lane) => {
              const obstacle = nearestObstacleAheadFor(hero, lane, 24);
              return !obstacle || obstacle.gap > 12;
            })
            .sort((a, b) => laneSafetyScore(hero, b) - laneSafetyScore(hero, a));
          return options[0] ?? hero.lane;
        }

        function planTrafficCar(car, t) {
          if (car.exiting) return;
          expireSignal(car, t);
          car.stoppedForObstacle = false;
          car.escapeUrgency = 0;
          car.mergeCooldown = Math.max(0, car.mergeCooldown - 0.025);
          car.huntCooldown = Math.max(0, car.huntCooldown - 0.025);
          chooseTrafficExit(car);
          const obstacleLookahead = Math.max(158, car.speed * 4.4);
          const obstacle = nearestObstacleAheadFor(car, car.lane, obstacleLookahead);
          const front = nearestVehicleAheadFor(car, car.lane, 125);
          const exitDistance = car.exitTarget == null ? Infinity : car.exitTarget - car.s;
          const exitLane = car.exitTarget == null ? null : rightmostLaneAt(car.exitTarget);
          let requestedLane = car.lane;
          let forced = false;
          const yieldingToHero = updateCourtesyDecision(car, t);

          if (car.exitTarget != null && exitDistance < -8) {
            if (car.lane === exitLane) {
              car.exiting = true;
              car.exitProgress = 0;
              car.signal = 0;
              car.stoppedForObstacle = false;
              return;
            }
            car.exitTarget = null;
          }

          if (obstacle && obstacle.gap < obstacleLookahead) {
            requestedLane = bestEscapeLane(car, obstacle);
            forced = true;
            car.escapeUrgency = clamp((112 - obstacle.gap) / 96, 0, 1);
          } else if (car.exitTarget != null && exitDistance < 280 && car.lane !== exitLane) {
            car.escapeObstacleId = null;
            car.escapeTargetLane = null;
            requestedLane = car.lane + Math.sign(exitLane - car.lane);
          } else if (!yieldingToHero && car.mergeCooldown <= 0 && car.huntCooldown <= 0) {
            car.escapeObstacleId = null;
            car.escapeTargetLane = null;
            const trafficBound =
              front &&
              car.desiredSpeed > front.vehicle.speed + 1.4 &&
              front.gap < safeGap(car, front.vehicle) * (1.15 + car.ambition * 0.8 + car.aggression * 1.25);
            const impatient = car.aggression > 0.62 && car.ambition > 0.48 && (!front || front.gap < 135 + car.aggression * 75);
            if (trafficBound || impatient) {
              requestedLane = bestCruiseLane(car);
              car.huntCooldown = rand(0.32, 1.4) + (1 - car.ambition) * 0.55 + (1 - car.aggression) * 0.95;
            }
          }

          const shouldSignal =
            requestedLane !== car.lane &&
            (forced || car.signalDiscipline > (car.aggression > 0.68 ? 0.38 : 0.56));
          const changed = requestLaneChange(car, requestedLane, t, shouldSignal);
          if (changed) car.mergeCooldown = rand(0.55, 2.1) + (1 - car.ambition) * 0.9 + (1 - car.aggression) * 1.15;
          if (
            forced &&
            !changed &&
            requestedLane !== car.lane &&
            obstacle.gap < Math.max(18, car.speed * 0.72)
          ) {
            car.stoppedForObstacle = true;
          }
          if (obstacle && obstacle.gap < 16 && requestedLane === car.lane) car.stoppedForObstacle = true;
        }

        function updateCourtesyDecision(car, t) {
          if (
            hero.mergeRequestLane == null ||
            t >= hero.mergeRequestUntil ||
            car.lane !== hero.mergeRequestLane ||
            car.exiting
          ) {
            car.yieldsToHero = false;
            return false;
          }

          const follower = courtesyFollowerForHero(hero.mergeRequestLane, 105);
          if (!follower || follower.id !== car.id) {
            car.yieldsToHero = false;
            return false;
          }

          if (car.heroRequestId !== hero.mergeRequestId) {
            car.heroRequestId = hero.mergeRequestId;
            const courtesyChance = 0.38 + (1 - car.aggression) * 0.46;
            car.yieldsToHero =
              hash01(car.id * 31.7 + hero.mergeRequestId * 73.1 + seed * 0.00017) < courtesyChance;
            car.yieldUntil = car.yieldsToHero ? hero.mergeRequestUntil : 0;
          }

          if (car.yieldsToHero && t < car.yieldUntil) return true;
          car.yieldsToHero = false;
          return false;
        }

        function courtesyFollowerForHero(lane, maxDistance) {
          let follower = null;
          let bestDistance = Infinity;
          for (const car of cars) {
            if (car.exiting || car.lane !== lane) continue;
            const distance = hero.s - car.s;
            if (distance < -0.5 || distance >= maxDistance || distance >= bestDistance) continue;
            follower = car;
            bestDistance = distance;
          }
          return follower;
        }

        function chooseTrafficExit(car) {
          if (car.exitTarget != null || car.exiting) return;
          const exit = exits.find((item) => item.s > car.s + 70 && item.s < car.s + 360);
          if (!exit) return;
          if (hash01(car.id * 17.13 + exit.id * 0.071 + car.exitSeed * 91) < 0.34) {
            car.exitTarget = exit.s;
          }
        }

        function requestLaneChange(vehicle, requestedLane, t, shouldSignal) {
          if (requestedLane === vehicle.lane) return false;
          if (Math.abs((vehicle.drawLane ?? vehicle.lane) - vehicle.lane) > 0.035) return false;
          const direction = Math.sign(requestedLane - vehicle.lane);
          const lane = vehicle.lane + direction;
          if (!laneExists(lane)) return false;

          if (canMerge(vehicle, lane)) {
            vehicle.lane = lane;
            if (shouldSignal) {
              vehicle.signal = direction;
              vehicle.signalUntil = t + (vehicle.isHero ? 0.72 : 0.38);
            }
            return true;
          }

          if (shouldSignal) {
            vehicle.signal = direction;
            vehicle.signalUntil = Math.max(vehicle.signalUntil, t + (vehicle.isHero ? 0.25 : 0.32));
          }
          return false;
        }

        function bestEscapeLane(vehicle, obstacle) {
          const obstacleId = obstacle.id ?? `${obstacle.type}-${Math.round(obstacle.s)}`;
          const targetStillWorks =
            vehicle.escapeObstacleId === obstacleId &&
            laneExists(vehicle.escapeTargetLane) &&
            !obstacle.lanes.includes(vehicle.escapeTargetLane) &&
            laneActiveAt(vehicle.escapeTargetLane, obstacle.s + obstacle.length * 0.5 + 10);

          if (!targetStillWorks) {
            const targets = range(0, LANES)
              .filter((lane) => !obstacle.lanes.includes(lane))
              .filter((lane) => laneActiveAt(lane, vehicle.s))
              .filter((lane) => laneActiveAt(lane, obstacle.s + obstacle.length * 0.5 + 10))
              .sort((a, b) => escapeLaneScore(vehicle, b) - escapeLaneScore(vehicle, a));
            vehicle.escapeObstacleId = obstacleId;
            vehicle.escapeTargetLane = targets[0] ?? null;
          }

          if (vehicle.escapeTargetLane == null) return vehicle.lane;
          return vehicle.lane + Math.sign(vehicle.escapeTargetLane - vehicle.lane);
        }

        function escapeLaneScore(vehicle, lane) {
          const ahead = nearestVehicleAheadFor(vehicle, lane, 150);
          const behind = nearestVehicleBehindFor(vehicle, lane, 90);
          const frontGap = ahead ? ahead.gap : 150;
          const rearGap = behind ? behind.gap : 90;
          return (
            Math.min(frontGap, 120) * 0.62 +
            Math.min(rearGap, 70) * 0.28 -
            Math.abs(lane - vehicle.lane) * 13
          );
        }

        function bestCruiseLane(vehicle) {
          const current = laneSafetyScore(vehicle, vehicle.lane);
          const threshold = vehicle.isHero
            ? 10
            : 4.2 + (1 - (vehicle.ambition ?? 0.45)) * 7.2 + (1 - (vehicle.aggression ?? 0.45)) * 7.8;
          let bestLane = vehicle.lane;
          let bestScore = current;
          for (const lane of [vehicle.lane - 1, vehicle.lane + 1]) {
            if (!laneExists(lane)) continue;
            const score = laneSafetyScore(vehicle, lane) - Math.abs(lane - vehicle.lane) * 4;
            if (score > bestScore + threshold) {
              bestScore = score;
              bestLane = lane;
            }
          }
          return bestLane;
        }

        function bestHeroPathLane() {
          const current = heroLaneOpportunityScore(hero.lane);
          const front = nearestVehicleAheadFor(hero, hero.lane, 190);
          const urgency = front ? clamp((170 - front.gap) / 170, 0, 1) : 0;
          const trafficBound = front && front.vehicle.speed < hero.desiredSpeed + 5;
          const threshold = Math.max(0.75, 5.5 - urgency * 4.8 - (trafficBound ? 2.2 : 0));
          let bestLane = hero.lane;
          let bestScore = current;

          for (const lane of [hero.lane - 1, hero.lane + 1]) {
            if (!laneExists(lane)) continue;
            const score = heroLaneOpportunityScore(lane);
            if (score > bestScore + threshold) {
              bestScore = score;
              bestLane = lane;
            }
          }

          return bestLane;
        }

        function heroLaneOpportunityScore(lane) {
          if (!laneExists(lane)) return -Infinity;
          if (!laneIsOpenAt(lane, hero.s, hero.length + 7)) return -900;

          const front = nearestVehicleAheadFor(hero, lane, 280);
          const behind = nearestVehicleBehindFor(hero, lane, 150);
          const obstacle = nearestObstacleAheadFor(hero, lane, 330);
          const frontGap = front ? front.gap : 280;
          const frontSpeed = front ? front.vehicle.speed : 46;
          const obstacleGap = obstacle ? obstacle.gap : 330;
          const opening = laneOpeningSlack(hero, lane, front, behind);
          const blockedPenalty = Math.max(0, -opening) * 1.75;
          const rearPressure = behind
            ? Math.max(0, behind.vehicle.speed - hero.speed) * 3.2 + Math.max(0, 32 - behind.gap) * 0.8
            : 0;
          const mergeBonus = lane === hero.lane || canMerge(hero, lane) ? 20 : 0;

          return (
            Math.min(frontGap, 240) * 0.58 +
            clamp(frontSpeed, 16, 46) * 2.7 +
            Math.min(obstacleGap, 300) * 0.33 +
            mergeBonus -
            blockedPenalty -
            rearPressure -
            Math.abs(lane - hero.lane) * 3.5
          );
        }

        function laneOpeningSlack(vehicle, lane, ahead, behind) {
          const front = ahead ?? nearestVehicleAheadFor(vehicle, lane, 160);
          const rear = behind ?? nearestVehicleBehindFor(vehicle, lane, 160);
          const aheadSlack = front ? front.gap - safeGap(vehicle, front.vehicle) * 0.82 : 140;
          const behindNeed = rear ? mergeBehindNeed(vehicle, rear.vehicle) : 0;
          const behindSlack = rear ? rear.gap - behindNeed : 110;
          return Math.min(aheadSlack, behindSlack);
        }

        function heroGapTargetSpeed(lane) {
          if (!laneExists(lane)) return hero.desiredSpeed;
          if (canMerge(hero, lane)) return 46;

          const ahead = nearestVehicleAheadFor(hero, lane, 190);
          const behind = nearestVehicleBehindFor(hero, lane, 190);
          const aheadNeed = ahead ? safeGap(hero, ahead.vehicle) * 0.66 : 0;
          const behindNeed = behind ? mergeBehindNeed(hero, behind.vehicle) * 0.76 : 0;
          const aheadShort = Boolean(ahead && ahead.gap < aheadNeed);
          const behindShort = Boolean(behind && behind.gap < behindNeed);

          let target = 46;

          if (aheadShort && behindShort) {
            const aheadDeficit = aheadNeed - ahead.gap;
            const behindDeficit = behindNeed - behind.gap;
            const frontWillOpen = ahead.vehicle.speed > hero.speed - 1;
            const rearWillOpen = behind.vehicle.speed < hero.speed + 1;

            if (behindDeficit > aheadDeficit * 1.2 && frontWillOpen) {
              target = Math.max(hero.speed + 10, behind.vehicle.speed + 9);
            } else if (aheadDeficit > behindDeficit * 1.1 && rearWillOpen) {
              target = Math.min(hero.speed - 7, ahead.vehicle.speed - 4);
            } else if (ahead.vehicle.speed >= behind.vehicle.speed) {
              target = Math.min(hero.speed - 6, ahead.vehicle.speed - 3.5);
            } else {
              target = Math.max(hero.speed + 9, behind.vehicle.speed + 8);
            }
          } else if (aheadShort) {
            target = Math.min(hero.speed - 5, ahead.vehicle.speed - 3.5);
          } else if (behindShort) {
            target = Math.max(hero.speed + 9, behind.vehicle.speed + 8);
          }

          return clamp(target, 5, 46);
        }

        function laneSafetyScore(vehicle, lane) {
          if (!laneExists(lane)) return -Infinity;
          if (!laneIsOpenAt(lane, vehicle.s, vehicle.length + 7)) return -900;
          if (!hasVehicleRoom(vehicle, lane, 8)) return -850;
          const front = nearestVehicleAheadFor(vehicle, lane, 190);
          const behind = nearestVehicleBehindFor(vehicle, lane, 95);
          const obstacle = nearestObstacleAheadFor(vehicle, lane, 220);
          const frontGap = front ? front.gap : 190;
          const frontSpeed = front ? front.vehicle.speed : vehicle.desiredSpeed + 3;
          const behindPressure = behind
            ? Math.max(0, behind.vehicle.speed - vehicle.speed) * 3 + Math.max(0, 35 - behind.gap)
            : 0;
          const caution = vehicle.isHero ? 1 : 1.25 - (vehicle.aggression ?? 0.45) * 0.58;
          const obstacleGap = obstacle ? obstacle.gap : 220;
          return (
            Math.min(frontGap, 160) * 0.48 +
            frontSpeed * 1.8 +
            Math.min(obstacleGap, 190) * 0.34 -
            behindPressure * caution
          );
        }

        function canMerge(vehicle, lane) {
          if (!laneExists(lane)) return false;
          if (!laneIsOpenAt(lane, vehicle.s, vehicle.length + (vehicle.isHero ? 6 : 8))) return false;
          if (
            !vehicle.isHero &&
            hero.mergeRequestLane === lane &&
            Math.abs(vehicle.s - hero.s) < 44
          ) {
            return false;
          }
          const courtesyFollower = vehicle.isHero ? activeCourtesyFollower(lane) : null;
          const escapeUrgency = vehicle.isHero ? 0 : vehicle.escapeUrgency ?? 0;
          const normalPadding = vehicle.isHero ? 5 : vehicle.mergePadding ?? 11;
          const mergePadding = vehicle.isHero
            ? normalPadding
            : Math.max(3.2, normalPadding * (1 - escapeUrgency * 0.58));
          const hasRoom = courtesyFollower
            ? hasCourtesyMergeRoom(vehicle, lane, courtesyFollower)
            : hasVehicleRoom(vehicle, lane, mergePadding);
          if (!hasRoom) return false;

          const obstacle = nearestObstacleAheadFor(vehicle, lane, 18);
          if (obstacle && obstacle.gap < (vehicle.isHero ? 11 : 14)) return false;

          const ahead = nearestVehicleAheadFor(vehicle, lane, vehicle.isHero ? 88 : 75);
          const behind = nearestVehicleBehindFor(vehicle, lane, vehicle.isHero ? 88 : 75);
          const frontScale = vehicle.isHero
            ? 0.5
            : (vehicle.mergeFrontScale ?? 0.95) * (1 - escapeUrgency * 0.34);
          if (ahead && ahead.gap < safeGap(vehicle, ahead.vehicle) * frontScale) return false;
          if (behind) {
            const heroRearScale = courtesyFollower && courtesyFollower.id === behind.vehicle.id ? 0.24 : 0.58;
            const trafficRearScale = (vehicle.mergeRearScale ?? 1) * (1 - escapeUrgency * 0.34);
            const behindNeed = mergeBehindNeed(vehicle, behind.vehicle) * (vehicle.isHero ? heroRearScale : trafficRearScale);
            if (behind.gap < behindNeed) return false;
          }
          return true;
        }

        function activeCourtesyFollower(lane) {
          if (hero.mergeRequestLane !== lane) return null;
          const car = courtesyFollowerForHero(lane, 105);
          if (!car) return null;
          return car.yieldsToHero && car.heroRequestId === hero.mergeRequestId ? car : null;
        }

        function hasCourtesyMergeRoom(vehicle, lane, courtesyFollower) {
          const vehicleHalf = visualHalfLength(vehicle);
          for (const other of [hero, ...cars]) {
            if (!other || other.id === vehicle.id) continue;
            if (!vehicleClaimsLane(other, lane)) continue;
            const padding = other.id === courtesyFollower.id ? -1.8 : 1.4;
            const required = vehicleHalf + visualHalfLength(other) + padding;
            if (Math.abs(other.s - vehicle.s) < required) return false;
          }
          return true;
        }

        function updateSpeed(vehicle, dt) {
          if (vehicle.exiting) {
            vehicle.speed = clamp(vehicle.speed + 7.8 * dt, 20, 42);
            return;
          }

          const front = nearestVehicleAheadFor(vehicle, vehicle.lane, 190);
          const obstacle = nearestObstacleAheadFor(vehicle, vehicle.lane, 170);
          let targetSpeed = vehicle.desiredSpeed;

          if (vehicle.isHero) {
            targetSpeed = hero.gapTargetSpeed ?? (hero.huntingOpening ? 45.5 : hero.desiredSpeed);
            if (hero.surgeActive) targetSpeed = Math.max(targetSpeed, 46);
          }

          if (front) {
            const desiredGap = safeGap(vehicle, front.vehicle);
            if (front.gap < desiredGap) {
              targetSpeed = Math.min(
                targetSpeed,
                Math.max(0, front.vehicle.speed - (desiredGap - front.gap) * 0.68)
              );
            } else if (front.gap < desiredGap * 1.7) {
              targetSpeed = Math.min(targetSpeed, front.vehicle.speed + (front.gap - desiredGap) * 0.42);
            }
          }

          if (obstacle) {
            const stopLine = Math.max(0, obstacle.gap - 2.2);
            const obstacleSpeed = clamp(stopLine * 0.42, 0, targetSpeed);
            if (obstacle.gap < Math.max(82, vehicle.speed * 2.4) || vehicle.stoppedForObstacle) {
              targetSpeed = Math.min(targetSpeed, obstacleSpeed);
            }
          }

          if (vehicle.stoppedForObstacle) targetSpeed = Math.min(targetSpeed, 1.5);

          if (!vehicle.isHero && vehicle.yieldsToHero && vehicle.heroRequestId === hero.mergeRequestId) {
            const openGap = hero.s - visualHalfLength(hero) - (vehicle.s + visualHalfLength(vehicle));
            const courtesyBrake = clamp((42 - openGap) * 0.34, 4, 14);
            targetSpeed = Math.min(targetSpeed, Math.max(0, hero.speed - courtesyBrake));
          }

          const accel = vehicle.isHero ? (hero.huntingOpening ? 9.4 : 4.8) : vehicle.accel ?? 3.4;
          const brake = vehicle.isHero
            ? hero.gapTargetSpeed != null && hero.gapTargetSpeed < hero.speed
              ? 10.8
              : 8.6
            : vehicle.brake ?? 9.4;
          const delta = targetSpeed - vehicle.speed;
          vehicle.speed += clamp(delta * (vehicle.isHero ? 0.92 : 0.76) * dt, -brake * dt, accel * dt);
          vehicle.speed = clamp(vehicle.speed, 0, vehicle.isHero ? 46 : 56);
          if (!vehicle.isHero) vehicle.scoreFlash = Math.max(0, vehicle.scoreFlash - dt * 2.4);
        }

        function updateHeroSurge(t) {
          if (hero.nextSurgeAt <= 0) hero.nextSurgeAt = t + rand(3.5, 7.5);
          hero.surgeActive = t < hero.surgeUntil;
          if (t < hero.nextSurgeAt) return;

          const front = nearestVehicleAheadFor(hero, hero.lane, 105);
          const obstacle = nearestObstacleAheadFor(hero, hero.lane, 150);
          const roadContinues = laneActiveAt(hero.lane, hero.s + 95);
          if (!front && !obstacle && roadContinues && !hero.stoppedForObstacle) {
            hero.surgeUntil = t + rand(1.25, 2.35);
            hero.nextSurgeAt = hero.surgeUntil + rand(5.5, 11);
            hero.surgeActive = true;
          } else {
            hero.nextSurgeAt = t + rand(1.1, 2.8);
          }
        }

        function updateCamera(dt) {
          const speedOffset = prefersReducedMotion
            ? 0
            : clamp((hero.speed - hero.desiredSpeed) * 0.7 + (hero.surgeActive ? 2.2 : 0), -10, 8);
          const targetS = hero.s - speedOffset;
          const response = prefersReducedMotion ? 8 : 2.8;
          cameraS += (targetS - cameraS) * clamp(response * dt, 0, 1);

          const minY = height * (width < 560 ? 0.61 : 0.58);
          const maxY = height * (width < 560 ? 0.86 : 0.84);
          const minCameraS = hero.s + (minY - heroScreenY) / metersToPixels;
          const maxCameraS = hero.s + (maxY - heroScreenY) / metersToPixels;
          cameraS = clamp(cameraS, minCameraS, maxCameraS);
        }

        function moveVehicle(vehicle, dt) {
          vehicle.s += vehicle.speed * dt;
          if (vehicle.exiting) {
            vehicle.exitProgress = clamp(vehicle.exitProgress + dt * 0.78, 0, 1.25);
          }
        }

        function animateLane(vehicle, dt) {
          if (vehicle.drawLane == null) vehicle.drawLane = vehicle.lane;
          if (vehicle.exiting) {
            vehicle.drawLane = vehicle.lane;
            return;
          }
          if (prefersReducedMotion) {
            vehicle.drawLane = vehicle.lane;
            return;
          }
          const delta = vehicle.lane - vehicle.drawLane;
          const response = vehicle.isHero ? 3.1 : 2.55;
          const maxRate = vehicle.isHero ? 1.65 : 1.35;
          const eased = delta * clamp(response * dt, 0, 0.12);
          vehicle.drawLane += clamp(eased, -maxRate * dt, maxRate * dt);
          if (Math.abs(vehicle.lane - vehicle.drawLane) < 0.015) {
            vehicle.drawLane = vehicle.lane;
          }
        }

        function enforceObstacleStops() {
          for (const vehicle of [hero, ...cars]) {
            if (vehicle.exiting) continue;
            for (const obstacle of obstacles) {
              if (!obstacle.lanes.includes(vehicle.lane)) continue;
              const obstacleBack = obstacle.s - obstacle.length * 0.5;
              const obstacleFront = obstacle.s + obstacle.length * 0.5;
              const vehicleFront = vehicle.s + vehicle.length * 0.5;
              const vehicleRear = vehicle.s - vehicle.length * 0.5;
              const overlaps = vehicleFront > obstacleBack - 0.9 && vehicleRear < obstacleFront + 0.9;
              if (!overlaps) continue;
              vehicle.s = obstacleBack - vehicle.length * 0.5 - 0.9;
              vehicle.speed = 0;
              vehicle.stoppedForObstacle = true;
            }
          }
        }

        function enforceRoadLaneStops() {
          for (const vehicle of [hero, ...cars]) {
            if (vehicle.exiting) continue;
            if (laneActiveForVehicle(vehicle, vehicle.lane)) continue;
            const boundary = latestLaneDropBefore(vehicle.lane, vehicle.s + vehicle.length * 0.5 + 0.2);
            if (boundary == null) continue;
            vehicle.s = boundary - vehicle.length * 0.5 - 1.1;
            vehicle.speed = 0;
            vehicle.stoppedForObstacle = true;
          }
        }

        function preventOverlaps() {
          const vehicles = [hero, ...cars.filter((car) => !car.exiting)];
          const visualVehicles = [hero, ...cars];
          for (let lane = 0; lane < LANES; lane += 1) {
            const inLane = vehicles
              .filter((vehicle) => vehicle.lane === lane)
              .sort((a, b) => b.s - a.s);
            for (let i = 1; i < inLane.length; i += 1) {
              const ahead = inLane[i - 1];
              const behind = inLane[i];
              const minGap = visualHalfLength(ahead) + visualHalfLength(behind) + 1.6;
              const gap = ahead.s - behind.s;
              if (gap < minGap) {
                behind.s = ahead.s - minGap;
                behind.speed = Math.min(behind.speed, Math.max(0, ahead.speed - 1.2));
              }
            }
          }

          preventVisualOverlaps(visualVehicles);
        }

        function preventVisualOverlaps(vehicles) {
          for (let pass = 0; pass < 2; pass += 1) {
            for (let i = 0; i < vehicles.length; i += 1) {
              for (let j = i + 1; j < vehicles.length; j += 1) {
                const a = vehicles[i];
                const b = vehicles[j];
                const aBox = vehicleBox(a);
                const bBox = vehicleBox(b);
                const lateral = Math.abs(aBox.x - bBox.x);
                const vertical = Math.abs(a.s - b.s) * metersToPixels;
                const minX = (aBox.w + bBox.w) * 0.5 + 5;
                const minY = (aBox.h + bBox.h) * 0.5 + 7;
                if (lateral >= minX || vertical >= minY) continue;

                const ahead = a.s >= b.s ? a : b;
                const behind = ahead === a ? b : a;
                const requiredWorld = minY / metersToPixels + 0.5;
                behind.s = ahead.s - requiredWorld;
                behind.speed = Math.min(behind.speed, Math.max(0, ahead.speed - 1.4));
              }
            }
          }
        }

        function resolveExits(t) {
          for (const exit of exits) {
            const active = cars.some(
              (car) => car.exitTarget === exit.s && Math.abs(car.s - exit.s) < 34
            );
            exit.flash = active ? 1 : Math.max(0, exit.flash - 0.025);
          }
        }

        function updateScore(t) {
          for (const car of cars) {
            if (car.exiting) continue;
            const delta = car.s - hero.s;
            if (car.prevDelta > 0 && delta <= 0) {
              registerScore(1, car, t);
              car.scoreFlash = 1;
            } else if (car.prevDelta < 0 && delta >= 0) {
              registerScore(car.kind === 'semi' ? -5 : -1, car, t);
              car.scoreFlash = 1;
            }
            car.prevDelta = delta;
          }
        }

        function registerScore(amount, car, t) {
          score += amount;
          const sign = Math.sign(amount);
          if (scoreRun.sign === sign) {
            scoreRun.count += 1;
            scoreRun.total += amount;
          } else {
            scoreRun = { sign, count: 1, total: amount };
          }

          const burst = {
            amount,
            at: t,
            until: t + (scoreRun.count % 5 === 0 ? 2.5 : 1.65),
            chain: scoreRun.count,
            chainTotal: scoreRun.total,
            milestone: scoreRun.count % 5 === 0,
            kind: car.kind,
            lane: car.drawLane ?? car.lane,
            side: (car.drawLane ?? car.lane) <= hero.drawLane ? -1 : 1,
            variant: mod(scoreRun.count + car.id + (sign < 0 ? 2 : 0), 5),
          };
          scoreHistory.push({ amount, sign, at: t });
          scoreHistory = scoreHistory.slice(-9);
          scoreBursts.push(burst);
          scoreBursts = scoreBursts.filter((item) => item.until > t - 0.1).slice(-3);
        }

        function laneExists(lane) {
          return Number.isInteger(lane) && lane >= 0 && lane < LANES;
        }

        function roadSectionAt(s) {
          if (!roadSections.length) return { s0: -Infinity, s1: Infinity, start: 0, count: LANES };
          for (const section of roadSections) {
            if (s >= section.s0 && s < section.s1) return section;
          }
          if (s < roadSections[0].s0) return roadSections[0];
          return roadSections[roadSections.length - 1];
        }

        function roadSectionIndexAt(s) {
          if (!roadSections.length) return -1;
          for (let i = 0; i < roadSections.length; i += 1) {
            const section = roadSections[i];
            if (s >= section.s0 && s < section.s1) return i;
          }
          return s < roadSections[0].s0 ? 0 : roadSections.length - 1;
        }

        function roadLaneRangeAt(s) {
          const section = roadSectionAt(s);
          return { start: section.start, end: section.start + section.count };
        }

        function rightmostLaneAt(s) {
          const laneRange = roadLaneRangeAt(s);
          return laneRange.end - 1;
        }

        function laneActiveInSection(section, lane) {
          return laneExists(lane) && lane >= section.start && lane < section.start + section.count;
        }

        function laneActiveAt(lane, s) {
          return laneActiveInSection(roadSectionAt(s), lane) && laneCenterInsideBounds(lane, roadBoundsAt(s));
        }

        function laneCenterInsideBounds(lane, bounds) {
          const center = laneCenter(lane);
          const margin = laneWidth * 0.28;
          return center >= bounds.left + margin && center <= bounds.right - margin;
        }

        function laneActiveForVehicle(vehicle, lane) {
          return (
            laneActiveAt(lane, vehicle.s - vehicle.length * 0.5) &&
            laneActiveAt(lane, vehicle.s) &&
            laneActiveAt(lane, vehicle.s + vehicle.length * 0.5)
          );
        }

        function nearestLaneDropAheadFor(vehicle, lane, maxGap) {
          if (!laneExists(lane)) return null;
          const front = vehicle.s + vehicle.length * 0.5;
          if (!laneActiveAt(lane, front + 0.4)) {
            return {
              id: `road-edge-${lane}-${front | 0}`,
              s: front,
              type: 'lane-drop',
              lanes: [lane],
              length: 10,
              phase: 0,
              gap: 0,
            };
          }

          let best = null;
          for (let i = 1; i < roadSections.length; i += 1) {
            const prev = roadSections[i - 1];
            const next = roadSections[i];
            const dropS = transitionLaneDropS(prev, next, lane);
            if (dropS == null) continue;
            const gap = dropS - front;
            if (gap < -0.9 || gap >= maxGap) continue;
            const laneDrop = {
              id: `road-edge-${lane}-${Math.round(dropS)}`,
              s: dropS,
              type: 'lane-drop',
              lanes: [lane],
              length: 10,
              phase: 0,
              gap,
            };
            if (!best || laneDrop.gap < best.gap) best = laneDrop;
          }
          return best;
        }

        function latestLaneDropBefore(lane, s) {
          let boundary = null;
          for (let i = 1; i < roadSections.length; i += 1) {
            const prev = roadSections[i - 1];
            const next = roadSections[i];
            const dropS = transitionLaneDropS(prev, next, lane);
            if (dropS == null) continue;
            if (dropS > s) break;
            if (dropS <= s) {
              boundary = dropS;
            }
          }
          return boundary;
        }

        function transitionLaneDropS(prev, next, lane) {
          if (!laneActiveInSection(prev, lane) || laneActiveInSection(next, lane)) return null;
          const start = next.s0 - ROAD_TRANSITION_METERS;
          const prevBounds = roadSectionBounds(prev);
          const nextBounds = roadSectionBounds(next);
          if (!laneCenterInsideBounds(lane, prevBounds)) return start;
          if (laneCenterInsideBounds(lane, nextBounds)) return null;

          let lo = 0;
          let hi = 1;
          for (let i = 0; i < 14; i += 1) {
            const mid = (lo + hi) * 0.5;
            if (laneCenterInsideBounds(lane, mixRoadBounds(prevBounds, nextBounds, mid))) {
              lo = mid;
            } else {
              hi = mid;
            }
          }
          return start + hi * ROAD_TRANSITION_METERS;
        }

        function roadBoundsAt(s) {
          for (let i = 1; i < roadSections.length; i += 1) {
            const prev = roadSections[i - 1];
            const next = roadSections[i];
            const start = next.s0 - ROAD_TRANSITION_METERS;
            const end = next.s0;
            if (s >= start && s < end) {
              return mixRoadBounds(
                roadSectionBounds(prev),
                roadSectionBounds(next),
                (s - start) / ROAD_TRANSITION_METERS
              );
            }
          }

          return roadSectionBounds(roadSectionAt(s));
        }

        function roadSectionBounds(section) {
          const left = roadLeft + section.start * laneWidth;
          const right = roadLeft + (section.start + section.count) * laneWidth;
          return { left, right, width: right - left };
        }

        function mixRoadBounds(a, b, amount) {
          const leftDelta = b.left - a.left;
          const rightDelta = b.right - a.right;
          const largestDelta = Math.max(Math.abs(leftDelta), Math.abs(rightDelta), 1);
          const left = a.left + leftDelta * equalAngleProgress(amount, leftDelta, largestDelta);
          const right = a.right + rightDelta * equalAngleProgress(amount, rightDelta, largestDelta);
          return { left, right, width: right - left };
        }

        function equalAngleProgress(amount, delta, largestDelta) {
          if (Math.abs(delta) < 0.01) return 0;
          const span = Math.abs(delta) / largestDelta;
          const start = (1 - span) * 0.5;
          return clamp((amount - start) / span, 0, 1);
        }

        function smoothstep(value) {
          const t = clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function safeGap(vehicle, frontVehicle) {
          const speedRatio = clamp(vehicle.speed / 48, 0, 1);
          const base = vehicle.isHero ? 5.8 + speedRatio * 7.2 : 4.5 + speedRatio * 6.2;
          const speedTerm = vehicle.speed * (vehicle.isHero ? 0.14 + speedRatio * 0.24 : 0.1 + speedRatio * 0.22);
          const closingTerm = Math.max(0, vehicle.speed - frontVehicle.speed) * (0.46 + speedRatio * 0.36);
          return base + visualHalfLength(vehicle) + visualHalfLength(frontVehicle) + speedTerm + closingTerm;
        }

        function mergeBehindNeed(vehicle, behindVehicle) {
          const speedRatio = clamp(behindVehicle.speed / 48, 0, 1);
          const base = 4.8 + speedRatio * 6.6;
          const speedTerm = behindVehicle.speed * (0.12 + speedRatio * 0.25);
          const closingTerm = Math.max(0, behindVehicle.speed - vehicle.speed) * (0.42 + speedRatio * 0.42);
          return base + speedTerm + closingTerm;
        }

        function spotIsFree(lane, s, gap, ignoreId) {
          if (!laneIsOpenAt(lane, s, gap)) return false;
          for (const vehicle of [hero, ...cars]) {
            if (!vehicle || vehicle.id === ignoreId) continue;
            if (!vehicleClaimsLane(vehicle, lane)) continue;
            const required = gap + visualHalfLength(vehicle);
            if (Math.abs(vehicle.s - s) < required) return false;
          }
          return true;
        }

        function hasVehicleRoom(vehicle, lane, padding) {
          const vehicleHalf = visualHalfLength(vehicle);
          for (const other of [hero, ...cars]) {
            if (!other || other.id === vehicle.id) continue;
            if (!vehicleClaimsLane(other, lane)) continue;
            const required = vehicleHalf + visualHalfLength(other) + padding;
            if (Math.abs(other.s - vehicle.s) < required) return false;
          }
          return true;
        }

        function vehicleClaimsLane(vehicle, lane) {
          if (vehicle.exiting) return false;
          if (vehicle.lane === lane) return true;
          const drawLane = vehicle.drawLane ?? vehicle.lane;
          return Math.abs(drawLane - lane) < 0.62;
        }

        function laneIsOpenAt(lane, s, length) {
          if (!laneExists(lane)) return false;
          const back = s - length * 0.5;
          const front = s + length * 0.5;
          if (!laneActiveAt(lane, back) || !laneActiveAt(lane, s) || !laneActiveAt(lane, front)) {
            return false;
          }
          for (const obstacle of obstacles) {
            if (!obstacle.lanes.includes(lane)) continue;
            const obstacleBack = obstacle.s - obstacle.length * 0.5 - 1.8;
            const obstacleFront = obstacle.s + obstacle.length * 0.5 + 1.8;
            if (front > obstacleBack && back < obstacleFront) return false;
          }
          return true;
        }

        function nearestVehicleAheadFor(vehicle, lane, maxGap) {
          let best = null;
          const front = vehicle.s + visualHalfLength(vehicle);
          for (const other of [hero, ...cars]) {
            if (!other || other.id === vehicle.id || !vehicleClaimsLane(other, lane)) continue;
            const gap = other.s - visualHalfLength(other) - front;
            if (gap >= -0.2 && gap < maxGap && (!best || gap < best.gap)) {
              best = { vehicle: other, gap };
            }
          }
          return best;
        }

        function nearestVehicleBehindFor(vehicle, lane, maxGap) {
          let best = null;
          const rear = vehicle.s - visualHalfLength(vehicle);
          for (const other of [hero, ...cars]) {
            if (!other || other.id === vehicle.id || !vehicleClaimsLane(other, lane)) continue;
            const gap = rear - (other.s + visualHalfLength(other));
            if (gap >= -0.2 && gap < maxGap && (!best || gap < best.gap)) {
              best = { vehicle: other, gap };
            }
          }
          return best;
        }

        function nearestObstacleAheadFor(vehicle, lane, maxGap) {
          let best = null;
          const front = vehicle.s + vehicle.length * 0.5;
          const laneDrop = nearestLaneDropAheadFor(vehicle, lane, maxGap);
          if (laneDrop) best = laneDrop;
          for (const obstacle of obstacles) {
            if (!obstacle.lanes.includes(lane)) continue;
            const gap = obstacle.s - obstacle.length * 0.5 - front;
            if (gap >= -0.9 && gap < maxGap && (!best || gap < best.gap)) {
              best = { ...obstacle, gap };
            }
          }
          return best;
        }

        function expireSignal(vehicle, t) {
          if (vehicle.signal && t > vehicle.signalUntil) vehicle.signal = 0;
        }

        function render(t) {
          ctx.fillStyle = COLORS.sky;
          ctx.fillRect(0, 0, width, height);
          drawTravelFields();
          drawRoad();
          drawExits();
          drawObstacles(t);
          drawVehicles(t);
          drawHud(t);
        }

        function drawTravelFields() {
          const parcelMeters = 18;
          const nearestS = screenToWorldY(height);
          const farthestS = screenToWorldY(0);
          const firstParcel = Math.floor(nearestS / parcelMeters) - 1;
          const lastParcel = Math.ceil(farthestS / parcelMeters) + 1;
          const splitX = Math.round(width * 0.5);

          for (let parcel = firstParcel; parcel <= lastParcel; parcel += 1) {
            const top = Math.floor(worldToY((parcel + 1) * parcelMeters));
            const bottom = Math.ceil(worldToY(parcel * parcelMeters));
            const parcelHeight = Math.max(1, bottom - top);
            const leftColor = FIELD_COLORS[mod(parcel, FIELD_COLORS.length)];
            const rightColor = FIELD_COLORS[mod(parcel + 2, FIELD_COLORS.length)];

            rect(0, top, splitX, parcelHeight + 1, leftColor);
            rect(splitX, top, width - splitX, parcelHeight + 1, rightColor);
            rect(0, top, width, 3, 'rgba(7, 9, 16, 0.42)');

            const furrowColor = parcel % 2 === 0
              ? 'rgba(255, 246, 201, 0.055)'
              : 'rgba(7, 9, 16, 0.12)';
            for (let x = 12; x < width; x += 24) {
              rect(x, top + 5, 2, Math.max(0, parcelHeight - 9), furrowColor);
            }
          }

          rect(splitX - 2, 0, 4, height, 'rgba(7, 9, 16, 0.24)');
        }

        function drawRoad() {
          const shoulder = Math.max(16, laneWidth * 0.22);
          const stripH = 6;
          const bandH = 20;
          const dashH = clamp(laneWidth * 0.52, 24, 46);
          const gap = clamp(laneWidth * 0.42, 18, 38);
          const dashCycle = dashH + gap;

          for (let y = -stripH; y < height + stripH; y += stripH) {
            const s = screenToWorldY(y + stripH * 0.5);
            const rawBounds = roadBoundsAt(s);
            const bounds = pixelBounds(rawBounds, stripH);
            rect(bounds.left - shoulder, y, bounds.width + shoulder * 2, stripH + 1, COLORS.shoulder);
            rect(bounds.left, y, bounds.width, stripH + 1, COLORS.asphalt);

            if (mod(s * metersToPixels, bandH * 2) < bandH) {
              rect(bounds.left, y, bounds.width, stripH + 1, 'rgba(255, 255, 255, 0.025)');
            }

            for (let i = 1; i < LANES; i += 1) {
              const x = Math.round(roadLeft + i * laneWidth);
              if (x <= bounds.left + laneWidth * 0.28 || x >= bounds.right - laneWidth * 0.28) continue;
              rect(x - 1, y, 2, stripH + 1, COLORS.laneDim);
              if (mod(s * metersToPixels, dashCycle) < dashH) {
                rect(x - 3, y, 6, stripH + 1, COLORS.lane);
              }
            }

            rect(bounds.left - shoulder * 0.6, y, 4, stripH + 1, '#f9f2a4');
            rect(bounds.right + shoulder * 0.6, y, 4, stripH + 1, '#f9f2a4');
          }
        }

        function drawExits() {
          for (const exit of exits) {
            const ramp = exitRampGeometry(exit.s);
            if (ramp.startY < -180 || ramp.endY > height + 180) continue;

            drawPixelExitRamp(ramp);

            const signW = Math.min(78, laneWidth * 0.92);
            const signX = Math.min(width - signW - 8, ramp.roadRight + laneWidth * 0.18);
            const signY = ramp.startY - laneWidth * 0.95;
            if (signY > -40 && signY < height + 10) {
              rect(signX, signY, signW, 28, '#0f7c45');
              strokeRect(signX, signY, signW, 28, '#d8ffd8', 2);
              drawPixelText('EXIT', signX + signW / 2, signY + 19, 15, '#f5ffe8', 'center');
            }
          }
        }

        function drawPixelExitRamp(ramp) {
          const pixel = 6;
          const shoulderHalf = pixelSnap(ramp.half + ramp.shoulder, pixel);
          const asphaltHalf = pixelSnap(ramp.half, pixel);
          const top = Math.floor(ramp.endY / pixel) * pixel;
          const bottom = Math.ceil(ramp.startY / pixel) * pixel;
          const seamX = pixelSnap(ramp.roadRight - pixel, pixel);

          for (let y = top; y <= bottom; y += pixel) {
            const center = pixelSnap(exitRampCenterAtY(ramp, y + pixel * 0.5), pixel);
            const shoulderLeft = Math.max(seamX, center - shoulderHalf);
            const shoulderRight = center + shoulderHalf;
            const asphaltLeft = Math.max(seamX, center - asphaltHalf);
            const asphaltRight = center + asphaltHalf;

            if (shoulderRight > shoulderLeft) {
              rect(shoulderLeft, y, shoulderRight - shoulderLeft, pixel + 1, '#263544');
            }
            if (asphaltRight > asphaltLeft) {
              rect(asphaltLeft, y, asphaltRight - asphaltLeft, pixel + 1, COLORS.asphalt);
              rect(asphaltRight - 4, y, 4, pixel + 1, '#f9f2a4');
              if (
                asphaltLeft > ramp.roadRight + pixel &&
                mod(Math.abs(y - ramp.endY), 30) < 14
              ) {
                rect(asphaltLeft, y, 4, pixel + 1, COLORS.lane);
              }
            }
          }
        }

        function exitRampCenterAtY(ramp, y) {
          const firstSpan = ramp.startY - ramp.curveY;
          if (y >= ramp.curveY) {
            const amount = clamp((ramp.startY - y) / Math.max(1, firstSpan), 0, 1);
            return ramp.startX + (ramp.curveX - ramp.startX) * amount;
          }
          const amount = clamp((ramp.curveY - y) / Math.max(1, ramp.curveY - ramp.endY), 0, 1);
          return ramp.curveX + (ramp.endX - ramp.curveX) * amount;
        }

        function drawObstacles(t) {
          const visible = obstacles
            .map((obstacle) => ({ obstacle, y: worldToY(obstacle.s) }))
            .filter((item) => item.y > -140 && item.y < height + 140)
            .sort((a, b) => a.y - b.y);

          for (const { obstacle, y } of visible) {
            if (obstacle.type === 'construction') drawConstruction(obstacle, y);
            if (obstacle.type === 'police') drawPolice(obstacle, y, t);
            if (obstacle.type === 'deer') drawDeer(obstacle, y);
            if (obstacle.type === 'cow') drawCow(obstacle, y, t);
            if (obstacle.type === 'accident') drawAccident(obstacle, y, t);
          }
        }

        function drawConstruction(obstacle, y) {
          const top = y - obstacle.length * metersToPixels * 0.5;
          const bottom = y + obstacle.length * metersToPixels * 0.5;
          for (const lane of obstacle.lanes) {
            const x = laneCenter(lane);
            const w = laneWidth * 0.74;
            rect(x - w / 2, top, w, bottom - top, 'rgba(255, 122, 26, 0.2)');
            for (let yy = top + 8; yy < bottom; yy += 28) {
              drawCone(x - w * 0.32, yy);
              drawCone(x + w * 0.32, yy + 12);
            }
          }
          const x1 = laneCenter(obstacle.lanes[0]) - laneWidth * 0.45;
          const x2 = laneCenter(obstacle.lanes[obstacle.lanes.length - 1]) + laneWidth * 0.45;
          rect(x1, y - 10, x2 - x1, 20, COLORS.cone);
          for (let x = x1 + 6; x < x2 - 8; x += 22) {
            rect(x, y - 10, 10, 20, COLORS.barricade);
          }
          strokeRect(x1, y - 10, x2 - x1, 20, COLORS.ink, 4);
        }

        function drawPolice(obstacle, y, t) {
          const x = laneCenter(obstacle.lanes[0]);
          const w = Math.min(laneWidth * 0.58, 42);
          const h = Math.min(laneWidth * 0.92, 68);
          drawCarShape(x, y, w, h, '#dfe3e8', 0, false, false);
          rect(x - w * 0.42, y - h * 0.1, w * 0.34, h * 0.18, '#11151d');
          rect(x + w * 0.08, y - h * 0.1, w * 0.34, h * 0.18, '#11151d');
          const blink = prefersReducedMotion || Math.floor(t * 8) % 2 === 0;
          rect(x - w * 0.28, y - h * 0.32, w * 0.24, 6, blink ? COLORS.red : '#421519');
          rect(x + w * 0.04, y - h * 0.32, w * 0.24, 6, blink ? COLORS.blue : '#163446');
        }

        function drawDeer(obstacle, y) {
          const x = laneCenter(obstacle.lanes[0]);
          const w = Math.min(laneWidth * 0.54, 44);
          rect(x - w * 0.5, y - 9, w, 18, '#7a4a2a');
          rect(x + w * 0.2, y - 20, w * 0.26, 16, '#8b5831');
          rect(x - w * 0.4, y + 8, 7, 13, '#5c321b');
          rect(x + w * 0.18, y + 8, 7, 13, '#5c321b');
          rect(x + w * 0.42, y - 26, 5, 15, '#d3b78c');
          rect(x + w * 0.53, y - 25, 5, 12, '#d3b78c');
          rect(x - w * 0.55, y - 14, 7, 9, '#24130b');
        }

        function drawCow(obstacle, y, t) {
          const drift = Math.sin(t * 1.8 + obstacle.phase) * laneWidth * 0.09;
          const x = laneCenter(obstacle.lanes[0]) + drift;
          const w = Math.min(laneWidth * 0.62, 52);
          rect(x - w * 0.5, y - 14, w, 28, '#f7f3e8');
          rect(x - w * 0.34, y - 8, w * 0.2, 12, '#111');
          rect(x + w * 0.04, y - 13, w * 0.24, 15, '#111');
          rect(x + w * 0.34, y - 23, w * 0.22, 18, '#f7f3e8');
          rect(x + w * 0.44, y - 18, 4, 4, '#111');
          rect(x - w * 0.4, y + 14, 6, 16, '#f7f3e8');
          rect(x + w * 0.2, y + 14, 6, 16, '#f7f3e8');
          strokeRect(x - w * 0.5, y - 14, w, 28, COLORS.ink, 3);
        }

        function drawAccident(obstacle, y, t) {
          for (let i = 0; i < obstacle.lanes.length; i += 1) {
            const lane = obstacle.lanes[i];
            const x = laneCenter(lane) + (i % 2 === 0 ? -laneWidth * 0.1 : laneWidth * 0.1);
            const w = Math.min(laneWidth * 0.52, 42);
            const h = Math.min(laneWidth * 0.8, 58);
            ctx.save();
            ctx.translate(x, y + (i - 0.5) * 18);
            ctx.rotate((i % 2 === 0 ? -0.22 : 0.2) + Math.sin(t + obstacle.phase) * 0.02);
            drawCarShape(0, 0, w, h, '#7d858f', 0, false, false);
            rect(-w * 0.36, -h * 0.08, w * 0.72, h * 0.14, '#151922');
            ctx.restore();
          }
          if (Math.sin(t * 12 + obstacle.phase) > 0.3) {
            rect(laneCenter(obstacle.lanes[0]) - 3, y - 4, 6, 6, '#fff7a8');
          }
        }

        function drawVehicles(t) {
          const vehicles = cars
            .map((car) => ({
              vehicle: car,
              y: car.exiting ? exitVehiclePosition(car).y : worldToY(car.s),
            }))
            .filter((item) => item.y > -100 && item.y < height + 110)
            .sort((a, b) => a.y - b.y);
          for (const item of vehicles) drawVehicle(item.vehicle, item.y, t);
          drawVehicle(hero, worldToY(hero.s), t);
        }

        function drawVehicle(vehicle, y, t) {
          const box = vehicleBox(vehicle);
          let x = box.x;
          const w = box.w;
          const h = box.h;
          const blinkOn =
            vehicle.signal &&
            (prefersReducedMotion || Math.floor(t * (vehicle.isHero ? 5.2 : 4.4)) % 2 === 0);
          const fill = vehicle.isHero ? HERO_YELLOW : vehicle.color;

          ctx.save();
          if (vehicle.exiting) {
            const position = exitVehiclePosition(vehicle);
            ctx.translate(x, y);
            ctx.rotate(position.angle);
            x = 0;
            y = 0;
          }

          drawCarShape(
            x,
            y,
            w,
            h,
            fill,
            vehicle.signal,
            blinkOn,
            vehicle.isHero,
            vehicle.scoreFlash,
            vehicle.kind
          );

          if (vehicle.stoppedForObstacle && !vehicle.isHero) {
            rect(x - w * 0.48, y + h * 0.54, w * 0.96, 4, '#cdd3db');
          }
          if (!vehicle.isHero && vehicle.yieldsToHero && vehicle.heroRequestId === hero.mergeRequestId) {
            const courtesyBlink = prefersReducedMotion || Math.floor(t * 5) % 2 === 0;
            const light = courtesyBlink ? '#ff3b2f' : '#681613';
            rect(x - w * 0.38, y + h * 0.34, 6, 7, light);
            rect(x + w * 0.2, y + h * 0.34, 6, 7, light);
          }
          ctx.restore();
        }

        function drawCarShape(x, y, w, h, fill, signal, blinkOn, isHero, flash = 0, kind = 'car') {
          const bodyFill = flash > 0 ? '#fff7c7' : fill;
          rect(x - w / 2 + 4, y - h / 2 + 7, w, h, 'rgba(0, 0, 0, 0.34)');
          rect(x - w / 2, y - h / 2, w, h, COLORS.ink);

          if (kind === 'semi') {
            const cabH = h * 0.29;
            const trailerY = y - h / 2 + cabH + 2;
            rect(x - w / 2 + 4, y - h / 2 + 4, w - 8, cabH, shade(bodyFill, -0.06));
            rect(x - w * 0.28, y - h / 2 + 9, w * 0.56, cabH * 0.36, '#dfe6ef');
            rect(x - w / 2 + 5, trailerY, w - 10, h - cabH - 8, bodyFill);
            rect(x - w * 0.31, trailerY + 8, w * 0.62, 5, shade(bodyFill, 0.12));
            rect(x - w * 0.31, y + h * 0.2, w * 0.62, 5, shade(bodyFill, -0.12));
            rect(x - w * 0.46, y - h * 0.05, w * 0.12, h * 0.52, shade(fill, -0.25));
            rect(x + w * 0.34, y - h * 0.05, w * 0.12, h * 0.52, shade(fill, -0.25));
            drawVehicleSignals(x, y, w, h, signal, blinkOn);
            return;
          }

          if (kind === 'bus') {
            rect(x - w / 2 + 4, y - h / 2 + 4, w - 8, h - 8, bodyFill);
            rect(x - w * 0.3, y - h * 0.34, w * 0.6, h * 0.13, '#dfe6ef');
            rect(x - w * 0.3, y - h * 0.15, w * 0.6, h * 0.13, '#dfe6ef');
            rect(x - w * 0.3, y + h * 0.04, w * 0.6, h * 0.13, '#dfe6ef');
            rect(x + w * 0.2, y + h * 0.23, w * 0.17, h * 0.21, '#151922');
            rect(x - w * 0.42, y - h * 0.1, w * 0.12, h * 0.44, shade(fill, -0.24));
            rect(x + w * 0.3, y - h * 0.1, w * 0.12, h * 0.44, shade(fill, -0.24));
            drawVehicleSignals(x, y, w, h, signal, blinkOn);
            return;
          }

          rect(x - w / 2 + 4, y - h / 2 + 4, w - 8, h - 8, bodyFill);
          rect(x - w * 0.3, y - h * 0.32, w * 0.6, h * 0.2, isHero ? '#fff6af' : '#dfe6ef');
          rect(x - w * 0.3, y + h * 0.06, w * 0.6, h * 0.24, '#171b24');
          rect(x - w * 0.42, y - h * 0.1, w * 0.12, h * 0.42, shade(fill, -0.24));
          rect(x + w * 0.3, y - h * 0.1, w * 0.12, h * 0.42, shade(fill, -0.24));

          drawVehicleSignals(x, y, w, h, signal, blinkOn);
        }

        function drawVehicleSignals(x, y, w, h, signal, blinkOn) {
          const off = COLORS.amberOff;
          const on = blinkOn ? COLORS.amber : off;
          const left = signal < 0 ? on : off;
          const right = signal > 0 ? on : off;
          rect(x - w * 0.62, y - h * 0.34, 6, 9, left);
          rect(x - w * 0.62, y + h * 0.3, 6, 9, left);
          rect(x + w * 0.5, y - h * 0.34, 6, 9, right);
          rect(x + w * 0.5, y + h * 0.3, 6, 9, right);
        }

        function drawHud(t) {
          const pad = clamp(width * 0.025, 14, 28);
          drawScoreBank(t, pad);
          drawScoreBurst(t);

          if (hero.signal) {
            drawPixelText(hero.signal < 0 ? '<' : '>', width - pad, pad + 45, clamp(width * 0.034, 20, 34), COLORS.amber, 'right');
          }
          if (hero.stoppedForObstacle) {
            drawPixelText('WAIT', width / 2, height * 0.16, clamp(width * 0.045, 24, 48), COLORS.hudHot, 'center');
          }
          drawMiniMeter(pad, height - pad - 24);
        }

        function drawScoreBank(t, pad) {
          const gutter = Math.max(0, roadLeft);
          const scoreColor = score < 0 ? '#ff5b4f' : COLORS.hudHot;
          if (gutter < 92) {
            drawCompactScoreRail(t, gutter, scoreColor);
            return;
          }

          const boardW = Math.min(216, gutter - pad * 2);
          const x = pad;
          const y = pad;
          drawPixelText('HAPPINESS', x, y + 15, clamp(boardW * 0.095, 13, 18), COLORS.hud, 'left');
          drawPixelText('HUNTER', x, y + 34, clamp(boardW * 0.095, 13, 18), HERO_YELLOW, 'left');

          const bankY = y + 49;
          rect(x, bankY, boardW, 64, 'rgba(3, 4, 7, 0.88)');
          rect(x, bankY, boardW, 5, HERO_YELLOW);
          rect(x, bankY + 59, boardW, 5, '#7a4e00');
          drawPixelText('SCORE', x + 10, bankY + 24, 12, '#f8f4df', 'left');
          drawPixelText(formatScore(score), x + boardW - 10, bankY + 48, clamp(boardW * 0.18, 26, 36), scoreColor, 'right');

          const blink = prefersReducedMotion || Math.floor(t * 5) % 2 === 0;
          for (let lx = x + 9; lx < x + boardW - 4; lx += 18) {
            rect(lx, bankY - 2, 4, 4, blink ? '#fff8b4' : '#825b0a');
          }
          drawScoreHistoryTrail(x + 8, bankY + 76, Math.max(10, boardW - 16), false);
        }

        function drawCompactScoreRail(t, gutter, scoreColor) {
          const railW = Math.max(28, Math.floor(gutter - 10));
          const x = 5;
          const y = 8;
          rect(x, y, railW, 137, 'rgba(3, 4, 7, 0.9)');
          rect(x, y, railW, 4, HERO_YELLOW);
          drawPixelText('HH', x + railW / 2, y + 22, 11, COLORS.hud, 'center');
          drawPixelText('S', x + railW / 2, y + 40, 10, HERO_YELLOW, 'center');
          const chars = formatScore(score).split('');
          const digitSize = clamp(railW * 0.58, 16, 24);
          chars.forEach((char, index) => {
            drawPixelText(char, x + railW / 2, y + 64 + index * 22, digitSize, scoreColor, 'center');
          });
          const blink = prefersReducedMotion || Math.floor(t * 5) % 2 === 0;
          rect(x + 4, y + 129, railW - 8, 4, blink ? '#fff8b4' : '#825b0a');
          drawScoreHistoryTrail(x + railW / 2, y + 150, 0, true);
        }

        function drawScoreHistoryTrail(x, y, availableWidth, vertical) {
          const items = scoreHistory.slice(vertical ? -6 : -9);
          items.forEach((item, index) => {
            const px = vertical ? x : x + index * Math.min(18, availableWidth / Math.max(1, items.length));
            const py = vertical ? y + index * 15 : y;
            drawPixelBubble(px, py, 5, item.sign > 0 ? '#f6c515' : '#d52f29', COLORS.ink);
          });
        }

        function drawScoreBurst(t) {
          scoreBursts = scoreBursts.filter((burst) => burst.until > t);
          if (!scoreBursts.length) return;
          scoreBursts.forEach((burst, index) => drawScoreBubble(burst, t, index));
          const latest = scoreBursts[scoreBursts.length - 1];
          if (latest.chain > 1) drawChainOverlay(latest, t);
        }

        function drawScoreBubble(burst, t, index) {
          const age = Math.max(0, t - burst.at);
          const fade = clamp((burst.until - t) / 0.3, 0, 1);
          const intro = clamp(age / 0.13, 0, 1);
          const positive = burst.amount > 0;
          const bubbleW = burst.amount === -5 ? 82 : 66;
          const bubbleH = 48;
          const x = scoreBubbleX(burst, bubbleW);
          const y = heroScreenY - 10 - age * (prefersReducedMotion ? 8 : 27) - index * 9;
          const scale = prefersReducedMotion ? 1 : 0.72 + easeOutQuart(intro) * 0.28;

          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          drawSteppedBubble(
            -bubbleW / 2,
            -bubbleH / 2,
            bubbleW,
            bubbleH,
            positive ? '#0f7c45' : '#6d1014',
            positive ? '#ffe253' : '#ff6157',
            burst.side
          );
          drawPixelText(formatDelta(burst.amount), 0, 10, burst.amount === -5 ? 28 : 30, '#fffbe2', 'center');
          ctx.restore();
        }

        function scoreBubbleX(burst, bubbleW) {
          const carX = laneCenter(clamp(Math.round(burst.lane), 0, LANES - 1));
          const heroX = laneCenter(hero.drawLane ?? hero.lane);
          const clearance = bubbleW * 0.5 + clamp(laneWidth * 0.34, 24, 46);
          const screenInset = Math.max(14, bubbleW * 0.27);
          const candidates = [
            clamp(carX - clearance, screenInset, width - screenInset),
            clamp(carX + clearance, screenInset, width - screenInset),
          ];
          return candidates.sort((a, b) => {
            const aHeroClearance = Math.abs(a - heroX);
            const bHeroClearance = Math.abs(b - heroX);
            const aCarClearance = Math.abs(a - carX);
            const bCarClearance = Math.abs(b - carX);
            return bHeroClearance * 3 + bCarClearance - (aHeroClearance * 3 + aCarClearance);
          })[0];
        }

        function drawChainOverlay(burst, t) {
          const age = Math.max(0, t - burst.at);
          const fade = clamp((burst.until - t) / 0.35, 0, 1);
          const positive = burst.amount > 0;
          const hot = positive ? '#ffe253' : '#ff6157';
          const cool = positive ? '#17c964' : '#a7162a';
          const copy = chainCopy(burst);
          const placement = chainOverlayPlacement(burst);
          const baseY = heroScreenY - clamp(height * 0.2, 120, 175);
          const pulse = prefersReducedMotion ? 1 : 0.92 + easeOutQuart(clamp(age / 0.18, 0, 1)) * 0.08;

          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(placement.x, baseY);
          if (burst.milestone) {
            ctx.scale(pulse, pulse);
            drawPixelBurst(0, 0, clamp(placement.width * 0.4, 18, 52), hot, t);
            drawStackedChainText(copy, 0, -14, placement.width, hot);
            drawPixelText(`x${burst.chain}`, 0, 39, clamp(placement.width * 0.18, 12, 20), '#fffbe2', 'center');
          } else if (burst.variant === 0) {
            const orbit = clamp(placement.width * 0.3, 13, 34);
            drawPixelBubble(-orbit, 3, 8, cool, COLORS.ink);
            drawPixelBubble(orbit, 7, 6, hot, COLORS.ink);
            drawPixelBubble(-orbit * 0.55, -18, 5, hot, COLORS.ink);
            drawStackedChainText(copy, 0, 0, placement.width, hot);
          } else if (burst.variant === 1) {
            ctx.rotate(burst.side * -0.035);
            drawStackedChainText(copy, 0, -5, placement.width, hot);
            rect(-placement.width * 0.32, 22, placement.width * 0.22, 4, cool);
            rect(-placement.width * 0.06, 22, placement.width * 0.12, 4, hot);
            rect(placement.width * 0.1, 22, placement.width * 0.22, 4, cool);
          } else if (burst.variant === 2) {
            const alertW = Math.max(28, placement.width - 6);
