            clamp(carX - clearance, screenInset, width - screenInset),
            clamp(carX + clearance, screenInset, width - screenInset),
          ];
          return candidates.sort((a, b) => {
            const aHeroClearance = Math.abs(a - heroX);
            const bHeroClearance = Math.abs(b - heroX);
            const aCarClearance = Math.abs(a - carX);
            const bCarClearance = Math.abs(b - carX);
            return bHeroClearance * 3 + bCarClearance - (aHeroClearance * 3 + aCarClearance);
          })[0];
        }

        // The roadside callout is one plate at every viewport: the copy is
        // measured and wrapped to fit, ornaments stay outside the plate, and
        // when the shoulder is too thin to hold legible type the plate docks
        // along the top edge instead of shrinking into the field.
        function drawChainOverlay(burst, t) {
          const age = Math.max(0, t - burst.at);
          const fade = clamp((burst.until - t) / 0.35, 0, 1);
          const positive = burst.amount > 0;
          const skin = positive
            ? { fill: 'rgba(9, 48, 30, 0.94)', edge: PAYOUT.winEdge, accent: '#3ddc84' }
            : { fill: 'rgba(56, 12, 14, 0.94)', edge: PAYOUT.lossEdge, accent: '#ff6f62' };
          const place = chainOverlayPlacement(burst);
          const layout = layoutCallout(chainCopy(burst), place.textWidth, place.minSize, place.maxSize);
          const badgeSize = Math.round(clamp(layout.size * 0.56, 11, 19));
          const textBlock = layout.lines.length * layout.lineHeight;
          const plateW = place.plateWidth;
          const plateH = Math.round(textBlock + badgeSize + 42);
          const y = place.dock === 'top' ? Math.round(12 + plateH / 2) : place.y;
          const intro = easeOutQuart(clamp(age / 0.34, 0, 1));
          const rise = prefersReducedMotion ? 0 : (1 - intro) * 12;
          const pop = prefersReducedMotion ? 1 : 0.93 + intro * 0.07;

          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(place.x, y + rise);
          ctx.scale(pop, pop);

          if (burst.milestone) drawCalloutGlow(plateW, plateH, skin.accent, t);
          drawPlate(-plateW / 2, -plateH / 2, plateW, plateH, skin.fill, skin.edge);

          const top = -plateH / 2 + 16;
          layout.lines.forEach((line, index) => {
            drawPixelText(line, 0, top + index * layout.lineHeight + layout.size * 0.8, layout.size, PAYOUT.ink, 'center');
          });

          const ruleY = Math.round(top + textBlock + 5);
          const ruleW = Math.round(plateW * 0.4);
          rect(-ruleW / 2, ruleY, ruleW, 2, skin.accent);
          drawChainTally(burst, place.textWidth, badgeSize, ruleY + badgeSize + 9, skin);
          ctx.restore();
        }

        // The old badge just said "x3", which reads as a points multiplier it
        // never was. Lead with the points the run actually banked, in the same
        // bright ink as the payout chips, then say how long the run is.
        function drawChainTally(burst, maxWidth, size, baseY, skin) {
          const points = formatDelta(burst.chainTotal);
          const pointsW = measureLabel(points, size);
          const gap = size * 1.05;
          const runText = chainRunText(burst, maxWidth - pointsW - gap, size);
          const totalW = pointsW + (runText ? gap + measureLabel(runText, size) : 0);
          const x = -totalW / 2;
          drawPixelText(points, x, baseY, size, PAYOUT.ink, 'left');
          if (runText) drawPixelText(runText, x + pointsW + gap, baseY, size, skin.accent, 'left');
        }

        function chainRunText(burst, room, size) {
          if (room <= 0) return '';
          const long = `${burst.chain} IN A ROW`;
          if (measureLabel(long, size) <= room) return long;
          const short = `x${burst.chain}`;
          return measureLabel(short, size) <= room ? short : '';
        }

        // A milestone glows and breathes instead of throwing pixel rays across
        // the copy, which is what used to make the words unreadable.
        function drawCalloutGlow(plateW, plateH, color, t) {
          const pulse = prefersReducedMotion ? 0.5 : 0.35 + Math.abs(Math.sin(t * 2.6)) * 0.45;
          ctx.save();
          ctx.globalAlpha *= pulse;
          ctx.shadowColor = color;
          ctx.shadowBlur = 28;
          ctx.fillStyle = color;
          roundedPath(-plateW / 2, -plateH / 2, plateW, plateH, PANEL_RADIUS);
          ctx.fill();
          ctx.restore();
        }

        function chainOverlayPlacement(burst) {
          const roadRight = roadLeft + roadWidth;
          const leftRoom = Math.max(0, roadLeft - 10);
          const rightRoom = Math.max(0, width - roadRight - 10);
          let side = burst.side;
          if (side < 0 && leftRoom < rightRoom - 24) side = 1;
          if (side > 0 && rightRoom < leftRoom - 24) side = -1;

          if (roadLeft >= COMPACT_GUTTER) {
            const room = side < 0 ? leftRoom : rightRoom;
            const plateWidth = Math.round(Math.min(room - 18, CALLOUT_MAX_W));
            return {
              dock: 'gutter',
              plateWidth,
              textWidth: plateWidth - 22,
              minSize: 17,
              maxSize: 34,
              x: Math.round(side < 0 ? 6 + room / 2 : roadRight + 4 + room / 2),
              y: heroScreenY - clamp(height * 0.2, 120, 175),
            };
          }

          const pad = clamp(width * 0.025, 14, 28);
          const left = 5 + compactRailWidth() + 12;
          const right = width - pad;
          const plateWidth = Math.round(clamp(right - left, 118, CALLOUT_MAX_W));
          return {
            dock: 'top',
            plateWidth,
            textWidth: plateWidth - 22,
            minSize: 16,
            maxSize: 28,
            x: Math.round(left + (right - left) / 2),
            y: 0,
          };
        }

        // Try the largest size whose wrapped copy still fits two lines, so a
        // wide shoulder gets a headline and a thin one degrades to smaller
        // type rather than to text that spills over the road.
        function layoutCallout(text, maxWidth, minSize, maxSize) {
          for (let size = maxSize; size >= minSize; size -= 1) {
            const lines = wrapLabelLines(text, size, maxWidth);
            if (calloutFits(lines, size, maxWidth)) {
              return { size, lines, lineHeight: Math.round(size * 1.16) };
            }
          }
          // Nothing fits at the preferred floor, so keep shrinking rather than
          // let a long word run off the shoulder and onto the road.
          let size = minSize;
          let lines = wrapLabelLines(text, size, maxWidth);
          while (size > 12 && !calloutFits(lines, size, maxWidth)) {
            size -= 1;
            lines = wrapLabelLines(text, size, maxWidth);
          }
          return { size, lines: lines.slice(0, CALLOUT_MAX_LINES), lineHeight: Math.round(size * 1.16) };
        }

        function calloutFits(lines, size, maxWidth) {
          return lines.length <= CALLOUT_MAX_LINES
            && lines.every((line) => measureLabel(line, size) <= maxWidth);
        }

        function wrapLabelLines(text, size, maxWidth) {
          const lines = [];
          let line = '';
          for (const word of text.split(' ')) {
            const next = line ? `${line} ${word}` : word;
            if (line && measureLabel(next, size) > maxWidth) {
              lines.push(line);
              line = word;
            } else {
              line = next;
            }
          }
          if (line) lines.push(line);
          return lines;
        }

        // Copy answers what actually just happened - what got passed, how bad
        // the hit was, how deep the run is - instead of drawing from one flat
        // list. Five phrases indexed by a cycling counter meant the same five
        // came back in the same order all session.
        const CHAIN_COPY = {
          pass: [
            'CLEAN PASS', 'TWO WIDE', 'HOT LAP', 'FULL THROTTLE', 'SLICED THROUGH',
            'FOUND THE GAP', 'WENT AROUND', 'STUCK THE MOVE', 'NICE LINE', 'THREADED IT',
            'ON THE MOVE', 'GAP CLOSED', 'OUTBRAKED', 'SIDE BY SIDE', 'DOWN THE INSIDE',
          ],
          bigPass: [
            'CLEARED THE RIG', 'PAST THE TRUCK', 'AROUND THE BUS', 'BIG ONE DOWN',
            'OUTRAN THE RIG', 'TRUCK DISPATCHED', 'WIDE LOAD CLEARED',
          ],
          lost: [
            'GOT PASSED', 'OFF PACE', 'LOST POSITION', 'BACK MARKER', 'FIND A GAP',
            'WRONG LANE', 'BOXED OUT', 'TOO SLOW', 'DROPPED ONE', 'LEFT BEHIND',
            'STUCK BEHIND', 'LOSING TOUCH', 'SHOULD HAVE MOVED',
          ],
          trucked: [
            'TRUCKED', 'EIGHTEEN WHEELS', 'BIG RIG WINS', 'FLATTENED',
            'THE RIG GOT YOU', 'SEMI TROUBLE', 'ROLLED RIGHT OVER', 'THAT ONE HURT',
          ],
          // Milestones escalate by tier, so twenty straight cannot read the
          // same as five.
          runs: [
            ['FIVE STRAIGHT', 'HIGH FIVE', 'ON A ROLL', 'FIVE IN A ROW'],
            ['TEN STRAIGHT', 'DOUBLE DIGITS', 'ROLLING NOW', 'TEN AND COUNTING'],
            ['FIFTEEN UP', 'UNSTOPPABLE', 'PURE PACE', 'LAPPING THEM'],
            ['RAMPAGE', 'NOBODY LEFT', 'ALL COMERS', 'VICTORY LAP', 'ABSOLUTE PACE'],
          ],
          slides: [
            ['FIVE LOST', 'ROUGH PATCH', 'SLIPPING', 'FIVE DOWN'],
            ['TEN DOWN', 'REALLY SLIPPING', 'TEN LOST', 'GOING BACKWARDS'],
            ['FIFTEEN DOWN', 'DISASTER LAP', 'NOTHING WORKING'],
            ['TOTAL COLLAPSE', 'ROCK BOTTOM', 'PARKING LOT', 'PULL OVER'],
          ],
        };

        function chainCopy(burst) {
          const positive = burst.amount > 0;
          if (burst.milestone) {
            const tiers = positive ? CHAIN_COPY.runs : CHAIN_COPY.slides;
            const index = clamp(Math.floor(burst.chain / 5) - 1, 0, tiers.length - 1);
            return pickCopy(tiers[index], burst);
          }
          if (!positive && burst.amount <= -5) return pickCopy(CHAIN_COPY.trucked, burst);
          if (positive && burst.kind !== 'car') return pickCopy(CHAIN_COPY.bigPass, burst);
          return pickCopy(positive ? CHAIN_COPY.pass : CHAIN_COPY.lost, burst);
        }

        function pickCopy(pool, burst) {
          const seed = burst.chain * 7.71 + burst.variant * 13.37 + Math.abs(burst.chainTotal) * 2.93;
          return pool[Math.floor(hash01(seed) * pool.length) % pool.length];
        }

        // arcTo rather than roundRect: same corners everywhere, including
        // browsers old enough to predate roundRect, which matters for a piece
        // meant to still open in a decade.
        function roundedPath(x, y, w, h, radius) {
          const r = Math.max(0, Math.min(radius, w * 0.5, h * 0.5));
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function drawPlate(x, y, w, h, fill, border) {
          const radius = Math.min(PANEL_RADIUS, h * 0.34);
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 16;
          ctx.shadowOffsetY = 5;
          roundedPath(x, y, w, h, radius);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.restore();

          roundedPath(x + 1, y + 1, w - 2, h - 2, radius - 1);
          ctx.strokeStyle = border;
          ctx.lineWidth = 2;
          ctx.stroke();

          // A hairline of light along the top edge keeps the panel from
          // reading as a flat hole punched in the scene.
          ctx.save();
          roundedPath(x + 1, y + 1, w - 2, h - 2, radius - 1);
          ctx.clip();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.fillRect(x, y, w, Math.max(2, h * 0.22));
          ctx.restore();
        }





        function formatScore(value) {
          const absolute = String(Math.abs(value)).padStart(3, '0');
          return value < 0 ? `-${absolute}` : absolute;
        }

        function formatDelta(value) {
          return value > 0 ? `+${value}` : String(value);
        }

        function drawMiniMeter(x, y) {
          const w = clamp(width * 0.18, 110, 190);
          rect(x, y, w, 5, 'rgba(255, 255, 255, 0.18)');
          rect(x, y, w * clamp(hero.speed / 38, 0, 1), 5, HERO_YELLOW);
          rect(x, y + 10, w, 5, 'rgba(255, 255, 255, 0.18)');
          const traffic = clamp(cars.filter((car) => Math.abs(car.s - hero.s) < 90).length / 18, 0, 1);
          rect(x, y + 10, w * traffic, 5, '#aeb6c1');
        }

        function drawCone(x, y) {
          rect(x - 5, y + 6, 10, 4, COLORS.ink);
          rect(x - 4, y - 4, 8, 10, COLORS.cone);
          rect(x - 3, y, 6, 2, '#fff6d5');
        }

        // Labels sit on panels now, so the contrast comes from the panel and
        // the type only needs a soft drop for depth. The old keyline halo read
        // as a sticker outline once the panels stopped being pixel-stepped.
        function drawPixelText(text, x, y, size, color, align) {
          const px = Math.round(size);
          ctx.save();
          ctx.font = labelFont(px);
          ctx.textAlign = align;
          ctx.textBaseline = 'alphabetic';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
          ctx.shadowBlur = 3;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = color;
          ctx.fillText(text, Math.round(x), Math.round(y));
          ctx.restore();
        }

        function labelFont(size) {
          return `700 ${Math.round(size)}px ${LABEL_STACK}`;
        }

        function measureLabel(text, size) {
          ctx.font = labelFont(size);
          return ctx.measureText(text).width;
        }

        function fitLabelSize(text, maxWidth, minSize, maxSize) {
          let size = Math.round(maxSize);
          while (size > minSize && measureLabel(text, size) > maxWidth) size -= 1;
          return size;
        }

        function laneCenter(lane) {
          return roadLeft + (lane + 0.5) * laneWidth;
        }

        // The ramp is specified by the width a car actually needs measured
        // ACROSS the ramp, then converted to the horizontal half-width the
        // scanline renderer wants. Sizing `half` directly (as this used to)
        // made a diagonal corridor far narrower than a lane, because a
        // horizontal slice of a diagonal band is longer than the band is wide.
        function exitRampGeometry(s) {
          const bounds = roadBoundsAt(s);
          const startY = worldToY(s);
          const shoulder = Math.max(16, laneWidth * 0.22);
          const corridor = clamp(laneWidth * 0.86, 52, 108);
          const endX = width + Math.max(laneWidth * 0.58, 64);
          const startX = bounds.right - laneWidth * 0.5;
          const run = endX - startX;
          const drop = clamp(run * 0.92, 210, height * 0.62);
          const slant = Math.hypot(run, drop);
          const half = (corridor * 0.5 * slant) / Math.max(1, drop);
          const endY = startY - drop;
          const curveX = startX + run * 0.38;
          const curveY = startY + (endY - startY) * 0.38;
          return {
            startX,
            startY,
            roadRight: bounds.right,
            roadShoulder: bounds.right + shoulder,
            curveX,
            curveY,
            endX,
            endY,
            half,
            corridor,
            shoulder: shoulder * 0.62,
          };
        }

        function exitVehiclePosition(vehicle) {
          const ramp = exitRampGeometry(vehicle.exitTarget ?? vehicle.s);
          const amount = smoothstep(clamp(vehicle.exitProgress / 1.08, 0, 1));
          const split = 0.46;
          let x;
          let y;
          let tangentX;
          let tangentY;

          if (amount < split) {
            const t = amount / split;
            x = ramp.startX + (ramp.curveX - ramp.startX) * t;
            y = ramp.startY + (ramp.curveY - ramp.startY) * t;
            tangentX = ramp.curveX - ramp.startX;
            tangentY = ramp.curveY - ramp.startY;
          } else {
            const t = (amount - split) / (1 - split);
            x = ramp.curveX + (ramp.endX - ramp.curveX) * t;
            y = ramp.curveY + (ramp.endY - ramp.curveY) * t;
            tangentX = ramp.endX - ramp.curveX;
            tangentY = ramp.endY - ramp.curveY;
          }

          return {
            x: pixelSnap(x, 3),
            y: pixelSnap(y, 3),
            angle: Math.atan2(tangentY, tangentX) + Math.PI / 2,
          };
        }

        function vehicleBox(vehicle) {
          const size = vehicleDrawSize(vehicle);
          if (vehicle.exiting) {
            const position = exitVehiclePosition(vehicle);
            return {
              x: position.x,
              w: size.w,
              h: size.h,
            };
          }
          return {
            x: laneCenter(vehicle.drawLane ?? vehicle.lane),
            w: size.w,
            h: size.h,
          };
        }

        function vehicleDrawSize(vehicle) {
          if (vehicle.kind === 'semi') {
            return {
              w: clamp(laneWidth * 0.42, 20, 34),
              h: clamp(laneWidth * 0.95, 50, 78),
            };
          }
          if (vehicle.kind === 'bus') {
            return {
              w: clamp(laneWidth * 0.4, 19, 32),
              h: clamp(laneWidth * 0.84, 46, 70),
            };
          }
          return {
            w: vehicle.isHero ? clamp(laneWidth * 0.42, 20, 34) : clamp(laneWidth * 0.36, 17, 29),
            h: vehicle.isHero ? clamp(laneWidth * 0.72, 34, 56) : clamp(laneWidth * 0.62, 30, 48),
          };
        }

        function visualHalfLength(vehicle) {
          return (vehicleDrawSize(vehicle).h / Math.max(1, metersToPixels)) * 0.5;
        }

        function worldToY(s) {
          return heroScreenY - (s - cameraS) * metersToPixels;
        }

        function screenToWorldY(y) {
          return cameraS + (heroScreenY - y) / metersToPixels;
        }

        function pixelBounds(bounds, size) {
          const left = pixelSnap(bounds.left, size);
          const right = pixelSnap(bounds.right, size);
          return { left, right, width: Math.max(size, right - left) };
        }

        function pixelSnap(value, size) {
          return Math.round(value / size) * size;
        }

        function easeOutQuart(value) {
          return 1 - Math.pow(1 - clamp(value, 0, 1), 4);
        }

        function rect(x, y, w, h, fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function strokeRect(x, y, w, h, stroke, lineWidth) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function shade(hex, amount) {
          const value = Number.parseInt(hex.slice(1), 16);
          const r = clamp(((value >> 16) & 255) + amount * 255, 0, 255);
          const g = clamp(((value >> 8) & 255) + amount * 255, 0, 255);
          const b = clamp((value & 255) + amount * 255, 0, 255);
          return `rgb(${r | 0}, ${g | 0}, ${b | 0})`;
        }

        function mulberry32(a) {
          return function randValue() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function rand(min, max) {
          return min + random() * (max - min);
        }

        function randInt(min, max) {
          return Math.floor(rand(min, max + 1));
        }

        function pick(items) {
          return items[Math.floor(random() * items.length)];
        }

        function range(start, end) {
          const values = [];
          for (let i = start; i < end; i += 1) values.push(i);
          return values;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function mod(value, size) {
          return ((value % size) + size) % size;
        }

        function hash01(value) {
          const x = Math.sin(value) * 43758.5453123;
          return x - Math.floor(x);
        }

        addEventListener('pagehide', () => cancelAnimationFrame(raf), { once: true });
      })();
    </script>
