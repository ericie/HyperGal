<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A changing oil painting made from loaded, bristled strokes, raised pigment, dry edges and raking light.">
<title>Painting Together · Hypermedia Club</title>
<style>
:root { color-scheme: light; background: #ebe6da; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
canvas, img { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
img { object-fit: contain; }
canvas:focus-visible { outline: 2px solid #31508c; outline-offset: -5px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="painting" tabindex="0" role="img" aria-label="A changing oil painting of curved, loaded brush strokes. Thick paint, individual bristle grooves and dry edges catch the light. Drag to paint into the surface. Space pauses, R starts a new painting, and S saves a PNG."></canvas>
<img id="fallback" src="thumbnail.png" alt="A still view of the oil painting. Live paint requires WebGL 2 and floating-point render targets." hidden>
<script src="mount-fuji.js"></script>
</body>
</html>
