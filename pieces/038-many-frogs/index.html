<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A finite crowd of frogs attempts to cross one pale traffic lane. The surviving count falls with every traffic death." />
    <link rel="icon" href="data:," />
    <title>Many Frogs · Hypermedia Club</title>
    <style>
      :root { color-scheme: light; --void: #dadbd4; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--void);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; background: var(--void);
      }
      #remaining-frogs {
        position: fixed; top: 5.5%; right: max(20px, env(safe-area-inset-right));
        transform: translateY(-50%); color: #575c55;
        font: 500 clamp(24px, 3vw, 34px)/1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums; pointer-events: none;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="game" role="img" aria-label="Half the frogs begin on each bank and attempt to cross a single broad lane in opposite directions. Cars try to dodge them. Successful frogs leave through the opposite side. The surviving count decreases only when a frog is hit."></canvas>
    <output id="remaining-frogs" aria-label="Frogs remaining"></output>
    <script>
      (() => {
        'use strict';

        // A close view of one lane. Frogs start on both banks and leave
        // through the opposite bank after a successful single pass.
        const VIEW_ROWS = 5;
        const ROAD_FRACTION = 0.78;
        const TRAFFIC_PERIOD = 2.7;
        const TRAFFIC_MIN_SPEED = 2.4;
        const TRAFFIC_GAP = 0.35;
        const STEERING_RATE = 3;
        const MAX_STEERING_ANGLE = 0.18;
        const HOP_TIME = 0.24;
        const FROG_HIT_RADIUS = 0.16;
        const ROUTE_DEPTH = 3;
        const ROUTE_BEAM_WIDTH = 5;
        const TAU = Math.PI * 2;
        const COURSE_SEED = hashString('many-frogs-038-course');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d', { alpha: false });
        const counter = document.querySelector('#remaining-frogs');

        // The ghost field stays pale. All color belongs to frogs and the
        // stationary death marks they leave behind.
        const palette = {
          void: '#dadbd4', verge: '#c6c7bf', paper: '#fdfdfb',
          shade: '#d9dad2', shadeDeep: '#c8c9c0', shadow: '#c2c3b9',
          grassA: '#f1f2ec', grassB: '#ecede6', grassLine: '#dadbd2',
          road: '#e0e1dd', roadEdge: '#cbccc4', roadMark: '#fbfbf7',
          carLine: '#90958d', carDetail: '#a9ada4',
          ink: '#b2b3aa'
        };

        // A narrow natural-pigment palette: madder and oxide carry the field,
        // with quieter plum notes. Each frog stays identifiable without reading
        // as one stop in a literal rainbow.
        const frogPigments = [
          { frog: 'oklch(0.62 0.16 23)', wash: 'oklch(0.58 0.15 20)', rim: 'oklch(0.37 0.12 18)' },
          { frog: 'oklch(0.52 0.09 72)', wash: 'oklch(0.49 0.09 68)', rim: 'oklch(0.31 0.07 60)' },
          { frog: 'oklch(0.58 0.13 345)', wash: 'oklch(0.54 0.13 347)', rim: 'oklch(0.33 0.10 350)' },
          { frog: 'oklch(0.66 0.14 33)', wash: 'oklch(0.61 0.13 30)', rim: 'oklch(0.39 0.11 26)' },
          { frog: 'oklch(0.47 0.10 305)', wash: 'oklch(0.45 0.10 308)', rim: 'oklch(0.28 0.08 312)' },
          { frog: 'oklch(0.65 0.12 48)', wash: 'oklch(0.60 0.12 45)', rim: 'oklch(0.38 0.10 40)' },
          { frog: 'oklch(0.62 0.10 355)', wash: 'oklch(0.58 0.10 357)', rim: 'oklch(0.37 0.08 2)' },
          { frog: 'oklch(0.50 0.13 8)',  wash: 'oklch(0.47 0.12 8)',  rim: 'oklch(0.29 0.09 5)' },
          { frog: 'oklch(0.68 0.09 77)', wash: 'oklch(0.62 0.09 72)', rim: 'oklch(0.40 0.07 64)' },
          { frog: 'oklch(0.52 0.12 325)', wash: 'oklch(0.49 0.11 328)', rim: 'oklch(0.30 0.09 332)' },
          { frog: 'oklch(0.58 0.10 60)', wash: 'oklch(0.54 0.10 56)', rim: 'oklch(0.34 0.08 50)' },
          { frog: 'oklch(0.55 0.14 18)', wash: 'oklch(0.52 0.13 16)', rim: 'oklch(0.32 0.10 14)' }
        ];

        // Upward progress with lateral escape routes and brief retreats.
        const moveOptions = [
          { direction: 'up', dx: 0, dy: 1, base: 0 },
          { direction: 'left', dx: -1, dy: 0, base: 2 },
          { direction: 'right', dx: 1, dy: 0, base: 2 },
          { direction: 'down', dx: 0, dy: -1, base: 0 },
          { direction: 'wait', dx: 0, dy: 0, base: 0 }
        ];

        function moveBase(frog, choice) {
          if (choice.dy === 0) return choice.base;
          return choice.dy === frog.heading ? 10 : -5;
        }

        let width = 0;
        let height = 0;
        let dpr = 1;
        let tile = 120;
        let boardLeft = 0;
        let boardBaseY = 0;
        let COLS = 21;
        let ROWS = VIEW_ROWS;
        let fieldRows = 2;
        let roadRows = 1;
        let initialFrogs = 0;
        let streamSeed = 1;
        let totalDeaths = 0;
        let totalCrossings = 0;
        let totalExited = 0;
        let frogs = [];
        let deathMarks = [];
        let nextFrogId = 0;
        let elapsed = 0;
        let lastTime = performance.now();
        const laneCache = new Map();
        const surfacePrints = new Map();
        let running = !document.hidden;
        let frame = 0;

        resize();
        startRound();
        frame = requestAnimationFrame(loop);

        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
          if (!running && frame) {
            cancelAnimationFrame(frame);
            frame = 0;
          } else if (running && !frame) frame = requestAnimationFrame(loop);
        });


        function startRound() {
          frogs = [];
          deathMarks = [];
          elapsed = 0;
          nextFrogId = 0;
          totalDeaths = totalCrossings = totalExited = 0;
          laneCache.clear();
          streamSeed = hashString(`many-frogs-round-${Math.floor(Date.now() / 1000)}`);
          initialFrogs = clamp(Math.ceil(COLS * 7 / 2) * 2, 24, 112);
          for (let index = 0; index < initialFrogs; index++) {
            const id = nextFrogId++;
            const seed = streamSeed + id * 8191;
            const heading = index % 2 === 0 ? 1 : -1;
            // Keep the upper bank's counter clear of the starting crowd.
            const reserve = heading < 0 ? Math.min(COLS * 0.25, 72 / tile) : 0;
            const x = 0.25 + mod(id * 0.61803398875 + hash(seed), 1) * (COLS - 0.5 - reserve);
            const bankY = 0.925 + hash(seed + 43) * 0.045;
            const y = screenToWorldY(height * (heading > 0 ? bankY : 1 - bankY));
            const frog = createFrog(id, x, y, frogPigments[id % frogPigments.length], seed);
            frog.heading = heading;
            frog.facingAngle = heading > 0 ? 0 : Math.PI;
            frog.nextMoveAt = 0.12 + hash(seed + 89) * 1.2;
            frog.crossingU = clamp((x + (hash(seed + 41) - 0.5) * 1.2) / COLS, 0, 1);
            frogs.push(frog);
          }
          updateCounter();
        }

        function updateCounter() {
          counter.textContent = String(initialFrogs - totalDeaths);
        }

        function createFrog(id, x, y, pigment, seed) {
          return {
            id,
            x,
            y,
            fromX: x,
            fromY: y,
            toX: x,
            toY: y,
            hop: 1,
            alive: true,
            facingAngle: 0,
            deathAt: -1,
            deathKind: '',
            deathPhase: '',
            color: pigment.frog,
            pigment,
            basePigment: pigment,
            age: 0,
            maturity: 0,
            pigmentStep: -1,
            decision: 0,
            waitStreak: 0,
            heading: 1,
            crossings: 0,
            crossingU: x / COLS,
            crossed: false,
            finished: false,
            nextMoveAt: elapsed + 0.12 + hash(seed + id * 613) * 0.08,
            boldness: hash(seed + id * 1709),
            patience: hash(seed + id * 2347),
            lateralPreference: hash(seed + id * 4517) < 0.5 ? -1 : 1
          };
        }

        function loop(now) {
          const dt = Math.min(0.035, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          frame = 0;
          if (!running) return;
          update(dt);
          draw();
          frame = requestAnimationFrame(loop);
        }


        function update(dt) {
          elapsed += dt;
          updateTraffic(dt);

          frogs.forEach((frog) => {
            if (!frog.alive) return;
            ageFrog(frog, dt);

            if (frog.hop < 1) {
              const nextHop = Math.min(1, frog.hop + dt / HOP_TIME);
              const t = easeOutQuart(nextHop);
              const nextX = lerp(frog.fromX, frog.toX, t);
              const nextY = hopY(frog.fromY, frog.toY, t);
              frog.hop = nextHop;
              frog.x = nextX;
              frog.y = nextY;
              const hazard = hazardAt(frog.x, frog.y, elapsed);
              if (hazard) {
                killFrog(frog, hazard);
                return;
              }
              if (frog.hop === 1) checkLanding(frog);
              return;
            }

            if (hazardAt(frog.x, frog.y, elapsed)) {
              killFrog(frog, 'traffic');
              return;
            }

            if (elapsed >= frog.nextMoveAt) chooseMove(frog);
          });

          updateDeathMarks();

          frogs = frogs.filter(frog => frog.alive);
        }


        function pigmentComponents(color) {
          return color.match(/[\d.]+/g).map(Number);
        }

        function vividPigment(pigment, maturity) {
          const enrich = (color, amount) => {
            const [light, chroma, hue] = pigmentComponents(color);
            return `oklch(${light + maturity * 0.025 * amount} ${chroma * (1 + maturity * 0.85 * amount)} ${hue})`;
          };
          return { frog: enrich(pigment.frog, 1), wash: enrich(pigment.wash, 1), rim: enrich(pigment.rim, 0.4) };
        }

        function ageFrog(frog, dt) {
          frog.age += dt;
          frog.maturity = 1 - Math.exp(-frog.age / 12);
          const step = Math.floor(frog.age * 2);
          if (step === frog.pigmentStep) return;
          frog.pigmentStep = step;
          frog.pigment = vividPigment(frog.basePigment, frog.maturity);
          frog.color = frog.pigment.frog;
        }

        function movementTarget(frog, x, y, move, depth = 0) {
          if (move.direction === 'wait') return { x, y };
          const seed = streamSeed + frog.id * 8191 + frog.decision * 379 + depth * 1297;
          // A hop spans only 9–12% of the road's height, so the crossing
          // requires several distinct jumps at every viewport size.
          const length = height * ROAD_FRACTION / tile * (0.09 + hash(seed + 41) * 0.03);
          const dx = move.dx * length;
          const dy = move.dy ? screenToWorldY(worldToScreenY(y) - move.dy * length * tile) - y : 0;
          const goalY = destinationY(frog);
          const fraction = move.dy === frog.heading && ((frog.heading > 0 && y + dy > goalY) ||
            (frog.heading < 0 && y + dy < goalY)) ? clamp((goalY - y) / dy, 0, 1) : 1;
          return { x: clamp(x + dx * fraction, 0.25, COLS - 0.25),
            y: !move.dy ? y : fraction < 1 && move.dy === frog.heading ? goalY :
              clamp(y + dy * fraction, frog.heading > 0 ? 0 : exitWorldY(-1), frog.heading > 0 ? exitWorldY() : ROWS - 1) };
        }

        function positionDanger(x, y, atTime, duration) {
          const lane = getLane(fieldRows);
          const clearance = trafficClearance(lane, x, atTime, duration, y);
          if (clearance < FROG_HIT_RADIUS) return 100;
          return clearance < 0.72 ? (0.72 - clearance) * 10 : 0;
        }

        function chooseMove(frog) {
          if (!frog.alive || frog.hop < 1) return;

          const currentLane = getLane(Math.round(frog.y));
          const evaluated = [];

          moveOptions.forEach((choice, index) => {
            const arrival = elapsed + (choice.direction === 'wait' ? 0.11 : HOP_TIME);
            const { x, y } = movementTarget(frog, frog.x, frog.y, choice);
            if (x < 0.25 || x > COLS - 0.25) return;
            if (y < (frog.heading > 0 ? 0 : exitWorldY(-1)) || y > (frog.heading > 0 ? exitWorldY() : ROWS - 1)) return;

            const lane = getLane(Math.round(y));
            const dwell = lane.type === 'road' ? 0.15 : 0.05;
            const danger = moveDanger(frog, choice, x, y, arrival, dwell);
            const riskWeight = lerp(2.3, 1.55, frog.boldness);
            let score = moveBase(frog, choice) - danger * riskWeight;
            score += shoreApproachScore(frog, frog.x, frog.y, x, y);
            const forward = choice.dy === frog.heading;

            if (forward) score += frog.boldness * 1.2;
            if (Math.sign(choice.dx) === frog.lateralPreference) score += 0.4;
            if (choice.direction === 'wait') {
              score += currentLane.type === 'grass' ? 3.7 + frog.patience * 1.4 : -18;
              score -= Math.min(11, frog.waitStreak * 0.65);
            }
            if (currentLane.type !== 'grass' && forward) score += 2.2;
            if (forward && danger < 40) score += Math.min(7, frog.waitStreak * 0.45);

            const thinkDelay = lane.type === 'grass' ? 0.28 : 0.075;
            const escapeAt = arrival + thinkDelay + HOP_TIME;
            let escapeDanger = Infinity;
            for (const move of moveOptions) {
              if (move.direction === 'wait' || move.dy === -frog.heading) continue;
              const next = movementTarget(frog, x, y, move, 1);
              const nextLane = getLane(Math.round(next.y));
              escapeDanger = Math.min(escapeDanger,
                positionDanger(next.x, next.y, escapeAt, nextLane.type === 'road' ? 0.13 : 0.04));
            }

            if (escapeDanger >= 50) score -= 35;
            else score += Math.max(0, 6 - escapeDanger) * 0.55;

            const routeScore = forecastRouteScore(
              frog,
              x,
              y,
              arrival + thinkDelay,
              choice.direction
            );
            if (routeScore <= -70) score -= 48;
            else score += routeScore * 0.5;

            score += brainRandom(frog, index + 1) * 0.9;
            evaluated.push({ ...choice, x, y, score, danger, escapeDanger, routeScore });
          });

          const escapeLimit = frog.waitStreak > 8 ? 101 : 60;
          const safe = evaluated.filter((choice) =>
            choice.danger < 40 && choice.escapeDanger < escapeLimit && choice.routeScore > -70);
          const pool = safe.length ? safe : evaluated;
          pool.sort((a, b) => b.score - a.score);
          beginHop(frog, pool.length ? pool[0].direction : 'wait', pool[0]);
        }

        function moveDanger(frog, choice, targetX, targetY, arrival, dwell) {
          const targetLane = getLane(Math.round(targetY));
          const landingDanger = positionDanger(targetX, targetY, arrival, dwell);
          if (choice.direction === 'wait') {
            const currentLane = getLane(Math.round(frog.y));
            return Math.max(
              landingDanger,
              positionDanger(frog.x, frog.y, elapsed, arrival - elapsed)
            );
          }
          if (landingDanger >= 100) return landingDanger;

          const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
          for (let step = 1; step <= steps; step += 1) {
            const progress = step / steps;
            const x = lerp(frog.x, targetX, progress);
            const y = hopY(frog.y, targetY, progress);
            const atTime = elapsed + HOP_TIME * progress;
            if (hazardAt(x, y, atTime)) return 100;
          }
          return landingDanger;
        }


        function forecastRouteScore(frog, startX, startY, startTime, previousDirection) {
          if (startX < 0.25 || startX > COLS - 0.25) return -100;
          let beam = [{
            x: startX,
            y: startY,
            atTime: startTime,
            score: 0,
            previousDirection
          }];

          for (let depth = 0; depth < ROUTE_DEPTH; depth += 1) {
            const branches = [];
            beam.forEach((state) => {
              moveOptions.forEach((move, index) => {
                const result = forecastMove(frog, state, move, depth, index);
                if (result) branches.push(result);
              });
            });
            if (!branches.length) return -100;
            branches.sort((a, b) => b.score - a.score);
            beam = branches.slice(0, ROUTE_BEAM_WIDTH);
          }

          return beam.length ? beam[0].score : -100;
        }


        function forecastMove(frog, state, move, depth, moveIndex) {
          const currentLane = getLane(Math.round(state.y));
          const duration = move.direction === 'wait' ? 0.12 : HOP_TIME;
          const arrival = state.atTime + duration;
          const { x: targetX, y: targetY } = movementTarget(frog, state.x, state.y, move, depth + 1);

          if (targetX < 0.25 || targetX > COLS - 0.25) return null;
          if (targetY < (frog.heading > 0 ? 0 : exitWorldY(-1)) || targetY > (frog.heading > 0 ? exitWorldY() : ROWS - 1)) return null;

          if (move.direction === 'wait') {
            if (positionDanger(state.x, state.y, state.atTime, duration) >= 100) return null;
          } else {
            const steps = Math.max(3, Math.ceil(duration / 0.03));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const sampleX = lerp(state.x, targetX, progress);
              const sampleY = hopY(state.y, targetY, progress);
              const sampleTime = state.atTime + duration * progress;
              if (hazardAt(sampleX, sampleY, sampleTime)) return null;
            }
          }

          const targetLane = getLane(Math.round(targetY));
          const reaction = targetLane.type === 'grass' ? 0.2 : 0.045;
          const danger = positionDanger(targetX, targetY, arrival, reaction);
          if (danger >= 100) return null;

          const nextTime = arrival + reaction;

          let localScore = move.dy === frog.heading
            ? 12
            : move.dy === -frog.heading ? -10 : move.direction === 'wait' ? -0.8 : 1.1;
          localScore -= danger * 1.8;
          localScore += shoreApproachScore(frog, state.x, state.y, targetX, targetY);
          if (targetLane.type === 'grass') localScore += 1.2;
          if (targetX < 0.8 || targetX > COLS - 0.8) localScore -= 5;
          if (isReverseMove(state.previousDirection, move.direction)) localScore -= 3.5;
          if (move.direction === 'wait' && currentLane.type !== 'grass') localScore -= 2.5;
          localScore += hash(
            streamSeed + frog.id * 8191 + depth * 1193 + moveIndex * 379 +
            Math.round(targetX * 31) + Math.round(targetY * 101)
          ) * 0.12;

          return {
            x: targetX,
            y: targetY,
            atTime: nextTime,
            score: state.score + localScore * Math.pow(0.78, depth),
            previousDirection: move.direction
          };
        }

        function isReverseMove(previous, next) {
          const a = moveOptions.find(move => move.direction === previous);
          const b = moveOptions.find(move => move.direction === next);
          return !!a && !!b && a.dx * b.dx + a.dy * b.dy < -0.4;
        }

        function laneDanger(lane, x, atTime, duration = 0.12) {
          if (lane.type !== 'road') {
            return 0;
          }

          // Longitudinal spacing remains constant while lateral steering responds
          // to frogs. The center-line overview uses the exact swept interval.
          const clearance = trafficClearance(lane, x, atTime, duration);
          if (clearance < FROG_HIT_RADIUS) return 100;
          return clearance < 0.72 ? (0.72 - clearance) * 10 : 0;
        }

        function beginHop(frog, direction, planned = null) {
          const move = moveOptions.find(move => move.direction === direction);
          const target = planned || movementTarget(frog, frog.x, frog.y, move);
          frog.decision += 1;

          if (direction === 'wait') {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.1 + brainRandom(frog, 91) * 0.13;
            return;
          }

          const targetX = target.x, targetY = target.y;
          frog.waitStreak = 0;
          frog.fromX = frog.x;
          frog.fromY = frog.y;
          frog.toX = targetX;
          frog.toY = targetY;
          frog.facingAngle = Math.atan2((targetX - frog.x) * tile, worldToScreenY(frog.y) - worldToScreenY(targetY));
          frog.nextMoveAt = Infinity;

          if (reducedMotion.matches) {
            const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const hazard = hazardAt(
                lerp(frog.fromX, frog.toX, progress),
                hopY(frog.fromY, frog.toY, progress),
                elapsed + HOP_TIME * progress
              );
              if (hazard) {
                frog.x = lerp(frog.fromX, frog.toX, progress);
                frog.y = hopY(frog.fromY, frog.toY, progress);
                killFrog(frog, hazard);
                return;
              }
            }
            frog.hop = 1;
            frog.x = frog.toX;
            frog.y = frog.toY;
            checkLanding(frog);
          } else {
            frog.hop = 0;
          }
        }


        function checkLanding(frog) {
          if (!frog.alive) return;
          frog.x = frog.toX;
          frog.y = frog.toY;
          const lane = getLane(Math.round(frog.y));

          if (hazardAt(frog.x, frog.y, elapsed)) {
            killFrog(frog, 'traffic');
            return;
          }

          completeCrossing(frog);

          const urgency = lane.type === 'grass' ? 0.24 : 0.035;
          const variation = lane.type === 'grass' ? 0.3 : 0.045;
          frog.nextMoveAt = elapsed + urgency + brainRandom(frog, 117) * variation;
        }

        function crossingX(frog) {
          return clamp(frog.crossingU * COLS, 0.25, COLS - 0.25);
        }

        function destinationY(frog) {
          return frog.crossed ? exitWorldY(frog.heading) : fieldRows + frog.heading * 0.85;
        }

        function shoreApproachScore(frog, x, y, nextX, nextY) {
          // Each attempt aims for a nearby point across this one lane.
          const targetX = crossingX(frog), targetY = destinationY(frog);
          const before = Math.hypot((targetX - x) * 0.7, (worldToScreenY(targetY) - worldToScreenY(y)) / tile);
          const after = Math.hypot((targetX - nextX) * 0.7, (worldToScreenY(targetY) - worldToScreenY(nextY)) / tile);
          return (before - after) * 7;
        }

        function completeCrossing(frog) {
          if (!frog.alive) return;
          if (!frog.crossed && frog.heading * (frog.y - (fieldRows + frog.heading * 0.85)) >= -1e-6) {
            frog.crossed = true;
            frog.crossings = 1;
            totalCrossings++;
            frog.crossingU = frog.x / COLS;
          }
          const beyondEdge = frog.heading > 0 ? worldToScreenY(frog.y) <= -tile * 0.6 :
            worldToScreenY(frog.y) >= height + tile * 0.6;
          if (frog.crossed && beyondEdge) {
            frog.finished = true;
            frog.alive = false;
            totalExited++;
          }
        }

        function killFrog(frog, kind) {
          if (!frog.alive) return;
          frog.alive = false;
          frog.deathAt = elapsed;
          frog.deathKind = kind;
          frog.deathPhase = frog.hop < 1 ? 'hop' : 'ground';
          addDeathMark(frog);

          totalDeaths++;

        function vehicleProfile(lane, id) {

        function laneObjectsAt(lane, atTime, duration = 0) {

          const maximumTravelTime = (COLS + maximumLength + TRAFFIC_GAP) / TRAFFIC_MIN_SPEED;

        function steeringLimit(vehicle) {

        function vehicleSteeringAt(lane, vehicle, atTime) {

          if (!state) return { offset: 0, angle: 0 };

          const speed = vehicle.speed * Math.tan(MAX_STEERING_ANGLE);

        function polyPath(points, dx = 0, dy = 0, scale = 1) {

          const shoulderBottom = terrainTypeAt(lane.row + 1) === 'grass';

          ctx.rotate(vehicle.angle || 0);

        function drawDeathMarks() {

            ctx.lineTo(x + radius, y + radius);
            ctx.moveTo(x - radius, y + radius);
            ctx.lineTo(x + radius, y - radius);

          ctx.restore();

        }

        function brainRandom(frog, salt) {
          return hash(streamSeed + frog.id * 8191 + frog.decision * 131 + salt * 977);
        }

        function hash(value) {
          let x = (Number(value) || 0) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
        }

        function hashString(value) {
          let result = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            result ^= value.charCodeAt(i);
            result = Math.imul(result, 16777619);
          }
          return result >>> 0;
        }

        function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        window.__manyFrogs = {
          restart: startRound,
          getState: () => ({
            initialFrogs,
            remaining: initialFrogs - totalDeaths,
            totalDeaths,
            totalCrossings,
            totalExited,
            live: frogs.filter((frog) => frog.alive).length,
            columns: COLS,
            rows: ROWS,
            fieldRows,
            roadRows,
            roadHeightFraction: ROAD_FRACTION,
            exitY: exitWorldY(),
            bottomExitY: exitWorldY(-1),
            vehicles: laneObjectsAt(getLane(fieldRows), elapsed).filter(car => car.x < COLS && car.x + car.length > 0).map(car => ({ id: car.id, x: car.x, length: car.length, height: car.height, speed: car.speed, offset: car.offset, angle: car.angle })),
            topFrogY: frogs.filter((frog) => frog.alive).reduce((top, frog) => Math.max(top, frog.y), -1),
            totalFrogs: nextFrogId,
            deathMarks: deathMarks.length,
            frogs: frogs.map((frog) => ({
              id: frog.id,
              alive: frog.alive,
              age: frog.age,
              maturity: frog.maturity,
              color: frog.color,
              x: frog.x,
              y: frog.y,
              decisions: frog.decision,
              waitStreak: frog.waitStreak,
              heading: frog.heading,
              crossings: frog.crossings,
              bodyScale: frogBodyScale(frog),
              crossed: frog.crossed,
              finished: frog.finished,
              crossingX: crossingX(frog),
              destinationY: destinationY(frog),
              facingAngle: frog.facingAngle,
              deathKind: frog.deathKind,
              deathPhase: frog.deathPhase
            }))
          }),
          eliminateAll: () => frogs.filter((frog) => frog.alive).forEach((frog) => killFrog(frog, 'traffic'))
        };
      })();
