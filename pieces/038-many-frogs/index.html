<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Autonomous frogs cross a wide endless course of cars, bicycles, trains, rivers, mowers, watercolor bloodstains, and multiplying flies." />
    <link rel="icon" href="data:," />
    <title>Many Frogs · HyperGal</title>
    <style>
      :root { color-scheme: dark; --void: #171b18; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--void);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; background: var(--void);
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>
    <script>
      (() => {
        'use strict';

        const FROG_COUNT = 12;
        const COLS = 21;
        const HOP_TIME = 0.18;
        const OPENING_HOLD = 0.68;
        const RETURN_PAUSE = 1.15;
        const RETURN_DURATION = 2.8;
        const HAZARD_COLLISION_Y = 0.58;
        const FROG_HIT_RADIUS = 0.24;
        const FROG_CLEARANCE = 0.52;
        const FLY_HIT_RADIUS = 0.38;
        const BIKE_HIT_RADIUS = 0.16;
        const GATOR_HEAD_FRACTION = 0.82;
        const ROUTE_DEPTH = 3;
        const ROUTE_BEAM_WIDTH = 7;
        const TAU = Math.PI * 2;
        const COURSE_SEED = hashString('many-frogs-038-course');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d', { alpha: false });

        const palette = {
          void: '#171b18', verge: '#292e28',
          grassA: '#3b4038', grassB: '#3e4239', grassLine: '#747768',
          road: '#53554a', roadEdge: '#92907d', roadMark: '#b5b09a',
          bikeLane: '#414b40', bikeEdge: '#7d8770', bikeMark: '#929d80',
          bikeFrame: '#b0b3a0', bikeRider: '#222b24',
          railBed: '#30352e', railTie: '#565b4c', railSteel: '#999986',
          railSignal: '#b65c40', train: '#a3a18e', trainLight: '#c0bca5',
          water: '#686f62', waterLine: '#a3ab97',
          log: '#303e32', logLight: '#7e8a72',
          gator: '#25392d', gatorLight: '#71876b', gatorEye: '#a0a683',
          rock: '#777968', rockLight: '#a1a18a',
          mower: '#969986', mowerLight: '#b6b59c',
          flyWing: '#cac4a8', flyBody: '#202a22', ink: '#d0c7aa', tire: '#242b25'
        };

        // A narrow natural-pigment palette: madder and oxide carry the field,
        // with quieter plum notes. Each frog stays identifiable without reading
        // as one stop in a literal rainbow.
        const frogPigments = [
          { frog: 'oklch(0.62 0.16 23)', wash: 'oklch(0.58 0.15 20)', rim: 'oklch(0.37 0.12 18)' },
          { frog: 'oklch(0.52 0.09 72)', wash: 'oklch(0.49 0.09 68)', rim: 'oklch(0.31 0.07 60)' },
          { frog: 'oklch(0.58 0.13 345)', wash: 'oklch(0.54 0.13 347)', rim: 'oklch(0.33 0.10 350)' },
          { frog: 'oklch(0.66 0.14 33)', wash: 'oklch(0.61 0.13 30)', rim: 'oklch(0.39 0.11 26)' },
          { frog: 'oklch(0.47 0.10 305)', wash: 'oklch(0.45 0.10 308)', rim: 'oklch(0.28 0.08 312)' },
          { frog: 'oklch(0.65 0.12 48)', wash: 'oklch(0.60 0.12 45)', rim: 'oklch(0.38 0.10 40)' },
          { frog: 'oklch(0.62 0.10 355)', wash: 'oklch(0.58 0.10 357)', rim: 'oklch(0.37 0.08 2)' },
          { frog: 'oklch(0.50 0.13 8)',  wash: 'oklch(0.47 0.12 8)',  rim: 'oklch(0.29 0.09 5)' },
          { frog: 'oklch(0.68 0.09 77)', wash: 'oklch(0.62 0.09 72)', rim: 'oklch(0.40 0.07 64)' },
          { frog: 'oklch(0.52 0.12 325)', wash: 'oklch(0.49 0.11 328)', rim: 'oklch(0.30 0.09 332)' },
          { frog: 'oklch(0.58 0.10 60)', wash: 'oklch(0.54 0.10 56)', rim: 'oklch(0.34 0.08 50)' },
          { frog: 'oklch(0.55 0.14 18)', wash: 'oklch(0.52 0.13 16)', rim: 'oklch(0.32 0.10 14)' }
        ];

        const moveOptions = [
          { direction: 'up', dx: 0, dy: 1, base: 10 },
          { direction: 'left', dx: -1, dy: 0, base: 2 },
          { direction: 'right', dx: 1, dy: 0, base: 2 },
          { direction: 'down', dx: 0, dy: -1, base: -5 },
          { direction: 'wait', dx: 0, dy: 0, base: 0 }
        ];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let tile = 40;
        let boardLeft = 0;
        let visibleRows = 12;
        let cameraY = 0;
        let targetCameraY = 0;
        let round = 0;
        let roundSeed = 1;
        let nextRoundSeed = 0;
        let frogs = [];
        let waitingFrogs = [];
        let particles = [];
        let bloodStains = [];
        let collectedFlies = new Set();
        let nextFrogId = FROG_COUNT;
        let elapsed = 0;
        let lastTime = performance.now();
        let gameOverAt = -1;
        let gameOverCameraY = 0;
        const terrainTypes = new Map();
        const laneCache = new Map();
        const obstacleCache = new Map();
        const surfacePrints = new Map();
        let terrainGeneratedThrough = 5;
        let terrainSegmentIndex = 0;
        let running = !document.hidden;
        let frame = 0;

        resize();
        startRound();
        frame = requestAnimationFrame(loop);

        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
          if (!running && frame) {
            cancelAnimationFrame(frame);
            frame = 0;
          } else if (running && !frame) frame = requestAnimationFrame(loop);
        });

        function startRound() {
          round += 1;
          roundSeed = nextRoundSeed || hashString(`many-frogs-${round}-${Math.floor(Date.now() / 1000)}`);
          nextFrogId = FROG_COUNT;
          collectedFlies.clear();
          cameraY = 0;
          targetCameraY = 0;
          gameOverAt = -1;
          gameOverCameraY = 0;
          particles = [];
          frogs = waitingFrogs.length ? waitingFrogs : createFrogs(roundSeed, false);
          frogs.forEach((frog, index) => {
            frog.nextMoveAt = elapsed + OPENING_HOLD + index * 0.03 + hash(roundSeed + index * 613) * 0.08;
          });
          waitingFrogs = [];
          nextRoundSeed = 0;
        }

        function createFrogs(seed, waiting) {
          return Array.from({ length: FROG_COUNT }, (_, index) => {
            const margin = COLS * 0.18;
            const spread = margin + index * ((COLS - margin * 2) / (FROG_COUNT - 1));
            return createFrog(index, spread, 0, frogPigments[index], seed, waiting);
          });
        }

        function createFrog(id, x, y, pigment, seed, waiting = false) {
          return {
            id,
            x,
            y,
            fromX: x,
            fromY: y,
            toX: x,
            toY: y,
            hop: 1,
            alive: true,
            facing: 'up',
            deathAt: -1,
            deathKind: '',
            deathPhase: '',
            color: pigment.frog,
            pigment,
            decision: 0,
            waitStreak: 0,
            nextMoveAt: waiting ? Infinity : elapsed + OPENING_HOLD + id * 0.03 + hash(seed + id * 613) * 0.08,
            boldness: hash(seed + id * 1709),
            patience: hash(seed + id * 2347),
            lateralPreference: hash(seed + id * 4517) < 0.5 ? -1 : 1
          };
        }

        function loop(now) {
          const dt = Math.min(0.035, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          frame = 0;
          if (!running) return;
          update(dt);
          draw();
          frame = requestAnimationFrame(loop);
        }

        function update(dt) {
          elapsed += dt;

          frogs.forEach((frog) => {
            if (!frog.alive) return;

            if (frog.hop < 1) {
              const nextHop = Math.min(1, frog.hop + dt / HOP_TIME);
              const t = easeOutQuart(nextHop);
              const nextX = lerp(frog.fromX, frog.toX, t);
              const nextY = lerp(frog.fromY, frog.toY, t);
              if (frogSpaceBlocked(frog, nextX, nextY, elapsed, frog.fromX, frog.fromY)) {
                cancelHop(frog);
                return;
              }
              frog.hop = nextHop;
              frog.x = nextX;
              frog.y = nextY;
              const hazard = hazardAt(frog.x, frog.y, elapsed);
              if (hazard) {
                killFrog(frog, hazard);
                return;
              }
              if (frog.hop === 1) checkLanding(frog);
              return;
            }

            const lane = getLane(Math.round(frog.y));
            if (lane.type === 'river') {
              if (alligatorHeadAt(lane, frog.x, elapsed)) {
                killFrog(frog, 'gator');
                return;
              }
              const support = supportingRiverObjectAt(lane, frog.x, elapsed);
              if (!support) {
                killFrog(frog, 'splash');
                return;
              }
              frog.x += lane.speed * dt;
              frog.fromX = frog.x;
              frog.toX = frog.x;
              if (frog.x < -0.2 || frog.x > COLS + 0.2) {
                killFrog(frog, 'splash');
                return;
              }
            } else if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'traffic');
              return;
            } else if (lane.type === 'bike' && hitsBikeAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'bike');
              return;
            } else if (lane.type === 'rail' && hitsTrainAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'train');
              return;
            } else if (lane.type === 'grass' && lane.mower && hitsMowerAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'mower');
              return;
            }

            if (elapsed >= frog.nextMoveAt) chooseMove(frog);
          });

          // Work from a snapshot because collecting a fly appends three frogs.
          frogs.slice().forEach((frog) => {
            if (frog.alive) collectFlyAt(frog);
          });
          updateBloodStains(dt);

          const alive = frogs.filter((frog) => frog.alive);
          if (gameOverAt >= 0) {
            targetCameraY = 0;
            const returnAge = elapsed - gameOverAt;
            if (returnAge <= RETURN_PAUSE) {
              cameraY = gameOverCameraY;
            } else if (reducedMotion.matches) {
              cameraY = 0;
            } else {
              const progress = clamp((returnAge - RETURN_PAUSE) / RETURN_DURATION, 0, 1);
              cameraY = lerp(gameOverCameraY, 0, easeInOutCubic(progress));
            }
          } else if (alive.length) {
            const lead = Math.max(...alive.map((frog) => frog.y));
            targetCameraY = Math.max(0, lead - visibleRows * 0.72);
            cameraY = reducedMotion.matches
              ? targetCameraY
              : lerp(cameraY, targetCameraY, 1 - Math.pow(0.0008, dt));
          }

          frogs.forEach((frog) => {
            if (frog.alive && worldToScreenY(frog.y) > height + tile * 0.2) {
              killFrog(frog, 'fall');
            }
          });

          particles = particles.filter((particle) => elapsed - particle.born < particle.life);
          particles.forEach((particle) => {
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy -= 0.5 * dt;
          });

          if (gameOverAt >= 0 && elapsed - gameOverAt >= RETURN_PAUSE + RETURN_DURATION) startRound();
        }

        function chooseMove(frog) {
          if (!frog.alive || frog.hop < 1 || gameOverAt >= 0) return;

          const currentLane = getLane(Math.round(frog.y));
          const evaluated = [];

          moveOptions.forEach((choice, index) => {
            const arrival = elapsed + (choice.direction === 'wait' ? 0.11 : HOP_TIME);
            let x = frog.x + choice.dx;
            const y = Math.max(-1, frog.y + choice.dy);
            if (choice.direction === 'wait' && currentLane.type === 'river') {
              x += currentLane.speed * (arrival - elapsed);
            }
            if (x < 0.25 || x > COLS - 0.25) return;

            const lane = getLane(Math.round(y));
            const dwell = lane.type === 'road'
              ? 0.15
              : lane.type === 'bike' ? 0.12 : lane.type === 'rail' ? 0.09 : lane.type === 'river' ? 0.2 : lane.mower ? 0.18 : 0.05;
            const danger = moveDanger(frog, choice, x, y, arrival, dwell);
            const riskWeight = lerp(2.3, 1.55, frog.boldness);
            let score = choice.base - danger * riskWeight;

            if (choice.dy > 0) score += frog.boldness * 1.2;
            if (choice.dx === frog.lateralPreference) score += 0.4;
            if (choice.direction === 'wait') {
              score += currentLane.mower
                ? -4
                : currentLane.type === 'grass'
                ? 3.7 + frog.patience * 1.4
                : currentLane.type === 'river' ? 0.8 : -18;
              score -= Math.min(11, frog.waitStreak * 0.65);
            }
            if (currentLane.type !== 'grass' && choice.dy > 0) score += 2.2;
            if (choice.dy > 0 && danger < 40) score += Math.min(7, frog.waitStreak * 0.45);

            const thinkDelay = lane.mower
              ? 0.08
              : lane.type === 'grass' ? 0.28 : lane.type === 'rail' ? 0.045 : lane.type === 'bike' ? 0.06 : 0.075;
            const carriedX = lane.type === 'river' ? x + lane.speed * thinkDelay : x;
            const escapeAt = arrival + thinkDelay + HOP_TIME;
            const escapeMoves = [[0, 1], [-1, 0], [1, 0], [0, -1]];
            let escapeDanger = Infinity;

            escapeMoves.forEach(([nextDx, nextDy]) => {
              const nextX = carriedX + nextDx;
              const nextY = Math.max(-1, y + nextDy);
              if (nextX < 0.25 || nextX > COLS - 0.25) return;
              const nextLane = getLane(Math.round(nextY));
              const nextDwell = nextLane.type === 'road'
                ? 0.13
                : nextLane.type === 'bike' ? 0.1 : nextLane.type === 'rail' ? 0.08 : nextLane.type === 'river' ? 0.18 : nextLane.mower ? 0.16 : 0.04;
              escapeDanger = Math.min(
                escapeDanger,
                laneDanger(nextLane, nextX, escapeAt, nextDwell)
              );
            });

            if (escapeDanger >= 50) score -= 35;
            else score += Math.max(0, 6 - escapeDanger) * 0.55;

            const routeScore = forecastRouteScore(
              frog,
              carriedX,
              y,
              arrival + thinkDelay,
              choice.direction
            );
            if (routeScore <= -70) score -= 48;
            else score += routeScore * 0.5;

            score += brainRandom(frog, index + 1) * 0.9;
            evaluated.push({ ...choice, score, danger, escapeDanger, routeScore });
          });

          const escapeLimit = frog.waitStreak > 8 ? 101 : 60;
          const safe = evaluated.filter((choice) =>
            choice.danger < 40 && choice.escapeDanger < escapeLimit && choice.routeScore > -70);
          const pool = safe.length ? safe : evaluated;
          pool.sort((a, b) => b.score - a.score);
          beginHop(frog, pool.length ? pool[0].direction : 'wait');
        }

        function moveDanger(frog, choice, targetX, targetY, arrival, dwell) {
          if (frogSpaceBlocked(frog, targetX, targetY, arrival, frog.x, frog.y)) return 100;
          const targetLane = getLane(Math.round(targetY));
          const landingDanger = laneDanger(targetLane, targetX, arrival, dwell);
          if (choice.direction === 'wait') {
            const currentLane = getLane(Math.round(frog.y));
            return Math.max(
              landingDanger,
              laneDanger(currentLane, frog.x, elapsed, arrival - elapsed)
            );
          }
          if (landingDanger >= 100) return landingDanger;

          const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
          for (let step = 1; step <= steps; step += 1) {
            const progress = step / steps;
            const x = lerp(frog.x, targetX, progress);
            const y = lerp(frog.y, targetY, progress);
            const atTime = elapsed + HOP_TIME * progress;
            if (hazardAt(x, y, atTime)) return 100;
            if (frogSpaceBlocked(frog, x, y, atTime, frog.x, frog.y)) return 100;
          }
          return landingDanger;
        }

        function forecastRouteScore(frog, startX, startY, startTime, previousDirection) {
          if (startX < 0.25 || startX > COLS - 0.25) return -100;
          let beam = [{
            x: startX,
            y: startY,
            atTime: startTime,
            score: 0,
            previousDirection
          }];

          for (let depth = 0; depth < ROUTE_DEPTH; depth += 1) {
            const branches = [];
            beam.forEach((state) => {
              moveOptions.forEach((move, index) => {
                const result = forecastMove(frog, state, move, depth, index);
                if (result) branches.push(result);
              });
            });
            if (!branches.length) return -100;
            branches.sort((a, b) => b.score - a.score);
            beam = branches.slice(0, ROUTE_BEAM_WIDTH);
          }

          return beam.length ? beam[0].score : -100;
        }

        function forecastMove(frog, state, move, depth, moveIndex) {
          const currentLane = getLane(Math.round(state.y));
          const duration = move.direction === 'wait' ? 0.12 : HOP_TIME;
          const arrival = state.atTime + duration;
          let targetX = state.x + move.dx;
          const targetY = Math.max(-1, state.y + move.dy);

          if (move.direction === 'wait' && currentLane.type === 'river') {
            targetX += currentLane.speed * duration;
          }
          if (targetX < 0.25 || targetX > COLS - 0.25) return null;

          if (move.direction === 'wait') {
            if (laneDanger(currentLane, state.x, state.atTime, duration) >= 100) return null;
          } else {
            const steps = Math.max(3, Math.ceil(duration / 0.03));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const sampleX = lerp(state.x, targetX, progress);
              const sampleY = lerp(state.y, targetY, progress);
              const sampleTime = state.atTime + duration * progress;
              if (hazardAt(sampleX, sampleY, sampleTime)) return null;
              if (frogSpaceBlocked(frog, sampleX, sampleY, sampleTime, state.x, state.y)) return null;
            }
          }

          if (frogSpaceBlocked(frog, targetX, targetY, arrival, state.x, state.y)) return null;
          const targetLane = getLane(Math.round(targetY));
          const reaction = targetLane.mower
            ? 0.08
            : targetLane.type === 'grass'
              ? 0.2
              : targetLane.type === 'rail' ? 0.035 : targetLane.type === 'bike' ? 0.05 : targetLane.type === 'road' ? 0.045 : 0.055;
          const danger = laneDanger(targetLane, targetX, arrival, reaction);
          if (danger >= 100) return null;

          const nextTime = arrival + reaction;
          const nextX = targetLane.type === 'river'
            ? targetX + targetLane.speed * reaction
            : targetX;
          if (nextX < 0.25 || nextX > COLS - 0.25) return null;
          if (frogSpaceBlocked(frog, nextX, targetY, nextTime, state.x, state.y)) return null;

          let localScore = move.dy > 0
            ? 12
            : move.dy < 0 ? -10 : move.direction === 'wait' ? -0.8 : 1.1;
          localScore -= danger * 1.8;
          if (targetLane.type === 'grass' && !targetLane.mower) localScore += 1.2;
          if (targetLane.mower) localScore -= 1.5;
          if (nextX < 0.8 || nextX > COLS - 0.8) localScore -= 5;
          if (isReverseMove(state.previousDirection, move.direction)) localScore -= 3.5;
          if (move.direction === 'wait' && currentLane.type !== 'grass') localScore -= 2.5;
          if (move.direction === 'wait' && currentLane.mower) localScore -= 3;
          localScore += hash(
            roundSeed + frog.id * 8191 + depth * 1193 + moveIndex * 379 +
            Math.round(targetX * 31) + Math.round(targetY * 101)
          ) * 0.12;

          return {
            x: nextX,
            y: targetY,
            atTime: nextTime,
            score: state.score + localScore * Math.pow(0.78, depth),
            previousDirection: move.direction
          };
        }

        function isReverseMove(previous, next) {
          return (previous === 'up' && next === 'down') ||
            (previous === 'down' && next === 'up') ||
            (previous === 'left' && next === 'right') ||
            (previous === 'right' && next === 'left');
        }

        function frogSpaceBlocked(frog, x, y, atTime = elapsed, fromX = frog.x, fromY = frog.y) {
          return frogs.some((other) => {
            if (!other.alive || other === frog) return false;
            // A frog's reserved motion spans at most one row. River drift is horizontal.
            if (y < Math.min(other.fromY, other.y, other.toY) - FROG_CLEARANCE ||
                y > Math.max(other.fromY, other.y, other.toY) + FROG_CLEARANCE) return false;
            const predicted = predictedFrogPosition(other, atTime);
            if (frogsTooClose(x, y, predicted.x, predicted.y)) return true;

            if (other.hop < 1 && frogsTooClose(x, y, other.toX, other.toY)) return true;
            return other.hop < 1 &&
              frogsTooClose(fromX, fromY, other.toX, other.toY) &&
              frogsTooClose(x, y, other.fromX, other.fromY);
          });
        }

        function predictedFrogPosition(frog, atTime) {
          const secondsAhead = Math.max(0, atTime - elapsed);
          if (frog.hop < 1) {
            const remainingHopTime = (1 - frog.hop) * HOP_TIME;
            const futureHop = Math.min(1, frog.hop + secondsAhead / HOP_TIME);
            const progress = easeOutQuart(futureHop);
            let x = lerp(frog.fromX, frog.toX, progress);
            const y = lerp(frog.fromY, frog.toY, progress);
            if (secondsAhead > remainingHopTime) {
              const lane = getLane(Math.round(frog.toY));
              if (lane.type === 'river') x += lane.speed * (secondsAhead - remainingHopTime);
            }
            return { x, y };
          }

          const lane = getLane(Math.round(frog.y));
          return {
            x: frog.x + (lane.type === 'river' ? lane.speed * secondsAhead : 0),
            y: frog.y
          };
        }

        function frogsTooClose(ax, ay, bx, by) {
          const dx = ax - bx;
          const dy = ay - by;
          return dx * dx + dy * dy < FROG_CLEARANCE * FROG_CLEARANCE;
        }

        function cancelHop(frog) {
          frog.x = frog.fromX;
          frog.y = frog.fromY;
          frog.toX = frog.fromX;
          frog.toY = frog.fromY;
          frog.hop = 1;
          frog.waitStreak += 1;
          frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 109) * 0.1;
          const hazard = hazardAt(frog.x, frog.y, elapsed);
          if (hazard) killFrog(frog, hazard);
        }

        function laneDanger(lane, x, atTime, duration = 0.12) {
          if (lane.type === 'grass') {
            if (blockedByGrassObstacle(lane.row, x)) return 100;
            if (!lane.mower) return 0;
            let clearance = Infinity;
            const steps = Math.max(1, Math.ceil(duration / 0.035));
            for (let step = 0; step <= steps; step += 1) {
              const sampleTime = atTime + duration * (step / steps);
              if (hitsMowerAt(lane, x, sampleTime)) return 100;
              const mower = mowerObjectAt(lane, sampleTime);
              const distance = x < mower.x
                ? mower.x - x
                : x > mower.x + mower.length
                  ? x - mower.x - mower.length
                  : 0;
              clearance = Math.min(clearance, distance);
            }
            return clearance < 0.72 ? (0.72 - clearance) * 10 : 0;
          }
          if (lane.type === 'river') {
            if (alligatorHeadAt(lane, x, atTime)) return 100;
            if (!supportingRiverObjectAt(lane, x, atTime)) return 100;
            const futureX = x + lane.speed * duration;
            return futureX < 0.3 || futureX > COLS - 0.3 ? 65 : 0.15;
          }

          // Traffic has constant velocity. Its swept interval gives exact clearance
          // over the whole landing window, without allocating and sampling arrays.
          const clearance = trafficClearance(lane, x, atTime, duration);
          const radius = lane.type === 'bike' ? BIKE_HIT_RADIUS : FROG_HIT_RADIUS;
          if (clearance < radius) return 100;
          const caution = lane.type === 'rail' ? 1.8 : lane.type === 'bike' ? 0.55 : 0.72;
          const weight = lane.type === 'rail' ? 18 : lane.type === 'bike' ? 9 : 10;
          return clearance < caution ? (caution - clearance) * weight : 0;
        }

        function beginHop(frog, direction) {
          frog.decision += 1;

          if (direction === 'wait') {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.1 + brainRandom(frog, 91) * 0.13;
            return;
          }

          const vectors = {
            up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0]
          };
          const [dx, dy] = vectors[direction];
          const targetX = clamp(frog.x + dx, 0.25, COLS - 0.25);
          const targetY = Math.max(-1, frog.y + dy);
          if (frogSpaceBlocked(frog, targetX, targetY, elapsed + HOP_TIME, frog.x, frog.y)) {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 103) * 0.1;
            return;
          }

          frog.waitStreak = 0;
          frog.fromX = frog.x;
          frog.fromY = frog.y;
          frog.toX = targetX;
          frog.toY = targetY;
          frog.facing = direction;
          frog.nextMoveAt = Infinity;

          if (reducedMotion.matches) {
            const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const hazard = hazardAt(
                lerp(frog.fromX, frog.toX, progress),
                lerp(frog.fromY, frog.toY, progress),
                elapsed + HOP_TIME * progress
              );
              if (hazard) {
                frog.x = lerp(frog.fromX, frog.toX, progress);
                frog.y = lerp(frog.fromY, frog.toY, progress);
                killFrog(frog, hazard);
                return;
              }
            }
            frog.hop = 1;
            frog.x = frog.toX;
            frog.y = frog.toY;
            checkLanding(frog);
          } else {
            frog.hop = 0;
          }
        }

        function checkLanding(frog) {
          if (!frog.alive) return;
          frog.x = frog.toX;
          frog.y = frog.toY;
          if (frogSpaceBlocked(frog, frog.x, frog.y, elapsed, frog.fromX, frog.fromY)) {
            cancelHop(frog);
            return;
          }
          const lane = getLane(Math.round(frog.y));

          if (lane.type === 'grass' && blockedByGrassObstacle(lane.row, frog.x)) {
            cancelHop(frog);
            return;
          }
          if (lane.type === 'grass' && lane.mower && hitsMowerAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'mower');
            return;
          }
          if (lane.type === 'river') {
            if (alligatorHeadAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'gator');
              return;
            }
            if (!supportingRiverObjectAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'splash');
              return;
            }
          }
          if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'traffic');
            return;
          }
          if (lane.type === 'bike' && hitsBikeAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'bike');
            return;
          }
          if (lane.type === 'rail' && hitsTrainAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'train');
            return;
          }

          const urgency = lane.mower
            ? 0.045
            : lane.type === 'grass' ? 0.24 : lane.type === 'rail' ? 0.022 : lane.type === 'bike' ? 0.04 : lane.type === 'road' ? 0.035 : 0.05;
          const variation = lane.mower
            ? 0.07
            : lane.type === 'grass' ? 0.3 : lane.type === 'rail' ? 0.025 : lane.type === 'bike' ? 0.05 : lane.type === 'road' ? 0.045 : 0.07;
          frog.nextMoveAt = elapsed + urgency + brainRandom(frog, 117) * variation;
        }

        function killFrog(frog, kind) {
          if (!frog.alive) return;
          frog.alive = false;
          frog.deathAt = elapsed;
          frog.deathKind = kind;
          frog.deathPhase = kind === 'fall' ? 'bottom' : frog.hop < 1 ? 'hop' : 'ground';
          addBloodStain(frog, kind);

          if (!reducedMotion.matches && kind !== 'fall') {
            const count = kind === 'splash' ? 11 : 7;
            for (let i = 0; i < count; i += 1) {
              const angle = (i / count) * TAU + hash(i + frog.id * 31) * 0.7;
              const speed = 0.65 + hash(i * 7 + frog.id) * 1.3;
              particles.push({
                x: frog.x,
                y: frog.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                born: elapsed,
                life: 0.55 + hash(i * 19) * 0.35,
                color: kind === 'splash' ? palette.waterLine : frog.color,
                size: 0.03 + hash(i * 13) * 0.045
              });
            }
          }

          if (!frogs.some((item) => item.alive) && gameOverAt < 0) {
            gameOverAt = elapsed;
            gameOverCameraY = cameraY;
            nextRoundSeed = hashString(`many-frogs-${round + 1}-${Math.floor(Date.now() / 1000)}`);
            waitingFrogs = createFrogs(nextRoundSeed, true);
          }
        }

        function addBloodStain(frog, kind) {
          const seed = hashString(`${round}-${frog.id}-${Math.round(elapsed * 1000)}-${kind}`);
          const surface = stainSurfaceAt(frog, kind);
          const layerCount = reducedMotion.matches ? 14 : 22;
          const edgePoints = Array.from({ length: 24 }, (_, index) => {
            const angle = index / 24 * TAU;
            const radius = 0.74 + hash(seed + index * 397) * 0.34;
            return { angle, radius };
          });
          const layers = Array.from({ length: layerCount }, (_, layerIndex) => {
            const spread = 0.42 + 0.58 * (layerIndex / Math.max(1, layerCount - 1));
            return {
              alpha: 0.055 + hash(seed + layerIndex * 1291) * 0.025,
              points: edgePoints.map((point, pointIndex) => {
                const wobble = (hash(seed + layerIndex * 2137 + pointIndex * 4591) - 0.5) * 0.12;
                const radius = (point.radius + wobble) * spread;
                return {
                  x: Math.cos(point.angle) * radius * 0.39,
                  y: Math.sin(point.angle) * radius * 0.23
                };
              })
            };
          });
          const droplets = Array.from({ length: 7 + Math.floor(hash(seed + 41) * 7) }, (_, index) => ({
            angle: hash(seed + index * 97) * TAU,
            distance: 0.28 + hash(seed + index * 211) * 0.52,
            size: 0.018 + hash(seed + index * 397) * 0.052,
            bloomAt: 0.34 + hash(seed + index * 571) * 0.54
          }));
          const stipple = Array.from({ length: 18 }, (_, index) => {
            const angle = hash(seed + index * 661) * TAU;
            const distance = Math.sqrt(hash(seed + index * 881)) * 0.34;
            return {
              x: Math.cos(angle) * distance,
              y: Math.sin(angle) * distance * 0.58,
              size: 0.006 + hash(seed + index * 1069) * 0.013
            };
          });
          const scaffold = Array.from({ length: 6 }, (_, index) => {
            const angle = hash(seed + index * 1217) * TAU;
            const inner = 0.10 + hash(seed + index * 1451) * 0.12;
            const outer = 0.38 + hash(seed + index * 1693) * 0.28;
            const bend = (hash(seed + index * 1877) - 0.5) * 0.22;
            return [
              { x: Math.cos(angle) * inner, y: Math.sin(angle) * inner * 0.62 },
              { x: Math.cos(angle) * outer, y: Math.sin(angle) * inner * 0.62 + bend },
              { x: Math.cos(angle) * outer, y: Math.sin(angle) * outer * 0.62 }
            ];
          });
          bloodStains.push({
            x: frog.x,
            y: frog.y,
            frogId: frog.id,
            born: elapsed,
            pigment: frog.pigment,
            surfaceType: surface.type,
            surfaceRow: surface.row,
            opacity: 1,
            waterAge: 0,
            stretchX: 1,
            stretchY: 1,
            roadStretch: 1,
            vehicleSmears: [],
            smearedBy: new Set(),
            rotation: surface.type === 'river'
              ? (hash(seed + 17) - 0.5) * 0.16
              : hash(seed + 17) * TAU,
            scale: 0.82 + hash(seed + 29) * 0.48,
            layers,
            droplets,
            stipple,
            scaffold
          });
        }

        function stainSurfaceAt(frog, kind) {
          const expectedType = kind === 'traffic'
            ? 'road'
            : kind === 'bike'
              ? 'bike'
            : kind === 'train'
              ? 'rail'
            : kind === 'splash' || kind === 'gator'
              ? 'river'
              : kind === 'mower' ? 'grass' : null;
          const nearestRow = Math.round(frog.y);
          if (!expectedType) {
            return { type: getLane(nearestRow).type, row: nearestRow };
          }

          let bestRow = nearestRow;
          let bestDistance = Infinity;
          for (let row = Math.floor(frog.y) - 1; row <= Math.ceil(frog.y) + 1; row += 1) {
            if (getLane(row).type !== expectedType) continue;
            const distance = Math.abs(frog.y - row);
            if (distance < bestDistance) {
              bestDistance = distance;
              bestRow = row;
            }
          }
          return { type: expectedType, row: bestRow };
        }

        function updateBloodStains(dt) {
          bloodStains.forEach((stain) => {
            if (stain.surfaceType === 'river') {
              const lane = getLane(stain.surfaceRow);
              stain.waterAge += dt;
              stain.x += lane.speed * dt * 0.68;
              stain.stretchX = 1 + Math.min(2.5, stain.waterAge * 0.14);
              stain.stretchY = 1 + Math.min(0.28, stain.waterAge * 0.018);
              stain.rotation *= Math.pow(0.08, dt);
              stain.opacity = Math.exp(-stain.waterAge / 13);
              return;
            }

            if (stain.surfaceType !== 'road') return;
            if (Math.abs(stain.y - cameraY) > visibleRows + 6) return;
            const lane = getLane(stain.surfaceRow);
            if (lane.type !== 'road' || stain.smearedBy.size >= 5) return;
            laneObjectsAt(lane, elapsed).forEach((vehicle) => {
              if (stain.smearedBy.size >= 5) return;
              const contactMargin = 0.3 * stain.roadStretch;
              const touching = stain.x >= vehicle.x - contactMargin &&
                stain.x <= vehicle.x + vehicle.length + contactMargin;
              if (touching) addVehicleSmear(stain, lane, vehicle);
            });
          });

          bloodStains = bloodStains.filter((stain) =>
            stain.surfaceType !== 'river' ||
            (stain.opacity > 0.025 && stain.x > -4 && stain.x < COLS + 4)
          );
          if (bloodStains.length > 640) bloodStains.splice(0, bloodStains.length - 640);
        }

        function addVehicleSmear(stain, lane, vehicle) {
          const vehicleKey = `${lane.row}:${vehicle.id}`;
          if (stain.smearedBy.has(vehicleKey)) return;
          stain.smearedBy.add(vehicleKey);
          stain.roadStretch = Math.min(2.45, stain.roadStretch + 0.28);
          stain.rotation *= 0.52;

          const direction = Math.sign(lane.speed) || 1;
          const passIndex = stain.smearedBy.size - 1;
          const seed = hashString(`${stain.frogId}-${vehicleKey}-${passIndex}`);
          const length = 0.55 + hash(seed + 43) * 0.8 + passIndex * 0.12;
          for (let track = 0; track < 3; track += 1) {
            stain.vehicleSmears.push({
              born: elapsed,
              direction,
              length: length * (0.82 + hash(seed + track * 317) * 0.24),
              offsetY: (track - 1) * 0.1 + (hash(seed + track * 617) - 0.5) * 0.045,
              width: track === 1 ? 0.075 : 0.032 + hash(seed + track * 911) * 0.018,
              alpha: track === 1 ? 0.18 : 0.32,
              gaps: [
                0.2 + hash(seed + track * 1217) * 0.08,
                0.48 + hash(seed + track * 1451) * 0.1
              ],
              wobble: (hash(seed + track * 1693) - 0.5) * 0.055
            });
          }
        }

        function getLane(row) {
          let lane = laneCache.get(row);
          if (!lane) {
            lane = createLane(row);
            laneCache.set(row, lane);
          }
          return lane;
        }

        function createLane(row) {
          if (row < 6) {
            const mower = row === 2 || row === 4;
            return {
              type: 'grass',
              row,
              variant: hash(row * 31 + COURSE_SEED),
              mower,
              mowerLength: 1.28,
              mowerSpeed: row === 2 ? 0.92 : 0.76,
              mowerOffset: row === 2 ? 2.2 : 10.4
            };
          }
          const type = terrainTypeAt(row);
          if (type === 'grass') {
            const mower = hash(row * 4519 + COURSE_SEED * 7) < 0.18;
            return {
              type: 'grass',
              row,
              variant: hash(row * 31 + COURSE_SEED),
              mower,
              mowerLength: 1.08 + hash(row * 1877 + COURSE_SEED * 11) * 0.48,
              mowerSpeed: 0.54 + hash(row * 3571 + COURSE_SEED * 13) * 0.58,
              mowerOffset: hash(row * 3301 + COURSE_SEED * 17) * COLS * 1.8
            };
          }

          const direction = hash(row * 1181 + COURSE_SEED * 3) < 0.5 ? -1 : 1;
          const climb = Math.max(0, row) * 0.008;
          const speedBase = type === 'rail' ? 4.8 : type === 'road' ? 1.45 : type === 'bike' ? 0.88 : 0.72;
          const speedRange = type === 'rail' ? 1.8 : type === 'road' ? 1.45 : type === 'bike' ? 0.72 : 0.72;
          return {
            type,
            row,
            direction,
            speed: direction * (speedBase + Math.min(0.9, climb) + hash(row * 3571 + COURSE_SEED) * speedRange),
            length: type === 'rail'
              ? 8 + hash(row * 1877 + COURSE_SEED) * 3.5
              : type === 'road'
                ? 1.05 + hash(row * 1877 + COURSE_SEED) * 1.15
                : type === 'bike'
                  ? 0.62 + hash(row * 1877 + COURSE_SEED) * 0.22
                : 2.25 + hash(row * 2213 + COURSE_SEED) * 2.1,
            spacing: type === 'rail'
              ? 30 + hash(row * 1297 + COURSE_SEED) * 9
              : type === 'road'
                ? 5.2 + hash(row * 1297 + COURSE_SEED) * 3.0
                : type === 'bike'
                  ? 5.7 + hash(row * 1297 + COURSE_SEED) * 2.9
                : 4.8 + hash(row * 1213 + COURSE_SEED) * 2.5,
            offset: hash(row * 3301 + COURSE_SEED) * 20
          };
        }

        function terrainTypeAt(row) {
          if (row < 6) return 'grass';
          while (terrainGeneratedThrough < row) {
            const isHazardBand = terrainSegmentIndex % 2 === 0;
            const segmentSeed = COURSE_SEED + terrainSegmentIndex * 104729;
            const hazardRoll = hash(segmentSeed + 811);
            const type = !isHazardBand
              ? 'grass'
              : terrainSegmentIndex === 0
                ? 'rail'
                : hazardRoll < 0.38 ? 'road' : hazardRoll < 0.56 ? 'bike' : hazardRoll < 0.84 ? 'river' : 'rail';
            const length = isHazardBand
              ? (type === 'rail' || type === 'bike' ? 1 : 1 + Math.floor(hash(segmentSeed + 1877) * 3))
              : 2 + Math.floor(hash(segmentSeed + 3571) * 3);
            for (let index = 0; index < length; index += 1) {
              terrainGeneratedThrough += 1;
              terrainTypes.set(terrainGeneratedThrough, type);
            }
            terrainSegmentIndex += 1;
          }
          return terrainTypes.get(row);
        }

        function laneObjectsAt(lane, atTime) {
          const travel = lane.offset + lane.speed * atTime;
          const first = Math.floor((-lane.spacing - travel) / lane.spacing);
          const last = Math.ceil((COLS + lane.spacing - travel) / lane.spacing);
          const objects = [];
          for (let id = first; id <= last; id += 1) {
            objects.push({ x: travel + id * lane.spacing, length: lane.length, id });
          }
          return objects;
        }

        function riverObjectsAt(lane, atTime) {
          return laneObjectsAt(lane, atTime).map((object) => ({
            ...object,
            kind: mod(object.id + Math.abs(lane.row), 7) === 0 ? 'alligator' : 'log'
          }));
        }

        function trainObjectsAt(lane, atTime) {
          return laneObjectsAt(lane, atTime);
        }

        function bikeObjectsAt(lane, atTime) {
          return laneObjectsAt(lane, atTime);
        }

        function hitsBikeAt(lane, frogX, atTime) {
          return trafficClearance(lane, frogX, atTime, 0) < BIKE_HIT_RADIUS;
        }

        function hitsTrainAt(lane, frogX, atTime) {
          return trafficClearance(lane, frogX, atTime, 0) < FROG_HIT_RADIUS;
        }

        function riverObjectUnder(lane, x, atTime) {
          const travel = lane.offset + lane.speed * atTime;
          const id = Math.floor((x - travel) / lane.spacing);
          return { x: travel + id * lane.spacing, length: lane.length, id,
            kind: mod(id + Math.abs(lane.row), 7) === 0 ? 'alligator' : 'log' };
        }

        function supportingRiverObjectAt(lane, frogX, atTime) {
          const object = riverObjectUnder(lane, frogX, atTime);
          const low = object.kind === 'alligator' && lane.direction < 0
            ? object.x + object.length * (1 - GATOR_HEAD_FRACTION) : object.x + FROG_HIT_RADIUS;
          const high = object.kind === 'alligator' && lane.direction > 0
            ? object.x + object.length * GATOR_HEAD_FRACTION : object.x + object.length - FROG_HIT_RADIUS;
          return frogX > low && frogX < high ? object : undefined;
        }

        function alligatorHeadAt(lane, frogX, atTime) {
          const object = riverObjectUnder(lane, frogX, atTime);
          if (object.kind !== 'alligator') return false;
          return lane.direction > 0
            ? frogX >= object.x + object.length * GATOR_HEAD_FRACTION && frogX <= object.x + object.length
            : frogX >= object.x && frogX <= object.x + object.length * (1 - GATOR_HEAD_FRACTION);
        }

        function flyObjectsAt(row, atTime) {
          const lane = getLane(row);
          if (row < 1 || lane.type !== 'grass' || lane.mower) return [];
          const seed = COURSE_SEED + row * 92821;
          const count = row === 1 || row === 5
            ? 1
            : hash(seed + 17) < 0.26 ? 1 : 0;
          const flies = [];
          for (let index = 0; index < count; index += 1) {
            const id = `${row}:${index}`;
            if (collectedFlies.has(id)) continue;
            let anchorX = 0.8 + hash(seed + index * 1877) * (COLS - 1.6);
            for (let attempt = 0; attempt < 5 && blockedByGrassObstacle(row, anchorX); attempt += 1) {
              anchorX = 0.8 + mod(anchorX + 2.73, COLS - 1.6);
            }
            const phase = hash(seed + index * 2671) * TAU;
            flies.push({
              id,
              row,
              seed,
              x: anchorX + Math.sin(atTime * 3.1 + phase) * 0.12,
              y: row + Math.cos(atTime * 3.7 + phase) * 0.08
            });
          }
          return flies;
        }

        function collectFlyAt(frog) {
          const firstRow = Math.max(1, Math.floor(frog.y - FLY_HIT_RADIUS));
          const lastRow = Math.ceil(frog.y + FLY_HIT_RADIUS);
          for (let row = firstRow; row <= lastRow; row += 1) {
            const fly = flyObjectsAt(row, elapsed).find((item) => {
              const dx = frog.x - item.x;
              const dy = frog.y - item.y;
              return dx * dx + dy * dy <= FLY_HIT_RADIUS * FLY_HIT_RADIUS;
            });
            if (!fly) continue;
            collectedFlies.add(fly.id);
            spawnFrogBrood(frog, fly);
            return;
          }
        }

        function spawnFrogBrood(parent, fly) {
          const columnOffsets = Array.from({ length: (COLS - 1) * 2 + 1 }, (_, index) => {
            if (index === 0) return 0;
            const offsetIndex = index - 1;
            const distance = Math.floor(offsetIndex / 2) + 1;
            return offsetIndex % 2 === 0 ? -distance : distance;
          });
          const rowOffsets = Array.from({ length: 17 }, (_, index) => {
            if (index === 0) return 0;
            const offsetIndex = index - 1;
            const distance = Math.floor(offsetIndex / 2) + 1;
            return offsetIndex % 2 === 0 ? -distance : distance;
          });
          const candidates = [];
          rowOffsets.forEach((rowOffset) => {
            const y = fly.row + rowOffset;
            const lane = getLane(y);
            if (lane.type !== 'grass' || lane.mower) return;
            columnOffsets.forEach((offset) => candidates.push({ x: parent.x + offset, y }));
          });

          let born = 0;
          for (const candidate of candidates) {
            if (born >= 3) break;
            const { x, y } = candidate;
            if (x < 0.25 || x > COLS - 0.25) continue;
            if (blockedByGrassObstacle(y, x)) continue;
            if (frogs.some((frog) => frog.alive && frogsTooClose(x, y, frog.x, frog.y))) continue;

            const id = nextFrogId++;
            const seed = hashString(`${round}-${fly.id}-${parent.id}-${id}`);
            const child = createFrog(id, x, y, parent.pigment, seed);
            child.facing = parent.facing;
            child.nextMoveAt = elapsed + 0.2 + born * 0.08 + hash(seed + 31) * 0.08;
            frogs.push(child);
            born += 1;
          }

          if (!reducedMotion.matches) {
            for (let index = 0; index < 12; index += 1) {
              const angle = index / 12 * TAU + hash(fly.seed + index * 191) * 0.4;
              const speed = 0.35 + hash(fly.seed + index * 313) * 0.7;
              particles.push({
                x: fly.x,
                y: fly.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                born: elapsed,
                life: 0.45 + hash(fly.seed + index * 487) * 0.35,
                color: parent.color,
                size: 0.018 + hash(fly.seed + index * 619) * 0.026
              });
            }
          }
        }

        function mowerObjectAt(lane, atTime) {
          const edge = 0.42;
          const range = COLS - lane.mowerLength - edge * 2;
          const phase = mod(lane.mowerOffset + lane.mowerSpeed * atTime, range * 2);
          const movingRight = phase <= range;
          return {
            x: edge + (movingRight ? phase : range * 2 - phase),
            length: lane.mowerLength,
            direction: movingRight ? 1 : -1
          };
        }

        function hitsMowerAt(lane, frogX, atTime) {
          if (!lane.mower) return false;
          const mower = mowerObjectAt(lane, atTime);
          return frogX > mower.x - FROG_HIT_RADIUS &&
            frogX < mower.x + mower.length + FROG_HIT_RADIUS;
        }

        function grassObstacles(row) {
          if (!obstacleCache.has(row)) obstacleCache.set(row, createGrassObstacles(row));
          return obstacleCache.get(row);
        }

        function createGrassObstacles(row) {
          if (row < 6 || getLane(row).mower) return [];
          const count = hash(COURSE_SEED + row * 421) < 0.58 ? 1 : 2;
          const obstacles = [];
          for (let index = 0; index < count; index += 1) {
            const x = 0.8 + hash(COURSE_SEED + row * 1291 + index * 3571) * (COLS - 1.6);
            if (!obstacles.some((rock) => Math.abs(rock.x - x) < 1.15)) {

                x,
                scale: 0.72 + hash(COURSE_SEED + row * 1877 + index * 733) * 0.4,
                tilt: (hash(COURSE_SEED + row * 2017 + index * 977) - 0.5) * 0.5

          return obstacles;
        }

        function blockedByGrassObstacle(row, frogX) {
          return grassObstacles(row).some((rock) => Math.abs(frogX - rock.x) < 0.48 * rock.scale);
        }

        function hitsVehicleAt(lane, frogX, atTime) {
          return trafficClearance(lane, frogX, atTime, 0) < FROG_HIT_RADIUS;
        }

        function trafficClearance(lane, x, atTime, duration) {
          const travel = lane.offset + lane.speed * atTime;
          const shift = lane.speed * duration;
          const left = travel + Math.min(0, shift);
          const length = lane.length + Math.abs(shift);
          if (length >= lane.spacing) return 0;
          const phase = mod(x - left, lane.spacing);
          return phase <= length ? 0 : Math.min(phase - length, lane.spacing - phase);
        }

        function hazardAt(frogX, frogY, atTime) {
          const firstRow = Math.floor(frogY) - 1;
          const lastRow = Math.ceil(frogY) + 1;
          for (let row = firstRow; row <= lastRow; row += 1) {
            if (Math.abs(frogY - row) > HAZARD_COLLISION_Y) continue;
            const lane = getLane(row);
            if (lane.type === 'grass' && lane.mower && hitsMowerAt(lane, frogX, atTime)) return 'mower';
            if (lane.type === 'road' && hitsVehicleAt(lane, frogX, atTime)) return 'traffic';
            if (lane.type === 'bike' && hitsBikeAt(lane, frogX, atTime)) return 'bike';
            if (lane.type === 'rail' && hitsTrainAt(lane, frogX, atTime)) return 'train';
            if (lane.type === 'river' && alligatorHeadAt(lane, frogX, atTime)) return 'gator';
            if (lane.type === 'river' && !supportingRiverObjectAt(lane, frogX, atTime)) return 'splash';

        function draw() {
          ctx.fillStyle = palette.void;
          ctx.fillRect(0, 0, width, height);

          const minRow = Math.floor(cameraY - 5);
          const maxRow = Math.ceil(cameraY + visibleRows + 3);
          const rows = [];
          for (let row = minRow; row <= maxRow; row += 1) rows.push(row);
          ctx.save();
          ctx.beginPath();
          ctx.rect(boardLeft, 0, COLS * tile, height);
          ctx.clip();
          rows.forEach(drawLaneSurface);
          drawBloodStains();
          rows.forEach(drawLaneObjects);
          drawFlies(rows);
          ctx.restore();

          drawBoardEdges();
          drawParticles();
          waitingFrogs.forEach(drawFrog);
          frogs.forEach(drawFrog);
        }

        function drawLaneSurface(row) {
          const lane=getLane(row),top=worldToScreenY(row+.5);
          if(top>height || top+tile+1<0)return;
          let print=surfacePrints.get(row);
          if(!print) {
            print=document.createElement('canvas');print.width=Math.ceil(COLS*tile);print.height=Math.ceil(tile);
            const ground=print.getContext('2d');
            ground.fillStyle=lane.type==='grass'?(lane.variant>.5?palette.grassA:palette.grassB):lane.type==='road'?palette.road:lane.type==='bike'?palette.bikeLane:lane.type==='rail'?palette.railBed:palette.water;

            // Fine pits and short fibers are fixed to this terrain row, never screen noise.
            for(let i=0;i<COLS*34;i++) {

              ground.fillStyle=i%3===0?palette.ink:palette.void;

            if(surfacePrints.size>128)surfacePrints.delete(surfacePrints.keys().next().value);
          }
          ctx.drawImage(print,boardLeft,top,COLS*tile,tile+1);
          if(lane.type==='road')drawRoadSurface(top);
          else if(lane.type==='bike')drawBikeSurface(lane,top);
          else if(lane.type==='rail')drawRailSurface(lane,top);
          else if(lane.type==='river')drawRiverSurface(lane,top);
        }

        function drawLaneObjects(row) {
          const lane = getLane(row);
          const top = worldToScreenY(row + 0.5);
          if (top > height || top + tile + 1 < 0) return;
          if (lane.type === 'grass') {
            drawGrassObstacles(row, top);
            if (lane.mower) drawMower(lane, top);
          }
          else if (lane.type === 'road') drawVehicles(lane, top);
          else if (lane.type === 'bike') drawBikes(lane, top);

        function printedShape(points, fill, edge = null) {

        function drawGrassObstacles(row, top) {

        function drawMower(lane, top) {

        function drawFlies(rows) {

        }

        function drawRoadSurface(top) {
          ctx.fillStyle = palette.roadEdge;

        }

        function drawBikeSurface(lane, top) {
          ctx.strokeStyle = palette.bikeEdge; ctx.lineWidth = .6; ctx.globalAlpha = .35;

        }

        function drawRailSurface(lane, top) {

          ctx.moveTo(boardLeft, top + tile * 0.28);
          ctx.lineTo(boardLeft + COLS * tile, top + tile * 0.28);
          ctx.moveTo(boardLeft, top + tile * 0.72);
          ctx.lineTo(boardLeft + COLS * tile, top + tile * 0.72);
          ctx.stroke();

          ctx.strokeStyle = palette.ink;
          ctx.globalAlpha = 0.28;
          ctx.lineWidth = Math.max(1, tile * 0.018);
          ctx.beginPath();
          ctx.moveTo(boardLeft, top + tile * 0.255);
          ctx.lineTo(boardLeft + COLS * tile, top + tile * 0.255);
          ctx.moveTo(boardLeft, top + tile * 0.695);
          ctx.lineTo(boardLeft + COLS * tile, top + tile * 0.695);

          ctx.fillStyle = palette.railSignal;
          ctx.globalAlpha = signalAlpha;
          ctx.beginPath();
          ctx.arc(boardLeft + tile * 0.28, top + tile * 0.5, tile * 0.085, 0, TAU);

          ctx.fill();
          ctx.globalAlpha = 1;
        }

        function drawVehicles(lane, top) {
          laneObjectsAt(lane, elapsed).forEach((vehicle) => drawVehicle(lane, vehicle, top));

        function drawVehicle(lane, vehicle, top) {
          const w = vehicle.length * tile, h = tile*.27;

          ctx.fillStyle = palette.tire;

          printedShape([[-w*.2,-h*.73],[w*.14,-h*.69],[w*.21,-h*.46],[w*.2,h*.54],[-w*.19,h*.66]],palette.road);
          printedShape([[-w*.13,-h*.55],[w*.08,-h*.55],[w*.08,h*.48],[-w*.13,h*.48]],shell);

          ctx.strokeStyle=palette.ink;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(w*.4,-h*.5);ctx.lineTo(w*.4,-h*.25);ctx.moveTo(w*.4,h*.28);ctx.lineTo(w*.4,h*.53);ctx.stroke();

        }

        function drawBikes(lane, top) {
          bikeObjectsAt(lane, elapsed).forEach((bike) => drawBike(lane, bike, top));
        }

        function drawBike(lane, bike, top) {
          const w = bike.length * tile;
          ctx.save();ctx.translate(boardLeft+(bike.x+bike.length*.5)*tile,top+tile*.5);
          if(lane.direction<0)ctx.rotate(Math.PI);
          ctx.strokeStyle=palette.tire;ctx.lineWidth=1.8;
          ctx.beginPath();ctx.moveTo(-w*.5,0);ctx.lineTo(w*.5,0);ctx.stroke();
          ctx.strokeStyle=palette.bikeFrame;ctx.lineWidth=.85;
          ctx.beginPath();ctx.moveTo(-w*.38,-.5);ctx.lineTo(w*.38,-.5);ctx.moveTo(w*.25,-tile*.14);ctx.lineTo(w*.32,0);ctx.lineTo(w*.25,tile*.14);ctx.stroke();
          printedShape([[-w*.19,-tile*.11],[w*.12,-tile*.12],[w*.26,0],[w*.1,tile*.1],[-w*.24,tile*.09]],palette.bikeRider);

        }

        function drawTrains(lane, top) {
          trainObjectsAt(lane, elapsed).forEach((train) => drawTrain(lane, train, top));
        }

        function drawTrain(lane, train, top) {
          const x=boardLeft+train.x*tile,w=train.length*tile,h=tile*.62,y=top+tile*.19;

          }
        }

        function drawRiverSurface(lane, top) {

          ctx.strokeStyle=palette.waterLine;ctx.lineWidth=.65;ctx.globalAlpha=.28;ctx.beginPath();

        function drawRiverObjects(lane, top) {

            const x=boardLeft+object.x*tile,w=object.length*tile,y=top+tile*.25,h=tile*.5;
            const seed=lane.row*97+object.id*311;
            printedShape([[x,y+h*.45],[x+tile*.12,y+h*.05],[x+w*.3,y-h*.035],[x+w*.72,y+h*.08],[x+w-tile*.05,y],[x+w,y+h*.61],[x+w-tile*.14,y+h],[x+w*.53,y+h*.94],[x+tile*.1,y+h*.9]],palette.log);

          });
        }

        function drawAlligator(lane,gator,top) {
          const w=gator.length*tile,h=tile*.25;

        function drawBloodStains() {
          bloodStains.forEach(stain=>{
            const x=worldToScreenX(stain.x),y=worldToScreenY(stain.y);

            const printStage=stain.surfaceType==='river' ? Math.min(4,Math.floor(stain.waterAge/4)) : 0;

        }

        function makePigmentPrint(stain,softness=0) {

            ink.fillStyle=index%6===0?stain.pigment.frog:stain.pigment.wash;
            ink.beginPath();ink.moveTo(layer.points[0].x,layer.points[0].y);
            for(let i=1;i<layer.points.length;i++)ink.lineTo(layer.points[i].x,layer.points[i].y);
            ink.closePath();ink.fill();
          }
          const edge=stain.layers[stain.layers.length-1].points;

          }
          return print;
        }

        function drawVehicleSmears(stain, x, y, stainProgress) {
          ctx.save();
          ctx.translate(x, y);
          ctx.strokeStyle = stain.pigment.wash;
          ctx.lineCap = 'butt';
          stain.vehicleSmears.forEach((smear) => {
            const reveal = reducedMotion.matches
              ? 1
              : easeOutQuart(clamp((elapsed - smear.born) / 0.16, 0, 1));
            const ranges = [
              [0, smear.gaps[0]],
              [smear.gaps[0] + 0.07, smear.gaps[1]],
              [smear.gaps[1] + 0.08, 1]
            ];
            ctx.globalAlpha = smear.alpha * stainProgress * reveal;
            ctx.lineWidth = Math.max(1, smear.width * tile);
            ranges.forEach(([from, to], segmentIndex) => {
              const visibleTo = Math.min(to, reveal);
              if (visibleTo <= from) return;
              const fromX = smear.direction * smear.length * from * tile;
              const toX = smear.direction * smear.length * visibleTo * tile;
              const offsetY = smear.offsetY * tile;
              ctx.beginPath();
              ctx.moveTo(fromX, offsetY);
              ctx.quadraticCurveTo(
                (fromX + toX) * 0.5,
                offsetY + smear.wobble * tile * (segmentIndex % 2 ? -1 : 1),
                toX,
                offsetY + smear.wobble * tile * 0.35
              );
              ctx.stroke();
            });
          });
          ctx.restore();
        }

        function drawBoardEdges() {
          if(boardLeft<=0)return;
          ctx.fillStyle=palette.verge;
          ctx.fillRect(boardLeft-3,0,3,height);ctx.fillRect(boardLeft+COLS*tile,0,3,height);
        }

        function drawFrog(frog) {
          if(!frog.alive)return;
          const x=worldToScreenX(frog.x),y=worldToScreenY(frog.y);
          if(y < -tile || y > height+tile)return;
          const extension=!reducedMotion.matches && frog.hop<1 ? Math.sin(frog.hop*Math.PI) : 0;
          const size=tile*.39, asymmetry=(hash(frog.id*117+33)-.5)*.12;
          ctx.save();ctx.translate(x,y);
          ctx.rotate({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[frog.facing]);
          ctx.scale(size,size);
          // Folded hind limbs open along the hop, the body stays on its surface.
          ctx.strokeStyle=frog.color;ctx.lineWidth=.13;ctx.lineCap='butt';ctx.lineJoin='miter';
          ctx.beginPath();
          for(const side of [-1,1]) {
            const skew=side===1 ? asymmetry : 0;
            ctx.moveTo(side*.18,.17);ctx.lineTo(side*(.5-extension*.12),.38+skew);
            ctx.lineTo(side*(.34+extension*.1),-.03+extension*.87+skew);
            ctx.lineTo(side*(.6-extension*.13),.24+extension*.7+skew);
            ctx.moveTo(side*.2,-.26);ctx.lineTo(side*.39,-.12);ctx.lineTo(side*.51,-.39+extension*.14);
          }
          ctx.stroke();
          printedShape([[-.18,.35],[-.29,.08],[-.25,-.35],[-.17,-.56],[.15,-.61],[.28,-.34],[.25,.09],[.13,.38]],frog.color);
          ctx.strokeStyle=frog.pigment.rim;ctx.lineWidth=.045;ctx.beginPath();ctx.moveTo(-.06,.22);ctx.lineTo(.015,-.37);ctx.moveTo(-.15,-.09);ctx.lineTo(-.18,-.3);ctx.moveTo(.13,-.14);ctx.lineTo(.17,-.35);ctx.stroke();
          ctx.fillStyle=palette.tire;ctx.fillRect(-.24,-.43,.065,.085);ctx.fillRect(.17,-.45,.06,.085);
          ctx.strokeStyle=frog.color;ctx.lineWidth=.035;ctx.beginPath();
          for(const side of [-1,1]) {const fx=side*(.6-extension*.13),fy=.24+extension*.7+(side===1?asymmetry:0);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.1,fy+.09);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.12,fy-.025);}
          ctx.stroke();ctx.restore();
        }

        function drawParticles() {
          particles.forEach((particle) => {
            const age = elapsed - particle.born;
            ctx.globalAlpha = Math.max(0, 1 - age / particle.life);
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(
              worldToScreenX(particle.x), worldToScreenY(particle.y),
              particle.size * tile, 0, TAU
            );
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }

        function resize() {
          width = Math.max(300, window.innerWidth);
          height = Math.max(420, window.innerHeight);
          dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          tile = clamp(Math.min(40, width / COLS), 14, 40);
          boardLeft = (width - COLS * tile) / 2;
          visibleRows = height / tile;
          surfacePrints.clear();
        }

        function worldToScreenX(x) { return boardLeft + x * tile; }
        function worldToScreenY(y) { return height - tile * 0.72 - (y - cameraY) * tile; }

        function roundedRect(x, y, w, h, radius) {
          const r = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, r);
        }

        function brainRandom(frog, salt) {
          return hash(roundSeed + frog.id * 8191 + frog.decision * 131 + salt * 977);
        }

        function hash(value) {
          let x = (Number(value) || 0) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
        }

        function hashString(value) {
          let result = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            result ^= value.charCodeAt(i);
            result = Math.imul(result, 16777619);
          }
          return result >>> 0;
        }

        function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        window.__manyFrogs = {
          restart: startRound,
          getState: () => ({
            round,
            live: frogs.filter((frog) => frog.alive).length,
            cameraY,
            columns: COLS,
            visibleRows,
            topFrogY: frogs.filter((frog) => frog.alive).reduce((top, frog) => Math.max(top, frog.y), -1),
            gameOver: gameOverAt >= 0,
            waiting: waitingFrogs.length,
            totalFrogs: frogs.length,
            fliesCollected: collectedFlies.size,
            bloodStains: bloodStains.length,
            frogs: frogs.map((frog) => ({
              id: frog.id,
              alive: frog.alive,
              x: frog.x,
              y: frog.y,
              decisions: frog.decision,
              waitStreak: frog.waitStreak,
              deathKind: frog.deathKind,
              deathPhase: frog.deathPhase
            }))
          }),
          eliminateAll: () => frogs.filter((frog) => frog.alive).forEach((frog) => killFrog(frog, 'traffic'))
        };
      })();
    </script>
  </body>
