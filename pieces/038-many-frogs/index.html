<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Autonomous frogs trace pigment paths across a ghost-white highway. Survival deepens their color and enlarges their death splashes; each completed crossing grows the frog." />
    <link rel="icon" href="data:," />
    <title>Many Frogs · Hypermedia Club</title>
    <style>
      :root { color-scheme: light; --void: #dadbd4; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--void);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; background: var(--void);
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="game" role="img" aria-label="Autonomous frogs crossing traffic, leaving paths that strengthen as they survive. Older frogs grow more vivid and leave larger death splashes. Frogs start small and grow with each completed crossing. Cars remain pale and leave the pigment undisturbed. New frogs enter continuously, and survivors shift columns between crossings."></canvas>
    <script>
      (() => {
        'use strict';

        // One fixed screen: a field along the bottom, a field along the top, and
        // a road band between them that takes 80% of the height. Frogs shuttle
        // across it, turn around at the far field, and shuttle back.
        const TILE = 22;
        const FIELD_FRACTION = 0.1;
        const TURNAROUND_RADIUS = 0.32;
        const HOP_TIME = 0.18;
        const HAZARD_COLLISION_Y = 0.58;
        const FROG_HIT_RADIUS = 0.24;
        const FROG_CLEARANCE = 0.52;
        const FLY_HIT_RADIUS = 0.38;
        const ROUTE_DEPTH = 3;
        const ROUTE_BEAM_WIDTH = 7;
        const MAX_PATHS = 128;
        const MAX_PATH_POINTS = 1024;
        const TAU = Math.PI * 2;
        const COURSE_SEED = hashString('many-frogs-038-course');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d', { alpha: false });

        // The ghost field stays pale. All color belongs to frogs and the
        // paths and stationary impressions they leave behind.
        const palette = {
          void: '#dadbd4', verge: '#c6c7bf', paper: '#fdfdfb',
          shade: '#d9dad2', shadeDeep: '#c8c9c0', shadow: '#c2c3b9',
          grassA: '#f1f2ec', grassB: '#ecede6', grassLine: '#dadbd2',
          road: '#e0e1dd', roadEdge: '#cbccc4', roadMark: '#fbfbf7',
          carA: '#f7f7f4', carB: '#eff0ea', glass: '#dadddb',
          rock: '#f5f5f1', rockLight: '#fcfcf9',
          flyWing: '#fbfbf8', flyBody: '#c7c8c0', ink: '#b2b3aa'
        };

        // One camera angle and one light for the whole field: a solid keeps its
        // simulated footprint on the ground and lifts its lit face up and to
        // the right. ISO_SKEW is that lateral shift as a fraction of the rise.
        const ISO_SKEW = 0.42;
        let isoFlip = 1;

        // A narrow natural-pigment palette: madder and oxide carry the field,
        // with quieter plum notes. Each frog stays identifiable without reading
        // as one stop in a literal rainbow.
        const frogPigments = [
          { frog: 'oklch(0.62 0.16 23)', wash: 'oklch(0.58 0.15 20)', rim: 'oklch(0.37 0.12 18)' },
          { frog: 'oklch(0.52 0.09 72)', wash: 'oklch(0.49 0.09 68)', rim: 'oklch(0.31 0.07 60)' },
          { frog: 'oklch(0.58 0.13 345)', wash: 'oklch(0.54 0.13 347)', rim: 'oklch(0.33 0.10 350)' },
          { frog: 'oklch(0.66 0.14 33)', wash: 'oklch(0.61 0.13 30)', rim: 'oklch(0.39 0.11 26)' },
          { frog: 'oklch(0.47 0.10 305)', wash: 'oklch(0.45 0.10 308)', rim: 'oklch(0.28 0.08 312)' },
          { frog: 'oklch(0.65 0.12 48)', wash: 'oklch(0.60 0.12 45)', rim: 'oklch(0.38 0.10 40)' },
          { frog: 'oklch(0.62 0.10 355)', wash: 'oklch(0.58 0.10 357)', rim: 'oklch(0.37 0.08 2)' },
          { frog: 'oklch(0.50 0.13 8)',  wash: 'oklch(0.47 0.12 8)',  rim: 'oklch(0.29 0.09 5)' },
          { frog: 'oklch(0.68 0.09 77)', wash: 'oklch(0.62 0.09 72)', rim: 'oklch(0.40 0.07 64)' },
          { frog: 'oklch(0.52 0.12 325)', wash: 'oklch(0.49 0.11 328)', rim: 'oklch(0.30 0.09 332)' },
          { frog: 'oklch(0.58 0.10 60)', wash: 'oklch(0.54 0.10 56)', rim: 'oklch(0.34 0.08 50)' },
          { frog: 'oklch(0.55 0.14 18)', wash: 'oklch(0.52 0.13 16)', rim: 'oklch(0.32 0.10 14)' }
        ];

        // A frog's own heading decides which vertical move counts as forward, so
        // the same planner carries it up the board and back down again.
        const moveOptions = [
          { direction: 'up', dx: 0, dy: 1, base: 0 },
          { direction: 'left', dx: -1, dy: 0, base: 2 },
          { direction: 'right', dx: 1, dy: 0, base: 2 },
          { direction: 'down', dx: 0, dy: -1, base: 0 },
          { direction: 'wait', dx: 0, dy: 0, base: 0 }
        ];

        function moveBase(frog, choice) {
          if (choice.dy === 0) return choice.base;
          return choice.dy === frog.heading ? 10 : -5;
        }

        let width = 0;
        let height = 0;
        let dpr = 1;
        let tile = TILE;
        let boardLeft = 0;
        let boardBaseY = 0;
        let COLS = 21;
        let ROWS = 12;
        let fieldRows = 2;
        let roadRows = 8;
        let populationLimit = 32;
        let streamSeed = 1;
        let streamArrivals = 0;
        let nextArrivalAt = 0;
        let totalDeaths = 0;
        let frogs = [];
        let particles = [];
        let bloodStains = [];
        let frogPaths = [];
        let pathPrint = null;
        let pathPrintDirty = true;
        let pathPrintedAt = -Infinity;
        let collectedFlies = new Set();
        let nextFrogId = 0;
        let elapsed = 0;
        let lastTime = performance.now();
        const laneCache = new Map();
        const obstacleCache = new Map();
        const surfacePrints = new Map();
        let running = !document.hidden;
        let frame = 0;

        resize();
        startStream();
        frame = requestAnimationFrame(loop);

        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
          if (!running && frame) {
            cancelAnimationFrame(frame);
            frame = 0;
          } else if (running && !frame) frame = requestAnimationFrame(loop);
        });


        function arrivalInterval() {
          return clamp(48 / COLS, 0.9, 1.8);
        }

        function startStream() {
          frogs.forEach(frog => { if (frog.path) frog.path.alive = false; });
          frogs = [];
          particles = [];
          collectedFlies.clear();
          streamSeed = hashString(`many-frogs-stream-${Math.floor(Date.now() / 1000)}`);
          streamArrivals = 0;
          admitFrog();
          nextArrivalAt = elapsed + arrivalInterval();
        }

        function admitFrog() {
          if (frogs.filter(frog => frog.alive).length >= populationLimit) return false;
          const id = nextFrogId;
          const seed = hash(streamSeed + id * 8191);
          const start = Math.floor(mod(id * 0.61803398875 + seed, 1) * COLS);
          const frog = createFrog(id, 0.5, 0, frogPigments[id % frogPigments.length], streamSeed + id * 8191);
          for (let offset = 0; offset < COLS; offset++) {
            const x = mod(start + offset, COLS) + 0.5;
            if (frogSpaceBlocked(frog, x, 0, elapsed + HOP_TIME, x, 0)) continue;
            frog.x = frog.fromX = frog.toX = x;
            frog.turnaroundU = x / COLS;
            frogs.push(frog);
            nextFrogId++;
            streamArrivals++;
            return true;
          }
          return false;
        }

        function createFrog(id, x, y, pigment, seed) {
          return {
            id,
            x,
            y,
            fromX: x,
            fromY: y,
            toX: x,
            toY: y,
            hop: 1,
            alive: true,
            facing: 'up',
            deathAt: -1,
            deathKind: '',
            deathPhase: '',
            color: pigment.frog,
            pigment,
            basePigment: pigment,
            age: 0,
            maturity: 0,
            pigmentStep: -1,
            path: null,
            decision: 0,
            waitStreak: 0,
            heading: 1,
            crossings: 0,
            turnaroundU: x / COLS,
            repositioning: false,
            nextMoveAt: elapsed + 0.12 + hash(seed + id * 613) * 0.08,
            boldness: hash(seed + id * 1709),
            patience: hash(seed + id * 2347),
            lateralPreference: hash(seed + id * 4517) < 0.5 ? -1 : 1
          };
        }

        function loop(now) {
          const dt = Math.min(0.035, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          frame = 0;
          if (!running) return;
          update(dt);
          draw();
          frame = requestAnimationFrame(loop);
        }


        function update(dt) {
          elapsed += dt;

          frogs.forEach((frog) => {
            if (!frog.alive) return;
            ageFrog(frog, dt);
            if (!frog.path) recordFrogPath(frog);

            if (frog.hop < 1) {
              const nextHop = Math.min(1, frog.hop + dt / HOP_TIME);
              const t = easeOutQuart(nextHop);
              const nextX = lerp(frog.fromX, frog.toX, t);
              const nextY = lerp(frog.fromY, frog.toY, t);
              if (frogSpaceBlocked(frog, nextX, nextY, elapsed, frog.fromX, frog.fromY)) {
                cancelHop(frog);
                return;
              }
              frog.hop = nextHop;
              frog.x = nextX;
              frog.y = nextY;
              recordFrogPath(frog);
              const hazard = hazardAt(frog.x, frog.y, elapsed);
              if (hazard) {
                killFrog(frog, hazard);
                return;
              }
              if (frog.hop === 1) checkLanding(frog);
              return;
            }

            const lane = getLane(Math.round(frog.y));
            if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'traffic');
              return;
            }

            if (elapsed >= frog.nextMoveAt) chooseMove(frog);
          });

          // Work from a snapshot because collecting a fly appends three frogs.
          frogs.slice().forEach((frog) => {
            if (frog.alive) collectFlyAt(frog);
          });
          updateBloodStains();

          particles = particles.filter((particle) => elapsed - particle.born < particle.life);
          particles.forEach((particle) => {
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy -= 0.5 * dt;
          });

          // A clock drives admission, independently of deaths and crossings.
          frogs = frogs.filter(frog => frog.alive);
          if (elapsed >= nextArrivalAt) {
            const admitted = admitFrog();
            nextArrivalAt = elapsed + (admitted ? arrivalInterval() : 0.15);
          }
        }


        function pigmentComponents(color) {
          return color.match(/[\d.]+/g).map(Number);
        }

        function vividPigment(pigment, maturity) {
          const enrich = (color, amount) => {
            const [light, chroma, hue] = pigmentComponents(color);
            return `oklch(${light + maturity * 0.025 * amount} ${chroma * (1 + maturity * 0.85 * amount)} ${hue})`;
          };
          return { frog: enrich(pigment.frog, 1), wash: enrich(pigment.wash, 1), rim: enrich(pigment.rim, 0.4) };
        }

        function ageFrog(frog, dt) {
          frog.age += dt;
          frog.maturity = 1 - Math.exp(-frog.age / 30);
          const step = Math.floor(frog.age * 2);
          if (step === frog.pigmentStep) return;
          frog.pigmentStep = step;
          frog.pigment = vividPigment(frog.basePigment, frog.maturity);
          frog.color = frog.pigment.frog;
          if (frog.path) {
            frog.path.pigment = frog.pigment;
            frog.path.strength = frog.maturity;
            pathPrintDirty = true;
          }
        }

        function recordFrogPath(frog) {
          if (!frog.path) {
            frog.path = { points: [{ x: frog.x, y: frog.y }], pigment: frog.pigment,
              strength: frog.maturity, seed: streamSeed + frog.id * 8191, alive: true };
            frogPaths.push(frog.path);
            if (frogPaths.length > MAX_PATHS) {
              const oldest = frogPaths.findIndex(path => !path.alive);
              if (oldest >= 0) frogPaths.splice(oldest, 1);
            }
          }
          const path = frog.path, points = path.points;
          const last = points[points.length - 1], point = { x: frog.x, y: frog.y };
          if (Math.hypot(point.x - last.x, point.y - last.y) < 0.0001) return;
          const before = points[points.length - 2];
          // Extend straight strokes instead of keeping one point per frame.
          const dx = point.x - last.x, dy = point.y - last.y;
          if (before && Math.abs((last.x - before.x) * dy - (last.y - before.y) * dx) < 0.00001 &&
              (last.x - before.x) * dx + (last.y - before.y) * dy > 0) {
            points[points.length - 1] = point;
          } else points.push(point);
          if (points.length > MAX_PATH_POINTS) {
            points.splice(0, MAX_PATH_POINTS / 2);
          }
          path.samples = null;
          pathPrintDirty = true;
        }

        function chooseMove(frog) {
          if (!frog.alive || frog.hop < 1) return;

          const currentLane = getLane(Math.round(frog.y));
          const evaluated = [];

          moveOptions.forEach((choice, index) => {
            const arrival = elapsed + (choice.direction === 'wait' ? 0.11 : HOP_TIME);
            const x = moveTargetX(frog, frog.x, frog.y, choice.dx);
            const y = frog.y + choice.dy;
            if (x < 0.25 || x > COLS - 0.25) return;
            if (y < 0 || y > ROWS - 1) return;

            const lane = getLane(Math.round(y));
            const dwell = lane.type === 'road' ? 0.15 : 0.05;
            const danger = moveDanger(frog, choice, x, y, arrival, dwell);
            const riskWeight = lerp(2.3, 1.55, frog.boldness);
            let score = moveBase(frog, choice) - danger * riskWeight;
            score += shoreApproachScore(frog, frog.x, frog.y, x, y);
            const forward = choice.dy === frog.heading;

            if (forward) score += frog.boldness * 1.2;
            if (choice.dx === frog.lateralPreference) score += 0.4;
            if (choice.direction === 'wait') {
              score += currentLane.type === 'grass' ? 3.7 + frog.patience * 1.4 : -18;
              score -= Math.min(11, frog.waitStreak * 0.65);
            }
            if (currentLane.type !== 'grass' && forward) score += 2.2;
            if (forward && danger < 40) score += Math.min(7, frog.waitStreak * 0.45);

            const thinkDelay = lane.type === 'grass' ? 0.28 : 0.075;
            const escapeAt = arrival + thinkDelay + HOP_TIME;
            const escapeMoves = [[0, frog.heading], [-1, 0], [1, 0], [0, -frog.heading]];
            let escapeDanger = Infinity;

            escapeMoves.forEach(([nextDx, nextDy]) => {
              const nextX = moveTargetX(frog, x, y, nextDx);
              const nextY = y + nextDy;
              if (nextX < 0.25 || nextX > COLS - 0.25) return;
              if (nextY < 0 || nextY > ROWS - 1) return;
              const nextLane = getLane(Math.round(nextY));
              const nextDwell = nextLane.type === 'road' ? 0.13 : 0.04;
              escapeDanger = Math.min(
                escapeDanger,
                laneDanger(nextLane, nextX, escapeAt, nextDwell)
              );
            });

            if (escapeDanger >= 50) score -= 35;
            else score += Math.max(0, 6 - escapeDanger) * 0.55;

            const routeScore = forecastRouteScore(
              frog,
              x,
              y,
              arrival + thinkDelay,
              choice.direction
            );
            if (routeScore <= -70) score -= 48;
            else score += routeScore * 0.5;

            score += brainRandom(frog, index + 1) * 0.9;
            evaluated.push({ ...choice, score, danger, escapeDanger, routeScore });
          });

          const escapeLimit = frog.waitStreak > 8 ? 101 : 60;
          const safe = evaluated.filter((choice) =>
            choice.danger < 40 && choice.escapeDanger < escapeLimit && choice.routeScore > -70);
          const pool = safe.length ? safe : evaluated;
          pool.sort((a, b) => b.score - a.score);
          beginHop(frog, pool.length ? pool[0].direction : 'wait');
        }

        function moveDanger(frog, choice, targetX, targetY, arrival, dwell) {
          if (frogSpaceBlocked(frog, targetX, targetY, arrival, frog.x, frog.y)) return 100;
          const targetLane = getLane(Math.round(targetY));
          const landingDanger = laneDanger(targetLane, targetX, arrival, dwell);
          if (choice.direction === 'wait') {
            const currentLane = getLane(Math.round(frog.y));
            return Math.max(
              landingDanger,
              laneDanger(currentLane, frog.x, elapsed, arrival - elapsed)
            );
          }
          if (landingDanger >= 100) return landingDanger;

          const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
          for (let step = 1; step <= steps; step += 1) {
            const progress = step / steps;
            const x = lerp(frog.x, targetX, progress);
            const y = lerp(frog.y, targetY, progress);
            const atTime = elapsed + HOP_TIME * progress;
            if (hazardAt(x, y, atTime)) return 100;
            if (frogSpaceBlocked(frog, x, y, atTime, frog.x, frog.y)) return 100;
          }
          return landingDanger;
        }


        function forecastRouteScore(frog, startX, startY, startTime, previousDirection) {
          if (startX < 0.25 || startX > COLS - 0.25) return -100;
          let beam = [{
            x: startX,
            y: startY,
            atTime: startTime,
            score: 0,
            previousDirection
          }];

          for (let depth = 0; depth < ROUTE_DEPTH; depth += 1) {
            const branches = [];
            beam.forEach((state) => {
              moveOptions.forEach((move, index) => {
                const result = forecastMove(frog, state, move, depth, index);
                if (result) branches.push(result);
              });
            });
            if (!branches.length) return -100;
            branches.sort((a, b) => b.score - a.score);
            beam = branches.slice(0, ROUTE_BEAM_WIDTH);
          }

          return beam.length ? beam[0].score : -100;
        }


        function forecastMove(frog, state, move, depth, moveIndex) {
          const currentLane = getLane(Math.round(state.y));
          const duration = move.direction === 'wait' ? 0.12 : HOP_TIME;
          const arrival = state.atTime + duration;
          const targetX = moveTargetX(frog, state.x, state.y, move.dx);
          const targetY = state.y + move.dy;

          if (targetX < 0.25 || targetX > COLS - 0.25) return null;
          if (targetY < 0 || targetY > ROWS - 1) return null;

          if (move.direction === 'wait') {
            if (laneDanger(currentLane, state.x, state.atTime, duration) >= 100) return null;
          } else {
            const steps = Math.max(3, Math.ceil(duration / 0.03));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const sampleX = lerp(state.x, targetX, progress);
              const sampleY = lerp(state.y, targetY, progress);
              const sampleTime = state.atTime + duration * progress;
              if (hazardAt(sampleX, sampleY, sampleTime)) return null;
              if (frogSpaceBlocked(frog, sampleX, sampleY, sampleTime, state.x, state.y)) return null;
            }
          }

          if (frogSpaceBlocked(frog, targetX, targetY, arrival, state.x, state.y)) return null;
          const targetLane = getLane(Math.round(targetY));
          const reaction = targetLane.type === 'grass' ? 0.2 : 0.045;
          const danger = laneDanger(targetLane, targetX, arrival, reaction);
          if (danger >= 100) return null;

          const nextTime = arrival + reaction;
          if (frogSpaceBlocked(frog, targetX, targetY, nextTime, state.x, state.y)) return null;

          let localScore = move.dy === frog.heading
            ? 12
            : move.dy === -frog.heading ? -10 : move.direction === 'wait' ? -0.8 : 1.1;
          localScore -= danger * 1.8;
          localScore += shoreApproachScore(frog, state.x, state.y, targetX, targetY);
          if (targetLane.type === 'grass') localScore += 1.2;
          if (targetX < 0.8 || targetX > COLS - 0.8) localScore -= 5;
          if (isReverseMove(state.previousDirection, move.direction)) localScore -= 3.5;
          if (move.direction === 'wait' && currentLane.type !== 'grass') localScore -= 2.5;
          localScore += hash(
            streamSeed + frog.id * 8191 + depth * 1193 + moveIndex * 379 +
            Math.round(targetX * 31) + Math.round(targetY * 101)
          ) * 0.12;

          return {
            x: targetX,
            y: targetY,
            atTime: nextTime,
            score: state.score + localScore * Math.pow(0.78, depth),
            previousDirection: move.direction
          };
        }

        function isReverseMove(previous, next) {
          return (previous === 'up' && next === 'down') ||
            (previous === 'down' && next === 'up') ||
            (previous === 'left' && next === 'right') ||
            (previous === 'right' && next === 'left');
        }

        function frogSpaceBlocked(frog, x, y, atTime = elapsed, fromX = frog.x, fromY = frog.y) {
          return frogs.some((other) => {
            if (!other.alive || other === frog) return false;
            // A frog's reserved motion spans at most one row, so a frog on another
            // part of the board is rejected before its position is ever predicted.
            if (y < Math.min(other.fromY, other.y, other.toY) - FROG_CLEARANCE ||
                y > Math.max(other.fromY, other.y, other.toY) + FROG_CLEARANCE) return false;
            const predicted = predictedFrogPosition(other, atTime);
            if (frogsTooClose(x, y, predicted.x, predicted.y)) return true;

            if (other.hop < 1 && frogsTooClose(x, y, other.toX, other.toY)) return true;
            return other.hop < 1 &&
              frogsTooClose(fromX, fromY, other.toX, other.toY) &&
              frogsTooClose(x, y, other.fromX, other.fromY);
          });
        }

        function predictedFrogPosition(frog, atTime) {
          const secondsAhead = Math.max(0, atTime - elapsed);
          if (frog.hop < 1) {
            const remainingHopTime = (1 - frog.hop) * HOP_TIME;
            const futureHop = Math.min(1, frog.hop + secondsAhead / HOP_TIME);
            const progress = easeOutQuart(futureHop);
            let x = lerp(frog.fromX, frog.toX, progress);
            const y = lerp(frog.fromY, frog.toY, progress);
            return { x, y };
          }

          return { x: frog.x, y: frog.y };
        }

        function frogsTooClose(ax, ay, bx, by) {
          const dx = ax - bx;
          const dy = ay - by;
          return dx * dx + dy * dy < FROG_CLEARANCE * FROG_CLEARANCE;
        }

        function cancelHop(frog) {
          frog.x = frog.fromX;
          frog.y = frog.fromY;
          recordFrogPath(frog);
          frog.toX = frog.fromX;
          frog.toY = frog.fromY;
          frog.hop = 1;
          frog.waitStreak += 1;
          frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 109) * 0.1;
          const hazard = hazardAt(frog.x, frog.y, elapsed);
          if (hazard) killFrog(frog, hazard);
        }


        function laneDanger(lane, x, atTime, duration = 0.12) {
          if (lane.type !== 'road') {
            return blockedByGrassObstacle(lane.row, x) ? 100 : 0;
          }

          // Traffic has constant velocity. Its swept interval gives exact clearance
          // over the whole landing window, without allocating and sampling arrays.
          const clearance = trafficClearance(lane, x, atTime, duration);
          if (clearance < FROG_HIT_RADIUS) return 100;
          return clearance < 0.72 ? (0.72 - clearance) * 10 : 0;
        }

        function beginHop(frog, direction) {
          frog.decision += 1;

          if (direction === 'wait') {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.1 + brainRandom(frog, 91) * 0.13;
            return;
          }

          const vectors = {
            up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0]
          };
          const [dx, dy] = vectors[direction];
          const targetX = clamp(moveTargetX(frog, frog.x, frog.y, dx), 0.25, COLS - 0.25);
          const targetY = clamp(frog.y + dy, 0, ROWS - 1);
          if (frogSpaceBlocked(frog, targetX, targetY, elapsed + HOP_TIME, frog.x, frog.y)) {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 103) * 0.1;
            return;
          }

          frog.waitStreak = 0;
          frog.fromX = frog.x;
          frog.fromY = frog.y;
          frog.toX = targetX;
          frog.toY = targetY;
          frog.facing = direction;
          frog.nextMoveAt = Infinity;

          if (reducedMotion.matches) {
            const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const hazard = hazardAt(
                lerp(frog.fromX, frog.toX, progress),
                lerp(frog.fromY, frog.toY, progress),
                elapsed + HOP_TIME * progress
              );
              if (hazard) {
                frog.x = lerp(frog.fromX, frog.toX, progress);
                frog.y = lerp(frog.fromY, frog.toY, progress);
                killFrog(frog, hazard);
                return;
              }
            }
            frog.hop = 1;
            frog.x = frog.toX;
            frog.y = frog.toY;
            recordFrogPath(frog);
            checkLanding(frog);
          } else {
            frog.hop = 0;
          }
        }


        function checkLanding(frog) {
          if (!frog.alive) return;
          frog.x = frog.toX;
          frog.y = frog.toY;
          if (frogSpaceBlocked(frog, frog.x, frog.y, elapsed, frog.fromX, frog.fromY)) {
            cancelHop(frog);
            return;
          }
          const lane = getLane(Math.round(frog.y));

          if (lane.type === 'grass' && blockedByGrassObstacle(lane.row, frog.x)) {
            cancelHop(frog);
            return;
          }
          if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'traffic');
            return;
          }

          completeCrossing(frog);
          if (frog.repositioning && Math.abs(frog.x - turnaroundX(frog)) <= TURNAROUND_RADIUS) {
            frog.repositioning = false;
          }

          const urgency = lane.type === 'grass' ? 0.24 : 0.035;
          const variation = lane.type === 'grass' ? 0.3 : 0.045;
          frog.nextMoveAt = elapsed + urgency + brainRandom(frog, 117) * variation;
        }

        function turnaroundX(frog) {
          return clamp(frog.turnaroundU * COLS, 0.5, COLS - 0.5);
        }

        function onDepartureBank(frog, y) {
          return frog.heading > 0 ? y < fieldRows : y >= ROWS - fieldRows;
        }

        function moveTargetX(frog, x, y, dx) {
          const target = turnaroundX(frog);
          if (dx && frog.repositioning && onDepartureBank(frog, y) &&
              Math.sign(target - x) === dx && Math.abs(target - x) < 1) return target;
          return x + dx;
        }

        function shoreApproachScore(frog, x, y, nextX, nextY) {
          if (!frog.repositioning || !onDepartureBank(frog, y)) return 0;
          const before = Math.abs(x - turnaroundX(frog));
          if (!onDepartureBank(frog, nextY)) return before > TURNAROUND_RADIUS ? -35 : 0;
          const after = Math.abs(nextX - turnaroundX(frog));
          return (before - after) * 24 - (before > TURNAROUND_RADIUS && nextY !== y ? 12 : 0);
        }

        function completeCrossing(frog) {
          if (!frog.alive) return;
          const top = frog.heading > 0 && frog.y >= ROWS - 1;
          const bottom = frog.heading < 0 && frog.y <= 0;
          if (!top && !bottom) return;
          frog.crossings++;
          frog.heading = top ? -1 : 1;
          // Move to a distant departure column on this safe bank before the
          // next crossing, so a survivor does not retrace its previous route.
          const minimumShift = Math.max(2, COLS * 0.24);
          let target = frog.x < COLS / 2 ? COLS - 0.5 : 0.5;
          for (let attempt = 0; attempt < 12; attempt++) {
            const candidate = Math.floor(hash(streamSeed + frog.id * 8191 + frog.crossings * 1193 + attempt * 379) * COLS) + 0.5;
            if (Math.abs(candidate - frog.x) >= minimumShift) { target = candidate; break; }
          }
          frog.turnaroundU = target / COLS;
          frog.repositioning = true;
        }

        function killFrog(frog, kind) {
          if (!frog.alive) return;
          recordFrogPath(frog);
          frog.alive = false;
          frog.path.alive = false;
          frog.deathAt = elapsed;
          frog.deathKind = kind;
          frog.deathPhase = frog.hop < 1 ? 'hop' : 'ground';
          addBloodStain(frog, kind);

          if (!reducedMotion.matches) {
            const count = 7;
            for (let i = 0; i < count; i += 1) {
              const angle = (i / count) * TAU + hash(i + frog.id * 31) * 0.7;
              const speed = (0.65 + hash(i * 7 + frog.id) * 1.3) * (1 + frog.maturity * 1.8);
              particles.push({
                x: frog.x,
                y: frog.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                born: elapsed,
                life: 0.55 + hash(i * 19) * 0.35,
                color: frog.color,
                size: (0.03 + hash(i * 13) * 0.045) * (1 + frog.maturity)

            }
          }

          totalDeaths++;
        }

        function addBloodStain(frog, kind) {
          const seed = hashString(`${streamSeed}-${frog.id}-${Math.round(elapsed * 1000)}-${kind}`);
          const surface = stainSurfaceAt(frog, kind);
          const layerCount = reducedMotion.matches ? 14 : 22;
          const edgePoints = Array.from({ length: 24 }, (_, index) => {
            const angle = index / 24 * TAU;
            const radius = 0.74 + hash(seed + index * 397) * 0.34;
            return { angle, radius };
          });
          const layers = Array.from({ length: layerCount }, (_, layerIndex) => {
            const spread = 0.42 + 0.58 * (layerIndex / Math.max(1, layerCount - 1));
            return {
              alpha: 0.055 + hash(seed + layerIndex * 1291) * 0.025,
              points: edgePoints.map((point, pointIndex) => {
                const wobble = (hash(seed + layerIndex * 2137 + pointIndex * 4591) - 0.5) * 0.12;
                const radius = (point.radius + wobble) * spread;

            size: 0.018 + hash(seed + index * 397) * 0.052,
            bloomAt: 0.34 + hash(seed + index * 571) * 0.54

            const angle = hash(seed + index * 661) * TAU;

              x: Math.cos(angle) * distance,
              y: Math.sin(angle) * distance * 0.58,

            };
          });

            const angle = hash(seed + index * 1217) * TAU;

            const outer = 0.38 + hash(seed + index * 1693) * 0.28;

          });

            x: frog.x,
            y: frog.y,
            frogId: frog.id,
            born: elapsed,
            pigment: frog.pigment,
            surfaceType: surface.type,
            surfaceRow: surface.row,
            rotation: hash(seed + 17) * TAU,
            scale: (0.82 + hash(seed + 29) * 0.48) * (1 + frog.maturity * 2.8),
            layers,
            droplets,
            stipple,
            scaffold
          });
        }


        function stainSurfaceAt(frog, kind) {
          const nearestRow = clamp(Math.round(frog.y), 0, ROWS - 1);
          if (kind !== 'traffic') return { type: getLane(nearestRow).type, row: nearestRow };

          let bestRow = nearestRow;
          let bestDistance = Infinity;
          for (let row = Math.floor(frog.y) - 1; row <= Math.ceil(frog.y) + 1; row += 1) {
            if (row < 0 || row > ROWS - 1 || getLane(row).type !== 'road') continue;
            const distance = Math.abs(frog.y - row);
            if (distance < bestDistance) {
              bestDistance = distance;
              bestRow = row;
            }
          }
          return { type: 'road', row: bestRow };
        }


        function updateBloodStains() {
          // Traffic leaves the record untouched; only bound its retained history.
          if (bloodStains.length > 640) bloodStains.splice(0, bloodStains.length - 640);
        }

        function getLane(row) {
          let lane = laneCache.get(row);
          if (!lane) {
            lane = createLane(row);
            laneCache.set(row, lane);
          }
          return lane;
        }


        function createLane(row) {
          if (terrainTypeAt(row) === 'grass') {
            return { type: 'grass', row, variant: hash(row * 31 + COURSE_SEED) };
          }

          // Lanes alternate heading down the band, with the pace and the gaps
          // drawn per row so no two read as one moving block. Gaps are wide:
          // a frog has two dozen lanes to thread and needs readable windows in
          // every one of them.
          const direction = row % 2 === 0 ? 1 : -1;
          return {
            type: 'road',
            row,
            direction,
            speed: direction * (1.1 + hash(row * 3571 + COURSE_SEED) * 1.1),
            length: 1.05 + hash(row * 1877 + COURSE_SEED) * 1.15,

            offset: hash(row * 3301 + COURSE_SEED) * 20

        }


        function terrainTypeAt(row) {
          return row >= fieldRows && row < fieldRows + roadRows ? 'road' : 'grass';
        }

        function laneObjectsAt(lane, atTime) {
          const travel = lane.offset + lane.speed * atTime;
          const first = Math.floor((-lane.spacing - travel) / lane.spacing);
          const last = Math.ceil((COLS + lane.spacing - travel) / lane.spacing);
          const objects = [];
          for (let id = first; id <= last; id += 1) {
            objects.push({ x: travel + id * lane.spacing, length: lane.length, id });
          }
          return objects;
        }


        function flyObjectsAt(row, atTime) {
          if (row <= 0 || row >= ROWS - 1 || getLane(row).type !== 'grass') return [];
          const seed = COURSE_SEED + row * 92821;
          if (hash(seed + 17) >= 0.3) return [];
          const id = `${row}:0`;
          if (collectedFlies.has(id)) return [];
          let anchorX = 0.8 + hash(seed + 1877) * (COLS - 1.6);
          for (let attempt = 0; attempt < 5 && blockedByGrassObstacle(row, anchorX); attempt += 1) {
            anchorX = 0.8 + mod(anchorX + 2.73, COLS - 1.6);
          }
          const phase = hash(seed + 2671) * TAU;

            id,
            row,
            seed,
            x: anchorX + Math.sin(atTime * 3.1 + phase) * 0.12,
            y: row + Math.cos(atTime * 3.7 + phase) * 0.08
          }];
        }


        function collectFlyAt(frog) {
          const firstRow = Math.max(0, Math.floor(frog.y - FLY_HIT_RADIUS));
          const lastRow = Math.min(ROWS - 1, Math.ceil(frog.y + FLY_HIT_RADIUS));
          for (let row = firstRow; row <= lastRow; row += 1) {
            const fly = flyObjectsAt(row, elapsed).find((item) => {
              const dx = frog.x - item.x;
              const dy = frog.y - item.y;
              return dx * dx + dy * dy <= FLY_HIT_RADIUS * FLY_HIT_RADIUS;
            });
            if (!fly) continue;
            collectedFlies.add(fly.id);
            spawnFrogBrood(frog, fly);
            return;
          }
        }

        function spawnFrogBrood(parent, fly) {
          const columnOffsets = Array.from({ length: Math.min(25, (COLS - 1) * 2 + 1) }, (_, index) => {
            if (index === 0) return 0;
            const offsetIndex = index - 1;
            const distance = Math.floor(offsetIndex / 2) + 1;
            return offsetIndex % 2 === 0 ? -distance : distance;
          });
          const rowOffsets = Array.from({ length: 17 }, (_, index) => {
            if (index === 0) return 0;
            const offsetIndex = index - 1;
            const distance = Math.floor(offsetIndex / 2) + 1;
            return offsetIndex % 2 === 0 ? -distance : distance;
          });
          const candidates = [];
          rowOffsets.forEach((rowOffset) => {
            const y = fly.row + rowOffset;
            if (y < 0 || y > ROWS - 1 || getLane(y).type !== 'grass') return;
            columnOffsets.forEach((offset) => candidates.push({ x: parent.x + offset, y }));
          });

          let born = 0;
          for (const candidate of candidates) {
            if (born >= 3 || frogs.filter(frog => frog.alive).length >= populationLimit) break;
            const { x, y } = candidate;
            if (x < 0.25 || x > COLS - 0.25) continue;
            if (blockedByGrassObstacle(y, x)) continue;
            if (frogs.some((frog) => frog.alive && frogsTooClose(x, y, frog.x, frog.y))) continue;

            const id = nextFrogId++;
            const seed = hashString(`${streamSeed}-${fly.id}-${parent.id}-${id}`);
            const child = createFrog(id, x, y, parent.basePigment, seed);
            child.facing = parent.facing;
            child.heading = parent.heading;
            child.nextMoveAt = elapsed + 0.2 + born * 0.08 + hash(seed + 31) * 0.08;
            frogs.push(child);
            born += 1;
          }

          if (!reducedMotion.matches) {
            for (let index = 0; index < 12; index += 1) {
              const angle = index / 12 * TAU + hash(fly.seed + index * 191) * 0.4;
              const speed = 0.35 + hash(fly.seed + index * 313) * 0.7;
              particles.push({
                x: fly.x,
                y: fly.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                born: elapsed,
                life: 0.45 + hash(fly.seed + index * 487) * 0.35,
                color: parent.color,
                size: 0.018 + hash(fly.seed + index * 619) * 0.026
              });
            }
          }
        }

        function grassObstacles(row) {
          if (!obstacleCache.has(row)) obstacleCache.set(row, createGrassObstacles(row));
          return obstacleCache.get(row);
        }


        function createGrassObstacles(row) {
          if (row <= 0 || row >= ROWS - 1 || getLane(row).type !== 'grass') return [];
          const count = hash(COURSE_SEED + row * 421) < 0.45 ? 1 : 2;
          const obstacles = [];
          for (let index = 0; index < count; index += 1) {
            const x = 0.8 + hash(COURSE_SEED + row * 1291 + index * 3571) * (COLS - 1.6);
            if (!obstacles.some((rock) => Math.abs(rock.x - x) < 1.15)) {
              obstacles.push({
                x,
                scale: 0.72 + hash(COURSE_SEED + row * 1877 + index * 733) * 0.4,
                tilt: (hash(COURSE_SEED + row * 2017 + index * 977) - 0.5) * 0.5
              });
            }
          }
          return obstacles;
        }

        function blockedByGrassObstacle(row, frogX) {
          return grassObstacles(row).some((rock) => Math.abs(frogX - rock.x) < 0.48 * rock.scale);
        }

        function hitsVehicleAt(lane, frogX, atTime) {
          return trafficClearance(lane, frogX, atTime, 0) < FROG_HIT_RADIUS;
        }

        function trafficClearance(lane, x, atTime, duration) {
          const travel = lane.offset + lane.speed * atTime;
          const shift = lane.speed * duration;
          const left = travel + Math.min(0, shift);
          const length = lane.length + Math.abs(shift);
          if (length >= lane.spacing) return 0;
          const phase = mod(x - left, lane.spacing);
          return phase <= length ? 0 : Math.min(phase - length, lane.spacing - phase);
        }


        function hazardAt(frogX, frogY, atTime) {
          const firstRow = Math.floor(frogY) - 1;
          const lastRow = Math.ceil(frogY) + 1;
          for (let row = firstRow; row <= lastRow; row += 1) {
            if (Math.abs(frogY - row) > HAZARD_COLLISION_Y) continue;
            const lane = getLane(row);
            if (lane.type === 'road' && hitsVehicleAt(lane, frogX, atTime)) return 'traffic';
          }
          return '';
        }


        function draw() {
          ctx.fillStyle = palette.void;
          ctx.fillRect(0, 0, width, height);

          const rows = [];
          for (let row = 0; row < ROWS; row += 1) rows.push(row);
          ctx.save();
          ctx.beginPath();
          ctx.rect(boardLeft, boardBaseY - (ROWS - 0.5) * tile, COLS * tile, ROWS * tile);
          ctx.clip();
          rows.forEach(drawLaneSurface);
          drawFrogPaths();
          drawBloodStains();
          rows.forEach(drawLaneObjects);
          drawFlies(rows);
          ctx.restore();

          drawBoardEdges();
          drawParticles();
          frogs.forEach(drawFrog);
        }

        function drawFrogPaths() {
          if (!pathPrint) {
            pathPrint = document.createElement('canvas');
            pathPrint.width = canvas.width;
            pathPrint.height = canvas.height;
            pathPrintedAt = -Infinity;
          }
          // Whole routes deepen together as their owner survives. Reuse the
          // combined pigment impression between these small, paced updates.
          if (pathPrintDirty && elapsed - pathPrintedAt >= 0.1) {
            const ink = pathPrint.getContext('2d');
            ink.setTransform(dpr, 0, 0, dpr, 0, 0);
            ink.clearRect(0, 0, width, height);
            ink.lineCap = 'round';
            ink.lineJoin = 'round';
            frogPaths.forEach(path => {
              if (path.points.length < 2) return;
              const samples = path.samples || [];
              let distance = 0;
              for (let i = 1; !path.samples && i < path.points.length; i++) {
                const a = path.points[i - 1], b = path.points[i];
                const length = Math.hypot(b.x - a.x, b.y - a.y);
                if (length < 0.0001) continue;
                const steps = Math.max(1, Math.ceil(length * 5));
                const nx = -(b.y - a.y) / length, ny = -(b.x - a.x) / length;
                for (let step = 0; step <= steps; step++) {
                  const progress = Math.min(length, step * 0.2) / length;
                  const along = distance + length * progress;
                  const seed = path.seed + Math.floor(along * 17) * 197;
                  const wobble = (hash(seed) - 0.5) * tile * 0.065;
                  samples.push({ x: worldToScreenX(lerp(a.x, b.x, progress)) + nx * wobble,
                    y: worldToScreenY(lerp(a.y, b.y, progress)) + ny * wobble,
                    nx, ny, grain: hash(seed + 431), seed });
                }
                distance += length;
              }
              path.samples = samples;
              if (!samples.length) return;
              // Ragged pigment ribbons follow the actual route. Their fixed
              // variations belong to distance along the stroke, not frame time.
              const ribbon = (radius, color, alpha) => {
                ink.beginPath();
                for (const side of [1, -1]) {
                  const edge = side === 1 ? samples : [...samples].reverse();
                  edge.forEach((point, index) => {
                    const spread = radius * (0.45 + point.grain * 0.7);
                    const x = point.x + point.nx * spread * side, y = point.y + point.ny * spread * side;
                    if (side === 1 && index === 0) ink.moveTo(x, y); else ink.lineTo(x, y);
                  });
                }
                ink.closePath();
                ink.fillStyle = color;
                ink.globalAlpha = alpha;
                ink.fill();
              };
              // Young paths are barely deposited; survivors gradually build
              // enough density to give their whole route a stronger presence.
              const density = path.strength * path.strength;
              ribbon(tile * (0.13 + path.strength * 0.13), path.pigment.wash, 0.008 + density * 0.18);
              ribbon(tile * (0.045 + path.strength * 0.065), path.pigment.frog, 0.012 + density * 0.42);
              ink.strokeStyle = path.pigment.rim;
              ink.lineWidth = Math.max(0.45, tile * 0.018);
              ink.globalAlpha = 0.005 + density * 0.18;
              ink.beginPath();
              samples.forEach((point, index) => {
                const x = point.x + point.nx * tile * 0.035;
                const y = point.y + point.ny * tile * 0.035;
                if (!index || point.grain < 0.25) ink.moveTo(x, y); else ink.lineTo(x, y);
              });
              ink.stroke();
            });
            ink.setLineDash([]);
            ink.globalAlpha = 1;
            pathPrintDirty = false;
            pathPrintedAt = elapsed;
          }
          ctx.save();
          ctx.globalCompositeOperation = 'multiply';
          ctx.drawImage(pathPrint, 0, 0, width, height);
          ctx.restore();
        }

        function drawLaneSurface(row) {
          const lane=getLane(row),top=worldToScreenY(row+.5);
          if(top>height || top+tile+1<0)return;
          let print=surfacePrints.get(row);
          if(!print) {
            print=document.createElement('canvas');print.width=Math.ceil(COLS*tile);print.height=Math.ceil(tile);
            const ground=print.getContext('2d');
            ground.fillStyle=lane.type==='grass'?(lane.variant>.5?palette.grassA:palette.grassB):palette.road;
            ground.fillRect(0,0,print.width,print.height);
            // Fine pits and short fibers are fixed to this terrain row, never screen noise.
            for(let i=0;i<COLS*22;i++) {
              const seed=row*1223+i*197+COURSE_SEED;
              ground.globalAlpha=.04+hash(seed+43)*.09;
              ground.fillStyle=i%3===0?palette.ink:palette.paper;
              ground.fillRect(hash(seed)*print.width,hash(seed+73)*print.height,.45+hash(seed+91)*1.2,.4+hash(seed+131)*.6);
            }
            if(lane.type==='grass') {
              // Mown bands run the length of the lawn and line up row to row.
              ground.globalAlpha=.14;ground.fillStyle=palette.paper;
              for(let i=0;i<COLS;i+=3)ground.fillRect(i*tile*1.5,0,tile*1.5,print.height);
              ground.globalAlpha=.42;ground.strokeStyle=palette.grassLine;ground.lineWidth=.65;ground.beginPath();
              for(let i=0;i<COLS*5;i++) {
                const seed=row*1789+i*97+COURSE_SEED,x=hash(seed)*COLS*tile,y=hash(seed+91)*tile;
                ground.moveTo(x,y);ground.lineTo(x+(hash(seed+71)-.5)*tile*.24,y-tile*(.03+hash(seed+43)*.11));
              }
              ground.stroke();
              // A few clover heads per row, so no stretch of turf is blank.
              for(let i=0;i<7;i++) {
                const seed=row*2311+i*613+COURSE_SEED;
                if(hash(seed+17)<.45)continue;
                const x=hash(seed)*COLS*tile,y=tile*(.2+hash(seed+53)*.6),r=tile*(.028+hash(seed+79)*.02);
                ground.globalAlpha=.85;ground.fillStyle=palette.paper;
                for(let k=0;k<4;k++){const a=k*Math.PI/2+hash(seed+k*31)*.6;
                  ground.beginPath();ground.ellipse(x+Math.cos(a)*r,y+Math.sin(a)*r*.7,r*.7,r*.52,a,0,Math.PI*2);ground.fill();}
                ground.globalAlpha=.5;ground.fillStyle=palette.shade;
                ground.beginPath();ground.ellipse(x,y,r*.34,r*.28,0,0,Math.PI*2);ground.fill();
              }
            }
            else {
              // Two polished wheel tracks and a patched seam or two.
              ground.globalAlpha=.3;ground.fillStyle=palette.shade;
              ground.fillRect(0,print.height*.17,print.width,print.height*.13);
              ground.fillRect(0,print.height*.7,print.width,print.height*.13);
              for(let i=0;i<3;i++) {
                const seed=row*907+i*271+COURSE_SEED,x=hash(seed)*print.width;
                ground.fillRect(x,0,Math.max(1,tile*.02),print.height);
                ground.fillRect(x+tile*.035,0,Math.max(1,tile*.012),print.height);
              }
            }
            surfacePrints.set(row,print);
            if(surfacePrints.size>160)surfacePrints.delete(surfacePrints.keys().next().value);
          }
          ctx.drawImage(print,boardLeft,top,COLS*tile,tile+1);
          if(lane.type==='road')drawRoadSurface(lane,top);
        }


        function drawLaneObjects(row) {
          const lane = getLane(row);
          const top = worldToScreenY(row + 0.5);
          if (top > height || top + tile + 1 < 0) return;
          if (lane.type === 'grass') drawGrassObstacles(row, top);
          else drawVehicles(lane, top);
        }


        function polyPath(points, dx = 0, dy = 0, scale = 1) {
          ctx.beginPath();
          ctx.moveTo(points[0][0] * scale + dx, points[0][1] * scale + dy);
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0] * scale + dx, points[i][1] * scale + dy);
          ctx.closePath();
        }

        function printedShape(points, fill, edge = null) {
          polyPath(points);
          ctx.fillStyle = fill;
          ctx.fill();
          if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 0.65; ctx.stroke(); }
        }

        // A shallow isometric rise. The footprint stays exactly where the
        // simulation put the object, the walls are swept up to the raised face,
        // and a soft print falls away from the light. Returns the offset of the
        // lit face so callers can draw their detail on top of it.
        function risenShape(points, lift, topFill, sideFill, edge = null, taper = 1) {
          const dx = lift * tile * ISO_SKEW * isoFlip, dy = -lift * tile;
          ctx.globalAlpha = 0.42;
          ctx.fillStyle = palette.shadow;
          polyPath(points, tile * 0.055 * isoFlip, tile * 0.05);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = sideFill;
          polyPath(points);
          ctx.fill();
          for (let i = 0; i < points.length; i++) {
            const a = points[i], b = points[(i + 1) % points.length];
            ctx.beginPath();
            ctx.moveTo(a[0], a[1]);
            ctx.lineTo(b[0], b[1]);
            ctx.lineTo(b[0] * taper + dx, b[1] * taper + dy);
            ctx.lineTo(a[0] * taper + dx, a[1] * taper + dy);
            ctx.closePath();
            ctx.fill();
          }
          polyPath(points, dx, dy, taper);
          ctx.fillStyle = topFill;
          ctx.fill();
          if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 0.6; ctx.stroke(); }
          return [dx, dy];
        }

        function drawGrassObstacles(row, top) {
          grassObstacles(row).forEach((rock, index) => {
            const x = worldToScreenX(rock.x), y = top + tile * 0.5, r = tile * 0.36 * rock.scale;
            ctx.save(); ctx.translate(x, y); ctx.rotate(rock.tilt);
            const base = [[-r,r*.1],[-r*.62,-r*.67],[r*.12,-r*.81],[r*.79,-r*.35],[r*.91,r*.35],[r*.24,r*.69],[-r*.56,r*.57]];
            const [dx, dy] = risenShape(base, .19 * rock.scale, palette.rock, palette.shade, palette.shadeDeep, .74);
            // Facets and grit belong to the lit cap, so the boulder keeps volume.
            ctx.save(); ctx.translate(dx, dy); ctx.scale(.74, .74);
            ctx.strokeStyle = palette.shade; ctx.lineWidth = .75;
            ctx.beginPath(); ctx.moveTo(-r*.61,-r*.43); ctx.lineTo(-r*.04,-r*.22); ctx.lineTo(r*.21,r*.42);
            ctx.moveTo(-r*.04,-r*.22); ctx.lineTo(r*.57,-r*.33); ctx.stroke();
            ctx.strokeStyle = palette.rockLight; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-r*.52,-r*.5); ctx.lineTo(r*.06,-r*.66); ctx.lineTo(r*.66,-r*.34); ctx.stroke();
            ctx.restore();
            ctx.restore();
          });
        }


        function drawFlies(rows) {
          rows.forEach((row) => {
            flyObjectsAt(row, elapsed).forEach((fly) => {
              const x = worldToScreenX(fly.x);
              const y = worldToScreenY(fly.y);
              const flap = 0.55 + Math.sin(elapsed * 22 + fly.seed) * 0.22;
              ctx.save();
              ctx.translate(x, y);
              // A small print on the grass reads the fly's height over the field.
              ctx.globalAlpha = 0.38;
              ctx.fillStyle = palette.shadow;
              ctx.beginPath();
              ctx.ellipse(tile * 0.09, tile * 0.17, tile * 0.06, tile * 0.028, 0, 0, TAU);
              ctx.fill();
              ctx.globalAlpha = 1;
              ctx.translate(0, -tile * 0.11);
              ctx.rotate(Math.sin(elapsed * 4.3 + fly.seed) * 0.18);
              ctx.fillStyle = palette.flyWing;
              ctx.globalAlpha = 0.72;
              ctx.beginPath();
              ctx.ellipse(-tile * 0.075, -tile * 0.035, tile * 0.085, tile * 0.035 * flap, -0.45, 0, TAU);
              ctx.ellipse(tile * 0.075, -tile * 0.035, tile * 0.085, tile * 0.035 * flap, 0.45, 0, TAU);
              ctx.fill();
              ctx.globalAlpha = 1;
              ctx.fillStyle = palette.flyBody;
              ctx.beginPath();
              ctx.ellipse(0, 0, tile * 0.045, tile * 0.075, 0, 0, TAU);
              ctx.fill();
              ctx.fillStyle = palette.ink;
              ctx.beginPath();
              ctx.arc(-tile * 0.021, -tile * 0.055, Math.max(1, tile * 0.014), 0, TAU);
              ctx.arc(tile * 0.021, -tile * 0.055, Math.max(1, tile * 0.014), 0, TAU);
              ctx.fill();
              ctx.restore();
            });
          });
        }



        function drawRoadSurface(lane, top) {
          const shoulderTop = terrainTypeAt(lane.row - 1) === 'grass';
          const shoulderBottom = terrainTypeAt(lane.row + 1) === 'grass';
          if (shoulderTop || shoulderBottom) {
            // A shallow shoulder steps the asphalt down from the turf.
            ctx.fillStyle = palette.shade;
            ctx.globalAlpha = .75;
            if (shoulderBottom) ctx.fillRect(boardLeft, top, COLS * tile, Math.max(1, tile * .06));
            if (shoulderTop) ctx.fillRect(boardLeft, top + tile - Math.max(1, tile * .06), COLS * tile, Math.max(1, tile * .06));
          }
          ctx.globalAlpha = .45;
          ctx.fillStyle = palette.roadEdge;
          ctx.fillRect(boardLeft, top + tile - .8, COLS * tile, .8);
          // Lane paint reads the direction of travel on this row.
          ctx.fillStyle = palette.roadMark; ctx.globalAlpha = .95;
          const step = tile * 2.4, phase = mod(lane.offset * tile, step);
          for (let x = boardLeft - step + phase; x < boardLeft + COLS * tile; x += step) {
            ctx.fillRect(x, top + tile * .49, tile * .47, Math.max(.8, tile * .028));
            ctx.fillRect(x + tile * .52, top + tile * .49, tile * .1, Math.max(.6, tile * .02));
          }
          ctx.globalAlpha = 1;
        }



        function drawVehicles(lane, top) {
          laneObjectsAt(lane, elapsed).forEach((vehicle) => drawVehicle(lane, vehicle, top));
        }



        function drawVehicle(lane, vehicle, top) {
          const w = vehicle.length * tile, h = tile * 0.58;
          const x = boardLeft + (vehicle.x + vehicle.length / 2) * tile;
          if (x < -w || x > width + w) return;
          ctx.save();
          ctx.translate(x, top + tile * 0.5);
          if (lane.direction < 0) ctx.scale(-1, 1);
          // One pale body and a single window; traffic stays visually quiet.
          ctx.fillStyle = hash(lane.row * 117 + vehicle.id * 431) > 0.5 ? palette.carA : palette.carB;
          ctx.shadowColor = palette.shadow;
          ctx.shadowBlur = tile * 0.05;
          ctx.shadowOffsetY = tile * 0.04;
          polyPath([[-w * 0.48, -h * 0.5], [w * 0.35, -h * 0.5],
            [w * 0.48, -h * 0.3], [w * 0.48, h * 0.3],
            [w * 0.35, h * 0.5], [-w * 0.48, h * 0.5]]);
          ctx.fill();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = palette.glass;
          ctx.fillRect(-w * 0.12, -h * 0.32, w * 0.26, h * 0.64);
          ctx.restore();
        }

        function drawBloodStains() {
          bloodStains.forEach(stain=>{
            const x=worldToScreenX(stain.x),y=worldToScreenY(stain.y);
            if(y < -tile*2 || y > height+tile*2)return;
            const age=elapsed-stain.born;
            const progress=reducedMotion.matches ? 1 : easeOutQuart(clamp(age/1.65,0,1));
            if(!stain.print)stain.print=makePigmentPrint(stain);
            ctx.save();ctx.translate(x,y);ctx.rotate(stain.rotation);
            const bloom=.4+.6*progress;
            ctx.scale(stain.scale*bloom,stain.scale*bloom);
            ctx.globalCompositeOperation='multiply';
            ctx.globalAlpha=progress;
            ctx.drawImage(stain.print,-tile,-tile,tile*2,tile*2);
            ctx.restore();
          });
        }

        function makePigmentPrint(stain) {
          const print=document.createElement('canvas');
          print.width=print.height=128;
          const ink=print.getContext('2d');
          ink.translate(64,64);ink.scale(64,64);
          // Feathering is embedded in this small impression and scales with current.
          for(let index=stain.layers.length-1;index>=0;index--) {
            const layer=stain.layers[index];
            ink.globalAlpha=layer.alpha*1.4;
            ink.fillStyle=index%6===0?stain.pigment.frog:stain.pigment.wash;
            ink.beginPath();ink.moveTo(layer.points[0].x,layer.points[0].y);
            for(let i=1;i<layer.points.length;i++)ink.lineTo(layer.points[i].x,layer.points[i].y);
            ink.closePath();ink.fill();
          }
          const edge=stain.layers[stain.layers.length-1].points;
          ink.strokeStyle=stain.pigment.rim;ink.globalAlpha=.52;ink.lineWidth=.014;
          ink.beginPath();ink.moveTo(edge[0].x,edge[0].y);for(let i=1;i<edge.length;i++)ink.lineTo(edge[i].x,edge[i].y);ink.closePath();ink.stroke();
          ink.globalAlpha=.3;ink.lineWidth=.009;
          stain.scaffold.forEach(line=>{ink.beginPath();ink.moveTo(line[0].x,line[0].y);ink.lineTo(line[1].x,line[1].y);ink.lineTo(line[2].x,line[2].y);ink.stroke();});
          ink.fillStyle=stain.pigment.rim;ink.globalAlpha=.4;
          stain.stipple.forEach(dot=>ink.fillRect(dot.x,dot.y,Math.max(.008,dot.size),Math.max(.008,dot.size)));
          ink.fillStyle=stain.pigment.wash;ink.globalAlpha=.45;
          stain.droplets.forEach(drop=>{ink.beginPath();ink.arc(Math.cos(drop.angle)*drop.distance,Math.sin(drop.angle)*drop.distance*.72,drop.size,0,TAU);ink.fill();});
          return print;
        }

        function drawBoardEdges() {
          ctx.fillStyle=palette.verge;
          const top=boardBaseY-(ROWS-.5)*tile,bottom=boardBaseY+tile*.5;
          if(boardLeft>0){ctx.fillRect(boardLeft-2,top,2,ROWS*tile);ctx.fillRect(boardLeft+COLS*tile,top,2,ROWS*tile);}
          ctx.fillRect(boardLeft,top-2,COLS*tile,2);ctx.fillRect(boardLeft,bottom,COLS*tile,2);
        }

        function frogBodyScale(frog) {
          // Every completed crossing adds size; diminishing steps keep long-lived
          // winners legible on the same board without changing the route planner.
          return 0.24 + 0.065 * Math.sqrt(frog.crossings);
        }

        function drawFrog(frog) {
          if(!frog.alive)return;
          const x=worldToScreenX(frog.x),y=worldToScreenY(frog.y);
          if(y < -tile || y > height+tile)return;
          const extension=!reducedMotion.matches && frog.hop<1 ? Math.sin(frog.hop*Math.PI) : 0;
          const size=tile*frogBodyScale(frog), asymmetry=(hash(frog.id*117+33)-.5)*.12;
          ctx.save();ctx.translate(x,y);
          ctx.globalAlpha=.34;ctx.fillStyle=palette.shadow;
          ctx.beginPath();ctx.ellipse(size*.15,size*.18,size*.51,size*.38,0,0,TAU);ctx.fill();
          ctx.globalAlpha=1;
          ctx.rotate({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[frog.facing]);
          ctx.scale(size,size);
          // Folded hind limbs open along the hop, the body stays on its surface.
          ctx.strokeStyle=frog.color;ctx.lineWidth=.13;ctx.lineCap='butt';ctx.lineJoin='miter';
          ctx.beginPath();
          for(const side of [-1,1]) {
            const skew=side===1 ? asymmetry : 0;
            ctx.moveTo(side*.18,.17);ctx.lineTo(side*(.5-extension*.12),.38+skew);
            ctx.lineTo(side*(.34+extension*.1),-.03+extension*.87+skew);
            ctx.lineTo(side*(.6-extension*.13),.24+extension*.7+skew);
            ctx.moveTo(side*.2,-.26);ctx.lineTo(side*.39,-.12);ctx.lineTo(side*.51,-.39+extension*.14);
          }
          ctx.stroke();
          printedShape([[-.18,.35],[-.29,.08],[-.25,-.35],[-.17,-.56],[.15,-.61],[.28,-.34],[.25,.09],[.13,.38]],frog.color);
          ctx.strokeStyle=frog.pigment.rim;ctx.lineWidth=.045;ctx.beginPath();ctx.moveTo(-.06,.22);ctx.lineTo(.015,-.37);ctx.moveTo(-.15,-.09);ctx.lineTo(-.18,-.3);ctx.moveTo(.13,-.14);ctx.lineTo(.17,-.35);ctx.stroke();
          ctx.fillStyle=frog.pigment.rim;ctx.fillRect(-.24,-.43,.065,.085);ctx.fillRect(.17,-.45,.06,.085);
          ctx.strokeStyle=frog.color;ctx.lineWidth=.035;ctx.beginPath();
          for(const side of [-1,1]) {const fx=side*(.6-extension*.13),fy=.24+extension*.7+(side===1?asymmetry:0);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.1,fy+.09);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.12,fy-.025);}
          ctx.stroke();ctx.restore();
        }

        function drawParticles() {
          particles.forEach((particle) => {
            const age = elapsed - particle.born;
            ctx.globalAlpha = Math.max(0, 1 - age / particle.life);
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(
              worldToScreenX(particle.x), worldToScreenY(particle.y),
              particle.size * tile, 0, TAU
            );
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }


        function resize() {
          const previousCols = COLS, previousRows = ROWS;
          const previousFieldRows = fieldRows, previousRoadRows = roadRows;
          width = Math.max(300, window.innerWidth);
          height = Math.max(1, window.innerHeight);
          dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Ten-row groups keep the fields at 10% each and the road at exactly
          // 80% of viewport height, with tiles still close to 22 CSS pixels.
          ROWS = Math.max(20, Math.round(height / TILE / 10) * 10);
          tile = height / ROWS;
          COLS = Math.max(9, Math.floor(width / tile));
          fieldRows = Math.round(ROWS * FIELD_FRACTION);
          roadRows = ROWS - fieldRows * 2;
          populationLimit = clamp(Math.round(COLS * 1.2), 24, 80);
          boardLeft = (width - COLS * tile) / 2;
          boardBaseY = (height + ROWS * tile) / 2 - tile * 0.5;

          // Terrain, obstacles, and impressions are all keyed to the board size.
          laneCache.clear();
          obstacleCache.clear();
          surfacePrints.clear();
          pathPrint = null;
          pathPrintDirty = true;
          frogPaths.forEach(path => {
            path.samples = null;
            path.points.forEach(point => {
              point.x *= COLS / previousCols;
              point.y *= (ROWS - 1) / (previousRows - 1);
            });
          });
          frogs.forEach((frog) => {
            frog.x = clamp(frog.x * COLS / previousCols, 0.25, COLS - 0.25);
            frog.y = clamp(Math.round(frog.y * (ROWS - 1) / (previousRows - 1)), 0, ROWS - 1);
            frog.fromX = frog.toX = frog.x;
            frog.fromY = frog.toY = frog.y;
            frog.hop = 1;
            frog.nextMoveAt = Math.min(frog.nextMoveAt, elapsed + 0.12);
          });
          bloodStains.forEach(stain => {
            stain.x *= COLS / previousCols;
            if (stain.surfaceType === 'road') {
              const withinLane = stain.y - stain.surfaceRow;
              stain.surfaceRow = fieldRows + clamp(Math.floor(
                (stain.surfaceRow - previousFieldRows) / previousRoadRows * roadRows
              ), 0, roadRows - 1);
              stain.y = stain.surfaceRow + withinLane;
            } else {
              stain.y *= (ROWS - 1) / (previousRows - 1);
              stain.surfaceRow = Math.round(stain.y);
            }
          });
        }

        function worldToScreenX(x) { return boardLeft + x * tile; }
        function worldToScreenY(y) { return boardBaseY - y * tile; }

        function brainRandom(frog, salt) {
          return hash(streamSeed + frog.id * 8191 + frog.decision * 131 + salt * 977);
        }

        function hash(value) {
          let x = (Number(value) || 0) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
        }

        function hashString(value) {
          let result = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            result ^= value.charCodeAt(i);
            result = Math.imul(result, 16777619);
          }
          return result >>> 0;
        }

        function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        window.__manyFrogs = {
          restart: startStream,
          getState: () => ({
            streamArrivals,
            totalDeaths,
            populationLimit,
            arrivalInterval: arrivalInterval(),
            live: frogs.filter((frog) => frog.alive).length,
            columns: COLS,
            rows: ROWS,
            fieldRows,
            roadRows,
            roadHeightFraction: roadRows * tile / height,
            topFrogY: frogs.filter((frog) => frog.alive).reduce((top, frog) => Math.max(top, frog.y), -1),
            totalFrogs: nextFrogId,
            fliesCollected: collectedFlies.size,
            bloodStains: bloodStains.length,
            paths: frogPaths.length,
            pathPoints: frogPaths.reduce((count, path) => count + path.points.length, 0),
            frogs: frogs.map((frog) => ({
              id: frog.id,
              alive: frog.alive,
              age: frog.age,
              maturity: frog.maturity,
              color: frog.color,
              x: frog.x,
              y: frog.y,
              decisions: frog.decision,
              waitStreak: frog.waitStreak,
              heading: frog.heading,
              crossings: frog.crossings,
              bodyScale: frogBodyScale(frog),
              turnaroundX: turnaroundX(frog),
              repositioning: frog.repositioning,
              deathKind: frog.deathKind,
              deathPhase: frog.deathPhase
            }))
          }),
          eliminateAll: () => frogs.filter((frog) => frog.alive).forEach((frog) => killFrog(frog, 'traffic'))
        };
      })();
    </script>
  </body>
</html>
