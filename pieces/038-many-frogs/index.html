          ctx.fillStyle = 'oklch(0.03 0 0 / 0.28)';
          ctx.beginPath();
          ctx.ellipse(0, tile * 0.17 + jump, s * 0.58, s * 0.24, 0, 0, TAU);
          ctx.fill();

          ctx.fillStyle = frog.color;
          ctx.beginPath();
          ctx.ellipse(-s * 0.42, s * 0.26, s * 0.27, s * 0.18, -0.5, 0, TAU);
          ctx.ellipse(s * 0.42, s * 0.26, s * 0.27, s * 0.18, 0.5, 0, TAU);
          ctx.ellipse(-s * 0.47, -s * 0.23, s * 0.18, s * 0.23, -0.15, 0, TAU);
          ctx.ellipse(s * 0.47, -s * 0.23, s * 0.18, s * 0.23, 0.15, 0, TAU);
          ctx.ellipse(0, 0, s * 0.53, s * 0.58, 0, 0, TAU);
          ctx.fill();

          ctx.fillStyle = palette.ink;
          ctx.beginPath();
          ctx.arc(-s * 0.24, -s * 0.38, s * 0.12, 0, TAU);
          ctx.arc(s * 0.24, -s * 0.38, s * 0.12, 0, TAU);
          ctx.fill();
          ctx.fillStyle = palette.void;
          ctx.beginPath();
          ctx.arc(-s * 0.24, -s * 0.41, s * 0.052, 0, TAU);
          ctx.arc(s * 0.24, -s * 0.41, s * 0.052, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = 'oklch(0.18 0 0 / 0.78)';
          ctx.lineWidth = Math.max(1, tile * 0.024);
          ctx.beginPath();
          ctx.arc(0, -s * 0.02, s * 0.26, 0.2, Math.PI - 0.2);
          ctx.stroke();
          ctx.restore();
        }

        function drawParticles() {
          particles.forEach((particle) => {
            const age = elapsed - particle.born;
            ctx.globalAlpha = Math.max(0, 1 - age / particle.life);
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(
              worldToScreenX(particle.x), worldToScreenY(particle.y),
              particle.size * tile, 0, TAU
            );
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }

        function resize() {
          width = Math.max(300, window.innerWidth);
          height = Math.max(420, window.innerHeight);
          dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          tile = clamp(Math.min(40, width / COLS), 14, 40);
          boardLeft = (width - COLS * tile) / 2;
          visibleRows = height / tile;
        }

        function worldToScreenX(x) { return boardLeft + x * tile; }
        function worldToScreenY(y) { return height - tile * 0.72 - (y - cameraY) * tile; }

        function roundedRect(x, y, w, h, radius) {
          const r = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, r);
        }

        function brainRandom(frog, salt) {
          return hash(roundSeed + frog.id * 8191 + frog.decision * 131 + salt * 977);
        }

        function hash(value) {
          let x = (Number(value) || 0) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
        }

        function hashString(value) {
          let result = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            result ^= value.charCodeAt(i);
            result = Math.imul(result, 16777619);
          }
          return result >>> 0;
        }

        function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        window.__manyFrogs = {
          restart: startRound,
          getState: () => ({
            round,
            live: frogs.filter((frog) => frog.alive).length,
            cameraY,
            columns: COLS,
            visibleRows,
            topFrogY: frogs.filter((frog) => frog.alive).reduce((top, frog) => Math.max(top, frog.y), -1),
            gameOver: gameOverAt >= 0,
            waiting: waitingFrogs.length,
            totalFrogs: frogs.length,
            fliesCollected: collectedFlies.size,
            bloodStains: bloodStains.length,
            frogs: frogs.map((frog) => ({
              id: frog.id,
              alive: frog.alive,
              x: frog.x,
              y: frog.y,
              decisions: frog.decision,
              waitStreak: frog.waitStreak,
              deathKind: frog.deathKind,
              deathPhase: frog.deathPhase
            }))
          }),
          eliminateAll: () => frogs.filter((frog) => frog.alive).forEach((frog) => killFrog(frog, 'traffic'))
        };
      })();
    </script>
  </body>
</html>
