<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Autonomous frogs shuttle across a ghost-white highway between two fields, leaving watercolor bloodstains that passing traffic drags into the asphalt." />
    <link rel="icon" href="data:," />
    <title>Many Frogs · HyperGal</title>
    <style>
      :root { color-scheme: light; --void: #dadbd4; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--void);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; background: var(--void);
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>
    <script>
      (() => {
        'use strict';

        // One fixed screen: a field along the bottom, a field along the top, and
        // a road band between them that takes 60% of the height. Frogs shuttle
        // across it, turn around at the far field, and shuttle back.
        const TILE = 22;
        const FIELD_FRACTION = 0.2;
        const HOP_TIME = 0.18;
        const OPENING_HOLD = 0.68;
        const RESTART_PAUSE = 1.9;
        const HAZARD_COLLISION_Y = 0.58;
        const FROG_HIT_RADIUS = 0.24;
        const FROG_CLEARANCE = 0.52;
        const FLY_HIT_RADIUS = 0.38;
        const ROUTE_DEPTH = 3;
        const ROUTE_BEAM_WIDTH = 7;
        const TAU = Math.PI * 2;
        const COURSE_SEED = hashString('many-frogs-038-course');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d', { alpha: false });

        // A ghost field. Every surface, machine, and obstacle is printed in
        // whites and light grays at low contrast, so the only real color left
        // on the board belongs to the frogs and the marks they leave.
        // A ghost field. Every surface and machine is printed in whites and light
        // grays at low contrast, so the only real color on the board belongs to
        // the frogs and the marks they leave.
        const palette = {
          void: '#dadbd4', verge: '#c6c7bf', paper: '#fdfdfb',
          shade: '#d9dad2', shadeDeep: '#c8c9c0', shadow: '#c2c3b9',
          grassA: '#f1f2ec', grassB: '#ecede6', grassLine: '#dadbd2',
          road: '#e0e1dd', roadEdge: '#cbccc4', roadMark: '#fbfbf7',
          carA: '#f7f7f4', carB: '#eff0ea', glass: '#dadddb',
          rock: '#f5f5f1', rockLight: '#fcfcf9',
          flyWing: '#fbfbf8', flyBody: '#c7c8c0', ink: '#b2b3aa', tire: '#c0c1b8'
        };

        // One camera angle and one light for the whole field: a solid keeps its
        // simulated footprint on the ground and lifts its lit face up and to
        // the right. ISO_SKEW is that lateral shift as a fraction of the rise.
        const ISO_SKEW = 0.42;
        let isoFlip = 1;

        // A narrow natural-pigment palette: madder and oxide carry the field,
        // with quieter plum notes. Each frog stays identifiable without reading
        // as one stop in a literal rainbow.
        const frogPigments = [
          { frog: 'oklch(0.62 0.16 23)', wash: 'oklch(0.58 0.15 20)', rim: 'oklch(0.37 0.12 18)' },
          { frog: 'oklch(0.52 0.09 72)', wash: 'oklch(0.49 0.09 68)', rim: 'oklch(0.31 0.07 60)' },
          { frog: 'oklch(0.58 0.13 345)', wash: 'oklch(0.54 0.13 347)', rim: 'oklch(0.33 0.10 350)' },
          { frog: 'oklch(0.66 0.14 33)', wash: 'oklch(0.61 0.13 30)', rim: 'oklch(0.39 0.11 26)' },
          { frog: 'oklch(0.47 0.10 305)', wash: 'oklch(0.45 0.10 308)', rim: 'oklch(0.28 0.08 312)' },
          { frog: 'oklch(0.65 0.12 48)', wash: 'oklch(0.60 0.12 45)', rim: 'oklch(0.38 0.10 40)' },
          { frog: 'oklch(0.62 0.10 355)', wash: 'oklch(0.58 0.10 357)', rim: 'oklch(0.37 0.08 2)' },
          { frog: 'oklch(0.50 0.13 8)',  wash: 'oklch(0.47 0.12 8)',  rim: 'oklch(0.29 0.09 5)' },
          { frog: 'oklch(0.68 0.09 77)', wash: 'oklch(0.62 0.09 72)', rim: 'oklch(0.40 0.07 64)' },
          { frog: 'oklch(0.52 0.12 325)', wash: 'oklch(0.49 0.11 328)', rim: 'oklch(0.30 0.09 332)' },
          { frog: 'oklch(0.58 0.10 60)', wash: 'oklch(0.54 0.10 56)', rim: 'oklch(0.34 0.08 50)' },
          { frog: 'oklch(0.55 0.14 18)', wash: 'oklch(0.52 0.13 16)', rim: 'oklch(0.32 0.10 14)' }
        ];

        // A frog's own heading decides which vertical move counts as forward, so
        // the same planner carries it up the board and back down again.
        const moveOptions = [
          { direction: 'up', dx: 0, dy: 1, base: 0 },
          { direction: 'left', dx: -1, dy: 0, base: 2 },
          { direction: 'right', dx: 1, dy: 0, base: 2 },
          { direction: 'down', dx: 0, dy: -1, base: 0 },
          { direction: 'wait', dx: 0, dy: 0, base: 0 }
        ];

        function moveBase(frog, choice) {
          if (choice.dy === 0) return choice.base;
          return choice.dy === frog.heading ? 10 : -5;
        }

        let width = 0;
        let height = 0;
        let dpr = 1;
        let tile = TILE;
        let boardLeft = 0;
        let boardBaseY = 0;
        let COLS = 21;
        let ROWS = 12;
        let fieldRows = 2;
        let roadRows = 8;
        let frogCount = 12;
        let round = 0;
        let roundSeed = 1;
        let nextRoundSeed = 0;
        let frogs = [];
        let waitingFrogs = [];
        let particles = [];
        let bloodStains = [];
        let collectedFlies = new Set();
        let nextFrogId = 12;
        let elapsed = 0;
        let lastTime = performance.now();
        let gameOverAt = -1;
        const laneCache = new Map();
        const obstacleCache = new Map();
        const surfacePrints = new Map();
        let running = !document.hidden;
        let frame = 0;

        resize();
        startRound();
        frame = requestAnimationFrame(loop);

        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
          if (!running && frame) {
            cancelAnimationFrame(frame);
            frame = 0;
          } else if (running && !frame) frame = requestAnimationFrame(loop);
        });


        function startRound() {
          round += 1;
          roundSeed = nextRoundSeed || hashString(`many-frogs-${round}-${Math.floor(Date.now() / 1000)}`);
          nextFrogId = frogCount;
          collectedFlies.clear();
          gameOverAt = -1;
          particles = [];
          frogs = waitingFrogs.length ? waitingFrogs : createFrogs(roundSeed, false);
          frogs.forEach((frog, index) => {
            frog.nextMoveAt = elapsed + OPENING_HOLD + index * 0.03 + hash(roundSeed + index * 613) * 0.08;
          });
          waitingFrogs = [];
          nextRoundSeed = 0;
        }


        function createFrogs(seed, waiting) {
          return Array.from({ length: frogCount }, (_, index) => {
            const margin = COLS * 0.08;
            const spread = margin + index * ((COLS - margin * 2) / Math.max(1, frogCount - 1));
            return createFrog(index, spread, 0, frogPigments[index % frogPigments.length], seed, waiting);
          });
        }

        function createFrog(id, x, y, pigment, seed, waiting = false) {
          return {
            id,
            x,
            y,
            fromX: x,
            fromY: y,
            toX: x,
            toY: y,
            hop: 1,
            alive: true,
            facing: 'up',
            deathAt: -1,
            deathKind: '',
            deathPhase: '',
            color: pigment.frog,
            pigment,
            decision: 0,
            waitStreak: 0,
            heading: 1,
            crossings: 0,
            nextMoveAt: waiting ? Infinity : elapsed + OPENING_HOLD + id * 0.03 + hash(seed + id * 613) * 0.08,
            boldness: hash(seed + id * 1709),
            patience: hash(seed + id * 2347),
            lateralPreference: hash(seed + id * 4517) < 0.5 ? -1 : 1
          };
        }

        function loop(now) {
          const dt = Math.min(0.035, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          frame = 0;
          if (!running) return;
          update(dt);
          draw();
          frame = requestAnimationFrame(loop);
        }


        function update(dt) {
          elapsed += dt;

          frogs.forEach((frog) => {
            if (!frog.alive) return;

            if (frog.hop < 1) {
              const nextHop = Math.min(1, frog.hop + dt / HOP_TIME);
              const t = easeOutQuart(nextHop);
              const nextX = lerp(frog.fromX, frog.toX, t);
              const nextY = lerp(frog.fromY, frog.toY, t);
              if (frogSpaceBlocked(frog, nextX, nextY, elapsed, frog.fromX, frog.fromY)) {
                cancelHop(frog);
                return;
              }
              frog.hop = nextHop;
              frog.x = nextX;
              frog.y = nextY;
              const hazard = hazardAt(frog.x, frog.y, elapsed);
              if (hazard) {
                killFrog(frog, hazard);
                return;
              }
              if (frog.hop === 1) checkLanding(frog);
              return;
            }

            const lane = getLane(Math.round(frog.y));
            if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
              killFrog(frog, 'traffic');
              return;
            }

            if (elapsed >= frog.nextMoveAt) chooseMove(frog);
          });

          // Work from a snapshot because collecting a fly appends three frogs.
          frogs.slice().forEach((frog) => {
            if (frog.alive) collectFlyAt(frog);
          });
          updateBloodStains(dt);

          particles = particles.filter((particle) => elapsed - particle.born < particle.life);
          particles.forEach((particle) => {
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.vy -= 0.5 * dt;
          });

          if (gameOverAt >= 0 && elapsed - gameOverAt >= RESTART_PAUSE) startRound();
        }


        function chooseMove(frog) {
          if (!frog.alive || frog.hop < 1 || gameOverAt >= 0) return;

          const currentLane = getLane(Math.round(frog.y));
          const evaluated = [];

          moveOptions.forEach((choice, index) => {
            const arrival = elapsed + (choice.direction === 'wait' ? 0.11 : HOP_TIME);
            const x = frog.x + choice.dx;
            const y = frog.y + choice.dy;
            if (x < 0.25 || x > COLS - 0.25) return;
            if (y < 0 || y > ROWS - 1) return;

            const lane = getLane(Math.round(y));
            const dwell = lane.type === 'road' ? 0.15 : 0.05;
            const danger = moveDanger(frog, choice, x, y, arrival, dwell);
            const riskWeight = lerp(2.3, 1.55, frog.boldness);
            let score = moveBase(frog, choice) - danger * riskWeight;
            const forward = choice.dy === frog.heading;

            if (forward) score += frog.boldness * 1.2;
            if (choice.dx === frog.lateralPreference) score += 0.4;
            if (choice.direction === 'wait') {
              score += currentLane.type === 'grass' ? 3.7 + frog.patience * 1.4 : -18;
              score -= Math.min(11, frog.waitStreak * 0.65);
            }
            if (currentLane.type !== 'grass' && forward) score += 2.2;
            if (forward && danger < 40) score += Math.min(7, frog.waitStreak * 0.45);

            const thinkDelay = lane.type === 'grass' ? 0.28 : 0.075;
            const escapeAt = arrival + thinkDelay + HOP_TIME;
            const escapeMoves = [[0, frog.heading], [-1, 0], [1, 0], [0, -frog.heading]];
            let escapeDanger = Infinity;

            escapeMoves.forEach(([nextDx, nextDy]) => {
              const nextX = x + nextDx;
              const nextY = y + nextDy;
              if (nextX < 0.25 || nextX > COLS - 0.25) return;
              if (nextY < 0 || nextY > ROWS - 1) return;
              const nextLane = getLane(Math.round(nextY));
              const nextDwell = nextLane.type === 'road' ? 0.13 : 0.04;
              escapeDanger = Math.min(
                escapeDanger,
                laneDanger(nextLane, nextX, escapeAt, nextDwell)
              );
            });

            if (escapeDanger >= 50) score -= 35;
            else score += Math.max(0, 6 - escapeDanger) * 0.55;

            const routeScore = forecastRouteScore(
              frog,
              x,
              y,
              arrival + thinkDelay,
              choice.direction
            );
            if (routeScore <= -70) score -= 48;
            else score += routeScore * 0.5;

            score += brainRandom(frog, index + 1) * 0.9;
            evaluated.push({ ...choice, score, danger, escapeDanger, routeScore });
          });

          const escapeLimit = frog.waitStreak > 8 ? 101 : 60;
          const safe = evaluated.filter((choice) =>
            choice.danger < 40 && choice.escapeDanger < escapeLimit && choice.routeScore > -70);
          const pool = safe.length ? safe : evaluated;
          pool.sort((a, b) => b.score - a.score);
          beginHop(frog, pool.length ? pool[0].direction : 'wait');
        }

        function moveDanger(frog, choice, targetX, targetY, arrival, dwell) {
          if (frogSpaceBlocked(frog, targetX, targetY, arrival, frog.x, frog.y)) return 100;
          const targetLane = getLane(Math.round(targetY));
          const landingDanger = laneDanger(targetLane, targetX, arrival, dwell);
          if (choice.direction === 'wait') {
            const currentLane = getLane(Math.round(frog.y));
            return Math.max(
              landingDanger,
              laneDanger(currentLane, frog.x, elapsed, arrival - elapsed)
            );
          }
          if (landingDanger >= 100) return landingDanger;

          const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
          for (let step = 1; step <= steps; step += 1) {
            const progress = step / steps;
            const x = lerp(frog.x, targetX, progress);
            const y = lerp(frog.y, targetY, progress);
            const atTime = elapsed + HOP_TIME * progress;
            if (hazardAt(x, y, atTime)) return 100;
            if (frogSpaceBlocked(frog, x, y, atTime, frog.x, frog.y)) return 100;
          }
          return landingDanger;
        }


        function forecastRouteScore(frog, startX, startY, startTime, previousDirection) {
          if (startX < 0.25 || startX > COLS - 0.25) return -100;
          let beam = [{
            x: startX,
            y: startY,
            atTime: startTime,
            score: 0,
            previousDirection
          }];

          for (let depth = 0; depth < ROUTE_DEPTH; depth += 1) {
            const branches = [];
            beam.forEach((state) => {
              moveOptions.forEach((move, index) => {
                const result = forecastMove(frog, state, move, depth, index);
                if (result) branches.push(result);
              });
            });
            if (!branches.length) return -100;
            branches.sort((a, b) => b.score - a.score);
            beam = branches.slice(0, ROUTE_BEAM_WIDTH);
          }

          return beam.length ? beam[0].score : -100;
        }


        function forecastMove(frog, state, move, depth, moveIndex) {
          const currentLane = getLane(Math.round(state.y));
          const duration = move.direction === 'wait' ? 0.12 : HOP_TIME;
          const arrival = state.atTime + duration;
          const targetX = state.x + move.dx;
          const targetY = state.y + move.dy;

          if (targetX < 0.25 || targetX > COLS - 0.25) return null;
          if (targetY < 0 || targetY > ROWS - 1) return null;

          if (move.direction === 'wait') {
            if (laneDanger(currentLane, state.x, state.atTime, duration) >= 100) return null;
          } else {
            const steps = Math.max(3, Math.ceil(duration / 0.03));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const sampleX = lerp(state.x, targetX, progress);
              const sampleY = lerp(state.y, targetY, progress);
              const sampleTime = state.atTime + duration * progress;
              if (hazardAt(sampleX, sampleY, sampleTime)) return null;
              if (frogSpaceBlocked(frog, sampleX, sampleY, sampleTime, state.x, state.y)) return null;
            }
          }

          if (frogSpaceBlocked(frog, targetX, targetY, arrival, state.x, state.y)) return null;
          const targetLane = getLane(Math.round(targetY));
          const reaction = targetLane.type === 'grass' ? 0.2 : 0.045;
          const danger = laneDanger(targetLane, targetX, arrival, reaction);
          if (danger >= 100) return null;

          const nextTime = arrival + reaction;
          if (frogSpaceBlocked(frog, targetX, targetY, nextTime, state.x, state.y)) return null;

          let localScore = move.dy === frog.heading
            ? 12
            : move.dy === -frog.heading ? -10 : move.direction === 'wait' ? -0.8 : 1.1;
          localScore -= danger * 1.8;
          if (targetLane.type === 'grass') localScore += 1.2;
          if (targetX < 0.8 || targetX > COLS - 0.8) localScore -= 5;
          if (isReverseMove(state.previousDirection, move.direction)) localScore -= 3.5;
          if (move.direction === 'wait' && currentLane.type !== 'grass') localScore -= 2.5;
          localScore += hash(
            roundSeed + frog.id * 8191 + depth * 1193 + moveIndex * 379 +
            Math.round(targetX * 31) + Math.round(targetY * 101)
          ) * 0.12;

          return {
            x: targetX,
            y: targetY,
            atTime: nextTime,
            score: state.score + localScore * Math.pow(0.78, depth),
            previousDirection: move.direction
          };
        }

        function isReverseMove(previous, next) {
          return (previous === 'up' && next === 'down') ||
            (previous === 'down' && next === 'up') ||
            (previous === 'left' && next === 'right') ||
            (previous === 'right' && next === 'left');
        }

        function frogSpaceBlocked(frog, x, y, atTime = elapsed, fromX = frog.x, fromY = frog.y) {
          return frogs.some((other) => {
            if (!other.alive || other === frog) return false;
            // A frog's reserved motion spans at most one row, so a frog on another
            // part of the board is rejected before its position is ever predicted.
            if (y < Math.min(other.fromY, other.y, other.toY) - FROG_CLEARANCE ||
                y > Math.max(other.fromY, other.y, other.toY) + FROG_CLEARANCE) return false;
            const predicted = predictedFrogPosition(other, atTime);
            if (frogsTooClose(x, y, predicted.x, predicted.y)) return true;

            if (other.hop < 1 && frogsTooClose(x, y, other.toX, other.toY)) return true;
            return other.hop < 1 &&
              frogsTooClose(fromX, fromY, other.toX, other.toY) &&
              frogsTooClose(x, y, other.fromX, other.fromY);
          });
        }

        function predictedFrogPosition(frog, atTime) {
          const secondsAhead = Math.max(0, atTime - elapsed);
          if (frog.hop < 1) {
            const remainingHopTime = (1 - frog.hop) * HOP_TIME;
            const futureHop = Math.min(1, frog.hop + secondsAhead / HOP_TIME);
            const progress = easeOutQuart(futureHop);
            let x = lerp(frog.fromX, frog.toX, progress);
            const y = lerp(frog.fromY, frog.toY, progress);
            return { x, y };
          }

          return { x: frog.x, y: frog.y };
        }

        function frogsTooClose(ax, ay, bx, by) {
          const dx = ax - bx;
          const dy = ay - by;
          return dx * dx + dy * dy < FROG_CLEARANCE * FROG_CLEARANCE;
        }

        function cancelHop(frog) {
          frog.x = frog.fromX;
          frog.y = frog.fromY;
          frog.toX = frog.fromX;
          frog.toY = frog.fromY;
          frog.hop = 1;
          frog.waitStreak += 1;
          frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 109) * 0.1;
          const hazard = hazardAt(frog.x, frog.y, elapsed);
          if (hazard) killFrog(frog, hazard);
        }


        function laneDanger(lane, x, atTime, duration = 0.12) {
          if (lane.type !== 'road') {
            return blockedByGrassObstacle(lane.row, x) ? 100 : 0;
          }

          // Traffic has constant velocity. Its swept interval gives exact clearance
          // over the whole landing window, without allocating and sampling arrays.
          const clearance = trafficClearance(lane, x, atTime, duration);
          if (clearance < FROG_HIT_RADIUS) return 100;
          return clearance < 0.72 ? (0.72 - clearance) * 10 : 0;
        }

        function beginHop(frog, direction) {
          frog.decision += 1;

          if (direction === 'wait') {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.1 + brainRandom(frog, 91) * 0.13;
            return;
          }

          const vectors = {
            up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0]
          };
          const [dx, dy] = vectors[direction];
          const targetX = clamp(frog.x + dx, 0.25, COLS - 0.25);
          const targetY = clamp(frog.y + dy, 0, ROWS - 1);
          if (frogSpaceBlocked(frog, targetX, targetY, elapsed + HOP_TIME, frog.x, frog.y)) {
            frog.waitStreak += 1;
            frog.nextMoveAt = elapsed + 0.08 + brainRandom(frog, 103) * 0.1;
            return;
          }

          frog.waitStreak = 0;
          frog.fromX = frog.x;
          frog.fromY = frog.y;
          frog.toX = targetX;
          frog.toY = targetY;
          frog.facing = direction;
          frog.nextMoveAt = Infinity;

          if (reducedMotion.matches) {
            const steps = Math.max(2, Math.ceil(HOP_TIME / 0.025));
            for (let step = 1; step <= steps; step += 1) {
              const progress = step / steps;
              const hazard = hazardAt(
                lerp(frog.fromX, frog.toX, progress),
                lerp(frog.fromY, frog.toY, progress),
                elapsed + HOP_TIME * progress
              );
              if (hazard) {
                frog.x = lerp(frog.fromX, frog.toX, progress);
                frog.y = lerp(frog.fromY, frog.toY, progress);
                killFrog(frog, hazard);
                return;
              }
            }
            frog.hop = 1;
            frog.x = frog.toX;
            frog.y = frog.toY;
            checkLanding(frog);
          } else {
            frog.hop = 0;
          }
        }


        function checkLanding(frog) {
          if (!frog.alive) return;
          frog.x = frog.toX;
          frog.y = frog.toY;
          if (frogSpaceBlocked(frog, frog.x, frog.y, elapsed, frog.fromX, frog.fromY)) {
            cancelHop(frog);
            return;
          }
          const lane = getLane(Math.round(frog.y));

          if (lane.type === 'grass' && blockedByGrassObstacle(lane.row, frog.x)) {
            cancelHop(frog);
            return;
          }
          if (lane.type === 'road' && hitsVehicleAt(lane, frog.x, elapsed)) {
            killFrog(frog, 'traffic');
            return;
          }

          // Reaching the far field turns the frog around; the crossing never ends.
          if (frog.heading > 0 && frog.y >= ROWS - 1) {
            frog.heading = -1;
            frog.crossings += 1;
          } else if (frog.heading < 0 && frog.y <= 0) {
            frog.heading = 1;
            frog.crossings += 1;
          }

          const urgency = lane.type === 'grass' ? 0.24 : 0.035;
          const variation = lane.type === 'grass' ? 0.3 : 0.045;
          frog.nextMoveAt = elapsed + urgency + brainRandom(frog, 117) * variation;
        }

        function killFrog(frog, kind) {
          if (!frog.alive) return;
          frog.alive = false;
          frog.deathAt = elapsed;
          frog.deathKind = kind;
          frog.deathPhase = frog.hop < 1 ? 'hop' : 'ground';
          addBloodStain(frog, kind);

        function addBloodStain(frog, kind) {

        function stainSurfaceAt(frog, kind) {

        function flyObjectsAt(row, atTime) {

        function spawnFrogBrood(parent, fly) {

          });

            if (index === 0) return 0;

            const distance = Math.floor(offsetIndex / 2) + 1;
            return offsetIndex % 2 === 0 ? -distance : distance;
          });

        function createGrassObstacles(row) {

        function draw() {

          drawBloodStains();
          rows.forEach(drawLaneObjects);
          drawFlies(rows);
          ctx.restore();

          drawParticles();
          waitingFrogs.forEach(drawFrog);
          frogs.forEach(drawFrog);

        function drawLaneSurface(row) {

        function polyPath(points, dx = 0, dy = 0, scale = 1) {

        // lit face so callers can draw their detail on top of it.
        function risenShape(points, lift, topFill, sideFill, edge = null, taper = 1) {

        }



        function drawGrassObstacles(row, top) {

            ctx.beginPath(); ctx.moveTo(-r*.52,-r*.5); ctx.lineTo(r*.06,-r*.66); ctx.lineTo(r*.66,-r*.34); ctx.stroke();

        function drawFlies(rows) {
          rows.forEach((row) => {
            flyObjectsAt(row, elapsed).forEach((fly) => {
              const x = worldToScreenX(fly.x);
              const y = worldToScreenY(fly.y);
              const flap = 0.55 + Math.sin(elapsed * 22 + fly.seed) * 0.22;
              ctx.save();
              ctx.translate(x, y);

              ctx.globalAlpha = 0.38;
              ctx.fillStyle = palette.shadow;
              ctx.beginPath();

              ctx.fill();
              ctx.globalAlpha = 1;

              ctx.fillStyle = palette.flyWing;
              ctx.globalAlpha = 0.72;
              ctx.beginPath();

              ctx.globalAlpha = 1;
              ctx.fillStyle = palette.flyBody;
              ctx.beginPath();
              ctx.ellipse(0, 0, tile * 0.045, tile * 0.075, 0, 0, TAU);
              ctx.fill();
              ctx.fillStyle = palette.ink;
              ctx.beginPath();

              ctx.arc(tile * 0.021, -tile * 0.055, Math.max(1, tile * 0.014), 0, TAU);
              ctx.fill();
              ctx.restore();
            });
          });
        }



        function drawRoadSurface(lane, top) {
          const shoulderTop = terrainTypeAt(lane.row - 1) === 'grass';
          const shoulderBottom = terrainTypeAt(lane.row + 1) === 'grass';
          if (shoulderTop || shoulderBottom) {
            // A shallow shoulder steps the asphalt down from the turf.
            ctx.fillStyle = palette.shade;
            ctx.globalAlpha = .75;
            if (shoulderBottom) ctx.fillRect(boardLeft, top, COLS * tile, Math.max(1, tile * .06));
            if (shoulderTop) ctx.fillRect(boardLeft, top + tile - Math.max(1, tile * .06), COLS * tile, Math.max(1, tile * .06));
          }
          ctx.globalAlpha = .45;
          ctx.fillStyle = palette.roadEdge;
          ctx.fillRect(boardLeft, top + tile - .8, COLS * tile, .8);
          // Lane paint reads the direction of travel on this row.
          ctx.fillStyle = palette.roadMark; ctx.globalAlpha = .95;
          const step = tile * 2.4, phase = mod(lane.offset * tile, step);
          for (let x = boardLeft - step + phase; x < boardLeft + COLS * tile; x += step) {
            ctx.fillRect(x, top + tile * .49, tile * .47, Math.max(.8, tile * .028));
            ctx.fillRect(x + tile * .52, top + tile * .49, tile * .1, Math.max(.6, tile * .02));
          }
          ctx.globalAlpha = 1;
        }



        function drawVehicles(lane, top) {
          laneObjectsAt(lane, elapsed).forEach((vehicle) => drawVehicle(lane, vehicle, top));
        }



        function drawVehicle(lane, vehicle, top) {
          const w = vehicle.length * tile, h = tile * .3;
          const x = boardLeft + (vehicle.x + vehicle.length / 2) * tile;
          if (x < -w || x > width + w) return;
          const fine = w > 40;
          isoFlip = lane.direction < 0 ? -1 : 1;
          ctx.save(); ctx.translate(x, top + tile * .5);
          if (lane.direction < 0) ctx.scale(-1, 1);
          const seed = lane.row * 117 + vehicle.id * 431;
          const shell = hash(seed) > .5 ? palette.carA : palette.carB;
          // Tires print on the asphalt, the body rises clear of them.
          ctx.fillStyle = palette.tire;
          for (const side of [-1,1]) { ctx.fillRect(-w*.34,side*h-h*.17,w*.14,h*.34); ctx.fillRect(w*.23,side*h-h*.17,w*.13,h*.34); }
          const body = [[-w*.49,-h*.74],[-w*.4,-h],[w*.32,-h*.95],[w*.48,-h*.6],[w*.49,h*.64],[w*.32,h*.97],[-w*.43,h*.92]];
          const [bx, by] = risenShape(body, .17, shell, palette.shade, fine ? palette.shadeDeep : null);
          ctx.save(); ctx.translate(bx, by);
          // The cabin rises again off the hood, glass facing the camera.
          const cabin = [[-w*.2,-h*.66],[w*.14,-h*.62],[w*.21,-h*.4],[w*.2,h*.48],[-w*.19,h*.6]];
          const [cx, cy] = risenShape(cabin, .13, shell, palette.shadeDeep, fine ? palette.shade : null);
          ctx.fillStyle = palette.glass;
          polyPath([[-w*.13,-h*.48],[w*.08,-h*.45],[w*.09,h*.42],[-w*.12,h*.48]], cx, cy); ctx.fill();
          if (fine) {
            dryLines(-w*.4,-h*.7,w*.75,h*1.4,seed,palette.shade,8);
            ctx.strokeStyle = palette.shadeDeep; ctx.lineWidth = .7;
            ctx.beginPath(); ctx.moveTo(-w*.45,-h*.5); ctx.lineTo(-w*.45,-h*.2); ctx.moveTo(-w*.45,h*.22); ctx.lineTo(-w*.45,h*.52); ctx.stroke();
          }
          // Lamps at the nose.
          ctx.fillStyle = palette.paper;
          ctx.fillRect(w*.42,-h*.62,Math.max(1,w*.055),h*.3); ctx.fillRect(w*.42,h*.32,Math.max(1,w*.055),h*.3);
          ctx.restore();
          ctx.restore(); isoFlip = 1;
        }









        function drawBloodStains() {
          bloodStains.forEach(stain=>{
            const x=worldToScreenX(stain.x),y=worldToScreenY(stain.y);
            if(y < -tile*2 || y > height+tile*2)return;
            const age=elapsed-stain.born;
            const progress=reducedMotion.matches ? 1 : easeOutQuart(clamp(age/1.65,0,1));
            if(stain.vehicleSmears.length)drawVehicleSmears(stain,x,y,progress);
            if(!stain.print)stain.print=makePigmentPrint(stain);
            ctx.save();ctx.translate(x,y);ctx.rotate(stain.rotation);
            const bloom=.4+.6*progress;
            ctx.scale(stain.scale*stain.roadStretch*bloom,stain.scale*bloom);
            ctx.globalAlpha=stain.opacity*progress;
            ctx.drawImage(stain.print,-tile,-tile,tile*2,tile*2);
            ctx.restore();
          });
        }

        function makePigmentPrint(stain) {
          const print=document.createElement('canvas');
          print.width=print.height=128;
          const ink=print.getContext('2d');
          ink.translate(64,64);ink.scale(64,64);
          // Feathering is embedded in this small impression and scales with current.
          for(let index=stain.layers.length-1;index>=0;index--) {
            const layer=stain.layers[index];
            ink.globalAlpha=layer.alpha*1.4;
            ink.fillStyle=index%6===0?stain.pigment.frog:stain.pigment.wash;
            ink.beginPath();ink.moveTo(layer.points[0].x,layer.points[0].y);
            for(let i=1;i<layer.points.length;i++)ink.lineTo(layer.points[i].x,layer.points[i].y);
            ink.closePath();ink.fill();
          }
          const edge=stain.layers[stain.layers.length-1].points;
          ink.strokeStyle=stain.pigment.rim;ink.globalAlpha=.52;ink.lineWidth=.014;
          ink.beginPath();ink.moveTo(edge[0].x,edge[0].y);for(let i=1;i<edge.length;i++)ink.lineTo(edge[i].x,edge[i].y);ink.closePath();ink.stroke();
          ink.globalAlpha=.3;ink.lineWidth=.009;
          stain.scaffold.forEach(line=>{ink.beginPath();ink.moveTo(line[0].x,line[0].y);ink.lineTo(line[1].x,line[1].y);ink.lineTo(line[2].x,line[2].y);ink.stroke();});
          ink.fillStyle=stain.pigment.rim;ink.globalAlpha=.4;
          stain.stipple.forEach(dot=>ink.fillRect(dot.x,dot.y,Math.max(.008,dot.size),Math.max(.008,dot.size)));
          ink.fillStyle=stain.pigment.wash;ink.globalAlpha=.45;
          stain.droplets.forEach(drop=>{ink.beginPath();ink.arc(Math.cos(drop.angle)*drop.distance,Math.sin(drop.angle)*drop.distance*.72,drop.size,0,TAU);ink.fill();});
          return print;
        }

        function drawVehicleSmears(stain, x, y, stainProgress) {
          ctx.save();
          ctx.translate(x, y);
          ctx.strokeStyle = stain.pigment.wash;
          ctx.lineCap = 'butt';
          stain.vehicleSmears.forEach((smear) => {
            const reveal = reducedMotion.matches
              ? 1
              : easeOutQuart(clamp((elapsed - smear.born) / 0.16, 0, 1));
            const ranges = [
              [0, smear.gaps[0]],
              [smear.gaps[0] + 0.07, smear.gaps[1]],
              [smear.gaps[1] + 0.08, 1]
            ];
            ctx.globalAlpha = smear.alpha * stainProgress * reveal;
            ctx.lineWidth = Math.max(1, smear.width * tile);
            ranges.forEach(([from, to], segmentIndex) => {
              const visibleTo = Math.min(to, reveal);
              if (visibleTo <= from) return;
              const fromX = smear.direction * smear.length * from * tile;
              const toX = smear.direction * smear.length * visibleTo * tile;
              const offsetY = smear.offsetY * tile;
              ctx.beginPath();
              ctx.moveTo(fromX, offsetY);
              ctx.quadraticCurveTo(
                (fromX + toX) * 0.5,
                offsetY + smear.wobble * tile * (segmentIndex % 2 ? -1 : 1),
                toX,
                offsetY + smear.wobble * tile * 0.35
              );
              ctx.stroke();
            });
          });
          ctx.restore();
        }

        function drawBoardEdges() {
          ctx.fillStyle=palette.verge;
          const top=boardBaseY-(ROWS-.5)*tile,bottom=boardBaseY+tile*.5;
          if(boardLeft>0){ctx.fillRect(boardLeft-2,top,2,ROWS*tile);ctx.fillRect(boardLeft+COLS*tile,top,2,ROWS*tile);}
          ctx.fillRect(boardLeft,top-2,COLS*tile,2);ctx.fillRect(boardLeft,bottom,COLS*tile,2);
        }

        function drawFrog(frog) {
          if(!frog.alive)return;
          const x=worldToScreenX(frog.x),y=worldToScreenY(frog.y);
          if(y < -tile || y > height+tile)return;
          const extension=!reducedMotion.matches && frog.hop<1 ? Math.sin(frog.hop*Math.PI) : 0;
          const size=tile*.39, asymmetry=(hash(frog.id*117+33)-.5)*.12;
          ctx.save();ctx.translate(x,y);
          ctx.globalAlpha=.34;ctx.fillStyle=palette.shadow;
          ctx.beginPath();ctx.ellipse(tile*.06,tile*.07,tile*.2,tile*.15,0,0,TAU);ctx.fill();
          ctx.globalAlpha=1;
          ctx.rotate({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[frog.facing]);
          ctx.scale(size,size);
          // Folded hind limbs open along the hop, the body stays on its surface.
          ctx.strokeStyle=frog.color;ctx.lineWidth=.13;ctx.lineCap='butt';ctx.lineJoin='miter';
          ctx.beginPath();
          for(const side of [-1,1]) {
            const skew=side===1 ? asymmetry : 0;
            ctx.moveTo(side*.18,.17);ctx.lineTo(side*(.5-extension*.12),.38+skew);
            ctx.lineTo(side*(.34+extension*.1),-.03+extension*.87+skew);
            ctx.lineTo(side*(.6-extension*.13),.24+extension*.7+skew);
            ctx.moveTo(side*.2,-.26);ctx.lineTo(side*.39,-.12);ctx.lineTo(side*.51,-.39+extension*.14);
          }
          ctx.stroke();
          printedShape([[-.18,.35],[-.29,.08],[-.25,-.35],[-.17,-.56],[.15,-.61],[.28,-.34],[.25,.09],[.13,.38]],frog.color);
          ctx.strokeStyle=frog.pigment.rim;ctx.lineWidth=.045;ctx.beginPath();ctx.moveTo(-.06,.22);ctx.lineTo(.015,-.37);ctx.moveTo(-.15,-.09);ctx.lineTo(-.18,-.3);ctx.moveTo(.13,-.14);ctx.lineTo(.17,-.35);ctx.stroke();
          ctx.fillStyle=frog.pigment.rim;ctx.fillRect(-.24,-.43,.065,.085);ctx.fillRect(.17,-.45,.06,.085);
          ctx.strokeStyle=frog.color;ctx.lineWidth=.035;ctx.beginPath();
          for(const side of [-1,1]) {const fx=side*(.6-extension*.13),fy=.24+extension*.7+(side===1?asymmetry:0);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.1,fy+.09);ctx.moveTo(fx,fy);ctx.lineTo(fx+side*.12,fy-.025);}
          ctx.stroke();ctx.restore();
        }

        function drawParticles() {
          particles.forEach((particle) => {
            const age = elapsed - particle.born;
            ctx.globalAlpha = Math.max(0, 1 - age / particle.life);
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(
              worldToScreenX(particle.x), worldToScreenY(particle.y),
              particle.size * tile, 0, TAU
            );
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }


        function resize() {
          width = Math.max(300, window.innerWidth);
          height = Math.max(420, window.innerHeight);
          dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          tile = TILE;
          COLS = Math.max(9, Math.floor(width / tile));
          ROWS = Math.max(9, Math.floor(height / tile));
          fieldRows = Math.max(2, Math.round(ROWS * FIELD_FRACTION));
          roadRows = Math.max(3, ROWS - fieldRows * 2);
          ROWS = fieldRows * 2 + roadRows;
          frogCount = clamp(Math.round(COLS * 0.35), 10, 24);
          boardLeft = (width - COLS * tile) / 2;
          boardBaseY = (height + ROWS * tile) / 2 - tile * 0.5;

          // Terrain, obstacles, and impressions are all keyed to the board size.
          laneCache.clear();
          obstacleCache.clear();
          surfacePrints.clear();
          [...frogs, ...waitingFrogs].forEach((frog) => {
            frog.x = clamp(frog.x, 0.25, COLS - 0.25);
            frog.y = clamp(frog.y, 0, ROWS - 1);
            frog.fromX = frog.toX = frog.x;
            frog.fromY = frog.toY = frog.y;
            frog.hop = 1;
          });
        }

        function worldToScreenX(x) { return boardLeft + x * tile; }
        function worldToScreenY(y) { return boardBaseY - y * tile; }

        function brainRandom(frog, salt) {
          return hash(roundSeed + frog.id * 8191 + frog.decision * 131 + salt * 977);
        }

        function hash(value) {
          let x = (Number(value) || 0) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
        }

        function hashString(value) {
          let result = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            result ^= value.charCodeAt(i);
            result = Math.imul(result, 16777619);
          }
          return result >>> 0;
        }

        function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        window.__manyFrogs = {
          restart: startRound,
          getState: () => ({
            round,
            live: frogs.filter((frog) => frog.alive).length,
            columns: COLS,
            rows: ROWS,
            fieldRows,
            roadRows,
            topFrogY: frogs.filter((frog) => frog.alive).reduce((top, frog) => Math.max(top, frog.y), -1),
            gameOver: gameOverAt >= 0,
            waiting: waitingFrogs.length,
            totalFrogs: frogs.length,
            fliesCollected: collectedFlies.size,
            bloodStains: bloodStains.length,
            frogs: frogs.map((frog) => ({
              id: frog.id,
              alive: frog.alive,
              x: frog.x,
              y: frog.y,
              decisions: frog.decision,
              waitStreak: frog.waitStreak,
              heading: frog.heading,
              crossings: frog.crossings,
              deathKind: frog.deathKind,
              deathPhase: frog.deathPhase
            }))
          }),
          eliminateAll: () => frogs.filter((frog) => frog.alive).forEach((frog) => killFrog(frog, 'traffic'))
        };
      })();
    </script>
  </body>
</html>
