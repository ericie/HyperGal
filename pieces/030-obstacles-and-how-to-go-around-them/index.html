<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A field of petals rides a river current around organic rocks, through deep pools, narrow runs, collisions, eddies, and turbulence."
    />
    <title>Obstacles and How to Go Around Them · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f1eedf;
        --panel: rgba(246, 243, 226, 0.94);
        --panel-ink: #2b1720;
        --panel-muted: #66565a;
        --panel-rule: #aaa28f;
        --focus: #006a83;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        min-width: 320px;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--paper);
        cursor: crosshair;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -8px;
      }

      .river-panel {
        position: fixed;
        z-index: 10;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        width: min(292px, calc(100vw - 28px));
        max-height: calc(100vh - 28px);
        overflow: hidden;
        border: 1px solid var(--panel-ink);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 4px 4px 0 rgba(43, 23, 32, 0.14);
        color: var(--panel-ink);
        font-size: 12px;
        line-height: 1.2;
        user-select: none;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        min-height: 48px;
        padding: 8px 8px 8px 11px;
        border-bottom: 1px solid var(--panel-ink);
        cursor: grab;
        touch-action: none;
      }

      .river-panel.is-dragging .panel-header { cursor: grabbing; }
      .panel-heading { min-width: 0; }

      h1 {
        margin: 0;
        overflow: hidden;
        font: 700 12px/1.05 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.025em;
        line-height: 1.05;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-heading p {
        margin: 4px 0 0;
        color: var(--panel-muted);
        font: 9px/1.1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      button,
      input { font: inherit; }

      .panel-button {
        display: grid;
        width: 29px;
        height: 29px;
        padding: 0;
        place-items: center;
        border: 1px solid var(--panel-ink);
        border-radius: 0;
        background: transparent;
        color: var(--panel-ink);
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .panel-button[data-action="reseed"] {
        background: var(--panel-ink);
        color: var(--panel);
      }

      .panel-button:hover,
      .map-button:hover { background: #fffdf1; }

      .panel-button[data-action="reseed"]:hover {
        background: #006a83;
        color: #fff;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #006eb3;
        outline-offset: 2px;
      }

      .panel-body {
        max-height: calc(100vh - 82px);
        padding: 9px 11px 11px;
        overflow-y: auto;
      }

      .river-panel.is-collapsed { width: 210px; }
      .river-panel.is-collapsed .panel-header { border-bottom: 0; }
      .river-panel.is-collapsed .panel-body,
      .river-panel.is-collapsed .panel-heading p { display: none; }

      .map-switcher {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--panel-rule);
      }

      .control-section-label {
        margin: 10px 0 1px;
        color: var(--panel-muted);
        font: 700 8px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .control-section-label:not(:first-of-type) {
        padding-top: 8px;
        border-top: 1px solid var(--panel-rule);
      }

      .map-button {
        min-height: 27px;
        padding: 4px 5px;
        border: 1px solid var(--panel-ink);
        border-radius: 0;
        background: transparent;
        color: var(--panel-ink);
        font: 700 9px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
      }

      .map-button[aria-pressed="true"] {
        background: var(--panel-ink);
        color: var(--panel);
      }

      .range-row {
        --progress: 50%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 66px;
        align-items: center;
        column-gap: 8px;
        min-height: 43px;
      }

      .range-row + .range-row { border-top: 1px solid rgba(16, 36, 38, 0.22); }
      .range-row label { font-weight: 700; }

      .control-value {
        color: var(--panel-muted);
        font: 10px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      input[type="range"] {
        grid-column: 1 / 3;
        width: 100%;
        height: 11px;
        margin: -5px 0 0;
        padding: 0;
        appearance: none;
        background: transparent;
        cursor: ew-resize;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--panel-ink) 0 var(--progress),
          var(--panel-rule) var(--progress) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 11px;
        height: 11px;
        margin-top: -4.5px;
        border: 1px solid var(--panel-ink);
        border-radius: 50%;
        appearance: none;
        background: var(--panel);
      }

      input[type="range"]::-moz-range-track { height: 2px; background: var(--panel-rule); }
      input[type="range"]::-moz-range-progress { height: 2px; background: var(--panel-ink); }
      input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 1px solid var(--panel-ink);
        border-radius: 50%;
        background: var(--panel);
      }

      .map-key {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
        color: var(--panel-muted);
        font: 9px/1.25 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .key-gradient {
        display: block;
        height: 5px;
        margin-bottom: 4px;
        border: 1px solid rgba(31, 76, 90, 0.3);
        background: linear-gradient(90deg, #f1eedf, #b9d5d2);
      }

      .key-gradient.speed { background: linear-gradient(90deg, #dce8e3, #4c8995, #b14c68); }

      .panel-note {
        margin: 9px 0 0;
        color: var(--panel-muted);
        font-size: 10px;
        line-height: 1.35;
      }

      @media (max-width: 520px) {
        .river-panel { width: min(270px, calc(100vw - 28px)); }
        .panel-body { padding-top: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas { cursor: default; }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="river"
      tabindex="0"
      role="img"
      aria-label="Petals floating down a river around organic rocks. Click or tap the water to make an eddy."
    ></canvas>

    <aside class="river-panel" aria-label="River controls">
      <header class="panel-header">
        <div class="panel-heading">
          <h1>OBSTACLES / GO AROUND</h1>
          <p>flow-field study / plan 030</p>
        </div>
        <div class="panel-actions">
          <button class="panel-button" data-action="reseed" type="button" aria-label="New river" title="New river">&#8635;</button>
          <button class="panel-button" data-action="collapse" type="button" aria-label="Collapse controls" aria-expanded="true" title="Collapse controls">−</button>
        </div>
      </header>

      <div class="panel-body">
        <div class="map-switcher" aria-label="Visible map layer">
          <button class="map-button" type="button" data-map="surface" aria-pressed="true">Field</button>
          <button class="map-button" type="button" data-map="depth" aria-pressed="false">Depth</button>
          <button class="map-button" type="button" data-map="current" aria-pressed="false">Flow</button>
        </div>

        <p class="control-section-label">Obstacles</p>
        <div class="range-row">
          <label for="rock-count">Amount</label>
          <output class="control-value" for="rock-count">18</output>
          <input id="rock-count" type="range" min="6" max="26" step="1" value="18" />
        </div>
        <div class="range-row">
          <label for="rock-scale">Size</label>
          <output class="control-value" for="rock-scale">100%</output>
          <input id="rock-scale" type="range" min="55" max="140" step="1" value="100" />
        </div>
        <div class="range-row">
          <label for="rock-grouping">Grouping</label>
          <output class="control-value" for="rock-grouping">56%</output>
          <input id="rock-grouping" type="range" min="0" max="100" step="1" value="56" />
        </div>
        <div class="range-row">
          <label for="rock-spacing">Spacing</label>
          <output class="control-value" for="rock-spacing">100%</output>
          <input id="rock-spacing" type="range" min="55" max="150" step="1" value="100" />
        </div>

        <p class="control-section-label">Current / petals</p>
        <div class="range-row">
          <label for="direction">Direction</label>
          <output class="control-value" for="direction">180° S</output>
          <input id="direction" type="range" min="0" max="359" step="1" value="180" />
        </div>
        <div class="range-row">
          <label for="flow">Base flow</label>
          <output class="control-value" for="flow">42 px/s</output>
          <input id="flow" type="range" min="12" max="92" step="1" value="42" />
        </div>
        <div class="range-row">
          <label for="petal-count">Petals</label>
          <output class="control-value" for="petal-count">192</output>
          <input id="petal-count" type="range" min="48" max="260" step="1" value="192" />
        </div>
        <div class="range-row">
          <label for="turbulence">Turbulence</label>
          <output class="control-value" for="turbulence">58%</output>
          <input id="turbulence" type="range" min="0" max="100" step="1" value="58" />
        </div>

        <div class="map-key" aria-hidden="true">
          <span><i class="key-gradient"></i>shoal → deep</span>
          <span><i class="key-gradient speed"></i>slow → fast</span>
        </div>
        <p class="panel-note">Petal marks reveal the field. Click to introduce an eddy. R remaps the study.</p>
      </div>
    </aside>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('river');
        const ctx = canvas.getContext('2d', { alpha: false });
        const panel = document.querySelector('.river-panel');
        const panelHeader = panel.querySelector('.panel-header');
        const collapseButton = panel.querySelector('[data-action="collapse"]');
        const reseedButton = panel.querySelector('[data-action="reseed"]');
        const mapButtons = [...panel.querySelectorAll('[data-map]')];
        const directionInput = document.getElementById('direction');
        const flowInput = document.getElementById('flow');
        const petalInput = document.getElementById('petal-count');
        const turbulenceInput = document.getElementById('turbulence');
        const rockCountInput = document.getElementById('rock-count');
        const rockScaleInput = document.getElementById('rock-scale');
        const rockGroupingInput = document.getElementById('rock-grouping');
        const rockSpacingInput = document.getElementById('rock-spacing');
        const reducedMotion = typeof matchMedia === 'function'
          ? matchMedia('(prefers-reduced-motion: reduce)')
          : null;

        const TAU = Math.PI * 2;
        const MAP_SCALE = 5;
        const PETAL_COLORS = [
          ['#d85d7d', '#7b2747'],
          ['#ed8da5', '#9b3859'],
          ['#f2b1bf', '#ae4b69'],
          ['#d66a8d', '#7d3153'],
          ['#ead9cf', '#a75d6d'],
          ['#bd789b', '#71334f'],
        ];
        const ROCK_COLORS = [
          ['#d8cfba', '#342a2d'],
          ['#c8c1ad', '#342a2d'],
          ['#ded8c7', '#342a2d'],
          ['#cfc6b0', '#342a2d'],
          ['#d6cfbd', '#342a2d'],
        ];

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let rocks = [];
        let flowGaps = [];
        let petals = [];
        let threads = [];
        let eddies = [];
        let maps = {};
        let mapMode = 'surface';
        let lastTime = performance.now();
        let animationFrame = 0;
        let panelDrag = null;
        let resizeTimer = 0;
        let mapTimer = 0;
        let composeTimer = 0;

        const settings = {
          direction: 180,
          flow: 42,
          petals: 192,
          turbulence: 0.58,
          rockCount: 18,
          rockScale: 1,
          rockGrouping: 0.56,
          rockSpacing: 1,
        };

        function seedFromLocation() {
          const value = new URLSearchParams(location.search).get('seed');
          const parsed = Number.parseInt(value || '', 36);
          return Number.isFinite(parsed)
            ? parsed >>> 0
            : ((Date.now() * 2654435761) ^ (Math.random() * 0xffffffff)) >>> 0;
        }

        function mulberry32(a) {
          return function next() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function rand(min, max) { return min + random() * (max - min); }
        function pick(list) { return list[Math.floor(random() * list.length)]; }
        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
        function mix(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
        function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

        function flowBasis() {
          const angle = settings.direction * Math.PI / 180;
          const dx = Math.sin(angle);
          const dy = -Math.cos(angle);
          return { dx, dy, px: -dy, py: dx };
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          compose();
        }

        function compose() {
          random = mulberry32((seed ^ Math.round(width * 19) ^ Math.round(height * 37)) >>> 0);
          rocks = makeRocks();
          computeFlowGaps();
          buildMaps();
          petals = Array.from(
            { length: settings.petals },
            (_, index) => makePetal(index, false)
          );
          threads = makeThreads();
          eddies = [];
          lastTime = performance.now();
          render(lastTime, 0);
        }

        function makeRocks() {
          const small = Math.min(width, height);
          const desired = settings.rockCount;
          const grouping = settings.rockGrouping;
          const proximityCount = Math.round(mix(1, desired * 0.36, grouping));
          const closureCount = Math.round(mix(desired * 0.13, desired * 0.28, grouping));
          const impliedCount = Math.round(mix(desired * 0.3, desired * 0.12, grouping));
          const offpageCount = desired >= 10 ? 2 : 1;
          const proximityEnd = proximityCount;
          const closureEnd = proximityEnd + closureCount;
          const impliedEnd = closureEnd + impliedCount;
          const offpageEnd = impliedEnd + offpageCount;
          const center = { x: width * rand(0.43, 0.57), y: height * rand(0.44, 0.58) };
          const clusterA = { x: width * rand(0.22, 0.34), y: height * rand(0.27, 0.42) };
          const clusterB = { x: width * rand(0.66, 0.79), y: height * rand(0.58, 0.72) };
          const anchors = [];

          for (let i = 0; i < desired * 4; i++) {
            let mode = 'scatter';
            let x = width * rand(0.08, 0.92);
            let y = height * rand(0.08, 0.92);
            let scale = [0.58, 1.18, 0.78, 1.65, 0.48, 0.96, 1.38][i % 7];

            if (i < proximityEnd) {
              mode = 'proximity';
              const a = i % 2 ? clusterA : clusterB;
              const theta = rand(0, TAU);
              const radius = small * rand(mix(0.055, 0.012, grouping), mix(0.17, 0.065, grouping));
              x = a.x + Math.cos(theta) * radius;
              y = a.y + Math.sin(theta) * radius;
            } else if (i < closureEnd) {
              mode = 'closure';
              const closureIndex = i - proximityEnd;
              const theta = -2.5 + closureIndex / Math.max(1, closureCount - 1) * 4.1;
              x = center.x + Math.cos(theta) * width * mix(0.3, 0.2, grouping);
              y = center.y + Math.sin(theta) * height * mix(0.27, 0.17, grouping);
              scale *= 0.82;
            } else if (i < impliedEnd) {
              mode = 'implied';
              const t = (i - closureEnd + 1) / Math.max(2, impliedCount + 1);
              x = mix(width * 0.18, width * 0.82, t);
              y = mix(height * 0.72, height * 0.3, t) + rand(-small * 0.045, small * 0.045);
              scale *= 0.7;
            } else if (i < offpageEnd) {
              mode = 'offpage';
              x = (i - impliedEnd) % 2 === 0 ? -small * 0.015 : width + small * 0.015;
              y = height * rand(0.24, 0.8);
              scale *= 1.5;
            }
            anchors.push({ x, y, scale, mode, priority: mode === 'offpage' ? 4 : mode === 'proximity' ? 3 : mode === 'closure' ? 2 : 1 });
          }

          anchors.sort((a, b) => b.priority - a.priority);
          const placed = [];
          for (let i = 0; i < anchors.length && placed.length < desired; i++) {
            const anchor = anchors[i];
            const base = clamp(small * 0.085, 30, 78) * settings.rockScale;
            const rx = clamp(base * anchor.scale * rand(0.82, 1.35), 11, small * 0.26);
            const ry = clamp(base * Math.pow(anchor.scale, 0.7) * rand(0.46, 0.84), 8, small * 0.18);
            let found = null;

            for (let attempt = 0; attempt < 120; attempt++) {
              const rotation = rand(-0.72, 0.72);
              const jitter = anchor.mode === 'scatter'
                ? small * mix(0.16, 0.08, grouping)
                : small * mix(0.06, 0.025, grouping);
              const rock = {
                id: placed.length,
                x: anchor.x + rand(-jitter, jitter),
                y: anchor.y + rand(-jitter, jitter),
                rx,
                ry,
                rotation,
                radius: Math.max(rx, ry),
                points: [],
                flecks: [],
                colors: ROCK_COLORS[(i + placed.length) % ROCK_COLORS.length],
              };
              if (anchor.mode !== 'offpage') {
                rock.x = clamp(rock.x, rx * 0.72, width - rx * 0.72);
                rock.y = clamp(rock.y, ry * 0.85, height - ry * 0.85);
              }
              let overlaps = false;
              for (const other of placed) {
                const distance = Math.hypot(rock.x - other.x, rock.y - other.y);
                const baseAllowance = anchor.mode === 'proximity' ? 0.44 : 0.7;
                const allowance = baseAllowance * settings.rockSpacing;
                if (distance < (rock.radius + other.radius) * allowance + 12 * settings.rockSpacing) {
                  overlaps = true;
                  break;
                }
              }
              if (!overlaps) { found = rock; break; }
            }

            if (!found) continue;
            const pointCount = 18;
            let wobble = rand(0, TAU);
            for (let p = 0; p < pointCount; p++) {
              const angle = p / pointCount * TAU;
              wobble += rand(-0.65, 0.65);
              const roughness = 1 + Math.sin(angle * 3 + wobble) * 0.055 + rand(-0.07, 0.07);
              found.points.push({ angle, roughness });
            }
            for (let f = 0; f < 10; f++) {
              const angle = rand(0, TAU);
              const radius = Math.sqrt(random()) * 0.72;
              found.flecks.push({
                x: Math.cos(angle) * radius,
                y: Math.sin(angle) * radius,
                r: rand(0.8, 2.1),
                alpha: rand(0.08, 0.22),
              });
            }
            placed.push(found);
          }
          return placed;
        }

        function rockInfo(x, y, rock) {
          const cos = Math.cos(-rock.rotation);
          const sin = Math.sin(-rock.rotation);
          const dx = x - rock.x;
          const dy = y - rock.y;
          const lx = dx * cos - dy * sin;
          const ly = dx * sin + dy * cos;
          const q = Math.hypot(lx / rock.rx, ly / rock.ry) || 0.0001;
          const distance = (q - 1) * Math.min(rock.rx, rock.ry);
          const nlx = lx / (rock.rx * rock.rx);
          const nly = ly / (rock.ry * rock.ry);
          const nLength = Math.hypot(nlx, nly) || 1;
          const localNx = nlx / nLength;
          const localNy = nly / nLength;
          return {
            distance,
            nx: localNx * cos + localNy * sin,
            ny: -localNx * sin + localNy * cos,
          };
        }

        function depthAt(x, y) {
          let nearest = Infinity;
          for (const rock of rocks) nearest = Math.min(nearest, rockInfo(x, y, rock).distance);
          const broad = Math.sin(x * 0.008 + seed * 0.00001) * Math.sin(y * 0.006 - seed * 0.00002);
          return clamp(smooth(nearest / 115) * 0.88 + broad * 0.055 + 0.08, 0, 1);
        }

        function ellipseSupport(rock, vx, vy) {
          const angle = Math.atan2(vy, vx) - rock.rotation;
          return Math.hypot(rock.rx * Math.cos(angle), rock.ry * Math.sin(angle));
        }

        function computeFlowGaps() {
          const basis = flowBasis();
          flowGaps = [];
          for (let i = 0; i < rocks.length; i++) {
            for (let j = i + 1; j < rocks.length; j++) {
              const a = rocks[i];
              const b = rocks[j];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const alongSeparation = Math.abs(dx * basis.dx + dy * basis.dy);
              const acrossSeparation = Math.abs(dx * basis.px + dy * basis.py);
              const reachA = ellipseSupport(a, basis.px, basis.py);
              const reachB = ellipseSupport(b, basis.px, basis.py);
              const gapWidth = acrossSeparation - reachA - reachB;
              if (gapWidth < 8 || gapWidth > 250) continue;
              if (alongSeparation > (a.radius + b.radius) * 0.78 + 65) continue;
              flowGaps.push({
                x: (a.x + b.x) * 0.5,
                y: (a.y + b.y) * 0.5,
                alongRadius: Math.max(a.radius, b.radius) * 1.35 + 58,
                acrossRadius: acrossSeparation * 0.54,
                strength: smooth(1 - gapWidth / 250),
              });
            }
          }
        }

        function sampleFlow(x, y, time, includeEddies = true) {
          const basis = flowBasis();
          const base = settings.flow;
          let vx = basis.dx * base;
          let vy = basis.dy * base;
          let turbulence = 0;

          for (const rock of rocks) {
            const dx = x - rock.x;
            const dy = y - rock.y;
            const along = dx * basis.dx + dy * basis.dy;
            const across = dx * basis.px + dy * basis.py;
            const info = rockInfo(x, y, rock);
            const influenceRadius = rock.radius * 2.35 + 64;
            const radial = Math.hypot(dx, dy);
            const influence = smooth(1 - radial / influenceRadius);

            if (influence > 0) {
              const approach = smooth(clamp((-along + rock.radius * 1.2) / (rock.radius * 3.4), 0, 1));
              const sideBias = (rock.id % 2 ? 1 : -1) * 7;
              const side = Math.tanh(
                (across + sideBias) / (Math.min(rock.rx, rock.ry) * 0.28 + 11)
              );
              const lateral = base * influence * approach * 1.7;
              vx += basis.px * side * lateral;
              vy += basis.py * side * lateral;

              if (info.distance < 55) {
                const push = base * smooth(1 - info.distance / 55) * 1.25;
                vx += info.nx * push;
                vy += info.ny * push;
              }

              const wakeWidth = rock.ry * 2.8 + 34;
              if (along > 0 && along < rock.radius * 5.5 && Math.abs(across) < wakeWidth) {
                const downstream = smooth(1 - along / (rock.radius * 5.5));
                const crossFade = smooth(1 - Math.abs(across) / wakeWidth);
                const wake = downstream * crossFade * settings.turbulence;
                const curl = Math.sin(time * 0.0028 + along * 0.045 + rock.id * 2.1);
                vx += basis.px * curl * base * wake * 1.05;
                vy += basis.py * curl * base * wake * 1.05;
                turbulence = Math.max(turbulence, wake);
              }
            }

          }

          for (const gap of flowGaps) {
            const dx = x - gap.x;
            const dy = y - gap.y;
            const along = Math.abs(dx * basis.dx + dy * basis.dy);
            const across = Math.abs(dx * basis.px + dy * basis.py);
            if (along >= gap.alongRadius || across >= gap.acrossRadius) continue;
            const squeeze = smooth(1 - along / gap.alongRadius) *
              smooth(1 - across / gap.acrossRadius) * gap.strength;
            vx += basis.dx * base * squeeze * 0.86;
            vy += basis.dy * base * squeeze * 0.86;
            turbulence = Math.max(turbulence, squeeze * 0.28);
          }

          const meander = Math.sin(x * 0.011 + y * 0.007 + time * 0.00018 + seed) * base * 0.055;
          vx += basis.px * meander;
          vy += basis.py * meander;

          if (includeEddies) {
            for (const eddy of eddies) {
              const age = (time - eddy.born) / eddy.life;
              if (age >= 1) continue;
              const dx = x - eddy.x;
              const dy = y - eddy.y;
              const distance = Math.hypot(dx, dy) || 1;
              const force = smooth(1 - distance / eddy.radius) * (1 - age) * eddy.strength;
              vx += (-dy / distance) * force;
              vy += (dx / distance) * force;
              turbulence = Math.max(turbulence, force / 110);
            }
          }

          const depth = depthAt(x, y);
          const depthFactor = mix(0.52, 1.14, depth);
          vx *= depthFactor;
          vy *= depthFactor;
          return { vx, vy, speed: Math.hypot(vx, vy), turbulence: clamp(turbulence, 0, 1), depth };
        }

        function buildMaps() {
          const mapScale = settings.rockCount > 23 ? 7 : settings.rockCount > 19 ? 6 : MAP_SCALE;
          const mapWidth = Math.ceil(width / mapScale);
          const mapHeight = Math.ceil(height / mapScale);
          maps = {
            surface: makeMapCanvas(mapWidth, mapHeight, 'surface', mapScale),
            depth: makeMapCanvas(mapWidth, mapHeight, 'depth', mapScale),
            current: makeMapCanvas(mapWidth, mapHeight, 'current', mapScale),
          };
        }

        function makeMapCanvas(mapWidth, mapHeight, mode, mapScale) {
          const layer = document.createElement('canvas');
          layer.width = mapWidth;
          layer.height = mapHeight;
          const layerCtx = layer.getContext('2d', { alpha: false });
          const image = layerCtx.createImageData(mapWidth, mapHeight);
          const pixels = image.data;

          for (let y = 0; y < mapHeight; y++) {
            for (let x = 0; x < mapWidth; x++) {
              const px = (x + 0.5) * mapScale;
              const py = (y + 0.5) * mapScale;
              const depth = depthAt(px, py);
              const flow = sampleFlow(px, py, 0, false);
              const speed = clamp((flow.speed / Math.max(1, settings.flow) - 0.42) / 1.35, 0, 1);
              let color;
              if (mode === 'depth') {
                color = colorMix([242, 239, 224], [184, 211, 207], depth);
                const contour = Math.abs((depth * 8) % 1 - 0.5);
                if (contour > 0.45) color = colorMix(color, [46, 91, 103], 0.16);
              } else if (mode === 'current') {
                color = speed < 0.68
                  ? colorMix([231, 235, 222], [111, 168, 170], speed / 0.68)
                  : colorMix([111, 168, 170], [177, 76, 104], (speed - 0.68) / 0.32);
              } else {
                const water = colorMix([244, 241, 226], [224, 234, 226], depth);
                color = colorMix(water, [170, 204, 201], speed * 0.055);
              }
              const index = (y * mapWidth + x) * 4;
              pixels[index] = color[0];
              pixels[index + 1] = color[1];
              pixels[index + 2] = color[2];
              pixels[index + 3] = 255;
            }
          }
          layerCtx.putImageData(image, 0, 0);
          return layer;
        }

        function colorMix(a, b, t) {
          return [
            Math.round(mix(a[0], b[0], t)),
            Math.round(mix(a[1], b[1], t)),
            Math.round(mix(a[2], b[2], t)),
          ];
        }

        function makePetal(index, upstream = false) {
          const palette = PETAL_COLORS[index % PETAL_COLORS.length];
          const petal = {
            x: rand(0, width),
            y: rand(0, height),
            vx: 0,
            vy: 0,
            radius: rand(2.8, 5.4),
            z: rand(0, TAU),
            spin: rand(-0.07, 0.07),
            turnBias: rand(-0.035, 0.035),
            turnRate: rand(0.00012, 0.00034),
            tiltX: rand(-0.28, 0.28),
            tiltY: rand(-0.28, 0.28),
            speedScale: rand(0.62, 1.28),
            speedPulse: rand(0.04, 0.18),
            follow: rand(0.55, 1.55),
            lateralSlip: rand(-7.5, 7.5),
            wanderStrength: rand(2.5, 10.5),
            wanderRate: rand(0.0001, 0.00034),
            sampleOffsetX: rand(-22, 22),
            sampleOffsetY: rand(-22, 22),
            submerge: 0,
            submergeTarget: 0,
            submergeUntil: 0,
            phase: rand(0, TAU),
            palette,
          };
          if (upstream) placeUpstream(petal);
          return petal;
        }

        function syncPetals() {
          while (petals.length < settings.petals) petals.push(makePetal(petals.length, petals.length > 0));
          if (petals.length > settings.petals) petals.length = settings.petals;
        }

        function placeUpstream(petal) {
          const basis = flowBasis();
          const margin = 36;
          const targetX = rand(0, width);
          const targetY = rand(0, height);
          const distanceToVerticalEdge = basis.dx > 0.0001
            ? targetX / basis.dx
            : basis.dx < -0.0001
              ? (width - targetX) / -basis.dx
              : Infinity;
          const distanceToHorizontalEdge = basis.dy > 0.0001
            ? targetY / basis.dy
            : basis.dy < -0.0001
              ? (height - targetY) / -basis.dy
              : Infinity;
          const distanceUpstream = Math.min(distanceToVerticalEdge, distanceToHorizontalEdge) + margin;
          const speedScale = petal.speedScale ?? 1;
          petal.x = targetX - basis.dx * distanceUpstream;
          petal.y = targetY - basis.dy * distanceUpstream;
          petal.vx = basis.dx * settings.flow * speedScale;
          petal.vy = basis.dy * settings.flow * speedScale;
          petal.submerge = 0;
          petal.submergeTarget = 0;
        }

        function resetFlowParticles() {
          for (const petal of petals) placeUpstream(petal);
          for (const thread of threads) {
            placeUpstream(thread);
            thread.age = 0;
          }
        }

        function makeThreads() {
          const count = Math.round(clamp((width * height) / 14500, 42, 105));
          return Array.from({ length: count }, (_, index) => ({
            x: rand(0, width),
            y: rand(0, height),
            age: rand(0, 1),
            life: rand(2.8, 6.5),
            width: rand(0.45, 1.25),
            index,
          }));
        }

        function updatePetals(dt, time) {
          const dtSeconds = dt / 1000;
          for (const petal of petals) {
            const flow = sampleFlow(
              petal.x + petal.sampleOffsetX,
              petal.y + petal.sampleOffsetY,
              time
            );
            const basis = flowBasis();
            const slowWander = Math.sin(time * petal.wanderRate + petal.phase) +
              Math.sin(time * petal.wanderRate * 0.43 + petal.phase * 2.17) * 0.48;
            const pace = 1 + Math.sin(time * petal.wanderRate * 0.31 + petal.phase * 1.37) * petal.speedPulse;
            const lateral = petal.lateralSlip + slowWander * petal.wanderStrength;
            const targetVx = flow.vx * petal.speedScale * pace + basis.px * lateral;
            const targetVy = flow.vy * petal.speedScale * pace + basis.py * lateral;
            const response = 1 - Math.exp(-dtSeconds * petal.follow);
            petal.vx = mix(petal.vx, targetVx, response);
            petal.vy = mix(petal.vy, targetVy, response);

            const agitation = flow.turbulence * settings.turbulence;
            petal.vx += basis.px * Math.sin(time * 0.0011 + petal.phase) * agitation * 4.5 * dtSeconds;
            petal.vy += basis.py * Math.sin(time * 0.0011 + petal.phase) * agitation * 4.5 * dtSeconds;
            petal.x += petal.vx * dtSeconds;
            petal.y += petal.vy * dtSeconds;
            const targetSpin = clamp(
              petal.turnBias + Math.sin(time * petal.turnRate + petal.phase) * 0.055 +
                slowWander * agitation * 0.018,
              -0.16,
              0.16
            );
            petal.spin = mix(petal.spin, targetSpin, 1 - Math.exp(-dtSeconds * 0.72));
            petal.spin = clamp(petal.spin, -0.18, 0.18);
            petal.z += petal.spin * dtSeconds;
            const tiltEase = 1 - Math.exp(-dtSeconds * 0.34);
            petal.tiltX = mix(petal.tiltX, Math.sin(time * petal.turnRate * 0.57 + petal.phase) * 0.32, tiltEase);
            petal.tiltY = mix(petal.tiltY, Math.cos(time * petal.turnRate * 0.41 + petal.phase * 1.31) * 0.32, tiltEase);

            if (agitation > 0.36 && time > petal.submergeUntil && random() < agitation * dtSeconds * 0.42) {
              petal.submergeTarget = rand(0.55, 1);
              petal.submergeUntil = time + rand(650, 1900);
            }
            if (time > petal.submergeUntil) petal.submergeTarget = 0;
            petal.submerge = mix(petal.submerge, petal.submergeTarget, 1 - Math.exp(-dtSeconds * 2.5));

            keepPetalOffRocks(petal);
            if (petal.x < -95 || petal.x > width + 95 || petal.y < -95 || petal.y > height + 95) {
              placeUpstream(petal);
            }
          }

          resolvePetalCollisions();
        }

        function keepPetalOffRocks(petal) {
          for (const rock of rocks) {
            const info = rockInfo(petal.x, petal.y, rock);
            const clearance = petal.radius * (1 - petal.submerge * 0.55) + 2;
            if (info.distance < clearance) {
              const correction = clearance - info.distance;
              petal.x += info.nx * correction;
              petal.y += info.ny * correction;
              const inward = petal.vx * info.nx + petal.vy * info.ny;
              if (inward < 0) {
                petal.vx -= info.nx * inward * 1.08;
                petal.vy -= info.ny * inward * 1.08;
              }
              const tangent = info.nx * petal.vy - info.ny * petal.vx;
              petal.spin = clamp(petal.spin + Math.sign(tangent || 1) * 0.018, -0.18, 0.18);
            }
          }
        }

        function resolvePetalCollisions() {
          for (let i = 0; i < petals.length; i++) {
            const a = petals[i];
            if (a.submerge > 0.45) continue;
            for (let j = i + 1; j < petals.length; j++) {
              const b = petals[j];
              if (b.submerge > 0.45) continue;
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const distance = Math.hypot(dx, dy) || 0.01;
              const minimum = (a.radius + b.radius) * 0.72;
              if (distance >= minimum) continue;
              const nx = dx / distance;
              const ny = dy / distance;
              const overlap = (minimum - distance) * 0.5;
              a.x -= nx * overlap;
              a.y -= ny * overlap;
              b.x += nx * overlap;
              b.y += ny * overlap;
              const relative = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
              if (relative < 0) {
                const impulse = -relative * 0.28;
                a.vx -= nx * impulse;
                a.vy -= ny * impulse;
                b.vx += nx * impulse;
                b.vy += ny * impulse;
              }
              a.spin = clamp(a.spin - 0.012, -0.18, 0.18);
              b.spin = clamp(b.spin + 0.012, -0.18, 0.18);
            }
          }
        }

        function updateThreads(dt, time) {
          const dtSeconds = dt / 1000;
          for (const thread of threads) {
            const flow = sampleFlow(thread.x, thread.y, time);
            thread.x += flow.vx * dtSeconds * 1.1;
            thread.y += flow.vy * dtSeconds * 1.1;
            thread.age += dtSeconds / thread.life;
            if (thread.age > 1 || thread.x < -50 || thread.x > width + 50 || thread.y < -50 || thread.y > height + 50) {
              const replacement = { ...thread };
              placeUpstream(replacement);
              thread.x = replacement.x;
              thread.y = replacement.y;
              thread.age = 0;
              thread.life = rand(2.8, 6.5);
            }
          }
        }

        function drawBackground() {
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(maps[mapMode] || maps.surface, 0, 0, width, height);
          const minor = 36;
          const major = minor * 5;
          ctx.lineWidth = 0.55;
          for (let x = minor; x < width; x += minor) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.strokeStyle = x % major === 0
              ? 'rgba(43, 23, 32, 0.16)'
              : 'rgba(43, 23, 32, 0.065)';
            ctx.stroke();
          }
          for (let y = minor; y < height; y += minor) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.strokeStyle = y % major === 0
              ? 'rgba(43, 23, 32, 0.16)'
              : 'rgba(43, 23, 32, 0.065)';
            ctx.stroke();
          }
          ctx.setLineDash([5, 8]);
          ctx.strokeStyle = 'rgba(0, 88, 111, 0.17)';
          ctx.lineWidth = 0.75;
          ctx.beginPath();
          ctx.moveTo(width * 0.5, 0);
          ctx.lineTo(width * 0.5, height);
          ctx.moveTo(0, height * 0.5);
          ctx.lineTo(width, height * 0.5);
          ctx.stroke();
          ctx.restore();
        }

        function drawThreads(time) {
          if (mapMode === 'depth') return;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          for (const thread of threads) {
            let x = thread.x;
            let y = thread.y;
            const alpha = Math.sin(thread.age * Math.PI) * (mapMode === 'current' ? 0.72 : 0.42);
            ctx.beginPath();
            ctx.moveTo(x, y);
            for (let step = 0; step < 16; step++) {
              const flow = sampleFlow(x, y, time, false);
              const magnitude = flow.speed || 1;
              const spacing = mapMode === 'current' ? 5.2 : 4.4;
              x -= flow.vx / magnitude * spacing;
              y -= flow.vy / magnitude * spacing;
              ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `rgba(0, 82, 108, ${alpha})`;
            ctx.lineWidth = mapMode === 'current' ? thread.width : Math.max(0.55, thread.width * 0.74);
            ctx.stroke();

            if (thread.index % 5 === 0 && alpha > 0.12) {
              const flow = sampleFlow(thread.x, thread.y, time, false);
              const angle = Math.atan2(flow.vy, flow.vx);
              ctx.beginPath();
              ctx.moveTo(thread.x, thread.y);
              ctx.lineTo(
                thread.x - Math.cos(angle - 0.48) * 4.2,
                thread.y - Math.sin(angle - 0.48) * 4.2
              );
              ctx.moveTo(thread.x, thread.y);
              ctx.lineTo(
                thread.x - Math.cos(angle + 0.48) * 4.2,
                thread.y - Math.sin(angle + 0.48) * 4.2
              );
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function rockPath(rock) {
          ctx.beginPath();
          for (let i = 0; i < rock.points.length; i++) {
            const point = rock.points[i];
            const x = Math.cos(point.angle) * rock.rx * point.roughness;
            const y = Math.sin(point.angle) * rock.ry * point.roughness;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
        }

        function drawRocks() {
          for (const rock of rocks) {
            ctx.save();
            ctx.translate(rock.x, rock.y);
            ctx.rotate(rock.rotation);
            rockPath(rock);
            ctx.fillStyle = rock.colors[0];
            ctx.fill();
            ctx.strokeStyle = rock.colors[1];
            ctx.lineWidth = 1.35;
            ctx.stroke();

            ctx.save();
            rockPath(rock);
            ctx.clip();
            for (const fleck of rock.flecks) {
              ctx.beginPath();
              const x = fleck.x * rock.rx;
              const y = fleck.y * rock.ry;
              ctx.moveTo(x - fleck.r * 1.6, y + fleck.r * 0.45);
              ctx.lineTo(x + fleck.r * 1.6, y - fleck.r * 0.45);
              ctx.strokeStyle = `rgba(52, 42, 45, ${0.22 + fleck.alpha})`;
              ctx.lineWidth = 0.55;
              ctx.stroke();
            }
            ctx.restore();

            for (const scale of [0.78, 0.56]) {
              ctx.save();
              ctx.scale(scale, scale);
              rockPath(rock);
              ctx.strokeStyle = scale > 0.7
                ? 'rgba(52, 42, 45, 0.34)'
                : 'rgba(52, 42, 45, 0.2)';
              ctx.lineWidth = 0.7 / scale;
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();

            if (rock.radius > 47) {
              ctx.save();
              ctx.fillStyle = 'rgba(43, 23, 32, 0.7)';
              ctx.font = '7px "SFMono-Regular", Consolas, monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(`R${String(rock.id + 1).padStart(2, '0')}`, rock.x, rock.y);
              ctx.restore();
            }
          }
        }

        function drawPetal(petal, underwater) {
          const isUnder = petal.submerge > 0.08;
          if (underwater !== isUnder) return;
          const flip = Math.cos(petal.tiltX) * Math.cos(petal.tiltY);
          const sx = 0.24 + Math.abs(Math.cos(petal.tiltY)) * 0.76;
          const sy = 0.3 + Math.abs(Math.cos(petal.tiltX)) * 0.7;
          const scale = 1 - petal.submerge * 0.3;
          const radius = petal.radius;

          ctx.save();
          ctx.translate(petal.x + petal.submerge * 3, petal.y + petal.submerge * 5);
          ctx.rotate(petal.z);
          ctx.scale(sx * scale, sy * scale);
          ctx.globalAlpha = isUnder ? mix(0.44, 0.12, petal.submerge) : 0.88;
          ctx.beginPath();
          ctx.moveTo(0, -radius * 1.2);
          ctx.bezierCurveTo(radius * 1.05, -radius * 0.82, radius * 1.02, radius * 0.4, 0, radius * 1.25);
          ctx.bezierCurveTo(-radius * 1.02, radius * 0.4, -radius * 1.05, -radius * 0.82, 0, -radius * 1.2);
          ctx.fillStyle = isUnder ? '#759ba0' : (flip < 0 ? petal.palette[1] : petal.palette[0]);
          ctx.fill();
          ctx.strokeStyle = isUnder ? 'rgba(0,82,108,0.44)' : petal.palette[1];
          ctx.lineWidth = 0.55;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.86);
          ctx.quadraticCurveTo(radius * 0.1, 0, 0, radius * 0.96);
          ctx.strokeStyle = isUnder ? 'rgba(241,238,223,0.45)' : 'rgba(246,234,221,0.68)';
          ctx.lineWidth = 0.45;
          ctx.stroke();
          ctx.restore();
        }

        function drawEddies(time) {
          ctx.save();
          for (const eddy of eddies) {
            const age = (time - eddy.born) / eddy.life;
            if (age < 0 || age >= 1) continue;
            const radius = mix(8, eddy.radius, smooth(age));
            for (let ring = 0; ring < 3; ring++) {
              ctx.beginPath();
              ctx.arc(
                eddy.x,
                eddy.y,
                radius * (0.5 + ring * 0.24),
                0.2 + age * 3 + ring * 0.4,
                Math.PI * 1.58 + age * 4.5 + ring * 0.4
              );
              ctx.strokeStyle = `rgba(0, 82, 108, ${(1 - age) * (0.36 - ring * 0.07)})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function drawDirectionGlyph() {
          const basis = flowBasis();
          const x = width - 46;
          const y = height - 48;
          const length = 25;
          ctx.save();
          ctx.translate(x, y);
          ctx.strokeStyle = 'rgba(43, 23, 32, 0.72)';
          ctx.fillStyle = 'rgba(43, 23, 32, 0.72)';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(0, 0, 17, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-basis.dx * length * 0.5, -basis.dy * length * 0.5);
          ctx.lineTo(basis.dx * length * 0.5, basis.dy * length * 0.5);
          ctx.stroke();
          ctx.translate(basis.dx * length * 0.5, basis.dy * length * 0.5);
          ctx.rotate(Math.atan2(basis.dy, basis.dx));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-5, -2.8);
          ctx.lineTo(-5, 2.8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.fillStyle = 'rgba(43, 23, 32, 0.72)';
          ctx.font = '8px "SFMono-Regular", Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${String(settings.direction).padStart(3, '0')}°`, x, y + 31);
          ctx.restore();
        }

        function render(time, dt) {
          drawBackground();
          if (mapMode === 'surface') {
            for (const petal of petals) drawPetal(petal, true);
          }
          drawThreads(time);
          drawRocks();
          if (mapMode === 'surface') {
            for (const petal of petals) drawPetal(petal, false);
            drawEddies(time);
          }

          drawDirectionGlyph();

          if (mapMode !== 'surface') {
            ctx.save();
            ctx.fillStyle = 'rgba(43, 23, 32, 0.72)';
            ctx.font = '10px "SFMono-Regular", Consolas, monospace';
            ctx.fillText(mapMode === 'depth' ? 'DEPTH FIELD / ISO 08' : 'FLOW MAGNITUDE / VECTOR', 17, height - 19);
            ctx.restore();
          }
        }

        function animate(time) {
          const dt = clamp(time - lastTime, 0, 34);
          lastTime = time;
          eddies = eddies.filter(eddy => time - eddy.born < eddy.life);
          if (!reducedMotion || !reducedMotion.matches) {
            updatePetals(dt, time);
            updateThreads(dt, time);
          }
          render(time, dt);
          animationFrame = requestAnimationFrame(animate);
        }

        function directionLabel(degrees) {
          const names = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
          return `${degrees}° ${names[Math.round(degrees / 45) % 8]}`;
        }

        function scheduleMapBuild() {
          clearTimeout(mapTimer);
          mapTimer = setTimeout(buildMaps, 90);
        }

        function scheduleCompose() {
          clearTimeout(composeTimer);
          composeTimer = setTimeout(compose, 130);
        }

        function bindRange(input, onInput, format) {
          const row = input.closest('.range-row');
          const output = row.querySelector('output');
          function update() {
            const value = Number(input.value);
            const progress = (value - Number(input.min)) / (Number(input.max) - Number(input.min));
            row.style.setProperty('--progress', `${progress * 100}%`);
            output.textContent = format(value);
            onInput(value);
          }
          input.addEventListener('input', update);
          update();
        }

        bindRange(directionInput, value => {
          settings.direction = value;
          computeFlowGaps();
          resetFlowParticles();
          scheduleMapBuild();
        }, directionLabel);
        bindRange(flowInput, value => {
          settings.flow = value;
          scheduleMapBuild();
        }, value => `${value} px/s`);
        bindRange(petalInput, value => {
          settings.petals = value;
          syncPetals();
        }, value => String(value));
        bindRange(turbulenceInput, value => {
          settings.turbulence = value / 100;
        }, value => `${value}%`);
        bindRange(rockCountInput, value => {
          settings.rockCount = value;
          scheduleCompose();
        }, value => String(value));
        bindRange(rockScaleInput, value => {
          settings.rockScale = value / 100;
          scheduleCompose();
        }, value => `${value}%`);
        bindRange(rockGroupingInput, value => {
          settings.rockGrouping = value / 100;
          scheduleCompose();
        }, value => `${value}%`);
        bindRange(rockSpacingInput, value => {
          settings.rockSpacing = value / 100;
          scheduleCompose();
        }, value => `${value}%`);

        mapButtons.forEach(button => {
          button.addEventListener('click', () => {
            mapMode = button.dataset.map;
            mapButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          });
        });

        reseedButton.addEventListener('click', () => {
          seed = ((seed + 0x9e3779b9) ^ (Date.now() & 0xffffffff)) >>> 0;
          compose();
        });

        collapseButton.addEventListener('click', () => {
          const collapsed = panel.classList.toggle('is-collapsed');
          collapseButton.textContent = collapsed ? '+' : '−';
          collapseButton.setAttribute('aria-expanded', String(!collapsed));
          collapseButton.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
        });

        panelHeader.addEventListener('pointerdown', event => {
          if (event.target.closest('button')) return;
          const rect = panel.getBoundingClientRect();
          panelDrag = { pointerId: event.pointerId, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top };
          panel.classList.add('is-dragging');
          panelHeader.setPointerCapture(event.pointerId);
        });

        panelHeader.addEventListener('pointermove', event => {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          const rect = panel.getBoundingClientRect();
          const left = clamp(event.clientX - panelDrag.offsetX, 8, width - rect.width - 8);
          const top = clamp(event.clientY - panelDrag.offsetY, 8, height - rect.height - 8);
          panel.style.left = `${left}px`;
          panel.style.top = `${top}px`;
        });

        function endPanelDrag(event) {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          panelDrag = null;
          panel.classList.remove('is-dragging');
          if (panelHeader.hasPointerCapture(event.pointerId)) panelHeader.releasePointerCapture(event.pointerId);
        }
        panelHeader.addEventListener('pointerup', endPanelDrag);
        panelHeader.addEventListener('pointercancel', endPanelDrag);

        canvas.addEventListener('pointerdown', event => {
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          eddies.push({ x, y, born: performance.now(), life: rand(1500, 2800), radius: rand(75, 135), strength: rand(75, 125) });
          if (eddies.length > 7) eddies.shift();
        });

        window.addEventListener('keydown', event => {
          if (event.target.matches('input, button')) return;
          if (event.key.toLowerCase() === 'r') {
            event.preventDefault();
            reseedButton.click();
          }
        });

        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resize, 130);
        });

        if (reducedMotion && typeof reducedMotion.addEventListener === 'function') {
          reducedMotion.addEventListener('change', () => { lastTime = performance.now(); });
        }

        resize();
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
