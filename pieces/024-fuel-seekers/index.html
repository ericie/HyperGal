<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Sixty bubbles spend their fuel moving among ten four-port diamond stations embedded in a marbled oil field."
    />
    <title>Fuel Seekers · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #1f201e;
        --focus: #f2ad61;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -7px;
      }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Fuel Seekers: sixty round bubbles with vertical fuel levels travel among ten diamond fuel stations placed over a low-contrast marbled oil field. Each station shows its own flat fuel level and has four corner attachment points, allowing as many as four bubbles to refill at once. Full bubbles travel toward the farthest station-free parts of the field, drawing fine vine-like ribbons that grow from dark brown to bright blue as they accelerate. At one-quarter fuel they take a direct path to an open station corner while their ribbons slowly shift from blue through orange to dark brown. Trails fade slowly, and a bubble that runs dry pops in a pale burst, erases nearby ribbons, and is permanently gone. Filling a bubble burns away the vein beneath its station; exhausted deposits cannot host another station. Press R to reseed the field."
    ></canvas>
    <p id="status" class="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.getElementById('status');
        const fieldCanvas = document.createElement('canvas');
        const fieldCtx = fieldCanvas.getContext('2d', { alpha: false });
        const trailCanvas = document.createElement('canvas');
        const trailCtx = trailCanvas.getContext('2d');
        const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
        const params = new URLSearchParams(location.search);

        const TAU = Math.PI * 2;
        const STATION_PORTS = [
          { x: 0, y: -1 },
          { x: 1, y: 0 },
          { x: 0, y: 1 },
          { x: -1, y: 0 }
        ];
        const BUBBLE_COUNT = 60;
        const STATION_COUNT = 10;
        const REFUEL_THRESHOLD = 0.25;
        const COLLISION_GAP = 1.5;
        const COLLISION_PASSES = 6;
        const TRAIL_FADE_SECONDS = 52;
        const TRAIL_FADE_INTERVAL = 0.18;
        const FIELD_BASE = [31, 32, 30];
        const OIL_TINT = [25, 20, 8];
        const TRAIL_BROWN = [70, 42, 27];
        const TRAIL_BLUE = [55, 184, 231];
        const TRAIL_ORANGE = [232, 118, 45];

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let stations = [];
        let bubbles = [];
        let pops = [];
        let stationPops = [];
        let depletedPatches = [];
        let pendingStations = [];
        let resourceCandidates = [];
        let lastFrameAt = 0;
        let nextBubbleId = 1;
        let nextStationId = 1;
        let popCount = 0;
        let raf = 0;
        let trailFadeElapsed = 0;
        let noiseOffsetX = 0;
        let noiseOffsetY = 0;
        let fieldRotation = 0;
        let fieldScale = 4.8;

        configureField();
        resize(true);
        bindEvents();
        raf = requestAnimationFrame(frame);

        function bindEvents() {
          addEventListener('resize', () => resize(false), { passive: true });
          canvas.addEventListener('pointerdown', () => {
            canvas.focus({ preventScroll: true });
          });
          canvas.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') reseed();
          });
          document.addEventListener('visibilitychange', () => {
            lastFrameAt = 0;
            if (!document.hidden && !raf) raf = requestAnimationFrame(frame);
          });
          if (typeof motionQuery.addEventListener === 'function') {
            motionQuery.addEventListener('change', () => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          } else if (typeof motionQuery.addListener === 'function') {
            motionQuery.addListener(() => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          }
        }

        function reseed() {
          const seedToken = Math.floor(Math.random() * 0x7fffffff).toString(36);
          seed = hashString(seedToken);
          random = mulberry32(seed);
          const url = new URL(location.href);
          url.searchParams.set('seed', seedToken);
          history.replaceState(null, '', url);
          configureField();
          buildScene();
          popCount = 0;
          status.textContent = `New oil field ${String(seed % 10000).padStart(4, '0')}`;
          if (!raf) raf = requestAnimationFrame(frame);
        }

        function resize(firstRun) {
          const nextWidth = Math.max(1, innerWidth);
          const nextHeight = Math.max(1, innerHeight);
          if (!firstRun && nextWidth === width && nextHeight === height) return;

          width = nextWidth;
          height = nextHeight;
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildScene();
        }

        function configureField() {
          const fieldRandom = mulberry32(seed ^ 0x91e10da5);
          noiseOffsetX = (fieldRandom() - 0.5) * 34;
          noiseOffsetY = (fieldRandom() - 0.5) * 34;
          fieldRotation = 0.22 + fieldRandom() * 0.82;
          fieldScale = 4.25 + fieldRandom() * 1.5;
        }

        function buildScene() {
          random = mulberry32(seed ^ 0x6c8e9cf5);
          buildFieldTexture();
          resetTrailCanvas();
          depletedPatches = [];
          pendingStations = [];
          stationPops = [];
          stations = [];
          bubbles = [];
          pops = [];
          nextBubbleId = 1;
          nextStationId = 1;
          placeStations();

          for (let i = 0; i < BUBBLE_COUNT; i += 1) {
            bubbles.push(createBubble(i));
          }

          for (let i = 0; i < Math.min(STATION_COUNT, bubbles.length); i += 1) {
            const bubble = bubbles[i];
            const station = stations[i];
            bubble.state = 'filling';
            bubble.station = station;
            bubble.target = station;
            bubble.fuel = 0.16 + random() * 0.72;
            bubble.fillRate = 0.25 + random() * 0.24;
            bubble.dockPort = chooseOpenPort(station, bubble);
            const dock = bubbleDockPosition(bubble, station);
            bubble.x = dock.x;
            bubble.y = dock.y;
            bubble.vx = 0;
            bubble.vy = 0;
            station.occupants[bubble.dockPort] = bubble;
          }

          for (let i = STATION_COUNT; i < bubbles.length; i += 1) {
            chooseTarget(bubbles[i], true);
          }

          resolveSceneCollisions(false, COLLISION_PASSES * 2);
          draw();
        }

        function resetTrailCanvas() {
          trailCanvas.width = canvas.width;
          trailCanvas.height = canvas.height;
          trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          trailCtx.lineCap = 'round';
          trailCtx.lineJoin = 'round';
          trailFadeElapsed = 0;
        }

        function buildFieldTexture() {
          const longest = Math.max(width, height);
          const scale = Math.min(0.72, 680 / longest);
          const textureWidth = Math.max(240, Math.round(width * scale));
          const textureHeight = Math.max(180, Math.round(height * scale));
          fieldCanvas.width = textureWidth;
          fieldCanvas.height = textureHeight;

          const image = fieldCtx.createImageData(textureWidth, textureHeight);
          const data = image.data;

          for (let y = 0; y < textureHeight; y += 1) {
            const ny = (y + 0.5) / textureHeight;
            for (let x = 0; x < textureWidth; x += 1) {
              const nx = (x + 0.5) / textureWidth;
              const sample = fieldAt(nx, ny);
              const cloud = sample.cloud - 0.5;
              const oil = sample.resource;
              const mineral = (hash2(x + 711, y - 193) - 0.5) * 1.9;
              const index = (y * textureWidth + x) * 4;

              data[index] = clampByte(
                FIELD_BASE[0] + cloud * 8.0 + oil * OIL_TINT[0] + mineral
              );
              data[index + 1] = clampByte(
                FIELD_BASE[1] + cloud * 7.2 + oil * OIL_TINT[1] + mineral
              );
              data[index + 2] = clampByte(
                FIELD_BASE[2] + cloud * 6.2 + oil * OIL_TINT[2] + mineral * 0.7
              );
              data[index + 3] = 255;
            }
          }

          fieldCtx.putImageData(image, 0, 0);
        }

        function fieldAt(nx, ny) {
          const aspect = width / Math.max(1, height);
          let px = (nx - 0.5) * aspect;
          let py = ny - 0.5;
          const cosine = Math.cos(fieldRotation);
          const sine = Math.sin(fieldRotation);
          const turnedX = (cosine * px - sine * py) * fieldScale;
          const turnedY = (sine * px + cosine * py) * fieldScale;
          px = turnedX;
          py = turnedY;

          const qx = fbm(px * 0.62 + noiseOffsetX, py * 0.62 + noiseOffsetY);
          const qy = fbm(
            px * 0.62 + noiseOffsetX + 5.2,
            py * 0.62 + noiseOffsetY + 1.3
          );
          const rx = fbm(
            px + qx * 2.35 + noiseOffsetX * 0.3,
            py + qy * 2.35 + noiseOffsetY * 0.3
          );
          const ry = fbm(
            px + qy * 2.05 + 8.3,
            py + qx * 2.05 + 2.8
          );
          const folds = fbm(
            px * 0.82 + rx * 3.1 + qx * 0.8,
            py * 0.82 + ry * 3.1 + qy * 0.8
          );
          const current = folds * 1.82 + rx * 0.84 + qy * 0.31 + py * 0.055;
          const distance = Math.abs(Math.sin(current * 7.15));
          const vein = 1 - smoothstep(0.075, 0.31, distance);
          const halo = 1 - smoothstep(0.075, 0.61, distance);
          const secondary = Math.abs(
            Math.sin((fbm(px * 1.56 + ry * 2.4, py * 1.56 + rx * 2.4) * 1.5 + folds * 0.8) * 10.8 + 1.7)
          );
          const hairline = (1 - smoothstep(0.025, 0.105, secondary)) *
            smoothstep(0.2, 0.82, folds);
          const cloud = fbm(px * 0.34 + 17, py * 0.34 + 17);
          const resource = clamp(
            vein * 0.58 + halo * 0.27 + hairline * 0.12 + Math.pow(folds, 2.2) * 0.16,
            0,
            1
          );
          return { resource, cloud };
        }

        function placeStations() {
          resourceCandidates = [];
          const marginX = Math.min(0.11, 62 / Math.max(1, width));
          const marginY = Math.min(0.11, 62 / Math.max(1, height));
          const stationRandom = mulberry32(seed ^ 0x27d4eb2d);

          for (let i = 0; i < 1800; i += 1) {
            const nx = marginX + stationRandom() * (1 - marginX * 2);
            const ny = marginY + stationRandom() * (1 - marginY * 2);
            const sample = fieldAt(nx, ny);
            resourceCandidates.push({
              nx,
              ny,
              value: sample.resource + stationRandom() * 0.018,
              burned: false
            });
          }

          resourceCandidates.sort((a, b) => b.value - a.value);
          const selected = [];
          while (selected.length < STATION_COUNT) {
            const point = pickResourcePoint(selected, false);
            if (!point) break;
            selected.push(point);
          }
          stations = selected.map((point) => createStation(point, false));
        }

        function pickResourcePoint(extraPoints = [], respectDepletion = true) {
          const occupied = stations.concat(extraPoints);
          const baseSeparation = Math.min(width, height) * 0.16;
          const relaxations = [1, 0.8, 0.62, 0.46, 0.32];

          for (const relaxation of relaxations) {
            for (const candidate of resourceCandidates) {
              if (candidate.burned) continue;
              const x = candidate.nx * width;
              const y = candidate.ny * height;
              const awayFromStations = occupied.every((other) => {
                const otherX = other.x ?? other.nx * width;
                const otherY = other.y ?? other.ny * height;
                return Math.hypot(x - otherX, y - otherY) >= baseSeparation * relaxation;
              });
              if (!awayFromStations) continue;

              if (respectDepletion) {
                const untouched = depletedPatches.every((patch) =>
                  Math.hypot(x - patch.x, y - patch.y) >=
                    patch.radius * (0.72 + relaxation * 0.35)
                );
                if (!untouched) continue;
              }
              return candidate;
            }
          }
          return null;
        }

        function createStation(point, entering) {
          const size = clamp(Math.min(width, height) * 0.022, 11, 18);
          const capacity = 3.6 + point.value * 2.8 + random() * 1.2;
          return {
            id: nextStationId++,
            x: point.nx * width,
            y: point.ny * height,
            nx: point.nx,
            ny: point.ny,
            resource: point.value,
            size,
            occupants: Array(STATION_PORTS.length).fill(null),
            phase: random() * TAU,
            capacity,
            remaining: capacity,
            flowAngle: fieldTangent(point.nx, point.ny),
            eraseColor: fieldBaseColor(point.nx, point.ny),
            birth: entering ? 0 : 1
          };
        }

        function fieldTangent(nx, ny) {
          const epsilon = 0.004;
          const left = fieldAt(clamp(nx - epsilon, 0, 1), ny).resource;
          const right = fieldAt(clamp(nx + epsilon, 0, 1), ny).resource;
          const above = fieldAt(nx, clamp(ny - epsilon, 0, 1)).resource;
          const below = fieldAt(nx, clamp(ny + epsilon, 0, 1)).resource;
          return Math.atan2(right - left, above - below);
        }

        function fieldBaseColor(nx, ny) {
          const cloud = fieldAt(nx, ny).cloud - 0.5;
          return [
            clampByte(FIELD_BASE[0] + cloud * 8),
            clampByte(FIELD_BASE[1] + cloud * 7.2),
            clampByte(FIELD_BASE[2] + cloud * 6.2)
          ];
        }

        function createBubble(index = 0) {
          const radius = 9 + Math.pow(random(), 1.3) * 12;
          const speedBase = clamp(Math.min(width, height) * 0.058, 25, 52);
          const bubble = {
            id: nextBubbleId++,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius,
            speed: speedBase * (0.72 + random() * 0.62),
            fuel: 0.22 + random() * 0.76,
            range: Math.max(width, height) * (0.7 + random() * 0.46),
            state: 'travel',
            station: null,
            target: null,
            retargetIn: 0,
            fillRate: 0.27 + random() * 0.21,
            dockPort: null,
            age: random() * 14,
            phase: random() * TAU,
            wobble: 0.7 + random() * 1.2,
            trailX: null,
            trailY: null,
            trailNormalX: null,
            trailNormalY: null,
            trailWidth: null,
            vineDistance: 0,
            nextLeafAt: 54 + random() * 46,
            leafSide: random() < 0.5 ? -1 : 1,
            escapeX: null,
            escapeY: null,
            returning: false,
            returnProgress: 0,
            returnLegStart: 1,
            returnLegBase: 0,
            returnTargetId: null,
            dead: false
          };

          bubble.x = width * (0.06 + random() * 0.88);
          bubble.y = height * (0.06 + random() * 0.88);
          const angle = random() * TAU;
          bubble.vx = Math.cos(angle) * bubble.speed * 0.45;
          bubble.vy = Math.sin(angle) * bubble.speed * 0.45;

          bubble.phase += index * 0.11;
          if (bubble.fuel > REFUEL_THRESHOLD) chooseEscapePoint(bubble);
          return bubble;
        }

        function chooseEscapePoint(bubble) {
          const margin = bubble.radius + 24;
          const candidates = [
            { x: margin, y: margin },
            { x: width - margin, y: margin },
            { x: width - margin, y: height - margin },
            { x: margin, y: height - margin }
          ];

          for (let i = 0; i < 24; i += 1) {
            candidates.push({
              x: margin + random() * Math.max(1, width - margin * 2),
              y: margin + random() * Math.max(1, height - margin * 2)
            });
          }

          let best = candidates[0];
          let bestScore = -Infinity;
          for (const candidate of candidates) {
            const nearestStation = stations.length
              ? Math.min(...stations.map((station) =>
                  Math.hypot(candidate.x - station.x, candidate.y - station.y)
                ))
              : Math.hypot(candidate.x - width * 0.5, candidate.y - height * 0.5);
            const travelDistance = Math.hypot(candidate.x - bubble.x, candidate.y - bubble.y);
            const sourceDistance = bubble.station
              ? Math.hypot(candidate.x - bubble.station.x, candidate.y - bubble.station.y)
              : travelDistance;
            const destinationSeparation = bubbles.length
              ? Math.min(...bubbles
                  .filter((other) => other !== bubble && other.escapeX !== null)
                  .map((other) => Math.hypot(candidate.x - other.escapeX, candidate.y - other.escapeY))
                  .concat(Math.min(width, height)))
              : Math.min(width, height);
            const crowdedDestination =
              destinationSeparation < Math.min(width, height) * 0.16
                ? Math.min(width, height) * 0.7
                : 0;
            const score =
              nearestStation * 0.72 +
              sourceDistance * 0.2 +
              travelDistance * 0.04 +
              destinationSeparation * 0.62 -
              crowdedDestination +
              random() * Math.min(width, height) * 0.025;
            if (score > bestScore) {
              best = candidate;
              bestScore = score;
            }
          }

          bubble.escapeX = best.x;
          bubble.escapeY = best.y;
        }

        function chooseTarget(bubble, avoidCurrent) {
          if (bubble.fuel > REFUEL_THRESHOLD) {
            bubble.target = null;
            bubble.retargetIn = 0.5 + random() * 0.8;
            return;
          }

          const available = stations.filter((station) =>
            stationHasOpenPort(station) &&
            station.remaining > 0 &&
            station.birth >= 0.68 &&
            (!avoidCurrent || station !== bubble.station)
          );
          if (!available.length) {
            bubble.target = null;
            bubble.retargetIn = 0.12 + random() * 0.24;
            return;
          }

          let best = available[0];
          let bestScore = Infinity;
          for (const station of available) {
            const distance = Math.hypot(station.x - bubble.x, station.y - bubble.y);
            const crowding = bubbles.reduce((count, other) =>
              count + (other !== bubble && other.state === 'travel' && other.target === station ? 1 : 0), 0
            );
            const score = distance * (0.88 + random() * 0.22) + crowding * station.size * 1.9;
            if (score < bestScore) {
              best = station;
              bestScore = score;
            }
          }
          bubble.target = best;
          bubble.retargetIn = 0.7 + random() * 0.8;
        }

        function frame(time) {
          raf = 0;
          if (document.hidden) return;

          if (!lastFrameAt) lastFrameAt = time;
          const dt = Math.min(0.04, Math.max(0, (time - lastFrameAt) / 1000));
          lastFrameAt = time;

          if (!motionQuery.matches) update(dt);
          draw();

          if (!motionQuery.matches) raf = requestAnimationFrame(frame);
        }

        function update(dt) {
          updateStations(dt);

          for (let i = 0; i < bubbles.length; i += 1) {
            const bubble = bubbles[i];
            bubble.age += dt;

            if (bubble.state === 'filling') {
              updateFillingBubble(bubble, dt);
            } else {
              updateTravelingBubble(bubble, dt);
            }

            if (bubble.dead) {
              bubbles.splice(i, 1);
              i -= 1;
            }
          }

          resolveSceneCollisions(true, COLLISION_PASSES);
          updateBubbleTrails(dt);

          for (let i = pops.length - 1; i >= 0; i -= 1) {
            pops[i].age += dt;
            eraseTrailsForPop(pops[i]);
            if (pops[i].age >= pops[i].duration) pops.splice(i, 1);
          }

          for (let i = stationPops.length - 1; i >= 0; i -= 1) {
            stationPops[i].age += dt;
            if (stationPops[i].age >= stationPops[i].duration) stationPops.splice(i, 1);
          }
        }

        function updateBubbleTrails(dt) {
          trailFadeElapsed += dt;
          if (trailFadeElapsed >= TRAIL_FADE_INTERVAL) {
            const fadeAlpha = 1 - Math.exp(-trailFadeElapsed / TRAIL_FADE_SECONDS);
            trailCtx.save();
            trailCtx.globalCompositeOperation = 'destination-out';
            trailCtx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
            trailCtx.fillRect(0, 0, width, height);
            trailCtx.restore();
            trailFadeElapsed = 0;
          }

          for (const bubble of bubbles) {
            if (bubble.dead || bubble.state !== 'travel') {
              bubble.trailX = null;
              bubble.trailY = null;
              bubble.trailNormalX = null;
              bubble.trailNormalY = null;
              bubble.trailWidth = null;
              continue;
            }

            if (bubble.trailX === null || bubble.trailY === null) {
              bubble.trailX = bubble.x;
              bubble.trailY = bubble.y;
              bubble.trailNormalX = null;
              bubble.trailNormalY = null;
              bubble.trailWidth = null;
              continue;
            }

            const moved = Math.hypot(bubble.x - bubble.trailX, bubble.y - bubble.trailY);
            if (moved < 0.35) continue;

            bubble.vineDistance += moved;
            const growLeaf =
              !bubble.returning &&
              bubble.fuel > REFUEL_THRESHOLD &&
              bubble.vineDistance >= bubble.nextLeafAt;
            drawRibbonSegment(
              bubble,
              bubble.trailX,
              bubble.trailY,
              bubble.x,
              bubble.y,
              growLeaf
            );
            if (growLeaf) {
              bubble.nextLeafAt += 62 + bubble.radius * 2.2 + random() * 34;
              bubble.leafSide *= -1;
            }
            bubble.trailX = bubble.x;
            bubble.trailY = bubble.y;
          }
        }

        function drawRibbonSegment(bubble, fromX, fromY, toX, toY, growLeaf) {
          const dx = toX - fromX;
          const dy = toY - fromY;
          const length = Math.max(0.001, Math.hypot(dx, dy));
          let normalX = -dy / length;
          let normalY = dx / length;
          let fromNormalX = bubble.trailNormalX ?? normalX;
          let fromNormalY = bubble.trailNormalY ?? normalY;
          if (normalX * fromNormalX + normalY * fromNormalY < 0) {
            normalX *= -1;
            normalY *= -1;
          }
          const normalBlend = 0.34;
          normalX = fromNormalX * (1 - normalBlend) + normalX * normalBlend;
          normalY = fromNormalY * (1 - normalBlend) + normalY * normalBlend;
          const normalLength = Math.max(0.001, Math.hypot(normalX, normalY));
          normalX /= normalLength;
          normalY /= normalLength;
          const seeking = bubble.returning || bubble.fuel <= REFUEL_THRESHOLD;
          const breathing = 0.9 + Math.sin(bubble.phase + bubble.age * 0.48) * 0.1;
          const baseHalfWidth = seeking
            ? Math.max(0.38, bubble.radius * 0.025)
            : Math.max(0.58, bubble.radius * 0.042);
          const halfWidth = baseHalfWidth * breathing;
          const fromHalfWidth = bubble.trailWidth ?? halfWidth;
          const baseColor = trailColorForBubble(bubble);
          const shadowColor = mixRgb(baseColor, [14, 17, 15], 0.34);
          const lightColor = mixRgb(baseColor, [224, 238, 230], 0.3);
          const gradient = trailCtx.createLinearGradient(
            fromX - normalX * halfWidth,
            fromY - normalY * halfWidth,
            fromX + normalX * halfWidth,
            fromY + normalY * halfWidth
          );

          gradient.addColorStop(0, colorStyle(shadowColor, seeking ? 0.32 : 0.38));
          gradient.addColorStop(0.43, colorStyle(baseColor, seeking ? 0.58 : 0.64));
          gradient.addColorStop(0.7, colorStyle(lightColor, seeking ? 0.4 : 0.5));
          gradient.addColorStop(1, colorStyle(shadowColor, seeking ? 0.24 : 0.3));

          trailCtx.fillStyle = gradient;
          trailCtx.beginPath();
          trailCtx.moveTo(
            fromX - fromNormalX * fromHalfWidth,
            fromY - fromNormalY * fromHalfWidth
          );
          trailCtx.lineTo(toX - normalX * halfWidth, toY - normalY * halfWidth);
          trailCtx.lineTo(toX + normalX * halfWidth, toY + normalY * halfWidth);
          trailCtx.lineTo(
            fromX + fromNormalX * fromHalfWidth,
            fromY + fromNormalY * fromHalfWidth
          );
          trailCtx.closePath();
          trailCtx.fill();

          trailCtx.strokeStyle = colorStyle(lightColor, seeking ? 0.26 : 0.34);
          trailCtx.lineWidth = seeking ? 0.2 : 0.28;
          trailCtx.beginPath();
          trailCtx.moveTo(
            fromX + fromNormalX * fromHalfWidth * 0.38,
            fromY + fromNormalY * fromHalfWidth * 0.38
          );
          trailCtx.lineTo(
            toX + normalX * halfWidth * 0.38,
            toY + normalY * halfWidth * 0.38
          );
          trailCtx.stroke();

          if (growLeaf) {
            drawVineLeaf(
              bubble,
              (fromX + toX) * 0.5,
              (fromY + toY) * 0.5,
              Math.atan2(dy, dx),
              normalX,
              normalY,
              baseColor
            );
          }

          bubble.trailNormalX = normalX;
          bubble.trailNormalY = normalY;
          bubble.trailWidth = halfWidth;
        }

        function trailColorForBubble(bubble) {
          if (bubble.returning || bubble.fuel <= REFUEL_THRESHOLD) {
            const progress = smoothstep(0, 1, bubble.returnProgress);
            if (progress < 0.56) {
              return mixRgb(TRAIL_BLUE, TRAIL_ORANGE, progress / 0.56);
            }
            return mixRgb(TRAIL_ORANGE, TRAIL_BROWN, (progress - 0.56) / 0.44);
          }

          const speed = Math.hypot(bubble.vx, bubble.vy);
          const speedProgress = smoothstep(0.18, 1, speed / (bubble.speed * 1.4));
          return mixRgb(TRAIL_BROWN, TRAIL_BLUE, speedProgress);
        }

        function drawVineLeaf(bubble, x, y, heading, normalX, normalY, color) {
          const side = bubble.leafSide;
          const branchLength = 3.8 + bubble.radius * 0.1;
          const tipX = x + normalX * branchLength * side;
          const tipY = y + normalY * branchLength * side;

          trailCtx.strokeStyle = colorStyle(color, 0.34);
          trailCtx.lineWidth = 0.42;
          trailCtx.beginPath();
          trailCtx.moveTo(x, y);
          trailCtx.lineTo(tipX, tipY);
          trailCtx.stroke();

          trailCtx.save();
          trailCtx.translate(tipX, tipY);
          trailCtx.rotate(heading + side * 0.72);
          trailCtx.fillStyle = colorStyle(mixRgb(color, [184, 214, 183], 0.18), 0.42);
          trailCtx.beginPath();
          trailCtx.ellipse(1.2, 0, 2.7 + bubble.radius * 0.035, 1.15, 0, 0, TAU);
          trailCtx.fill();
          trailCtx.restore();
        }

        function mixRgb(first, second, amount) {
          const progress = clamp(amount, 0, 1);
          return first.map((channel, index) =>
            Math.round(mix(channel, second[index], progress))
          );
        }

        function colorStyle(color, alpha) {
          return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
        }

        function eraseTrailsForPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          const radius = pop.radius * (0.9 + ease * 3.8);
          const erase = trailCtx.createRadialGradient(
            pop.x,
            pop.y,
            0,
            pop.x,
            pop.y,
            radius
          );
          erase.addColorStop(0, 'rgba(0, 0, 0, 0.34)');
          erase.addColorStop(0.46, 'rgba(0, 0, 0, 0.2)');
          erase.addColorStop(1, 'rgba(0, 0, 0, 0)');

          trailCtx.save();
          trailCtx.globalCompositeOperation = 'destination-out';
          trailCtx.fillStyle = erase;
          trailCtx.beginPath();
          trailCtx.arc(pop.x, pop.y, radius, 0, TAU);
          trailCtx.fill();
          trailCtx.restore();
        }

        function updateStations(dt) {
          for (const station of stations) {
            station.birth = Math.min(1, station.birth + dt * 0.72);
          }

          for (let i = pendingStations.length - 1; i >= 0; i -= 1) {
            pendingStations[i] -= dt;
            if (pendingStations[i] > 0) continue;
            const point = pickResourcePoint([], true);
            if (point) {
              stations.push(createStation(point, true));
            } else {
              status.textContent = 'The remaining oil field has no untouched deposit large enough for a new station.';
            }
            pendingStations.splice(i, 1);
          }
        }

        function updateFillingBubble(bubble, dt) {
          const station = bubble.station;
          if (
            !station ||
            !stations.includes(station) ||
            bubble.dockPort === null ||
            station.occupants[bubble.dockPort] !== bubble
          ) {
            bubble.state = 'travel';
            bubble.station = null;
            bubble.dockPort = null;
            chooseTarget(bubble, false);
            return;
          }

          const dock = bubbleDockPosition(bubble, station);
          const settle = 1 - Math.exp(-dt * 12);
          bubble.x += (dock.x - bubble.x) * settle;
          bubble.y += (dock.y - bubble.y) * settle;
          bubble.vx = 0;
          bubble.vy = 0;
          const requested = Math.min(1 - bubble.fuel, bubble.fillRate * dt);
          const transferred = Math.min(requested, station.remaining);
          bubble.fuel = Math.min(1, bubble.fuel + transferred);
          station.remaining = Math.max(0, station.remaining - transferred);

          if (station.remaining <= 0.0001) {
            retireStation(station);
            return;
          }

          if (bubble.fuel >= 1) {
            const port = STATION_PORTS[bubble.dockPort];
            station.occupants[bubble.dockPort] = null;
            bubble.state = 'travel';
            bubble.station = station;
            bubble.target = null;
            bubble.dockPort = null;
            bubble.vx = (port.x * 0.54 - port.y * 0.16) * bubble.speed;
            bubble.vy = (port.y * 0.54 + port.x * 0.16) * bubble.speed;
            bubble.retargetIn = 0.5 + random() * 0.8;
            bubble.returning = false;
            bubble.returnProgress = 0;
            bubble.returnLegBase = 0;
            bubble.returnTargetId = null;
            chooseEscapePoint(bubble);
          }
        }

        function retireStation(station) {
          const depletion = 1 - station.remaining / station.capacity;
          const patch = {
            x: station.x,
            y: station.y,
            radius: station.size * (3.6 + depletion * 2.7),
            angle: station.flowAngle,
            color: station.eraseColor,
            phase: station.phase
          };
          depletedPatches.push(patch);
          burnResourceCandidates(patch);
          paintPermanentDepletion(patch);

          stationPops.push({
            x: station.x,
            y: station.y,
            age: 0,
            duration: 1.05,
            radius: currentStationSize(station),
            phase: station.phase
          });

          stations = stations.filter((candidate) => candidate !== station);
          for (const bubble of bubbles) {
            if (bubble.target === station) {
              bubble.target = null;
              bubble.retargetIn = 0;
            }
            if (bubble.station !== station) continue;

            if (bubble.state === 'filling') {
              const port = STATION_PORTS[bubble.dockPort] || { x: 0, y: -1 };
              bubble.state = 'travel';
              bubble.target = null;
              bubble.vx = (port.x * 0.46 - port.y * 0.12) * bubble.speed;
              bubble.vy = (port.y * 0.46 + port.x * 0.12) * bubble.speed;
              bubble.retargetIn = 0;
            }
            bubble.station = null;
            bubble.dockPort = null;
          }
          station.occupants.fill(null);

          pendingStations.push(0.65 + random() * 0.85);
          status.textContent = 'A station exhausted its vein and moved to a new deposit.';
        }

        function burnResourceCandidates(patch) {
          const burnRadius = Math.max(
            patch.radius * 1.45,
            Math.min(width, height) * 0.075
          );
          for (const candidate of resourceCandidates) {
            const distance = Math.hypot(
              candidate.nx * width - patch.x,
              candidate.ny * height - patch.y
            );
            if (distance <= burnRadius) candidate.burned = true;
          }
        }

        function updateTravelingBubble(bubble, dt) {
          const seekingFuel = bubble.fuel <= REFUEL_THRESHOLD;
          if (seekingFuel && !bubble.returning) {
            bubble.returning = true;
            bubble.returnProgress = 0;
            bubble.returnLegBase = 0;
            bubble.returnTargetId = null;
          } else if (!seekingFuel && bubble.returning) {
            bubble.returning = false;
            bubble.returnProgress = 0;
            bubble.returnLegBase = 0;
            bubble.returnTargetId = null;
          }

          bubble.retargetIn -= dt;
          if (seekingFuel) {
            if (bubble.target && !stations.includes(bubble.target)) {
              bubble.target = null;
              bubble.retargetIn = 0;
            }
            if (!bubble.target || bubble.retargetIn <= 0) {
              chooseTarget(bubble, bubble.station !== null);
            }

            if (bubble.target && !stationHasOpenPort(bubble.target)) {
              const distanceToBusyTarget = Math.hypot(
                bubble.target.x - bubble.x,
                bubble.target.y - bubble.y
              );
              if (distanceToBusyTarget < bubble.target.size * 4.2) {
                chooseTarget(bubble, bubble.station !== null);
              }
            }
          } else {
            bubble.target = null;
            if (
              bubble.escapeX === null ||
              bubble.escapeY === null ||
              Math.hypot(bubble.escapeX - bubble.x, bubble.escapeY - bubble.y) <
                Math.max(34, bubble.radius * 2.8)
            ) {
              chooseEscapePoint(bubble);
            }
          }

          let desiredX;
          let desiredY;
          let distance = Infinity;

          if (seekingFuel && bubble.target) {
            const approachPort = chooseOpenPort(bubble.target, bubble);
            const port = STATION_PORTS[approachPort] || { x: 0, y: 0 };
            const approachDistance = bubbleStationContactDistance(bubble, bubble.target);
            const approachX = bubble.target.x + port.x * approachDistance;
            const approachY = bubble.target.y + port.y * approachDistance;
            const dx = approachX - bubble.x;
            const dy = approachY - bubble.y;
            distance = Math.max(0.001, Math.hypot(dx, dy));
            updateReturnProgress(bubble, bubble.target, distance);
            const directX = dx / distance;
            const directY = dy / distance;
            const approachEase = clamp(distance / (bubble.target.size * 8), 0, 1);
            const curl =
              Math.sin(bubble.phase + bubble.age * bubble.wobble) *
              0.012 *
              approachEase;
            desiredX = directX - directY * curl;
            desiredY = directY + directX * curl;
          } else if (!seekingFuel) {
            const dx = bubble.escapeX - bubble.x;
            const dy = bubble.escapeY - bubble.y;
            const escapeDistance = Math.max(1, Math.hypot(dx, dy));
            const directX = dx / escapeDistance;
            const directY = dy / escapeDistance;
            const energy = clamp(
              (bubble.fuel - REFUEL_THRESHOLD) / (1 - REFUEL_THRESHOLD),
              0,
              1
            );
            const vineSway =
              Math.sin(bubble.phase * 0.67 + bubble.age * (0.2 + bubble.wobble * 0.08)) *
              (0.2 + energy * 0.2);
            desiredX = directX - directY * vineSway;
            desiredY = directY + directX * vineSway;

            const stationInfluence = Math.min(width, height) * 0.3;
            for (const station of stations) {
              const awayX = bubble.x - station.x;
              const awayY = bubble.y - station.y;
              const awayDistance = Math.max(1, Math.hypot(awayX, awayY));
              const repulsion = Math.pow(
                clamp(1 - awayDistance / stationInfluence, 0, 1),
                2
              );
              desiredX += awayX / awayDistance * repulsion * (0.7 + energy * 0.55);
              desiredY += awayY / awayDistance * repulsion * (0.7 + energy * 0.55);
            }
          } else {
            const velocity = Math.max(1, Math.hypot(bubble.vx, bubble.vy));
            const edgeMargin = Math.max(70, Math.min(width, height) * 0.16);
            const centerX = width * 0.5 - bubble.x;
            const centerY = height * 0.5 - bubble.y;
            const centerDistance = Math.max(1, Math.hypot(centerX, centerY));
            const edgeDistance = Math.min(
              bubble.x,
              width - bubble.x,
              bubble.y,
              height - bubble.y
            );
            const edgePull = clamp(1 - edgeDistance / edgeMargin, 0, 1) * 1.3;
            desiredX = bubble.vx / velocity + centerX / centerDistance * edgePull;
            desiredY = bubble.vy / velocity + centerY / centerDistance * edgePull;
          }

          const desiredLength = Math.max(0.001, Math.hypot(desiredX, desiredY));
          desiredX /= desiredLength;
          desiredY /= desiredLength;
          const energy = seekingFuel
            ? 0
            : clamp((bubble.fuel - REFUEL_THRESHOLD) / (1 - REFUEL_THRESHOLD), 0, 1);
          const cruiseSpeed = bubble.speed * (seekingFuel ? 1.08 : 0.9 + energy * 0.5);
          const steering = 1 - Math.exp(-dt * (seekingFuel ? 6.2 : 1.35 + energy * 0.55));
          bubble.vx += (desiredX * cruiseSpeed - bubble.vx) * steering;
          bubble.vy += (desiredY * cruiseSpeed - bubble.vy) * steering;

          const oldX = bubble.x;
          const oldY = bubble.y;
          bubble.x += bubble.vx * dt;
          bubble.y += bubble.vy * dt;
          const traveled = Math.hypot(bubble.x - oldX, bubble.y - oldY);
          bubble.fuel -= traveled / bubble.range + dt * 0.0025;

          if (
            seekingFuel &&
            bubble.target &&
            Math.hypot(bubble.target.x - bubble.x, bubble.target.y - bubble.y) <=
              bubbleStationContactDistance(bubble, bubble.target)
          ) {
            if (stationHasOpenPort(bubble.target)) dockBubble(bubble, bubble.target);
            else {
              bubble.target = null;
              bubble.retargetIn = 0;
            }
          }

          if (bubble.fuel <= 0 && bubble.state !== 'filling') popBubble(bubble);
        }

        function updateReturnProgress(bubble, station, distance) {
          if (bubble.returnTargetId !== station.id) {
            bubble.returnTargetId = station.id;
            bubble.returnLegBase = bubble.returnProgress;
            bubble.returnLegStart = Math.max(
              distance,
              bubbleStationContactDistance(bubble, station) * 1.5
            );
          }
          const legProgress = clamp(1 - distance / bubble.returnLegStart, 0, 1);
          bubble.returnProgress = bubble.returnLegBase +
            (1 - bubble.returnLegBase) * legProgress;
        }

        function dockBubble(bubble, station) {
          const dockPort = chooseOpenPort(station, bubble);
          if (!stations.includes(station) || station.remaining <= 0 || dockPort === null) {
            bubble.target = null;
            bubble.retargetIn = 0;
            return;
          }
          station.occupants[dockPort] = bubble;
          bubble.state = 'filling';
          bubble.station = station;
          bubble.target = station;
          bubble.dockPort = dockPort;
          bubble.fillRate = 0.26 + random() * 0.22;
          bubble.vx = 0;
          bubble.vy = 0;
        }

        function stationHasOpenPort(station) {
          return station.occupants.some((occupant) => occupant === null);
        }

        function chooseOpenPort(station, bubble) {
          let bestPort = null;
          let bestDistance = Infinity;
          const clearance = bubbleStationContactDistance(bubble, station);
          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            if (station.occupants[i]) continue;
            const port = STATION_PORTS[i];
            const x = station.x + port.x * clearance;
            const y = station.y + port.y * clearance;
            const distance = Math.hypot(x - bubble.x, y - bubble.y);
            if (distance < bestDistance) {
              bestPort = i;
              bestDistance = distance;
            }
          }
          return bestPort;
        }

        function bubbleDockPosition(bubble, station) {
          const clearance = bubbleStationContactDistance(bubble, station);
          const port = STATION_PORTS[bubble.dockPort] || STATION_PORTS[0];
          return {
            x: station.x + port.x * clearance,
            y: station.y + port.y * clearance
          };
        }

        function bubbleCollisionRadius(bubble) {
          return bubble.radius * 1.06;
        }

        function stationCollisionRadius(station) {
          const born = 1 - Math.pow(1 - station.birth, 3);
          return currentStationSize(station) * born * 1.06;
        }

        function bubbleStationContactDistance(bubble, station) {
          return bubbleCollisionRadius(bubble) + stationCollisionRadius(station) + COLLISION_GAP;
        }

        function resolveSceneCollisions(applyImpulse, passes) {
          for (let pass = 0; pass < passes; pass += 1) {
            resolveBubbleStationCollisions(applyImpulse && pass === 0);
            resolveBubbleCollisions(applyImpulse && pass === 0);
          }

          for (const bubble of bubbles) {
            if (bubble.dead || bubble.state === 'filling') continue;
            const velocity = Math.hypot(bubble.vx, bubble.vy);
            const maximum = bubble.speed * 1.45;
            if (velocity > maximum) {
              bubble.vx = bubble.vx / velocity * maximum;
              bubble.vy = bubble.vy / velocity * maximum;
            }
          }
        }

        function resolveBubbleCollisions(applyImpulse) {
          for (let i = 0; i < bubbles.length; i += 1) {
            const first = bubbles[i];
            if (first.dead) continue;

            for (let j = i + 1; j < bubbles.length; j += 1) {
              const second = bubbles[j];
              if (second.dead) continue;

              let dx = second.x - first.x;
              let dy = second.y - first.y;
              const minimum =
                bubbleCollisionRadius(first) + bubbleCollisionRadius(second) + COLLISION_GAP;
              const distanceSquared = dx * dx + dy * dy;
              if (distanceSquared >= minimum * minimum) continue;

              let distance = Math.sqrt(distanceSquared);
              if (distance < 0.001) {
                const angle = ((first.id * 37 + second.id * 71) % 360) / 360 * TAU;
                dx = Math.cos(angle);
                dy = Math.sin(angle);
                distance = 1;
              }

              const normalX = dx / distance;
              const normalY = dy / distance;
              const overlap = minimum - distance;
              let firstMobility = first.state === 'filling' ? 0 : 1;
              let secondMobility = second.state === 'filling' ? 0 : 1;
              if (firstMobility + secondMobility === 0) {
                firstMobility = 1;
                secondMobility = 1;
              }
              const totalMobility = firstMobility + secondMobility;

              first.x -= normalX * overlap * firstMobility / totalMobility;
              first.y -= normalY * overlap * firstMobility / totalMobility;
              second.x += normalX * overlap * secondMobility / totalMobility;
              second.y += normalY * overlap * secondMobility / totalMobility;

              if (!applyImpulse) continue;
              const relativeX = second.vx - first.vx;
              const relativeY = second.vy - first.vy;
              const closingSpeed = relativeX * normalX + relativeY * normalY;
              if (closingSpeed >= 0) continue;

              const impulse = -(1 + 0.52) * closingSpeed / totalMobility;
              if (first.state !== 'filling') {
                first.vx -= normalX * impulse * firstMobility;
                first.vy -= normalY * impulse * firstMobility;
              }
              if (second.state !== 'filling') {
                second.vx += normalX * impulse * secondMobility;
                second.vy += normalY * impulse * secondMobility;
              }
            }
          }
        }

        function resolveBubbleStationCollisions(applyImpulse) {
          for (const bubble of bubbles) {
            if (bubble.dead) continue;

            for (const station of stations) {
              if (bubble.state === 'filling' && bubble.station === station) continue;

              let dx = bubble.x - station.x;
              let dy = bubble.y - station.y;
              const minimum = bubbleStationContactDistance(bubble, station);
              const distanceSquared = dx * dx + dy * dy;
              if (distanceSquared >= minimum * minimum) continue;

              let distance = Math.sqrt(distanceSquared);
              if (distance < 0.001) {
                const angle = ((bubble.id * 53 + station.id * 97) % 360) / 360 * TAU;
                dx = Math.cos(angle);
                dy = Math.sin(angle);
                distance = 1;
              }

              const normalX = dx / distance;
              const normalY = dy / distance;
              const overlap = minimum - distance;
              bubble.x += normalX * overlap;
              bubble.y += normalY * overlap;

              if (!applyImpulse || bubble.state === 'filling') continue;
              const inwardSpeed = bubble.vx * normalX + bubble.vy * normalY;
              if (inwardSpeed < 0) {
                bubble.vx -= normalX * inwardSpeed * 1.42;
                bubble.vy -= normalY * inwardSpeed * 1.42;
              }
            }
          }
        }

        function popBubble(bubble) {
          if (bubble.dead) return;
          if (
            bubble.station &&
            bubble.dockPort !== null &&
            bubble.station.occupants[bubble.dockPort] === bubble
          ) {
            bubble.station.occupants[bubble.dockPort] = null;
          }
          bubble.dead = true;
          pops.push({
            x: bubble.x,
            y: bubble.y,
            age: 0,
            duration: 0.7 + random() * 0.35,
            radius: bubble.radius,
            phase: bubble.phase
          });
          popCount += 1;
          if (popCount % 5 === 0) {
            status.textContent = `${popCount} bubbles have run dry; ${bubbles.length - 1} remain.`;
          }
        }

        function draw() {
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(fieldCanvas, 0, 0, width, height);
          drawFieldGlaze();

          for (const station of stations) {
            drawDepletionPatch(station, 1 - station.remaining / station.capacity);
          }
          ctx.drawImage(trailCanvas, 0, 0, width, height);
          for (const station of stations) drawStation(station);
          for (const pop of stationPops) drawStationPop(pop);
          for (const pop of pops) drawPop(pop);
          for (const bubble of bubbles) drawBubble(bubble);
          ctx.restore();
        }

        function drawFieldGlaze() {
          const glaze = ctx.createLinearGradient(0, 0, width, height);
          glaze.addColorStop(0, 'rgba(194, 174, 131, 0.018)');
          glaze.addColorStop(0.52, 'rgba(0, 0, 0, 0)');
          glaze.addColorStop(1, 'rgba(0, 0, 0, 0.08)');
          ctx.fillStyle = glaze;
          ctx.fillRect(0, 0, width, height);
        }

        function paintPermanentDepletion(patch) {
          fieldCtx.save();
          fieldCtx.setTransform(
            fieldCanvas.width / width,
            0,
            0,
            fieldCanvas.height / height,
            0,
            0
          );
          drawDepletionPatch(patch, 1, fieldCtx);
          fieldCtx.restore();
        }

        function drawDepletionPatch(patch, amount, target = ctx) {
          if (amount <= 0.002) return;
          const color = patch.color || patch.eraseColor;
          const angle = patch.angle ?? patch.flowAngle;
          const baseRadius = patch.radius ?? patch.size * (1.3 + amount * 5);
          const strength = Math.pow(amount, 0.62);

          target.save();
          target.translate(patch.x, patch.y);
          target.rotate(angle);
          target.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;

          const layers = [
            { scale: 1.12, thickness: 0.34, alpha: 0.18 },
            { scale: 0.92, thickness: 0.29, alpha: 0.42 },
            { scale: 0.72, thickness: 0.24, alpha: 0.82 }
          ];
          for (const layer of layers) {
            target.globalAlpha = strength * layer.alpha;
            target.beginPath();
            target.ellipse(
              0,
              0,
              baseRadius * layer.scale,
              Math.max(2, baseRadius * layer.thickness),
              Math.sin(patch.phase) * 0.08,
              0,
              TAU
            );
            target.fill();
          }

          target.globalAlpha = strength * 0.54;
          target.beginPath();
          target.ellipse(
            -baseRadius * 0.48,
            baseRadius * 0.08 * Math.sin(patch.phase * 1.7),
            baseRadius * 0.55,
            baseRadius * 0.2,
            0,
            0,
            TAU
          );
          target.fill();
          target.restore();
        }

        function drawStation(station) {
          const { x, y } = station;
          const occupied = station.occupants.some(Boolean);
          const reserve = clamp(station.remaining / station.capacity, 0, 1);
          const s = currentStationSize(station);
          const born = 1 - Math.pow(1 - station.birth, 3);

          ctx.save();
          ctx.translate(x, y);
          ctx.scale(born, born);

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const bubble = station.occupants[i];
            if (!bubble) continue;
            const port = STATION_PORTS[i];
            ctx.strokeStyle = 'rgba(244, 183, 111, 0.38)';
            ctx.lineWidth = Math.max(0.8, s * 0.055);
            ctx.beginPath();
            ctx.moveTo(port.x * s, port.y * s);
            ctx.lineTo(bubble.x - x, bubble.y - y);
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(-s * 0.08, s * 0.18);
          traceStationShape(s * 1.05);
          ctx.fillStyle = 'rgba(5, 6, 5, 0.44)';
          ctx.fill();
          ctx.restore();

          traceStationShape(s);
          ctx.fillStyle = 'rgba(24, 27, 24, 0.92)';
          ctx.fill();

          if (reserve > 0.002) {
            const fuelTop = s - reserve * s * 2;
            ctx.save();
            traceStationShape(s);
            ctx.clip();
            ctx.fillStyle = 'rgba(224, 147, 76, 0.9)';
            ctx.fillRect(-s, fuelTop, s * 2, s * 2);
            ctx.restore();

            if (reserve < 0.998) {
              const surfaceHalfWidth = Math.max(0, s - Math.abs(fuelTop));
              ctx.beginPath();
              ctx.moveTo(-surfaceHalfWidth, fuelTop);
              ctx.lineTo(surfaceHalfWidth, fuelTop);
              ctx.strokeStyle = 'rgba(255, 218, 159, 0.86)';
              ctx.lineWidth = Math.max(0.8, s * 0.055);
              ctx.stroke();
            }
          }

          traceStationShape(s);
          ctx.strokeStyle = occupied
            ? 'rgba(255, 222, 171, 0.92)'
            : 'rgba(244, 178, 104, 0.78)';
          ctx.lineWidth = Math.max(1, s * 0.085);
          ctx.stroke();

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const port = STATION_PORTS[i];
            const portOccupied = Boolean(station.occupants[i]);
            ctx.beginPath();
            ctx.arc(port.x * s, port.y * s, Math.max(1.6, s * 0.12), 0, TAU);
            ctx.fillStyle = portOccupied
              ? 'rgba(255, 230, 186, 0.98)'
              : 'rgba(56, 46, 34, 0.96)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(246, 184, 111, 0.9)';
            ctx.lineWidth = Math.max(0.65, s * 0.045);
            ctx.stroke();
          }
          ctx.restore();
        }

        function currentStationSize(station) {
          return station.size;
        }

        function traceStationShape(size) {
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size, 0);
          ctx.lineTo(0, size);
          ctx.lineTo(-size, 0);
          ctx.closePath();
        }

        function drawBubble(bubble) {
          if (bubble.dead) return;
          const r = bubble.radius;
          const fuel = clamp(bubble.fuel, 0, 1);
          const filling = bubble.state === 'filling';

          ctx.save();
          ctx.translate(bubble.x, bubble.y);

          traceBubbleShape(r * 1.06);
          ctx.fillStyle = 'rgba(205, 220, 205, 0.035)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(188, 205, 190, 0.2)';
          ctx.lineWidth = Math.max(0.7, r * 0.055);
          ctx.stroke();

          traceBubbleShape(r);
          ctx.fillStyle = filling
            ? 'rgba(231, 224, 197, 0.1)'
            : 'rgba(215, 228, 215, 0.055)';
          ctx.fill();

          if (fuel > 0.002) {
            const fuelTop = r - fuel * r * 2;
            ctx.save();
            traceBubbleShape(r);
            ctx.clip();
            ctx.fillStyle = filling
              ? 'rgba(234, 151, 73, 0.72)'
              : 'rgba(201, 111, 50, 0.62)';
            ctx.fillRect(-r, fuelTop, r * 2, r * 2);
            ctx.restore();

            if (fuel < 0.998) {
              const surfaceHalfWidth = Math.sqrt(Math.max(0, r * r - fuelTop * fuelTop));
              ctx.beginPath();
              ctx.moveTo(-surfaceHalfWidth, fuelTop);
              ctx.lineTo(surfaceHalfWidth, fuelTop);
              ctx.strokeStyle = filling
                ? 'rgba(255, 211, 148, 0.78)'
                : 'rgba(232, 153, 86, 0.58)';
              ctx.lineWidth = Math.max(0.8, r * 0.055);
              ctx.stroke();
            }
          }

          traceBubbleShape(r);
          ctx.strokeStyle = filling
            ? 'rgba(255, 224, 174, 0.82)'
            : 'rgba(211, 224, 211, 0.58)';
          ctx.lineWidth = Math.max(1, r * 0.085);
          ctx.stroke();
          ctx.restore();
        }

        function traceBubbleShape(radius) {
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
        }

        function drawStationPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 4);
          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.globalAlpha = 1 - progress;

          traceStationShape(pop.radius * (1 + ease * 2.2));
          ctx.strokeStyle = 'rgba(242, 168, 91, 0.74)';
          ctx.lineWidth = Math.max(1, pop.radius * 0.07 * (1 - progress));
          ctx.stroke();

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const angle = -Math.PI / 2 + (i / STATION_PORTS.length) * TAU;
            const distance = pop.radius * (0.7 + ease * 3.6);
            ctx.save();
            ctx.translate(Math.cos(angle) * distance, Math.sin(angle) * distance);
            ctx.rotate(angle + ease * 1.4);
            ctx.fillStyle = i % 2 ? '#d17a3d' : '#eca55d';
            ctx.beginPath();
            ctx.moveTo(pop.radius * 0.2, 0);
            ctx.lineTo(-pop.radius * 0.13, pop.radius * 0.11);
            ctx.lineTo(-pop.radius * 0.13, -pop.radius * 0.11);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }

        function drawPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.globalAlpha = 1 - progress;

          const burstRadius = pop.radius * (0.8 + ease * 3.6);
          const burst = ctx.createRadialGradient(0, 0, 0, 0, 0, burstRadius);
          burst.addColorStop(0, 'rgba(247, 246, 235, 0.5)');
          burst.addColorStop(0.38, 'rgba(237, 241, 232, 0.2)');
          burst.addColorStop(1, 'rgba(237, 241, 232, 0)');
          ctx.fillStyle = burst;
          ctx.beginPath();
          ctx.arc(0, 0, burstRadius, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = 'rgba(236, 216, 181, 0.82)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, pop.radius * (1 + ease * 2.9), 0, TAU);
          ctx.stroke();
          for (let i = 0; i < 5; i += 1) {
            const angle = pop.phase + (i / 5) * TAU;
            const distance = pop.radius * (0.5 + ease * 3.2);
            ctx.fillStyle = i % 2 ? '#d68948' : '#d8dfd5';
            ctx.beginPath();
            ctx.arc(
              Math.cos(angle) * distance,
              Math.sin(angle) * distance,
              Math.max(0.55, pop.radius * 0.12 * (1 - progress)),
              0,
              TAU
            );
            ctx.fill();
          }
          ctx.restore();
        }

        function fbm(x, y) {
          let value = 0;
          let amplitude = 0.52;
          for (let octave = 0; octave < 4; octave += 1) {
            value += amplitude * noise2(x, y);
            const nextX = (x * 0.8 + y * 0.6) * 2.03 + 13.17;
            const nextY = (-x * 0.6 + y * 0.8) * 2.03 + 7.91;
            x = nextX;
            y = nextY;
            amplitude *= 0.49;
          }
          return value;
        }

        function noise2(x, y) {
          const ix = Math.floor(x);
          const iy = Math.floor(y);
          const fx = x - ix;
          const fy = y - iy;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = hash2(ix, iy);
          const b = hash2(ix + 1, iy);
          const c = hash2(ix, iy + 1);
          const d = hash2(ix + 1, iy + 1);
          return mix(mix(a, b, ux), mix(c, d, ux), uy);
        }

        function hash2(x, y) {
          let value = Math.imul(x | 0, 0x1f123bb5) ^ Math.imul(y | 0, 0x5f356495) ^ seed;
          value ^= value >>> 15;
          value = Math.imul(value, 0x2c1b3c6d);
          value ^= value >>> 12;
          value = Math.imul(value, 0x297a2d39);
          value ^= value >>> 15;
          return (value >>> 0) / 4294967296;
        }

        function seedFromLocation() {
          const value = params.get('seed');
          return value ? hashString(value) : Math.floor(Math.random() * 0x7fffffff);
        }

        function hashString(value) {
          let hash = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            hash ^= value.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return hash >>> 0;
        }

        function mulberry32(value) {
          return () => {
            let t = (value += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function smoothstep(edge0, edge1, value) {
          const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
          return amount * amount * (3 - 2 * amount);
        }

        function mix(a, b, amount) {
          return a + (b - a) * amount;
        }

        function clamp(value, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, value));
        }

        function clampByte(value) {
          return Math.max(0, Math.min(255, Math.round(value)));
        }
      })();
    </script>
  </body>
