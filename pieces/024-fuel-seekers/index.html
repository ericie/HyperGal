<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Sixty bubbles spend their fuel moving among ten stations embedded in a marbled oil field."
    />
    <title>Fuel Seekers · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #1f201e;
        --focus: #f2ad61;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -7px;
      }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Fuel Seekers: sixty translucent bubbles travel among ten small gas stations placed over a low-contrast marbled oil field. Their amber fuel drains as they move. At an empty station they stop and refill; if they run dry first, they pop and a replacement enters from beyond the edge. Press R to reseed the field."
    ></canvas>
    <p id="status" class="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.getElementById('status');
        const fieldCanvas = document.createElement('canvas');
        const fieldCtx = fieldCanvas.getContext('2d', { alpha: false });
        const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
        const params = new URLSearchParams(location.search);

        const TAU = Math.PI * 2;
        const BUBBLE_COUNT = 60;
        const STATION_COUNT = 10;
        const FIELD_BASE = [31, 32, 30];
        const OIL_TINT = [25, 20, 8];

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let stations = [];
        let bubbles = [];
        let pops = [];
        let lastFrameAt = 0;
        let nextBubbleId = 1;
        let popCount = 0;
        let raf = 0;
        let noiseOffsetX = 0;
        let noiseOffsetY = 0;
        let fieldRotation = 0;
        let fieldScale = 4.8;

        configureField();
        resize(true);
        bindEvents();
        raf = requestAnimationFrame(frame);

        function bindEvents() {
          addEventListener('resize', () => resize(false), { passive: true });
          canvas.addEventListener('pointerdown', () => {
            canvas.focus({ preventScroll: true });
          });
          canvas.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') reseed();
          });
          document.addEventListener('visibilitychange', () => {
            lastFrameAt = 0;
            if (!document.hidden && !raf) raf = requestAnimationFrame(frame);
          });
          if (typeof motionQuery.addEventListener === 'function') {
            motionQuery.addEventListener('change', () => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          } else if (typeof motionQuery.addListener === 'function') {
            motionQuery.addListener(() => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          }
        }

        function reseed() {
          const seedToken = Math.floor(Math.random() * 0x7fffffff).toString(36);
          seed = hashString(seedToken);
          random = mulberry32(seed);
          const url = new URL(location.href);
          url.searchParams.set('seed', seedToken);
          history.replaceState(null, '', url);
          configureField();
          buildScene();
          popCount = 0;
          status.textContent = `New oil field ${String(seed % 10000).padStart(4, '0')}`;
          if (!raf) raf = requestAnimationFrame(frame);
        }

        function resize(firstRun) {
          const nextWidth = Math.max(1, innerWidth);
          const nextHeight = Math.max(1, innerHeight);
          if (!firstRun && nextWidth === width && nextHeight === height) return;

          width = nextWidth;
          height = nextHeight;
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildScene();
        }

        function configureField() {
          const fieldRandom = mulberry32(seed ^ 0x91e10da5);
          noiseOffsetX = (fieldRandom() - 0.5) * 34;
          noiseOffsetY = (fieldRandom() - 0.5) * 34;
          fieldRotation = 0.22 + fieldRandom() * 0.82;
          fieldScale = 4.25 + fieldRandom() * 1.5;
        }

        function buildScene() {
          random = mulberry32(seed ^ 0x6c8e9cf5);
          buildFieldTexture();
          placeStations();
          bubbles = [];
          pops = [];
          nextBubbleId = 1;

          for (let i = 0; i < BUBBLE_COUNT; i += 1) {
            bubbles.push(createBubble(true, i));
          }

          for (let i = 0; i < Math.min(STATION_COUNT, bubbles.length); i += 1) {
            const bubble = bubbles[i];
            const station = stations[i];
            bubble.state = 'filling';
            bubble.station = station;
            bubble.target = station;
            bubble.fuel = 0.16 + random() * 0.72;
            bubble.fillRate = 0.25 + random() * 0.24;
            bubble.dockSide = station.side;
            bubble.x = station.x + station.side * station.size * 0.9;
            bubble.y = station.y - station.size * 0.1;
            bubble.vx = 0;
            bubble.vy = 0;
            station.occupant = bubble;
          }

          for (let i = STATION_COUNT; i < bubbles.length; i += 1) {
            chooseTarget(bubbles[i], true);
          }

          draw();
        }

        function buildFieldTexture() {
          const longest = Math.max(width, height);
          const scale = Math.min(0.72, 680 / longest);
          const textureWidth = Math.max(240, Math.round(width * scale));
          const textureHeight = Math.max(180, Math.round(height * scale));
          fieldCanvas.width = textureWidth;
          fieldCanvas.height = textureHeight;

          const image = fieldCtx.createImageData(textureWidth, textureHeight);
          const data = image.data;

          for (let y = 0; y < textureHeight; y += 1) {
            const ny = (y + 0.5) / textureHeight;
            for (let x = 0; x < textureWidth; x += 1) {
              const nx = (x + 0.5) / textureWidth;
              const sample = fieldAt(nx, ny);
              const cloud = sample.cloud - 0.5;
              const oil = sample.resource;
              const mineral = (hash2(x + 711, y - 193) - 0.5) * 1.9;
              const index = (y * textureWidth + x) * 4;

              data[index] = clampByte(
                FIELD_BASE[0] + cloud * 8.0 + oil * OIL_TINT[0] + mineral
              );
              data[index + 1] = clampByte(
                FIELD_BASE[1] + cloud * 7.2 + oil * OIL_TINT[1] + mineral
              );
              data[index + 2] = clampByte(
                FIELD_BASE[2] + cloud * 6.2 + oil * OIL_TINT[2] + mineral * 0.7
              );
              data[index + 3] = 255;
            }
          }

          fieldCtx.putImageData(image, 0, 0);
        }

        function fieldAt(nx, ny) {
          const aspect = width / Math.max(1, height);
          let px = (nx - 0.5) * aspect;
          let py = ny - 0.5;
          const cosine = Math.cos(fieldRotation);
          const sine = Math.sin(fieldRotation);
          const turnedX = (cosine * px - sine * py) * fieldScale;
          const turnedY = (sine * px + cosine * py) * fieldScale;
          px = turnedX;
          py = turnedY;

          const qx = fbm(px * 0.62 + noiseOffsetX, py * 0.62 + noiseOffsetY);
          const qy = fbm(
            px * 0.62 + noiseOffsetX + 5.2,
            py * 0.62 + noiseOffsetY + 1.3
          );
          const rx = fbm(
            px + qx * 2.35 + noiseOffsetX * 0.3,
            py + qy * 2.35 + noiseOffsetY * 0.3
          );
          const ry = fbm(
            px + qy * 2.05 + 8.3,
            py + qx * 2.05 + 2.8
          );
          const folds = fbm(
            px * 0.82 + rx * 3.1 + qx * 0.8,
            py * 0.82 + ry * 3.1 + qy * 0.8
          );
          const current = folds * 1.82 + rx * 0.84 + qy * 0.31 + py * 0.055;
          const distance = Math.abs(Math.sin(current * 7.15));
          const vein = 1 - smoothstep(0.075, 0.31, distance);
          const halo = 1 - smoothstep(0.075, 0.61, distance);
          const secondary = Math.abs(
            Math.sin((fbm(px * 1.56 + ry * 2.4, py * 1.56 + rx * 2.4) * 1.5 + folds * 0.8) * 10.8 + 1.7)
          );
          const hairline = (1 - smoothstep(0.025, 0.105, secondary)) *
            smoothstep(0.2, 0.82, folds);
          const cloud = fbm(px * 0.34 + 17, py * 0.34 + 17);
          const resource = clamp(
            vein * 0.58 + halo * 0.27 + hairline * 0.12 + Math.pow(folds, 2.2) * 0.16,
            0,
            1
          );
          return { resource, cloud };
        }

        function placeStations() {
          const candidates = [];
          const marginX = Math.min(0.11, 62 / Math.max(1, width));
          const marginY = Math.min(0.11, 62 / Math.max(1, height));
          const stationRandom = mulberry32(seed ^ 0x27d4eb2d);

          for (let i = 0; i < 1800; i += 1) {
            const nx = marginX + stationRandom() * (1 - marginX * 2);
            const ny = marginY + stationRandom() * (1 - marginY * 2);
            const sample = fieldAt(nx, ny);
            candidates.push({
              nx,
              ny,
              value: sample.resource + stationRandom() * 0.018
            });
          }

          candidates.sort((a, b) => b.value - a.value);
          const selected = [];
          let separation = Math.min(width, height) * 0.19;

          while (selected.length < STATION_COUNT && separation > 22) {
            for (const candidate of candidates) {
              if (selected.includes(candidate)) continue;
              const x = candidate.nx * width;
              const y = candidate.ny * height;
              const clear = selected.every((other) =>
                Math.hypot(x - other.nx * width, y - other.ny * height) >= separation
              );
              if (clear) selected.push(candidate);
              if (selected.length === STATION_COUNT) break;
            }
            separation *= 0.82;
          }

          while (selected.length < STATION_COUNT) {
            const fallback = candidates.find((candidate) => !selected.includes(candidate));
            if (!fallback) break;
            selected.push(fallback);
          }

          const stationSize = clamp(Math.min(width, height) * 0.022, 10, 17);
          stations = selected.map((point, index) => ({
            id: index,
            x: point.nx * width,
            y: point.ny * height,
            nx: point.nx,
            ny: point.ny,
            resource: point.value,
            size: stationSize,
            side: stationRandom() < 0.5 ? -1 : 1,
            occupant: null,
            phase: stationRandom() * TAU
          }));
        }

        function createBubble(initial, index = 0) {
          const radius = 3.4 + Math.pow(random(), 1.45) * 5.8;
          const speedBase = clamp(Math.min(width, height) * 0.058, 25, 52);
          const bubble = {
            id: nextBubbleId++,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius,
            speed: speedBase * (0.72 + random() * 0.62),
            fuel: initial ? 0.22 + random() * 0.76 : 0.26 + random() * 0.36,
            range: Math.max(width, height) * (0.7 + random() * 0.46),
            state: 'travel',
            station: null,
            target: null,
            retargetIn: 0,
            fillRate: 0.27 + random() * 0.21,
            dockSide: 1,
            age: random() * 14,
            phase: random() * TAU,
            wobble: 0.7 + random() * 1.2,
            dead: false
          };

          if (initial) {
            bubble.x = width * (0.06 + random() * 0.88);
            bubble.y = height * (0.06 + random() * 0.88);
            const angle = random() * TAU;
            bubble.vx = Math.cos(angle) * bubble.speed * 0.45;
            bubble.vy = Math.sin(angle) * bubble.speed * 0.45;
          } else {
            const edge = Math.floor(random() * 4);
            const margin = radius + 18;
            if (edge === 0) {
              bubble.x = -margin;
              bubble.y = random() * height;
              bubble.vx = bubble.speed * 0.62;
            } else if (edge === 1) {
              bubble.x = width + margin;
              bubble.y = random() * height;
              bubble.vx = -bubble.speed * 0.62;
            } else if (edge === 2) {
              bubble.x = random() * width;
              bubble.y = -margin;
              bubble.vy = bubble.speed * 0.62;
            } else {
              bubble.x = random() * width;
              bubble.y = height + margin;
              bubble.vy = -bubble.speed * 0.62;
            }
          }

          bubble.phase += index * 0.11;
          return bubble;
        }

        function chooseTarget(bubble, avoidCurrent) {
          const available = stations.filter((station) =>
            !station.occupant && (!avoidCurrent || station !== bubble.station)
          );
          if (!available.length) {
            bubble.target = null;
            bubble.retargetIn = 0.12 + random() * 0.24;
            return;
          }

          let best = available[0];
          let bestScore = Infinity;
          for (const station of available) {
            const distance = Math.hypot(station.x - bubble.x, station.y - bubble.y);
            const crowding = bubbles.reduce((count, other) =>
              count + (other !== bubble && other.state === 'travel' && other.target === station ? 1 : 0), 0
            );
            const score = distance * (0.88 + random() * 0.22) + crowding * station.size * 1.9;
            if (score < bestScore) {
              best = station;
              bestScore = score;
            }
          }
          bubble.target = best;
          bubble.retargetIn = 0.7 + random() * 0.8;
        }

        function frame(time) {
          raf = 0;
          if (document.hidden) return;

          if (!lastFrameAt) lastFrameAt = time;
          const dt = Math.min(0.04, Math.max(0, (time - lastFrameAt) / 1000));
          lastFrameAt = time;

          if (!motionQuery.matches) update(dt);
          draw();

          if (!motionQuery.matches) raf = requestAnimationFrame(frame);
        }

        function update(dt) {
          for (let i = 0; i < bubbles.length; i += 1) {
            const bubble = bubbles[i];
            bubble.age += dt;

            if (bubble.state === 'filling') {
              updateFillingBubble(bubble, dt);
            } else {
              updateTravelingBubble(bubble, dt);
            }

            if (bubble.dead) {
              bubbles[i] = createBubble(false);
              chooseTarget(bubbles[i], false);
            }
          }

          for (let i = pops.length - 1; i >= 0; i -= 1) {
            pops[i].age += dt;
            if (pops[i].age >= pops[i].duration) pops.splice(i, 1);
          }
        }

        function updateFillingBubble(bubble, dt) {
          const station = bubble.station;
          if (!station || station.occupant !== bubble) {
            bubble.state = 'travel';
            bubble.station = null;
            chooseTarget(bubble, false);
            return;
          }

          const targetX = station.x + bubble.dockSide * station.size * 0.92;
          const targetY = station.y - station.size * 0.12;
          const settle = 1 - Math.exp(-dt * 12);
          bubble.x += (targetX - bubble.x) * settle;
          bubble.y += (targetY - bubble.y) * settle;
          bubble.vx = 0;
          bubble.vy = 0;
          bubble.fuel = Math.min(1, bubble.fuel + bubble.fillRate * dt);

          if (bubble.fuel >= 1) {
            station.occupant = null;
            bubble.state = 'travel';
            bubble.station = station;
            bubble.target = null;
            bubble.vx = bubble.dockSide * bubble.speed * 0.42;
            bubble.vy = -bubble.speed * 0.18;
            chooseTarget(bubble, true);
          }
        }

        function updateTravelingBubble(bubble, dt) {
          bubble.retargetIn -= dt;
          if (!bubble.target || bubble.retargetIn <= 0) {
            chooseTarget(bubble, bubble.station !== null);
          }

          if (bubble.target && bubble.target.occupant) {
            const distanceToBusyTarget = Math.hypot(
              bubble.target.x - bubble.x,
              bubble.target.y - bubble.y
            );
            if (distanceToBusyTarget < bubble.target.size * 4.2) {
              chooseTarget(bubble, bubble.station !== null);
            }
          }

          let desiredX;
          let desiredY;
          let distance = Infinity;

          if (bubble.target) {
            const dx = bubble.target.x - bubble.x;
            const dy = bubble.target.y - bubble.y;
            distance = Math.max(0.001, Math.hypot(dx, dy));
            const curl = Math.sin(bubble.phase + bubble.age * bubble.wobble) * 0.23;
            desiredX = dx / distance - (dy / distance) * curl;
            desiredY = dy / distance + (dx / distance) * curl;
          } else {
            const dx = width * 0.5 - bubble.x;
            const dy = height * 0.5 - bubble.y;
            const centerDistance = Math.max(1, Math.hypot(dx, dy));
            const curl = Math.sin(bubble.phase + bubble.age * bubble.wobble) * 0.72;
            desiredX = dx / centerDistance * 0.22 - bubble.vy / Math.max(1, bubble.speed) * curl;
            desiredY = dy / centerDistance * 0.22 + bubble.vx / Math.max(1, bubble.speed) * curl;
          }

          const desiredLength = Math.max(0.001, Math.hypot(desiredX, desiredY));
          desiredX /= desiredLength;
          desiredY /= desiredLength;
          const steering = 1 - Math.exp(-dt * 2.1);
          bubble.vx += (desiredX * bubble.speed - bubble.vx) * steering;
          bubble.vy += (desiredY * bubble.speed - bubble.vy) * steering;

          const oldX = bubble.x;
          const oldY = bubble.y;
          bubble.x += bubble.vx * dt;
          bubble.y += bubble.vy * dt;
          const traveled = Math.hypot(bubble.x - oldX, bubble.y - oldY);
          bubble.fuel -= traveled / bubble.range + dt * 0.0025;

          if (bubble.target && distance <= bubble.target.size * 0.82 + bubble.radius) {
            if (!bubble.target.occupant) dockBubble(bubble, bubble.target);
            else {
              bubble.target = null;
              bubble.retargetIn = 0;
            }
          }

          if (bubble.fuel <= 0 && bubble.state !== 'filling') popBubble(bubble);
        }

        function dockBubble(bubble, station) {
          station.occupant = bubble;
          bubble.state = 'filling';
          bubble.station = station;
          bubble.target = station;
          bubble.dockSide = station.side;
          bubble.fillRate = 0.26 + random() * 0.22;
          bubble.vx = 0;
          bubble.vy = 0;
        }

        function popBubble(bubble) {
          if (bubble.dead) return;
          if (bubble.station && bubble.station.occupant === bubble) {
            bubble.station.occupant = null;
          }
          bubble.dead = true;
          pops.push({
            x: bubble.x,
            y: bubble.y,
            age: 0,
            duration: 0.7 + random() * 0.35,
            radius: bubble.radius,
            phase: bubble.phase
          });
          popCount += 1;
          if (popCount % 5 === 0) {
            status.textContent = `${popCount} bubbles have run dry; replacements entered from the edge.`;
          }
        }

        function draw() {
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(fieldCanvas, 0, 0, width, height);
          drawFieldGlaze();

          for (const station of stations) drawStation(station);
          for (const pop of pops) drawPop(pop);
          for (const bubble of bubbles) drawBubble(bubble);
          ctx.restore();
        }

        function drawFieldGlaze() {
          const glaze = ctx.createLinearGradient(0, 0, width, height);
          glaze.addColorStop(0, 'rgba(194, 174, 131, 0.018)');
          glaze.addColorStop(0.52, 'rgba(0, 0, 0, 0)');
          glaze.addColorStop(1, 'rgba(0, 0, 0, 0.08)');
          ctx.fillStyle = glaze;
          ctx.fillRect(0, 0, width, height);
        }

        function drawStation(station) {
          const { x, y, size: s } = station;
          const occupied = Boolean(station.occupant);
          const pulse = 0.5 + 0.5 * Math.sin(station.phase + performance.now() * 0.0017);

          ctx.save();
          ctx.translate(Math.round(x) + 0.5, Math.round(y) + 0.5);

          ctx.strokeStyle = occupied
            ? 'rgba(240, 170, 87, 0.26)'
            : `rgba(240, 170, 87, ${0.17 + pulse * 0.1})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, s * (occupied ? 1.35 : 1.45 + pulse * 0.18), 0, TAU);
          ctx.stroke();

          ctx.fillStyle = 'rgba(9, 10, 9, 0.56)';
          ctx.beginPath();
          ctx.ellipse(0, s * 0.62, s * 0.72, s * 0.23, 0, 0, TAU);
          ctx.fill();

          ctx.fillStyle = occupied ? '#d78845' : '#e2a05c';
          ctx.fillRect(-s * 0.39, -s * 0.58, s * 0.78, s * 1.18);
          ctx.fillStyle = '#20221f';
          ctx.fillRect(-s * 0.25, -s * 0.4, s * 0.5, s * 0.32);
          ctx.fillStyle = occupied ? '#f3bc75' : '#697067';
          ctx.fillRect(-s * 0.17, -s * 0.32, s * 0.34, s * 0.13);

          ctx.strokeStyle = '#d78845';
          ctx.lineWidth = Math.max(1, s * 0.1);
          ctx.beginPath();
          ctx.moveTo(station.side * s * 0.39, -s * 0.25);
          ctx.quadraticCurveTo(
            station.side * s * 0.84,
            -s * 0.34,
            station.side * s * 0.72,
            s * 0.32
          );
          ctx.stroke();

          ctx.fillStyle = '#111310';
          ctx.fillRect(-s * 0.56, s * 0.55, s * 1.12, s * 0.18);
          ctx.fillRect(-s * 0.31, -s * 0.73, s * 0.62, s * 0.15);

          if (occupied) {
            const bubble = station.occupant;
            ctx.strokeStyle = 'rgba(242, 178, 101, 0.48)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(station.side * s * 0.65, s * 0.2);
            ctx.lineTo(bubble.x - x, bubble.y - y);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawBubble(bubble) {
          if (bubble.dead) return;
          const r = bubble.radius;
          const fuel = clamp(bubble.fuel, 0, 1);
          const filling = bubble.state === 'filling';

          ctx.save();
          ctx.translate(bubble.x, bubble.y);

          ctx.beginPath();
          ctx.arc(0, 0, r, 0, TAU);
          ctx.clip();

          const body = ctx.createRadialGradient(-r * 0.35, -r * 0.42, 0, 0, 0, r);
          body.addColorStop(0, 'rgba(237, 242, 228, 0.13)');
          body.addColorStop(0.72, 'rgba(156, 170, 157, 0.035)');
          body.addColorStop(1, 'rgba(7, 8, 7, 0.19)');
          ctx.fillStyle = body;
          ctx.fillRect(-r, -r, r * 2, r * 2);

          const fuelTop = r - fuel * r * 2;
          const fuelGradient = ctx.createLinearGradient(0, fuelTop, 0, r);
          fuelGradient.addColorStop(0, filling ? 'rgba(246, 183, 99, 0.69)' : 'rgba(225, 145, 68, 0.62)');
          fuelGradient.addColorStop(1, 'rgba(91, 47, 21, 0.78)');
          ctx.fillStyle = fuelGradient;
          ctx.fillRect(-r, fuelTop, r * 2, r * 2);
          ctx.strokeStyle = 'rgba(255, 211, 142, 0.44)';
          ctx.lineWidth = Math.max(0.55, r * 0.09);
          ctx.beginPath();
          ctx.ellipse(
            0,
            fuelTop,
            r * 0.9,
            Math.max(0.45, r * 0.12),
            Math.sin(bubble.age * 1.7 + bubble.phase) * 0.08,
            0,
            TAU
          );
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.translate(bubble.x, bubble.y);
          ctx.strokeStyle = filling
            ? 'rgba(255, 226, 177, 0.88)'
            : 'rgba(210, 222, 210, 0.66)';
          ctx.lineWidth = Math.max(0.8, r * 0.14);
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, TAU);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(255, 255, 244, 0.78)';
          ctx.lineWidth = Math.max(0.55, r * 0.1);
          ctx.beginPath();
          ctx.arc(-r * 0.08, -r * 0.1, r * 0.62, Math.PI * 1.04, Math.PI * 1.46);
          ctx.stroke();
          ctx.restore();
        }

        function drawPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.globalAlpha = 1 - progress;
          ctx.strokeStyle = 'rgba(236, 216, 181, 0.82)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, pop.radius * (1 + ease * 2.9), 0, TAU);
          ctx.stroke();
          for (let i = 0; i < 5; i += 1) {
            const angle = pop.phase + (i / 5) * TAU;
            const distance = pop.radius * (0.5 + ease * 3.2);
            ctx.fillStyle = i % 2 ? '#d68948' : '#d8dfd5';
            ctx.beginPath();
            ctx.arc(
              Math.cos(angle) * distance,
              Math.sin(angle) * distance,
              Math.max(0.55, pop.radius * 0.12 * (1 - progress)),
              0,
              TAU
            );
            ctx.fill();
          }
          ctx.restore();
        }

        function fbm(x, y) {
          let value = 0;
          let amplitude = 0.52;
          for (let octave = 0; octave < 4; octave += 1) {
            value += amplitude * noise2(x, y);
            const nextX = (x * 0.8 + y * 0.6) * 2.03 + 13.17;
            const nextY = (-x * 0.6 + y * 0.8) * 2.03 + 7.91;
            x = nextX;
            y = nextY;
            amplitude *= 0.49;
          }
          return value;
        }

        function noise2(x, y) {
          const ix = Math.floor(x);
          const iy = Math.floor(y);
          const fx = x - ix;
          const fy = y - iy;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = hash2(ix, iy);
          const b = hash2(ix + 1, iy);
          const c = hash2(ix, iy + 1);
          const d = hash2(ix + 1, iy + 1);
          return mix(mix(a, b, ux), mix(c, d, ux), uy);
        }

        function hash2(x, y) {
          let value = Math.imul(x | 0, 0x1f123bb5) ^ Math.imul(y | 0, 0x5f356495) ^ seed;
          value ^= value >>> 15;
          value = Math.imul(value, 0x2c1b3c6d);
          value ^= value >>> 12;
          value = Math.imul(value, 0x297a2d39);
          value ^= value >>> 15;
          return (value >>> 0) / 4294967296;
        }

        function seedFromLocation() {
          const value = params.get('seed');
          return value ? hashString(value) : Math.floor(Math.random() * 0x7fffffff);
        }

        function hashString(value) {
          let hash = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            hash ^= value.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return hash >>> 0;
        }

        function mulberry32(value) {
          return () => {
            let t = (value += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function smoothstep(edge0, edge1, value) {
          const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
          return amount * amount * (3 - 2 * amount);
        }

        function mix(a, b, amount) {
          return a + (b - a) * amount;
        }

        function clamp(value, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, value));
        }

        function clampByte(value) {
          return Math.max(0, Math.min(255, Math.round(value)));
        }
      })();
    </script>
