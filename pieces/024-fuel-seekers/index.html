<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Hermit-crab fuel shells grow as they drink from ten diamond pumps; emptied shells lie inert until an energy worm moves in."
    />
    <title>Fuel Seekers · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #1f201e;
        --focus: #f2ad61;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -7px;
      }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Fuel Seekers: forty-six spiral shells drift across a dark marbled oil field between ten diamond fuel pumps. Each shell holds a vertical amber fuel level and grows a wider body with another whorl every time it drinks, so older shells carry more and travel farther. A shell that empties does not die: it settles as an inert grey husk and waits. The pumps release glowing energy worms every now and again, and a worm that reaches an empty husk moves in and takes it back onto the field. Filling a shell burns away the vein beneath its pump; exhausted deposits cannot host another pump. Press R to reseed the field."
    ></canvas>
    <p id="status" class="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.getElementById('status');
        const fieldCanvas = document.createElement('canvas');
        const fieldCtx = fieldCanvas.getContext('2d', { alpha: false });
        const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
        const params = new URLSearchParams(location.search);

        const TAU = Math.PI * 2;
        const STATION_PORTS = [
          { x: 0, y: -1 },
          { x: 1, y: 0 },
          { x: 0, y: 1 },
          { x: -1, y: 0 }
        ];
        const SHELL_COUNT = 46;
        const STATION_COUNT = 10;
        const REFUEL_THRESHOLD = 0.25;
        const COLLISION_GAP = 1.5;
        const COLLISION_PASSES = 6;
        const MAX_CAPACITY = 2.8;
        const GROWTH_PER_UNIT = 0.15;
        const WORM_CHARGE = 0.46;
        const WORM_COST = 0.32;
        const WORM_INTERVAL = 30;
        const WORM_LIFE = 27;
        const WORM_SEGMENTS = 26;
        const FIELD_BASE = [31, 32, 30];
        const OIL_TINT = [25, 20, 8];
        const WORM_CORE = [132, 228, 233];
        const WORM_TAIL = [58, 116, 172];

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let stations = [];
        let shells = [];
        let worms = [];
        let pops = [];
        let stationPops = [];
        let depletedPatches = [];
        let pendingStations = [];
        let resourceCandidates = [];
        let lastFrameAt = 0;
        let nextShellId = 1;
        let nextStationId = 1;
        let nextWormId = 1;
        let vacatedCount = 0;
        let revivedCount = 0;
        let raf = 0;
        let noiseOffsetX = 0;
        let noiseOffsetY = 0;
        let fieldRotation = 0;
        let fieldScale = 4.8;

        configureField();
        resize(true);
        bindEvents();
        raf = requestAnimationFrame(frame);

        function bindEvents() {
          addEventListener('resize', () => resize(false), { passive: true });
          canvas.addEventListener('pointerdown', () => {
            canvas.focus({ preventScroll: true });
          });
          canvas.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') reseed();
          });
          document.addEventListener('visibilitychange', () => {
            lastFrameAt = 0;
            if (!document.hidden && !raf) raf = requestAnimationFrame(frame);
          });
          if (typeof motionQuery.addEventListener === 'function') {
            motionQuery.addEventListener('change', () => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          } else if (typeof motionQuery.addListener === 'function') {
            motionQuery.addListener(() => {
              lastFrameAt = 0;
              if (!raf) raf = requestAnimationFrame(frame);
            });
          }
        }

        function reseed() {
          const seedToken = Math.floor(Math.random() * 0x7fffffff).toString(36);
          seed = hashString(seedToken);
          random = mulberry32(seed);
          const url = new URL(location.href);
          url.searchParams.set('seed', seedToken);
          history.replaceState(null, '', url);
          configureField();
          buildScene();
          status.textContent = `New oil field ${String(seed % 10000).padStart(4, '0')}`;
          if (!raf) raf = requestAnimationFrame(frame);
        }

        function resize(firstRun) {
          const nextWidth = Math.max(1, innerWidth);
          const nextHeight = Math.max(1, innerHeight);
          if (!firstRun && nextWidth === width && nextHeight === height) return;

          width = nextWidth;
          height = nextHeight;
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildScene();
        }

        function configureField() {
          const fieldRandom = mulberry32(seed ^ 0x91e10da5);
          noiseOffsetX = (fieldRandom() - 0.5) * 34;
          noiseOffsetY = (fieldRandom() - 0.5) * 34;
          fieldRotation = 0.22 + fieldRandom() * 0.82;
          fieldScale = 4.25 + fieldRandom() * 1.5;
        }

        function buildScene() {
          random = mulberry32(seed ^ 0x6c8e9cf5);
          buildFieldTexture();
          depletedPatches = [];
          pendingStations = [];
          stationPops = [];
          stations = [];
          shells = [];
          worms = [];
          pops = [];
          nextShellId = 1;
          nextStationId = 1;
          nextWormId = 1;
          vacatedCount = 0;
          revivedCount = 0;
          placeStations();

          for (let i = 0; i < SHELL_COUNT; i += 1) {
            shells.push(createShell(i));
          }

          for (let i = 0; i < Math.min(STATION_COUNT, shells.length); i += 1) {
            const shell = shells[i];
            const station = stations[i];
            shell.state = 'filling';
            shell.station = station;
            shell.target = station;
            shell.fuel = shell.capacity * (0.16 + random() * 0.72);
            shell.fillRate = 0.25 + random() * 0.24;
            shell.dockPort = chooseOpenPort(station, shell);
            const dock = shellDockPosition(shell, station);
            shell.x = dock.x;
            shell.y = dock.y;
            shell.vx = 0;
            shell.vy = 0;
            shell.heading = Math.atan2(station.y - shell.y, station.x - shell.x);
            station.occupants[shell.dockPort] = shell;
          }

          for (let i = STATION_COUNT; i < shells.length; i += 1) {
            chooseTarget(shells[i], true);
          }

          const emptyCount = Math.max(3, Math.round(SHELL_COUNT * 0.15));
          for (let i = 0; i < emptyCount && shells.length - 1 - i > STATION_COUNT; i += 1) {
            const shell = shells[shells.length - 1 - i];
            shell.growth += random() * 6;
            applyShellGrowth(shell);
            shell.state = 'inert';
            shell.fuel = 0;
            shell.vx = 0;
            shell.vy = 0;
            shell.target = null;
            shell.heading = random() * TAU;
          }

          resolveSceneCollisions(false, COLLISION_PASSES * 2);
          draw();
        }
        function buildFieldTexture() {
          const longest = Math.max(width, height);
          const scale = Math.min(0.72, 680 / longest);
          const textureWidth = Math.max(240, Math.round(width * scale));
          const textureHeight = Math.max(180, Math.round(height * scale));
          fieldCanvas.width = textureWidth;
          fieldCanvas.height = textureHeight;

          const image = fieldCtx.createImageData(textureWidth, textureHeight);
          const data = image.data;

          for (let y = 0; y < textureHeight; y += 1) {
            const ny = (y + 0.5) / textureHeight;
            for (let x = 0; x < textureWidth; x += 1) {
              const nx = (x + 0.5) / textureWidth;
              const sample = fieldAt(nx, ny);
              const cloud = sample.cloud - 0.5;
              const oil = sample.resource;
              const mineral = (hash2(x + 711, y - 193) - 0.5) * 1.9;
              const index = (y * textureWidth + x) * 4;

              data[index] = clampByte(
                FIELD_BASE[0] + cloud * 8.0 + oil * OIL_TINT[0] + mineral
              );
              data[index + 1] = clampByte(
                FIELD_BASE[1] + cloud * 7.2 + oil * OIL_TINT[1] + mineral
              );
              data[index + 2] = clampByte(
                FIELD_BASE[2] + cloud * 6.2 + oil * OIL_TINT[2] + mineral * 0.7
              );
              data[index + 3] = 255;
            }
          }

          fieldCtx.putImageData(image, 0, 0);
        }

        function fieldAt(nx, ny) {
          const aspect = width / Math.max(1, height);
          let px = (nx - 0.5) * aspect;
          let py = ny - 0.5;
          const cosine = Math.cos(fieldRotation);
          const sine = Math.sin(fieldRotation);
          const turnedX = (cosine * px - sine * py) * fieldScale;
          const turnedY = (sine * px + cosine * py) * fieldScale;
          px = turnedX;
          py = turnedY;

          const qx = fbm(px * 0.62 + noiseOffsetX, py * 0.62 + noiseOffsetY);
          const qy = fbm(
            px * 0.62 + noiseOffsetX + 5.2,
            py * 0.62 + noiseOffsetY + 1.3
          );
          const rx = fbm(
            px + qx * 2.35 + noiseOffsetX * 0.3,
            py + qy * 2.35 + noiseOffsetY * 0.3
          );
          const ry = fbm(
            px + qy * 2.05 + 8.3,
            py + qx * 2.05 + 2.8
          );
          const folds = fbm(
            px * 0.82 + rx * 3.1 + qx * 0.8,
            py * 0.82 + ry * 3.1 + qy * 0.8
          );
          const current = folds * 1.82 + rx * 0.84 + qy * 0.31 + py * 0.055;
          const distance = Math.abs(Math.sin(current * 7.15));
          const vein = 1 - smoothstep(0.075, 0.31, distance);
          const halo = 1 - smoothstep(0.075, 0.61, distance);
          const secondary = Math.abs(
            Math.sin((fbm(px * 1.56 + ry * 2.4, py * 1.56 + rx * 2.4) * 1.5 + folds * 0.8) * 10.8 + 1.7)
          );
          const hairline = (1 - smoothstep(0.025, 0.105, secondary)) *
            smoothstep(0.2, 0.82, folds);
          const cloud = fbm(px * 0.34 + 17, py * 0.34 + 17);
          const resource = clamp(
            vein * 0.58 + halo * 0.27 + hairline * 0.12 + Math.pow(folds, 2.2) * 0.16,
            0,
            1
          );
          return { resource, cloud };
        }

        function placeStations() {
          resourceCandidates = [];
          const marginX = Math.min(0.11, 62 / Math.max(1, width));
          const marginY = Math.min(0.11, 62 / Math.max(1, height));
          const stationRandom = mulberry32(seed ^ 0x27d4eb2d);

          for (let i = 0; i < 1800; i += 1) {
            const nx = marginX + stationRandom() * (1 - marginX * 2);
            const ny = marginY + stationRandom() * (1 - marginY * 2);
            const sample = fieldAt(nx, ny);
            resourceCandidates.push({
              nx,
              ny,
              value: sample.resource + stationRandom() * 0.018,
              burned: false
            });
          }

          resourceCandidates.sort((a, b) => b.value - a.value);
          const selected = [];
          while (selected.length < STATION_COUNT) {
            const point = pickResourcePoint(selected, false);
            if (!point) break;
            selected.push(point);
          }
          stations = selected.map((point) => createStation(point, false));
        }

        function pickResourcePoint(extraPoints = [], respectDepletion = true) {
          const occupied = stations.concat(extraPoints);
          const baseSeparation = Math.min(width, height) * 0.16;
          const relaxations = [1, 0.8, 0.62, 0.46, 0.32];

          for (const relaxation of relaxations) {
            for (const candidate of resourceCandidates) {
              if (candidate.burned) continue;
              const x = candidate.nx * width;
              const y = candidate.ny * height;
              const awayFromStations = occupied.every((other) => {
                const otherX = other.x ?? other.nx * width;
                const otherY = other.y ?? other.ny * height;
                return Math.hypot(x - otherX, y - otherY) >= baseSeparation * relaxation;
              });
              if (!awayFromStations) continue;

              if (respectDepletion) {
                const untouched = depletedPatches.every((patch) =>
                  Math.hypot(x - patch.x, y - patch.y) >=
                    patch.radius * (0.72 + relaxation * 0.35)
                );
                if (!untouched) continue;
              }
              return candidate;
            }
          }
          return null;
        }

        function createStation(point, entering) {
          const size = clamp(Math.min(width, height) * 0.022, 11, 18);
          const capacity = 7.2 + point.value * 5.4 + random() * 2.4;
          return {
            id: nextStationId++,
            x: point.nx * width,
            y: point.ny * height,
            nx: point.nx,
            ny: point.ny,
            resource: point.value,
            size,
            occupants: Array(STATION_PORTS.length).fill(null),
            phase: random() * TAU,
            capacity,
            remaining: capacity,
            wormTimer: WORM_INTERVAL * (0.3 + random() * 0.9),
            flowAngle: fieldTangent(point.nx, point.ny),
            eraseColor: fieldBaseColor(point.nx, point.ny),
            birth: entering ? 0 : 1
          };
        }
        function fieldTangent(nx, ny) {
          const epsilon = 0.004;
          const left = fieldAt(clamp(nx - epsilon, 0, 1), ny).resource;
          const right = fieldAt(clamp(nx + epsilon, 0, 1), ny).resource;
          const above = fieldAt(nx, clamp(ny - epsilon, 0, 1)).resource;
          const below = fieldAt(nx, clamp(ny + epsilon, 0, 1)).resource;
          return Math.atan2(right - left, above - below);
        }

        function fieldBaseColor(nx, ny) {
          const cloud = fieldAt(nx, ny).cloud - 0.5;
          return [
            clampByte(FIELD_BASE[0] + cloud * 8),
            clampByte(FIELD_BASE[1] + cloud * 7.2),
            clampByte(FIELD_BASE[2] + cloud * 6.2)
          ];
        }

        function createShell(index = 0) {
          const baseRadius = 8.5 + Math.pow(random(), 1.3) * 10;
          const speedBase = clamp(Math.min(width, height) * 0.058, 25, 52);
          const shell = {
            id: nextShellId++,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            baseRadius,
            radius: baseRadius,
            capacity: 1,
            growth: Math.pow(random(), 1.6) * 2.6,
            baseSpeed: speedBase * (0.72 + random() * 0.62),
            speed: speedBase,
            fuel: 0,
            range: Math.max(width, height) * (0.7 + random() * 0.46),
            state: 'travel',
            station: null,
            target: null,
            retargetIn: 0,
            fillRate: 0.27 + random() * 0.21,
            dockPort: null,
            age: random() * 14,
            phase: random() * TAU,
            wobble: 0.7 + random() * 1.2,
            heading: random() * TAU,
            spin: 0,
            claim: null,
            inertAge: 0,
            escapeX: null,
            escapeY: null,
            returning: false,
            returnProgress: 0,
            returnLegStart: 1,
            returnLegBase: 0,
            returnTargetId: null
          };

          applyShellGrowth(shell);
          shell.fuel = shell.capacity * (0.22 + random() * 0.76);
          shell.x = width * (0.06 + random() * 0.88);
          shell.y = height * (0.06 + random() * 0.88);
          const angle = random() * TAU;
          shell.vx = Math.cos(angle) * shell.speed * 0.45;
          shell.vy = Math.sin(angle) * shell.speed * 0.45;
          shell.heading = angle;
          shell.phase += index * 0.11;
          if (fuelLevel(shell) > REFUEL_THRESHOLD) chooseEscapePoint(shell);
          return shell;
        }

        function applyShellGrowth(shell) {
          shell.capacity = clamp(1 + shell.growth * GROWTH_PER_UNIT, 1, MAX_CAPACITY);
          shell.radius = shell.baseRadius * Math.pow(shell.capacity, 0.44);
          shell.speed = shell.baseSpeed *
            (1 - 0.26 * (shell.capacity - 1) / (MAX_CAPACITY - 1));
          if (shell.fuel > shell.capacity) shell.fuel = shell.capacity;
        }

        function fuelLevel(shell) {
          return clamp(shell.fuel / shell.capacity, 0, 1);
        }

        function turnToward(current, target, rate) {
          let delta = target - current;
          while (delta > Math.PI) delta -= TAU;
          while (delta < -Math.PI) delta += TAU;
          return current + delta * clamp(rate, 0, 1);
        }
        function chooseEscapePoint(shell) {
          const margin = shell.radius + 24;
          const candidates = [
            { x: margin, y: margin },
            { x: width - margin, y: margin },
            { x: width - margin, y: height - margin },
            { x: margin, y: height - margin }
          ];

          for (let i = 0; i < 24; i += 1) {
            candidates.push({
              x: margin + random() * Math.max(1, width - margin * 2),
              y: margin + random() * Math.max(1, height - margin * 2)
            });
          }

          let best = candidates[0];
          let bestScore = -Infinity;
          for (const candidate of candidates) {
            const nearestStation = stations.length
              ? Math.min(...stations.map((station) =>
                  Math.hypot(candidate.x - station.x, candidate.y - station.y)
                ))
              : Math.hypot(candidate.x - width * 0.5, candidate.y - height * 0.5);
            const travelDistance = Math.hypot(candidate.x - shell.x, candidate.y - shell.y);
            const sourceDistance = shell.station
              ? Math.hypot(candidate.x - shell.station.x, candidate.y - shell.station.y)
              : travelDistance;
            const destinationSeparation = shells.length
              ? Math.min(...shells
                  .filter((other) => other !== shell && other.escapeX !== null)
                  .map((other) => Math.hypot(candidate.x - other.escapeX, candidate.y - other.escapeY))
                  .concat(Math.min(width, height)))
              : Math.min(width, height);
            const crowdedDestination =
              destinationSeparation < Math.min(width, height) * 0.16
                ? Math.min(width, height) * 0.7
                : 0;
            const score =
              nearestStation * 0.72 +
              sourceDistance * 0.2 +
              travelDistance * 0.04 +
              destinationSeparation * 0.62 -
              crowdedDestination +
              random() * Math.min(width, height) * 0.025;
            if (score > bestScore) {
              best = candidate;
              bestScore = score;
            }
          }

          shell.escapeX = best.x;
          shell.escapeY = best.y;
        }

        function chooseTarget(shell, avoidCurrent) {
          if (fuelLevel(shell) > REFUEL_THRESHOLD) {
            shell.target = null;
            shell.retargetIn = 0.5 + random() * 0.8;
            return;
          }

          const available = stations.filter((station) =>
            stationHasOpenPort(station) &&
            station.remaining > 0 &&
            station.birth >= 0.68 &&
            (!avoidCurrent || station !== shell.station)
          );
          if (!available.length) {
            shell.target = null;
            shell.retargetIn = 0.12 + random() * 0.24;
            return;
          }

          let best = available[0];
          let bestScore = Infinity;
          for (const station of available) {
            const distance = Math.hypot(station.x - shell.x, station.y - shell.y);
            const crowding = shells.reduce((count, other) =>
              count + (other !== shell && other.state === 'travel' && other.target === station ? 1 : 0), 0
            );
            const score = distance * (0.88 + random() * 0.22) + crowding * station.size * 1.9;
            if (score < bestScore) {
              best = station;
              bestScore = score;
            }
          }
          shell.target = best;
          shell.retargetIn = 0.7 + random() * 0.8;
        }

        function frame(time) {
          raf = 0;
          if (document.hidden) return;

          if (!lastFrameAt) lastFrameAt = time;
          const dt = Math.min(0.04, Math.max(0, (time - lastFrameAt) / 1000));
          lastFrameAt = time;

          if (!motionQuery.matches) update(dt);
          draw();

          if (!motionQuery.matches) raf = requestAnimationFrame(frame);
        }

        function update(dt) {
          updateStations(dt);

          for (const shell of shells) {
            shell.age += dt;
            if (shell.state === 'filling') updateFillingShell(shell, dt);
            else if (shell.state === 'inert') updateInertShell(shell, dt);
            else updateTravelingShell(shell, dt);
          }

          updateWorms(dt);
          resolveSceneCollisions(true, COLLISION_PASSES);

          for (let i = pops.length - 1; i >= 0; i -= 1) {
            pops[i].age += dt;
            if (pops[i].age >= pops[i].duration) pops.splice(i, 1);
          }

          for (let i = stationPops.length - 1; i >= 0; i -= 1) {
            stationPops[i].age += dt;
            if (stationPops[i].age >= stationPops[i].duration) stationPops.splice(i, 1);
          }
        }

        function updateInertShell(shell, dt) {
          shell.inertAge += dt;
          const drag = 1 - Math.exp(-dt * 2.6);
          shell.vx -= shell.vx * drag;
          shell.vy -= shell.vy * drag;
          shell.x += shell.vx * dt;
          shell.y += shell.vy * dt;
          shell.spin -= shell.spin * drag;
          shell.heading += shell.spin * dt;
          const margin = shell.radius * 0.8;
          shell.x = clamp(shell.x, margin, Math.max(margin, width - margin));
          shell.y = clamp(shell.y, margin, Math.max(margin, height - margin));
        }
        function updateWorms(dt) {
          for (let i = worms.length - 1; i >= 0; i -= 1) {
            const worm = worms[i];
            worm.age += dt;

            if (
              worm.target &&
              (worm.target.state !== 'inert' || worm.target.claim !== worm.id)
            ) {
              worm.target = null;
            }
            worm.retargetIn -= dt;
            if (!worm.target && worm.retargetIn <= 0) {
              worm.target = claimInertShell(worm);
              worm.retargetIn = 0.4 + random() * 0.7;
            }

            let desiredX;
            let desiredY;
            if (worm.target) {
              const dx = worm.target.x - worm.x;
              const dy = worm.target.y - worm.y;
              const distance = Math.max(0.001, Math.hypot(dx, dy));
              if (distance <= worm.target.radius * 0.85) {
                inhabitShell(worm.target, worm);
                worms.splice(i, 1);
                continue;
              }
              desiredX = dx / distance;
              desiredY = dy / distance;
            } else {
              if (
                worm.wanderX === null ||
                Math.hypot(worm.wanderX - worm.x, worm.wanderY - worm.y) < 48
              ) {
                worm.wanderX = width * (0.12 + random() * 0.76);
                worm.wanderY = height * (0.12 + random() * 0.76);
              }
              const dx = worm.wanderX - worm.x;
              const dy = worm.wanderY - worm.y;
              const distance = Math.max(0.001, Math.hypot(dx, dy));
              desiredX = dx / distance;
              desiredY = dy / distance;
            }

            const swim = Math.sin(worm.phase + worm.age * worm.wobble) * 0.62;
            let steerX = desiredX - desiredY * swim;
            let steerY = desiredY + desiredX * swim;
            const steerLength = Math.max(0.001, Math.hypot(steerX, steerY));
            steerX /= steerLength;
            steerY /= steerLength;

          const y = station.y + port.y * station.size * 1.5;

            id: nextWormId++,

            y,
            vx: port.x * speed,
            vy: port.y * speed,
            speed,

          shell.target = null;
          shell.dockPort = null;
          shell.returning = false;
          shell.returnProgress = 0;
          shell.returnLegBase = 0;
          shell.returnTargetId = null;
          shell.returnTargetId = null;
          shell.retargetIn = 0;
          shell.spin = 0;
          shell.age = 0;

          shell.vy = worm.vy * 0.4;

            x: shell.x,
            y: shell.y,
            age: 0,
            duration: 0.9,
            radius: shell.radius,
            phase: shell.phase,
            kind: 'wake'

          shell.station = null;
          shell.target = null;

          shell.claim = null;

          const strength = Math.pow(amount, 0.62);

          target.save();
          target.translate(patch.x, patch.y);
          target.rotate(angle);
          target.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;

          const layers = [
            { scale: 1.12, thickness: 0.34, alpha: 0.18 },
            { scale: 0.92, thickness: 0.29, alpha: 0.42 },
            { scale: 0.72, thickness: 0.24, alpha: 0.82 }
          ];
          for (const layer of layers) {
            target.globalAlpha = strength * layer.alpha;
            target.beginPath();
            target.ellipse(
              0,
              0,
              baseRadius * layer.scale,
              Math.max(2, baseRadius * layer.thickness),
              Math.sin(patch.phase) * 0.08,
              0,
              TAU
            );
            target.fill();
          }

          target.globalAlpha = strength * 0.54;
          target.beginPath();
          target.ellipse(
            -baseRadius * 0.48,
            baseRadius * 0.08 * Math.sin(patch.phase * 1.7),
            baseRadius * 0.55,
            baseRadius * 0.2,
            0,
            0,
            TAU
          );
          target.fill();
          target.restore();
        }

        function drawStation(station) {
          const { x, y } = station;
          const occupied = station.occupants.some(Boolean);
          const reserve = clamp(station.remaining / station.capacity, 0, 1);
          const s = currentStationSize(station);
          const born = 1 - Math.pow(1 - station.birth, 3);

          ctx.save();
          ctx.translate(x, y);
          ctx.scale(born, born);

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const shell = station.occupants[i];
            if (!shell) continue;
            const port = STATION_PORTS[i];
            ctx.strokeStyle = 'rgba(244, 183, 111, 0.38)';
            ctx.lineWidth = Math.max(0.8, s * 0.055);
            ctx.beginPath();
            ctx.moveTo(port.x * s, port.y * s);
            ctx.lineTo(shell.x - x, shell.y - y);
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(-s * 0.08, s * 0.18);
          traceStationShape(s * 1.05);
          ctx.fillStyle = 'rgba(5, 6, 5, 0.44)';
          ctx.fill();
          ctx.restore();

          traceStationShape(s);
          ctx.fillStyle = 'rgba(24, 27, 24, 0.92)';
          ctx.fill();

          if (reserve > 0.002) {
            const fuelTop = s - reserve * s * 2;
            ctx.save();
            traceStationShape(s);
            ctx.clip();
            ctx.fillStyle = 'rgba(224, 147, 76, 0.9)';
            ctx.fillRect(-s, fuelTop, s * 2, s * 2);
            ctx.restore();

            if (reserve < 0.998) {
              const surfaceHalfWidth = Math.max(0, s - Math.abs(fuelTop));
              ctx.beginPath();
              ctx.moveTo(-surfaceHalfWidth, fuelTop);
              ctx.lineTo(surfaceHalfWidth, fuelTop);
              ctx.strokeStyle = 'rgba(255, 218, 159, 0.86)';
              ctx.lineWidth = Math.max(0.8, s * 0.055);
              ctx.stroke();
            }
          }

          traceStationShape(s);
          ctx.strokeStyle = occupied
            ? 'rgba(255, 222, 171, 0.92)'
            : 'rgba(244, 178, 104, 0.78)';
          ctx.lineWidth = Math.max(1, s * 0.085);
          ctx.stroke();

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const port = STATION_PORTS[i];
            const portOccupied = Boolean(station.occupants[i]);
            ctx.beginPath();
            ctx.arc(port.x * s, port.y * s, Math.max(1.6, s * 0.12), 0, TAU);
            ctx.fillStyle = portOccupied
              ? 'rgba(255, 230, 186, 0.98)'
              : 'rgba(56, 46, 34, 0.96)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(246, 184, 111, 0.9)';
            ctx.lineWidth = Math.max(0.65, s * 0.045);
            ctx.stroke();
          }
          ctx.restore();
        }

        function currentStationSize(station) {
          return station.size;
        }

        function traceStationShape(size) {
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size, 0);
          ctx.lineTo(0, size);
          ctx.lineTo(-size, 0);
          ctx.closePath();
        }

        function drawShell(shell) {
          const r = shell.radius;
          const level = fuelLevel(shell);
          const filling = shell.state === 'filling';
          const inert = shell.state === 'inert';
          const whorls = 1.55 + (shell.capacity - 1) * 0.62;

          ctx.save();
          ctx.translate(shell.x, shell.y);
          ctx.rotate(shell.heading);

          ctx.save();
          ctx.translate(-r * 0.05, r * 0.18);
          traceShellShape(r * 1.03);
          ctx.fillStyle = 'rgba(5, 6, 5, 0.42)';
          ctx.fill();
          ctx.restore();

          traceShellShape(r);
          ctx.fillStyle = inert ? 'rgba(29, 30, 27, 0.94)' : 'rgba(23, 25, 22, 0.74)';
          ctx.fill();

          if (level > 0.002) {
            ctx.save();
            traceShellShape(r);
            ctx.clip();
            ctx.rotate(-shell.heading);
            const fuelTop = r - level * r * 2;
            ctx.fillStyle = filling
              ? 'rgba(234, 151, 73, 0.74)'
              : 'rgba(201, 111, 50, 0.66)';
            ctx.fillRect(-r * 1.9, fuelTop, r * 3.8, r * 3.8);
            if (level < 0.998) {
              ctx.strokeStyle = filling
                ? 'rgba(255, 211, 148, 0.82)'
                : 'rgba(232, 153, 86, 0.62)';
              ctx.lineWidth = Math.max(0.8, r * 0.055);
              ctx.beginPath();
              ctx.moveTo(-r * 1.9, fuelTop);
              ctx.lineTo(r * 1.9, fuelTop);
              ctx.stroke();
            }
            ctx.restore();
          }

          traceShellWhorl(r, whorls);
          ctx.strokeStyle = inert
            ? 'rgba(148, 152, 141, 0.26)'
            : 'rgba(226, 234, 222, 0.3)';
          ctx.lineWidth = Math.max(0.55, r * 0.045);
          ctx.stroke();

          traceShellShape(r);
          ctx.strokeStyle = inert
            ? 'rgba(139, 145, 134, 0.46)'
            : filling
              ? 'rgba(255, 224, 174, 0.86)'
              : 'rgba(209, 222, 209, 0.62)';
          ctx.lineWidth = Math.max(1, r * 0.08);
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(r * 0.6, r * 0.1, r * 0.26, r * 0.4, -0.22, 0, TAU);
          ctx.fillStyle = 'rgba(7, 8, 7, 0.88)';
          ctx.fill();
          ctx.strokeStyle = inert
            ? 'rgba(132, 138, 128, 0.34)'
            : 'rgba(214, 226, 212, 0.44)';
          ctx.lineWidth = Math.max(0.6, r * 0.045);
          ctx.stroke();

          if (!inert) drawOccupant(shell, r, level);
          ctx.restore();
        }

        function drawOccupant(shell, r, level) {
          const reach = r * (0.26 + level * 0.4);
          const wave = Math.sin(shell.phase + shell.age * 5.4);
          const color = mixRgb(WORM_TAIL, WORM_CORE, 0.32 + level * 0.6);

          ctx.lineCap = 'round';
          ctx.strokeStyle = colorStyle(color, 0.4 + level * 0.4);
          ctx.lineWidth = Math.max(0.7, r * 0.075);
          for (let i = -1; i <= 1; i += 2) {
            const spread = 0.44 * i + wave * 0.3;
            ctx.beginPath();
            ctx.moveTo(r * 0.58, r * 0.1 + i * r * 0.12);
            ctx.quadraticCurveTo(
              r * (0.84 + level * 0.12),
              r * 0.1 + i * r * 0.26 + wave * r * 0.07,
              r * 0.6 + Math.cos(spread) * reach,
              r * 0.1 + Math.sin(spread) * reach
            );
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(r * 0.56, r * 0.1, Math.max(0.8, r * 0.12), 0, TAU);
          ctx.fillStyle = colorStyle(WORM_CORE, 0.3 + level * 0.46);
          ctx.fill();
        }

        function drawWorm(worm) {
          const points = worm.trail;
          if (points.length < 2) return;
          const fade =
            clamp((worm.life - worm.age) / 3.2, 0, 1) * clamp(worm.age / 0.4, 0, 1);
          if (fade <= 0.01) return;

          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          const halo = worm.width * 9;
          const glow = ctx.createRadialGradient(worm.x, worm.y, 0, worm.x, worm.y, halo);
          glow.addColorStop(0, colorStyle(WORM_CORE, 0.32 * fade));
          glow.addColorStop(1, colorStyle(WORM_CORE, 0));
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(worm.x, worm.y, halo, 0, TAU);
          ctx.fill();

          for (let i = points.length - 1; i > 0; i -= 1) {
            const t = i / (points.length - 1);
            ctx.strokeStyle = colorStyle(
              mixRgb(WORM_CORE, WORM_TAIL, t),
              (0.92 - t * 0.7) * fade
            );
            ctx.lineWidth = Math.max(0.5, worm.width * (1.05 - t * 0.8));
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[i - 1].x, points[i - 1].y);
            ctx.stroke();
          }

          ctx.fillStyle = colorStyle([236, 248, 246], 0.9 * fade);
          ctx.beginPath();
          ctx.arc(worm.x, worm.y, Math.max(0.8, worm.width * 0.66), 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        function traceShellShape(r) {
          ctx.beginPath();
          ctx.moveTo(r * 0.92, -r * 0.22);
          ctx.bezierCurveTo(r * 0.66, -r * 0.92, -r * 0.2, -r, -r * 0.62, -r * 0.52);
          ctx.bezierCurveTo(-r * 1.02, -r * 0.12, -r * 1.22, r * 0.2, -r * 1.02, r * 0.42);
          ctx.bezierCurveTo(-r * 0.72, r * 0.66, -r * 0.1, r * 0.9, r * 0.44, r * 0.72);
          ctx.bezierCurveTo(r * 0.82, r * 0.58, r * 0.99, r * 0.24, r * 0.92, -r * 0.22);
          ctx.closePath();
        }

        function traceShellWhorl(r, turns) {
          const steps = Math.max(26, Math.round(turns * 26));
          ctx.beginPath();
          for (let i = 0; i <= steps; i += 1) {
            const t = i / steps;
            const angle = 2.4 + t * turns * TAU;
            const radius = r * 0.08 * Math.exp(t * 2.32);
            const x = -r * 0.24 + Math.cos(angle) * radius * 0.95;
            const y = r * 0.06 + Math.sin(angle) * radius * 0.74;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        }
        function drawStationPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 4);
          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.globalAlpha = 1 - progress;

          traceStationShape(pop.radius * (1 + ease * 2.2));
          ctx.strokeStyle = 'rgba(242, 168, 91, 0.74)';
          ctx.lineWidth = Math.max(1, pop.radius * 0.07 * (1 - progress));
          ctx.stroke();

          for (let i = 0; i < STATION_PORTS.length; i += 1) {
            const angle = -Math.PI / 2 + (i / STATION_PORTS.length) * TAU;
            const distance = pop.radius * (0.7 + ease * 3.6);
            ctx.save();
            ctx.translate(Math.cos(angle) * distance, Math.sin(angle) * distance);
            ctx.rotate(angle + ease * 1.4);
            ctx.fillStyle = i % 2 ? '#d17a3d' : '#eca55d';
            ctx.beginPath();
            ctx.moveTo(pop.radius * 0.2, 0);
            ctx.lineTo(-pop.radius * 0.13, pop.radius * 0.11);
            ctx.lineTo(-pop.radius * 0.13, -pop.radius * 0.11);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }

        function drawPop(pop) {
          const progress = clamp(pop.age / pop.duration, 0, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.globalAlpha = 1 - progress;

          if (pop.kind === 'emit') {
            ctx.strokeStyle = colorStyle(WORM_CORE, 0.6);
            ctx.lineWidth = Math.max(0.7, pop.radius * 0.12 * (1 - progress));
            ctx.beginPath();
            ctx.arc(0, 0, pop.radius * (0.5 + ease * 2.2), 0, TAU);
            ctx.stroke();
          } else if (pop.kind === 'wake') {
            const burstRadius = pop.radius * (1 + ease * 2.4);
            const burst = ctx.createRadialGradient(0, 0, 0, 0, 0, burstRadius);
            burst.addColorStop(0, colorStyle(WORM_CORE, 0.4));
            burst.addColorStop(1, colorStyle(WORM_CORE, 0));
            ctx.fillStyle = burst;
            ctx.beginPath();
            ctx.arc(0, 0, burstRadius, 0, TAU);
            ctx.fill();

            ctx.strokeStyle = colorStyle(mixRgb(WORM_CORE, [255, 236, 205], 0.45), 0.7);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, pop.radius * (0.9 + ease * 1.5), 0, TAU);
            ctx.stroke();
          } else {
            ctx.strokeStyle = 'rgba(176, 172, 158, 0.46)';
            ctx.lineWidth = Math.max(0.7, pop.radius * 0.09 * (1 - progress));
            ctx.beginPath();
            ctx.arc(0, 0, pop.radius * (1.7 - ease * 0.75), 0, TAU);
            ctx.stroke();

            ctx.fillStyle = 'rgba(148, 144, 131, 0.32)';
            for (let i = 0; i < 4; i += 1) {
              const angle = pop.phase + (i / 4) * TAU;
              const distance = pop.radius * (0.55 + ease * 1.4);
              ctx.beginPath();
              ctx.arc(
                Math.cos(angle) * distance,
                Math.sin(angle) * distance,
                Math.max(0.5, pop.radius * 0.1 * (1 - progress)),
                0,
                TAU
              );
              ctx.fill();
            }
          }
          ctx.restore();
        }
        function fbm(x, y) {
          let value = 0;
          let amplitude = 0.52;
          for (let octave = 0; octave < 4; octave += 1) {
            value += amplitude * noise2(x, y);
            const nextX = (x * 0.8 + y * 0.6) * 2.03 + 13.17;
            const nextY = (-x * 0.6 + y * 0.8) * 2.03 + 7.91;
            x = nextX;
            y = nextY;
            amplitude *= 0.49;
          }
          return value;
        }

        function noise2(x, y) {
          const ix = Math.floor(x);
          const iy = Math.floor(y);
          const fx = x - ix;
          const fy = y - iy;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = hash2(ix, iy);
          const b = hash2(ix + 1, iy);
          const c = hash2(ix, iy + 1);
          const d = hash2(ix + 1, iy + 1);
          return mix(mix(a, b, ux), mix(c, d, ux), uy);
        }

        function hash2(x, y) {
          let value = Math.imul(x | 0, 0x1f123bb5) ^ Math.imul(y | 0, 0x5f356495) ^ seed;
          value ^= value >>> 15;
          value = Math.imul(value, 0x2c1b3c6d);
          value ^= value >>> 12;
          value = Math.imul(value, 0x297a2d39);
          value ^= value >>> 15;
          return (value >>> 0) / 4294967296;
        }

        function seedFromLocation() {
          const value = params.get('seed');
          return value ? hashString(value) : Math.floor(Math.random() * 0x7fffffff);
        }

        function hashString(value) {
          let hash = 2166136261;
          for (let i = 0; i < value.length; i += 1) {
            hash ^= value.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return hash >>> 0;
        }

        function mulberry32(value) {
          return () => {
            let t = (value += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function smoothstep(edge0, edge1, value) {
          const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
          return amount * amount * (3 - 2 * amount);
        }

        function mix(a, b, amount) {
          return a + (b - a) * amount;
        }

        function clamp(value, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, value));
        }

        function clampByte(value) {
          return Math.max(0, Math.min(255, Math.round(value)));
        }
      })();
    </script>
