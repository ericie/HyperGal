<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A directionless botanical wallpaper — hand-inked stems, unfolding leaves, and dye-pot flowers on aged rag paper."
    />
    <title>Overgrowth · HyperGal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e4d7ba;
      }

      body {
        overscroll-behavior: none;
      }

      #garden,
      #new-growth {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #garden:focus-visible {
        outline: 3px solid #4a3527;
        outline-offset: -9px;
      }

      #new-growth {
        pointer-events: none;
      }

      .sr-only {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #debug-catalog[hidden] {
        display: none;
      }

      html.debug-mode {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: scroll;
      }

      body.debug-mode {
        min-height: 100%;
        height: auto;
        overflow: visible;
        color: #292927;
        background: #dededb;
        font-family: Arial, Helvetica, sans-serif;
      }

      body.debug-mode #garden,
      body.debug-mode #new-growth {
        display: none;
      }

      .debug-catalog {
        min-height: 100vh;
        padding: clamp(18px, 3vw, 42px);
        background: #dededb;
      }

      .debug-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #292927;
      }

      .debug-header h1,
      .debug-header p,
      .debug-specimen {
        margin: 0;
      }

      .debug-header h1 {
        font-size: clamp(1.25rem, 2.3vw, 2rem);
        line-height: 1;
        letter-spacing: -0.025em;
      }

      .debug-header p {
        color: #555550;
        font-size: 0.875rem;
      }

      .debug-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
        border-left: 1px solid #b5b5b0;
      }

      .debug-specimen {
        display: grid;
        min-width: 0;
        grid-template-rows: minmax(230px, 1fr) auto;
        border-right: 1px solid #b5b5b0;
        border-bottom: 1px solid #b5b5b0;
      }

      .debug-specimen-canvas {
        display: block;
        position: static;
        width: 100%;
        height: clamp(230px, 24vw, 320px);
      }

      .debug-caption {
        display: grid;
        grid-template-columns: 2.5rem minmax(0, 1fr);
        gap: 10px;
        min-height: 66px;
        padding: 13px 14px 12px;
        border-top: 1px solid #b5b5b0;
      }

      .debug-number {
        color: #62625d;
        font-variant-numeric: tabular-nums;
      }

      .debug-name,
      .debug-latin {
        display: block;
      }

      .debug-name {
        font-size: 0.9375rem;
        line-height: 1.2;
      }

      .debug-latin {
        margin-top: 3px;
        color: #555550;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 0.8125rem;
        line-height: 1.25;
      }

      @media (max-width: 520px) {
        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="380ba6de-d087-4f44-a235-7dd4b9b174f9"></script>
  </head>
  <body>
    <canvas
      id="garden"
      tabindex="0"
      role="img"
      aria-label="Overgrowth. A dense, directionless botanical wallpaper on aged rag paper that continually fills with new hand-inked plants. Roses, peonies, poppies, lilies, daylilies, irises, hibiscus, chrysanthemums, dwarf quince, hydrangeas, honeysuckle, acanthus, Monstera, green palm and fern foliage, plus large cream rubber tree, Fatsia japonica, standalone palm fronds, and fern leaves grow in every direction. Click or press R to begin a new arrangement."
    ></canvas>
    <canvas id="new-growth" aria-hidden="true"></canvas>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <main id="debug-catalog" class="debug-catalog" hidden>
      <header class="debug-header">
        <h1>Overgrowth specimen index</h1>
        <p id="debug-count"></p>
      </header>
      <div id="debug-grid" class="debug-grid"></div>
    </main>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('garden');
        const mainCtx = canvas.getContext('2d', { alpha: false });
        const growthCanvas = document.getElementById('new-growth');
        const growthCtx = growthCanvas.getContext('2d');
        const status = document.getElementById('status');
        const TAU = Math.PI * 2;
        const GOLDEN = 0.61803398875;
        const LEAF_DEVELOPMENT_FRAMES = 20;
        const FLOWER_DEVELOPMENT_FRAMES = 20;
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const DEBUG_MODE = new URLSearchParams(location.search).get('debug') === 'true';

        // `ctx` is swapped to an offscreen surface while the faded underprint
        // layer is drawn, so every draw routine reads this binding.
        let ctx = mainCtx;

        // A dyer's palette: madder, weld, woad, walnut. Nothing here is a
        // colour a nineteenth-century printer could not have mixed.
        const P = {
          paper: '#e8dcc0',
          paperLight: '#f4ecd6',
          paperDeep: '#d3c19b',
          paperRGB: '232, 220, 192',
          ink: '#3f2d20',
          foxing: '#a97c46',

          stem: '#61713f',
          stemDeep: '#44532d',
          leafDark: '#36503a',
          leaf: '#4f6f43',
          leafMid: '#6b8548',
          leafLight: '#98a663',
          leafPale: '#cdcd9c',
          olive: '#8a8a42',
          sage: '#a9b287',
          leafCreamShade: '#ded0ae',
          leafCream: '#f1e7ce',
          leafCreamLight: '#fbf6e6',
          leafCreamVein: '#aa9c72',

          madder: '#a93c2c',
          madderDeep: '#7b2622',
          madderPale: '#d08670',
          rose: '#c26a5c',
          rosePale: '#e3ac95',
          wine: '#6d2536',
          plum: '#8b3550',

          indigo: '#2f4a63',
          indigoDeep: '#1e3247',
          woad: '#5b7f93',
          irisLight: '#eeeaf1',
          irisLavender: '#c9bfd8',
          irisViolet: '#77698f',

          ochre: '#c6963a',
          weld: '#ddb95c',
          gold: '#e8cd80',
          cream: '#f4ecd6',
          white: '#fbf6e6',
          umber: '#5b4127',
        };

        const SPECIES = [
          { key: 'rose', name: 'Rose', latin: 'Rosa gallica', leaf: 'rose', blooms: [1, 3], scale: [0.74, 1.14], weight: 13, height: [130, 215] },
          { key: 'peony', name: 'Peony', latin: 'Paeonia officinalis', leaf: 'round', blooms: [1, 2], scale: [0.82, 1.2], weight: 10, height: [125, 200] },
          { key: 'cosmos', name: 'Cosmos', latin: 'Cosmos bipinnatus', leaf: 'fine', blooms: [2, 5], scale: [0.68, 1.02], weight: 11, height: [150, 240] },
          { key: 'poppy', name: 'Poppy', latin: 'Papaver rhoeas', leaf: 'fine', blooms: [1, 3], scale: [0.78, 1.12], weight: 11, height: [140, 235] },
          { key: 'daisy', name: 'Daisy', latin: 'Leucanthemum vulgare', leaf: 'small', blooms: [2, 5], scale: [0.64, 0.98], weight: 12, height: [120, 200] },
          { key: 'lily', name: 'Lily', latin: 'Lilium lancifolium', leaf: 'lance', blooms: [1, 3], scale: [0.74, 1.08], weight: 8, height: [150, 240] },
          { key: 'orange-daylily', name: 'Orange daylily', latin: 'Hemerocallis fulva', leaf: 'daylily', blooms: [2, 5], scale: [0.72, 1.04], weight: 8, height: [145, 225], branches: [2, 4] },
          { key: 'hibiscus', name: 'Hibiscus', latin: 'Hibiscus rosa-sinensis', leaf: 'hibiscus', blooms: [1, 3], scale: [0.78, 1.08], weight: 7, height: [125, 205], branches: [2, 4] },
          { key: 'chrysanthemum', name: 'Chrysanthemum', latin: 'Chrysanthemum × morifolium', leaf: 'mum', blooms: [2, 5], scale: [0.72, 1.02], weight: 8, height: [105, 175], branches: [3, 5] },
          { key: 'hydrangea', name: 'Hydrangea', latin: 'Hydrangea macrophylla', leaf: 'round', blooms: [1, 2], scale: [0.78, 1.14], weight: 7, height: [115, 185] },
          { key: 'anemone', name: 'Anemone', latin: 'Anemone coronaria', leaf: 'small', blooms: [1, 4], scale: [0.66, 1.0], weight: 9, height: [120, 195] },
          { key: 'honeysuckle', name: 'Honeysuckle', latin: 'Lonicera periclymenum', leaf: 'ovate', blooms: [2, 4], scale: [0.72, 1.08], weight: 10, height: [260, 400], vine: true },
          { key: 'iris-japonica', name: 'Fringed iris', latin: 'Iris japonica', leaf: 'iris', blooms: [2, 4], scale: [0.7, 1.0], weight: 8, height: [185, 275], branches: [3, 5], vine: true },
          { key: 'dwarf-quince', name: 'Dwarf quince', latin: 'Chaenomeles japonica', leaf: 'quince', blooms: [2, 5], scale: [0.72, 1.04], weight: 8, height: [90, 155], branches: [4, 6] },
          { key: 'none', name: 'Acanthus', latin: 'Acanthus mollis', leaf: 'acanthus', blooms: [0, 0], scale: [0.88, 1.32], weight: 12, height: [110, 195], scroll: true },
          { key: 'rubber', name: 'Rubber tree', latin: 'Ficus elastica', leaf: 'rubber', blooms: [0, 0], scale: [0.84, 1.18], weight: 2, height: [120, 195], branches: [3, 5], pale: true },
          { key: 'fatsia', name: 'Fatsia', latin: 'Fatsia japonica', leaf: 'fatsia', blooms: [0, 0], scale: [0.8, 1.14], weight: 2, height: [115, 185], branches: [3, 5], pale: true },
          { key: 'palm', name: 'Palm', latin: 'Howea forsteriana', leaf: 'palm', blooms: [0, 0], scale: [0.74, 0.96], weight: 2, height: [24, 34], branches: [0, 0], pale: true },
          { key: 'green-palm', name: 'Green palm frond', latin: 'Howea forsteriana', leaf: 'palm', blooms: [0, 0], scale: [0.72, 0.96], weight: 4, height: [24, 34], branches: [0, 0] },
          { key: 'fern', name: 'Fern', latin: 'Dryopteris filix-mas', leaf: 'fern', blooms: [0, 0], scale: [0.76, 1.08], weight: 2, height: [105, 175], branches: [3, 5], pale: true },
          { key: 'monstera', name: 'Monstera', latin: 'Monstera deliciosa', leaf: 'monstera', blooms: [0, 0], scale: [0.84, 1.1], weight: 5, height: [90, 140], branches: [1, 2] },
          { key: 'green-fern', name: 'Green fern', latin: 'Dryopteris filix-mas', leaf: 'fern', blooms: [0, 0], scale: [0.72, 1.04], weight: 5, height: [100, 170], branches: [3, 5] },
        ];

        const LEAF_KIND = {
          rose: { profile: 'ovate', size: [14, 24], width: [0.50, 0.64], teeth: 9, serr: 0.15, sharp: true, trio: true },
          round: { profile: 'round', size: [17, 27], width: [0.66, 0.86], teeth: 7, serr: 0.11, sharp: true },
          small: { profile: 'ovate', size: [11, 19], width: [0.46, 0.6], teeth: 6, serr: 0.14, sharp: true },
          lance: { profile: 'lance', size: [16, 30], width: [0.22, 0.32], teeth: 0, serr: 0, sharp: false },
          ovate: { profile: 'ovate', size: [13, 23], width: [0.58, 0.76], teeth: 0, serr: 0, sharp: false, pair: true },
          fine: { profile: 'lance', size: [15, 26], width: [0.34, 0.5], teeth: 0, serr: 0, sharp: false, pinnate: true },
          iris: { profile: 'lance', size: [48, 78], width: [0.16, 0.24], teeth: 0, serr: 0, sharp: false },
          daylily: { profile: 'lance', size: [54, 88], width: [0.12, 0.19], teeth: 0, serr: 0, sharp: false },
          hibiscus: { profile: 'ovate', size: [18, 29], width: [0.66, 0.84], teeth: 9, serr: 0.14, sharp: true },
          mum: { profile: 'acanthus', size: [17, 28], width: [0.66, 0.86], teeth: 8, serr: 0.1, sharp: true },
          quince: { profile: 'round', size: [13, 22], width: [0.56, 0.72], teeth: 7, serr: 0.1, sharp: true },
          acanthus: { profile: 'acanthus', size: [26, 48], width: [0.62, 0.86], teeth: 0, serr: 0, sharp: false },
          rubber: { profile: 'round', size: [42, 66], width: [0.56, 0.72], teeth: 0, serr: 0, sharp: false },
          fatsia: { profile: 'round', size: [52, 78], width: [0.88, 1.04], teeth: 0, serr: 0, sharp: false, fatsia: true },
          monstera: { profile: 'round', size: [82, 114], width: [0.9, 1.06], teeth: 0, serr: 0, sharp: false, monstera: true },
          palm: { profile: 'lance', size: [105, 148], width: [0.9, 1.04], teeth: 0, serr: 0, sharp: true, palm: true },
          fern: { profile: 'lance', size: [62, 92], width: [0.5, 0.68], teeth: 0, serr: 0, sharp: false, fern: true },
        };

        const LEAF_PROFILE = {
          ovate: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.86)), 0.68),
          round: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.96)), 0.92),
          lance: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.70)), 0.46) * (1 - t * 0.22),
          // Rounded lobes with deep bays between them, the way an acanthus
          // scrolls — not the spiky star a sharp modulation would give.
          acanthus: (t) =>
            Math.pow(Math.sin(Math.PI * Math.pow(t, 0.84)), 0.62) *
            (0.58 + 0.42 * Math.pow(Math.abs(Math.cos(t * Math.PI * 2.1 + 0.42)), 0.55)),
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let margin = 32;
        let plants = [];
        let ghostPlants = [];
        let seed = 0x7a43e19;
        let random = mulberry32(seed);
        let nextId = 1;
        let resizeFrame = 0;
        let growthFrame = 0;
        let nextGrowthAt = 0;
        let growthCount = 0;
        let lastGrowthPaint = 0;
        let growingPlants = [];
        let census = [];

        if (DEBUG_MODE) {
          showDebugCatalog();
        } else {
          resize(true);
          bindEvents();
          regrow();
          startOvergrowth();
        }

        function showDebugCatalog() {
          const catalog = document.getElementById('debug-catalog');
          const grid = document.getElementById('debug-grid');
          const count = document.getElementById('debug-count');
          const specimens = [];

          document.documentElement.classList.add('debug-mode');
          document.body.classList.add('debug-mode');
          catalog.hidden = false;
          count.textContent = `${SPECIES.length} plant types`;

          for (let index = 0; index < SPECIES.length; index += 1) {
            const spec = SPECIES[index];
            const figure = document.createElement('figure');
            const specimenCanvas = document.createElement('canvas');
            const caption = document.createElement('figcaption');
            const labelId = `debug-plant-${index + 1}`;

            figure.className = 'debug-specimen';
            specimenCanvas.className = 'debug-specimen-canvas';
            specimenCanvas.setAttribute('aria-hidden', 'true');
            caption.className = 'debug-caption';
            caption.id = labelId;
            caption.innerHTML =
              `<span class="debug-number">${String(index + 1).padStart(2, '0')}</span>` +
              `<span><strong class="debug-name">${spec.name}</strong>` +
              `<em class="debug-latin">${spec.latin}</em></span>`;

            figure.setAttribute('aria-labelledby', labelId);
            figure.append(specimenCanvas, caption);
            grid.append(figure);

            random = mulberry32((seed ^ Math.imul(index + 1, 0x9e3779b9)) >>> 0);
            const plant = createPlant(0, 0, index, 1, {
              census: false,
              bloomBoost: 1,
              rotation: 0,
            });
            plant.scale = 1;
            specimens.push({ canvas: specimenCanvas, plant, bounds: measurePlant(plant) });
          }

          let renderFrame = 0;
          const scheduleRender = () => {
            cancelAnimationFrame(renderFrame);
            renderFrame = requestAnimationFrame(() => {
              for (const specimen of specimens) renderDebugSpecimen(specimen);
            });
          };

          if ('ResizeObserver' in window) {
            const observer = new ResizeObserver(scheduleRender);
            observer.observe(grid);
          } else {
            addEventListener('resize', scheduleRender, { passive: true });
          }
          scheduleRender();
        }

        function measurePlant(plant) {
          const size = 1024;
          const origin = { x: size / 2, y: size * 0.74 };
          const surface = document.createElement('canvas');
          const measureCtx = surface.getContext('2d', { willReadFrequently: true });
          const previous = { x: plant.x, y: plant.y, scale: plant.scale };
          surface.width = size;
          surface.height = size;

          plant.x = origin.x;
          plant.y = origin.y;
          plant.scale = 1;
          ctx = measureCtx;
          drawPlant(plant);

          const pixels = measureCtx.getImageData(0, 0, size, size).data;
          let left = size;
          let top = size;
          let right = 0;
          let bottom = 0;
          for (let y = 0; y < size; y += 1) {
            for (let x = 0; x < size; x += 1) {
              if (pixels[(y * size + x) * 4 + 3] === 0) continue;
              left = Math.min(left, x);
              top = Math.min(top, y);
              right = Math.max(right, x);
              bottom = Math.max(bottom, y);
            }
          }

          plant.x = previous.x;
          plant.y = previous.y;
          plant.scale = previous.scale;
          return left <= right
            ? {
                left: left - origin.x,
                top: top - origin.y,
                width: right - left + 1,
                height: bottom - top + 1,
              }
            : { left: -1, top: -1, width: 2, height: 2 };
        }

        function renderDebugSpecimen(specimen) {
          const rect = specimen.canvas.getBoundingClientRect();
          const cssWidth = Math.max(1, Math.round(rect.width));
          const cssHeight = Math.max(1, Math.round(rect.height));
          const pixelRatio = Math.min(2, devicePixelRatio || 1);
          const padding = 18;
          const availableWidth = Math.max(1, cssWidth - padding * 2);
          const availableHeight = Math.max(1, cssHeight - padding * 2);
          const scale = Math.min(
            availableWidth / specimen.bounds.width,
            availableHeight / specimen.bounds.height
          );

          specimen.canvas.width = Math.round(cssWidth * pixelRatio);
          specimen.canvas.height = Math.round(cssHeight * pixelRatio);
          const specimenCtx = specimen.canvas.getContext('2d');
          specimenCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          specimenCtx.clearRect(0, 0, cssWidth, cssHeight);

          specimen.plant.scale = scale;
          specimen.plant.x =
            padding +
            (availableWidth - specimen.bounds.width * scale) / 2 -
            specimen.bounds.left * scale;
          specimen.plant.y =
            padding +
            (availableHeight - specimen.bounds.height * scale) / 2 -
            specimen.bounds.top * scale;
          ctx = specimenCtx;
          drawPlant(specimen.plant);
        }

        function bindEvents() {
          addEventListener(
            'resize',
            () => {
              cancelAnimationFrame(resizeFrame);
              resizeFrame = requestAnimationFrame(() => {
                resize(false);
                regrow();
              });
            },
            { passive: true }
          );
          canvas.addEventListener('pointerdown', () => {
            seed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
            regrow();
            announce('A new arrangement was drawn');
          });
          canvas.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R' || event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              seed = (seed + 0x9e3779b9) >>> 0;
              regrow();
              announce('A new arrangement was drawn');
            }
          });
        }

        function resize(firstRun) {
          const oldWidth = width;
          const oldHeight = height;
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          if (!firstRun && width === oldWidth && height === oldHeight) return;

          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          growthCanvas.width = canvas.width;
          growthCanvas.height = canvas.height;
          growthCanvas.style.width = `${width}px`;
          growthCanvas.style.height = `${height}px`;
          mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          growthCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          margin = clamp(Math.min(width, height) * 0.052, 22, 58);
        }

        // ---------------------------------------------------------------
        // Composition
        // ---------------------------------------------------------------

        function regrow() {
          random = mulberry32(seed);
          nextId = 1;
          plants = [];
          ghostPlants = [];
          growingPlants = [];
          growthCtx.setTransform(1, 0, 0, 1, 0, 0);
          growthCtx.clearRect(0, 0, growthCanvas.width, growthCanvas.height);
          census = new Array(SPECIES.length).fill(0);

          const area = width * height;
          const unit = clamp(Math.min(width, height) / 560, 0.95, 1.75);

          // A faded underprint: flat silhouettes that give the ground the
          // depth of a two-plate impression.
          const ghostCount = Math.round(clamp(area / 60000, 10, 24));
          for (let i = 0; i < ghostCount; i += 1) {
            const plant = createPlant(
              random() * width,
              random() * height,
              null,
              unit,
              { census: false }
            );
            plant.scale *= lerp(1.2, 1.8, random());
            ghostPlants.push(plant);
          }

          // The main growth uses weighted selection rather than forcing a
          // checklist pass through every species. A denser grid gives the
          // opening frame the already-established fullness of the garden.
          const count = clamp(Math.round(area / 10500), 48, 120);
          const cols = Math.max(4, Math.round(Math.sqrt((count * width) / height)));
          const rows = Math.ceil(count / cols);
          const cellW = width / cols;
          const cellH = height / rows;

          for (let i = 0; i < count; i += 1) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = (col + 0.2 + random() * 0.66) * cellW;
            const y = (row + 0.2 + random() * 0.66) * cellH;
            const plant = createPlant(x, y, weightedSpecies(random(), false), unit, {
              bloomBoost: 1,
            });
            plant.depth = i + random();
            plants.push(plant);
          }

          // Infill on the half-cell offset. A Morris repeat leaves no bare
          // ground: the gaps between specimens get small sprigs.
          const fillTypes = [4, 7, 2, 6, 0, 4, 3, 7];
          let fillIndex = 0;
          for (let row = 0; row <= rows; row += 1) {
            for (let col = 0; col <= cols; col += 1) {
              if (random() > 0.84) continue;
              const plant = createPlant(
                (col + 0.72 + lerp(-0.22, 0.22, random())) * cellW,
                (row + 0.56 + lerp(-0.22, 0.22, random())) * cellH,
                fillTypes[fillIndex++ % fillTypes.length],
                unit,
                { bloomBoost: 1 }
              );
              plant.scale *= lerp(0.48, 0.72, random());
              plant.depth = -6 + random();
              plants.push(plant);
            }
          }

          // Long twining stems that traverse the plate and tie it together,
          // the way a Morris repeat is carried by its meander.
          const vineIndex = SPECIES.findIndex((s) => s.vine);
          const vines = Math.round(clamp(area / 125000, 5, 12));
          for (let i = 0; i < vines; i += 1) {
            const edge = i % 4;
            const origin = edgePlantOrigin(edge, width * 0.06 + random() * 40, random);
            const plant = createPlant(
              origin.x,
              origin.y,
              vineIndex,
              unit,
              { rotation: origin.rotation, bloomBoost: 1 }
            );
            plant.scale *= lerp(1.2, 1.65, random());
            plant.depth = -40 + i;
            plants.push(plant);
          }

          // Stems entering from beyond the sheet, so the growth reads as cut
          // from something larger.
          for (let i = 0; i < 10; i += 1) {
            const edge = i % 4;
            const origin = edgePlantOrigin(edge, edge === 3 ? 70 : 14, random);
            const plant = createPlant(origin.x, origin.y, i % SPECIES.length, unit, {
              rotation: origin.rotation,
              bloomBoost: 1,
            });
            plant.scale *= 1.1;
            plant.depth = i % 2 ? -20 + i : count + i;
            plants.push(plant);
          }

          // Cream foliage is printed late enough to cover busy seams. Broad
          // ficus leaves and open palm or fern fronds behave as planted
          // negative space rather than empty holes.
          const creamSpecies = SPECIES.reduce((indices, spec, index) => {
            if (spec.pale) indices.push(index);
            return indices;
          }, []);
          const creamPlants = Math.round(clamp(area / 450000, 2, 3));
          for (let i = 0; i < creamPlants; i += 1) {
            const plant = createPlant(
              lerp(width * 0.06, width * 0.94, random()),
              lerp(height * 0.06, height * 0.94, random()),
              creamSpecies[Math.floor(random() * creamSpecies.length)],
              unit
            );
            plant.scale *= lerp(1.08, 1.44, random());
            plant.depth = count + 24 + i;
            plants.push(plant);
          }

          sortPlants();

          // Foreground specimens drawn last, over the ruled border.
          const anchorTypes = [0, 1, 3, 6, 5, 4, 0, 7, 3, 1];
          const anchors = Math.round(clamp(area / 190000, 5, 9));
          const anchorPlants = [];
          for (let i = 0; i < anchors; i += 1) {
            const plant = createPlant(
              ((i + 0.1 + random() * 0.8) / anchors) * width,
              lerp(height * 0.08, height * 0.92, random()),
              anchorTypes[i % anchorTypes.length],
              unit,
              { bloomBoost: 2 }
            );
            plant.scale *= lerp(1.5, 1.95, random());
            anchorPlants.push(plant);
          }

          draw(anchorPlants);
          plants = [];
          ghostPlants = [];
          growthCount = 0;
          lastGrowthPaint = 0;
          nextGrowthAt = performance.now() + 350;
        }

        // An edge specimen points into the sheet, but every edge is treated
        // equally. The local stem begins at -π/2, so the added quarter-turn
        // converts a world-space heading into the plant's rotation.
        function edgePlantOrigin(edge, pad, r) {
          const side = ((edge % 4) + 4) % 4;
          const inward = [0, Math.PI, Math.PI / 2, -Math.PI / 2][side];
          return {
            x: side === 0 ? -pad : side === 1 ? width + pad : r() * width,
            y: side === 2 ? -pad : side === 3 ? height + pad : r() * height,
            rotation: inward + Math.PI / 2 + lerp(-0.42, 0.42, r()),
          };
        }

        // The plate never reaches a finished state. New specimens are stamped
        // straight onto the existing pixels, so the garden keeps getting
        // denser without retaining an ever-growing object graph in memory.
        function startOvergrowth() {
          cancelAnimationFrame(growthFrame);
          growthFrame = requestAnimationFrame(growForever);
        }

        function growForever(now) {
          if (now >= nextGrowthAt) {
            beginNextPlant(now);
            nextGrowthAt = now + lerp(650, 1150, random());
          }
          if (growingPlants.length && now - lastGrowthPaint >= 1000 / 30) {
            drawGrowingPlants(now);
            lastGrowthPaint = now;
          }
          growthFrame = requestAnimationFrame(growForever);
        }

        function beginNextPlant(now) {
          const unit = clamp(Math.min(width, height) / 560, 0.95, 1.75);
          const isVine = growthCount % 11 === 10;
          const species = isVine ? SPECIES.findIndex((spec) => spec.vine) : null;
          const origin = isVine
            ? edgePlantOrigin(growthCount % 4, width * 0.04, random)
            : {
                x: lerp(-width * 0.04, width * 1.04, random()),
                y: lerp(-height * 0.04, height * 1.04, random()),
                rotation: random() * TAU,
              };
          const plant = createPlant(origin.x, origin.y, species, unit, {
            census: false,
            rotation: origin.rotation,
          });

          plant.scale *= isVine ? lerp(1.05, 1.45, random()) : lerp(0.58, 1.28, random());

          growingPlants.push({
            plant,
            startedAt: now,
            duration: reducedMotion.matches
              ? 1
              : isVine
                ? lerp(6200, 8200, random())
                : lerp(4200, 6200, random()),
          });
          growthCount += 1;
        }

        function drawGrowingPlants(now) {
          growthCtx.setTransform(1, 0, 0, 1, 0, 0);
          growthCtx.clearRect(0, 0, growthCanvas.width, growthCanvas.height);

          const stillGrowing = [];
          for (const growth of growingPlants) {
            const progress = clamp((now - growth.startedAt) / growth.duration, 0, 1);
            if (progress >= 1) {
              ctx = mainCtx;
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              drawPlant(growth.plant);
            } else {
              stillGrowing.push({ growth, progress });
            }
          }

          ctx = growthCtx;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          for (const { growth, progress } of stillGrowing) {
            drawPlant(growth.plant, progress);
          }
          ctx = mainCtx;
          growingPlants = stillGrowing.map(({ growth }) => growth);
        }

        function draw(anchorPlants) {
          ctx = mainCtx;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          drawPaper();
          drawUnderprint();

          for (const plant of plants) drawPlant(plant);

          drawPlateMargin();
          drawBorderRule();

          for (const plant of anchorPlants) drawPlant(plant);

          drawFoxing();
        }

        // ---------------------------------------------------------------
        // Paper
        // ---------------------------------------------------------------

        function drawPaper() {
          ctx.save();
          ctx.fillStyle = P.paper;
          ctx.fillRect(0, 0, width, height);

          const wash = ctx.createRadialGradient(
            width * 0.4,
            height * 0.3,
            0,
            width * 0.48,
            height * 0.5,
            Math.max(width, height) * 0.86
          );
          wash.addColorStop(0, P.paperLight);
          wash.addColorStop(0.58, P.paper);
          wash.addColorStop(1, P.paperDeep);
          ctx.fillStyle = wash;
          ctx.fillRect(0, 0, width, height);

          const r = mulberry32((seed ^ 0x4f93a671) >>> 0);

          // Broad tonal drift, the unevenness of a hand-sized sheet.
          ctx.globalAlpha = 0.03;
          for (let i = 0; i < 150; i += 1) {
            const x = r() * width;
            const y = r() * height;
            const radius = lerp(30, 150, r());
            ctx.fillStyle = r() > 0.48 ? P.paperLight : P.foxing;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, TAU);
            ctx.fill();
          }

          // Laid and chain lines of a mould-made sheet.
          ctx.globalAlpha = 0.032;
          ctx.strokeStyle = P.umber;
          ctx.lineWidth = 0.6;
          for (let y = 0; y < height; y += 3.4) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
          ctx.globalAlpha = 0.018;
          ctx.lineWidth = 1.1;
          for (let x = ((seed % 31) + 31) % 31; x < width; x += 31) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawUnderprint() {
          const surface = document.createElement('canvas');
          surface.width = canvas.width;
          surface.height = canvas.height;
          const gctx = surface.getContext('2d');
          if (!gctx) return;
          gctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          ctx = gctx;
          for (const plant of ghostPlants) drawPlant(plant);
          ctx = mainCtx;

          gctx.setTransform(1, 0, 0, 1, 0, 0);
          gctx.globalCompositeOperation = 'source-in';
          gctx.fillStyle = '#7e8a5c';
          gctx.fillRect(0, 0, surface.width, surface.height);

          mainCtx.save();
          mainCtx.setTransform(1, 0, 0, 1, 0, 0);
          mainCtx.globalAlpha = 0.13;
          mainCtx.drawImage(surface, 0, 0);
          mainCtx.restore();
        }

        // The ink of a plate stops before the deckle. Fading the outer band
        // gives the growth somewhere to end without cropping it.
        function drawPlateMargin() {
          const band = margin * 1.55;
          const stops = (gradient) => {
            gradient.addColorStop(0, `rgba(${P.paperRGB}, 0)`);
            gradient.addColorStop(0.55, `rgba(${P.paperRGB}, 0.62)`);
            gradient.addColorStop(1, `rgba(${P.paperRGB}, 0.88)`);
            return gradient;
          };
          ctx.save();
          ctx.fillStyle = stops(ctx.createLinearGradient(0, band, 0, 0));
          ctx.fillRect(0, 0, width, band);
          ctx.fillStyle = stops(ctx.createLinearGradient(0, height - band, 0, height));
          ctx.fillRect(0, height - band, width, band);
          ctx.fillStyle = stops(ctx.createLinearGradient(band, 0, 0, 0));
          ctx.fillRect(0, 0, band, height);
          ctx.fillStyle = stops(ctx.createLinearGradient(width - band, 0, width, 0));
          ctx.fillRect(width - band, 0, band, height);
          ctx.restore();
        }

        function drawBorderRule() {
          if (Math.min(width, height) < 260) return;
          const r = mulberry32((seed ^ 0x51ab77c3) >>> 0);
          ctx.save();
          ctx.strokeStyle = P.ink;
          ctx.lineJoin = 'miter';

          ctx.globalAlpha = 0.66;
          ctx.lineWidth = 1.9;
          wobbleRect(margin, margin, width - margin * 2, height - margin * 2, r, 1.1);
          ctx.stroke();

          ctx.globalAlpha = 0.45;
          ctx.lineWidth = 0.7;
          const inner = margin + 5;
          wobbleRect(inner, inner, width - inner * 2, height - inner * 2, r, 0.9);
          ctx.stroke();
          ctx.restore();
        }

        // A ruled line drawn by hand is never quite a ruled line.
        function wobbleRect(x, y, w, h, r, amp) {
          const corners = [
            [x, y, x + w, y],
            [x + w, y, x + w, y + h],
            [x + w, y + h, x, y + h],
            [x, y + h, x, y],
          ];
          ctx.beginPath();
          for (const [ax, ay, bx, by] of corners) {
            ctx.moveTo(ax, ay);
            const steps = Math.max(3, Math.round(Math.hypot(bx - ax, by - ay) / 90));
            for (let i = 1; i <= steps; i += 1) {
              const t = i / steps;
              const nx = (by - ay) / Math.hypot(bx - ax, by - ay);
              const ny = -(bx - ax) / Math.hypot(bx - ax, by - ay);
              const off = i === steps ? 0 : lerp(-amp, amp, r());
              ctx.lineTo(lerp(ax, bx, t) + nx * off, lerp(ay, by, t) + ny * off);
            }
          }
        }

        function drawInscription() {
          if (height < 320 || width < 300) return;
          const size = clamp(Math.min(width, height) * 0.021, 10, 17);
          const ranked = census
            .map((n, i) => ({ n, i }))
            .sort((a, b) => b.n - a.n || a.i - b.i)
            .slice(0, 2)
            .map((entry) => SPECIES[entry.i].latin);

          const caption = ranked.join('  ·  ');
          const baseline = height - margin * 0.52;

          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = `italic ${size}px Georgia, "Times New Roman", Times, serif`;

          // A breath of clean paper under the inscription, the way a plate
          // keeps its caption out of the ink.
          paperHalo(width / 2, baseline - size * 0.32, ctx.measureText(caption).width * 0.62 + size * 1.6);
          inscribe(caption, width / 2, baseline, size, 0.82);

          ctx.font = `${size * 0.72}px Georgia, "Times New Roman", Times, serif`;
          const plate = `PLATE ${roman((seed % 240) + 1)}`;
          ctx.globalAlpha = 1;
          paperHalo(width / 2, margin * 0.66 - size * 0.24, ctx.measureText(plate).width * 0.9 + size * 1.4);
          spacedText(plate, width / 2, margin * 0.66, size * 0.3, size * 0.72, 0.66);
          ctx.restore();
        }

        function paperHalo(cx, cy, radius) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1, 0.3);
          const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
          halo.addColorStop(0, `rgba(${P.paperRGB}, 0.6)`);
          halo.addColorStop(0.5, `rgba(${P.paperRGB}, 0.42)`);
          halo.addColorStop(1, `rgba(${P.paperRGB}, 0)`);
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        // Text on a plate sits in clean paper. Carrying that paper as a halo
        // around the glyphs themselves keeps it legible over growth without
        // veiling the flower behind it.
        function inscribe(text, x, y, size, alpha) {
          ctx.save();
          ctx.lineJoin = 'round';
          ctx.lineWidth = size * 0.3;
          ctx.strokeStyle = `rgba(${P.paperRGB}, 0.92)`;
          ctx.globalAlpha = 0.9;
          ctx.strokeText(text, x, y);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = P.ink;
          ctx.fillText(text, x, y);
          ctx.restore();
        }

        function spacedText(text, cx, y, spacing, size, alpha) {
          const widths = [];
          let total = 0;
          for (const ch of text) {
            const w = ctx.measureText(ch).width;
            widths.push(w);
            total += w + spacing;
          }
          let x = cx - (total - spacing) / 2;
          let i = 0;
          ctx.textAlign = 'left';
          for (const ch of text) {
            inscribe(ch, x, y, size, alpha);
            x += widths[i] + spacing;
            i += 1;
          }
          ctx.textAlign = 'center';
        }

        function drawFoxing() {
          const r = mulberry32((seed ^ 0xd13975ab) >>> 0);
          ctx.save();
          ctx.globalCompositeOperation = 'multiply';

          // Age spots, clustered the way damp finds a sheet.
          const clusters = Math.round(clamp((width * height) / 130000, 5, 16));
          for (let c = 0; c < clusters; c += 1) {
            const cx = r() * width;
            const cy = r() * height;
            const spread = lerp(24, 110, r());
            const spots = randInt(r, 3, 11);
            for (let i = 0; i < spots; i += 1) {
              const a = r() * TAU;
              const d = Math.sqrt(r()) * spread;
              ctx.globalAlpha = lerp(0.03, 0.11, r());
              ctx.fillStyle = r() > 0.7 ? '#8d6238' : P.foxing;
              ctx.beginPath();
              const rad = lerp(1.1, 5.2, r());
              for (let k = 0; k <= 9; k += 1) {
                const th = (k / 9) * TAU;
                const rr = rad * lerp(0.62, 1.35, r());
                const px = cx + Math.cos(a) * d + Math.cos(th) * rr;
                const py = cy + Math.sin(a) * d + Math.sin(th) * rr * 0.86;
                if (k === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
              ctx.closePath();
              ctx.fill();
            }
          }

          // Loose fibres in the pulp.
          ctx.strokeStyle = '#7b5c3c';
          ctx.lineWidth = 0.45;
          ctx.globalAlpha = 0.07;
          for (let i = 0; i < Math.round((width * height) / 2400); i += 1) {
            const x = r() * width;
            const y = r() * height;
            const length = lerp(2, 10, r());
            const a = r() * TAU;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(
              x + Math.cos(a) * length * 0.5 + lerp(-1.4, 1.4, r()),
              y + Math.sin(a) * length * 0.5 + lerp(-1.4, 1.4, r()),
              x + Math.cos(a) * length,
              y + Math.sin(a) * length
            );
            ctx.stroke();
          }

          // The sheet is darker at its edges.
          const vignette = ctx.createRadialGradient(
            width * 0.5,
            height * 0.48,
            Math.min(width, height) * 0.32,
            width * 0.5,
            height * 0.5,
            Math.max(width, height) * 0.78
          );
          vignette.addColorStop(0, 'rgba(255, 255, 255, 0)');
          vignette.addColorStop(1, 'rgba(150, 122, 82, 0.34)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, width, height);

          ctx.globalCompositeOperation = 'screen';
          ctx.fillStyle = '#fff6de';
          ctx.globalAlpha = 0.05;
          for (let i = 0; i < Math.round((width * height) / 3000); i += 1) {
            ctx.fillRect(r() * width, r() * height, lerp(0.4, 1.3, r()), lerp(0.4, 1.3, r()));
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Curves — every stem, branch, and vine in the piece is built here,
        // and every one of them carries a guaranteed net turn plus a sway
        // riding on top. Nothing in this garden grows straight.
        // ---------------------------------------------------------------

        function makeCurve(r, o) {
          const segs = o.segments || 26;
          const step = o.length / segs;
          const dir = o.dir !== undefined ? o.dir : r() < 0.5 ? -1 : 1;
          const sweep = lerp(o.sweep[0], o.sweep[1], r()) * dir;
          const swayFreq = lerp(1.1, 2.5, r()) * (o.freq || 1);
          const swayAmp = lerp(0.16, 0.44, r()) * (o.sway === undefined ? 1 : o.sway);
          const perSeg = (swayAmp * Math.PI * swayFreq) / segs;
          const phase = r() * TAU;
          const bias = o.bias === undefined ? 1.1 : o.bias;

          let weightSum = 0;
          const weights = new Array(segs);
          for (let i = 0; i < segs; i += 1) {
            const t = (i + 1) / segs;
            weights[i] = 0.42 + bias * t;
            weightSum += weights[i];
          }

          let angle = o.startAngle;
          let x = o.x || 0;
          let y = o.y || 0;
          const pts = [{ x, y }];
          const angs = [angle];
          for (let i = 1; i <= segs; i += 1) {
            const t = i / segs;
            angle +=
              (sweep * weights[i - 1]) / weightSum +
              Math.sin(t * Math.PI * swayFreq + phase) * perSeg;
            x += Math.cos(angle) * step;
            y += Math.sin(angle) * step;
            pts.push({ x, y });
            angs.push(angle);
          }
          return { pts, angs, length: o.length, dir };
        }

        function curveAt(curve, t) {
          const f = clamp(t, 0, 1) * (curve.pts.length - 1);
          const i = Math.min(curve.pts.length - 2, Math.floor(f));
          const k = f - i;
          return {
            x: lerp(curve.pts[i].x, curve.pts[i + 1].x, k),
            y: lerp(curve.pts[i].y, curve.pts[i + 1].y, k),
            angle: lerp(curve.angs[i], curve.angs[i + 1], k),
          };
        }

        function traceSmooth(pts, moveFirst) {
          if (!pts.length) return;
          if (moveFirst) ctx.moveTo(pts[0].x, pts[0].y);
          else ctx.lineTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length - 1; i += 1) {
            ctx.quadraticCurveTo(
              pts[i].x,
              pts[i].y,
              (pts[i].x + pts[i + 1].x) * 0.5,
              (pts[i].y + pts[i + 1].y) * 0.5
            );
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(last.x, last.y);
        }

        // Stems are filled ribbons rather than strokes: a tapered body with
        // a contour line, the way an engraver would cut them.
        function drawStemRibbon(curve, wBase, wTip, fill) {
          const n = curve.pts.length;
          const left = new Array(n);
          const right = new Array(n);
          for (let i = 0; i < n; i += 1) {
            const t = i / (n - 1);
            const half = lerp(wBase, wTip, Math.pow(t, 0.72)) * 0.5;
            const a = curve.angs[i] + Math.PI / 2;
            const nx = Math.cos(a) * half;
            const ny = Math.sin(a) * half;
            left[i] = { x: curve.pts[i].x + nx, y: curve.pts[i].y + ny };
            right[n - 1 - i] = { x: curve.pts[i].x - nx, y: curve.pts[i].y - ny };
          }

          ctx.beginPath();
          traceSmooth(left, true);
          traceSmooth(right, false);
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();

          ctx.save();
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.65;
          ctx.stroke();

          // A single lit edge, the engraver's white line.
          ctx.globalAlpha = 0.24;
          ctx.strokeStyle = fill === P.leafCreamVein ? P.leafCreamLight : P.leafPale;
          ctx.lineWidth = Math.max(0.35, wBase * 0.2);
          ctx.beginPath();
          const lit = new Array(n);
          for (let i = 0; i < n; i += 1) {
            const t = i / (n - 1);
            const half = lerp(wBase, wTip, Math.pow(t, 0.72)) * 0.22;
            const a = curve.angs[i] + Math.PI / 2;
            lit[i] = {
              x: curve.pts[i].x + Math.cos(a) * half,
              y: curve.pts[i].y + Math.sin(a) * half,
            };
          }
          traceSmooth(lit, true);
          ctx.stroke();
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Plants
        // ---------------------------------------------------------------

        function createPlant(x, y, forcedSpecies, unit, opts) {
          const typeIndex =
            forcedSpecies == null ? weightedSpecies(random()) : forcedSpecies % SPECIES.length;
          const spec = SPECIES[typeIndex];
          const isFern = spec.leaf === 'fern';
          const isPalm = spec.leaf === 'palm';
          const isMonstera = spec.leaf === 'monstera';
          const isIris = spec.key === 'iris-japonica';
          const isDaylily = spec.key === 'orange-daylily';
          // Daylily keeps a clean upright scape. The intentionally stylized
          // Fringed iris is allowed to meander like the other flowering vines.
          const cleanScape = isDaylily;
          if (!opts || opts.census !== false) census[typeIndex] += 1;

          const localSeed = (Math.floor(random() * 0xffffffff) ^ (nextId * 2654435761)) >>> 0;
          const r = mulberry32(localSeed);
          const scale = lerp(spec.scale[0], spec.scale[1], r()) * unit;
          const stemLength = lerp(spec.height[0], spec.height[1], r());
          const dir = r() < 0.5 ? -1 : 1;

          const stem = spec.vine
            ? makeCurve(r, {
                length: stemLength,
                startAngle: -Math.PI / 2 + lerp(-0.5, 0.5, r()),
                sweep: [1.5, 2.9],
                sway: 1.5,
                dir,
                segments: 44,
                bias: 0.7,
              })
            : makeCurve(r, {
                length: stemLength,
                startAngle: -Math.PI / 2 + lerp(cleanScape ? -0.14 : -0.3, cleanScape ? 0.14 : 0.3, r()),
                sweep: cleanScape ? [0.18, 0.52] : spec.scroll ? [1.5, 2.8] : [1.05, 2.15],
                sway: cleanScape ? 0.42 : spec.scroll ? 1 : 1.35,
                dir,
                segments: 30,
                bias: 1.28,
              });

          const bloomBoost = opts && opts.bloomBoost ? opts.bloomBoost : 0;
          const flowering = spec.blooms[1] > 0;
          const bloomCount =
            flowering ? randInt(r, spec.blooms[0], spec.blooms[1]) + bloomBoost : 0;
          const branchRange = spec.branches || [3, flowering ? 5 : 6];
          // A fern frond is its own branching system. It must not inherit the
          // woody/vining branch scaffold used by the other plants.
          const branchCount = isFern || isPalm || isMonstera
            ? 0
            : Math.max(bloomCount, randInt(r, branchRange[0], branchRange[1]));
          const branches = [];
          const stemLeaves = [];

          for (let i = 0; i < branchCount; i += 1) {
            const t = clamp(0.16 + ((i + lerp(0.1, 0.7, r())) / (branchCount + 0.4)) * 0.82, 0.12, 0.94);
            const side = i % 2 ? 1 : -1;
            const at = curveAt(stem, t);
            const branchLength =
              stemLength *
              lerp(cleanScape ? 0.11 : 0.16, cleanScape ? 0.23 : 0.4, r()) *
              (0.62 + t * 0.6);
            const curve = makeCurve(r, {
              x: at.x,
              y: at.y,
              length: branchLength,
              startAngle: at.angle + side * lerp(cleanScape ? 0.48 : 0.55, cleanScape ? 0.78 : 1.15, r()),
              // Curving back toward the light gives the branch its C-sweep.
              sweep: cleanScape ? [0.18, 0.52] : [1.0, 2.15],
              dir: -side,
              sway: cleanScape ? 0.38 : 1.05,
              segments: 16,
              bias: 1.5,
            });
            const tip = curveAt(curve, 1);
            const leaves = [];
            const branchEndsInLeaf = spec.leaf === 'acanthus';
            if (!cleanScape && (branchEndsInLeaf || r() > 0.28)) {
              const leafT = branchEndsInLeaf ? 1 : lerp(0.3, 0.55, r());
              leaves.push(
                makeLeaf(r, spec.leaf, {
                  at: curveAt(curve, leafT),
                  side: -side,
                  t: leafT,
                  tone: spec.pale ? 'cream' : 'green',
                })
              );
            }
            branches.push({
              stemT: t,
              curve,
              tip,
              leaves,
              width: lerp(1.7, 3.1, r()),
              bud: flowering && r() > 0.66,
              budSize: lerp(4.5, 9, r()),
              tendril:
                !spec.pale &&
                spec.leaf !== 'monstera' &&
                spec.leaf !== 'acanthus' &&
                ((spec.vine && r() > 0.4) || r() > 0.9),
              tendrilDir: side,
              tendrilSize: lerp(9, 20, r()),
            });

            if (!cleanScape) {
              const stemAt = curveAt(stem, clamp(t - 0.07, 0.06, 0.92));
              stemLeaves.push(
                makeLeaf(r, spec.leaf, {
                  at: stemAt,
                  side,
                  t,
                  big: !flowering,
                  tone: spec.pale ? 'cream' : 'green',
                })
              );
            }
          }

          const blooms = [];
          if (flowering) {
            const baseSize = flowerSize(spec.key);
            for (let i = 0; i < bloomCount; i += 1) {
              const branchIndex = i === 0 ? -1 : (i * 2 - 1) % branches.length;
              const at = branchIndex < 0 ? curveAt(stem, 1) : branches[branchIndex].tip;
              blooms.push({
                x: at.x,
                y: at.y,
                r: baseSize * lerp(0.8, 1.24, r()),
                rotation: at.angle + Math.PI / 2 + lerp(-0.3, 0.3, r()),
                phase: r() * TAU,
                variant: r(),
                branchIndex,
              });
            }
          } else if (isMonstera) {
            // Monstera rises from a compact crown. Each blade owns a long
            // petiole; there is no woody trunk, vine, or generic branch grid.
            const leafCount = r() < 0.58 ? 1 : 2;
            const spread = leafCount === 1 ? 0 : lerp(0.9, 1.22, r());
            const monsteraLeaves = [];
            for (let i = 0; i < leafCount; i += 1) {
              const side = leafCount === 1 ? dir : i === 0 ? -1 : 1;
              const leaf = makeLeaf(r, spec.leaf, {
                at: { x: side * i * 2.2, y: Math.abs(i) * 1.2, angle: -Math.PI / 2 },
                side,
                t: 1,
                tone: 'green',
              });
              leaf.x = side * i * 2.2;
              leaf.y = i * 1.2;
              leaf.angle = -Math.PI / 2 + side * (leafCount === 1 ? lerp(-0.16, 0.16, r()) : spread * 0.5);
              leaf.length = lerp(LEAF_KIND.monstera.size[0], LEAF_KIND.monstera.size[1], r()) *
                (i === 0 ? 1 : lerp(0.78, 0.9, r()));
              leaf.width = lerp(0.9, 1.05, r());
              leaf.petioleRatio = lerp(0.58, 0.76, r());
              leaf.morphSeed = Math.floor(r() * 0xffffffff) >>> 0;
              leaf.curl = side * lerp(0.08, 0.2, r());
              leaf.shade = i === 0 ? lerp(0.18, 0.38, r()) : lerp(0.3, 0.52, r());
              leaf.turnover = false;
              leaf.anchorT = i * 0.12;
              monsteraLeaves.push(leaf);
            }
            // The smaller leaf sits behind the primary mature blade instead
            // of pasting over and obscuring its basal sinus.
            monsteraLeaves.sort((a, b) => a.length - b.length);
            stemLeaves.push(...monsteraLeaves);
          } else if (isPalm) {
            // A palm specimen is one complete frond, not foliage attached to
            // the generic woody/vining scaffold. Its rachis is drawn inside
            // drawCompoundFrond, starting directly at the plant origin.
            const palmLeaf = makeLeaf(r, spec.leaf, {
              at: { x: 0, y: 0, angle: -Math.PI / 2 },
              side: dir,
              t: 1,
              tone: spec.pale ? 'cream' : 'green',
            });
            palmLeaf.x = 0;
            palmLeaf.y = 0;
            palmLeaf.angle = -1.34 + lerp(-0.1, 0.1, r());
            palmLeaf.length = lerp(LEAF_KIND.palm.size[0], LEAF_KIND.palm.size[1], r());
            palmLeaf.width = lerp(LEAF_KIND.palm.width[0], LEAF_KIND.palm.width[1], r());
            palmLeaf.curl = dir * lerp(0.18, 0.28, r());
            palmLeaf.turnover = false;
            stemLeaves.push(palmLeaf);
          } else if (!isFern) {
            // Non-flowering plants finish in one broad terminal leaf.
            const tip = curveAt(stem, 1);
            stemLeaves.push(
              makeLeaf(r, spec.leaf, {
                at: tip,
                side: dir,
                t: 1,
                big: true,
                scaleUp: spec.pale ? 1.12 : 1.25,
                tone: spec.pale ? 'cream' : 'green',
              })
            );
          }

          return {
            id: nextId++,
            x,
            y,
            depth: plants.length,
            spec,
            scale,
            rotation:
              opts && opts.rotation !== undefined
                ? opts.rotation
                : r() * TAU,
            stem,
            stemWidth: lerp(2.4, 4.4, r()),
            stemColor:
              spec.key === 'dwarf-quince'
                ? P.umber
                : spec.pale
                  ? P.leafCreamVein
                  : [P.stem, P.stemDeep, '#6e7440', '#7b6c3e', P.leafMid][Math.floor(r() * 5)],
            branchColor:
              spec.key === 'dwarf-quince'
                ? P.umber
                : spec.pale
                  ? P.leafCreamVein
                  : P.stemDeep,
            fern: isFern,
            palm: isPalm,
            monstera: isMonstera,
            iris: isIris,
            daylily: isDaylily,
            thorns: spec.key === 'rose' || spec.key === 'dwarf-quince',
            branches,
            stemLeaves,
            blooms,
            seed: localSeed,
          };
        }

        function makeLeaf(r, kind, o) {
          const conf = LEAF_KIND[kind] || LEAF_KIND.ovate;
          const outward = o.at.angle + (o.side > 0 ? -1 : 1) * lerp(0.7, 1.25, r());
          const scaleUp = o.scaleUp || (o.big ? 1.16 : 1);
          return {
            x: o.at.x,
            y: o.at.y,
            angle: outward,
            kind,
            conf,
            length: lerp(conf.size[0], conf.size[1], r()) * (0.72 + (o.t || 0.5) * 0.42) * scaleUp,
            width: lerp(conf.width[0], conf.width[1], r()),
            // The curl is clamped away from zero: a leaf blade always bows.
            curl: (o.side > 0 ? 1 : -1) * lerp(0.16, 0.42, r()),
            shade: kind === 'palm' ? 0.55 : r(),
            tone: o.tone || 'green',
            anchorT: o.t || 0,
            // Reflected tip folds create hard triangular flaps. They work on
            // darker inked foliage, but break the clean negative-space read
            // of cream leaves—especially the broad Rubber tree blades.
            turnover:
              kind !== 'rubber' &&
              kind !== 'acanthus' &&
              o.tone !== 'cream' &&
              r() > 0.86 &&
              conf.size[1] > 22,
            fold: lerp(0.68, 0.84, r()),
            foldTilt: lerp(-0.2, 0.2, r()),
          };
        }

        function flowerSize(kind) {
          return (
            {
              rose: 26,
              peony: 31,
              cosmos: 19,
              poppy: 26,
              daisy: 18,
              lily: 28,
              'orange-daylily': 29,
              hibiscus: 31,
              chrysanthemum: 27,
              hydrangea: 33,
              anemone: 20,
              honeysuckle: 22,
              'iris-japonica': 27,
              'dwarf-quince': 22,
            }[kind] || 20
          );
        }

        function weightedSpecies(value, includePale = true) {
          const total = SPECIES.reduce(
            (sum, species) => sum + (includePale || !species.pale ? species.weight : 0),
            0
          );
          let v = value * total;
          for (let i = 0; i < SPECIES.length; i += 1) {
            if (!includePale && SPECIES[i].pale) continue;
            v -= SPECIES[i].weight;
            if (v <= 0) return i;
          }
          return SPECIES.length - 1;
        }

        function drawPlant(plant, growthProgress) {
          ctx.save();
          ctx.translate(plant.x, plant.y);
          ctx.rotate(plant.rotation);
          ctx.scale(plant.scale, plant.scale);

          const growing = growthProgress !== undefined && growthProgress < 1;
          const p = growing ? clamp(growthProgress, 0, 1) : 1;
          if (plant.fern) {
            drawFernPlant(plant, p, growing);
            ctx.restore();
            return;
          }
          if (plant.palm) {
            const frondGrowth = growing ? smoothstep(clamp(p / 0.9, 0, 1)) : 1;
            for (const leaf of plant.stemLeaves) drawLeaf(leaf, frondGrowth);
            ctx.restore();
            return;
          }
          if (plant.monstera) {
            for (let i = 0; i < plant.stemLeaves.length; i += 1) {
              const leafGrowth = growing ? stagedGrowth(p, i * 0.12) : 1;
              if (leafGrowth > 0) drawLeaf(plant.stemLeaves[i], leafGrowth);
            }
            ctx.restore();
            return;
          }
          if (plant.iris) drawIrisFoliage(plant, p, growing);
          if (plant.daylily) drawDaylilyFoliage(plant, p, growing);
          const stemProgress = growing ? smoothstep(clamp(p / 0.62, 0, 1)) : 1;
          const visibleStem = partialCurve(plant.stem, stemProgress);

          drawStemRibbon(visibleStem, plant.stemWidth, plant.stemWidth * 0.3, plant.stemColor);
          if (plant.thorns) drawThorns(visibleStem, plant.stemWidth, plant.seed);

          const branchProgresses = [];
          for (const branch of plant.branches) {
            const branchStart = stemArrival(branch.stemT);
            const branchProgress = growing
              ? smoothstep(clamp((p - branchStart) / 0.22, 0, 1))
              : 1;
            branchProgresses.push(branchProgress);
            if (branchProgress <= 0) continue;
            drawStemRibbon(
              partialCurve(branch.curve, branchProgress),
              branch.width,
              branch.width * 0.34,
              plant.branchColor
            );
            if (branch.tendril && branchProgress > 0.72) {
              drawTendril(
                branch.tip,
                branch.tendrilSize * smoothstep((branchProgress - 0.72) / 0.28),
                branch.tendrilDir
              );
            }
          }

          for (const leaf of plant.stemLeaves) {
            const leafStart = stemArrival(leaf.anchorT);
            const leafProgress = growing
              ? smoothstep(clamp((p - leafStart) / 0.2, 0, 1))
              : 1;
            if (leafProgress > 0) drawLeaf(leaf, leafProgress);
          }
          for (let i = 0; i < plant.branches.length; i += 1) {
            const branch = plant.branches[i];
            const branchProgress = branchProgresses[i];
            for (const leaf of branch.leaves) {
              const leafStart = stemArrival(branch.stemT) + inverseSmoothstep(leaf.anchorT) * 0.22;
              const leafProgress = growing
                ? smoothstep(clamp((p - leafStart) / 0.18, 0, 1))
                : 1;
              if (leafProgress > 0) drawLeaf(leaf, leafProgress);
            }
          }

          for (let i = 0; i < plant.branches.length; i += 1) {
            const branch = plant.branches[i];
            const budStart = stemArrival(branch.stemT) + 0.18;
            const budProgress = growing ? smoothstep(clamp((p - budStart) / 0.14, 0, 1)) : 1;
            if (branch.bud && budProgress > 0) drawBud(branch, plant.spec.key, budProgress);
          }

          for (const bloom of plant.blooms) {
            const branch = bloom.branchIndex < 0 ? null : plant.branches[bloom.branchIndex];
            const bloomStart = branch ? stemArrival(branch.stemT) + 0.18 : 0.58;
            const bloomProgress = growing
              ? smoothstep(clamp((p - bloomStart) / 0.28, 0, 1))
              : 1;
            if (bloomProgress <= 0) continue;
            ctx.save();
            ctx.translate(bloom.x, bloom.y);
            ctx.rotate(bloom.rotation);
            drawOpeningFlower(plant.spec.key, bloom, plant.seed, bloomProgress);
            ctx.restore();
          }

          ctx.restore();
        }

        // Iris japonica keeps its glossy sword leaves at the base in a broad
        // fan, even as this ornamental interpretation sends its flowering
        // stem wandering outward through the surrounding foliage.
        function drawIrisFoliage(plant, growth, growing) {
          const r = mulberry32((plant.seed ^ 0x1a15f4a7) >>> 0);
          const baseAngle = curveAt(plant.stem, 0).angle;
          const conf = LEAF_KIND.iris;
          const count = 7;

          for (let i = 0; i < count; i += 1) {
            const centred = i - (count - 1) * 0.5;
            const delay = Math.abs(centred) * 0.025 + i * 0.012;
            const leafGrowth = growing ? stagedGrowth(growth, delay) : 1;
            if (leafGrowth <= 0) continue;
            const outer = Math.abs(centred) / ((count - 1) * 0.5);
            const side = centred === 0 ? (i % 2 ? 1 : -1) : Math.sign(centred);
            const spread = centred * 0.22 + side * lerp(0.02, 0.08, r());
            const length = lerp(conf.size[0], conf.size[1], r()) * lerp(1.08, 0.78, outer);

            drawLeaf(
              {
                x: centred * plant.stemWidth * 0.28,
                y: Math.abs(centred) * 0.35,
                angle: baseAngle + spread,
                kind: 'iris',
                conf,
                length,
                width: lerp(conf.width[0], conf.width[1], r()),
                curl: side * lerp(0.08, 0.2, r()),
                shade: lerp(0.16, 0.74, r()),
                tone: 'green',
                anchorT: 0,
                turnover: false,
                fold: 0.78,
                foldTilt: 0,
              },
              leafGrowth
            );
          }
        }

        // Daylily foliage is a basal fountain: long, narrow leaves arch from
        // the crown while the flower scape remains leafless above it.
        function drawDaylilyFoliage(plant, growth, growing) {
          const r = mulberry32((plant.seed ^ 0xd4a11eaf) >>> 0);
          const baseAngle = curveAt(plant.stem, 0).angle;
          const conf = LEAF_KIND.daylily;
          const order = [0, 8, 1, 7, 2, 6, 3, 5, 4];

          for (let n = 0; n < order.length; n += 1) {
            const i = order[n];
            const centred = i - 4;
            const outer = Math.abs(centred) / 4;
            const side = centred === 0 ? (n % 2 ? 1 : -1) : Math.sign(centred);
            const leafGrowth = growing ? stagedGrowth(growth, n * 0.018) : 1;
            if (leafGrowth <= 0) continue;

            drawLeaf(
              {
                x: centred * plant.stemWidth * 0.24,
                y: Math.abs(centred) * 0.42,
                angle: baseAngle + centred * 0.19 + side * lerp(-0.025, 0.04, r()),
                kind: 'daylily',
                conf,
                length: lerp(conf.size[0], conf.size[1], r()) * lerp(1.06, 0.82, outer),
                width: lerp(conf.width[0], conf.width[1], r()),
                curl: side * lerp(0.24, 0.5, r()),
                shade: lerp(0.12, 0.68, r()),
                tone: 'green',
                anchorT: 0,
                turnover: false,
                fold: 0.8,
                foldTilt: 0,
              },
              leafGrowth
            );
          }
        }

        // Ferns are a hierarchy, not leaves hung from a vine. A single rachis
        // carries alternating pinnae; every pinna then carries its own row of
        // alternating pinnules. Both the cream and green specimens use this
        // same botanical structure.
        function drawFernPlant(plant, growth, growing) {
          const cream = plant.spec.pale;
          const stemProgress = growing ? smoothstep(clamp(growth / 0.7, 0, 1)) : 1;
          const visibleRachis = partialCurve(plant.stem, stemProgress);
          drawStemRibbon(
            visibleRachis,
            plant.stemWidth * 0.72,
            plant.stemWidth * 0.16,
            plant.stemColor
          );

          const r = mulberry32((plant.seed ^ 0x51f15e5d) >>> 0);
          const pinnaCount = 19;
          for (let i = 0; i < pinnaCount; i += 1) {
            const row = i / (pinnaCount - 1);
            const t = lerp(0.1, 0.91, row);
            const side = i % 2 === 0 ? -1 : 1;
            const branchStart = stemArrival(t);
            const branchGrowth = growing
              ? smoothstep(clamp((growth - branchStart) / 0.2, 0, 1))
              : 1;
            if (branchGrowth <= 0) continue;

            const at = curveAt(plant.stem, t);
            const crown = Math.pow(Math.sin(Math.PI * Math.pow(row, 0.86)), 0.48);
            const pinnaLength =
              plant.stem.length *
              (0.105 + crown * 0.235) *
              lerp(1.04, 0.68, row) *
              lerp(0.94, 1.06, r());
            const pinna = makeCurve(r, {
              x: at.x,
              y: at.y,
              length: pinnaLength,
              startAngle: at.angle + side * lerp(1.24, 0.72, row),
              sweep: [0.18, 0.46],
              dir: -side,
              sway: 0.32,
              segments: 12,
              bias: 1.08,
            });

            drawStemRibbon(
              partialCurve(pinna, branchGrowth),
              Math.max(0.62, plant.stemWidth * 0.24),
              0.18,
              plant.branchColor
            );

            // Each side-branch has an alternating sequence of individual
            // pinnules. The slight left/right offset is the fern's rhythm;
            // no mirrored pairs are stamped at the same point.
            const pinnuleCount = 15;
            for (let j = 0; j < pinnuleCount; j += 1) {
              const along = j / (pinnuleCount - 1);
              const leafT = lerp(0.1, 0.84, along);
              const arrival = lerp(0.08, 0.82, leafT);
              const pinnuleGrowth = smoothstep(
                clamp((branchGrowth - arrival) / 0.22, 0, 1)
              );
              if (pinnuleGrowth <= 0) continue;

              const point = curveAt(pinna, leafT);
              const pinnuleSide = j % 2 === 0 ? -1 : 1;
              const profile = Math.pow(Math.sin(Math.PI * Math.pow(along, 0.8)), 0.5);
              const length =
                pinnaLength *
                (0.115 + profile * 0.14) *
                (0.18 + pinnuleGrowth * 0.82);
              const accent = (i * 3 + j) % 7 === 0;
              const shade = cream ? (accent ? 0.82 : 0.56) : accent ? 0.48 : 0.34;
              const fill = leafFill({ tone: cream ? 'cream' : 'green', shade });

              ctx.save();
              ctx.translate(point.x, point.y);
              ctx.rotate(
                point.angle +
                pinnuleSide * lerp(1.02, 0.7, along) +
                side * 0.05
              );
              drawFrondLeaflet(length, length * 0.24, fill, true, cream);
              ctx.restore();
            }

            const pinnaTip = curveAt(pinna, 0.88);
            const pinnaAhead = curveAt(pinna, 1);
            ctx.save();
            ctx.translate(pinnaTip.x, pinnaTip.y);
            ctx.rotate(Math.atan2(pinnaAhead.y - pinnaTip.y, pinnaAhead.x - pinnaTip.x));
            drawFrondLeaflet(
              pinnaLength * 0.18 * branchGrowth,
              pinnaLength * 0.038 * branchGrowth,
              leafFill({
                tone: cream ? 'cream' : 'green',
                shade: cream ? (i % 6 === 0 ? 0.82 : 0.56) : i % 6 === 0 ? 0.48 : 0.34,
              }),
              true,
              cream
            );
            ctx.restore();
          }

          // The final pinnae collapse into a narrow terminal blade instead of
          // ending in a bare stalk.
          if (stemProgress > 0.78) {
            const tipBase = curveAt(plant.stem, 0.91);
            const tip = curveAt(plant.stem, 1);
            const tipGrowth = smoothstep(clamp((stemProgress - 0.78) / 0.22, 0, 1));
            ctx.save();
            ctx.translate(tipBase.x, tipBase.y);
            ctx.rotate(Math.atan2(tip.y - tipBase.y, tip.x - tipBase.x));
            drawFrondLeaflet(
              plant.stem.length * 0.1 * tipGrowth,
              plant.stem.length * 0.021 * tipGrowth,
              leafFill({ tone: cream ? 'cream' : 'green', shade: cream ? 0.56 : 0.34 }),
              true,
              cream
            );
            ctx.restore();
          }
        }

        function partialCurve(curve, progress) {
          const p = clamp(progress, 0.001, 1);
          if (p >= 1) return curve;
          const end = p * (curve.pts.length - 1);
          const whole = Math.floor(end);
          const fraction = end - whole;
          const pts = curve.pts.slice(0, whole + 1);
          const angs = curve.angs.slice(0, whole + 1);
          const next = Math.min(whole + 1, curve.pts.length - 1);
          pts.push({
            x: lerp(curve.pts[whole].x, curve.pts[next].x, fraction || 0.001),
            y: lerp(curve.pts[whole].y, curve.pts[next].y, fraction || 0.001),
          });
          angs.push(lerp(curve.angs[whole], curve.angs[next], fraction || 0.001));
          return { pts, angs, length: curve.length * p, dir: curve.dir };
        }

        function stemArrival(stemT) {
          return inverseSmoothstep(stemT) * 0.62;
        }

        // Recurved prickles, which is what a rose actually has.
        function drawThorns(curve, stemWidth, plantSeed) {
          const r = mulberry32((plantSeed ^ 0x2b91cf) >>> 0);
          const count = randInt(r, 5, 9);
          ctx.save();
          ctx.fillStyle = P.stemDeep;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.4;
          for (let i = 0; i < count; i += 1) {
            const t = lerp(0.08, 0.92, (i + r() * 0.7) / count);
            const at = curveAt(curve, t);
            const side = i % 2 ? 1 : -1;
            const half = lerp(stemWidth, stemWidth * 0.3, t) * 0.5;
            const size = lerp(2.4, 4.4, r());
            ctx.save();
            ctx.translate(
              at.x + Math.cos(at.angle + (Math.PI / 2) * side) * half * 0.8,
              at.y + Math.sin(at.angle + (Math.PI / 2) * side) * half * 0.8
            );
            ctx.rotate(at.angle + (Math.PI / 2) * side);
            ctx.beginPath();
            ctx.moveTo(-size * 0.55, 0);
            ctx.quadraticCurveTo(size * 0.1, size * 0.2, size * 0.15, size * 1.5);
            ctx.quadraticCurveTo(size * 0.5, size * 0.25, size * 0.62, 0);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 0.5;
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        function drawTendril(tip, size, dir) {
          const R0 = size * 0.36;
          const nx = Math.cos(tip.angle + (Math.PI / 2) * dir);
          const ny = Math.sin(tip.angle + (Math.PI / 2) * dir);
          const cx = tip.x + nx * R0;
          const cy = tip.y + ny * R0;
          const th0 = Math.atan2(tip.y - cy, tip.x - cx);
          const pts = [];
          for (let i = 0; i <= 46; i += 1) {
            const t = i / 46;
            const th = th0 + dir * t * TAU * 2.3;
            const rr = R0 * Math.exp(-1.25 * t);
            pts.push({ x: cx + Math.cos(th) * rr, y: cy + Math.sin(th) * rr });
          }
          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = P.stemDeep;
          for (let pass = 0; pass < 2; pass += 1) {
            ctx.lineWidth = pass === 0 ? 1.5 : 0.6;
            ctx.strokeStyle = pass === 0 ? P.stemDeep : P.leafPale;
            ctx.globalAlpha = pass === 0 ? 1 : 0.3;
            ctx.beginPath();
            traceSmooth(pts, true);
            ctx.stroke();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Foliage
        // ---------------------------------------------------------------

        function leafRib(leaf, t) {
          const L = leaf.length;
          return { x: L * t, y: -L * leaf.curl * t * t * (1.5 - 0.5 * t) };
        }

        function leafOutline(leaf, steps) {
          const profile = LEAF_PROFILE[leaf.conf.profile] || LEAF_PROFILE.ovate;
          const upper = [];
          const lower = [];
          for (let i = 0; i <= steps; i += 1) {
            const t = i / steps;
            const p = leafRib(leaf, t);
            const q = leafRib(leaf, Math.min(1, t + 0.012));
            const a = Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2;
            let hw = profile(t) * leaf.width * leaf.length * 0.5;
            if (leaf.conf.teeth) {
              hw *= 1 + leaf.conf.serr * Math.sin(t * Math.PI * leaf.conf.teeth * 2);
            }
            upper.push({ x: p.x + Math.cos(a) * hw, y: p.y + Math.sin(a) * hw });
            lower.push({ x: p.x - Math.cos(a) * hw, y: p.y - Math.sin(a) * hw });
          }
          return { upper, lower };
        }

        function leafFill(leaf) {
          if (leaf.tone === 'cream') {
            if (leaf.shade < 0.28) return P.leafCreamShade;
            if (leaf.shade < 0.78) return P.leafCream;
            return P.leafCreamLight;
          }
          if (leaf.shade < 0.16) return P.leafDark;
          if (leaf.shade < 0.42) return P.leaf;
          if (leaf.shade < 0.68) return P.leafMid;
          if (leaf.shade < 0.86) return P.olive;
          return P.leafLight;
        }

        // A leaf is an arrangement, not always a single blade: roses come in
        // threes on a petiole, honeysuckle in opposite pairs.
        function drawLeaf(leaf, growth) {
          const unfurl = developmentProgress(growth === undefined ? 1 : growth);
          if (unfurl <= 0) return;
          const open = smoothstep(clamp((unfurl - 0.12) / 0.88, 0, 1));
          ctx.save();
          ctx.translate(leaf.x, leaf.y);
          // Twenty drawn poses replace the old whole-leaf squash. The rib grows
          // first; the blade then broadens, bends and fans away from the stem.
          ctx.rotate(leaf.angle - Math.sign(leaf.curl || 1) * (1 - open) * 0.72);

          if (leaf.conf.fatsia) {
            drawFatsiaLeaf(developLeaf(leaf, unfurl));
          } else if (leaf.conf.monstera) {
            drawMonsteraLeaf(developLeaf(leaf, unfurl));
          } else if (leaf.conf.fig) {
            drawFigLeaf(developLeaf(leaf, unfurl));
          } else if (leaf.conf.palm) {
            drawCompoundFrond(developLeaf(leaf, unfurl), 'palm');
          } else if (leaf.conf.fern) {
            drawCompoundFrond(developLeaf(leaf, unfurl), 'fern');
          } else if (leaf.conf.pinnate) {
            drawPinnateLeaf(developLeaf(leaf, unfurl));
          } else if (leaf.conf.trio) {
            const stalk = leaf.length * 0.34 * smoothstep(clamp(unfurl / 0.56, 0, 1));
            drawPetiole(stalk, leaf.curl);
            const tip = { x: stalk, y: -stalk * leaf.curl * 0.9 };
            for (let i = 0; i < 2; i += 1) {
              const s = i === 0 ? 1 : -1;
              const bladeGrowth = stagedGrowth(unfurl, 0.16 + i * 0.08);
              if (bladeGrowth <= 0) continue;
              ctx.save();
              ctx.translate(tip.x * 0.42, tip.y * 0.42);
              ctx.rotate(s * 0.8 * smoothstep(bladeGrowth));
              drawBlade(
                developLeaf(
                  variant(leaf, leaf.length * 0.66, s * Math.abs(leaf.curl)),
                  bladeGrowth
                )
              );
              ctx.restore();
            }
            const tipGrowth = stagedGrowth(unfurl, 0.3);
            ctx.save();
            ctx.translate(tip.x, tip.y);
            if (tipGrowth > 0) {
              drawBlade(
                developLeaf(
                  variant(leaf, leaf.length * 0.88, leaf.curl, leaf.turnover),
                  tipGrowth
                )
              );
            }
            ctx.restore();
          } else if (leaf.conf.pair) {
            for (let i = 0; i < 2; i += 1) {
              const s = i === 0 ? 1 : -1;
              const bladeGrowth = stagedGrowth(unfurl, i * 0.1);
              if (bladeGrowth <= 0) continue;
              ctx.save();
              ctx.rotate(s * 0.52 * smoothstep(bladeGrowth));
              drawBlade(
                developLeaf(
                  variant(
