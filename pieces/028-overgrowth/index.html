            upper.push({ x, y: curve - width });
            lower.push({ x, y: curve + width });
          }

          ctx.beginPath();
          if (toothed) {
            ctx.moveTo(0, 0);
            for (const p of upper) ctx.lineTo(p.x, p.y);
            for (let i = lower.length - 1; i >= 0; i -= 1) ctx.lineTo(lower[i].x, lower[i].y);
          } else {
            traceSmooth(upper, true);
            traceSmooth(lower.slice().reverse(), false);
          }
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.globalAlpha = 0.44;
          ctx.strokeStyle = cream ? P.umber : P.ink;
          ctx.lineWidth = 0.55;
          ctx.stroke();
          ctx.globalAlpha = 0.34;
          ctx.strokeStyle = cream ? P.leafCreamVein : P.leafPale;
          ctx.lineWidth = 0.45;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(length * 0.52, -length * 0.02, length, -length * 0.055);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // Cosmos and poppy carry feathered foliage: leaflets on a bent rachis.
        function drawPinnateLeaf(leaf) {
          const rachis = [];
          for (let i = 0; i <= 14; i += 1) rachis.push(leafRib(leaf, i / 14));
          ctx.save();
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = 0.9;
          ctx.lineCap = 'round';
          ctx.beginPath();
          traceSmooth(rachis, true);
          ctx.stroke();

          const pairs = 3;
          const fill = leafFill(leaf);
          for (let i = 1; i <= pairs + 1; i += 1) {
            const leafletGrowth = stagedGrowth(leaf.development || 1, (i - 1) * 0.12);
            if (leafletGrowth <= 0) continue;
            const t = Math.min(1, i / (pairs + 0.6));
            const p = leafRib(leaf, t);
            const q = leafRib(leaf, Math.min(1, t + 0.02));
            const base = Math.atan2(q.y - p.y, q.x - p.x);
            const len = leaf.length * 0.5 * (1 - t * 0.4) * (0.16 + leafletGrowth * 0.84);
            const halfWidth = len * (0.04 + smoothstep(leafletGrowth) * 0.3);
            const sides = i > pairs ? [0] : [1, -1];
            for (const s of sides) {
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(base + s * 0.78);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.bezierCurveTo(len * 0.34, -halfWidth, len * 0.8, -halfWidth, len, -len * 0.04);
              ctx.bezierCurveTo(len * 0.72, halfWidth * 0.68, len * 0.3, halfWidth * 0.54, 0, 0);
              ctx.closePath();
              ctx.fillStyle = fill;
              ctx.fill();
              ctx.globalAlpha = 0.45;
              ctx.strokeStyle = P.ink;
              ctx.lineWidth = 0.55;
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.restore();
            }
          }
          ctx.restore();
        }

        function drawBud(branch, kind, growth) {
          const emerge = developmentProgress(growth === undefined ? 1 : growth);
          if (emerge <= 0) return;
          const size = branch.budSize * (0.2 + smoothstep(emerge) * 0.8);
          const angle = branch.tip.angle + Math.PI / 2;
          const petalColor =
            kind === 'lily' || kind === 'cosmos'
              ? P.ochre
              : kind === 'daisy'
                ? P.cream
                : kind === 'anemone'
                  ? P.indigo
                  : kind === 'honeysuckle'
                    ? P.weld
                    : P.madder;

          ctx.save();
          ctx.translate(branch.tip.x, branch.tip.y);
          ctx.rotate(angle);

          // Calyx sepals, curved outward.
          ctx.fillStyle = P.leafDark;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.5;
          for (let i = -1; i <= 1; i += 1) {
            ctx.save();
            ctx.rotate(i * 0.5 * smoothstep(emerge));
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(-size * 0.44, -size * 0.3, -size * 0.1, -size * 0.98);
            ctx.quadraticCurveTo(size * 0.4, -size * 0.26, 0, 2);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 0.45;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          }

          ctx.fillStyle = petalColor;
          ctx.beginPath();
          ctx.ellipse(0, -size * 0.58, size * 0.56, size * 0.84, 0, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();

          ctx.globalAlpha = 0.3;
          ctx.lineWidth = 0.45;
          for (let i = -1; i <= 1; i += 1) {
            ctx.beginPath();
            ctx.moveTo(i * size * 0.24, -size * 0.1);
            ctx.quadraticCurveTo(i * size * 0.3, -size * 0.7, i * size * 0.1, -size * 1.3);
            ctx.stroke();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Flowers — flat dye colour, contour line, engraved base hatching.
        // ---------------------------------------------------------------

        function drawFlower(kind, bloom, plantSeed, opening) {
          switch (kind) {
            case 'rose': drawRose(bloom, plantSeed, opening); break;
            case 'peony': drawPeony(bloom, plantSeed, opening); break;
            case 'cosmos': drawCosmos(bloom, opening); break;
            case 'poppy': drawPoppy(bloom, opening); break;
            case 'daisy': drawDaisy(bloom, opening); break;
            case 'lily': drawLily(bloom, opening); break;
            case 'hydrangea': drawHydrangea(bloom, plantSeed, opening); break;
            case 'anemone': drawAnemone(bloom, opening); break;
            case 'honeysuckle': drawHoneysuckle(bloom, plantSeed, opening); break;
            default: break;
          }
        }

        function drawOpeningFlower(kind, bloom, plantSeed, progress) {
          const opening = flowerDevelopmentProgress(progress);

          // The bud and the open corolla overlap for several drawn frames.
          // Sepals hinge away while individual petals lengthen and rotate;
          // there is no single final-flower squash transform anymore.
          if (opening < 0.78) {
            const bud = 1 - smoothstep(opening / 0.78);
            const sepalOpen = smoothstep(clamp(opening / 0.64, 0, 1));
            ctx.save();
            ctx.globalAlpha = clamp(bud * 1.5, 0, 1);
            ctx.fillStyle = P.leafDark;
            for (const side of [-1, 1]) {
              ctx.save();
              ctx.rotate(side * lerp(0.24, 0.9, sepalOpen));
              ctx.beginPath();
              ctx.moveTo(0, bloom.r * 0.08);
              ctx.quadraticCurveTo(
                side * bloom.r * lerp(0.08, 0.22, sepalOpen),
                -bloom.r * 0.1,
                0,
                -bloom.r * lerp(0.34, 0.5, sepalOpen)
              );
              ctx.quadraticCurveTo(-side * bloom.r * 0.08, -bloom.r * 0.08, 0, bloom.r * 0.08);
              ctx.fill();
              ctx.restore();
            }
            ctx.fillStyle = flowerBudColor(kind);
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.65;
            ctx.beginPath();
            ctx.ellipse(
              0,
              -bloom.r * lerp(0.18, 0.08, sepalOpen),
              bloom.r * lerp(0.2, 0.34, sepalOpen),
              bloom.r * lerp(0.34, 0.18, sepalOpen),
              0,
              0,
              TAU
            );
            ctx.fill();
            ctx.globalAlpha = 0.48;
            ctx.stroke();
            ctx.restore();
          }

          if (opening >= 1 / (FLOWER_DEVELOPMENT_FRAMES - 1)) {
            drawFlower(kind, bloom, plantSeed, flowerStagedGrowth(opening, 0.08));
          }
        }

        function posePetal(finalAngle, radius, opening, delay) {
          const t = flowerStagedGrowth(opening, delay || 0);
          const angle = normalizeAngle(finalAngle);
          ctx.rotate(angle * smoothstep(t));
          ctx.translate(0, -radius * (0.12 + smoothstep(t) * 0.88));
          return t;
        }

        function petalLength(length, opening) {
          return length * (0.42 + smoothstep(opening) * 0.58);
        }

        function petalWidth(width, opening) {
          return width * (0.12 + Math.pow(smoothstep(opening), 1.35) * 0.88);
        }

        function drawFlowerCenter(opening, draw) {
          const reveal = smoothstep(clamp((opening - 0.52) / 0.48, 0, 1));
          if (reveal <= 0) return;
          ctx.save();
          ctx.globalAlpha *= reveal;
          draw();
          ctx.restore();
        }

        function flowerBudColor(kind) {
          if (kind === 'lily' || kind === 'cosmos' || kind === 'honeysuckle') return P.ochre;
          if (kind === 'daisy') return P.cream;
          if (kind === 'anemone') return P.indigo;
          if (kind === 'hydrangea') return P.woad;
          return P.madder;
        }

        function petalPath(len, wid, shoulder, notch) {
          ctx.beginPath();
          ctx.moveTo(0, len * 0.46);
          ctx.bezierCurveTo(
            -wid,
            len * shoulder * 0.34,
            -wid * 0.86,
            -len * 0.34,
            notch ? -wid * 0.2 : 0,
            -len * 0.5
          );
          if (notch) ctx.quadraticCurveTo(0, -len * 0.36, wid * 0.2, -len * 0.5);
          ctx.bezierCurveTo(wid * 0.86, -len * 0.34, wid, len * shoulder * 0.34, 0, len * 0.46);
          ctx.closePath();
        }

        function inkPetal(len, wid, shoulder, fill, opts) {
          const o = opts || {};
          petalPath(len, wid, shoulder, o.notch);
          ctx.fillStyle = fill;
          ctx.fill();

          if (len > 8) {
            ctx.save();
            ctx.clip();
            ctx.globalAlpha = o.hatchAlpha || 0.16;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.42;
            for (let i = 1; i <= 4; i += 1) {
              const t = i / 5;
              const y = len * 0.44 - len * 0.6 * t;
              const w = wid * (1 - t * 0.45);
              ctx.beginPath();
              ctx.moveTo(-w, y);
              ctx.quadraticCurveTo(0, y - len * 0.08, w, y);
              ctx.stroke();
            }
            ctx.restore();
          }

          ctx.save();
          ctx.globalAlpha = o.inkAlpha || 0.45;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = o.inkWidth || 0.55;
          petalPath(len, wid, shoulder, o.notch);
          ctx.stroke();

          if (o.veins) {
            ctx.globalAlpha = 0.2;
            ctx.lineWidth = 0.4;
            for (let i = -1; i <= 1; i += 1) {
              ctx.beginPath();
              ctx.moveTo(0, len * 0.4);
              ctx.quadraticCurveTo(i * wid * 0.52, -len * 0.06, i * wid * 0.4, -len * 0.4);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        // The gallica rose of a plate is semi-double: two loose rows of broad
        // petals opening onto a boss of stamens, not a rolled florist's bud.
        function drawRose(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed + Math.floor(bloom.phase * 10000)) >>> 0);
          const deep = bloom.variant > 0.6;
          const outer = deep ? P.wine : P.madder;
          const inner = deep ? P.madderDeep : P.rose;
          const pale = deep ? P.rose : P.rosePale;

          ctx.save();
          for (let row = 0; row < 2; row += 1) {
            const count = row === 0 ? 6 : 5;
            const radius = r * (row === 0 ? 1 : 0.74);
            for (let i = 0; i < count; i += 1) {
              ctx.save();
              const pose = posePetal(
                (i / count) * TAU + row * 0.58 + lerp(-0.14, 0.14, rng()),
                radius * 0.4,
                opening,
                row * 0.12 + i * 0.012
              );
              inkPetal(
                petalLength(radius * lerp(0.8, 1.0, rng()), pose),
                petalWidth(radius * lerp(0.5, 0.64, rng()), pose),
                0.82,
                row === 0 ? outer : inner,
                { notch: true, veins: true }
              );
              ctx.restore();
            }
          }
          for (let i = 0; i < 4; i += 1) {
            ctx.save();
            const pose = posePetal((i / 4) * TAU + 0.42, r * 0.22, opening, 0.28 + i * 0.018);
            inkPetal(
              petalLength(r * 0.46, pose),
              petalWidth(r * 0.3, pose),
              0.86,
              pale,
              { notch: true, inkAlpha: 0.36 }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => stamenBoss(rng, r * 0.19, 22, P.olive));
          ctx.restore();
        }

        function drawPeony(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.phase * 30000)) >>> 0);
          const pale = bloom.variant > 0.5;
          const guard = pale ? P.rose : P.wine;
          const inner = pale ? P.rosePale : P.madder;
          const innerPale = pale ? P.cream : P.rose;

          ctx.save();
          // Three coherent whorls create a recognizable bowl-shaped peony;
          // the previous loose scatter read as a container of detached petals.
          const rows = [
            { count: 7, radius: 0.44, length: 0.96, width: 0.56, delay: 0, fill: guard },
            { count: 8, radius: 0.3, length: 0.7, width: 0.4, delay: 0.14, fill: inner },
            { count: 6, radius: 0.16, length: 0.48, width: 0.26, delay: 0.3, fill: innerPale },
          ];
          for (let row = 0; row < rows.length; row += 1) {
            const conf = rows[row];
            for (let i = 0; i < conf.count; i += 1) {
              ctx.save();
              const pose = posePetal(
                (i / conf.count) * TAU + row * 0.44 + lerp(-0.12, 0.12, rng()),
                r * conf.radius,
                opening,
                conf.delay + i * 0.009
              );
              inkPetal(
                petalLength(r * conf.length * lerp(0.9, 1.06, rng()), pose),
                petalWidth(r * conf.width * lerp(0.9, 1.08, rng()), pose),
                0.88,
                conf.fill,
                { notch: true, veins: row === 0, inkAlpha: 0.46, hatchAlpha: 0.12 }
              );
              ctx.restore();
            }
          }
          drawFlowerCenter(opening, () => stamenBoss(rng, r * 0.12, 16, P.olive));
          ctx.restore();
        }

        // A ring of filaments with gold anthers — the detail an engraver
        // would never leave out.
        function stamenBoss(rng, radius, count, discColor) {
          ctx.save();
          ctx.fillStyle = discColor;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();

          ctx.globalAlpha = 0.72;
          ctx.strokeStyle = P.umber;
          ctx.lineWidth = 0.5;
          const tips = [];
          for (let i = 0; i < count; i += 1) {
            const a = (i / count) * TAU + lerp(-0.06, 0.06, rng());
            const reach = radius * lerp(1.7, 2.6, rng());
            const bow = lerp(-0.28, 0.28, rng());
            const tx = Math.cos(a) * reach;
            const ty = Math.sin(a) * reach;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * radius * 0.4, Math.sin(a) * radius * 0.4);
            ctx.quadraticCurveTo(
              Math.cos(a + bow) * reach * 0.66,
              Math.sin(a + bow) * reach * 0.66,
              tx,
              ty
            );
            ctx.stroke();
            tips.push({ x: tx, y: ty, a });
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = P.gold;
          for (const tip of tips) {
            ctx.beginPath();
            ctx.ellipse(tip.x, tip.y, radius * 0.17, radius * 0.1, tip.a, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function drawCosmos(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.ochre, P.weld] : [P.madder, P.rose];
          for (let i = 0; i < 8; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 8 + 0.1, r * 0.42, opening, i * 0.014);
            inkPetal(
              petalLength(r * 0.84, pose),
              petalWidth(r * 0.34, pose),
              0.34,
              palette[i % 2],
              { notch: true, veins: true }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => discCenter(r * 0.26, P.umber, P.gold, 16));
        }

        function drawPoppy(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.madder, '#c04a32'] : [P.madderDeep, P.wine];
          ctx.save();
          for (let i = 0; i < 5; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 5 + 0.14, r * 0.3, opening, i * 0.025);
            inkPetal(
              petalLength(r, pose),
              petalWidth(r * 0.6, pose),
              0.72,
              palette[i % 2],
              { veins: true, hatchAlpha: 0.2 }
            );
            // The dark basal blotch of a field poppy.
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = P.ink;
            ctx.beginPath();
            ctx.ellipse(0, r * 0.34, r * 0.2, r * 0.14, 0, 0, TAU);
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();

          // Stamen ring, then the capsule.
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.ink;
            ctx.globalAlpha = 0.7;
            ctx.lineWidth = 0.6;
            for (let i = 0; i < 22; i += 1) {
              const a = (i / 22) * TAU;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * r * 0.16, Math.sin(a) * r * 0.16);
              ctx.lineTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
              ctx.stroke();
            }
            ctx.restore();
            discCenter(r * 0.2, '#3b4029', P.leafPale, 8);
          });
        }

        function drawDaisy(bloom, opening) {
          const r = bloom.r;
          const count = 15;
          for (let i = 0; i < count; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / count, r * 0.46, opening, i * 0.008);
            inkPetal(petalLength(r * 0.9, pose), petalWidth(r * 0.2, pose), 0.3, i % 3 ? P.white : P.cream, {
              notch: true,
              inkAlpha: 0.4,
              hatchAlpha: 0.1,
            });
            ctx.restore();
          }
          drawFlowerCenter(opening, () => discCenter(r * 0.3, '#b98a24', P.gold, 20));
        }

        function drawAnemone(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.indigo, P.woad] : [P.indigoDeep, P.indigo];
          for (let i = 0; i < 9; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 9, r * 0.36, opening, i * 0.012);
            inkPetal(
              petalLength(r * 0.8, pose),
              petalWidth(r * 0.36, pose),
              0.48,
              palette[i % 2],
              { veins: true }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.ink;
            ctx.globalAlpha = 0.65;
            ctx.lineWidth = 0.55;
            for (let i = 0; i < 18; i += 1) {
              const a = (i / 18) * TAU;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * r * 0.18, Math.sin(a) * r * 0.18);
              ctx.lineTo(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38);
              ctx.stroke();
            }
            ctx.restore();
            discCenter(r * 0.22, P.indigoDeep, '#7f9bab', 10);
          });
        }

        function drawLily(bloom, opening) {
          const r = bloom.r;
          const warm = bloom.variant > 0.45;
          for (let i = 0; i < 6; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 6 + 0.12, r * 0.2, opening, i * 0.024);
            const fill = warm ? (i % 2 ? P.ochre : '#c9702c') : (i % 2 ? P.madder : P.rose);
            inkPetal(
              petalLength(r * 1.1, pose),
              petalWidth(r * 0.3, pose),
              0.2,
              fill,
              { veins: true, inkAlpha: 0.5 }
            );
            // Tiger spots.
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = P.madderDeep;
            for (let d = 0; d < 5; d += 1) {
              ctx.beginPath();
              ctx.ellipse(
                (d % 2 ? -1 : 1) * r * 0.085,
                r * (0.2 - d * 0.13),
                1,
                1.5,
                0,
                0,
                TAU
              );
              ctx.fill();
            }
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.umber;
            ctx.fillStyle = P.umber;
            ctx.lineWidth = 0.85;
            ctx.lineCap = 'round';
            for (let i = 0; i < 6; i += 1) {
              const angle = -0.85 + i * 0.34;
              const tipX = Math.sin(angle) * r * 0.6;
              const tipY = -r * 0.62 - Math.cos(angle) * r * 0.05;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(Math.sin(angle) * r * 0.42, -r * 0.24, tipX, tipY);
              ctx.stroke();
              ctx.beginPath();
              ctx.ellipse(tipX, tipY, 1.5, 3.4, angle, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          });
        }

        function drawHydrangea(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed + Math.floor(bloom.variant * 99999)) >>> 0);
          const palette =
            bloom.variant > 0.55
              ? ['#7693a5', P.woad, '#b7c8cc', '#d6dcce']
              : [P.rosePale, '#d99591', '#e6c3b1', '#c98586'];
          const floretCount = 28;
          const florets = [];

          // A mophead hydrangea is one domed mass made from dozens of tiny
          // four-sepal florets. The golden-angle packing keeps that mass
          // organic without leaving a single oversized daisy-like centre.
          for (let i = 0; i < floretCount; i += 1) {
            const angle = bloom.phase + i * GOLDEN * TAU + lerp(-0.09, 0.09, rng());
            const distance =
              i === 0 ? 0 : Math.sqrt(i / (floretCount - 1)) * r * lerp(0.62, 0.76, rng());
            const y = Math.sin(angle) * distance * 0.86;
            florets.push({
              x: Math.cos(angle) * distance,
              y,
              size: r * lerp(0.27, 0.34, rng()) * (1 + y / r * 0.08),
              rotation: rng() * TAU,
              fill: palette[Math.floor(rng() * palette.length)],
              delay: Math.min(0.32, i * 0.008),
            });
          }
          florets.sort((a, b) => a.y - b.y);

          // Fine pedicels show through only in the small gaps between florets.
          ctx.save();
          ctx.globalAlpha = 0.26 * smoothstep(opening);
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = 0.55;
          for (let i = 0; i < florets.length; i += 3) {
            const floret = florets[i];
            ctx.beginPath();
            ctx.moveTo(0, r * 0.16);
            ctx.quadraticCurveTo(floret.x * 0.42, floret.y * 0.5, floret.x, floret.y);
            ctx.stroke();
          }
          ctx.restore();

          for (const floret of florets) {
            const floretOpen = flowerStagedGrowth(opening, floret.delay);
            if (floretOpen <= 0) continue;
            drawHydrangeaFloret(floret, floretOpen);
          }
        }

        function drawHydrangeaFloret(floret, opening) {
          ctx.save();
          ctx.translate(floret.x, floret.y);
          ctx.rotate(floret.rotation);

          for (let petal = 0; petal < 4; petal += 1) {
            ctx.save();
            const pose = posePetal(
              (petal * Math.PI) / 2,
              floret.size * 0.2,
              opening,
              petal * 0.022
            );
            inkPetal(
              petalLength(floret.size * 0.76, pose),
              petalWidth(floret.size * 0.42, pose),
              0.72,
              floret.fill,
              { inkAlpha: 0.3, inkWidth: 0.38, hatchAlpha: 0.08 }
            );
            ctx.restore();
          }

          const centre = smoothstep(clamp((opening - 0.48) / 0.52, 0, 1));
          if (centre > 0) {
            ctx.globalAlpha = centre;
            ctx.fillStyle = P.weld;
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(0.7, floret.size * 0.075), 0, TAU);
            ctx.fill();
            ctx.globalAlpha = centre * 0.45;
            ctx.strokeStyle = P.umber;
            ctx.lineWidth = 0.35;
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawHoneysuckle(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.variant * 54321)) >>> 0);
          const count = 5;
          const warm = bloom.variant > 0.5;
          const tube = warm ? '#f2e2ba' : '#f0dcc4';
          const lip = warm ? P.weld : P.rosePale;

          for (let i = 0; i < count; i += 1) {
            const a = (i / count) * TAU + lerp(-0.16, 0.16, rng());
            const floretOpen = flowerStagedGrowth(opening, i * 0.045);
            const len = r * lerp(0.74, 0.96, rng()) * (0.28 + floretOpen * 0.72);
            ctx.save();
            ctx.rotate(normalizeAngle(a) * smoothstep(floretOpen));

            // Each floret is a curved tube — never a straight one.
            const bend = lerp(0.26, 0.55, rng()) * (i % 2 ? 1 : -1);
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.04);
            ctx.quadraticCurveTo(-len * 0.42, -bend * len * 0.5 - r * 0.08, -len * 0.9, -bend * len);
            ctx.quadraticCurveTo(-len * 0.44, -bend * len * 0.5 + r * 0.2, r * 0.1, r * 0.16);
            ctx.closePath();
            ctx.fillStyle = tube;
            ctx.fill();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

            // The split lip at the mouth, curling back.
            ctx.save();
            ctx.translate(-len * 0.9, -bend * len);
            ctx.rotate(Math.atan2(-bend * len * 0.4, -len * 0.4));
            for (let k = -1; k <= 1; k += 1) {
              ctx.save();
              ctx.rotate(k * 0.68 * smoothstep(floretOpen));
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(
                -r * 0.26 * floretOpen,
                -r * 0.24 * floretOpen,
                -r * 0.48 * floretOpen,
                -r * 0.06
              );
              ctx.quadraticCurveTo(-r * 0.26 * floretOpen, r * 0.11 * floretOpen, 0, 0);
              ctx.closePath();
              ctx.fillStyle = lip;
              ctx.fill();
              ctx.globalAlpha = 0.48;
              ctx.strokeStyle = P.ink;
              ctx.lineWidth = 0.5;
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.restore();
            }
            // Stamens just clearing the mouth.
            ctx.globalAlpha = 0.6;
            ctx.strokeStyle = P.umber;
            ctx.lineWidth = 0.45;
            for (let k = -1; k <= 1; k += 2) {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(-r * 0.24, k * r * 0.1, -r * 0.36, k * r * 0.2);
              ctx.stroke();
            }
            ctx.restore();
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.fillStyle = P.leafMid;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.13, 0, TAU);
            ctx.fill();
          });
        }

        function discCenter(radius, base, dot, count) {
          ctx.save();
          ctx.fillStyle = base;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = dot;
          for (let i = 0; i < count; i += 1) {
            const angle = i * GOLDEN * TAU;
            const d = Math.sqrt(i / count) * radius * 0.78;
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * d, Math.sin(angle) * d, Math.max(0.6, radius * 0.09), 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Utilities
        // ---------------------------------------------------------------

        function developmentProgress(value, frameCount) {
          const t = clamp(value, 0, 1);
          const frames = frameCount || LEAF_DEVELOPMENT_FRAMES;
          const frame = Math.min(frames - 1, Math.floor(t * frames));
          return frame / (frames - 1);
        }

        function stagedGrowth(value, delay, frameCount) {
          return developmentProgress(
            clamp((value - delay) / Math.max(0.001, 1 - delay), 0, 1),
            frameCount
          );
        }

        function flowerDevelopmentProgress(value) {
          return developmentProgress(value, FLOWER_DEVELOPMENT_FRAMES);
        }

        function flowerStagedGrowth(value, delay) {
          return stagedGrowth(value, delay, FLOWER_DEVELOPMENT_FRAMES);
        }

        function normalizeAngle(angle) {
          return Math.atan2(Math.sin(angle), Math.cos(angle));
        }

        function sortPlants() {
          plants.sort((a, b) => a.depth - b.depth || a.id - b.id);
        }

        function roman(n) {
          const map = [
            [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
            [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I'],
          ];
          let value = n;
          let out = '';
          for (const [v, s] of map) {
            while (value >= v) {
              out += s;
              value -= v;
            }
          }
          return out;
        }

        function announce(message) {
          status.textContent = '';
          requestAnimationFrame(() => {
            status.textContent = message;
          });
        }

        function mulberry32(a) {
          return function () {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randInt(r, min, max) {
          return Math.floor(r() * (max - min + 1)) + min;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function smoothstep(value) {
          const t = clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function inverseSmoothstep(value) {
          const t = clamp(value, 0, 1);
          return 0.5 - Math.sin(Math.asin(1 - 2 * t) / 3);
        }
      })();
    </script>
