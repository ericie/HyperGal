                inkWidth: 0.4,
              });
              ctx.restore();
            }
            ctx.fillStyle = P.weld;
            ctx.beginPath();
            ctx.arc(0, 0, sr * 0.14, 0, TAU);
            ctx.fill();
            ctx.restore();
          }

          drawFlowerCenter(opening, () => {
            ctx.fillStyle = bloom.variant > 0.55 ? P.indigoDeep : P.madderDeep;
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.38, r * 0.31, 0, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = P.umber;
            ctx.globalAlpha = 0.68;
            ctx.lineWidth = 0.45;
            for (let i = 0; i < 24; i += 1) {
              const angle = i * GOLDEN * TAU;
              const d = Math.sqrt((i + 0.5) / 24) * r * 0.32;
              const x = Math.cos(angle) * d;
              const y = Math.sin(angle) * d * 0.8;
              ctx.beginPath();
              ctx.moveTo(x, y);
              ctx.lineTo(x + Math.cos(angle) * r * 0.07, y + Math.sin(angle) * r * 0.07);
              ctx.stroke();
              ctx.fillStyle = i % 3 ? P.gold : P.leafPale;
              ctx.beginPath();
              ctx.arc(x, y, Math.max(0.65, r * 0.025), 0, TAU);
              ctx.fill();
            }
          });
        }

        function drawHoneysuckle(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.variant * 54321)) >>> 0);
          const count = 5;
          const warm = bloom.variant > 0.5;
          const tube = warm ? '#f2e2ba' : '#f0dcc4';
          const lip = warm ? P.weld : P.rosePale;

          for (let i = 0; i < count; i += 1) {
            const a = (i / count) * TAU + lerp(-0.16, 0.16, rng());
            const floretOpen = stagedGrowth(opening, i * 0.045);
            const len = r * lerp(0.74, 0.96, rng()) * (0.28 + floretOpen * 0.72);
            ctx.save();
            ctx.rotate(normalizeAngle(a) * smoothstep(floretOpen));

            // Each floret is a curved tube — never a straight one.
            const bend = lerp(0.26, 0.55, rng()) * (i % 2 ? 1 : -1);
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.04);
            ctx.quadraticCurveTo(-len * 0.42, -bend * len * 0.5 - r * 0.08, -len * 0.9, -bend * len);
            ctx.quadraticCurveTo(-len * 0.44, -bend * len * 0.5 + r * 0.2, r * 0.1, r * 0.16);
            ctx.closePath();
            ctx.fillStyle = tube;
            ctx.fill();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

            // The split lip at the mouth, curling back.
            ctx.save();
            ctx.translate(-len * 0.9, -bend * len);
            ctx.rotate(Math.atan2(-bend * len * 0.4, -len * 0.4));
            for (let k = -1; k <= 1; k += 1) {
              ctx.save();
              ctx.rotate(k * 0.68 * smoothstep(floretOpen));
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(
                -r * 0.26 * floretOpen,
                -r * 0.24 * floretOpen,
                -r * 0.48 * floretOpen,
                -r * 0.06
              );
              ctx.quadraticCurveTo(-r * 0.26 * floretOpen, r * 0.11 * floretOpen, 0, 0);
              ctx.closePath();
              ctx.fillStyle = lip;
              ctx.fill();
              ctx.globalAlpha = 0.48;
              ctx.strokeStyle = P.ink;
              ctx.lineWidth = 0.5;
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.restore();
            }
            // Stamens just clearing the mouth.
            ctx.globalAlpha = 0.6;
            ctx.strokeStyle = P.umber;
            ctx.lineWidth = 0.45;
            for (let k = -1; k <= 1; k += 2) {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(-r * 0.24, k * r * 0.1, -r * 0.36, k * r * 0.2);
              ctx.stroke();
            }
            ctx.restore();
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.fillStyle = P.leafMid;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.13, 0, TAU);
            ctx.fill();
          });
        }

        function discCenter(radius, base, dot, count) {
          ctx.save();
          ctx.fillStyle = base;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = dot;
          for (let i = 0; i < count; i += 1) {
            const angle = i * GOLDEN * TAU;
            const d = Math.sqrt(i / count) * radius * 0.78;
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * d, Math.sin(angle) * d, Math.max(0.6, radius * 0.09), 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Utilities
        // ---------------------------------------------------------------

        function developmentProgress(value) {
          const t = clamp(value, 0, 1);
          const frame = Math.min(DEVELOPMENT_FRAMES - 1, Math.floor(t * DEVELOPMENT_FRAMES));
          return frame / (DEVELOPMENT_FRAMES - 1);
        }

        function stagedGrowth(value, delay) {
          return developmentProgress(clamp((value - delay) / Math.max(0.001, 1 - delay), 0, 1));
        }

        function normalizeAngle(angle) {
          return Math.atan2(Math.sin(angle), Math.cos(angle));
        }

        function sortPlants() {
          plants.sort((a, b) => a.depth - b.depth || a.id - b.id);
        }

        function roman(n) {
          const map = [
            [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
            [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I'],
          ];
          let value = n;
          let out = '';
          for (const [v, s] of map) {
            while (value >= v) {
              out += s;
              value -= v;
            }
          }
          return out;
        }

        function announce(message) {
          status.textContent = '';
          requestAnimationFrame(() => {
            status.textContent = message;
          });
        }

        function mulberry32(a) {
          return function () {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randInt(r, min, max) {
          return Math.floor(r() * (max - min + 1)) + min;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function smoothstep(value) {
          const t = clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function inverseSmoothstep(value) {
          const t = clamp(value, 0, 1);
          return 0.5 - Math.sin(Math.asin(1 - 2 * t) / 3);
        }
      })();
    </script>
