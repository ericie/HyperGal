                    leaf,
                    leaf.length * (s > 0 ? 1 : 0.86),
                    s * Math.abs(leaf.curl),
                    s > 0 && leaf.turnover
                  ),
                  bladeGrowth
                )
              );
              ctx.restore();
            }
          } else {
            drawBlade(developLeaf(leaf, unfurl));
          }
          ctx.restore();
        }

        function developLeaf(leaf, progress) {
          const t = developmentProgress(progress);
          const length = smoothstep(clamp(t / 0.72, 0, 1));
          const width = smoothstep(clamp((t - 0.12) / 0.88, 0, 1));
          return {
            ...leaf,
            length: leaf.length * (0.12 + length * 0.88),
            width: leaf.width * (0.06 + width * 0.94),
            curl: leaf.curl * (0.18 + width * 0.82),
            turnover:
              leaf.turnover &&
              t >= (LEAF_DEVELOPMENT_FRAMES - 2) / (LEAF_DEVELOPMENT_FRAMES - 1),
            development: t,
          };
        }

        function variant(leaf, length, curl, turnover) {
          return {
            length,
            width: leaf.width,
            curl,
            conf: leaf.conf,
            shade: leaf.shade,
            tone: leaf.tone,
            turnover: !!turnover,
            fold: leaf.fold,
            foldTilt: leaf.foldTilt,
          };
        }

        function drawPetiole(length, curl) {
          ctx.save();
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = 1.1;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(length * 0.5, -length * curl * 0.32, length, -length * curl * 0.9);
          ctx.stroke();
          ctx.restore();
        }

        function drawBlade(leaf) {
          ctx.save();
          const isCream = leaf.tone === 'cream';
          const steps = leaf.conf.sharp ? 30 : 24;
          const { upper, lower } = leafOutline(leaf, steps);
          const fill = leafFill(leaf);

          ctx.beginPath();
          if (leaf.conf.sharp) {
            ctx.moveTo(upper[0].x, upper[0].y);
            for (let i = 1; i < upper.length; i += 1) ctx.lineTo(upper[i].x, upper[i].y);
            for (let i = lower.length - 1; i >= 0; i -= 1) ctx.lineTo(lower[i].x, lower[i].y);
          } else {
            traceSmooth(upper, true);
            traceSmooth(lower.slice().reverse(), false);
          }
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();

          // Engraved shading: curved hatch following the side veins.
          if (leaf.length > 15) {
            ctx.save();
            ctx.clip();
            ctx.globalAlpha = isCream ? 0.075 : 0.12;
            ctx.strokeStyle = isCream ? P.leafCreamVein : P.ink;
            ctx.lineWidth = 0.5;
            const dirSign = leaf.curl >= 0 ? 1 : -1;
            for (let i = 1; i <= 7; i += 1) {
              const t = i / 8;
              const p = leafRib(leaf, t);
              const reach = leaf.length * leaf.width * 0.62;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.quadraticCurveTo(
                p.x + leaf.length * 0.02,
                p.y + dirSign * reach * 0.45,
                p.x - leaf.length * 0.1,
                p.y + dirSign * reach
              );
              ctx.stroke();
            }
            ctx.restore();
          }

          if (!isCream) {
            ctx.globalAlpha = 0.62;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.85;
            // The current path after the clipped hatch pass is its final
            // shading stroke, not the blade perimeter. Rebuild the outline
            // before stroking or that hatch escapes the clip as a hooked
            // projection beyond the leaf tip.
            ctx.beginPath();
            if (leaf.conf.sharp) {
              ctx.moveTo(upper[0].x, upper[0].y);
              for (let i = 1; i < upper.length; i += 1) ctx.lineTo(upper[i].x, upper[i].y);
              for (let i = lower.length - 1; i >= 0; i -= 1) ctx.lineTo(lower[i].x, lower[i].y);
            } else {
              traceSmooth(upper, true);
              traceSmooth(lower.slice().reverse(), false);
            }
            ctx.closePath();
            ctx.stroke();
          }

          // Midrib and side veins, all of them curved with the blade.
          ctx.globalAlpha = isCream ? 0.5 : 0.42;
          ctx.strokeStyle = isCream ? P.leafCreamVein : P.leafPale;
          ctx.lineWidth = isCream ? 0.8 : 0.7;
          const rib = [];
          for (let i = 0; i <= 12; i += 1) rib.push(leafRib(leaf, i / 12));
          ctx.beginPath();
          traceSmooth(rib, true);
          ctx.stroke();

          ctx.globalAlpha = isCream ? 0.3 : 0.26;
          ctx.lineWidth = 0.5;
          for (let i = 1; i <= 5; i += 1) {
            const t = i / 6.4;
            const p = leafRib(leaf, t);
            const reach = leaf.length * leaf.width * 0.44 * (1 - t * 0.4);
            for (const s of [1, -1]) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.quadraticCurveTo(
                p.x + leaf.length * 0.09,
                p.y + s * reach * 0.5,
                p.x + leaf.length * 0.13,
                p.y + s * reach
              );
              ctx.stroke();
            }
          }

          if (leaf.turnover) drawTurnover(leaf, steps);
          ctx.restore();
        }

        // The tip folds back and shows its pale underside — the single detail
        // that separates a drawn leaf from a stamped one.
        function drawTurnover(leaf, steps) {
          const tf = leaf.fold;
          const F = leafRib(leaf, tf);
          const G = leafRib(leaf, Math.min(1, tf + 0.012));
          const ribAngle = Math.atan2(G.y - F.y, G.x - F.x);
          const foldAngle = ribAngle + Math.PI / 2 + leaf.foldTilt;
          const ux = Math.cos(foldAngle);
          const uy = Math.sin(foldAngle);

          const { upper, lower } = leafOutline(leaf, steps);
          const start = Math.ceil(tf * steps);
          const flap = [];
          for (let i = start; i <= steps; i += 1) flap.push(reflect(upper[i], F, ux, uy));
          for (let i = steps; i >= start; i -= 1) flap.push(reflect(lower[i], F, ux, uy));
          if (flap.length < 4) return;

          ctx.save();
          ctx.globalAlpha = 0.97;
          ctx.beginPath();
          traceSmooth(flap, true);
          ctx.closePath();
          ctx.fillStyle =
            leaf.tone === 'cream'
              ? P.paperDeep
              : leaf.shade > 0.6
                ? P.leafPale
                : P.sage;
          ctx.fill();
          if (leaf.tone !== 'cream') {
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }

          ctx.globalAlpha = 0.3;
          ctx.strokeStyle = leaf.tone === 'cream' ? P.leafCreamVein : P.leafDark;
          ctx.lineWidth = 0.55;
          const ribFlap = [];
          for (let i = start; i <= steps; i += 1) {
            ribFlap.push(reflect(leafRib(leaf, i / steps), F, ux, uy));
          }
          ctx.beginPath();
          traceSmooth(ribFlap, true);
          ctx.stroke();

          // The crease itself, pressed a little deeper than the outline.
          ctx.globalAlpha = leaf.tone === 'cream' ? 0.42 : 0.6;
          ctx.strokeStyle = leaf.tone === 'cream' ? P.leafCreamVein : P.ink;
          ctx.lineWidth = 0.85;
          ctx.beginPath();
          ctx.moveTo(upper[start].x, upper[start].y);
          ctx.quadraticCurveTo(F.x, F.y, lower[start].x, lower[start].y);
          ctx.stroke();
          ctx.restore();
        }

        function reflect(p, F, ux, uy) {
          const vx = p.x - F.x;
          const vy = p.y - F.y;
          const d = vx * ux + vy * uy;
          return { x: F.x + 2 * d * ux - vx, y: F.y + 2 * d * uy - vy };
        }

        // Fatsia is a broad hand, not a radial star: seven long lobes fan
        // forward from the petiole, with deep rounded sinuses between them.
        function drawFatsiaLeaf(leaf) {
          const L = leaf.length;
          const cream = leaf.tone === 'cream';
          const fill = leafFill(leaf);
          const palm = { x: L * 0.16, y: -L * leaf.curl * 0.08 };
          const angles = [-1.34, -0.91, -0.46, 0, 0.46, 0.91, 1.34];
          const lengths = [0.72, 0.86, 0.96, 1, 0.96, 0.86, 0.72];
          const reach = L * 0.82 * leaf.width;
          const tips = angles.map((angle, index) => ({
            x: palm.x + Math.cos(angle) * reach * lengths[index],
            y: palm.y + Math.sin(angle) * reach * lengths[index],
            angle,
            radius: reach * lengths[index],
          }));
          const valleys = angles.slice(0, -1).map((angle, index) => {
            const nextAngle = angles[index + 1];
            // Fatsia has deep cuts, but the lobes remain joined by a generous
            // palm. Keeping the valley beyond halfway makes the silhouette
            // read as one broad leaf instead of seven separate fingers.
            const radius = Math.min(tips[index].radius, tips[index + 1].radius) * 0.56;
            const valleyAngle = (angle + nextAngle) * 0.5;
            return {
              x: palm.x + Math.cos(valleyAngle) * radius,
              y: palm.y + Math.sin(valleyAngle) * radius,
            };
          });

          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = cream ? P.leafCreamVein : P.stemDeep;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(palm.x * 0.46, palm.y - L * leaf.curl * 0.08, palm.x, palm.y);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(palm.x, palm.y);
          for (let i = 0; i < tips.length; i += 1) {
            const tip = tips[i];
            const capBefore = {
              x: palm.x + Math.cos(tip.angle - 0.095) * tip.radius * 0.975,
              y: palm.y + Math.sin(tip.angle - 0.095) * tip.radius * 0.975,
            };
            const capAfter = {
              x: palm.x + Math.cos(tip.angle + 0.095) * tip.radius * 0.975,
              y: palm.y + Math.sin(tip.angle + 0.095) * tip.radius * 0.975,
            };
            const shoulderBefore = {
              x: palm.x + Math.cos(tip.angle - 0.25) * tip.radius * 0.73,
              y: palm.y + Math.sin(tip.angle - 0.25) * tip.radius * 0.73,
            };
            const shoulderAfter = {
              x: palm.x + Math.cos(tip.angle + 0.25) * tip.radius * 0.73,
              y: palm.y + Math.sin(tip.angle + 0.25) * tip.radius * 0.73,
            };
            const valley = i < valleys.length ? valleys[i] : palm;
            ctx.bezierCurveTo(
              shoulderBefore.x,
              shoulderBefore.y,
              capBefore.x,
              capBefore.y,
              capBefore.x,
              capBefore.y
            );
            ctx.quadraticCurveTo(tip.x, tip.y, capAfter.x, capAfter.y);
            ctx.bezierCurveTo(
              capAfter.x,
              capAfter.y,
              shoulderAfter.x,
              shoulderAfter.y,
              valley.x,
              valley.y
            );
          }
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (!cream) {
            ctx.globalAlpha = 0.52;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }

          ctx.globalAlpha = cream ? 0.5 : 0.4;
          ctx.strokeStyle = cream ? P.leafCreamVein : P.leafPale;
          ctx.lineWidth = 0.72;
          for (const tip of tips) {
            ctx.beginPath();
            ctx.moveTo(palm.x, palm.y);
            ctx.quadraticCurveTo(
              lerp(palm.x, tip.x, 0.48),
              lerp(palm.y, tip.y, 0.48),
              lerp(palm.x, tip.x, 0.92),
              lerp(palm.y, tip.y, 0.92)
            );
            ctx.stroke();

            const dx = tip.x - palm.x;
            const dy = tip.y - palm.y;
            const normalX = -dy / Math.max(1, tip.radius);
            const normalY = dx / Math.max(1, tip.radius);
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.moveTo(palm.x + dx * 0.58, palm.y + dy * 0.58);
              ctx.quadraticCurveTo(
                palm.x + dx * 0.68 + normalX * tip.radius * 0.06 * side,
                palm.y + dy * 0.68 + normalY * tip.radius * 0.06 * side,
                palm.x + dx * 0.75 + normalX * tip.radius * 0.11 * side,
                palm.y + dy * 0.75 + normalY * tip.radius * 0.11 * side
              );
              ctx.stroke();
            }
          }
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = cream ? P.leafCreamVein : P.stemDeep;
          ctx.beginPath();
          ctx.arc(palm.x, palm.y, Math.max(0.8, L * 0.018), 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        // Each Monstera blade has its own generated anatomy. The two sides do
        // not mirror one another: lobe count, split depth, shoulder fullness,
        // and fenestration placement all come from the leaf's morphology seed.
        function drawMonsteraLeaf(leaf) {
          const L = leaf.length;
          const W = leaf.length * leaf.width * 0.61;
          const fill = leafFill(leaf);
          const morph = makeMonsteraMorphology(leaf.morphSeed || 1);
          const petioleLength = L * (leaf.petioleRatio || 0.48);
          const petioleY = -L * leaf.curl * 0.24;

          ctx.save();
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          // A separate, substantial petiole carries every blade from the
          // crown. It bows gently before entering the heart-shaped sinus.
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = Math.max(1.45, L * 0.019);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(petioleLength * 0.52, petioleY * 0.18, petioleLength, petioleY);
          ctx.stroke();
          ctx.translate(petioleLength, petioleY);

          ctx.beginPath();
          traceMonsteraOutline(L, W, morph);
          addMonsteraFenestrations(L, W, morph);
          ctx.fillStyle = fill;
          ctx.fill('evenodd');

          ctx.globalAlpha = 0.46;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.76;
          ctx.beginPath();
          traceMonsteraOutline(L, W, morph);
          ctx.stroke();

          // Veins are clipped to the solid tissue so they stop naturally at
          // every fenestration rather than drawing across empty space.
          ctx.save();
          ctx.beginPath();
          traceMonsteraOutline(L, W, morph);
          addMonsteraFenestrations(L, W, morph);
          ctx.clip('evenodd');
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = P.leafPale;
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(L * 0.48, -L * leaf.curl * 0.05, L * 0.96, 0);
          ctx.stroke();

          for (const side of [morph.upper, morph.lower]) {
            for (let i = 0; i < side.veins.length; i += 1) {
              const vein = side.veins[i];
              ctx.beginPath();
              ctx.moveTo(L * vein.x * 0.34, 0);
              ctx.quadraticCurveTo(
                L * vein.x * 0.68,
                W * vein.y * 0.4,
                L * vein.x,
                W * vein.y
              );
              ctx.stroke();
            }
          }
          ctx.restore();

          ctx.globalAlpha = 0.68;
          ctx.fillStyle = P.stemDeep;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0.9, L * 0.014), 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        function makeMonsteraMorphology(seed) {
          const r = mulberry32((seed ^ 0x6d0f57a1) >>> 0);

          function side(sign) {
            const fullness = lerp(0.93, 1.06, r());
            // Deliberately different counts keep the two halves from reading
            // as a mirrored emblem.
            const splitCount = sign < 0 ? 5 : 4;
            const splits = [];
            for (let i = 0; i < splitCount; i += 1) {
              const t = splitCount === 1 ? 0.5 : i / (splitCount - 1);
              const x = lerp(0.28, 0.84, t) + lerp(-0.032, 0.032, r());
              const edgeY = sign * monsteraEnvelope(x, fullness);
              const mouth = lerp(0.017, 0.029, r());
              splits.push({
                entry: { x: x - mouth, y: edgeY * lerp(0.96, 1.02, r()) },
                exit: { x: x + mouth, y: edgeY * lerp(0.96, 1.02, r()) },
                root: {
                  x: x - lerp(0.015, 0.07, r()),
                  y: edgeY * lerp(0.16, 0.3, r()),
                },
              });
            }

            const boundaries = [0.13, ...splits.map((split) => split.entry.x), 0.91];
            const veins = [];
            for (let i = 0; i < boundaries.length - 1; i += 1) {
              const x = lerp(boundaries[i], boundaries[i + 1], 0.5);
              veins.push({
                x,
                y: sign * monsteraEnvelope(x, fullness) * lerp(0.82, 0.94, r()),
              });
            }
            return {
              sign,
              fullness,
              shoulderX: lerp(0.12, 0.17, r()),
              shoulderY: sign * lerp(0.94, 1.04, r()) * fullness,
              rearX: lerp(-0.22, -0.16, r()),
              rearY: sign * lerp(0.56, 0.7, r()) * fullness,
              splits,
              veins,
            };
          }

          function holes(side) {
            const count = side.sign < 0 ? 4 : 3;
            const out = [];
            for (let i = 0; i < count; i += 1) {
              const t = count === 1 ? 0.5 : i / (count - 1);
              const vein = side.veins[Math.min(side.veins.length - 1, i + 1)];
              const outerRow = (i + (side.sign < 0 ? 1 : 0)) % 2 === 0;
              out.push({
                x: vein ? vein.x + lerp(-0.018, 0.018, r()) : lerp(0.34, 0.69, t),
                y: side.sign * (outerRow ? lerp(0.32, 0.43, r()) : lerp(0.2, 0.29, r())),
                rx: lerp(0.045, 0.072, r()),
                ry: lerp(0.068, 0.112, r()),
                turn: side.sign * lerp(0.18, 0.36, r()),
                skew: lerp(-0.26, 0.26, r()),
              });
            }
            return out;
          }

          const upper = side(-1);
          const lower = side(1);
          return {
            upper,
            lower,
            holes: [...holes(upper), ...holes(lower)],
          };
        }

        function monsteraEnvelope(x, fullness) {
          const t = clamp((x - 0.08) / 0.96, 0, 1);
          return Math.pow(Math.max(0, 1 - Math.pow(t, 1.62)), 0.58) * fullness;
        }

        function traceMonsteraOutline(L, W, morph) {
          // One broad cordate envelope is interrupted by narrow margin cuts.
          // The leaf remains a single continuous shield instead of a stack of
          // separate paddles joined along the midrib.
          ctx.moveTo(0, 0);
          traceMonsteraSide(L, W, morph.upper, false);
          traceMonsteraSide(L, W, morph.lower, true);
          ctx.closePath();
        }

        function traceMonsteraSide(L, W, side, reverse) {
          const shoulder = { x: side.shoulderX, y: side.shoulderY };
          const rear = { x: side.rearX, y: side.rearY };
          const tip = { x: 1.04, y: 0 };

          if (!reverse) {
            ctx.bezierCurveTo(
              -L * 0.09,
              rear.y * W * 0.12,
              rear.x * L,
              rear.y * W * 0.72,
              rear.x * L,
              rear.y * W
            );
            ctx.bezierCurveTo(
              (rear.x + 0.015) * L,
              side.sign * W * side.fullness * 0.9,
              (shoulder.x - 0.065) * L,
              shoulder.y * W * 1.035,
              shoulder.x * L,
              shoulder.y * W
            );
            let current = shoulder;
            for (const split of side.splits) {
              traceMonsteraMargin(L, W, current, split.entry, side.sign);
              traceMonsteraSplit(L, W, split.entry, split.root, split.exit);
              current = split.exit;
            }
            traceMonsteraMargin(L, W, current, tip, side.sign);
            return;
          }

          let current = tip;
          for (let i = side.splits.length - 1; i >= 0; i -= 1) {
            const split = side.splits[i];
            traceMonsteraMargin(L, W, current, split.exit, side.sign);
            traceMonsteraSplit(L, W, split.exit, split.root, split.entry);
            current = split.entry;
          }
          traceMonsteraMargin(L, W, current, shoulder, side.sign);
          ctx.bezierCurveTo(
            (shoulder.x - 0.065) * L,
            shoulder.y * W * 1.035,
            (rear.x + 0.015) * L,
            side.sign * W * side.fullness * 0.9,
            rear.x * L,
            rear.y * W
          );
          ctx.bezierCurveTo(
            rear.x * L,
            rear.y * W * 0.72,
            -L * 0.09,
            rear.y * W * 0.12,
            0,
            0
          );
        }

        function traceMonsteraMargin(L, W, from, to, sign) {
          const outer = sign * Math.max(Math.abs(from.y), Math.abs(to.y)) * 1.055;
          ctx.quadraticCurveTo(
            L * lerp(from.x, to.x, 0.5),
            W * outer,
            L * to.x,
            W * to.y
          );
        }

        function traceMonsteraSplit(L, W, from, root, to) {
          ctx.bezierCurveTo(
            L * lerp(from.x, root.x, 0.34),
            W * lerp(from.y, root.y, 0.38),
            L * lerp(from.x, root.x, 0.82),
            W * lerp(from.y, root.y, 0.9),
            L * root.x,
            W * root.y
          );
          ctx.bezierCurveTo(
            L * lerp(root.x, to.x, 0.18),
            W * lerp(root.y, to.y, 0.1),
            L * lerp(root.x, to.x, 0.66),
            W * lerp(root.y, to.y, 0.62),
            L * to.x,
            W * to.y
          );
        }

        function addMonsteraFenestrations(L, W, morph) {
          for (const hole of morph.holes) traceMonsteraHole(L, W, hole);
        }

        function traceMonsteraHole(L, W, hole) {
          const cx = L * hole.x;
          const cy = W * hole.y;
          const rx = W * hole.rx;
          const ry = L * hole.ry;
          const c = Math.cos(hole.turn);
          const s = Math.sin(hole.turn);
          const point = (dx, dy) => ({
            x: cx + dx * c - dy * s,
            y: cy + dx * s + dy * c,
          });
          const top = point(hole.skew * rx * 0.2, -ry);
          const right = point(rx, hole.skew * ry * 0.24);
          const bottom = point(-hole.skew * rx * 0.28, ry * 0.88);
          const left = point(-rx * 0.82, -hole.skew * ry * 0.18);
          ctx.moveTo(top.x, top.y);
          ctx.bezierCurveTo(
            point(rx * 0.64, -ry * 0.72).x,
            point(rx * 0.64, -ry * 0.72).y,
            point(rx * 1.02, -ry * 0.12).x,
            point(rx * 1.02, -ry * 0.12).y,
            right.x,
            right.y
          );
          ctx.bezierCurveTo(
            point(rx * 0.84, ry * 0.62).x,
            point(rx * 0.84, ry * 0.62).y,
            point(rx * 0.24, ry).x,
            point(rx * 0.24, ry).y,
            bottom.x,
            bottom.y
          );
          ctx.bezierCurveTo(
            point(-rx * 0.66, ry * 0.72).x,
            point(-rx * 0.66, ry * 0.72).y,
            point(-rx, ry * 0.1).x,
            point(-rx, ry * 0.1).y,
            left.x,
            left.y
          );
          ctx.bezierCurveTo(
            point(-rx * 0.72, -ry * 0.6).x,
            point(-rx * 0.72, -ry * 0.6).y,
            point(-rx * 0.18, -ry).x,
            point(-rx * 0.18, -ry).y,
            top.x,
            top.y
          );
          ctx.closePath();
        }

        // A common fig leaf is palmate rather than merely broad. Five lobes
        // radiate from the petiole, with deep bays that keep the silhouette
        // distinct even when the pale foliage overlaps other plants.
        function drawFigLeaf(leaf) {
          const L = leaf.length;
          const W = leaf.length * leaf.width;
          const fill = leafFill(leaf);
          const cream = leaf.tone === 'cream';
          const upper = [
            { x: 0, y: 0 },
            { x: L * 0.34, y: -W * 0.46 },
            { x: L * 0.45, y: -W * 0.18 },
            { x: L * 0.72, y: -W * 0.54 },
            { x: L * 0.76, y: -W * 0.18 },
            { x: L, y: 0 },
          ];

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(L * 0.08, -W * 0.06, L * 0.18, -W * 0.38, upper[1].x, upper[1].y);
          ctx.bezierCurveTo(L * 0.37, -W * 0.34, L * 0.37, -W * 0.19, upper[2].x, upper[2].y);
          ctx.bezierCurveTo(L * 0.51, -W * 0.28, L * 0.62, -W * 0.54, upper[3].x, upper[3].y);
          ctx.bezierCurveTo(L * 0.72, -W * 0.36, L * 0.69, -W * 0.21, upper[4].x, upper[4].y);
          ctx.bezierCurveTo(L * 0.85, -W * 0.14, L * 0.96, -W * 0.08, upper[5].x, upper[5].y);
          ctx.bezierCurveTo(L * 0.96, W * 0.08, L * 0.85, W * 0.14, upper[4].x, -upper[4].y);
          ctx.bezierCurveTo(L * 0.69, W * 0.21, L * 0.72, W * 0.36, upper[3].x, -upper[3].y);
          ctx.bezierCurveTo(L * 0.62, W * 0.54, L * 0.51, W * 0.28, upper[2].x, -upper[2].y);
          ctx.bezierCurveTo(L * 0.37, W * 0.19, L * 0.37, W * 0.34, upper[1].x, -upper[1].y);
          ctx.bezierCurveTo(L * 0.18, W * 0.38, L * 0.08, W * 0.06, 0, 0);
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();

          if (!cream) {
            ctx.globalAlpha = 0.48;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }

          ctx.globalAlpha = 0.48;
          ctx.strokeStyle = cream ? P.leafCreamVein : P.leafPale;
          ctx.lineCap = 'round';
          ctx.lineWidth = 0.72;
          const veins = [
            { x: L, y: 0 },
            upper[1],
            upper[3],
            { x: upper[1].x, y: -upper[1].y },
            { x: upper[3].x, y: -upper[3].y },
          ];
          for (const vein of veins) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(vein.x * 0.42, vein.y * 0.58, vein.x * 0.9, vein.y * 0.9);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Palm and fern fronds share a curved rachis, but not a silhouette.
        // The palm is a single, oversized feather frond: many long blades
        // sweep from one central rib and end in emphatically sharp points.
        function drawCompoundFrond(leaf, kind) {
          const palm = kind === 'palm';
          const cream = leaf.tone === 'cream';
          const pairs = palm ? 13 : 10;
          const fill = leafFill(leaf);
          const rachis = [];
          for (let i = 0; i <= 18; i += 1) rachis.push(leafRib(leaf, i / 18));

          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = cream ? P.leafCreamVein : P.stemDeep;
          ctx.lineWidth = palm ? 2.05 : 1.1;
          ctx.beginPath();
          traceSmooth(rachis, true);
          ctx.stroke();

          for (let i = 1; i <= pairs; i += 1) {
            const t = lerp(palm ? 0.075 : 0.1, palm ? 0.94 : 0.91, i / (pairs + 1));
            const p = leafRib(leaf, t);
            const q = leafRib(leaf, Math.min(1, t + 0.016));
            const tangent = Math.atan2(q.y - p.y, q.x - p.x);
            const leafletGrowth = stagedGrowth(leaf.development || 1, i * 0.03);
            if (leafletGrowth <= 0) continue;

            const crown = Math.pow(Math.sin(Math.PI * t), palm ? 0.38 : 0.62);
            const leafletLength =
              leaf.length *
              crown *
              (palm ? lerp(0.54, 0.29, t) : lerp(0.3, 0.17, t)) *
              (0.16 + smoothstep(leafletGrowth) * 0.84);

            for (const side of [-1, 1]) {
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(
                tangent +
                side * (palm ? lerp(1.3, 0.56, t) : lerp(1.18, 0.82, t))
              );
              if (palm) {
                drawPalmPinna(leafletLength, leafletLength * 0.12, fill, cream);
              } else {
                drawFrondLeaflet(leafletLength, leafletLength * 0.22, fill, true, cream);
              }
              ctx.restore();
            }
          }

          const tip = leafRib(leaf, 0.94);
          const tipAhead = leafRib(leaf, 1);
          ctx.save();
          ctx.translate(tip.x, tip.y);
          ctx.rotate(Math.atan2(tipAhead.y - tip.y, tipAhead.x - tip.x));
          if (palm) {
            drawPalmPinna(leaf.length * 0.3, leaf.length * 0.012, fill, cream);
          } else {
            drawFrondLeaflet(leaf.length * 0.15, leaf.length * 0.032, fill, true, cream);
          }
          ctx.restore();
          ctx.restore();
        }

        function drawPalmPinna(length, halfWidth, fill, cream) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(
            length * 0.18,
            -halfWidth * 0.92,
            length * 0.7,
            -halfWidth * 0.55,
            length,
            -length * 0.025
          );
          // Both edges converge directly on the same acute point.
          ctx.bezierCurveTo(
            length * 0.68,
            halfWidth * 0.58,
            length * 0.18,
            halfWidth * 0.92,
            0,
            0
          );
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (!cream) {
            ctx.globalAlpha = 0.42;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }

          ctx.globalAlpha = cream ? 0.36 : 0.3;
          ctx.strokeStyle = cream ? P.leafCreamVein : P.leafPale;
          ctx.lineWidth = 0.42;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(length * 0.54, -length * 0.008, length, -length * 0.025);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        function drawFrondLeaflet(length, halfWidth, fill, toothed, cream) {
          const steps = toothed ? 12 : 8;
          const upper = [];
          const lower = [];
          for (let i = 0; i <= steps; i += 1) {
            const t = i / steps;
            const taper = Math.pow(Math.sin(Math.PI * t), toothed ? 0.7 : 0.48);
            const tooth = toothed && i > 0 && i < steps ? 1 + (i % 2 ? 0.2 : -0.08) : 1;
            const x = length * t;
            const curve = -length * 0.055 * t * t;
            const width = halfWidth * taper * tooth;
            upper.push({ x, y: curve - width });
            lower.push({ x, y: curve + width });
          }

          ctx.beginPath();
          if (toothed) {
            ctx.moveTo(0, 0);
            for (const p of upper) ctx.lineTo(p.x, p.y);
            for (let i = lower.length - 1; i >= 0; i -= 1) ctx.lineTo(lower[i].x, lower[i].y);
          } else {
            traceSmooth(upper, true);
            traceSmooth(lower.slice().reverse(), false);
          }
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (!cream) {
            ctx.globalAlpha = 0.44;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.55;
            ctx.stroke();
          }
          ctx.globalAlpha = 0.34;
          ctx.strokeStyle = cream ? P.leafCreamVein : P.leafPale;
          ctx.lineWidth = 0.45;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(length * 0.52, -length * 0.02, length, -length * 0.055);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // Cosmos and poppy carry feathered foliage: leaflets on a bent rachis.
        function drawPinnateLeaf(leaf) {
          const rachis = [];
          for (let i = 0; i <= 14; i += 1) rachis.push(leafRib(leaf, i / 14));
          ctx.save();
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = 0.9;
          ctx.lineCap = 'round';
          ctx.beginPath();
          traceSmooth(rachis, true);
          ctx.stroke();

          const pairs = 3;
          const fill = leafFill(leaf);
          for (let i = 1; i <= pairs + 1; i += 1) {
            const leafletGrowth = stagedGrowth(leaf.development || 1, (i - 1) * 0.12);
            if (leafletGrowth <= 0) continue;
            const t = Math.min(1, i / (pairs + 0.6));
            const p = leafRib(leaf, t);
            const q = leafRib(leaf, Math.min(1, t + 0.02));
            const base = Math.atan2(q.y - p.y, q.x - p.x);
            const len = leaf.length * 0.5 * (1 - t * 0.4) * (0.16 + leafletGrowth * 0.84);
            const halfWidth = len * (0.04 + smoothstep(leafletGrowth) * 0.3);
            const sides = i > pairs ? [0] : [1, -1];
            for (const s of sides) {
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(base + s * 0.78);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.bezierCurveTo(len * 0.34, -halfWidth, len * 0.8, -halfWidth, len, -len * 0.04);
              ctx.bezierCurveTo(len * 0.72, halfWidth * 0.68, len * 0.3, halfWidth * 0.54, 0, 0);
              ctx.closePath();
              ctx.fillStyle = fill;
              ctx.fill();
              ctx.globalAlpha = 0.45;
              ctx.strokeStyle = P.ink;
              ctx.lineWidth = 0.55;
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.restore();
            }
          }
          ctx.restore();
        }

        function drawBud(branch, kind, growth) {
          const emerge = developmentProgress(growth === undefined ? 1 : growth);
          if (emerge <= 0) return;
          const size = branch.budSize * (0.2 + smoothstep(emerge) * 0.8);
          const angle = branch.tip.angle + Math.PI / 2;
          const petalColor =
            kind === 'lily' || kind === 'cosmos' || kind === 'orange-daylily'
              ? P.ochre
              : kind === 'daisy'
                ? P.cream
                : kind === 'anemone'
                ? P.indigo
                : kind === 'honeysuckle'
                  ? P.weld
                  : kind === 'iris-japonica'
                    ? P.irisLavender
                    : kind === 'dwarf-quince'
                      ? '#c85336'
                    : P.madder;

          ctx.save();
          ctx.translate(branch.tip.x, branch.tip.y);
          ctx.rotate(angle);

          // Calyx sepals, curved outward.
          ctx.fillStyle = P.leafDark;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.5;
          for (let i = -1; i <= 1; i += 1) {
            ctx.save();
            ctx.rotate(i * 0.5 * smoothstep(emerge));
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(-size * 0.44, -size * 0.3, -size * 0.1, -size * 0.98);
            ctx.quadraticCurveTo(size * 0.4, -size * 0.26, 0, 2);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 0.45;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          }

          ctx.fillStyle = petalColor;
          ctx.beginPath();
          ctx.ellipse(0, -size * 0.58, size * 0.56, size * 0.84, 0, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();

          ctx.globalAlpha = 0.3;
          ctx.lineWidth = 0.45;
          for (let i = -1; i <= 1; i += 1) {
            ctx.beginPath();
            ctx.moveTo(i * size * 0.24, -size * 0.1);
            ctx.quadraticCurveTo(i * size * 0.3, -size * 0.7, i * size * 0.1, -size * 1.3);
            ctx.stroke();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Flowers — flat dye colour, contour line, engraved base hatching.
        // ---------------------------------------------------------------

        function drawFlower(kind, bloom, plantSeed, opening) {
          switch (kind) {
            case 'rose': drawRose(bloom, plantSeed, opening); break;
            case 'peony': drawPeony(bloom, plantSeed, opening); break;
            case 'cosmos': drawCosmos(bloom, opening); break;
            case 'poppy': drawPoppy(bloom, opening); break;
            case 'daisy': drawDaisy(bloom, opening); break;
            case 'lily': drawLily(bloom, opening); break;
            case 'orange-daylily': drawOrangeDaylily(bloom, opening); break;
            case 'hibiscus': drawHibiscus(bloom, opening); break;
            case 'chrysanthemum': drawChrysanthemum(bloom, plantSeed, opening); break;
            case 'hydrangea': drawHydrangea(bloom, plantSeed, opening); break;
            case 'anemone': drawAnemone(bloom, opening); break;
            case 'honeysuckle': drawHoneysuckle(bloom, plantSeed, opening); break;
            case 'iris-japonica': drawIrisJaponica(bloom, opening); break;
            case 'dwarf-quince': drawDwarfQuince(bloom, plantSeed, opening); break;
            default: break;
          }
        }

        function drawOpeningFlower(kind, bloom, plantSeed, progress) {
          const opening = flowerDevelopmentProgress(progress);

          // The bud and the open corolla overlap for several drawn frames.
          // Sepals hinge away while individual petals lengthen and rotate;
          // there is no single final-flower squash transform anymore.
          if (opening < 0.78) {
            const bud = 1 - smoothstep(opening / 0.78);
            const sepalOpen = smoothstep(clamp(opening / 0.64, 0, 1));
            ctx.save();
            ctx.globalAlpha = clamp(bud * 1.5, 0, 1);
            ctx.fillStyle = P.leafDark;
            for (const side of [-1, 1]) {
              ctx.save();
              ctx.rotate(side * lerp(0.24, 0.9, sepalOpen));
              ctx.beginPath();
              ctx.moveTo(0, bloom.r * 0.08);
              ctx.quadraticCurveTo(
                side * bloom.r * lerp(0.08, 0.22, sepalOpen),
                -bloom.r * 0.1,
                0,
                -bloom.r * lerp(0.34, 0.5, sepalOpen)
              );
              ctx.quadraticCurveTo(-side * bloom.r * 0.08, -bloom.r * 0.08, 0, bloom.r * 0.08);
              ctx.fill();
              ctx.restore();
            }
            ctx.fillStyle = flowerBudColor(kind);
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.65;
            ctx.beginPath();
            ctx.ellipse(
              0,
              -bloom.r * lerp(0.18, 0.08, sepalOpen),
              bloom.r * lerp(0.2, 0.34, sepalOpen),
              bloom.r * lerp(0.34, 0.18, sepalOpen),
              0,
              0,
              TAU
            );
            ctx.fill();
            ctx.globalAlpha = 0.48;
            ctx.stroke();
            ctx.restore();
          }

          if (opening >= 1 / (FLOWER_DEVELOPMENT_FRAMES - 1)) {
            drawFlower(kind, bloom, plantSeed, flowerStagedGrowth(opening, 0.08));
          }
        }

        function posePetal(finalAngle, radius, opening, delay) {
          const t = flowerStagedGrowth(opening, delay || 0);
          const angle = normalizeAngle(finalAngle);
          ctx.rotate(angle * smoothstep(t));
          ctx.translate(0, -radius * (0.12 + smoothstep(t) * 0.88));
          return t;
        }

        function petalLength(length, opening) {
          return length * (0.42 + smoothstep(opening) * 0.58);
        }

        function petalWidth(width, opening) {
          return width * (0.12 + Math.pow(smoothstep(opening), 1.35) * 0.88);
        }

        function drawFlowerCenter(opening, draw) {
          const reveal = smoothstep(clamp((opening - 0.52) / 0.48, 0, 1));
          if (reveal <= 0) return;
          ctx.save();
          ctx.globalAlpha *= reveal;
          draw();
          ctx.restore();
        }

        function flowerBudColor(kind) {
          if (
            kind === 'lily' ||
            kind === 'cosmos' ||
            kind === 'honeysuckle' ||
            kind === 'orange-daylily'
          ) return P.ochre;
          if (kind === 'daisy') return P.cream;
          if (kind === 'hibiscus') return P.madder;
          if (kind === 'chrysanthemum') return P.ochre;
          if (kind === 'anemone') return P.indigo;
          if (kind === 'hydrangea') return P.woad;
          if (kind === 'iris-japonica') return P.irisLavender;
          if (kind === 'dwarf-quince') return '#c85336';
          return P.madder;
        }

        function petalPath(len, wid, shoulder, notch) {
          ctx.beginPath();
          ctx.moveTo(0, len * 0.46);
          ctx.bezierCurveTo(
            -wid,
            len * shoulder * 0.34,
            -wid * 0.86,
            -len * 0.34,
            notch ? -wid * 0.2 : 0,
            -len * 0.5
          );
          if (notch) ctx.quadraticCurveTo(0, -len * 0.36, wid * 0.2, -len * 0.5);
          ctx.bezierCurveTo(wid * 0.86, -len * 0.34, wid, len * shoulder * 0.34, 0, len * 0.46);
          ctx.closePath();
        }

        function inkPetal(len, wid, shoulder, fill, opts) {
          const o = opts || {};
          petalPath(len, wid, shoulder, o.notch);
          ctx.fillStyle = fill;
          ctx.fill();

          if (len > 8) {
            ctx.save();
            ctx.clip();
            ctx.globalAlpha = o.hatchAlpha || 0.16;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.42;
            for (let i = 1; i <= 4; i += 1) {
              const t = i / 5;
              const y = len * 0.44 - len * 0.6 * t;
              const w = wid * (1 - t * 0.45);
              ctx.beginPath();
              ctx.moveTo(-w, y);
              ctx.quadraticCurveTo(0, y - len * 0.08, w, y);
              ctx.stroke();
            }
            ctx.restore();
          }

          ctx.save();
          ctx.globalAlpha = o.inkAlpha || 0.45;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = o.inkWidth || 0.55;
          petalPath(len, wid, shoulder, o.notch);
          ctx.stroke();

          if (o.veins) {
            ctx.globalAlpha = 0.2;
            ctx.lineWidth = 0.4;
            for (let i = -1; i <= 1; i += 1) {
              ctx.beginPath();
              ctx.moveTo(0, len * 0.4);
              ctx.quadraticCurveTo(i * wid * 0.52, -len * 0.06, i * wid * 0.4, -len * 0.4);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        // The gallica rose of a plate is semi-double: two loose rows of broad
        // petals opening onto a boss of stamens, not a rolled florist's bud.
        function drawRose(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed + Math.floor(bloom.phase * 10000)) >>> 0);
          const deep = bloom.variant > 0.6;
          const outer = deep ? P.wine : P.madder;
          const inner = deep ? P.madderDeep : P.rose;
          const pale = deep ? P.rose : P.rosePale;

          ctx.save();
          for (let row = 0; row < 2; row += 1) {
            const count = row === 0 ? 6 : 5;
            const radius = r * (row === 0 ? 1 : 0.74);
            for (let i = 0; i < count; i += 1) {
              ctx.save();
              const pose = posePetal(
                (i / count) * TAU + row * 0.58 + lerp(-0.14, 0.14, rng()),
                radius * 0.4,
                opening,
                row * 0.12 + i * 0.012
              );
              inkPetal(
                petalLength(radius * lerp(0.8, 1.0, rng()), pose),
                petalWidth(radius * lerp(0.5, 0.64, rng()), pose),
                0.82,
                row === 0 ? outer : inner,
                { notch: true, veins: true }
              );
              ctx.restore();
            }
          }
          for (let i = 0; i < 4; i += 1) {
            ctx.save();
            const pose = posePetal((i / 4) * TAU + 0.42, r * 0.22, opening, 0.28 + i * 0.018);
            inkPetal(
              petalLength(r * 0.46, pose),
              petalWidth(r * 0.3, pose),
              0.86,
              pale,
              { notch: true, inkAlpha: 0.36 }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => stamenBoss(rng, r * 0.19, 22, P.olive));
          ctx.restore();
        }

        function drawPeony(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.phase * 30000)) >>> 0);
          const pale = bloom.variant > 0.5;
          const guard = pale ? P.rose : P.wine;
          const inner = pale ? P.rosePale : P.madder;
          const innerPale = pale ? P.cream : P.rose;

          ctx.save();
          // Three coherent whorls create a recognizable bowl-shaped peony;
          // the previous loose scatter read as a container of detached petals.
          const rows = [
            { count: 7, radius: 0.44, length: 0.96, width: 0.56, delay: 0, fill: guard },
            { count: 8, radius: 0.3, length: 0.7, width: 0.4, delay: 0.14, fill: inner },
            { count: 6, radius: 0.16, length: 0.48, width: 0.26, delay: 0.3, fill: innerPale },
          ];
          for (let row = 0; row < rows.length; row += 1) {
            const conf = rows[row];
            for (let i = 0; i < conf.count; i += 1) {
              ctx.save();
              const pose = posePetal(
                (i / conf.count) * TAU + row * 0.44 + lerp(-0.12, 0.12, rng()),
                r * conf.radius,
                opening,
                conf.delay + i * 0.009
              );
              inkPetal(
                petalLength(r * conf.length * lerp(0.9, 1.06, rng()), pose),
                petalWidth(r * conf.width * lerp(0.9, 1.08, rng()), pose),
                0.88,
                conf.fill,
                { notch: true, veins: row === 0, inkAlpha: 0.46, hatchAlpha: 0.12 }
              );
              ctx.restore();
            }
          }
          drawFlowerCenter(opening, () => stamenBoss(rng, r * 0.12, 16, P.olive));
          ctx.restore();
        }

        // A ring of filaments with gold anthers — the detail an engraver
        // would never leave out.
        function stamenBoss(rng, radius, count, discColor) {
          ctx.save();
          ctx.fillStyle = discColor;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();

          ctx.globalAlpha = 0.72;
          ctx.strokeStyle = P.umber;
          ctx.lineWidth = 0.5;
          const tips = [];
          for (let i = 0; i < count; i += 1) {
            const a = (i / count) * TAU + lerp(-0.06, 0.06, rng());
            const reach = radius * lerp(1.7, 2.6, rng());
            const bow = lerp(-0.28, 0.28, rng());
            const tx = Math.cos(a) * reach;
            const ty = Math.sin(a) * reach;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * radius * 0.4, Math.sin(a) * radius * 0.4);
            ctx.quadraticCurveTo(
              Math.cos(a + bow) * reach * 0.66,
              Math.sin(a + bow) * reach * 0.66,
              tx,
              ty
            );
            ctx.stroke();
            tips.push({ x: tx, y: ty, a });
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = P.gold;
          for (const tip of tips) {
            ctx.beginPath();
            ctx.ellipse(tip.x, tip.y, radius * 0.17, radius * 0.1, tip.a, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function drawCosmos(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.ochre, P.weld] : [P.madder, P.rose];
          for (let i = 0; i < 8; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 8 + 0.1, r * 0.42, opening, i * 0.014);
            inkPetal(
              petalLength(r * 0.84, pose),
              petalWidth(r * 0.34, pose),
              0.34,
              palette[i % 2],
              { notch: true, veins: true }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => discCenter(r * 0.26, P.umber, P.gold, 16));
        }

        function drawPoppy(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.madder, '#c04a32'] : [P.madderDeep, P.wine];
          ctx.save();
          for (let i = 0; i < 5; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 5 + 0.14, r * 0.3, opening, i * 0.025);
            inkPetal(
              petalLength(r, pose),
              petalWidth(r * 0.6, pose),
              0.72,
              palette[i % 2],
              { veins: true, hatchAlpha: 0.2 }
            );
            // The dark basal blotch of a field poppy.
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = P.ink;
            ctx.beginPath();
            ctx.ellipse(0, r * 0.34, r * 0.2, r * 0.14, 0, 0, TAU);
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();

          // Stamen ring, then the capsule.
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.ink;
            ctx.globalAlpha = 0.7;
            ctx.lineWidth = 0.6;
            for (let i = 0; i < 22; i += 1) {
              const a = (i / 22) * TAU;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * r * 0.16, Math.sin(a) * r * 0.16);
              ctx.lineTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
              ctx.stroke();
            }
            ctx.restore();
            discCenter(r * 0.2, '#3b4029', P.leafPale, 8);
          });
        }

        function drawDaisy(bloom, opening) {
          const r = bloom.r;
          const count = 15;
          for (let i = 0; i < count; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / count, r * 0.46, opening, i * 0.008);
            inkPetal(petalLength(r * 0.9, pose), petalWidth(r * 0.2, pose), 0.3, i % 3 ? P.white : P.cream, {
              notch: true,
              inkAlpha: 0.4,
              hatchAlpha: 0.1,
            });
            ctx.restore();
          }
          drawFlowerCenter(opening, () => discCenter(r * 0.3, '#b98a24', P.gold, 20));
        }

        function drawAnemone(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5 ? [P.indigo, P.woad] : [P.indigoDeep, P.indigo];
          for (let i = 0; i < 9; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 9, r * 0.36, opening, i * 0.012);
            inkPetal(
              petalLength(r * 0.8, pose),
              petalWidth(r * 0.36, pose),
              0.48,
              palette[i % 2],
              { veins: true }
            );
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.ink;
            ctx.globalAlpha = 0.65;
            ctx.lineWidth = 0.55;
            for (let i = 0; i < 18; i += 1) {
              const a = (i / 18) * TAU;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * r * 0.18, Math.sin(a) * r * 0.18);
              ctx.lineTo(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38);
              ctx.stroke();
            }
            ctx.restore();
            discCenter(r * 0.22, P.indigoDeep, '#7f9bab', 10);
          });
        }

        function drawLily(bloom, opening) {
          const r = bloom.r;
          const warm = bloom.variant > 0.45;
          for (let i = 0; i < 6; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 6 + 0.12, r * 0.2, opening, i * 0.024);
            const fill = warm ? (i % 2 ? P.ochre : '#c9702c') : (i % 2 ? P.madder : P.rose);
            inkPetal(
              petalLength(r * 1.1, pose),
              petalWidth(r * 0.3, pose),
              0.2,
              fill,
              { veins: true, inkAlpha: 0.5 }
            );
            // Tiger spots.
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = P.madderDeep;
            for (let d = 0; d < 5; d += 1) {
              ctx.beginPath();
              ctx.ellipse(
                (d % 2 ? -1 : 1) * r * 0.085,
                r * (0.2 - d * 0.13),
                1,
                1.5,
                0,
                0,
                TAU
              );
              ctx.fill();
            }
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.strokeStyle = P.umber;
            ctx.fillStyle = P.umber;
            ctx.lineWidth = 0.85;
            ctx.lineCap = 'round';
            for (let i = 0; i < 6; i += 1) {
              const angle = -0.85 + i * 0.34;
              const tipX = Math.sin(angle) * r * 0.6;
              const tipY = -r * 0.62 - Math.cos(angle) * r * 0.05;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(Math.sin(angle) * r * 0.42, -r * 0.24, tipX, tipY);
              ctx.stroke();
              ctx.beginPath();
              ctx.ellipse(tipX, tipY, 1.5, 3.4, angle, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          });
        }

        // Hemerocallis fulva has six broad, unspotted orange-red tepals with a
        // lighter midrib and throat. Its open funnel is flatter and fuller
        // than the narrow, reflexed, spotted tiger lily above.
        function drawOrangeDaylily(bloom, opening) {
          const r = bloom.r;

          // Three slightly narrower outer tepals establish the funnel.
          for (let i = 0; i < 3; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 3 + 0.08, r * 0.25, opening, i * 0.028);
            drawDaylilyTepal(
              petalLength(r * 1.08, pose),
              petalWidth(r * 0.3, pose),
              i % 2 ? '#c9692f' : '#bc5830'
            );
            ctx.restore();
          }

          // The inner three are broader and offset between the outer tepals.
          for (let i = 0; i < 3; i += 1) {
            ctx.save();
            const pose = posePetal(
              (i * TAU) / 3 + Math.PI / 3 + 0.08,
              r * 0.22,
              opening,
              0.11 + i * 0.028
            );
            drawDaylilyTepal(
              petalLength(r, pose),
              petalWidth(r * 0.4, pose),
              i % 2 ? '#df8431' : '#d9762c'
            );
            ctx.restore();
          }

          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.fillStyle = P.gold;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.2, 0, TAU);
            ctx.fill();

            ctx.strokeStyle = '#d7a43e';
            ctx.fillStyle = P.umber;
            ctx.lineWidth = 0.8;
            ctx.lineCap = 'round';
            for (let i = 0; i < 6; i += 1) {
              const angle = -0.92 + i * 0.34;
              const side = Math.sin(angle);
              const tipX = side * r * 0.58;
              const tipY = -r * 0.58 - Math.cos(angle) * r * 0.09;
              ctx.beginPath();
              ctx.moveTo(0, r * 0.03);
              ctx.quadraticCurveTo(side * r * 0.34, -r * 0.2, tipX, tipY);
              ctx.stroke();
              ctx.beginPath();
              ctx.ellipse(tipX, tipY, r * 0.075, r * 0.026, angle, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          });
        }

        function drawDaylilyTepal(length, width, fill) {
          inkPetal(length, width, 0.32, fill, {
            veins: true,
            inkAlpha: 0.46,
            hatchAlpha: 0.1,
          });

          // The species' pale orange stripe runs from the throat toward the
          // tip and is intentionally clean—there are no tiger-lily spots.
          ctx.save();
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = P.gold;
          ctx.lineWidth = Math.max(1, width * 0.1);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, length * 0.38);
          ctx.quadraticCurveTo(0, -length * 0.02, 0, -length * 0.38);
          ctx.stroke();
          ctx.restore();
        }

        // Hibiscus is kept graphically simple and unmistakable: five broad
        // petals surround a dark throat, then the long fused staminal column
        // projects beyond the corolla with yellow anthers and red stigmas.
        function drawHibiscus(bloom, opening) {
          const r = bloom.r;
          const palette = bloom.variant > 0.5
            ? [P.madder, '#c85344', P.rose]
            : [P.wine, P.madderDeep, P.madder];

          ctx.save();
          for (let i = 0; i < 5; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 5 + 0.08, r * 0.36, opening, i * 0.026);
            inkPetal(
              petalLength(r * 1.04, pose),
              petalWidth(r * 0.58, pose),
              0.72,
              palette[i % palette.length],
              { veins: true, inkAlpha: 0.42, hatchAlpha: 0.12 }
            );
            ctx.restore();
          }

          drawFlowerCenter(opening, () => {
            ctx.fillStyle = P.wine;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.23, 0, TAU);
            ctx.fill();

            const columnLength = r * 0.96;
            ctx.strokeStyle = P.rosePale;
            ctx.lineWidth = Math.max(1.2, r * 0.075);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, r * 0.03);
            ctx.quadraticCurveTo(r * 0.05, -r * 0.42, 0, -columnLength);
            ctx.stroke();

            ctx.fillStyle = P.gold;
            for (let i = 0; i < 12; i += 1) {
              const t = 0.38 + i / 18;
              const side = i % 2 ? 1 : -1;
              ctx.beginPath();
              ctx.ellipse(
                side * r * (0.08 + (i % 3) * 0.012),
                -columnLength * t,
                r * 0.045,
                r * 0.025,
                side * 0.45,
                0,
                TAU
              );
              ctx.fill();
            }

            ctx.strokeStyle = P.madderDeep;
            ctx.fillStyle = P.madder;
            ctx.lineWidth = 0.65;
            for (let i = 0; i < 5; i += 1) {
              const angle = -Math.PI / 2 + lerp(-0.62, 0.62, i / 4);
              const x = Math.cos(angle) * r * 0.2;
              const y = -columnLength + Math.sin(angle) * r * 0.16;
              ctx.beginPath();
              ctx.moveTo(0, -columnLength * 0.93);
              ctx.lineTo(x, y);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(x, y, r * 0.045, 0, TAU);
              ctx.fill();
            }
          });
          ctx.restore();
        }

        // A garden chrysanthemum is a dense mass of ray florets. Four tight
        // rings and a nearly hidden disc make it read as a mum, not a daisy.
        function drawChrysanthemum(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed + Math.floor(bloom.phase * 53000)) >>> 0);
          const palette = bloom.variant > 0.5
            ? ['#b55f2f', P.ochre, P.weld, P.gold]
            : [P.madder, '#c76b42', P.ochre, P.weld];
          const rows = [
            { count: 16, radius: 0.42, length: 0.82, width: 0.14, delay: 0 },
            { count: 14, radius: 0.31, length: 0.65, width: 0.13, delay: 0.1 },
            { count: 12, radius: 0.21, length: 0.5, width: 0.12, delay: 0.2 },
            { count: 10, radius: 0.12, length: 0.35, width: 0.1, delay: 0.3 },
          ];

          ctx.save();
          for (let row = 0; row < rows.length; row += 1) {
            const conf = rows[row];
            for (let i = 0; i < conf.count; i += 1) {
              ctx.save();
              const pose = posePetal(
                (i / conf.count) * TAU + row * 0.31 + lerp(-0.08, 0.08, rng()),
                r * conf.radius,
                opening,
                conf.delay + i * 0.004
              );
              inkPetal(
                petalLength(r * conf.length * lerp(0.88, 1.08, rng()), pose),
                petalWidth(r * conf.width * lerp(0.88, 1.1, rng()), pose),
                0.22,
                palette[(row + i) % palette.length],
                { inkAlpha: 0.36, hatchAlpha: 0.06 }
              );
              ctx.restore();
            }
          }
          drawFlowerCenter(opening, () => discCenter(r * 0.1, P.umber, P.gold, 9));
          ctx.restore();
        }

        // Iris japonica is the fringed iris: three broad falls carry violet
        // blotches and a yellow-orange crest, alternating with three lighter,
        // narrower inner segments. It is deliberately unlike the tall,
        // upright silhouette of a bearded iris.
        function drawIrisJaponica(bloom, opening) {
          const r = bloom.r;
          const fallPalette = [P.irisLight, '#e2ddea', P.irisLavender];

          for (let i = 0; i < 3; i += 1) {
            ctx.save();
            const pose = posePetal((i * TAU) / 3 + 0.08, r * 0.34, opening, i * 0.035);
            drawFringedIrisPetal(
              petalLength(r * 1.18, pose),
              petalWidth(r * 0.35, pose),
              fallPalette[(i + (bloom.variant > 0.5 ? 1 : 0)) % fallPalette.length],
              true
            );
            ctx.restore();
          }

          for (let i = 0; i < 3; i += 1) {
            ctx.save();
            const pose = posePetal(
              (i * TAU) / 3 + Math.PI / 3 + 0.08,
              r * 0.1,
              opening,
              0.16 + i * 0.035
            );
            drawFringedIrisPetal(
              petalLength(r * 0.56, pose),
              petalWidth(r * 0.2, pose),
              i % 2 ? P.irisLight : '#ddd5e5',
              false
            );
            ctx.restore();
          }

          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.fillStyle = P.irisViolet;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.115, 0, TAU);
            ctx.fill();
            ctx.fillStyle = P.gold;
            for (let i = 0; i < 6; i += 1) {
              const angle = (i * TAU) / 6;
              ctx.beginPath();
              ctx.arc(Math.cos(angle) * r * 0.075, Math.sin(angle) * r * 0.075, r * 0.018, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          });
        }

        function fringedIrisPetalPath(length, width, fringed) {
          const steps = 14;
          ctx.beginPath();
          ctx.moveTo(0, length * 0.42);
          for (let i = 1; i < steps; i += 1) {
            const t = i / steps;
            const profile = Math.pow(Math.sin(Math.PI * t), 0.64);
            const ripple = fringed ? 1 + (i % 2 ? 0.13 : -0.035) : 1 + Math.sin(i * 2.4) * 0.035;
            ctx.lineTo(-width * profile * ripple, lerp(length * 0.36, -length * 0.5, t));
          }
          ctx.lineTo(-width * 0.14, -length * 0.51);
          ctx.quadraticCurveTo(0, -length * 0.43, width * 0.14, -length * 0.51);
          for (let i = steps - 1; i >= 1; i -= 1) {
            const t = i / steps;
            const profile = Math.pow(Math.sin(Math.PI * t), 0.64);
            const ripple = fringed ? 1 + (i % 2 ? 0.13 : -0.035) : 1 + Math.sin(i * 2.4) * 0.035;
            ctx.lineTo(width * profile * ripple, lerp(length * 0.36, -length * 0.5, t));
          }
          ctx.closePath();
        }

        function drawFringedIrisPetal(length, width, fill, crest) {
          fringedIrisPetalPath(length, width, crest);
          ctx.fillStyle = fill;
          ctx.fill();

          ctx.save();
          fringedIrisPetalPath(length, width, crest);
          ctx.clip();

          ctx.globalAlpha = crest ? 0.5 : 0.28;
          ctx.strokeStyle = P.irisViolet;
          ctx.lineWidth = 0.55;
          for (let i = -2; i <= 2; i += 1) {
            ctx.beginPath();
            ctx.moveTo(i * width * 0.08, length * 0.34);
            ctx.quadraticCurveTo(
              i * width * 0.2,
              -length * 0.02,
              i * width * 0.34,
              -length * (crest ? 0.35 : 0.42)
            );
            ctx.stroke();
          }

          if (crest) {
            ctx.globalAlpha = 0.82;
            ctx.strokeStyle = P.ochre;
            ctx.lineWidth = Math.max(1.2, width * 0.12);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, length * 0.2);
            ctx.quadraticCurveTo(width * 0.025, -length * 0.02, 0, -length * 0.25);
            ctx.stroke();

            ctx.fillStyle = P.irisViolet;
            for (let i = 0; i < 7; i += 1) {
              const side = i % 2 ? -1 : 1;
              ctx.beginPath();
              ctx.ellipse(
                side * width * (0.12 + (i % 3) * 0.08),
                length * (0.15 - i * 0.052),
                Math.max(0.55, width * 0.035),
                Math.max(0.45, width * 0.025),
                0,
                0,
                TAU
              );
              ctx.fill();
            }
          }
          ctx.restore();

          ctx.save();
          ctx.globalAlpha = 0.38;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.5;
          fringedIrisPetalPath(length, width, crest);
          ctx.stroke();
          ctx.restore();
        }

        // The dwarf Japanese quince flowers directly on short, thorny wood.
        // Its corolla is a single cup of five rounded scarlet petals around a
        // conspicuously dense boss of pale filaments and gold anthers.
        function drawDwarfQuince(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.phase * 48163)) >>> 0);
          const warm = bloom.variant > 0.48;
          const palette = warm ? ['#d45b35', '#c74b31'] : [P.madder, '#bd4439'];

          for (let i = 0; i < 5; i += 1) {
            ctx.save();
            const pose = posePetal(
              (i * TAU) / 5 + 0.12 + lerp(-0.045, 0.045, rng()),
              r * 0.31,
              opening,
              i * 0.022
            );
            const length = petalLength(r * lerp(0.82, 0.9, rng()), pose);
            const width = petalWidth(r * lerp(0.46, 0.52, rng()), pose);
            inkPetal(length, width, 0.92, palette[i % palette.length], {
              veins: true,
              hatchAlpha: 0.11,
              inkAlpha: 0.42,
            });

            // A wine-dark wash at the petal base deepens the cupped centre.
            ctx.globalAlpha = 0.28 * smoothstep(pose);
            ctx.fillStyle = P.madderDeep;
            ctx.beginPath();
            ctx.ellipse(0, length * 0.34, width * 0.32, length * 0.1, 0, 0, TAU);
            ctx.fill();
            ctx.restore();
          }

          drawFlowerCenter(opening, () => {
            ctx.save();
            ctx.fillStyle = P.madderDeep;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.15, 0, TAU);
            ctx.fill();

            const stamens = 42;
            const tips = [];
            ctx.strokeStyle = P.cream;
            ctx.lineWidth = 0.52;
            ctx.globalAlpha = 0.88;
            for (let i = 0; i < stamens; i += 1) {
              const angle = i * GOLDEN * TAU + lerp(-0.035, 0.035, rng());
              const distance = Math.sqrt((i + 1) / stamens) * r * lerp(0.3, 0.43, rng());
              const x = Math.cos(angle) * distance;
              const y = Math.sin(angle) * distance;
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * r * 0.07, Math.sin(angle) * r * 0.07);
              ctx.quadraticCurveTo(x * 0.62, y * 0.62, x, y);
              ctx.stroke();
              tips.push({ x, y, angle });
            }

            ctx.globalAlpha = 1;
            ctx.fillStyle = P.gold;
            for (const tip of tips) {
              ctx.beginPath();
              ctx.ellipse(tip.x, tip.y, r * 0.027, r * 0.017, tip.angle, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          });
        }

        function drawHydrangea(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed + Math.floor(bloom.variant * 99999)) >>> 0);
          const palette =
            bloom.variant > 0.55
              ? ['#7693a5', P.woad, '#b7c8cc', '#d6dcce']
              : [P.rosePale, '#d99591', '#e6c3b1', '#c98586'];
          const floretCount = 28;
          const florets = [];

          // A mophead hydrangea is one domed mass made from dozens of tiny
          // four-sepal florets. The golden-angle packing keeps that mass
          // organic without leaving a single oversized daisy-like centre.
          for (let i = 0; i < floretCount; i += 1) {
            const angle = bloom.phase + i * GOLDEN * TAU + lerp(-0.09, 0.09, rng());
            const distance =
              i === 0 ? 0 : Math.sqrt(i / (floretCount - 1)) * r * lerp(0.62, 0.76, rng());
            const y = Math.sin(angle) * distance * 0.86;
            florets.push({
              x: Math.cos(angle) * distance,
              y,
              size: r * lerp(0.27, 0.34, rng()) * (1 + y / r * 0.08),
              rotation: rng() * TAU,
              fill: palette[Math.floor(rng() * palette.length)],
              delay: Math.min(0.32, i * 0.008),
            });
          }
          florets.sort((a, b) => a.y - b.y);

          // Fine pedicels show through only in the small gaps between florets.
          ctx.save();
          ctx.globalAlpha = 0.26 * smoothstep(opening);
          ctx.strokeStyle = P.stemDeep;
          ctx.lineWidth = 0.55;
          for (let i = 0; i < florets.length; i += 3) {
            const floret = florets[i];
            ctx.beginPath();
            ctx.moveTo(0, r * 0.16);
            ctx.quadraticCurveTo(floret.x * 0.42, floret.y * 0.5, floret.x, floret.y);
            ctx.stroke();
          }
          ctx.restore();

          for (const floret of florets) {
            const floretOpen = flowerStagedGrowth(opening, floret.delay);
            if (floretOpen <= 0) continue;
            drawHydrangeaFloret(floret, floretOpen);
          }
        }

        function drawHydrangeaFloret(floret, opening) {
          ctx.save();
          ctx.translate(floret.x, floret.y);
          ctx.rotate(floret.rotation);

          for (let petal = 0; petal < 4; petal += 1) {
            ctx.save();
            const pose = posePetal(
              (petal * Math.PI) / 2,
              floret.size * 0.2,
              opening,
              petal * 0.022
            );
            inkPetal(
              petalLength(floret.size * 0.76, pose),
              petalWidth(floret.size * 0.42, pose),
              0.72,
              floret.fill,
              { inkAlpha: 0.3, inkWidth: 0.38, hatchAlpha: 0.08 }
            );
            ctx.restore();
          }

          const centre = smoothstep(clamp((opening - 0.48) / 0.52, 0, 1));
          if (centre > 0) {
            ctx.globalAlpha = centre;
            ctx.fillStyle = P.weld;
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(0.7, floret.size * 0.075), 0, TAU);
            ctx.fill();
            ctx.globalAlpha = centre * 0.45;
            ctx.strokeStyle = P.umber;
            ctx.lineWidth = 0.35;
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawHoneysuckle(bloom, plantSeed, opening) {
          const r = bloom.r;
          const rng = mulberry32((plantSeed ^ Math.floor(bloom.variant * 54321)) >>> 0);
          const count = 5;
          const warm = bloom.variant > 0.5;
          const tube = warm ? '#f2e2ba' : '#f0dcc4';
          const lip = warm ? P.weld : P.rosePale;

          for (let i = 0; i < count; i += 1) {
            const a = (i / count) * TAU + lerp(-0.16, 0.16, rng());
            const floretOpen = flowerStagedGrowth(opening, i * 0.045);
            const len = r * lerp(0.74, 0.96, rng()) * (0.28 + floretOpen * 0.72);
            ctx.save();
            ctx.rotate(normalizeAngle(a) * smoothstep(floretOpen));

            // Each floret is a curved tube — never a straight one.
            const bend = lerp(0.26, 0.55, rng()) * (i % 2 ? 1 : -1);
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.04);
            ctx.quadraticCurveTo(-len * 0.42, -bend * len * 0.5 - r * 0.08, -len * 0.9, -bend * len);
            ctx.quadraticCurveTo(-len * 0.44, -bend * len * 0.5 + r * 0.2, r * 0.1, r * 0.16);
            ctx.closePath();
            ctx.fillStyle = tube;
            ctx.fill();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

            // The split lip at the mouth, curling back.
            ctx.save();
            ctx.translate(-len * 0.9, -bend * len);
            ctx.rotate(Math.atan2(-bend * len * 0.4, -len * 0.4));
            for (let k = -1; k <= 1; k += 1) {
              ctx.save();
              ctx.rotate(k * 0.68 * smoothstep(floretOpen));
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(
                -r * 0.26 * floretOpen,
                -r * 0.24 * floretOpen,
                -r * 0.48 * floretOpen,
                -r * 0.06
              );
              ctx.quadraticCurveTo(-r * 0.26 * floretOpen, r * 0.11 * floretOpen, 0, 0);
              ctx.closePath();
              ctx.fillStyle = lip;
              ctx.fill();
              ctx.globalAlpha = 0.48;
              ctx.strokeStyle = P.ink;
              ctx.lineWidth = 0.5;
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.restore();
            }
            // Stamens just clearing the mouth.
            ctx.globalAlpha = 0.6;
            ctx.strokeStyle = P.umber;
            ctx.lineWidth = 0.45;
            for (let k = -1; k <= 1; k += 2) {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(-r * 0.24, k * r * 0.1, -r * 0.36, k * r * 0.2);
              ctx.stroke();
            }
            ctx.restore();
            ctx.restore();
          }
          drawFlowerCenter(opening, () => {
            ctx.fillStyle = P.leafMid;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.13, 0, TAU);
            ctx.fill();
          });
        }

        function discCenter(radius, base, dot, count) {
          ctx.save();
          ctx.fillStyle = base;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 0.6;
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = dot;
          for (let i = 0; i < count; i += 1) {
            const angle = i * GOLDEN * TAU;
            const d = Math.sqrt(i / count) * radius * 0.78;
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * d, Math.sin(angle) * d, Math.max(0.6, radius * 0.09), 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        // ---------------------------------------------------------------
        // Utilities
        // ---------------------------------------------------------------

        function developmentProgress(value, frameCount) {
          const t = clamp(value, 0, 1);
          const frames = frameCount || LEAF_DEVELOPMENT_FRAMES;
          const frame = Math.min(frames - 1, Math.floor(t * frames));
          return frame / (frames - 1);
        }

        function stagedGrowth(value, delay, frameCount) {
          return developmentProgress(
            clamp((value - delay) / Math.max(0.001, 1 - delay), 0, 1),
            frameCount
          );
        }

        function flowerDevelopmentProgress(value) {
          return developmentProgress(value, FLOWER_DEVELOPMENT_FRAMES);
        }

        function flowerStagedGrowth(value, delay) {
          return stagedGrowth(value, delay, FLOWER_DEVELOPMENT_FRAMES);
        }

        function normalizeAngle(angle) {
          return Math.atan2(Math.sin(angle), Math.cos(angle));
        }

        function sortPlants() {
          plants.sort((a, b) => a.depth - b.depth || a.id - b.id);
        }

        function roman(n) {
          const map = [
            [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
            [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I'],
          ];
          let value = n;
          let out = '';
          for (const [v, s] of map) {
            while (value >= v) {
              out += s;
              value -= v;
            }
          }
          return out;
        }

        function announce(message) {
          status.textContent = '';
          requestAnimationFrame(() => {
            status.textContent = message;
          });
        }

        function mulberry32(a) {
          return function () {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randInt(r, min, max) {
          return Math.floor(r() * (max - min + 1)) + min;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function smoothstep(value) {
          const t = clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function inverseSmoothstep(value) {
          const t = clamp(value, 0, 1);
          return 0.5 - Math.sin(Math.asin(1 - 2 * t) / 3);
        }
      })();
    </script>
