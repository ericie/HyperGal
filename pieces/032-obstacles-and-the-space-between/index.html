<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Three geometric obstacles rake the sand into nested contours, and coloured waves radiate, reflect and blend across the field."
    />
    <title>Obstacles, and The Space Between · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --sand: #ffffe4;
        --panel: rgba(255, 255, 236, 0.95);
        --ink: #001522;
        --muted: #4c6474;
        --rule: #9db2bf;
        --focus: #004b87;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sand);
      }

      body {
        min-width: 320px;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--sand);
        cursor: crosshair;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -8px;
      }

      .garden-panel {
        position: fixed;
        z-index: 10;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        width: min(318px, calc(100vw - 28px));
        max-height: calc(100vh - 28px);
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 4px 4px 0 rgba(0, 21, 34, 0.14);
        color: var(--ink);
        font-size: 12px;
        line-height: 1.2;
        user-select: none;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        min-height: 48px;
        padding: 8px 8px 8px 11px;
        border-bottom: 1px solid var(--ink);
        cursor: grab;
        touch-action: none;
      }

      .garden-panel.is-dragging .panel-header { cursor: grabbing; }
      .panel-heading { min-width: 0; }

      h1 {
        margin: 0;
        overflow: hidden;
        font: 700 11px/1.08 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-heading p {
        margin: 4px 0 0;
        color: var(--muted);
        font: 9px/1.1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      button,
      input { font: inherit; }

      .panel-button {
        display: grid;
        width: 29px;
        height: 29px;
        padding: 0;
        place-items: center;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .panel-button[data-action="reseed"] {
        background: var(--ink);
        color: var(--panel);
      }

      .panel-button:hover { background: #fffdf1; }

      .panel-button[data-action="reseed"]:hover {
        background: var(--focus);
        color: #fff;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #006eb3;
        outline-offset: 2px;
      }

      .panel-body {
        max-height: calc(100vh - 82px);
        padding: 9px 11px 11px;
        overflow-y: auto;
      }

      .garden-panel.is-collapsed { width: 224px; }
      .garden-panel.is-collapsed .panel-header { border-bottom: 0; }
      .garden-panel.is-collapsed .panel-body,
      .garden-panel.is-collapsed .panel-heading p { display: none; }

      .panel-intro {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }

      .section-label {
        margin: 9px 0 2px;
        color: var(--muted);
        font: 700 8px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .section-label:not(:first-of-type) {
        padding-top: 8px;
        border-top: 1px solid var(--rule);
      }

      .range-row {
        --progress: 50%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 70px;
        align-items: center;
        column-gap: 8px;
        min-height: 47px;
      }

      .range-row + .range-row { border-top: 1px solid rgba(0, 21, 34, 0.2); }

      .principle {
        min-width: 0;
        font-weight: 700;
      }

      .principle small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font: 9px/1.15 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-weight: 400;
      }

      .control-value {
        color: var(--muted);
        font: 10px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      input[type="range"] {
        grid-column: 1 / 3;
        width: 100%;
        height: 11px;
        margin: -3px 0 0;
        padding: 0;
        appearance: none;
        background: transparent;
        cursor: ew-resize;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--ink) 0 var(--progress),
          var(--rule) var(--progress) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 11px;
        height: 11px;
        margin-top: -4.5px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        appearance: none;
        background: var(--panel);
      }

      input[type="range"]::-moz-range-track { height: 2px; background: var(--rule); }
      input[type="range"]::-moz-range-progress { height: 2px; background: var(--ink); }
      input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        background: var(--panel);
      }

      .panel-note {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }

      .plate {
        position: fixed;
        z-index: 5;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(11px, env(safe-area-inset-bottom));
        margin: 0;
        color: rgba(0, 21, 34, 0.72);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 8px;
        letter-spacing: 0.06em;
        pointer-events: none;
      }

      @media (max-width: 540px) {
        .garden-panel { width: min(288px, calc(100vw - 28px)); }
        .panel-body { padding-top: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas { cursor: default; }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="garden"
      tabindex="0"
      role="img"
      aria-label="Three geometric obstacles on pale paper. Nested rake furrows grow from their edges, and coloured waves radiate outward, reflect off the other obstacles and off the frame, and blend where they meet."
    ></canvas>

    <p class="plate" aria-hidden="true">KARESANSUI / 03 OBSTACLES</p>

    <aside class="garden-panel" aria-label="Dry garden composition controls">
      <header class="panel-header">
        <div class="panel-heading">
          <h1>OBSTACLES / SPACE BETWEEN</h1>
          <p>dry-garden study / plan 032</p>
        </div>
        <div class="panel-actions">
          <button class="panel-button" data-action="reseed" type="button" aria-label="New garden" title="New garden">&#8635;</button>
          <button class="panel-button" data-action="collapse" type="button" aria-label="Collapse controls" aria-expanded="true" title="Collapse controls">−</button>
        </div>
      </header>

      <div class="panel-body">
        <p class="panel-intro">Three obstacles. One continuous contour field.</p>

        <p class="section-label">Samon / raked space</p>
        <div class="range-row">
          <label class="principle" for="rake-spacing">Interval <small>distance between furrows</small></label>
          <output class="control-value" for="rake-spacing">11 px</output>
          <input id="rake-spacing" type="range" min="7" max="18" step="1" value="11" />
        </div>
        <p class="panel-note">Click the sand or press R to replace the obstacle trio. Drag this panel by its heading.</p>
      </div>
    </aside>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('garden');
        const panel = document.querySelector('.garden-panel');
        const panelHeader = panel.querySelector('.panel-header');
        const collapseButton = panel.querySelector('[data-action="collapse"]');
        const reseedButton = panel.querySelector('[data-action="reseed"]');
        const spacingInput = document.getElementById('rake-spacing');

        const TAU = Math.PI * 2;
        const COUNT = 3;
        const RINGS = 4;
        const reducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');

        const settings = {
          nature: 0.88,
          count: COUNT,
          rakeSpacing: 11,
        };

        // Palette shared with "Obstacles and How to Avoid Them" (plan 010).
        const PAPER = [255, 255, 228];
        const INK = [0, 21, 34];
        const WHEAT = [255, 215, 123];
        const PALE_YELLOW = [255, 255, 179];
        const PRUSSIAN = [0, 75, 135];
        const TYRIAN = [168, 0, 44];
        const BURLYWOOD = [222, 184, 135];

        // Balanced triads so every garden keeps one saturated lead colour.
        const COLOR_TRIADS = [
          [PRUSSIAN, TYRIAN, WHEAT],
          [TYRIAN, PRUSSIAN, BURLYWOOD],
          [INK, TYRIAN, WHEAT],
          [PRUSSIAN, WHEAT, INK],
          [TYRIAN, BURLYWOOD, PRUSSIAN],
          [PRUSSIAN, PALE_YELLOW, TYRIAN],
        ];
        // The obstacle vocabulary of plan 010: walls, squares, circles.
        const OBSTACLE_KINDS = ['bar', 'square', 'circle'];
        const OBSTACLE_ANGLES = [0, TAU / 4, TAU / 8, -TAU / 8, TAU / 12, -TAU / 12, TAU / 24, -TAU / 24];

        const WAVE = {
          speed: 0.28,       // px per millisecond
          emit: 1500,        // milliseconds between emissions
          decay: 820,        // px of travel before a ring is spent
          packet: 2.2,       // ring half-thickness, in rake intervals
          mirrorGain: 0.26,  // energy kept in a reflection off the frame
          scatterGain: 0.38, // energy re-radiated by a struck obstacle
          stillPhase: 0.46,  // frozen phase for reduced motion
        };

        const VERTEX_SOURCE = `
          attribute vec2 aPosition;
          void main() { gl_Position = vec4(aPosition, 0.0, 1.0); }
        `;

        const FRAGMENT_SOURCE = `
          precision highp float;

          #define COUNT ${COUNT}
          #define RINGS ${RINGS}

          uniform vec2 uResolution;
          uniform float uPixel;
          uniform float uSpacing;
          uniform vec2 uPos[COUNT];
          uniform vec2 uAxis[COUNT];
          uniform vec2 uSize[COUNT];
          uniform float uKind[COUNT];
          uniform vec3 uColor[COUNT];
          uniform float uGap[COUNT * COUNT];
          uniform float uFront[RINGS];
          uniform float uEnergy[RINGS];
          uniform float uPacket;
          uniform float uMirrorGain;
          uniform float uScatterGain;
          uniform vec3 uPaper;
          uniform vec3 uInk;
          uniform float uGrain;

          float sdBox(vec2 p, vec2 b) {
            vec2 d = abs(p) - b;
            return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
          }

          float planDistance(vec2 p, vec2 pos, vec2 axis, vec2 size, float kind) {
            vec2 q = p - pos;
            if (kind > 0.5) return length(q) - size.x;
            return sdBox(vec2(q.x * axis.x + q.y * axis.y, q.y * axis.x - q.x * axis.y), size);
          }

          // A point reflected in one of the four frame walls. The distance to
          // that mirrored point is the distance to the mirrored obstacle, so
          // every wall returns a true specular wave.
          vec2 mirrorPoint(int wall, vec2 p) {
            if (wall == 0) return vec2(-p.x, p.y);
            if (wall == 1) return vec2(2.0 * uResolution.x - p.x, p.y);
            if (wall == 2) return vec2(p.x, -p.y);
            return vec2(p.x, 2.0 * uResolution.y - p.y);
          }

          // Every source shares one train of expanding rings, so two waves that
          // arrive together are genuinely in step.
          float train(float travel) {
            float amplitude = 0.0;
            for (int k = 0; k < RINGS; k++) {
              // A flat crest with a short shoulder, so a wave lands as a run of
              // solidly filled bands rather than a soft smear.
              float delta = abs(travel - uFront[k]) / uPacket;
              if (delta > 1.0) continue;
              amplitude += uEnergy[k] * (1.0 - smoothstep(0.42, 1.0, delta));
            }
            return amplitude;
          }

          float quantise(float distance, float step) {
            return (floor(distance / step) + 0.5) * step;
          }

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }

          void main() {
            vec2 p = gl_FragCoord.xy * uPixel;
            p.y = uResolution.y - p.y;

            float plan[COUNT];
            float merged = 1.0e6;
            for (int i = 0; i < COUNT; i++) {
              plan[i] = planDistance(p, uPos[i], uAxis[i], uSize[i], uKind[i]);
              merged = min(merged, plan[i]);
            }

            float step = max(uSpacing, 0.001);
            float reach[COUNT];
            for (int i = 0; i < COUNT; i++) reach[i] = max(plan[i], 0.0);

            vec3 tint = vec3(0.0);
            for (int i = 0; i < COUNT; i++) {
              float amplitude = train(quantise(reach[i], step));
              for (int wall = 0; wall < 4; wall++) {
                vec2 mirrored = mirrorPoint(wall, p);
                float bounced = max(
                  planDistance(mirrored, uPos[i], uAxis[i], uSize[i], uKind[i]), 0.0);
                amplitude += uMirrorGain * train(quantise(bounced, step));
              }
              // A wave that reaches another obstacle is thrown back out from it,
              // still carrying the colour of the obstacle that sent it.
              for (int j = 0; j < COUNT; j++) {
                if (i == j) continue;
                amplitude += uScatterGain *
                  train(quantise(reach[j], step) + uGap[i * COUNT + j]);
              }
              // A small threshold keeps the faint tails off the paper, so the
              // sand between waves stays bare.
              amplitude = max(0.0, amplitude - 0.09) * 1.16;
              tint += amplitude * (uColor[i] - uPaper);
            }

            vec3 color = clamp(uPaper + tint, 0.0, 1.0);

            // The obstacles themselves stay flat geometric plans.
            float bodyMask = 0.0;
            vec3 body = vec3(0.0);
            for (int i = 0; i < COUNT; i++) {
              float mask = 1.0 - smoothstep(-uPixel, uPixel, plan[i]);
              body = mix(body, uColor[i], mask);
              bodyMask = max(bodyMask, mask);
            }
            color = mix(color, body, bodyMask);

            // Rake furrows: the lines the colour bands sit between.
            float toFurrow = abs(merged - floor(merged / step + 0.5) * step);
            float furrow = 1.0 - smoothstep(0.35, 0.35 + uPixel * 1.6, toFurrow);
            vec3 furrowColor = mix(uInk, uPaper, bodyMask);
            color = mix(color, furrowColor, furrow * mix(0.44, 0.2, bodyMask));

            // The plan edge itself.
            float edge = 1.0 - smoothstep(0.6, 0.6 + uPixel * 1.6, abs(merged));
            color = mix(color, uInk, edge * 0.82);

            float grain = (hash(floor(gl_FragCoord.xy)) - 0.5) * uGrain;
            color = clamp(color + grain, 0.0, 1.0);

            gl_FragColor = vec4(color, 1.0);
          }
        `;

        const gl = canvas.getContext('webgl', {
          alpha: false,
          antialias: false,
          depth: false,
          preserveDrawingBuffer: true,
        });

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let rocks = [];
        let gaps = new Float32Array(COUNT * COUNT);
        let program = null;
        let uniforms = {};
        let startedAt = performance.now();
        let animationFrame = 0;
        let prefersReducedMotion = reducedMotionQuery.matches;
        let panelDrag = null;
        let resizeTimer = 0;

        function seedFromLocation() {
          const value = new URLSearchParams(location.search).get('seed');
          const parsed = Number.parseInt(value || '', 36);
          return Number.isFinite(parsed)
            ? parsed >>> 0
            : ((Date.now() * 2654435761) ^ (Math.random() * 0xffffffff)) >>> 0;
        }

        function mulberry32(a) {
          return function next() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function rand(min, max) { return min + random() * (max - min); }
        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
        function mix(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
        function pick(items) { return items[Math.floor(random() * items.length)]; }

        function shuffle(items) {
          for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
          }
          return items;
        }

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
          }
          return shader;
        }

        function buildProgram() {
          const vertex = compileShader(gl.VERTEX_SHADER, VERTEX_SOURCE);
          const fragment = compileShader(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE);
          program = gl.createProgram();
          gl.attachShader(program, vertex);
          gl.attachShader(program, fragment);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
          }
          gl.useProgram(program);

          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 3, -1, -1, 3]),
            gl.STATIC_DRAW,
          );
          const position = gl.getAttribLocation(program, 'aPosition');
          gl.enableVertexAttribArray(position);
          gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

          const names = [
            'uResolution', 'uPixel', 'uSpacing', 'uPos', 'uAxis', 'uSize', 'uKind',
            'uColor', 'uGap', 'uFront', 'uEnergy', 'uPacket', 'uMirrorGain',
            'uScatterGain', 'uPaper', 'uInk', 'uGrain',
          ];
          uniforms = {};
          for (const name of names) uniforms[name] = gl.getUniformLocation(program, name);

          gl.uniform3fv(uniforms.uPaper, PAPER.map(value => value / 255));
          gl.uniform3fv(uniforms.uInk, INK.map(value => value / 255));
          gl.uniform1f(uniforms.uMirrorGain, WAVE.mirrorGain);
          gl.uniform1f(uniforms.uScatterGain, WAVE.scatterGain);
          gl.uniform1f(uniforms.uGrain, 0.022);
        }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          gl.viewport(0, 0, canvas.width, canvas.height);
          compose();
        }

        function compose() {
          random = mulberry32((seed ^ Math.round(width * 19) ^ Math.round(height * 37)) >>> 0);
          rocks = makeGarden();
          measureGaps();
          uploadGarden();
          startedAt = performance.now();
          render(startedAt);
        }

        function makeGarden() {
          const small = Math.min(width, height);
          const anchors = [
            { x: width * 0.68, y: height * 0.33, size: 1, ratio: 0.64, role: 'primary' },
            { x: width * 0.34, y: height * 0.7, size: 0.75, ratio: 0.76, role: 'companion' },
            { x: width * 0.72, y: height * 0.72, size: 0.9, ratio: 1.22, role: 'counterweight' },
          ];
          const kinds = shuffle(OBSTACLE_KINDS.slice());
          const colors = shuffle(pick(COLOR_TRIADS).slice());
          return anchors.map((anchor, index) =>
            makeRock(anchor, index, small, kinds[index], colors[index]));
        }

        function makeRock(anchor, index, small, kind, color) {
          const nature = settings.nature;
          const jitter = small * mix(0.002, 0.018, nature);
          const base = clamp(small * 0.108, 38, 96) * anchor.size;
          const rotation = kind === 'circle' ? 0 : pick(OBSTACLE_ANGLES);
          const rock = {
            id: index,
            role: anchor.role,
            kind,
            color,
            x: anchor.x + rand(-jitter, jitter),
            y: anchor.y + rand(-jitter, jitter),
            rotation,
            cos: Math.cos(rotation),
            sin: Math.sin(rotation),
            hx: 0,
            hy: 0,
          };

          if (kind === 'circle') {
            rock.hx = base * mix(1, rand(0.9, 1.08), nature);
            rock.hy = rock.hx;
          } else if (kind === 'square') {
            const side = base * 0.9;
            const skew = Math.sqrt(mix(1, rand(0.88, 1.16), nature));
            rock.hx = side * skew;
            rock.hy = side / skew;
          } else {
            rock.hx = base * mix(2.1, rand(1.8, 2.9), nature) * Math.sqrt(anchor.ratio);
            rock.hy = base * mix(0.34, rand(0.26, 0.46), nature);
          }

          rock.radius = Math.hypot(rock.hx, rock.hy);
          rock.samples = rockSamples(rock);
          return rock;
        }

        function rockCorners(rock) {
          const { hx, hy, cos, sin, x, y } = rock;
          return [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]].map(([lx, ly]) => ({
            x: x + lx * cos - ly * sin,
            y: y + lx * sin + ly * cos,
          }));
        }

        function rockSamples(rock) {
          const points = [];
          if (rock.kind === 'circle') {
            for (let i = 0; i < 96; i++) {
              const angle = i / 96 * TAU;
              points.push({
                x: rock.x + Math.cos(angle) * rock.hx,
                y: rock.y + Math.sin(angle) * rock.hx,
              });
            }
            return points;
          }
          const corners = rockCorners(rock);
          for (let i = 0; i < 4; i++) {
            const a = corners[i];
            const b = corners[(i + 1) % 4];
            const steps = Math.max(2, Math.round(Math.hypot(b.x - a.x, b.y - a.y) / 6));
            for (let s = 0; s < steps; s++) {
              const t = s / steps;
              points.push({ x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) });
            }
          }
          return points;
        }

        function rockDistance(rock, x, y) {
          const dx = x - rock.x;
          const dy = y - rock.y;
          if (rock.kind === 'circle') return Math.sqrt(dx * dx + dy * dy) - rock.hx;
          const lx = Math.abs(dx * rock.cos + dy * rock.sin) - rock.hx;
          const ly = Math.abs(dy * rock.cos - dx * rock.sin) - rock.hy;
          const ox = lx > 0 ? lx : 0;
          const oy = ly > 0 ? ly : 0;
          const inner = lx > ly ? lx : ly;
          return Math.sqrt(ox * ox + oy * oy) + (inner < 0 ? inner : 0);
        }

        // Surface-to-surface gap: how far a wave travels before it strikes the
        // next obstacle and is thrown back out from it.
        function measureGaps() {
          gaps = new Float32Array(COUNT * COUNT);
          for (let first = 0; first < rocks.length; first++) {
            for (let second = first + 1; second < rocks.length; second++) {
              let gap = Infinity;
              for (const point of rocks[first].samples) {
                gap = Math.min(gap, rockDistance(rocks[second], point.x, point.y));
              }
              for (const point of rocks[second].samples) {
                gap = Math.min(gap, rockDistance(rocks[first], point.x, point.y));
              }
              gap = Math.max(1, gap);
              gaps[first * COUNT + second] = gap;
              gaps[second * COUNT + first] = gap;
            }
          }
        }

        function uploadGarden() {
          const positions = new Float32Array(COUNT * 2);
          const axes = new Float32Array(COUNT * 2);
          const sizes = new Float32Array(COUNT * 2);
          const kinds = new Float32Array(COUNT);
          const colors = new Float32Array(COUNT * 3);
          rocks.forEach((rock, index) => {
            positions[index * 2] = rock.x;
            positions[index * 2 + 1] = rock.y;
            axes[index * 2] = rock.cos;
            axes[index * 2 + 1] = rock.sin;
            sizes[index * 2] = rock.hx;
            sizes[index * 2 + 1] = rock.hy;
            kinds[index] = rock.kind === 'circle' ? 1 : 0;
            colors[index * 3] = rock.color[0] / 255;
            colors[index * 3 + 1] = rock.color[1] / 255;
            colors[index * 3 + 2] = rock.color[2] / 255;
          });
          gl.uniform2fv(uniforms.uPos, positions);
          gl.uniform2fv(uniforms.uAxis, axes);
          gl.uniform2fv(uniforms.uSize, sizes);
          gl.uniform1fv(uniforms.uKind, kinds);
          gl.uniform3fv(uniforms.uColor, colors);
          gl.uniform1fv(uniforms.uGap, gaps);

          canvas.dataset.obstaclePlans = rocks.map(rock => rock.kind).join(',');
          canvas.dataset.obstaclePalette = 'plan-010';
          canvas.dataset.samonPattern = 'merged-signed-distance';
          canvas.dataset.samonInterval = settings.rakeSpacing.toFixed(2);
          canvas.dataset.samonCrossings = '0';
          canvas.dataset.wavePalette = 'obstacle-colour';
          canvas.dataset.waveFill = 'band-between-furrows';
          canvas.dataset.waveBlend = 'additive-subtractive';
          canvas.dataset.waveReflection = 'frame-mirrors,obstacle-rescatter';
        }

        const fronts = new Float32Array(RINGS);
        const energies = new Float32Array(RINGS);

        function render(time = performance.now()) {
          if (!program) return;
          const phase = prefersReducedMotion
            ? WAVE.stillPhase
            : ((time - startedAt) % WAVE.emit) / WAVE.emit;
          for (let k = 0; k < RINGS; k++) {
            const travel = (phase + k) * WAVE.emit * WAVE.speed;
            fronts[k] = travel;
            energies[k] = Math.exp(-travel / WAVE.decay);
          }

          gl.uniform2f(uniforms.uResolution, width, height);
          gl.uniform1f(uniforms.uPixel, 1 / dpr);
          gl.uniform1f(uniforms.uSpacing, settings.rakeSpacing);
          gl.uniform1f(uniforms.uPacket, settings.rakeSpacing * WAVE.packet);
          gl.uniform1fv(uniforms.uFront, fronts);
          gl.uniform1fv(uniforms.uEnergy, energies);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        function animate(time) {
          render(time);
          animationFrame = requestAnimationFrame(animate);
        }

        function syncAnimation() {
          cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          if (prefersReducedMotion || document.hidden) {
            render(startedAt);
            return;
          }
          animationFrame = requestAnimationFrame(animate);
        }

        function bindRange(input, onInput, format) {
          const row = input.closest('.range-row');
          const output = row.querySelector('output');
          function update() {
            const value = Number(input.value);
            const progress = (value - Number(input.min)) / (Number(input.max) - Number(input.min));
            row.style.setProperty('--progress', `${progress * 100}%`);
            output.textContent = format(value);
            onInput(value);
            canvas.dataset.samonInterval = settings.rakeSpacing.toFixed(2);
            render();
          }
          input.addEventListener('input', update);
          update();
        }

        reseedButton.addEventListener('click', () => {
          seed = ((seed + 0x9e3779b9) ^ (Date.now() & 0xffffffff)) >>> 0;
          compose();
        });

        collapseButton.addEventListener('click', () => {
          const collapsed = panel.classList.toggle('is-collapsed');
          collapseButton.textContent = collapsed ? '+' : '−';
          collapseButton.setAttribute('aria-expanded', String(!collapsed));
          collapseButton.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
        });

        panelHeader.addEventListener('pointerdown', event => {
          if (event.target.closest('button')) return;
          const rect = panel.getBoundingClientRect();
          panelDrag = {
            pointerId: event.pointerId,
            offsetX: event.clientX - rect.left,
            offsetY: event.clientY - rect.top,
          };
          panel.classList.add('is-dragging');
          panelHeader.setPointerCapture(event.pointerId);
        });

        panelHeader.addEventListener('pointermove', event => {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          const rect = panel.getBoundingClientRect();
          const left = clamp(event.clientX - panelDrag.offsetX, 8, width - rect.width - 8);
          const top = clamp(event.clientY - panelDrag.offsetY, 8, height - rect.height - 8);
          panel.style.left = `${left}px`;
          panel.style.top = `${top}px`;
        });

        function endPanelDrag(event) {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          panelDrag = null;
          panel.classList.remove('is-dragging');
          if (panelHeader.hasPointerCapture(event.pointerId)) panelHeader.releasePointerCapture(event.pointerId);
        }

        panelHeader.addEventListener('pointerup', endPanelDrag);
        panelHeader.addEventListener('pointercancel', endPanelDrag);

        canvas.addEventListener('pointerdown', () => reseedButton.click());

        window.addEventListener('keydown', event => {
          if (event.target.matches('input, button')) return;
          if (event.key.toLowerCase() === 'r' || event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            reseedButton.click();
          }
        });

        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resize, 120);
        });

        reducedMotionQuery.addEventListener('change', event => {
          prefersReducedMotion = event.matches;
          syncAnimation();
        });

        document.addEventListener('visibilitychange', syncAnimation);

        canvas.addEventListener('webglcontextlost', event => {
          event.preventDefault();
          cancelAnimationFrame(animationFrame);
          animationFrame = 0;
        });

        canvas.addEventListener('webglcontextrestored', () => {
          buildProgram();
          resize();
          syncAnimation();
        });

        buildProgram();
        bindRange(spacingInput, value => { settings.rakeSpacing = value; }, value => `${value} px`);
        resize();
        syncAnimation();
      })();
    </script>
  </body>
</html>
