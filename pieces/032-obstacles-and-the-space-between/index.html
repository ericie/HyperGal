<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A top-down dry garden composes odd-numbered groups of contour-drawn rocks and rakes the open space between them."
    />
    <title>Obstacles, and The Space Between · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --sand: #eee9d8;
        --panel: rgba(246, 243, 226, 0.95);
        --ink: #2b1720;
        --muted: #6e6261;
        --rule: #aaa28f;
        --focus: #006a83;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sand);
      }

      body {
        min-width: 320px;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--sand);
        cursor: crosshair;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -8px;
      }

      .garden-panel {
        position: fixed;
        z-index: 10;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        width: min(318px, calc(100vw - 28px));
        max-height: calc(100vh - 28px);
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 4px 4px 0 rgba(43, 23, 32, 0.14);
        color: var(--ink);
        font-size: 12px;
        line-height: 1.2;
        user-select: none;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        min-height: 48px;
        padding: 8px 8px 8px 11px;
        border-bottom: 1px solid var(--ink);
        cursor: grab;
        touch-action: none;
      }

      .garden-panel.is-dragging .panel-header { cursor: grabbing; }
      .panel-heading { min-width: 0; }

      h1 {
        margin: 0;
        overflow: hidden;
        font: 700 11px/1.08 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-heading p {
        margin: 4px 0 0;
        color: var(--muted);
        font: 9px/1.1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      button,
      input { font: inherit; }

      .panel-button {
        display: grid;
        width: 29px;
        height: 29px;
        padding: 0;
        place-items: center;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .panel-button[data-action="reseed"] {
        background: var(--ink);
        color: var(--panel);
      }

      .panel-button:hover { background: #fffdf1; }

      .panel-button[data-action="reseed"]:hover {
        background: var(--focus);
        color: #fff;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #006eb3;
        outline-offset: 2px;
      }

      .panel-body {
        max-height: calc(100vh - 82px);
        padding: 9px 11px 11px;
        overflow-y: auto;
      }

      .garden-panel.is-collapsed { width: 224px; }
      .garden-panel.is-collapsed .panel-header { border-bottom: 0; }
      .garden-panel.is-collapsed .panel-body,
      .garden-panel.is-collapsed .panel-heading p { display: none; }

      .panel-intro {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }

      .section-label {
        margin: 9px 0 2px;
        color: var(--muted);
        font: 700 8px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .section-label:not(:first-of-type) {
        padding-top: 8px;
        border-top: 1px solid var(--rule);
      }

      .range-row {
        --progress: 50%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 70px;
        align-items: center;
        column-gap: 8px;
        min-height: 47px;
      }

      .range-row + .range-row { border-top: 1px solid rgba(43, 23, 32, 0.2); }

      .principle {
        min-width: 0;
        font-weight: 700;
      }

      .principle small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font: 9px/1.15 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-weight: 400;
      }

      .control-value {
        color: var(--muted);
        font: 10px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      input[type="range"] {
        grid-column: 1 / 3;
        width: 100%;
        height: 11px;
        margin: -3px 0 0;
        padding: 0;
        appearance: none;
        background: transparent;
        cursor: ew-resize;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--ink) 0 var(--progress),
          var(--rule) var(--progress) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 11px;
        height: 11px;
        margin-top: -4.5px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        appearance: none;
        background: var(--panel);
      }

      input[type="range"]::-moz-range-track { height: 2px; background: var(--rule); }
      input[type="range"]::-moz-range-progress { height: 2px; background: var(--ink); }
      input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        background: var(--panel);
      }

      .panel-note {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }

      @media (max-width: 540px) {
        .garden-panel { width: min(288px, calc(100vw - 28px)); }
        .panel-body { padding-top: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas { cursor: default; }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="garden"
      tabindex="0"
      role="img"
      aria-label="A top-down dry garden where black pulses fade as they travel outward from three contour-drawn rocks, then intensify when their nested samon furrows join."
    ></canvas>

    <aside class="garden-panel" aria-label="Dry garden composition controls">
      <header class="panel-header">
        <div class="panel-heading">
          <h1>OBSTACLES / SPACE BETWEEN</h1>
          <p>dry-garden study / plan 032</p>
        </div>
        <div class="panel-actions">
          <button class="panel-button" data-action="reseed" type="button" aria-label="New garden" title="New garden">&#8635;</button>
          <button class="panel-button" data-action="collapse" type="button" aria-label="Collapse controls" aria-expanded="true" title="Collapse controls">−</button>
        </div>
      </header>

      <div class="panel-body">
        <p class="panel-intro">Distance fades. Contact amplifies.</p>

        <p class="section-label">Samon / raked space</p>
        <div class="range-row">
          <label class="principle" for="rake-spacing">Interval <small>distance between furrows</small></label>
          <output class="control-value" for="rake-spacing">11 px</output>
          <input id="rake-spacing" type="range" min="7" max="18" step="1" value="11" />
        </div>
        <p class="panel-note">Click the gravel or press R to replace the stone trio. Drag this panel by its heading.</p>
      </div>
    </aside>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('garden');
        const ctx = canvas.getContext('2d', { alpha: false });
        const baseCanvas = document.createElement('canvas');
        const baseCtx = baseCanvas.getContext('2d', { alpha: false });
        const panel = document.querySelector('.garden-panel');
        const panelHeader = panel.querySelector('.panel-header');
        const collapseButton = panel.querySelector('[data-action="collapse"]');
        const reseedButton = panel.querySelector('[data-action="reseed"]');
        const spacingInput = document.getElementById('rake-spacing');

        const TAU = Math.PI * 2;
        const ROCK_COLORS = [
          ['#d8cfba', '#342a2d'],
          ['#c8c1ad', '#342a2d'],
          ['#ded8c7', '#342a2d'],
          ['#cfc6b0', '#342a2d'],
          ['#d6cfbd', '#342a2d'],
        ];
        const PULSE_PERIOD = 7200;
        const reducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');

        const settings = {
          nature: 0.88,
          count: 3,
          rakeSpacing: 11,
        };

        let width = 1;
        let height = 1;
        let dpr = 1;
        let seed = seedFromLocation();
        let random = mulberry32(seed);
        let rocks = [];
        let rakePaths = [];
        let gravelPattern = null;
        let maximumRakeDistance = 1;
        let pulseContactDistances = [];
        let pulseStillDistance = 1;
        let pulseStartedAt = performance.now();
        let animationFrame = 0;
        let lastAnimationRender = 0;
        let prefersReducedMotion = reducedMotionQuery.matches;
        let panelDrag = null;
        let resizeTimer = 0;
        let composeTimer = 0;

        function seedFromLocation() {
          const value = new URLSearchParams(location.search).get('seed');
          const parsed = Number.parseInt(value || '', 36);
          return Number.isFinite(parsed)
            ? parsed >>> 0
            : ((Date.now() * 2654435761) ^ (Math.random() * 0xffffffff)) >>> 0;
        }

        function mulberry32(a) {
          return function next() {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function rand(min, max) { return min + random() * (max - min); }
        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
        function mix(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
        function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

        function resize() {
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          baseCanvas.width = canvas.width;
          baseCanvas.height = canvas.height;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          baseCtx.lineCap = 'round';
          baseCtx.lineJoin = 'round';
          compose();
        }

        function compose() {
          random = mulberry32((seed ^ Math.round(width * 19) ^ Math.round(height * 37)) >>> 0);
          gravelPattern = makeGravelPattern();
          rocks = makeGarden();
          rakePaths = makeRakePaths();
          renderBase();
          pulseStartedAt = performance.now();
          render(pulseStartedAt);
        }

        function makeGravelPattern() {
          const tile = document.createElement('canvas');
          tile.width = 128;
          tile.height = 128;
          const tileCtx = tile.getContext('2d');
          tileCtx.fillStyle = '#eee9d8';
          tileCtx.fillRect(0, 0, tile.width, tile.height);
          for (let i = 0; i < 620; i++) {
            const alpha = rand(0.018, 0.08);
            const value = random() > 0.54 ? '52,42,45' : '255,253,241';
            tileCtx.fillStyle = `rgba(${value},${alpha})`;
            const size = rand(0.35, 1.15);
            tileCtx.fillRect(rand(0, 128), rand(0, 128), size, size);
          }
          return ctx.createPattern(tile, 'repeat');
        }

        function makeGarden() {
          const small = Math.min(width, height);
          const anchors = [
            {
              group: 'A',
              x: width * 0.68,
              y: height * 0.33,
              size: 1,
              ratio: 0.64,
              rotation: -0.56,
              role: 'primary',
            },
            {
              group: 'A',
              x: width * 0.34,
              y: height * 0.7,
              size: 0.75,
              ratio: 0.76,
              rotation: 0.38,
              role: 'companion',
            },
            {
              group: 'A',
              x: width * 0.72,
              y: height * 0.72,
              size: 0.9,
              ratio: 1.22,
              rotation: -0.16,
              role: 'counterweight',
            },
          ];
          return anchors.map((anchor, index) => makeRock(anchor, index, small));
        }

        function makeRock(anchor, index, small) {
          const nature = settings.nature;
          const jitter = small * mix(0.002, 0.016, nature);
          const base = clamp(small * 0.095, 34, 82) * anchor.size;
          const ratio = anchor.ratio * mix(1, rand(0.84, 1.16), nature);
          const rx = clamp(base * Math.sqrt(ratio), 12, small * 0.19);
          const ry = clamp(base / Math.sqrt(ratio), 10, small * 0.18);
          const rock = {
            id: index,
            group: anchor.group,
            role: anchor.role,
            x: anchor.x + rand(-jitter, jitter),
            y: anchor.y + rand(-jitter, jitter),
            rx,
            ry,
            radius: Math.max(rx, ry),
            rotation: mix(0, anchor.rotation + rand(-0.18, 0.18), nature),
            points: [],
            flecks: [],
            colors: ROCK_COLORS[index % ROCK_COLORS.length],
          };

          const pointCount = 18;
          let wobble = rand(0, TAU);
          for (let p = 0; p < pointCount; p++) {
            const angle = p / pointCount * TAU;
            wobble += rand(-0.65, 0.65);
            const roughness = 1 + Math.sin(angle * 3 + wobble) * 0.055 + rand(-0.07, 0.07) * nature;
            rock.points.push({ angle, roughness });
          }
          for (let f = 0; f < 10; f++) {
            const angle = rand(0, TAU);
            const radius = Math.sqrt(random()) * 0.72;
            rock.flecks.push({
              x: Math.cos(angle) * radius,
              y: Math.sin(angle) * radius,
              r: rand(0.8, 2.1),
              alpha: rand(0.08, 0.22),
            });
          }
          return rock;
        }

        function rockOutlinePoints(rock) {
          const cos = Math.cos(rock.rotation);
          const sin = Math.sin(rock.rotation);
          return rock.points.map(point => {
            const localX = Math.cos(point.angle) * rock.rx * point.roughness;
            const localY = Math.sin(point.angle) * rock.ry * point.roughness;
            return {
              x: rock.x + localX * cos - localY * sin,
              y: rock.y + localX * sin + localY * cos,
            };
          });
        }

        function pointSegmentDistance(x, y, a, b) {
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const lengthSquared = dx * dx + dy * dy || 1;
          const amount = clamp(((x - a.x) * dx + (y - a.y) * dy) / lengthSquared, 0, 1);
          return Math.hypot(x - (a.x + dx * amount), y - (a.y + dy * amount));
        }

        function distanceToOutline(x, y, outline) {
          let nearest = Infinity;
          for (let i = 0; i < outline.length; i++) {
            nearest = Math.min(
              nearest,
              pointSegmentDistance(x, y, outline[i], outline[(i + 1) % outline.length]),
            );
          }
          return nearest;
        }

        function interpolateContour(a, b, level) {
          const amount = Math.abs(b.value - a.value) < 0.00001
            ? 0.5
            : clamp((level - a.value) / (b.value - a.value), 0, 1);
          return {
            x: mix(a.x, b.x, amount),
            y: mix(a.y, b.y, amount),
          };
        }

        function makeRakePaths() {
          const spacing = settings.rakeSpacing;
          const paths = [];
          const outlines = rocks.map(rockOutlinePoints);
          const gridStep = clamp(Math.min(width, height) / 150, 4.5, 9);
          const columns = Math.ceil(width / gridStep) + 1;
          const rows = Math.ceil(height / gridStep) + 1;
          const values = new Float32Array(columns * rows);
          const rockValues = outlines.map(() => new Float32Array(columns * rows));
          let maximumDistance = 0;

          pulseContactDistances = [];
          for (let first = 0; first < outlines.length; first++) {
            for (let second = first + 1; second < outlines.length; second++) {
              let minimumGap = Infinity;
              for (const point of outlines[first]) {
                minimumGap = Math.min(
                  minimumGap,
                  distanceToOutline(point.x, point.y, outlines[second]),
                );
              }
              for (const point of outlines[second]) {
                minimumGap = Math.min(
                  minimumGap,
                  distanceToOutline(point.x, point.y, outlines[first]),
                );
              }
              pulseContactDistances.push({ first, second, distance: minimumGap * 0.5 });
            }
          }
          pulseStillDistance = connectedPulseThreshold(pulseContactDistances, outlines.length);

          for (let row = 0; row < rows; row++) {
            const y = Math.min(height, row * gridStep);
            for (let column = 0; column < columns; column++) {
              const x = Math.min(width, column * gridStep);
              const gridIndex = row * columns + column;
              for (let rockIndex = 0; rockIndex < outlines.length; rockIndex++) {
                rockValues[rockIndex][gridIndex] = distanceToOutline(x, y, outlines[rockIndex]);
              }
              values[gridIndex] = Math.min(...rockValues.map(field => field[gridIndex]));
              maximumDistance = Math.max(maximumDistance, values[gridIndex]);
            }
          }

          const firstOffset = spacing * 0.82;
          const segmentTable = {
            1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]],
            6: [[0, 2]], 7: [[3, 2]], 8: [[2, 3]], 9: [[0, 2]],
            11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[3, 0]],
          };

          for (let level = firstOffset; level <= maximumDistance; level += spacing) {
            const path = [];
            for (let row = 0; row < rows - 1; row++) {
              const y0 = Math.min(height, row * gridStep);
              const y1 = Math.min(height, (row + 1) * gridStep);
              for (let column = 0; column < columns - 1; column++) {
                const x0 = Math.min(width, column * gridStep);
                const x1 = Math.min(width, (column + 1) * gridStep);
                const topLeft = { x: x0, y: y0, value: values[row * columns + column] };
                const topRight = { x: x1, y: y0, value: values[row * columns + column + 1] };
                const bottomRight = { x: x1, y: y1, value: values[(row + 1) * columns + column + 1] };
                const bottomLeft = { x: x0, y: y1, value: values[(row + 1) * columns + column] };
                const index =
                  (topLeft.value > level ? 1 : 0) |
                  (topRight.value > level ? 2 : 0) |
                  (bottomRight.value > level ? 4 : 0) |
                  (bottomLeft.value > level ? 8 : 0);
                if (index === 0 || index === 15) continue;

                const edges = [
                  interpolateContour(topLeft, topRight, level),
                  interpolateContour(topRight, bottomRight, level),
                  interpolateContour(bottomLeft, bottomRight, level),
                  interpolateContour(topLeft, bottomLeft, level),
                ];
                const centerIsOutside =
                  (topLeft.value + topRight.value + bottomRight.value + bottomLeft.value) * 0.25 > level;
                let segments = segmentTable[index];
                if (index === 5) {
                  segments = centerIsOutside
                    ? [[0, 1], [2, 3]]
                    : [[3, 0], [1, 2]];
                } else if (index === 10) {
                  segments = centerIsOutside
                    ? [[3, 0], [1, 2]]
                    : [[0, 1], [2, 3]];
                }
                for (const [start, end] of segments) {
                  const midpoint = {
                    x: (edges[start].x + edges[end].x) * 0.5,
                    y: (edges[start].y + edges[end].y) * 0.5,
                  };
                  const horizontalAmount = (midpoint.x - x0) / Math.max(0.0001, x1 - x0);
                  const verticalAmount = (midpoint.y - y0) / Math.max(0.0001, y1 - y0);
                  const rockDistances = rockValues.map(field => {
                    const top = mix(
                      field[row * columns + column],
                      field[row * columns + column + 1],
                      horizontalAmount,
                    );
                    const bottom = mix(
                      field[(row + 1) * columns + column],
                      field[(row + 1) * columns + column + 1],
                      horizontalAmount,
                    );
                    return mix(top, bottom, verticalAmount);
                  });
                  path.push({
                    ...edges[start],
                    move: true,
                    rakeDistance: level,
                    rockDistances,
                  }, edges[end]);
                }
              }
            }
            if (path.length) paths.push(path);
          }
          maximumRakeDistance = maximumDistance;
          canvas.dataset.samonPattern = 'nested-distance';
          canvas.dataset.samonCrossings = '0';
          canvas.dataset.samonMinimumGap = spacing.toFixed(2);
          canvas.dataset.pulsePalette = 'black';
          canvas.dataset.pulsePath = 'samon-only';
          canvas.dataset.pulseResponse = 'contact-amplification';
          canvas.dataset.pulseVariables = 'travel-fade,connection-boost';
          return paths;
        }

        function drawBackground(target) {
          target.fillStyle = '#eee9d8';
          target.fillRect(0, 0, width, height);
          if (gravelPattern) {
            target.fillStyle = gravelPattern;
            target.fillRect(0, 0, width, height);
          }
        }

        function drawRakeStroke(target, points, offsetY, color, lineWidth) {
          target.beginPath();
          for (let i = 0; i < points.length; i++) {
            const point = points[i];
            if (i === 0 || point.move) target.moveTo(point.x, point.y + offsetY);
            else target.lineTo(point.x, point.y + offsetY);
          }
          target.strokeStyle = color;
          target.lineWidth = lineWidth;
          target.stroke();
        }

        function drawSamon(target) {
          target.save();
          target.beginPath();
          target.rect(4, 4, width - 8, height - 8);
          target.clip();
          for (const path of rakePaths) {
            drawRakeStroke(target, path, 0.7, 'rgba(255, 253, 241, 0.72)', 1.15);
            drawRakeStroke(target, path, 0, 'rgba(71, 58, 53, 0.29)', 0.82);
          }
          target.restore();
        }

        function renderBase() {
          drawBackground(baseCtx);
          drawSamon(baseCtx);
        }

        function pulseStrength(distance, radius) {
          const band = Math.max(9, settings.rakeSpacing * 1.08);
          const delta = (distance - radius) / band;
          return Math.exp(-delta * delta * 2.4);
        }

        function connectedPulseThreshold(contacts, count) {
          const parent = Array.from({ length: count }, (_, index) => index);
          const find = index => {
            while (parent[index] !== index) {
              parent[index] = parent[parent[index]];
              index = parent[index];
            }
            return index;
          };
          for (const contact of [...contacts].sort((a, b) => a.distance - b.distance)) {
            parent[find(contact.second)] = find(contact.first);
            if (new Set(parent.map((_, index) => find(index))).size === 1) return contact.distance;
          }
          return 1;
        }

        function pulseComponents(radius) {
          const parent = rocks.map((_, index) => index);
          const find = index => {
            while (parent[index] !== index) {
              parent[index] = parent[parent[index]];
              index = parent[index];
            }
            return index;
          };
          for (const contact of pulseContactDistances) {
            if (radius >= contact.distance) parent[find(contact.second)] = find(contact.first);
          }
          const members = new Map();
          for (let index = 0; index < rocks.length; index++) {
            const root = find(index);
            if (!members.has(root)) members.set(root, []);
            members.get(root).push(index);
          }
          return rocks.map((_, index) => members.get(find(index)));
        }

        function pulseTravelFade(distance, travelDistance) {
          const firstFurrow = settings.rakeSpacing * 0.82;
          const progress = smooth(
            (distance - firstFurrow) / Math.max(1, travelDistance - firstFurrow),
          );
          return mix(1, 0.24, progress);
        }

        function pulseConnectionBoost(component, radius) {
          if (component.length === 1) return 0;
          if (prefersReducedMotion && component.length === rocks.length) return 1;
          const previous = (component.length - 2) / Math.max(1, rocks.length - 1);
          const target = (component.length - 1) / Math.max(1, rocks.length - 1);
          let contactDistance = pulseStillDistance;
          if (component.length < rocks.length) {
            const componentContacts = pulseContactDistances.filter(
              contact => component.includes(contact.first) && component.includes(contact.second),
            );
            contactDistance = Math.min(...componentContacts.map(contact => contact.distance));
          }
          const progress = smooth(
            (radius - contactDistance) / Math.max(1, settings.rakeSpacing * 3),
          );
          return mix(previous, target, progress);
        }

        function drawPulses(time) {
          const travelDistance = maximumRakeDistance + settings.rakeSpacing * 4;
          const elapsed = ((time - pulseStartedAt) % PULSE_PERIOD + PULSE_PERIOD) % PULSE_PERIOD;
          const radius = prefersReducedMotion
            ? pulseStillDistance
            : elapsed / PULSE_PERIOD * travelDistance;
          const components = pulseComponents(radius);
          const buckets = new Map();

          for (const path of rakePaths) {
            for (let i = 0; i < path.length; i += 2) {
              const start = path[i];
              const end = path[i + 1];
              const peak = pulseStrength(start.rakeDistance, radius);
              if (peak < 0.035) continue;

              let owningRock = 0;
              for (let rockIndex = 1; rockIndex < start.rockDistances.length; rockIndex++) {
                if (start.rockDistances[rockIndex] < start.rockDistances[owningRock]) {
                  owningRock = rockIndex;
                }
              }
              const component = components[owningRock];
              const travelFade = pulseTravelFade(start.rakeDistance, travelDistance);
              const connectionBoost = pulseConnectionBoost(component, radius);
              const fadeBucket = Math.round(travelFade * 8);
              const boostBucket = Math.round(connectionBoost * 8);
              const alphaBucket = Math.max(1, Math.round(peak * 5));
              const key = `${fadeBucket}:${boostBucket}:${alphaBucket}`;
              let bucket = buckets.get(key);
              if (!bucket) {
                const bucketFade = fadeBucket / 8;
                const bucketBoost = boostBucket / 8;
                const connectionGain = mix(1, 4.2, bucketBoost);
                bucket = {
                  alpha: Math.min(
                    0.92,
                    0.035 + alphaBucket / 5 * 0.21 * bucketFade * connectionGain,
                  ),
                  lineWidth: 0.82 + bucketBoost * 1.85,
                  segments: [],
                };
                buckets.set(key, bucket);
              }
              bucket.segments.push(start, end);
            }
          }

          ctx.save();
          ctx.beginPath();
          ctx.rect(4, 4, width - 8, height - 8);
          ctx.clip();
          ctx.lineCap = 'round';
          for (const bucket of buckets.values()) {
            ctx.beginPath();
            for (let i = 0; i < bucket.segments.length; i += 2) {
              const start = bucket.segments[i];
              const end = bucket.segments[i + 1];
              ctx.moveTo(start.x, start.y);
              ctx.lineTo(end.x, end.y);
            }
            ctx.lineWidth = bucket.lineWidth;
            ctx.strokeStyle = `rgba(0, 0, 0, ${bucket.alpha})`;
            ctx.stroke();
          }
          ctx.restore();
        }

        function rockPath(rock) {
          ctx.beginPath();
          for (let i = 0; i < rock.points.length; i++) {
            const point = rock.points[i];
            const x = Math.cos(point.angle) * rock.rx * point.roughness;
            const y = Math.sin(point.angle) * rock.ry * point.roughness;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
        }

        function drawRocks() {
          for (const rock of rocks) {
            ctx.save();
            ctx.translate(rock.x, rock.y);
            ctx.rotate(rock.rotation);
            rockPath(rock);
            ctx.fillStyle = rock.colors[0];
            ctx.fill();
            ctx.strokeStyle = rock.colors[1];
            ctx.lineWidth = 1.35;
            ctx.stroke();

            ctx.save();
            rockPath(rock);
            ctx.clip();
            for (const fleck of rock.flecks) {
              ctx.beginPath();
              const x = fleck.x * rock.rx;
              const y = fleck.y * rock.ry;
              ctx.moveTo(x - fleck.r * 1.6, y + fleck.r * 0.45);
              ctx.lineTo(x + fleck.r * 1.6, y - fleck.r * 0.45);
              ctx.strokeStyle = `rgba(52, 42, 45, ${0.22 + fleck.alpha})`;
              ctx.lineWidth = 0.55;
              ctx.stroke();
            }
            ctx.restore();

            for (const scale of [0.78, 0.56]) {
              ctx.save();
              ctx.scale(scale, scale);
              rockPath(rock);
              ctx.strokeStyle = scale > 0.7
                ? 'rgba(52, 42, 45, 0.34)'
                : 'rgba(52, 42, 45, 0.2)';
              ctx.lineWidth = 0.7 / scale;
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();

            if (rock.radius > 44 && rock.x > 0 && rock.x < width && rock.y > 0 && rock.y < height) {
              ctx.save();
              ctx.fillStyle = 'rgba(43, 23, 32, 0.68)';
              ctx.font = '7px "SFMono-Regular", Consolas, monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(`R${String(rock.id + 1).padStart(2, '0')}`, rock.x, rock.y);
              ctx.restore();
            }
          }
        }

        function drawFrame() {
          ctx.save();
          ctx.strokeStyle = 'rgba(43, 23, 32, 0.54)';
          ctx.lineWidth = 1;
          ctx.strokeRect(4.5, 4.5, width - 9, height - 9);
          ctx.fillStyle = 'rgba(43, 23, 32, 0.72)';
          ctx.font = '8px "SFMono-Regular", Consolas, monospace';
          ctx.textAlign = 'right';
          const stoneLabel = settings.count === 1 ? 'STONE' : 'STONES';
          ctx.fillText(`KARESANSUI / ${String(settings.count).padStart(2, '0')} ${stoneLabel}`, width - 14, height - 13);
          ctx.restore();
        }

        function render(time = performance.now()) {
          ctx.drawImage(baseCanvas, 0, 0, width, height);
          drawPulses(time);
          drawRocks();
          drawFrame();
        }

        function animate(time) {
          if (time - lastAnimationRender >= 1000 / 30) {
            render(time);
            lastAnimationRender = time;
          }
          animationFrame = requestAnimationFrame(animate);
        }

        function syncAnimation() {
          cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          if (prefersReducedMotion || document.hidden) {
            render(pulseStartedAt);
            return;
          }
          animationFrame = requestAnimationFrame(animate);
        }

        function scheduleCompose() {
          clearTimeout(composeTimer);
          composeTimer = setTimeout(compose, 90);
        }

        function bindRange(input, onInput, format) {
          const row = input.closest('.range-row');
          const output = row.querySelector('output');
          function update() {
            const value = Number(input.value);
            const progress = (value - Number(input.min)) / (Number(input.max) - Number(input.min));
            row.style.setProperty('--progress', `${progress * 100}%`);
            output.textContent = format(value);
            onInput(value);
            scheduleCompose();
          }
          input.addEventListener('input', update);
          update();
        }

        bindRange(spacingInput, value => { settings.rakeSpacing = value; }, value => `${value} px`);

        reseedButton.addEventListener('click', () => {
          seed = ((seed + 0x9e3779b9) ^ (Date.now() & 0xffffffff)) >>> 0;
          compose();
        });

        collapseButton.addEventListener('click', () => {
          const collapsed = panel.classList.toggle('is-collapsed');
          collapseButton.textContent = collapsed ? '+' : '−';
          collapseButton.setAttribute('aria-expanded', String(!collapsed));
          collapseButton.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
        });

        panelHeader.addEventListener('pointerdown', event => {
          if (event.target.closest('button')) return;
          const rect = panel.getBoundingClientRect();
          panelDrag = {
            pointerId: event.pointerId,
            offsetX: event.clientX - rect.left,
            offsetY: event.clientY - rect.top,
          };
          panel.classList.add('is-dragging');
          panelHeader.setPointerCapture(event.pointerId);
        });

        panelHeader.addEventListener('pointermove', event => {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          const rect = panel.getBoundingClientRect();
          const left = clamp(event.clientX - panelDrag.offsetX, 8, width - rect.width - 8);
          const top = clamp(event.clientY - panelDrag.offsetY, 8, height - rect.height - 8);
          panel.style.left = `${left}px`;
          panel.style.top = `${top}px`;
        });

        function endPanelDrag(event) {
          if (!panelDrag || panelDrag.pointerId !== event.pointerId) return;
          panelDrag = null;
          panel.classList.remove('is-dragging');
          if (panelHeader.hasPointerCapture(event.pointerId)) panelHeader.releasePointerCapture(event.pointerId);
        }

        panelHeader.addEventListener('pointerup', endPanelDrag);
        panelHeader.addEventListener('pointercancel', endPanelDrag);

        canvas.addEventListener('pointerdown', () => reseedButton.click());

        window.addEventListener('keydown', event => {
          if (event.target.matches('input, button')) return;
          if (event.key.toLowerCase() === 'r' || event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            reseedButton.click();
          }
        });

        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(resize, 120);
        });

        reducedMotionQuery.addEventListener('change', event => {
          prefersReducedMotion = event.matches;
          syncAnimation();
        });

        document.addEventListener('visibilitychange', syncAnimation);

        resize();
        syncAnimation();
      })();
    </script>
  </body>
</html>
