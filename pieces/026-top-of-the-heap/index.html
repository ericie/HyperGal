<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A bouncing yellow sun defends a cube pyramid and its smiley flag from spring-mounted skulls, daggers, guns, whiskey bottles, and cigarettes."
    />
    <title>Top of the Heap · Hypermedia Club</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #140d32;
        --focus: #fff46b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }

      canvas:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -6px;
      }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Top of the Heap. A tall pyramid of equal-size cubes fills the portrait screen. A bouncing yellow sun with a smiling face and golden rays paints cubes yellow while waves of skulls, daggers, guns, whiskey bottles, and cigarettes on little springs paint cubes dark gray-brown. A yellow flag with eyes and a smiling mouth flies on the summit. The three percentages are yellow territory, dark gray-brown territory, and purple unclaimed territory. The hunter chases and squashes whichever hazard is closest to the top. Yellow or dark gray-brown wins by claiming the entire pyramid. Press R to restart the match."
    ></canvas>
    <p id="status" class="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.getElementById('status');
        const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
        const TAU = Math.PI * 2;
        const TERRITORY = {
          yellow: { hue: 52, saturation: 94, lightness: 58 },
          shadow: { hue: 30, saturation: 12, lightness: 34 },
        };
        const MAX_SNAKES = 6;
        const HAZARD_ICONS = ['skull', 'dagger', 'gun', 'whiskey', 'cigarette'];
        let nextHazardIcon = 0;

        const palettes = [
          {
            bg: '#140d32',
            aura: '#3b1766',
            ink: '#fff8c9',
            inactive: { h: 257, s: 58, l: 27 },
            on: 48,
            ball: '#fff15b',
            ballShade: '#ff6b3d',
          },
          {
            bg: '#071d34',
            aura: '#074966',
            ink: '#e9fff8',
            inactive: { h: 257, s: 58, l: 27 },
            on: 163,
            ball: '#fff15b',
            ballShade: '#ff6b3d',
          },
          {
            bg: '#2a0c22',
            aura: '#6b163b',
            ink: '#fff7df',
            inactive: { h: 257, s: 58, l: 27 },
            on: 57,
            ball: '#fff15b',
            ballShade: '#ff6b3d',
          },
          {
            bg: '#102417',
            aura: '#1f5a39',
            ink: '#f6ffe2',
            inactive: { h: 257, s: 58, l: 27 },
            on: 83,
            ball: '#fff15b',
            ballShade: '#ff6b3d',
          },
          {
            bg: '#241308',
            aura: '#6c3512',
            ink: '#fff4d4',
            inactive: { h: 257, s: 58, l: 27 },
            on: 194,
            ball: '#fff15b',
            ballShade: '#ff6b3d',
          },
        ];

        let width = 1;
        let height = 1;
        let dpr = 1;
        let rows = 20;
        let halfW = 10;
        let halfH = 4;
        let sideH = 17;
        let stepY = 21;
        let topX = 0;
        let topY = 110;
        let cubes = [];
        let players = [];
        let splats = [];
        let sparks = [];
        let stars = [];
        let ball = null;
        let level = 1;
        let yellowCount = 0;
        let shadowCount = 0;
        let totalCubes = 0;
        let paletteIndex = 0;
        let palette = palettes[0];
        let matchTime = 0;
        let lastFrameAt = 0;
        let nextSpawnAt = 0;
        let nextWaveAt = 0;
        let waveRemaining = 0;
        let waveIndex = 0;
        let waveHue = 30;
        let phase = 'play';
        let blinkStartedAt = 0;
        let roundWinner = 'yellow';
        let reducedMotion = motionQuery.matches;
        let random = mulberry32((Date.now() ^ 0x87a51) >>> 0);
        let raf = 0;

        resize(true);
        bindEvents();
        resetLevel(false);
        raf = requestAnimationFrame(frame);

        function bindEvents() {
          addEventListener('resize', () => resize(false), { passive: true });
          canvas.addEventListener('pointerdown', () => {
            canvas.focus({ preventScroll: true });
          });
          canvas.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') restartMatch();
          });
          document.addEventListener('visibilitychange', () => {
            lastFrameAt = 0;
            if (!document.hidden && !raf) raf = requestAnimationFrame(frame);
          });
          const onMotionChange = () => {
            reducedMotion = motionQuery.matches;
            lastFrameAt = 0;
          };
          if (typeof motionQuery.addEventListener === 'function') {
            motionQuery.addEventListener('change', onMotionChange);
          } else if (typeof motionQuery.addListener === 'function') {
            motionQuery.addListener(onMotionChange);
          }
        }

        function resize(firstRun) {
          const oldWidth = width;
          const oldHeight = height;
          width = Math.max(1, innerWidth);
          height = Math.max(1, innerHeight);
          if (!firstRun && width === oldWidth && height === oldHeight) return;

          dpr = Math.min(2, devicePixelRatio || 1);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          rows = width / height < 0.72 ? 20 : width < 760 ? 18 : 15;
          const headerSpace = clamp(height * 0.16, 110, 150);
          const bottomSpace = Math.max(34, height * 0.065);
          halfW = Math.min(
            (width - Math.max(22, width * 0.06)) / (rows * 2),
            (height - headerSpace - bottomSpace) / (rows * 2.05)
          );
          halfW = Math.max(5.5, halfW);
          halfH = halfW * 0.39;
          sideH = halfW * 1.66;
          stepY = halfH + sideH;
          topX = width * 0.5;

          topY = headerSpace + halfH;

          makeStars();
          if (cubes.length) resetLevel(false);
        }

        function restartMatch() {
          level = 1;
          paletteIndex = Math.floor(random() * palettes.length);
          palette = palettes[paletteIndex];
          resetLevel(false);
          status.textContent = 'New match';
        }

        function resetLevel(advancePalette) {
          if (advancePalette) {
            level += 1;
            paletteIndex = (paletteIndex + 1 + Math.floor(random() * 2)) % palettes.length;
            palette = palettes[paletteIndex];
          }

          cubes = [];
          yellowCount = 0;
          shadowCount = 0;
          totalCubes = (rows * (rows + 1)) / 2;
          for (let row = 0; row < rows; row += 1) {
            const line = [];
            for (let column = 0; column <= row; column += 1) {
              line.push({ row, column, owner: 'none', pulse: 0 });
            }
            cubes.push(line);
          }

          players = [];
          splats = [];
          sparks = [];
          matchTime = 0;
          nextSpawnAt = 0;
          nextWaveAt = 0.75;
          waveRemaining = 0;
          waveIndex = 0;
          nextHazardIcon = 0;
          phase = 'play';
          ball = makeBall();
          updateRootColor();
        }

        function updateRootColor() {
          document.documentElement.style.setProperty('--ground', palette.bg);
          document.documentElement.style.setProperty('--focus', palette.ball);
        }

        function makeBall() {
          const apex = nodePoint(0, 0);
          return {
            row: -1,
            column: 0,
            from: { x: apex.x + halfW * 0.15, y: -Math.max(48, height * 0.1) },
            to: apex,
            startedAt: matchTime,
            duration: reducedMotion ? 1.15 : 0.82,
            mode: 'entry',
            nextRow: 0,
            nextColumn: 0,
            previousRow: -1,
            previousColumn: 0,
            targetId: null,
            trail: [],
          };
        }

        function spawnSnake() {
          if (players.length >= MAX_SNAKES || phase !== 'play') return false;
          const openColumns = [];
          for (let column = 0; column < rows; column += 1) {
            if (!snakeClaimsSquare(rows - 1, column, null)) openColumns.push(column);
          }
          if (!openColumns.length) return false;

          const column = openColumns[Math.floor(random() * openColumns.length)];
          const target = nodePoint(rows - 1, column);
          const approach = random() < 0.5 ? -1 : 1;
          players.push({
            id: `${matchTime}-${random()}`,
            hue: waveHue + (random() - 0.5) * 9,
            icon: HAZARD_ICONS[nextHazardIcon++ % HAZARD_ICONS.length],
            row: rows,
            column,
            from: {
              x: target.x + approach * halfW * 2.3,
              y: target.y + sideH * 2.5,
            },
            to: target,
            startedAt: matchTime,
            duration: reducedMotion ? 1.15 : 0.72 + random() * 0.18,
            entering: true,
            waiting: false,
            nextColumn: column,
            dead: false,
            driftPhase: random() * TAU,
          });
          return true;
        }

        function beginWave() {
          waveIndex += 1;
          waveHue = 24 + random() * 12;
          waveRemaining = 3 + Math.floor(random() * 3);
          nextSpawnAt = matchTime;
          status.textContent = `Wave ${waveIndex}: ${waveRemaining} hazards.`;
        }

        function frame(now) {
          raf = 0;
          if (document.hidden) return;
          const seconds = now * 0.001;
          if (!lastFrameAt) lastFrameAt = seconds;
          const dt = Math.min(0.04, Math.max(0, seconds - lastFrameAt));
          lastFrameAt = seconds;
          update(dt);
          draw();
          raf = requestAnimationFrame(frame);
        }

        function update(dt) {
          const speed = reducedMotion ? 0.44 : 1;
          matchTime += dt * speed;

          for (const row of cubes) {
            for (const cube of row) cube.pulse = Math.max(0, cube.pulse - dt * 3.8);
          }

          splats = splats.filter((splat) => matchTime - splat.at < 0.7);
          sparks = sparks.filter((spark) => matchTime - spark.at < spark.life);

          if (phase === 'blink') {
            if (matchTime - blinkStartedAt >= (reducedMotion ? 0.72 : 1.45)) {
              resetLevel(true);
              status.textContent = `Level ${level}`;
            }
            return;
          }

          if (waveRemaining === 0 && matchTime >= nextWaveAt) beginWave();

          if (waveRemaining > 0 && matchTime >= nextSpawnAt) {
            if (spawnSnake()) {
              waveRemaining -= 1;
              nextSpawnAt = matchTime + 0.34 + random() * 0.2;
              if (waveRemaining === 0) {
                nextWaveAt = matchTime + 6 + random() * 4;
              }
            } else {
              nextSpawnAt = matchTime + 0.5;
            }
          }

          updateBall();
          if (phase === 'blink') return;
          for (const player of players) {
            updatePlayer(player);
            if (phase === 'blink') break;
          }
          if (phase === 'blink') return;
          checkCrushes();
          players = players.filter((player) => !player.dead);
        }

        function updateBall() {
          if (!ball) return;
          const progress = (matchTime - ball.startedAt) / ball.duration;
          const position = ballPosition();
          ball.trail.push({ x: position.x, y: position.y, at: matchTime });
          ball.trail = ball.trail.filter((dot) => matchTime - dot.at < 0.18);
          if (progress < 1) return;

          ball.previousRow = ball.row;
          ball.previousColumn = ball.column;
          ball.row = ball.mode === 'entry' ? 0 : ball.nextRow;
          ball.column = ball.mode === 'entry' ? 0 : ball.nextColumn;
          strikeCube(ball.row, ball.column);
          if (phase === 'blink') return;

          const next = chooseBallNextNode();
          ball.from = nodePoint(ball.row, ball.column);
          ball.to = nodePoint(next.row, next.column);
          ball.nextRow = next.row;
          ball.nextColumn = next.column;
          ball.startedAt = matchTime;
          ball.duration = reducedMotion ? 1.08 : 0.35 + random() * 0.08;
          ball.mode = 'bounce';
        }

        function chooseBallNextNode() {
          let candidates = ballNeighbors(ball.row, ball.column);
          const livePlayers = players.filter((player) => !player.dead);

          if (livePlayers.length) {
            const rainHop = reducedMotion ? 1.18 : 0.62;
            const sunHop = reducedMotion ? 1.08 : 0.43;
            const threats = livePlayers.map((player) => {
              const progress = clamp((matchTime - player.startedAt) / player.duration, 0, 1);
              const destination = {
                row: player.entering ? rows - 1 : player.waiting ? player.row : player.row - 1,
                column: player.waiting ? player.column : player.nextColumn,
              };
              const arrival = (1 - progress) * player.duration + destination.row * rainHop;
              return { player, destination, arrival };
            }).sort((a, b) => a.arrival - b.arrival);
            const threat = threats[0];
            ball.targetId = threat.player.id;

            // Keep enough time to climb back by ordinary, adjacent-cube hops.
            const safe = candidates.filter(
              (node) => (node.row + 1) * sunHop + 0.2 < threat.arrival
            );
            if (safe.length) candidates = safe;
            else candidates = candidates.filter((node) => node.row < ball.row);
            if (!candidates.length) return { row: ball.row, column: ball.column };

            const scored = candidates.map((candidate) => {
              const distance = cubeDistance(candidate, threat.destination);
              const reversal = candidate.row === ball.previousRow &&
                candidate.column === ball.previousColumn ? 0.85 : 0;
              return { ...candidate, score: distance * 8 - claimOpportunity(candidate) + reversal };
            }).sort((a, b) => a.score - b.score);
            return scored[0];
          }

          ball.targetId = null;
          return nextStepTowardYellowClaim(candidates) || candidates[Math.floor(random() * candidates.length)];
        }

        function cubeDistance(a, b) {
          return Math.abs(a.column - b.column) +
            Math.abs((a.row - a.column) - (b.row - b.column));
        }

        function claimOpportunity(node) {
          if (cubes[node.row][node.column].owner === 'yellow') return 0;
          // Prefer fresh territory that also opens a useful next landing.
          const onward = ballNeighbors(node.row, node.column).filter(
            (next) => cubes[next.row][next.column].owner !== 'yellow'
          ).length;
          return 1.6 + onward * 0.24;
        }

        function nextStepTowardYellowClaim(initialSteps) {
          const queue = [];
          const visited = new Set([`${ball.row}:${ball.column}`]);
          const orderedSteps = [...initialSteps].sort(
            (a, b) => claimOpportunity(b) - claimOpportunity(a)
          );
          for (const step of orderedSteps) {
            const key = `${step.row}:${step.column}`;
            visited.add(key);
            queue.push({ row: step.row, column: step.column, first: step });
          }

          let cursor = 0;
          while (cursor < queue.length) {
            const current = queue[cursor];
            cursor += 1;
            if (cubes[current.row][current.column].owner !== 'yellow') return current.first;

            for (const neighbor of ballNeighbors(current.row, current.column)) {
              const key = `${neighbor.row}:${neighbor.column}`;
              if (visited.has(key)) continue;
              visited.add(key);
              queue.push({ ...neighbor, first: current.first });
            }
          }
          return null;
        }

        function ballNeighbors(row, column) {
          const neighbors = [];
          if (row > 0) {
            if (column < row) neighbors.push({ row: row - 1, column });
            if (column > 0) neighbors.push({ row: row - 1, column: column - 1 });
          }
          if (row < rows - 1) {
            neighbors.push({ row: row + 1, column });
            neighbors.push({ row: row + 1, column: column + 1 });
          }
          return neighbors;
        }

        function updatePlayer(player) {
          if (player.dead) return;
          const progress = (matchTime - player.startedAt) / player.duration;
          if (progress < 1) return;

          if (player.entering) {
            player.row = rows - 1;
            player.entering = false;
          } else if (!player.waiting) {
            player.row -= 1;
            player.column = player.nextColumn;
          }

          claimCube(player.row, player.column, 'shadow');
          if (phase === 'blink') return;

          if (player.row <= 0) {
            player.dead = true;
            status.textContent = 'Hazard crossed the summit. The territory race continues.';
            return;
          }

          const candidateColumns = [];
          if (player.column < player.row) candidateColumns.push(player.column);
          if (player.column > 0) candidateColumns.push(player.column - 1);
          if (candidateColumns.length > 1 && random() < 0.5) candidateColumns.reverse();

          const nextRow = player.row - 1;
          const nextColumn = candidateColumns.find(
            (column) => !snakeClaimsSquare(nextRow, column, player)
          );
          player.from = nodePoint(player.row, player.column);
          player.startedAt = matchTime;

          if (nextColumn === undefined) {
            player.waiting = true;
            player.to = player.from;
            player.nextColumn = player.column;
            player.duration = reducedMotion ? 0.72 : 0.2 + random() * 0.1;
            return;
          }

          player.waiting = false;
          player.to = nodePoint(nextRow, nextColumn);
          player.nextColumn = nextColumn;
          player.duration = reducedMotion ? 1.18 : 0.62 + random() * 0.22;
        }

        function snakeClaimsSquare(row, column, exceptPlayer) {
          for (const other of players) {
            if (other.dead || other === exceptPlayer) continue;

            if (other.entering) {
              if (row === rows - 1 && column === other.column) return true;
              continue;
            }

            if (row === other.row && column === other.column) return true;
            if (
              !other.waiting &&
              row === other.row - 1 &&
              column === other.nextColumn
            ) {
              return true;
            }
          }
          return false;
        }

        function beginBlink(winner) {
          if (phase === 'blink') return;
          roundWinner = winner;
          phase = 'blink';
          blinkStartedAt = matchTime;
          makeSparks(nodePoint(0, 0), TERRITORY[winner].hue, 28);
        }

        function strikeCube(row, column) {
          claimCube(row, column, 'yellow');
        }

        function claimCube(row, column, owner) {
          const cube = cubes[row] && cubes[row][column];
          if (!cube) return;
          if (cube.owner !== owner) {
            if (cube.owner === 'yellow') yellowCount -= 1;
            if (cube.owner === 'shadow') shadowCount -= 1;
            cube.owner = owner;
            if (owner === 'yellow') yellowCount += 1;
            if (owner === 'shadow') shadowCount += 1;
            cube.pulse = 1;
            makeSparks(nodePoint(row, column), TERRITORY[owner].hue, row === 0 ? 12 : 5);
          } else {
            cube.pulse = Math.max(cube.pulse, 0.32);
          }

          if (yellowCount === totalCubes || shadowCount === totalCubes) {
            const winner = yellowCount === totalCubes ? 'yellow' : 'shadow';
            status.textContent = `${winner === 'yellow' ? 'Yellow' : 'Shadow'} claimed the whole pyramid.`;
            beginBlink(winner);
          }
        }

        function checkCrushes() {
          if (!ball || ball.mode === 'entry' && ball.row < 0) return;
          const bp = ballPosition();
          const ballRadius = Math.max(6, halfW * 0.78);
          for (const player of players) {
            if (player.dead) continue;
            const pp = playerPosition(player);
            const dx = bp.x - pp.x;
            const dy = bp.y - pp.y;
            const hitRadius = ballRadius + Math.max(4, halfW * 0.78);
            if (dx * dx + dy * dy > hitRadius * hitRadius) continue;

            player.dead = true;
            if (ball.targetId === player.id) ball.targetId = null;
            splats.push({ x: pp.x, y: pp.y + halfW * 0.25, hue: player.hue, at: matchTime });
            makeSparks(pp, player.hue, 11);
            status.textContent = 'Hazard flattened. The territory race continues.';
          }
        }

        function ballPosition() {
          if (!ball) return { x: -100, y: -100 };
          const raw = clamp((matchTime - ball.startedAt) / ball.duration, 0, 1);
          let t = raw;
          let lift = 0;
          if (ball.mode === 'entry') {
            t = 1 - Math.pow(1 - raw, 2.35);
          } else if (ball.mode === 'bounce') {
            lift = reducedMotion ? 0 : Math.sin(Math.PI * raw) * halfW * 3.15;
          }
          return {
            x: lerp(ball.from.x, ball.to.x, t),
            y: lerp(ball.from.y, ball.to.y, t) - lift - halfW * 0.8,
          };
        }

        function ballGroundPosition() {
          if (!ball) return { x: -100, y: -100 };
          const raw = clamp((matchTime - ball.startedAt) / ball.duration, 0, 1);
          const t = ball.mode === 'entry' ? 1 - Math.pow(1 - raw, 2.35) : raw;
          return {
            x: lerp(ball.from.x, ball.to.x, t),
            y: lerp(ball.from.y, ball.to.y, t),
          };
        }

        function playerPosition(player) {
          const ground = playerGroundPosition(player);
          const raw = clamp((matchTime - player.startedAt) / player.duration, 0, 1);
          const jumpHeight = player.waiting ? 0.55 : player.entering ? 1.25 : 2.35;
          const lift = reducedMotion ? 0 : Math.sin(Math.PI * raw) * halfW * jumpHeight;
          return { x: ground.x, y: ground.y - lift };
        }

        function playerGroundPosition(player) {
          const raw = clamp((matchTime - player.startedAt) / player.duration, 0, 1);
          const t = smooth(raw);
          return {
            x: lerp(player.from.x, player.to.x, t),
            y: lerp(player.from.y, player.to.y, t) - halfW * 0.28,
          };
        }

        function nodePoint(row, column) {
          return {
            x: topX + (column * 2 - row) * halfW,
            y: topY + row * stepY,
          };
        }

        function makeSparks(point, hue, count) {
          if (reducedMotion) return;
          for (let i = 0; i < count; i += 1) {
            const angle = random() * TAU;
            const speed = halfW * (0.8 + random() * 2.3);
            sparks.push({
              x: point.x,
              y: point.y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - halfW,
              hue,
              at: matchTime,
              life: 0.25 + random() * 0.28,
            });
          }
        }

        function makeStars() {
          stars = [];
          const count = Math.round(clamp((width * height) / 11000, 24, 86));
          const starRandom = mulberry32((width * 19 + height * 31) >>> 0);
          for (let i = 0; i < count; i += 1) {
            stars.push({
              x: starRandom() * width,
              y: starRandom() * height,
              size: 0.5 + starRandom() * 1.7,
              alpha: 0.12 + starRandom() * 0.32,
            });
          }
        }

        function draw() {
          drawBackdrop();
          drawScoreboard();
          drawBoardShadow();
          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column <= row; column += 1) {
              drawCube(cubes[row][column]);
            }
          }

          drawSummitFlag();
          drawSplats();
          const actors = players
            .filter((player) => !player.dead)
            .map((player) => ({ type: 'player', value: player, y: playerPosition(player).y }));
          if (ball) actors.push({ type: 'ball', value: ball, y: ballPosition().y });
          actors.sort((a, b) => a.y - b.y);
          for (const actor of actors) {
            if (actor.type === 'ball') drawBall();
            else drawPlayer(actor.value);
          }
          drawSparks();

          if (phase === 'blink') drawBlink();
        }

        function drawBackdrop() {
          ctx.fillStyle = palette.bg;
          ctx.fillRect(0, 0, width, height);

          const aura = ctx.createRadialGradient(
            topX,
            topY + rows * stepY * 0.5,
            0,
            topX,
            topY + rows * stepY * 0.55,
            Math.max(width, height) * 0.68
          );
          aura.addColorStop(0, palette.aura);
          aura.addColorStop(0.48, palette.bg);
          aura.addColorStop(1, palette.bg);
          ctx.fillStyle = aura;
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = palette.ink;
          for (const star of stars) {
            ctx.globalAlpha = star.alpha;
            ctx.fillRect(star.x, star.y, star.size, star.size);
          }
          ctx.globalAlpha = 1;
        }

        function drawScoreboard() {
          const scoreSize = clamp(width * 0.056, 18, 31);
          const top = Math.max(24, envSafeTop() + 17);
          const scores = territoryPercentages();
          const left = clamp(width * 0.04, 18, 32);
          const lineHeight = scoreSize * 1.28;

          ctx.textBaseline = 'top';
          ctx.font = `900 ${scoreSize}px Arial, Helvetica, sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillStyle = `hsl(${TERRITORY.yellow.hue} ${TERRITORY.yellow.saturation}% 66%)`;
          ctx.fillText(`${scores.yellow}%`, left, top);
          ctx.fillStyle = `hsl(${TERRITORY.shadow.hue} ${TERRITORY.shadow.saturation}% 65%)`;
          ctx.fillText(`${scores.shadow}%`, left, top + lineHeight);
          ctx.fillStyle = '#bd91ff';
          ctx.fillText(`${scores.none}%`, left, top + lineHeight * 2);
        }

        function territoryPercentages() {
          const counts = {
            yellow: yellowCount,
            shadow: shadowCount,
            none: totalCubes - yellowCount - shadowCount,
          };
          const entries = Object.entries(counts).map(([name, count]) => {
            const exact = totalCubes ? count * 100 / totalCubes : 0;
            return { name, value: Math.floor(exact), remainder: exact % 1 };
          });
          let remaining = 100 - entries.reduce((sum, entry) => sum + entry.value, 0);
          entries.sort((a, b) => b.remainder - a.remainder);
          for (let index = 0; index < remaining; index += 1) entries[index].value += 1;
          return Object.fromEntries(entries.map((entry) => [entry.name, entry.value]));
        }

        function drawSummitFlag() {
          const poleHeight = clamp(halfW * 1.5, 31, 42);
          const flagWidth = poleHeight * 0.9;
          const flagHeight = poleHeight * 0.6;
          const x = topX;
          const y = topY;
          const flutter = reducedMotion ? 0 : Math.sin(matchTime * 3.1) * flagHeight * 0.06;
          ctx.save();
          ctx.translate(x, y - poleHeight);
          ctx.lineWidth = Math.max(1.3, halfW * 0.075);
          ctx.strokeStyle = '#d4c5f5';
          ctx.beginPath();
          ctx.moveTo(0, poleHeight);
          ctx.lineTo(0, -2);
          ctx.stroke();

          ctx.fillStyle = '#fff15b';
          ctx.strokeStyle = '#b1a11a';
          ctx.beginPath();
          ctx.moveTo(1, 0);
          ctx.bezierCurveTo(flagWidth * 0.4, -flagHeight * 0.12, flagWidth * 0.65, flagHeight * 0.16 + flutter, flagWidth, flutter);
          ctx.lineTo(flagWidth, flagHeight + flutter);
          ctx.bezierCurveTo(flagWidth * 0.65, flagHeight * 1.16 + flutter, flagWidth * 0.4, flagHeight * 0.88, 1, flagHeight);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.translate(flagWidth * 0.52, flagHeight * 0.5 + flutter * 0.45);
          const faceSize = flagHeight * 0.4;
          ctx.fillStyle = '#362b24';
          ctx.strokeStyle = '#362b24';
          ctx.lineWidth = Math.max(1, faceSize * 0.14);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(-faceSize * 0.4, -faceSize * 0.25, faceSize * 0.1, 0, TAU);
          ctx.arc(faceSize * 0.4, -faceSize * 0.25, faceSize * 0.1, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, faceSize * 0.02, faceSize * 0.6, Math.PI * 0.12, Math.PI * 0.88);
          ctx.stroke();
          ctx.restore();
        }

        function drawBoardShadow() {
          const base = nodePoint(rows - 1, Math.floor((rows - 1) / 2));
          ctx.save();
          ctx.translate(base.x, base.y + sideH * 1.45);
          ctx.scale(1, 0.24);
          const shadow = ctx.createRadialGradient(0, 0, 0, 0, 0, width * 0.48);
          shadow.addColorStop(0, 'rgba(0,0,0,.55)');
          shadow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = shadow;
          ctx.beginPath();
          ctx.arc(0, 0, width * 0.48, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        function drawCube(cube) {
          const point = nodePoint(cube.row, cube.column);
          const territory = TERRITORY[cube.owner];
          const activeHue = territory ? territory.hue : palette.inactive.h;
          const saturation = territory ? territory.saturation : palette.inactive.s;
          const lightness = territory ? territory.lightness : palette.inactive.l;
          const pulse = cube.pulse * 12;

          ctx.beginPath();
          ctx.moveTo(point.x - halfW, point.y);
          ctx.lineTo(point.x, point.y + halfH);
          ctx.lineTo(point.x, point.y + halfH + sideH);
          ctx.lineTo(point.x - halfW, point.y + sideH);
          ctx.closePath();
          ctx.fillStyle = `hsl(${activeHue} ${Math.max(32, saturation - 15)}% ${Math.max(13, lightness - 19)}%)`;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(point.x + halfW, point.y);
          ctx.lineTo(point.x, point.y + halfH);
          ctx.lineTo(point.x, point.y + halfH + sideH);
          ctx.lineTo(point.x + halfW, point.y + sideH);
          ctx.closePath();
          ctx.fillStyle = `hsl(${activeHue} ${Math.max(34, saturation - 8)}% ${Math.max(17, lightness - 11)}%)`;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(point.x, point.y - halfH);
          ctx.lineTo(point.x + halfW, point.y);
          ctx.lineTo(point.x, point.y + halfH);
          ctx.lineTo(point.x - halfW, point.y);
          ctx.closePath();
          ctx.fillStyle = `hsl(${activeHue} ${saturation}% ${Math.min(79, lightness + pulse)}%)`;
          ctx.fill();

          ctx.strokeStyle = 'rgba(7, 5, 22, .72)';
          ctx.lineWidth = Math.max(0.7, halfW * 0.055);
          ctx.stroke();

          if (cube.pulse > 0) {
            ctx.globalAlpha = cube.pulse * 0.45;
            ctx.fillStyle = palette.ink;
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        function drawBall() {
          const p = ballPosition();
          const radius = Math.max(6, halfW * 0.78);
          const raw = clamp((matchTime - ball.startedAt) / ball.duration, 0, 1);
          const hop = ball.mode === 'bounce' && !reducedMotion ? Math.sin(Math.PI * raw) : 0;
          const landing = ball.mode === 'bounce' && !reducedMotion
            ? Math.pow(Math.abs(Math.cos(Math.PI * raw)), 7)
            : 0;
          const direction = clamp((ball.to.x - ball.from.x) / Math.max(1, halfW), -1, 1);

          for (let i = 0; i < ball.trail.length; i += 1) {
            const dot = ball.trail[i];
            const age = clamp((matchTime - dot.at) / 0.18, 0, 1);
            ctx.globalAlpha = (1 - age) * 0.24;
            ctx.fillStyle = palette.ball;
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, radius * (0.2 + (1 - age) * 0.34), 0, TAU);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          const ground = ballGroundPosition();
          ctx.fillStyle = 'rgba(0,0,0,.28)';
          ctx.beginPath();
          ctx.ellipse(
            ground.x + radius * 0.12,
            ground.y + halfW * 0.38,
            radius * (0.9 - hop * 0.24),
            radius * 0.24,
            0,
            0,
            TAU
          );
          ctx.fill();

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          ctx.save();
          ctx.scale(1 + landing * 0.16, 1 - landing * 0.12);
          ctx.beginPath();
          const rayLength = radius * (1.4 + hop * 0.06);
          for (let point = 0; point < 24; point += 1) {
            const angle = point / 24 * TAU - Math.PI * 0.5;
            const reach = point % 2 === 0 ? rayLength : radius * 0.95;
            const x = Math.cos(angle) * reach;
            const y = Math.sin(angle) * reach;
            if (point === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fillStyle = '#ffd34e';
          ctx.strokeStyle = 'rgba(8, 5, 27, .78)';
          ctx.lineWidth = Math.max(0.8, halfW * 0.06);
          ctx.fill();
          ctx.stroke();

          const shine = ctx.createRadialGradient(
            -radius * 0.36,
            -radius * 0.42,
            radius * 0.04,
            0,
            0,
            radius
          );
          shine.addColorStop(0, '#fff8c9');
          shine.addColorStop(0.16, palette.ball);
          shine.addColorStop(0.76, palette.ball);
          shine.addColorStop(1, palette.ballShade);
          ctx.fillStyle = shine;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = 'rgba(8, 5, 27, .78)';
          ctx.lineWidth = Math.max(1, halfW * 0.09);
          ctx.stroke();

          const gazeX = direction * radius * 0.11;
          const eyeY = -radius * 0.18;
          ctx.fillStyle = '#fffdf2';
          ctx.beginPath();
          ctx.ellipse(-radius * 0.3, eyeY, radius * 0.2, radius * 0.26, 0, 0, TAU);
          ctx.ellipse(radius * 0.3, eyeY, radius * 0.2, radius * 0.26, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#120b2c';
          ctx.beginPath();
          ctx.arc(-radius * 0.3 + gazeX, eyeY + radius * 0.04, radius * 0.09, 0, TAU);
          ctx.arc(radius * 0.3 + gazeX, eyeY + radius * 0.04, radius * 0.09, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = '#120b2c';
          ctx.lineWidth = Math.max(0.8, radius * 0.09);
          ctx.beginPath();
          ctx.arc(0, radius * 0.28, radius * 0.22, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
          ctx.restore();
          ctx.restore();
        }

        function drawPlayer(player) {
          const p = playerPosition(player);
          const ground = playerGroundPosition(player);
          const size = Math.max(4.5, halfW * 0.78);
          const raw = clamp((matchTime - player.startedAt) / player.duration, 0, 1);
          const hop = reducedMotion ? 0 : Math.sin(Math.PI * raw);
          const landing = reducedMotion ? 0 : Math.pow(Math.abs(Math.cos(Math.PI * raw)), 7);
          const springHeight = size * (0.78 + hop * 0.36 - landing * 0.12);
          ctx.save();
          ctx.fillStyle = `rgba(0,0,0,${0.3 - hop * 0.1})`;
          ctx.beginPath();
          ctx.ellipse(ground.x, ground.y + size * 0.45, size * (0.66 - hop * 0.18), size * 0.16, 0, 0, TAU);
          ctx.fill();

          ctx.translate(p.x, p.y);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          for (let point = 0; point <= 36; point += 1) {
            const t = point / 36;
            const x = Math.sin(t * TAU * 3) * size * 0.44;
            const y = size * 0.45 - t * springHeight;
            if (point === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = '#2c2724';
          ctx.lineWidth = Math.max(2.8, size * 0.24);
          ctx.stroke();
          ctx.strokeStyle = '#b2a18e';
          ctx.lineWidth = Math.max(1, size * 0.1);
          ctx.stroke();

          ctx.translate(0, size * 0.45 - springHeight - size * 0.65);
          ctx.rotate(reducedMotion ? 0 : Math.sin(raw * TAU + player.driftPhase) * 0.08);
          ctx.scale(size, size);
          drawHazardIcon(player.icon || 'skull');
          ctx.restore();
        }

        function drawHazardIcon(icon) {
          ctx.fillStyle = '#65594e';
          ctx.strokeStyle = '#c4b5a2';
          ctx.lineWidth = 0.1;
          const shape = (points) => {
            ctx.beginPath();
            points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          };
          if (icon === 'skull') {
            ctx.beginPath();
            ctx.moveTo(-0.42, 0.65);
            ctx.lineTo(0.42, 0.65);
            ctx.lineTo(0.48, 0.25);
            ctx.bezierCurveTo(1.05, -0.05, 0.9, -0.95, 0, -0.95);
            ctx.bezierCurveTo(-0.9, -0.95, -1.05, -0.05, -0.48, 0.25);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#1d1917';
            ctx.beginPath();
            ctx.ellipse(-0.32, -0.17, 0.22, 0.25, -0.15, 0, TAU);
            ctx.ellipse(0.32, -0.17, 0.22, 0.25, 0.15, 0, TAU);
            ctx.fill();
            shape([[-0.1, 0.3], [0, 0.1], [0.1, 0.3]]);
            ctx.strokeStyle = '#1d1917';
            ctx.beginPath();
            ctx.moveTo(-0.16, 0.43); ctx.lineTo(-0.16, 0.65);
            ctx.moveTo(0.16, 0.43); ctx.lineTo(0.16, 0.65);
            ctx.stroke();
          } else if (icon === 'dagger') {
            ctx.save();
            ctx.rotate(0.3);
            shape([[0, -1.2], [0.26, -0.5], [0.17, 0.3], [-0.17, 0.3], [-0.26, -0.5]]);
            ctx.beginPath(); ctx.moveTo(0, -0.86); ctx.lineTo(0, 0.26); ctx.stroke();
            ctx.fillStyle = '#3c332c';
            shape([[-0.46, 0.23], [0.46, 0.23], [0.46, 0.4], [0.13, 0.4], [0.13, 0.91], [-0.13, 0.91], [-0.13, 0.4], [-0.46, 0.4]]);
            ctx.restore();
          } else if (icon === 'gun') {
            shape([[-1.05, -0.5], [0.92, -0.5], [0.92, -0.12], [0.35, -0.12], [0.06, 0.77], [-0.48, 0.77], [-0.26, 0.02], [-1.05, 0.02]]);
            ctx.beginPath();
            ctx.moveTo(0.35, -0.02); ctx.lineTo(0.65, -0.02);
            ctx.quadraticCurveTo(0.66, 0.49, 0.18, 0.41);
            ctx.moveTo(0.42, 0.04); ctx.lineTo(0.37, 0.24);
            ctx.stroke();
          } else if (icon === 'whiskey') {
            shape([[-0.22, -1.07], [0.22, -1.07], [0.22, -0.57], [0.55, -0.3], [0.55, 0.85], [-0.55, 0.85], [-0.55, -0.3], [-0.22, -0.57]]);
            ctx.fillStyle = '#b6a286';
            ctx.fillRect(-0.36, -0.01, 0.72, 0.48);
            ctx.fillStyle = '#39312b';
            ctx.fillRect(-0.26, -1.13, 0.52, 0.2);
          } else if (icon === 'cigarette') {
            ctx.save();
            ctx.rotate(-0.3);
            ctx.fillStyle = '#bbb1a1';
            shape([[-1.04, -0.23], [1.04, -0.23], [1.04, 0.23], [-1.04, 0.23]]);
            ctx.fillStyle = '#65503b';
            ctx.fillRect(-1.04, -0.23, 0.6, 0.46);
            ctx.fillStyle = '#322c28';
            ctx.fillRect(0.83, -0.23, 0.21, 0.46);
            ctx.restore();
          }
        }

        function drawSplats() {
          for (const splat of splats) {
            const age = clamp((matchTime - splat.at) / 0.7, 0, 1);
            const spread = halfW * (0.35 + age * 0.8);
            ctx.globalAlpha = 1 - age;
            ctx.fillStyle = `hsl(${splat.hue} 12% 34%)`;
            ctx.beginPath();
            ctx.ellipse(splat.x, splat.y, spread, spread * 0.24, 0, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        function drawSparks() {
          for (const spark of sparks) {
            const age = matchTime - spark.at;
            const t = age / spark.life;
            const x = spark.x + spark.vx * age;
            const y = spark.y + spark.vy * age + halfW * 3 * age * age;
            ctx.globalAlpha = 1 - t;
            ctx.fillStyle = `hsl(${spark.hue} ${spark.hue === TERRITORY.yellow.hue ? 94 : 12}% ${spark.hue === TERRITORY.yellow.hue ? 70 : 55}%)`;
            const size = Math.max(1, halfW * 0.13 * (1 - t));
            ctx.fillRect(x - size * 0.5, y - size * 0.5, size, size);
          }
          ctx.globalAlpha = 1;
        }

        function drawBlink() {
          const elapsed = matchTime - blinkStartedAt;
          const on = reducedMotion || Math.floor(elapsed / 0.12) % 2 === 0;
          if (!on) return;
          ctx.globalAlpha = reducedMotion ? 0.22 : 0.66;
          ctx.fillStyle = `hsl(${TERRITORY[roundWinner].hue} ${TERRITORY[roundWinner].saturation}% 65%)`;
          ctx.fillRect(0, 0, width, height);
          ctx.globalAlpha = 1;
        }

        function envSafeTop() {
          return 0;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function smooth(t) {
          return t * t * (3 - 2 * t);
        }

        function mulberry32(seed) {
          return function next() {
            let t = (seed += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
      })();
    </script>
  </body>
</html>
