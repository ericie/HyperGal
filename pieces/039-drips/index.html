<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Angled brush strikes and scattered splats release wet gravity drips that pool and overflow across a dark field."
    />
    <title>Drips · HyperGal</title>
    <style>
      :root { color-scheme: dark; --ground: oklch(0.09 0.018 265); --focus: oklch(0.82 0.08 85); }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--ground);
      }
      body { min-width: 300px; }
      canvas {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%;
        background: var(--ground);
        cursor: crosshair;
        touch-action: none;
      }
      canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -7px; }
      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="painting"
      tabindex="0"
      aria-describedby="instructions"
      aria-label="Drips: pale brush strikes and splats continually release flowing paint over a dark field."
    ></canvas>
    <p class="instructions" id="instructions">
      The painting builds automatically. Click or tap to begin another pour. Press R, Space, or Enter to clear and begin again.
    </p>

    <script>
      (() => {
        'use strict';

        const canvas = document.querySelector('#painting');
        const ctx = canvas.getContext('2d', { alpha: false });
        const historyCanvas = document.createElement('canvas');
        const historyCtx = historyCanvas.getContext('2d');
        const activeCanvas = document.createElement('canvas');
        const activeCtx = activeCanvas.getContext('2d');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const palette = [
          [239, 236, 220],
          [203, 207, 216],
          [177, 185, 204],
          [226, 224, 211],
          [133, 146, 177],
          [244, 241, 226]
        ];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let seed = Math.floor(Math.random() * 0x7fffffff);
        let random = mulberry32(seed);
        let ridges = [];
        let currentLayer = null;
        let layerCount = 0;
        let layerStartedAt = 0;
        let lastPaintAt = 0;
        let running = !document.hidden;
        let frame = 0;

        resize();
        beginPainting();
        frame = requestAnimationFrame(loop);

        window.addEventListener('resize', () => {
          resize();
          beginPainting();
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
        });

        reducedMotion.addEventListener('change', beginPainting);

        canvas.addEventListener('pointerdown', () => {
          canvas.focus({ preventScroll: true });
          if (reducedMotion.matches) {
            commitLayer(makeLayer(), 1);
            draw();
          } else {
            currentLayer = makeLayer();
            layerStartedAt = performance.now();
          }
        });

        canvas.addEventListener('keydown', (event) => {
          if (!['r', 'R', ' ', 'Enter'].includes(event.key)) return;
          event.preventDefault();
          seed = (seed + 1 + Math.floor(Math.random() * 100000)) >>> 0;
          beginPainting();
        });

        function resize() {
          width = Math.max(300, window.innerWidth);
          height = Math.max(240, window.innerHeight);
          dpr = Math.min(1.6, window.devicePixelRatio || 1);

          for (const target of [canvas, historyCanvas, activeCanvas]) {
            target.width = Math.round(width * dpr);
            target.height = Math.round(height * dpr);
          }
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          historyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          activeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function beginPainting() {
          random = mulberry32(seed);
          layerCount = 0;
          lastPaintAt = 0;
          ridges = makeRidges();
          currentLayer = null;
          clearContext(historyCtx, '#080b12');
          clearContext(activeCtx);

          const openingLayers = reducedMotion.matches ? 24 : 14;
          for (let i = 0; i < openingLayers; i += 1) commitLayer(makeLayer(), 1);

          if (!reducedMotion.matches) {
            currentLayer = makeLayer();
            layerStartedAt = performance.now();
          }
          draw();
        }

        function loop(now) {
          if (
            running
            && !reducedMotion.matches
            && currentLayer
            && now - lastPaintAt >= 1000 / 30
          ) {
            lastPaintAt = now;
            const elapsed = (now - layerStartedAt) / 1000;
            const progress = clamp(elapsed / currentLayer.duration, 0, 1);
            renderLayer(activeCtx, currentLayer, easeOutQuint(progress));
            draw();

            if (progress >= 1) {
              commitActive();
              currentLayer = makeLayer();
              layerStartedAt = now + 90 + random() * 280;
            }
          }

          frame = requestAnimationFrame(loop);
        }

        function makeRidges() {
          const count = height < 560 ? 2 : 3;
          return Array.from({ length: count }, (_, index) => ({
            y: height * (0.61 + index * 0.115) + (random() - 0.5) * height * 0.018
          }));
        }

        function ridgeY(ridge) {
          return ridge.y;
        }

        function makeLayer() {
          const color = palette[Math.floor(random() * palette.length)];
          const mode = chooseWeighted([
            ['veil', 0.34], ['threads', 0.29], ['wash', 0.2], ['dry', 0.17]
          ]);
          const sourceWidth = width * (0.16 + random() * 0.3);
          const placement = (
            hash(seed + 313) + layerCount * 0.61803398875 + (random() - 0.5) * 0.16 + 1
          ) % 1;
          const sourceCenter = lerp(width * 0.08, width * 0.92, placement);
          const sourceLeft = clamp(sourceCenter - sourceWidth * 0.5, 0, width - sourceWidth);
          const source = {
            x: sourceLeft + sourceWidth * 0.5,
            y: height * (0.025 + Math.pow(random(), 1.55) * 0.48),
            width: sourceWidth,
            height: height * (0.014 + random() * 0.036),
            angle: (random() - 0.5) * 0.62
          };
          const layer = {
            color,
            mode,
            source,
            opacity: mode === 'wash' ? 0.09 + random() * 0.1 : 0.16 + random() * 0.27,
            duration: 3.8 + random() * 4.8,
            strokes: [],
            sourceMarks: [],
            splats: []
          };

          const sourceMarks = Math.max(9, Math.floor(sourceWidth / 14));
          for (let i = 0; i < sourceMarks; i += 1) {
            const center = (random() - 0.5) * sourceWidth;
            const across = (random() - 0.5) * source.height;
            const length = sourceWidth * (0.045 + random() * 0.24);
            const bow = (random() - 0.5) * Math.min(10, source.height * 0.32);
            layer.sourceMarks.push({
              points: [
                orientedPoint(source, center - length * 0.5, across + (random() - 0.5) * 3),
                orientedPoint(source, center, across + bow),
                orientedPoint(source, center + length * 0.5, across + (random() - 0.5) * 3)
              ],
              width: 1 + Math.pow(random(), 1.8) * 12,
              alpha: 0.08 + random() * 0.25,
              dryness: 0.25 + random() * 0.68,
              seed: Math.floor(random() * 0x7fffffff)
            });
          }

          const splatCount = 3 + Math.floor(random() * 9);
          for (let i = 0; i < splatCount; i += 1) {
            const along = (random() - 0.5) * sourceWidth * 1.28;
            let across = (random() - 0.5) * source.height * 3.2;
            if (random() < 0.24) across *= 1.8 + random() * 2.6;
            const point = orientedPoint(source, along, across);
            layer.splats.push({
              x: clamp(point.x, -20, width + 20),
              y: clamp(point.y, -20, height * 0.58),
              radius: 1.4 + Math.pow(random(), 1.8) * 12,
              alpha: 0.18 + random() * 0.5,
              delay: random() * 0.16,
              seed: Math.floor(random() * 0x7fffffff)
            });
          }

          const strokeCount = Math.round(sourceWidth / lerp(9, 19, random()));
          for (let i = 0; i < strokeCount; i += 1) {
            const position = (i + random() * 0.9) / strokeCount;
            const sourcePoint = orientedPoint(
              source,
              (position - 0.5) * sourceWidth,
              source.height * (0.18 + random() * 0.48)
            );
            if (random() < (mode === 'dry' ? 0.4 : 0.18)) continue;
            layer.strokes.push(makePourStroke(layer, sourcePoint.x, sourcePoint.y, i, 'brush'));
          }

          for (let i = 0; i < layer.splats.length; i += 1) {
            const splat = layer.splats[i];
            if (splat.radius < 2.2 || random() > 0.58) continue;
            layer.strokes.push(makePourStroke(
              layer,
              splat.x + (random() - 0.5) * splat.radius,
              splat.y + splat.radius * (0.42 + random() * 0.52),
              i + 311,
              'splat'
            ));
          }

          return layer;
        }

        function orientedPoint(source, along, across) {
          const cosine = Math.cos(source.angle);
          const sine = Math.sin(source.angle);
          return {
            x: source.x + along * cosine - across * sine,
            y: source.y + along * sine + across * cosine
          };
        }

        function makePourStroke(layer, x, startY, index, origin) {
          const weightRoll = random();
          const lineWidth = weightRoll < 0.52
            ? 0.55 + random() * 1.35
            : weightRoll < 0.88
              ? 1.8 + random() * 4.2
              : 6 + random() * 12;
          const eligibleRidges = ridges
            .map((ridge, ridgeIndex) => ({ ridge, ridgeIndex }))
            .filter(({ ridge }) => ridgeY(ridge) > startY + height * 0.045);
          const chosen = eligibleRidges.length && random() < 0.78
            ? eligibleRidges[Math.floor(Math.pow(random(), 1.45) * eligibleRidges.length)]
            : null;
          const chosenRidge = chosen
            ? chosen.ridgeIndex
            : -1;
          const collisionY = chosen
            ? ridgeY(chosen.ridge)
            : Math.max(startY + height * 0.14, height * (0.76 + random() * 0.34));
          const stopShort = random() < (origin === 'splat' ? 0.18 : layer.mode === 'dry' ? 0.34 : 0.14);
          const endY = stopShort
            ? lerp(startY + height * 0.035, collisionY, 0.22 + random() * 0.58)
            : collisionY;
          const points = verticalRun(x, startY, endY, lineWidth, index);
          const deposits = [];
          const strokeSeed = Math.floor(random() * 0x7fffffff);

          if (!stopShort && chosenRidge >= 0) {
            const direction = random() < 0.5 ? -1 : 1;
            const spread = width * (0.018 + random() * 0.095);
            const spillX = clamp(x + direction * spread, 0, width);
            const shelfPoints = [];
            const shelfSteps = 4 + Math.floor(random() * 5);
            for (let step = 0; step <= shelfSteps; step += 1) {
              const shelfX = lerp(x, spillX, step / shelfSteps);
              shelfPoints.push({ x: shelfX, y: ridgeY(ridges[chosenRidge], shelfX) - lineWidth * 0.3 });
            }
            deposits.push({
              kind: 'shelf',
              points: shelfPoints,
              width: lineWidth * (0.7 + random() * 2.4),
              alpha: 0.2 + random() * 0.5,
              delay: 0.58 + random() * 0.18,
              dryness: 0.18 + random() * 0.56,
              seed: strokeSeed + 701
            });

            if (random() < 0.62) {
              const nextY = chosenRidge + 1 < ridges.length
                ? ridgeY(ridges[chosenRidge + 1], spillX)
                : height * (0.91 + random() * 0.16);
              deposits.push({
                kind: 'overflow',
                points: verticalRun(spillX, shelfPoints.at(-1).y, nextY, lineWidth * 0.72, index + 117),
                width: Math.max(0.4, lineWidth * (0.42 + random() * 0.72)),
                alpha: 0.18 + random() * 0.48,
                delay: 0.7 + random() * 0.2,
                dryness: 0.12 + random() * 0.45,
                seed: strokeSeed + 1409
              });
            }
          }

          return {
            origin,
            points,
            deposits,
            width: lineWidth,
            alpha: 0.24 + random() * 0.68,
            delay: 0.1 + random() * 0.2,
            speed: 0.76 + random() * 0.46,
            seed: strokeSeed
          };
        }

        function verticalRun(x, fromY, toY, lineWidth, salt) {
          const distance = Math.max(1, toY - fromY);
          const steps = clamp(Math.ceil(distance / 34), 5, 28);
          const drift = Math.min(9, 1.2 + lineWidth * 0.72);
          const phase = random() * Math.PI * 2 + salt;
          const points = [];
          for (let step = 0; step <= steps; step += 1) {
            const progress = step / steps;
            const taper = Math.sin(progress * Math.PI);
            points.push({
              x: x + Math.sin(progress * Math.PI * 2 + phase) * drift * taper,
              y: lerp(fromY, toY, progress)
            });
          }
          return points;
        }

        function renderLayer(context, layer, progress) {
          clearContext(context);
          context.save();
          context.globalCompositeOperation = 'source-over';

          const sourceProgress = clamp(progress / 0.24, 0, 1);
          for (const mark of layer.sourceMarks) {
            const visible = clamp((sourceProgress - mark.alpha * 0.25) * 1.4, 0, 1);
            if (visible <= 0) continue;
            paintBrushPath(
              context,
              mark.points,
              visible,
              mark.width,
              layer.opacity * (0.45 + mark.alpha * 1.2),
              layer.color,
              mark.dryness,
              mark.seed
            );
          }

          for (const splat of layer.splats) {
            const visible = clamp((sourceProgress - splat.delay) / (1 - splat.delay), 0, 1);
            if (visible <= 0) continue;
            paintSplat(context, splat, easeOutQuart(visible), layer.color, layer.opacity * splat.alpha);
          }

          for (const stroke of layer.strokes) {
            const local = clamp((progress - stroke.delay) * stroke.speed / (1 - stroke.delay), 0, 1);
            if (local <= 0) continue;
            paintFluidPath(
              context,
              stroke.points,
              local,
              stroke.width,
              layer.opacity * stroke.alpha,
              layer.color,
              stroke.seed
            );

            for (const deposit of stroke.deposits) {
              const depositProgress = clamp((progress - deposit.delay) / (1 - deposit.delay), 0, 1);
              if (depositProgress <= 0) continue;
              const easedDeposit = easeOutQuart(depositProgress);
              if (deposit.kind === 'shelf') {
                paintShelfDeposit(
                  context,
                  deposit.points,
                  easedDeposit,
                  deposit.width,
                  layer.opacity * deposit.alpha,
                  layer.color,
                  deposit.dryness,
                  deposit.seed
                );
              } else {
                paintFluidPath(
                  context,
                  deposit.points,
                  easedDeposit,
                  deposit.width,
                  layer.opacity * deposit.alpha,
                  layer.color,
                  deposit.seed
                );
              }
            }
          }
          context.restore();
        }

        function paintFluidPath(context, points, progress, width, opacity, color, flowSeed) {
          if (points.length < 2 || progress <= 0 || opacity <= 0) return;
          const [r, g, b] = color;

          context.save();
          context.filter = `blur(${Math.min(1.8, 0.42 + width * 0.08)}px)`;
          context.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.3})`;
          context.lineWidth = width * 1.42;
          context.lineCap = 'round';
          context.lineJoin = 'round';
          context.setLineDash([]);
          traceBrushPath(context, points, progress, 0, flowSeed + 43, 0.12 + width * 0.025);
          context.stroke();
          context.restore();

          const currents = width < 1.1 ? 2 : clamp(3 + Math.floor(width * 0.3), 3, 7);
          for (let current = 0; current < currents; current += 1) {
            const currentSeed = flowSeed + 211 + current * 1291;
            const placement = currents === 1 ? 0 : current / (currents - 1) - 0.5;
            const offset = placement * width * (0.48 + hash(currentSeed + 3) * 0.28);
            context.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity * (0.24 + hash(currentSeed + 7) * 0.34)})`;
            context.lineWidth = Math.max(
              0.34,
              width / currents * (0.68 + hash(currentSeed + 11) * 1.18)
            );
            context.lineCap = 'round';
            context.lineJoin = 'round';
            context.setLineDash([]);
            traceBrushPath(
              context,
              points,
              progress,
              offset,
              currentSeed,
              0.12 + Math.min(0.42, width * 0.035)
            );
            context.stroke();
          }

          if (width > 1.25) {
            paintPigmentDaubs(context, points, progress, width * 1.12, opacity * 0.72, color, 0.04, flowSeed + 907);
          }

          const tip = pointOnPath(points, progress);
          const bead = Math.max(1.15, width * (0.62 + hash(flowSeed + 101) * 0.34));
          context.save();
          context.filter = `blur(${Math.min(0.85, bead * 0.12)}px)`;
          context.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.46})`;
          context.beginPath();
          context.ellipse(tip.x, tip.y + bead * 0.28, bead * 0.68, bead * 1.15, 0, 0, Math.PI * 2);
          context.fill();
          context.restore();

          context.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.42})`;
          context.beginPath();
          context.ellipse(
            tip.x - bead * 0.12,
            tip.y,
            bead * 0.32,
            bead * 0.62,
            0,
            0,
            Math.PI * 2
          );
          context.fill();
        }

        function paintSplat(context, splat, progress, color, opacity) {
          const [r, g, b] = color;
          const radius = splat.radius * (0.35 + progress * 0.65);

          context.save();
          context.filter = `blur(${Math.min(1.1, 0.25 + radius * 0.06)}px)`;
          context.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.28})`;
          traceSplat(context, splat.x, splat.y, radius * 1.18, splat.seed + 13);
          context.fill();
          context.restore();

          context.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.72})`;
          traceSplat(context, splat.x, splat.y, radius, splat.seed + 29);
          context.fill();

          const satellites = 3 + Math.floor(hash(splat.seed + 37) * 7);
          for (let index = 0; index < satellites; index += 1) {
            const satelliteSeed = splat.seed + 101 + index * 809;
            const angle = hash(satelliteSeed + 3) * Math.PI * 2;
            const distance = radius * (1.45 + hash(satelliteSeed + 7) * 4.2);
            const satelliteRadius = radius * (0.08 + hash(satelliteSeed + 11) * 0.2);
            const x = splat.x + Math.cos(angle) * distance;
            const y = splat.y + Math.sin(angle) * distance;
            context.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * (0.28 + hash(satelliteSeed + 17) * 0.38)})`;
            context.beginPath();
            context.ellipse(
              x,
              y,
              satelliteRadius * (0.72 + hash(satelliteSeed + 19) * 0.56),
              satelliteRadius * (0.72 + hash(satelliteSeed + 23) * 0.72),
              angle,
              0,
              Math.PI * 2
            );
            context.fill();
          }
        }

        function traceSplat(context, x, y, radius, splatSeed) {
          const points = [];
          const pointCount = 13;
          for (let index = 0; index < pointCount; index += 1) {
            const angle = index / pointCount * Math.PI * 2;
            const reach = radius * (0.72 + hash(splatSeed + index * 463) * 0.52);
            points.push({
              x: x + Math.cos(angle) * reach,
              y: y + Math.sin(angle) * reach
            });
          }

          const last = points.at(-1);
          const first = points[0];
          context.beginPath();
          context.moveTo((last.x + first.x) * 0.5, (last.y + first.y) * 0.5);
          for (let index = 0; index < pointCount; index += 1) {
            const point = points[index];
            const next = points[(index + 1) % pointCount];
            context.quadraticCurveTo(
              point.x,
              point.y,
              (point.x + next.x) * 0.5,
              (point.y + next.y) * 0.5
            );
          }
          context.closePath();
        }

        function pointOnPath(points, progress) {
          const scaled = clamp(progress, 0, 1) * (points.length - 1);
          const index = Math.floor(scaled);
          if (index >= points.length - 1) return points.at(-1);
          const fraction = scaled - index;
          return {
            x: lerp(points[index].x, points[index + 1].x, fraction),
            y: lerp(points[index].y, points[index + 1].y, fraction)
          };
        }

        function paintBrushPath(context, points, progress, width, opacity, color, dryness, brushSeed) {
          if (points.length < 2 || progress <= 0 || opacity <= 0) return;
          const [r, g, b] = color;

          // A wet halo lets adjacent hairs merge without turning the mark into a
          // mathematically uniform ribbon.
          if (width > 0.7 && dryness < 0.82) {
            context.save();
            context.filter = `blur(${Math.min(1.35, 0.28 + width * 0.07)}px)`;
            context.lineCap = 'round';
            context.lineJoin = 'round';
            context.setLineDash([]);
            context.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity * (0.1 + (1 - dryness) * 0.16)})`;
            context.lineWidth = width * (1.08 + (1 - dryness) * 0.28);
            traceBrushPath(context, points, progress, 0, brushSeed + 53, 0.16 + dryness * 0.28);
            context.stroke();
            context.restore();
          }

          const bristleCount = width < 0.78 ? 1 : clamp(2 + Math.floor(width * 0.78), 2, 11);
          for (let bristle = 0; bristle < bristleCount; bristle += 1) {
            const bristleSeed = brushSeed + bristle * 1543;
            const placement = bristleCount === 1 ? 0.5 : bristle / (bristleCount - 1);
            const spread = width * (0.72 + hash(bristleSeed + 3) * 0.28);
            const offset = (placement - 0.5) * spread;
            const pigment = 0.78 + hash(bristleSeed + 7) * 0.28;
            const bristleOpacity = opacity * (
              bristleCount === 1
                ? 0.72 + hash(bristleSeed + 11) * 0.24
                : 0.22 + hash(bristleSeed + 11) * 0.36
            );

            context.strokeStyle = `rgba(${Math.round(r * pigment)}, ${Math.round(g * pigment)}, ${Math.round(b * pigment)}, ${bristleOpacity})`;
            context.lineWidth = bristleCount === 1
              ? Math.max(0.28, width * (0.52 + hash(bristleSeed + 19) * 0.38))
              : Math.max(0.22, width / bristleCount * (0.58 + hash(bristleSeed + 19) * 1.12));
            context.lineCap = hash(bristleSeed + 23) > dryness * 0.62 ? 'round' : 'butt';
            context.lineJoin = 'round';

            if (dryness > 0.34 && hash(bristleSeed + 29) < dryness * 0.82) {
              const fleck = 0.8 + hash(bristleSeed + 31) * 4.8;
              const gap = 2.8 + dryness * 8 + hash(bristleSeed + 37) * 8;
              context.setLineDash([fleck, gap]);
              context.lineDashOffset = hash(bristleSeed + 41) * (fleck + gap);
            } else {
              context.setLineDash([]);
              context.lineDashOffset = 0;
            }

            traceBrushPath(
              context,
              points,
              progress,
              offset,
              bristleSeed,
              0.42 + dryness * 1.65 + Math.min(0.7, width * 0.07)
            );
            context.stroke();
          }
          context.setLineDash([]);
          context.lineDashOffset = 0;

          if (width > 2.2) {
            paintPigmentDaubs(context, points, progress, width, opacity, color, dryness, brushSeed);
          }
        }

        function paintShelfDeposit(context, points, progress, width, opacity, color, dryness, brushSeed) {
          const [r, g, b] = color;
          const loadedWidth = width * (1.35 + hash(brushSeed + 59) * 0.85);
          paintPigmentDaubs(
            context,
            points,
            progress,
            loadedWidth,
            opacity * 1.5,
            color,
            Math.min(0.82, dryness + 0.12),
            brushSeed + 67
          );

          const scratches = clamp(3 + Math.floor(width * 0.55), 3, 9);
          for (let scratch = 0; scratch < scratches; scratch += 1) {
            const scratchSeed = brushSeed + 503 + scratch * 1877;
            const offset = (hash(scratchSeed + 3) - 0.5) * loadedWidth;
            const fleck = 0.8 + hash(scratchSeed + 7) * 5.2;
            const gap = 3 + hash(scratchSeed + 11) * 13 + dryness * 5;
            context.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity * (0.14 + hash(scratchSeed + 13) * 0.24)})`;
            context.lineWidth = Math.max(0.24, width * (0.08 + hash(scratchSeed + 17) * 0.16));
            context.lineCap = 'round';
            context.lineJoin = 'round';
            context.setLineDash([fleck, gap]);
            context.lineDashOffset = hash(scratchSeed + 19) * (fleck + gap);
            traceBrushPath(
              context,
              points,
              progress,
              offset,
              scratchSeed,
              0.8 + dryness * 2.2
            );
            context.stroke();
          }
          context.setLineDash([]);
          context.lineDashOffset = 0;
        }

        function paintPigmentDaubs(context, points, progress, width, opacity, color, dryness, brushSeed) {
          const [r, g, b] = color;
          const scaled = clamp(progress, 0, 1) * (points.length - 1);
          const whole = Math.floor(scaled);
          const fraction = scaled - whole;
          const visiblePoints = points.slice(0, whole + 1);
          if (whole < points.length - 1 && fraction > 0) {
            visiblePoints.push({
              x: lerp(points[whole].x, points[whole + 1].x, fraction),
              y: lerp(points[whole].y, points[whole + 1].y, fraction)
            });
          }

          const spacing = Math.max(4.5, width * 0.72);
          for (let segment = 1; segment < visiblePoints.length; segment += 1) {
            const from = visiblePoints[segment - 1];
            const to = visiblePoints[segment];
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const distance = Math.hypot(dx, dy);
            const steps = Math.max(1, Math.ceil(distance / spacing));
            const tangent = Math.atan2(dy, dx);
            const normalX = distance ? -dy / distance : 0;
            const normalY = distance ? dx / distance : 1;

            for (let step = 0; step < steps; step += 1) {
              const stampSeed = brushSeed + segment * 4001 + step * 137;
              if (hash(stampSeed + 5) < dryness * 0.16) continue;
              const t = (step + hash(stampSeed + 11) * 0.8) / steps;
              const edge = (hash(stampSeed + 17) - 0.5) * width * 0.5;
              const x = lerp(from.x, to.x, t) + normalX * edge;
              const y = lerp(from.y, to.y, t) + normalY * edge;
              const along = spacing * (0.34 + hash(stampSeed + 23) * 0.42);
              const across = width * (0.13 + hash(stampSeed + 29) * 0.24);
              const shade = 0.86 + hash(stampSeed + 31) * 0.16;
              context.fillStyle = `rgba(${Math.round(r * shade)}, ${Math.round(g * shade)}, ${Math.round(b * shade)}, ${opacity * (0.05 + (1 - dryness) * 0.1)})`;
              context.beginPath();
              context.ellipse(x, y, along, across, tangent, 0, Math.PI * 2);
              context.fill();
            }
          }
        }

        function traceBrushPath(context, points, progress, offset, brushSeed, jitter) {
          const scaled = clamp(progress, 0, 1) * (points.length - 1);
          const whole = Math.floor(scaled);
          const fraction = scaled - whole;
          const visiblePoints = points.slice(0, whole + 1);
          if (whole < points.length - 1 && fraction > 0) {
            visiblePoints.push({
              x: lerp(points[whole].x, points[whole + 1].x, fraction),
              y: lerp(points[whole].y, points[whole + 1].y, fraction)
            });
          }
          if (visiblePoints.length < 2) return;

          const brushed = visiblePoints.map((point, index) => {
            const before = visiblePoints[Math.max(0, index - 1)];
            const after = visiblePoints[Math.min(visiblePoints.length - 1, index + 1)];
            const dx = after.x - before.x;
            const dy = after.y - before.y;
            const magnitude = Math.hypot(dx, dy) || 1;
            const tangentX = dx / magnitude;
            const tangentY = dy / magnitude;
            const normalX = -tangentY;
            const normalY = tangentX;
            const edgeWander = (hash(brushSeed + index * 977 + 101) - 0.5) * jitter;
            const grainDrag = (hash(brushSeed + index * 1481 + 211) - 0.5) * jitter * 0.32;
            return {
              x: point.x + normalX * (offset + edgeWander) + tangentX * grainDrag,
              y: point.y + normalY * (offset + edgeWander) + tangentY * grainDrag
            };
          });

          context.beginPath();
          context.moveTo(brushed[0].x, brushed[0].y);
          if (brushed.length === 2) {
            context.lineTo(brushed[1].x, brushed[1].y);
            return;
          }
          for (let i = 1; i < brushed.length - 1; i += 1) {
            const point = brushed[i];
            const next = brushed[i + 1];
            context.quadraticCurveTo(
              point.x,
              point.y,
              (point.x + next.x) * 0.5,
              (point.y + next.y) * 0.5
            );
          }
          context.lineTo(brushed.at(-1).x, brushed.at(-1).y);
        }

        function commitLayer(layer, progress) {
          renderLayer(activeCtx, layer, progress);
          commitActive();
        }

        function commitActive() {
          historyCtx.save();
          historyCtx.setTransform(1, 0, 0, 1, 0, 0);
          historyCtx.drawImage(activeCanvas, 0, 0);
          historyCtx.restore();
          clearContext(activeCtx);
          layerCount += 1;

          if (layerCount % 28 === 0) {
            historyCtx.save();
            historyCtx.fillStyle = 'rgba(8, 11, 18, 0.12)';
            historyCtx.fillRect(0, 0, width, height);
            historyCtx.restore();
          }
        }

        function draw() {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = '#080b12';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(historyCanvas, 0, 0);
          ctx.drawImage(activeCanvas, 0, 0);
          ctx.restore();
        }

        function clearContext(context, fill) {
          context.save();
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, Math.round(width * dpr), Math.round(height * dpr));
          if (fill) {
            context.fillStyle = fill;
            context.fillRect(0, 0, Math.round(width * dpr), Math.round(height * dpr));
          }
          context.restore();
        }

        function chooseWeighted(entries) {
          let roll = random();
          for (const [value, weight] of entries) {
            roll -= weight;
            if (roll <= 0) return value;
          }
          return entries.at(-1)[0];
        }

        function hash(value) {
          let x = value | 0;
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
          x ^= x >>> 16;
          return (x >>> 0) / 4294967295;
        }

        function mulberry32(value) {
          let state = value >>> 0;
          return () => {
            state += 0x6d2b79f5;
            let result = state;
            result = Math.imul(result ^ (result >>> 15), result | 1);
            result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
            return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
          };
        }

        function easeOutQuart(value) { return 1 - Math.pow(1 - value, 4); }
        function easeOutQuint(value) { return 1 - Math.pow(1 - value, 5); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      })();
    </script>
  </body>
