<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Mineral ink spreads through a shared water surface, folding blue currents and muted color into drifting Suminagashi veins."
    />
    <title>Marbled Water · HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --panel: #e8e6df;
        --panel-ink: #171918;
        --panel-muted: #5f625e;
        --panel-rule: #a6a69f;
        --focus: #005fcc;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #d9e2e5;
      }

      body {
        min-width: 320px;
        font-family: "Helvetica Neue", Helvetica, system-ui, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      #bath {
        z-index: 0;
        background: #d9e2e5;
        pointer-events: none;
      }

      #stage {
        z-index: 1;
        cursor: crosshair;
        touch-action: none;
      }

      #effects {
        z-index: 2;
        pointer-events: none;
      }

      canvas:focus-visible {
        outline: 2px solid #171918;
        outline-offset: -7px;
      }

      .water-panel {
        position: fixed;
        z-index: 10;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        display: flex;
        width: min(306px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        flex-direction: column;
        border: 1px solid var(--panel-ink);
        border-radius: 2px;
        background: var(--panel);
        box-shadow: 0 3px 8px rgba(15, 35, 49, 0.28);
        color: var(--panel-ink);
        font-size: 12px;
        line-height: 1.2;
        user-select: none;
      }

      .panel-header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 45px;
        padding: 7px 8px 7px 11px;
        border-bottom: 1px solid var(--panel-ink);
        cursor: grab;
        touch-action: none;
      }

      .panel-heading { min-width: 0; }

      .panel-heading h1 {
        margin: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.05;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-version {
        margin-left: 5px;
        color: var(--panel-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.04em;
        vertical-align: 1px;
      }

      .panel-heading p {
        margin: 3px 0 0;
        overflow: hidden;
        color: var(--panel-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.025em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      .panel-button {
        display: grid;
        place-items: center;
        border: 1px solid var(--panel-ink);
        border-radius: 1px;
        background: transparent;
        color: var(--panel-ink);
        cursor: pointer;
      }

      .panel-button {
        width: 29px;
        height: 29px;
        padding: 0;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
      }

      .panel-button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .panel-button[data-action="collapse"]::before,
      .panel-button[data-action="collapse"]::after {
        position: absolute;
        width: 11px;
        height: 1px;
        background: currentColor;
        content: "";
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .panel-button[data-action="collapse"] { position: relative; }
      .panel-button[data-action="collapse"]::after { transform: rotate(90deg); }
      .panel-button[data-action="collapse"][aria-expanded="true"]::after {
        transform: rotate(90deg) scaleX(0);
      }

      .panel-button[data-action="reseed"] {
        background: var(--panel-ink);
        color: var(--panel);
        font-size: 18px;
      }

      .panel-button:hover {
        background: #fff;
        color: #000;
      }

      .panel-button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .water-panel.is-dragging {
        will-change: transform;
      }

      .water-panel.is-dragging .panel-header { cursor: grabbing; }
      .water-panel.is-collapsed { width: 230px; }
      .water-panel.is-collapsed .panel-header { border-bottom: 0; }
      .water-panel.is-collapsed .panel-controls,
      .water-panel.is-collapsed .panel-note,
      .water-panel.is-collapsed .panel-heading p { display: none; }

      .panel-controls {
        min-height: 0;
        padding: 7px 10px 9px;
        overflow-y: auto;
      }

      .group-title {
        margin: 0 0 2px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }

      .palette-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 150px;
        align-items: center;
        gap: 8px;
        min-height: 39px;
        padding-block: 7px;
        border-bottom: 1px solid var(--panel-rule);
      }

      .palette-row label,
      .range-row label { font-weight: 650; }

      .palette-row select {
        width: 100%;
        height: 26px;
        padding: 2px 24px 2px 6px;
        border: 1px solid var(--panel-ink);
        border-radius: 1px;
        background: var(--panel);
        color: var(--panel-ink);
        font: 11px/1.1 "Helvetica Neue", Helvetica, system-ui, sans-serif;
        cursor: pointer;
      }

      .range-row {
        --progress: 50%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 64px;
        align-items: center;
        column-gap: 8px;
        min-height: 36px;
      }

      .control-value {
        color: var(--panel-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .range-row input[type="range"] {
        grid-column: 1 / 3;
        width: 100%;
        height: 10px;
        margin: -5px 0 0;
        padding: 0;
        appearance: none;
        background: transparent;
        cursor: ew-resize;
      }

      .range-row input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--panel-ink) 0 var(--progress),
          var(--panel-rule) var(--progress) 100%
        );
      }

      .range-row input[type="range"]::-webkit-slider-thumb {
        width: 10px;
        height: 14px;
        margin-top: -6px;
        border: 1px solid var(--panel-ink);
        border-radius: 0;
        appearance: none;
        background: var(--panel);
      }

      .range-row input[type="range"]::-moz-range-track {
        height: 2px;
        border: 0;
        background: var(--panel-rule);
      }

      .range-row input[type="range"]::-moz-range-progress {
        height: 2px;
        background: var(--panel-ink);
      }

      .range-row input[type="range"]::-moz-range-thumb {
        width: 9px;
        height: 13px;
        border: 1px solid var(--panel-ink);
        border-radius: 0;
        background: var(--panel);
      }

      .panel-note {
        flex: 0 0 auto;
        margin: 0;
        padding: 8px 10px 9px;
        border-top: 1px solid var(--panel-ink);
        color: var(--panel-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9px;
        line-height: 1.35;
      }

      .no-panel .water-panel { display: none; }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        .water-panel {
          top: max(10px, env(safe-area-inset-top));
          left: max(10px, env(safe-area-inset-left));
          width: min(270px, calc(100vw - 20px));
          max-height: calc(100vh - 20px);
        }

        .panel-header { min-height: 41px; padding-block: 5px; }
        .panel-controls { padding-top: 5px; }
        .range-row { min-height: 34px; }
        .panel-note { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .panel-button[data-action="collapse"]::before,
        .panel-button[data-action="collapse"]::after {
          transition: none;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas id="bath" aria-hidden="true"></canvas>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Marbled Water: a gently flowing blue-gray Suminagashi bath. Colored drops move earlier pigment outward and stretch into fine folds. Click to add ink; Space pauses and R starts a new bath."
    ></canvas>
    <canvas id="effects" aria-hidden="true"></canvas>

    <aside class="water-panel is-collapsed" aria-label="Marbled water controls">
      <div class="panel-header">
        <div class="panel-heading">
          <h1>Marbled Water <span class="panel-version">V15</span></h1>
          <p id="bath-number">BATH 0000 · INK 000</p>
        </div>
        <div class="panel-actions">
          <button
            class="panel-button"
            id="collapse-panel"
            data-action="collapse"
            type="button"
            aria-controls="water-controls"
            aria-expanded="false"
            aria-label="Expand marbling controls"
            title="Expand controls"
          ></button>
          <button
            class="panel-button"
            id="reseed"
            data-action="reseed"
            type="button"
            aria-label="Start a new bath"
            title="Start a new bath"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M15.7 6.3V2.8m0 3.5h-3.5" />
              <path d="M15.2 5.2a7 7 0 1 0 1.5 7.4" />
            </svg>
          </button>
        </div>
      </div>

      <div class="panel-controls" id="water-controls">
        <section class="control-group" aria-labelledby="ink-title">
          <h2 class="group-title" id="ink-title">Mineral ink</h2>
          <div class="palette-row">
            <label for="palette">Palette</label>
            <select id="palette">
              <option value="0">Ebru classic</option>
              <option value="1" selected>Mineral current</option>
              <option value="2">Garden pigments</option>
              <option value="3">Oxide press</option>
              <option value="4">Sea glass</option>
              <option value="5">Earth and oxide</option>
            </select>
          </div>

          <div class="range-row">
            <label for="tempo">Drop tempo</label>
            <output class="control-value" for="tempo">8/min</output>
            <input id="tempo" type="range" min="1" max="14" value="8" />
          </div>

          <div class="range-row">
            <label for="drop-size">Drop size</label>
            <output class="control-value" for="drop-size">4.2%</output>
            <input id="drop-size" type="range" min="15" max="100" value="42" />
          </div>

          <div class="range-row">
            <label for="size-variation">Edge variation</label>
            <output class="control-value" for="size-variation">42%</output>
            <input id="size-variation" type="range" min="0" max="100" value="42" />
          </div>

          <div class="range-row">
            <label for="repulsion">Push strength</label>
            <output class="control-value" for="repulsion">100%</output>
            <input id="repulsion" type="range" min="50" max="160" value="100" />
          </div>

        </section>
      </div>

      <p class="panel-note">CLICK TO DROP INK · SPACE PAUSE · R NEW BATH</p>
    </aside>

    <p id="status" class="status" aria-live="polite"></p>

    <script src="./fluid.js?v=15"></script>
    <script src="./renderer.js?v=15"></script>
  </body>
</html>
