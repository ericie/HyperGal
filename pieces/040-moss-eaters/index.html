<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta
      name="description"
      content="A small colony of grazers mows dark, noise-grown clouds of moss in tightly packed lanes, prospecting between patches."
    />
    <title>Moss Eaters · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #6d7168;
        --focus: #eef1eb;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        min-width: 300px;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
        cursor: crosshair;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: -8px;
      }

      .instructions {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="field"
      tabindex="0"
      aria-describedby="instructions"
      aria-label="Moss Eaters. A small colony of caterpillar-like grazers mows dark pixel clouds of moss in tightly packed lanes, prospecting between patches."
    ></canvas>
    <p class="instructions" id="instructions">
      The grazers feed automatically. Click or tap to move the nearest one there. Press R or Enter for a new field. Press Space to pause or resume.
    </p>
    <p class="instructions" id="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.querySelector('#field');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.querySelector('#status');
        const groundCanvas = document.createElement('canvas');
        const groundCtx = groundCanvas.getContext('2d', { alpha: false });
        const trailCanvas = document.createElement('canvas');
        const trailCtx = trailCanvas.getContext('2d');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const maturePreview = new URLSearchParams(location.search).get('preview') === 'mature';
        const TAU = Math.PI * 2;
        const CELL = 3;
        const MAX_DPR = 1.5;
        // Exposed stone still carries a trace of growth; a full carpet is 1.
        const BARE = 0.03;
        // Moss thinner than this is not worth laying a lane through. The grazer
        // still eats whatever it happens to walk over while prospecting.
        const LANE_FOOD = 0.5;

        const mossColors = [
          '#252c26', '#2d352d', '#343c32', '#3b4338',
          '#202820', '#444a3d', '#30382f', '#1d251f'
        ];
        const stoneColors = ['#c6ccc8', '#d3d7d4', '#b9c1bc', '#dfe2de'];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let columns = 0;
        let rows = 0;
        let food = new Float32Array(0);
        let moss = new Float32Array(0);
        let centerline = new Uint16Array(0);
        let worms = [];
        // Every sweep ever started on this field. A grazer arriving beside
        // lanes already laid, by itself or by another, joins that sweep.
        let sweeps = [];
        let random = Math.random;
        let seed = readSeed();
        let lastTime = 0;
        let frameRequest = 0;
        let running = !document.hidden;
        let paused = false;
        let pathMetrics = { entered: 0, revisited: 0, turns: 0, lanes: 0, prospects: 0 };

        window.__mossDiagnostics = () => ({
          ...pathMetrics,
          overlapRate: pathMetrics.entered
            ? pathMetrics.revisited / pathMetrics.entered
            : 0,
          bugs: worms.length,
          modes: worms.map(worm => worm.mode),
          sweeps: sweeps.length,
          eatenFraction: eatenFraction()
        });

        resize();
        startField();
        frameRequest = requestAnimationFrame(loop);

        window.addEventListener('resize', () => {
          resize();
          startField();
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
        });

        reducedMotion.addEventListener('change', startField);

        canvas.addEventListener('pointerdown', (event) => {
          canvas.focus({ preventScroll: true });
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          placeGrazer(x, y);

          if (reducedMotion.matches) {
            growStillLife(400);
            draw();
          }

          announce('A grazer moved to a new patch.');
        });

        canvas.addEventListener('keydown', (event) => {
          if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault();
            paused = !paused;
            announce(paused ? 'Grazing paused.' : 'Grazing resumed.');
            return;
          }

          if (!['r', 'R', 'Enter'].includes(event.key)) return;
          event.preventDefault();
          seed = (seed + 1 + Math.floor(Math.random() * 0x7fffff)) >>> 0;
          startField();
          announce('A new moss field has grown.');
        });

        function resize() {
          width = Math.max(300, innerWidth);
          height = Math.max(240, innerHeight);
          dpr = Math.min(MAX_DPR, devicePixelRatio || 1);

          for (const target of [canvas, groundCanvas, trailCanvas]) {
            target.width = Math.round(width * dpr);
            target.height = Math.round(height * dpr);
          }

          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          groundCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

          columns = Math.ceil(width / CELL);
          rows = Math.ceil(height / CELL);
          food = new Float32Array(columns * rows);
          moss = new Float32Array(columns * rows);
          centerline = new Uint16Array(columns * rows);
        }

        function startField() {
          random = mulberry32(seed);
          paused = false;
          initializeMoss();
          worms = [];
          sweeps = [];
          centerline.fill(0);
          pathMetrics = { entered: 0, revisited: 0, turns: 0, lanes: 0, prospects: 0 };
          paintGround();
          clear(trailCtx);

          // A small colony, sized to the field, each placed in its own rich
          // patch.
          const colony = clamp(Math.round(width * height / 150000), 3, 9);
          for (let i = 0; i < colony; i += 1) {
            const start = findRichMoss(32);
            worms.push(makeWorm(start.x, start.y, random() * TAU));
          }

          // The field opens with a short history already laid, so the first
          // lanes and hairpins are there to read from the start. The private
          // preview runs much longer for the catalog thumbnail.
          growStillLife(maturePreview ? 1500 : 700);

          lastTime = performance.now();
          draw();
        }

        function paintGround() {
          clear(groundCtx, '#70746b');

          // Each noise cell becomes a small cloud of dark square pixels. Dense
          // cells receive more, larger, and more opaque pixels; sparse cells
          // remain mostly exposed stone rather than becoming a smooth wash.
          const perCell = CELL * CELL / 36;
          for (let gy = 0; gy < rows; gy += 1) {
            for (let gx = 0; gx < columns; gx += 1) {
              const density = moss[gy * columns + gx];
              const expected = (Math.pow(density, 1.3) * 13 + random() * density * 5) * perCell;
              const pixels = Math.floor(expected) + (random() < expected % 1 ? 1 : 0);
              for (let i = 0; i < pixels; i += 1) {
                const x = Math.round(gx * CELL + random() * CELL);
                const y = Math.round(gy * CELL + random() * CELL);
                const size = 0.45 + random() * (0.7 + density * 1.8);
                groundCtx.globalAlpha = 0.28 + density * 0.55 + random() * 0.15;
                groundCtx.fillStyle = mossColors[Math.floor(random() * mossColors.length)];
                groundCtx.fillRect(x, y, size, size * (0.55 + random() * 0.8));
              }
            }
          }

          // Rich regions carry compact satellite clusters, giving the cloud
          // ragged local edges without introducing soft blobs or polygons.
          const clusters = Math.round(width * height / 70);
          for (let i = 0; i < clusters; i += 1) {
            const x = random() * width;
            const y = random() * height;
            const density = mossAt(x, y);
            if (random() > Math.pow(density, 1.35)) continue;
            const count = 2 + Math.floor(density * 7);
            const spread = 1 + density * 4.5;
            for (let pixel = 0; pixel < count; pixel += 1) {
              const px = Math.round(x + (random() - 0.5) * spread * 2);
              const py = Math.round(y + (random() - 0.5) * spread * 2);
              const size = 0.6 + random() * (0.8 + density * 1.7);
              groundCtx.globalAlpha = 0.3 + density * 0.48;
              groundCtx.fillStyle = mossColors[Math.floor(random() * mossColors.length)];
              groundCtx.fillRect(px, py, size, size);
            }
          }

          // A few pale flecks remain caught in the moss.
          const flecks = Math.round(width * height / 610);
          groundCtx.fillStyle = '#c7ccc7';
          for (let i = 0; i < flecks; i += 1) {
            groundCtx.globalAlpha = 0.08 + random() * 0.18;
            const size = 0.35 + random() * 1.15;
            groundCtx.fillRect(random() * width, random() * height, size, size);
          }

          groundCtx.globalAlpha = 1;
        }

        function initializeMoss() {
          for (let gy = 0; gy < rows; gy += 1) {
            for (let gx = 0; gx < columns; gx += 1) {
              const x = gx * CELL + CELL * 0.5;
              const y = gy * CELL + CELL * 0.5;
              const broad = valueNoise(x / 118, y / 118, 0);
              const middle = valueNoise(x / 52, y / 52, 41);
              const fine = valueNoise(x / 23, y / 23, 97);
              const rawDensity = broad * 0.6 + middle * 0.28 + fine * 0.12;
              const contrasted = clamp((rawDensity - 0.17) / 0.44, 0, 1);
              const density = BARE + contrasted * (1 - BARE);
              food[gy * columns + gx] = density;
              moss[gy * columns + gx] = density;
            }
          }
        }

        function valueNoise(x, y, salt) {
          const x0 = Math.floor(x);
          const y0 = Math.floor(y);
          const tx = x - x0;
          const ty = y - y0;
          const sx = tx * tx * (3 - 2 * tx);
          const sy = ty * ty * (3 - 2 * ty);
          const a = hashCell(x0, y0, salt);
          const b = hashCell(x0 + 1, y0, salt);
          const c = hashCell(x0, y0 + 1, salt);
          const d = hashCell(x0 + 1, y0 + 1, salt);
          const top = a + (b - a) * sx;
          const bottom = c + (d - c) * sx;
          return top + (bottom - top) * sy;
        }

        function hashCell(x, y, salt) {
          let value = Math.imul(x + salt + 0x7ed55d16, 0x85ebca6b)
            ^ Math.imul(y - salt + 0x165667b1, 0xc2b2ae35)
            ^ seed;
          value ^= value >>> 16;
          value = Math.imul(value, 0x7feb352d);
          value ^= value >>> 15;
          return (value >>> 0) / 4294967295;
        }

        function findRichMoss(attempts) {
          let best = { x: random() * width, y: random() * height, density: -1 };
          for (let i = 0; i < attempts; i += 1) {
            const x = 12 + random() * (width - 24);
            const y = 12 + random() * (height - 24);
            const density = foodPatch(x, y, 10);
            let spacingPenalty = 0;
            for (const worm of worms) {
              const distance = Math.hypot(worm.x - x, worm.y - y);
              if (distance < 180) spacingPenalty += (1 - distance / 180) * 0.9;
            }
            const score = density - spacingPenalty;
            if (score > best.density) best = { x, y, density: score };
          }
          return best;
        }

        function makeWorm(x, y, angle) {
          const radius = 2.5 + random() * 1.7;
          // The mouth clears a swath about four body radii wide. Lanes are laid
          // slightly closer than one swath so adjacent passes overlap a little
          // and no ribbon of moss survives between them.
          const bite = radius * 1.9 + 0.6;
          const worm = {
            x,
            y,
            previousX: x,
            previousY: y,
            angle,
            radius,
            bite,
            turnRadius: bite * 0.92,
            speed: 18 + random() * 10,
            mode: 'prospecting',
            // A sweep is a frame for laying lanes: an axis, the lateral
            // offsets of every lane laid in it, and one gentle wobble that all
            // of those lanes share so the spacing between neighbours never
            // changes. It persists through prospecting so a return to the
            // same patch extends the same tiling.
            sweep: null,
            laneRecord: null,
            laneAngle: angle,
            laneDir: 1,
            laneOffset: 0,
            laneFood: 0,
            laneLength: 0,
            laneLimit: 0,
            mineHoldoff: 0,
            turnRemaining: 0,
            turnDirection: 1,
            targetAngle: angle,
            targetWeight: 0,
            scanIn: 0,
            tumbleTurn: 0,
            tumbleIn: random() * 0.6,
            stampDistance: 0,
            stampX: x,
            stampY: y,
            lastCell: -1,
            body: [],
            bodyClock: 0,
            tone: random()
          };

          for (let i = 0; i < 9; i += 1) {
            worm.body.push({
              x: x - Math.cos(angle) * i * radius * 0.5,
              y: y - Math.sin(angle) * i * radius * 0.5
            });
          }

          return worm;
        }

        function growStillLife(steps) {
          for (let step = 0; step < steps; step += 1) {
            for (const worm of worms) updateWorm(worm, 0.1);
          }
        }

        function loop(now) {
          const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;

          if (running && !paused && !reducedMotion.matches && dt > 0) {
            for (const worm of worms) updateWorm(worm, dt);
            softenOldTrails(dt);
            draw();
          }

          frameRequest = requestAnimationFrame(loop);
        }

        function updateWorm(worm, dt) {
          worm.previousX = worm.x;
          worm.previousY = worm.y;

          // Two modes only. Mining lays straight, tightly packed lanes through
          // a patch and hairpins between them. Prospecting searches for the
          // next patch. Decisions are made before the move so sensors see the
          // grazer's real position.
          if (worm.turnRemaining <= 0) {
            if (worm.mode === 'mining') mineLane(worm, dt);
            else prospect(worm, dt);
          }

          const step = worm.speed * dt;
          let heading = worm.angle;

          if (worm.turnRemaining > 0) {
            // A U-turn is a real semicircle at fixed forward speed and fixed
            // radius: no braking, reversing, or sideways slide. Moving along
            // the half-step heading keeps the integrated arc round.
            const turnStep = Math.min(worm.turnRemaining, step / worm.turnRadius);
            heading = worm.angle + worm.turnDirection * turnStep * 0.5;
            worm.angle += worm.turnDirection * turnStep;
            worm.turnRemaining -= turnStep;
            if (worm.turnRemaining <= 1e-9) {
              worm.turnRemaining = 0;
              worm.angle = laneTangent(worm, sweepCoords(worm).s);
            }
          } else if (worm.mode === 'mining') {
            heading = steerAlongLane(worm, dt);
          } else {
            heading = steerProspecting(worm, dt);
          }

          worm.x += Math.cos(heading) * step;
          worm.y += Math.sin(heading) * step;

          // Sensing turns the grazer before the edge. This clamp is a non-lethal
          // fallback for unusually coarse frames; the insect is redirected
          // inward and continues at the same speed on the following frame.
          if (!inside(worm.x, worm.y, 4)) {
            worm.x = clamp(worm.x, 4, width - 4);
            worm.y = clamp(worm.y, 4, height - 4);
            worm.angle = Math.atan2(height * 0.5 - worm.y, width * 0.5 - worm.x);
            worm.turnRemaining = 0;
            beginProspecting(worm);
          }

          const traveled = Math.hypot(worm.x - worm.previousX, worm.y - worm.previousY);
          worm.stampDistance += traveled;
          worm.bodyClock += traveled;
          if (worm.mode === 'prospecting') worm.mineHoldoff = Math.max(0, worm.mineHoldoff - traveled);

          recordCenterline(worm);
          consume(worm, traveled);

          if (worm.bodyClock >= worm.radius * 0.4) {
            worm.bodyClock = 0;
            worm.body.unshift({ x: worm.x, y: worm.y });
            worm.body.length = Math.min(worm.body.length, 10);
          }
        }

        // ---- Mining -------------------------------------------------------

        function mineLane(worm, dt) {
          extendLane(worm);
          const ahead = laneAhead(worm);
          // The lane is judged against what it has been yielding: a lane that
          // has run through thick carpet ends where growth thins well below
          // that, not only where it drops to the absolute floor. So the mined
          // region takes the shape of the rich patch rather than running on
          // through medium speckle to the far side of the field.
          const blend = 1 - Math.exp(-worm.speed * dt / (worm.bite * 6));
          worm.laneFood += (ahead.near - worm.laneFood) * blend;
          // Thresholds are staggered: a lane starts only in thick carpet
          // (see prospect), continues down to a lower floor, and turns into
          // an exit lane that clears a floor in between, so a lane never
          // flickers on and off at a patch edge.
          const floor = Math.max(LANE_FOOD * 0.7, worm.laneFood * 0.6);
          const farFloor = Math.max(LANE_FOOD, worm.laneFood * 0.8);
          // A lane may bridge a naturally bare gap toward rich moss beyond,
          // but never runs across ground it has already mined.
          const bridge = ahead.far >= farFloor && ahead.eaten < 0.12;
          const laneContinues = !ahead.outside && (ahead.near >= floor || bridge);

          // Even a rich lane is eventually broken. Each lane draws its own
          // soft limit; past it the chance of turning rises with every step,
          // and at twice the limit the turn is certain. This keeps mined
          // patches compact instead of striping the whole field.
          const step = worm.speed * dt;
          worm.laneLength += step;
          const over = worm.laneLength - worm.laneLimit;
          const tired = over > worm.laneLimit
            || (over > 0 && random() < over / worm.laneLimit * step * 0.1);

          if (laneContinues && !tired) return;

          // The lane is spent. Preview both semicircular turns and take the
          // side whose parallel lane still holds moss. Each turn draws its
          // own radius, never wider than the swath, so lane spacing varies
          // a little without ever opening a gap.
          const radius = worm.bite * (0.8 + random() * 0.16);
          const left = exitLaneFood(worm, -1, radius);
          const right = exitLaneFood(worm, 1, radius);
          const side = left === right
            ? (random() < 0.5 ? -1 : 1)
            : (left > right ? -1 : 1);

          if (Math.max(left, right) >= LANE_FOOD * 0.8) {
            commitUTurn(worm, side, radius);
            return;
          }

          // A tired lane with nowhere to turn keeps going on a fresh limit
          // rather than abandoning moss that is still ahead.
          if (laneContinues) {
            worm.laneLength = 0;
            worm.laneLimit = drawLaneLimit();
            return;
          }

          // Neither side holds moss: the patch is finished.
          beginProspecting(worm);
        }

        function drawLaneLimit() {
          return 50 + random() * 130;
        }

        // A fresh sweep: axis along the current heading, origin here, one
        // lane at offset zero. Three gentle sine terms, long to short, with
        // slopes kept modest so neighbouring lanes never pinch; zeroed at the
        // origin so the first lane leaves the entry point without a jog.
        function startSweep(worm) {
          const sweep = {
            x: worm.x,
            y: worm.y,
            angle: worm.angle,
            lanes: [],
            wobbleLen: [220 + random() * 120, 90 + random() * 50, 40 + random() * 20],
            wobbleAmp: [3.5 + random() * 2.5, 1.5 + random(), 0.5 + random() * 0.4],
            wobblePhase: [random() * TAU, random() * TAU, random() * TAU],
            wobbleBase: 0
          };
          worm.sweep = sweep;
          sweeps.push(sweep);
          sweep.wobbleBase = wobbleAt(worm, 0);
          worm.laneDir = 1;
          worm.laneOffset = 0;
        }

        // Arriving beside lanes already laid, by itself or by another grazer,
        // a grazer joins that sweep: it keeps the sweep's axis and wobble and
        // takes the nearest free slot, so later passes extend the same tiling
        // instead of crossing it at a new angle. Lanes are segments, so a
        // slot is taken only where an existing lane actually reaches; the far
        // end of a patch is open ground, and a lane may carry straight on
        // from where an earlier one stopped.
        function rejoinSweep(worm) {
          const W = worm.bite;
          const reach = W * 2;
          let sweep = null;
          let anchor = null;
          let anchorDistance = Infinity;

          for (const candidate of sweeps) {
            const { s, lateral } = frameCoords(candidate, worm.x, worm.y);
            for (const lane of candidate.lanes) {
              const across = Math.abs(lane.offset - lateral);
              const along = Math.max(0, lane.sMin - s, s - lane.sMax);
              if (across > (lane.bite + W) * 2.6 || along > W * 6) continue;
              const distance = across + along;
              if (distance < anchorDistance) {
                anchorDistance = distance;
                anchor = lane;
                sweep = candidate;
              }
            }
          }
          if (!sweep) return 'none';

          worm.sweep = sweep;
          const { s, lateral } = sweepCoords(worm);
          const adjacent = (anchor.bite + W) * 0.88;
          const candidates = [anchor.offset, anchor.offset + adjacent, anchor.offset - adjacent]
            .sort((a, b) => Math.abs(a - lateral) - Math.abs(b - lateral));
          const preferred = Math.cos(worm.angle - sweep.angle) >= 0 ? 1 : -1;

          for (const slot of candidates) {
            if (Math.abs(slot - lateral) > adjacent * 1.6) continue;
            const taken = sweep.lanes.some(lane => Math.abs(lane.offset - slot) < (lane.bite + W) * 0.66
              && lane.sMax > s - reach && lane.sMin < s + reach);
            if (taken) continue;

            // Take the slot only if its lane holds moss in some direction,
            // preferring the direction the grazer is already heading.
            worm.laneOffset = slot;
            for (const laneDir of [preferred, -preferred]) {
              worm.laneDir = laneDir;
              const ahead = laneAhead(worm);
              if (!ahead.outside && ahead.near >= LANE_FOOD) return 'joined';
            }
          }
          return 'poor';
        }

        // The sweep's shared lateral wobble at distance s along its axis.
        function wobbleAt(worm, s) {
          const sweep = worm.sweep;
          let offset = -sweep.wobbleBase;
          for (let i = 0; i < 3; i += 1) {
            offset += sweep.wobbleAmp[i] * Math.sin(TAU * s / sweep.wobbleLen[i] + sweep.wobblePhase[i]);
          }
          return offset;
        }

        function wobbleSlope(worm, s) {
          const sweep = worm.sweep;
          let slope = 0;
          for (let i = 0; i < 3; i += 1) {
            slope += sweep.wobbleAmp[i] * TAU / sweep.wobbleLen[i]
              * Math.cos(TAU * s / sweep.wobbleLen[i] + sweep.wobblePhase[i]);
          }
          return slope;
        }

        // Heading of the current lane's curve at s, in the lane's direction.
        function laneTangent(worm, s) {
          return wrapAngle(worm.laneAngle + Math.atan(wobbleSlope(worm, s)));
        }

        // The grazer's position in the sweep frame: s along the axis,
        // lateral across it.
        function sweepCoords(worm) {
          return frameCoords(worm.sweep, worm.x, worm.y);
        }

        function frameCoords(sweep, x, y) {
          const forwardX = Math.cos(sweep.angle);
          const forwardY = Math.sin(sweep.angle);
          const dx = x - sweep.x;
          const dy = y - sweep.y;
          return { s: dx * forwardX + dy * forwardY, lateral: -dx * forwardY + dy * forwardX };
        }

        // World position of the sweep-frame point (s, lateral), with the
        // shared wobble applied.
        function sweepPoint(worm, s, lateral) {
          const forwardX = Math.cos(worm.sweep.angle);
          const forwardY = Math.sin(worm.sweep.angle);
          const offset = lateral + wobbleAt(worm, s);
          return {
            x: worm.sweep.x + forwardX * s - forwardY * offset,
            y: worm.sweep.y + forwardY * s + forwardX * offset
          };
        }

        function laneAhead(worm) {
          const W = worm.bite;
          const forwardX = Math.cos(worm.angle);
          const forwardY = Math.sin(worm.angle);
          const normalX = -forwardY;
          const normalY = forwardX;
          const margin = W + 2;
          const mining = worm.mode === 'mining';
          const s = mining ? sweepCoords(worm).s : 0;
          let near = 0;
          let nearGrown = 0;
          let far = 0;
          let outside = false;

          // While mining, samples follow the wobbled lane itself rather than
          // the momentary heading, so a bend never reads the neighbouring
          // lane by mistake. Prospecting simply looks straight ahead.
          const at = (distance, lateral) => mining
            ? sweepPoint(worm, s + worm.laneDir * distance * W, worm.laneOffset + lateral * W)
            : {
              x: worm.x + forwardX * distance * W + normalX * lateral * W,
              y: worm.y + forwardY * distance * W + normalY * lateral * W
            };

          // Samples begin beyond the mouth's own reach so the lane is judged
          // by moss the grazer has not yet touched. The far band lets a lane
          // cross a short bare gap when rich moss continues beyond it.
          for (const lateral of [-0.55, 0, 0.55]) {
            for (const distance of [1.3, 2, 2.8]) {
              const { x, y } = at(distance, lateral);
              if (!inside(x, y, margin)) {
                outside = true;
                continue;
              }
              near += foodAt(x, y);
              nearGrown += mossAt(x, y);
            }
            for (const distance of [3.8, 5.2, 6.6]) {
              const { x, y } = at(distance, lateral);
              if (!inside(x, y, margin)) continue;
              far += foodAt(x, y);
            }
          }

          // How much of the near band was moss that has already been eaten.
          return { near: near / 9, far: far / 9, eaten: (nearGrown - near) / 9, outside };
        }

        function exitLaneFood(worm, side, R) {
          const W = worm.bite;
          const forwardX = Math.cos(worm.angle);
          const forwardY = Math.sin(worm.angle);
          const normalX = -forwardY;
          const normalY = forwardX;
          const margin = W + 2;

          // The whole swept semicircle must fit inside the field.
          for (let i = 1; i <= 4; i += 1) {
            const theta = i / 4 * Math.PI;
            const x = worm.x
              + forwardX * R * Math.sin(theta)
              + normalX * side * R * (1 - Math.cos(theta));
            const y = worm.y
              + forwardY * R * Math.sin(theta)
              + normalY * side * R * (1 - Math.cos(theta));
            if (!inside(x, y, margin)) return -1;
          }

          // Then read the parallel exit lane, running back the way we came,
          // following the sweep's shared wobble.
          const { s } = sweepCoords(worm);
          const exitOffset = worm.laneOffset + side * worm.laneDir * R * 2;
          const distances = [0.5, 1.5, 3, 5];
          const weights = [1, 1, 0.7, 0.5];
          let total = 0;
          let weightSum = 0;

          for (let i = 0; i < distances.length; i += 1) {
            for (const lateral of [-0.4, 0, 0.4]) {
              const { x, y } = sweepPoint(
                worm,
                s - worm.laneDir * distances[i] * W,
                exitOffset + lateral * W
              );
              if (!inside(x, y, margin)) {
                if (i < 2) return -1;
                continue;
              }
              total += foodAt(x, y) * weights[i];
              weightSum += weights[i];
            }
          }

          return weightSum ? total / weightSum : -1;
        }

        // Each lane is a segment of its sweep: a lateral offset, the swath it
        // clears, and its extent along the axis. The record is opened when
        // the lane starts and grows as the grazer advances, so another grazer
        // sees the lane being laid and never claims the same slot.
        function openLane(worm) {
          const { s } = sweepCoords(worm);
          worm.laneRecord = {
            offset: worm.laneOffset,
            bite: worm.bite,
            sMin: s - worm.bite,
            sMax: s + worm.bite
          };
          worm.sweep.lanes.push(worm.laneRecord);
        }

        function extendLane(worm) {
          const { s } = sweepCoords(worm);
          worm.laneRecord.sMin = Math.min(worm.laneRecord.sMin, s - worm.bite);
          worm.laneRecord.sMax = Math.max(worm.laneRecord.sMax, s + worm.bite);
        }

        function closeLane(worm) {
          if (!worm.laneRecord) return;
          extendLane(worm);
          worm.laneRecord = null;
        }

        function commitUTurn(worm, side, radius) {
          closeLane(worm);
          worm.turnRadius = radius;
          worm.turnDirection = side;
          worm.turnRemaining = Math.PI;
          // The exit lane is exactly one turn diameter over, heading back.
          worm.laneOffset += side * worm.laneDir * radius * 2;
          worm.laneDir = -worm.laneDir;
          worm.laneAngle = wrapAngle(worm.sweep.angle + (worm.laneDir === 1 ? 0 : Math.PI));
          openLane(worm);
          worm.laneLength = 0;
          worm.laneLimit = drawLaneLimit();
          pathMetrics.turns += 1;
        }

        function steerAlongLane(worm, dt) {
          const { s, lateral } = sweepCoords(worm);
          const offset = lateral - (worm.laneOffset + wobbleAt(worm, s));
          // Aim at the lane's centerline a few bite-widths ahead. This keeps
          // every lane on its curve and parallel to its neighbours regardless
          // of frame timing.
          const desired = laneTangent(worm, s) - worm.laneDir * Math.atan2(offset, worm.bite * 3);
          const maximumRate = worm.speed / (worm.turnRadius * 1.5);
          const turn = clamp(wrapAngle(desired - worm.angle) * 6, -maximumRate, maximumRate);
          worm.angle = wrapAngle(worm.angle + turn * dt);
          return worm.angle;
        }

        function beginMining(worm, laneFood) {
          worm.mode = 'mining';
          const joined = rejoinSweep(worm);
          if (joined === 'poor') {
            worm.mode = 'prospecting';
            return false;
          }
          if (joined === 'none') startSweep(worm);
          worm.laneAngle = wrapAngle(worm.sweep.angle + (worm.laneDir === 1 ? 0 : Math.PI));
          openLane(worm);
          worm.laneFood = laneFood;
          worm.laneLength = 0;
          worm.laneLimit = drawLaneLimit();
          worm.turnRemaining = 0;
          pathMetrics.lanes += 1;
          return true;
        }

        // ---- Prospecting --------------------------------------------------

        function beginProspecting(worm) {
          closeLane(worm);
          worm.mode = 'prospecting';
          worm.mineHoldoff = worm.bite * 3;
          worm.scanIn = 0;
          worm.targetWeight = 0;
          pathMetrics.prospects += 1;
        }

        function prospect(worm, dt) {
          const ahead = laneAhead(worm);
          // A lane starts only where thick carpet runs well ahead; a small
          // pocket is eaten in passing rather than mined. If the nearby sweep
          // has no workable slot here, wait a few bite-widths before asking
          // again rather than churning out lane stubs.
          const carpetAhead = !ahead.outside && ahead.near >= LANE_FOOD * 1.2 && ahead.far >= LANE_FOOD;
          if (carpetAhead && worm.mineHoldoff <= 0) {
            if (beginMining(worm, ahead.near)) return;
            worm.mineHoldoff = worm.bite * 3;
          }

          worm.scanIn -= dt;
          if (worm.scanIn <= 0) {
            worm.scanIn = 0.3 + random() * 0.3;
            scanForMoss(worm);
          }
        }

        function scanForMoss(worm) {
          // A short-range sense of remaining moss in every direction. Nearby
          // growth outweighs distant growth, and the current bearing keeps a
          // small bonus so the search does not dither between rival patches.
          const directions = 16;
          const ranges = [18, 36, 60, 90, 130];
          let bestAngle = worm.angle;
          let bestScore = 0;

          for (let k = 0; k < directions; k += 1) {
            const angle = worm.angle + k / directions * TAU;
            const forwardX = Math.cos(angle);
            const forwardY = Math.sin(angle);
            let score = 0;

            for (const distance of ranges) {
              const x = worm.x + forwardX * distance;
              const y = worm.y + forwardY * distance;
              if (!inside(x, y, worm.bite + 4)) {
                if (distance <= 30) score = 0;
                break;
              }
              // Thin growth is everywhere and never worth a detour; only
              // carpet thick enough to lane through pulls the search, rich
              // carpet pulls hardest, and a large patch further off outweighs
              // a scrap close by.
              const richness = Math.max(0, foodPatch(x, y, worm.bite * 0.8) - LANE_FOOD);
              score += Math.pow(richness, 1.5) / (1 + distance / 80);
            }

            let persistence = 1 + 0.1 * Math.cos(angle - worm.angle);
            if (worm.targetWeight > 0) persistence += 0.2 * Math.cos(angle - worm.targetAngle);
            score *= persistence;

            if (score > bestScore) {
              bestScore = score;
              bestAngle = angle;
            }
          }

          // Below this there is nothing worth steering toward, only the
          // trace on bare stone; the grazer keeps to its random walk.
          if (bestScore < 0.05) {
            worm.targetWeight = 0;
            return;
          }
          worm.targetAngle = wrapAngle(bestAngle);
          worm.targetWeight = bestScore;
        }

        function steerProspecting(worm, dt) {
          worm.tumbleIn -= dt;
          if (worm.tumbleIn <= 0) {
            // Summed uniform samples approximate rotational Brownian noise
            // without an artificial left-right oscillation.
            const noise = random() + random() + random() - 1.5;
            worm.tumbleTurn = noise * worm.speed / 12;
            worm.tumbleIn = 0.35 + random() * 0.8;
          }

          // A faint scent only nudges the random walk; a strong one leads it.
          const pull = clamp(worm.targetWeight / 0.5, 0, 1);
          let turn = worm.tumbleTurn * (1 - pull * 0.5);
          if (worm.targetWeight > 0) {
            turn += wrapAngle(worm.targetAngle - worm.angle) * (0.6 + pull * 2);
          }

          // The field edge repels the search well before the hard clamp.
          const margin = 36;
          let pushX = 0;
          let pushY = 0;
          if (worm.x < margin) pushX += 1 - worm.x / margin;
          if (worm.x > width - margin) pushX -= 1 - (width - worm.x) / margin;
          if (worm.y < margin) pushY += 1 - worm.y / margin;
          if (worm.y > height - margin) pushY -= 1 - (height - worm.y) / margin;
          if (pushX || pushY) {
            const away = Math.atan2(pushY, pushX);
            const strength = Math.min(1, Math.hypot(pushX, pushY) * 2);
            turn += wrapAngle(away - worm.angle) * 3 * strength;
          }

          const maximumRate = worm.speed / 16;
          worm.angle = wrapAngle(worm.angle + clamp(turn, -maximumRate, maximumRate) * dt);
          return worm.angle;
        }

        // ---- Eating and the trail -----------------------------------------

        function consume(worm, traveled) {
          const density = mossAt(worm.x, worm.y);
          // The grazer mows the full swath wherever it goes: a prospecting
          // route through thin growth is eaten just like a lane.
          markEaten(worm.x, worm.y, worm.bite);

          // The trail is laid by distance, not by frame, so a coarse step and
          // a smooth one leave the same exposure behind.
          const spacing = worm.bite * 0.3;
          while (worm.stampDistance >= spacing) {
            worm.stampDistance -= spacing;
            const back = traveled > 0 ? Math.min(traveled, worm.stampDistance) / traveled : 0;
            stampTrail(
              worm,
              worm.x - (worm.x - worm.previousX) * back,
              worm.y - (worm.y - worm.previousY) * back,
              density
            );
          }
        }

        function stampTrail(worm, x, y, density) {
          const W = worm.bite;
          trailCtx.save();
          trailCtx.lineCap = 'round';

          // A broad, broken veil of exposed stone. Each stamp lifts a little
          // more moss, so the swath's core reads clean and its edges ragged.
          trailCtx.globalAlpha = 0.02 + density * 0.32;
          trailCtx.fillStyle = stoneColors[Math.floor(random() * stoneColors.length)];
          trailCtx.beginPath();
          trailCtx.arc(
            x + (random() - 0.5) * W * 0.2,
            y + (random() - 0.5) * W * 0.2,
            W * (0.86 + random() * 0.16),
            0,
            TAU
          );
          trailCtx.fill();

          // Mouth marks: pale grains scattered across the swath.
          const grains = 1 + Math.floor(density * 4 + random() * 2);
          for (let i = 0; i < grains; i += 1) {
            const reach = W * 0.95 * Math.sqrt(random());
            const theta = random() * TAU;
            trailCtx.globalAlpha = (0.18 + density * 0.5) * (0.5 + random() * 0.5);
            trailCtx.fillStyle = stoneColors[Math.floor(random() * stoneColors.length)];
            trailCtx.beginPath();
            trailCtx.arc(x + Math.cos(theta) * reach, y + Math.sin(theta) * reach, 0.3 + random() * 0.85, 0, TAU);
            trailCtx.fill();
          }

          // The narrow scrape at the center records the bug's exact course.
          trailCtx.globalAlpha = 0.2 + density * 0.6;
          trailCtx.strokeStyle = stoneColors[Math.floor(worm.tone * stoneColors.length) % stoneColors.length];
          trailCtx.lineWidth = worm.radius * 0.5;
          trailCtx.beginPath();
          trailCtx.moveTo(worm.stampX, worm.stampY);
          trailCtx.lineTo(x, y);
          trailCtx.stroke();

          trailCtx.globalAlpha = 0.08 + density * 0.3;
          trailCtx.strokeStyle = '#eef1eb';
          trailCtx.lineWidth = 0.5 + worm.radius * 0.06;
          trailCtx.stroke();

          trailCtx.restore();
          worm.stampX = x;
          worm.stampY = y;
        }

        function placeGrazer(x, y) {
          let nearest = 0;
          for (let i = 1; i < worms.length; i += 1) {
            if (Math.hypot(worms[i].x - x, worms[i].y - y)
              < Math.hypot(worms[nearest].x - x, worms[nearest].y - y)) nearest = i;
          }
          const moved = makeWorm(clamp(x, 5, width - 5), clamp(y, 5, height - 5), random() * TAU);
          closeLane(worms[nearest]);
          worms[nearest] = moved;
        }

        function softenOldTrails(dt) {
          // Slow, uneven regrowth keeps the work alive without erasing its history.
          if (random() > dt * 3.1) return;
          const x = random() * width;
          const y = random() * height;
          const radius = 2 + random() * 6;
          trailCtx.save();
          trailCtx.globalCompositeOperation = 'destination-out';
          trailCtx.globalAlpha = 0.014 + random() * 0.026;
          trailCtx.beginPath();
          trailCtx.arc(x, y, radius, 0, TAU);
          trailCtx.fill();
          trailCtx.restore();

          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          const index = gy * columns + gx;
          food[index] = Math.min(moss[index], food[index] + 0.006);
        }

        function draw() {
          ctx.globalAlpha = 1;
          ctx.drawImage(groundCanvas, 0, 0, width, height);
          ctx.drawImage(trailCanvas, 0, 0, width, height);
          drawWorms();
        }

        function drawWorms() {
          ctx.save();
          for (const worm of worms) {
            if (worm.body.length < 2) continue;

            for (let i = worm.body.length - 1; i >= 0; i -= 1) {
              const point = worm.body[i];
              const t = 1 - i / worm.body.length;
              const radius = worm.radius * (0.22 + t * 0.19);
              ctx.fillStyle = i % 2 === 0
                ? 'rgba(224, 228, 221, .72)'
                : 'rgba(76, 81, 70, .82)';
              ctx.beginPath();
              ctx.arc(point.x, point.y, radius, 0, TAU);
              ctx.fill();
            }

            ctx.fillStyle = '#363b33';
            ctx.beginPath();
            ctx.ellipse(
              worm.x,
              worm.y,
              worm.radius * 0.48,
              worm.radius * 0.36,
              worm.angle,
              0,
              TAU
            );
            ctx.fill();

            const antennaLength = worm.radius * 0.75;
            const forwardX = Math.cos(worm.angle);
            const forwardY = Math.sin(worm.angle);
            const normalX = -forwardY;
            const normalY = forwardX;
            ctx.strokeStyle = 'rgba(42, 47, 39, .76)';
            ctx.lineWidth = 0.55;
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.moveTo(worm.x + forwardX * worm.radius * 0.25, worm.y + forwardY * worm.radius * 0.25);
              ctx.lineTo(
                worm.x + forwardX * antennaLength + normalX * worm.radius * 0.36 * side,
                worm.y + forwardY * antennaLength + normalY * worm.radius * 0.36 * side
              );
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        // ---- Field queries ------------------------------------------------

        function inside(x, y, margin) {
          return x >= margin && x <= width - margin && y >= margin && y <= height - margin;
        }

        function foodPatch(x, y, radius) {
          const samples = [
            [0, 0], [-radius, 0], [radius, 0], [0, -radius], [0, radius],
            [-radius * 0.7, -radius * 0.7], [radius * 0.7, -radius * 0.7],
            [-radius * 0.7, radius * 0.7], [radius * 0.7, radius * 0.7]
          ];
          let total = 0;
          for (const [dx, dy] of samples) total += foodAt(x + dx, y + dy);
          return total / samples.length;
        }

        function recordCenterline(worm) {
          const gx = clamp(Math.floor(worm.x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(worm.y / CELL), 0, rows - 1);
          const index = gy * columns + gx;
          if (index === worm.lastCell) return;
          worm.lastCell = index;
          pathMetrics.entered += 1;
          if (centerline[index] > 0) pathMetrics.revisited += 1;
          centerline[index] += 1;
        }

        function foodAt(x, y) {
          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          return food[gy * columns + gx] || 0;
        }

        function mossAt(x, y) {
          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          return moss[gy * columns + gx] || 0;
        }

        function markEaten(x, y, radius) {
          const minX = clamp(Math.floor((x - radius) / CELL), 0, columns - 1);
          const maxX = clamp(Math.floor((x + radius) / CELL), 0, columns - 1);
          const minY = clamp(Math.floor((y - radius) / CELL), 0, rows - 1);
          const maxY = clamp(Math.floor((y + radius) / CELL), 0, rows - 1);
          const radiusSquared = radius * radius;

          for (let gy = minY; gy <= maxY; gy += 1) {
            for (let gx = minX; gx <= maxX; gx += 1) {
              const dx = gx * CELL + CELL * 0.5 - x;
              const dy = gy * CELL + CELL * 0.5 - y;
              const distanceSquared = dx * dx + dy * dy;
              if (distanceSquared > radiusSquared) continue;
              const index = gy * columns + gx;
              // One pass strips nearly everything; a thin fringe survives at
              // the very edge of the swath, and the next lane's overlap takes it.
              const bite = 0.85 + (1 - distanceSquared / radiusSquared) * 0.15;
              food[index] = Math.max(0, food[index] - bite);
            }
          }
        }

        function eatenFraction() {
          let total = 0;
          let eaten = 0;
          for (let i = 0; i < moss.length; i += 1) {
            if (moss[i] < LANE_FOOD) continue;
            total += moss[i];
            eaten += moss[i] - food[i];
          }
          return total ? eaten / total : 0;
        }

        // ---- Utilities ----------------------------------------------------

        function announce(message) {
          status.textContent = '';
          requestAnimationFrame(() => { status.textContent = message; });
        }

        function clear(context, color) {
          context.save();
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, context.canvas.width, context.canvas.height);
          if (color) {
            context.fillStyle = color;
            context.fillRect(0, 0, context.canvas.width, context.canvas.height);
          }
          context.restore();
        }

        function readSeed() {
          const value = Number(new URLSearchParams(location.search).get('seed'));
          return Number.isFinite(value) && value !== 0
            ? value >>> 0
            : Math.floor(Math.random() * 0xffffffff) >>> 0;
        }

        function clamp(value, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, value));
        }

        function wrapAngle(angle) {
          return ((angle + Math.PI) % TAU + TAU) % TAU - Math.PI;
        }

        function mulberry32(value) {
          return function next() {
            value |= 0;
            value = value + 0x6D2B79F5 | 0;
            let result = Math.imul(value ^ value >>> 15, 1 | value);
            result = result + Math.imul(result ^ result >>> 7, 61 | result) ^ result;
            return ((result ^ result >>> 14) >>> 0) / 4294967296;
          };
        }
      })();
    </script>
  </body>
