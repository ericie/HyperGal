<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Tiny segmented grazers eat branching, fern-like paths through a dense field of moss."
    />
    <title>Moss Eaters · HyperGal</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #555b51;
        --focus: #eef1eb;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        min-width: 300px;
        overscroll-behavior: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--ground);
        cursor: crosshair;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: -8px;
      }

      .instructions {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="field"
      tabindex="0"
      aria-describedby="instructions"
      aria-label="Moss Eaters. Small caterpillar-like grazers eat branching pale paths through a dark moss surface."
    ></canvas>
    <p class="instructions" id="instructions">
      The colony grazes automatically. Click or tap to hatch more grazers. Press R or Enter for a new field. Press Space to pause or resume.
    </p>
    <p class="instructions" id="status" aria-live="polite"></p>

    <script>
      (() => {
        'use strict';

        const canvas = document.querySelector('#field');
        const ctx = canvas.getContext('2d', { alpha: false });
        const status = document.querySelector('#status');
        const groundCanvas = document.createElement('canvas');
        const groundCtx = groundCanvas.getContext('2d', { alpha: false });
        const trailCanvas = document.createElement('canvas');
        const trailCtx = trailCanvas.getContext('2d');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const maturePreview = new URLSearchParams(location.search).get('preview') === 'mature';
        const TAU = Math.PI * 2;
        const CELL = 6;
        const MAX_DPR = 1.5;

        const mossColors = [
          '#41473f', '#494f46', '#51574c', '#5a5f54',
          '#62665a', '#3c443b', '#696c61', '#4b5248'
        ];
        const stoneColors = [
          'rgba(202, 208, 205, .64)',
          'rgba(218, 222, 219, .56)',
          'rgba(185, 193, 188, .66)',
          'rgba(228, 231, 227, .48)'
        ];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let columns = 0;
        let rows = 0;
        let food = new Float32Array(0);
        let moss = new Float32Array(0);
        let centerline = new Uint16Array(0);
        let worms = [];
        let random = Math.random;
        let seed = readSeed();
        let lastTime = 0;
        let frameRequest = 0;
        let running = !document.hidden;
        let paused = false;
        let nextId = 1;
        let pathMetrics = { entered: 0, revisited: 0, turns: 0 };

        window.__mossDiagnostics = () => ({
          ...pathMetrics,
          overlapRate: pathMetrics.entered
            ? pathMetrics.revisited / pathMetrics.entered
            : 0,
          livingWorms: worms.filter(worm => worm.alive).length
        });

        resize();
        startField();
        frameRequest = requestAnimationFrame(loop);

        window.addEventListener('resize', () => {
          resize();
          startField();
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          lastTime = performance.now();
        });

        reducedMotion.addEventListener('change', startField);

        canvas.addEventListener('pointerdown', (event) => {
          canvas.focus({ preventScroll: true });
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          hatchClutch(x, y, reducedMotion.matches ? 7 : 4);

          if (reducedMotion.matches) {
            growStillLife(150);
            draw();
          }

          announce('A new clutch began feeding.');
        });

        canvas.addEventListener('keydown', (event) => {
          if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault();
            paused = !paused;
            announce(paused ? 'Grazing paused.' : 'Grazing resumed.');
            return;
          }

          if (!['r', 'R', 'Enter'].includes(event.key)) return;
          event.preventDefault();
          seed = (seed + 1 + Math.floor(Math.random() * 0x7fffff)) >>> 0;
          startField();
          announce('A new moss field has grown.');
        });

        function resize() {
          width = Math.max(300, innerWidth);
          height = Math.max(240, innerHeight);
          dpr = Math.min(MAX_DPR, devicePixelRatio || 1);

          for (const target of [canvas, groundCanvas, trailCanvas]) {
            target.width = Math.round(width * dpr);
            target.height = Math.round(height * dpr);
          }

          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          groundCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

          columns = Math.ceil(width / CELL);
          rows = Math.ceil(height / CELL);
          food = new Float32Array(columns * rows);
          moss = new Float32Array(columns * rows);
          centerline = new Uint16Array(columns * rows);
        }

        function startField() {
          random = mulberry32(seed);
          nextId = 1;
          paused = false;
          initializeMoss();
          worms = [];
          centerline.fill(0);
          pathMetrics = { entered: 0, revisited: 0, turns: 0 };
          paintGround();
          clear(trailCtx);

          const area = width * height;
          const openingWorms = clamp(Math.round(area / 175000), 3, 6);
          for (let i = 0; i < openingWorms; i += 1) {
            const start = findRichMoss(32);
            worms.push(makeWorm(
              start.x,
              start.y,
              random() * TAU,
              true
            ));
          }

          // The public piece always begins untouched. This opt-in state exists
          // only to make a representative catalog thumbnail.
          if (maturePreview) growStillLife(reducedMotion.matches ? 1400 : 1200);

          lastTime = performance.now();
          draw();
        }

        function paintGround() {
          clear(groundCtx, '#666b61');

          // Large, low-contrast moss colonies establish the field.
          const colonies = Math.round(width * height / 1900);
          for (let i = 0; i < colonies; i += 1) {
            const x = random() * width;
            const y = random() * height;
            const density = mossAt(x, y);
            const radius = 7 + random() * 34;
            const points = 8 + Math.floor(random() * 8);
            groundCtx.beginPath();
            for (let p = 0; p < points; p += 1) {
              const angle = (p / points) * TAU;
              const r = radius * (0.6 + random() * 0.55);
              const px = x + Math.cos(angle) * r;
              const py = y + Math.sin(angle) * r * (0.55 + random() * 0.35);
              if (p === 0) groundCtx.moveTo(px, py);
              else groundCtx.lineTo(px, py);
            }
            groundCtx.closePath();
            groundCtx.globalAlpha = (0.075 + random() * 0.19) * (0.38 + density);
            groundCtx.fillStyle = mossColors[Math.floor(random() * mossColors.length)];
            groundCtx.fill();
          }

          // Moss is a granular carpet, not a smooth green fill.
          const grains = Math.round(width * height / 11);
          for (let i = 0; i < grains; i += 1) {
            const x = random() * width;
            const y = random() * height;
            const density = mossAt(x, y);
            if (random() > 0.08 + density * 0.92) continue;
            const size = 0.25 + Math.pow(random(), 2) * 1.85;
            groundCtx.globalAlpha = (0.13 + random() * 0.44) * (0.36 + density * 0.82);
            groundCtx.fillStyle = mossColors[Math.floor(random() * mossColors.length)];
            if (random() < 0.76) {
              groundCtx.fillRect(x, y, size, size * (0.45 + random() * 0.8));
            } else {
              groundCtx.beginPath();
              groundCtx.arc(x, y, size, 0, TAU);
              groundCtx.fill();
            }
          }

          // Rich patches rise into clustered tufts; sparse patches leave the
          // underlying stone comparatively bare.
          const tufts = Math.round(width * height / 105);
          for (let i = 0; i < tufts; i += 1) {
            const x = random() * width;
            const y = random() * height;
            const density = mossAt(x, y);
            if (random() > Math.pow(density, 1.55)) continue;
            const tuftSize = 1.2 + density * (2.4 + random() * 3.8);
            const dots = 3 + Math.floor(density * 6);
            groundCtx.fillStyle = mossColors[Math.floor(random() * 5)];
            groundCtx.globalAlpha = 0.13 + density * 0.28;
            for (let dot = 0; dot < dots; dot += 1) {
              const angle = random() * TAU;
              const distance = random() * tuftSize;
              groundCtx.beginPath();
              groundCtx.arc(
                x + Math.cos(angle) * distance,
                y + Math.sin(angle) * distance,
                0.35 + random() * 1.05,
                0,
                TAU
              );
              groundCtx.fill();
            }
          }

          // A few pale flecks remain caught in the moss.
          const flecks = Math.round(width * height / 610);
          groundCtx.fillStyle = '#c7ccc7';
          for (let i = 0; i < flecks; i += 1) {
            groundCtx.globalAlpha = 0.08 + random() * 0.18;
            const size = 0.35 + random() * 1.15;
            groundCtx.fillRect(random() * width, random() * height, size, size);
          }

          groundCtx.globalAlpha = 1;
        }

        function initializeMoss() {
          for (let gy = 0; gy < rows; gy += 1) {
            for (let gx = 0; gx < columns; gx += 1) {
              const x = gx * CELL + CELL * 0.5;
              const y = gy * CELL + CELL * 0.5;
              const broad = valueNoise(x / 118, y / 118, 0);
              const middle = valueNoise(x / 52, y / 52, 41);
              const fine = valueNoise(x / 23, y / 23, 97);
              const rawDensity = broad * 0.6 + middle * 0.28 + fine * 0.12;
              const contrasted = clamp((rawDensity - 0.25) / 0.5, 0, 1);
              const density = 0.035 + Math.pow(contrasted, 1.42) * 0.965;
              food[gy * columns + gx] = density;
              moss[gy * columns + gx] = density;
            }
          }
        }

        function valueNoise(x, y, salt) {
          const x0 = Math.floor(x);
          const y0 = Math.floor(y);
          const tx = x - x0;
          const ty = y - y0;
          const sx = tx * tx * (3 - 2 * tx);
          const sy = ty * ty * (3 - 2 * ty);
          const a = hashCell(x0, y0, salt);
          const b = hashCell(x0 + 1, y0, salt);
          const c = hashCell(x0, y0 + 1, salt);
          const d = hashCell(x0 + 1, y0 + 1, salt);
          const top = a + (b - a) * sx;
          const bottom = c + (d - c) * sx;
          return top + (bottom - top) * sy;
        }

        function hashCell(x, y, salt) {
          let value = Math.imul(x + salt + 0x7ed55d16, 0x85ebca6b)
            ^ Math.imul(y - salt + 0x165667b1, 0xc2b2ae35)
            ^ seed;
          value ^= value >>> 16;
          value = Math.imul(value, 0x7feb352d);
          value ^= value >>> 15;
          return (value >>> 0) / 4294967295;
        }

        function findRichMoss(attempts) {
          let best = { x: random() * width, y: random() * height, density: -1 };
          for (let i = 0; i < attempts; i += 1) {
            const x = 12 + random() * (width - 24);
            const y = 12 + random() * (height - 24);
            const density = foodPatch(x, y, 10);
            let spacingPenalty = 0;
            for (const worm of worms) {
              const distance = Math.hypot(worm.x - x, worm.y - y);
              if (distance < 150) spacingPenalty += (1 - distance / 150) * 0.82;
            }
            const score = density - spacingPenalty;
            if (score > best.density) best = { x, y, density: score };
          }
          return best;
        }

        function makeWorm(x, y, angle, old = false) {
          const radius = 2.15 + random() * 1.95;
          const worm = {
            id: nextId++,
            x,
            y,
            previousX: x,
            previousY: y,
            angle,
            travelAngle: angle,
            radius,
            speed: 10 + random() * 7,
            age: old ? random() * 12 : 0,
            lifespan: 180 + random() * 170,
            steerIn: 0,
            targetTurn: 0,
            coverageScore: 1,
            foraging: false,
            turnRemaining: 0,
            turnDirection: 1,
            turnRadius: radius * 3.7 + 4,
            laneRemaining: 54 + random() * 86,
            drift: (random() - 0.5) * 0.025,
            driftIn: 7 + random() * 12,
            stampDistance: random() * 4,
            lastCell: -1,
            body: [],
            bodyClock: 0,
            tone: random(),
            alive: true
          };

          for (let i = 0; i < 9; i += 1) {
            worm.body.push({
              x: x - Math.cos(angle) * i * radius * 0.5,
              y: y - Math.sin(angle) * i * radius * 0.5
            });
          }

          return worm;
        }

        function growStillLife(steps) {
          for (let step = 0; step < steps; step += 1) {
            const countAtStart = worms.length;
            for (let i = 0; i < countAtStart; i += 1) updateWorm(worms[i], 0.12, true);
            maintainColony(true);
          }
        }

        function loop(now) {
          const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;

          if (running && !paused && !reducedMotion.matches && dt > 0) {
            for (const worm of worms) updateWorm(worm, dt, false);
            maintainColony(false);
            softenOldTrails(dt);
            draw();
          }

          frameRequest = requestAnimationFrame(loop);
        }

        function updateWorm(worm, dt, warming) {
          if (!worm.alive) return;

          worm.previousX = worm.x;
          worm.previousY = worm.y;
          worm.age += dt;
          worm.steerIn -= dt;
          worm.driftIn -= dt;

          if (worm.driftIn <= 0) {
            worm.drift = (random() - 0.5) * 0.04;
            worm.driftIn = 8 + random() * 14;
          }

          if (worm.turnRemaining <= 0 && worm.steerIn <= 0) {
            worm.targetTurn = planCourse(worm);
            worm.steerIn = 0.16 + random() * 0.16;
          }

          if (!worm.alive) return;

          if (worm.turnRemaining > 0) {
            // A U-turn is a real semicircle: fixed forward speed, fixed radius,
            // no braking, reversal, or lateral sine displacement.
            const angularSpeed = worm.speed / worm.turnRadius;
            const turnStep = Math.min(worm.turnRemaining, angularSpeed * dt);
            worm.angle += worm.turnDirection * turnStep;
            worm.turnRemaining -= turnStep;
            worm.foraging = false;
          } else {
            const maximumRate = worm.foraging
              ? worm.speed / 46
              : worm.speed / 118;
            worm.angle += clamp(worm.targetTurn + worm.drift, -maximumRate, maximumRate) * dt;
          }

          worm.travelAngle = worm.angle;
          worm.x += Math.cos(worm.angle) * worm.speed * dt;
          worm.y += Math.sin(worm.angle) * worm.speed * dt;

          // Planning should keep animals inside. Clamping is only an emergency
          // guard against a coarse preview step at the canvas boundary.
          if (worm.x < 4 || worm.x > width - 4 || worm.y < 4 || worm.y > height - 4) {
            worm.alive = false;
            return;
          }

          const traveled = Math.hypot(worm.x - worm.previousX, worm.y - worm.previousY);
          if (!worm.foraging && worm.turnRemaining <= 0) worm.laneRemaining -= traveled;
          worm.stampDistance += traveled;
          worm.bodyClock += traveled;

          recordCenterline(worm);
          consume(worm);

          if (worm.bodyClock >= worm.radius * 0.4) {
            worm.bodyClock = 0;
            worm.body.unshift({ x: worm.x, y: worm.y });
            worm.body.length = Math.min(worm.body.length, 10);
          }

          const localFood = foodAhead(worm, 0, 34);
          if (worm.age > worm.lifespan) worm.alive = false;
          if (!worm.foraging && worm.turnRemaining <= 0 && worm.age > 8 && localFood < 0.025 && random() < dt * 0.18) worm.alive = false;
        }

        function consume(worm) {
          const x0 = worm.previousX;
          const y0 = worm.previousY;
          const x1 = worm.x;
          const y1 = worm.y;
          const foodHere = foodAt(x1, y1);
          markEaten(x1, y1, worm.radius * 3.35);

          trailCtx.save();
          trailCtx.lineCap = 'round';
          trailCtx.lineJoin = 'round';
          const deposit = worm.foraging ? 0.22 : 0.62 + foodHere * 0.38;
          trailCtx.globalAlpha = deposit;

          // A broad, broken veil of exposed stone sits beneath the individual
          // mouth marks. It keeps a feeding route from reading as a wire.
          trailCtx.strokeStyle = 'rgba(202, 208, 203, .07)';
          trailCtx.lineWidth = worm.radius * (3.5 + foodHere * 0.7);
          trailCtx.beginPath();
          trailCtx.moveTo(x0, y0);
          trailCtx.lineTo(x1, y1);
          trailCtx.stroke();

          // The narrow scrape at the center records the bug's exact course.
          const trailAlpha = worm.foraging ? 0.24 : 0.72 + foodHere * 0.28;
          trailCtx.globalAlpha = trailAlpha;
          trailCtx.strokeStyle = stoneColors[Math.floor(worm.tone * stoneColors.length) % stoneColors.length];
          trailCtx.lineWidth = worm.radius * (0.42 + foodHere * 0.26);
          trailCtx.beginPath();
          trailCtx.moveTo(x0, y0);
          trailCtx.lineTo(x1, y1);
          trailCtx.stroke();

          trailCtx.strokeStyle = 'rgba(232, 236, 232, .34)';
          trailCtx.lineWidth = 0.42 + worm.radius * 0.06;
          trailCtx.beginPath();
          trailCtx.moveTo(x0, y0);
          trailCtx.lineTo(x1, y1);
          trailCtx.stroke();

          const spacing = 1.25 + worm.radius * 0.2;
          if (worm.stampDistance >= spacing) {
            worm.stampDistance %= spacing;
            const tangentX = Math.cos(worm.angle);
            const tangentY = Math.sin(worm.angle);
            const normalX = -tangentY;
            const normalY = tangentX;
            const trailRadius = worm.radius * (1.25 + foodHere * 0.7);
            const grains = 2 + Math.floor(foodHere * 4 + random() * 2);

            for (let i = 0; i < grains; i += 1) {
              const lateral = (random() - 0.5) * trailRadius * 2;
              const behind = random() * worm.radius * 1.7;
              const grainX = x1 + normalX * lateral - tangentX * behind;
              const grainY = y1 + normalY * lateral - tangentY * behind;
              trailCtx.globalAlpha = trailAlpha * (0.28 + foodHere * 0.42 + random() * 0.2);
              trailCtx.fillStyle = stoneColors[Math.floor(random() * stoneColors.length)];
              trailCtx.beginPath();
              trailCtx.arc(grainX, grainY, 0.28 + random() * 0.82, 0, TAU);
              trailCtx.fill();
            }
            trailCtx.globalAlpha = 1;
          }

          trailCtx.restore();
        }

        function maintainColony(warming) {
          worms = worms.filter(worm => worm.alive);
          const minimum = warming
            ? clamp(Math.round(width * height / 175000), 3, 6)
            : Math.min(4, maximumWorms());
          while (worms.length < minimum) {
            let richest = { x: random() * width, y: random() * height, food: -1 };
            for (let attempt = 0; attempt < 14; attempt += 1) {
              const candidate = {
                x: 12 + random() * (width - 24),
                y: 12 + random() * (height - 24)
              };
              const candidateFood = foodAt(candidate.x, candidate.y);
              if (candidateFood > richest.food) richest = { ...candidate, food: candidateFood };
            }
            worms.push(makeWorm(richest.x, richest.y, random() * TAU));
          }
        }

        function hatchClutch(x, y, count) {
          for (let i = 0; i < count && worms.length < maximumWorms() + 6; i += 1) {
            const angle = (i / count) * TAU + random() * 0.55;
            const distance = random() * 13;
            worms.push(makeWorm(
              clamp(x + Math.cos(angle) * distance, 5, width - 5),
              clamp(y + Math.sin(angle) * distance, 5, height - 5),
              angle
            ));
          }
        }

        function softenOldTrails(dt) {
          // Slow, uneven regrowth keeps the work alive without erasing its history.
          if (random() > dt * 3.1) return;
          const x = random() * width;
          const y = random() * height;
          const radius = 2 + random() * 6;
          trailCtx.save();
          trailCtx.globalCompositeOperation = 'destination-out';
          trailCtx.globalAlpha = 0.014 + random() * 0.026;
          trailCtx.beginPath();
          trailCtx.arc(x, y, radius, 0, TAU);
          trailCtx.fill();
          trailCtx.restore();

          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          const index = gy * columns + gx;
          food[index] = Math.min(1, food[index] + 0.006);
        }

        function draw() {
          ctx.globalAlpha = 1;
          ctx.drawImage(groundCanvas, 0, 0, width, height);
          ctx.drawImage(trailCanvas, 0, 0, width, height);
          drawWorms();
        }

        function drawWorms() {
          ctx.save();
          for (const worm of worms) {
            if (!worm.alive || worm.body.length < 2) continue;

            for (let i = worm.body.length - 1; i >= 0; i -= 1) {
              const point = worm.body[i];
              const t = 1 - i / worm.body.length;
              const radius = worm.radius * (0.22 + t * 0.19);
              ctx.fillStyle = i % 2 === 0
                ? 'rgba(224, 228, 221, .72)'
                : 'rgba(76, 81, 70, .82)';
              ctx.beginPath();
              ctx.arc(point.x, point.y, radius, 0, TAU);
              ctx.fill();
            }

            ctx.fillStyle = '#363b33';
            ctx.beginPath();
            ctx.ellipse(
              worm.x,
              worm.y,
              worm.radius * 0.48,
              worm.radius * 0.36,
              worm.angle,
              0,
              TAU
            );
            ctx.fill();

            const antennaLength = worm.radius * 0.75;
            const forwardX = Math.cos(worm.angle);
            const forwardY = Math.sin(worm.angle);
            const normalX = -forwardY;
            const normalY = forwardX;
            ctx.strokeStyle = 'rgba(42, 47, 39, .76)';
            ctx.lineWidth = 0.55;
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.moveTo(worm.x + forwardX * worm.radius * 0.25, worm.y + forwardY * worm.radius * 0.25);
              ctx.lineTo(
                worm.x + forwardX * antennaLength + normalX * worm.radius * 0.36 * side,
                worm.y + forwardY * antennaLength + normalY * worm.radius * 0.36 * side
              );
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function foodAhead(worm, offset, distance) {
          const angle = worm.travelAngle + offset;
          return foodPatch(
            worm.x + Math.cos(angle) * distance,
            worm.y + Math.sin(angle) * distance,
            worm.radius * 2.4
          );
        }

        function planCourse(worm) {
          const straight = corridorStats(worm, 0);
          const minedBarrier = straight.capacity > 0.07 && straight.freshness < 0.46;
          const boundaryAhead = straight.outside > 0.08;
          const laneComplete = worm.laneRemaining <= 0;

          // When a lane ends, preview the whole left and right semicircle. The
          // animal commits only to an arc whose footprint and exit lane remain
          // uneaten; otherwise it retires rather than crossing an old route.
          if (minedBarrier || boundaryAhead) {
            if (!beginClearUTurn(worm)) worm.alive = false;
            return 0;
          }

          if (laneComplete) {
            if (beginClearUTurn(worm)) return 0;
            worm.laneRemaining = 28 + random() * 34;
          }

          // Thin, previously untouched moss calls for a broad, direct search.
          // It still uses forward motion and a capped radius, never a pivot.
          if (straight.capacity < 0.27) {
            worm.foraging = true;
            worm.coverageScore = straight.remaining;
            return seekDenseMossTurn(worm);
          }

          worm.foraging = false;
          const offsets = [-0.34, -0.17, 0, 0.17, 0.34];
          let bestOffset = 0;
          let bestScore = -Infinity;

          for (const offset of offsets) {
            const sample = corridorStats(worm, offset);
            if (sample.outside > 0.08 || sample.freshness < 0.42) continue;
            const score = sample.remaining * 1.1
              + sample.capacity * 0.2
              + sample.freshness * 0.3
              - Math.abs(offset) * 0.28
              + random() * 0.002;
            if (score > bestScore) {
              bestScore = score;
              bestOffset = offset;
            }
          }

          if (bestScore === -Infinity) {
            if (!beginClearUTurn(worm)) worm.alive = false;
            return 0;
          }

          worm.coverageScore = bestScore;
          return bestOffset * 0.34;
        }

        function corridorStats(worm, offset) {
          const angle = worm.angle + offset;
          const forwardX = Math.cos(angle);
          const forwardY = Math.sin(angle);
          const normalX = -forwardY;
          const normalY = forwardX;
          const distances = [
            12 + worm.radius * 2,
            20 + worm.radius * 2,
            29 + worm.radius * 2,
            40 + worm.radius * 2,
            53 + worm.radius * 2
          ];
          const halfFootprint = worm.radius * 2.7;
          const laterals = [-halfFootprint, 0, halfFootprint];
          let remaining = 0;
          let capacity = 0;
          let freshness = 0;
          let outside = 0;
          let samples = 0;

          for (const distance of distances) {
            for (const lateral of laterals) {
              const x = worm.x + forwardX * distance + normalX * lateral;
              const y = worm.y + forwardY * distance + normalY * lateral;
              samples += 1;
              if (x < 7 || x > width - 7 || y < 7 || y > height - 7) {
                outside += 1;
                continue;
              }
              const available = foodAt(x, y);
              const possible = mossAt(x, y);
              const blocked = pathOccupiedNear(x, y, worm.radius * 5.4);
              remaining += available;
              capacity += possible;
              freshness += blocked ? 0 : (possible > 0.045 ? available / possible : 1);
            }
          }

          return {
            remaining: remaining / samples,
            capacity: capacity / samples,
            freshness: freshness / samples,
            outside: outside / samples
          };
        }

        function beginClearUTurn(worm) {
          // Two radii become the next lane's offset. This leaves a small safety
          // margin beyond the 6.7-radius eaten footprint without wasting moss.
          const radius = worm.radius * 3.7 + 4;
          const left = uTurnScore(worm, -1, radius);
          const right = uTurnScore(worm, 1, radius);
          const best = left > right
            ? { side: -1, score: left }
            : { side: 1, score: right };

          if (!Number.isFinite(best.score) || best.score < 0.18) return false;

          worm.turnRadius = radius;
          worm.turnDirection = best.side;
          worm.turnRemaining = Math.PI;
          worm.targetTurn = 0;
          worm.steerIn = Math.PI * radius / worm.speed;
          worm.laneRemaining = 54 + random() * 86;
          pathMetrics.turns += 1;
          return true;
        }

        function uTurnScore(worm, side, radius) {
          const forwardX = Math.cos(worm.angle);
          const forwardY = Math.sin(worm.angle);
          const normalX = -forwardY;
          const normalY = forwardX;
          let score = 0;
          let clear = 0;
          let samples = 0;

          // Sample the swept semicircle, then the beginning of the parallel
          // exit lane. Early arc points touch the current trail by necessity;
          // clearance tests begin once the arc has separated from it.
          for (let i = 3; i <= 18; i += 1) {
            const theta = i / 18 * Math.PI;
            const x = worm.x
              + forwardX * radius * Math.sin(theta)
              + normalX * side * radius * (1 - Math.cos(theta));
            const y = worm.y
              + forwardY * radius * Math.sin(theta)
              + normalY * side * radius * (1 - Math.cos(theta));
            const sample = resourceSample(
              x,
              y,
              worm.radius * 2.2,
              i >= 8 ? worm.radius * 4.2 : 0
            );
            if (!sample) return -Infinity;
            samples += 1;
            score += sample.remaining * 0.86 + sample.capacity * 0.14;
            if (sample.freshness > 0.38) clear += 1;
          }

          const exitX = worm.x + normalX * side * radius * 2;
          const exitY = worm.y + normalY * side * radius * 2;
          for (const distance of [16, 34, 54]) {
            const x = exitX - forwardX * distance;
            const y = exitY - forwardY * distance;
            const sample = resourceSample(x, y, worm.radius * 2.4, worm.radius * 5.4);
            if (!sample) return -Infinity;
            samples += 1;
            score += sample.remaining + sample.capacity * 0.18;
            if (sample.freshness > 0.42) clear += 1;
          }

          if (clear / samples < 0.72) return -Infinity;
          return score / samples;
        }

        function resourceSample(x, y, radius, clearance = 0) {
          if (x < radius + 5 || x > width - radius - 5 || y < radius + 5 || y > height - radius - 5) {
            return null;
          }
          if (clearance && pathOccupiedNear(x, y, clearance)) return null;
          const remaining = foodPatch(x, y, radius);
          const capacity = mossPatch(x, y, radius);
          return {
            remaining,
            capacity,
            freshness: capacity > 0.045 ? remaining / capacity : 1
          };
        }

        function pathOccupiedNear(x, y, radius) {
          const minX = clamp(Math.floor((x - radius) / CELL), 0, columns - 1);
          const maxX = clamp(Math.floor((x + radius) / CELL), 0, columns - 1);
          const minY = clamp(Math.floor((y - radius) / CELL), 0, rows - 1);
          const maxY = clamp(Math.floor((y + radius) / CELL), 0, rows - 1);
          const radiusSquared = radius * radius;

          for (let gy = minY; gy <= maxY; gy += 1) {
            for (let gx = minX; gx <= maxX; gx += 1) {
              if (!centerline[gy * columns + gx]) continue;
              const dx = gx * CELL + CELL * 0.5 - x;
              const dy = gy * CELL + CELL * 0.5 - y;
              if (dx * dx + dy * dy <= radiusSquared) return true;
            }
          }
          return false;
        }

        function seekDenseMossTurn(worm) {
          let bestOffset = 0;
          let bestScore = -Infinity;
          const distances = [42, 72, 112, 158];

          for (let step = 0; step < 24; step += 1) {
            const offset = -Math.PI + step / 23 * TAU;
            const angle = worm.travelAngle + offset;

            for (const distance of distances) {
              const x = worm.x + Math.cos(angle) * distance;
              const y = worm.y + Math.sin(angle) * distance;
              if (x < 8 || x > width - 8 || y < 8 || y > height - 8) continue;
              const density = foodPatch(x, y, 13 + distance * 0.045);
              const movementCost = distance * 0.00235;
              const reversalCost = Math.abs(offset) / Math.PI * 0.055;
              const score = density * 1.12 - movementCost - reversalCost + random() * 0.004;

              if (score > bestScore) {
                bestScore = score;
                bestOffset = offset;
              }
            }
          }

          worm.coverageScore = bestScore;
          return clamp(bestOffset * 1.45, -1.62, 1.62);
        }

        function foodPatch(x, y, radius) {
          const samples = [
            [0, 0], [-radius, 0], [radius, 0], [0, -radius], [0, radius],
            [-radius * 0.7, -radius * 0.7], [radius * 0.7, -radius * 0.7],
            [-radius * 0.7, radius * 0.7], [radius * 0.7, radius * 0.7]
          ];
          let total = 0;
          for (const [dx, dy] of samples) total += foodAt(x + dx, y + dy);
          return total / samples.length;
        }

        function mossPatch(x, y, radius) {
          const samples = [
            [0, 0], [-radius, 0], [radius, 0], [0, -radius], [0, radius],
            [-radius * 0.7, -radius * 0.7], [radius * 0.7, -radius * 0.7],
            [-radius * 0.7, radius * 0.7], [radius * 0.7, radius * 0.7]
          ];
          let total = 0;
          for (const [dx, dy] of samples) total += mossAt(x + dx, y + dy);
          return total / samples.length;
        }

        function recordCenterline(worm) {
          const gx = clamp(Math.floor(worm.x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(worm.y / CELL), 0, rows - 1);
          const index = gy * columns + gx;
          if (index === worm.lastCell) return;
          worm.lastCell = index;
          pathMetrics.entered += 1;
          if (centerline[index] > 0) pathMetrics.revisited += 1;
          centerline[index] += 1;
        }

        function foodAt(x, y) {
          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          return food[gy * columns + gx] || 0;
        }

        function mossAt(x, y) {
          const gx = clamp(Math.floor(x / CELL), 0, columns - 1);
          const gy = clamp(Math.floor(y / CELL), 0, rows - 1);
          return moss[gy * columns + gx] || 0;
        }

        function markEaten(x, y, radius) {
          const minX = clamp(Math.floor((x - radius) / CELL), 0, columns - 1);
          const maxX = clamp(Math.floor((x + radius) / CELL), 0, columns - 1);
          const minY = clamp(Math.floor((y - radius) / CELL), 0, rows - 1);
          const maxY = clamp(Math.floor((y + radius) / CELL), 0, rows - 1);
          const radiusSquared = radius * radius;

          for (let gy = minY; gy <= maxY; gy += 1) {
            for (let gx = minX; gx <= maxX; gx += 1) {
              const dx = gx * CELL + CELL * 0.5 - x;
              const dy = gy * CELL + CELL * 0.5 - y;
              const distanceSquared = dx * dx + dy * dy;
              if (distanceSquared > radiusSquared) continue;
              const index = gy * columns + gx;
              const bite = 0.52 + (1 - distanceSquared / radiusSquared) * 0.48;
              food[index] = Math.max(0, food[index] - bite);
            }
          }
        }

        function maximumWorms() {
          return clamp(Math.round(width * height / 22000), 22, 48);
        }

        function announce(message) {
          status.textContent = '';
          requestAnimationFrame(() => { status.textContent = message; });
        }

        function clear(context, color) {
          context.save();
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, context.canvas.width, context.canvas.height);
          if (color) {
            context.fillStyle = color;
            context.fillRect(0, 0, context.canvas.width, context.canvas.height);
          }
          context.restore();
        }

        function readSeed() {
          const value = Number(new URLSearchParams(location.search).get('seed'));
          return Number.isFinite(value) && value !== 0
            ? value >>> 0
            : Math.floor(Math.random() * 0xffffffff) >>> 0;
        }

        function clamp(value, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, value));
        }

        function mulberry32(value) {
          return function next() {
            value |= 0;
            value = value + 0x6D2B79F5 | 0;
            let result = Math.imul(value ^ value >>> 15, 1 | value);
            result = result + Math.imul(result ^ result >>> 7, 61 | result) ^ result;
            return ((result ^ result >>> 14) >>> 0) / 4294967296;
          };
        }
      })();
    </script>
  </body>
