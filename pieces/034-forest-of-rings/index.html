<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forest of Rings - HyperGal</title>
    <style>
      :root {
        color-scheme: light;
        --field: #dbe6db;
        --ink: #14251c;
        --panel: #173a2b;
        --panel-ink: #f1edcf;
        --panel-muted: #b8c8ad;
        --accent: #ffd76e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: var(--field);
      }

      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--field);
        cursor: crosshair;
        touch-action: manipulation;
      }

      .panel-toggle {
        position: fixed;
        z-index: 3;
        top: 18px;
        left: 18px;
        width: auto;
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        background: var(--panel);
        color: var(--panel-ink);
        box-shadow: 4px 4px 0 rgba(20, 37, 28, 0.16);
        font-size: 11px;
      }

      .panel-toggle:hover {
        background: var(--panel-ink);
        color: var(--panel);
      }

      .panel {
        position: fixed;
        z-index: 2;
        top: 70px;
        left: 18px;
        width: min(278px, calc(100vw - 36px));
        padding: 18px;
        background: var(--panel);
        color: var(--panel-ink);
        box-shadow: 6px 6px 0 rgba(20, 37, 28, 0.16);
      }

      .panel[hidden] {
        display: none;
      }

      .panel__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 13px;
        border-bottom: 1px solid rgba(241, 237, 207, 0.3);
      }

      h1 {
        margin: 0;
        max-width: 10ch;
        font: 700 clamp(20px, 2.2vw, 26px) / 0.94 Arial Narrow, Arial, sans-serif;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      .count {
        flex: none;
        color: var(--accent);
        font-size: 12px;
      }

      .mode {
        min-height: 31px;
        margin: 13px 0 16px;
        color: var(--accent);
        font-size: 11px;
        line-height: 1.35;
      }

      .control + .control {
        margin-top: 16px;
      }

      .control__line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 11px;
        line-height: 1.3;
      }

      output {
        min-width: 3ch;
        color: var(--accent);
        text-align: right;
      }

      input[type='range'] {
        width: 100%;
        height: 36px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: ew-resize;
      }

      input[type='range']::-webkit-slider-runnable-track {
        height: 2px;
        background: rgba(241, 237, 207, 0.58);
      }

      input[type='range']::-webkit-slider-thumb {
        width: 14px;
        height: 22px;
        margin-top: -10px;
        appearance: none;
        border: 2px solid var(--panel);
        border-radius: 0;
        background: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      input[type='range']::-moz-range-track {
        height: 2px;
        background: rgba(241, 237, 207, 0.58);
      }

      input[type='range']::-moz-range-thumb {
        width: 12px;
        height: 20px;
        border: 2px solid var(--panel);
        border-radius: 0;
        background: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      input[type='range']:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .ends {
        display: flex;
        justify-content: space-between;
        margin-top: 3px;
        color: var(--panel-muted);
        font-size: 11px;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(241, 237, 207, 0.3);
      }

      button {
        flex: 1;
        min-height: 44px;
        border: 1px solid rgba(241, 237, 207, 0.65);
        border-radius: 0;
        background: transparent;
        color: var(--panel-ink);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      button:hover {
        background: var(--panel-ink);
        color: var(--panel);
      }

      .hint {
        margin: 12px 0 0;
        color: var(--panel-muted);
        font-size: 11px;
        line-height: 1.45;
      }

      @media (max-width: 680px) {
        .panel-toggle {
          top: 10px;
          left: 10px;
        }

        .panel {
          top: auto;
          bottom: 10px;
          left: 10px;
          width: calc(100vw - 20px);
          padding: 13px 14px;
          box-shadow: 4px 4px 0 rgba(20, 37, 28, 0.16);
        }

        .panel__header,
        .mode,
        .hint {
          display: none;
        }

        .controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }

        .control + .control {
          margin-top: 0;
        }

        .control__line {
          margin-bottom: 3px;
          font-size: 11px;
        }

        .ends {
          display: none;
        }

        .actions {
          margin-top: 8px;
          padding-top: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas {
          cursor: default;
        }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="img"
      aria-label="Forest of Rings: one vertical line in the center grows wide, lengthwise wood grain outward until the tree fills the entire window. Height stays fixed; no ground or roots."
    ></canvas>

    <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="false" aria-controls="variables-panel">
      FOREST VARIABLES +
    </button>

    <aside id="variables-panel" class="panel" aria-label="Forest variables" hidden>
      <div class="panel__header">
        <h1>FOREST OF RINGS</h1>
        <span class="count">1 TREE</span>
      </div>
      <div id="mode" class="mode" aria-live="polite">SINGLE TREE · OUTWARD GROWTH</div>
      <div class="actions">
        <button id="reseed" type="button">NEW TREE</button>
        <button id="replay" type="button">REPLAY GROWTH</button>
      </div>
      <p class="hint">Point or tap the tree to read its record. Replay starts again from the center line.</p>
    </aside>

    <script>
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });
      const panelToggle = document.getElementById('panel-toggle');
      const variablesPanel = document.getElementById('variables-panel');
      const TAU = Math.PI * 2;
      const TREE_COUNT = 1;
      const MAX_AGE = 96;
      const SAMPLE_COUNT = 72;
      const YEAR_MS = 145;
      const FIELD = '#dbe6db';
      const INK = '#14251c';
      const PALETTE = ['#f2dc8f', '#d0a248', '#c26736', '#8c2f37', '#215a4a', '#19382c'];
      const params = new URLSearchParams(location.search);
      const reducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');

      let width = 1;
      let height = 1;
      let dpr = 1;
      let seed = params.get('seed') || randomSeed();
      let forest = null;
      let startTime = performance.now();
      let heldAge = parseAge(params.get('age'));
      let hoveredTree = -1;
      let focusedTree = -1;
      let pointer = { x: -1000, y: -1000 };
      let raf = 0;

      function parseAge(value) {
        if (value === null || value === '') return null;
        const number = Number(value);
        return Number.isFinite(number) ? clamp(number, 0, MAX_AGE) : null;
      }

      function randomSeed() {
        return Math.random().toString(36).slice(2, 10);
      }

      function xmur3(value) {
        let h = 1779033703 ^ value.length;
        for (let i = 0; i < value.length; i++) {
          h = Math.imul(h ^ value.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smoothstep(t) {
        const value = clamp(t, 0, 1);
        return value * value * (3 - 2 * value);
      }

      function angleDelta(a, b) {
        return Math.atan2(Math.sin(a - b), Math.cos(a - b));
      }

      function makeForest(nextSeed) {
        const seedFn = xmur3(nextSeed);
        const random = mulberry32(seedFn());
        const latitude = random() < 0.54 ? lerp(18, 64, random()) : -lerp(12, 48, random());
        const solarElevation = clamp(88 - Math.abs(latitude) * 0.82 + (random() * 8 - 4), 22, 78);
        const sunAngle = latitude >= 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
        const windAngle = random() * TAU;
        const windStrength = lerp(0.26, 0.84, random());
        const contourPhase = random() * TAU;
        const fire = {
          year: Math.floor(lerp(34, 62, random())),
          direction: windAngle + lerp(-0.28, 0.28, random()),
          offset: lerp(-0.18, 0.18, random()),
          width: lerp(0.22, 0.34, random()),
          severity: lerp(0.58, 0.94, random()),
        };
        const forces = { latitude, solarElevation, sunAngle, windAngle, windStrength, contourPhase, fire };
        const rainfall = [];
        let rainMemory = random() * 0.4 - 0.2;
        for (let year = 0; year <= MAX_AGE; year++) {
          rainMemory = rainMemory * 0.58 + (random() * 2 - 1) * 0.66;
          const cycle = Math.sin(year * 0.18 + random() * 0.14) * 0.48;
          const shock = random() < 0.075 ? (random() < 0.52 ? -1 : 1) * lerp(0.5, 1.2, random()) : 0;
          rainfall.push(clamp(rainMemory + cycle + shock, -1.5, 1.5));
        }

        const wildPositions = makeWildPositions(random);
        const trees = [];
        for (let i = 0; i < TREE_COUNT; i++) {
          trees.push(makeTree(random, i, wildPositions[i], rainfall, forces));
        }
        return {
          rainfall,
          trees,
          ...forces,
        };
      }

      function makeWildPositions(random) {
        const points = [];
        for (let i = 0; i < TREE_COUNT; i++) {
          let best = { x: random(), y: random(), distance: -1 };
          const candidates = i < 2 ? 1 : 34;
          for (let c = 0; c < candidates; c++) {
            const candidate = { x: random(), y: random() };
            let nearest = Infinity;
            for (const point of points) {
              const dx = candidate.x - point.x;
              const dy = candidate.y - point.y;
              nearest = Math.min(nearest, dx * dx + dy * dy);
            }
            if (nearest > best.distance) best = { ...candidate, distance: nearest };
          }
          points.push(best);
        }
        return points;
      }

      function depthColor(hex, depth, alpha = 1) {
        const channels = [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16));
        const gray = channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
        const saturation = 1 - depth * 0.8;
        const brightness = 1 - depth * 0.55;
        const [r, g, b] = channels.map((value) => Math.round(lerp(gray, value, saturation) * brightness));
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function makeTree(random, index, position, rainfall, forces) {
        const phase = random() * TAU;
        const sunBias = lerp(0.045, 0.09, random()) * clamp((90 - forces.solarElevation) / 48, 0.45, 1.25);
        const windBias = lerp(0.045, 0.095, random()) * forces.windStrength;
        const ovalAngle = random() * TAU;
        const ovalBias = lerp(0.02, 0.075, random());
        const localMoisture = lerp(-0.34, 0.34, random());
        const elevation = Math.round(
          260 +
            420 *
              (0.48 +
                Math.sin(position.x * 5.4 + forces.contourPhase) * 0.2 +
                Math.cos(position.y * 6.1 - forces.contourPhase * 0.7) * 0.16)
        );
        const slopeAngle = Math.atan2(
          Math.cos(position.y * 6.1 - forces.contourPhase * 0.7),
          Math.cos(position.x * 5.4 + forces.contourPhase)
        );
        const elevationDrag = clamp((elevation - 430) / 900, -0.16, 0.24);
        const wildPlantYear = Math.floor(lerp(0, 43, Math.pow(random(), 0.82)));
        const matureScale = lerp(0.68, 1.18, random());
        const fireExposure = fireExposureAt(position, forces.fire);
        const pestAffected = random() < 0.36;
        const pestYear = Math.floor(lerp(16, 80, random()));
        const pestAngle = random() * TAU;
        const pestSeverity = pestAffected ? lerp(0.24, 0.82, Math.pow(random(), 0.76)) : 0;
        const boundaries = [new Array(SAMPLE_COUNT).fill(0.035)];
        const firstColor = Math.floor(random() * PALETTE.length);
        const ringColors = [firstColor];
        let lastColor = firstColor;
        const memory = new Array(SAMPLE_COUNT).fill(0);

        for (let year = 1; year <= MAX_AGE; year++) {
          const previous = boundaries[year - 1];
          let boundary = new Array(SAMPLE_COUNT);
          const weather = clamp(1 + rainfall[year] * 0.32 + localMoisture * 0.24 - elevationDrag, 0.34, 1.72);
          const ageTaper = lerp(1.28, 0.72, year / MAX_AGE);
          const firePulse = Math.abs(year - forces.fire.year) <= 3
            ? fireExposure * forces.fire.severity * (1 - Math.abs(year - forces.fire.year) / 4)
            : 0;
          const pestPulse = pestAffected && Math.abs(year - pestYear) <= 4
            ? pestSeverity * (1 - Math.abs(year - pestYear) / 5)
            : 0;

          for (let sample = 0; sample < SAMPLE_COUNT; sample++) {
            const angle = (sample / SAMPLE_COUNT) * TAU;
            const sun = Math.cos(angle - forces.sunAngle) * sunBias;
            const wind = -Math.cos(angle - forces.windAngle) * windBias;
            const slope = Math.cos(angle - slopeAngle) * elevationDrag * 0.36;
            const oval = Math.cos((angle - ovalAngle) * 2) * ovalBias;
            const grain =
              Math.sin(angle * 3 + phase + year * 0.035) * 0.028 +
              Math.sin(angle * 7 - phase * 0.7 + year * 0.06) * 0.014;
            const fireWound =
              Math.exp(-Math.pow(angleDelta(angle, forces.fire.direction + Math.PI), 2) / 0.18) * firePulse * 0.72;
            const pestWound = Math.exp(-Math.pow(angleDelta(angle, pestAngle), 2) / 0.055) * pestPulse * 0.48;
            const wound = fireWound + pestWound;
            memory[sample] = clamp(memory[sample] * 0.96 + (sun + wind + slope + grain) * 0.028 - wound * 0.04, -0.16, 0.14);
            const increment = Math.max(
              0.1,
              ageTaper * weather * (1 + sun + wind + slope + oval + grain + memory[sample] - wound)
            );
            boundary[sample] = previous[sample] + increment;
          }
          boundary = smoothLoop(boundary, year < 18 ? 3 : 1);
          boundaries.push(boundary);
          const climateShift = rainfall[year] > 0.48 ? 1 : rainfall[year] < -0.48 ? 3 : 2;
          const colorStep = 1 + ((climateShift + index + Math.floor(random() * (PALETTE.length - 1))) % (PALETTE.length - 1));
          lastColor = (lastColor + colorStep) % PALETTE.length;
          ringColors.push(lastColor);
        }

        const maxRadius = Math.max(...boundaries[MAX_AGE]);
        for (const boundary of boundaries) {
          for (let i = 0; i < boundary.length; i++) boundary[i] /= maxRadius;
        }

        // The single tree sits in the foreground.
        const depth = 0;
        return {
          id: index + 1,
          depth,
          palette: PALETTE.map((color) => depthColor(color, depth)),
          ink: depthColor(INK, depth),
          grainStroke: depthColor(INK, depth, 0.25),
          wildX: position.x,
          wildY: position.y,
          wildPlantYear,
          matureScale,
          boundaries,
          ringColors,
          elevation,
          slopeAngle,
          fireExposure,
          pestAffected,
          pestYear,
          pestAngle,
          pestSeverity,
          localMoisture,
          phase,
          x: 0,
          y: 0,
          radius: 1,
        };
      }

      function fireExposureAt(position, fire) {
        const x = position.x - 0.5;
        const y = position.y - 0.5;
        const across = x * -Math.sin(fire.direction) + y * Math.cos(fire.direction);
        const along = x * Math.cos(fire.direction) + y * Math.sin(fire.direction);
        const corridor = Math.exp(-Math.pow((across - fire.offset) / fire.width, 2));
        const directionalGain = lerp(0.72, 1.15, clamp(along + 0.5, 0, 1));
        return clamp(corridor * directionalGain, 0, 1);
      }

      function smoothLoop(values, passes) {
        let output = values.slice();
        for (let pass = 0; pass < passes; pass++) {
          const next = new Array(output.length);
          for (let i = 0; i < output.length; i++) {
            next[i] = output[(i - 1 + output.length) % output.length] * 0.22 + output[i] * 0.56 + output[(i + 1) % output.length] * 0.22;
          }
          output = next;
        }
        return output;
      }

      // One centered core. Its final width reaches both window edges.
      function updateLayout() {
        const tree = forest.trees[0];
        tree.x = width / 2;
        tree.y = height;
        tree.trunkHeight = height;
        const mature = tree.boundaries[MAX_AGE];
        tree.radius = Math.max(width * 0.38,
          (width / 2 + 2) / radiusAt(mature, Math.PI),
          (width / 2 + 2) / radiusAt(mature, 0));
        tree.hitPath = null;
      }

      function forestAge(now) {
        if (reducedMotionQuery.matches) return MAX_AGE;
        if (heldAge !== null) return heldAge;
        return clamp((now - startTime) / YEAR_MS, 0, MAX_AGE);
      }

      function treeAge(tree, sharedAge) {
        return { age: clamp(sharedAge, 0, MAX_AGE), plantYear: 0 };
      }

      function draw(now) {
        const age = forestAge(now);
        ctx.fillStyle = FIELD;
        ctx.fillRect(0, 0, width, height);
        drawUniversalForces();

        const drawOrder = [...forest.trees].sort((a, b) => b.depth - a.depth || a.id - b.id);
        for (const tree of drawOrder) drawTree(tree, treeAge(tree, age));
        drawFireFront(age);
        drawFieldReadout(age);
        drawInspector(age);

        if (age < MAX_AGE && heldAge === null && !reducedMotionQuery.matches) {
          raf = requestAnimationFrame(draw);
        }
      }

      function drawUniversalForces() {
        const length = Math.min(width, height) * 0.16;
        const anchors = [0.24, 0.52, 0.8];
        ctx.save();
        ctx.strokeStyle = 'rgba(20, 37, 28, 0.22)';
        ctx.fillStyle = INK;
        ctx.lineWidth = 1;
        for (const anchor of anchors) {
          const x = width * anchor;
          const y = Math.max(102, height * 0.105);
          drawFieldArrow(x, y, Math.cos(forest.windAngle) >= 0 ? 0 : Math.PI, length * 0.42, 5);
        }

        const sunX = width - clamp(width * 0.055, 28, 72);
        const sunY = Math.max(105, height * 0.09);
        ctx.beginPath();
        ctx.arc(sunX, sunY, 8, 0, TAU);
        ctx.stroke();
        for (let ray = 0; ray < 8; ray++) {
          const angle = (ray / 8) * TAU;
          ctx.beginPath();
          ctx.moveTo(sunX + Math.cos(angle) * 12, sunY + Math.sin(angle) * 12);
          ctx.lineTo(sunX + Math.cos(angle) * 17, sunY + Math.sin(angle) * 17);
          ctx.stroke();
        }
        drawFieldArrow(sunX, sunY, forest.sunAngle, length * 0.28, 5);
        ctx.restore();
      }

      function drawFieldArrow(x, y, angle, length, head) {
        const x2 = x + Math.cos(angle) * length;
        const y2 = y + Math.sin(angle) * length;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x2, y2);
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - Math.cos(angle - 0.52) * head, y2 - Math.sin(angle - 0.52) * head);
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - Math.cos(angle + 0.52) * head, y2 - Math.sin(angle + 0.52) * head);
        ctx.stroke();
      }

      function drawFireFront(age) {
        const progress = (age - forest.fire.year) / 7;
        if (progress < 0 || progress > 1) return;
        const direction = Math.cos(forest.fire.direction) >= 0 ? 1 : -1;
        const front = lerp(-width * 0.15, width * 1.15, direction > 0 ? progress : 1 - progress);
        ctx.save();
        ctx.globalAlpha = Math.sin(progress * Math.PI) * 0.8;
        for (let trail = 0; trail < 18; trail++) {
          const x = front - direction * trail * Math.max(3, width * 0.004);
          const flame = (0.4 + 0.6 * Math.sin(trail * 2.4 + age * 8) ** 2) * height * 0.07;
          ctx.strokeStyle = trail % 3 ? '#c26736' : '#8c2f37';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, height + 2);
          ctx.quadraticCurveTo(x - direction * 5, height - flame * 0.45,
            x + direction * 6, height - flame);
          ctx.stroke();
        }
        ctx.restore();
      }

      function trunkHalfWidth(tree, boundary, side) {
        return radiusAt(boundary, side < 0 ? Math.PI : 0) * tree.radius;
      }

      function trunkPath(tree, boundary) {
        const path = new Path2D();
        const trunkHeight = tree.trunkHeight;
        const left = trunkHalfWidth(tree, boundary, -1);
        const right = trunkHalfWidth(tree, boundary, 1);
        // Only the board silhouette is rectangular; its grain is continuous.
        path.rect(tree.x - left, tree.y - trunkHeight, left + right, trunkHeight);
        return path;
      }

      // A radial, lengthwise section through the vertical pith. Every annual
      // boundary is a pair of open, mostly vertical lines, never a closed ring.
      function grainX(tree, boundary, elevation, side) {
        const level = elevation / tree.trunkHeight;
        const pith = tree.x + tree.radius * 0.012
          * (Math.sin(level * 6.2 + tree.phase) - Math.sin(tree.phase));
        const angle = (side < 0 ? Math.PI : 0) + level * 0.28;
        const distance = radiusAt(boundary, angle) * tree.radius;
        const grain = 0.94 + Math.sin(level * 8.3 + tree.phase + side * 0.3) * 0.025
          + Math.sin(level * 19.1 - tree.phase) * 0.009;
        return pith + side * distance * grain;
      }

      function grainPath(tree, boundary) {
        const path = new Path2D();
        // Close the filled strip outside the cut ends. Only its long sides
        // appear inside the board; every band continues all the way through.
        const bottom = -2;
        const top = tree.visibleHeight + 2;
        const steps = Math.max(2, Math.ceil(top / 8));
        for (const side of [-1, 1]) {
          for (let sample = 0; sample <= steps; sample++) {
            const t = side < 0 ? sample / steps : 1 - sample / steps;
            const elevation = lerp(bottom, top, t);
            const x = grainX(tree, boundary, elevation, side);
            const y = tree.y - elevation;
            if (side < 0 && sample === 0) path.moveTo(x, y);
            else path.lineTo(x, y);
          }
        }
        path.closePath();
        return path;
      }

      function drawGrain(tree, age, formingBoundary) {
        const wholeAge = Math.floor(age);
        const formingYear = Math.min(MAX_AGE, Math.ceil(age));
        ctx.fillStyle = tree.palette[tree.ringColors[formingYear]];
        ctx.fillRect(tree.x - tree.radius * 2, tree.y - tree.visibleHeight,
          tree.radius * 4, tree.visibleHeight);
        ctx.fill(grainPath(tree, formingBoundary));
        for (let year = wholeAge; year >= 1; year--) {
          const grain = grainPath(tree, tree.boundaries[year]);
          ctx.fillStyle = tree.palette[tree.ringColors[year]];
          ctx.fill(grain);
          ctx.strokeStyle = tree.grainStroke;
          ctx.lineWidth = 0.55;
          ctx.stroke(grain);
        }
        // The pith is a full-height axis. Existing grain coordinates stay fixed
        // as new wood is added outside; both cut ends remain fixed.
        ctx.beginPath();
        for (let elevation = 0; elevation <= tree.visibleHeight + 8; elevation += 8) {
          const x = grainX(tree, tree.boundaries[0], elevation, 1);
          if (!elevation) ctx.moveTo(x, tree.y);
          else ctx.lineTo(x, tree.y - elevation);
        }
        ctx.strokeStyle = tree.palette[0];
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }

      function drawTree(tree, record) {
        tree.hitPath = null;
        tree.visibleHeight = tree.trunkHeight;
        if (record.age <= 0.02) {
          const core = new Path2D();
          core.moveTo(tree.x, tree.y);
          core.lineTo(tree.x, tree.y - tree.trunkHeight);
          tree.hitPath = core;
          ctx.save();
          ctx.strokeStyle = tree.ink;
          ctx.lineWidth = 1;
          ctx.stroke(core);
          ctx.restore();
          return;
        }
        const wholeAge = Math.floor(record.age);
        const partial = smoothstep(record.age - wholeAge);
        const boundary = wholeAge < MAX_AGE
          ? interpolateBoundary(tree.boundaries[wholeAge], tree.boundaries[wholeAge + 1], partial)
          : tree.boundaries[MAX_AGE];
        const outer = trunkPath(tree, boundary);
        tree.hitPath = outer;
        ctx.save();
        ctx.save();
        ctx.clip(outer);
        drawGrain(tree, record.age, boundary);
        ctx.restore();
        ctx.strokeStyle = tree.ink;
        ctx.lineWidth = clamp(tree.radius * 0.045, 0.7, 1.8);
        ctx.stroke(outer);
        ctx.save();
        ctx.clip(outer);
        if (wholeAge >= forest.fire.year && tree.fireExposure > 0.1) drawFireScar(tree);
        if (tree.pestAffected && wholeAge >= tree.pestYear) drawPestDamage(tree);
        ctx.restore();
        const active = tree.id - 1 === hoveredTree || tree.id - 1 === focusedTree;
        if (active) {
          ctx.strokeStyle = '#f1edcf';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.stroke(outer);
        }
        ctx.restore();
      }

      function drawFireScar(tree) {
        const side = Math.cos(forest.fire.direction) >= 0 ? -1 : 1;
        const boundary = tree.boundaries[forest.fire.year];
        const x = tree.x + side * radiusAt(boundary, side < 0 ? Math.PI : 0) * tree.radius * 0.65;
        const scarHeight = tree.trunkHeight * (0.15 + tree.fireExposure * 0.18);
        ctx.strokeStyle = tree.ink;
        ctx.lineWidth = clamp(tree.radius * tree.fireExposure * 0.035, 1, 3);
        ctx.beginPath();
        ctx.moveTo(x, tree.y);
        ctx.quadraticCurveTo(x - side * tree.radius * 0.2, tree.y - scarHeight * 0.5,
          x, tree.y - scarHeight);
        ctx.stroke();
      }

      function drawPestDamage(tree) {
        const eventHeight = tree.trunkHeight;
        const boundary = tree.boundaries[tree.pestYear];
        const side = Math.cos(tree.pestAngle) >= 0 ? 1 : -1;
        ctx.fillStyle = tree.ink;
        for (let bore = 0; bore < 3; bore++) {
          const fraction = 0.32 + bore * 0.11;
          const elevation = eventHeight * fraction;
          const x = tree.x + side * trunkHalfWidth(tree, boundary, side) * 0.7;
          ctx.beginPath();
          ctx.ellipse(x, tree.y - elevation, clamp(tree.radius * 0.009, 0.65, 1.7),
            clamp(tree.radius * 0.024, 1.4, 4), tree.pestAngle * 0.15, 0, TAU);
          ctx.fill();
        }
      }

      function interpolateBoundary(from, to, amount) {
        return from.map((value, index) => lerp(value, to[index], amount));
      }

      function radiusAt(boundary, angle) {
        const normalized = ((angle % TAU) + TAU) % TAU;
        const sample = (normalized / TAU) * SAMPLE_COUNT;
        const a = Math.floor(sample) % SAMPLE_COUNT;
        const b = (a + 1) % SAMPLE_COUNT;
        return lerp(boundary[a], boundary[b], sample - Math.floor(sample));
      }

      function drawFieldReadout(age) {
        const mature = forest.trees.filter((tree) => treeAge(tree, age).age > 0).length;
        const compact = width < 680;
        const top = compact ? 68 : 32;
        const left = compact ? 10 : 190;
        ctx.save();
        ctx.fillStyle = INK;
        ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.textBaseline = 'middle';
        if (compact) {
          ctx.fillText(`SEASON ${String(Math.floor(age)).padStart(2, '0')}/${MAX_AGE}  LAT ${formatSigned(forest.latitude, 1)}`, left, top);
          ctx.textAlign = 'right';
          ctx.fillText(`${String(mature).padStart(2, '0')}/${TREE_COUNT}`, width - 10, top);
          ctx.textAlign = 'left';
          ctx.fillText(
            `SUN ${Math.round(forest.solarElevation)}deg  WIND ${directionName(forest.windAngle)} ${forest.windStrength.toFixed(2)}  FIRE Y${forest.fire.year}`,
            left,
            top + 13
          );
        } else {
          ctx.fillText(
            `SEASON ${String(Math.floor(age)).padStart(2, '0')}/${MAX_AGE}  LAT ${formatSigned(forest.latitude, 1)}  SUN ${Math.round(forest.solarElevation)}deg  WIND ${directionName(forest.windAngle)} ${forest.windStrength.toFixed(2)}`,
            left,
            top
          );
          ctx.textAlign = 'right';
          ctx.fillText(`${String(mature).padStart(2, '0')}/${TREE_COUNT}  FIRE Y${forest.fire.year}`, width - 12, top);
        }
        ctx.restore();
      }

      function drawInspector(sharedAge) {
        const index = hoveredTree >= 0 ? hoveredTree : focusedTree;
        if (index < 0) return;
        const tree = forest.trees[index];
        const record = treeAge(tree, sharedAge);
        const lines = [
          `TREE ${String(tree.id).padStart(2, '0')}`,
          `AGE ${String(Math.floor(record.age)).padStart(2, '0')}`,
          `GERMINATED ${String(record.plantYear).padStart(2, '0')}`,
          `ELEV ${tree.elevation}M`,
          `SOIL ${tree.localMoisture >= 0 ? '+' : ''}${tree.localMoisture.toFixed(2)}`,
          tree.pestAffected ? `PESTS Y${tree.pestYear}` : 'PESTS NONE',
          tree.fireExposure > 0.1 ? `FIRE ${Math.round(tree.fireExposure * 100)}%` : 'FIRE OUTSIDE PATH',
        ];
        const w = 156;
        const h = 112;
        let x = tree.x + tree.radius + 12;
        let y = tree.y - tree.visibleHeight * 0.65 - h / 2;
        if (x + w > width - 8) x = tree.x - tree.radius - w - 12;
        x = clamp(x, 8, width - w - 8);
        y = clamp(y, 84, height - h - 8);
        ctx.save();
        ctx.fillStyle = '#173a2b';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#f1edcf';
        ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.textBaseline = 'top';
        lines.forEach((line, lineIndex) => ctx.fillText(line, x + 8, y + 7 + lineIndex * 14));
        ctx.restore();
      }

      function formatSigned(value, places) {
        return `${value >= 0 ? '+' : ''}${value.toFixed(places)}`;
      }

      function directionName(angle) {
        const directions = ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'];
        const normalized = ((angle % TAU) + TAU) % TAU;
        return directions[Math.round((normalized / TAU) * directions.length) % directions.length];
      }

      function reset(nextSeed = randomSeed()) {
        seed = nextSeed;
        heldAge = null;
        startTime = performance.now();
        hoveredTree = -1;
        focusedTree = -1;
        forest = makeForest(seed);
        updateLayout();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      }

      function replay() {
        heldAge = null;
        startTime = performance.now();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      }

      function setPanelOpen(open) {
        variablesPanel.hidden = !open;
        panelToggle.setAttribute('aria-expanded', String(open));
        panelToggle.textContent = open ? 'FOREST VARIABLES -' : 'FOREST VARIABLES +';
      }

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (forest) updateLayout();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      }

      function nearestTree(x, y) {
        // Test the visible silhouette, frontmost first, in CSS coordinates.
        const drawOrder = [...forest.trees].sort((a, b) => a.depth - b.depth || b.id - a.id);
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.lineWidth = 12;
        const tree = drawOrder.find((item) => item.hitPath
          ? ctx.isPointInPath(item.hitPath, x, y) || ctx.isPointInStroke(item.hitPath, x, y)
          : Math.hypot(x - item.x, y - item.y) < 8);
        ctx.restore();
        return tree ? tree.id - 1 : -1;
      }

      panelToggle.addEventListener('click', () => setPanelOpen(variablesPanel.hidden));
      document.getElementById('reseed').addEventListener('click', () => {
        history.replaceState(null, '', location.pathname);
        reset();
      });
      document.getElementById('replay').addEventListener('click', replay);

      canvas.addEventListener('pointermove', (event) => {
        pointer = { x: event.clientX, y: event.clientY };
        const next = nearestTree(pointer.x, pointer.y);
        if (next !== hoveredTree) {
          hoveredTree = next;
          canvas.style.cursor = next >= 0 ? 'pointer' : 'crosshair';
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(draw);
        }
      });
      canvas.addEventListener('pointerleave', () => {
        hoveredTree = -1;
        canvas.style.cursor = 'crosshair';
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      });
      canvas.addEventListener('click', (event) => {
        focusedTree = nearestTree(event.clientX, event.clientY);
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      });
      canvas.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Escape'].includes(event.key)) return;
        event.preventDefault();
        if (event.key === 'Escape') focusedTree = -1;
        else {
          const step = event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1 : -1;
          focusedTree = (Math.max(0, focusedTree) + step + TREE_COUNT) % TREE_COUNT;
        }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      });
      addEventListener('resize', resize);
      addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !variablesPanel.hidden) {
          setPanelOpen(false);
          panelToggle.focus();
        }
      });
      reducedMotionQuery.addEventListener('change', () => {
        startTime = performance.now();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      });

      resize();
      forest = makeForest(seed);
      updateLayout();
      startTime = performance.now();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    </script>
  </body>
</html>
