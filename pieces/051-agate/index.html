<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Several ink spirals grow at once, fitting together across a sheet of warm paper.">
  <title>Agate · HyperGal</title>
  <style>
    :root { color-scheme: light; background: #f4f0e7; color: #34312e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
    canvas:focus-visible { outline: 2px solid #34312e; outline-offset: -6px; }
    .instructions { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    noscript { position: fixed; inset: 2rem; font: 1rem/1.5 Georgia, serif; }
    ::selection { background: #d7cec0; color: #34312e; }
  </style>
</head>
<body>
  <canvas id="drawing" tabindex="0" role="button" aria-label="Agate. Click or press Enter to draw again." aria-describedby="instructions"></canvas>
  <p class="instructions" id="instructions">Several drawing points trace irregular ink spirals at once, filling warm paper. Click, Enter or R starts a new drawing. Space pauses or resumes. F finishes the drawing. S saves a PNG.</p>
  <noscript>Agate needs JavaScript to draw.</noscript>
  <script src="agate.js"></script>
</body>
</html>
