<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake Pit · HyperGal</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: block; }
      #palette-panel {
        position: fixed;
        z-index: 2;
        top: 12px;
        left: 12px;
        width: min(268px, calc(100vw - 24px));
        border: 1px solid rgba(255, 255, 255, 0.46);
        background: rgba(0, 0, 0, 0.92);
        color: #fff;
        font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #palette-panel.is-collapsed { width: auto; min-width: 132px; }
      .palette-panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        padding-left: 10px;
      }
      .palette-panel__title { margin: 0; font: inherit; }
      #palette-toggle,
      .palette-option {
        appearance: none;
        border: 0;
        border-radius: 0;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      #palette-toggle {
        align-self: stretch;
        padding: 0 10px;
        background: transparent;
        border-left: 1px solid rgba(255, 255, 255, 0.24);
      }
      #palette-options { border-top: 1px solid rgba(255, 255, 255, 0.32); }
      .palette-option {
        position: relative;
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 35px;
        padding: 6px 8px 6px 10px;
        background: #050505;
        text-align: left;
      }
      .palette-option + .palette-option { border-top: 1px solid rgba(255, 255, 255, 0.14); }
      .palette-option:hover { background: #1a1a1a; }
      .palette-option[aria-checked="true"] {
        background: #fff;
        color: #000;
      }
      #palette-toggle:hover { background: #1a1a1a; }
      #palette-toggle:focus-visible,
      .palette-option:focus-visible {
        z-index: 1;
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .palette-swatches {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 1px;
        height: 18px;
        background: #000;
      }
      .palette-swatch { min-width: 0; }
      @media (max-width: 520px) {
        #palette-panel { top: 8px; left: 8px; width: min(252px, calc(100vw - 16px)); }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <section id="palette-panel" aria-label="Palette controls">
      <header class="palette-panel__header">
        <h1 class="palette-panel__title">Palette</h1>
        <button id="palette-toggle" type="button" aria-expanded="true" aria-controls="palette-options">Hide</button>
      </header>
      <div id="palette-options" role="radiogroup" aria-label="Choose a palette"></div>
    </section>
    <canvas id="stage"></canvas>
    <script>
      // Snake Pit — autonomous traditional Snake, painted in flat cells over the
      // memory of every snake that came before.
      //
      // Twenty contenders hunt one mouse. Snakes enter from beyond the arena with
      // varied length and aggression, which tilt each one between chasing the
      // mouse and preserving room around bodies. The leaders compound their
      // advantage, but also become increasingly careful about future escape space.
      // Edge, self, and other-snake contact kill one snake; its body turns to
      // crosshatching while a bright extinction front travels from head to tail,
      // committing each segment it passes into the permanent memory layer.
      //
      // The look is borrowed from Snake Memories (2025): flat integer cells, a
      // hard offset shadow instead of a glow, one palette per round with one
      // swatch per snake, and a field that remembers its dead.

      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      const palettePanel = document.getElementById('palette-panel');
      const paletteOptions = document.getElementById('palette-options');
      const paletteToggle = document.getElementById('palette-toggle');
      ctx.imageSmoothingEnabled = false;

      // ---- tunables -------------------------------------------------------
      const STEP = 0.18;         // starting seconds per snake move
      const MIN_STEP = 0.075;    // a leader becomes visibly, decisively faster
      const SPEEDUP_PER_SEG = 0.0048;
      const STREAK_SPEEDUP = 0.008;
      const GROW = 1;            // streak growth is triangular: 2, 4, 7, 11...
      const START_SNAKES = 8;    // contenders at the start of a round
      const MAX_SNAKES = 20;     // the most the pit holds; the winner's split fills toward it
      const START_LEN_MIN = 4;
      const START_LEN_MAX = 9;
      const DEATH_FADE_BASE = 0.28;
      const DEATH_FADE_PER_SEG = 0.003;
      const DEATH_FADE_MAX = 0.72;
      const DEATH_FADE_WIDTH = 3.2;
      const MOUSE_BLINK_PERIOD = 0.24;
      const MOUSE_BLINK_OFF = 0.10;
      const PREWARM_MAX_GENERATIONS = 120;
      const PREWARM_HATCH_STRIDE = 2.4;
      const AGGRESSION_MIN = 0.42, AGGRESSION_MAX = 0.88;
      const AGGRESSION_PER_SEG = 0.045;
      const AGGRESSION_CAP = 0.97;
      const HUNT_DISTANCE_WEIGHT = 13;
      const FOOD_CAPTURE_BONUS = 520;
      const BOX_SPACE_RATIO = 2.4; // opponent space must be tight relative to body length
      const BOX_PRESSURE_RADIUS = 7;
      const DEAD_END_PENALTY = 5000;
      const SINGLE_EXIT_PENALTY = 420;
      const DOUBLE_EXIT_PENALTY = 55;
      const CONTESTED_EXIT_PENALTY = 180;
      const TURN_MARGIN = 5;     // keep moving straight unless a turn is clearly better
      const EDGE_TURN_MARGIN = 1.5;
      const OFF_ROUTE_TURN_MARGIN = 0.75;
      const EDGE_RELIEF_WEIGHT = 6;
      const SAFE_BODY_BUFFER = 6;
      const LEADER_SMART_AT = 5;
      const LEADER_SMART_SPAN = 10;
      const LEADER_VETERAN_SPAN = 45;
      const SMART_LOOKAHEAD_MIN = 2;
      const SMART_LOOKAHEAD_MAX = 7;
      const MIN_ESCAPE_AREA = 8;
      const VICTORY_BLINKS = 5;
      const VICTORY_BLINK_PERIOD = 0.24;
      const VICTORY_FINAL_HOLD = 0.28;
      const VICTORY_REDUCED_DURATION = 0.55;
      const HEIR_RATIO = 0.3;  // the leading share of a winner that becomes the heir
      const HEIR_MIN = 2;
      const HEIR_SIZE_ADVANTAGE = 3; // and at least this many times the largest offspring
      // Separating the living from the dead. Snake Memories painted its dead at
      // full strength and let its one snake hide in them, found by motion
      // alone; twenty snakes and their death fronts need to read. Memories are
      // slightly desaturated and pushed toward the ground; the living keep
      // their full colour. The prebaked field is muted much further so a fresh
      // death remains readable above it. Texture supplies the other distinction:
      // dead cells are crosshatched instead of solid.
      const LOOK = {
        memoryDesaturate: 0.2,  // actual deaths retain enough colour to remain legible
        memoryFade: 0.08,       // actual deaths sit only slightly toward the ground
        prewarmDesaturate: 0.9,
        prewarmFade: 0.32,
        prewarm: true,          // fill the field with the dead before the first frame, as Snake Memories did
      };

      // Ground colour. Every snake colour comes from the palette or a winner's
      // interpolation toward the palette's next swatch.
      const C_BG = '#000000';

      // Three selected palettes from Snake Memories. One palette is dealt per
      // round; every snake takes one swatch from it.
      const PALETTES = {
        neon: [
          '#39FF14', '#FF073A', '#F8F32B', '#0FF0FC', '#FF00FF',
          '#FC00FF', '#0000FF', '#FFAA00', '#FF5F1F', '#7CFC00'
        ],
        vaporwave: [
          '#ff71ce', '#fe3c9e', '#ff00c8', '#ff00aa', '#ff0066',
          '#01cdfe', '#05ffa1', '#00ffd5', '#0ff0fc', '#00e5ff',
          '#b967ff', '#7c4dff', '#8c00ff', '#5500ff', '#fffb96',
          '#ffe347', '#ffc600'
        ],
        hokusai: [
          '#2e4a62', '#6a8e7f', '#e9d8a6', '#f4a261', '#e76f51',
          '#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51'
        ],
      };
      let paletteName = 'neon', palette = PALETTES.neon;

      function dealPalette() {
        palette = PALETTES[paletteName] || PALETTES.neon;
        syncPaletteControls();
      }

      function syncPaletteControls() {
        for (const button of paletteOptions.querySelectorAll('.palette-option')) {
          button.setAttribute('aria-checked', String(button.dataset.palette === paletteName));
        }
      }

      function choosePalette(name) {
        if (!PALETTES[name]) return;
        paletteName = name;
        palette = PALETTES[name];
        syncPaletteControls();
        reset();
      }

      function buildPaletteControls() {
        for (const [name, swatches] of Object.entries(PALETTES)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'palette-option';
          button.dataset.palette = name;
          button.setAttribute('role', 'radio');
          button.setAttribute('aria-checked', 'false');

          const label = document.createElement('span');
          label.textContent = name;
          const preview = document.createElement('span');
          preview.className = 'palette-swatches';
          preview.setAttribute('aria-hidden', 'true');
          for (let i = 0; i < 6; i++) {
            const chip = document.createElement('span');
            chip.className = 'palette-swatch';
            chip.style.backgroundColor = swatches[Math.floor(i * swatches.length / 6)];
            preview.appendChild(chip);
          }
          button.append(label, preview);
          button.addEventListener('click', () => choosePalette(name));
          paletteOptions.appendChild(button);
        }
        syncPaletteControls();
      }

      const hex2 = (v) => (v | 0).toString(16).padStart(2, '0');
      function dealSwatch() {
        return palette[(Math.random() * palette.length) | 0].toLowerCase();
      }

      function dealMouseColor() {
        return `rgb(${rand(200, 255) | 0},${rand(100, 255) | 0},${rand(80, 150) | 0})`;
      }

      // ---- state ----------------------------------------------------------
      let W = 0, H = 0, dpr = 1, CELL = 18, GW = 0, GH = 0, OX = 0, OY = 0;
      let snakes = [], mouse = null, dying = [], lastEater = null;
      let brainOwners = null;
      let last = 0, frame = 0, colorCursor = 0;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = (a) => a[(Math.random() * a.length) | 0];
      const inB = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH;
      const cl = (v, m) => v < 0 ? 0 : v >= m ? m - 1 : v;
      const tdist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
      const borderDistance = (p) => Math.min(p.x, p.y, GW - 1 - p.x, GH - 1 - p.y);
      const key = (p) => `${p.x},${p.y}`;
      const rgba = (rgb, a) => `rgba(${rgb},${a})`;
      const sameCell = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;
      const sameDir = (a, b) => a.x === b.x && a.y === b.y;
      const copyBody = (b) => b.map(p => ({ x: p.x, y: p.y }));
      const parseHex = (hex) => {
        const value = Number.parseInt(hex.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      };
      const mixChannel = (a, b, amount) => Math.round(a + (b - a) * amount);
      const mixHex = (from, to, amount) => {
        const a = parseHex(from), b = parseHex(to);
        return '#' + hex2(mixChannel(a[0], b[0], amount)) + hex2(mixChannel(a[1], b[1], amount)) + hex2(mixChannel(a[2], b[2], amount));
      };
      const colorDistance = (from, to) => {
        const a = parseHex(from), b = parseHex(to);
        return (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
      };
      const nextPaletteSwatch = (current) => {
        const normalized = current.toLowerCase();
        let index = palette.findIndex(swatch => swatch.toLowerCase() === normalized);
        if (index < 0) {
          index = palette.reduce((closest, swatch, candidate) =>
            colorDistance(normalized, swatch) < colorDistance(normalized, palette[closest])
              ? candidate
              : closest, 0);
        }
        return palette[(index + 1) % palette.length].toLowerCase();
      };
      // A snake's colour set, built from its one swatch. The accent is the
      // swatch pushed toward white; it lights the death front.
      const colorsForSwatch = (hex) => {
        const [r, g, b] = parseHex(hex);
        return {
          body: hex,
          head: hex,
          glow: hex,
          ring: `${r},${g},${b}`,
          accent: `${mixChannel(r, 255, 0.7)},${mixChannel(g, 255, 0.7)},${mixChannel(b, 255, 0.7)}`,
          dark: `${(r * 0.4) | 0},${(g * 0.4) | 0},${(b * 0.4) | 0}`,
        };
      };
      const baseSnakeColor = (s) => {
        if (!s._colors || s._colors.body !== s.swatch) s._colors = colorsForSwatch(s.swatch);
        return s._colors;
      };
      const snakeColor = (s) => baseSnakeColor(s);
      const victoryDuration = () => reducedMotion
        ? VICTORY_REDUCED_DURATION
        : VICTORY_BLINKS * VICTORY_BLINK_PERIOD + VICTORY_FINAL_HOLD;
      const victoryBlinkVisible = (s) => {
        if (!s.victoryActive || reducedMotion) return true;
        const blinkDuration = VICTORY_BLINKS * VICTORY_BLINK_PERIOD;
        if ((s.victoryAge || 0) >= blinkDuration) return true;
        return (s.victoryAge || 0) % VICTORY_BLINK_PERIOD < VICTORY_BLINK_PERIOD / 2;
      };
      const heirFragmentLength = (totalLength) => {
        let headLength = Math.min(
          totalLength,
          Math.max(HEIR_MIN, Math.ceil(totalLength * HEIR_RATIO))
        );
        while (headLength < totalLength) {
          const remainder = totalLength - headLength;
          const fragments = Math.min(MAX_SNAKES - 1, remainder);
          const largestFragment = fragments ? Math.ceil(remainder / fragments) : 0;
          if (headLength >= largestFragment * HEIR_SIZE_ADVANTAGE) break;
          headLength++;
        }
        return headLength;
      };
      const nextColorIndex = () => colorCursor++;
      const newStartLength = () => START_LEN_MIN + ((Math.random() * (START_LEN_MAX - START_LEN_MIN + 1)) | 0);
      const newAggression = () => rand(AGGRESSION_MIN, AGGRESSION_MAX);
      const initialMovePhase = (colorIndex) => STEP * ((colorIndex % START_SNAKES) / START_SNAKES);
      const nextEatStreak = (s) => lastEater === s ? (s.eatStreak || 0) + 1 : 1;
      const growthForStreak = (streak, length = START_LEN_MIN) => GROW + (streak * (streak + 1)) / 2 + Math.floor(Math.max(0, length - START_LEN_MIN) / 7);
      const growthForNextMouse = (s) => growthForStreak(nextEatStreak(s), s.body.length);
      const effectiveAggression = (s) => Math.min(AGGRESSION_CAP, s.aggression + Math.max(0, s.body.length - START_LEN_MIN) * AGGRESSION_PER_SEG);
      const leaderIntelligence = (s) => {
        const growth = Math.max(0, s.body.length - LEADER_SMART_AT);
        const trained = Math.min(1, growth / LEADER_SMART_SPAN);
        const veteran = Math.min(1, Math.max(0, growth - LEADER_SMART_SPAN) / LEADER_VETERAN_SPAN);
        return trained + veteran;
      };
      const smartLookaheadDepth = (intelligence) => {
        if (intelligence <= 0.05) return 0;
        const trainedDepth = SMART_LOOKAHEAD_MIN + Math.floor(Math.min(1, intelligence) * 3 + 1e-6);
        const veteranDepth = Math.floor(Math.max(0, intelligence - 1) * 2 + 1e-6);
        return Math.min(SMART_LOOKAHEAD_MAX, trainedDepth + veteranDepth);
      };
      const safetyTierTolerance = (intelligence) => Math.max(0, Math.floor(3 - intelligence * 1.75));
      const horizonTolerance = (intelligence) => Math.max(0, Math.ceil((1 - Math.min(1, intelligence)) * 2));
      const hungerDrive = (s) => 1 + Math.min(8, Math.max(0, s.body.length - START_LEN_MIN) / 8);
      const moveInterval = (s) => Math.max(MIN_STEP, STEP - Math.max(0, s.body.length - START_LEN_MIN) * SPEEDUP_PER_SEG - Math.min(0.032, (s.eatStreak || 0) * STREAK_SPEEDUP));
      const occupiedBySnakes = (x, y, list = snakes) => list.some(s => s.body.some(p => p.x === x && p.y === y));

      function buildBrainOwners(list = snakes) {
        const owners = new Map();
        for (const snake of list) for (const p of snake.body) owners.set(key(p), snake);
        return owners;
      }

      // ---- sizing ---------------------------------------------------------
      function resize() {
        W = innerWidth; H = innerHeight; dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
        CELL = Math.max(13, Math.round(Math.min(W, H) / 34));
        // Overdraw the viewport by the fractional outer cells so paint and
        // snakes meet every screen edge instead of sitting inside a black mat.
        GW = Math.max(12, Math.ceil(W / CELL));
        GH = Math.max(12, Math.ceil(H / CELL));
        OX = Math.floor((W - GW * CELL) / 2);
        OY = Math.floor((H - GH * CELL) / 2);
        buildMemory();
      }

      // ---- seeding --------------------------------------------------------
      function randomFreeCell(list = snakes) {
        for (let t = 0; t < 300; t++) {
          const x = (Math.random() * GW) | 0, y = (Math.random() * GH) | 0;
          if (!occupiedBySnakes(x, y, list)) return { x, y };
        }
        return { x: (Math.random() * GW) | 0, y: (Math.random() * GH) | 0 };
      }

      function buildBody(x, y, len, dir) {
        const body = [];
        for (let i = 0; i < len; i++) body.push({ x: x - dir.x * i, y: y - dir.y * i });
        return body;
      }

      function bodyFits(body, avoid = []) {
        return body.every(p => inB(p.x, p.y) && !occupiedBySnakes(p.x, p.y, avoid));
      }

      function makeSnake(x, y, len, colorIndex, aggression = newAggression(), avoid = []) {
        x = cl(x, GW); y = cl(y, GH);
        for (let t = 0; t < 300; t++) {
          const seed = t === 0 ? { x, y } : randomFreeCell(avoid);
          const fits = DIRS.filter(d => bodyFits(buildBody(seed.x, seed.y, len, d), avoid));
          if (!fits.length) continue;
          const dir = pick(fits);
          const body = buildBody(seed.x, seed.y, len, dir);
          return { body, dir, grow: 0, prev: copyBody(body), colorIndex, swatch: dealSwatch(), aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
        }
        const dir = pick(DIRS);
        const body = buildBody(x, y, Math.min(len, START_LEN_MIN), dir).filter(p => inB(p.x, p.y));
        return { body, dir, grow: 0, prev: copyBody(body), colorIndex, swatch: dealSwatch(), aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
      }

      function entrySpec(side, lane) {
        if (side === 0) return { x: -1, y: lane, dir: { x: 1, y: 0 } };
        if (side === 1) return { x: GW, y: lane, dir: { x: -1, y: 0 } };
        if (side === 2) return { x: lane, y: -1, dir: { x: 0, y: 1 } };
        return { x: lane, y: GH, dir: { x: 0, y: -1 } };
      }

      function makeEntrySnake(avoid = snakes, reserved = new Set()) {
        const len = newStartLength();
        const colorIndex = nextColorIndex();
        const aggression = newAggression();
        for (let t = 0; t < 300; t++) {
          const side = t < 4 ? t : (Math.random() * 4) | 0;
          const span = side < 2 ? GH : GW;
          const lane = t < 4 ? Math.max(0, Math.min(span - 1, Math.floor(span * (t + 0.5) / 4))) : (Math.random() * span) | 0;
          const spec = entrySpec(side, lane);
          const entry = { x: spec.x + spec.dir.x, y: spec.y + spec.dir.y };
          const ek = key(entry);
          if (!inB(entry.x, entry.y) || occupiedBySnakes(entry.x, entry.y, avoid) || reserved.has(ek)) continue;
          const body = buildBody(spec.x, spec.y, len, spec.dir);
          reserved.add(ek);
          return { body, dir: spec.dir, grow: 0, prev: copyBody(body), colorIndex, swatch: dealSwatch(), aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
        }
        const spec = entrySpec((Math.random() * 4) | 0, 0);
        const body = buildBody(spec.x, spec.y, len, spec.dir);
        return { body, dir: spec.dir, grow: 0, prev: copyBody(body), colorIndex, swatch: dealSwatch(), aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
      }

      function bringContenders(list = snakes) {
        const reserved = new Set();
        while (list.length < START_SNAKES) list.push(makeEntrySnake(list, reserved));
      }

      function fragmentDirection(source, start, fragment, fallback) {
        if (fragment.length > 1) {
          return {
            x: fragment[0].x - fragment[1].x,
            y: fragment[0].y - fragment[1].y,
          };
        }
        const current = fragment[0];
        const towardHead = source[start - 1];
        const towardTail = source[start + 1];
        if (towardHead) return { x: towardHead.x - current.x, y: towardHead.y - current.y };
        if (towardTail) return { x: current.x - towardTail.x, y: current.y - towardTail.y };
        return { x: fallback.x, y: fallback.y };
      }

      function winnerFragment(winner, source, start, end, swatch, heir = false) {
        const body = copyBody(source.slice(start, end));
        const colorIndex = heir ? winner.colorIndex : nextColorIndex();
        return {
          body,
          dir: fragmentDirection(source, start, body, winner.dir),
          grow: Math.max(0, START_LEN_MIN - body.length),
          prev: copyBody(body),
          colorIndex,
          swatch,
          aggression: heir ? winner.aggression : newAggression(),
          moveAcc: 0,
          eatStreak: 0,
        };
      }

      function splitWinner(winner) {
        const source = copyBody(winner.body);
        if (!source.length) return;
        const heirLength = heirFragmentLength(source.length);
        const headSwatch = winner.swatch.toLowerCase();
        const tailSwatch = nextPaletteSwatch(headSwatch);
        const offspring = [winnerFragment(winner, source, 0, heirLength, headSwatch, true)];
        const remainder = source.length - heirLength;
        const fragmentCount = Math.min(MAX_SNAKES - 1, remainder);

        for (let i = 0; i < fragmentCount; i++) {
          const start = heirLength + Math.floor(i * remainder / fragmentCount);
          const end = heirLength + Math.floor((i + 1) * remainder / fragmentCount);
          const progress = (i + 1) / fragmentCount;
          const swatch = mixHex(headSwatch, tailSwatch, progress);
          offspring.push(winnerFragment(winner, source, start, end, swatch));
        }

        for (let i = 0; i < offspring.length; i++) {
          offspring[i].moveAcc = STEP * (i / Math.max(1, offspring.length));
        }
        lastEater = null;
        snakes = offspring;
      }

      function spawnMouse(list = snakes) {
        mouse = randomFreeCell(list);
        mouse.color = dealMouseColor();
        mouse.blinkAge = 0;
      }

      function reset() {
        snakes = []; mouse = null; dying = []; lastEater = null; colorCursor = 0;
        dealPalette();
        buildMemory();
        if (LOOK.prewarm) prewarmMemory();
        bringContenders(snakes);
        spawnMouse();
      }

      function beginVictory(s) {
        s.victoryActive = true;
        s.victoryAge = 0;
        s.moveAcc = 0;
      }

      function updateVictory(dt) {
        if (snakes.length !== 1 || !snakes[0].victoryActive) return false;
        const winner = snakes[0];
        winner.victoryAge = Math.min(victoryDuration(), (winner.victoryAge || 0) + dt);
        winner.moveAcc = 0;
        if (winner.victoryAge >= victoryDuration()) {
          winner.victoryActive = false;
          splitWinner(winner);
        }
        return true;
      }

      // ---- snake brain ----------------------------------------------------
      function chooseDir(s) {
        const h = s.body[0];
        const opts = DIRS.filter(d => !(d.x === -s.dir.x && d.y === -s.dir.y));
        const intelligence = leaderIntelligence(s);
        // An adjacent mouse is still evaluated like any other move. Even a
        // young snake refuses a bite with no exit; length buys deeper judgment,
        // not permission for the shortest snakes to choose certain death.
        const bite = opts.find(d => {
          const p = { x: h.x + d.x, y: h.y + d.y };
          return sameCell(p, mouse) && inB(p.x, p.y) && !hitSelf(s, p) && !hitOtherSnake(s, p);
        });
        const choices = [];
        for (const d of opts) {
          const detail = {};
          choices.push({ d, score: scoreMove(s, d, detail), ...detail });
        }

        let contenders = choices.filter(choice => choice.legal);
        // Longer snakes become lexicographically stricter before food distance
        // is considered. A mature snake will take a longer route rather than
        // sacrifice escape class or proven survival depth for a quick mouse.
        if (intelligence > 0.05 && contenders.length) {
          const bestSafety = Math.max(...contenders.map(choice => choice.safetyTier));
          const safetyFloor = bestSafety - safetyTierTolerance(intelligence);
          const safer = contenders.filter(choice => choice.safetyTier >= safetyFloor);
          if (safer.length) contenders = safer;

          const bestHorizon = Math.max(...contenders.map(choice => choice.horizon));
          const horizonFloor = bestHorizon - horizonTolerance(intelligence);
          const farsighted = contenders.filter(choice => choice.horizon >= horizonFloor);
          if (farsighted.length) contenders = farsighted;
        }

        // Hunt only inside the safety set. Corner routes have already proven
        // that the snake can leave the corner after the bite.
        const safeBite = bite && contenders.find(choice => sameDir(choice.d, bite) && choice.huntSafe);
        if (safeBite) {
          contenders = [safeBite];
        } else if (mouse && contenders.length) {
          const viableHunters = contenders.filter(choice =>
            Number.isFinite(choice.path) && choice.huntSafe
          );
          if (viableHunters.length) {
            const shortest = Math.min(...viableHunters.map(choice => choice.path));
            contenders = viableHunters.filter(choice => choice.path === shortest);
          }
        }
        const ranked = contenders.length ? contenders : choices;
        let bestChoice = ranked[0];
        for (const choice of ranked) if (!bestChoice || choice.score > bestChoice.score) bestChoice = choice;
        let best = bestChoice ? bestChoice.d : s.dir;
        const straight = ranked.find(choice => sameDir(choice.d, s.dir));
        if (!sameDir(best, s.dir) && straight && straight.score >= bestChoice.score - turnMarginFor(s)) best = s.dir;
        s.dir = best;
      }

      function turnMarginFor(s) {
        const h = s.body[0];
        const straight = { x: h.x + s.dir.x, y: h.y + s.dir.y };
        if (!inB(straight.x, straight.y)) return 0;

        let margin = TURN_MARGIN;
        if (borderDistance(straight) <= 1) margin = Math.min(margin, EDGE_TURN_MARGIN);
        if (mouse && tdist(straight, mouse) >= tdist(h, mouse)) margin = Math.min(margin, OFF_ROUTE_TURN_MARGIN);
        return margin;
      }

      function futureBodyAfter(s, p, ate) {
        const future = [p, ...s.body];
        if (!ate && s.grow <= 0) future.pop();
        return future;
      }

      function blockedCells(s, body, start) {
        let blocked;
        if (brainOwners) {
          blocked = new Set(brainOwners.keys());
          for (const p of s.body) blocked.delete(key(p));
          for (const p of body) blocked.add(key(p));
        } else {
          blocked = new Set();
          for (const p of body) blocked.add(key(p));
          for (const other of snakes) {
            if (other === s) continue;
            for (const p of other.body) blocked.add(key(p));
          }
        }
        blocked.delete(key(start));
        return blocked;
      }

      function floodArea(s, start, body) {
        const blocked = blockedCells(s, body, start);
        const seen = new Set([key(start)]);
        const q = [start];
        for (let qi = 0; qi < q.length; qi++) {
          const p = q[qi];
          for (const d of DIRS) {
            const n = { x: p.x + d.x, y: p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push(n);
          }
        }
        return seen.size;
      }

      function isCornerCell(p) {
        return !!p
          && (p.x === 0 || p.x === GW - 1)
          && (p.y === 0 || p.y === GH - 1);
      }

      function safeCornerPathDistance(s, start, body, arrivalDir) {
        if (!isCornerCell(mouse)) return Infinity;
        const blocked = blockedCells(s, body, start);
        const seen = new Set([`${key(start)}|${arrivalDir.x},${arrivalDir.y}`]);
        const q = [{ p: start, dir: arrivalDir, dist: 0 }];

        const hasExit = (p, dir) => DIRS.some(d => {
          if (d.x === -dir.x && d.y === -dir.y) return false;
          const n = { x: p.x + d.x, y: p.y + d.y };
          return inB(n.x, n.y)
            && !blocked.has(key(n))
            && !rivalCanClaim(s, n);
        });

        for (let qi = 0; qi < q.length; qi++) {
          const cur = q[qi];
          if (sameCell(cur.p, mouse) && hasExit(cur.p, cur.dir)) return cur.dist;
          for (const d of DIRS) {
            if (d.x === -cur.dir.x && d.y === -cur.dir.y) continue;
            const n = { x: cur.p.x + d.x, y: cur.p.y + d.y };
            const stateKey = `${key(n)}|${d.x},${d.y}`;
            if (!inB(n.x, n.y) || blocked.has(key(n)) || seen.has(stateKey) || rivalCanClaim(s, n)) continue;
            seen.add(stateKey);
            q.push({ p: n, dir: d, dist: cur.dist + 1 });
          }
        }
        return Infinity;
      }

      function reachabilityProfile(s, start, body) {
        const tail = body[body.length - 1];
        const blocked = blockedCells(s, body, start);
        // One scan answers reachable area and food distance with the same
        // blocked cells as before. Tail access is equivalent to reaching any
        // cell beside the tail, so it does not need a second flood-fill.
        const seen = new Set([key(start)]);
        const q = [{ p: start, dist: 0 }];
        let path = mouse && sameCell(start, mouse) ? 0 : Infinity;
        let tailReachable = !tail || sameCell(start, tail) || tdist(start, tail) === 1;
        for (let qi = 0; qi < q.length; qi++) {
          const cur = q[qi];
          for (const d of DIRS) {
            const n = { x: cur.p.x + d.x, y: cur.p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            const dist = cur.dist + 1;
            seen.add(nk);
            q.push({ p: n, dist });
            if (!Number.isFinite(path) && sameCell(n, mouse)) path = dist;
            if (!tailReachable && tdist(n, tail) === 1) tailReachable = true;
          }
        }
        return { area: seen.size, path: mouse ? path : 0, tailReachable };
      }

      function nearestOtherDistance(s, p) {
        let best = Infinity;
        for (const other of snakes) {
          if (other === s) continue;
          for (const b of other.body) best = Math.min(best, tdist(p, b));
        }
        return Number.isFinite(best) ? best : GW + GH;
      }

      function rivalHeadRisk(s, p) {
        let risk = 0;
        for (const other of snakes) {
          if (other === s) continue;
          const oh = other.body[0];
          for (const d of DIRS) {
            if (d.x === -other.dir.x && d.y === -other.dir.y) continue;
            if (oh.x + d.x !== p.x || oh.y + d.y !== p.y) continue;
            const sizeThreat = Math.max(0.6, other.body.length / Math.max(1, s.body.length));
            risk += 90 * sizeThreat;
          }
        }
        return risk;
      }

      function rivalCanClaim(s, p) {
        for (const other of snakes) {
          if (other === s || other.body.length < s.body.length) continue;
          const oh = other.body[0];
          for (const d of DIRS) {
            if (d.x === -other.dir.x && d.y === -other.dir.y) continue;
            if (oh.x + d.x === p.x && oh.y + d.y === p.y) return true;
          }
        }
        return false;
      }

      function futureEscapeProfile(s, start, body, arrivalDir, intelligence) {
        let exits = 0, safeExits = 0, bestArea = 0;
        const futures = [];
        for (const d of DIRS) {
          if (d.x === -arrivalDir.x && d.y === -arrivalDir.y) continue;
          const n = { x: start.x + d.x, y: start.y + d.y };
          if (!inB(n.x, n.y)) continue;
          const ownBlocked = body.slice(0, Math.max(1, body.length - 1)).some(p => sameCell(p, n));
          if (ownBlocked || hitOtherSnake(s, n)) continue;
          exits++;
          if (!rivalCanClaim(s, n)) safeExits++;
          if (intelligence > 0) futures.push(n);
        }
        // Escape-area lookahead only contributes when leader intelligence is
        // nonzero. Short contenders avoid up to three wasted flood-fills here.
        for (const n of futures) {
          const after = [n, ...body];
          after.pop();
          bestArea = Math.max(bestArea, floodArea(s, n, after));
        }
        return { exits, safeExits, bestArea };
      }

      function survivalHorizon(s, start, body, arrivalDir, depth, growthLeft) {
        if (depth <= 0) return 0;
        let best = 0;
        for (const d of DIRS) {
          if (d.x === -arrivalDir.x && d.y === -arrivalDir.y) continue;
          const n = { x: start.x + d.x, y: start.y + d.y };
          if (!inB(n.x, n.y) || hitOtherSnake(s, n)) continue;

          const tailVacates = growthLeft <= 0;
          const ownEnd = tailVacates ? Math.max(1, body.length - 1) : body.length;
          if (body.slice(0, ownEnd).some(p => sameCell(p, n))) continue;

          const after = [n, ...body];
          const nextGrowth = Math.max(0, growthLeft - 1);
          if (growthLeft <= 0) after.pop();
          const survived = 1 + survivalHorizon(s, n, after, d, depth - 1, nextGrowth);
          best = Math.max(best, survived);
          if (best >= depth) break;
        }
        return best;
      }

      function opponentEscapeArea(s, future, other, limit = Infinity, futureKeys = null) {
        const start = other.body[0];
        const startKey = key(start);
        let isBlocked;
        if (brainOwners) {
          const candidate = futureKeys || new Set(future.map(key));
          isBlocked = nk => {
            if (candidate.has(nk)) return true;
            const owner = brainOwners.get(nk);
            if (!owner || owner === s) return false;
            return owner !== other || nk !== startKey;
          };
        } else {
          const blocked = new Set(future.map(key));
          for (const rival of snakes) {
            if (rival === s) continue;
            const body = rival === other ? rival.body.slice(1) : rival.body;
            for (const p of body) blocked.add(key(p));
          }
          blocked.delete(startKey);
          isBlocked = nk => blocked.has(nk);
        }

        const seen = new Set([startKey]);
        const q = [start];
        for (let qi = 0; qi < q.length; qi++) {
          const p = q[qi];
          for (const d of DIRS) {
            const n = { x: p.x + d.x, y: p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || isBlocked(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push(n);
            if (seen.size >= limit) return seen.size;
          }
        }
        return seen.size;
      }

      function boxingScore(s, nx, future) {
        let score = 0;
        const futureKeys = brainOwners ? new Set(future.map(key)) : null;
        let currentKeys = null;
        for (const other of snakes) {
          if (other === s) continue;
          const targetEscape = s.body.length * BOX_SPACE_RATIO;
          // Most opponents have abundant room. Stop as soon as the target has
          // enough cells to prove it is not boxed instead of flooding the arena.
          const escape = opponentEscapeArea(s, future, other, Math.ceil(targetEscape), futureKeys);
          const spacePressure = Math.max(0, targetEscape - escape);
          if (spacePressure <= 0) continue;

          // If the future area is genuinely cramped, compute the original full
          // comparison. This rare branch preserves the exact trap score.
          if (brainOwners && !currentKeys) currentKeys = new Set(s.body.map(key));
          const currentEscape = opponentEscapeArea(s, s.body, other, Infinity, currentKeys);
          const constriction = Math.max(0, currentEscape - escape);
          const pressure = Math.max(0, BOX_PRESSURE_RADIUS - tdist(nx, other.body[0]));
          const leverage = Math.min(2.4, s.body.length / Math.max(1, other.body.length));
          score += leverage * (spacePressure * 5 + constriction * 12 + pressure * 7);
        }
        return score;
      }

      function scoreMove(s, d, detail = null) {
        const h = s.body[0];
        const nx = { x: h.x + d.x, y: h.y + d.y };
        const ate = sameCell(nx, mouse);
        const mouseDist = mouse ? tdist(nx, mouse) : 0;
        if (!inB(nx.x, nx.y) || hitSelf(s, nx) || hitOtherSnake(s, nx)) {
          if (detail) Object.assign(detail, { legal: false, path: Infinity, mouseDist });
          return -100000 - mouseDist;
        }

        const future = futureBodyAfter(s, nx, ate);
        const eatGrowth = ate ? growthForNextMouse(s) : 0;
        const intelligence = leaderIntelligence(s);
        const reachability = reachabilityProfile(s, nx, future);
        const area = reachability.area;
        const cornerPath = isCornerCell(mouse) ? safeCornerPathDistance(s, nx, future, d) : Infinity;
        const path = isCornerCell(mouse) ? cornerPath : reachability.path;
        if (detail) Object.assign(detail, { legal: true, path, cornerPath, mouseDist });
        // A longer body needs a larger escape pocket, but the square-root curve
        // avoids turning open-area preservation back into a field-filling goal.
        const lengthReserve = Math.sqrt(Math.max(0, s.body.length - START_LEN_MIN))
          * (1 + intelligence);
        const safeNeed = Math.max(MIN_ESCAPE_AREA, Math.round(
          MIN_ESCAPE_AREA + SAFE_BODY_BUFFER * intelligence + lengthReserve
        ));
        const crampedPenalty = Math.max(0, safeNeed - area) * (55 + intelligence * 150);
        const escape = futureEscapeProfile(s, nx, future, d, intelligence);
        const tailReachable = reachability.tailReachable;
        const lookaheadDepth = smartLookaheadDepth(intelligence);
        const growthLeft = ate
          ? Math.max(0, s.grow + eatGrowth - 1)
          : Math.max(0, s.grow - 1);
        const horizon = lookaheadDepth > 0
          ? survivalHorizon(s, nx, future, d, lookaheadDepth, growthLeft)
          : 0;
        const horizonShortfall = Math.max(0, lookaheadDepth - horizon);
        let safetyTier = 0;
        if (escape.exits > 0) safetyTier += 2;
        if (escape.safeExits > 0) safetyTier += 1;
        if (escape.safeExits >= 2) safetyTier += 1;
        if (tailReachable) safetyTier += 2;
        if (area >= safeNeed) safetyTier += 2;
        if (area >= safeNeed * 1.5) safetyTier += 1;
        if (horizonShortfall === 0) safetyTier += 2;
        else safetyTier -= horizonShortfall * 2;
        if (detail) Object.assign(detail, {
          huntSafe: tailReachable && area >= safeNeed && escape.safeExits > 0 && horizonShortfall === 0,
          safetyTier,
          horizon,
        });
        const headRisk = rivalHeadRisk(s, nx);
        const pathScore = Number.isFinite(path)
          ? 180 - path * HUNT_DISTANCE_WEIGHT
          : -mouseDist * HUNT_DISTANCE_WEIGHT - 120;
        // Space beyond a useful escape reserve adds no incentive to sweep or
        // fill the arena; it exists only as a bounded survival signal.
        const spaceCeiling = safeNeed * 2.5;
        const usefulArea = Math.min(area, spaceCeiling);
        const dangerScore = usefulArea * 3
          + Math.min(8, nearestOtherDistance(s, nx)) * 16
          + escape.exits * (24 + intelligence * 54)
          + Math.min(usefulArea, escape.bestArea) * intelligence * 1.8
          + (tailReachable ? 45 * intelligence : -220 * intelligence)
          - headRisk * (0.7 + intelligence * 1.8)
          - crampedPenalty;
        const huntScore = pathScore + (ate ? FOOD_CAPTURE_BONUS + eatGrowth * 45 : 0);
        const trapScore = boxingScore(s, nx, future);
        const edgePressure = Math.max(0, 2 - borderDistance(h));
        const edgeRelief = Math.max(0, borderDistance(nx) - borderDistance(h));
        const edgeScore = edgePressure * edgeRelief * EDGE_RELIEF_WEIGHT;
        const aggression = effectiveAggression(s);
        const mobilityPenalty = escape.exits === 0
          ? DEAD_END_PENALTY
          : escape.exits === 1
            ? SINGLE_EXIT_PENALTY
            : escape.exits === 2
              ? DOUBLE_EXIT_PENALTY
              : 0;
        const contestedPenalty = Math.max(0, escape.exits - escape.safeExits) * CONTESTED_EXIT_PENALTY;
        const horizonPenalty = horizonShortfall * (700 + intelligence * 1300);
        // Aggression must remain a real tradeoff. Leader intelligence still
        // rejects sealed traps, but no longer overwhelms every step toward food.
        const survivalWeight = 0.14 + (1 - aggression) * 0.7 + intelligence * 0.55;
        return huntScore * aggression * hungerDrive(s) + dangerScore * survivalWeight
          + trapScore * (0.12 + aggression * 0.1)
          + edgeScore - mobilityPenalty - contestedPenalty - horizonPenalty + Math.random() * 0.01;
      }

      function hitSelf(s, p) {
        const tailVacates = s.grow <= 0;
        const end = tailVacates ? -1 : s.body.length;
        return s.body.slice(1, end).some(b => b.x === p.x && b.y === p.y);
      }

      function hitOtherSnake(s, p, moving = new Set()) {
        if (brainOwners && moving.size === 0) {
          const owner = brainOwners.get(key(p));
          return !!owner && owner !== s;
        }
        return snakes.some(other => {
          if (other === s) return false;
          const body = moving.has(other) && other.grow <= 0 ? other.body.slice(0, -1) : other.body;
          return body.some(b => b.x === p.x && b.y === p.y);
        });
      }

      function beginDeath(s) {
        const colors = snakeColor(s);
        const seed = Math.random() * 1000;
        dying.push({
          body: copyBody(s.body),
          colors,
          hatch: buildHatchLayer(s.body, colors.body, seed),
          seed,
          age: 0,
          stamped: 0,
          sweep: 0,
          duration: Math.min(DEATH_FADE_MAX, DEATH_FADE_BASE + s.body.length * DEATH_FADE_PER_SEG),
        });
      }

      function updateDeaths(dt) {
        for (let i = dying.length - 1; i >= 0; i--) {
          const death = dying[i];
          death.age += dt;
          death.sweep = updateDeathStamps(death);
          if (death.age < death.duration) continue;
          // Whatever the front has not reached by the end goes into memory now.
          for (; death.stamped < death.body.length; death.stamped++) {
            transferDeathHatchCell(death, death.body[death.stamped]);
          }
          dying.splice(i, 1);
        }
      }

      // ---- one grid tick --------------------------------------------------
      function step(movers = snakes) {
        const current = snakes.slice();
        const moving = movers.filter(s => current.includes(s));
        const movingSet = new Set(moving);
        if (!moving.length) return;

        const plans = new Map();
        brainOwners = buildBrainOwners(current);
        for (const s of moving) {
          s.prev = copyBody(s.body);
          chooseDir(s);
          const h = s.body[0];
          plans.set(s, { nx: { x: h.x + s.dir.x, y: h.y + s.dir.y } });
        }
        brainOwners = null;

        const dead = new Set();
        for (const s of moving) {
          const { nx } = plans.get(s);
          if (!inB(nx.x, nx.y) || hitSelf(s, nx) || hitOtherSnake(s, nx, movingSet)) dead.add(s);
        }

        for (let i = 0; i < moving.length; i++) {
          for (let j = i + 1; j < moving.length; j++) {
            const a = moving[i], b = moving[j];
            if (dead.has(a) || dead.has(b)) continue;
            const an = plans.get(a).nx, bn = plans.get(b).nx;
            const aHead = a.body[0], bHead = b.body[0];
            if (sameCell(an, bn) || (sameCell(an, bHead) && sameCell(bn, aHead))) {
              if (a.body.length === b.body.length) dead.add(pick([a, b]));
              else dead.add(a.body.length < b.body.length ? a : b);
            }
          }
        }

        const next = [];
        let mouseEaten = false;
        let eater = null;
        for (const s of current) {
          if (dead.has(s)) continue;
          if (!movingSet.has(s)) { next.push(s); continue; }
          const { nx } = plans.get(s);
          const ate = !dead.size && sameCell(nx, mouse);
          s.body.unshift(nx);
          if (ate) {
            s.eatStreak = nextEatStreak(s);
            s.grow += growthForStreak(s.eatStreak, s.body.length);
            mouseEaten = true;
            eater = s;
          }
          if (s.grow > 0) s.grow--; else s.body.pop();
          next.push(s);
        }

        if (eater) {
          lastEater = eater;
          for (const s of next) if (s !== eater) s.eatStreak = 0;
        } else if (dead.has(lastEater)) {
          lastEater = null;
        }

        for (const s of current) {
          if (!dead.has(s)) continue;
          beginDeath(s);
        }

        if (next.length === 1 && next[0].body.length >= START_LEN_MIN) beginVictory(next[0]);
        else if (next.length === 0) bringContenders(next);
        snakes = next.slice(0, MAX_SNAKES);
        if (mouseEaten && !dead.size) spawnMouse(snakes);
      }

      // ---- memory layer ---------------------------------------------------
      // Everything that has ever died is painted here as crosshatched cells in
      // its own colour. Later deaths accumulate over earlier ones so their
      // overlap remains visible. The layer is drawn once per frame beneath the
      // living snakes and is never faded or wiped except by reset.
      let memory = null, mctx = null;
      let memoryCells = new Set();

      function buildMemory() {
        memory = document.createElement('canvas');
        memory.width = Math.max(1, GW * CELL * dpr);
        memory.height = Math.max(1, GH * CELL * dpr);
        mctx = memory.getContext('2d');
        mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        mctx.imageSmoothingEnabled = false;
        memoryCells = new Set();
      }

      function strokeHatchPattern(target, x, y, width, height, color, seed, originX = 0, originY = 0, tone = memoryTone(color), stride = 1) {
        const gx = x + originX, gy = y + originY;
        target.strokeStyle = tone;
        target.lineCap = 'round';
        target.lineJoin = 'round';

        const corners = [
          { x: gx, y: gy },
          { x: gx + width, y: gy },
          { x: gx, y: gy + height },
          { x: gx + width, y: gy + height },
        ];
        const familyCount = 5 + (hash01(seed + 13, 7) > 0.58 ? 1 : 0);
        for (let family = 0; family < familyCount; family++) {
          let angle;
          if (family === 0) angle = Math.PI * (0.12 + hash01(seed + 17, family) * 0.22);
          else if (family === 1) angle = -Math.PI * (0.12 + hash01(seed + 17, family) * 0.22);
          else if (family === 2) angle = Math.PI * (0.38 + hash01(seed + 17, family) * 0.2);
          else if (family === 3) angle = Math.PI * (0.02 + hash01(seed + 17, family) * 0.1) * (hash01(seed + 23, family) < 0.5 ? -1 : 1);
          else angle = Math.PI * (0.24 + hash01(seed + 17, family) * 0.52);
          const dx = Math.cos(angle), dy = Math.sin(angle);
          const nx = -dy, ny = dx;
          const normalProjections = corners.map(corner => nx * corner.x + ny * corner.y);
          const lineProjections = corners.map(corner => dx * corner.x + dy * corner.y);
          const spacing = Math.max(1.5, CELL * (0.08 + hash01(seed + 31, family) * 0.08));
          const phase = hash01(seed + 47, family) * spacing;
          const first = Math.floor((Math.min(...normalProjections) - phase) / spacing) - 1;
          const last = Math.ceil((Math.max(...normalProjections) - phase) / spacing) + 1;
          const step = Math.max(3, CELL * (0.24 + hash01(seed + 59, family) * 0.18) * stride);
          const firstStep = Math.floor(Math.min(...lineProjections) / step) - 1;
          const lastStep = Math.ceil(Math.max(...lineProjections) / step) + 1;

          for (let lane = first; lane <= last; lane++) {
            const lineSeed = seed + family * 101 + lane * 0.731;
            const irregularity = (hash01(lineSeed, 3) - 0.5) * spacing * 0.46;
            const projection = phase + lane * spacing + irregularity;
            const pressure = 0.65 + hash01(lineSeed, 11) * 0.85;
            target.lineWidth = Math.max(0.42, CELL * 0.03 * pressure);
            target.globalAlpha = 0.18 + hash01(lineSeed, 19) * 0.24;
            target.beginPath();

            for (let point = firstStep; point <= lastStep; point++) {
              const along = point * step;
              const wobble = (hash01(lineSeed + 37, point) - 0.5) * CELL * 0.3;
              const lineX = dx * along + nx * (projection + wobble) - originX;
              const lineY = dy * along + ny * (projection + wobble) - originY;
              const lifts = point > firstStep && hash01(lineSeed + 73, point) < 0.04;
              if (point === firstStep || lifts) target.moveTo(lineX, lineY);
              else target.lineTo(lineX, lineY);
            }
            target.stroke();
          }
        }
      }

      function paintHatchCell(target, p, color, seed = 0, originX = 0, originY = 0, tone = memoryTone(color), stride = 1) {
        const x = p.x * CELL, y = p.y * CELL;
        target.save();
        target.beginPath();
        target.rect(x, y, CELL, CELL);
        target.clip();
        strokeHatchPattern(target, x, y, CELL, CELL, color, seed, originX, originY, tone, stride);
        target.restore();
      }

      function buildHatchLayer(body, color, seed, tone = memoryTone(color), stride = 1) {
        const visible = body.filter(p => inB(p.x, p.y));
        if (!visible.length) return null;
        const minX = Math.min(...visible.map(p => p.x));
        const maxX = Math.max(...visible.map(p => p.x));
        const minY = Math.min(...visible.map(p => p.y));
        const maxY = Math.max(...visible.map(p => p.y));
        const width = (maxX - minX + 1) * CELL;
        const height = (maxY - minY + 1) * CELL;
        const layer = document.createElement('canvas');
        layer.width = Math.max(1, width * dpr);
        layer.height = Math.max(1, height * dpr);
        const target = layer.getContext('2d');
        target.setTransform(dpr, 0, 0, dpr, 0, 0);
        target.imageSmoothingEnabled = false;
        const originX = minX * CELL, originY = minY * CELL;
        target.save();
        target.beginPath();
        for (const p of visible) {
          target.rect((p.x - minX) * CELL, (p.y - minY) * CELL, CELL, CELL);
        }
        target.clip();
        strokeHatchPattern(target, 0, 0, width, height, color, seed, originX, originY, tone, stride);
        target.restore();
        return { canvas: layer, target, minX, minY, x: minX * CELL, y: minY * CELL, width, height };
      }

      function stampCell(p, color, seed = 0, tone = memoryTone(color)) {
        if (!inB(p.x, p.y)) return;
        paintHatchCell(mctx, p, color, seed, 0, 0, tone);
        memoryCells.add(key(p));
      }

      function stampHatchBody(body, color, seed, tone = memoryTone(color), stride = 1) {
        const layer = buildHatchLayer(body, color, seed, tone, stride);
        if (!layer) return;
        mctx.drawImage(layer.canvas, layer.x, layer.y, layer.width, layer.height);
        for (const p of body) if (inB(p.x, p.y)) memoryCells.add(key(p));
      }

      function transferDeathHatchCell(death, p) {
        if (!inB(p.x, p.y)) return;
        const layer = death.hatch;
        if (!layer) {
          stampCell(p, death.colors.body, death.seed);
          return;
        }
        const localX = (p.x - layer.minX) * CELL;
        const localY = (p.y - layer.minY) * CELL;
        mctx.drawImage(
          layer.canvas,
          localX * dpr,
          localY * dpr,
          CELL * dpr,
          CELL * dpr,
          p.x * CELL,
          p.y * CELL,
          CELL,
          CELL,
        );
        layer.target.clearRect(localX, localY, CELL, CELL);
        memoryCells.add(key(p));
      }

      // When LOOK.prewarm is enabled, before the first frame fill the arena with
      // remains of snakes that never appear — one greedy snake at a time chases
      // a mouse until it hits a wall or itself, and is painted where it fell,
      // until every cell has been painted at least once. If disabled, the field
      // opens empty and is painted only by what dies in play.
      function prewarmMemory() {
        const total = GW * GH;
        let generations = 0;
        for (let guard = 0; memoryCells.size < total && guard < PREWARM_MAX_GENERATIONS; guard++) {
          prewarmRun((Math.random() * GW) | 0, (Math.random() * GH) | 0);
          generations++;
        }

        // The last isolated holes otherwise cause a coupon-collector tail of
        // hundreds of invisible generations. Close them with one clipped hatch
        // pass so the field is still complete before the first frame.
        const uncovered = [];
        for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
          const p = { x, y };
          if (!memoryCells.has(key(p))) uncovered.push(p);
        }
        if (uncovered.length) {
          const color = dealSwatch();
          stampHatchBody(uncovered, color, Math.random() * 1000, prewarmTone(color), PREWARM_HATCH_STRIDE);
        }
        return generations;
      }

      function prewarmRun(x, y) {
        const body = [{ x, y }];
        const color = dealSwatch();
        const hatchSeed = Math.random() * 1000;
        let dir = { x: 1, y: 0 };
        let food = randomFreeCell([{ body }]);
        for (let steps = 0; steps < 1000; steps++) {
          const head = body[0];
          // Greedy: the safe neighbour nearest the mouse, else keep going.
          let best = null, bestDist = Infinity;
          for (const d of DIRS) {
            const nx = head.x + d.x, ny = head.y + d.y;
            if (!inB(nx, ny) || body.some(p => p.x === nx && p.y === ny)) continue;
            const dist = (nx - food.x) ** 2 + (ny - food.y) ** 2;
            if (dist < bestDist) { bestDist = dist; best = d; }
          }
          if (best) dir = best;
          const next = { x: head.x + dir.x, y: head.y + dir.y };
          if (!inB(next.x, next.y) || body.some(p => p.x === next.x && p.y === next.y)) break;
          body.unshift(next);
          if (sameCell(next, food)) food = randomFreeCell([{ body }]);
          else body.pop();
        }
        // Draw this simulated corpse as one clipped layer. Painting the same
        // dense hatch separately for every cell makes prewarming needlessly
        // expensive, especially where generations overlap.
        stampHatchBody(body, color, hatchSeed, prewarmTone(color), PREWARM_HATCH_STRIDE);
      }

      // ---- render ---------------------------------------------------------
      // Flat cells, integer pixels, and a hard offset shadow — the look of
      // Snake Memories (2025). Every segment is a square; its "glow" is the same
      // square drawn first, pushed down-right by a tenth of a cell, in a darker
      // (or, for dark colours, lighter) tone. Shadows for every living thing go
      // down before any body, so a shadow never lands on a neighbour.
      const shadowCache = new Map();
      function shadowFor(hex) {
        let shade = shadowCache.get(hex);
        if (shade) return shade;
        const [r, g, b] = parseHex(hex);
        const brightness = (r + g + b) / 3;
        if (brightness < 10) shade = 'rgb(180,180,180)';
        else if (brightness < 60) shade = `rgb(${Math.min(255, r * 1.5) | 0},${Math.min(255, g * 1.5) | 0},${Math.min(255, b * 1.5) | 0})`;
        else shade = `rgb(${(r * 0.7) | 0},${(g * 0.7) | 0},${(b * 0.7) | 0})`;
        shadowCache.set(hex, shade);
        return shade;
      }

      const memoryCache = new Map();
      const prewarmCache = new Map();
      const deadColorCache = new Map();
      function desaturatedHex(hex, amount = 1) {
        let [r, g, b] = parseHex(hex);
        const grey = 0.299 * r + 0.587 * g + 0.114 * b;
        r = mixChannel(r, grey, amount);
        g = mixChannel(g, grey, amount);
        b = mixChannel(b, grey, amount);
        return '#' + hex2(r) + hex2(g) + hex2(b);
      }

      function memoryTone(hex) {
        let tone = memoryCache.get(hex);
        if (tone) return tone;
        tone = mixHex(desaturatedHex(hex, LOOK.memoryDesaturate), C_BG, LOOK.memoryFade);
        memoryCache.set(hex, tone);
        return tone;
      }

      function prewarmTone(hex) {
        let tone = prewarmCache.get(hex);
        if (tone) return tone;
        tone = mixHex(desaturatedHex(hex, LOOK.prewarmDesaturate), C_BG, LOOK.prewarmFade);
        prewarmCache.set(hex, tone);
        return tone;
      }

      function deadColorsFor(hex) {
        let colors = deadColorCache.get(hex);
        if (colors) return colors;
        colors = colorsForSwatch(desaturatedHex(hex, LOOK.memoryDesaturate));
        deadColorCache.set(hex, colors);
        return colors;
      }
      const cellPx = (x, y) => ({ px: Math.floor(OX + x * CELL), py: Math.floor(OY + y * CELL) });

      // Where each segment of a snake is drawn this frame. Every square slides
      // between cells, keeping the flat grid look without making the body snap.
      // A snake that just grew has no previous position for its new tail, so
      // that final square correctly stays still for the first move.
      function snakeCells(s) {
        const alpha = Math.min(1, (s.moveAcc || 0) / moveInterval(s));
        const body = s.body, prev = s.prev || body, n = body.length;
        const cells = new Array(n);
        for (let i = 0; i < n; i++) {
          const cur = body[i];
          const old = prev[i] || cur;
          cells[i] = cellPx(old.x + (cur.x - old.x) * alpha, old.y + (cur.y - old.y) * alpha);
          // Consecutive segments trade this grid cell during a move. Keeping it
          // as their joint lets the rendered body follow both orthogonal legs
          // of a turn instead of opening a diagonal gap between two squares.
          if (i + 1 < n) cells[i].joint = cellPx(body[i + 1].x, body[i + 1].y);
        }
        return cells;
      }

      function connectCellToJoint(cell, joint, offset) {
        ctx.rect(
          Math.min(cell.px, joint.px) + offset,
          Math.min(cell.py, joint.py) + offset,
          Math.abs(cell.px - joint.px) + CELL,
          Math.abs(cell.py - joint.py) + CELL,
        );
      }

      function fillConnectedCells(cells, color, offset = 0, from = 0, to = cells.length) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = from; i < to; i++) {
          const cell = cells[i];
          ctx.rect(cell.px + offset, cell.py + offset, CELL, CELL);
          if (i + 1 >= to || !cell.joint) continue;
          const next = cells[i + 1];
          connectCellToJoint(cell, cell.joint, offset);
          connectCellToJoint(next, cell.joint, offset);
        }
        ctx.fill();
      }

      function hash01(seed, n) {
        const x = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function deathVisibility(index, sweep) {
        return Math.max(0, Math.min(1, (index + DEATH_FADE_WIDTH - sweep) / DEATH_FADE_WIDTH));
      }

      // A dying snake keeps its crosshatched shape while a bright front travels
      // from head to tail. As the front reaches each segment, that cell is
      // committed into the permanent memory layer beneath it.
      function updateDeathStamps(death) {
        const sweep = Math.min(1, death.age / death.duration) * (death.body.length + DEATH_FADE_WIDTH);
        while (death.stamped < death.body.length && deathVisibility(death.stamped, sweep) < 1) {
          const cell = death.body[death.stamped];
          transferDeathHatchCell(death, cell);
          death.stamped++;
        }
        return sweep;
      }

      function drawDeaths() {
        for (const death of dying) {
          const n = death.body.length;
          if (!n) continue;
          const sweep = death.sweep;
          const cells = death.body.map(p => cellPx(p.x, p.y));
          const colors = deadColorsFor(death.colors.body);
          if (death.hatch) {
            ctx.drawImage(
              death.hatch.canvas,
              OX + death.hatch.x,
              OY + death.hatch.y,
              death.hatch.width,
              death.hatch.height,
            );
          }

          // The hot front: a bright cell and five sparking rays, travelling
          // from the head through the final tail segment.
          const progress = Math.min(1, death.age / death.duration);
          const frontIndex = Math.min(n - 1, Math.max(0, Math.floor(sweep - DEATH_FADE_WIDTH)));
          const cell = cells[frontIndex];
          const fx = cell.px + CELL / 2, fy = cell.py + CELL / 2;
          const pulse = 0.72 + Math.sin(death.age * 28) * 0.18;
          ctx.globalAlpha = Math.max(0, 1 - progress * 0.35);
          ctx.fillStyle = rgba(colors.accent, 0.55 + pulse * 0.25);
          ctx.fillRect(cell.px, cell.py, CELL, CELL);
          ctx.strokeStyle = rgba(colors.accent, 0.85);
          ctx.lineWidth = Math.max(1, Math.round(CELL * 0.08));
          ctx.beginPath();
          for (let ray = 0; ray < 5; ray++) {
            const angle = ray * Math.PI * 2 / 5 + death.age * (ray % 2 ? -2.2 : 2.8) + hash01(death.seed, ray) * 0.45;
            const inner = CELL * 0.3;
            const outer = CELL * (0.5 + hash01(death.seed + 13, ray) * 0.45) * pulse;
            ctx.moveTo(fx + Math.cos(angle) * inner, fy + Math.sin(angle) * inner);
            ctx.lineTo(fx + Math.cos(angle) * outer, fy + Math.sin(angle) * outer);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      function render() {
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = C_BG;
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(memory, OX, OY, GW * CELL, GH * CELL);

        drawDeaths();

        // A rapid one-cell hard blink suits the pixel-grid language without
        // reintroducing the old every-frame colour jitter.
        const mousePhase = mouse ? mouse.blinkAge % MOUSE_BLINK_PERIOD : 0;
        const mouseVisible = mouse && (reducedMotion || mousePhase < MOUSE_BLINK_PERIOD - MOUSE_BLINK_OFF);
        if (mouseVisible) {
          const m = cellPx(mouse.x, mouse.y);
          ctx.fillStyle = mouse.color;
          ctx.fillRect(m.px, m.py, CELL, CELL);
        }

        // Living snakes: every shadow, then every body. A winner blinks as one
        // continuous silhouette in its own colour before splitting.
        const shadowOffset = Math.max(1, Math.round(CELL * 0.1));
        const drawn = snakes
          .filter(victoryBlinkVisible)
          .map(s => ({ s, cells: snakeCells(s), colors: snakeColor(s) }));
        for (const d of drawn) fillConnectedCells(d.cells, shadowFor(d.colors.body), shadowOffset);
        for (const d of drawn) fillConnectedCells(d.cells, d.colors.body);
      }

      // ---- loop -----------------------------------------------------------
      function tick(t) {
        const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t; frame++;
        if (mouse) mouse.blinkAge = (mouse.blinkAge || 0) + dt;
        updateDeaths(dt);
        const celebrating = updateVictory(dt);
        if (!celebrating) {
          for (const s of snakes) s.moveAcc = (s.moveAcc || 0) + dt;
          for (let guard = 0; guard < 8; guard++) {
            const movers = snakes.filter(s => (s.moveAcc || 0) >= moveInterval(s));
            if (!movers.length) break;
            for (const s of movers) s.moveAcc -= moveInterval(s);
            step(movers);
          }
        }
        render();
        requestAnimationFrame(tick);
      }

      palettePanel.addEventListener('click', event => event.stopPropagation());
      paletteToggle.addEventListener('click', () => {
        const open = paletteToggle.getAttribute('aria-expanded') !== 'true';
        paletteToggle.setAttribute('aria-expanded', String(open));
        paletteToggle.textContent = open ? 'Hide' : 'Show';
        paletteOptions.hidden = !open;
        palettePanel.classList.toggle('is-collapsed', !open);
      });
      addEventListener('click', reset);
      addEventListener('resize', () => { resize(); reset(); });
      buildPaletteControls();
      resize();
      reset();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
