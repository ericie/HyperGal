<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>

  <body>
    <canvas id="stage"></canvas>
    <div class="caption">hydra · 2026 · twenty contenders, one mouse · click to reseed</div>
    <script>
      // hydra — autonomous traditional Snake, rendered as a flooded cavern mural.
      //
      // Twenty contenders hunt one mouse. Snakes enter from beyond the arena with
      // varied length and aggression, which tilt each one between chasing the
      // mouse and preserving room around bodies. The leaders compound their
      // advantage, but also become increasingly careful about future escape space.
      // Edge, self, and other-snake contact kill one snake; a bright extinction
      // front travels from head to tail, exposing abstract hatchwork one segment
      // at a time as the living pigment recedes.
      //
      // The look borrows the electric indigo, cyan, violet, and mineral pink of
      // an 8-bit Mega Man underground stage, haunted by dim woven remains.

      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;

      // ---- tunables -------------------------------------------------------
      const STEP = 0.18;         // starting seconds per snake move
      const MIN_STEP = 0.075;    // a leader becomes visibly, decisively faster
      const SPEEDUP_PER_SEG = 0.0048;
      const STREAK_SPEEDUP = 0.008;
      const GROW = 1;            // streak growth is triangular: 2, 4, 7, 11...
      const START_SNAKES = 20;
      const START_LEN_MIN = 4;
      const START_LEN_MAX = 9;
      const MAX_POOLS = 64;
      const DEATH_FADE_BASE = 0.28;
      const DEATH_FADE_PER_SEG = 0.003;
      const DEATH_FADE_MAX = 0.72;
      const DEATH_FADE_WIDTH = 3.2;
      const AGGRESSION_MIN = 0.42, AGGRESSION_MAX = 0.88;
      const AGGRESSION_PER_SEG = 0.045;
      const AGGRESSION_CAP = 0.97;
      const HUNT_DISTANCE_WEIGHT = 13;
      const FOOD_CAPTURE_BONUS = 520;
      const BOX_SPACE_RATIO = 2.4; // opponent space must be tight relative to body length
      const BOX_PRESSURE_RADIUS = 7;
      const DEAD_END_PENALTY = 5000;
      const SINGLE_EXIT_PENALTY = 420;
      const DOUBLE_EXIT_PENALTY = 55;
      const CONTESTED_EXIT_PENALTY = 180;
      const TURN_MARGIN = 5;     // keep moving straight unless a turn is clearly better
      const EDGE_TURN_MARGIN = 1.5;
      const OFF_ROUTE_TURN_MARGIN = 0.75;
      const EDGE_RELIEF_WEIGHT = 6;
      const SAFE_BODY_BUFFER = 6;
      const LEADER_SMART_AT = 5;
      const LEADER_SMART_SPAN = 10;
      const LEADER_VETERAN_SPAN = 45;
      const SMART_LOOKAHEAD_MIN = 2;
      const SMART_LOOKAHEAD_MAX = 7;
      const DENSIFY_AT = 36;
      const DENSIFY_SPAN = 28;
      const DENSITY_RADIUS = 4;
      const DENSITY_REWARD = 30;
      const FINAL_BODY_RESERVE = 0.06;
      const MIN_DENSE_RESERVE = 8;
      const PACKING_CYCLE_AT_RATIO = 0.08;
      const PACKING_CYCLE_SPAN_RATIO = 0.04;
      const PACKING_CYCLE_REWARD = 3200;
      const PACKING_SHORTCUT_REWARD = 0.9;
      const VICTORY_DURATION = 2.8;
      const VICTORY_REDUCED_DURATION = 0.7;

      // Mega Man underground: near-black navy, tile indigo, electric cobalt,
      // water cyan, mineral violet and the small amber energy pickup.
      const C_BG = '#06091d';
      const C_MOUSE = '#ffd35a';
      const C_BORDER = '#3267c8';
      const C_CLOT = '6,9,29';
      const C_HATCH = '112,130,154';
      const C_HATCH_LIGHT = '164,177,194';
      const GLOW = '#27a4ff';
      const WINNER_COLORS = {
        body: '#d99a00',
        head: '#fff3a0',
        glow: '#ffc928',
        ring: '217,154,0',
        accent: '255,243,160',
        dark: '92,51,0',
      };
      const SNAKE_PALETTE = [
        { body: '#086bc1', head: '#8bd9ff', glow: '#27a4ff', ring: '8,107,193', accent: '139,217,255', dark: '20,38,100' },
        { body: '#5933a8', head: '#bfa4ff', glow: '#815bd6', ring: '89,51,168', accent: '191,164,255', dark: '36,20,84' },
        { body: '#b43d89', head: '#ff91c8', glow: '#d653a4', ring: '180,61,137', accent: '255,145,200', dark: '72,20,75' },
        { body: '#274ac7', head: '#87a7ff', glow: '#496fe8', ring: '39,74,199', accent: '135,167,255', dark: '17,28,91' },
        { body: '#079ba7', head: '#79f2ed', glow: '#20cbd2', ring: '7,155,167', accent: '121,242,237', dark: '10,53,79' },
        { body: '#6d3db6', head: '#ff91c8', glow: '#945dd8', ring: '109,61,182', accent: '255,145,200', dark: '43,24,91' },
        { body: '#0c82cf', head: '#d1f1ff', glow: '#27a4ff', ring: '12,130,207', accent: '209,241,255', dark: '15,42,104' },
        { body: '#9b418f', head: '#bfa4ff', glow: '#c45aaf', ring: '155,65,143', accent: '191,164,255', dark: '62,25,78' },
        { body: '#3159d0', head: '#79f2ed', glow: '#527cf0', ring: '49,89,208', accent: '121,242,237', dark: '21,33,98' },
        { body: '#087e9f', head: '#8bd9ff', glow: '#24b7d0', ring: '8,126,159', accent: '139,217,255', dark: '9,45,72' },
      ];

      // ---- state ----------------------------------------------------------
      let W = 0, H = 0, dpr = 1, CELL = 18, GW = 0, GH = 0, OX = 0, OY = 0;
      let snakes = [], mouse = null, pools = [], dying = [], lastEater = null;
      let packingCycle = [], packingRank = new Map();
      let brainOwners = null;
      let last = 0, frame = 0, colorCursor = 0;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = (a) => a[(Math.random() * a.length) | 0];
      const inB = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH;
      const cl = (v, m) => v < 0 ? 0 : v >= m ? m - 1 : v;
      const tdist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
      const borderDistance = (p) => Math.min(p.x, p.y, GW - 1 - p.x, GH - 1 - p.y);
      const key = (p) => `${p.x},${p.y}`;
      const rgba = (rgb, a) => `rgba(${rgb},${a})`;
      const sameCell = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;
      const sameDir = (a, b) => a.x === b.x && a.y === b.y;
      const copyBody = (b) => b.map(p => ({ x: p.x, y: p.y }));
      const baseSnakeColor = (s) => SNAKE_PALETTE[s.colorIndex % SNAKE_PALETTE.length] || SNAKE_PALETTE[0];
      const parseHex = (hex) => {
        const value = Number.parseInt(hex.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      };
      const mixChannel = (a, b, amount) => Math.round(a + (b - a) * amount);
      const mixHex = (from, to, amount) => {
        const a = parseHex(from), b = parseHex(to);
        return `rgb(${mixChannel(a[0], b[0], amount)},${mixChannel(a[1], b[1], amount)},${mixChannel(a[2], b[2], amount)})`;
      };
      const mixRgb = (from, to, amount) => {
        const a = from.split(',').map(Number), b = to.split(',').map(Number);
        return `${mixChannel(a[0], b[0], amount)},${mixChannel(a[1], b[1], amount)},${mixChannel(a[2], b[2], amount)}`;
      };
      const victoryDuration = () => reducedMotion ? VICTORY_REDUCED_DURATION : VICTORY_DURATION;
      const winnerGoldAmount = (s) => {
        if (!s.winner) return 0;
        if (!s.victoryActive || reducedMotion) return 1;
        const progress = Math.min(1, (s.victoryAge || 0) / victoryDuration());
        const blink = Math.pow(0.5 - 0.5 * Math.cos(progress * Math.PI * 12), 2.2);
        const settleProgress = Math.max(0, Math.min(1, (progress - 0.7) / 0.3));
        const settle = 1 - Math.pow(1 - settleProgress, 4);
        return Math.max(blink, settle);
      };
      const mixedWinnerColor = (base, gold) => {
        return {
          body: mixHex(base.body, WINNER_COLORS.body, gold),
          head: mixHex(base.head, WINNER_COLORS.head, gold),
          glow: mixHex(base.glow, WINNER_COLORS.glow, gold),
          ring: mixRgb(base.ring, WINNER_COLORS.ring, gold),
          accent: mixRgb(base.accent, WINNER_COLORS.accent, gold),
          dark: mixRgb(base.dark, WINNER_COLORS.dark, gold),
        };
      };
      const snakeColor = (s) => s.golden
        ? mixedWinnerColor(baseSnakeColor(s), 1)
        : baseSnakeColor(s);
      const winnerHeadColor = (s, gold = winnerGoldAmount(s)) => mixedWinnerColor(baseSnakeColor(s), gold);
      const nextColorIndex = () => colorCursor++ % SNAKE_PALETTE.length;
      const newStartLength = () => START_LEN_MIN + ((Math.random() * (START_LEN_MAX - START_LEN_MIN + 1)) | 0);
      const newAggression = () => rand(AGGRESSION_MIN, AGGRESSION_MAX);
      const initialMovePhase = (colorIndex) => STEP * ((colorIndex % START_SNAKES) / START_SNAKES);
      const nextEatStreak = (s) => lastEater === s ? (s.eatStreak || 0) + 1 : 1;
      const growthForStreak = (streak, length = START_LEN_MIN) => GROW + (streak * (streak + 1)) / 2 + Math.floor(Math.max(0, length - START_LEN_MIN) / 7);
      const growthForNextMouse = (s) => growthForStreak(nextEatStreak(s), s.body.length);
      const effectiveAggression = (s) => Math.min(AGGRESSION_CAP, s.aggression + Math.max(0, s.body.length - START_LEN_MIN) * AGGRESSION_PER_SEG);
      const leaderIntelligence = (s) => {
        const growth = Math.max(0, s.body.length - LEADER_SMART_AT);
        const trained = Math.min(1, growth / LEADER_SMART_SPAN);
        const veteran = Math.min(1, Math.max(0, growth - LEADER_SMART_SPAN) / LEADER_VETERAN_SPAN);
        return trained + veteran;
      };
      const smartLookaheadDepth = (intelligence) => {
        if (intelligence <= 0.05) return 0;
        const trainedDepth = SMART_LOOKAHEAD_MIN + Math.floor(Math.min(1, intelligence) * 3 + 1e-6);
        const veteranDepth = Math.floor(Math.max(0, intelligence - 1) * 2 + 1e-6);
        return Math.min(SMART_LOOKAHEAD_MAX, trainedDepth + veteranDepth);
      };
      const densifyDrive = (s) => Math.min(1, Math.max(0, (s.body.length - DENSIFY_AT) / DENSIFY_SPAN));
      const hungerDrive = (s) => 1 + densifyDrive(s) * 8;
      const packingCycleDrive = (s) => {
        const arena = Math.max(1, packingCycle.length || GW * GH);
        const start = arena * PACKING_CYCLE_AT_RATIO;
        const span = Math.max(1, arena * PACKING_CYCLE_SPAN_RATIO);
        return Math.min(1, Math.max(0, (s.body.length - start) / span));
      };
      const moveInterval = (s) => Math.max(MIN_STEP, STEP - Math.max(0, s.body.length - START_LEN_MIN) * SPEEDUP_PER_SEG - Math.min(0.032, (s.eatStreak || 0) * STREAK_SPEEDUP));
      const occupiedBySnakes = (x, y, list = snakes) => list.some(s => s.body.some(p => p.x === x && p.y === y));

      function buildBrainOwners(list = snakes) {
        const owners = new Map();
        for (const snake of list) for (const p of snake.body) owners.set(key(p), snake);
        return owners;
      }

      // ---- sizing ---------------------------------------------------------
      function resize() {
        W = innerWidth; H = innerHeight; dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        CELL = Math.max(13, Math.round(Math.min(W, H) / 34));
        GW = Math.max(12, Math.floor((W - CELL * 3) / CELL));
        GH = Math.max(12, Math.floor((H - CELL * 4) / CELL));
        // Odd-by-odd grids cannot contain a Hamiltonian cycle. Trim one column
        // so a mature snake always has a route through every arena cell.
        if (GW % 2 === 1 && GH % 2 === 1) GW--;
        OX = Math.round((W - GW * CELL) / 2);
        OY = Math.round((H - GH * CELL) / 2);
        buildPackingCycle();
      }

      function buildPackingCycle() {
        packingCycle = [{ x: 0, y: 0 }];
        if (GH % 2 === 0) {
          // Sweep every row except the first column, then return up that column.
          for (let y = 0; y < GH; y++) {
            if (y % 2 === 0) {
              for (let x = 1; x < GW; x++) packingCycle.push({ x, y });
            } else {
              for (let x = GW - 1; x >= 1; x--) packingCycle.push({ x, y });
            }
          }
          for (let y = GH - 1; y >= 1; y--) packingCycle.push({ x: 0, y });
        } else {
          // Transposed form for an even-width, odd-height arena.
          for (let x = 0; x < GW; x++) {
            if (x % 2 === 0) {
              for (let y = 1; y < GH; y++) packingCycle.push({ x, y });
            } else {
              for (let y = GH - 1; y >= 1; y--) packingCycle.push({ x, y });
            }
          }
          for (let x = GW - 1; x >= 1; x--) packingCycle.push({ x, y: 0 });
        }
        packingRank = new Map(packingCycle.map((p, i) => [key(p), i]));
      }

      // ---- seeding --------------------------------------------------------
      function randomFreeCell(list = snakes) {
        for (let t = 0; t < 300; t++) {
          const x = (Math.random() * GW) | 0, y = (Math.random() * GH) | 0;
          if (!occupiedBySnakes(x, y, list)) return { x, y };
        }
        return { x: (Math.random() * GW) | 0, y: (Math.random() * GH) | 0 };
      }

      function buildBody(x, y, len, dir) {
        const body = [];
        for (let i = 0; i < len; i++) body.push({ x: x - dir.x * i, y: y - dir.y * i });
        return body;
      }

      function bodyFits(body, avoid = []) {
        return body.every(p => inB(p.x, p.y) && !occupiedBySnakes(p.x, p.y, avoid));
      }

      function makeSnake(x, y, len, colorIndex, aggression = newAggression(), avoid = []) {
        x = cl(x, GW); y = cl(y, GH);
        for (let t = 0; t < 300; t++) {
          const seed = t === 0 ? { x, y } : randomFreeCell(avoid);
          const fits = DIRS.filter(d => bodyFits(buildBody(seed.x, seed.y, len, d), avoid));
          if (!fits.length) continue;
          const dir = pick(fits);
          const body = buildBody(seed.x, seed.y, len, dir);
          return { body, dir, grow: 0, prev: copyBody(body), colorIndex, aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
        }
        const dir = pick(DIRS);
        const body = buildBody(x, y, Math.min(len, START_LEN_MIN), dir).filter(p => inB(p.x, p.y));
        return { body, dir, grow: 0, prev: copyBody(body), colorIndex, aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
      }

      function entrySpec(side, lane) {
        if (side === 0) return { x: -1, y: lane, dir: { x: 1, y: 0 } };
        if (side === 1) return { x: GW, y: lane, dir: { x: -1, y: 0 } };
        if (side === 2) return { x: lane, y: -1, dir: { x: 0, y: 1 } };
        return { x: lane, y: GH, dir: { x: 0, y: -1 } };
      }

      function makeEntrySnake(avoid = snakes, reserved = new Set()) {
        const len = newStartLength();
        const colorIndex = nextColorIndex();
        const aggression = newAggression();
        for (let t = 0; t < 300; t++) {
          const side = t < 4 ? t : (Math.random() * 4) | 0;
          const span = side < 2 ? GH : GW;
          const lane = t < 4 ? Math.max(0, Math.min(span - 1, Math.floor(span * (t + 0.5) / 4))) : (Math.random() * span) | 0;
          const spec = entrySpec(side, lane);
          const entry = { x: spec.x + spec.dir.x, y: spec.y + spec.dir.y };
          const ek = key(entry);
          if (!inB(entry.x, entry.y) || occupiedBySnakes(entry.x, entry.y, avoid) || reserved.has(ek)) continue;
          const body = buildBody(spec.x, spec.y, len, spec.dir);
          reserved.add(ek);
          return { body, dir: spec.dir, grow: 0, prev: copyBody(body), colorIndex, aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
        }
        const spec = entrySpec((Math.random() * 4) | 0, 0);
        const body = buildBody(spec.x, spec.y, len, spec.dir);
        return { body, dir: spec.dir, grow: 0, prev: copyBody(body), colorIndex, aggression, moveAcc: initialMovePhase(colorIndex), eatStreak: 0 };
      }

      function bringContenders(list = snakes) {
        const reserved = new Set();
        while (list.length < START_SNAKES) list.push(makeEntrySnake(list, reserved));
      }

      function fragmentDirection(source, start, fragment, fallback) {
        if (fragment.length > 1) {
          return {
            x: fragment[0].x - fragment[1].x,
            y: fragment[0].y - fragment[1].y,
          };
        }
        const current = fragment[0];
        const towardHead = source[start - 1];
        const towardTail = source[start + 1];
        if (towardHead) return { x: towardHead.x - current.x, y: towardHead.y - current.y };
        if (towardTail) return { x: current.x - towardTail.x, y: current.y - towardTail.y };
        return { x: fallback.x, y: fallback.y };
      }

      function winnerFragment(winner, source, start, end, golden = false) {
        const body = copyBody(source.slice(start, end));
        const colorIndex = golden ? winner.colorIndex : nextColorIndex();
        return {
          body,
          dir: fragmentDirection(source, start, body, winner.dir),
          grow: Math.max(0, START_LEN_MIN - body.length),
          prev: copyBody(body),
          colorIndex,
          aggression: golden ? winner.aggression : newAggression(),
          moveAcc: 0,
          eatStreak: 0,
          golden,
        };
      }

      function splitWinner(winner) {
        const source = copyBody(winner.body);
        if (!source.length) return;
        const goldenLength = Math.min(2, source.length);
        const offspring = [winnerFragment(winner, source, 0, goldenLength, true)];
        const remainder = source.length - goldenLength;
        const fragmentCount = Math.min(START_SNAKES - 1, remainder);

        for (let i = 0; i < fragmentCount; i++) {
          const start = goldenLength + Math.floor(i * remainder / fragmentCount);
          const end = goldenLength + Math.floor((i + 1) * remainder / fragmentCount);
          offspring.push(winnerFragment(winner, source, start, end));
        }

        for (let i = 0; i < offspring.length; i++) {
          offspring[i].moveAcc = STEP * (i / Math.max(1, offspring.length));
        }
        lastEater = null;
        snakes = offspring;
      }

      function spawnMouse(list = snakes) {
        mouse = randomFreeCell(list);
      }

      function reset() {
        snakes = []; mouse = null; pools = []; dying = []; lastEater = null; colorCursor = 0;
        bringContenders(snakes);
        spawnMouse();
      }

      function beginVictory(s) {
        s.winner = true;
        s.victoryActive = true;
        s.victoryAge = 0;
        s.moveAcc = 0;
      }

      function updateVictory(dt) {
        if (snakes.length !== 1 || !snakes[0].victoryActive) return false;
        const winner = snakes[0];
        winner.victoryAge = Math.min(victoryDuration(), (winner.victoryAge || 0) + dt);
        winner.moveAcc = 0;
        if (winner.victoryAge >= victoryDuration()) {
          winner.victoryActive = false;
          splitWinner(winner);
        }
        return true;
      }

      // ---- snake brain ----------------------------------------------------
      function chooseDir(s) {
        const h = s.body[0];
        const opts = DIRS.filter(d => !(d.x === -s.dir.x && d.y === -s.dir.y));
        const intelligence = leaderIntelligence(s);
        // Hunger is absolute: if the mouse is one legal step away, bite it even
        // when that step leaves a young snake's preferred route. Leaders still
        // evaluate the bite so food cannot lure them into a sealed pocket.
        const bite = opts.find(d => {
          const p = { x: h.x + d.x, y: h.y + d.y };
          return sameCell(p, mouse) && inB(p.x, p.y) && !hitSelf(s, p) && !hitOtherSnake(s, p);
        });
        if (bite && intelligence < 0.2) {
          s.dir = bite;
          return;
        }
        choosePackingDirection(s);
        const choices = [];
        for (const d of opts) {
          const detail = {};
          choices.push({ d, score: scoreMove(s, d, detail), ...detail });
        }

        let contenders = choices.filter(choice => choice.legal);
        // A corner has fewer nominal exits, so the general safety tiers can
        // otherwise make a snake orbit a perfectly reachable mouse forever.
        // Lock onto the shortest approach only when it includes a legal exit
        // after the bite; a genuinely sealed corner still falls back to safety.
        if (isCornerCell(mouse) && contenders.length) {
          const cornerHunters = contenders.filter(choice => choice.huntSafe && Number.isFinite(choice.cornerPath));
          if (cornerHunters.length) {
            const shortestCornerPath = Math.min(...cornerHunters.map(choice => choice.cornerPath));
            contenders = cornerHunters.filter(choice => choice.cornerPath === shortestCornerPath);
          }
        }
        // Intelligence is lexicographic before it is numeric: a mature snake
        // first discards moves with a meaningfully worse survival class, then
        // chooses among the remaining routes. This prevents a food bonus or a
        // tiny distance gain from buying entry into an obvious cul-de-sac.
        if (intelligence > 0.05 && contenders.length) {
          const bestSafety = Math.max(...contenders.map(choice => choice.safetyTier));
          const toleratedDrop = intelligence < 0.35 ? 2 : intelligence < 0.7 ? 1 : 0;
          const safer = contenders.filter(choice => choice.safetyTier >= bestSafety - toleratedDrop);
          if (safer.length) contenders = safer;
        }
        // Veteran leaders compare the full survival horizon inside the best
        // safety class. The longest snakes stop accepting a route that fails
        // even one move earlier when a deeper escape remains available.
        if (intelligence > 1 && contenders.length) {
          const bestHorizon = Math.max(...contenders.map(choice => choice.horizon));
          const toleratedShortfall = intelligence < 1.5 ? 1 : 0;
          const farsighted = contenders.filter(choice => choice.horizon >= bestHorizon - toleratedShortfall);
          if (farsighted.length) contenders = farsighted;
        }
        // Once packing activates, hunger becomes lexicographic: first take the
        // shortest available mouse route, then let survival and density break
        // ties. If the static body blocks every computed route, direct distance
        // keeps the head hunting instead of retiring into box-filling mode.
        if (mouse && packingCycleDrive(s) > 0 && contenders.length) {
          const safeHunters = contenders.filter(choice => choice.huntSafe);
          const huntDistance = choice => Number.isFinite(choice.path)
            ? choice.path
            : GW + GH + choice.mouseDist;
          if (safeHunters.length) {
            const shortest = Math.min(...safeHunters.map(huntDistance));
            contenders = safeHunters.filter(choice => huntDistance(choice) === shortest);
          }
        }

        const ranked = contenders.length ? contenders : choices;
        let bestChoice = ranked[0];
        for (const choice of ranked) if (!bestChoice || choice.score > bestChoice.score) bestChoice = choice;
        let best = bestChoice ? bestChoice.d : s.dir;
        const straight = ranked.find(choice => sameDir(choice.d, s.dir));
        if (!sameDir(best, s.dir) && straight && straight.score >= bestChoice.score - turnMarginFor(s)) best = s.dir;
        s.dir = best;
      }

      function choosePackingDirection(s) {
        if (packingCycleDrive(s) <= 0 || s.packingDirection === 1 || s.packingDirection === -1) return;
        const count = packingCycle.length;
        const headRank = packingRank.get(key(s.body[0]));
        if (headRank === undefined || !count) return;

        const forward = { x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y };
        const forwardRank = packingRank.get(key(forward));
        if (forwardRank === (headRank + 1) % count) s.packingDirection = 1;
        else if (forwardRank === (headRank - 1 + count) % count) s.packingDirection = -1;
        else {
          // Enter the cycle in the direction that reaches the current mouse
          // first; once selected, direction stays stable so the body aligns.
          const mouseRank = mouse ? packingRank.get(key(mouse)) : undefined;
          const clockwise = mouseRank === undefined ? 0 : (mouseRank - headRank + count) % count;
          const counter = mouseRank === undefined ? 0 : (headRank - mouseRank + count) % count;
          s.packingDirection = clockwise <= counter ? 1 : -1;
        }
      }

      function cycleDistance(from, to, direction) {
        return direction === 1
          ? (to - from + packingCycle.length) % packingCycle.length
          : (from - to + packingCycle.length) % packingCycle.length;
      }

      function packingCycleScore(s, p) {
        const drive = packingCycleDrive(s);
        if (drive <= 0 || !s.packingDirection || !packingCycle.length) return 0;
        const headRank = packingRank.get(key(s.body[0]));
        const nextRank = packingRank.get(key(p));
        if (headRank === undefined || nextRank === undefined) return 0;
        const desired = (headRank + s.packingDirection + packingCycle.length) % packingCycle.length;
        if (nextRank === desired) return drive * PACKING_CYCLE_REWARD;

        // A mature snake may jump forward across the empty portion of its
        // Hamiltonian loop to hunt. The shortcut must stay before the nearest
        // occupied rank and before the mouse, preserving body order and the
        // dense coil instead of opening a self-locking hole.
        const advance = cycleDistance(headRank, nextRank, s.packingDirection);
        const mouseRank = mouse ? packingRank.get(key(mouse)) : undefined;
        const mouseAdvance = mouseRank === undefined
          ? 0
          : cycleDistance(headRank, mouseRank, s.packingDirection);
        let nearestBody = packingCycle.length;
        for (let i = 1; i < s.body.length; i++) {
          const rank = packingRank.get(key(s.body[i]));
          if (rank === undefined) continue;
          const distance = cycleDistance(headRank, rank, s.packingDirection);
          if (distance > 0) nearestBody = Math.min(nearestBody, distance);
        }
        const orderedFoodShortcut = advance > 1
          && advance < nearestBody
          && mouseAdvance >= advance;
        return orderedFoodShortcut
          ? drive * PACKING_CYCLE_REWARD * PACKING_SHORTCUT_REWARD
          : -drive * PACKING_CYCLE_REWARD * 0.65;
      }

      function turnMarginFor(s) {
        const h = s.body[0];
        const straight = { x: h.x + s.dir.x, y: h.y + s.dir.y };
        if (!inB(straight.x, straight.y)) return 0;

        let margin = TURN_MARGIN;
        if (borderDistance(straight) <= 1) margin = Math.min(margin, EDGE_TURN_MARGIN);
        if (mouse && tdist(straight, mouse) >= tdist(h, mouse)) margin = Math.min(margin, OFF_ROUTE_TURN_MARGIN);
        return margin;
      }

      function futureBodyAfter(s, p, ate) {
        const future = [p, ...s.body];
        if (!ate && s.grow <= 0) future.pop();
        return future;
      }

      function blockedCells(s, body, start) {
        let blocked;
        if (brainOwners) {
          blocked = new Set(brainOwners.keys());
          for (const p of s.body) blocked.delete(key(p));
          for (const p of body) blocked.add(key(p));
        } else {
          blocked = new Set();
          for (const p of body) blocked.add(key(p));
          for (const other of snakes) {
            if (other === s) continue;
            for (const p of other.body) blocked.add(key(p));
          }
        }
        blocked.delete(key(start));
        return blocked;
      }

      function floodArea(s, start, body) {
        const blocked = blockedCells(s, body, start);
        const seen = new Set([key(start)]);
        const q = [start];
        for (let qi = 0; qi < q.length; qi++) {
          const p = q[qi];
          for (const d of DIRS) {
            const n = { x: p.x + d.x, y: p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push(n);
          }
        }
        return seen.size;
      }

      function pathDistanceToMouse(s, start, body) {
        if (!mouse) return 0;
        const blocked = blockedCells(s, body, start);
        const seen = new Set([key(start)]);
        const q = [{ p: start, dist: 0 }];
        for (let qi = 0; qi < q.length; qi++) {
          const cur = q[qi];
          if (sameCell(cur.p, mouse)) return cur.dist;
          for (const d of DIRS) {
            const n = { x: cur.p.x + d.x, y: cur.p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push({ p: n, dist: cur.dist + 1 });
          }
        }
        return Infinity;
      }

      function isCornerCell(p) {
        return !!p
          && (p.x === 0 || p.x === GW - 1)
          && (p.y === 0 || p.y === GH - 1);
      }

      function safeCornerPathDistance(s, start, body, arrivalDir) {
        if (!isCornerCell(mouse)) return Infinity;
        const blocked = blockedCells(s, body, start);
        const seen = new Set([`${key(start)}|${arrivalDir.x},${arrivalDir.y}`]);
        const q = [{ p: start, dir: arrivalDir, dist: 0 }];

        const hasExit = (p, dir) => DIRS.some(d => {
          if (d.x === -dir.x && d.y === -dir.y) return false;
          const n = { x: p.x + d.x, y: p.y + d.y };
          return inB(n.x, n.y)
            && !blocked.has(key(n))
            && !rivalCanClaim(s, n);
        });

        for (let qi = 0; qi < q.length; qi++) {
          const cur = q[qi];
          if (sameCell(cur.p, mouse) && hasExit(cur.p, cur.dir)) return cur.dist;
          for (const d of DIRS) {
            if (d.x === -cur.dir.x && d.y === -cur.dir.y) continue;
            const n = { x: cur.p.x + d.x, y: cur.p.y + d.y };
            const stateKey = `${key(n)}|${d.x},${d.y}`;
            if (!inB(n.x, n.y) || blocked.has(key(n)) || seen.has(stateKey) || rivalCanClaim(s, n)) continue;
            seen.add(stateKey);
            q.push({ p: n, dir: d, dist: cur.dist + 1 });
          }
        }
        return Infinity;
      }

      function reachabilityProfile(s, start, body) {
        const tail = body[body.length - 1];
        const blocked = blockedCells(s, body, start);
        // One scan answers reachable area and food distance with the same
        // blocked cells as before. Tail access is equivalent to reaching any
        // cell beside the tail, so it does not need a second flood-fill.
        const seen = new Set([key(start)]);
        const q = [{ p: start, dist: 0 }];
        let path = mouse && sameCell(start, mouse) ? 0 : Infinity;
        let tailReachable = !tail || sameCell(start, tail) || tdist(start, tail) === 1;
        for (let qi = 0; qi < q.length; qi++) {
          const cur = q[qi];
          for (const d of DIRS) {
            const n = { x: cur.p.x + d.x, y: cur.p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            const dist = cur.dist + 1;
            seen.add(nk);
            q.push({ p: n, dist });
            if (!Number.isFinite(path) && sameCell(n, mouse)) path = dist;
            if (!tailReachable && tdist(n, tail) === 1) tailReachable = true;
          }
        }
        return { area: seen.size, path: mouse ? path : 0, tailReachable };
      }

      function nearestOtherDistance(s, p) {
        let best = Infinity;
        for (const other of snakes) {
          if (other === s) continue;
          for (const b of other.body) best = Math.min(best, tdist(p, b));
        }
        return Number.isFinite(best) ? best : GW + GH;
      }

      function olderBodyDensity(body, p) {
        const older = body.slice(Math.min(8, body.length));
        const occupied = new Set(older.map(key));
        let density = 0, enclosedDirections = 0;

        // Nearby non-neck segments reward tight parallel lanes. Multiple body
        // walls around the head add an enclosure bonus, guiding it into holes
        // that earlier passes left inside an otherwise dense coil.
        for (const b of older) {
          const distance = tdist(p, b);
          if (distance <= DENSITY_RADIUS) density += DENSITY_RADIUS + 1 - distance;
        }
        for (const d of DIRS) {
          for (let distance = 1; distance <= DENSITY_RADIUS + 1; distance++) {
            if (!occupied.has(`${p.x + d.x * distance},${p.y + d.y * distance}`)) continue;
            enclosedDirections++;
            break;
          }
        }
        return Math.min(16, density + Math.max(0, enclosedDirections - 1) * 2.5);
      }

      function canReachTail(s, start, body) {
        if (body.length < 2) return true;
        const tail = body[body.length - 1];
        const blocked = blockedCells(s, body, start);
        blocked.delete(key(tail));
        const seen = new Set([key(start)]);
        const q = [start];
        for (let qi = 0; qi < q.length; qi++) {
          const p = q[qi];
          if (sameCell(p, tail)) return true;
          for (const d of DIRS) {
            const n = { x: p.x + d.x, y: p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || blocked.has(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push(n);
          }
        }
        return false;
      }

      function rivalHeadRisk(s, p) {
        let risk = 0;
        for (const other of snakes) {
          if (other === s) continue;
          const oh = other.body[0];
          for (const d of DIRS) {
            if (d.x === -other.dir.x && d.y === -other.dir.y) continue;
            if (oh.x + d.x !== p.x || oh.y + d.y !== p.y) continue;
            const sizeThreat = Math.max(0.6, other.body.length / Math.max(1, s.body.length));
            risk += 90 * sizeThreat;
          }
        }
        return risk;
      }

      function rivalCanClaim(s, p) {
        for (const other of snakes) {
          if (other === s || other.body.length < s.body.length) continue;
          const oh = other.body[0];
          for (const d of DIRS) {
            if (d.x === -other.dir.x && d.y === -other.dir.y) continue;
            if (oh.x + d.x === p.x && oh.y + d.y === p.y) return true;
          }
        }
        return false;
      }

      function futureEscapeProfile(s, start, body, arrivalDir, intelligence) {
        let exits = 0, safeExits = 0, bestArea = 0;
        const futures = [];
        for (const d of DIRS) {
          if (d.x === -arrivalDir.x && d.y === -arrivalDir.y) continue;
          const n = { x: start.x + d.x, y: start.y + d.y };
          if (!inB(n.x, n.y)) continue;
          const ownBlocked = body.slice(0, Math.max(1, body.length - 1)).some(p => sameCell(p, n));
          if (ownBlocked || hitOtherSnake(s, n)) continue;
          exits++;
          if (!rivalCanClaim(s, n)) safeExits++;
          if (intelligence > 0) futures.push(n);
        }
        // Escape-area lookahead only contributes when leader intelligence is
        // nonzero. Short contenders avoid up to three wasted flood-fills here.
        for (const n of futures) {
          const after = [n, ...body];
          after.pop();
          bestArea = Math.max(bestArea, floodArea(s, n, after));
        }
        return { exits, safeExits, bestArea };
      }

      function survivalHorizon(s, start, body, arrivalDir, depth, growthLeft) {
        if (depth <= 0) return 0;
        let best = 0;
        for (const d of DIRS) {
          if (d.x === -arrivalDir.x && d.y === -arrivalDir.y) continue;
          const n = { x: start.x + d.x, y: start.y + d.y };
          if (!inB(n.x, n.y) || hitOtherSnake(s, n)) continue;

          const tailVacates = growthLeft <= 0;
          const ownEnd = tailVacates ? Math.max(1, body.length - 1) : body.length;
          if (body.slice(0, ownEnd).some(p => sameCell(p, n))) continue;

          const after = [n, ...body];
          const nextGrowth = Math.max(0, growthLeft - 1);
          if (growthLeft <= 0) after.pop();
          const survived = 1 + survivalHorizon(s, n, after, d, depth - 1, nextGrowth);
          best = Math.max(best, survived);
          if (best >= depth) break;
        }
        return best;
      }

      function opponentEscapeArea(s, future, other, limit = Infinity, futureKeys = null) {
        const start = other.body[0];
        const startKey = key(start);
        let isBlocked;
        if (brainOwners) {
          const candidate = futureKeys || new Set(future.map(key));
          isBlocked = nk => {
            if (candidate.has(nk)) return true;
            const owner = brainOwners.get(nk);
            if (!owner || owner === s) return false;
            return owner !== other || nk !== startKey;
          };
        } else {
          const blocked = new Set(future.map(key));
          for (const rival of snakes) {
            if (rival === s) continue;
            const body = rival === other ? rival.body.slice(1) : rival.body;
            for (const p of body) blocked.add(key(p));
          }
          blocked.delete(startKey);
          isBlocked = nk => blocked.has(nk);
        }

        const seen = new Set([startKey]);
        const q = [start];
        for (let qi = 0; qi < q.length; qi++) {
          const p = q[qi];
          for (const d of DIRS) {
            const n = { x: p.x + d.x, y: p.y + d.y };
            const nk = key(n);
            if (!inB(n.x, n.y) || isBlocked(nk) || seen.has(nk)) continue;
            seen.add(nk); q.push(n);
            if (seen.size >= limit) return seen.size;
          }
        }
        return seen.size;
      }

      function boxingScore(s, nx, future) {
        let score = 0;
        const futureKeys = brainOwners ? new Set(future.map(key)) : null;
        let currentKeys = null;
        for (const other of snakes) {
          if (other === s) continue;
          const targetEscape = s.body.length * BOX_SPACE_RATIO;
          // Most opponents have abundant room. Stop as soon as the target has
          // enough cells to prove it is not boxed instead of flooding the arena.
          const escape = opponentEscapeArea(s, future, other, Math.ceil(targetEscape), futureKeys);
          const spacePressure = Math.max(0, targetEscape - escape);
          if (spacePressure <= 0) continue;

          // If the future area is genuinely cramped, compute the original full
          // comparison. This rare branch preserves the exact trap score.
          if (brainOwners && !currentKeys) currentKeys = new Set(s.body.map(key));
          const currentEscape = opponentEscapeArea(s, s.body, other, Infinity, currentKeys);
          const constriction = Math.max(0, currentEscape - escape);
          const pressure = Math.max(0, BOX_PRESSURE_RADIUS - tdist(nx, other.body[0]));
          const leverage = Math.min(2.4, s.body.length / Math.max(1, other.body.length));
          score += leverage * (spacePressure * 5 + constriction * 12 + pressure * 7);
        }
        return score;
      }

      function scoreMove(s, d, detail = null) {
        const h = s.body[0];
        const nx = { x: h.x + d.x, y: h.y + d.y };
        const ate = sameCell(nx, mouse);
        const mouseDist = mouse ? tdist(nx, mouse) : 0;
        if (!inB(nx.x, nx.y) || hitSelf(s, nx) || hitOtherSnake(s, nx)) {
          if (detail) Object.assign(detail, { legal: false, path: Infinity, mouseDist });
          return -100000 - mouseDist;
        }

        const future = futureBodyAfter(s, nx, ate);
        const densify = densifyDrive(s);
        const eatGrowth = ate ? growthForNextMouse(s) : 0;
        const bodyNeed = s.body.length + s.grow + eatGrowth;
        const intelligence = leaderIntelligence(s);
        const reachability = reachabilityProfile(s, nx, future);
        const area = reachability.area;
        const cornerPath = isCornerCell(mouse) ? safeCornerPathDistance(s, nx, future, d) : Infinity;
        const path = isCornerCell(mouse) ? cornerPath : reachability.path;
        if (detail) Object.assign(detail, { legal: true, path, cornerPath, mouseDist });
        // Requiring one free cell for every body segment imposes a permanent
        // 50% density ceiling. A mature snake instead follows its tail through
        // a much smaller reserve, letting it occupy most of the arena.
        const bodyReserveScale = 1 - densify * (1 - FINAL_BODY_RESERVE);
        const bufferScale = 1 - densify * 0.9;
        const safeNeed = Math.max(MIN_DENSE_RESERVE, Math.round(
          bodyNeed * bodyReserveScale + SAFE_BODY_BUFFER * intelligence * bufferScale
        ));
        const crampedPenalty = Math.max(0, safeNeed - area) * (55 + intelligence * 150);
        const escape = futureEscapeProfile(s, nx, future, d, intelligence);
        const tailReachable = reachability.tailReachable;
        const lookaheadDepth = smartLookaheadDepth(intelligence);
        const growthLeft = ate
          ? Math.max(0, s.grow + eatGrowth - 1)
          : Math.max(0, s.grow - 1);
        const horizon = lookaheadDepth > 0
          ? survivalHorizon(s, nx, future, d, lookaheadDepth, growthLeft)
          : 0;
        const horizonShortfall = Math.max(0, lookaheadDepth - horizon);
        let safetyTier = 0;
        if (escape.exits > 0) safetyTier += 2;
        if (escape.safeExits > 0) safetyTier += 1;
        if (escape.safeExits >= 2) safetyTier += 1;
        if (tailReachable) safetyTier += 2;
        if (area >= safeNeed) safetyTier += 2;
        if (area >= safeNeed * 1.5) safetyTier += 1;
        if (horizonShortfall === 0) safetyTier += 2;
        else safetyTier -= horizonShortfall * 2;
        if (detail) Object.assign(detail, {
          huntSafe: tailReachable && area >= safeNeed && escape.safeExits > 0 && horizonShortfall === 0,
          safetyTier,
          horizon,
        });
        const headRisk = rivalHeadRisk(s, nx);
        const pathScore = Number.isFinite(path)
          ? 180 - path * HUNT_DISTANCE_WEIGHT
          : -mouseDist * HUNT_DISTANCE_WEIGHT - 120;
        // Once the body is very long, extra empty acreage stops being valuable.
        // Enough room to turn and reach the tail still scores fully; beyond that,
        // the leader is free to fold into denser parallel lanes.
        const spaceCeiling = safeNeed * (2.5 - densify * 1.35);
        const usefulArea = Math.min(area, spaceCeiling);
        const exitFreedom = 1 - densify * 0.82;
        const dangerScore = usefulArea * 3
          + Math.min(8, nearestOtherDistance(s, nx)) * 16
          + escape.exits * (24 + intelligence * 54) * exitFreedom
          + Math.min(usefulArea, escape.bestArea) * intelligence * 1.8
          + (tailReachable ? 45 * intelligence : -220 * intelligence)
          - headRisk * (0.7 + intelligence * 1.8)
          - crampedPenalty;
        const densityScore = densify * olderBodyDensity(future, nx) * DENSITY_REWARD;
        const cycleScore = packingCycleScore(s, nx);
        const huntScore = pathScore + (ate ? FOOD_CAPTURE_BONUS + eatGrowth * 45 : 0);
        const trapScore = boxingScore(s, nx, future);
        const edgePressure = Math.max(0, 2 - borderDistance(h));
        const edgeRelief = Math.max(0, borderDistance(nx) - borderDistance(h));
        const edgeScore = edgePressure * edgeRelief * EDGE_RELIEF_WEIGHT;
        const aggression = effectiveAggression(s);
        const mobilityPenalty = escape.exits === 0
          ? DEAD_END_PENALTY
          : escape.exits === 1
            ? SINGLE_EXIT_PENALTY
            : escape.exits === 2
              ? DOUBLE_EXIT_PENALTY
              : 0;
        const contestedPenalty = Math.max(0, escape.exits - escape.safeExits) * CONTESTED_EXIT_PENALTY;
        const horizonPenalty = horizonShortfall * (700 + intelligence * 1300);
        // Aggression must remain a real tradeoff. Leader intelligence still
        // rejects sealed traps, but no longer overwhelms every step toward food.
        const survivalWeight = 0.14 + (1 - aggression) * 0.7 + intelligence * 0.55;
        return huntScore * aggression * hungerDrive(s) + dangerScore * survivalWeight + densityScore + cycleScore
          + trapScore * (0.12 + aggression * 0.1) * (1 - densify * 0.9)
          + edgeScore - mobilityPenalty - contestedPenalty - horizonPenalty + Math.random() * 0.01;
      }

      function hitSelf(s, p) {
        const tailVacates = s.grow <= 0;
        const end = tailVacates ? -1 : s.body.length;
        return s.body.slice(1, end).some(b => b.x === p.x && b.y === p.y);
      }

      function hitOtherSnake(s, p, moving = new Set()) {
        if (brainOwners && moving.size === 0) {
          const owner = brainOwners.get(key(p));
          return !!owner && owner !== s;
        }
        return snakes.some(other => {
          if (other === s) return false;
          const body = moving.has(other) && other.grow <= 0 ? other.body.slice(0, -1) : other.body;
          return body.some(b => b.x === p.x && b.y === p.y);
        });
      }

      function beginDeath(s) {
        const colors = snakeColor(s);
        dying.push({
          body: copyBody(s.body),
          colors,
          seed: Math.random() * 1000,
          age: 0,
          duration: Math.min(DEATH_FADE_MAX, DEATH_FADE_BASE + s.body.length * DEATH_FADE_PER_SEG),
        });
      }

      function updateDeaths(dt) {
        for (let i = dying.length - 1; i >= 0; i--) {
          const death = dying[i];
          death.age += dt;
          if (death.age < death.duration) continue;
          pools.push({ body: death.body, seed: death.seed });
          while (pools.length > MAX_POOLS) pools.shift();
          dying.splice(i, 1);
        }
      }

      // ---- one grid tick --------------------------------------------------
      function step(movers = snakes) {
        const current = snakes.slice();
        const moving = movers.filter(s => current.includes(s));
        const movingSet = new Set(moving);
        if (!moving.length) return;

        const plans = new Map();
        brainOwners = buildBrainOwners(current);
        for (const s of moving) {
          s.prev = copyBody(s.body);
          chooseDir(s);
          const h = s.body[0];
          plans.set(s, { nx: { x: h.x + s.dir.x, y: h.y + s.dir.y } });
        }
        brainOwners = null;

        const dead = new Set();
        for (const s of moving) {
          const { nx } = plans.get(s);
          if (!inB(nx.x, nx.y) || hitSelf(s, nx) || hitOtherSnake(s, nx, movingSet)) dead.add(s);
        }

        for (let i = 0; i < moving.length; i++) {
          for (let j = i + 1; j < moving.length; j++) {
            const a = moving[i], b = moving[j];
            if (dead.has(a) || dead.has(b)) continue;
            const an = plans.get(a).nx, bn = plans.get(b).nx;
            const aHead = a.body[0], bHead = b.body[0];
            if (sameCell(an, bn) || (sameCell(an, bHead) && sameCell(bn, aHead))) {
              if (a.body.length === b.body.length) dead.add(pick([a, b]));
              else dead.add(a.body.length < b.body.length ? a : b);
            }
          }
        }

        const next = [];
        let mouseEaten = false;
        let eater = null;
        for (const s of current) {
          if (dead.has(s)) continue;
          if (!movingSet.has(s)) { next.push(s); continue; }
          const { nx } = plans.get(s);
          const ate = !dead.size && sameCell(nx, mouse);
          s.body.unshift(nx);
          if (ate) {
            s.eatStreak = nextEatStreak(s);
            s.grow += growthForStreak(s.eatStreak, s.body.length);
            mouseEaten = true;
            eater = s;
          }
          if (s.grow > 0) s.grow--; else s.body.pop();
          next.push(s);
        }

        if (eater) {
          lastEater = eater;
          for (const s of next) if (s !== eater) s.eatStreak = 0;
        } else if (dead.has(lastEater)) {
          lastEater = null;
        }

        for (const s of current) {
          if (!dead.has(s)) continue;
          beginDeath(s);
        }

        if (next.length === 1 && next[0].body.length >= START_LEN_MIN) beginVictory(next[0]);
        else if (next.length === 0) bringContenders(next);
        snakes = next.slice(0, START_SNAKES);
        if (mouseEaten && !dead.size) spawnMouse(snakes);
      }

      // ---- render ---------------------------------------------------------
      function blockAt(cx, cy, color, inset, glow, glowColor = GLOW) {
        const sz = CELL - 2 * (inset || 2);
        if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; } else ctx.shadowBlur = 0;
        ctx.fillStyle = color;
        ctx.fillRect(cx - sz / 2, cy - sz / 2, sz, sz);
      }

      function traceSmoothPath(points) {
        if (!points.length) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        if (points.length === 1) return;

        for (let i = 1; i < points.length - 1; i++) {
          const previous = points[i - 1], corner = points[i], next = points[i + 1];
          const inX = corner.x - previous.x, inY = corner.y - previous.y;
          const outX = next.x - corner.x, outY = next.y - corner.y;
          const inLength = Math.hypot(inX, inY), outLength = Math.hypot(outX, outY);
          const cross = inX * outY - inY * outX;

          // Keep long runs truly straight. Only the immediate neighborhood of a
          // bend is rounded, so a turn never reads as a diagonal shortcut.
          if (inLength < 0.01 || outLength < 0.01 || Math.abs(cross) < 0.01) {
            ctx.lineTo(corner.x, corner.y);
            continue;
          }

          const radius = Math.min(CELL * 0.22, inLength * 0.42, outLength * 0.42);
          ctx.lineTo(
            corner.x - inX / inLength * radius,
            corner.y - inY / inLength * radius
          );
          ctx.quadraticCurveTo(
            corner.x,
            corner.y,
            corner.x + outX / outLength * radius,
            corner.y + outY / outLength * radius
          );
        }
        const last = points[points.length - 1];
        ctx.lineTo(last.x, last.y);
      }

      function strokePath(points, color, width, glow, glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = glow;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        traceSmoothPath(points);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function circleAt(cx, cy, radius, color, glow = 0, glowColor = GLOW) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = glow;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function cellCenter(p) {
        return { x: OX + p.x * CELL + CELL / 2, y: OY + p.y * CELL + CELL / 2 };
      }

      function orthogonalSnakePath(points, body) {
        if (!points.length) return [];
        const route = [];
        const pushDistinct = point => {
          const previous = route[route.length - 1];
          if (!previous || Math.hypot(previous.x - point.x, previous.y - point.y) > 0.01) {
            route.push(point);
          }
        };

        pushDistinct(points[points.length - 1]);
        for (let i = points.length - 2; i >= 0; i--) {
          const from = route[route.length - 1];
          const to = points[i];
          if (Math.abs(from.x - to.x) > 0.01 && Math.abs(from.y - to.y) > 0.01) {
            // Neighboring segments can occupy different halves of a 90-degree
            // turn during a tween. Route through the nearer Manhattan elbow,
            // using the trailing segment's grid cell to preserve the real turn.
            const horizontalFirst = { x: to.x, y: from.y };
            const verticalFirst = { x: from.x, y: to.y };
            const hint = cellCenter(body[i + 1]);
            const horizontalDistance = (horizontalFirst.x - hint.x) ** 2 + (horizontalFirst.y - hint.y) ** 2;
            const verticalDistance = (verticalFirst.x - hint.x) ** 2 + (verticalFirst.y - hint.y) ** 2;
            pushDistinct(horizontalDistance <= verticalDistance ? horizontalFirst : verticalFirst);
          }
          pushDistinct(to);
        }
        return route;
      }

      function hash01(seed, n) {
        const x = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function revealedCenterline(points, revealAt) {
        if (!revealAt) return points.slice();
        if (points.length === 1) return revealAt(0) > 0.01 ? points.slice() : [];
        const line = [];
        for (let i = 0; i < points.length - 1; i++) {
          const reveal = Math.max(0, Math.min(1, revealAt(i)));
          if (reveal <= 0.01) break;
          if (!line.length) line.push(points[i]);
          const next = points[i + 1];
          line.push({
            x: points[i].x + (next.x - points[i].x) * reveal,
            y: points[i].y + (next.y - points[i].y) * reveal,
          });
          if (reveal < 0.99) break;
        }
        return line;
      }

      function smoothCenterline(points, passes = 2) {
        let line = points.slice();
        for (let pass = 0; pass < passes && line.length > 1; pass++) {
          const softened = [line[0]];
          for (let i = 0; i < line.length - 1; i++) {
            const a = line[i], b = line[i + 1];
            softened.push(
              { x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 },
              { x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 },
            );
          }
          softened.push(line[line.length - 1]);
          line = softened;
        }
        return line;
      }

      function ribbonMask(line, radius) {
        const path = new Path2D();
        if (!line.length) return path;
        if (line.length === 1) {
          path.arc(line[0].x, line[0].y, radius, 0, Math.PI * 2);
          return path;
        }

        const left = [], right = [];
        for (let i = 0; i < line.length; i++) {
          const prev = line[Math.max(0, i - 1)];
          const next = line[Math.min(line.length - 1, i + 1)];
          const dx = next.x - prev.x, dy = next.y - prev.y;
          const length = Math.hypot(dx, dy) || 1;
          const nx = -dy / length * radius, ny = dx / length * radius;
          left.push({ x: line[i].x + nx, y: line[i].y + ny });
          right.push({ x: line[i].x - nx, y: line[i].y - ny });
        }

        path.moveTo(left[0].x, left[0].y);
        for (let i = 1; i < left.length; i++) path.lineTo(left[i].x, left[i].y);
        for (let i = right.length - 1; i >= 0; i--) path.lineTo(right[i].x, right[i].y);
        path.closePath();
        const first = line[0], last = line[line.length - 1];
        path.moveTo(first.x + radius, first.y);
        path.arc(first.x, first.y, radius, 0, Math.PI * 2);
        path.moveTo(last.x + radius, last.y);
        path.arc(last.x, last.y, radius, 0, Math.PI * 2);
        return path;
      }

      const hatchStamp = () => `${W}:${H}:${CELL}:${OX}:${OY}`;

      function hatchGeometry(mark, points, revealAt) {
        const stamp = hatchStamp();
        if (!revealAt && mark._hatchGeometry && mark._hatchGeometry.stamp === stamp) {
          return mark._hatchGeometry;
        }

        const centerline = smoothCenterline(revealedCenterline(points, revealAt));
        if (!centerline.length) return null;
        const outerMask = ribbonMask(centerline, CELL * 0.39);
        const innerMask = ribbonMask(centerline, CELL * 0.25);
        const xs = centerline.map(p => p.x), ys = centerline.map(p => p.y);
        const minX = Math.min(...xs) - CELL, maxX = Math.max(...xs) + CELL;
        const minY = Math.min(...ys) - CELL, maxY = Math.max(...ys) + CELL;
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        const span = Math.hypot(maxX - minX, maxY - minY) + CELL * 2;
        const hatchFamilies = [];

        // Bucket hundreds of individual hatch lines into three widths for each
        // angle family. Completed marks cache these six Path2D objects, turning
        // the permanent mural into a handful of strokes per frame.
        for (const family of [-1, 1]) {
          const buckets = [new Path2D(), new Path2D(), new Path2D()];
          const angleJitter = (hash01(mark.seed + 113, family + 2) - 0.5) * 0.12;
          const angle = family * Math.PI * 0.24 + angleJitter;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          let lane = -span;
          let lineIndex = 0;
          while (lane <= span) {
            const sample = lineIndex + (family > 0 ? 300 : 100);
            const localX = lane + (hash01(mark.seed + 127, sample) - 0.5) * CELL * 0.1;
            const bucket = Math.min(2, Math.floor(hash01(mark.seed + 151, sample) * 3));
            const path = buckets[bucket];
            path.moveTo(cx + localX * cos + span * sin, cy + localX * sin - span * cos);
            path.lineTo(cx + localX * cos - span * sin, cy + localX * sin + span * cos);
            lane += CELL * (0.2 + hash01(mark.seed + 163, sample) * 0.1);
            lineIndex++;
          }
          hatchFamilies.push({ family, buckets });
        }

        const geometry = { stamp, outerMask, innerMask, hatchFamilies };
        if (!revealAt) mark._hatchGeometry = geometry;
        return geometry;
      }

      function drawCrossHatching(mark, points, depth, revealAt = null) {
        const hasCachedGeometry = !revealAt
          && mark._hatchGeometry
          && mark._hatchGeometry.stamp === hatchStamp();
        if ((!points || !points.length) && !hasCachedGeometry) return;
        const presence = 0.68 + depth * 0.32;
        ctx.save();
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 0;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.rect(OX, OY, GW * CELL, GH * CELL);
        ctx.clip();

        // One softened centerline produces one continuous ribbon. Unlike the
        // previous capsule union, this shape has no joint at each grid segment
        // and cannot retain a dotted or beaded rhythm through its bends.
        const geometry = hatchGeometry(mark, points, revealAt);
        if (!geometry) { ctx.restore(); return; }
        const { outerMask, innerMask, hatchFamilies } = geometry;
        ctx.fillStyle = rgba(C_HATCH, 0.18 * presence);
        ctx.fill(outerMask);
        ctx.fillStyle = rgba(C_CLOT, 0.34 * presence);
        ctx.fill(innerMask);

        ctx.save();
        ctx.clip(outerMask);
        for (const { family, buckets } of hatchFamilies) {
          for (let bucket = 0; bucket < buckets.length; bucket++) {
            ctx.strokeStyle = rgba(
              family > 0 ? C_HATCH_LIGHT : C_HATCH,
              (0.2 + bucket * 0.055) * presence,
            );
            ctx.lineWidth = Math.max(0.75, CELL * (0.025 + bucket * 0.012));
            ctx.stroke(buckets[bucket]);
          }
        }
        ctx.restore();
        ctx.restore();
      }

      function deathVisibility(index, sweep) {
        return Math.max(0, Math.min(1, (index + DEATH_FADE_WIDTH - sweep) / DEATH_FADE_WIDTH));
      }

      function drawDeaths() {
        for (const death of dying) {
          const points = death.body.map(cellCenter);
          if (!points.length) continue;
          const progress = Math.min(1, death.age / death.duration);
          const sweep = progress * (points.length + DEATH_FADE_WIDTH);
          const colors = death.colors;

          // The permanent mark is revealed by the same per-segment mask that
          // removes the living body. There is never a whole-corpse swap.
          drawCrossHatching(death, points, 1, index => 1 - deathVisibility(index, sweep));

          ctx.save();
          ctx.filter = 'none';
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Draw the untouched remainder as one continuous stroke. Only the
          // narrow transition band needs per-segment opacity, avoiding hundreds
          // of glowing stroke calls for a long dying leader.
          const solidStart = Math.min(points.length, Math.max(0, Math.ceil(sweep)));
          if (solidStart < points.length) {
            ctx.globalAlpha = 1;
            ctx.shadowColor = colors.glow;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = colors.body;
            ctx.lineWidth = CELL * 0.64;
            const remainder = points.slice(solidStart);
            traceSmoothPath(remainder);
            if (remainder.length === 1) ctx.lineTo(remainder[0].x + 0.01, remainder[0].y);
            ctx.stroke();
          }

          const transitionStart = Math.max(0, Math.floor(sweep - DEATH_FADE_WIDTH));
          const transitionEnd = Math.min(points.length - 1, solidStart - 1);
          for (let i = transitionStart; i <= transitionEnd; i++) {
            const visibility = deathVisibility(i, sweep);
            if (visibility <= 0) continue;
            ctx.globalAlpha = visibility;
            ctx.shadowColor = colors.glow;
            ctx.shadowBlur = 10 * visibility;
            ctx.strokeStyle = colors.body;
            ctx.lineWidth = CELL * 0.64;
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            if (i + 1 < points.length) ctx.lineTo(points[i + 1].x, points[i + 1].y);
            else ctx.lineTo(points[i].x + 0.01, points[i].y);
            ctx.stroke();
          }

          // A hot, sparking front supplies the dramatic beat and travels from
          // the head all the way through the final tail segment.
          const frontIndex = Math.min(points.length - 1, Math.max(0, Math.floor(sweep - DEATH_FADE_WIDTH)));
          const front = points[frontIndex];
          const pulse = 0.72 + Math.sin(death.age * 28) * 0.18;
          ctx.globalAlpha = Math.max(0, 1 - progress * 0.35);
          circleAt(front.x, front.y, CELL * (0.28 + pulse * 0.1), rgba(colors.accent || colors.ring, 0.55), 18, colors.glow);
          ctx.strokeStyle = rgba(colors.accent || colors.ring, 0.62);
          ctx.lineWidth = Math.max(1, CELL * 0.045);
          for (let ray = 0; ray < 5; ray++) {
            const angle = ray * Math.PI * 2 / 5 + death.age * (ray % 2 ? -2.2 : 2.8) + hash01(death.seed, ray) * 0.45;
            const inner = CELL * 0.22;
            const outer = CELL * (0.42 + hash01(death.seed + 13, ray) * 0.42) * pulse;
            ctx.beginPath();
            ctx.moveTo(front.x + Math.cos(angle) * inner, front.y + Math.sin(angle) * inner);
            ctx.lineTo(front.x + Math.cos(angle) * outer, front.y + Math.sin(angle) * outer);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawPools() {
        for (let i = 0; i < pools.length; i++) {
          const pool = pools[i];
          const depth = pools.length <= 1 ? 1 : i / (pools.length - 1);
          const cached = pool._hatchGeometry && pool._hatchGeometry.stamp === hatchStamp();
          const points = cached ? null : pool.body.map(cellCenter);
          drawCrossHatching(pool, points, depth);
        }
        ctx.filter = 'none';
        ctx.shadowBlur = 0;
        ctx.setLineDash([]);
      }

      function drawBorder() {
        ctx.shadowColor = GLOW;
        ctx.shadowBlur = 8;
        ctx.strokeStyle = C_BORDER;
        ctx.lineWidth = 2;
        ctx.strokeRect(OX + 1, OY + 1, GW * CELL - 2, GH * CELL - 2);
        ctx.shadowBlur = 0;
      }

      function render() {
        // almost-black cavern ground
        ctx.shadowBlur = 0;
        ctx.fillStyle = C_BG; ctx.fillRect(0, 0, W, H);

        drawPools();
        drawDeaths();

        // mouse — one steady bright blip
        if (mouse) {
          const m = cellCenter(mouse);
          blockAt(m.x, m.y, C_MOUSE, CELL * 0.32, 10);
        }

        // snakes — each segment tweened from where it was toward where it is, so
        // the grid motion reads smooth
        for (const s of snakes) {
          const alpha = Math.min(1, (s.moveAcc || 0) / moveInterval(s));
          const colors = snakeColor(s);
          const gold = winnerGoldAmount(s);
          const points = [];
          for (let i = 0; i < s.body.length; i++) {
            const cur = s.body[i], pre = (s.prev && s.prev[i]) || cur;
            points.push({
              x: OX + (pre.x + (cur.x - pre.x) * alpha) * CELL + CELL / 2,
              y: OY + (pre.y + (cur.y - pre.y) * alpha) * CELL + CELL / 2,
            });
          }
          const path = orthogonalSnakePath(points, s.body);
          strokePath(path, colors.head, CELL * 0.92, 12, colors.glow);
          strokePath(path, colors.body, CELL * 0.62, 5, colors.glow);
          const head = points[0];
          circleAt(head.x, head.y, CELL * 0.38, colors.head, 14, colors.glow);
          if (gold > 0) {
            const heirColors = winnerHeadColor(s, gold);
            const heirBody = s.body.slice(0, Math.min(2, s.body.length));
            const heirPoints = points.slice(0, heirBody.length);
            const heirPath = orthogonalSnakePath(heirPoints, heirBody);
            strokePath(heirPath, heirColors.head, CELL * 0.94, 12 + gold * 10, heirColors.glow);
            strokePath(heirPath, heirColors.body, CELL * 0.64, 5 + gold * 5, heirColors.glow);
            circleAt(head.x, head.y, CELL * 0.39, heirColors.head, 14 + gold * 10, heirColors.glow);
          }
          ctx.shadowBlur = 0;                                  // two dark eyes facing travel
          const ex = head.x + s.dir.x * CELL * 0.18, ey = head.y + s.dir.y * CELL * 0.18, e = Math.max(1, CELL * 0.1);
          circleAt(ex - s.dir.y * CELL * 0.15, ey - s.dir.x * CELL * 0.15, e * 0.52, C_BG);
          circleAt(ex + s.dir.y * CELL * 0.15, ey + s.dir.x * CELL * 0.15, e * 0.52, C_BG);
        }

        // soft vignette
        ctx.shadowBlur = 0;
        const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

        drawBorder();
      }

      // ---- loop -----------------------------------------------------------
      function tick(t) {
        const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t; frame++;
        updateDeaths(dt);
        const celebrating = updateVictory(dt);
        if (!celebrating) {
          for (const s of snakes) s.moveAcc = (s.moveAcc || 0) + dt;
          for (let guard = 0; guard < 8; guard++) {
            const movers = snakes.filter(s => (s.moveAcc || 0) >= moveInterval(s));
            if (!movers.length) break;
            for (const s of movers) s.moveAcc -= moveInterval(s);
            step(movers);
          }
        }
        render();
        requestAnimationFrame(tick);
      }

      addEventListener('click', reset);
      addEventListener('resize', () => { resize(); reset(); });
      resize();
      reset();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
