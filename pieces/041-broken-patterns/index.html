<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A spirograph that never lifts its pen. Five to seventeen hypotrochoids draw one segment at a time, each stroke starting wherever the previous curve left off, weaving them into a single translucent web."
    />
    <title>Broken Patterns · HyperGal</title>
    <style>
      :root { color-scheme: dark; --focus: oklch(0.85 0.16 95); }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: #111;
      }
      body { display: grid; place-items: center; }
      canvas {
        display: block;
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        cursor: pointer;
        touch-action: manipulation;
      }
      canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -6px; }
      .instructions {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <canvas
      id="patterns"
      width="1920"
      height="1920"
      tabindex="0"
      aria-describedby="instructions"
    ></canvas>
    <p class="instructions" id="instructions">
      The pattern draws itself over several seconds. Click or tap for a new
      pattern. Press R to redraw the current one from the start.
    </p>

    <script>
      (() => {
        'use strict';

        // Broken Patterns — Eric Ishii Eckhardt, 2022, for HyperMedia Club.
        //
        // Derived from generative experiments from 2012 that were trying, and
        // failing, to be a Spirograph. Minted as Edition 01 on fxhash; this is
        // that build with the fxhash boilerplate removed and the four source
        // files inlined. The drawing code is otherwise unchanged, quirks and
        // all — see the notes on the shared pen and the line count below.

        const ALPHABET = '123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';
        const SIZE = 1920;

        // fxhash's hash format and sfc32 generator, kept verbatim. Every random
        // value below is drawn in the original order, so an original "oo…" hash
        // passed as ?hash= still reproduces that exact iteration.
        function sfc32(a, b, c, d) {
          return () => {
            a |= 0; b |= 0; c |= 0; d |= 0;
            var t = (a + b | 0) + d | 0;
            d = d + 1 | 0;
            a = b ^ b >>> 9;
            b = c + (c << 3) | 0;
            c = c << 21 | c >>> 11;
            c = c + t | 0;
            return (t >>> 0) / 4294967296;
          };
        }

        function randomHash() {
          return 'oo' + Array(49).fill(0)
            .map(() => ALPHABET[(Math.random() * ALPHABET.length) | 0])
            .join('');
        }

        function seedFrom(hash) {
          const b58dec = (str) => [...str].reduce(
            (p, c) => p * ALPHABET.length + ALPHABET.indexOf(c) | 0, 0
          );
          const parts = hash.slice(2).match(
            new RegExp('.{' + ((hash.length / 4) | 0) + '}', 'g')
          );
          if (!parts || parts.length < 4) return null;
          return sfc32(...parts.slice(0, 4).map(b58dec));
        }

        // Line colour is [r, g, b, alpha, name]; ground is [r, g, b, name].
        const PALETTE = [
          { color: [255, 255, 255, 0.1, 'White'], bg: [20, 20, 20, 'Charcoal'] },
          { color: [0, 255, 0, 0.1, 'Bright Lime'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [255, 0, 255, 0.1, 'Magenta'], bg: [20, 0, 20, 'Dark Purple'] },
          { color: [255, 0, 0, 0.1, 'Bright Red'], bg: [50, 0, 0, 'Dark Clay'] },
          { color: [0, 0, 255, 0.4, 'Bright Blue'], bg: [0, 0, 10, 'Midnight'] },
          { color: [71, 140, 137, 0.2, 'Medium Glacier'], bg: [159, 221, 237, 'Sky Blue'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [252, 196, 232, 'Pink'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [242, 208, 177, 'Peach'] },
          { color: [197, 115, 216, 0.3, 'Lavendar'], bg: [38, 32, 32, 'Burnt Umber'] },
          { color: [242, 208, 177, 0.2, 'Peach'], bg: [38, 32, 32, 'Burnt Umber'] },
          { color: [242, 208, 177, 0.2, 'Peach'], bg: [164, 72, 125, 'Lavendar'] },
          { color: [85, 53, 65, 0.4, 'Plum'], bg: [242, 208, 177, 'Peach'] },
          { color: [7, 4, 25, 0.2, 'Charcoal'], bg: [253, 165, 75, 'Tangerine'] },
          { color: [12, 65, 110, 0.3, 'Regal Blue'], bg: [6, 206, 159, 'Caribbean Green'] },
          { color: [243, 200, 3, 0.2, 'Sunflower'], bg: [124, 49, 42, 'Copper Clay'] },
          { color: [240, 243, 243, 0.3, 'Porcelain'], bg: [37, 136, 186, 'Cerulean'] },
          { color: [37, 136, 186, 0.3, 'Robin Egg'], bg: [240, 243, 243, 'Cerulean'] },
          { color: [161, 148, 116, 0.3, 'Old Gold'], bg: [240, 243, 243, 'Parchment'] },
          { color: [240, 243, 203, 0.2, 'Sandstone'], bg: [101, 76, 67, 'Milk Chocolate'] },
          { color: [57, 70, 15, 0.5, 'Drab Clover'], bg: [111, 213, 213, 'Robin Egg'] },
          { color: [96, 198, 198, 0.3, 'Robin Egg'], bg: [72, 85, 30, 'Drab Clover'] },
          { color: [159, 241, 159, 0.4, 'Pastel Green'], bg: [58, 194, 89, 'Mint'] },
          { color: [56, 255, 144, 0.2, 'Mint'], bg: [84, 0, 134, 'Bright Lavendar'] },
          // The 265 is original — it clamps to 255 and always has.
          { color: [84, 0, 134, 0.2, 'Bright Lavendar'], bg: [66, 265, 154, 'Light Mint'] },
          { color: [224, 137, 123, 0.3, 'Peach'], bg: [8, 70, 70, 'Cyprus'] },
          { color: [45, 210, 186, 0.2, 'Turquoise'], bg: [34, 92, 94, 'Old Copper'] },
          { color: [255, 182, 40, 0.2, 'Sunflower'], bg: [4, 158, 233, 'Bright Sky'] },
          { color: [4, 158, 233, 0.3, 'Bright Sky'], bg: [255, 182, 40, 'Sunflower'] },
          { color: [255, 207, 158, 0.2, 'Peach'], bg: [4, 158, 233, 'Bright Sky'] },
          { color: [4, 158, 233, 0.3, 'Bright Sky'], bg: [255, 207, 158, 'Peach'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [68, 112, 17, 'Dark Olive'] },
          { color: [255, 41, 103, 0.3, 'Millenial Pink'], bg: [148, 15, 8, 'Brick'] },
          { color: [148, 15, 8, 0.3, 'Brick'], bg: [255, 100, 163, 'Pink'] },
          { color: [0, 255, 255, 0.3, 'Cyan'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [0, 255, 255, 0.3, 'Cyan'], bg: [0, 0, 20, 'Midnight'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [240, 243, 203, 0.2, 'Sandstone'], bg: [0, 0, 20, 'Midnight'] },
          { color: [240, 243, 203, 0.2, 'Sandstone'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [255, 41, 103, 0.3, 'Millenial Pink'], bg: [0, 0, 20, 'Midnight'] },
          { color: [255, 41, 103, 0.3, 'Millenial Pink'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [243, 200, 3, 0.2, 'Sunflower'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [255, 0, 255, 0.1, 'Magenta'], bg: [0, 0, 20, 'Midnight'] },
          { color: [255, 0, 255, 0.1, 'Magenta'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [255, 0, 0, 0.1, 'Bright Red'], bg: [20, 0, 20, 'Dark Purple'] },
          { color: [255, 182, 40, 0.2, 'Sunflower'], bg: [164, 72, 125, 'Lavendar'] },
          { color: [255, 0, 0, 0.1, 'Bright Red'], bg: [0, 30, 30, 'Dark Glacier'] },
          { color: [255, 182, 40, 0.2, 'Sunflower'], bg: [20, 0, 20, 'Dark Purple'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [12, 65, 110, 'Regal Blue'] },
          { color: [255, 0, 0, 0.1, 'Bright Red'], bg: [12, 65, 110, 'Regal Blue'] },
          { color: [0, 255, 0, 0.2, 'Bright Lime'], bg: [12, 65, 110, 'Regal Blue'] },
          { color: [255, 0, 0, 0.1, 'Bright Red'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [255, 100, 0, 0.3, 'Hunter Orange'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [255, 182, 40, 0.3, 'Sunflower'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [8, 70, 70, 0.3, 'Cyprus'], bg: [255, 207, 158, 'Peach'] },
          { color: [255, 0, 255, 0.2, 'Magenta'], bg: [255, 207, 158, 'Peach'] },
          { color: [0, 30, 0, 0.1, 'Forest Green'], bg: [255, 207, 158, 'Peach'] },
          // The original had a stray alpha here, which pushed the ground name
          // out of position and titled this iteration "…on a 0.1 Field".
          { color: [255, 207, 158, 0.1, 'Peach'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [0, 0, 255, 0.2, 'Bright Blue'], bg: [255, 207, 158, 'Peach'] },
          { color: [255, 207, 158, 0.2, 'Peach'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [255, 182, 40, 0.3, 'Sunflower'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [96, 198, 198, 0.3, 'Robin Egg'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [240, 243, 203, 0.2, 'Sandstone'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [240, 243, 243, 0.2, 'Porcelain'], bg: [0, 0, 240, 'Bright Blue'] },
          { color: [240, 243, 243, 0.2, 'Porcelain'], bg: [0, 30, 0, 'Forest Green'] },
          { color: [0, 255, 255, 0.3, 'Cyan'], bg: [148, 15, 8, 'Brick'] },
          { color: [255, 207, 158, 0.2, 'Peach'], bg: [148, 15, 8, 'Brick'] },
          { color: [0, 0, 255, 0.2, 'Bright Blue'], bg: [253, 165, 75, 'Tangerine'] },
          { color: [255, 0, 0, 0.5, 'Bright Red'], bg: [253, 165, 75, 'Tangerine'] },
          { color: [0, 30, 0, 0.3, 'Forest Green'], bg: [253, 165, 75, 'Tangerine'] }
        ];

        const canvas = document.querySelector('#patterns');
        const ctx = canvas.getContext('2d');
        const search = new URLSearchParams(location.search);
        const debug = search.has('debug');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        let rand = null;
        let iteration = null;
        let lines = [];
        let timer = 0;

        // One pen for the whole system, starting where the original started.
        let penX = 150;
        let penY = 150;

        start(search.get('hash') || randomHash());

        canvas.addEventListener('click', () => start(randomHash()));
        canvas.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (key === 'r') {
            event.preventDefault();
            start(iteration.hash);
          } else if (key === ' ' || key === 'enter') {
            event.preventDefault();
            start(randomHash());
          }
        });
        reducedMotion.addEventListener('change', () => start(iteration.hash));

        function start(hash) {
          if (timer) { clearInterval(timer); timer = 0; }

          const seeded = seedFrom(hash) || seedFrom((hash = randomHash()));
          rand = seeded;
          iteration = buildIteration(hash);
          lines = placeLines(iteration);
          penX = 150;
          penY = 150;

          const bg = iteration.iro.bg;
          const ground = 'rgb(' + bg[0] + ',' + bg[1] + ',' + bg[2] + ')';
          document.body.style.backgroundColor = ground;
          canvas.style.backgroundColor = ground;
          ctx.clearRect(0, 0, SIZE, SIZE);

          canvas.setAttribute('aria-label', 'Broken Patterns: ' + title(iteration) + '.');
          if (debug) console.log(report(iteration));

          if (reducedMotion.matches) {
            while (tick()) { /* draw the finished pattern in one go */ }
          } else {
            timer = setInterval(tick, 10);
          }
        }

        function buildIteration(hash) {
          const iro = PALETTE[Math.floor(rand() * PALETTE.length)];
          const systemSize = Math.round(rand() * 12 + 5);
          const steps = Math.round(Math.PI * (rand() * 100 + 100));
          const R = steps * 0.16666;      // major ripple
          const r = 0.25;                 // minor ripple
          const p = rand() * 15 + 1;      // radius-type effect
          const m = 1;                    // angle multiplier
          const amplitude = rand() * 2.25 + 0.75;

          return {
            hash, iro, systemSize, steps, R, r, p, m, amplitude,
            alpha: iro.color[3],
            thickness: 1,
            circSize: R * amplitude,
            lineCount: systemSize * steps
          };
        }

        function placeLines(it) {
          const pad = it.circSize * 1.2;
          const centre = SIZE / 2;
          const hit = [false, false, false, false];
          const list = [];

          const pick = () => ({
            x: rand() * (SIZE - pad * 2) + pad,
            y: rand() * (SIZE - pad * 2) + pad
          });

          // The original builds systemSize + 1 curves and only ever advances
          // systemSize - 1 of them, so two are placed and never drawn. Kept:
          // removing them would shift every later random draw.
          for (let i = 0; i <= it.systemSize; i++) {
            let at = pick();
            // Until all four quadrants hold a curve, keep re-rolling positions
            // that would crowd one that is already occupied.
            let placed = hit[0] && hit[1] && hit[2] && hit[3];
            while (!placed) {
              if (at.x < centre && at.y < centre && !hit[0]) { hit[0] = placed = true; }
              else if (at.x > centre && at.y < centre && !hit[1]) { hit[1] = placed = true; }
              else if (at.x <= centre && at.y >= centre && !hit[2]) { hit[2] = placed = true; }
              else if (at.x >= centre && at.y >= centre && !hit[3]) { hit[3] = placed = true; }
              else { at = pick(); }
            }
            list.push({ offsetX: at.x, offsetY: at.y, theta: 0, t: 0 });
          }
          return list;
        }

        function tick() {
          let active = false;
          for (let i = 0; i < iteration.systemSize - 1; i++) {
            if (advance(lines[i], iteration)) active = true;
          }
          if (!active && timer) { clearInterval(timer); timer = 0; }
          return active;
        }

        function advance(line, it) {
          if (line.t > it.steps) return false;

          const thetaStep = 2 * Math.PI / it.steps;
          const s = (it.R + it.r) / it.r;
          const rR = it.r + it.R;
          const rp = it.r + it.p;

          let x = rR * Math.cos(it.m * line.theta) + rp * Math.cos(s * it.m * line.theta);
          let y = rR * Math.sin(it.m * line.theta) + rp * Math.sin(s * it.m * line.theta);

          x = x * it.amplitude + line.offsetX;
          y = y * it.amplitude + line.offsetY;

          // Only a curve's first segment lifts the pen. Every other segment
          // starts wherever the *previous curve* just ended, because all of
          // them share one pen and they advance a segment at a time in turn.
          // Those long connecting strokes are the broken pattern — giving each
          // curve its own pen would draw a tidy set of separate spirographs
          // and lose the piece entirely.
          if (line.t === 0) { penX = x; penY = y; }

          const c = it.iro.color;
          ctx.lineWidth = it.thickness;
          ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + it.alpha + ')';
          ctx.beginPath();
          ctx.moveTo(penX, penY);
          ctx.lineTo(x, y);
          ctx.stroke();

          penX = x;
          penY = y;
          line.theta += thetaStep;
          line.t += 1;
          return true;
        }

        function title(it) {
          return it.lineCount + ' ' + it.iro.color[4] + ' Lines on a ' + it.iro.bg[3] + ' Field';
        }

        function bucket(perc, labels) {
          if (perc < 20) return labels[0];
          if (perc < 40) return labels[1];
          if (perc < 60) return labels[2];
          if (perc < 80) return labels[3];
          return labels[4];
        }

        // The features published to fxhash for each iteration, kept for the
        // record. Logged to the console with ?debug — never drawn over the piece.
        function report(it) {
          const density = ((it.lineCount - 12 * 103) / (17 * 414 - 12 * 103)) * 100;
          const diameter = ((it.circSize - 103 * 0.1666) /
            (414 * 0.1666 * 3 * 1.2 - 103 * 0.1666)) * 100;
          const pair = [it.iro.color[4], it.iro.bg[3]].sort();

          return [
            ['Iteration Title', title(it)],
            ['Color Palette', pair[0] + ' & ' + pair[1]],
            ['Line Color', it.iro.color[4]],
            ['Background Color', it.iro.bg[3]],
            ['Line Density', bucket(density, ['Very Low', 'Low', 'Average', 'High', 'Very High'])],
            ['Circle Diameter', bucket(diameter, ['Extra Small', 'Small', 'Average', 'Large', 'Extra Large'])],
            ['System Size', it.systemSize],
            ['Hash', it.hash]
          ].map(([k, v]) => k.padEnd(18) + v).join('\n');
        }
      })();
    </script>
  </body>
</html>
