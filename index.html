<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="HyperMedia Club — an index of browser artworks."
    />
    <title>HyperMedia Club</title>
    <style>
      :root {
        --serif: Georgia, "Times New Roman", Times, serif;
        --sans: system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
        --blue: #0000ee;
        --visited: #551a8b;
        --ink: #111;
        --pad: clamp(1.25rem, 5vw, 4rem);
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; }

      body {
        min-width: 320px;
        min-height: 100vh;
        background: #fff;
        color: var(--ink);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection { background: var(--blue); color: #fff; }

      .skip-link {
        position: fixed;
        z-index: 50;
        top: .5rem;
        left: .5rem;
        padding: .55rem .75rem;
        background: var(--ink);
        color: #fff;
        font-family: var(--sans);
        font-size: .8rem;
        text-decoration: none;
        transform: translateY(-200%);
      }
      .skip-link:focus { transform: translateY(0); }

      /* ---- masthead: deadpan, left-aligned (Cory / Emily) ---- */
      header {
        padding: clamp(1.5rem, 5vw, 3.5rem) var(--pad) clamp(1.5rem, 4vw, 2.75rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5.5vw, 3.1rem);
        font-weight: 700;
        letter-spacing: -.015em;
        line-height: 1.02;
      }
      /* Catalog controls */
      .controls {
        margin-top: clamp(1rem, 2.4vw, 1.6rem);
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.55;
      }
      .ctl { margin: .12rem 0; }
      .ctl .lbl {
        font-style: normal;
        font-weight: 700;
        color: var(--ink);
        margin-right: .5ch;
      }
      .opt {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        font-style: normal;
        color: var(--ink);
        cursor: pointer;
      }
      .opt:hover { text-decoration: underline; text-underline-offset: 2px; }
      .opt[aria-pressed="true"] { color: var(--blue); font-weight: 600; }
      .opt:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .sort-dir {
        font-size: .68em;
        vertical-align: .12em;
      }

      /* ---- the works ---- */
      main { padding: 0 var(--pad) 4rem; }
      main.as-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(clamp(11rem, 22vw, 17rem), 1fr));
        gap: clamp(2rem, 4vw, 3.25rem) clamp(1.5rem, 3.5vw, 3rem);
        align-items: start;
      }
      main.as-list { max-width: 60rem; }

      .work {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .thumb {
        aspect-ratio: 1;
        overflow: hidden;
        background: #f0f0f0;
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cap {
        margin-top: .6rem;
        font-size: clamp(1.05rem, 1.5vw, 1.28rem);
        line-height: 1.3;
      }
      /* Cory-blue underlined title */
      .cap .t {
        color: var(--blue);
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
      }
      .work:visited .cap .t { color: var(--visited); }
      .dates {
        display: flex;
        flex-wrap: wrap;
        gap: .1rem 1ch;
        color: #555;
        font-style: italic;
      }
      .cap .dates { margin-top: .18rem; font-size: .88em; }
      .date-label { color: #767676; }

      .work:hover .cap .t { text-decoration-thickness: 2px; }
      .work:focus-visible { outline: none; }
      .work:focus-visible .thumb { outline: 3px solid var(--blue); outline-offset: 3px; }
      .work:focus-visible .cap .t { text-decoration-thickness: 2px; }

      .work[hidden] { display: none; }

      /* list view rows */
      .row {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: .6rem 0;
        border-bottom: 1px solid #ececec;
        color: inherit;
        text-decoration: none;
        font-size: clamp(1.05rem, 1.6vw, 1.3rem);
      }
      main.as-list .row:first-child { border-top: 1px solid #ececec; }
      .row .t {
        color: var(--blue);
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
      }
      .row:visited .t { color: var(--visited); }
      .row .meta {
        margin-left: auto;
        color: #555;
        font-style: italic;
        white-space: nowrap;
      }
      .row .dates {
        flex: 0 0 auto;
        justify-content: flex-end;
        font-size: .84em;
        line-height: 1.45;
      }
      .row:hover .t { text-decoration-thickness: 2px; }
      .row:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      .row:focus-visible .t { text-decoration-thickness: 2px; }

      .empty {
        font-size: 1.1rem;
        font-style: italic;
        color: #555;
      }

      @media (max-width: 42rem) {
        .row { flex-wrap: wrap; gap: .2rem 1rem; }
        .row .dates {
          width: 100%;
          margin-left: 0;
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skip-link { transition: none; }
      }
    </style>
    <script defer src="https://bakalytics.com/bakalytics.js" data-property="8c7d566e-6125-40d6-8921-d634e1d7f0ea"></script>
  </head>
  <body>
    <a class="skip-link" href="#works">Skip to the works</a>

    <header>
      <h1>HyperMedia Club</h1>
      <div class="controls">
        <p class="ctl"><strong class="lbl">Status:</strong><span id="statuses" role="group" aria-label="Status"></span>. <strong class="lbl">Theme:</strong><span id="themes" role="group" aria-label="Theme"></span>. <strong class="lbl">View:</strong><span id="views" role="group" aria-label="View"></span>. <strong class="lbl">Sort:</strong><span id="sorts" role="group" aria-label="Sort"></span></p>
      </div>
    </header>

    <main id="works" class="as-grid" aria-live="polite"></main>

    <script>
      (() => {
        const worksEl = document.getElementById('works');
        const statusesEl = document.getElementById('statuses');
        const themesEl = document.getElementById('themes');
        const viewsEl = document.getElementById('views');
        const sortsEl = document.getElementById('sorts');

        const DEFAULTS = {
          status: 'published',
          theme: '',
          view: 'grid',
          sort: 'date'
        };
        const DEFAULT_DIRECTIONS = { alpha: 'asc', date: 'desc' };
        const FILTER_KEYS = ['status', 'theme', 'view', 'sort', 'dir'];

        let pieces = [];
        let status = DEFAULTS.status;
        let theme = DEFAULTS.theme;
        let view = DEFAULTS.view;
        let sort = DEFAULTS.sort;
        const sortDirections = { ...DEFAULT_DIRECTIONS };

        const STATUSES = [
          ['published', 'Published', p => !p.wip],
          ['wip', 'WIP', p => p.wip === true],
          ['all', 'All', () => true]
        ];
        const THEMES = [
          ['generative', 'Generative'],
          ['nature', 'Nature'],
          ['games', 'Games'],
          ['other', 'Other']
        ];
        const VIEWS = [['grid', 'Grid'], ['list', 'List']];
        const SORTS = [['alpha', 'Alpha'], ['date', 'Date']];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const script = document.createElement('script');
        script.src = `./manifest.js?v=${Date.now()}`;
        script.onload = boot;
        script.onerror = fail;
        document.head.append(script);

        function boot() {
          const data = window.HYPERGAL_MANIFEST;
          if (!data || !Array.isArray(data.pieces) || data.pieces.length === 0) {
            return fail();
          }
          pieces = data.pieces.slice();
          readStateFromUrl();
          buildGroup(statusesEl, STATUSES, () => status,
            v => { status = v; });
          buildGroup(themesEl, THEMES, () => theme,
            v => { theme = theme === v ? '' : v; });
          buildGroup(viewsEl, VIEWS, () => view, v => { view = v; });
          buildSortGroup();
          syncControls();
          render();
          writeStateToUrl('replaceState');
          trackFilterState();
          window.addEventListener('popstate', restoreStateFromUrl);
        }

        function fail() {
          worksEl.replaceChildren(el('p', 'empty', 'Nothing here yet.'));
        }

        function title(p) { return p.title || p.slug; }

        function currentList() {
          const matchStatus =
            (STATUSES.find(item => item[0] === status) || STATUSES[0])[2];
          const list = pieces.filter(p =>
            matchStatus(p) && (!theme || p.category === theme));
          const direction = sortDirections[sort] === 'asc' ? 1 : -1;
          if (sort === 'alpha') {
            list.sort((a, b) => direction * title(a).localeCompare(
              title(b), undefined, { sensitivity: 'base' }));
          } else {
            // Slug (≈ creation order) breaks same-day ties.
            list.sort((a, b) => direction * (
              a.date < b.date ? -1 : a.date > b.date ? 1 :
              a.slug < b.slug ? -1 : a.slug > b.slug ? 1 : 0));
          }
          return list;
        }

        function render() {
          const list = currentList();
          worksEl.className = view === 'list' ? 'as-list' : 'as-grid';
          if (!list.length) {
            worksEl.replaceChildren(el('p', 'empty', 'Nothing here.'));
            return;
          }
          const make = view === 'list' ? listRow : gridCard;
          const frag = document.createDocumentFragment();
          list.forEach(p => frag.append(make(p)));
          worksEl.replaceChildren(frag);
        }

        function gridCard(p) {
          const a = link(p, 'work');
          const thumb = el('div', 'thumb');
          if (p.thumbnail) thumb.append(thumbImg(p));
          const cap = el('div', 'cap');
          cap.append(el('span', 't', title(p)));
          cap.append(dateMeta(p));
          a.append(thumb, cap);
          return a;
        }

        function listRow(p) {
          const a = link(p, 'row');
          a.append(el('span', 't', title(p)));
          a.append(dateMeta(p));
          return a;
        }

        function dateMeta(p) {
          const dates = el('span', 'dates');
          dates.append(dateItem('Published', p.date || (p.year ? String(p.year) : '')));
          dates.append(dateItem('Updated', p.updated));
          if (p.wip) dates.append(el('span', '', 'In progress'));
          return dates;
        }

        function dateItem(label, iso) {
          const item = document.createElement('span');
          item.append(el('span', 'date-label', `${label} `));
          const time = el('time', '', fmtDate(iso));
          if (iso) time.dateTime = iso;
          item.append(time);
          return item;
        }

        function link(p, cls) {
          const a = document.createElement('a');
          a.className = cls;
          a.href = `./pieces/${p.slug}/index.html`;
          a.setAttribute('aria-label',
            `${title(p)}${p.date ? ', published ' + fmtDate(p.date) : ''}` +
            `${p.updated ? ', updated ' + fmtDate(p.updated) : ''}` +
            `${p.wip ? ', in progress' : ''}`);
          return a;
        }

        function thumbImg(p) {
          const img = document.createElement('img');
          img.src = `./pieces/${p.slug}/${p.thumbnail}`;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          return img;
        }

        function buildGroup(container, items, getCurrent, onPick) {
          container.replaceChildren();
          items.forEach((item, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'opt';
            b.textContent = item[1];
            b.setAttribute('aria-pressed', String(item[0] === getCurrent()));
            b.addEventListener('click', () => {
              onPick(item[0]);
              commitState();
            });
            container.append(b);
            if (i < items.length - 1) container.append(document.createTextNode(', '));
          });
        }

        function buildSortGroup() {
          sortsEl.replaceChildren();
          SORTS.forEach((item, i) => {
            const [value, label] = item;
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'opt';
            b.dataset.value = value;
            b.dataset.label = label;
            b.addEventListener('click', () => {
              if (sort === value) {
                sortDirections[value] =
                  sortDirections[value] === 'asc' ? 'desc' : 'asc';
              } else {
                sort = value;
              }
              commitState();
            });
            sortsEl.append(b);
            if (i < SORTS.length - 1) {
              sortsEl.append(document.createTextNode(', '));
            }
          });
          updateSortGroup();
        }

        function commitState() {
          syncControls();
          render();
          if (writeStateToUrl('pushState')) trackFilterState();
        }

        function restoreStateFromUrl() {
          readStateFromUrl();
          syncControls();
          render();
          trackFilterState();
        }

        function syncControls() {
          syncGroup(statusesEl, STATUSES, status);
          syncGroup(themesEl, THEMES, theme);
          syncGroup(viewsEl, VIEWS, view);
          updateSortGroup();
        }

        function syncGroup(container, items, current) {
          container.querySelectorAll('.opt').forEach((button, index) =>
            button.setAttribute('aria-pressed', String(items[index][0] === current)));
        }

        function readStateFromUrl() {
          const params = new URLSearchParams(window.location.search);
          status = validValue(STATUSES, params.get('status'), DEFAULTS.status);
          theme = validValue(THEMES, params.get('theme'), DEFAULTS.theme);
          view = validValue(VIEWS, params.get('view'), DEFAULTS.view);
          sort = validValue(SORTS, params.get('sort'), DEFAULTS.sort);

          Object.assign(sortDirections, DEFAULT_DIRECTIONS);
          const requestedDirection = params.get('dir');
          sortDirections[sort] = requestedDirection === 'asc' || requestedDirection === 'desc'
            ? requestedDirection
            : DEFAULT_DIRECTIONS[sort];
        }

        function validValue(items, requested, fallback) {
          return items.some(item => item[0] === requested) ? requested : fallback;
        }

        function writeStateToUrl(method) {
          const url = new URL(window.location.href);
          FILTER_KEYS.forEach(key => url.searchParams.delete(key));

          if (status !== DEFAULTS.status) url.searchParams.set('status', status);
          if (theme !== DEFAULTS.theme) url.searchParams.set('theme', theme);
          if (view !== DEFAULTS.view) url.searchParams.set('view', view);

          const direction = sortDirections[sort];
          if (sort !== DEFAULTS.sort || direction !== DEFAULT_DIRECTIONS[DEFAULTS.sort]) {
            url.searchParams.set('sort', sort);
            url.searchParams.set('dir', direction);
          }

          if (url.href === window.location.href) return false;
          try {
            window.history[method]({ galleryFilters: true }, '', url.href);
            return true;
          } catch {
            // Keep the gallery usable when opened directly from file://.
            return false;
          }
        }

        function filterStateTarget() {
          return new URLSearchParams({
            status,
            theme: theme || 'all',
            view,
            sort,
            dir: sortDirections[sort]
          }).toString();
        }

        function trackFilterState() {
          const target = filterStateTarget();
          const send = () => window.bakalytics?.track('Gallery filter state', target);
          if (window.bakalytics?.track) send();
          else window.addEventListener('load', send, { once: true });
        }

        function updateSortGroup() {
          sortsEl.querySelectorAll('.opt').forEach(b => {
            const active = b.dataset.value === sort;
            const direction = sortDirections[b.dataset.value];
            b.replaceChildren(document.createTextNode(b.dataset.label));
            if (active) {
              const triangle = el('span', 'sort-dir',
                direction === 'asc' ? ' ▲' : ' ▼');
              triangle.setAttribute('aria-hidden', 'true');
              b.append(triangle);
            }
            b.setAttribute('aria-pressed', String(active));
            b.setAttribute('aria-label', active
              ? `${b.dataset.label}, ${direction === 'asc' ? 'ascending' : 'descending'}`
              : `Sort by ${b.dataset.label}`);
          });
        }

        function fmtDate(iso) {
          const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
          return m ? `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}` : (iso || '—');
        }

        function el(tag, cls, text) {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }
      })();
    </script>
  </body>
</html>
