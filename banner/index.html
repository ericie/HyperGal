<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>HyperMedia Club — Interactive Banner</title>
    <style>
      :root {
        color-scheme: light;
        --paper: oklch(96% 0 0);
        --ink: oklch(16% .01 275);
        --muted: oklch(43% .015 275);
        --rule: oklch(80% .01 275);
        --blue: oklch(48% .27 266);
        --white: oklch(99% 0 0);
        --sans: "Helvetica Neue", "Nimbus Sans L", "Arial Nova", Arial,
          sans-serif;
        --mono: "SFMono-Regular", "Cascadia Mono", "Liberation Mono", Menlo,
          Consolas, monospace;
        --x: 50%;
        --y: 50%;
        --shift-x: 0px;
        --shift-y: 0px;
        --radius: clamp(6rem, 18vw, 12rem);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 22rem;
        overflow: hidden;
        background:
          linear-gradient(
            to right,
            transparent calc(50% - .5px),
            var(--rule) calc(50% - .5px),
            var(--rule) calc(50% + .5px),
            transparent calc(50% + .5px)
          ),
          linear-gradient(
            to bottom,
            transparent calc(50% - .5px),
            var(--rule) calc(50% - .5px),
            var(--rule) calc(50% + .5px),
            transparent calc(50% + .5px)
          ),
          var(--paper);
        cursor: crosshair;
        touch-action: none;
      }

      .stage:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: -5px;
      }

      .type {
        position: absolute;
        inset: clamp(2.5rem, 7vw, 5rem) clamp(.75rem, 3vw, 2rem)
          clamp(2rem, 5vw, 3.5rem);
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 0;
        font-size: clamp(3.5rem, 13vw, 6rem);
        font-weight: 820;
        letter-spacing: -.04em;
        line-height: .76;
        text-transform: uppercase;
        user-select: none;
      }

      .type span {
        display: block;
        white-space: nowrap;
      }

      .type span:nth-child(1) {
        align-self: flex-start;
      }

      .type span:nth-child(2) {
        align-self: center;
      }

      .type span:nth-child(3) {
        align-self: flex-end;
      }

      .lens {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--blue);
        clip-path: circle(var(--radius) at var(--x) var(--y));
        contain: strict;
      }

      .lens .type {
        color: var(--white);
        transform: translate(var(--shift-x), var(--shift-y));
      }

      .stage.is-pressed {
        --radius: clamp(10rem, 28vw, 19rem);
      }

      .status {
        position: absolute;
        z-index: 2;
        top: clamp(.75rem, 2vw, 1.25rem);
        right: clamp(.75rem, 2vw, 1.25rem);
        left: clamp(.75rem, 2vw, 1.25rem);
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: var(--muted);
        font-family: var(--mono);
        font-size: .7rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.4;
        pointer-events: none;
      }

      .instruction {
        position: absolute;
        z-index: 2;
        right: clamp(.75rem, 2vw, 1.25rem);
        bottom: clamp(.65rem, 2vw, 1rem);
        margin: 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: .65rem;
        line-height: 1.4;
        pointer-events: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 30rem) {
        .type {
          font-size: clamp(3.5rem, 20vw, 5rem);
        }

        .instruction {
          max-width: 15rem;
          text-align: right;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lens .type {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main
      class="stage"
      id="stage"
      tabindex="0"
      aria-describedby="interaction-instructions"
    >
      <h1 class="sr-only">HyperMedia Club</h1>

      <div class="status" aria-hidden="true">
        <span>HMC / BANNER 01</span>
        <span id="coordinates">050 / 050</span>
      </div>

      <p class="type" aria-hidden="true">
        <span>Hyper</span>
        <span>Media</span>
        <span>Club</span>
      </p>

      <div class="lens" aria-hidden="true">
        <p class="type">
          <span>Hyper</span>
          <span>Media</span>
          <span>Club</span>
        </p>
      </div>

      <p class="instruction" id="interaction-instructions">
        Move pointer or use arrow keys. Press and hold to expand.
      </p>
    </main>

    <script>
      (() => {
        const stage = document.getElementById('stage');
        const coordinates = document.getElementById('coordinates');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let x = .5;
        let y = .5;

        stage.addEventListener('pointermove', event => {
          const rect = stage.getBoundingClientRect();
          setPosition(
            (event.clientX - rect.left) / rect.width,
            (event.clientY - rect.top) / rect.height
          );
        });

        stage.addEventListener('pointerdown', event => {
          stage.setPointerCapture(event.pointerId);
          stage.classList.add('is-pressed');
        });

        stage.addEventListener('pointerup', event => {
          if (stage.hasPointerCapture(event.pointerId)) {
            stage.releasePointerCapture(event.pointerId);
          }
          stage.classList.remove('is-pressed');
        });

        stage.addEventListener('pointercancel', () => {
          stage.classList.remove('is-pressed');
        });

        stage.addEventListener('keydown', event => {
          const step = event.shiftKey ? .1 : .035;
          const movement = {
            ArrowLeft: [-step, 0],
            ArrowRight: [step, 0],
            ArrowUp: [0, -step],
            ArrowDown: [0, step]
          }[event.key];

          if (movement) {
            event.preventDefault();
            setPosition(x + movement[0], y + movement[1]);
          }

          if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            stage.classList.toggle('is-pressed');
          }
        });

        function setPosition(nextX, nextY) {
          x = Math.max(0, Math.min(1, nextX));
          y = Math.max(0, Math.min(1, nextY));
          stage.style.setProperty('--x', `${(x * 100).toFixed(2)}%`);
          stage.style.setProperty('--y', `${(y * 100).toFixed(2)}%`);

          if (!reducedMotion.matches) {
            stage.style.setProperty('--shift-x', `${((x - .5) * -22).toFixed(2)}px`);
            stage.style.setProperty('--shift-y', `${((y - .5) * -16).toFixed(2)}px`);
          }

          coordinates.textContent =
            `${String(Math.round(x * 100)).padStart(3, '0')} / ` +
            String(Math.round(y * 100)).padStart(3, '0');
        }
      })();
    </script>
  </body>
</html>
