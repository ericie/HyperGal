<head>

  <meta name="theme-color" content="#111010">
  <title>Arcade</title>
  <link rel="stylesheet" href="arcade.css">

  <script src="arcade.js" defer></script>

  <a class="skip" href="#works">Skip to the artworks</a>
  <div class="room">

      <section class="entrance" aria-labelledby="issue-title">
        <h1 id="issue-title">Arcade</h1>
      </section>
      <section id="works" class="collection" aria-label="Games">
        <div class="collection-tools">
          <a class="gallery-link" href="../index.html" aria-label="Back to gallery" title="Back to gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg></a>

        </div>
        <ol class="cabinets" id="cabinets"></ol>
        <noscript><p>JavaScript is needed to load this collection. <a href="../index.html?theme=games&status=selected">Visit the Game collection.</a></p></noscript>
      </section>
    </main>
  </div>
