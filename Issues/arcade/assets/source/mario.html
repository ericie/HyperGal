<!doctype html><html lang="en"><meta charset="utf-8"><title>Many Mario attract plate source</title><style>@font-face{font-family:'Rubik Dirt';src:url('../RubikDirt.woff2')}body{margin:0;background:#080909}canvas{display:block;width:1200px;height:900px}</style><canvas width="1200" height="900" aria-label="Original Many Mario attract-screen collage"></canvas><script>
(async()=>{
 const image=new Image(),wall=new Image();image.src='../../../../pieces/016-up-mario/thumbnail.jpg';wall.src='../wall-wear.jpg';

 s.putImageData(pixels,0,0);
 const c=document.querySelector('canvas').getContext('2d');c.fillStyle='#080909';c.fillRect(0,0,1200,900);
 c.drawImage(source,0,210,720,510,0,0,1200,900);
 c.save();c.translate(675,590);c.rotate(-.16);c.imageSmoothingEnabled=false;c.drawImage(source,195,557,95,83,-240,-100,790,690);c.restore();
 c.save();c.translate(-80,460);c.rotate(-.14);c.drawImage(source,350,415,190,45,0,0,900,213);c.restore();

 word('MANY',45,224,790,200,'#ff3828',-.045);word('MARIO',44,446,1080,205,'#fff12b',-.055);
 c.globalCompositeOperation='multiply';c.globalAlpha=.26;c.drawImage(wall,0,0,1200,900);c.globalAlpha=1;c.globalCompositeOperation='source-over';
 document.body.dataset.ready='true';
})();
</script></html>
