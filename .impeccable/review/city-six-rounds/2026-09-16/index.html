<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>City of Signs — Six rounds</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#ececea;color:#111;font:15px/1.4 system-ui,sans-serif}h1{font-size:24px;margin:0 0 6px}header p{margin:0 0 22px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0}img{display:block;width:100%;height:auto;background:#fff}figcaption{padding:8px 0}h2{font-size:17px;margin:0 0 2px}p{margin:0}a{color:inherit}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><h1>City of Signs — Six rounds</h1><p>Six successive changes to the running block system. Each image uses seed 1907 at 1440 × 1060. Click to inspect the full-size render.</p></header><main><figure><a href="01-silhouettes.png"><img src="01-silhouettes.png" alt="Round 1: Tower silhouettes"></a><figcaption><h2>1. Tower silhouettes</h2><p>Stepped and curved edges, varied heights.</p></figcaption></figure><figure><a href="02-proportions.png"><img src="02-proportions.png" alt="Round 2: Motif proportions"></a><figcaption><h2>2. Motif proportions</h2><p>Compact fans, shaped walls, scaled roof pieces.</p></figcaption></figure><figure><a href="03-connections.png"><img src="03-connections.png" alt="Round 3: Connections"></a><figcaption><h2>3. Connections</h2><p>Arched bridges, hanging spans, crossing stairs.</p></figcaption></figure><figure><a href="04-vocabulary.png"><img src="04-vocabulary.png" alt="Round 4: Architectural vocabulary"></a><figcaption><h2>4. Architectural vocabulary</h2><p>Courtyards, offset arcades, fluted domes and sail pavilions.</p></figcaption></figure><figure><a href="05-hierarchy.png"><img src="05-hierarchy.png" alt="Round 5: Composition and detail"></a><figcaption><h2>5. Composition and detail</h2><p>Openings fitted inside profiles; wider shared spans.</p></figcaption></figure><figure><a href="06-final.png"><img src="06-final.png" alt="Round 6: Final integration"></a><figcaption><h2>6. Final integration</h2><p>Fan integrated with its tower; overhang and mobile checks.</p></figcaption></figure></main></html>
